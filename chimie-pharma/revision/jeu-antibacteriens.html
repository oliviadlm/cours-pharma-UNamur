 testostérone et cortisol."},{"id":"07-squalene-epoxydase","t":"Squalène époxydase (terbinafine)","e":"La terbinafine (allylamine) inhibe la biosynthèse de l'ergostérol à un stade différent des azolés : elle inhibe la squalène époxydase, pas la 14-déméthylase."},{"id":"07-paroi-chitine-glucane","t":"Paroi fongique (chitine et glucane)","e":"Chez Candida, Aspergillus, Cryptococcus, la membrane est recouverte d'une paroi externe de chitine (polymère de N-acétylglucosamine) et de glucane. Les inhibiteurs de leur synthèse sont antifongiques : la caspofungine inhibe la β-(1,3)-D-glucane synthase, comme les β-lactames visent la paroi bactérienne."},{"id":"07-nitroimidazoles-meca","t":"Mécanisme des nitroimidazolés","e":"Les bactéries anaérobies et parasites sensibles possèdent un équipement enzymatique qui transforme les nitroimidazoles en dérivés réduits toxiques altérant l'ADN (brins dissociés). Ils réduisent le NO2 bien plus vite que les cellules de l'hôte. Mode d'action identique aux nitrofurannes."},{"id":"07-rouge-iso-miconazole","t":"Cl en rouge : isoconazole vs miconazole","e":"Dans les structures p.132, les Cl du cycle benzylique sont en rouge : 2,6-dichloro pour l'isoconazole, 2,4-dichloro pour le miconazole. Le reste de la molécule est identique."},{"id":"07-rouge-triazole-n","t":"N en rouge dans les triazolés","e":"Dans l'itraconazole (p.134) et le fluconazole (p.135), un azote du cycle triazole est en rouge : c'est l'azote supplémentaire qui distingue un triazole (3 N) d'un imidazole (2 N)."},{"id":"07-rouge-ergosterol-cholesterol","t":"Ergostérol vs cholestérol (en rouge)","e":"Sur la structure de l'ergostérol (p.130), les éléments absents du cholestérol sont en rouge : double liaison supplémentaire dans le cycle B (en 7), double liaison dans la chaîne latérale et méthyle supplémentaire. Tableau p.131 : CYP51 fongique → ergostérol ; CYP51A1 humain → cholestérol (précurseur des hormones stéroïdes)."},{"id":"07-protozoaires","t":"Protozoaires, amibes, trichomonas","e":"Organismes unicellulaires eucaryotes (vrai noyau, contrairement aux bactéries procaryotes), avec organites complexes. Certains sont parasites : amibes (Entamoeba histolytica → dysenterie amibienne), trichomonas (Trichomonas vaginalis, flagellé : vaginites, urétrites, parfois cystites ; 20-25 % des femmes en période de fertilité) et plasmodium (malaria)."},{"id":"07-alcaloides","t":"Alcaloïdes","e":"Substances d'origine naturelle avec au moins une fonction aminée (secondaire ou tertiaire), le plus souvent hétérocyclique polycyclique. Bases : peu solubles dans l'eau, solubles dans l'alcool et le chloroforme. Sels (halogénhydrate, sulfate, phosphate…) : solubles dans l'eau, insolubles dans les solvants organiques. Ex. : émétine (ipéca)."},{"id":"07-amoebicides","t":"Amoebicides tissulaires, de contact et mixtes","e":"Tissulaires : suppriment le parasite dans les tissus (émétine, déhydroémétine, chloroquine). De contact : actifs dans l'intestin (oxyquinoléines halogénées). Mixtes : actifs par contact et de manière systémique (nitroimidazolés : métronidazole, nimorazole, ornidazole, tinidazole)."},{"id":"07-helicobacter-pylori","t":"Éradication d'Helicobacter pylori","e":"Traitement combiné de 10 jours (CBIP) : IPP (oméprazole 40 mg ×2/j) + amoxicilline (2 g/j en 2 prises) + clarithromycine (1 g/j en 2 prises) + métronidazole (1 g/j en 2 prises). Alternative : IPP + bismuth (1680 mg/j) + tétracycline (1500 mg/j) + métronidazole (1500 mg/j), en 4 prises."},{"id":"07-trypanosomiases","t":"Trypanosomiases africaine et américaine","e":"Africaine = maladie du sommeil, trypanosome transmis par la mouche tsé-tsé. Américaine = maladie de Chagas (Trypanosoma cruzi), transmise par des punaises hématophages en Amérique du Sud et centrale. En Belgique, la pentamidine (PENTACARINAT®, IM) est active contre le trypanosome."},{"id":"07-pentamidine-arn","t":"Pentamidine : inhibition de la synthèse de l'ARN et des protéines","e":"La pentamidine interfère avec la transformation de l'ADN et du folate et inhibe la synthèse de l'ARN et des protéines."},{"id":"08-paludisme","t":"Paludisme (malaria)","e":"Parasitose due à un protozoaire (Plasmodium, surtout P. falciparum et P. vivax, plus rarement P. ovale et P. malariae) transmis par la piqûre de la femelle de l'anophèle, provoquant des fièvres intermittentes. Maladie parasitaire la plus répandue, plus d'un million de morts par an (surtout en Afrique) ; première cause de mortalité des enfants de moins de 5 ans en Afrique."},{"id":"08-cycle-asexue","t":"Cycle asexué chez l'homme","e":"Le moustique injecte des sporozoïtes qui gagnent le foie en ~30 min et s'y multiplient 10 à 15 jours. Libérés sous forme de mérozoïtes, ils infectent les globules rouges, se nourrissent d'hémoglobine et les font éclater de façon brutale et synchrone : ce sont les accès de fièvre. 48 h pour P. vivax et P. falciparum (fièvre tierce), 72 h pour P. malariae (fièvre quarte)."},{"id":"08-paludisme-cerebral","t":"Anémie et paludisme cérébral","e":"La destruction des hématies provoque une anémie ; dans le paludisme cérébral, la mort survient par obstruction des vaisseaux sanguins du cerveau par les globules rouges infectés."},{"id":"08-cycle-sexue","t":"Cycle sexué chez l'anophèle","e":"Après quelques cycles asexués apparaissent des gamétocytes (mâles et femelles) dans le sang périphérique ; ils ne survivent qu'une vingtaine de jours chez l'homme. Ingérés par un anophèle sain, ils deviennent des gamètes ; la fécondation donne un zygote, puis un oocyste dans le tube digestif du moustique, qui produit des sporozoïtes migrant vers les glandes salivaires."},{"id":"08-formes-hepatiques","t":"Formes érythrocytaires vs exoérythrocytaires (hypnozoïtes)","e":"Les formes érythrocytaires sont responsables de l'accès fébrile et de l'anémie. Les formes exoérythrocytaires (hépatiques) sont responsables des rechutes à long terme quand les schizontes de P. ovale et P. vivax (hypnozoïtes) restent en latence dans les hépatocytes. La difficulté du traitement réside dans l'éradication de cette forme hépatique latente."},{"id":"08-heme-hemozoine","t":"Altération de la transformation de l'hème","e":"Dans la vacuole digestive du parasite, l'hème (produit de dégradation de l'hémoglobine, toxique pour le parasite) est transformé en hémozoïne non toxique (pigment du Plasmodium). La luméfantrine et l'artéméther semblent altérer cette transformation : la luméfantrine interfère avec la polymérisation, l'artéméther produit des métabolites réactifs par interaction de son pont peroxyde avec le fer de l'hème."},{"id":"08-prodrogue-proguanil","t":"Le proguanil est une prodrogue","e":"Le proguanil (biguanide) n'est pas actif tel quel : c'est sa forme triazinique, résultant d'une cyclisation par déshydrogénation, qui est active. La pyriméthamine est un analogue de cette forme active."},{"id":"08-dhfr-parasite","t":"Inhibiteurs de la dihydrofolate réductase (proguanil, pyriméthamine)","e":"Le proguanil et la pyriméthamine sont des inhibiteurs de la dihydrofolate réductase plus actifs chez le parasite que chez l'homme ; ils ont donc le même mode d'action que le triméthoprime et bloquent la synthèse des folates (acides nucléiques)."},{"id":"08-pont-peroxyde","t":"Pont peroxyde de l'artémisinine","e":"L'artémisinine et ses dérivés exercent leur effet grâce à leur pont peroxyde intramoléculaire qui, en présence de fer, donne des radicaux libres qui détruisent le parasite intraérythrocytaire. Les chélateurs du fer qui pénètrent dans les cellules inhibent cet effet."},{"id":"08-toxoplasmose","t":"Toxoplasmose","e":"La pyriméthamine n'a plus de place dans la malaria, mais associée à un sulfamidé elle est encore utilisée dans le traitement de la toxoplasmose symptomatique en dehors de la grossesse."},{"id":"08-prevention-anophele","t":"Prévention du contact avec les anophèles","e":"La prévention consiste d'abord à réduire ou supprimer le contact avec les anophèles (moustiquaire, répulsif). Les anophèles ne piquent qu'entre le coucher et le lever du soleil."},{"id":"08-chimioprophylaxie","t":"Chimioprophylaxie antipaludique","e":"On utilise la méfloquine, la doxycycline et l'association atovaquone + proguanil. La méfloquine est de moins en moins utilisée (effets indésirables potentiellement graves) et la (hydroxy)chloroquine n'a qu'une place très limitée (résistances). Durées CBIP : atovaquone/proguanil du jour précédant l'arrivée à 1 semaine après le retour ; doxycycline du jour précédant l'arrivée à 4 semaines après ; méfloquine de 2-4 semaines avant à 4 semaines après."},{"id":"08-traitement-malaria","t":"Traitement du paludisme","e":"Pour le traitement, on peut utiliser les associations artéméther + luméfantrine ou atovaquone + proguanil, ou la quinine (jamais en monothérapie). La méfloquine n'est utilisée qu'en l'absence d'autres options (effets indésirables fréquents et résistance croissante de P. falciparum). La combinaison de molécules (ACT : dérivé d'artémisinine + luméfantrine) limite les résistances."},{"id":"08-vaccin-mosquirix","t":"Vaccin Mosquirix® (RTS,S/AS01)","e":"Le vaccin cible le sporozoïte (antigène circumsporozoïte) et est indiqué pour prévenir le paludisme à P. falciparum chez l'enfant en zone endémique ; son efficacité est modeste, mais il réduit la morbidité."},{"id":"08-primaquine","t":"Primaquine et hypnozoïtes","e":"La primaquine (non reprise dans la liste du cours, citée dans la figure) est active sur les hypnozoïtes de P. vivax et P. ovale et évite les rechutes."},{"id":"08-amidines","t":"Hexamidine, propamidine, pentamidine","e":"Ces diamidines diffèrent par le nombre de groupements méthylènes entre les deux O : hexamidine 6, propamidine 3, pentamidine 5. L'hexamidine est présentée en iséthionate (acide β-hydroxyéthanesulfonique)."},{"id":"08-helminthes","t":"Nématodes, cestodes et ectoparasites","e":"Sous nos latitudes, les helminthes les plus répandus sont les nématodes (vers ronds : ascaris, oxyures, ankylostomes, nécators, trichocéphales) et les cestodes (vers plats segmentés : taenia). Ils infestent le plus souvent le tube digestif. Les ectoparasites (p. ex. Sarcoptes scabiei, gale) ne sont pas des vers mais sont sensibles à certains anthelminthiques."},{"id":"08-piperazine-difference","t":"Différence clé : sélectivité de la pipérazine","e":"La pipérazine agit comme agoniste GABA sur les neurones moteurs des vers. Chez l'homme, le GABA est principalement dans le SNC et la pipérazine traverse très peu la barrière hémato-encéphalique aux doses thérapeutiques : peu d'effets neurologiques, sauf surdosage ou insuffisance rénale."},{"id":"08-benzimidazoles-tubuline","t":"Benzimidazolés et tubuline","e":"Les anthelminthiques benzimidazolés inhibent chez certains parasites du tube digestif la polymérisation de la tubuline en microtubules : c'est le deuxième exemple, après la griséofulvine, de médicaments agissant sur le cytosquelette. Le parasite libère moins de médiateurs neuromusculaires et absorbe moins de glucose, il est immobilisé puis éliminé passivement dans les selles."},{"id":"08-oxyurose","t":"Oxyurose : re-traitement et entourage","e":"En cas d'oxyurose (Enterobius vermicularis), aucun médicament ne détruit les œufs, localisés hors du corps (p. ex. sous les ongles) : il faut redonner 100 mg de mébendazole après deux semaines et traiter l'entourage immédiat."},{"id":"08-gale","t":"Gale sarcoptique humaine","e":"Affection très contagieuse bénigne de la peau due à Sarcoptes scabiei hominis : la femelle creuse un tunnel dans la peau et y pond ses œufs, ce qui déclenche des démangeaisons intenses. L'ivermectine est utilisée lorsque le diagnostic est posé en clinique et/ou par examen parasitologique."},{"id":"08-ivermectine-gaba","t":"Ivermectine : entrée de chlorure sous l'effet du GABA","e":"L'ivermectine provoque une paralysie en hypertonie et la mort du parasite, par effet sur l'entrée d'ions chlorure sous l'effet du GABA libéré en excès par les terminaisons présynaptiques des parasites, ou par stimulation directe de leurs récepteurs de type GABA."},{"id":"08-onchocercose","t":"Onchocercose (cécité des rivières)","e":"Filariose cutanée due au nématode Onchocerca volvulus, transmise par une mouche près des rivières ; 37 millions de personnes, surtout en Afrique. L'atteinte oculaire fait sa gravité : première cause de cécité dans les zones infestées. Traitée par l'ivermectine."},{"id":"08-antiseptiques-intestinaux","t":"Antiseptiques intestinaux et probiotiques","e":"Selon le germe, on utilise certains sulfamidés (sulfasalazine), certains aminosides (néomycine, paromomycine), les amoebicides, les anthelminthiques, les halogéno-hydroxy-quinoléines et les nitrofurannes. Les probiotiques (micro-organismes vivants bénéfiques en quantité suffisante) restaurent la flore, notamment en prévention de la diarrhée due aux antibiotiques : ENTEROL® (Saccharomyces boulardii), LACTEOL® (Lactobacillus acidophilus)."},{"id":"08-desinfectant-antiseptique","t":"Désinfectant vs antiseptique de contact","e":"Un désinfectant tue ou inactive les micro-organismes sur des surfaces inertes (matériel médical, sols, murs, poignées…). Un antiseptique de contact s'utilise sur la peau ou les muqueuses et empêche la multiplication des germes pathogènes. « Anti-bactérien » ou « biocide » est un terme commercial qui ne suit pas forcément les spécifications médicales d'un désinfectant."},{"id":"08-spectre-antiseptiques","t":"Spectre des antiseptiques et usage prolongé","e":"Un antiseptique à spectre étroit agit sur peu de germes. Comme il peut déséquilibrer les flores cutanées, buccales et vaginales, on préfère un antiseptique à spectre large en usage prolongé (contrairement aux antibiotiques). Un spectre étroit (ex. hexamidine) risque de favoriser les germes non touchés, comme les champignons (mycose buccale). Une plaie souillée doit toujours être soigneusement lavée avant tout traitement."},{"id":"08-alcool-pharmacopee","t":"Alcool, éthanol et alcool dénaturé","e":"Dans la Pharmacopée européenne, l'éthanol à 94° est désigné « alcool » et l'éthanol absolu « éthanol ». L'alcool dénaturé est de l'éthanol additionné d'une autre substance (p. ex. diéthyléther) pour le rendre impropre à la consommation. La fermentation des hexoses s'arrête à 10° d'alcool ; on distille ensuite."},{"id":"08-acide-borique-paillettes","t":"Acide borique en paillettes et eau boriquée","e":"En paillettes dans les chaussettes, l'acide borique neutralise les bactéries responsables de la fermentation odorante de la transpiration (associé au talc mentholé qui diminue les frottements). L'eau boriquée (3,5 g/100 ml) sert à nettoyer les yeux."},{"id":"08-volumes-h2o2","t":"Eau oxygénée : % et volumes, perhydrol","e":"Une eau oxygénée à N volumes libère N litres d'O2 par litre décomposé par dismutation. Le perhydrol (30 %) est à 100 volumes. Antiseptique puissant à 3 % (10 volumes) ; 5-6 % (20 volumes) pour décolorer les cheveux. Toujours diluer le perhydrol avant de le vendre en vrac. Le nettoyage des plaies doit être prompt car elle endommage les nouvelles cellules ; réputée efficace contre le tétanos (bactérie anaérobie)."},{"id":"08-lentilles-catalase","t":"Désinfection des lentilles et catalase","e":"Les lentilles se nettoient chaque jour (dépôts de graisses et protéines, substrats pour micro-organismes) avec 1 à 5 % d'eau oxygénée stabilisée par 0,1 % d'EDTA. Dans OXYSEPT 1STEP®, un comprimé de catalase (enzyme de dismutation 2 H2O2 → O2 + 2 H2O) libère progressivement l'enzyme et détruit complètement le peroxyde après la désinfection."},{"id":"08-blanchiment-dentaire","t":"Peroxydes et blanchiment dentaire","e":"Le peroxyde d'hydrogène et le peroxyde de carbamide (urée) blanchissent les dents en réagissant avec les molécules responsables des taches. Vente libre seulement si ≤ 0,1 % de H2O2 ; de 0,1 à 6 % seulement avec approbation d'un dentiste."},{"id":"08-javel-dakin","t":"Eau de Javel et eau de Dakin","e":"L'eau de Javel est une solution d'hypochlorite potassique ou sodique (saturation à froid de KOH/NaOH par Cl2). L'eau de Dakin (DAKINCOOPER STABILISE®) est une solution d'hypochlorite sodique à 0,5 % (p/v)."},{"id":"08-spermicide","t":"Spermicides (benzalkonium, nonoxinol-9)","e":"Le chlorure de benzalkonium (surfactif cationique) inactive les spermatozoïdes ; le nonoxinol-9 est un spermicide surfactif non ionique. Ovules : 10 min avant le rapport, 4 h d'action ; crèmes : immédiates, 10 h ; tampons/éponges : immédiats, 24-36 h. Ils ne suppriment pas totalement le risque de grossesse : à réserver aux contre-indications des autres moyens ou à un usage épisodique."},{"id":"08-antiseptiques-usuels","t":"Les antiseptiques usuels (tableau récapitulatif)","e":"Alcools : dénaturation des protéines ; aldéhydes : alkylation ; composés borés : effet faible bactériostatique ; peroxydes : radicaux libres oxydants ; chlorés : chlore actif ; chlorhexidine/hexamidine/hexétidine : altération de la membrane ; halogénophénols et ammoniums quaternaires : membrane ; mercuriels : liaison aux groupes SH ; éosine : asséchant, précipite les protéines ; argent : ions Ag+. Les antiseptiques peuvent être irritants pour la peau et les muqueuses."},{"id":"09-virus-parasite-intracellulaire","t":"Virus = parasite intracellulaire obligatoire","e":"Contrairement aux bactéries, les virus ont nécessairement besoin d'une cellule hôte pour se multiplier : ce sont des parasites intracellulaires. Ils se multiplient par réplication de leur acide nucléique en utilisant la machinerie de la cellule hôte."},{"id":"09-acide-nucleique-viral","t":"L'acide nucléique viral (génome)","e":"Le génome viral est un filament d'ADN ou d'ARN, circulaire ou linéaire, bicaténaire (double brin) ou monocaténaire (simple brin). L'ADN viral est généralement bicaténaire ; l'ARN est généralement monocaténaire, à polarité positive (même sens qu'un ARNm) ou négative (complémentaire d'un ARNm). Le peloton central d'acide nucléique s'appelle le nucléoïde."},{"id":"09-capside","t":"La capside et la nucléocapside","e":"La capside est une coque protéique qui entoure et protège l'acide nucléique viral. Capside + nucléoïde = nucléocapside. La structure de la capside donne la forme du virus : symétrie cubique ou symétrie hélicoïdale."},{"id":"09-enveloppe-virion","t":"L'enveloppe : virus enveloppés vs virus nus ; le virion","e":"De nombreux virus sont entourés d'une enveloppe acquise lors de la traversée des membranes cellulaires, faite d'un mélange d'éléments cellulaires et viraux (protéines, glucides, lipides). Les virus avec enveloppe sont dits enveloppés, ceux sans enveloppe sont des virus nus. La forme libre du virus (particule virale) est le virion."},{"id":"09-cycle-attachement","t":"Cycle viral 1 : attachement (adsorption)","e":"Une protéine virale se lie à un récepteur de la surface cellulaire. Chez les eucaryotes, ces récepteurs sont des glycoprotéines ou des glycosphingolipides. Pour le VIH : gp120 virale + CD4 du lymphocyte T4 (+ un co-récepteur)."},{"id":"09-cycle-penetration","t":"Cycle viral 2 : pénétration","e":"Chez les bactériophages, seul le génome pénètre dans la bactérie. Chez les virus animaux : pinocytose (souvent les virus nus, la nucléocapside entre entourée de membrane plasmique), ou pour les virus enveloppés fusion (enveloppe virale + membrane plasmique) ou endocytose (accumulation dans des vésicules cytoplasmiques)."},{"id":"09-cycle-decapsidation","t":"Cycle viral 3 : décapsidation","e":"Après la pénétration (ou en même temps), l'acide nucléique est libéré de la capside. Selon les virus, la décapsidation a lieu dans le cytoplasme ou dans le noyau."},{"id":"09-cycle-replication","t":"Cycle viral 4 : réplication (multiplication virale)","e":"Réplication du génome, expression sous forme d'ARNm (transcription) et traduction des ARNm en protéines par la machinerie cellulaire. Le mécanisme diffère beaucoup selon le type de virus et la nature (ADN/ARN) de son génome."},{"id":"09-cycle-assemblage","t":"Cycle viral 5 : assemblage","e":"Assemblage et maturation des virus dans les cellules infectées, avec encapsidation du génome. Les virus enveloppés acquièrent leur enveloppe par bourgeonnement, aux dépens de la membrane plasmique ou nucléaire de la cellule hôte."},{"id":"09-cycle-liberation","t":"Cycle viral 6 : libération","e":"Le virus reconstitué est libéré à l'extérieur de la cellule sous forme de virion, et peut infecter de nouvelles cellules."},{"id":"09-sida-vih","t":"SIDA et VIH","e":"Le SIDA est un ensemble de symptômes consécutifs à la destruction des lymphocytes T CD4+. Les premiers cas datent de 1981 (infections opportunistes, sarcome de Kaposi). Le VIH est un lentivirus de la famille des rétrovirus (virus à ARN), agent étiologique du SIDA."},{"id":"09-cycle-vih","t":"Cycle du VIH en 8 étapes","e":"1) Attachement (gp120–CD4 + co-récepteur) ; 2) Pénétration par fusion des membranes ; 3) Décapsidation (libération de l'ARN) ; 4) Réverse transcription en ADN double brin puis intégration au génome par l'intégrase ; 5) Traduction des ARNm en trois précurseurs protéiques, découpés par la protéase ; 6) Assemblage ; 7) Bourgeonnement ; 8) Libération de nouveaux virus qui infectent d'autres T4."},{"id":"09-transcriptase-reverse","t":"Transcriptase réverse (inverse) virale","e":"Enzyme du VIH qui rétrotranscrit l'ARN viral en ADN double brin. C'est une cible majeure des anti-VIH ; le foscarnet l'inhibe aussi."},{"id":"09-integrase","t":"Intégrase virale","e":"Enzyme du VIH qui incorpore l'ADN viral (issu de la rétrotranscription) dans le génome de la cellule hôte, d'où il sera ensuite transcrit en ARN."},{"id":"09-protease-vih","t":"Protéases du VIH (protéase à acides aspartiques)","e":"Les ARNm viraux sont traduits en trois précurseurs polyprotéiques que la protéase du VIH (protéase à acides aspartiques) découpe en protéines de structure et enzymes virales (transcriptase inverse et intégrase)."},{"id":"09-cibles-anti-vih","t":"Cibles des médicaments anti-VIH","e":"La recherche anti-VIH vise les étapes du cycle et surtout les enzymes virales : la transcriptase inverse, l'intégrase, les protéases à acides aspartiques. Des inhibiteurs de fusion et d'entrée du virus (antagonistes de co-récepteurs) ont également été développés."},{"id":"09-principe-antimetabolites","t":"Principe des antimétabolites","e":"La plupart des antiviraux (et des anticancéreux) sont des antimétabolites : analogues structuraux des bases puriques et pyrimidiques et des nucléosides (modification sur la base ou sur le ribose). Assez proches des molécules biologiques pour entrer dans le métabolisme, assez différents pour le perturber : ADN/ARN non fonctionnels, inhibition de la DNA polymérase, inhibition de la transcription ou de la transcriptase inverse."},{"id":"09-activation-triphosphate","t":"Activation en triphosphate (et pourquoi on ne donne pas le triphosphate)","e":"Les antimétabolites sont administrés sous forme de base ou de ribonucléoside. Ils ne perturbent la synthèse d'ADN ou d'ARN qu'après transformation en dérivés triphosphates par les enzymes de la cellule hôte ou du virus. On n'administre pas directement les triphosphates car, très polaires, ils ne pénètrent que peu ou pas dans les cellules."},{"id":"09-nucleotide-composition","t":"Le nucléotide : 3 parties","e":"Les acides nucléiques sont des polymères de nucléotides reliés par des liens phosphodiester. Un nucléotide = un groupement phosphate + un sucre à 5 carbones (désoxyribose pour l'ADN, ribose pour l'ARN) + une base azotée (purine ou pyrimidine)."},{"id":"09-ribose-desoxyribose","t":"Ribose vs 2-désoxyribose","e":"Le ribose (ARN) porte des OH en 2 et en 3 ; le 2-désoxyribose (ADN) n'a pas d'OH en 2 (le cours met en rouge le 2-OH du ribose). Les carbones du sucre sont numérotés 1 à 5 ; dans un nucléoside ils deviennent 1' à 5'."},{"id":"09-purines-pyrimidines","t":"Bases azotées : purines et pyrimidines","e":"Purines (bicycle pyrimidine + imidazole, numérotées 1 à 9) : adénine (NH2 en 6) et guanine (C=O en 6, NH2 en 2). Pyrimidines (cycle à 6, N en 1 et 3) : thymine (C=O en 2 et 4, CH3 en 5), cytosine (NH2 en 4, C=O en 2) et uracile (C=O en 2 et 4, sans CH3)."},{"id":"09-nucleoside","t":"Nucléoside","e":"Lorsque la base azotée est liée au ribose, l'ensemble s'appelle un nucléoside : adénine → adénosine, guanine → guanosine, thymine → thymidine, cytosine → cytidine, uracile → uridine. La base est liée au C1' du sucre par N9 (purines) ou N1 (pyrimidines)."},{"id":"09-desoxynucleoside","t":"Désoxynucléoside","e":"Nucléoside dont le sucre est le 2-désoxyribose : désoxyadénosine (dA), désoxyguanosine (dG), désoxythymidine (dT), désoxycytidine (dC), désoxyuridine (dU). Dans le tableau du cours, la thymidine « ribo » est rare (ribothymidine)."},{"id":"09-nucleotides-nmp-ndp-ntp","t":"Nucléotides : NMP, NDP, NTP","e":"Un nucléoside lié à un phosphate (en 5') est un nucléotide ou NMP (nucléoside monophosphate, N = le nucléoside) : adénosine + 1 phosphate = AMP = A. Avec deux ou trois phosphates : NDP et NTP (ADP, ATP). Le cours liste aussi cAMP, cGMP et les désoxynucléotides (dAMP… dATP…)."},{"id":"09-adn-arn","t":"ADN et ARN","e":"On distingue deux types d'acides nucléiques : l'ADN (acide désoxyribonucléique, nucléotides à 2-désoxyribose) et l'ARN (acide ribonucléique, nucléotides à ribose)."},{"id":"09-grippe-influenza","t":"La grippe (Myxovirus influenzae A et B)","e":"La grippe commune est une maladie infectieuse virale contagieuse due à des Myxovirus influenzae, essentiellement de type A ou B, avec de nombreuses variantes antigéniques en perpétuelle évolution. Par le passé, on a utilisé des inhibiteurs de fusion (amantadine, rimantadine) et des inhibiteurs de neuraminidase."},{"id":"09-amantadine-m2","t":"Amantadine : inhibe la pénétration du génome viral (canal M2)","e":"L'amantadine, dérivé de l'adamantane, inhiberait la pénétration du génome viral dans la cellule hôte. Avec la rimantadine, elle se fixe à la protéine-canal ionique M2 de la nucléocapside du virus grippal, absente chez l'influenza B. M2 régule le pH du virus et la conformation de son hémagglutinine."},{"id":"09-amantadine-parkinson","t":"Influenza A et maladie de Parkinson : les deux indications de l'amantadine","e":"L'amantadine (chlorhydrate) est utilisée en prophylaxie et en traitement de l'Influenza A, mais aussi dans la maladie de Parkinson, où elle agit en augmentant la libération de dopamine. C'est un antiparkinsonien mineur, utilisé seul dans les formes débutantes ou associé à un autre antiparkinsonien."},{"id":"09-neuraminidase","t":"Inhibiteurs de la neuraminidase (« antigrippaux »)","e":"Zanamivir (inhalation) et oseltamivir (per os, TAMIFLU®) inhibent la neuraminidase (sialidase), glycohydrolase virale de surface qui scinde les liaisons des résidus d'acide sialique à la surface des cellules infectées et permet la libération et la prolifération des virus grippaux A et B. Donnés préventivement ou en tout début de grippe, ils en réduisent la gravité."},{"id":"09-oseltamivir-plus-indique","t":"L'oseltamivir n'est plus indiqué dans la grippe","e":"L'oseltamivir n'est plus indiqué pour le traitement ou la prophylaxie de la grippe étant donné le rapport coûts-bénéfices négatif."},{"id":"09-vaccination-influenza","t":"Les antiviraux ne remplacent en aucun cas la vaccination","e":"Les antigrippaux ne peuvent en aucun cas remplacer la vaccination annuelle contre l'influenza, dont l'effet sur la morbidité et la mortalité est démontré. La figure du cours le rappelle : la vaccination annuelle reste la stratégie la plus efficace pour prévenir la grippe."},{"id":"09-ribavirine-figure","t":"Ribavirine (figure du cycle de l'influenza)","e":"Dans la figure récapitulative du cours, la ribavirine cible la polymérase virale (PB1, PB2, PA) et inhibe la fonction polymérase et donc la réplication virale. Active in vitro sur l'influenza A et B, voie orale, IV ou inhalation, son utilisation est limitée dans la grippe (surtout situations particulières)."},{"id":"09-bronchiolite-vrs","t":"Bronchiolite à VRS : pas d'antibiotique","e":"La bronchiolite est généralement causée par le virus respiratoire syncytial (VRS). Elle touche surtout les jeunes enfants (<1 an) et les personnes âgées ; la guérison est généralement spontanée en 3 à 7 jours. La bronchiolite ne constitue pas une indication d'antibiothérapie."},{"id":"09-nirsevimab-schema","t":"Nirsévimab : schéma d'administration","e":"Le nirsévimab (BEYFORTUS®) prévient les infections respiratoires basses à VRS chez les nouveau-nés et nourrissons jusqu'à 1 an. Chez les enfants à haut risque, une administration est aussi recommandée au cours de la 2e année de vie. Une seule administration de nirsévimab est recommandée par saison (contre une dose par mois, max 5, pour le palivizumab)."},{"id":"09-nirsevimab-mecanisme","t":"Nirsévimab : cible la protéine F (F1/F2) du VRS","e":"Le nirsévimab est un anticorps monoclonal humain recombinant qui se lie aux sous-unités F1 et F2 de la protéine de fusion (F) du VRS et la bloque dans sa conformation de préfusion pour empêcher l'entrée du virus dans la cellule hôte."},{"id":"09-covid-repositionnes","t":"Produits repositionnés contre le COVID-19 : hydroxychloroquine, ivermectine","e":"Une série de produits « repositionnés » ont été testés dans le COVID-19, comme l'hydroxychloroquine et l'ivermectine. Ils ne sont pas recommandés à ce jour dans cette indication en raison de résultats contradictoires, tant en prévention qu'en traitement."},{"id":"09-sars-cov-2-proteases","t":"SARS-CoV-2 : polyprotéines, PLpro et Mpro (3CLpro, nsp5)","e":"Le génome du SARS-CoV-2 est un ARN simple brin positif (~30 kb), traduit directement par les ribosomes en deux polyprotéines pp1a et pp1ab contenant les protéines non structurales (nsp), inactives tant qu'elles ne sont pas clivées. Deux protéases virales les coupent : PLpro (quelques sites) et Mpro (= 3CLpro = nsp5). Mpro est indispensable pour libérer l'ARN polymérase virale (RdRp, nsp12) : sans Mpro, pas de réplication."},{"id":"09-ritonavir-booster","t":"Ritonavir à faible dose dans PAXLOVID®","e":"Le ritonavir est aussi un inhibiteur de protéase mais il n'est pas actif contre le SARS-CoV-2. Il est associé à faible dose au nirmatrelvir pour ralentir le métabolisme de celui-ci."},{"id":"09-remdesivir-prodrogue","t":"Remdésivir : prodrogue analogue nucléotidique de l'adénosine","e":"Le remdésivir (VEKLURY®) est une prodrogue analogue nucléotidique de l'adénosine, métabolisée dans les cellules hôtes en nucléoside triphosphate actif. Ce triphosphate agit comme un analogue de l'ATP et inhibe de façon compétitive l'ARN polymérase ARN-dépendante du SARS-CoV-2, avec une terminaison retardée de l'élongation de la chaîne d'ARN. Les balises belges lui accordent une place nulle (formes sévères) à très limitée (formes légères/modérées à risque)."},{"id":"09-foscarnet-adn-arn","t":"Foscarnet : phosphonoformate non nucléosidique actif sur virus à ADN et à ARN","e":"Le foscarnet trisodique (FOSCAVIR®) est un phosphonoformate non nucléosidique, le seul à agir sur les virus à DNA et à RNA : il inhibe l'ADN polymérase des virus du groupe herpès (HSV, VZV, EBV, CMV) et du VHB, et inhibe de plus la transcriptase inverse des rétrovirus comme le VIH."},{"id":"09-antimetabolites-guanosine","t":"Antimétabolites de la guanosine : activation par la thymidine kinase virale","e":"L'aciclovir, le ganciclovir et le penciclovir sont des antimétabolites de la guanosine. Ils sont phosphorylés en monophosphates par une enzyme d'origine virale, la thymidine kinase, puis en triphosphates par les kinases cellulaires ; c'est le triphosphate qui inhibe l'ADN polymérase virale. Indiqués dans l'herpès viral, local ou systémique."},{"id":"09-prodrogues-valine","t":"Prodrogues des antiherpétiques : biodisponibilité orale","e":"Famciclovir = prodrogue du penciclovir (plus de spécialité en Belgique) ; valaciclovir (ZELITREX®) = prodrogue de l'aciclovir, ester de valine ; valganciclovir (VALCYTE®) = ester de valine du ganciclovir. Elles ont un spectre comparable au produit actif mais une meilleure biodisponibilité orale. Le valganciclovir atteint ~60 % contre ~6 % pour le ganciclovir à jeun car l'ester de valine est substrat du transporteur peptidique PEPT1."},{"id":"09-cidofovir-cmv-resistant","t":"Cidofovir : CMV résistant au ganciclovir","e":"Le cidofovir (VISTIDE®) est un analogue de la cytidine, actif après phosphorylation contre les souches de cytomégalovirus humain résistantes au ganciclovir. Il est prescrit dans la rétinite à CMV chez les immunodéficients."},{"id":"09-ganciclovir-toxicite","t":"Ganciclovir/valganciclovir : réservés aux infections graves à CMV","e":"Le ganciclovir, analogue de synthèse de la 2'-désoxyguanosine, inhibe les virus du groupe herpès (CMV, HSV-1/2, HHV-6/7/8, EBV, VZV, VHB). Compte tenu de leur toxicité, ganciclovir et valganciclovir sont uniquement indiqués dans les infections graves à CMV (p.ex. atteinte d'organe) chez les immunodéprimés."},{"id":"09-maribavir-ul97","t":"Maribavir : inhibiteur de la kinase UL97","e":"Le maribavir (LIVTENCITY®) est un inhibiteur compétitif de la protéine kinase UL97 du CMV. L'inhibition se produit pendant la réplication de l'ADN viral et bloque la réplication et la maturation de l'ADN du CMV, son encapsidation et sa sortie nucléaire. Les anti-CMV du cours sont ganciclovir, valganciclovir, létermovir et maribavir."},{"id":"10-classes-antiretroviraux","t":"Classes d'antirétroviraux (VIH)","e":"Contre le VIH (rétrovirus à ARN) on dispose d'inhibiteurs de la transcriptase réverse (analogues nucléosidiques, non nucléosidiques ou nucléotidiques), d'inhibiteurs des protéases, d'inhibiteurs d'entrée (attachement, antagonistes CCR5, fusion) et d'inhibiteurs d'intégrase."},{"id":"10-tritherapie","t":"Plurithérapie / trithérapie","e":"Le VIH devient rapidement résistant : les antirétroviraux sont toujours associés. Selon le stade clinique, la charge virale et les CD4, on associe deux INTI à un inhibiteur de protéase, à un INNTI ou parfois à un troisième INTI ; un inhibiteur de fusion peut s'y ajouter. La trithérapie diminue morbidité, mortalité et hospitalisations."},{"id":"10-mecanisme-inti","t":"Mécanisme des INTI : triphosphorylation et terminaison de chaîne","e":"Les analogues de nucléosides sont transformés in situ en triphosphates qui bloquent le site de la transcriptase inverse. S'ils sont incorporés dans le brin d'ADN naissant, l'élongation s'arrête car ils n'ont pas de 3'-OH pour former le lien phosphate avec le nucléotide suivant."},{"id":"10-nucleosidique-vs-nucleotidique","t":"Inhibiteur nucléosidique vs nucléotidique de la transcriptase inverse","e":"Un inhibiteur nucléosidique (zidovudine, lamivudine…) doit être triphosphorylé dans la cellule. Un inhibiteur nucléotidique comme le ténofovir est un analogue nucléosidique monophosphate : il porte déjà le groupe phosphoré. Il est donné sous forme de prodrogue (ténofovir disoproxil ; l'adéfovir dipivoxil de même)."},{"id":"10-vhb-transcriptase-inverse","t":"VHB : ADN polymérase à activité transcriptase inverse","e":"Le virus de l'hépatite B est un virus à ADN (Hepadnaviridae) dont le nucléocapside contient l'ADN viral et une ADN polymérase ayant une activité de transcriptase inverse. C'est l'un des rares virus, en dehors des rétrovirus, qui utilise la transcription inverse dans sa réplication."},{"id":"10-hepatite-b-chronique-active","t":"Hépatite B chronique (active) vs aiguë","e":"Il n'existe pas de traitement spécifique de l'hépatite B aiguë (soins de confort, équilibre nutritionnel, réhydratation). L'hépatite B chronique (active) peut être traitée par des antiviraux oraux, qui ralentissent la cirrhose, réduisent les cancers du foie et améliorent la survie. Molécules : ténofovir, entécavir, lamivudine (ZEFFIX®), adéfovir dipivoxil, interférons α-2a/α-2b et peginterféron α-2a."},{"id":"10-vaccin-hepatite-b","t":"Prévention de l'hépatite B par la vaccination","e":"On peut prévenir l'hépatite B avec un vaccin sûr et efficace. L'hépatite B est un risque professionnel important pour le personnel de santé ; transmission sexuelle, par injection, transfusion à risque, de la mère à l'enfant et par contact étroit."},{"id":"10-inhibiteurs-protease-peptidomimetiques","t":"Inhibiteurs de protéase du VIH : peptidomimétiques","e":"En inhibant la protéase du VIH, ils empêchent la transformation des polypeptides précurseurs gag et gag/pol en protéines structurales et en enzymes lors de l'étape finale de maturation virale. La plupart sont des peptidomimétiques ; on les associe le plus souvent à deux INTI. Le lopinavir n'existe qu'avec le ritonavir (KALETRA®)."},{"id":"10-entree-vih-gp120-gp41","t":"Entrée du VIH : gp120, gp41, CD4, CCR5 et CXCR4","e":"L'entrée comporte une fixation puis une fusion des membranes. La gp120 virale intervient dans la fixation au récepteur CD4, la gp41 dans la fusion ; les co-récepteurs CCR5 et CXCR4 sont des récepteurs aux chémokines du lymphocyte T. Les inhibiteurs d'entrée se divisent en inhibiteurs de fixation (gp120 ou CD4, ex. temsavir lié à la sous-unité gp120), antagonistes des co-récepteurs (maraviroc) et inhibiteurs de fusion."},{"id":"10-tropisme-vih","t":"Tropisme du VIH (R5, X4, R5/X4) et prescription du maraviroc","e":"Le tropisme est défini par le co-récepteur utilisé : R5 (CCR5 exclusivement), X4 (CXCR4 exclusivement), R5/X4 (double tropisme). Le maraviroc bloque CCR5 et empêche l'interaction gp120–CCR5, donc l'entrée du VIH. Sa prescription nécessite la connaissance préalable du tropisme du virus."},{"id":"10-integrase","t":"Intégrase du VIH","e":"L'intégrase est l'enzyme virale qui intègre l'ADN viral (obtenu à partir de l'ARN viral par la transcriptase inverse) dans le génome de l'hôte, étape indispensable à la multiplication du virus. Inhibiteurs : bictégravir, cabotégravir (VOCABRIA®), dolutégravir (TIVICAY®), elvitégravir, raltégravir (ISENTRESS®) ; bictégravir et elvitégravir uniquement en associations fixes."},{"id":"10-prodrogues-antivirales","t":"Prodrogues dans ce chapitre","e":"Plusieurs antiviraux sont des prodrogues : ténofovir disoproxil (libère le ténofovir), adéfovir dipivoxil (adéfovir), fosamprénavir (amprénavir), fostemsavir (temsavir, par clivage du groupe phosphonooxyméthyle) et sofosbuvir."},{"id":"10-vhc-petit-virus-arn","t":"VHC : un petit virus à ARN","e":"Le virus de l'hépatite C est un petit virus à ARN (environ 60 nm), enveloppé, à capside icosaédrique, dont le génome est un ARN monocaténaire linéaire de polarité positive. Il est transmis par le sang (injections à risque, matériel mal stérilisé, transfusions non dépistées)."},{"id":"10-hepatite-c-aigue-chronique","t":"Hépatite C : infection aiguë et chronique","e":"Le VHC peut entraîner une infection hépatique aiguë et une infection chronique de gravité variable, d'une forme bénigne de quelques semaines à une maladie grave à vie. Chez beaucoup de porteurs chroniques, l'infection évolue vers la cirrhose ou le cancer du foie."},{"id":"10-pas-vaccin-hepatite-c","t":"Pas de vaccin contre l'hépatite C","e":"Actuellement, il n'existe pas de vaccin contre l'hépatite C, mais la recherche dans ce domaine se poursuit. À l'inverse, il existe un vaccin sûr et efficace contre l'hépatite B."},{"id":"10-aad-hepatite-c","t":"Antiviraux à action directe (AAD) dans l'hépatite C","e":"Les médicaments antiviraux guérissent environ 90 % des sujets infectés par le VHC. L'OMS recommande de traiter tous les patients avec des schémas comprenant des AAD (elbasvir, glécaprévir, grazoprévir, lédipasvir, pibrentasvir, sofosbuvir, télaprévir, velpatasvir, voxilaprévir), inhibiteurs de protéines spécifiques du VHC, utilisés en association entre eux ou, en cas d'échec, avec le peginterféron et la ribavirine."},{"id":"10-ribavirine-large-spectre","t":"Ribavirine : antiviral à large spectre","e":"La ribavirine est un analogue nucléosidique de la guanosine à large spectre : elle est active in vitro contre de nombreux virus à ADN ou à ARN (herpès, grippe, VIH…). Dans l'hépatite C, on l'associe en cas d'échec thérapeutique."},{"id":"10-fludarabine-anticancereux","t":"Vidarabine et fludarabine : antimétabolites de l'adénosine","e":"Après triple phosphorylation, la vidarabine (non commercialisée en Belgique) inhibe l'ADN polymérase comme antimétabolite de l'adénosine ; la fludarabine aussi. Ce sont des analogues de base purique où le ribose est remplacé par un arabinose. La fludarabine est principalement utilisée comme anticancéreux (LLC à cellules B)."},{"id":"10-interferons-cytokines","t":"Interférons et pégylation","e":"Les interférons sont des protéines du groupe des cytokines, sécrétées par les cellules infectées par des virus, qui s'opposent à leur prolifération ; ils sont produits par génie génétique et ont des propriétés antivirales, antiprolifératives et immunomodulatrices. Le PEG conjugué à l'interféron alfa-2a donne le peginterféron alfa-2a (PEGASYS®), indiqué dans l'hépatite B et en association dans l'hépatite C."},{"id":"11-cancer-definition","t":"Cancer, tumeur, métastases","e":"Le cancer est une prolifération anarchique de certaines cellules, circulantes ou faisant partie d'un tissu (on parle alors de tumeur). Les cellules peuvent former une tumeur maligne (néoplasme) ou être disséminées par le sang et la lymphe vers d'autres organes : ce sont les métastases."},{"id":"11-epidemiologie-cancer-2022","t":"Chiffres OMS 2022","e":"En 2022 : 20 millions de nouveaux cas et 9,7 millions de décès ; environ une personne sur cinq développe un cancer. Le cancer du poumon est le plus fréquent (12,4 %) et la première cause de décès par cancer (18,7 %), devant le sein (2e en fréquence) et le côlon-rectum. Chez la femme, le sein est le plus fréquent et la première cause de décès."},{"id":"11-strategies-traitement-cancer","t":"Stratégies de traitement du cancer","e":"Le traitement se fait uniquement en milieu spécialisé, par une équipe pluridisciplinaire, après diagnostic de certitude, bilan d'extension et évaluation de l'état général. Les stratégies sont la chirurgie (exérèse large passant par des tissus sains), la radiothérapie, la chimiothérapie (cytotoxiques), les thérapies ciblées, l'hormonothérapie et l'immunothérapie ; parfois une greffe de moelle pour certains cancers du sang."},{"id":"11-chimiotherapie-definition","t":"Chimiothérapie","e":"Usage de substances chimiques pour traiter une maladie, technique à part entière comme la chirurgie. Paul Ehrlich en est le père moderne (arsphénamine contre la syphilis, 1909). Aujourd'hui le terme désigne surtout les traitements anticancéreux par médicaments cytotoxiques qui détruisent les cellules tumorales."},{"id":"11-therapies-ciblees-hormono-immuno","t":"Thérapies ciblées, hormonothérapie, immunothérapie","e":"Les thérapies ciblées bloquent des mécanismes indispensables à la prolifération tumorale (sur la cellule cancéreuse ou son microenvironnement, ex. anti-angiogéniques). L'hormonothérapie bloque la synthèse ou la fixation des hormones sexuelles qui stimulent certains cancers (sein, utérus, prostate). L'immunothérapie mobilise les défenses : spécifique (anticorps monoclonaux anti-PD1/PD-L1, souvent IV) ou active (cellules CAR-T, vaccins thérapeutiques)."},{"id":"11-cellules-car-t","t":"Cellules CAR-T","e":"Stratégie d'immunothérapie active : on modifie génétiquement des cellules immunitaires du malade pour les armer contre la tumeur. Utilisée dans des formes de leucémies ou de lymphomes."},{"id":"11-manque-selectivite-antitumoraux","t":"Manque de sélectivité des antitumoraux","e":"Les antitumoraux devraient détruire sélectivement les cellules cancéreuses mais touchent aussi les cellules saines à division rapide : cheveux, épithélium intestinal, cellules sanguines. D'où alopécie, infections (globules blancs), anémie, hémorragies (plaquettes) et le recours à la chambre stérile, aux transfusions, à l'EPO ou aux antinauséeux puissants."},{"id":"11-ei-communs-antitumoraux","t":"Effets indésirables communs aux antitumoraux","e":"Asthénie ; dépression médullaire (leucopénie avec risque d'infections graves, anémie, thrombopénie) ; hyperuricémie due à la destruction des cellules néoplasiques ; troubles gastro-intestinaux ; alopécie ; neurotoxicité ; inhibition parfois irréversible de la fonction ovarienne ou de la spermatogenèse (surtout alkylants) ; effet irritant et risque de nécrose en cas d'injection paraveineuse."},{"id":"11-hyperuricemie-chimiotherapie","t":"Hyperuricémie à l'instauration de la chimiothérapie","e":"La destruction des cellules néoplasiques provoque une hyperuricémie, éventuellement corrigée par l'allopurinol ou la rasburicase. Les inhibiteurs de la xanthine-oxydase et la rasburicase sont utilisés dans l'hyperuricémie aiguë lors de l'instauration de certaines chimiothérapies (vus avec la goutte)."},{"id":"11-moutardes-origine","t":"De l'ypérite aux moutardes à l'azote","e":"L'ypérite (bis(2-chloroéthyl)sulfure, gaz moutarde de 1914-1918, utilisé à Ypres en 1917) empêchait la cancérisation de la peau de l'animal : premier agent alkylant. Pour réduire sa toxicité, on a remplacé le soufre par un azote : les « moutardes à l'azote »."},{"id":"11-alkylants-mecanisme","t":"Mécanisme des agents alkylants","e":"Les alkylants ajoutent un groupe alkyle à des groupes électronégatifs. Ils lient entre elles des guanines (–N= , N7) de la double hélice : pontage bicaténaire par liaison covalente stable. Les brins ne peuvent plus se dérouler ni se séparer, la cellule ne peut plus répliquer son ADN ni se diviser. Pour les moutardes, l'azote forme d'abord un ion aziridinium (SN1) attaqué par la guanine (SN2), puis le second bras recommence. Alkylsulfonates, éthylène-imines et époxydes agissent de façon similaire."},{"id":"11-phosphoramides-phosphoramidase","t":"Phosphoramides et phosphoramidase","e":"Cyclophosphamide, ifosfamide et thiotepa sont des phosphoramides. Ils se fixent en principe à la phosphoramidase, enzyme en proportion anormalement élevée dans certains types de cellules cancéreuses, puis alkylent sélectivement les cellules cibles. Tous trois sont solubles dans l'eau ; seul le thiotepa est soluble dans l'éthanol et les solvants organiques."},{"id":"11-estradiol-vecteur","t":"L'estradiol comme vecteur (estramustine)","e":"L'estramustine est un phosphate d'estradiol substitué par un groupe bis-chloréthylamine. Elle exerce un effet alkylant de type moutarde et, après hydrolyse, un effet œstrogène par libération d'estradiol. L'œstradiol conduit l'agent alkylant vers les tissus hormono-dépendants (cancer de la prostate)."},{"id":"11-nitrosourees-bhe","t":"Nitrosourées lipophiles et barrière hémato-méningée","e":"La fotémustine et la carmustine sont des nitrosourées lipophiles qui traversent la barrière hémato-méningée ; la carmustine est un antimitotique de choix des tumeurs du système nerveux central."},{"id":"11-serendipite-cisplatine","t":"Sérendipité : découverte du cisplatine","e":"En 1965, Rosenberg étudiait l'effet de courants électriques sur des bactéries : la croissance d'E. coli était inhibée dans un milieu contenant du chlorure d'ammonium et soumis à un courant entre deux électrodes de platine. L'effet venait non du courant mais du complexe formé entre le platine libéré et l'ammoniac/le chlorure (dichlorodiamine-platine, connu depuis 1845)."},{"id":"11-complexes-platine-structure","t":"Structure et activation des complexes de platine","e":"Les platines actifs ont une structure commune : Pt(II) lié de façon covalente à quatre substituants, deux azotés peu labiles et deux labiles (chlorure ou oxygène), en carré plan. En milieu aqueux, les Cl sont remplacés par H2O/OH (équilibre réversible avec le chlorure). Le platine se lie alors aux azotes de l'ADN (N7 et N1 de l'adénine, N3 de la cytidine, N7 de la guanine) : monoadduits, ponts intra- et inter-brins, ponts ADN-protéine."},{"id":"11-detoxifiants","t":"Détoxifiants associés aux antitumoraux","e":"Produits utilisés pour réduire la toxicité spécifique d'un cytostatique ou d'un groupe de cytostatiques : mesna (vessie/acroléine), dexrazoxane (cœur/anthracyclines), et inhibiteurs de la xanthine-oxydase ou rasburicase (hyperuricémie)."},{"id":"11-acroleine-mesna","t":"Acroléine et protection vésicale par le mesna","e":"À doses élevées, cisplatine, cyclophosphamide et ifosfamide donnent de l'acroléine, éliminée à concentration élevée dans l'urine et très toxique pour la muqueuse vésicale. Le mesna (HS-CH2CH2SO3Na) réagit par son SH avec l'acroléine pour donner un produit non toxique ; il est donné par voie IV (UROMITEXAN®)."},{"id":"11-chelation-du-fer","t":"Chélation du fer (dexrazoxane)","e":"Premier mécanisme du dexrazoxane : son métabolite à cycle ouvert chélate le fer, ce qui réduit le stress oxydatif dépendant du fer responsable de la cardiotoxicité des anthracyclines. Second mécanisme : inhibition de la topo-isomérase II."},{"id":"11-antimetabolites-definition","t":"Antimétabolites","e":"Par analogie structurale avec des métabolites essentiels (souvent des nucléotides), ils perturbent certaines étapes enzymatiques de la synthèse des acides nucléiques. Résultat : blocage de la synthèse ou de la transcription de l'ADN et/ou incorporation de nucléotides falsifiés. Classes : antifoliques, analogues de la purine, analogues de la pyrimidine, autres (hydroxyurée)."},{"id":"11-methotrexate-faibles-doses","t":"Méthotrexate à faibles doses : psoriasis et arthrite rhumatoïde","e":"Outre son usage antitumoral, le méthotrexate est utilisé à faibles doses dans les cas graves de psoriasis ou d'arthrite rhumatoïde. Dans ce cas, l'acide folique est proposé à la place de l'acide folinique, vu son rapport coût-bénéfice plus favorable."},{"id":"11-acide-folinique-methotrexate","t":"Acide folinique / lévofolinique après méthotrexate à doses élevées","e":"Pour contrecarrer la toxicité hématologique du méthotrexate à doses élevées, on donne de l'acide folinique ou son isomère actif, l'acide lévofolinique. Ils ne sont administrés que quelques heures après le méthotrexate, afin de ne pas annihiler ses effets antitumoraux."},{"id":"11-isosterie-raltitrexed","t":"Isostérie benzène-thiophène et ptéridine-quinazoline","e":"Le raltitrexed s'apparente chimiquement à l'acide folique : le benzène est remplacé par un thiophène et la ptéridine par une quinazoline (isostérie). Il inhibe la thymidylate synthase (dUMP → dTMP)."},{"id":"11-medicament-orphelin","t":"Médicament orphelin","e":"Statut accordé par l'EMEA aux produits développés pour le diagnostic, la prévention ou le traitement de maladies graves qui affectent moins de 5 personnes sur 10 000 dans l'Union européenne. Exemple : la clofarabine (EVOLTRA®) dans la LAL réfractaire de l'enfant."},{"id":"11-arabinose-vs-ribose","t":"Nucléosides à arabinose ou à sucre modifié","e":"Plusieurs antimétabolites sont des nucléosides dont le sucre est modifié : la cytarabine (Ara-C) et la fludarabine portent un arabinose au lieu du ribose (OH en 2' inversé) ; la cladribine a un 2'-désoxyribose ; la clofarabine un 2'-fluoro-arabinose ; la gemcitabine deux F en 2'. Ils sont phosphorylés en triphosphates qui perturbent la synthèse de l'ADN."},{"id":"11-prodrogue-capecitabine","t":"Prodrogue orale du 5-FU","e":"Le 5-fluorouracile est inactif en tant que tel (métabolisé en 5-FdUMP/5-FdUTP) et doit être injecté. La capécitabine est une prodrogue administrée par voie buccale, transformée par une enzyme tumorale en 5-fluorouracile."},{"id":"11-maladie-de-bowen","t":"Maladie de Bowen","e":"Carcinome épidermoïde intra-épidermique favorisé par le soleil et l'arsenic, touchant la peau ou les muqueuses : lésion brun rougeâtre arrondie, bien limitée, un peu surélevée et squameuse. Indication de la crème au 5-FU (EFUDIX®), avec les kératoses solaires et les condylomes acuminés."},{"id":"11-drepanocytose","t":"Drépanocytose et hydroxyurée","e":"Maladie héréditaire de l'hémoglobine (HbS), particulièrement fréquente dans les populations d'Afrique subsaharienne, avec crises vaso-occlusives, anémie hémolytique et infections. L'hydroxyurée (SIKLOS®) réduit de 66 à 80 % les épisodes vaso-occlusifs et les hospitalisations. Mécanismes : hausse de l'HbF (qui empêche la polymérisation de l'HbS et la falciformation), baisse des neutrophiles (facteur le mieux corrélé à la réduction des crises), hématies plus hydratées et déformables, moindre adhésion à l'endothélium."},{"id":"12-intercalant","t":"Agent intercalant","e":"Un médicament à structure moléculaire plane peut s'intercaler entre deux brins de DNA. L'intercalation seule ne suffit généralement pas : le médicament doit aussi altérer chimiquement le DNA, le plus souvent par formation de radicaux libres, et inhiber sa réplication ou sa transcription. La proflavine (antibactérienne) en est un exemple."},{"id":"12-antibiotiques-antitumoraux","t":"Antibiotiques antitumoraux","e":"Parmi les agents intercalants figurent les antibiotiques antitumoraux : les anthracyclines (d'origine fongique, Streptomyces) et la bléomycine (Streptomyces verticillus, pseudo-intercalant)."},{"id":"12-anthracyclines","t":"Anthracyclines","e":"Dérivés d'origine fongique (Streptomyces peucetius et coeruloribidus) : daunorubicine, doxorubicine, épirubicine, idarubicine. Elles s'intercalent entre les brins de DNA, l'hydrolysent à la manière des nucléases et peuvent entraîner des altérations membranaires. Ce sont aussi des inhibiteurs de topo-isomérase II à effet intercalant. Effets indésirables : myélosuppression et surtout cardiomyopathies, même après l'arrêt."},{"id":"12-idarubicine-lipophilie","t":"Idarubicine : pas de 4-méthoxy","e":"L'idarubicine ne possède pas de groupement méthoxy en position 4 (R = H) : elle est donc plus lipophile et mieux résorbée que la daunorubicine."},{"id":"12-intercalants-synthetiques","t":"Intercalants synthétiques","e":"À côté des anthracyclines naturelles, la mitoxantrone (dérivé de l'anthracycline) et l'amsacrine (dérivé de l'acridine) sont des agents intercalants de synthèse. L'amsacrine est en plus inhibiteur de la topo-isomérase II."},{"id":"12-pseudo-intercalant","t":"Bléomycine, pseudo-intercalant","e":"La bléomycine, élaborée par Streptomyces verticillus, est constituée de plusieurs fractions polypeptidiques (A2 majoritaire). C'est un pseudo-intercalant capable de provoquer une cassure au niveau de l'ADN."},{"id":"12-photosensibilisants","t":"Produits photosensibilisants","e":"Les psoralènes sont photosensibilisants : sous l'influence de la lumière naturelle ou artificielle, ils sont transformés en molécules très réactives, pouvant causer des effets indésirables mais aussi avoir, dans des conditions particulières, un intérêt thérapeutique."},{"id":"12-puva","t":"Photochimiothérapie (PUVA)","e":"Traitement combinant un psoralène et une exposition à la lumière UVA (320-380 nm ; les UVB sont entre 290 et 320 nm). Sous lumière, les psoralènes intercalés forment des adduits covalents intra- ou interbrins avec les bases, même sans oxygène ; avec oxygène, des radicaux superoxydes altèrent en plus le DNA. La concentration épidermique est maximale 2 à 4 h après la prise orale et persiste environ 8 h."},{"id":"12-psoriasis","t":"Psoriasis","e":"Maladie de peau d'origine mal connue, en partie génétique, touchant 2 % de la population. L'épiderme se renouvelle en 4 à 6 jours au lieu de 3 semaines, ce qui génère des inflammations localisées ; les cellules s'accumulent en squames blanches, inoffensives mais inesthétiques. Avec le PUVA, l'altération du DNA réduit la production de cellules épidermiques à l'origine des squames."},{"id":"12-vitiligo","t":"Vitiligo","e":"Maladie de l'épiderme caractérisée par des taches blanches qui apparaissent et s'étendent sur le corps. Avec le PUVA, on recherche la stimulation des mélanocytes ; mais en absence de mélanocytes, on n'obtient pas un brunissement mais des brûlures."},{"id":"12-topoisomerases","t":"Topo-isomérases I et II","e":"Les ADN topo-isomérases contrôlent la structure topologique de l'ADN en générant des coupures transitoires et en faisant passer des segments d'ADN à travers ces coupures avant de les refermer (réplication, transcription, séparation des chromosomes). La topo-isomérase I coupe et ressoude un seul brin ; la topo-isomérase II coupe les deux brins et les ressoude dans une conformation différente après modification de la torsion."},{"id":"12-inhibiteurs-topo1","t":"Inhibiteurs de topo-isomérase I : camptothécines","e":"La camptothécine (Camptotheca acuminata) et ses analogues ont des effets antinéoplasiques certains mais des effets indésirables importants ; on a développé des dérivés mieux tolérés : irinotécan (hémisynthétique, cancers colorectaux métastasés) et topotécan (carcinome ovarien récidivant après échec du platine)."},{"id":"12-inhibiteurs-topo2","t":"Inhibiteurs de topo-isomérase II : avec ou sans intercalation","e":"Les inhibiteurs de topo-isomérase II antinéoplasiques se divisent en deux groupes : ceux qui ont en outre un effet intercalant (amsacrine, anthracyclines) et ceux qui n'en ont pas (étoposide, téniposide, dérivés hémi-synthétiques de la podophyllotoxine)."},{"id":"12-inhibiteurs-microtubules","t":"Inhibiteurs des microtubules : deux sens opposés","e":"Selon leur pharmacocinétique et leur affinité tissulaire, les médicaments agissant sur la tubuline servent d'antinéoplasiques, d'antihelminthiques (mébendazole) ou d'antigoutteux (colchicine). En oncologie : les alcaloïdes de la pervenche (vinblastine…) inhibent la polymérisation de la tubuline en microtubules ; les taxoïdes empêchent la dépolymérisation des microtubules."},{"id":"12-aromatase","t":"Aromatase","e":"Enzyme du groupe des cytochromes P450 qui convertit les androgènes surrénaliens comme la testostérone en œstrogènes. L'inhiber, enzyme spécifique de la synthèse des estrogènes, est une excellente solution pour réduire les taux d'œstrogènes dans certains cancers hormonodépendants."},{"id":"12-ia-steroidien-non-steroidien","t":"Inhibiteurs de l'aromatase stéroïdiens vs non stéroïdiens","e":"L'exémestane (AROMASIN®) est un inhibiteur stéroïdien de l'aromatase ; le létrozole (FEMARA®) et l'anastrozole (ARIMIDEX®) sont non stéroïdiens (triazolés), utilisés per os en cas de récidive après antioestrogènes. L'aminoglutéthimide, ancien et non spécifique, diminue aussi la synthèse des corticoïdes."},{"id":"12-serm","t":"SERM (modulateur sélectif des récepteurs aux estrogènes)","e":"Le tamoxifène est un SERM : agoniste sur les récepteurs aux estrogènes du squelette et du foie, antagoniste sur ceux du tissu mammaire et agoniste partiel au niveau de l'endomètre. Il est utilisé chez la femme en pré- ou postménopause dans le cancer du sein à récepteurs hormonaux positifs. Bazédoxifène, raloxifène (ostéoporose) et clomifène (PMA) sont vus au tome 3."},{"id":"13-immunotherapie","t":"Immunothérapie","e":"Traitement qui consiste à administrer des substances stimulant les défenses immunitaires pour lutter contre certaines maladies, notamment certains cancers hématologiques. Par extension, toute thérapie utilisant des protéines du système immunitaire (surtout les immunoglobulines), même sans but de stimulation de l'immunité. On utilise surtout des immunoglobulines monoclonales, des interférons et des interleukines (note 36, p.252). En oncologie : l'immunothérapie stimule le système immunitaire à réagir contre le cancer (p.269)."},{"id":"13-nomenclature-mab","t":"Nomenclature des anticorps monoclonaux : suffixe -mab","e":"Tous les anticorps monoclonaux du chapitre ont une DCI en -mab (rituximab, bévacizumab, trastuzumab, cetuximab, ipilimumab, pembrolizumab) : -mab = « monoclonal antibody » (p.252-253, 269). Complément hors cours (convention DCI de l'OMS, aide à la lecture) : la syllabe juste avant -mab indiquait l'origine de l'anticorps : -ximab = chimérique (rituximab, cetuximab), -zumab = humanisé (trastuzumab et pembrolizumab, que le cours qualifie justement d'« humanisés » p.259 et 269 ; bévacizumab), -umab = entièrement humain (ipilimumab). Les nouveaux anticorps ne suivent plus forcément cette règle, l'OMS l'ayant révisée récemment. À opposer aux petites molécules en -tinib (voie orale) : un -mab est une grosse protéine, sans structure à dessiner."},{"id":"13-anticorps-anti-lymphocytes","t":"Anticorps anti-lymphocytes (anti-CD20)","e":"Le rituximab (MABTHERA®) reconnaît l'antigène CD20 à la surface des lymphocytes B ; il est utilisé dans certaines leucémies lymphoïdes chroniques et certains lymphomes folliculaires, en cas d'échec de la chimiothérapie (p.252)."},{"id":"13-anticorps-anti-vegf","t":"Anticorps anti-VEGF","e":"Le bévacizumab (AVASTIN®) se lie au VEGF (facteur de croissance de l'endothélium vasculaire) et le neutralise ; il est utilisé dans le cancer colorectal métastasé en association à une chimiothérapie (p.252)."},{"id":"13-her2","t":"Oncogène HER2 et anticorps anti-HER2","e":"L'oncogène HER2 code la protéine HER2, exprimée en excès à la membrane des cellules tumorales de certains cancers du sein, où elle joue le rôle de récepteur à activité tyrosine kinase. HER2 = Human Epidermal growth factor Receptor 2. Le trastuzumab (HERCEPTIN®) la neutralise ; l'élévation du récepteur HER2 dans le plasma est une indication du trastuzumab (p.252, 258-259)."},{"id":"13-egfr","t":"EGF et anticorps anti-EGFR","e":"L'EGF (Epidermal Growth Factor) est un polypeptide de 53 acides aminés qui agit sur le récepteur EGFR, récepteur tyrosine kinase, avec des effets nucléaires. Le cetuximab (ERBITUX®) est un anticorps dirigé contre l'EGFR, utilisé dans le cancer colorectal métastatique exprimant ce récepteur (p.253, 258-259)."},{"id":"13-tyrosine-kinases","t":"Tyrosine kinases","e":"Famille d'enzymes qui phosphorylent un résidu tyrosine (sur l'OH phénolique) en transférant un phosphate de l'ATP ; c'est un mode d'activation ou d'inactivation de voies enzymatiques. Deux groupes : intracytoplasmiques (> 32 chez l'humain) et membranaires = récepteurs (> 58). Elles jouent un rôle essentiel dans la transduction des signaux menant à la multiplication et à la différenciation cellulaires ; leurs différences structurales permettent de les inhiber spécifiquement (p.253-254)."},{"id":"13-suffixe-tinib","t":"Suffixe -tinib","e":"Les inhibiteurs des tyrosine kinases ont, pour la plupart, une DCI se terminant par -tinib ; vu leur nombre croissant, seuls quelques représentants sont décrits. Ils sont classés selon leur cible : ALK, BCR-ABL, BRAF, BTK, CDK4/6, EGFR, FLT3, MEK, mTOR, PI3K et « divers » (p.254). Complément hors cours (radicaux DCI, utiles pour classer) : -rafénib = inhibiteur de RAF (encorafénib, dabrafénib, sorafénib), -ciclib = CDK (palbociclib), -lisib = PI3K (idelalisib), -parib = PARP (olaparib), -zomib = protéasome (bortézomib, ixazomib, carfilzomib), -limus = mTOR (temsirolimus). Piège : le trametinib finit en -tinib mais cible MEK."},{"id":"13-voie-orale-ipk","t":"Voie orale des inhibiteurs de protéines kinases","e":"Les inhibiteurs de protéines kinases sont administrés par voie orale, à l'exception du temsirolimus (p.255)."},{"id":"13-bcr-abl-philadelphie","t":"BCR-ABL et chromosome Philadelphie","e":"La leucémie myéloïde chronique est liée à une translocation entre les chromosomes 9 et 22 : anomalie morphologique (raccourcissement du chromosome 22 = chromosome Philadelphie) et anomalie fonctionnelle (gène BCR-ABL sur le chromosome 22, codant une protéine à activité tyrosine kinase non liée à un récepteur, excessive et non régulée, à effet mitogène). L'imatinib, premier inhibiteur de la transduction du signal (STI), bloque cette kinase en se fixant sur son site ATP (p.255-256)."},{"id":"13-resistance-imatinib","t":"Résistance à l'imatinib et générations BCR-ABL","e":"Dasatinib et nilotinib ont un mécanisme proche de l'imatinib mais agissent sur des formes d'enzymes résistantes à l'imatinib ; ils sont réservés à la LMC Ph+ chez les patients intolérants ou ne répondant pas à d'autres traitements. Le ponatinib inhibe aussi des mutations résistantes (ex. T315I) et s'utilise aussi dans la LAL Ph+. Imatinib, dasatinib et nilotinib sont des médicaments orphelins (p.257-258)."},{"id":"13-erbb","t":"Récepteurs ErbB (famille HER)","e":"La famille HER code quatre récepteurs transmembranaires : HER1 (= EGFR, ErbB1), HER2 (ErbB2), HER3 et HER4, réunis dans la sous-famille des récepteurs de facteurs de croissance épidermiques (ErbB), impliqués dans la signalisation contrôlant croissance, survie, adhésion, migration et différenciation cellulaires (p.258). L'afatinib les bloque tous de façon irréversible (p.260)."},{"id":"13-alk","t":"Kinase du lymphome anaplasique (ALK)","e":"L'ALK est une tyrosine kinase impliquée dans plusieurs cancers. Inhibiteurs : crizotinib (XALKORI®, 1re génération), alectinib (ALECENSA®, 2e génération), lorlatinib (LORVIQUA®, 3e génération), ce dernier indiqué dans le CPNPC ALK-positif avancé non préalablement traité par un inhibiteur de l'ALK (p.260)."},{"id":"13-voie-ras-raf-mek-erk","t":"BRAF, MEK et voie RAS-RAF-MEK-ERK","e":"BRAF est un proto-oncogène codant B-Raf, une sérine/thréonine kinase de la croissance cellulaire, mutée dans certains cancers (encorafénib, dabrafénib = inhibiteurs de BRAF). Les MEK1/2 font partie de la voie régulée par ERK ; dans le mélanome, des formes mutées de BRAF (V600) activent MEK. Le trametinib inhibe l'activation de MEK par BRAF ; trametinib + dabrafénib sont associés dans le mélanome BRAF V600 (p.261-263)."},{"id":"13-btk","t":"Tyrosine kinase de Bruton (BTK)","e":"Codée par le gène BTK, elle joue un rôle crucial dans le développement des lymphocytes B. Son expression est augmentée dans les lymphocytes B mutés de la leucémie lymphoïde chronique ; l'ibrutinib (IMBRUVICA®) l'inhibe de façon irréversible (p.261)."},{"id":"13-cdk46","t":"Kinases dépendantes des cyclines CDK4/6","e":"Les CDK4/6 sont en aval de multiples voies de signalisation conduisant à la prolifération cellulaire. Le palbociclib (IBRANCE®) les inhibe et réduit la prolifération, notamment des cancers du sein RE+ ; indication : cancer du sein localement avancé ou métastatique RH+ et HER2-négatif (p.262)."},{"id":"13-pi3k-delta","t":"PI3Kδ (phosphatidylinositol 3-kinase p110δ)","e":"La PI3Kδ est hyperactive dans les tumeurs malignes à cellules B et joue un rôle majeur dans la prolifération, la survie, la migration et la rétention des cellules tumorales dans les tissus lymphoïdes et la moelle. L'idelalisib (ZYDELIG®) l'inhibe ; il est indiqué avec le rituximab dans la LLC (p.264)."},{"id":"13-multikinases","t":"Inhibiteurs multikinases (anti-angiogéniques)","e":"Sunitinib, sorafénib, pazopanib et lenvatinib inhibent plusieurs récepteurs à tyrosine kinase (VEGFR, PDGFR, FGFR…) qui interviennent dans la prolifération tumorale et l'angiogenèse. Indications : cancers du rein avancés/métastasés (sunitinib, sorafénib, pazopanib), GIST (sunitinib) ; le lenvatinib est essentiellement anti-angiogénique (p.264-265)."},{"id":"13-parp","t":"Poly(ADP-ribose) polymérases (PARP)","e":"Les PARP sont des glycosyltransférases (famille de 17 membres) du noyau cellulaire qui signalent l'ADN monocaténaire endommagé (origine métabolique, chimique ou radioactive) au système chargé de restaurer l'ADN bicaténaire. Les inhibiteurs de PARP empêchent cette réparation et ciblent les cancers avec surexpression des PARP, notamment PARP-1 (olaparib, LYNPARZA®) (p.266)."},{"id":"13-proteasome-ubiquitine","t":"Système ubiquitine-protéasome 26S","e":"Le protéasome 26S (complexe cylindrique de 10 × 15 nm, cytosolique et nucléaire) = cylindre 20S + 2 complexes régulateurs 19S. Les protéines à dégrader sont d'abord poly-ubiquitinées (ubiquitine, 76 aa ; enzymes E1 activatrice, E2 conjugase, E3 ligase ; ATP), puis hydrolysées en peptides de 3 à 25 aa. Il dégrade protéines usagées, récepteurs, enzymes, cyclines, protéines virales, et produit les peptides antigéniques présentés à la surface (p.266-268)."},{"id":"13-proteasome-cancer","t":"Protéasome et cancer – myélome multiple","e":"Le protéasome favorise la croissance tumorale et les métastases en dégradant p53 (suppresseur de tumeurs) et les inhibiteurs de CDK p21 et p27, ou en activant NFκB (anti-apoptotique). Son inhibiteur, le bortézomib (dipeptide boroné, PS341, VELCADE®), a été autorisé dans le myélome multiple ; les chercheurs à l'origine du développement de VELCADE ont reçu le Nobel de chimie en 2004 (p.268)."},{"id":"13-comparaison-zomib","t":"Comparaison des inhibiteurs du protéasome","e":"Bortézomib : 1re génération, liaison réversible (bore), IV/SC, historique, neuropathie fréquente, 1re ligne et rechute. Carfilzomib : 2e génération, irréversible (époxykétone, non boré), IV, très spécifique, toxicité cardiaque, rechute après échec du bortézomib. Ixazomib : réversible (bore, prodrug), orale, prise à domicile, rechute uniquement en association (p.269)."},{"id":"13-points-de-controle","t":"Inhibiteurs de points de contrôle immunitaire","e":"Anticorps monoclonaux qui inhibent les régulateurs négatifs de l'activation des cellules T. Deux groupes : inhibiteurs de CTLA-4 (ipilimumab, YERVOY®) et inhibiteurs de PD-1/PD-L1 (pembrolizumab, KEYTRUDA®). PD-1 est un régulateur négatif de l'activité T ; KEYTRUDA, humanisé, bloque son interaction avec PD-L1 et PD-L2 et potentialise les réponses T anti-tumorales (p.269)."},{"id":"13-car-t","t":"Thérapies cellulaires CAR-T","e":"Lymphocytes T génétiquement modifiés exprimant un récepteur d'antigène chimérique (CAR) qui reconnaît des protéines spécifiques des cellules cancéreuses et s'y lie, déclenchant une réponse immunitaire. Ex. : axicabtagène ciloleucel (YESCARTA®, cellules T autologues transduites ex vivo par un vecteur rétroviral, CAR anti-CD19) ; aussi KYMRIAH®, TECARTUS®, CARVYKTI® en Belgique, réservés à certaines hémopathies malignes (lymphomes B, LAL) en rechute ou réfractaires (p.269-270)."},{"id":"13-ecteinascidines","t":"Ecteinascidines (trabectédine)","e":"Substances dérivées d'organismes marins, ici un tunicier (Ecteinascidia turbinata) retrouvé dans les racines de mangroves. La trabectédine, alcaloïde tétrahydroisoquinoléine de cette famille, se lie au petit sillon de l'ADN et perturbe transcription, réparation et cycle cellulaire (p.270)."},{"id":"13-photochimiotherapie","t":"Porphyrine et photochimiothérapie (témoporfine)","e":"La témoporfine (FOSCAN®) est une porphyrine de synthèse photosensibilisante. Traitement en 2 étapes : injection puis, 4 jours plus tard, illumination de la tumeur ~200 s par un laser à 652 nm. L'effet passe par la production de dérivés oxygénés hautement réactifs (interaction témoporfine–lumière–oxygène). Solution violet foncé en flacon ambré : utiliser le filtre en ligne fourni (p.271-272)."},{"id":"13-retinoides","t":"Rétinoïdes – trétinoïne","e":"La trétinoïne (VESANOID®, acide tout-trans rétinoïque) est un métabolite naturel du rétinol, de la classe des rétinoïdes (analogues naturels et de synthèse). Elle diffère de la vitamine A par le remplacement du CH2OH par COOH ; elle agit dans la croissance et la différenciation cellulaire et est utilisée dans la leucémie promyélocytaire aiguë (p.272)."},{"id":"13-antiandrogenes","t":"Antiandrogènes","e":"Apalutamide, bicalutamide, darolutamide, enzalutamide et flutamide sont des antagonistes des récepteurs des androgènes, utilisés seulement dans le cancer de la prostate ; ils sont détaillés au tome 3 (médicaments hormonaux) (p.252)."},{"id":"14-pediculose-options-belgique","t":"Pédiculose : plus de médicament enregistré depuis 2018","e":"Depuis novembre 2018, il n'existe plus de traitements enregistrés comme médicaments dans la pédiculose en Belgique. Les options disponibles sont la « méthode du peigne mouillé » (2 séances/semaine pendant 2 semaines, peigne à poux + démêlant) et la diméticone, qui est un dispositif médical."},{"id":"14-dimeticone-asphyxie","t":"Diméticone : asphyxie du pou","e":"La diméticone (polydiméthylsiloxane) bouche les stigmates respiratoires des poux et des lentes et provoque leur mort par asphyxie ; elle formerait un film asphyxiant autour du pou. Produit non toxique, non susceptible de provoquer des résistances."},{"id":"14-organochlores-interdits","t":"DDT et lindane interdits en Belgique","e":"Le clofénotane (DDT) et le lindane, insecticides organochlorés autrefois utilisés comme antiscabieux, sont aujourd'hui interdits en Belgique. Le DDT est persistant (demi-vie 15 ans), dispersif (retrouvé dans l'Arctique) et biocumulatif (stocké dans les graisses, concentré au sommet de la chaîne alimentaire)."},{"id":"14-organophosphores-ache","t":"Organophosphorés : inhibiteurs covalents de l'acétylcholinestérase","e":"Les pesticides organophosphorés (parathion, malathion) dérivent de la structure des gaz de combat (tabun, sarin, soman). Ils inhibent l'acétylcholinestérase en formant un lien covalent avec son site actif : l'acétylcholine n'est plus hydrolysée, ce qui aboutit à une paralysie complète et rapide. Antidotes : atropine à forte dose (1 mg) ou pralidoxime (réactivateur des cholinestérases)."},{"id":"14-pyrethrines-vs-permethrine","t":"Pyréthrines naturelles vs perméthrine","e":"Les pyréthrines sont des insecticides naturels extraits des fleurs de pyrèthre, liquides et peu toxiques pour l'homme. La perméthrine est un produit synthétique plus stable : crème à 5 % (ZALVOR) contre la gale et les poux du pubis, et imprégnation des moustiquaires en prévention de la malaria."},{"id":"14-vaccins-hors-cours","t":"Vaccins, immunoglobulines, sérums","e":"Ces produits relèvent des biotechnologies et font l'objet d'un autre chapitre ; ils ne sont pas vus en détail dans ce cours."},{"id":"14-interferons-types","t":"Interférons : types I et II, pégylation","e":"Les interférons sont des cytokines immunostimulantes, antivirales, antiprolifératives et antiangiogéniques (~160 acides aminés). Type I : IFN-α (macrophages) et IFN-β (fibroblastes) ; type II : IFN-γ (lymphocytes T activés, cellules NK). Les peginterférons sont conjugués au polyéthylène glycol pour augmenter leur demi-vie."},{"id":"14-ifn-indications","t":"IFN-α pour les hépatites, IFN-β pour la SEP","e":"Le peginterféron α-2a (PEGASYS®) est indiqué dans l'hépatite chronique B et l'hépatite C. Les interférons β-1a et β-1b diminuent la fréquence et la gravité des poussées chez certains patients atteints de sclérose en plaques avec alternance de poussées et de rémissions."},{"id":"14-fumarate-mecanisme","t":"Fumarate de diméthyle : monothérapie orale de la SEP","e":"Le fumarate de diméthyle (TECFIDERA®) est proposé en monothérapie par voie orale dans la SEP récurrente-rémittente. Avec son métabolite (fumarate de monométhyle), il réduit l'activation des cellules immunitaires et la libération de cytokines pro-inflammatoires. SKILARENCE® : psoriasis en plaques modéré à sévère nécessitant un traitement systémique."},{"id":"14-glatiramere-mbp","t":"Glatiramère, mime de la protéine basique de la myéline","e":"L'acétate de glatiramère est un polypeptide synthétique (Ala, Glu, Lys, Tyr) dont la structure ressemble à celle de la MBP. Il se fixerait sur les molécules du CMH de classe II des cellules présentatrices d'antigène et empêcherait l'activation des lymphocytes T par la MBP ; il pourrait réduire la fréquence des rechutes dans la SEP."},{"id":"14-s1p-modulateurs","t":"Modulateurs des récepteurs S1P : agoniste devenu antagoniste","e":"Le fingolimod, phosphorylé dans l'organisme, est un puissant agoniste des récepteurs de la sphingosine-1-phosphate mais, en utilisation permanente, pourrait se comporter comme un antagoniste. Il provoque une lymphopénie en inhibant la sortie des lymphocytes du thymus et des ganglions et empêcherait leur pénétration dans le SNC. Dérivés : ozanimod, ponésimod, siponimod."},{"id":"14-imids-teratogenes","t":"ImIDs : tératogènes, contraception stricte","e":"Le lénalidomide, comme le thalidomide, est contre-indiqué pendant la grossesse (risque tératogène). Des mesures de contraception strictes doivent être prises 4 semaines avant le début du traitement et jusqu'à 4 semaines après son arrêt."},{"id":"14-myelome-multiple","t":"Myélome multiple (maladie de Kahler)","e":"Cancer hématologique rare, généralement après 60 ans : prolifération monoclonale maligne de plasmocytes dans la moelle (insuffisance médullaire, lyse osseuse et hypercalcémie) avec sécrétion d'une immunoglobuline monoclonale (hyperviscosité, insuffisance rénale, déficit immunitaire). Indication du lénalidomide (avec la dexaméthasone) et du pomalidomide (forme réfractaire)."},{"id":"14-apremilast-pde4","t":"Aprémilast : inhibiteur de PDE4","e":"La PDE4 est la phosphodiestérase spécifique de l'AMPc prédominante dans les cellules inflammatoires. Son inhibition par l'aprémilast augmente l'AMPc, ce qui diminue TNF-α, IL-23, IL-17 et module l'IL-10. Indications : rhumatisme psoriasique, psoriasis en plaques chronique modéré à sévère (après échec/CI/intolérance à ciclosporine, méthotrexate, PUVA), ulcères buccaux de la maladie de Behçet."},{"id":"14-immunosuppresseurs-risques","t":"Immunosuppresseurs : indications et risques","e":"Utilisés dans les maladies auto-immunes, la polyarthrite rhumatoïde, le syndrome néphrotique, les glomérulonéphrites chroniques et les transplantations d'organe. Un traitement de longue durée peut provoquer des infections et favoriser des cancers, particulièrement des lymphomes."},{"id":"14-corticosteroides-immunosuppression","t":"Corticostéroïdes immunosuppresseurs","e":"Les corticostéroïdes ont aussi une action immunosuppressive et sont fréquemment utilisés dans cette optique."},{"id":"14-calcineurine","t":"Inhibiteurs de la calcineurine","e":"La ciclosporine et le tacrolimus bloquent l'activation des lymphocytes T en inhibant la calcineurine, une protéine phosphatase qui stimule des facteurs de transcription intervenant notamment dans la synthèse de l'IL-2, laquelle stimule la croissance et la différenciation des cellules T."},{"id":"14-mtor","t":"Inhibiteurs de mTOR","e":"mTOR (mechanistic target of rapamycin) est une sérine/thréonine kinase qui régule la prolifération et la croissance cellulaires. L'évérolimus et le sirolimus l'inhibent et empêchent l'expansion clonale des lymphocytes T activés par l'antigène (médiée par IL-2 et IL-15). Ce sont des immunosuppresseurs en usage interne."},{"id":"14-impdh-mofetil","t":"IMPDH et estérification du mycophénolate","e":"L'acide mycophénolique (Penicillium) inhibe l'inosine monophosphate déshydrogénase (IMP → XMP, précurseur des dérivés de la guanosine). Il inhibe la prolifération des lymphocytes B et T et la production d'anticorps. Estérifié pour augmenter sa biodisponibilité, il devient le mycophénolate mofétil (CELLCEPT®)."}],"chap":[{"id":"antibacteriens","t":"Antibactériens","court":"Antibactériens","img":"icons/antibacteriens-180.png","sym":"flask","niveaux":[{"t":"Sulfamidés et antifolates","s":"Bases, découverte, PABA, co-trimoxazole","type":"n","m":["sulfanilamide","acide-para-aminobenzoique","acide-folique","acide-tetrahydrofolique","trimethoprime","sulfamethoxazole","co-trimoxazole","sulfasalazine","mesalazine","sulfadiazine-argentique"],"q":["01-q01","01-q02","01-q03","01-q04","01-q05","01-q06","01-q07","01-q08","01-q09","01-q10","01-q11","01-q12","01-q13","01-q14","01-q15","01-q16","01-q17","01-q18","01-q19","01-q20","01-q21","01-q22","01-q23","01-q24","01-q25","01-q26","01-q27","01-q28","01-q30"],"c":["01-toxicite-selective","01-antibiotique-definition","01-bactericide-bacteriostatique","01-antiseptique","01-desinfectant","01-sterilisation","01-selectivite-cible","01-procaryote","01-structure-bacterie","01-peptidoglycane","01-classification-oxygene","01-classification-forme","01-coloration-gram","01-gram-positif","01-gram-negatif","01-cibles-therapeutiques","01-prontosil-prodrug","01-rsa-noyau-aromatique","01-rsa-nh2","01-rsa-sulfonamide","01-effet-hypoglycemiant","01-vitamine-b9","01-microorganismes-synthese-folates","01-reduction-folates-dhfr","01-thf-pyrimidines","01-thf-purines-acides-amines","01-deficit-folates-anemie","01-indications-acide-folique","01-folates-cible-pharmacologique","01-analogues-paba","01-dihydropteroate-synthetase","01-sulfamides-bacteriostatiques","01-plasmodium-antipaludique","0
