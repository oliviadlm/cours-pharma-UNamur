<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPHAB311 · Ch. 2 État solide</title>
<style>
:root{
  --bg:#f6f4ee; --card:#fff; --ink:#1d2629; --muted:#687276; --line:#e3ded3;
  --accent:#2f6f62; --accent-ink:#fff; --accent-soft:#e2eee9;
  --ok:#2e7d4f; --ok-soft:#e4f3e9; --ko:#b3412f; --ko-soft:#fbe8e3;
  --warn:#9a6a00; --warn-soft:#fff4d6; --info-soft:#eaf0fb; --r:14px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#17191a; --card:#222527; --ink:#ecebe6; --muted:#9aa3a6; --line:#34393b;
  --accent:#7cc4b2; --accent-ink:#0f201b; --accent-soft:#233630;
  --ok:#7fd29d; --ok-soft:#1f3527; --ko:#f0907d; --ko-soft:#3a2420;
  --warn:#f0c869; --warn-soft:#3a3320; --info-soft:#232c3a;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px}
header .kick{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header h1{font-size:21px;line-height:1.25;margin:3px 0 2px}
header p{margin:0;color:var(--muted);font-size:14px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 14px}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;
  padding:6px 11px;border-radius:999px;cursor:pointer}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 8px} h3{font-size:16px;margin:14px 0 6px}
.muted{color:var(--muted)} .small{font-size:13.5px}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;
  padding:8px 15px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{font-size:13.5px;padding:5px 10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--card);text-align:left;font:inherit;color:inherit}
.tile:hover{border-color:var(--accent)} .tile b{display:block;margin-bottom:2px} .tile span{font-size:13.5px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ctx{background:var(--accent-soft);border-radius:10px;padding:11px 13px;margin:0 0 12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap}
.q{font-size:17px;margin:4px 0 12px}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:11px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:10px;padding:10px 13px;font:inherit;cursor:pointer}
.opt .n{flex:none;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12.5px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .n{background:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)} .opt.ko .n{background:var(--ko);color:#fff}
.opt:disabled{cursor:default}
input.num,input.txt,textarea{font:inherit;font-size:17px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);width:100%}
input.num:focus,input.txt:focus{outline:none;border-color:var(--accent)}
input.ok{border-color:var(--ok);background:var(--ok-soft)} input.ko{border-color:var(--ko);background:var(--ko-soft)}
.conf{margin-top:12px} .conf .lab{font-size:13px;color:var(--muted);margin-bottom:6px}
.fb{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.ko{background:var(--ko-soft);color:var(--ko)}
.fb .ex{color:var(--ink);margin-top:6px;font-size:14.5px}
.hyper{margin-top:10px;background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.flash{min-height:150px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:19px;gap:8px}
.flash .back{font-size:17px;color:var(--accent);font-weight:600;border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.grades .btn{justify-content:center;font-size:14px;padding:8px 4px}
.g0{border-color:var(--ko)!important;color:var(--ko)} .g3{border-color:var(--ok)!important;color:var(--ok)}
.steps{margin:6px 0 0;padding-left:20px} .steps li{margin:5px 0}
.wk li{margin:9px 0} .wk .blank{display:flex;gap:8px;align-items:center;margin-top:5px} .wk .blank input{max-width:180px}
.why{font-size:13.5px;color:var(--muted);cursor:pointer;margin-left:4px;text-decoration:underline dotted}
.whyx{display:block;font-size:14px;background:var(--info-soft);border-radius:8px;padding:6px 10px;margin-top:5px}
.lesson .content p{margin:6px 0}
.lesson table,.tbl{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
.lesson td,.lesson th,.tbl td,.tbl th{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.lesson th,.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.k{transition:filter .2s}
.hidek .k{filter:blur(6px);cursor:pointer;background:var(--accent-soft);border-radius:4px}
.hidek .k.shown{filter:none}
.box{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14.5px}
.box.why2{background:var(--info-soft)} .box.trap{background:var(--ko-soft)} .box.talk{background:var(--warn-soft)}
.box h4{margin:0 0 6px;font-size:14px}
details summary{cursor:pointer;font-weight:600}
.formula{font-size:17px;text-align:center;font-weight:700;margin:8px 0;font-family:ui-monospace,Menlo,Consolas,monospace}
.timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--accent);line-height:1.1}
.plan{display:flex;gap:6px;flex-wrap:wrap}
.plan div{flex:1;min-width:84px;border:1.5px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:13px}
.plan div b{display:block;font-size:15px}
.plan .done{border-color:var(--ok);background:var(--ok-soft)} .plan .today{border-color:var(--accent);border-width:2.5px}
.mast{display:grid;grid-template-columns:1fr 110px 44px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.lvl{font-size:12px;font-weight:700}
.src a{color:var(--accent)}
.kbd{font-family:ui-monospace,Menlo,monospace;background:var(--line);border-radius:5px;padding:1px 6px;font-size:13px}
.hidden{display:none}
.method{border-left:4px solid var(--accent);padding:6px 0 6px 12px;margin:12px 0}
.method b{font-size:15.5px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:12px 0 4px}
.gal figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:zoom-in;transition:transform .15s,box-shadow .15s}
.gal figure:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.gal .ph{height:150px;display:flex;align-items:center;justify-content:center;background:#fff;padding:8px}
.gal .ph.photo{padding:0}
.gal img{max-width:100%;max-height:100%;object-fit:contain}
.gal .ph.photo img{width:100%;height:100%;object-fit:cover}
.gal figcaption{font-size:13px;padding:7px 9px 8px;line-height:1.35;border-top:1px solid var(--line)}
.gal .cr{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.gal .cr a{color:inherit}
#lb{position:fixed;inset:0;background:rgba(20,20,25,.82);display:none;align-items:center;justify-content:center;z-index:99;padding:20px;cursor:zoom-out}
#lb.on{display:flex} #lb div{background:#fff;border-radius:12px;padding:12px;max-width:92vw;max-height:90vh;display:flex;flex-direction:column;align-items:center}
#lb img{max-width:86vw;max-height:76vh;object-fit:contain} #lb p{margin:8px 0 0;font-size:14px;color:#333;text-align:center}
</style>
</head>

{ id: "cristal", title: "Structure cristalline, polymorphisme, solvates",
  html: `<p>Un solide cristallin = arrangement ordonné de molécules ; l'unité structurelle est la <span class="k">maille cristalline</span>. Il existe <span class="k">7 systèmes</span> : triclinique, monoclinique, orthorhombique, tétragonal, hexagonal, rhomboédrique, cubique.</p>
  <p><b>Polymorphisme</b> : propriété d'une substance pure d'exister à l'état solide sous <span class="k">au moins deux structures cristallines</span>. Les polymorphes diffèrent par : densité, propriétés optiques, <span class="k">point de fusion</span>, diffraction X, spectre IR, <span class="k">solubilité, vitesse de dissolution</span>.</p>
  <p>À T et P données, <span class="k">une seule forme est stable</span> (notée <span class="k">I</span>) ; les autres (II, III…) sont <span class="k">métastables</span> et se transforment plus ou moins vite en forme stable. Les métastables ont en général un <span class="k">point de fusion plus bas</span> et une <span class="k">solubilité et vitesse de dissolution plus élevées</span>. Utilisables si la transformation est lente pendant la durée de vie du médicament ; sinon problèmes (croissance de cristaux, <i>caking</i>).</p>
  <p>Fréquent pour : <span class="k">corticoïdes, sulfamidés, barbituriques, indométhacine</span>. Exemple biopharmaceutique : <span class="k">palmitate de chloramphénicol</span> (taux sériques très variables selon la forme).</p>
  <p><b>Amorphe</b> = arrangement désordonné, souvent <span class="k">plus soluble</span> que le cristal. Fractions cristalline/amorphe mesurées par <span class="k">diffractométrie X</span>.</p>
  <p><b>Solvates / hydrates</b> (pseudopolymorphisme) : solvant emprisonné dans le cristal (hydrate si c'est l'eau). En général : <span class="k">la forme anhydre se dissout plus vite</span> (ampicilline anhydre &gt; trihydrate) ; les <span class="k">solvates non aqueux sont plus solubles</span> (acétate de fludrocortisone + n-amylique : 5×). La <span class="k">granulation humide</span> peut créer ou supprimer un hydrate (séchage).</p>`,
  why: [["Pourquoi le polymorphisme peut-il poser un problème de biodisponibilité ?", "Les formes cristallines ont des solubilités et vitesses de dissolution différentes : la quantité dissoute, donc absorbée, change (palmitate de chloramphénicol)."],
        ["Pourquoi peut-on parfois utiliser une forme métastable ?", "Elle est plus soluble ; si elle ne se transforme que très lentement en forme stable pendant la durée de vie du médicament, l'avantage est conservé sans risque."]],
  talk: { prompt: "Explique le polymorphisme, ses conséquences et l'exemple du palmitate de chloramphénicol.", check: ["≥ 2 structures cristallines pour une même substance", "Une seule stable (I), autres métastables (II, III…)", "Métastable : Tf plus bas, plus soluble, dissolution plus rapide", "Conséquence : biodisponibilité variable (palmitate de chloramphénicol)", "Amorphe souvent plus soluble ; hydrate : anhydre plus rapide"] },
  traps: ["Croire que la forme stable est la plus soluble (c'est l'inverse).", "Inverser : anhydre plus soluble que l'hydrate ; solvate non aqueux plus soluble que la forme non solvatée."] },

{ id: "taille", title: "Taille et forme des particules",
  html: `<p><b>Analyse granulométrique</b> : contrôle de la taille et de la distribution des tailles. Influence de la taille :</p>
  <ul><li><span class="k">Vitesse de dissolution</span> : les petites particules se dissolvent plus vite (<b>Noyes-Whitney</b> : dQ/dt = D·A/h × (Cs − C) ; ↓ taille → ↑ surface A).</li>
  <li><span class="k">Écoulement</span> : grosses particules sphériques s'écoulent mieux que petites irrégulières.</li>
  <li>Homogénéité et stabilité des mélanges ; efficacité des <span class="k">lubrifiants</span>.</li>
  <li>Dépôt pulmonaire : <span class="k">fraction respirable entre 1 et 6 µm</span>.</li>
  <li>Stabilité des suspensions/émulsions (<b>Stokes</b> : les grosses particules sédimentent plus vite).</li></ul>
  <p><b>Échelles</b> : <span class="k">10 µm – 1 mm</span> (poudres, granulés, pellets) ; <span class="k">région colloïdale 10 nm – 1 µm</span> (liposomes, nanosphères, émulsions parentérales).</p>
  <p><b>Diamètre équivalent</b> : diamètre de la sphère équivalente. En volume : V = π·d³/6 → 15 µm³ ⇒ <span class="k">dv = 3,06 µm</span>. En surface : S = π·d² → 46 µm² ⇒ <span class="k">ds = 3,83 µm</span>.</p>
  <p><b>Distribution</b> : tendance centrale = <span class="k">médiane</span> (50 % de part et d'autre), <span class="k">mode</span> (pic ; plusieurs pics = multimodale), <span class="k">moyenne</span> (pondérée). Dispersion : poudre <span class="k">monodispersée</span> (même taille) ou <span class="k">polydispersée</span> ; écart-type, quartiles (25 % et 75 %). Distribution souvent <span class="k">asymétrique</span> en pratique.</p>
  <p><b>Forme</b> : paramètres de la Pharmacopée européenne : <span class="k">diamètre de Feret, de Martin, de l'aire projetée</span>.</p>
  <p><b>Applications</b> : contrôle des matières premières, contrôle en cours de fabrication, avant/après broyage, produits finis, contamination particulaire des injectables, atmosphère des salles.</p>`,
  why: [["Pourquoi réduire la taille des particules accélère-t-il la dissolution ?", "Pour une même masse, des particules plus petites offrent une surface A plus grande ; dans Noyes-Whitney, la vitesse est proportionnelle à A."],
        ["Pourquoi la taille compte-t-elle pour un inhalateur ?", "Seules les particules d'environ 1 à 6 µm atteignent les voies respiratoires profondes ; trop grosses, elles se déposent dans la bouche et la gorge."]],
  talk: { prompt: "Cite 5 influences de la taille des particules en pharmacie et explique l'équation de Noyes-Whitney.", check: ["Dissolution (Noyes-Whitney : D, A, h, Cs − C)", "Écoulement", "Homogénéité des mélanges / lubrifiants", "Dépôt pulmonaire 1-6 µm", "Sédimentation (Stokes)"] },
  traps: ["Penser que les petites particules s'écoulent mieux (c'est l'inverse).", "Confondre médiane (50 %) et mode (pic)."] },

{ id: "poudre1", title: "Masse volumique et surface spécifique",
  html: `<p><b>Masse volumique</b> (g/cm³) : pour un solide, elle dépend aussi de l'arrangement moléculaire (structure cristalline, cristallinité) → deux solides chimiquement identiques peuvent différer.</p>
  <table><tr><th>Niveau</th><th>Ce qu'elle prend en compte</th></tr>
  <tr><td>Masse volumique <b>vraie</b> (cristalline)</td><td><span class="k">uniquement la fraction solide</span></td></tr>
  <tr><td>Masse volumique <b>particulaire</b></td><td>solide + <span class="k">pores intraparticulaires</span></td></tr>
  <tr><td>Masse volumique <b>vrac</b> (apparente, <i>bulk</i>)</td><td>+ <span class="k">espaces interparticulaires</span> ; mesurée dans une éprouvette graduée, éventuellement après tassement</td></tr></table>
  <p>Applications : excipients de remplissage (<span class="k">lactose</span>), <span class="k">remplissage des gélules</span> (carbonate calcique lourd vs léger), remplissage des mélangeurs.</p>
  <p><b>Surface spécifique</b> (m²/g) = surface totale des particules / masse sèche. Mesurée par <span class="k">adsorption physique d'un gaz</span> (couche monomoléculaire). Plus les grains sont fins, plus elle est grande. Pour des sphères de rayon r et masse volumique ρ :</p>
  <div class="formula">S spé = 3 / (ρ · r)</div>
  <p>Exemples : <span class="k">stéarate de magnésium</span> (lubrifiant) ; <span class="k">silice colloïdale anhydre (Aerosil® 200) ≈ 200 m²/g</span>, régulateur d'écoulement efficace à <span class="k">&lt; 1 %</span> (autres poudres ≈ 1 m²/g).</p>`,
  why: [["Pourquoi la silice colloïdale agit-elle à moins de 1 % ?", "Sa surface spécifique énorme (~200 m²/g) lui permet de recouvrir les autres particules et de réduire leurs frottements, même en très petite quantité."],
        ["Pourquoi la masse volumique vrac compte-t-elle pour remplir des gélules ?", "La gélule a un volume fixe : c'est la masse volumique vrac qui détermine quelle masse de poudre y entre (carbonate de calcium lourd vs léger)."]],
  talk: { prompt: "Explique les 3 masses volumiques et la surface spécifique, avec l'exemple de l'Aerosil®.", check: ["Vraie : fraction solide seule", "Particulaire : + pores intraparticulaires", "Vrac : + espaces interparticulaires", "Surface spécifique en m²/g, adsorption de gaz, S = 3/(ρ·r)", "Aerosil® 200 ≈ 200 m²/g, efficace < 1 %"] },
  traps: ["Inverser particulaire (pores intra) et vrac (espaces inter).", "Croire que des grosses particules ont une plus grande surface spécifique."] },

{ id: "ecoul", title: "Écoulement et compression",
  html: `<p><b>4 méthodes pour l'écoulement</b> : <span class="k">angle de repos</span> · <span class="k">taux de tassement</span> · <span class="k">vitesse d'écoulement à travers un orifice</span> · <span class="k">cellule de cisaillement</span> (complémentaires : l'idéal est d'en combiner plusieurs).</p>
  <p><b>Angle de repos</b> : angle du cône de poudre avec l'horizontale ; tan α = <span class="k">hauteur / rayon de la base</span>. Échelle de <b>Carr</b> :</p>
  <table><tr><th>Écoulement</th><th>Angle (°)</th></tr><tr><td>Excellent</td><td><span class="k">25-30</span></td></tr><tr><td>Bon</td><td><span class="k">31-35</span></td></tr><tr><td>Assez bon</td><td><span class="k">36-40</span></td></tr><tr><td>Passable</td><td><span class="k">41-45</span></td></tr><tr><td>Faible</td><td><span class="k">46-55</span></td></tr><tr><td>Très faible</td><td><span class="k">56-65</span></td></tr><tr><td>Extrêmement faible</td><td><span class="k">&gt; 66</span></td></tr></table>
  <div class="formula">Taux de tassement (%) = 100 × (V0 − VF) / V0</div>
  <p>V0 = volume vrac avant tassement, VF = après. Plus il est élevé, plus les interactions interparticulaires gênent l'écoulement.</p>
  <p>Vitesse à travers un orifice : seulement pour les poudres <span class="k">« free-flowing »</span> (masse ou volume écoulé en un temps donné). Cellule de cisaillement : partie inférieure fixe, partie supérieure mobile ; force pour cisailler la couche.</p>
  <p><b>Compression</b> : réarrangement particulaire (jusqu'au volume vrac minimum) → <span class="k">déformation élastique</span> → <span class="k">fragmentation</span> (matériaux cassants) ou <span class="k">déformation plastique</span> (permanente). Plastique et fragmentation forment le compact ; l'<span class="k">élasticité</span> cause <span class="k">clivage et laminage</span> (énergie relâchée après compression).</p>
  <p>Compromis du comprimé : <span class="k">résistance mécanique</span> suffisante mais <span class="k">porosité</span> pour laisser entrer les fluides digestifs : ↑ force de compression ⇒ ↓ porosité.</p>`,
  why: [["Pourquoi un matériau très élastique donne-t-il des comprimés qui se clivent ?", "Il stocke l'énergie pendant la compression et la relâche ensuite : le comprimé se fend (clivage, laminage)."],
        ["Pourquoi un fort taux de tassement signale-t-il un mauvais écoulement ?", "Si la poudre se tasse beaucoup, c'est que les particules s'accrochent entre elles et laissent des vides : les mêmes interactions freinent l'écoulement."]],
  talk: { prompt: "Décris les 4 méthodes d'évaluation de l'écoulement, l'échelle de Carr et la formule du taux de tassement.", check: ["Angle de repos (h / r)", "Taux de tassement = 100 (V0 − VF)/V0", "Orifice (free-flowing seulement)", "Cellule de cisaillement", "Carr : 25-30 excellent … > 66 extrêmement faible"] },
  traps: ["Diviser par VF au lieu de V0 dans le taux de tassement.", "Attribuer le clivage à la déformation plastique (c'est l'élasticité)."] },

{ id: "mouill", title: "Mouillage, dissolution et hygroscopicité",
  html: `<p><b>Mouillage</b> : étape qui précède la dissolution. Mesuré par l'<span class="k">angle de contact θ</span>. <b>Équation de Young</b> :</p>
  <div class="formula">γS/A = γS/L + γL/A · cos θ</div>
  <p><span class="k">Mouillage complet : θ = 0° (cos θ = 1)</span> ; θ varie de 0° à <span class="k">180° (mouillage insignifiant)</span>. Les PA hydrophobes (palmitate de chloramphénicol) se mouillent mal → on ajoute des <span class="k">tensio-actifs</span> qui diminuent γL/A et γS/L.</p>
  <p><b>Vitesse de dissolution</b> : dépend de l'état solide et de facteurs extrinsèques (hydrodynamique, température, viscosité, pH, pouvoir tampon, force ionique). <b>Noyes-Whitney</b> : dQ/dt = <span class="k">D·A/h × (Cs − C)</span> (D : coefficient de diffusion, A : surface, h : épaisseur de la couche de diffusion, Cs : concentration à saturation dans la couche, C : concentration dans le milieu).</p>
  <p><b>Hygroscopicité</b> : rétention d'eau (masse, adsorption, condensation capillaire, réaction, dissolution). <span class="k">Déliquescence</span> : le solide se dissout dans le film d'eau à sa surface. <span class="k">Efflorescence</span> : perte de l'eau de cristallisation sous une certaine humidité relative. Conséquences : hydrolyse, changement cristallin, écoulement, compression, lubrification, dissolution.</p>
  <p><b>Classes Ph. Eur.</b> (24 h, <span class="k">80 % HR, 25 °C</span>) :</p>
  <table><tr><th>Classe</th><th>Prise de masse</th></tr><tr><td>Non hygroscopique</td><td><span class="k">&lt; 0,2 %</span></td></tr><tr><td>Légèrement</td><td><span class="k">0,2 à 2 %</span></td></tr><tr><td>Hygroscopique</td><td><span class="k">2 à 15 %</span></td></tr><tr><td>Très hygroscopique</td><td><span class="k">&gt; 15 %</span></td></tr><tr><td>Déliquescent</td><td>formation d'un liquide</td></tr></table>`,
  why: [["Pourquoi un tensio-actif améliore-t-il le mouillage ?", "Il abaisse les tensions γL/A et γS/L ; d'après Young, cos θ augmente, donc l'angle de contact diminue."],
        ["Pourquoi la déliquescence et l'efflorescence sont-elles opposées ?", "L'une absorbe assez d'eau pour se dissoudre, l'autre perd son eau de cristallisation quand l'air est sec."]],
  talk: { prompt: "Explique l'équation de Young, les conditions de mouillage complet et les classes d'hygroscopicité.", check: ["γS/A = γS/L + γL/A cos θ", "θ = 0° : mouillage complet ; 180° : insignifiant", "Tensio-actifs ↓ γL/A et γS/L", "Conditions Ph. Eur. : 24 h, 80 % HR, 25 °C", "Seuils 0,2 / 2 / 15 %"] },
  traps: ["Dire que θ = 90° est un mouillage complet.", "Confondre déliquescence et efflorescence."] },

{ id: "operations", title: "Broyage, mélange, granulation, compression",
  html: `<p><b>Broyage</b> : fragmenter des unités solides en plus petites par des moyens mécaniques. Influence : dissolution, homogénéité, stabilité des dispersions, biodisponibilité. Propriétés influençant le broyage : <span class="k">dureté, ténacité (fibreux = difficile), point de fusion (chaleur produite), humidité, danger d'explosion (peroxyde de benzoyle)</span>. Officine : <span class="k">mortier et pilon</span>. Industrie : à couteaux, marteaux, billes, rouleaux, <span class="k">à jet de fluide (jet d'air)</span> = le plus utilisé pour <span class="k">microniser (&lt; 10 µm)</span>. Inconvénients : <span class="k">transformation polymorphique (cristallin → amorphe)</span>, poudre micronisée cohésive, peu dense, poussiéreuse ; agglomérats électrostatiques.</p>
  <p><b>Mélange</b> : association la plus homogène possible. Deux conditions préalables : <span class="k">expansion de la poudre (remplir au maximum aux 2/3)</span> et <span class="k">cisaillement tridimensionnel</span> (pas de zones mortes). Puis : mélanger assez longtemps et <span class="k">figer l'état aléatoire</span> (éviter la <span class="k">ségrégation</span>).</p>
  <p>Le <span class="k">mélange parfait n'existe pas</span> ; tolérance <span class="k">95-105 %</span> (dosage collectif sur 10 ou 20 comprimés) et <span class="k">85-115 %</span> (dosages individuels). <b>Mélange randomisé</b> : même probabilité partout ; loi binomiale :</p>
  <div class="formula">σR = √( P·(1 − P) / N )   ·   CV = σR / P</div>
  <p>N = 100 000, P = 0,5 → σ = 1,58·10⁻³, <span class="k">CV = 0,32 % (acceptable)</span> ; P = 0,001 → <span class="k">CV = 10 % (inacceptable)</span> → augmenter N (diminuer la taille des particules). <b>Mélange structuré</b> (<i>ordered mixing</i>) : fines particules adhérant aux grosses → limite la ségrégation.</p>
  <p><b>Règles pratiques en officine</b> : 1) réduire chaque substance en poudre séparément ; 2) même granulométrie ; 3) <span class="k">dilution progressive</span> : les constituants les plus faiblement dosés d'abord, par ordre croissant ; 4) constituant très faiblement dosé → <span class="k">trituration</span> (ex. à 1 %) ; 5) poudre qui colle au mortier → <span class="k">Aerosil® 200</span>.</p>
  <p><b>Granulation</b> : transformer une poudre en agglomérats (granulés) ; <span class="k">voie sèche (agrégation)</span> : compactage entre deux rouleaux puis concassage ; <span class="k">voie humide (agglutination)</span> ; dérivé : <span class="k">extrusion-sphéronisation</span> → pellets. Intérêt : <span class="k">figer l'homogénéité</span> et éviter la séparation des constituants dans les trémies.</p>
  <p><b>Compression</b> : agglomérer un volume constant de poudre ou de granulés dans des presses pharmaceutiques.</p>`,
  why: [["Pourquoi commence-t-on par les constituants les plus faiblement dosés ?", "En les diluant progressivement, on garantit leur répartition homogène ; ajoutés en dernier dans une grosse masse, ils resteraient mal dispersés."],
        ["Pourquoi le CV explose-t-il quand P est très petit ?", "Avec très peu de particules de PA par échantillon, le hasard pèse lourd : l'écart relatif au contenu moyen devient grand."]],
  talk: { prompt: "Explique comment réaliser un bon mélange de poudres à l'officine (conditions, règles pratiques, contrôle).", check: ["Expansion (2/3 max) et cisaillement 3D", "Temps suffisant puis éviter la ségrégation", "Broyer séparément, même granulométrie", "Dilution progressive, du plus faible au plus fort dosage", "Trituration si très faible dose ; Aerosil® si collage", "Tolérances 95-105 % / 85-115 %"] },
  traps: ["Remplir le mortier à ras bord.", "Croire que le mélange parfait est l'objectif réaliste."] }
],

const METHODS_HTML = `
<div class="card"><h2>Pourquoi cette page est construite ainsi</h2>
<p class="small" style="margin-top:0">Chaque outil de cette page applique une méthode dont l'efficacité a été mesurée dans des études contrôlées en psychologie cognitive et en sciences de l'éducation. La grande revue de Dunlosky et al. (2013) a évalué 10 techniques d'étude : <b>se tester</b> (pratique de récupération) et <b>espacer les révisions</b> obtiennent la note d'utilité la plus élevée ; l'<b>entrelacement</b>, l'<b>interrogation élaborative</b> et l'<b>auto-explication</b> une note moyenne ; <b>relire, surligner et résumer</b> une note faible.</p>
<div class="box trap" style="margin-bottom:0"><b>À éviter :</b> relire le PDF plusieurs fois ou surligner. On a l'impression de savoir parce que le texte est familier, mais on ne s'entraîne pas à le retrouver seule, ce que l'examen exige.</div></div>

<div class="card"><h2>Les méthodes, et où elles sont dans la page</h2>
<div class="method"><b>1. Se tester plutôt que relire (pratique de récupération)</b><br><span class="small">Flashcards, Quiz, Séance du jour. Dans l'étude de Roediger &amp; Karpicke (2006), les étudiants qui s'étaient testés retenaient nettement plus une semaine plus tard que ceux qui avaient relu. Réponds toujours <b>avant</b> de voir la réponse, même si tu n'es pas sûre.</span></div>
<div class="method"><b>2. Espacer les séances</b><br><span class="small">Plan J+1, J+3, J+7, J+14, J+30 et boîtes des flashcards. Cepeda et al. (2008, plus de 1 350 participants) montrent que l'intervalle optimal entre deux révisions augmente avec le délai jusqu'à l'examen. Mieux vaut 15 minutes réparties sur 5 jours que 75 minutes la veille.</span></div>
<div class="method"><b>3. Réapprendre jusqu'au critère, sur plusieurs séances (réapprentissage successif)</b><br><span class="small">Dans les sessions, une question ratée revient jusqu'à ce que tu la réussisses ; puis elle revient les jours suivants. Rawson &amp; Dunlosky recommandent de réussir chaque élément au moins une fois par séance, sur environ 3 séances espacées : c'est ce qui rend le souvenir durable.</span></div>
<div class="method"><b>4. Mélanger les types de problèmes (entrelacement)</b><br><span class="small">Onglet Mélange et Séance du jour. En maths, des élèves ayant mélangé les types d'exercices ont nettement mieux réussi un test surprise un mois plus tard (61 % contre 38 % dans un essai sur 787 élèves de Rohrer et al.). Le gain vient surtout du fait qu'il faut <b>choisir la méthode</b> : c'est pour cela que l'onglet Mélange te demande d'abord « quelle méthode ? ». C'est plus difficile sur le moment, et c'est normal.</span></div>
<div class="method"><b>5. Exemples résolus puis aide qui s'estompe</b><br><span class="small">Onglet Exemples guidés. Au début d'un apprentissage, étudier un exemple résolu est plus efficace que de chercher seule (Sweller ; Renkl). Ensuite, on retire les étapes en commençant par la fin (« estompage arrière », Renkl &amp; Atkinson), jusqu'à résoudre seule. Le niveau s'adapte à tes réussites.</span></div>
<div class="method"><b>6. Se demander « pourquoi ? » et s'expliquer les étapes</b><br><span class="small">Encadrés « Pourquoi ? » de la Leçon active et boutons « pourquoi ? » des exemples. Relier chaque règle à sa raison (interrogation élaborative, auto-explication) aide à comprendre et à transférer à des problèmes nouveaux.</span></div>
<div class="method"><b>7. Expliquer à voix haute, sans regarder</b><br><span class="small">Encadrés « Explique à voix haute ». C'est une forme de rappel libre et d'auto-explication. La liste à cocher te montre ce que tu as oublié.</span></div>
<div class="method"><b>8. Se tester avant d'apprendre (pré-test)</b><br><span class="small">Bouton Pré-test. Essayer de répondre avant d'avoir étudié, même en se trompant, améliore la mémorisation de ce qu'on apprend ensuite (Richland, Kornell &amp; Kao, 2009 ; Kornell, Hays &amp; Bjork, 2009).</span></div>
<div class="method"><b>9. Noter sa certitude et corriger les erreurs « sûres »</b><br><span class="small">Boutons Sûre / Hésitante / Au hasard et tableau de calibration. Les erreurs commises avec une forte confiance sont paradoxalement les mieux corrigées après le feedback (effet d'hypercorrection, Butterfield &amp; Metcalfe, 2001). Comparer ta confiance à tes résultats t'apprend aussi à savoir ce que tu sais vraiment.</span></div>
<div class="method"><b>10. Rendre les bases automatiques (sprints)</b><br><span class="small">Onglet Sprint. Quand les conversions, abréviations et densités sont instantanées, ta mémoire de travail reste disponible pour le raisonnement. On vise d'abord la précision, ensuite la vitesse. Honnêtement : cette idée est surtout étudiée pour le calcul de base chez les enfants, et une étude n'a pas trouvé d'avantage de rétention au simple entraînement chronométré par rapport à la même quantité de pratique. Utilise donc les sprints en complément, pas à la place des autres méthodes.</span></div>
<div class="method"><b>11. Une méthode de calcul stable, avec les unités</b><br><span class="small">Dans les corrections, chaque étape garde son unité (mg, g, mL). En formation infirmière, apprendre à poser les calculs de doses avec les unités (analyse dimensionnelle) a amélioré la précision par rapport au calcul classique. Écris toujours l'unité à chaque ligne et vérifie l'ordre de grandeur.</span></div>
</div>

<div class="card"><h2>Spécial galénique : ce qui change pour ce cours</h2>
<div class="method"><b>Questions ouvertes : rédiger, pas reconnaître</b><br><span class="small">L'examen comporte des questions ouvertes. Reconnaître la bonne réponse dans un QCM ne prouve pas qu'on sait la produire. Les « Questions d'examen » te font rédiger (ou dire) ta réponse, puis la comparer point par point à la réponse attendue : c'est du rappel libre, la forme de test la plus exigeante et la plus proche de l'examen.</span></div>
<div class="method"><b>Partie calculs éliminatoire : viser le sur-apprentissage</b><br><span class="small">Une seule erreur de calcul fait échouer tout le cours. Pour cette partie, « réussir une fois » ne suffit pas : continue à t'entraîner après avoir réussi (problèmes mélangés chaque jour, sans calculatrice), et vérifie systématiquement unités et ordre de grandeur. L'entraînement prolongé au-delà de la première réussite ralentit l'oubli à court terme ; l'espacer garde l'effet sur la durée.</span></div>
<div class="method"><b>Mélanger les chapitres</b><br><span class="small">La « Séance mélangée » et l'« Examen blanc » de la page générale tirent des questions de tous les chapitres : c'est l'entrelacement appliqué au cours entier, comme le jour de l'examen.</span></div></div>

<div class="card"><h2>Mode d'emploi conseillé</h2><ol class="steps">
<li><b>Un nouveau chapitre</b> (45-60 min) : pré-test → Leçon active (notion par notion : « pourquoi ? », voix haute, « Me tester ») → exemples guidés s'il y en a → questions d'examen.</li>
<li><b>Les jours suivants</b> (15-20 min par chapitre prévu) : Séance du jour du chapitre, aux dates du plan (J+1, J+3, J+7, J+14, J+30).</li>
<li><b>Chaque jour</b> : 5 problèmes de calcul mélangés (partie éliminatoire) et, si tu as le temps, un sprint de 60 s.</li>
<li><b>Notions « En cours »</b> : rouvre-les dans la Leçon (mode « Masquer l'essentiel »), refais leur test.</li>
<li><b>Les 10 derniers jours</b> : examens blancs et séances mélangées depuis la page générale ; plus de grosse relecture la veille, dors.</li>
<li><b>Livres</b> (Le Hir, Aulton) : utilise-les pour approfondir une notion ratée, pas pour tout relire.</li></ol></div>

function cardState(id) { return S.cards[id] || { box: 0, due: null, seen: 0, lapses: 0 }; }
function gradeCard(id, g) { // g: 0 raté, 1 difficile, 2 bien, 3 facile
  const st = cardState(id); st.seen++;

  else if (g === 1) st.box = Math.max(1, st.box);

}

/* ---------- maîtrise par notion ---------- */
function mastery(cid) {
  const parts = [];
  const cs = CARDS.filter(c => c.c === cid);
  if (cs.length) parts.push(cs.reduce((a, c) => a + Math.min(cardState(c.id).box, 4) / 4, 0) / cs.length);
  const qs = ITEMS.filter(q => q.c === cid);
  if (qs.length) parts.push(qs.reduce((a, q) => { const r = S.items[q.id] || []; const last = r.slice(-3); return a + (last.length ? last.reduce((x, y) => x + y, 0) / 3 : 0); }, 0) / qs.length);
  const gs = Object.entries(GENS).filter(([k, g]) => g.c === cid);
  if (gs.length) parts.push(gs.reduce((a, [k]) => { const r = (S.gens[k] || []).slice(-5); return a + (r.length ? r.reduce((x, y) => x + y, 0) / 5 : 0); }, 0) / gs.length);
  return parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : 0;
}

  for (let d = 0; d < 7; d++) { const day = addDays(t, d); next.push([day, CARDS.filter(c => { const s = S.cards[c.id]; return d === 0 ? (!s || !s.due || s.due <= day) : s && s.due === day; }).length]); }
  const c = S.conf; const pc = a => a[1] ? Math.round(a[0] / a[1] * 100) + " %" : "–";
  V().innerHTML = `<div class="card"><h2>Ma maîtrise</h2><p class="small muted" style="margin-top:0">Score par notion = flashcards (boîte atteinte) + quiz (3 dernières réponses) + problèmes (5 derniers). « Automatique » = au moins 85 %. Une réponse juste « au hasard » ne compte pas.</p>
  ${DATA.concepts.map(x => { const m = mastery(x.id); const [l, col] = lvl(m); return `<div class="mast"><a href="#" onclick="go('lesson','${x.id}');return false" style="color:inherit">${x.title}</a><div class="bar"><i style="width:${m * 100}%;background:${col}"></i></div><span class="lvl" style="color:${col}">${Math.round(m * 100)}%</span></div>`; }).join("")}
  </div>
  <div class="card"><h3 style="margin-top:0">Calibration de ta confiance</h3><table class="tbl"><tr><th>Quand tu dis…</th><th>tu as raison</th><th>réponses</th></tr>
  <tr><td>✅ Sûre</td><td>${pc(c.sure)}</td><td>${c.sure[1]}</td></tr><tr><td>🤔 Hésitante</td><td>${pc(c.mid)}</td><td>${c.mid[1]}</td></tr><tr><td>🎲 Au hasard</td><td>${pc(c.guess)}</td><td>${c.guess[1]}</td></tr></table>
  <div class="small muted">Idéal : « Sûre » proche de 100 %. Si c'est plus bas, tu surestimes ce que tu sais : c'est le signal pour te tester davantage plutôt que relire.</div></div>
  <div class="card"><h3 style="margin-top:0">Flashcards à revoir les 7 prochains jours</h3><div class="plan">${next.map(([d, n]) => `<div class="${d === t ? "today" : ""}"><b>${n}</b>${frDate(d)}</div>`).join("")}</div></div>
  <div class="card"><h3 style="margin-top:0">Exemples guidés</h3>${DATA.worked.map(w => `<div class="mast"><span>${w.title}</span><div class="bar"><i style="width:${((S.worked[w.id] || 0) / 3) * 100}%"></i></div><span class="lvl">${(S.worked[w.id] || 0) + 1}/4</span></div>`).join("")}</div>`;
};

/* ---------- Méthodes (science de l'apprentissage) ---------- */
VIEWS.methods = () => { V().innerHTML = METHODS_HTML; };

/* ---------- Réglages ---------- */
VIEWS.settings = () => {
  V().innerHTML = `<div class="card"><h2>Sauvegarde de ta progression</h2>
  <p class="small muted" style="margin-top:0">Ta progression est enregistrée dans ce navigateur. Dans Notion, la page intégrée a sa propre mémoire, distincte de la page ouverte directement. Pour changer d'appareil : copie le code ci-dessous et colle-le de l'autre côté.</p>
  <textarea id="exp" rows="4" style="font-size:12px">${esc(JSON.stringify(S))}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText($('#exp').value);this.textContent='Copié ✓'">Copier</button>
  <button class="btn" onclick="try{S=JSON.parse($('#exp').value);save();go('home')}catch(e){alert('Code invalide')}">Importer le code collé</button></div></div>
  <div class="card"><h2>Recommencer</h2><p class="small muted" style="margin-top:0">Efface toute la progression de cette séance (cartes, scores, plan).</p>
  <button class="btn" style="border-color:var(--ko);color:var(--ko)" onclick="if(confirm('Tout effacer ?')){S=blank();save();go('home')}">Tout effacer</button></div>
  <div class="card small muted">Raccourcis clavier : <span class="kbd">espace</span> retourner une carte · <span class="kbd">1</span>–<span class="kbd">4</span> noter une carte ou choisir une option · <span class="kbd">Entrée</span> valider / continuer.</div>`;
};

/* ================= DÉMARRAGE ================= */
if (DATA.hub && typeof HUB_HOME === "function") VIEWS.home = HUB_HOME;
load();
$("#hKick").textContent = DATA.kicker; $("#hTitle").textContent = DATA.title; $("#hSub").textContent = DATA.sub;
go("home");
</script>
