<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Glucides — le jeu</title>
<link rel="manifest" href="jeu-glucides.webmanifest">
<link rel="apple-touch-icon" href="icons/glucides-180.png">
<link rel="icon" type="image/png" href="icons/glucides-192.png">

<meta name="apple-mobile-web-app-title" content="Glucides jeu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#110f3d">
<style>
:root{--bg:#0f1530;--bg2:#18214a;--carte:#ffffff;--encre:#1b2233;--doux:#6b7385;--bleu:#3b5ff0;--bleu2:#1a3fd6;--or:#f5b82e;--vert:#16a34a;--vert-p:#dcfce7;--rouge:#e5484d;--rouge-p:#fee2e2;--trait:#e6e8ef;--violet:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#110f3d}html,body{margin:0;min-height:100%}
body{background:transparent;color:#fff;font:16px/1.45 -apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;overscroll-behavior:none}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 20px)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
.ic.f{fill:currentColor;stroke:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .logo{width:42px;height:42px;border-radius:12px;background:#fff}
.top h1{font-size:1.15rem;margin:0;flex:1;line-height:1.15}.top h1 small{display:block;font-weight:400;opacity:.7;font-size:.78rem}
.stats{display:flex;gap:8px;margin:6px 0 14px}
.stat{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.stat b{font-size:1.1rem;display:block;line-height:1}.stat span{font-size:.72rem;opacity:.75}
.stat .ic{width:26px;height:26px}
.flamme{color:#ff8a3d}.etoile{color:var(--or)}.eclair{color:#7dd3fc}
.rang{background:linear-gradient(135deg,#3b5ff0,#7c3aed);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.rang .t{display:flex;justify-content:space-between;font-size:.85rem;opacity:.9}
.barre{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:6px}
.barre i{display:block;height:100%;background:linear-gradient(90deg,#fde68a,#f5b82e);border-radius:99px;transition:width .5s}
.obj{margin-top:8px;font-size:.8rem;opacity:.9;display:flex;gap:6px;align-items:center}
.sect{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:18px 4px 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--carte);color:var(--encre);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mode .ic{width:28px;height:28px;color:var(--bleu2)}
.mode b{font-size:.98rem}.mode small{color:var(--doux);font-size:.76rem;line-height:1.25}
.mode.vedette{grid-column:1/-1;background:linear-gradient(135deg,#f5b82e,#ff8a3d);color:#2a1600}
.mode.vedette .ic{color:#2a1600}.mode.vedette small{color:#4a2a00}
.chemin{display:flex;flex-direction:column;gap:10px}
.niv{display:flex;align-items:center;gap:12px;background:var(--carte);color:var(--encre);border-radius:18px;padding:12px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.niv:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.niv .rond{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--bleu);color:#fff;font-weight:800;font-size:1.1rem;flex:none}
.niv.boss .rond{background:var(--violet)}
.niv.fini .rond{background:var(--vert)}
.niv.verrou{opacity:.55}.niv.verrou .rond{background:#9aa1b2}
.niv .tx{flex:1}.niv .tx b{display:block;font-size:.95rem;line-height:1.2}.niv .tx small{color:var(--doux);font-size:.75rem;display:block;line-height:1.25}
.niv .etoiles{display:flex;gap:2px;color:#d7dae3}.niv .etoiles .on{color:var(--or)}
.niv .maitrise{height:5px;background:var(--trait);border-radius:9px;margin-top:5px;overflow:hidden}.niv .maitrise i{display:block;height:100%;background:var(--vert)}
/* écran de jeu */
.jeu{display:none}.jeu.on{display:block}.accueil.off{display:none}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud .quit{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.hud .prog{flex:1;height:14px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.hud .prog i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#16a34a);transition:width .3s}
.coeurs{display:flex;gap:2px;color:var(--rouge)}.coeurs .vide{color:rgba(255,255,255,.25)}
.combo{text-align:center;font-weight:800;color:var(--or);height:22px;font-size:.95rem}
.timer{text-align:center;font-weight:800;font-size:1.3rem;color:#7dd3fc}
.q{background:var(--carte);color:var(--encre);border-radius:22px;padding:18px 16px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.q .type{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--bleu2);font-weight:700;display:flex;gap:6px;align-items:center}
.q h2{font-size:1.12rem;margin:8px 0 12px;line-height:1.3}
.q .struct{display:block;margin:0 auto 10px;max-width:100%;max-height:200px;background:#fff}
.q .struct.petit{max-height:130px}.q .struct.photo{max-height:210px;border-radius:14px;object-fit:cover;width:100%}
.q .grand.moyen{font-size:1.2rem;margin:2px 0 8px}.q .sousg{text-align:center;font-style:italic;opacity:.75;margin:-8px 0 12px;font-size:.85rem}.q .st{opacity:.7;font-size:.85rem;margin:-6px 0 10px}
.reveal .schema{display:block;width:100%;margin-top:10px;border-radius:10px;background:#fff}.hero-t em{display:block;font-style:normal;font-size:.72rem;opacity:.75;letter-spacing:.04em}
.q .grand{font-size:1.5rem;font-weight:800;text-align:center;color:var(--bleu2);margin:6px 0 14px}
.choix{display:grid;gap:9px}
.ch{background:#f4f5f9;border:2px solid var(--trait);border-radius:14px;padding:12px 12px;text-align:left;font-size:.95rem;color:var(--encre);box-shadow:0 3px 0 var(--trait)}
.ch:active{transform:translateY(2px);box-shadow:none}
.ch.ok{background:var(--vert-p);border-color:var(--vert);box-shadow:0 3px 0 var(--vert)}
.ch.ko{background:var(--rouge-p);border-color:var(--rouge);box-shadow:0 3px 0 var(--rouge);animation:shake .35s}
.vf{grid-template-columns:1fr 1fr}.vf .ch{text-align:center;font-weight:700;font-size:1.05rem}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;border-radius:14px;padding:12px;font-size:.9rem;display:none}
.fb.on{display:block}.fb.ok{background:var(--vert-p);color:#14532d}.fb.ko{background:var(--rouge-p);color:#7f1d1d}
.fb b{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.suite{width:100%;margin-top:14px;background:var(--bleu);color:#fff;border-radius:16px;padding:14px;font-weight:800;font-size:1.02rem;box-shadow:0 5px 0 var(--bleu2);display:none}
.suite.on{display:block}.suite:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bleu2)}
.reveal{background:#f4f5f9;border-radius:14px;padding:12px;margin-top:10px;display:none;font-size:.93rem}
.reveal.on{display:block}
.auto{display:none;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.auto.on{display:grid}
.auto button{border-radius:14px;padding:12px 6px;font-weight:700;font-size:.85rem;color:#fff}
.auto .a1{background:var(--rouge)}.auto .a2{background:#f59e0b}.auto .a3{background:var(--vert)}
.voir{width:100%;margin-top:12px;background:var(--encre);color:#fff;border-radius:14px;padding:12px;font-weight:700}
canvas.dessin{width:100%;height:260px;background:#fff;border:2px dashed #c7cbd8;border-radius:14px;touch-action:none;display:block}
.outils{display:flex;gap:8px;margin-top:6px}.outils button{flex:1;background:#eef0f6;color:var(--encre);border-radius:10px;padding:8px;font-size:.85rem}
.paire{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paire button{background:#f4f5f9;border:2px solid var(--trait);border-radius:12px;padding:10px 8px;font-size:.85rem;color:var(--encre);min-height:52px}
.paire button.sel{border-color:var(--bleu);background:#e7ecfd}
.paire button.fait{visibility:hidden}
.paire button.ko{border-color:var(--rouge);animation:shake .35s}
/* fin */
.fin{text-align:center;padding:10px 0}
.fin .grosse{font-size:2.4rem;font-weight:900;margin:6px 0}
.fin .etoiles{display:flex;justify-content:center;gap:6px;color:rgba(255,255,255,.25)}.fin .etoiles .on{color:var(--or)}
.fin .etoiles .ic{width:46px;height:46px}
.gains{display:flex;gap:10px;justify-content:center;margin:14px 0}
.gains div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 14px}
.gains b{display:block;font-size:1.3rem}
.erreurs{background:var(--carte);color:var(--encre);border-radius:16px;padding:12px;text-align:left;margin-top:10px;font-size:.88rem}
.erreurs li{margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-120px);background:#fff;color:var(--encre);border-radius:16px;padding:10px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .35s;z-index:9;display:flex;gap:8px;align-items:center;max-width:92%}
.toast.on{transform:translateX(-50%) translateY(0)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:rgba(255,255,255,.07);border-radius:14px;padding:8px 4px;text-align:center;font-size:.66rem;opacity:.45}
.badge.on{opacity:1;background:rgba(245,184,46,.18)}
.badge .ic{width:26px;height:26px;color:var(--or);display:block;margin:0 auto 4px}
.note{font-size:.75rem;opacity:.6;text-align:center;margin-top:18px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:8}

.atl{background:#fff;border-radius:16px;margin:0 -4px}
.atl-barre{display:flex;gap:4px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.atl-barre::-webkit-scrollbar{display:none}
.atl-o{flex:1 0 auto;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:12px;background:#f1f3f8;color:#1b2233;font-size:.62rem}
.atl-o .ic{width:22px;height:22px}.atl-o.on{background:#1a3fd6;color:#fff}
.atl-b2{justify-content:space-between;align-items:center}
.atl-coul{display:flex;gap:6px}.atl-c{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #d4d8e3}.atl-c.on{box-shadow:0 0 0 3px #1a3fd6}
.atl-taille{display:flex;gap:4px}.atl-t{width:34px;height:34px;border-radius:10px;background:#f1f3f8;display:grid;place-items:center}.atl-t i{display:block;border-radius:50%;background:#1b2233}.atl-t.on{background:#dbe3ff}
.atl-atomes{display:none;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding:4px 2px;scrollbar-width:none}.atl-atomes::-webkit-scrollbar{display:none}.atl-atomes.on{display:flex}
.atl-atomes button{flex:none;min-width:40px;padding:7px 8px;border-radius:10px;background:#f1f3f8;color:#1b2233;font-weight:700;font-size:.9rem}.atl-atomes button.on{background:#1a3fd6;color:#fff}
.atl-zone{position:relative;overflow:hidden;border-radius:14px}
.atl canvas{display:block;width:100%;height:56vh;max-height:520px;min-height:300px;background:#fff;border:2px solid #e3e6ee;border-radius:14px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.atl-aide{position:absolute;left:8px;right:8px;bottom:6px;font-size:.7rem;color:#8a91a3;pointer-events:none;text-align:center}
.atl-b3 button{flex:1;display:flex;gap:4px;align-items:center;justify-content:center;padding:9px 6px;border-radius:12px;background:#f1f3f8;color:#1b2233;font-size:.78rem}
.atl-b3 .atl-voir{background:#1b2233;color:#fff;font-weight:700;flex:1.6}
.atl.plein{position:fixed;inset:0;z-index:20;border-radius:0;margin:0;padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;flex-direction:column}
.atl.plein .atl-zone{flex:1;display:flex}.atl.plein canvas{height:auto;flex:1;max-height:none}
body.sans-scroll{overflow:hidden}
@media (min-width:700px){.atl canvas{height:62vh;max-height:none}}


.atl-calque{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);max-width:80%;max-height:70%;opacity:0;pointer-events:none;mix-blend-mode:multiply;touch-action:none;-webkit-user-drag:none;user-select:none;transform-origin:center}
.atl-calque.on{pointer-events:auto;cursor:move;outline:2px dashed rgba(59,95,240,.55);outline-offset:4px;border-radius:6px}
.atl-feuille{position:absolute;left:6px;right:6px;bottom:6px;background:#fff;border-radius:16px;box-shadow:0 -6px 30px rgba(15,21,48,.25);padding:10px;transform:translateY(calc(100% + 12px));opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;pointer-events:none;max-height:72%;display:flex;flex-direction:column}
.atl-feuille.mini .atl-f-corps{display:none}
.atl-ajust{display:none;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.atl-feuille.mini .atl-ajust{display:flex}
.atl-ajust button{min-width:40px;background:#f1f3f8;color:#1b2233;border-radius:10px;padding:8px 10px;font-weight:700}
.atl-ajust label{flex:1;display:flex;gap:6px;align-items:center;font-size:.72rem;color:#5d6577;min-width:150px}.atl-ajust input{flex:1}
.atl-feuille.on{transform:none;opacity:1;pointer-events:auto}
.atl-f-tete{display:flex;gap:6px;align-items:center;color:#1b2233}.atl-f-tete b{flex:1}
.atl-f-tete button{background:#f1f3f8;color:#1b2233;border-radius:10px;padding:6px 10px;font-size:.8rem}.atl-f-tete button.on{background:#1a3fd6;color:#fff}
.atl-f-corps{overflow:auto;min-height:0;flex:1;text-align:center}.atl-f-corps img{max-width:100%;max-height:30vh;display:block;margin:4px auto}.atl-f-corps p{margin:4px 0;font-size:.82rem;color:#5d6577}
.atl-note{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.atl-note button{border-radius:12px;padding:11px 4px;font-weight:700;font-size:.85rem;color:#fff}
.atl-note .a1{background:#e5484d}.atl-note .a2{background:#f59e0b}.atl-note .a3{background:#16a34a}
.atl-suite{display:none;margin-top:8px;background:#1a3fd6;color:#fff;border-radius:12px;padding:12px;font-weight:800;box-shadow:0 4px 0 #12309e}.atl-suite.on{display:block}

/* ===== monde : chambre de nuit ===== */
.ciel{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(130% 70% at 50% 0%,#2c3192 0%,#1b1960 42%,#110f3d 100%);overflow:hidden}
.ciel::before{content:"";position:absolute;inset:-60px;background:url(decor/foret.jpg) center/cover;filter:blur(26px) saturate(1.3);opacity:.32}
.ciel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,15,61,0) 0%,rgba(17,15,61,.55) 70%,rgba(17,15,61,.85) 100%)}
.ciel i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(255,214,107,.55);opacity:0;animation:luciole 9s ease-in-out infinite;z-index:1}
@keyframes luciole{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}50%{transform:translate(18px,-40px)}80%{opacity:.7}100%{opacity:0;transform:translate(-10px,-90px)}}
.app{position:relative;z-index:1}
.hero{position:relative;margin:calc(-1*(env(safe-area-inset-top) + 10px)) -14px 0;height:calc(42vh + env(safe-area-inset-top));min-height:250px;max-height:440px}
.hero-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 62%,transparent 100%)}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(180deg,rgba(17,15,61,.7),rgba(17,15,61,0));z-index:1;pointer-events:none}
.hero-haut{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 12px);display:flex;align-items:center;gap:10px;z-index:2}
.hero-haut .logo{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.hero-t{flex:1;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.5)}.hero-t small{display:block;font-size:.8rem;opacity:.9}.hero-t b{font-size:1.3rem}
.rond-btn{width:40px;height:40px;border-radius:50%;background:rgba(17,15,61,.45);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center}
.guir{position:absolute;left:0;right:0;bottom:-4px;width:100%;height:auto;z-index:2;overflow:visible}
.guir .fil{fill:none;stroke:rgba(20,18,60,.9);stroke-width:1.6}
.guir .ampoule{fill:#3a3f7a;stroke:rgba(255,255,255,.15);stroke-width:.6}
.guir .ampoule.on{fill:#ffd66b;stroke:#fff3c4;filter:drop-shadow(0 0 4px #ffd66b) drop-shadow(0 0 9px rgba(255,190,80,.8));animation:scint 3s ease-in-out infinite}
@keyframes scint{0%,100%{opacity:1}50%{opacity:.55}}
.lum{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.78rem;color:#ffe9a8;margin:4px 0 10px;text-shadow:0 0 12px rgba(255,214,107,.5)}
.stat,.mode,.niv,.rang{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14)}
.rang{background:linear-gradient(135deg,rgba(109,124,255,.5),rgba(176,108,255,.42));border:1px solid rgba(255,255,255,.18);display:flex;gap:12px;align-items:center}
.rang .rg{flex:1}
.anneau{width:56px;height:56px;flex:none;position:relative}.anneau>svg{width:56px;height:56px;transform:rotate(-90deg)}
.anneau b .ic{width:26px;height:26px;vertical-align:0;color:#ffd66b;stroke-width:3}
.anneau circle{fill:none;stroke-width:6}.anneau .f{stroke:rgba(255,255,255,.18)}.anneau .p{stroke:#ffd66b;stroke-linecap:round;transition:stroke-dashoffset .8s}
.anneau b{position:absolute;inset:0;display:grid;place-items:center;font-size:.7rem;line-height:1.05;text-align:center}
.go{display:flex;align-items:center;gap:12px;width:100%;background:linear-gradient(135deg,#ffd66b,#ff9fb8);color:#2b1340;border-radius:20px;padding:13px 14px;box-shadow:0 6px 0 #b9577a,0 0 34px rgba(255,190,120,.35);text-align:left;margin:12px 0 2px}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #b9577a}
.go .r{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;animation:respire 2.4s ease-in-out infinite;color:#b9577a}
.go .r .ic{width:22px;height:22px;fill:currentColor}
.go small{display:block;font-size:.75rem;opacity:.8}.go b{font-size:1.05rem}
@keyframes respire{50%{transform:scale(1.08);box-shadow:0 0 22px rgba(255,255,255,.7)}}
.mode{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.13);box-shadow:0 6px 0 rgba(5,4,30,.35)}
.mode .ic{color:#b3c0ff}.mode small{color:rgba(255,255,255,.68)}
.mode.vedette{background:linear-gradient(135deg,rgba(109,124,255,.85),rgba(176,108,255,.8));color:#fff}
.mode.vedette .ic{color:#fff}.mode.vedette small{color:rgba(255,255,255,.88)}
.chemin{position:relative}
.chemin::before{content:"";position:absolute;left:35px;top:24px;bottom:24px;border-left:3px dotted rgba(255,214,107,.4)}
.niv{position:relative;background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.13);box-shadow:0 6px 0 rgba(5,4,30,.35)}

inal (lié comme dans le saccharose) + chaîne de **β-D-fructofuranoses liés β(2→1)** (fragment représentatif, * = suite).", "lv": 3, "li": "Fru β2→1 + Glc terminal"}, {"id": "dextrane", "nom": "Dextranes", "sc": "Polysaccharides homogènes — glucanes microbiens", "cl": "Glucides", "img": "mol/dextrane.svg", "dessin": false, "niv": "commenter", "sol": "H₂O", "rx": "NON", "rxn": "Liaison(s) osidique(s) (acétal) : hydrolyse seulement à chaud en milieu acide ou par enzyme → NON sans chauffage.", "usage": "Succédané du plasma (PM 60–70 000), expandeur de volume (PM 40 000), dextran 1 000 (protection haptènique anti-anaphylaxie) ; larmes artificielles.", "ori": "Leuconostoc mesenteroides sur saccharose", "prop": "Non hydrolysables dans l'organisme ; propriétés selon le PM.", "tox": "", "struct": "Fragment représentatif : α-D-glucoses liés **α(1→6)** (+ un peu α(1→3)).", "lv": 3, "li": "Glc α1→6 (ramifications α1→3)"}, {"id": "lentinane", "nom": "Lentinane (glucane β-1,3)", "sc": "Polysaccharides homogènes — glucanes de champignons", "cl": "Glucides", "img": "mol/lentinane.svg", "dessin": false, "niv": "commenter", "sol": "H₂O", "rx": "NON", "rxn": "Liaison(s) osidique(s) (acétal) : hydrolyse seulement à chaud en milieu acide ou par enzyme → NON sans chauffage.", "usage": "Soutien immunitaire des cancéreux (cancer gastrique) ; compléments « anti-grippe » (glucanes de levure).", "ori": "Lentinus edodes (shiitake)", "prop": "Immunostimulant (études au Japon).", "tox": "", "struct": "Fragment représentatif : chaîne de glucoses **β(1→3)** substituée par des glucoses **β(1→6)**.", "lv": 3, "li": "Glc β1→3 ramifié en β1→6"}, {"id": "chitine", "nom": "Chitine", "sc": "Polysaccharides aminés homogènes", "cl": "Glucides", "img": "mol/chitine.svg", "dessin": false, "niv": "commenter", "sol": "H₂O", "rx": "NON", "rxn": "Amide non basique → pas de sel avec HCl à froid ; désacétylation = NaOH + chauffage.", "usage": "Préparation du chitosane et de la glucosamine ; pansements, fils de sut ronique + guluronique (1→4)"}, {"id": "agar", "nom": "Agar (gélose)", "sc": "Polysaccharides hétérogènes — algues rouges", "cl": "Glucides", "img": "mol/agar.svg", "dessin": false, "niv": "commenter", "sol": "H₂O", "rx": "NON", "rxn": "Soluble dans l'eau chaude seulement (gel au refroidissement) ; pas de réaction acide-base à froid.", "usage": "Milieux de culture bactériologique, gels d'électrophorèse, laxatif mécanique, pansement gastro-intestinal, texturant E406, remplace la gélatine.", "ori": "Algues rouges : Gelidium, Gracilaria", "prop": "Gel épais et résistant, non assimilable, infermentescible, non toxique.", "tox": "", "struct": "Fragment représentatif (agarose) : **β-D-galactose (1→4) 3,6-anhydro-α-L-galactose (1→3)** ; + un peu d'acide galacturonique et quelques O-SO3H.", "lv": 4, "li": "Galactose + 3,6-anhydrogalactose"}, {"id": "carraghenane", "nom": "Carraghénanes", "sc": "Polysaccharides hétérogènes — algues rouges", "cl": "Glucides", "img": "mol/carraghenane.svg", "dessin": false, "niv": "commenter", "sol": "H₂O", "rx": "OUI + NaOH", "rxn": "Groupes sulfate très acides → déjà sous forme de sels ; neutralisés par NaOH.", "usage": "Gélifiants/épaississants alimentaires (E407).", "ori": "Algues rouges : Chondrus crispus (carragheen), Gigartina", "prop": "Laxatifs mécaniques, protecteurs de la muqueuse gastrique, propriétés anticoagulantes (comme l'héparine).", "tox": "Troubles gastro-intestinaux chez certaines personnes.", "struct": "Fragment représentatif (type κ) : **galactose-4-sulfate β(1→4) 3,6-anhydrogalactose** ; voisins de l'agar mais **plus riches en O-SO3H**.", "lv": 4, "li": "Galactanes sulfatés"}, {"id": "gomme-arabique", "nom": "Gommes (gomme arabique, adragante, Sterculia)", "sc": "Polysaccharides hétérogènes — végétaux supérieurs", "cl": "Glucides", "img": "", "dessin": false, "niv": "commenter", "sol": "H₂O", "rx": "OUI + NaOH", "rxn": "COOH des acides uroniques → sels avec NaOH.", "usage": "Gélifiants, épaississants, laxatifs de lest (St lé** (ester méthylique) ; rhamnose intercalé (coudes) et ramifications (galactose, arabinose).", "lv": 4, "li": "Acide galacturonique α1→4 (+ coudes de rhamnose)"}, {"id": "xanthane", "nom": "« Gomme » xanthane", "sc": "Polysaccharides hétérogènes — origine bactérienne", "cl": "Glucides", "img": "", "dessin": false, "niv": "commenter", "sol": "H₂O", "rx": "OUI + NaOH", "rxn": "Caractère anionique (2 COOH) → sels avec NaOH.", "usage": "Stabilisant/gélifiant de 1er choix des suspensions et émulsions (E415).", "ori": "Bactérie Xanthomonas campestris (fermentation sur amidon/glucose/saccharose)", "prop": "Rhéologie stable de pH 3 à 10, résiste à la chaleur, pseudoplasticité remarquable, compatible, non dégradée par les enzymes, sans goût.", "tox": "", "struct": "Pas de structure à dessiner : chaîne de **glucoses β(1→4)** (type cellulose) portant tous les 2 glucoses un branchement **triosidique** mannose (acétylé) – **acide glucuronique** – mannose (± acide pyruvique) → unité pentasaccharidique anionique.", "lv": 4, "li": "Glc β1→4 + chaînes latérales Man–GlcA–Man"}, {"id": "acide-hyaluronique", "nom": "Acide hyaluronique (hyaluronane)", "sc": "Polysaccharides aminés hétérogènes — GAG", "cl": "Glucides", "img": "mol/acide-hyaluronique.svg", "dessin": false, "niv": "commenter", "sol": "H₂O", "rx": "OUI + NaOH", "rxn": "COOH → hyaluronate de sodium avec NaOH.", "usage": "Chirurgie ophtalmique, collyres (yeux secs), injections intra-articulaires (arthrose du genou), comblement des rides, vétérinaire.", "ori": "Humeur vitrée, liquide synovial, tissus conjonctifs", "prop": "Lubrifiant, amortisseur de chocs, hydratant ; viscosité ∝ longueur des chaînes.", "tox": "", "struct": "Fragment représentatif : **acide D-glucuronique β(1→3) N-acétyl-D-glucosamine**, unités reliées **β(1→4)** (alternance β1-3/β1-4).", "lv": 4, "li": "Acide glucuronique + N-acétylglucosamine (β1→3 / β1→4)"}, {"id": "chondroitine-sulfate", "nom": "Chondroïtine sulfate", "sc": "Polysaccharides aminés hétérogènes — GAG", "cl": "Glucides", "img": "mol/chondroitine-sulfate.svg", "dessin": false, "niv": "commenter", "sol": "H₂O", "rx": "OUI + NaOH", "rxn": "COOH et sulfate acides → sels avec NaOH.", "usage": "Anti-arthrosique symptomatique à action lente (complément alimentaire) ; larmes artificielles.", "ori": "Cartilage de mammifères (traitement à la papaïne)", "prop": "Chondroprotecteur : maintient la pression osmotique et l'hydratation du cartilage ; peu absorbé.", "tox": "", "struct": "Fragment représentatif : **acide glucuronique β(1→3) N-acétylgalactosamine-4-sulfate**, unités reliées β(1→4) ; sulfate en position variable.", "lv": 4, "li": "Acide glucuronique + N-acétylgalactosamine sulfatée"}, {"id": "heparine", "nom": "Héparines", "sc": "Polysaccharides aminés hétérogènes — GAG", "cl": "Glucides", "img": "mol/heparine.svg", "dessin": false, "niv": "commenter", "sol": "H₂O", "rx": "OUI + NaOH", "rxn": "Très acides → utilisées sous forme de sels de Na ou Ca ; N-sulfate non basique → pas de réaction avec HCl.", "usage": "Traitement/prévention de la thrombose veineuse et de l'embolie pulmonaire, cardiopathie ischémique ; HBPM en SC ; anticoagulant in vitro.", "ori": "Poumons de bœuf, muqueuse intestinale de porc, bœuf, mouton (extraction alcaline)", "prop": "Anticoagulant : complexe héparine–antithrombine–thrombine ; séquence pentasaccharidique (glucosamine 3-O-sulfatée) active l'antithrombine (anti-Xa).", "tox": "Hémorragie (antidote : protamine), thrombopénie ; contrôle Ph. Eur. de l'absence de chondroïtine persulfatée.", "struct": "Unité disaccharidique la plus fréquente : **acide L-iduronique-2-O-sulfate α(1→4) D-glucosamine-N-sulfate-6-O-sulfate** (trisulfatée) ; liaisons (1→4).", "lv": 4, "li": "Acide iduronique sulfaté + glucosamine sulfatée"}], "q": [{"id": "ch1-q01", "q": "Le D-galactose est l'épimère du D-glucose en :", "c": ["C2", "C5", "C3", "C4"], "r": "C4", "x": "Mannose = épimère en C2 ; galactose = en C4.", "lv": 0}, {"id": "ch1-q02", "q": "Le D-mannose est l'épimère du D-glucose en :", "c": ["C2", "C4", "C1", "C6"], "r": "C2", "x": "Ne pas confondre avec le maltose (disaccharide).", "lv": 0}, {"id": "ch1-q03", "q": "Le suffixe IUPAC « -ulose » désigne :", "c": ["un cétose", "un acide uronique", "un aldose", "un polyol"], "r": "un cétose", "x": "Ex. tagatose = galactulose.", "lv": 0}, {"id": "ch1-q04", "q": "Un cycle pyranique contient :", "c": ["5 C et 2 O", "5 C et 1 O", "4 C et 1 O", "6 C et 1 O"], "r": "5 C et 1 O", "x": "Furanique = 4 C + 1 O.", "lv": 0}, {"id": "ch1-q05", "q": "En passant de Fischer à Haworth, un OH à droite se retrouve :", "c": ["cela dépend de l'anomère", "en dessous du plan", "dans le plan", "au-dessus du plan"], "r": "en dessous du plan", "x": "Droite = dessous.", "lv": 0}, {"id": "ch1-q06", "q": "Le tagatose est l'épimère en C4 du :", "c": ["mannose", "glucose", "galactose", "fructose"], "r": "fructose", "x": "C'est un cétohexose (galactulose).", "lv": 0}, {"id": "ch1-q07", "q": "Le L-rhamnose est :", "c": ["un 6-désoxy-L-mannose", "un 2-désoxy-D-ribose", "un 6-désoxy-L-galactose", "un acide uronique"], "r": "un 6-désoxy-L-mannose", "x": "Le fucose est le 6-désoxy-L-galactose.", "lv": 1}, {"id": "ch1-q08", "q": "L'acide gluconique résulte de l'oxydation :", "c": ["de l'alcool primaire (C6) du glucose", "du carbonyle (C1) du glucose", "du sorbitol", "du C2 du fructose"], "r": "du carbonyle (C1) du glucose", "x": "L'oxydation du C6 donne l'acide glucuronique.", "lv": 0}, {"id": "ch1-q09", "q": "Les 2,6-didésoxyhexoses sont spécifiques :", "c": ["des gommes", "des pectines", "des acides nucléiques", "des hétérosides cardiotoniques"], "r": "des hétérosides cardiotoniques", "x": "Ex. digitoxose.", "lv": 0}, {"id": "ch1-q10", "q": "Quel polyol n'est PAS naturel ?", "c": ["Mannitol", "Xylitol", "Aucun, tous sont naturels", "Sorbitol"], "r": "Xylitol", "x": "Le xylitol est obtenu par réduction du xylose.", "lv": 1}, {"id": "ch1-q11", "q": "Le mannitol en perfusion est utilisé comme :", "c": ["laxatif de lest", "diurétique osmotique", "anticoagulant", "succédané du plasma"], "r": "diurétique osmotique", "x": "Œdèmes, exploration rénale.", "lv": 1}, {"id": "ch1-q12", "q": "Le D-sorbitol est préparé industriellement par :", "c": ["réduction du xylose", "épimérisation puis réduction du glucose", "hydrolyse de l'inuline", "réduction du D-glucose"], "r": "réduction du D-glucose", "x": "Le mannitol nécessite une épimérisation préalable.", "lv": 0}, {"id": "ch1-q13", "q": "La glucosamine est obtenue par hydrolyse de :", "c": ["la chitine", "la cellulose", "l'amidon", "l'acide hyaluronique"], "r": "la chitine", "x": "Carapaces de crustacés, insectes, champignons.", "lv": 3}, {"id": "ch1-q14", "q": "Le caractère réducteur de la vitamine C est dû à :", "c": ["son ène-diol", "sa lactone", "son alcool primaire", "son cycle pyranique"], "r": "son ène-diol", "x": "L'ène-diol s'oxyde en acide déhydroascorbique.", "lv": 0}, {"id": "ch1-q15", "q": "La vitamine C est indispensable à l'hydroxylation de :", "c": ["la glucosamine", "la tyrosine", "l'acide gallique", "la proline (collagène)"], "r": "la proline (collagène)", "x": "D'où son rôle dans le collagène et la cicatrisation.", "lv": 1}, {"id": "ch1-q16", "q": "Le saccharose est :", "c": ["α-D-glucopyranosyl-(1→4)-D-glucopyranose", "α-D-glucopyranosyl-(1→2)-β-D-fructofuranoside", "β-D-galactopyranosyl-(1→4)-D-glucopyranose", "α-D-glucopyranosyl-(1→6)-D-glucopyranose"], "r": "α-D-glucopyranosyl-(1→2)-β-D-fructofuranoside", "x": "Liaison entre les deux C anomériques → non réducteur.", "lv": 0}, {"id": "ch1-q17", "q": "Lequel est un disaccharide NON réducteur ?", "c": ["Lactulose", "Maltose", "Lactose", "Saccharose"], "r": "Saccharose", "x": "Les deux OH hémiacétaliques sont engagés.", "lv": 2}, {"id": "ch1-q18", "q": "Le sucre inverti est :", "c": ["lévogyre", "optiquement inactif", "dextrogyre", "non réducteur"], "r": "lévogyre", "x": "Le fructose (−92°) l'emporte sur le glucose (+52,5°).", "lv": 2}, {"id": "ch1-q19", "q": "Le lactose est composé de :", "c": ["galactose β(1→4) fructose", "glucose α(1→4) glucose", "galactose β(1→4) glucose", "glucose α(1→2) fructose"], "r": "galactose β(1→4) glucose", "x": "Galactose–fructose = lactulose.", "lv": 0}, {"id": "ch1-q20", "q": "Le lactitol est formé de :", "c": ["galactose + fructose", "lactose + mannitol", "galactose + sorbitol", "glucose + sorbitol"], "r": "galactose + sorbitol", "x": "-itol = polyol.", "lv": 0}, {"id": "ch1-q21", "q": "Le lactulose est utilisé dans l'encéphalopathie hépatique car il :", "c": ["inhibe les α-glucosidases", "chélate le cuivre", "acidifie le côlon et piège NH3 en NH4+", "est absorbé dans le grêle"], "r": "acidifie le côlon et piège NH3 en NH4+", "x": "Fermenté en acides lactique et acétique.", "lv": 2}, {"id": "ch1-q22", "q": "Les flatulences après les légumes secs sont dues aux :", "c": ["fructo-oligosaccharides", "cyclodextrines", "galacto-oligosaccharides (raffinose…)", "maltodextrines"], "r": "galacto-oligosaccharides (raffinose…)", "x": "Fermentés par Clostridia.", "lv": 2}, {"id": "ch1-q23", "q": "La β-cyclodextrine contient :", "c": ["7 glucoses", "8 glucoses", "6 glucoses", "7 fructoses"], "r": "7 glucoses", "x": "α = 6, β = 7, γ = 8.", "lv": 0}, {"id": "ch1-q24", "q": "L'intérieur de la cavité des cyclodextrines est :", "c": ["chargé positivement", "hydrophile", "chargé négativement", "hydrophobe"], "r": "hydrophobe", "x": "Les OH sont à l'extérieur.", "lv": 2}, {"id": "ch1-q25", "q": "L'acarbose agit en :", "c": ["inhibant les α-glucosidases intestinales", "stimulant la sécrétion d'insuline", "bloquant les amylases salivaires uniquement", "augmentant la glycogénogenèse"], "r": "inhibant les α-glucosidases intestinales", "x": "Réduction de la résorption des glucides.", "lv": 2}, {"id": "ch1-q26", "q": "Chez un patient sous acarbose en hypoglycémie, il faut donner :", "c": ["du glucose oral", "du pain", "du lactose", "du saccharose"], "r": "du glucose oral", "x": "Seul le monosaccharide est résorbé.", "lv": 2}, {"id": "ch1-q27", "q": "L'amylopectine se distingue de l'amylose par :", "c": ["des branchements α(1→6)", "des unités fructose", "des liaisons β(1→4)", "l'absence de liaisons α(1→4)"], "r": "des branchements α(1→6)", "x": "Chaînes α(1→4) reliées par α(1→6).", "lv": 3}, {"id": "ch1-q28", "q": "La cellulose est un polymère de :", "c": ["N-acétylglucosamine β(1→4)", "fructose β(2→1)", "glucose β(1→4)", "glucose α(1→4)"], "r": "glucose β(1→4)", "x": "La chitine est le polymère de N-acétylglucosamine.", "lv": 0}, {"id": "ch1-q29", "q": "L'inuline est un polymère de fructose lié :", "c": ["α(1→6)", "β(1→3)", "β(2→1)", "α(1→4)"], "r": "β(2→1)", "x": "Avec un glucose terminal ; source : chicorée.", "lv": 0}, {"id": "ch1-q30", "q": "Les dextranes de PM 60–70 000 servent de :", "c": ["anticoagulants", "excipients de comprimés", "succédanés du plasma", "laxatifs"], "r": "succédanés du plasma", "x": "Viscosité proche de celle du plasma.", "lv": 3}, {"id": "ch1-q31", "q": "Le lentinane est :", "c": ["un glucane β(1→3) de champignon immunostimulant", "un galactomannane de guar", "un GAG animal", "un fructane de chicorée"], "r": "un glucane β(1→3) de champignon immunostimulant", "x": "Lentinus edodes.", "lv": 3}, {"id": "ch1-q32", "q": "L'acide alginique est composé :", "c": ["d'acide galacturonique méthylé", "de galactose et 3,6-anhydrogalactose", "de glucose et mannose", "d'acides mannuronique et guluronique"], "r": "d'acides mannuronique et guluronique", "x": "Uniquement d'acides uroniques.", "lv": 0}, {"id": "ch1-q33", "q": "L'alginate de calcium est utilisé comme :", "c": ["ouate hémostatique", "succédané du plasma", "édulcorant", "anticoagulant"], "r": "ouate hémostatique", "x": "Propriétés antihémorragiques.", "lv": 4}, {"id": "ch1-q34", "q": "L'agar est extrait :", "c": ["d'une bactérie", "d'algues rouges (Gelidium, Gracilaria)", "de graines de Fabaceae", "d'algues brunes (Fucus)"], "r": "d'algues rouges (Gelidium, Gracilaria)", "x": "Les alginates viennent des algues brunes.", "lv": 4}, {"id": "ch1-q35", "q": "Les carraghénanes se distinguent de l'agar par :", "c": ["plus de groupements O-SO3H", "la présence d'acide mannuronique", "une origine bactérienne", "l'absence de galactose"], "r": "plus de groupements O-SO3H", "x": "D'où leurs propriétés anticoagulantes.", "lv": 4}, {"id": "ch1-q36", "q": "Laquelle est une gomme VRAIE ?", "c": ["Gomme arabique", "Gomme xanthane", "Gomme guar", "Gomme de caroube"], "r": "Gomme arabique", "x": "Exsudat d'Acacia senegal.", "lv": 4}, {"id": "ch1-q37", "q": "La « gomme » guar est obtenue :", "c": ["par extraction d'algues", "par fermentation bactérienne", "par incision du tronc", "par broyage de l'albumen des graines"], "r": "par broyage de l'albumen des graines", "x": "C'est un mucilage neutre (galactomannane).", "lv": 4}, {"id": "ch1-q38", "q": "Les graines d'ispaghul contiennent surtout :", "c": ["un galactomannane neutre", "de l'inuline", "de l'agar", "un mucilage acide"], "r": "un mucilage acide", "x": "Oses + acide galacturonique ; laxatif de lest.", "lv": 4}, {"id": "ch1-q39", "q": "La chaîne principale des pectines est faite de :", "c": ["glucose β(1→4)", "acide D-galacturonique α(1→4)", "mannose β(1→4)", "acide D-glucuronique β(1→3)"], "r": "acide D-galacturonique α(1→4)", "x": "Plus ou moins méthylée, avec rhamnose intercalé.", "lv": 1}, {"id": "ch1-q40", "q": "La gomme xanthane est produite par :", "c": ["Actinoplanes utahensis", "Bacillus macerans", "Leuconostoc mesenteroides", "Xanthomonas campestris"], "r": "Xanthomonas campestris", "x": "Leuconostoc → dextranes ; Actinoplanes → acarbose ; Bacillus → cyclodextrines.", "lv": 4}, {"id": "ch1-q41", "q": "Laquelle n'est PAS une fibre alimentaire ?", "c": ["Lignine", "Inuline", "Pectines", "Amidon"], "r": "Amidon", "x": "Les fibres sont les polysaccharides autres que les glucanes α(1→4) (+ lignine).", "lv": 3}, {"id": "ch1-q42", "q": "La lignine est :", "c": ["un polymère d'acide galacturonique", "un fructane", "un polysaccharide de xylose", "un polymère de phénylpropènes"], "r": "un polymère de phénylpropènes", "x": "Non glucidique, fibre insoluble.", "lv": 1}, {"id": "ch1-q43", "q": "Le chitosane est cationique en milieu acide car :", "c": ["il contient des acides uroniques", "il porte des sulfates", "il est méthylé", "ses NH2 libres se protonent"], "r": "ses NH2 libres se protonent", "x": "Obtenu par désacétylation de la chitine.", "lv": 1}, {"id": "ch1-q44", "q": "L'acide hyaluronique est composé de :", "c": ["acide glucuronique + N-acétylglucosamine", "N-acétylglucosamine seule", "acide glucuronique + N-acétylgalactosamine sulfatée", "acide iduronique + glucosamine sulfatée"], "r": "acide glucuronique + N-acétylglucosamine", "x": "Respectivement : héparine, chondroïtine, chitine pour les autres.", "lv": 1}, {"id": "ch1-q45", "q": "L'antidote de l'héparine est :", "c": ["la protamine", "la vitamine K", "l'acide tranexamique", "le glucagon"], "r": "la protamine", "x": "Protéine de testicules de saumon.", "lv": 4}, {"id": "ch1-q46", "q": "L'acide iduronique de l'héparine est :", "c": ["l'épimère en C4 de l'acide glucuronique", "un désoxyose", "l'épimère en C5 de l'acide glucuronique", "un polyol"], "r": "l'épimère en C5 de l'acide glucuronique", "x": "Épimère en C4 = acide galacturonique.", "lv": 1}, {"id": "ch1-q47", "q": "Les mucilages neutres sont surtout :", "c": ["des galactomannanes", "des glucanes β(1→3)", "des polymères d'acide galacturonique", "des GAG"], "r": "des galactomannanes", "x": "Galactose + mannose (guar, caroube).", "lv": 4}, {"id": "ch1-q48", "q": "Le fructose libre existe surtout sous forme :", "c": ["linéaire uniquement", "pyranose", "furanose", "lactone"], "r": "pyranose", "x": "Furanose dans les oligo- et polymères (saccharose, inuline).", "lv": 0}, {"id": "mx00", "q": "En projection de Fischer, un ose appartient à la série D quand l'OH du dernier carbone asymétrique (C5 du glucose) est :", "c": ["à droite", "à gauche", "en haut", "absent"], "r": "à droite", "x": "D = OH du dernier C* à droite ; L = à gauche. Les oses naturels sont surtout de la série D. (Matière d'examen)", "lv": 0}, {"id": "mx01", "q": "Dans la forme de Haworth du D-glucopyranose, l'anomère α porte l'OH anomérique (C1) :", "c": ["du côté opposé au CH₂OH (en bas)", "du même côté que le CH₂OH (en haut)", "sur le C5", "sur l'oxygène du cycle"], "r": "du côté opposé au CH₂OH (en bas)", "x": "α = OH du C1 en bas, opposé au CH₂OH ; β = même côté que le CH₂OH. Le passage α ⇄ β par la forme ouverte = mutarotation. (Matière d'examen)", "lv": 0}, {"id": "mx02", "q": "Le D-ribose et le 2-désoxy-D-ribose diffèrent par :", "c": ["l'absence d'OH en C2 du désoxyribose", "un carbone de moins", "une fonction cétone", "une fonction COOH"], "r": "l'absence d'OH en C2 du désoxyribose", "x": "Désoxyose = un OH remplacé par H. Ribose → ARN, ATP ; désoxyribose → ADN. (Matière d'examen)", "lv": 0}, {"id": "mx03", "q": "Le fructose du saccharose et le ribose des acides nucléiques sont sous forme de cycle :", "c": ["furanique (5 atomes)", "pyranique (6 atomes)", "linéaire", "lactone"], "r": "furanique (5 atomes)", "x": "Furanose = 4 C + O (cycle à 5) ; pyranose = 5 C + O (cycle à 6, ex. glucopyranose). (Matière d'examen)", "lv": 0}, {"id": "mx04", "q": "Pourquoi le maltose et le lactose existent-ils en 2 isomères (α et β), mais pas le saccharose ?", "c": ["Leur glucose terminal garde un C anomérique libre ; dans le saccharose, les deux C anomériques sont engagés", "Le saccharose contient du galactose", "Le maltose et le lactose sont des polyols", "Le saccharose n'a pas de liaison osidique"], "r": "Leur glucose terminal garde un C anomérique libre ; dans le saccharose, les deux C anomériques sont engagés", "x": "Saccharose = α-Glc(1→2)β-Fru : non réducteur, pas de mutarotation. Maltose (Glc α1→4 Glc) et lactose (Gal β1→4 Glc) : C1 du glucose libre → réducteurs, α et β. (Matière d'examen)", "lv": 2}, {"id": "mx05", "q": "Rutinose et néohespéridose sont tous deux formés de :", "c": ["rhamnose + glucose", "glucose + fructose", "galactose + glucose", "glucose + glucose"], "r": "rhamnose + glucose", "x": "Ce sont les disaccharides des hétérosides de flavonoïdes (§ Flavonoïdes). (Matière d'examen)", "lv": 2}, {"id": "mx06", "q": "Ce qui distingue la néohespéridose de la rutinose :", "c": ["la liaison Rha α1→2 Glc (hétérosides amers)", "la liaison Rha α1→6 Glc (hétérosides non amers)", "la présence de fructose", "l'absence de liaison osidique"], "r": "la liaison Rha α1→2 Glc (hétérosides amers)", "x": "Rutinose = Rha α1→6 Glc (rutoside, hespéridoside : non amers). Néohespéridose = Rha α1→2 Glc (naringoside : amer). (Matière d'examen)", "lv": 2}, {"id": "mx07", "q": "Par rapport à un sirop de saccharose, le miel contient surtout :", "c": ["du sucre interverti (glucose + fructose libres)", "du lactose", "de l'amidon", "du sorbitol"], "r": "du sucre interverti (glucose + fructose libres)", "x": "L'invertase des abeilles hydrolyse le saccharose : le miel est riche en fructose > glucose, avec un peu de saccharose résiduel. (Matière d'examen)", "lv": 2}, {"id": "mx08", "q": "Un prébiotique est :", "c": ["un substrat non digestible, fermenté sélectivement par la flore colique bénéfique", "un micro-organisme vivant bénéfique", "un antibiotique d'origine végétale", "une enzyme digestive"], "r": "un substrat non digestible, fermenté sélectivement par la flore colique bénéfique", "x": "Ex. : FOS, inuline, lactulose, GOS du lait. Ils stimulent bifidobactéries et lactobacilles. (Matière d'examen)", "lv": 2}, {"id": "mx09", "q": "Un probiotique est :", "c": ["un micro-organisme vivant bénéfique, apporté en quantité suffisante", "un substrat non digestible fermenté par la flore", "un sucre non cariogène", "un polysaccharide d'algue"], "r": "un micro-organisme vivant bénéfique, apporté en quantité suffisante", "x": "Ex. : lactobacilles, bifidobactéries, Saccharomyces boulardii. (Matière d'examen)", "lv": 2}, {"id": "mx10", "q": "Les maltodextrines sont obtenues par :", "c": ["hydrolyse partielle de l'amidon", "cyclisation par une glucosyltransférase bactérienne", "réduction du lactose", "isomérisation du lactose en milieu alcalin"], "r": "hydrolyse partielle de l'amidon", "x": "Chaînes α1→4 courtes (DE < 20) : énergie (nutrition sportive, entérale), excipient, agent de charge. La cyclisation donne les cyclodextrines. (Matière d'examen)", "lv": 2}, {"id": "mx11", "q": "Le coton hydrophile est constitué essentiellement de :", "c": ["cellulose", "amidon", "pectines", "chitine"], "r": "cellulose", "x": "Poils des graines du cotonnier, débarrassés des graisses et blanchis : cellulose presque pure (Glc β1→4), d'où son pouvoir absorbant. (Matière d'examen)", "lv": 3}, {"id": "mx12", "q": "Le lentinane du shiitake est un glucane à liaisons :", "c": ["β(1→3) ramifié en β(1→6)", "α(1→4) ramifié en α(1→6)", "α(1→6)", "β(1→4) linéaire"], "r": "β(1→3) ramifié en β(1→6)", "x": "Glucanes β(1→3) de champignons : immunostimulants. α(1→4)/α(1→6) = amidon ; α(1→6) = dextrane ; β(1→4) = cellulose. (Matière d'examen)", "lv": 3}, {"id": "mx13", "q": "Les glucanes à liaisons β(1→3) des champignons (lentinane…) sont surtout connus pour leur activité :", "c": ["immunostimulante", "anticoagulante", "laxative osmotique", "édulcorante"], "r": "immunostimulante", "x": "Le lentinane (Lentinula edodes) est utilisé comme immunostimulant. (Matière d'examen)", "lv": 3}, {"id": "mx14", "q": "Le gel d'aloès (parenchyme central de la feuille) contient surtout :", "c": ["des polysaccharides (acémannane) hydratants et cicatrisants", "des aloïnes laxatives", "des anthocyanes", "des alcaloïdes"], "r": "des polysaccharides (acémannane) hydratants et cicatrisants", "x": "Ne pas confondre avec le suc (latex) sous l'épiderme, riche en aloïnes (dérivés anthracéniques laxatifs, § Quinones). (Matière d'examen)", "lv": 4}], "c": [{"id": "ch1-001", "t": "Définition", "q": "Différence entre holosides et hétérosides ?", "a": "Holosides : uniquement des oses. Hétérosides : ose(s) + partie non glucidique (aglycone ou génine).", "lv": 0}, {"id": "ch1-002", "t": "Définition", "q": "Qu'est-ce qu'un aglycone (génine) ?", "a": "La partie non glucidique d'un hétéroside.", "lv": 0}, {"id": "ch1-003", "t": "Définition", "q": "Aldose vs cétose : différence et terminaison IUPAC ?", "a": "Aldose : fonction aldéhyde (nom en -ose). Cétose : fonction cétone (nom en -ulose).", "lv": 0}, {"id": "ch1-004", "t": "Définition", "q": "Comment définit-on la série D d'un ose ?", "a": "L'OH porté par le C asymétrique le plus éloigné du carbonyle est orienté à droite en projection de Fischer.", "lv": 0}, {"id": "ch1-005", "t": "Définition", "q": "Quel est le premier ose de la série ?", "a": "Un aldotriose : le glycéraldéhyde.", "lv": 0}, {"id": "ch1-006", "t": "Structure", "q": "Pyranose vs furanose ?", "a": "Pyranose : cycle à 6 (5 C + 1 O ; aldohexoses C1/C5). Furanose : cycle à 5 (4 C + 1 O ; cétohexoses C2/C5).", "lv": 0}, {"id": "ch1-007", "t": "Définition", "q": "Qu'est-ce que le carbone anomérique ?", "a": "Le C du carbonyle devenu hémiacétalique après cyclisation (C1 des aldoses) ; sa configuration différencie les anomères α et β.", "lv": 0}, {"id": "ch1-008", "t": "Structure", "q": "Quand un D-ose cyclique est-il α ?", "a": "Quand l'OH hémiacétalique est du même côté que l'OH déterminant la série D (à droite en Fischer) → en dessous du plan en Haworth.", "lv": 0}, {"id": "ch1-009", "t": "Structure", "q": "Règle Fischer → Haworth ?", "a": "Ce qui est à droite en Fischer passe en dessous du plan ; ce qui est à gauche passe au-dessus.", "lv": 0}, {"id": "ch1-010", "t": "Structure", "q": "Dessine le D-glucose en Fischer et en Haworth (α).", "a": "Fischer : CHO ; C2 OH droite ; C3 OH gauche ; C4 OH droite ; C5 OH droite ; CH2OH. Haworth α : OH en C1 en bas, C2 bas, C3 haut, C4 bas, CH2OH en haut.", "lv": 0}, {"id": "ch1-011", "t": "Structure", "q": "Quels sont les épimères naturels du glucose et sur quel carbone ?", "a": "D-mannose (épimère en C2) et D-galactose (épimère en C4) ; seuls stéréoisomères naturels parmi 16.", "lv": 0}, {"id": "ch1-012", "t": "Structure", "q": "Dessine le D-fructose : quel type d'ose ?", "a": "Cétohexose (C=O en C2) ; furanose (C2–O–C5) dans le saccharose et l'inuline, pyranose à l'état libre.", "lv": 0}, {"id": "ch1-013", "t": "Définition", "q": "Pourquoi le glucose s'appelle-t-il dextrose et le fructose lévulose ?", "a": "Le glucose est dextrogyre, le fructose est lévogyre.", "lv": 0}, {"id": "ch1-014", "t": "Usage", "q": "Comment obtient-on le glucose industriellement ?", "a": "Par hydrolyse enzymatique de l'amidon (il n'est pas extrait des plantes).", "lv": 0}, {"id": "ch1-015", "t": "Usage", "q": "Emplois pharmaceutiques du glucose ?", "a": "Solutions parentérales : apport calorique, traitement des hypoglycémies, véhicule en chirurgie, prévention des déshydratations.", "lv": 0}, {"id": "ch1-016", "t": "Définition", "q": "Pourquoi le glucose est-il le précurseur de tous les métabolites ?", "a": "Il est formé en premier lors de la photosynthèse à partir de CO2 et H2O.", "lv": 0}, {"id": "ch1-017", "t": "Usage", "q": "Intérêts du fructose ?", "a": "Alimentation parentérale ; à l'effort (résorption lente, pas d'insulinosécrétion) ; édulcorant (pouvoir sucrant 1,7) ; régime de certains diabétiques (études contradictoires).", "lv": 0}, {"id": "ch1-018", "t": "Origine", "q": "Comment obtient-on le fructose ?", "a": "Par hydrolyse de l'inuline ou du saccharose.", "lv": 0}, {"id": "ch1-019", "t": "Structure", "q": "Qu'est-ce que le tagatose ?", "a": "Un cétohexose épimère en C4 du fructose (= galactulose).", "lv": 0}, {"id": "ch1-020", "t": "Origine", "q": "Comment prépare-t-on le tagatose ?", "a": "Hydrolyse enzymatique du lactose par une galactosidase d'Aspergillus oryzae (→ glucose + galactose), puis isomérisation du galactose.", "lv": 0}, {"id": "ch1-021", "t": "Usage", "q": "Intérêts du tagatose ?", "a": "Édulcorant inoffensif, prébiotique, peu d'effet sur la glycémie, très peu calorique, non cariogène ; humectant, texturant, épaississant.", "lv": 0}, {"id": "ch1-022", "t": "Structure", "q": "Qu'est-ce qu'un désoxyose ? Exemple principal.", "a": "Ose dont une ou deux fonctions alcool sont réduites ; L-rhamnose = 6-désoxy-L-mannose.", "lv": 1}, {"id": "ch1-023", "t": "Origine", "q": "Où trouve-t-on le fucose ?", "a": "Rare : polymères d'algues et gomme adragante (6-désoxy-L-galactose).", "lv": 4}, {"id": "ch1-024", "t": "Définition", "q": "Quels oses sont spécifiques des hétérosides cardiotoniques ?", "a": "Les éthers méthyliques de 6-désoxyhexoses (thévétose, digitalose) et les 2,6-didésoxyhexoses (digitoxose).", "lv": 0}, {"id": "ch1-025", "t": "Structure", "q": "Qu'est-ce qu'un acide uronique ?", "a": "Un ose dont l'alcool primaire (C6) est oxydé en COOH (acides D-glucuronique et D-galacturonique).", "lv": 1}, {"id": "ch1-026", "t": "Comparaison", "q": "Acide glucuronique vs acide gluconique ?", "a": "Glucuronique : C6 oxydé (COOH), le cycle est conservé. Gluconique : C1 (carbonyle) oxydé en COOH, chaîne ouverte.", "lv": 1}, {"id": "ch1-027", "t": "Origine", "q": "Dans quels polysaccharides trouve-t-on des acides uroniques ?", "a": "Pectines, mucilages acides, gommes (Sterculia), alginates, xanthane, GAG (hyaluronique, chondroïtine, héparine).", "lv": 4}, {"id": "ch1-028", "t": "Origine", "q": "Origine naturelle de l'acide gluconique ?", "a": "Raisin atteint de pourriture grise (Botrytis cinerea) dont la glucose oxydase oxyde le glucose.", "lv": 0}, {"id": "ch1-029", "t": "Usage", "q": "Usage pharmaceutique de l'acide gluconique ?", "a": "Gluconates d'oligo-éléments (Cu, Zn, Mn…).", "lv": 1}, {"id": "ch1-030", "t": "Structure", "q": "Qu'est-ce qu'un polyol ?", "a": "Ose dont le carbonyle est réduit : uniquement des fonctions alcool, pas de forme cyclique.", "lv": 1}, {"id": "ch1-031", "t": "Origine", "q": "Origine naturelle du sorbitol et du mannitol ?", "a": "Sorbitol : fruits du sorbier des oiseleurs (Sorbus aucuparia). Mannitol : manne du frêne à fleurs (Fraxinus ornus), algues brunes.", "lv": 1}, {"id": "ch1-032", "t": "Comparaison", "q": "Préparation industrielle : sorbitol vs mannitol ?", "a": "Sorbitol : réduction du D-glucose. Mannitol : épimérisation du glucose puis réduction.", "lv": 1}, {"id": "ch1-033", "t": "Usage", "q": "Emplois du mannitol par voie parentérale ?", "a": "Diurétique osmotique (œdèmes, exploration de la fonction rénale).", "lv": 1}, {"id": "ch1-034", "t": "Usage", "q": "Emplois oraux du sorbitol et du mannitol ?", "a": "Cholagogue (CI si obstruction biliaire), laxatif osmotique, édulcorant pour diabétiques.", "lv": 1}, {"id": "ch1-035", "t": "Usage", "q": "Usages technologiques du sorbitol ?", "a": "Régulateur d'humidité des poudres (hygroscopique), matière première des spans, tweens et polysorbates, édulcorant peu cariogène.", "lv": 1}, {"id": "ch1-036", "t": "Origine", "q": "Le xylitol est-il naturel ? Comment l'obtient-on ?", "a": "Non : par réduction du xylose, lui-même obtenu par hydrolyse des xylanes (rafles de maïs, bouleau, pailles).", "lv": 0}, {"id": "ch1-037", "t": "Pourquoi ?", "q": "Pourquoi les polyols sont-ils non cariogènes et utiles chez le diabétique ?", "a": "Ils modifient peu le pH buccal et sont peu résorbés (moindre élévation glycémique).", "lv": 1}, {"id": "ch1-038", "t": "Toxicité", "q": "Inconvénient principal des polyols ?", "a": "Digestion incomplète → fermentation colique : gaz, ballonnements, douleurs, diarrhées.", "lv": 1}, {"id": "ch1-039", "t": "Structure", "q": "Qu'est-ce que la glucosamine ?", "a": "Glucose dont l'OH en C2 est remplacé par NH2.", "lv": 0}, {"id": "ch1-040", "t": "Origine", "q": "Comment obtient-on la glucosamine ?", "a": "Par hydrolyse de la chitine (carapaces de crustacés, insectes, champignons).", "lv": 1}, {"id": "ch1-041", "t": "Usage", "q": "Usage de la glucosamine ?", "a": "Anti-arthrosique symptomatique à action lente (sel d'hémisulfate).", "lv": 1}, {"id": "ch1-042", "t": "Structure", "q": "Structure clé de la vitamine C ?", "a": "γ-lactone portant un ène-diol (responsable de l'acidité et du caractère réducteur) ; s'oxyde en acide déhydroascorbique.", "lv": 1}, {"id": "ch1-043", "t": "Définition", "q": "Pourquoi la vitamine C est-elle classée parmi les oses ?", "a": "Parce que son précurseur biogénétique est le glucose.", "lv": 0}, {"id": "ch1-044", "t": "Pourquoi ?", "q": "Pourquoi l'homme doit-il trouver la vitamine C dans son alimentation ?", "a": "Un gène de la voie de synthèse à partir du glucose est absent (comme chez le singe et le cobaye).", "lv": 0}, {"id": "ch1-045", "t": "Définition", "q": "Rôles de la vitamine C ?", "a": "Antioxydant (capte les radicaux), inhibe la formation de nitrosamines, nécessaire à l'hydroxylation de la proline (collagène).", "lv": 1}, {"id": "ch1-046", "t": "Usage", "q": "Emplois de la vitamine C ?", "a": "Scorbut, asthénies et convalescences, brûlures et post-chirurgie, additif antioxydant/conservateur/acidifiant.", "lv": 1}, {"id": "ch1-047", "t": "Origine", "q": "Les 3 sources les plus riches en vitamine C ?", "a": "Acérola (Malpighia), cynorrhodon de l'églantier (Rosa canina), paprika (Capsicum annuum).", "lv": 1}, {"id": "ch1-048", "t": "Origine", "q": "D'où vient la vitamine C industrielle ?", "a": "Du glucose via le sorbitol.", "lv": 1}, {"id": "ch1-049", "t": "Définition", "q": "Qu'est-ce qu'une liaison osidique ?", "a": "Liaison éther entre l'OH hémiacétalique (C anomérique) d'un ose et un OH d'un autre ose, avec perte d'eau.", "lv": 0}, {"id": "ch1-050", "t": "Méthode", "q": "Comment rompt-on une liaison osidique ?", "a": "Par hydrolyse chimique acide (HCl, acide trifluoroacétique) ou enzymatique (très spécifique).", "lv": 0}, {"id": "ch1-051", "t": "Définition", "q": "Disaccharide réducteur vs non réducteur ?", "a": "Non réducteur : liaison entre les 2 OH hémiacétaliques (1 seule forme). Réducteur : un seul OH hémiacétalique engagé → 2 formes α et β.", "lv": 2}, {"id": "ch1-052", "t": "Structure", "q": "Nom complet du saccharose ?", "a": "α-D-glucopyranosyl-(1→2)-β-D-fructofuranoside.", "lv": 0}, {"id": "ch1-053", "t": "Pourquoi ?", "q": "Pourquoi 2 isomères dans maltose et lactose mais pas dans saccharose ?", "a": "Maltose/lactose : C anomérique du glucose libre → α ou β. Saccharose : les deux C anomériques sont engagés → une seule forme.", "lv": 2}, {"id": "ch1-054", "t": "Définition", "q": "Qu'est-ce que le sucre inverti ?", "a": "Le mélange glucose + fructose issu de l'hydrolyse du saccharose ; lévogyre alors que le saccharose est dextrogyre.", "lv": 2}, {"id": "ch1-055", "t": "Origine", "q": "Principales sources de saccharose ?", "a": "Racines de betterave et sève des tiges de canne à sucre (Saccharum officinarum) ; aussi érable, dattes, miel.", "lv": 2}, {"id": "ch1-056", "t": "Usage", "q": "Emplois pharmaceutiques du saccharose ?", "a": "Édulcorant, excipient (sirops, comprimés), conservateur à forte concentration (sirop simple : 650 g/L).", "lv": 2}, {"id": "ch1-057", "t": "Comparaison", "q": "Composition du miel par rapport au saccharose ?", "a": "Plus de fructose que de glucose + saccharose résiduel, pigments (flavonoïdes, caroténoïdes), huiles essentielles ; le miel est plus riche en constituants.", "lv": 2}, {"id": "ch1-058", "t": "Usage", "q": "Usages du miel ?", "a": "Édulcorant, fortifiant, expectorant ; favorise la cicatrisation, antibactérien.", "lv": 2}, {"id": "ch1-059", "t": "Structure", "q": "Composition et liaison du maltose ?", "a": "Deux glucoses liés α(1→4) ; réducteur (α- et β-maltose).", "lv": 2}, {"id": "ch1-060", "t": "Structure", "q": "Composition et liaison du lactose ?", "a": "β-D-galactose (1→4) D-glucose ; réducteur (α- et β-lactose).", "lv": 2}, {"id": "ch1-061", "t": "Origine", "q": "Comment obtient-on le lactose ?", "a": "Sous-produit de l'industrie fromagère : le petit-lait (après coagulation par la présure) est concentré, décoloré au charbon actif et recristallisé.", "lv": 2}, {"id": "ch1-062", "t": "Usage", "q": "Usage pharmaceutique du lactose ?", "a": "Diluant des poudres (triturations) et des comprimés.", "lv": 2}, {"id": "ch1-063", "t": "Structure", "q": "Composition du lactulose et du lactitol ?", "a": "Lactulose : galactose–fructose. Lactitol : galactose–sorbitol. Tous deux hémisynthétiques.", "lv": 2}, {"id": "ch1-064", "t": "Usage", "q": "Indications du lactulose et du lactitol ?", "a": "Constipation (laxatifs osmotiques) et encéphalopathie hépatique (antihyperammoniémants, doses plus élevées).", "lv": 2}, {"id": "ch1-065", "t": "Usage", "q": "Usage des esters de saccharose ?", "a": "Substituts des matières grasses (ni digérés ni absorbés).", "lv": 2}, {"id": "ch1-066", "t": "Structure", "q": "Rutinose vs néohespéridose ?", "a": "Rutinose : rhamnose α(1→6) glucose. Néohespéridose : rhamnose α(1→2) glucose.", "lv": 2}, {"id": "ch1-067", "t": "Définition", "q": "Taille et solubilité des oligosaccharides supérieurs ?", "a": "3 à 10 oses ; solubles dans l'eau et l'alcool dilué.", "lv": 2}, {"id": "ch1-068", "t": "Toxicité", "q": "Pourquoi les légumes secs donnent-ils des flatulences ?", "a": "Leurs galacto-oligosaccharides (raffinose, stachyose, verbascose) sont peu digestes et fermentés par Clostridia en gaz.", "lv": 2}, {"id": "ch1-069", "t": "Origine", "q": "Comment prépare-t-on les fructo-oligosaccharides ?", "a": "Dégradation partielle de l'inuline (chicorée, topinambour) ou à partir du saccharose par une fructosyltransférase.", "lv": 2}, {"id": "ch1-070", "t": "Définition", "q": "Définir prébiotique et probiotique.", "a": "Prébiotique : substance dont la fermentation au côlon stimule bifidobactéries et lactobacilles. Probiotique : micro-organisme vivant bien défini (Bifidobacterium, Lactobacillus, Streptococcus, Saccharomyces).", "lv": 4}, {"id": "ch1-071", "t": "Définition", "q": "Propriétés des probiotiques ?", "a": "Anti-infectieux intestinaux, immunostimulants, préventifs du cancer colorectal, hypocholestérolémiants, aident à digérer le lait, produisent des vitamines B.", "lv": 0}, {"id": "ch1-072", "t": "Définition", "q": "Que sont les maltodextrines ? Usages ?", "a": "Gluco-oligosaccharides réducteurs de l'hydrolyse partielle de l'amidon ; diététique infantile, adhésif pour pansements, excipient (granulation, atomisation).", "lv": 2}, {"id": "ch1-073", "t": "Structure", "q": "Composition des cyclodextrines α, β, γ ?", "a": "Glucoses liés α(1→4) en cycle : α = 6, β = 7, γ = 8 unités.", "lv": 0}, {"id": "ch1-074", "t": "Pourquoi ?", "q": "Pourquoi les cyclodextrines forment-elles des complexes d'inclusion ?", "a": "OH à l'extérieur (hydrophile) et cavité intérieure hydrophobe (squelette C et ponts éther) qui accueille une molécule apolaire.", "lv": 2}, {"id": "ch1-075", "t": "Usage", "q": "Avantages de l'encapsulation par cyclodextrines ?", "a": "Meilleure solubilité et vitesse de dissolution, biodisponibilité, stabilité, protection gastrique/oculaire, masquage du goût et de l'odeur, injectables de médicaments insolubles.", "lv": 2}, {"id": "ch1-076", "t": "Structure", "q": "Les 4 unités de l'acarbose ?", "a": "2 glucoses, 1 désoxyose aminé, 1 cyclitol insaturé.", "lv": 1}, {"id": "ch1-077", "t": "Usage", "q": "Mode d'action et indication de l'acarbose ?", "a": "Inhibe les α-glucosidases intestinales → ↓ résorption des glucides → diabète de type 2.", "lv": 2}, {"id": "ch1-078", "t": "Toxicité", "q": "Conseil important avec l'acarbose en cas d'hypoglycémie ?", "a": "Donner du glucose par voie orale : les di- et polysaccharides ne sont plus hydrolysés.", "lv": 0}, {"id": "ch1-079", "t": "Origine", "q": "Origine de l'acarbose ?", "a": "Biotechnologie à partir d'Actinoplanes utahensis.", "lv": 2}, {"id": "ch1-080", "t": "Définition", "q": "Polysaccharides homogènes vs hétérogènes ?", "a": "Homogènes : un seul type d'ose. Hétérogènes : plusieurs oses différents ou dérivés.", "lv": 3}, {"id": "ch1-081", "t": "Structure", "q": "Composition de l'amidon ?", "a": "Amylose (linéaire, α(1→4)) + amylopectine (ramifiée, α(1→4) + α(1→6), majoritaire).", "lv": 3}, {"id": "ch1-082", "t": "Méthode", "q": "Propriétés de l'amidon dans l'eau et à l'iode ?", "a": "Insoluble à froid ; à chaud gonfle (empois) puis gel en refroidissant ; bleu-violet avec l'iode.", "lv": 3}, {"id": "ch1-083", "t": "Origine", "q": "Principales sources d'amidon ?", "a": "Céréales (maïs, blé, riz, orge), tubercules (pomme de terre → fécule), bananes.", "lv": 3}, {"id": "ch1-084", "t": "Usage", "q": "Usage pharmaceutique de l'amidon ?", "a": "Excipient des comprimés (diluant, liant, délitant) ; amidons modifiés.", "lv": 3}, {"id": "ch1-085", "t": "Structure", "q": "Structure de la cellulose ?", "a": "Polymère linéaire de D-glucose β(1→4) (300–15 000 unités), motif cellobiose, rotation de 180° d'une unité sur deux, liaisons H inter-chaînes.", "lv": 0}, {"id": "ch1-086", "t": "Comparaison", "q": "Amidon vs cellulose (nutrition) ?", "a": "Amidon α : digéré en glucose (énergie). Cellulose β : non digérée → fibre alimentaire.", "lv": 3}, {"id": "ch1-087", "t": "Usage", "q": "Usages de la cellulose et de ses dérivés ?", "a": "Comprimés (diluant, liant, désintégrant), suspensions ; méthyl-, éthyl-, HP-, carboxyméthylcellulose ; acétophtalate (gastro-résistant).", "lv": 3}, {"id": "ch1-088", "t": "Origine", "q": "Qu'est-ce que le coton hydrophile ?", "a": "Fibres de l'enveloppe des graines de Gossypium nettoyées, purifiées, blanchies, cardées (Ph. Eur.) : ouate, gazes, pansements.", "lv": 2}, {"id": "ch1-089", "t": "Origine", "q": "Usage pharmaceutique des fibres de lin ?", "a": "Fil chirurgical non résorbable stérile (fibres péricycliques de la tige de Linum usitatissimum).", "lv": 4}, {"id": "ch1-090", "t": "Structure", "q": "Structure de l'inuline ?", "a": "G(F)n : chaîne de β-D-fructofuranoses liés β(2→1) terminée par un glucose (n = 2 à 60).", "lv": 0}, {"id": "ch1-091", "t": "Origine", "q": "Source industrielle de l'inuline ?", "a": "Racines de chicorée (Cichorium intybus).", "lv": 3}, {"id": "ch1-092", "t": "Structure", "q": "Structure et origine des dextranes ?", "a": "α-D-glucose α(1→6) (+ un peu α1-3) ; Leuconostoc mesenteroides sur saccharose.", "lv": 0}, {"id": "ch1-093", "t": "Usage", "q": "Usages des dextranes selon leur PM ?", "a": "PM 60–70 000 : succédané du plasma ; PM 40 000 : expandeur de volume ; PM 1 000 : protection haptènique anti-anaphylaxie ; larmes artificielles.", "lv": 3}, {"id": "ch1-094", "t": "Structure", "q": "Structure et origine du lentinane ?", "a": "Glucane β(1→3) substitué de glucoses β(1→6) ; Lentinus edodes (shiitake), Pleurotus ostreatus.", "lv": 3}, {"id": "ch1-095", "t": "Usage", "q": "Activité du lentinane ?", "a": "Immunostimulante (soutien des cancéreux, notamment cancer gastrique).", "lv": 3}, {"id": "ch1-096", "t": "Méthode", "q": "Comment quantifie-t-on le caractère hydrophile des polysaccharides hétérogènes en Ph. Eur. ?", "a": "Indice de gonflement (drogues) ou viscosité (polymères isolés).", "lv": 4}, {"id": "ch1-097", "t": "Structure", "q": "Composition de l'acide alginique ?", "a": "Polymère linéaire d'acides uroniques : acide D-mannuronique et acide L-guluronique liés β(1→4).", "lv": 1}, {"id": "ch1-098", "t": "Origine", "q": "Origine des alginates ?", "a": "Algues brunes : Fucus vesiculosus, Laminaria, Macrocystis pyrifera.", "lv": 4}, {"id": "ch1-099", "t": "Comparaison", "q": "Alginate de sodium vs alginate de calcium ?", "a": "Na (K, NH4) : solubles, solutions visqueuses. Ca : insoluble, gel élastique non thermoréversible.", "lv": 4}, {"id": "ch1-100", "t": "Pourquoi ?", "q": "Mécanisme du gel anti-reflux à l'alginate ?", "a": "Alginate Na + HCl → acide alginique ; réticulation par Ca2+ (CaCO3) ; CO2 (NaHCO3 + HCl) piégé → le gel flotte.", "lv": 4}, {"id": "ch1-101", "t": "Usage", "q": "Usage hémostatique des alginates ?", "a": "Ouate anti-hémorragique à l'alginate de calcium.", "lv": 4}, {"id": "ch1-102", "t": "Structure", "q": "Composition de l'agar ?", "a": "Galactose et 3,6-anhydrogalactose (+ un peu d'acide galacturonique et d'O-SO3H).", "lv": 0}, {"id": "ch1-103", "t": "Origine", "q": "Origine de l'agar ?", "a": "Algues rouges : Gelidium et Gracilaria.", "lv": 4}, {"id": "ch1-104", "t": "Usage", "q": "Usages de l'agar ?", "a": "Milieux de culture bactériologique, gels d'électrophorèse, laxatif mécanique, pansement gastro-intestinal, texturant (remplace la gélatine).", "lv": 4}, {"id": "ch1-105", "t": "Comparaison", "q": "Agar vs carraghénanes ?", "a": "Tous deux d'algues rouges et voisins ; les carraghénanes (Chondrus crispus, Gigartina) sont plus riches en O-SO3H (propriétés anticoagulantes).", "lv": 4}, {"id": "ch1-106", "t": "Définition", "q": "Définition des gommes vraies ?", "a": "Exsudats (spontanés ou après incision) d'arbres/arbustes ; polymères très ramifiés et hétérogènes avec acides uroniques.", "lv": 4}, {"id": "ch1-107", "t": "Origine", "q": "Origine des gommes arabique, adragante et de Sterculia ?", "a": "Arabique : Acacia senegal (Fabaceae, Afrique). Adragante : Astragalus gummifer (Fabaceae, Asie occidentale). Sterculia : Sterculiaceae tropicales.", "lv": 4}, {"id": "ch1-108", "t": "Usage", "q": "Usages des gommes ?", "a": "Gélifiants, épaississants, laxatifs de lest (Sterculia) ; jadis adoucissants des sirops contre la toux.", "lv": 4}, {"id": "ch1-109", "t": "Comparaison", "q": "Gommes vraies vs mucilages ?", "a": "Gommes : exsudats d'arbres. Mucilages : constituants cellulaires normaux, surtout dans les graines (albumen).", "lv": 4}, {"id": "ch1-110", "t": "Origine", "q": "Quelles graines contiennent des mucilages acides ?", "a": "Ispaghul (Plantago ovata), psyllium (Plantago arenaria), lin (Linum usitatissimum) → laxatifs de lest.", "lv": 4}, {"id": "ch1-111", "t": "Définition", "q": "Que sont les mucilages neutres ? Exemples.", "a": "Galactomannanes (galactose + mannose) de graines de Fabaceae : « gommes » de caroube (Ceratonia siliqua) et guar (Cyamopsis tetragonolobus) ; aussi glucomannanes.", "lv": 4}, {"id": "ch1-112", "t": "Pourquoi ?", "q": "Pourquoi la « gomme » guar n'est-elle pas une vraie gomme ?", "a": "C'est une poudre obtenue par broyage de l'albumen des graines, pas un exsudat.", "lv": 4}, {"id": "ch1-113", "t": "Structure", "q": "Structure des pectines ?", "a": "Chaîne d'acide D-galacturonique α(1→4) plus ou moins méthylé, rhamnose intercalé (coudes) et ramifications (galactose, arabinose).", "lv": 1}, {"id": "ch1-114", "t": "Pourquoi ?", "q": "Comment les pectines forment-elles un gel ?", "a": "Les portions d'acide galacturonique non méthylé sont pontées par Ca2+.", "lv": 1}, {"id": "ch1-115", "t": "Origine", "q": "Sources des pectines ?", "a": "Fruits : Citrus (sous-produits des jus), pommes (marc de cidre), coings.", "lv": 4}, {"id": "ch1-116", "t": "Usage", "q": "Usages des pectines ?", "a": "Gélifiant (confitures) ; affections gastro-intestinales : protection de la muqueuse, adsorption des toxines, bactériostatique.", "lv": 4}, {"id": "ch1-117", "t": "Origine", "q": "Origine de la gomme xanthane ?", "a": "La bactérie Xanthomonas campestris (ce n'est pas une vraie gomme).", "lv": 4}, {"id": "ch1-118", "t": "Structure", "q": "Structure de la xanthane ?", "a": "Chaîne de glucoses β(1→4) avec, tous les 2 glucoses, une chaîne latérale mannose (acétylé) – acide glucuronique – mannose (± pyruvate) : unité pentasaccharidique anionique.", "lv": 0}, {"id": "ch1-119", "t": "Usage", "q": "Avantages de la xanthane en galénique ?", "a": "Stabilisant/gélifiant de 1er choix : rhéologie stable pH 3–10, résiste à la chaleur, pseudoplasticité, compatible, non dégradée par les enzymes, sans goût.", "lv": 4}, {"id": "ch1-120", "t": "Définition", "q": "Définition des fibres alimentaires ?", "a": "Polysaccharides autres que les glucanes α(1→4) (amidon) + lignine ; arrivent intacts au côlon, dégradés seulement par la flore (prébiotiques).", "lv": 3}, {"id": "ch1-121", "t": "Comparaison", "q": "Fibres insolubles vs solubles : exemples ?", "a": "Insolubles : cellulose, lignine. Solubles : hémicelluloses, pectines, gommes, mucilages, inuline.", "lv": 4}, {"id": "ch1-122", "t": "Définition", "q": "Qu'est-ce que la lignine ?", "a": "Polymère non glucidique d'unités phénylpropènes (C6-C3) : rigidité et imperméabilité des végétaux ; fibre insoluble très résistante.", "lv": 4}, {"id": "ch1-123", "t": "Définition", "q": "Composition des hémicelluloses ?", "a": "Chaînes linéaires de xylose (pentose) portant des chaînes latérales d'acide glucuronique et d'autres sucres.", "lv": 0}, {"id": "ch1-124", "t": "Usage", "q": "Effets bénéfiques des fibres ?", "a": "Accélèrent le transit, ↑ poids des selles, ↓ LDL-cholestérol, ↓ hyperglycémie post-prandiale, limitent obésité et athérome.", "lv": 4}, {"id": "ch1-125", "t": "Toxicité", "q": "Effets d'un excès de fibres ?", "a": "Carences minérales (acides uronique et phytique complexent Ca, Fe, Mg, Zn), absorption ralentie de médicaments, flatulences, diarrhée.", "lv": 1}, {"id": "ch1-126", "t": "Structure", "q": "Structure de la chitine ?", "a": "N-acétylglucosamine liées β(1→4) (homogène, linéaire).", "lv": 3}, {"id": "ch1-127", "t": "Structure", "q": "Comment obtient-on le chitosane et qu'a-t-il de particulier ?", "a": "Désacétylation partielle de la chitine (NaOH + chauffage) → NH2 libres → polysaccharide cationique en milieu acide.", "lv": 3}, {"id": "ch1-128", "t": "Usage", "q": "Usages de la chitine/chitosane ?", "a": "Pansements pour brûlés (peau artificielle), pansements cornéens, fils de suture résorbables, implants osseux/dentaires, lentilles, cosmétique.", "lv": 3}, {"id": "ch1-129", "t": "Définition", "q": "Qu'est-ce qu'un glycosaminoglycane (GAG) ?", "a": "Polysaccharide non ramifié de disaccharides (éventuellement sulfatés) hexose aminé + acide uronique ; lié à une protéine → protéoglycane.", "lv": 1}, {"id": "ch1-130", "t": "Structure", "q": "Composition de l'acide hyaluronique ?", "a": "Acide D-glucuronique + N-acétylglucosamine ; liaisons alternées β(1→3) et β(1→4).", "lv": 1}, {"id": "ch1-131", "t": "Usage", "q": "Usages de l'acide hyaluronique ?", "a": "Chirurgie ophtalmique, collyres, injections intra-articulaires (arthrose du genou), comblement des rides, hydratant.", "lv": 1}, {"id": "ch1-132", "t": "Origine", "q": "Comment obtient-on l'acide hyaluronique ?", "a": "Extraction de crêtes de coq ou fermentation bactérienne.", "lv": 1}, {"id": "ch1-133", "t": "Structure", "q": "Composition de la chondroïtine sulfate ?", "a": "Acide glucuronique β(1→3) N-acétylgalactosamine sulfatée, unités reliées β(1→4).", "lv": 1}, {"id": "ch1-134", "t": "Usage", "q": "Usage de la chondroïtine sulfate ?", "a": "Chondroprotecteur, anti-arthrosique symptomatique lent (complément alimentaire), larmes artificielles.", "lv": 4}, {"id": "ch1-135", "t": "Structure", "q": "Unité disaccharidique principale de l'héparine ?", "a": "Acide iduronique-2-O-sulfate + glucosamine-N-sulfate-6-O-sulfate (trisulfatée).", "lv": 1}, {"id": "ch1-136", "t": "Définition", "q": "Mode d'action de l'héparine ?", "a": "Complexe héparine–antithrombine–thrombine → inhibition de la coagulation ; un pentasaccharide (glucosamine 3-O-sulfatée) active l'antithrombine (anti-Xa).", "lv": 4}, {"id": "ch1-137", "t": "Toxicité", "q": "Effets indésirables et antidote de l'héparine ?", "a": "Hémorragie (antidote : protamine) et thrombopénie.", "lv": 4}, {"id": "ch1-138", "t": "Comparaison", "q": "Héparines non fractionnées vs HBPM ?", "a": "HBPM : hydrolyse partielle, PM < 8000, durée d'action plus longue, voie SC, plus faciles à utiliser.", "lv": 4}, {"id": "ch1-139", "t": "Méthode", "q": "Quel contaminant recherche la Ph. Eur. dans l'héparine et comment ?", "a": "La chondroïtine persulfatée (fraude 2008), par RMN du proton et électrophorèse capillaire.", "lv": 4}, {"id": "ch1-140", "t": "Origine", "q": "Sources d'extraction de l'héparine ?", "a": "Poumons de bœuf ou muqueuse intestinale de bœuf, porc ou mouton (solutions alcalines).", "lv": 4}], "pl": [{"id": "acerola", "nom": "Acérola", "lat": "Malpighia punicifolia", "partie": "fruits", "rep": "vitamine C", "tous": ["vitamine C (fruit le plus riche, ~20× les agrumes)"], "img": "img/plantes/acerola.jpg", "usage": "Source de vitamine C (compléments alimentaires).", "lv": 1}, {"id": "rosa-canina", "nom": "Églantier", "lat": "Rosa canina L.", "partie": "faux-fruits (cynorrhodons)", "rep": "vitamine C", "tous": ["vitamine C"], "img": "img/plantes/rosa-canina.jpg", "usage": "2e source la plus riche en vitamine C.", "lv": 1}, {"id": "argousier", "nom": "Argousier", "lat": "Hippophae rhamnoides", "partie": "fruits", "rep": "vitamine C", "tous": ["vitamine C"], "img": "img/plantes/argousier.jpg", "usage": "Source de vitamine C.", "lv": 1}, {"id": "betterave", "nom": "Betterave sucrière", "lat": "Beta vulgaris", "partie": "racines charnues", "rep": "saccharose", "tous": ["saccharose"], "img": "img/plantes/betterave.jpg", "usage": "Source industrielle de saccharose.", "lv": 2}, {"id": "canne-a-sucre", "nom": "Canne à sucre", "lat": "Saccharum officinarum", "partie": "sève des tiges", "rep": "saccharose", "tous": ["saccharose"], "img": "img/plantes/canne-a-sucre.jpg", "usage": "1re plante cultivée au monde ; source de saccharose.", "lv": 2}, {"id": "miel", "nom": "Miel", "lat": "Apis mellifera L. (abeille)", "partie": "miel produit à partir du nectar", "rep": "fructose > glucose", "tous": ["fructose > glucose", "saccharose résiduel", "flavonoïdes, caroténoïdes, huiles essentielles"], "img": "img/plantes/miel.jpg", "usage": "Édulcorant, fortifiant, expectorant ; cicatrisant et antibactérien (Ph. Eur.).", "lv": 0}, {"id": "sorbier", "nom": "Sorbier des oiseleurs", "lat": "Sorbus aucuparia", "partie": "fruits", "rep": "D-sorbitol", "tous": ["D-sorbitol"], "img": "img/plantes/sorbier.jpg", "usage": "Source naturelle de sorbitol.", "lv": 1}, {"id": "frene-a-fleurs", "nom": "Frêne à fleurs", "lat": "Fraxinus ornus", "partie": "manne (suc épaissi obtenu par incision)", "rep": "D-mannitol", "tous": ["D-mannitol"], "img": "img/plantes/frene-a-fleurs.jpg", "usage": "Source naturelle de mannitol.", "lv": 1}, {"id": "cotonnier", "nom": "Cotonnier", "lat": "Gossypium sp.", "partie": "fibres de l'enveloppe des graines", "rep": "cellulose", "tous": ["cellulose"], "img": "img/plantes/cotonnier.jpg", "usage": "Coton hydrophile (Ph. Eur.) : ouate, gazes, pansements.", "lv": 3}, {"id": "kapokier", "nom": "Kapokier", "lat": "Bombax ceiba", "partie": "fibres des fruits (kapok)", "rep": "cellulose", "tous": ["cellulose"], "img": "img/plantes/kapokier.jpg", "usage": "Fibre légère, imperméable, imputrescible (rembourrage).", "lv": 3}, {"id": "lin", "nom": "Lin", "lat": "Linum usitatissimum L.", "partie": "graines (mucilage, huile) ; fibres des tiges", "rep": "mucilage acide", "tous": ["mucilage acide", "huile", "cellulose (fibres)", "acide α-linolénique (ALA, majoritaire)", "mucilages (couche externe)", "sécoisolaricirésinol diglucoside (SDG)", "linamaroside (surtout dans les plantules)"], "img": "img/plantes/lin.jpg", "usage": "Graines = laxatif mécanique (de lest) ; fibres = fil chirurgical non résorbable stérile.", "lv": 4}, {"id": "chanvre", "nom": "Chanvre", "lat": "Cannabis sativa", "partie": "fibres des tiges", "rep": "cellulose", "tous": ["cellulose", "THC (variétés drogue)"], "img": "img/plantes/chanvre.jpg", "usage": "Fibres (cordages, sachets « infusettes ») ; variétés à fibres pauvres en THC.", "lv": 4}, {"id": "chicoree", "nom": "Chicorée", "lat": "Cichorium intybus", "partie": "racines", "rep": "inuline", "tous": ["inuline"], "img": "img/plantes/chicoree.jpg", "usage": "Production industrielle d'inuline et de FOS (prébiotiques).", "lv": 3}, {"id": "shiitake", "nom": "Shiitake", "lat": "Lentinus edodes", "partie": "carpophore", "rep": "lentinane", "tous": ["lentinane (glucane β-1,3/β-1,6)"], "img": "img/plantes/shiitake.jpg", "usage": "Immunostimulant (lentinane).", "lv": 3}, {"id": "acacia-senegal", "nom": "Gommier", "lat": "Acacia senegal", "partie": "exsudat gommeux du tronc", "rep": "gomme arabique", "tous": ["gomme arabique (polysaccharide ramifié + acides uroniques)"], "img": "img/plantes/acacia-senegal.jpg", "usage": "Gélifiant, épaississant, émulsifiant.", "lv": 1}, {"id": "astragalus-gummifer", "nom": "Astragale", "lat": "Astragalus gummifer", "partie": "exsudat gommeux", "rep": "gomme adragante", "tous": ["gomme adragante (contient du fucose)"], "img": "img/plantes/astragalus-gummifer.jpg", "usage": "Épaississant, stabilisant des suspensions.", "lv": 4}, {"id": "ispaghul", "nom": "Ispaghul", "lat": "Plantago ovata", "partie": "graines et téguments", "rep": "mucilage acide", "tous": ["mucilage acide (acide galacturonique)"], "img": "img/plantes/ispaghul.jpg", "usage": "Laxatif mécanique de lest ; ↓ hyperglycémie post-prandiale.", "lv": 1}, {"id": "psyllium", "nom": "Psyllium", "lat": "Plantago arenaria", "partie": "graines", "rep": "mucilage acide", "tous": ["mucilage acide"], "img": "img/plantes/psyllium.jpg", "usage": "Laxatif mécanique de lest.", "lv": 4}, {"id": "caroubier", "nom": "Caroubier", "lat": "Ceratonia siliqua", "partie": "albumen des graines (broyé)", "rep": "galactomannane", "tous": ["galactomannane (mucilage neutre)"], "img": "img/plantes/caroubier.jpg", "usage": "« Gomme » de caroube : épaississant (pas une vraie gomme).", "lv": 4}, {"id": "guar", "nom": "Guar", "lat": "Cyamopsis tetragonolobus", "partie": "albumen des graines (broyé)", "rep": "galactomannane", "tous": ["galactomannane (mucilage neutre)"], "img": "img/plantes/guar.jpg", "usage": "« Gomme » guar : épaississant, fibre soluble (pas une vraie gomme).", "lv": 4}, {"id": "pommier", "nom": "Pommier", "lat": "Malus domestica", "partie": "fruits (marc de cidre)", "rep": "pectines", "tous": ["pectines"], "img": "img/plantes/pommier.jpg", "usage": "Source commerciale de pectine ; aussi Citrus et coings.", "lv": 4}, {"id": "fucus", "nom": "Fucus", "lat": "Fucus vesiculosus (+ Laminaria, Macrocystis)", "partie": "thalle", "rep": "acide alginique", "tous": ["acide alginique (algine)", "mannitol"], "img": "img/plantes/fucus.jpg", "usage": "Extraction des alginates.", "lv": 4}, {"id":
