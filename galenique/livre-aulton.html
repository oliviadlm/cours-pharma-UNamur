<script>
/* ================= DONNÉES DU COURS ================= */
const r10 = x => Math.round(x * 1e10) / 1e10;
const P = (a, b) => `<span class="pg">p. ${a}${b ? "–" + b : ""}</span>`;
const FTAB = [["acide acétylsalicylique", 0.67], ["paracétamol", 0.72], ["codéine phosphate", 0.69], ["caféine", 0.67], ["ibuprofène", 0.90], ["bismuth sous-gallate", 0.37], ["oxyde de zinc", 0.16]];
const DATA = {
id: "aulton", key: "mphab311-aulton", sumKey: "mphab311-sum-aulton", hubUrl: "index.html",
kicker: "MPHAB311 · Livre de référence n° 2 (en anglais)",
title: "Aulton's Pharmaceutics (6e éd., 2021) : guide de lecture",
sub: "Chapitres et pages à lire pour chaque chapitre du cours · vocabulaire anglais · différences avec le cours · exercices dans le style des « worked examples »",

concepts: [
{ id: "guide", title: "Mode d'emploi : 6e édition vs 3e édition",
  html: `<div class="box trap"><b>Édition</b> : le cours cite la <b>3<sup>e</sup> édition</b> (2007). Tu as la <b>6<sup>e</sup></b> (2021) : les <span class="k">numéros de chapitre et de page ne correspondent pas</span>. Cherche toujours par <b>titre de chapitre</b>. Le contenu de base (rhéologie, Stokes, HLB, stérilisation, suppositoires) n'a pas changé ; la 6<sup>e</sup> ajoute des chapitres récents (fabrication continue, voie auriculaire, nanomédecines…) qui ne sont pas au programme.</div>
  <p>Les pages citées ici sont les <b>numéros imprimés</b> de la 6<sup>e</sup> édition (table des matières p. v–vi). Dans ton PDF, le décalage varie de 25 à 85 pages : utilise la recherche du lecteur PDF avec le titre de la section.</p>
  <table><tr><th>Partie d'Aulton</th><th>Chapitres</th><th>Chapitres du cours</th></tr>
  <tr><td>1. Scientific principles of dosage form design</td><td>2 à 7</td><td>Ch. 3, <b>Ch. 4</b>, Ch. 5</td></tr>
  <tr><td>2. Particle science and powder technology</td><td>8 à 12</td><td><b>Ch. 2</b></td></tr>
  <tr><td>3. Pharmaceutical microbiology and sterilization</td><td>13 à 17</td><td><b>Ch. 7</b></td></tr>
  <tr><td>5. Dosage form design and manufacture</td><td>23 à 49</td><td>Ch. 3, Ch. 5, <b>Ch. 8</b>, Ch. 9</td></tr>
  <tr><td>6. Packaging, stability and regulation</td><td>50 à 54</td><td>Ch. 1, Ch. 3</td></tr></table>
  <p><b>Exercices</b> : les questions d'auto-évaluation de cette édition sont <span class="k">en ligne (Student Consult)</span>, pas dans le PDF. Le livre contient en revanche des <b>« Worked examples »</b> (encadrés). Les onglets <i>Exercices</i> et <i>Exemples guidés</i> en génèrent des variantes, en français, avec la correction pas à pas.</p>
  <p><b>Lire en anglais</b> : commence chaque chapitre par l'encadré <b>KEY POINTS</b> puis le <b>Summary</b> final ; lis ensuite seulement les sections listées ci-dessous.</p>`,
  why: [["Pourquoi Aulton est-il utile si le cours est en français ?", "C'est le livre le plus clair sur la physique des formes (rhéologie, poudres, Stokes) : il explique avec des schémas ce que le cours énonce. C'est aussi le seul des deux livres qui traite vraiment la rhéologie."]],
  traps: ["Chercher « chapitre 4 » de la 3e édition dans la 6e : la numérotation a changé.", "Confondre « displacement value » (Aulton) et « facteur de déplacement » (cours) : ce sont des inverses (voir Ch. 8)."] },

{ id: "c1", title: "Ch. 1 · Le médicament ↔ Aulton",
  html: `<table><tr><th></th><th>Chapitre (pages)</th><th>À chercher</th></tr>
  <tr><td>★</td><td>1. <i>Design of dosage forms</i> ${P(1, 12)}</td><td>Les 3 considérations de conception : propriétés physicochimiques du PA, biopharmacie, thérapeutique ; voies d'administration et formes associées</td></tr>
  <tr><td>★</td><td>23. <i>Pharmaceutical preformulation</i> ${P(360, 385)}</td><td>Ce qu'on mesure sur un nouveau PA : solubilité, pK<sub>a</sub>, sels, polymorphes, stabilité</td></tr>
  <tr><td>☆</td><td>50. <i>Packaging</i> ${P(833, 847)}</td><td>Verre (types), plastiques, conditionnement primaire et secondaire</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Le cours définit le médicament (PA + excipients + conditionnement) et ses classifications ; Aulton explique <b>comment on choisit</b> la forme à partir des propriétés du PA. Vocabulaire : <i>drug</i> = principe actif, <i>excipient</i>, <i>dosage form</i> = forme pharmaceutique, <i>medicinal product</i> = médicament.</div>`,
  why: [["Pourquoi la préformulation commence-t-elle par la solubilité ?", "Un PA doit être dissous pour être absorbé : une solubilité trop faible oriente vers la micronisation, un sel, un cosolvant ou une autre voie dès le départ."]],
  traps: ["Traduire « drug » par « drogue » : c'est le principe actif."] },

{ id: "c2", title: "Ch. 2 · L'état solide ↔ Aulton",
  html: `<table><tr><th></th><th>Chapitre (pages)</th><th>À chercher</th></tr>
  <tr><td>★</td><td>8. <i>Solid-state properties</i> ${P(114, 125)}</td><td>Cristallisation, <b>polymorphism</b>, hydrates/solvates, amorphe, influence sur solubilité et stabilité</td></tr>
  <tr><td>★</td><td>9. <i>Particle size analysis</i> ${P(126, 142)}</td><td>Diamètres équivalents, distributions, <b>moyennes D[1,0], D[3,2], D[4,3]</b> (encadré « worked example »), méthodes (tamis, microscopie, diffraction laser)</td></tr>
  <tr><td>★</td><td>11. <i>Mixing</i> ${P(156, 171)}</td><td>Mélange aléatoire, ségrégation, écart type d'un mélange et %CV (worked example p. 160)</td></tr>
  <tr><td>★</td><td>12. <i>Powder flow</i> ${P(172, 183)}</td><td>Angle de repos, <b>Hausner ratio</b> et <b>Carr's index</b> (p. 180), améliorer l'écoulement (glidants, granulation)</td></tr>
  <tr><td>☆</td><td>10. <i>Particle size reduction</i> ${P(143, 155)} · 29. <i>Powders, granules and granulation</i> ${P(463, 482)} · 31. <i>Tablets and compaction</i> ${P(501, 541)}</td><td>Broyage, granulation humide/sèche, compression</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Même indice de Carr que le cours : (ρ tassée − ρ versée) / ρ tassée × 100. Aulton donne les repères d'Hausner : <span class="k">&lt; 1,2 bon écoulement</span>, <span class="k">&gt; 1,5 poudre cohésive</span>. Si l'échelle de classes du cours diffère, garde celle du cours.</div>
  <div class="formula">Hausner = ρ tassée / ρ versée   ·   Carr (%) = (ρ tassée − ρ versée) / ρ tassée × 100</div>`,
  why: [["Pourquoi le rapport d'Hausner prédit-il l'écoulement ?", "Une poudre qui se tasse beaucoup a de fortes frictions et cohésions entre particules : ce sont les mêmes forces qui l'empêchent de couler."],
        ["Pourquoi existe-t-il plusieurs « diamètres moyens » pour la même poudre ?", "Selon qu'on s'intéresse au nombre, à la surface (dissolution) ou au volume (dose), on pondère par d, d² ou d³ : les moyennes D[3,2] et D[4,3] sont plus grandes que D[1,0]."]],
  talk: { prompt: "Calcule Hausner et Carr pour ρ versée = 0,50 et ρ tassée = 0,62 g/mL et interprète.", check: ["Hausner = 0,62 / 0,50 = 1,24", "Carr = 0,12 / 0,62 × 100 = 19,4 %", "Écoulement passable : ni libre (< 1,2) ni cohésif (> 1,5)"] },
  traps: ["Diviser par la densité versée dans Carr : on divise par la densité tassée."] },

{ id: "c3", title: "Ch. 3 · Substances en solution ↔ Aulton",
  html: `<table><tr><th></th><th>Chapitre (pages)</th><th>À chercher</th></tr>
  <tr><td>★</td><td>2. <i>Dissolution and solubility</i> ${P(13, 29)}</td><td>Termes de solubilité, facteurs de la solubilité, <b>Noyes-Whitney</b>, effet de la taille des particules (worked example p. 18)</td></tr>
  <tr><td>★</td><td>3. <i>Properties of solutions</i> ${P(30, 38)}</td><td>Propriétés colligatives (pression osmotique, abaissement cryoscopique), <b>ionisation</b> et Henderson-Hasselbalch (worked examples p. 35)</td></tr>
  <tr><td>★</td><td>7. <i>Kinetics</i> ${P(101, 113)}</td><td>Ordres 0 et 1, demi-vie, <b>Arrhenius</b> (worked examples p. 104–105)</td></tr>
  <tr><td>★</td><td>38. <i>Parenteral drug delivery</i> ${P(626, 640)}</td><td><b>Isotonicity</b> : le plasma et les larmes congèlent à −0,52 °C, équation w = (0,52 − a)/b (p. 635), pH et tonicité des injectables</td></tr>
  <tr><td>☆</td><td>24. <i>Solutions</i> ${P(386, 396)} · 41. <i>Ocular drug delivery</i> ${P(677, 700)} · 51. <i>Chemical stability</i> ${P(848, 859)}</td><td>Cosolvants, conservateurs ; collyres ; hydrolyse, oxydation, photolyse</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>L'équation d'Aulton est la <b>méthode cryoscopique du cours</b> écrite autrement : w (% de NaCl à ajouter) = (0,52 − a) / b, avec a = ΔT de la solution non ajustée et b = ΔT d'une solution de NaCl à 1 %. Aulton ne présente pas White-Vincent : garde les 3 méthodes du cours.</div>
  <div class="formula">w = (0,52 − a) / b   ·   acide faible : log([HA]/[A⁻]) = pKa − pH   ·   ordre 1 : t½ = 0,693 / k ; t₉₀ = 0,105 / k</div>`,
  why: [["Pourquoi un acide faible est-il surtout non ionisé dans l'estomac ?", "À pH 2, bien en dessous de son pKa, l'équilibre est déplacé vers la forme HA : l'aspirine (pKa ≈ 3,5) y est ~32 fois plus non ionisée qu'ionisée (exemple du livre)."],
        ["Pourquoi l'abaissement cryoscopique sert-il à mesurer la tonicité ?", "Comme la pression osmotique, il ne dépend que du nombre de particules dissoutes ; il est beaucoup plus facile à mesurer."]],
  talk: { prompt: "Explique l'équation w = (0,52 − a)/b et ce que valent a et b.", check: ["0,52 °C : abaissement du plasma et des larmes", "a = ΔT de la solution à ajuster", "b = ΔT d'une solution à 1 % d'agent isotonisant (NaCl, glucose)", "w = % (m/V) d'agent à ajouter"] },
  traps: ["Utiliser l'équation pour une solution déjà hypertonique : w serait négatif, on ne peut pas isotoniser."] },

{ id: "c4", title: "Ch. 4 · Rhéologie ↔ Aulton (chapitre clé)",
  html: `<p>C'est <b>le</b> chapitre à lire pour la rhéologie : Le Hir n'en parle presque pas.</p>
  <table><tr><th></th><th>Chapitre 6. <i>Rheology</i> ${P(81, 100)}</th></tr>
  <tr><td>★</td><td><b>Viscosity, stress and rate of shear</b> : contrainte de cisaillement τ, vitesse de cisaillement γ̇, loi de Newton η = τ/γ̇, unités (Pa·s)</td></tr>
  <tr><td>★</td><td><b>Newtonian fluids</b> et leur mesure : viscosimètres capillaires (U-tube), à bille, rotatifs</td></tr>
  <tr><td>★</td><td><b>Non-Newtonian fluids</b> : <i>plastic</i> (Bingham, seuil d'écoulement / <i>yield value</i>), <i>pseudoplastic</i> (rhéofluidifiant), <i>dilatant</i> (rhéoépaississant)</td></tr>
  <tr><td>★</td><td><b>Time-dependent behaviour</b> : <span class="k">thixotropy</span> = baisse <b>réversible</b> et <b>dépendante du temps</b> de la viscosité apparente ; boucle d'hystérésis dont l'aire mesure la déstructuration (p. 91)</td></tr>
  <tr><td>★</td><td><b>Determination of flow properties</b> : pourquoi un viscosimètre à un seul point ne suffit pas pour un fluide non newtonien (cône-plan, cylindres coaxiaux)</td></tr>
  <tr><td>☆</td><td>Viscoélasticité ; applications aux suspensions, émulsions, gels</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Mêmes notions et mêmes types de fluides que le cours. Vocabulaire : <i>shear stress</i> = contrainte, <i>shear rate</i> = vitesse de cisaillement, <i>apparent viscosity</i> = viscosité apparente, <i>yield stress</i> = seuil d'écoulement, <i>shear-thinning</i> = rhéofluidifiant.</div>
  <div class="formula">η = τ / γ̇   ·   plastique (Bingham) : τ = τ₀ + η<sub>pl</sub> γ̇</div>`,
  why: [["Pourquoi un viscosimètre capillaire ne convient-il qu'aux fluides newtoniens ?", "La vitesse de cisaillement n'y est ni uniforme ni contrôlée ; pour un fluide non newtonien, la viscosité dépend de cette vitesse, il faut donc mesurer à plusieurs vitesses (viscosimètre rotatif)."],
        ["Pourquoi la thixotropie est-elle utile pour une suspension ?", "Au repos, la structure gélifiée empêche la sédimentation ; à l'agitation, la viscosité chute et on peut verser ou injecter ; puis la structure se reforme lentement."]],
  talk: { prompt: "Dessine de mémoire les rhéogrammes (τ en fonction de γ̇) des 4 types de fluides et donne un exemple pour chacun.", check: ["Newtonien : droite passant par l'origine (eau, glycérol)", "Plastique : droite qui coupe l'axe τ (seuil) (pâtes, suspensions floculées concentrées)", "Pseudoplastique : courbe concave, passe par l'origine (solutions de polymères)", "Dilatant : courbe convexe (suspensions défloculées très concentrées)"] },
  traps: ["Confondre thixotropie (dépend du temps) et pseudoplasticité (dépend de la vitesse de cisaillement, sans délai)."] },

{ id: "c5", title: "Ch. 5 · Systèmes dispersés ↔ Aulton",
  html: `<table><tr><th></th><th>Chapitre (pages)</th><th>À chercher</th></tr>
  <tr><td>★</td><td>4. <i>Surfaces and interfaces</i> ${P(39, 49)}</td><td>Tension superficielle et interfaciale, adsorption des tensioactifs, mouillage, angle de contact</td></tr>
  <tr><td>★</td><td>5. <i>Disperse systems</i> ${P(50, 80)}</td><td>Colloïdes, double couche électrique, <b>potentiel zêta</b>, théorie DLVO, floculation, micelles et CMC, HLB, <b>Stokes</b></td></tr>
  <tr><td>★</td><td>26. <i>Suspensions</i> ${P(407, 423)}</td><td>Suspension <b>floculée vs défloculée</b>, agents de suspension, mouillants, croissance des cristaux</td></tr>
  <tr><td>★</td><td>27. <i>Emulsions and creams</i> ${P(424, 452)}</td><td>Types, émulsifiants, <b>calcul du HLB requis</b> (worked example Tween 80 / Span 80 p. 437), instabilités : <i>creaming, flocculation, coalescence, phase inversion</i>, essais</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Le calcul du mélange de tensioactifs est <b>identique</b> au cours. Aulton approfondit la stabilité des suspensions : une suspension <span class="k">floculée</span> sédimente vite mais se redisperse facilement ; une <span class="k">défloculée</span> sédimente lentement mais forme un dépôt compact (<i>caking</i>) difficile à redisperser.</div>
  <div class="formula">HLB requis = x · HLB<sub>A</sub> + (1 − x) · HLB<sub>B</sub>  ⇒  x = (HLB requis − HLB<sub>B</sub>) / (HLB<sub>A</sub> − HLB<sub>B</sub>)</div>`,
  why: [["Pourquoi mélanger deux émulsifiants plutôt qu'en prendre un seul de la bonne HLB ?", "Un couple à HLB basse + haute forme à l'interface un film mixte plus dense et plus stable qu'un émulsifiant seul."],
        ["Pourquoi une suspension défloculée forme-t-elle un « cake » ?", "Les particules, séparées et petites, sédimentent une à une et s'empilent de façon compacte ; les forces entre elles deviennent trop fortes pour une simple agitation."]],
  talk: { prompt: "Refais l'exemple du livre : HLB requis 10,5 avec Tween 80 (15) et Span 80 (4,3), 5 g d'émulsifiants.", check: ["x = (10,5 − 4,3) / (15 − 4,3) = 0,58", "Tween 80 : 0,58 × 5 = 2,9 g", "Span 80 : 0,42 × 5 = 2,1 g"] },
  traps: ["Mettre la HLB basse au numérateur : x est la fraction de l'émulsifiant à HLB élevée quand on soustrait la HLB basse."] },

{ id: "c7", title: "Ch. 7 · Stérilisation ↔ Aulton",
  html: `<table><tr><th></th><th>Chapitre (pages)</th><th>À chercher</th></tr>
  <tr><td>★</td><td>16. <i>Principles of sterilization</i> ${P(247, 256)}</td><td>Les <b>5 procédés de la Pharmacopée</b> (vapeur sous pression, chaleur sèche, oxyde d'éthylène, rayonnements ionisants, filtration), <b>D value</b>, <b>Z value</b>, facteur d'inactivation, <b>F value</b></td></tr>
  <tr><td>★</td><td>17. <i>Sterilization in practice</i> ${P(257, 274)}</td><td>Cycles, choix du procédé par produit (tableau p. 259), validation, indicateurs biologiques, <b>SAL 10<sup>−6</sup></b> (worked example p. 268), essai de stérilité</td></tr>
  <tr><td>★</td><td>15. <i>Action of physical and chemical agents</i> ${P(229, 246)}</td><td>Cinétique de mort d'ordre 1 : worked example des spores dans des ampoules (p. 231)</td></tr>
  <tr><td>☆</td><td>13–14 (microbiologie) ${P(184, 228)}</td><td>Spores, endotoxines</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Même logique que le cours et que Le Hir. Vocabulaire : <i>moist heat / steam</i> = chaleur humide, <i>dry heat</i>, <i>ethylene oxide</i>, <i>ionizing radiation</i>, <i>bioburden</i> = charge microbienne initiale, <i>sterility assurance level (SAL)</i> = NAS.</div>
  <div class="formula">D = temps pour 1 log (90 %) · log N = log N₀ − t / D = log N₀ − k t / 2,303</div>`,
  why: [["Pourquoi la valeur Z est-elle utile ?", "Elle dit de combien il faut augmenter la température pour diviser D par 10 : on peut ainsi comparer des cycles à des températures différentes (base du calcul de F)."],
        ["Pourquoi le résultat d'un calcul de survivants peut-il être « 10⁻⁹ spore » ?", "C'est une probabilité : 10⁻⁹ signifie une unité non stérile sur un milliard d'unités traitées."]],
  talk: { prompt: "Refais le worked example de la p. 268 : charge 10⁴ spores, SAL visé 10⁻⁶, D = 1,5 min.", check: ["Réduction nécessaire : de 10⁴ à 10⁻⁶ = 10 log", "Durée = 10 × 1,5 = 15 min à 121 °C"] },
  traps: ["Oublier que la charge initiale compte : plus elle est élevée, plus il faut de log de réduction."] },

{ id: "c8", title: "Ch. 8 · Préparations rectales ↔ Aulton",
  html: `<table><tr><th></th><th>Chapitre 44. <i>Rectal and vaginal drug delivery</i> ${P(735, 751)}</th></tr>
  <tr><td>★</td><td>Anatomie et physiologie du rectum, absorption, avantages et limites (encadré p. 739)</td></tr>
  <tr><td>★</td><td><b>Suppository bases</b> : bases grasses (<i>fatty</i>) et hydrosolubles (macrogols, gélatine glycérinée) ; bases semi-synthétiques (Witepsol, Suppocire…)</td></tr>
  <tr><td>★</td><td><b>Displacement value</b> et worked example (p. 742–743)</td></tr>
  <tr><td>★</td><td>Additifs (viscosifiants comme la silice colloïdale), fabrication par fusion, essais</td></tr></table>
  <div class="box trap"><h4>⚠️ Deux différences importantes avec le cours</h4>
  <p><b>1. Displacement value ≠ facteur de déplacement.</b> Aulton : <span class="k">masse de PA qui déplace 1 g de base</span>. Cours (et Le Hir) : <span class="k">masse de base déplacée par 1 g de PA</span>. Ce sont des <b>inverses</b> : f ≈ 1 / DV. Exemple : bismuth sous-gallate, DV = 3,0 dans Aulton ; f = 0,37 dans la table du cours (≈ 1/2,7, la petite différence vient des sources).</p>
  <p><b>2. Beurre de cacao.</b> Aulton écrit qu'il <span class="k">n'est plus utilisé</span> (polymorphisme, contraction insuffisante, ramollissement trop bas, instabilité, faible absorption d'eau, coût). Le cours et Le Hir le présentent encore comme la base de référence : à l'examen, suis le cours.</p></div>
  <div class="formula">Aulton : base = n × E − (masse totale de PA) / DV   ·   Cours : M = E − f·S, × (n + 1)</div>`,
  why: [["Pourquoi les deux définitions donnent-elles le même résultat ?", "Diviser la masse de PA par DV revient à la multiplier par f = 1/DV : c'est la même masse de base déplacée."],
        ["Pourquoi ajoute-t-on de la silice colloïdale dans certaines bases ?", "Quand le PA abaisse le point de fusion de la base, elle devient trop fluide à 37 °C ; un viscosifiant compense sans modifier la température de fusion."]],
  talk: { prompt: "Convertis la méthode d'Aulton en méthode du cours pour 8 suppositoires de 1 g à 200 mg de bismuth sous-gallate (DV = 3).", check: ["Aulton : 1,6 g de PA déplace 1,6/3 = 0,53 g → 8 − 0,53 = 7,47 g", "f = 1/3 = 0,333 → M = 1 − 0,333 × 0,2 = 0,933 g par suppositoire", "Cours : × 9 suppositoires = 8,40 g"] },
  traps: ["Multiplier par la displacement value comme si c'était f : erreur d'un facteur ≈ 9 sur la masse déplacée.", "Oublier le suppositoire supplémentaire du cours en suivant l'exemple d'Aulton."] },

{ id: "c9", title: "Ch. 9 · Excipients ↔ Aulton",
  html: `<p>Aulton n'a pas de chapitre « excipients » : ils sont traités <b>forme par forme</b>.</p>
  <table><tr><th></th><th>Chapitre (pages)</th><th>Excipients traités</th></tr>
  <tr><td>★</td><td>24. <i>Solutions</i> ${P(386, 396)}</td><td>Cosolvants, tampons, isotonisants, édulcorants, arômes, conservateurs</td></tr>
  <tr><td>★</td><td>52. <i>Microbial contamination, spoilage and preservation</i> ${P(860, 870)}</td><td><b>Conservateurs</b> antimicrobiens, facteurs de leur efficacité</td></tr>
  <tr><td>★</td><td>26–27 ${P(407, 452)}</td><td>Agents de suspension, mouillants, émulsifiants, viscosifiants</td></tr>
  <tr><td>★</td><td>31. <i>Tablets</i> ${P(501, 541)}</td><td>Diluants, liants, délitants (<i>disintegrants</i>), lubrifiants, glidants</td></tr>
  <tr><td>☆</td><td>28. <i>Ointments, gels…</i> ${P(453, 462)} · 51. <i>Chemical stability</i> ${P(848, 859)}</td><td>Bases de pommades, gélifiants ; antioxydants et chélateurs</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Le classement d'Aulton est <b>par fonction</b>, comme le cours : c'est la meilleure source pour l'onglet Mélange (excipient → catégorie). Vocabulaire : <i>preservative</i> = conservateur, <i>antioxidant</i>, <i>humectant</i>, <i>glidant</i> = lubrifiant d'écoulement, <i>binder</i> = liant.</div>`,
  why: [["Pourquoi un conservateur peut-il perdre son efficacité dans une émulsion ?", "Il se partage entre les phases et peut se fixer dans les micelles de tensioactif ou sur le conditionnement : la fraction libre dans la phase aqueuse, la seule active, diminue."]],
  traps: ["Traduire « lubricant » et « glidant » par le même mot : le glidant améliore l'écoulement de la poudre, le lubrifiant réduit la friction contre la matrice."] },

{ id: "calc", title: "Calculs (partie éliminatoire) ↔ Aulton",

const METHODS_HTML = `
<div class="card"><h2>Pourquoi cette page est construite ainsi</h2>
<p class="small" style="margin-top:0">Chaque outil de cette page applique une méthode dont l'efficacité a été mesurée dans des études contrôlées en psychologie cognitive et en sciences de l'éducation. La grande revue de Dunlosky et al. (2013) a évalué 10 techniques d'étude : <b>se tester</b> (pratique de récupération) et <b>espacer les révisions</b> obtiennent la note d'utilité la plus élevée ; l'<b>entrelacement</b>, l'<b>interrogation élaborative</b> et l'<b>auto-explication</b> une note moyenne ; <b>relire, surligner et résumer</b> une note faible.</p>
<div class="box trap" style="margin-bottom:0"><b>À éviter :</b> relire le PDF plusieurs fois ou surligner. On a l'impression de savoir parce que le texte est familier, mais on ne s'entraîne pas à le retrouver seule, ce que l'examen exige.</div></div>

<div class="card"><h2>Les méthodes, et où elles sont dans la page</h2>
<div class="method"><b>1. Se tester plutôt que relire (pratique de récupération)</b><br><span class="small">Flashcards, Quiz, Séance du jour. Dans l'étude de Roediger &amp; Karpicke (2006), les étudiants qui s'étaient testés retenaient nettement plus une semaine plus tard que ceux qui avaient relu. Réponds toujours <b>avant</b> de voir la réponse, même si tu n'es pas sûre.</span></div>
<div class="method"><b>2. Espacer les séances</b><br><span class="small">Plan J+1, J+3, J+7, J+14, J+30 et boîtes des flashcards. Cepeda et al. (2008, plus de 1 350 participants) montrent que l'intervalle optimal entre deux révisions augmente avec le délai jusqu'à l'examen. Mieux vaut 15 minutes réparties sur 5 jours que 75 minutes la veille.</span></div>
<div class="method"><b>3. Réapprendre jusqu'au critère, sur plusieurs séances (réapprentissage successif)</b><br><span class="small">Dans les sessions, une question ratée revient jusqu'à ce que tu la réussisses ; puis elle revient les jours suivants. Rawson &amp; Dunlosky recommandent de réussir chaque élément au moins une fois par séance, sur environ 3 séances espacées : c'est ce qui rend le souvenir durable.</span></div>
<div class="method"><b>4. Mélanger les types de problèmes (entrelacement)</b><br><span class="small">Onglet Mélange et Séance du jour. En maths, des élèves ayant mélangé les types d'exercices ont nettement mieux réussi un test surprise un mois plus tard (61 % contre 38 % dans un essai sur 787 élèves de Rohrer et al.). Le gain vient surtout du fait qu'il faut <b>choisir la méthode</b> : c'est pour cela que l'onglet Mélange te demande d'abord « quelle méthode ? ». C'est plus difficile sur le moment, et c'est normal.</span></div>
<div class="method"><b>5. Exemples résolus puis aide qui s'estompe</b><br><span class="small">Onglet Exemples guidés. Au début d'un apprentissage, étudier un exemple résolu est plus efficace que de chercher seule (Sweller ; Renkl). Ensuite, on retire les étapes en commençant par la fin (« estompage arrière », Renkl &amp; Atkinson), jusqu'à résoudre seule. Le niveau s'adapte à tes réussites.</span></div>
<div class="method"><b>6. Se demander « pourquoi ? » et s'expliquer les étapes</b><br><span class="small">Encadrés « Pourquoi ? » de la Leçon active et boutons « pourquoi ? » des exemples. Relier chaque règle à sa raison (interrogation élaborative, auto-explication) aide à comprendre et à transférer à des problèmes nouveaux.</span></div>
<div class="method"><b>7. Expliquer à voix haute, sans regarder</b><br><span class="small">Encadrés « Explique à voix haute ». C'est une forme de rappel libre et d'auto-explication. La liste à cocher te montre ce que tu as oublié.</span></div>
<div class="method"><b>8. Se tester avant d'apprendre (pré-test)</b><br><span class="small">Bouton Pré-test. Essayer de répondre avant d'avoir étudié, même en se trompant, améliore la mémorisation de ce qu'on apprend ensuite (Richland, Kornell &amp; Kao, 2009 ; Kornell, Hays &amp; Bjork, 2009).</span></div>
<div class="method"><b>9. Noter sa certitude et corriger les erreurs « sûres »</b><br><span class="small">Boutons Sûre / Hésitante / Au hasard et tableau de calibration. Les erreurs commises avec une forte confiance sont paradoxalement les mieux corrigées après le feedback (effet d'hypercorrection, Butterfield &amp; Metcalfe, 2001). Comparer ta confiance à tes résultats t'apprend aussi à savoir ce que tu sais vraiment.</span></div>
<div class="method"><b>10. Rendre les bases automatiques (sprints)</b><br><span class="small">Onglet Sprint. Quand les conversions, abréviations et densités sont instantanées, ta mémoire de travail reste disponible pour le raisonnement. On vise d'abord la précision, ensuite la vitesse. Honnêtement : cette idée est surtout étudiée pour le calcul de base chez les enfants, et une étude n'a pas trouvé d'avantage de rétention au simple entraînement chronométré par rapport à la même quantité de pratique. Utilise donc les sprints en complément, pas à la place des autres méthodes.</span></div>
<div class="method"><b>11. Une méthode de calcul stable, avec les unités</b><br><span class="small">Dans les corrections, chaque étape garde son unité (mg, g, mL). En formation infirmière, apprendre à poser les calculs de doses avec les unités (analyse dimensionnelle) a amélioré la précision par rapport au calcul classique. Écris toujours l'unité à chaque ligne et vérifie l'ordre de grandeur.</span></div>
</div>

<div class="card"><h2>Spécial galénique : ce qui change pour ce cours</h2>
<div class="method"><b>Questions ouvertes : rédiger, pas reconnaître</b><br><span class="small">L'examen comporte des questions ouvertes. Reconnaître la bonne réponse dans un QCM ne prouve pas qu'on sait la produire. Les « Questions d'examen » te font rédiger (ou dire) ta réponse, puis la comparer point par point à la réponse attendue : c'est du rappel libre, la forme de test la plus exigeante et la plus proche de l'examen.</span></div>
<div class="method"><b>Partie calculs éliminatoire : viser le sur-apprentissage</b><br><span class="small">Une seule erreur de calcul fait échouer tout le cours. Pour cette partie, « réussir une fois » ne suffit pas : continue à t'entraîner après avoir réussi (problèmes mélangés chaque jour, sans calculatrice), et vérifie systématiquement unités et ordre de grandeur. L'entraînement prolongé au-delà de la première réussite ralentit l'oubli à court terme ; l'espacer garde l'effet sur la durée.</span></div>
<div class="method"><b>Mélanger les chapitres</b><br><span class="small">La « Séance mélangée » et l'« Examen blanc » de la page générale tirent des questions de tous les chapitres : c'est l'entrelacement appliqué au cours entier, comme le jour de l'examen.</span></div></div>

<div class="card"><h2>Mode d'emploi conseillé</h2><ol class="steps">
<li><b>Un nouveau chapitre</b> (45-60 min) : pré-test → Leçon active (notion par notion : « pourquoi ? », voix haute, « Me tester ») → exemples guidés s'il y en a → questions d'examen.</li>
<li><b>Les jours suivants</b> (15-20 min par chapitre prévu) : Séance du jour du chapitre, aux dates du plan (J+1, J+3, J+7, J+14, J+30).</li>
<li><b>Chaque jour</b> : 5 problèmes de calcul mélangés (partie éliminatoire) et, si tu as le temps, un sprint de 60 s.</li>
<li><b>Notions « En cours »</b> : rouvre-les dans la Leçon (mode « Masquer l'essentiel »), refais leur test.</li>
<li><b>Les 10 derniers jours</b> : examens blancs et séances mélangées depuis la page générale ; plus de grosse relecture la veille, dors.</li>
<li><b>Livres</b> (Le Hir, Aulton) : utilise-les pour approfondir une notion ratée, pas pour tout relire.</li></ol></div>

const $ = s => document.querySelector(s);

const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function fmt(n, d = 8) {
  if (typeof n !== "number" || !isFinite(n)) return String(n);
  let s = (Math.round(n * 10 ** d) / 10 ** d).toFixed(d).replace(/0+$/, "").replace(/\.$/, "");
  const [i, f] = s.split(".");
  const ii = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return f ? ii + "," + f : ii;
}
function parseNum(s) {
  if (s == null) return NaN;
  s = String(s).trim().replace(/\s| /g, "").replace(",", ".");
  if (s === "½") return 0.5;
  if (/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)) { const [a, b] = s.split("/"); return parseFloat(a) / parseFloat(b); }
  if (!/^-?(\d+\.?\d*|\.\d+)(e-?\d+)?$/i.test(s)) return NaN;
  return parseFloat(s);
}
function near(x, target, tol) {
  if (isNaN(x)) return false;
  if (tol && tol.abs != null) return Math.abs(x - target) <= tol.abs + 1e-12;
  const rel = tol && tol.rel != null ? tol.rel : 0.005;
  return Math.abs(x - target) <= Math.max(Math.abs(target) * rel, 1e-12);
}
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDays(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function diffDays(a, b) { return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5); }

  try { if (DATA.sumKey) { const all = DATA.concepts.map(c => mastery(c.id)); localStorage.setItem(DATA.sumKey, JSON.stringify({ m: all.reduce((a, b) => a + b, 0) / all.length, due: dueCards().length, last: S.days[S.days.length - 1] || null, started: S.days.length > 0 })); } } catch (e) { } }

/* ---------- répétition espacée (Leitner) ---------- */
function cardState(id) { return S.cards[id] || { box: 0, due: null, seen: 0, lapses: 0 }; }
function gradeCard(id, g) { // g: 0 raté, 1 difficile, 2 bien, 3 facile
  const st = cardState(id); st.seen++;
  if (g === 0) { st.box = 0; st.lapses++; }
  else if (g === 1) st.box = Math.max(1, st.box);
  else if (g === 2) st.box = Math.min(INTERVALS.length - 1, st.box + 1);
  else st.box = Math.min(INTERVALS.length - 1, st.box + 2);
  st.due = addDays(today(), g === 0 ? 0 : INTERVALS[st.box]);
  S.cards[id] = st; save();
}
function dueCards() { const t = today(); return CARDS.filter(c => { const s = S.cards[c.id]; return !s || !s.due || s.due <= t; }); }
function logItem(id, ok) { (S.items[id] = S.items[id] || []).push(ok ? 1 : 0); if (S.items[id].length > 12) S.items[id].shift(); save(); }
function logGen(id, ok) { (S.gens[id] = S.gens[id] || []).push(ok ? 1 : 0); if (S.gens[id].length > 15) S.gens[id].shift(); save(); }
function logConf(c, ok) { if (!c) return; S.conf[c][1]++; if (ok) S.conf[c][0]++; save(); }

/* ---------- maîtrise par notion ---------- */
function mastery(cid) {
  const parts = [];
  const cs = CARDS.filter(c => c.c === cid);
  if (cs.length) parts.push(cs.reduce((a, c) => a + Math.min(cardState(c.id).box, 4) / 4, 0) / cs.length);
  const qs = ITEMS.filter(q => q.c === cid);
  if (qs.length) parts.push(qs.reduce((a, q) => { const r = S.items[q.id] || []; const last = r.slice(-3); return a + (last.length ? last.reduce((x, y) => x + y, 0) / 3 : 0); }, 0) / qs.length);
  const gs = Object.entries(GENS).filter(([k, g]) => g.c === cid);
  if (gs.length) parts.push(gs.reduce((a, [k]) => { const r = (S.gens[k] || []).slice(-5); return a + (r.length ? r.reduce((x, y) => x + y, 0) / 5 : 0); }, 0) / gs.length);
  return parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : 0;
}
function lvl(m) { return m >= .85 ? ["Automatique", "var(--ok)"] : m >= .6 ? ["Solide", "var(--accent)"] : m >= .25 ? ["En cours", "var(--warn)"] : ["À découvrir", "var(--muted)"]; }

/* ================= LECTEUR DE SESSION (quiz, cartes, problèmes) ================= */
let P = null; // session courante
function startSession(title, queue, opts = {}) {
  stopTimers(); cur = ""; renderTabs(); window.scrollTo({ top: 0 });
  P = { title, queue: queue.slice(), done: [], i: 0, opts, total: queue.length, retry: {}, results: [] };
  markDay(); renderItem();
}
function renderItem() {
  stopTimers();
  if (!P.queue.length) return endSession();
  const it = P.queue[0];
  const n = P.done.length, total = n + P.queue.length;
  let h = `<div class="card"><div class="row" style="justify-content:space-between"><span class="pill">${esc(P.title)}</span>
    <span class="small muted">${n} / ${total}</span></div>
    <div class="bar" style="margin:10px 0 14px"><i style="width:${(n / total) * 100}%"></i></div>`;
  if (it.c && CONCEPTS[it.c]) h += `<div class="small muted">${esc(CONCEPTS[it.c].title)}</div>`;
  if (it.t === "card") h += cardHTML(it);
  else if (it.t === "mcq" || it.t === "tf") h += mcqHTML(it);
  else if (it.t === "num") h += numHTML(it);
  else if (it.t === "open") h += openHTML(it);
  h += `</div><div class="row"><button class="btn ghost sm" onclick="endSession()">Terminer la session</button></div>`;
  V().innerHTML = h;
  if (it.t === "num") { const inp = $("#ans"); inp && inp.focus({ preventScroll: true }); }
  if (it.t === "card") document.onkeydown = e => { if (e.key === " " && !it._flip) { e.preventDefault(); flip(); } else if (it._flip && "1234".includes(e.key)) grade(+e.key - 1); };
  if (it.t === "mcq" || it.t === "tf") document.onkeydown = e => { const k = +e.key; if (!it._ans && k >= 1 && k <= (it.o || ["Vrai", "Faux"]).length) selOpt(k - 1); };
}
function cardHTML(it) {
  return `<div class="flash"><div>${it.front}</div>${it._flip ? `<div class="back">${it.back}</div>` : ""}</div>
  ${it._flip ? `<div class="small muted" style="text-align:center;margin-top:8px">Sois honnête : ta réponse était-elle juste et rapide ?</div>
   <div class="grades"><button class="btn g0" onclick="grade(0)">Raté<br><small>revient</small></button><button class="btn" onclick="grade(1)">Difficile</button>
   <button class="btn" onclick="grade(2)">Bien</button><button class="btn g3" onclick="grade(3)">Facile</button></div>`
      : `<div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" onclick="flip()">Retourner <span class="kbd">espace</span></button></div>
   <div class="small muted" style="text-align:center;margin-top:6px">Réponds d'abord dans ta tête (ou à voix haute) avant de retourner.</div>`}`;
}
function openHTML(it) {
  let h = (it.ctx ? `<div class="ctx">${esc(it.ctx)}</div>` : "") + `<div class="q">${it.q}</div>`;
  h += `<textarea id="oa" rows="5" placeholder="Rédige ta réponse comme à l'examen (ou réponds à voix haute), puis compare." ${it._show ? "disabled" : ""}>${esc(it._txt || "")}</textarea>`;
  if (!it._show) h += `<div class="row" style="margin-top:10px"><button class="btn primary" onclick="openShow()">Voir la réponse attendue</button></div>`;
  else h += `<div class="fb" style="background:var(--info-soft);color:var(--ink)"><b>Réponse attendue</b><div class="ex">${it.a}</div></div>
    ${it.keys ? `<div class="small" style="margin-top:10px"><b>Coche les éléments que tu avais :</b></div>${it.keys.map(k => `<label class="row small" style="margin:3px 0;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox"> <span>${k}</span></label>`).join("")}` : ""}
    <div class="grades" style="grid-template-columns:repeat(3,1fr)"><button class="btn g0" onclick="openGrade(0)">Incomplète<br><small>revient</small></button><button class="btn" onclick="openGrade(1)">Presque</button><button class="btn g3" onclick="openGrade(2)">Complète</button></div>`;
  return h;
}
function openShow() { const it = P.queue[0]; it._txt = ($("#oa") || {}).value || ""; it._show = true; renderItem(); }
function openGrade(g) {
  const it = P.queue.shift(); logItem(it.id, g === 2); P.results.push({ it, ok: g === 2 });
  if (g === 0 && !P.opts.noRetry) { P.queue.splice(Math.min(P.queue.length, 4), 0, { ...it, _show: false, _txt: "" }); } else P.done.push(it);
  renderItem();
}
function flip() { P.queue[0]._flip = true; renderItem(); }
function grade(g) {
  const it = P.queue.shift(); gradeCard(it.id, g);
  P.results.push({ it, ok: g >= 2 });
  if (g === 0) { delete it._flip; P.queue.splice(Math.min(P.queue.length, 3), 0, it); } // rappel successif : revient tant que raté
  else P.done.push(it);
  renderItem();
}
function confHTML(disabled) {
  return `<div class="conf"><div class="lab">Valide en indiquant ta certitude :</div><div class="row">
  <button class="btn primary sm" ${disabled ? "disabled" : ""} onclick="submit('sure')">✅ Sûre</button>
  <button class="btn sm" ${disabled ? "disabled" : ""} onclick="submit('mid')">🤔 Hésitante</button>
  <button class="btn sm" ${disabled ? "disabled" : ""} onclick="submit('guess')">🎲 Au hasard</button></div></div>`;
}
function mcqHTML(it) {
  const o = it.o || ["Vrai", "Faux"];
  let h = (it.ctx ? `<div class="ctx">${esc(it.ctx)}</div>` : "") + `<div class="q">${it.q}</div><div class="opts">`;
  o.forEach((t, k) => {
    let cls = "";
    if (it._ans) { if (k === it.a) cls = "ok"; else if (k === it._sel) cls = "ko"; }
    else if (k === it._sel) cls = "sel";
    h += `<button class="opt ${cls}" ${it._ans ? "disabled" : ""} onclick="selOpt(${k})"><span class="n">${k + 1}</span><span>${t}</span></button>`;
  });
  h += `</div>`;
  if (!it._ans) h += confHTML(it._sel == null);
  else h += fbHTML(it, it._sel === it.a, it.ex);
  return h;
}
function selOpt(k) { P.queue[0]._sel = k; renderItem(); }
function numHTML(it) {
  let h = (it.ctx ? `<div class="ctx">${esc(it.ctx)}</div>` : "") + `<div class="q">${it.q}</div>`;
  h += `<div class="row" style="flex-wrap:nowrap"><input id="ans" class="num ${it._ans ? (it._ok ? "ok" : "ko") : ""}" inputmode="decimal" autocomplete="off"
     placeholder="ta réponse" ${it._ans ? `value="${esc(it._raw)}" disabled` : ""} onkeydown="if(event.key==='Enter'&&!${!!it._ans})submit('mid')">
     ${it.unit ? `<b style="min-width:40px">${esc(it.unit)}</b>` : ""}</div>`;
  if (!it._ans) h += confHTML(false) + `<div class="small muted" style="margin-top:6px">Virgule ou point acceptés. <span class="kbd">Entrée</span> = « hésitante ».</div>`;
  else h += fbHTML(it, it._ok, (it.steps ? `<ol class="steps">${it.steps.map(s => `<li>${s}</li>`).join("")}</ol>` : "") + (it.ex || ""));
  return h;
}
function fbHTML(it, ok, ex) {
  const good = it.t === "num" ? `${fmt(it.ans)} ${it.unit || ""}` : (it.o || ["Vrai", "Faux"])[it.a];
  let h = `<div class="fb ${ok ? "ok" : "ko"}"><b>${ok ? "Juste !" : "Pas encore."}</b> ${ok ? "" : `Réponse : <b>${good}</b>`}
    ${ex ? `<div class="ex">${ex}</div>` : ""}</div>`;
  if (!ok && it._conf === "sure") h += `<div class="hyper">💡 <b>Erreur commise avec assurance.</b> C'est justement ce type d'erreur qui se corrige le mieux quand on s'y arrête (effet d'hypercorrection) : relis l'explication et redis-la avec tes mots avant de continuer. Cette question reviendra dans quelques minutes.</div>`;
  else if (!ok) h += `<div class="small muted" style="margin-top:8px">Cette question reviendra plus loin dans la session jusqu'à ce que tu la réussisses.</div>`;
  if (ok && it._conf === "guess") h += `<div class="small muted" style="margin-top:8px">Juste, mais au hasard : elle comptera comme « à revoir ».</div>`;
  h += `<div class="row" style="margin-top:12px"><button class="btn primary" id="nextBtn" onclick="nextItem()">Continuer →</button></div>`;
  return h;
}
function submit(conf) {
  const it = P.queue[0];
  if (it.t === "num") {
    const raw = $("#ans").value; const x = parseNum(raw);
    if (isNaN(x)) { $("#ans").classList.add("ko"); return; }
    it._raw = raw; it._ok = near(x, it.ans, it.tol);
  } else { if (it._sel == null) return; it._ok = it._sel === it.a; }
  it._ans = true; it._conf = conf; logConf(conf, it._ok);
  const counted = it._ok && conf !== "guess";
  if (it.gen) logGen(it.gen, counted); else logItem(it.id, counted);
  P.results.push({ it, ok: it._ok, conf });
  renderItem();
  document.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); nextItem(); } };
  const nb = $("#nextBtn"); nb && nb.focus({ preventScroll: true });
}
function nextItem() {
  const it = P.queue.shift();
  const retry = !it._ok || it._conf === "guess";
  if (retry && !P.opts.noRetry) {
    const again = it.gen && GENS[it.gen] ? makeGen(it.gen) : { ...it, _ans: false, _sel: null, _ok: null, _conf: null, _raw: null };
    P.queue.splice(Math.min(P.queue.length, 4), 0, again);
  } else P.done.push(it);
  renderItem();
}
function endSession() {
  stopTimers();
  const r = P ? P.results : [];
  const first = {}; r.forEach(x => { const key = x.it.id || x.it.gen + x.it.q; if (!(key in first)) first[key] = x.ok; });
  const n = Object.keys(first).length, ok = Object.values(first).filter(Boolean).length;
  const sure = r.filter(x => x.conf === "sure"), sureOk = sure.filter(x => x.ok).length;
  const misses = r.filter(x => !x.ok).map(x => x.it).filter((v, i, a) => a.findIndex(y => (y.q || y.front) === (v.q || v.front)) === i);
  if (P && P.opts.onEnd) P.opts.onEnd(ok, n);
  V().innerHTML = `<div class="card" style="text-align:center"><span class="pill">${esc(P ? P.title : "")}</span>
   <div class="big" style="margin-top:10px">${ok} / ${n}</div><div class="muted">réussies du premier coup</div>
   ${sure.length ? `<p class="small">Calibration : quand tu étais <b>sûre</b>, tu avais raison dans <b>${Math.round(sureOk / sure.length * 100)} %</b> des cas ${sureOk / sure.length < .9 ? "→ ta confiance dépasse encore ta maîtrise, continue à t'auto-tester." : "→ ta confiance est fiable."}</p>` : ""}
   ${misses.length ? `<div style="text-align:left"><h3>À retravailler</h3><ul class="small">${misses.slice(0, 12).map(m => `<li>${m.q || m.front}</li>`).join("")}</ul></div>` : ""}
   <div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" onclick="go('home')">Retour à l'accueil</button>
   ${P && P.opts.again ? `<button class="btn" onclick="(${P.opts.again})()">Recommencer</button>` : ""}</div></div>`;
  P = null;
}
function makeGen(id) { const g = GENS[id]; const x = g.make(); return { t: "num", gen: id, c: g.c, ...x }; }

let SP = null;

function mixMethod(k) { MX.methodOk = MX.opts[k] === GENS[MX.cur.gen].method; MX.stage = 1; document.onkeydown = null; renderMix(); }

VIEWS.mastery = () => {
  const t = today(); const next = [];
  for (let d = 0; d < 7; d++) { const day = addDays(t, d); next.push([day, CARDS.filter(c => { const s = S.cards[c.id]; return d === 0 ? (!s || !s.due || s.due <= day) : s && s.due === day; }).length]); }
  const c = S.conf; const pc = a => a[1] ? Math.round(a[0] / a[1] * 100) + " %" : "–";
  V().innerHTML = `<div class="card"><h2>Ma maîtrise</h2><p class="small muted" style="margin-top:0">Score par notion = flashcards (boîte atteinte) + quiz (3 dernières réponses) + problèmes (5 derniers). « Automatique » = au moins 85 %. Une réponse juste « au hasard » ne compte pas.</p>
  ${DATA.concepts.map(x => { const m = mastery(x.id); const [l, col] = lvl(m); return `<div class="mast"><a href="#" onclick="go('lesson','${x.id}');return false" style="color:inherit">${x.title}</a><div class="bar"><i style="width:${m * 100}%;background:${col}"></i></div><span class="lvl" style="color:${col}">${Math.round(m * 100)}%</span></div>`; }).join("")}
  </div>
  <div class="card"><h3 style="margin-top:0">Calibration de ta confiance</h3><table class="tbl"><tr><th>Quand tu dis…</th><th>tu as raison</th><th>réponses</th></tr>
  <tr><td>✅ Sûre</td><td>${pc(c.sure)}</td><td>${c.sure[1]}</td></tr><tr><td>🤔 Hésitante</td><td>${pc(c.mid)}</td><td>${c.mid[1]}</td></tr><tr><td>🎲 Au hasard</td><td>${pc(c.guess)}</td><td>${c.guess[1]}</td></tr></table>
  <div class="small muted">Idéal : « Sûre » proche de 100 %. Si c'est plus bas, tu surestimes ce que tu sais : c'est le signal pour te tester davantage plutôt que relire.</div></div>
  <div class="card"><h3 style="margin-top:0">Flashcards à revoir les 7 prochains jours</h3><div class="plan">${next.map(([d, n]) => `<div class="${d === t ? "today" : ""}"><b>${n}</b>${frDate(d)}</div>`).join("")}</div></div>
  <div class="card"><h3 style="margin-top:0">Exemples guidés</h3>${DATA.worked.map(w => `<div class="mast"><span>${w.title}</span><div class="bar"><i style="width:${((S.worked[w.id] || 0) / 3) * 100}%"></i></div><span class="lvl">${(S.worked[w.id] || 0) + 1}/4</span></div>`).join("")}</div>`;
};

/* ---------- Méthodes (science de l'apprentissage) ---------- */
VIEWS.methods = () => { V().innerHTML = METHODS_HTML; };

/* ---------- Réglages ---------- */
VIEWS.settings = () => {
  V().innerHTML = `<div class="card"><h2>Sauvegarde de ta progression</h2>
  <p class="small muted" style="margin-top:0">Ta progression est enregistrée dans ce navigateur. Dans Notion, la page intégrée a sa propre mémoire, distincte de la page ouverte directement. Pour changer d'appareil : copie le code ci-dessous et colle-le de l'autre côté.</p>
  <textarea id="exp" rows="4" style="font-size:12px">${esc(JSON.stringify(S))}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText($('#exp').value);this.textContent='Copié ✓'">Copier</button>
  <button class="btn" onclick="try{S=JSON.parse($('#exp').value);save();go('home')}catch(e){alert('Code invalide')}">Importer le code collé</button></div></div>
  <div class="card"><h2>Recommencer</h2><p class="small muted" style="margin-top:0">Efface toute la progression de cette séance (cartes, scores, plan).</p>
  <button class="btn" style="border-color:var(--ko);color:var(--ko)" onclick="if(confirm('Tout effacer ?')){S=blank();save();go('home')}">Tout effacer</button></div>
  <div class="card small muted">Raccourcis clavier : <span class="kbd">espace</span> retourner une carte · <span class="kbd">1</span>–<span class="kbd">4</span> noter une carte ou choisir une option · <span class="kbd">Entrée</span> valider / continuer.</div>`;
};

/* ================= DÉMARRAGE ================= */
if (DATA.hub && typeof HUB_HOME === "function") VIEWS.home = HUB_HOME;
load();
$("#hKick").textContent = DATA.kicker; $("#hTitle").textContent = DATA.title; $("#hSub").textContent = DATA.sub;
go("home");
</script>
