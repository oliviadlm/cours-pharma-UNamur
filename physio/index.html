<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMEDB331 · Physiologie humaine</title>
<style>
:root{
  --bg:#f6f4ee; --card:#fff; --ink:#1d2629; --muted:#687276; --line:#e3ded3;
  --accent:#2f6f62; --accent-ink:#fff; --accent-soft:#e2eee9;
  --ok:#2e7d4f; --ok-soft:#e4f3e9; --ko:#b3412f; --ko-soft:#fbe8e3;
  --warn:#9a6a00; --warn-soft:#fff4d6; --info-soft:#eaf0fb; --r:14px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#17191a; --card:#222527; --ink:#ecebe6; --muted:#9aa3a6; --line:#34393b;
  --accent:#7cc4b2; --accent-ink:#0f201b; --accent-soft:#233630;
  --ok:#7fd29d; --ok-soft:#1f3527; --ko:#f0907d; --ko-soft:#3a2420;
  --warn:#f0c869; --warn-soft:#3a3320; --info-soft:#232c3a;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px}
header .kick{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header h1{font-size:21px;line-height:1.25;margin:3px 0 2px}
header p{margin:0;color:var(--muted);font-size:14px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 14px}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;
  padding:6px 11px;border-radius:999px;cursor:pointer}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 8px} h3{font-size:16px;margin:14px 0 6px}
.muted{color:var(--muted)} .small{font-size:13.5px}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;
  padding:8px 15px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{font-size:13.5px;padding:5px 10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--card);text-align:left;font:inherit;color:inherit}
.tile:hover{border-color:var(--accent)} .tile b{display:block;margin-bottom:2px} .tile span{font-size:13.5px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ctx{background:var(--accent-soft);border-radius:10px;padding:11px 13px;margin:0 0 12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap}
.q{font-size:17px;margin:4px 0 12px}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:11px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:10px;padding:10px 13px;font:inherit;cursor:pointer}
.opt .n{flex:none;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12.5px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .n{background:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)} .opt.ko .n{background:var(--ko);color:#fff}
.opt:disabled{cursor:default}
input.num,input.txt,textarea{font:inherit;font-size:17px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);width:100%}
input.num:focus,input.txt:focus{outline:none;border-color:var(--accent)}
input.ok{border-color:var(--ok);background:var(--ok-soft)} input.ko{border-color:var(--ko);background:var(--ko-soft)}
.conf{margin-top:12px} .conf .lab{font-size:13px;color:var(--muted);margin-bottom:6px}
.fb{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.ko{background:var(--ko-soft);color:var(--ko)}
.fb .ex{color:var(--ink);margin-top:6px;font-size:14.5px}
.hyper{margin-top:10px;background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.flash{min-height:150px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:19px;gap:8px}
.flash .back{font-size:17px;color:var(--accent);font-weight:600;border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.grades .btn{justify-content:center;font-size:14px;padding:8px 4px}
.g0{border-color:var(--ko)!important;color:var(--ko)} .g3{border-color:var(--ok)!important;color:var(--ok)}
.steps{margin:6px 0 0;padding-left:20px} .steps li{margin:5px 0}
.wk li{margin:9px 0} .wk .blank{display:flex;gap:8px;align-items:center;margin-top:5px} .wk .blank input{max-width:180px}
.why{font-size:13.5px;color:var(--muted);cursor:pointer;margin-left:4px;text-decoration:underline dotted}
.whyx{display:block;font-size:14px;background:var(--info-soft);border-radius:8px;padding:6px 10px;margin-top:5px}
.lesson .content p{margin:6px 0}
.lesson table,.tbl{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
.lesson td,.lesson th,.tbl td,.tbl th{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.lesson th,.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.k{transition:filter .2s}
.hidek .k{filter:blur(6px);cursor:pointer;background:var(--accent-soft);border-radius:4px}
.hidek .k.shown{filter:none}
.box{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14.5px}
.box.why2{background:var(--info-soft)} .box.trap{background:var(--ko-soft)} .box.talk{background:var(--warn-soft)}
.box h4{margin:0 0 6px;font-size:14px}
details summary{cursor:pointer;font-weight:600}
.formula{font-size:17px;text-align:center;font-weight:700;margin:8px 0;font-family:ui-monospace,Menlo,Consolas,monospace}
.timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--accent);line-height:1.1}
.plan{display:flex;gap:6px;flex-wrap:wrap}
.plan div{flex:1;min-width:84px;border:1.5px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:13px}
.plan div b{display:block;font-size:15px}
.plan .done{border-color:var(--ok);background:var(--ok-soft)} .plan .today{border-color:var(--accent);border-width:2.5px}
.mast{display:grid;grid-template-columns:1fr 110px 44px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.lvl{font-size:12px;font-weight:700}
.src a{color:var(--accent)}
.kbd{font-family:ui-monospace,Menlo,monospace;background:var(--line);border-radius:5px;padding:1px 6px;font-size:13px}
.hidden{display:none}
.method{border-left:4px solid var(--accent);padding:6px 0 6px 12px;margin:12px 0}
.method b{font-size:15.5px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:12px 0 4px}
.gal figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:zoom-in;transition:transform .15s,box-shadow .15s}
.gal figure:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.gal .ph{height:150px;display:flex;align-items:center;justify-content:center;background:#fff;padding:8px}
.gal .ph.photo{padding:0}
.gal img{max-width:100%;max-height:100%;object-fit:contain}
.gal .ph.photo img{width:100%;height:100%;object-fit:cover}
.gal figcaption{font-size:13px;padding:7px 9px 8px;line-height:1.35;border-top:1px solid var(--line)}
.gal .cr{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.gal .cr a{color:inherit}
#lb{position:fixed;inset:0;background:rgba(20,20,25,.82);display:none;align-items:center;justify-content:center;z-index:99;padding:20px;cursor:zoom-out}
#lb.on{display:flex} #lb div{background:#fff;border-radius:12px;padding:12px;max-width:92vw;max-height:90vh;display:flex;flex-direction:column;align-items:center}
#lb img{max-width:86vw;max-height:76vh;object-fit:contain} #lb p{margin:8px 0 0;font-size:14px;color:#333;text-align:center}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.frow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.fbox{border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--card);font-size:14.5px;text-align:center;min-width:120px;max-width:340px;flex:1 1 140px}
.fbox.stim{border-color:#c98a1a;background:var(--warn-soft)} .fbox.rec{border-color:#6b4fa0;background:#efe9f8} .fbox.ctr{border-color:#b3412f;background:var(--ko-soft)}
.fbox.eff{border-color:#2f5d8a;background:var(--info-soft)} .fbox.rep{border-color:var(--ok);background:var(--ok-soft)}
@media (prefers-color-scheme: dark){.fbox.rec{background:#2c2540}}
.fbox.hid{cursor:pointer;background:repeating-linear-gradient(45deg,var(--line),var(--line) 6px,var(--card) 6px,var(--card) 12px)}
.fbox .q{display:none}.fbox.hid .q{display:inline;font-weight:700;font-size:18px}.fbox.hid .a{display:none}
.arr{font-size:20px;color:var(--muted);line-height:1.2;margin:2px 0}
.loop{margin-top:10px;font-size:13.5px;color:var(--ko);font-weight:600}
</style>
</head>

{ id: "pompe", title: "Le cœur : deux pompes en série",

{ id: "elec", title: "Activité électrique : pacemakers, conduction, ECG",

{ id: "dc", title: "Débit cardiaque et sa régulation",

  <p><b>Fréquence</b> : SNA <span class="k">sympathique</span> (« fight or flight ») ↑ ; <span class="k">parasympathique (nerf vague, ACh, récepteurs M2)</span> ↓. Le PS n'innerve que les oreillettes (pacemakers) → peu d'effet sur la force ventriculaire.</p>
  <p><b>Volume d'éjection</b> :</p>
  <ul><li><b>Intrinsèque : loi de Frank-Starling</b> : plus le ventricule est rempli (↑ VTD, étirement des sarcomères vers la longueur optimale), plus il éjecte. <span class="k">Le cœur pompe tout le sang qui lui arrive</span>. Déterminants du VTD : retour veineux ← volémie, tonus veineux (sympathique), pompe musculaire, pompe respiratoire.</li>
  <li><b>Extrinsèque : sympathique (β1)</b> : <span class="k">effet inotrope +</span> (plus de Ca²⁺ libéré) → VES ↑ à VTD identique (VTS ↓) ; <span class="k">effet lusitrope +</span> (repompage Ca²⁺ plus rapide → relaxation plus courte, utile quand la FC monte).</li></ul>
  <table><tr><th>Effet</th><th>SNA S</th><th>SNA PS</th></tr>
  <tr><td>Chronotrope (fréquence)</td><td>+</td><td>−</td></tr><tr><td>Dromotrope (vitesse de conduction)</td><td>+</td><td>−−</td></tr>
  <tr><td>Bathmotrope (excitabilité)</td><td>+</td><td>−</td></tr><tr><td>Inotrope (force)</td><td>++</td><td>(−)</td></tr><tr><td>Lusitrope (relaxation)</td><td>+</td><td>/</td></tr></table>`,
  why: [["Pourquoi le sympathique augmente-t-il le VES sans augmenter le VTD ?", "Il augmente la force (inotrope) : le ventricule se vide davantage, le volume télésystolique diminue. VES = VTD − VTS augmente."],
        ["Pourquoi la pompe respiratoire augmente-t-elle le retour veineux ?", "À l'inspiration, la pression intrathoracique devient plus négative : elle « aspire » le sang vers l'oreillette droite, et la descente du diaphragme comprime l'abdomen."]],
  talk: { prompt: "Quels facteurs déterminent le débit cardiaque ? Construis le schéma de synthèse (tuyau ⭐).", check: ["DC = FC × VES", "FC : dépolarisation des pacemakers, ↑ sympathique, ↓ parasympathique", "VES : contractilité (sympathique, Ca²⁺) + VTD (Frank-Starling)", "VTD ← retour veineux ← constriction veineuse, pompes musculaire et respiratoire, volémie"] },
  traps: ["Dire que le parasympathique diminue fortement la force ventriculaire (il n'innerve presque pas les ventricules).", "Confondre chronotrope (fréquence) et dromotrope (conduction)."] },

{ id: "hemo", title: "Hémodynamique : débit, résistance, vitesse",
  html: `<p><span class="k">Q = ΔP / R</span> (débit = différence de pression / résistance). Le flux n'existe que s'il y a un gradient de pression ; c'est le <b>ΔP</b> qui compte, pas la valeur absolue.</p>
  <p><b>Loi de Poiseuille</b> : <span class="k">R = 8 η L / (π r⁴)</span>. η = viscosité (dépend de l'hématocrite), L = longueur (stable), <span class="k">r = rayon, à la puissance 4</span> → le tonus vasculaire est le levier majeur : diviser le rayon par 2 multiplie la résistance par 16.</p>
  <p><b>Vitesse ≠ débit</b> : <span class="k">v = Q / A</span> (A = section totale). Débit = volume/temps (mL/min) ; vitesse = distance/temps. Comme la <span class="k">section totale des capillaires est énorme</span>, la vitesse y est minimale (aorte ~5 cm/s ; capillaires 0,5-1 mm/s) → favorise les échanges (loi de Fick).</p>
  <p>Perfusion = volume / temps / masse de tissu (mL/g·s).</p>
  <p><b>Distribution du DC</b> : globalement proportionnelle à la consommation d'O₂, sauf : <span class="k">rein</span> (débit > besoins : filtration), <span class="k">peau</span> (débit > besoins : thermorégulation), <span class="k">myocarde et cerveau</span> (débit < besoins relatifs → très sensibles à l'hypoxie : « fragilité métabolique »).</p>`,
  why: [["Pourquoi la pression chute-t-elle surtout au niveau des artérioles ?", "Parce que leur résistance est la plus élevée (petit rayon + muscle lisse) : la chute de pression ΔP = Q × R est proportionnelle à la résistance. Ce n'est pas parce qu'elles ont la plus grande section (ce sont les capillaires) ni la vitesse la plus élevée (aorte)."]],
  talk: { prompt: "Explique pourquoi le sang va plus lentement dans les capillaires que dans l'aorte alors que chaque capillaire est minuscule.", check: ["Débit total identique à chaque niveau (en série)", "v = Q/A : c'est la section TOTALE qui compte", "Capillaires en parallèle : section totale énorme → vitesse minimale", "Lenteur = temps d'échange (Fick)"] },
  traps: ["Confondre débit et vitesse.", "Oublier la puissance 4 du rayon.", "Dire que la vitesse est maximale dans les capillaires parce qu'ils sont étroits."] },

{ id: "vaisseaux", title: "Artères, artérioles, veines : rôles",
  html: `<table><tr><th>Vaisseau</th><th>Rôle</th></tr>
  <tr><td><b>Artères</b></td><td>Voie d'écoulement rapide et <span class="k">réservoir de pression</span> grâce à l'élasticité de leur paroi : elles se distendent en systole et restituent l'énergie en diastole (débit capillaire continu).</td></tr>
  <tr><td><b>Artérioles</b></td><td><span class="k">Principaux vaisseaux résistifs</span> (> 60 % de la résistance), muscle lisse → règlent la distribution du sang et la pression artérielle.</td></tr>
  <tr><td><b>Capillaires</b></td><td>Site d'échange (paroi 1 µm, sans muscle lisse, 600 m², vitesse lente).</td></tr>
  <tr><td><b>Veines</b></td><td>Conduits à faible résistance, peu élastiques mais très compliants : <span class="k">réservoir de volume</span> (~60-65 % du sang).</td></tr></table>
  <p><b>Tonus artériolaire</b></p>
  <ul><li><b>Intrinsèque (local)</b> : ajuste la perfusion de chaque organe : facteurs métaboliques (↑ pCO₂, ↓ pH, ↓ pO₂ → vasodilatation), médiateurs locaux (VD : <span class="k">NO, histamine, PGI₂, PGE₂, bradykinine</span> ; VC : <span class="k">endothéline, TxA₂, PGF₂α</span>), température, <span class="k">autorégulation myogénique</span> (cerveau, rein, cœur : débit stable entre ~50 et 150-180 mmHg).</li>
  <li><b>Extrinsèque (systémique)</b> : sympathique (NA, α1 → VC ; pas au cerveau), adrénaline, <span class="k">angiotensine II</span> (VC), <span class="k">ADH/vasopressine</span> (VC à forte dose).</li></ul>
  <table><tr><th>Récepteur</th><th>Où</th><th>Effet</th><th>Voie</th></tr>
  <tr><td>α1</td><td>Majorité des vaisseaux</td><td>Constriction</td><td>PLC → IP₃ + DAG → Ca²⁺ ↑</td></tr>
  <tr><td>α2</td><td>Vaisseaux cutanés</td><td>Constriction</td><td>AC inhibée, AMPc ↓</td></tr>
  <tr><td>β1</td><td>Pacemakers, myocarde</td><td>Chronotrope +, inotrope +</td><td>AC → AMPc ↑</td></tr>
  <tr><td>β2</td><td>Artères du myocarde et du muscle squelettique (et bronches)</td><td>Dilatation</td><td>AMPc ↑ (myosine kinase inhibée, K⁺ sort, pompes Ca²⁺ accélérées)</td></tr></table>
  <p>Affinités : α : NA > A ; β2 : A > NA. M2 (parasympathique) : chronotrope − sur les pacemakers.</p>`,
  why: [["Pourquoi l'élasticité artérielle diminue-t-elle avec l'âge la pression ?", "Elle l'augmente : des artères rigides n'amortissent plus la systole, la pression systolique monte (et la pulsée s'élargit)."]],
  talk: { prompt: "Comment un organe en activité (muscle à l'effort) obtient-il plus de sang sans faire chuter la pression ailleurs ?", check: ["Vasodilatation locale métabolique (CO₂, H⁺, adénosine, K⁺…) + β2 par l'adrénaline", "Vasoconstriction sympathique α1 ailleurs (digestif, peau, rein)", "DC augmenté par le sympathique", "Cerveau/cœur protégés par l'autorégulation"] },
  traps: ["Attribuer la vasodilatation des muscles à la noradrénaline sur α1 (c'est β2 / facteurs locaux).", "Dire que les veines sont résistives."] },

{ id: "capil", title: "Échanges capillaires, forces de Starling, œdème, lymphe",
  html: `<p>Passage de liquide = « <b>fluid shift</b> » entre plasma et interstitium, déterminé par 4 pressions :</p>
  <p class="ctx">Pression nette de filtration = (Pcap + πint) − (πcap + Pint)</p>
  <p>Pcap = pression hydrostatique capillaire (pousse dehors) ; πcap = pression oncotique plasmatique (protéines, retient dedans ≈ 25-26 mmHg) ; Pint = hydrostatique interstitielle ; πint = oncotique interstitielle.</p>
  <ul><li><b>Théorie de Starling</b> : un même capillaire <span class="k">filtre côté artériolaire</span> (Pcap ≈ 35 mmHg) et <span class="k">réabsorbe côté veinulaire</span> (Pcap ≈ 15-17 mmHg) ; la filtration l'emporte légèrement.</li>
  <li><b>Théorie des sphincters</b> : un capillaire filtre ou réabsorbe selon l'ouverture de son <span class="k">sphincter précapillaire</span> (qui modifie Pcap).</li></ul>
  <p>L'excédent filtré (≈ <span class="k">3 L/jour</span>) retourne au sang par le <b>système lymphatique</b> (canal thoracique). Lymphe : récupère protéines filtrées, défense immunitaire, transport des lipides absorbés (chylomicrons). Absente du SNC.</p>
  <p><b>Œdème</b> = accumulation de liquide interstitiel quand la filtration nette est trop grande :</p>
  <table><tr><th>Cause</th><th>Exemple</th></tr>
  <tr><td>↑ Pcap</td><td>Hypertension veineuse, <span class="k">insuffisance cardiaque</span></td></tr>
  <tr><td>↓ πcap</td><td><span class="k">Hypoprotéinémie</span> (malnutrition, insuffisance hépatique, protéinurie)</td></tr>
  <tr><td>↑ πint (perméabilité ↑)</td><td><span class="k">Inflammation</span> (histamine)</td></tr>
  <tr><td>Drainage lymphatique insuffisant</td><td>Obstruction (éléphantiasis)</td></tr></table>`,
  why: [["Pourquoi une personne dénutrie a-t-elle le ventre gonflé (kwashiorkor) ?", "Peu de protéines plasmatiques → pression oncotique basse → le liquide reste dans l'interstitium (et les cavités) au lieu d'être réabsorbé."]],
  talk: { prompt: "Explique les forces de Starling et cite 4 causes d'œdème avec un exemple chacune.", check: ["Pcap et πint poussent dehors, πcap et Pint retiennent", "Filtration côté artériolaire, réabsorption côté veinulaire", "Lymphe : ~3 L/j", "4 causes : Pcap ↑, πcap ↓, perméabilité ↑, lymphe bloquée"] },
  traps: ["Inverser le sens de la pression oncotique (elle attire l'eau VERS les protéines).", "Oublier le rôle de la lymphe."] },

{ id: "pa", title: "Pression artérielle et sa régulation",
  html: `<p><span class="k">PAM = Pdiastolique + 1/3 (Psystolique − Pdiastolique)</span> ; ex. 80 + (120 − 80)/3 ≈ <b>93 mmHg</b>. Mesure : sphygmomanomètre (cf. TP). Pouls = onde de choc de la systole palpable sur les artères.</p>
  <p><b>La PA dépend de</b> : <span class="k">(1) tonus vasculaire / résistance</span>, <span class="k">(2) débit cardiaque (FC × VES)</span>, <span class="k">(3) volume sanguin</span> (+ distribution artères/veines). Facteurs : volémie, élasticité artérielle (âge), respiration, émotions, effort, digestion, grossesse.</p>
  <table><tr><th>Court terme (s → min)</th><th>Long terme (h → jours)</th></tr>
  <tr><td><b>Nerveux</b> : <span class="k">baroréflexe</span> ; réponse ischémique du SNC (< 60 mmHg : pCO₂ ↑, lactate → sympathique massif)<br><b>Hormonal</b> : A/NA, rénine-angiotensine, ADH, ANP<br><b>Intrinsèque</b> : relaxation de stress, fluid shift capillaire</td>
  <td><b>Rein fonctionnel</b> : excrétion de Na⁺/eau (diurèse de pression), <span class="k">système rénine-angiotensine-aldostérone</span>. Gain « infini » : seul le rein ramène la PA exactement à sa consigne.</td></tr></table>
  <p><b>Baroréflexe</b> (⭐ schéma à compléter) : ↑ PA → étirement des <span class="k">barorécepteurs du sinus carotidien et de la crosse aortique</span> → afférences <span class="k">IX (glossopharyngien) et X (vague)</span> → centres cardio-vasculaires du <b>bulbe rachidien</b> → inhibition du centre vasoconstricteur + stimulation du centre cardio-inhibiteur → vasodilatation + effets chronotrope/inotrope négatifs → ↓ PA (et l'inverse si la PA baisse).</p>
  <p><b>Hormones</b> :</p>
  <ul><li><b>Rénine-angiotensine-aldostérone</b> : chute de pression dans l'artériole afférente rénale → rénine (appareil juxtaglomérulaire) → angiotensinogène (foie) → Ang I → (ECA, poumon) → <span class="k">Ang II</span> : vasoconstriction, réabsorption de Na⁺ au tube proximal, sécrétion d'<span class="k">aldostérone</span> (corticosurrénale → pompes Na⁺/K⁺ du tube distal/collecteur → Na⁺ puis eau réabsorbés → volémie ↑), soif, ADH.</li>
  <li><b>ADH</b> (neurohypophyse) : chute de pression/volume (et ↑ osmolarité) → aquaporines au tube collecteur → eau réabsorbée ; VC à forte concentration.</li>
  <li><b>ANP</b> (oreillettes) : stimulus = <span class="k">distension auriculaire</span> → ↓ réabsorption de Na⁺ (natriurèse) et d'eau, ↓ rénine, ↓ effets adrénergiques → volémie et PA ↓.</li></ul>
  <p><b>Hypotension orthostatique</b> (⭐) : lever → sang qui stagne dans les jambes → ↓ retour veineux → ↓ VTD → ↓ VES → ↓ DC → ↓ PA → baroréflexe : sympathique ↑ (FC ↑, contractilité ↑, VC artériolaire et veineuse) → PA restaurée.</p>`,
  why: [["Pourquoi le baroréflexe ne règle-t-il pas la PA à long terme ?", "Les barorécepteurs s'adaptent (se « réinitialisent ») en quelques jours à une nouvelle valeur : seule la régulation rénale du volume a un effet durable."],
        ["Pourquoi l'ANP baisse-t-elle la PA ?", "Une oreillette distendue signale un excès de volume : l'ANP fait éliminer du Na⁺ (et donc de l'eau) et freine rénine et sympathique."]],
  talk: { prompt: "Un patient perd brutalement 1 L de sang. Décris toutes les réponses qui vont limiter la chute de pression, de la plus rapide à la plus lente.", check: ["Baroréflexe : sympathique ↑ (FC, inotropie, VC artériolaire et veineuse), vague ↓", "Adrénaline médullosurrénale", "Fluid shift : Pcap ↓ → réabsorption interstitielle", "Rénine-angiotensine II (VC, Na⁺) + aldostérone", "ADH (eau, VC) ; soif", "Long terme : rein + moelle (érythropoïétine)"] },
  traps: ["Dire que les barorécepteurs sont dans les oreillettes (ce sont des récepteurs de volume) au lieu de sinus carotidien/crosse aortique.", "Calculer la PAM comme (PS + PD)/2.", "Confondre ANP (↓ PA) et aldostérone (↑ PA)."] },

{ id: "circ", title: "Circulations particulières et sang/hémostase",
  html: `<p><b>Systèmes porte</b> (deux réseaux capillaires en série) : <span class="k">hypothalamo-hypophysaire</span> (hormones), <span class="k">hépatique</span> (nutriments), <span class="k">rénal</span> (capillaires glomérulaires à haute pression = filtration, puis péritubulaires à basse pression = réabsorption).</p>
  <p><b>Circulation fœtale</b> : <span class="k">canal artériel</span> (artère pulmonaire → aorte), <span class="k">foramen ovale (trou de Botal)</span> (OD → OG), <span class="k">canal d'Arantius (ductus venosus)</span> (veine ombilicale → veine cave, court-circuite le foie). À la naissance, la pO₂ monte : vasodilatation pulmonaire, constriction du canal artériel (fermeture fonctionnelle en quelques jours). Lien cardio-respi !</p>
  <p><b>Contre-courant</b> : cutané (thermorégulation), testiculaire (température, testostérone), ovarien (signal utérin lutéotrope/lytique).</p>
  <p><b>Sang</b> = plasma + éléments figurés ; ≈ <span class="k">8 % (1/13ᵉ) du poids</span>, 5-5,5 L (60-70 mL/kg). Influencé par l'âge (masse grasse ↑ → volume ↓), l'alimentation, l'entraînement, la grossesse, la lactation.</p>
  <p><b>Hémostase</b> : vasoconstriction → clou plaquettaire (TxA₂) → coagulation → fibrinolyse.</p>
  <ul><li>Voie <b>extrinsèque</b> (secondes) : facteur tissulaire (III) + VII, c'est le <span class="k">point de départ</span> ; voie <b>intrinsèque</b> (minutes, facteur XII, coagulation en tube) : <span class="k">amplificateur</span>. Les deux activent le X → <span class="k">thrombine</span> → fibrinogène → fibrine ; la thrombine amplifie (V, VIII, XI).</li>
  <li>Régulation : <span class="k">antithrombine III</span>, <span class="k">protéine C</span> (thrombine-thrombomoduline → inhibe Va, VIIIa), TFPI.</li>
  <li>Fibrinolyse : <span class="k">plasmine</span> (du plasminogène, activé par t-PA, pro-urokinase).</li>
  <li>Pharmaco : <span class="k">aspirine à faible dose</span> inhibe la COX plaquettaire → moins de TxA₂ → moins d'agrégation.</li></ul>`,
  why: [["Quelle répercussion aura un trouble des échanges gazeux chez un nouveau-né ?", "Si la pO₂ reste basse, le canal artériel ne se ferme pas bien et les artères pulmonaires restent contractées : le sang continue à court-circuiter les poumons → hypoxémie aggravée (cercle vicieux). On le suspecte à la cyanose et la détresse respiratoire."]],
  talk: { prompt: "Explique la circulation fœtale et ce qui change à la naissance.", check: ["3 shunts : canal artériel, foramen ovale, canal d'Arantius", "Poumons non ventilés : résistance pulmonaire élevée", "Naissance : pO₂ ↑ → VD pulmonaire, constriction du canal artériel", "Foramen ovale fermé par l'inversion des pressions OG > OD"] },
  traps: ["Confondre canal artériel (pulmonaire-aorte) et foramen ovale (oreillettes)."] }
],

gens: {
dc: { c: "dc", method: "Débit cardiaque : DC = FC × VES", make() {
  const fc = pick([60, 65, 70, 75, 80, 90, 120, 150]); const ves = pick([60, 65, 70, 80, 90, 100, 120]);
  return { q: `FC = ${fc}/min, VES = ${ves} mL. Débit cardiaque (L/min) ?`, ans: r10(fc * ves / 1000), unit: "L/min", tol: { rel: 0.02 }, steps: [`DC = FC × VES = ${fc} × ${ves} = ${fc * ves} mL/min`, `= <b>${fmt(r10(fc * ves / 1000))} L/min</b>`] };
} },
ves: { c: "cycle", method: "Volumes : VES = VTD − VTS ; FE = VES/VTD", make() {
  const vtd = pick([120, 130, 135, 140, 150, 160]); const vts = pick([40, 50, 55, 60, 65, 70]); const ask = pick(["ves", "fe"]);
  const ves = vtd - vts; return ask === "ves" ? { q: `VTD = ${vtd} mL, VTS = ${vts} mL. Volume d'éjection (mL) ?`, ans: ves, unit: "mL", tol: { abs: 0.5 }, steps: [`VES = VTD − VTS = ${vtd} − ${vts} = <b>${ves} mL</b>`] }
  : { q: `VTD = ${vtd} mL, VTS = ${vts} mL. Fraction d'éjection (%) ?`, ans: Math.round(ves / vtd * 100), unit: "%", tol: { abs: 1 }, steps: [`VES = ${ves} mL`, `FE = ${ves}/${vtd} = <b>${Math.round(ves / vtd * 100)} %</b>`] };
} },
pam: { c: "pa", method: "PAM = PD + 1/3 (PS − PD)", make() {
  const ps = pick([100, 110, 120, 130, 140, 150, 160]); const pd = pick([60, 65, 70, 80, 90]); const v = pd + (ps - pd) / 3;
  return { q: `PA = ${ps}/${pd} mmHg. PAM (mmHg) ?`, ans: Math.round(v), unit: "mmHg", tol: { abs: 1 }, steps: [`Pression pulsée = ${ps} − ${pd} = ${ps - pd}`, `PAM = ${pd} + ${ps - pd}/3 = <b>${fmt(Math.round(v))} mmHg</b>`] };
} },
starling: { c: "capil", method: "Forces de Starling : pression nette", make() {
  const pc = pick([30, 32, 35, 38, 40, 15, 17, 20]); const pic = pick([24, 25, 26, 28]); const pii = pick([0, 1, 3, 5]); const pint = pick([0, 1, 2]);
  const net = (pc + pii) - (pic + pint);
  return { q: `Pcap = ${pc}, πcap = ${pic}, Pint = ${pint}, πint = ${pii} mmHg. Pression nette (mmHg, + = filtration) ?`, ans: net, unit: "mmHg", tol: { abs: 0.5 }, steps: [`(Pcap + πint) − (πcap + Pint) = (${pc} + ${pii}) − (${pic} + ${pint})`, `= <b>${net} mmHg</b> → ${net > 0 ? "filtration" : net < 0 ? "réabsorption" : "équilibre"}`] };
} },
poise: { c: "hemo", method: "Poiseuille : effet du rayon (R ∝ 1/r⁴)", make() {
  const f = pick([2, 0.5, 1.5, 3]); const r = 1 / Math.pow(f, 4);
  return { q: `Le rayon d'une artériole est multiplié par ${fmt(f)}. Par combien la résistance est-elle multipliée ? (à débit dépendant seulement de r)`, ans: r4(r), unit: "×", tol: { rel: 0.02 }, steps: [`R ∝ 1/r⁴`, `1 / ${fmt(f)}⁴ = <b>${fmt(r4(r))}</b>`] };
} }
},

concepts: [
{ id: "fonc", title: "Fonctions et anatomie fonctionnelle",
  html: `<p><b>Fonctions</b> : respiration (apport d'O₂, élimination du CO₂ ; interne = cellulaire, externe = pulmonaire), <span class="k">contrôle de l'équilibre acido-basique</span>, thermorégulation, humidification/réchauffement de l'air, odorat, phonation, <span class="k">pompe respiratoire</span> (retour veineux), rôle métabolique (métabolisation des prostaglandines, ECA).</p>
  <p>Système respiratoire = <span class="k">voies respiratoires (perméabilité → écoulement de l'air)</span> + <span class="k">parenchyme (alvéoles → diffusion O₂/CO₂)</span>.</p>
  <ul><li><b>Cavités nasales</b> : cornets très vascularisés → <span class="k">réchauffent et humidifient</span> ; épithélium cilié + cellules à mucus → <span class="k">filtre</span> ; olfaction. La respiration buccale a <span class="k">moins de résistance</span> (effort, nez bouché) mais l'air n'est ni réchauffé ni filtré → risque d'infection des voies basses.</li>
  <li><b>Trachée, bronches</b> : anneaux cartilagineux, <span class="k">appareil mucociliaire</span>. Diamètre bronchique = tonus du muscle lisse (<span class="k">sympathique → bronchodilatation (β2)</span>, <span class="k">parasympathique → bronchoconstriction (M3)</span>) + épaisseur de la muqueuse (œdème, bronchite) + mucus.</li>
  <li><b>Alvéoles</b> : <span class="k">pneumocytes I</span> (échanges), <span class="k">pneumocytes II (surfactant)</span>, macrophages ; barrière alvéolo-capillaire très fine (~0,5 µm).</li></ul>`,
  why: [["Pourquoi un rhume (nez bouché) peut-il favoriser une bronchite ?", "On respire par la bouche : l'air arrive froid, sec et non filtré dans les voies inférieures (TD respi, cas de Jeanne)."]],
  talk: { prompt: "Quelles sont les fonctions du système respiratoire autres que les échanges gazeux ?", check: ["Équilibre acido-basique", "Thermorégulation, humidification, filtration", "Pompe respiratoire (retour veineux)", "Phonation, odorat, métabolisme (PG, ECA)"] },

{ id: "meca", title: "Mécanique ventilatoire : pressions et muscles",
  html: `<p>L'air circule selon un <span class="k">gradient de pression</span> : débit = ΔP / R. Patm = 760 mmHg (niveau de la mer).</p>
  <ul><li>P alvéolaire <span class="k">< Patm → inspiration</span> ; <span class="k">> Patm → expiration</span> ; = Patm → transition.</li>
  <li><span class="k">Pression pleurale (intrapleurale) toujours < Patm</span> (négative) : maintenue par des <b>plèvres intactes</b> (le poumon tend à se rétracter, la cage thoracique à s'expandre).</li></ul>
  <p><b>Inspiration (active)</b> : contraction du <span class="k">diaphragme</span> (principal) et des <span class="k">intercostaux externes</span> → volume thoracique ↑ → pression pleurale encore plus négative → alvéoles dilatées → P alvéolaire < Patm → l'air entre (loi de Boyle : P₁V₁ = P₂V₂).</p>
  <p><b>Expiration (passive au repos)</b> : relâchement des muscles + retrait élastique → P alvéolaire > Patm. <b>Active</b> (effort, toux) : <span class="k">intercostaux internes + abdominaux</span>.</p>
  <p>Muscles respiratoires = <span class="k">muscles striés squelettiques</span> : motoneurones α, <span class="k">ACh sur récepteurs nicotiniques</span> (→ bloqués par le <b>curare</b> ; botulisme : pas de libération d'ACh ; tétanos : contracture). Nerf phrénique pour le diaphragme.</p>
  <p><b>Pneumothorax</b> : air dans la plèvre → pression pleurale = Patm → le poumon <span class="k">se collabe</span> (retrait élastique non contrebalancé).</p>`,
  why: [["Pourquoi un pneumothorax empêche-t-il le poumon de se gonfler ?", "La dépression pleurale qui « tire » le poumon contre la paroi disparaît : le poumon se rétracte sous l'effet de son élasticité et ne suit plus les mouvements du thorax."],
        ["Pourquoi un patient curarisé doit-il être ventilé ?", "Le curare bloque les récepteurs nicotiniques de la jonction neuromusculaire : diaphragme et intercostaux paralysés."]],
  talk: { prompt: "Explique une inspiration puis une expiration, en suivant les pressions pleurale et alvéolaire.", check: ["Diaphragme + intercostaux externes (actif)", "P pleurale plus négative → alvéoles distendues", "P alvéolaire < Patm → entrée d'air", "Expiration passive (retrait élastique), active à l'effort (intercostaux internes, abdominaux)", "Plèvres intactes indispensables"] },
  traps: ["Dire que la pression pleurale devient positive pendant l'expiration calme (elle reste négative).", "Oublier que le diaphragme est un muscle strié (récepteur nicotinique)."] },

{ id: "rc", title: "Résistance des voies aériennes, compliance, surfactant",
  html: `<p><b>Résistance</b> : R = 8 µ L / (π r⁴). <span class="k">≈ 60 % de la résistance totale est extrathoracique</span> (nez, pharynx, larynx) ; la respiration buccale la divise par 2. Les bronches intrathoraciques sont <span class="k">dilatées passivement à l'inspiration</span> (dépression pleurale) et comprimées à l'expiration (anneaux incomplets) → un obstacle bronchique gêne surtout l'<b>expiration</b> (sifflements, asthme).</p>
  <p><b>Compliance</b> : <span class="k">C = ΔV / ΔP</span> = facilité à distendre le poumon (effort inspiratoire). <b>Retrait élastique (élastance)</b> = facilité à revenir au volume de départ : dû aux fibres élastiques et à la <span class="k">tension de surface alvéolaire</span>.</p>
  <p><b>Loi de Laplace</b> : <span class="k">P = 2T / r</span> → sans surfactant, les petites alvéoles se videraient dans les grandes et collaberaient.</p>
  <p><b>Surfactant</b> (pneumocytes II) : phospholipides (phosphatidylcholine/DPPC, phosphatidylglycérol) + protéines → <span class="k">↓ tension de surface</span> → ↑ compliance, stabilité des alvéoles. Synthèse induite par les <span class="k">glucocorticoïdes</span> (stress fœtal), libération par l'adrénaline (naissance). Indispensable au nouveau-né : un <b>prématuré</b> en manque → tension de surface ↑, <span class="k">compliance ↓</span> (détresse respiratoire).</p>
  <p><b>Travail respiratoire</b> : 1-2 % de l'énergie au repos, ~10 % à l'effort. Augmenté si : ΔP réduite (tétanos, motoneurones, centre respiratoire), R ↑ (asthme, bronchite), compliance ↓ (manque de surfactant, œdème pulmonaire, fibrose ; l'emphysème, lui, augmente la compliance mais réduit le retrait élastique).</p>`,
  why: [["Prématuré déficient en surfactant : tension de surface et compliance ?", "Tension de surface alvéolaire augmentée, compliance pulmonaire diminuée (examen août 2019)."],
        ["Pourquoi l'asthmatique a-t-il surtout du mal à expirer ?", "À l'expiration, la pression pleurale moins négative (ou positive si expiration forcée) comprime les bronches déjà rétrécies : elles se ferment, l'air est piégé."]],
  talk: { prompt: "Qu'est-ce que la compliance pulmonaire ? Quels facteurs la modifient ? Rôle du surfactant ?", check: ["C = ΔV/ΔP", "Retrait élastique : fibres élastiques + tension de surface", "Laplace P = 2T/r", "Surfactant : pneumocytes II, phospholipides, ↓ T", "Exemples : prématuré, fibrose, œdème, emphysème"] },
  traps: ["Confondre compliance (distensibilité) et élastance (retour).", "Dire que l'emphysème diminue la compliance (il l'augmente ; c'est la fibrose qui la diminue)."] },

{ id: "vol", title: "Volumes et capacités, espace mort, ventilation alvéolaire",
  html: `<table><tr><th>Volume / capacité</th><th>Définition</th><th>Valeur adulte (≈)</th></tr>
  <tr><td>Volume courant (VT)</td><td>Respiration calme</td><td><span class="k">500 mL</span></td></tr>
  <tr><td>VRI</td><td>Volume de réserve inspiratoire</td><td>♂ 3 000 · ♀ 1 900 mL</td></tr>
  <tr><td>VRE</td><td>Volume de réserve expiratoire</td><td>♂ 1 100 · ♀ 700 mL</td></tr>
  <tr><td>VR</td><td>Volume résiduel (non mobilisable)</td><td>♂ 1 200 · ♀ 1 100 mL</td></tr>
  <tr><td>Capacité vitale</td><td>VRI + VT + VRE</td><td>♂ 4 600 · ♀ 3 100 mL</td></tr>
  <tr><td>Capacité pulmonaire totale</td><td>CV + VR</td><td>♂ <span class="k">≈ 5,7-5,8 L</span> · ♀ 4,2 L</td></tr>
  <tr><td>Capacité résiduelle fonctionnelle</td><td>VRE + VR</td><td>♂ 2 300 · ♀ 1 800 mL</td></tr></table>
  <p>(Tuyau : schéma « en cercle » et valeurs selon le sexe. Les capacités sont toujours la somme de deux volumes ou plus. La prof : « retenez ~5,5 L de capacité totale ».)</p>
  <p><b>Espace mort</b> : <span class="k">anatomique</span> (fixe, ≈ 150 mL, voies conductrices ; ↑ avec un tube endotrachéal) et <span class="k">physiologique</span> (variable : volume ne participant pas aux échanges ; ↑ si anesthésie/respiration superficielle, ↓ en respiration profonde).</p>
  <p><b>Ventilation</b> : <span class="k">ventilation minute = VT × FR</span> (500 × 12 = 6 L/min) ; <span class="k">ventilation alvéolaire = (VT − espace mort) × FR</span> (350 × 12 = 4,2 L/min). Une respiration rapide et superficielle (halètement) garde la ventilation minute mais <b>réduit la ventilation alvéolaire</b>.</p>
  <p>Vocabulaire (tuyau « connaître tous les -pnées ») : <span class="k">eupnée</span> (normale), <span class="k">hyperpnée</span> (↑ ventilation adaptée au métabolisme, effort), <span class="k">hyperventilation</span> (↑ ventilation alvéolaire > besoins, pCO₂ ↓), <span class="k">hypoventilation</span> (pCO₂ ↑), <span class="k">tachypnée</span> (FR ↑, superficielle), <span class="k">dyspnée</span> (sensation de difficulté), <span class="k">apnée</span> (arrêt).</p>
  <p><b>Spirométrie/VEMS (FEV₁)</b> : volume expiré en 1 s lors d'une expiration forcée : réduit en cas d'<b>obstruction</b> (asthme) ou de <b>restriction</b> (volume réduit) ; le rapport VEMS/CV distingue les deux (↓ si obstructif).</p>`,
  why: [["Pourquoi doubler la FR en divisant le VT par deux diminue-t-il la ventilation alvéolaire ?", "L'espace mort (150 mL) est « payé » à chaque cycle : (250 − 150) × 24 = 2,4 L/min contre (500 − 150) × 12 = 4,2 L/min."]],
  talk: { prompt: "Dessine le spirogramme avec les 4 volumes et 4 capacités et donne leurs valeurs.", check: ["VT, VRI, VRE, VR", "CV, CPT, CI, CRF comme sommes", "Valeurs ♂/♀", "VR non mesurable par spirométrie simple", "Espace mort et ventilation alvéolaire"] },
  traps: ["Appeler « volume » une capacité (somme).", "Oublier l'espace mort dans le calcul de la ventilation alvéolaire."] },

{ id: "diff", title: "Diffusion des gaz : Dalton, Henry, Fick",
  html: `<p><b>Dalton</b> : pression totale = somme des pressions partielles (air sec : pO₂ = 21 % × 760 ≈ <span class="k">160 mmHg</span>). <b>Henry</b> : la quantité de gaz dissous est proportionnelle à sa pression partielle (et à sa solubilité).</p>
  <p><b>Loi de Fick</b> (⭐ formule) : <span class="k">débit de diffusion ∝ (S × ΔP × solubilité) / (épaisseur × √PM)</span>. Augmentent la diffusion : gradient de pression partielle, surface, solubilité (CO₂ ≈ 20× plus soluble que O₂), température ; la diminuent : épaisseur, poids moléculaire.</p>
  <table><tr><th>mmHg</th><th>Air inspiré</th><th>Alvéole</th><th>Sang artériel</th><th>Sang veineux</th></tr>
  <tr><td>pO₂</td><td>160</td><td><span class="k">100-105</span></td><td>100</td><td><span class="k">40</span></td></tr>
  <tr><td>pCO₂</td><td>0,3</td><td><span class="k">40</span></td><td>40</td><td><span class="k">46</span></td></tr></table>
  <p>Ce qui détermine les échanges : la <b>pression alvéolaire du gaz</b> (composition de l'air, ventilation vs volume résiduel, résistance, tension de surface), la <b>pression sanguine du gaz</b> (consommation tissulaire, absence de shunt), la <b>surface</b> (alvéoles ouvertes), l'<b>épaisseur</b> (pas d'œdème).</p>
  <p><b>Troubles de diffusion</b> : membrane épaissie (<span class="k">fibrose</span>), interstitium épaissi ou <span class="k">liquide alvéolaire (œdème pulmonaire)</span>, surface ↓ (<span class="k">emphysème</span> : destruction des alvéoles), ventilation ↓ (<span class="k">asthme</span> : obstruction). Le CO₂, très soluble, est moins affecté que l'O₂ → l'hypoxémie apparaît avant l'hypercapnie.</p>`,
  why: [["Deux conditions pathologiques qui diminuent la pO₂ alvéolaire ?", "Hypoventilation alvéolaire (obstruction bronchique sévère, dépression du centre respiratoire) et diminution de la pO₂ de l'air inspiré (altitude). Question d'examen 2019."]],
  talk: { prompt: "Énonce la loi de Fick et applique-la à 4 maladies pulmonaires.", check: ["Formule avec S, ΔP, solubilité, épaisseur", "Fibrose : épaisseur ↑", "Œdème : distance ↑", "Emphysème : surface ↓", "Asthme : ventilation ↓ → ΔP ↓"] },
  traps: ["Dire que le CO₂ diffuse moins bien que l'O₂ (il est 20× plus soluble)."] },

{ id: "o2", title: "Transport de l'O₂ : hémoglobine, courbe de dissociation",
  html: `<ul><li><b>Dissous</b> : <span class="k">1,5 %</span> seulement (0,003 mL O₂/100 mL/mmHg → 0,3 mL/100 mL à 100 mmHg) ; c'est lui qu'on <b>mesure en pO₂</b> (PaO₂ ≈ 100, PvO₂ ≈ 40 mmHg).</li>
  <li><b>Lié à l'Hb</b> : <span class="k">98,5 %</span>. 1 Hb fixe <span class="k">4 O₂</span> (réversible) ; <span class="k">1,34 mL O₂/g Hb</span> → ≈ 20 mL/100 mL pour 15 g/dL.</li></ul>
  <p class="ctx">CaO₂ = (0,003 × PO₂) + (Hb × SO₂ × 1,34)</p>
  <p><b>Ne pas confondre</b> : pO₂ (analyseur de gaz) · <span class="k">SO₂ (%)</span> (saturomètre) · <span class="k">CtO₂ (mL/100 mL)</span>. Anémie : pO₂ et SO₂ normales mais <b>contenu ↓</b>. CO : affinité <span class="k">240×</span> celle de l'O₂ → contenu ↓, saturomètre faussement normal.</p>
  <p><b>Courbe sigmoïde</b> (coopérativité : chaque O₂ fixé augmente l'affinité pour le suivant) : <span class="k">plateau au-dessus de 80 mmHg</span> (poumon : saturation garantie même si la pO₂ baisse un peu) ; <span class="k">partie raide sous 40 mmHg</span> (tissus : petite baisse de pO₂ → grande libération d'O₂).</p>
  <p><b>P50</b> = pO₂ à 50 % de saturation (≈ 27 mmHg). <span class="k">P50 ↑ = affinité ↓ = courbe à droite</span> (O₂ lâché plus facilement).</p>
  <p>Déplacement à droite : <span class="k">↑ pCO₂, ↓ pH (effet Bohr), ↑ T°, ↑ 2,3-DPG</span> (muscle à l'effort, altitude). À gauche : l'inverse, + <b>Hb fœtale</b> (le fœtus capte l'O₂ maternel), <b>myoglobine</b> (réserve locale) et CO.</p>
  <p>Au repos, seulement ~25 % de l'O₂ transporté est cédé aux tissus : grande réserve.</p>`,
  why: [["Pourquoi la sigmoïde est-elle avantageuse ?", "Au poumon, elle garantit une saturation quasi maximale même si la pO₂ alvéolaire baisse un peu ; aux tissus, elle permet de libérer beaucoup d'O₂ pour une petite baisse de pO₂."],
        ["Anémie vs intoxication au CO : que montrent pO₂, SO₂ et contenu ?", "Anémie : pO₂ et SO₂ normales, contenu ↓. CO : pO₂ normale, SO₂ réelle ↓ (le saturomètre classique la surestime), contenu ↓, courbe à gauche (O₂ restant mal libéré)."]],
  talk: { prompt: "Dessine la courbe de dissociation de l'Hb et explique ses déplacements à l'effort.", check: ["Axes : pO₂ (mmHg) / saturation (%)", "Plateau > 80 mmHg (poumon), pente < 40 mmHg (tissus)", "P50 ≈ 27 mmHg", "Droite : pCO₂ ↑, pH ↓, T° ↑, 2,3-DPG ↑ (effet Bohr)", "Hb fœtale et myoglobine à gauche"] },
  traps: ["Dire que la P50 augmente quand l'affinité augmente (c'est l'inverse).", "Croire qu'un patient anémique a une pO₂ basse."] },

{ id: "co2", title: "Transport du CO₂ et équilibre acido-basique",
  html: `<ul><li><b>Dissous</b> : <span class="k">10 %</span> (20× plus soluble que l'O₂).</li>
  <li><b>Carbaminés</b> (Hb-NH-COOH, protéines) : <span class="k">20 %</span>.</li>
  <li><b>Bicarbonates</b> : <span class="k">70 %</span>, grâce à l'<span class="k">anhydrase carbonique des GR</span> : CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻ (le HCO₃⁻ sort du GR contre du Cl⁻ : « shift des chlorures » ; l'Hb tamponne le H⁺).</li></ul>
  <p class="ctx">pH = pK + log [HCO₃⁻] / (0,03 × pCO₂) ≈ 7,4   (Henderson-Hasselbalch, pK = 6,1)</p>
  <p><span class="k">pCO₂ ↑ → pH ↓ (acidose respiratoire)</span> ; <span class="k">pCO₂ ↓ → pH ↑ (alcalose respiratoire)</span>.</p>
  <table><tr><th>Système de régulation du pH</th><th>Vitesse</th><th>Puissance</th></tr>
  <tr><td>Tampons chimiques (bicarbonate, protéines, phosphate, Hb)</td><td>Immédiats</td><td>Faible</td></tr>
  <tr><td>Respiration (élimination du CO₂)</td><td>Minutes</td><td>Intermédiaire</td></tr>
  <tr><td>Rein (excrétion de H⁺, réabsorption/production de HCO₃⁻)</td><td>Heures-jours</td><td>Fort</td></tr></table>
  <p>Exemples : obstruction bronchique sévère / hypoventilation → hypercapnie → acidose respiratoire. Hyperventilation (altitude, angoisse) → hypocapnie → alcalose respiratoire.</p>
  <p><b>Crise d'hyperventilation</b> (TD + cas du cours) : pCO₂ ↓ → pH ↑ → plus de Ca²⁺ se lie à l'albumine → <span class="k">Ca²⁺ ionisé ↓</span> → crampes, fourmillements, tétanie. Respirer dans un sac (« rebreathing ») ↑ pCO₂ → pH ↓ → symptômes disparaissent.</p>`,
  why: [["Pourquoi l'alcalose provoque-t-elle des crampes ?", "Moins de H⁺ sur l'albumine → elle fixe plus de Ca²⁺ → le Ca²⁺ ionisé (actif) baisse → hyperexcitabilité neuromusculaire."]],
  talk: { prompt: "Comment le CO₂ est-il transporté et quel lien avec le pH sanguin ?", check: ["10 % dissous, 20 % carbaminés, 70 % HCO₃⁻", "Anhydrase carbonique dans le GR", "Henderson-Hasselbalch", "pCO₂ ↑ → pH ↓", "3 systèmes : tampons, poumon, rein (vitesse/puissance)"] },
  traps: ["Inverser les pourcentages (le bicarbonate est majoritaire).", "Oublier que le rein est le système le plus puissant mais le plus lent."] },

{ id: "regu", title: "Régulation de la ventilation",
  html: `<p><b>Centres du tronc cérébral</b> : rythme généré par des cellules pacemaker du <span class="k">complexe pré-Bötzinger</span> (bulbe) ; transitions I/E réglées par les centres <span class="k">pneumotaxique et apneustique</span> (pont). Contrôle volontaire par le cortex. Efférence : motoneurones α (nerf phrénique).</p>
  <p><b>Chimiorécepteurs</b> (⭐ schéma « régulation de la ventilation ») :</p>
  <ul><li><span class="k">Centraux (bulbe)</span> : sensibles au <span class="k">H⁺ du LCR</span>, donc à la <span class="k">pCO₂</span> (le CO₂ traverse la barrière hémato-encéphalique et s'y hydrate) → <b>principal stimulus de la ventilation</b>.</li>
  <li><span class="k">Périphériques (corpuscules carotidiens et aortiques)</span> : sensibles à <span class="k">pO₂ < 60 mmHg</span>, à la pCO₂ et au pH artériels.</li></ul>
  <p><b>Mécanorécepteurs</b> : propriocepteurs musculaires, récepteurs d'étirement pulmonaires. Autres influences : température, douleur, sommeil, émotions, médicaments (<span class="k">opioïdes et anesthésiques dépriment</span> le centre respiratoire).</p>
  <p><b>Réflexes</b> : <span class="k">Hering-Breuer</span> (inhibition de l'inspiration en cas d'hyperinflation) ; réflexe paradoxal (stimule l'inspiration ; premier cycle du nouveau-né) ; <span class="k">réflexe d'irritation</span> (respiration superficielle, bronchoconstriction, mucus) ; toux (glotte fermée, P pleurale ↑ puis ouverture brutale) ; éternuement ; hoquet ; bâillement.</p>
  <p><b>Adaptations</b> : <b>exercice</b> (consommation d'O₂ jusqu'à ×20 chez l'homme). <b>Altitude</b> : pO₂ ↓ → hypoxémie → chimiorécepteurs périphériques → hyperventilation → <span class="k">hypocapnie → alcalose</span> (risque de syncope) ; à long terme <span class="k">EPO rénale → érythropoïèse</span>.</p>`,
  why: [["Pourquoi un BPCO hypercapnique chronique peut-il arrêter de respirer si on lui donne trop d'O₂ ?", "Ses chimiorécepteurs centraux se sont adaptés à une pCO₂ élevée : sa ventilation dépend surtout du stimulus hypoxique périphérique, que l'O₂ supprime."]],
  talk: { prompt: "Construis le schéma de la régulation chimique de la ventilation (rétrocontrôle négatif).", check: ["pCO₂ ↑ → H⁺ du LCR ↑ → chimiorécepteurs centraux", "pO₂ < 60 mmHg → chimiorécepteurs périphériques (carotidiens, aortiques)", "Centres bulbaires (pré-Bötzinger) → motoneurones → diaphragme", "↑ ventilation → pCO₂ ↓, pO₂ ↑ (rétrocontrôle négatif)", "Modulations : cortex, réflexes, opioïdes"] },
  traps: ["Dire que l'O₂ est le principal stimulus au quotidien (c'est le CO₂/H⁺).", "Placer les chimiorécepteurs centraux dans les carotides."] },

{ id: "nn", title: "Respiration du nouveau-né et lien cardio-respiratoire",
  html: `<p>Passage d'un apport d'O₂ placentaire à une oxygénation pulmonaire :</p>
  <ol><li>Rupture du cordon → arrêt des échanges placentaires (pCO₂ ↑, pO₂ ↓ → stimulation respiratoire).</li>
  <li><span class="k">Ouverture des alvéoles</span> (premier cycle : réflexe paradoxal ; grosse dépression nécessaire, loi de Laplace ; <b>surfactant</b> indispensable) et évacuation du liquide pulmonaire fœtal.</li>
  <li>pO₂ ↑ → <span class="k">vasodilatation des artères pulmonaires</span> → le poumon est perfusé.</li>
  <li>pO₂ ↑ → <span class="k">vasoconstriction du canal artériel</span> (bradykinine ↑, arrêt de PGE₂/PGI₂) → fermeture fonctionnelle en 3-10 jours puis fibrose (ligament artériel).</li>
  <li>P OG > P OD → <span class="k">foramen ovale fermé mécaniquement</span>.</li></ol>
  <p>La fermeture des shunts n'est possible que si les échanges gazeux pulmonaires sont efficaces ; à l'inverse, un shunt (ex. communication interventriculaire) mélange sang veineux et artériel et modifie tous les gradients.</p>
  <p><b>Croissance</b> : FR élevée, volumes et compliance faibles, résistance élevée → le jeune dépense beaucoup d'énergie pour respirer.</p>`,
  why: [["Pourquoi un prématuré reçoit-il souvent des glucocorticoïdes (via la mère) ?", "Ils induisent la synthèse du surfactant par les pneumocytes II."]],
  talk: { prompt: "Quelles répercussions aura un trouble des échanges gazeux chez un nouveau-né ?", check: ["pO₂ reste basse → artères pulmonaires contractées", "Canal artériel reste ouvert", "Shunt droite → gauche persiste → hypoxémie aggravée (cercle vicieux)", "Signes : cyanose, polypnée, tirage", "Remède : O₂, surfactant, ventilation"] },
  traps: ["Oublier que la pO₂ a des effets opposés sur les artères pulmonaires (dilate) et le canal artériel (contracte)."] }
],

{ id: "gen", title: "Principes : nature, transport, récepteurs, rétrocontrôle",

  <p><span class="k">Seule l'hormone libre est active</span>. Concentrations très faibles (10⁻¹² à 10⁻⁹ M). Dégradation locale, hépatique, rénale (les liposolubles sont rendues hydrosolubles par le foie puis éliminées par le rein).</p>

{ id: "hypo", title: "Axe hypothalamo-hypophysaire, ADH, ocytocine",
  html: `<p><b>Neurohypophyse (post-hypophyse)</b> : liaison <span class="k">nerveuse</span> ; les hormones (<span class="k">ADH</span>, <span class="k">ocytocine</span>) sont synthétisées dans l'<b>hypothalamus</b>, stockées et libérées par la post-hypophyse.</p>

{ id: "thyr", title: "Hormones thyroïdiennes",

{ id: "surr", title: "Surrénales : catécholamines, aldostérone, cortisol",

{ id: "ca", title: "Régulation du calcium : PTH, vitamine D, calcitonine",
  html: `<p>Seul le <span class="k">Ca²⁺ libre (ionisé)</span> est biologiquement actif ; le reste est lié aux protéines (albumine) ou complexé. <span class="k">pH ↓ → Ca²⁺ libre ↑ ; pH ↑ (alcalose) → Ca²⁺ libre ↓</span> (crise de tétanie : respirer dans un sac).</p>

  <p><b>Calcitonine</b> (cellules C de la thyroïde) : ↓ calcémie (↓ ostéolyse) ; rôle modeste.</p>
  <p><b>Autres</b> : glucocorticoïdes (↓ matrice osseuse) ; <span class="k">œstrogènes protègent l'os</span> → <b>ménopause</b> : ↓ œstrogènes → ostéolyse ↑ → <b>ostéoporose</b>. GH et TSH aussi impliqués.</p>`,
  why: [["Pourquoi la chirurgie de la thyroïde peut-elle provoquer des crampes ?", "Les parathyroïdes, collées à la thyroïde, peuvent être lésées : PTH ↓ → hypocalcémie → hyperexcitabilité neuromusculaire (tétanie)."]],
  talk: { prompt: "Cas TD (ménopause) : explique l'impact de la ménopause sur la calcémie et l'os, et les mécanismes de régulation du calcium.", check: ["Arrêt de la fonction ovarienne → œstrogènes ↓ (FSH/LH ↑)", "Œstrogènes freinent les ostéoclastes → leur chute : ostéolyse ↑", "PTH : os, rein, vitamine D", "Vitamine D : peau → foie (25-OH) → rein (1,25)", "Traitements : calcium + vitamine D, activité physique, bisphosphonates, THS"] },
  traps: ["Dire que la PTH agit directement sur l'intestin (c'est indirect, via la vitamine D).", "Activer la vitamine D dans le foie seulement (l'hydroxylation finale est rénale)."] },

{ id: "panc", title: "Pancréas endocrine : insuline, glucagon, somatostatine",
  html: `<p>Îlots de Langerhans : <span class="k">cellules β → insuline</span>, <span class="k">α → glucagon</span>, <span class="k">δ → somatostatine</span>, PP.</p>
  <p><b>Glycémie</b> à jeun : <span class="k">0,70-1,10 g/L</span>. Hypoglycémie : danger pour le cerveau, les GR, la rétine (coma). Hyperglycémie : glucosurie (perte de nutriment), <span class="k">diurèse osmotique → déshydratation</span>, cétose → <span class="k">acidose métabolique</span>, angiopathies, coma.</p>
  <p><b>Sécrétion d'insuline</b> (rétrocontrôle chimique) : glucose entre dans la cellule β (GLUT2) → métabolisme → <span class="k">ATP ↑ → fermeture des canaux K⁺-ATP</span> → dépolarisation → entrée de Ca²⁺ → exocytose. Stimulée aussi par les AA (arginine, lysine), les <span class="k">hormones digestives (incrétines)</span> (avant même l'absorption du glucose), le <span class="k">parasympathique (M3)</span> ; inhibée par le <span class="k">sympathique (α2)</span>.</p>
  <p><b>Insuline = hormone anabolique</b> : <span class="k">entrée du glucose via GLUT4</span> (muscle, tissu adipeux), glycogenèse, lipogenèse (↓ lipolyse), protéosynthèse (↓ protéolyse) → ↓ glucose, AG et AA sanguins.</p>
  <p><b>Glucagon</b> (si glycémie ↓) : <span class="k">glycogénolyse et néoglucogenèse hépatiques</span> → ↑ glycémie ; lipolyse, cétogenèse ; protéolyse hépatique.</p>
  <p><b>Somatostatine</b> : inhibe les sécrétions hormonales (pancréas endocrine, hormones digestives) et la fonction digestive → ralentit le passage des nutriments vers le sang.</p>
  <p>Hormones hyperglycémiantes = glucagon, adrénaline, cortisol, GH ; une seule hypoglycémiante : l'insuline.</p>`,
  why: [["Pourquoi un diabétique décompensé est-il déshydraté et a-t-il soif ?", "Le glucose filtré dépasse la capacité de réabsorption tubulaire : il reste dans l'urine et y retient l'eau (diurèse osmotique) → polyurie, déshydratation, soif."],
        ["Pourquoi le glucose oral fait-il sécréter plus d'insuline que le glucose IV ?", "Les incrétines intestinales (GIP, GLP-1) stimulent la cellule β avant même que le glucose arrive dans le sang."]],
  talk: { prompt: "Explique la régulation de la glycémie entre deux repas et après un repas.", check: ["Valeurs normales", "Après repas : glucose → cellule β (canaux K-ATP) → insuline → GLUT4, glycogenèse, lipogenèse", "Incrétines et parasympathique", "À jeun : glucagon → glycogénolyse, néoglucogenèse", "Autres hormones hyperglycémiantes (cortisol, adrénaline, GH)"] },
  traps: ["Dire que le cerveau a besoin d'insuline pour capter le glucose (non : GLUT1/3).", "Confondre glycogénolyse et néoglucogenèse."] },

{ id: "autres", title: "Autres hormones : gonades, placenta, mélatonine, ANP, leptine, EPO, digestives",
  html: `<ul><li><b>Testicules</b> : testostérone (cellules de Leydig, LH), inhibine (Sertoli, freine la FSH), un peu d'œstrogènes.</li>
  <li><b>Ovaires</b> : œstrogènes, progestérone ; rétrocontrôle <b>négatif ou positif selon le rapport E/P</b> (E/P élevé → rétrocontrôle positif → pic de LH). Pilule (surtout progestative, 3 semaines) : maintient un rétrocontrôle négatif → pas de pic de LH → pas d'ovulation.</li>
  <li><b>Placenta</b> : hCG (maintient le corps jaune), progestérone (relais vers la 12ᵉ semaine), œstrogènes (fin de grossesse), hPL, relaxine.</li>
  <li><b>Mélatonine</b> (épiphyse) : sécrétée dans le noir, inhibée par la lumière ; rythme veille-sommeil, saisonnalité, puberté.</li>
  <li><b>ANP</b> (oreillettes) : distension → natriurèse → ↓ PA.</li>
  <li><b>Leptine</b> (adipocytes) : satiété, poids, reproduction.</li>
  <li><b>Rein</b> : rénine (SRAA), <span class="k">EPO</span> (si ↓ transport d'O₂ perçu au rein → érythropoïèse), calcitriol.</li>
  <li><b>Hormones digestives</b> (gastrine, sécrétine, CCK…) : modulent vidange, motricité, sécrétions, comportement alimentaire (cf. chapitre 4).</li></ul>`,
  why: [["Pourquoi l'EPO augmente-t-elle en altitude ?", "Le rein perçoit une baisse de l'apport d'O₂ : il sécrète de l'EPO, qui stimule la production de GR et donc la capacité de transport d'O₂."]],
  talk: { prompt: "Cite 4 organes qui ne sont pas des « glandes » classiques mais sécrètent des hormones, et leurs hormones.", check: ["Cœur : ANP", "Rein : rénine, EPO, calcitriol", "Tissu adipeux : leptine", "Tube digestif : gastrine, sécrétine, CCK, ghréline", "Placenta : hCG, progestérone"] },
  traps: [] },

{ id: "pg", title: "Prostaglandines, leucotriènes, AINS",
  html: `<p>Messagers <b>locaux</b> dérivés de l'<span class="k">acide arachidonique</span> (libéré des phospholipides par la <span class="k">phospholipase A₂</span>) : voie <span class="k">COX → prostaglandines, thromboxane</span> ; voie LOX → leucotriènes.</p>
  <table><tr><th>Système</th><th>Effets</th></tr>
  <tr><td>Vaisseaux</td><td>VC : PGF₂α, <span class="k">TxA₂</span> ; VD : <span class="k">PGI₂, PGE₂</span> (rein : maintiennent la perfusion)</td></tr>
  <tr><td>Hémostase</td><td><span class="k">TxA₂ (plaquettes) favorise</span> l'agrégation ; <span class="k">PGI₂ (endothélium) l'inhibe</span></td></tr>
  <tr><td>Bronches</td><td>BC : PGF₂α, TxA₂ (leucotriènes) ; BD : PGE₂</td></tr>
  <tr><td>Reproduction</td><td>PGF₂α : lutéolyse, contraction utérine, sensibilise le myomètre à l'ocytocine ; PGE₂ : lutéinisation</td></tr>
  <tr><td>Estomac</td><td><span class="k">PGE₂ ↓ sécrétion d'HCl ; PGE₂/PGI₂ ↑ mucus et bicarbonates</span> (protection)</td></tr>
  <tr><td>Système nerveux</td><td>Fièvre (PGE₂), douleur (abaisse le seuil des nocicepteurs), inflammation (VD, perméabilité)</td></tr></table>
  <p><b>AINS</b> : inhibent la COX. <span class="k">COX-1 constitutive</span> (estomac, plaquettes, rein) ; <span class="k">COX-2 inductible</span> (inflammation). Les AINS classiques inhibent les deux → <b>ulcères</b> (perte de la protection gastrique), troubles rénaux ; les « COX-2 sélectifs » épargnent l'estomac. Glucocorticoïdes : agissent plus haut (↓ PLA₂ et COX-2).</p>`,
  why: [["Pourquoi un excès d'AINS cause-t-il un ulcère ?", "Moins de PGE₂/PGI₂ : moins de mucus et de bicarbonate, plus d'acide, moins de flux sanguin muqueux → l'acide attaque la muqueuse (cas TD de Fabrice)."]],
  talk: { prompt: "Cas TD : mode d'action des AINS (schéma) et différence COX-1/COX-2.", check: ["Phospholipides → PLA₂ → acide arachidonique", "COX → PGH₂ → PG, TxA₂ ; LOX → leucotriènes", "AINS inhibent COX ; GC inhibent PLA₂/COX-2", "COX-1 constitutive (protection), COX-2 inductible (inflammation)", "Conséquences : ulcère, rein, antiagrégant"] },
  traps: ["Confondre TxA₂ (pro-agrégant) et PGI₂ (anti-agrégant)."] }
],

concepts: [
{ id: "gen", title: "Fonctions générales et organisation",
  html: `<p><b>4 fonctions</b> : <span class="k">motilité</span> (péristaltisme propulsif, brassage, mouvements de masse), <span class="k">sécrétion</span> (eau, électrolytes, mucus, enzymes, sels biliaires : <span class="k">7-8 L/jour</span>), <span class="k">digestion</span> (mécanique + enzymatique), <span class="k">absorption</span> (intestin grêle ≫ côlon). Fonction secondaire : empêcher l'absorption de toxiques.</p>
  <p>La <b>lumière digestive fait partie du milieu extérieur</b> : l'épithélium est la seule barrière.</p>
  <p><b>Bilan hydrique</b> : on ingère ~2 L, on sécrète ~7 L ; l'<span class="k">intestin grêle absorbe ≈ 92 % de l'eau</span> (≈ 200 m² de surface grâce aux villosités et microvillosités), le <span class="k">côlon ≈ 6-7 %</span>. Une diarrhée fait donc perdre beaucoup d'eau, de Na⁺, K⁺ et de <b>HCO₃⁻ (acidose métabolique)</b>.</p>
  <p>Histologie : villosités/microvillosités (surface), mitochondries (ATP → pompes), <span class="k">jonctions serrées</span> (plus perméables au jéjunum qu'au côlon). Forte vascularisation et <b>système porte hépatique</b>.</p>
  <p>Ce qui est ingéré est digéré et absorbé quasiment indépendamment des besoins (sauf Ca²⁺, Fe²⁺) ; la digestion est optimisée par des cellules sensibles à la tension de paroi, aux nutriments, à l'osmolarité, au pH (estomac 1-2, intestin 5-6), à l'irritation.</p>`,
  why: [["Pourquoi une diarrhée importante peut-elle provoquer une acidose ?", "Les sécrétions intestinales et pancréatiques sont riches en HCO₃⁻ : si elles sont perdues au lieu d'être réabsorbées, le plasma perd sa base tampon."]],

{ id: "regu", title: "Régulation : réflexes longs/courts, phases, hormones digestives",

  <table><tr><th>Phase</th><th>Déclencheur</th><th>Messagers</th></tr>

  <tr><td><b>Sécrétine</b> (duodénum)</td><td><span class="k">Acidité duodénale</span></td><td>↑ <span class="k">HCO₃⁻ pancréatique et biliaire</span> ; ↓ motilité et HCl gastriques</td></tr>

{ id: "bouche", title: "Bouche, salive, déglutition, œsophage",

{ id: "estomac", title: "Estomac : fonctions, sécrétion acide, motilité, vomissement",
  html: `<p><b>Fonctions</b> : <span class="k">stockage</span> (cardia et pylore), brassage, <span class="k">protéolyse (pepsine)</span>, poursuite de la digestion de l'amidon (amylase salivaire jusqu'à acidification), <span class="k">HCl bactéricide</span>, <span class="k">facteur intrinsèque → absorption de la vitamine B12</span> (hématopoïèse).</p>
  <table><tr><th>Cellule</th><th>Sécrétion</th></tr>
  <tr><td>Cellules à mucus</td><td>Mucus (+ HCO₃⁻), stimulé par PGE₂</td></tr>
  <tr><td><span class="k">Cellules pariétales</span></td><td><span class="k">HCl + facteur intrinsèque</span></td></tr>
  <tr><td><span class="k">Cellules principales</span></td><td><span class="k">Pepsinogène</span></td></tr>
  <tr><td>Cellules endocrines</td><td>Gastrine (G), histamine (ECL), somatostatine (D)</td></tr></table>
  <p><b>Rôles de l'HCl</b> (≈ 2 L/j de suc) : active le pepsinogène en pepsine, pH 1-2 optimal pour la pepsine, bactéricide, dénature les protéines.</p>
  <p><b>Pompe H⁺/K⁺-ATPase</b> de la cellule pariétale stimulée par 3 voies : <span class="k">ACh (M3, vague)</span>, <span class="k">gastrine</span>, <span class="k">histamine (H2)</span> ; inhibée par somatostatine, PGE₂ et l'acidité (pH < 2 → gastrine ↓). Pharmaco : <span class="k">anti-H2 (ranitidine)</span>, <span class="k">inhibiteurs de la pompe (oméprazole)</span> ; les AINS (COX-1) suppriment la protection.</p>
  <p><b>Motilité</b> : <span class="k">relaxation réceptive</span> (stocker sans augmenter la pression), brassage, vidange progressive, prévention du reflux duodénal. À jeun : contractions intenses toutes les 1-2 h (« nettoyage »). <b>Stimulée</b> par la distension et la gastrine ; <b>freinée</b> par le duodénum (peptides, pression, osmolarité ↑, pH acide, lipides → SNC → sympathique ↑, vague ↓ ; hormones).</p>
  <p><b>Vomissement</b> : inspiration profonde, glotte fermée, voile relevé ; estomac et sphincters relâchés ; compression par les abdominaux et le diaphragme. Causes : stimulation de la gorge, irritation/distension, pression intracrânienne ↑, stimulation vestibulaire, substances émétiques (chemoreceptor trigger zone), émotions.</p>`,

  talk: { prompt: "Dessine la cellule pariétale et explique la régulation de la sécrétion acide, avec les cibles des médicaments.", check: ["Pompe H⁺/K⁺-ATPase apicale ; CO₂ + H₂O → H⁺ + HCO₃⁻ (anhydrase carbonique) ; HCO₃⁻ basolatéral contre Cl⁻ (« marée alcaline »)", "Stimulants : ACh M3, gastrine, histamine H2", "Inhibiteurs : somatostatine, PGE₂, pH < 2", "Médicaments : anti-H2, IPP, anticholinergiques, prostaglandines"] },

{ id: "foie", title: "Foie, bile, bilirubine, cycle entérohépatique",
  html: `<p>Foie : 1-3 % du poids, <b>système porte</b>, <span class="k">sinusoïdes</span> (endothélium incomplet, très perméables), <span class="k">cellules de Kupffer</span> (macrophages).</p>
  <p><b>Fonctions</b> : bile (digestion des lipides) ; métabolisme du glucose, des AG et AA (insuline/glucagon) ; <span class="k">synthèse des protéines plasmatiques et des facteurs de coagulation</span> ; <span class="k">NH₃ → urée</span> (NH₃ intestinal neurotoxique : encéphalopathie hépatique si insuffisance ou shunt porto-systémique) ; activation de la vitamine D (25-OH) ; IGF-1, thrombopoïétine ; biotransformation (rendre hydrosolubles les médicaments) ; cholestérol, lipoprotéines ; excrétion biliaire.</p>
  <p><b>Bile</b> (~500 mL/j) : <span class="k">sels biliaires</span> (depuis le cholestérol, conjugués à des AA → ionisés, forment des <span class="k">micelles</span>, émulsifient les lipides), lécithine, cholestérol (excrétion), HCO₃⁻, eau, <span class="k">bilirubine</span>. Stockée et concentrée dans la <b>vésicule</b>.</p>
  <p><b>Régulation</b> : vague, <span class="k">sécrétine (↑ HCO₃⁻)</span>, <span class="k">CCK (contraction de la vésicule)</span>.</p>
  <p><b>Cycle entérohépatique</b> : <span class="k">95 % des sels biliaires réabsorbés à l'iléon distal</span> et recyclés ; certaines molécules liposolubles (médicaments) y sont aussi recyclées → demi-vie prolongée.</p>
  <p><b>Bilirubine</b> : dégradation de l'hème des GR sénescents (macrophages) → bilirubine libre → captée par l'hépatocyte → <span class="k">glucuronoconjuguée</span> → bile. <b>Ictère</b> :</p>
  <table><tr><th>Type</th><th>Cause</th><th>Bilirubine ↑</th></tr>
  <tr><td>Pré-hépatique</td><td>Hémolyse (production > capacité)</td><td>Libre (non conjuguée)</td></tr>
  <tr><td>Hépatique</td><td>Conjugaison insuffisante (hépatite, nouveau-né)</td><td>Libre</td></tr>
  <tr><td><span class="k">Post-hépatique</span></td><td>Obstruction biliaire (calcul du cholédoque)</td><td><span class="k">Conjuguée</span> (+ selles décolorées, urines foncées)</td></tr></table>`,
  why: [["Calcul bloquant le cholédoque : pourquoi stéatorrhée, selles décolorées et ictère ?", "Pas de bile dans l'intestin : pas d'émulsion → lipides non absorbés (selles grasses), pas de stercobiline (selles décolorées) ; la bilirubine conjuguée reflue dans le sang → ictère post-hépatique (cas TD d'Huguette)."]],
  talk: { prompt: "Cas TD (cholécystectomie) : composition et régulation de la bile ; conséquences d'une obstruction du cholédoque ; conseils diététiques après l'ablation de la vésicule.", check: ["Composition : sels biliaires, lécithine, cholestérol, HCO₃⁻, bilirubine", "Régulation : CCK (vésicule), sécrétine (HCO₃⁻), vague", "Obstruction : stéatorrhée, selles décolorées, ictère post-hépatique (bilirubine conjuguée)", "Sans vésicule : bile coule en continu, pas de réserve → repas fractionnés, moins gras", "Cycle entérohépatique"] },
  traps: ["Dire que la bile contient des enzymes digestives (non : elle émulsionne).", "Confondre bilirubine libre et conjuguée dans l'ictère obstructif."] },

{ id: "panc", title: "Pancréas exocrine",
  html: `<p>Acini → canaux → canal pancréatique → duodénum ; <span class="k">1,5-3 L/j</span>, osmolarité proche du plasma.</p>
  <ul><li><span class="k">HCO₃⁻</span> (cellules canalaires, sous <b>sécrétine</b>) : neutralise l'acidité gastrique, protège le duodénum, pH optimal pour les enzymes, tampon jusqu'au côlon (flore).</li>
  <li><span class="k">Enzymes</span> (cellules acineuses, sous <b>CCK</b>) : amylase, <span class="k">lipase</span> (+ colipase), protéases (trypsine, chymotrypsine, carboxypeptidases), nucléases.</li></ul>

  <p>La régulation pendant la phase intestinale (hormonale) l'emporte largement sur les phases céphalique et gastrique.</p>`,
  why: [["Pourquoi l'entérokinase est-elle dans l'intestin et pas dans le pancréas ?", "Si le trypsinogène était activé dans le pancréas, la trypsine digérerait la glande (pancréatite) : l'activation n'a lieu que dans la lumière intestinale."]],
  talk: { prompt: "Composition du suc pancréatique et mécanismes de protection contre l'autodigestion.", check: ["HCO₃⁻ (sécrétine) et enzymes (CCK)", "Liste des enzymes", "Proenzymes, entérokinase, trypsine active les autres", "Inhibiteur de la trypsine"] },
  traps: [] },

{ id: "grele", title: "Intestin grêle : motilité, sécrétion, digestion et absorption",
  html: `<p><b>Motilité</b> : <span class="k">contractions de segmentation</span> (mélange, s'arrêtent en fin d'absorption) ; péristaltisme ; à jeun, <span class="k">complexes moteurs migrants (MMC)</span> (nettoyage). Pacemaker : <span class="k">cellules interstitielles de Cajal</span> ; les hormones/nerfs modulent surtout la force. Valve iléo-cæcale unidirectionnelle (ouverte par le remplissage de l'iléon et la gastrine ; réflexe gastro-iléal).</p>
  <p><b>Sécrétion intestinale</b> : 1,5 L/j, <b>sans enzymes</b> (mucus, HCO₃⁻, Na⁺, eau) ; renouvellement des entérocytes en 3-4 jours.</p>
  <p><b>Absorption</b> : totale et indépendante des besoins pour Na⁺, K⁺, Cl⁻, nutriments, eau ; <span class="k">selon les besoins pour Ca²⁺ et Fe²⁺</span>. Grande réserve (une entérectomie de 50 % est tolérée) sauf l'<span class="k">iléon distal : sels biliaires et vitamine B12</span>.</p>
  <table><tr><th>Nutriment</th><th>Étape luminale</th><th>Étape membranaire (bordure en brosse)</th><th>Absorption</th></tr>
  <tr><td><b>Glucides</b></td><td>Amylases → maltose, oligosaccharides</td><td>Maltase, sucrase, <span class="k">lactase</span></td><td>Glucose/galactose : <span class="k">cotransport Na⁺ (SGLT1)</span> ; fructose : GLUT5 ; sortie GLUT2</td></tr>
  <tr><td><b>Protéines</b></td><td>Pepsine, protéases pancréatiques</td><td>Aminopeptidases</td><td>AA (cotransport Na⁺), di/tripeptides (H⁺)</td></tr>
  <tr><td><b>Lipides</b></td><td><span class="k">Émulsion par les sels biliaires</span> → lipase → AG + monoglycérides en <span class="k">micelles</span></td><td>—</td><td>Diffusion dans l'entérocyte → <span class="k">resynthèse de TG → chylomicrons</span> → exocytose → <span class="k">lymphe</span> → canal thoracique → veine cave</td></tr></table>
  <p><b>Eau</b> : suit le gradient osmotique créé par l'absorption de Na⁺, Cl⁻, HCO₃⁻, glucose, AA (base de la <b>solution de réhydratation orale</b>). <b>Na⁺</b> : cotransports (aldostérone ↑ au côlon). K⁺, Cl⁻ : diffusion. <b>HCO₃⁻</b> : absorption active.</p>
  <p><b>Fer</b> : héminique bien absorbé ; non héminique mal (vitamine C aide : Fe³⁺ → Fe²⁺ ; phosphates/oxalates gênent). Stockage dans l'entérocyte (ferritine), transport plasmatique (<span class="k">transferrine</span>) ; l'excès est perdu avec la desquamation. <b>Calcium</b> : passif + actif dépendant de la vitamine D.</p>
  <p><b>Vitamines</b> liposolubles (A, D, E, K : stockées, hypervitaminose possible) vs hydrosolubles (B, C : non stockées, excrétion rénale). Oligo-éléments : iode, fluor, sélénium, fer, cobalt, zinc, manganèse, cuivre, molybdène.</p>`,
  why: [["Pourquoi la diarrhée du choléra se traite-t-elle avec de l'eau sucrée et salée ?", "Le cotransport Na⁺-glucose (SGLT1) reste fonctionnel : il entraîne Na⁺ puis l'eau par osmose, même quand la sécrétion est stimulée."],
        ["Pourquoi les lipides passent-ils par la lymphe et non par la veine porte ?", "Les chylomicrons sont trop gros pour traverser l'endothélium des capillaires sanguins ; ils entrent dans les chylifères lymphatiques."]],
  talk: { prompt: "Cas TD : explique à l'aide d'un schéma la digestion et l'absorption des lipides.", check: ["Émulsification par sels biliaires (surface ↑)", "Lipase pancréatique (+ colipase) → AG + 2-monoglycérides", "Micelles transportées vers la bordure en brosse", "Diffusion, resynthèse des TG, chylomicrons (apoprotéines)", "Exocytose → lymphe → canal thoracique", "95 % des sels biliaires recyclés (iléon)"] },
  traps: ["Dire que le glucose est absorbé par simple diffusion (cotransport Na⁺).", "Oublier la voie lymphatique des lipides."] },

{ id: "colon", title: "Côlon, microbiote, défécation",
  html: `<p><b>Fonctions</b> : <span class="k">absorption d'eau et d'électrolytes</span> (dessiccation ; Na⁺ sous aldostérone), <span class="k">stockage des fèces</span>, <span class="k">fermentation microbienne</span> des résidus non digérés (fibres) → <span class="k">acides gras volatils / à chaîne courte</span> (acétate, propionate, butyrate : énergie pour les colonocytes), synthèse de vitamines (K, B), néosynthèse protéique. Sécrétions : mucus (protection), HCO₃⁻ (tampon des AGV). Épithélium « étanche ».</p>
  <p><b>Motricité</b> : contractions haustrales lentes ; <span class="k">mouvements de masse 3-4×/jour après les repas</span> (<span class="k">réflexe gastro-colique</span> : SN entérique + gastrine).</p>
  <p><b>Réflexe de défécation</b> : remplissage du rectum → récepteurs de tension → moelle (sacrée) → contraction rectale + <span class="k">relaxation du sphincter interne (lisse, involontaire)</span> + inhibition du motoneurone du <span class="k">sphincter externe (strié, volontaire, nerf honteux)</span>. Poussée : abdominaux + glotte fermée (pression abdominale ↑). Le contrôle volontaire du sphincter externe s'apprend.</p>
  <p><b>Microbiote</b> : fermentation, barrière contre les pathogènes, maturation immunitaire, axe intestin-cerveau. <span class="k">Prébiotiques</span> = fibres non digestibles qui nourrissent les bonnes bactéries ; <span class="k">probiotiques</span> = micro-organismes vivants bénéfiques (cas TD : côlon irritable, stress → dérèglement de la motricité via l'axe intestin-cerveau).</p>`,
  why: [["Pourquoi a-t-on souvent envie d'aller à la selle après le petit-déjeuner ?", "L'arrivée d'aliments dans l'estomac déclenche le réflexe gastro-colique (SN entérique + gastrine) : mouvement de masse qui remplit le rectum."]],
  talk: { prompt: "Fonctions du côlon chez un individu sain et réflexe de défécation (cas TD côlon irritable).", check: ["Absorption d'eau/électrolytes (6-7 %)", "Fermentation → AGV ; microbiote", "Mouvements de masse, réflexe gastro-colique", "Sphincter interne (involontaire) vs externe (volontaire)", "Pré- vs probiotiques"] },
  traps: ["Inverser sphincter interne (lisse, réflexe) et externe (strié, volontaire)."] }
],

{ id: "role", title: "Rôles du rein et bilan hydrique",

{ id: "nephron", title: "Le néphron et sa vascularisation",
  html: `<p><b>Néphron</b> : corpuscule rénal (<span class="k">glomérule + capsule de Bowman</span>) → <span class="k">tube contourné proximal (TCP)</span> → <span class="k">anse de Henlé</span> (descendante fine, ascendante fine puis large) → <span class="k">tube contourné distal (TCD)</span> → <span class="k">tube collecteur (TC)</span>.</p>
  <p><b>Vascularisation en système porte</b> : artériole afférente → <span class="k">capillaires glomérulaires (haute pression ≈ 55 mmHg : filtration)</span> → artériole efférente → <span class="k">capillaires péritubulaires et vasa recta (basse pression : réabsorption)</span>.</p>
  <p><b>Appareil juxtaglomérulaire</b> : cellules granulaires de l'artériole afférente (<b>rénine</b>) + <span class="k">macula densa</span> du TCD (capte le NaCl) .</p>
  <p><b>Épithélium tubulaire</b> : bordure en brosse (TCP : surface), mitochondries (pompes), jonctions serrées : segment <b>« peu étanche » (TCP)</b> → réabsorption <span class="k">isotonique</span> (eau + solutés ensemble, aussi en paracellulaire) ; segment <b>« étanche » (TCD, TC)</b> → réabsorption sélective, réglée par les hormones.</p>
  <p><b>Voies urinaires</b> : bassinet, uretères (péristaltisme : évite la stase/hydronéphrose), vessie, urètre.</p>`,

  talk: { prompt: "Dessine un néphron avec sa vascularisation et nomme le rôle de chaque segment.", check: ["Glomérule + capsule : filtration", "TCP : réabsorption massive isotonique", "Anse : gradient médullaire", "TCD/TC : réglage fin (aldostérone, ADH)", "Double réseau capillaire, appareil juxtaglomérulaire"] },

{ id: "filt", title: "Filtration glomérulaire : barrière, pressions, DFG",
  html: `<p>Membrane glomérulaire <span class="k">100 à 1000× plus perméable</span> que les autres capillaires ; ⭐ <b>3 barrières</b> : <span class="k">(1) endothélium fenestré</span>, <span class="k">(2) lame basale (chargée négativement)</span>, <span class="k">(3) podocytes et leurs fentes de filtration</span>. Les <b>cellules mésangiales</b> (contractiles, phagocytaires) modulent la surface de filtration. Quasi imperméable aux protéines (taille + charges négatives), perméable aux petites molécules.</p>
  <p class="ctx">Pression nette de filtration = PH glomérulaire − (π glomérulaire + P capsule)
= 55 − (30 + 15) = 10 mmHg</p>
  <p><span class="k">DFG = Kf × pression nette de filtration</span> (Kf = perméabilité × surface). DFG ≈ <span class="k">120 mL/min</span>. <b>Fraction de filtration</b> = DFG / débit plasmatique rénal ≈ <span class="k">20 %</span> (≈ 125/625).</p>
  <table><tr><th>DFG ↓</th><th>DFG ↑</th></tr>
  <tr><td>Hypovolémie, hypotension ; <span class="k">P capsule ↑ (calcul urinaire)</span> ; Kf ↓ (membrane épaissie, néphrons perdus)</td><td>Hypertension ; <span class="k">hypoprotéinémie</span> (π ↓) ; maturation du nouveau-né (Kf ↑)</td></tr></table>

  talk: { prompt: "Explique les forces de filtration glomérulaire et 4 situations qui modifient le DFG.", check: ["3 barrières", "Calcul 55 − (30 + 15) = 10 mmHg", "DFG = Kf × PNF ≈ 120 mL/min ; FF 20 %", "Calcul, hypotension, hypoprotéinémie, HTA", "Effet des artérioles afférente/efférente"] },
  traps: ["Inverser l'effet de la constriction de l'artériole efférente.", "Oublier la pression dans la capsule de Bowman."] },

{ id: "autoreg", title: "Contrôle du débit sanguin rénal et du DFG",
  html: `<p>Objectif : garder un <b>DFG stable</b> malgré les variations de PA (entre ~80 et 180 mmHg).</p>

  why: [["Pourquoi éviter les AINS chez une personne âgée déshydratée ?", "Quand la perfusion rénale baisse, les prostaglandines dilatent l'afférente pour préserver le DFG. Les AINS bloquent cette défense → chute du DFG (insuffisance rénale aiguë)."]],
  talk: { prompt: "Comment le rein garde-t-il un DFG stable quand la PA monte ?", check: ["Réponse myogénique de l'afférente", "Rétrocontrôle tubulo-glomérulaire (macula densa, NaCl)", "Plage d'autorégulation", "Modulation par Ang II, sympathique, prostaglandines"] },

{ id: "trans", title: "Réabsorption et sécrétion tubulaires",
  html: `<p>Mécanismes : <span class="k">transport actif primaire</span> (pompe Na⁺/K⁺ basolatérale, ≈ <b>80 % de l'énergie du rein</b>) qui crée les gradients ; <span class="k">transport actif secondaire</span> (cotransports avec Na⁺ : glucose, AA, phosphate) ; <span class="k">passif</span> (osmose : eau via aquaporines ; urée, Cl⁻ selon les gradients).</p>
