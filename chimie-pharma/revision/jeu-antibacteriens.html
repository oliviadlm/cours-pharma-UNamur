<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Chimie pharma — le jeu</title>
<link rel="manifest" href="jeu-chipha.webmanifest">
<link rel="apple-touch-icon" href="icons/jeu-180.png">
<link rel="icon" type="image/png" href="icons/jeu-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chipha jeu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#110f3d">
<style>
:root{--bg:#0f1530;--bg2:#18214a;--carte:#ffffff;--encre:#1b2233;--doux:#6b7385;--bleu:#3b5ff0;--bleu2:#1a3fd6;--or:#f5b82e;--vert:#16a34a;--vert-p:#dcfce7;--rouge:#e5484d;--rouge-p:#fee2e2;--trait:#e6e8ef;--violet:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#110f3d}html,body{margin:0;min-height:100%}
body{background:transparent;color:#fff;font:16px/1.45 -apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;overscroll-behavior:none}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 20px)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
.ic.f{fill:currentColor;stroke:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .logo{width:42px;height:42px;border-radius:12px;background:#fff}
.top h1{font-size:1.15rem;margin:0;flex:1;line-height:1.15}.top h1 small{display:block;font-weight:400;opacity:.7;font-size:.78rem}
.stats{display:flex;gap:8px;margin:6px 0 14px}
.stat{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.stat b{font-size:1.1rem;display:block;line-height:1}.stat span{font-size:.72rem;opacity:.75}
.stat .ic{width:26px;height:26px}
.flamme{color:#ff8a3d}.etoile{color:var(--or)}.eclair{color:#7dd3fc}
.rang{background:linear-gradient(135deg,#3b5ff0,#7c3aed);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.rang .t{display:flex;justify-content:space-between;font-size:.85rem;opacity:.9}
.barre{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:6px}
.barre i{display:block;height:100%;background:linear-gradient(90deg,#fde68a,#f5b82e);border-radius:99px;transition:width .5s}
.obj{margin-top:8px;font-size:.8rem;opacity:.9;display:flex;gap:6px;align-items:center}
.sect{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:18px 4px 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--carte);color:var(--encre);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mode .ic{width:28px;height:28px;color:var(--bleu2)}
.mode b{font-size:.98rem}.mode small{color:var(--doux);font-size:.76rem;line-height:1.25}
.mode.vedette{grid-column:1/-1;background:linear-gradient(135deg,#f5b82e,#ff8a3d);color:#2a1600}
.mode.vedette .ic{color:#2a1600}.mode.vedette small{color:#4a2a00}
.chemin{display:flex;flex-direction:column;gap:10px}
.niv{display:flex;align-items:center;gap:12px;background:var(--carte);color:var(--encre);border-radius:18px;padding:12px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.niv:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.niv .rond{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--bleu);color:#fff;font-weight:800;font-size:1.1rem;flex:none}
.niv.boss .rond{background:var(--violet)}
.niv.fini .rond{background:var(--vert)}
.niv.verrou{opacity:.55}.niv.verrou .rond{background:#9aa1b2}
.niv .tx{flex:1}.niv .tx b{display:block;font-size:.95rem;line-height:1.2}.niv .tx small{color:var(--doux);font-size:.75rem;display:block;line-height:1.25}
.niv .etoiles{display:flex;gap:2px;color:#d7dae3}.niv .etoiles .on{color:var(--or)}
.niv .maitrise{height:5px;background:var(--trait);border-radius:9px;margin-top:5px;overflow:hidden}.niv .maitrise i{display:block;height:100%;background:var(--vert)}
/* écran de jeu */
.jeu{display:none}.jeu.on{display:block}.accueil.off{display:none}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud .quit{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.hud .prog{flex:1;height:14px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.hud .prog i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#16a34a);transition:width .3s}
.coeurs{display:flex;gap:2px;color:var(--rouge)}.coeurs .vide{color:rgba(255,255,255,.25)}
.combo{text-align:center;font-weight:800;color:var(--or);height:22px;font-size:.95rem}
.timer{text-align:center;font-weight:800;font-size:1.3rem;color:#7dd3fc}
.q{background:var(--carte);color:var(--encre);border-radius:22px;padding:18px 16px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.q .type{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--bleu2);font-weight:700;display:flex;gap:6px;align-items:center}
.q h2{font-size:1.12rem;margin:8px 0 12px;line-height:1.3}
.q .struct{display:block;margin:0 auto 10px;max-width:100%;max-height:200px;background:#fff}
.q .grand{font-size:1.5rem;font-weight:800;text-align:center;color:var(--bleu2);margin:6px 0 14px}
.choix{display:grid;gap:9px}
.ch{background:#f4f5f9;border:2px solid var(--trait);border-radius:14px;padding:12px 12px;text-align:left;font-size:.95rem;color:var(--encre);box-shadow:0 3px 0 var(--trait)}
.ch:active{transform:translateY(2px);box-shadow:none}
.ch.ok{background:var(--vert-p);border-color:var(--vert);box-shadow:0 3px 0 var(--vert)}
.ch.ko{background:var(--rouge-p);border-color:var(--rouge);box-shadow:0 3px 0 var(--rouge);animation:shake .35s}
.vf{grid-template-columns:1fr 1fr}.vf .ch{text-align:center;font-weight:700;font-size:1.05rem}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;border-radius:14px;padding:12px;font-size:.9rem;display:none}
.fb.on{display:block}.fb.ok{background:var(--vert-p);color:#14532d}.fb.ko{background:var(--rouge-p);color:#7f1d1d}
.fb b{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.suite{width:100%;margin-top:14px;background:var(--bleu);color:#fff;border-radius:16px;padding:14px;font-weight:800;font-size:1.02rem;box-shadow:0 5px 0 var(--bleu2);display:none}
.suite.on{display:block}.suite:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bleu2)}
.reveal{background:#f4f5f9;border-radius:14px;padding:12px;margin-top:10px;display:none;font-size:.93rem}
.reveal.on{display:block}
.auto{display:none;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.auto.on{display:grid}
.auto button{border-radius:14px;padding:12px 6px;font-weight:700;font-size:.85rem;color:#fff}
.auto .a1{background:var(--rouge)}.auto .a2{background:#f59e0b}.auto .a3{background:var(--vert)}
.voir{width:100%;margin-top:12px;background:var(--encre);color:#fff;border-radius:14px;padding:12px;font-weight:700}
canvas.dessin{width:100%;height:260px;background:#fff;border:2px dashed #c7cbd8;border-radius:14px;touch-action:none;display:block}
.outils{display:flex;gap:8px;margin-top:6px}.outils button{flex:1;background:#eef0f6;color:var(--encre);border-radius:10px;padding:8px;font-size:.85rem}
.paire{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paire button{background:#f4f5f9;border:2px solid var(--trait);border-radius:12px;padding:10px 8px;font-size:.85rem;color:var(--encre);min-height:52px}
.paire button.sel{border-color:var(--bleu);background:#e7ecfd}
.paire button.fait{visibility:hidden}
.paire button.ko{border-color:var(--rouge);animation:shake .35s}
/* fin */
.fin{text-align:center;padding:10px 0}
.fin .grosse{font-size:2.4rem;font-weight:900;margin:6px 0}
.fin .etoiles{display:flex;justify-content:center;gap:6px;color:rgba(255,255,255,.25)}.fin .etoiles .on{color:var(--or)}
.fin .etoiles .ic{width:46px;height:46px}
.gains{display:flex;gap:10px;justify-content:center;margin:14px 0}
.gains div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 14px}
.gains b{display:block;font-size:1.3rem}
.erreurs{background:var(--carte);color:var(--encre);border-radius:16px;padding:12px;text-align:left;margin-top:10px;font-size:.88rem}
.erreurs li{margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-120px);background:#fff;color:var(--encre);border-radius:16px;padding:10px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .35s;z-index:9;display:flex;gap:8px;align-items:center;max-width:92%}
.toast.on{transform:translateX(-50%) translateY(0);visibility:visible;transition:transform .35s}
.toast{visibility:hidden;transition:transform .35s,visibility 0s .35s;transform:translateX(-50%) translateY(calc(-100% - env(safe-area-inset-top) - 60px))!important}.toast.on{transform:translateX(-50%) translateY(0)!important}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:rgba(255,255,255,.07);border-radius:14px;padding:8px 4px;text-align:center;font-size:.66rem;opacity:.45}
.badge.on{opacity:1;background:rgba(245,184,46,.18)}
.badge .ic{width:26px;height:26px;color:var(--or);display:block;margin:0 auto 4px}
.note{font-size:.75rem;opacity:.6;text-align:center;margin-top:18px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:8}

.atl{background:#fff;border-radius:16px;margin:0 -4px}
.atl-barre{display:flex;gap:4px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.atl-barre::-webkit-scrollbar{display:none}
.atl-o{flex:1 0 auto;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:12px;background:#f1f3f8;color:#1b2233;font-size:.62rem}
.atl-o .ic{width:22px;height:22px}.atl-o.on{background:#1a3fd6;color:#fff}
.atl-b2{justify-content:space-between;align-items:center}
.atl-coul{display:flex;gap:6px}.atl-c{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #d4d8e3}.atl-c.on{box-shadow:0 0 0 3px #1a3fd6}
.atl-taille{display:flex;gap:4px}.atl-t{width:34px;height:34px;border-radius:10px;background:#f1f3f8;display:grid;place-items:center}.atl-t i{display:block;border-radius:50%;background:#1b2233}.atl-t.on{background:#dbe3ff}
.atl-atomes{display:none;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding:4px 2px;scrollbar-width:none}.atl-atomes::-webkit-scrollbar{display:none}.atl-atomes.on{display:flex}
.atl-atomes button{flex:none;min-width:40px;padding:7px 8px;border-radius:10px;background:#f1f3f8;color:#1b2233;font-weight:700;font-size:.9rem}.atl-atomes button.on{background:#1a3fd6;color:#fff}
.atl-zone{position:relative;overflow:hidden;border-radius:14px}
.atl canvas{display:block;width:100%;height:56vh;max-height:520px;min-height:300px;background:#fff;border:2px solid #e3e6ee;border-radius:14px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.atl-aide{position:absolute;left:8px;right:8px;bottom:6px;font-size:.7rem;color:#8a91a3;pointer-events:none;text-align:center}
.atl-b3 button{flex:1;display:flex;gap:4px;align-items:center;justify-content:center;padding:9px 6px;border-radius:12px;background:#f1f3f8;color:#1b2233;font-size:.78rem}
.atl-b3 .atl-voir{background:#1b2233;color:#fff;font-weight:700;flex:1.6}
.atl.plein{position:fixed;inset:0;z-index:20;border-radius:0;margin:0;padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;flex-direction:column}
.atl.plein .atl-zone{flex:1;display:flex}.atl.plein canvas{height:auto;flex:1;max-height:none}
body.sans-scroll{overflow:hidden}
/* la page ne défile pas elle-même : un cadre intérieur défile (évite le flou d'iOS sous l'heure en mode app) */
html,body{height:100%;overflow:hidden}
.defile{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;z-index:1}
body.sans-scroll .defile{overflow:hidden}
@media (min-width:700px){.atl canvas{height:62vh;max-height:none}}


.atl-calque{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);max-width:80%;max-height:70%;opacity:0;pointer-events:none;mix-blend-mode:multiply;touch-action:none;-webkit-user-drag:none;user-select:none;transform-origin:center}
.atl-calque.on{pointer-events:auto;cursor:move;outline:2px dashed rgba(59,95,240,.55);outline-offset:4px;border-radius:6px}
.atl-feuille{position:absolute;left:6px;right:6px;bottom:6px;background:#fff;border-radius:16px;box-shadow:0 -6px 30px rgba(15,21,48,.25);padding:10px;transform:translateY(calc(100% + 12px));opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;pointer-events:none;max-height:72%;display:flex;flex-direction:column}
.atl-feuille.mini .atl-f-corps{display:none}
.atl-ajust{display:none;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.atl-feuille.mini .atl-ajust{display:flex}
.atl-ajust button{min-width:40px;background:#f1f3f8;color:#1b2233;border-radius:10px;padding:8px 10px;font-weight:700}
.atl-ajust label{flex:1;display:flex;gap:6px;align-items:center;font-size:.72rem;color:#5d6577;min-width:150px}.atl-ajust input{flex:1}
.atl-feuille.on{transform:none;opacity:1;pointer-events:auto}
.atl-f-tete{display:flex;gap:6px;align-items:center;color:#1b2233}.atl-f-tete b{flex:1}
.atl-f-tete button{background:#f1f3f8;color:#1b2233;border-radius:10px;padding:6px 10px;font-size:.8rem}.atl-f-tete button.on{background:#1a3fd6;color:#fff}
.atl-f-corps{overflow:auto;min-height:0;flex:1;text-align:center}.atl-f-corps img{max-width:100%;max-height:30vh;display:block;margin:4px auto}.atl-f-corps p{margin:4px 0;font-size:.82rem;color:#5d6577}
.atl-note{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.atl-note button{border-radius:12px;padding:11px 4px;font-weight:700;font-size:.85rem;color:#fff}
.atl-note .a1{background:#e5484d}.atl-note .a2{background:#f59e0b}.atl-note .a3{background:#16a34a}
.atl-suite{display:none;margin-top:8px;background:#1a3fd6;color:#fff;border-radius:12px;padding:12px;font-weight:800;box-shadow:0 4px 0 #12309e}.atl-suite.on{display:block}

/* ===== monde : chambre de nuit ===== */
.ciel{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(130% 70% at 50% 0%,#2c3192 0%,#1b1960 42%,#110f3d 100%);overflow:hidden}
.ciel::before{content:"";position:absolute;inset:-60px;background:url(decor/chambre.jpg?v=hd) center/cover;filter:blur(26px) saturate(1.3);opacity:.32}
.ciel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,15,61,0) 0%,rgba(17,15,61,.55) 70%,rgba(17,15,61,.85) 100%)}
.ciel i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(255,214,107,.55);opacity:0;animation:luciole 9s ease-in-out infinite;z-index:1}
@keyframes luciole{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}50%{transform:translate(18px,-40px)}80%{opacity:.7}100%{opacity:0;transform:translate(-10px,-90px)}}
.app{position:relative;z-index:1}
.hero{position:relative;margin:calc(-1*(env(safe-area-inset-top) + 10px)) -14px 0;height:calc(42vh + env(safe-area-inset-top));min-height:250px;max-height:440px}
.hero-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 62%,transparent 100%)}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(180deg,rgba(17,15,61,.7),rgba(17,15,61,0));z-index:1;pointer-events:none}
.hero-haut{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 12px);display:flex;align-items:center;gap:10px;z-index:2}
.hero-haut .logo{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.hero-t{flex:1;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.5)}.hero-t small{display:block;font-size:.8rem;opacity:.9}.hero-t b{font-size:1.3rem}
.rond-btn{width:40px;height:40px;border-radius:50%;background:rgba(17,15,61,.45);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center}
.guir{position:absolute;left:0;right:0;bottom:-4px;width:100%;height:auto;z-index:2;overflow:visible}
.guir .fil{fill:none;stroke:rgba(20,18,60,.9);stroke-width:1.6}
.guir .ampoule{fill:#3a3f7a;stroke:rgba(255,255,255,.15);stroke-width:.6}
.guir .ampoule.on{fill:#ffd66b;stroke:#fff3c4;filter:drop-shadow(0 0 4px #ffd66b) drop-shadow(0 0 9px rgba(255,190,80,.8));animation:scint 3s ease-in-out infinite}
@keyframes scint{0%,100%{opacity:1}50%{opacity:.55}}
.lum{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.78rem;color:#ffe9a8;margin:4px 0 10px;text-shadow:0 0 12px rgba(255,214,107,.5)}
.stat,.mode,.niv,.rang{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14)}
.rang{background:linear-gradient(135deg,rgba(109,124,255,.5),rgba(176,108,255,.42));border:1px solid rgba(255,255,255,.18);display:flex;gap:12px;align-items:center}
.rang .rg{flex:1}
.anneau{width:56px;height:56px;flex:none;position:relative}.anneau>svg{width:56px;height:56px;transform:rotate(-90deg)}
.anneau b .ic{width:26px;height:26px;vertical-align:0;color:#ffd66b;stroke-width:3}
.anneau circle{fill:none;stroke-width:6}.anneau .f{stroke:rgba(255,255,255,.18)}.anneau .p{stroke:#ffd66b;stroke-linecap:round;transition:stroke-dashoffset .8s}
.anneau b{position:absolute;inset:0;display:grid;place-items:center;font-size:.7rem;line-height:1.05;text-align:center}
.go{display:flex;align-items:center;gap:12px;width:100%;background:linear-gradient(135deg,#ffd66b,#ff9fb8);color:#2b1340;border-radius:20px;padding:13px 14px;box-shadow:0 6px 0 #b9577a,0 0 34px rgba(255,190,120,.35);text-align:left;margin:12px 0 2px}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #b9577a}
.go .r{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;animation:respire 2.4s ease-in-out infinite;color:#b9577a}
.go .r .ic{width:22px;height:22px;fill:currentColor}
.go small{display:block;font-size:.75rem;opacity:.8}.go b{font-size:1.05rem}
@keyframes respire{50%{transform:scale(1.08);box-shadow:0 0 22px rgba(255,255,255,.7)}}
.mode{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.13);box-shadow:0 6px 0 rgba(5,4,30,.35)}
.mode .ic{color:#b3c0ff}.mode small{color:rgba(255,255,255,.68)}
.mode.vedette{background:linear-gradient(135deg,rgba(109,124,255,.85),rgba(176,108,255,.8));color:#fff}
.mode.vedette .ic{color:#fff}.mode.vedette small{color:rgba(255,255,255,.88)}
.chemin{position:relative}
.chemin::before{content:"";position:absolute;left:35px;top:24px;bottom:24px;border-left:3px dotted rgba(255,214,107,.4)}
.niv{position:relative;background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.13);box-shadow:0 6px 0 rgba(5,4,30,.35)}

rdkit/caspofungine.svg","dessin":false,"cp":"antimycosiques"},{"id":"acide-undecylenique","dci":"Acide undécylénique","marq":"","marques":[],"classe":"Autres antimycosiques","sous":"Acide gras insaturé","meca":"","img":"../assets/rdkit/acide-undecylenique.svg","dessin":false,"cp":"antimycosiques"},{"id":"iode","dci":"Iode en teinture / polyvidone iodée","marq":"ISOBETADINE®","marques":["ISOBETADINE®","BRAUNODERM®","BRAUNOL®","IODEX®"],"classe":"Autres antimycosiques","sous":"Antiseptique iodé","meca":"Antiseptique (mycoses, bactéries) (p.138).","img":"../assets/rdkit/iode.svg","dessin":true,"cp":"antimycosiques"},{"id":"sulfure-de-selenium","dci":"Sulfure de sélénium","marq":"","marques":[],"classe":"Autres antimycosiques","sous":"Minéral","meca":"","img":"../assets/rdkit/sulfure-de-selenium.svg","dessin":false,"cp":"antimycosiques"},{"id":"dequalinium","dci":"Chlorure de déqualinium","marq":"FLUOMIZIN","marques":["FLUOMIZIN"],"classe":"Autres antimycosiques / antiseptiques gynécologiques","sous":"Dérivé de la quinoléine, tensioactif (bis-ammonium quaternaire)","meca":"Substance tensioactive : augmente la perméabilité des cellules bactériennes → diminution de l'activité enzymatique → mort cellulaire (p.139).","img":"../assets/rdkit/dequalinium.svg","dessin":false,"cp":"antimycosiques"},{"id":"emetine","dci":"Émétine","marq":"","marques":[],"classe":"Amoebicides","sous":"Amoebicides tissulaires (alcaloïdes de l'ipéca)","meca":"Action amoebicide tissulaire (p.141).","img":"../assets/rdkit/emetine.svg","dessin":false,"cp":"antiprotozoaires"},{"id":"chloroquine","dci":"Chloroquine","marq":"NIVAQUINE® (anc.)","marques":["NIVAQUINE® (anc.)"],"classe":"Quinoléines antimalariques","sous":"4-Aminoquinoléine de synthèse (aussi amoebicide tissulaire)","meca":"Schizonticide sanguin : comme les autres quinoléines, inhibe la polymérisation de l'hème en hémozoïne → accumulation d'hème toxique dans le parasite (figure p.157). Également amoebicide (p.142).","img":"../assets/rdkit/ch ":"Remdésivir","marq":"VEKLURY®","marques":["VEKLURY®"],"classe":"Analogues nucléotidiques (SARS-CoV-2)","sous":"Prodrogue phosphoramidate analogue de l'adénosine","meca":"Métabolisé dans les cellules hôtes en nucléoside triphosphate pharmacologiquement actif ; le triphosphate de remdésivir agit comme un analogue de l'ATP et inhibe de manière compétitive l'ARN polymérase ARN-dépendante du ","img":"../assets/rdkit/remdesivir.svg","dessin":false,"cp":"antiviraux"},{"id":"foscarnet","dci":"Foscarnet trisodique","marq":"FOSCAVIR®","marques":["FOSCAVIR®"],"classe":"Phosphonoformate (non nucléosidique)","sous":"Inhibiteur direct de l'ADN polymérase et de la transcriptase inverse","meca":"Inhibe l'ADN polymérase des virus à ADN (groupe herpès, VHB) et inhibe de plus la transcriptase inverse des virus à ARN / rétrovirus (VIH) (p.191).","img":"../assets/rdkit/foscarnet.svg","dessin":true,"cp":"antiviraux"},{"id":"aciclovir","dci":"Aciclovir","marq":"ACICLOVIR SANDOZ®","marques":["ACICLOVIR SANDOZ®","ACICLOVIR EG®","ACICLOVIR GSK®","ACICLOVIR HOSPIRA®"],"classe":"Analogues nucléosidiques (herpès)","sous":"Antimétabolites de la guanosine (acycliques)","meca":"Antimétabolite de la guanosine : phosphorylé en monophosphate par une enzyme d'origine virale, la thymidine kinase, puis en triphosphate par les kinases cellulaires ; c'est le triphosphate qui inhibe l'ADN polymérase vir","img":"../assets/rdkit/aciclovir.svg","dessin":true,"cp":"antiviraux"},{"id":"ganciclovir","dci":"Ganciclovir","marq":"CYMEVENE®","marques":["CYMEVENE®"],"classe":"Analogues nucléosidiques (CMV)","sous":"Antimétabolite de la guanosine / analogue de la 2'-désoxyguanosine","meca":"Phosphorylé en monophosphate par une kinase virale (thymidine kinase) puis en triphosphate par les kinases cellulaires ; le triphosphate inhibe l'ADN polymérase virale (p.192). Inhibe la réplication des virus du groupe h","img":"../assets/rdkit/ganciclovir.svg","dessin":false,"cp":"antiviraux"},{"id":"penciclovir","dci":"Penciclo u CMV et la sortie ","img":"../assets/rdkit/maribavir.svg","dessin":false,"cp":"antiviraux"},{"id":"letermovir","dci":"Létermovir","marq":"","marques":[],"classe":"Autres anti-CMV","sous":"","meca":"","img":"../assets/rdkit/letermovir.svg","dessin":false,"cp":"antiviraux"},{"id":"zidovudine","dci":"Zidovudine","marq":"RETROVIR®","marques":["RETROVIR®","COMBIVIR® (+ lamivudine)"],"classe":"INTI","sous":"Analogue de la thymidine (pyrimidique)","meca":"Transformé in situ en nucléoside triphosphate qui bloque le site de la transcriptase inverse où se lient les nucléosides triphosphates physiologiques ; s'il est incorporé au brin d'ADN naissant, l'extension s'arrête car ","img":"../assets/rdkit/zidovudine.svg","dessin":false,"cp":"antiviraux"},{"id":"didanosine","dci":"Didanosine","marq":"","marques":[],"classe":"INTI","sous":"Analogue nucléosidique purique (inosine)","meca":"Analogue nucléosidique transformé in situ en triphosphate qui inhibe la transcriptase inverse et arrête l'élongation de l'ADN viral (absence de 3'-OH) (p.196).","img":"../assets/rdkit/didanosine.svg","dessin":false,"cp":"antiviraux"},{"id":"lamivudine","dci":"Lamivudine","marq":"EPIVIR®","marques":["EPIVIR®","ZEFFIX®","COMBIVIR® (+ zidovudine)","KIVEXA® (+ abacavir)"],"classe":"INTI","sous":"Analogue de la cytidine (oxathiolane)","meca":"Inhibiteur nucléosidique de la transcriptase inverse : transformé en triphosphate, bloque la transcriptase inverse et arrête l'élongation de l'ADN (p.196, 209). Le VHB possède une ADN polymérase à activité transcriptase ","img":"../assets/rdkit/lamivudine.svg","dessin":false,"cp":"antiviraux"},{"id":"emtricitabine","dci":"Emtricitabine","marq":"EMTRIVA®","marques":["EMTRIVA®"],"classe":"INTI","sous":"Analogue de la cytidine (oxathiolane)","meca":"Inhibiteur nucléosidique de la transcriptase inverse (activé en triphosphate, terminaison de chaîne) (p.196).","img":"../assets/rdkit/emtricitabine.svg","dessin":false,"cp":"antiviraux"},{"id":"abacavir","dci":"Abacavir","m :"Inhibe l'intégrase du VIH, enzyme qui intègre l'ADN viral (obtenu à partir de l'ARN viral par la transcriptase inverse) dans le génome de l'hôte, étape indispensable à la multiplication du virus (p.207).","img":"../assets/rdkit/raltegravir.svg","dessin":false,"cp":"antiviraux"},{"id":"sofosbuvir","dci":"Sofosbuvir","marq":"SOVALDI®","marques":["SOVALDI®","HARVONI® (+ lédipasvir)","EPCLUSA® (+ velpatasvir)"],"classe":"Antiviraux à action directe (VHC)","sous":"Inhibiteur nucléotidique de la polymérase NS5B (prodrogue)","meca":"Inhibiteur nucléotidique de l'ARN polymérase du VHC : inhibe la polymérase NS5B et ne semble pas agir sur l'ADN ou l'ARN polymérase humaine (p.211).","img":"../assets/rdkit/sofosbuvir.svg","dessin":false,"cp":"antiviraux"},{"id":"ledipasvir","dci":"Lédipasvir","marq":"HARVONI® (+ sofosbuvir)","marques":["HARVONI® (+ sofosbuvir)"],"classe":"Antiviraux à action directe (VHC)","sous":"Inhibiteur de protéine spécifique du VHC (NS5A selon la figure p.212)","meca":"Inhibiteur de protéines spécifiques du VHC de dernière génération (le texte p.211 parle d'inhibiteur de protéases ; la figure p.212 le classe comme inhibiteur NS5A).","img":"../assets/rdkit/ledipasvir.svg","dessin":false,"cp":"antiviraux"},{"id":"ribavirine","dci":"Ribavirine","marq":"","marques":[],"classe":"Analogues nucléosidiques à large spectre","sous":"Analogue nucléosidique de la guanosine (triazole-carboxamide riboside)","meca":"Analogue nucléosidique de la guanosine à large spectre antiviral (p.211).","img":"../assets/rdkit/ribavirine.svg","dessin":false,"cp":"antiviraux"},{"id":"fludarabine","dci":"Fludarabine","marq":"FLUDARABINE TEVA®","marques":["FLUDARABINE TEVA®"],"classe":"Analogues puriques (arabinosides)","sous":"Antimétabolite de l'adénosine (2-fluoro-adénine + arabinose)","meca":"Comme la vidarabine : après triple phosphorylation, inhibe l'ADN polymérase en agissant comme antimétabolite de l'adénosine (p.212).","img":"../assets/rdkit/fludarabine.svg","dessin":false,"cp":"antiviraux"},{"id":"interferons","dci":"Interférons (α-2a, α-2b, peginterféron α-2a…)","marq":"PEGASYS®","marques":["PEGASYS®","AVONEX®","BETAFERON®","PLEGRIDY®"],"classe":"Interférons","sous":"Cytokines produites par génie génétique","meca":"Sécrétés par les cellules infectées par les virus, ils s'opposent à leur prolifération ; propriétés antivirales, antiprolifératives et immunomodulatrices (p.213).","img":"","dessin":false,"cp":"antiviraux"},{"id":"yperite","dci":"Ypérite","marq":"","marques":[],"classe":"Moutarde au soufre","sous":"Premier agent alkylant découvert (gaz de combat)","meca":"Agent alkylant : pontage covalent des guanines de l'ADN (même principe que les moutardes azotées).","img":"../assets/rdkit/yperite.svg","dessin":true,"cp":"antitumoraux"},{"id":"chlorambucil","dci":"Chlorambucil","marq":"LEUKERAN®","marques":["LEUKERAN®"],"classe":"Moutardes azotées","sous":"Moutarde azotée aromatique (acide phénylbutyrique)","meca":"Moutarde à l'azote : l'azote forme un ion aziridinium qui alkyle le N7 de la guanine ; les deux bras chloroéthyle créent un pontage bicaténaire covalent stable de l'ADN, qui ne peut plus se dérouler ni se répliquer.","img":"../assets/rdkit/chlorambucil.svg","dessin":true,"cp":"antitumoraux"},{"id":"melphalan","dci":"Melphalan","marq":"ALKERAN®","marques":["ALKERAN®"],"classe":"Moutardes azotées","sous":"Moutarde azotée dérivée de la phénylalanine","meca":"Moutarde à l'azote : alkylation et pontage bicaténaire des guanines (N7) de l'ADN.","img":"../assets/rdkit/melphalan.svg","dessin":true,"cp":"antitumoraux"},{"id":"busulfan","dci":"Busulfan","marq":"BUSULFAN FRENIUS KABI®","marques":["BUSULFAN FRENIUS KABI®"],"classe":"Alkylsulfonates","sous":"Seul représentant des alkylsulfonates","meca":"Alkylsulfonate : agit selon un mécanisme similaire aux moutardes à l'azote (alkylation/pontage de l'ADN).","img":"../assets/rdkit/busulfan.svg","dessin":false,"cp":"antitumoraux"},{"id":"cyclophosphamide","dci":"Cyclophosphamide","marq":"ENDOXAN®","marques":["ENDOXAN®"],"classe":"Phosphoramides","sous":"Oxazaphosphorine (moutarde azotée sur un P)","meca":"Phosphoramide : se fixerait à la phosphoramidase, enzyme en proportion anormalement élevée dans certains types de cellules cancéreuses ; une fois fixé, il alkyle sélectivement les cellules cibles.","img":"../assets/rdkit/cyclophosphamide.svg","dessin":false,"cp":"antitumoraux"},{"id":"ifosfamide","dci":"Ifosfamide","marq":"HOLOXAN®","marques":["HOLOXAN®"],"classe":"Phosphoramides","sous":"Oxazaphosphorine, isomère de position du cyclophosphamide","meca":"Phosphoramide : fixation à la phosphoramidase des cellules cancéreuses puis alkylation sélective.","img":"../assets/rdkit/ifosfamide.svg","dessin":false,"cp":"antitumoraux"},{"id":"thiotepa","dci":"Thiotepa","marq":"TEPADINA®","marques":["TEPADINA®"],"classe":"Phosphoramides","sous":"Éthylène-imine (aziridines) sur un P=S","meca":"Phosphoramide se fixant à la phosphoramidase ; les éthylène-imines agissent selon un mécanisme similaire aux moutardes à l'azote.","img":"../assets/rdkit/thiotepa.svg","dessin":false,"cp":"antitumoraux"},{"id":"estramustine","dci":"Estramustine","marq":"ESTRACYT® (ancien)","marques":["ESTRACYT® (ancien)"],"classe":"Moutardes azotées","sous":"Moutarde azotée vectorisée par l'estradiol","meca":"Double effet : alkylant de type moutarde à l'azote (fonction bis-chloréthylamine) et, après hydrolyse, effet œstrogène par libération d'estradiol.","img":"../assets/rdkit/estramustine.svg","dessin":false,"cp":"antitumoraux"},{"id":"carmustine","dci":"Carmustine","marq":"","marques":[],"classe":"Nitrosourées","sous":"N-nitrosourée bis-chloroéthylée","meca":"Agent alkylant de type N-nitrosourée.","img":"../assets/rdkit/carmustine.svg","dessin":false,"cp":"antitumoraux"},{"id":"fotemustine","dci":"Fotémustine","marq":"","marques":[],"classe":"Nitrosourées","sous":"N-nitrosourée phosphonée","meca":"Agent alkylant de type nitrosourée.","img":"../assets/rdkit/fotemustine.svg","dessin":false,"cp":"antitumoraux"},{"id":"cisplatine","dci":"Cisplatine","marq":"CISPLATINE TEVA®","marques":["CISPLATINE TEVA®"],"classe":"Dérivés du platine","sous":"Complexe plan carré de Pt(II) : 2 NH3 + 2 Cl en cis","meca":"Le platine se fixe par liaisons covalentes au DNA : N7 et N1 de l'adénine, N3 de la cytidine, N7 de la guanine ; formation de monoadduits, de ponts intra- et inter-brins et de ponts ADN-protéine.","img":"../assets/rdkit/cisplatine.svg","dessin":true,"cp":"antitumoraux"},{"id":"carboplatine","dci":"Carboplatine","marq":"CARBOPLATINE HOSPIRA®","marques":["CARBOPLATINE HOSPIRA®","CARBOSIN®","CARBOPLATIN FRESENIUS KABI®"],"classe":"Dérivés du platine","sous":"Pt(II) + 2 NH3 + cyclobutane-1,1-dicarboxylate","meca":"Comme le cisplatine : liaison covalente du platine aux azotes des bases de l'ADN.","img":"../assets/rdkit/carboplatine.svg","dessin":false,"cp":"antitumoraux"},{"id":"oxaliplatine","dci":"Oxaliplatine","marq":"ELOXATIN®","marques":["ELOXATIN®","OXALIPLATIN TEVA®","OXALIPLATIN FRESENIUS KABI®"],"classe":"Dérivés du platine","sous":"Pt(II) + diaminocyclohexane + oxalate","meca":"Liaison covalente du platine à l'ADN.","img":"../assets/rdkit/oxaliplatine.svg","dessin":false,"cp":"antitumoraux"},{"id":"dacarbazine","dci":"Dacarbazine","marq":"DACARBAZINE MEDAC®","marques":["DACARBAZINE MEDAC®"],"classe":"Autres alkylants (méthylants)","sous":"Triazène imidazolé","meca":"Libérerait dans la cellule du diazométhane, agent alkylant donneur du groupe méthyl.","img":"../assets/rdkit/dacarbazine.svg","dessin":false,"cp":"antitumoraux"},{"id":"temozolomide","dci":"Temozolomide","marq":"TEMODAL®","marques":["TEMODAL®","TEMOZOLOMIDE ACCORD®"],"classe":"Autres alkylants (méthylants)","sous":"Imidazotétrazinone, dérivé de la dacarbazine","meca":"Se transforme dans l'organisme en un métabolite actif qui méthyle le DNA.","img":"../assets/rdkit/temozolomide.svg","dessin":false,"cp":"antitumoraux"},{"id":"mesna","dci":"Mesna","marq":"UROMITEXAN®","marques":["UROMITEXAN®","MISTABRON®"],"classe":"Détoxifiants (uroprotection)","sous":"Thiol uroprotecteur","meca":"Se lie par son SH à l'acroléine formée lors de doses élevées de cisplatine, cyclophosphamide et ifosfamide ; l'acroléine, éliminée à concentration élevée dans l'urine, est très toxique pour la muqueuse vésicale.","img":"../assets/rdkit/mesna.svg","dessin":true,"cp":"antitumoraux"},{"id":"dexrazoxane","dci":"Dexrazoxane","marq":"","marques":[],"classe":"Détoxifiants (cardioprotection)","sous":"Bis(dioxopipérazine)","meca":"1) Chélation du fer (surtout par son métabolite à cycle ouvert) réduisant le stress oxydatif dépendant du fer responsable de la cardiotoxicité des anthracyclines ; 2) inhibition de la topo-isomérase II.","img":"../assets/rdkit/dexrazoxane.svg","dessin":false,"cp":"antitumoraux"},{"id":"methotrexate","dci":"Méthotrexate","marq":"EMTREXATE®","marques":["EMTREXATE®","LEDERTREXATE®"],"classe":"Antifoliques","sous":"Inhibiteur de la dihydrofolate réductase","meca":"Inhibiteur non spécifique de la dihydrofolate réductase (cellules bactériennes, cancéreuses et normales) : empêche la réduction de l'acide folique en acide tétrahydrofolique puis en acide folinique actif, ce qui perturbe","img":"../assets/rdkit/methotrexate.svg","dessin":true,"cp":"antitumoraux"},{"id":"raltitrexed","dci":"Raltitrexed","marq":"TOMUDEX®","marques":["TOMUDEX®"],"classe":"Antifoliques","sous":"Inhibiteur de la thymidylate synthase","meca":"Inhibiteur de la thymidylate synthase, enzyme qui méthyle le dUMP en thymidine monophosphate incorporée dans l'ADN.","img":"../assets/rdkit/raltitrexed.svg","dessin":false,"cp":"antitumoraux"},{"id":"pemetrexed","dci":"Pemetrexed","marq":"ALIMTA®","marques":["ALIMTA®","PEMTREXED EG®","PEMTREXED ACCORD®","PEMTREXED FRESENIUS KABI®"],"classe":"Antifoliques","sous":"Antifolique multicible (TS, DHFR, GARFT)","meca":"Antifolique : inhibe la thymidylate synthase, la dihydrofolate réductase et la glycinamide ribonucléotide formyltransférase.","img":"../assets  des dérivés de la guanosine) ; particulièrement actif sur les lymphocytes B et T dont il inhibe la prolifération ; peut ainsi inhiber la","img":"../assets/rdkit/acide-mycophenolique.svg","dessin":false,"cp":"immunite"},{"id":"mycophenolate-mofetil","dci":"Mycophénolate mofétil","marq":"CELLCEPT®","marques":["CELLCEPT®"],"classe":"Inhibiteurs de l'IMPDH","sous":"Ester (prodrogue) de l'acide mycophénolique","meca":"Prodrogue de l'acide mycophénolique, inhibiteur de l'IMPDH (p.288).","img":"../assets/rdkit/mycophenolate-mofetil.svg","dessin":false,"cp":"immunite"},{"id":"basiliximab","dci":"Basiliximab","marq":"SIMULECT®","marques":["SIMULECT®"],"classe":"Anticorps immunosuppresseurs","sous":"Anticorps monoclonal anti-récepteur de l'IL-2","meca":"Anticorps monoclonal de souris humanisé dirigé contre le récepteur de l'interleukine 2 (p.288).","img":"","dessin":false,"cp":"immunite"}],"q":[{"id":"01-q01","t":"qcm","q":"Quelle(s) DCI contient le BACTRIM® ?","c":["Sulfaméthoxazole + triméthoprime","Sulfasalazine","Sulfadiazine argentique","Triméthoprime seul"],"r":"Sulfaméthoxazole + triméthoprime","x":"BACTRIM® et EUSAPRIM® = co-trimoxazole (rapport triméthoprime : sulfaméthoxazole 1 : 5)."},{"id":"01-q02","t":"qcm","q":"FLAMMAZINE® et SULFASIL® contiennent :","c":["Sulfadiazine argentique","Sulfasalazine","Mésalazine","Sulfaméthoxazole"],"r":"Sulfadiazine argentique","x":"Sulfamidé le plus utilisé en usage externe, surtout pour les brûlures infectées."},{"id":"01-q03","t":"qcm","q":"Lequel de ces noms commerciaux ne contient PAS de mésalazine seule ?","c":["SALAZOPYRINE®","PENTASA®","CLAVERSAL®","COLITOFALK®"],"r":"SALAZOPYRINE®","x":"SALAZOPYRINE® = sulfasalazine, pro-drug libérant la mésalazine et la sulfapyridine. CLAVERSAL®, COLITOFALK®, ASAMOVON® et PENTASA® = mésalazine seule."},{"id":"01-q04","t":"qcm","q":"Quelle enzyme les sulfamidés inhibent-ils ?","c":["Dihydroptéroate synthétase","Dihydrofolate réductase","Thymidylate synthase","DD-transpeptidase"],"r":"Dihydroptéroate synthétase","x":"Enzyme microbienne qui incorpore le PABA pour former l'acide folique. La DHFR est la cible du triméthoprime."},{"id":"01-q05","t":"qcm","q":"Quelle enzyme le triméthoprime inhibe-t-il préférentiellement ?","c":["Dihydrofolate réductase bactérienne","Dihydroptéroate synthétase","Dihydrofolate réductase humaine","Cyclooxygénase"],"r":"Dihydrofolate réductase bactérienne","x":"Sélectivité bactérie/homme d'environ 40 000, les deux enzymes étant différentes."},{"id":"01-q06","t":"vrai_faux","q":"Les sulfamidés sont bactéricides.","c":["Vrai","Faux"],"r":"Faux","x":"Ils empêchent la croissance et la multiplication des micro-organismes : bactériostatiques mais non bactéricides."},{"id":"01-q07","t":"qcm","q":"Selon les RSA, où doivent se trouver le NH2 et le SO2NH2 sur le noyau aromatique d'un sulfamidé ?","c":["En para","En ortho","En méta","Peu importe"],"r":"En para","x":"Les substituants doivent impérativement être en para, comme dans le PABA qu'ils imitent."},{"id":"01-q08","t":"qcm","q":"Quel effet a la disubstitution de l'azote du groupement sulfamoyle ?","c":["Elle inactive généralement la molécule","Elle augmente l'activité","Elle allonge la demi-vie à une semaine","Elle rend la molécule bactéricide"],"r":"Elle inactive généralement la molécule","x":"C'est la monosubstitution par un hétérocycle aromatique qui augmente l'activité ; un OCH3 sur cet hétérocycle allonge le T1/2."},{"id":"01-q09","t":"vrai_faux","q":"Le NH2 d'un sulfamidé peut porter un groupement labile éliminé lors de la métabolisation (ex. -N=N-).","c":["Vrai","Faux"],"r":"Vrai","x":"Le NH2 doit rester primaire, mais un groupement labile (-N=N-, -NH-CO-R) reste envisageable : c'est le cas du PRONTOSIL® et de la sulfasalazine."},{"id":"01-q10","t":"qcm","q":"Pourquoi le PRONTOSIL® est-il qualifié de pro-drug ?","c":["Il est inactif in vitro et métabolisé en sulfanilamide actif","Il est actif in vitro mais pas in vivo","Il est d'origine naturelle","Il inhibe directement la DHFR"],"r":"Il est inactif in vitro et métabolisé en sulfanilamide actif","x":"Il est métabolisé en 4-aminobenzènesulfonamide (sulfanilamide, seul actif) et en dérivé triaminobenzénique."},{"id":"01-q11","t":"qcm","q":"De quels trois éléments l'acide folique est-il constitué ?","c":["Cycle ptéridine, acide para-aminobenzoïque, glutamate","Cycle purine, PABA, glycine","Cycle ptéridine, acide salicylique, glutamate","Pyrimidine, benzène, aspartate"],"r":"Cycle ptéridine, acide para-aminobenzoïque, glutamate","x":"Les mammifères savent synthétiser la ptéridine mais pas y greffer le PABA et le glutamate."},{"id":"01-q12","t":"qcm","q":"Quelle est la forme active de l'acide folique ?","c":["Acide tétrahydrofolique (THF)","Acide dihydrofolique","Acide para-aminobenzoïque","Acide dihydroptéroïque"],"r":"Acide tétrahydrofolique (THF)","x":"Deux réductions successives, la seconde par la dihydrofolate réductase."},{"id":"01-q13","t":"qcm","q":"Un déficit en folates entraîne essentiellement :","c":["Une anémie macrocytaire","Une anémie microcytaire","Une hyperkaliémie","Une hypoglycémie"],"r":"Une anémie macrocytaire","x":"Hématies de taille augmentée (anémie mégaloblastique) par perturbation de la synthèse de l'ADN."},{"id":"01-q14","t":"qcm","q":"Quelle réaction, dépendante des dérivés du THF, fournit la thymidine pour l'ADN ?","c":["dUMP → dTMP par la thymidylate synthase","5-PRP → IMP","Sérine → glycine","Dihydrofolate → tétrahydrofolate"],"r":"dUMP → dTMP par la thymidylate synthase","x":"Réaction particulièrement importante dans les cellules en division rapide."},{"id":"01-q15","t":"qcm","q":"Lequel de ces composés n'est PAS un analogue structural du PABA inhibant la synthèse d'acide folique ?","c":["Triméthoprime","Sulfamidés antibactériens","Sulfones (dapsone)","Acide para-aminosalicylique"],"r":"Triméthoprime","x":"Le triméthoprime n'est pas un faux substrat du PABA : il inhibe l'étape suivante (DHFR)."},{"id":"01-q16","t":"qcm","q":"Quel effet indésirable est spécifiquement attribué au triméthoprime ?","c":["Hyperkaliémie","Argyrisme","Hémolyse en cas de déficit en G6PD","Allergie croisée avec les sulfamidés hypoglycémiants"],"r":"Hyperkaliémie","x":"Le cours cite l'hyperkaliémie et les troubles hématologiques (interférence avec les folates) dus au triméthoprime."},{"id":"01-q17","t":"vrai_faux","q":"Le co-trimoxazole est déconseillé au premier trimestre de la grossesse.","c":["Vrai","Faux"],"r":"Vrai","x":"Indices d'effet tératogène du triméthoprime ; si inévitable, supplémentation en acide folique. Données rassurantes aux 2e et 3e trimestres."},{"id":"01-q18","t":"qcm","q":"Dans la sulfasalazine, quelle partie est efficace dans la colite ulcéreuse ?","c":["La mésalazine (5-ASA)","La sulfapyridine","Le pont azo","La sulfasalazine intacte"],"r":"La mésalazine (5-ASA)","x":"La sulfasalazine n'est que le vecteur (pro-drug) qui empêche la résorption de la mésalazine dans la partie haute de l'intestin."},{"id":"01-q19","t":"qcm","q":"Les sulfamidés intestinaux sont caractérisés par :","c":["Une très faible résorption et une élimination intestinale","Une résorption rapide et une excrétion rénale sous forme active","Une application sur les brûlures","Une demi-vie d'une semaine"],"r":"Une très faible résorption et une élimination intestinale","x":"Le 2e choix décrit les sulfamidés urinaires."},{"id":"01-q20","t":"qcm","q":"Pourquoi les sulfamidés sont-ils amphotères ?","c":["Ils ont un caractère acide (-SO2NH-R) et basique (-NH2)","Ils sont à la fois hydrophiles et lipophiles","Ils agissent sur les Gram+ et les Gram−","Ils forment des sels d'argent"],"r":"Ils ont un caractère acide (-SO2NH-R) et basique (-NH2)","x":"D'où leur solubilité dans les acides et les bases diluées."},{"id":"01-q21","t":"qcm","q":"Quel produit agit sur des surfaces inertes (sols, poignées, brancards) ?","c":["Un désinfectant","Un antiseptique","Un antibiotique","Un bactériostatique"],"r":"Un désinfectant","x":"L'antiseptique agit sur les surfaces externes du corps ; le désinfectant sur les objets inanimés."},{"id":"01-q22","t":"qcm","q":"Lors de la coloration de Gram, pourquoi les Gram− se décolorent-elles à l'alcool ?","c":["Leur paroi est fine et riche en lipides (LPS), l'éthanol pénètre","Leur couche de peptidoglycane est épaisse","Elles n'ont pas de paroi","Elles ne fixent pas le lugol"],"r":"Leur paroi est fine et riche en lipides (LPS), l'éthanol pénètre","x":"Les Gram+ ont une couche épaisse de peptidoglycane qui s'oppose au passage de l'alcool."},{"id":"01-q23","t":"qcm","q":"Quelles bactéries sont dépourvues de paroi ?","c":["Les mycoplasmes","Les spirochètes","Les entérobactéries","Les staphylocoques"],"r":"Les mycoplasmes","x":"La paroi est présente chez toutes les bactéries sauf les mycoplasmes (ex. Mycoplasma pneumoniae)."},{"id":"01-q24","t":"vrai_faux","q":"Il est démontré cliniquement que les bactéricides sont supérieurs aux bactériostatiques dans les infections graves.","c":["Vrai","Faux"],"r":"Faux","x":"Cette idée n'est pas étayée par des données cliniques ; la distinction repose sur des analyses in vitro."},{"id":"01-q25","t":"qcm","q":"Quel mécanisme de résistance aux sulfamidés le cours cite-t-il ?","c":["Une production accrue de PABA par certains germes","Une β-lactamase","Une mutation de l'ADN-gyrase","L'absence de paroi"],"r":"Une production accrue de PABA par certains germes","x":"Le PABA en excès déplace l'inhibiteur compétitif."},{"id":"01-q26","t":"qcm","q":"Quel hétérocycle porte le sulfonamide du sulfaméthoxazole ?","c":["Un 5-méthylisoxazole","Une pyrimidine","Une pyridine","Un thiadiazole"],"r":"Un 5-méthylisoxazole","x":"Pyrimidine = sulfadiazine ; pyridine = sulfapyridine (dans la sulfasalazine) ; thiadiazole = 2254 RP (sulfamide hypoglycémiant historique)."},{"id":"01-q27","t":"qcm","q":"Quel motif structural caractérise le triméthoprime ?","c":["Une 2,4-diaminopyrimidine liée par un CH2 à un 3,4,5-triméthoxyphényle","Un benzènesulfonamide para-aminé","Un acide salicylique aminé en 5","Un cycle ptéridine lié au PABA"],"r":"Une 2,4-diaminopyrimidine liée par un CH2 à un 3,4,5-triméthoxyphényle","x":"Le triméthoprime n'est pas un sulfamidé. Le 2e choix = sulfanilamide, le 3e = mésalazine, le 4e = acide folique."},{"id":"01-q28","t":"qcm","q":"Quel effet indésirable local une utilisation prolongée de sulfadiazine argentique peut-elle provoquer ?","c":["Argyrisme (peau gris-ardoise)","Coloration rouge des urines","Photosensibilisation","Rupture du tendon d'Achille"],"r":"Argyrisme (peau gris-ardoise)","x":"Ses composants (sulfadiazine, Ag+) peuvent être résorbés lors d'un traitement long ou sur une grande surface."},{"id":"01-q30","t":"qcm","q":"Quand administre-t-on l'acide folinique dans le « rescue » du méthotrexate à hautes doses ?","c":["Quelques heures après le méthotrexate","En même temps que le méthotrexate","La veille du méthotrexate","Jamais avec le méthotrexate"],"r":"Quelques heures après le méthotrexate","x":"Pour ne pas neutraliser les effets antitumoraux du méthotrexate."},{"id":"02-q-clamoxyl","t":"qcm","q":"Quelle est la DCI de DELAMOXYLE® ?","c":["Amoxicilline","Ampicilline","Flucloxacilline","Témocilline"],"r":"Amoxicilline","x":"AMOXICILLIN AB®, AMOXICILLINE EG®, AMOXICILLINE SANDOZ®, CLAMOXYL® et DELAMOXYLE® = amoxicilline."},{"id":"02-q-staphycid","t":"qcm","q":"STAPHYCID® contient :","c":["Flucloxacilline","Pénicilline V","Amoxicilline","Pipéracilline"],"r":"Flucloxacilline","x":"FLOXAPEN® et STAPHYCID® = flucloxacilline (pénicilline résistante aux pénicillinases)."},{"id":"02-q-negaban","t":"qcm","q":"NEGABAN® correspond à :","c":["Témocilline","Ticarcilline","Pipéracilline","Ampicilline"],"r":"Témocilline","x":"NEGABAN® = témocilline, carboxypénicilline méthoxylée en 6α."},{"id":"02-q-extencin","t":"qcm","q":"EXTENCIN® est :","c":["Pénicilline G + benzathine","Pénicilline V + benzathine","Pipéracilline + tazobactam","Amoxicilline + benzathine"],"r":"Pénicilline G + benzathine","x":"La pénicilline G associée à la benzathine forme un sel peu soluble (résorption IM sur 2-4 semaines)."},{"id":"02-q-penV-acidores","t":"qcm","q":"Quelle modification rend la pénicilline V acidorésistante par rapport à la pénicilline G ?","c":["Remplacement de l'acide phénylacétique par l'acide phénoxyacétique (plus fort)","Ajout d'un NH2 sur le carbone α","Hydroxylation en para du phényle","Méthoxylation en 6α"],"r":"Remplacement de l'acide phénylacétique par l'acide phénoxyacétique (plus fort)","x":"Le phénoxyméthyle, plus attracteur, rend l'O du C=O exocyclique moins nucléophile : il n'attaque plus le carbone β-lactamique en milieu acide."},{"id":"02-q-amox-vs-ampi","t":"qcm","q":"Qu'est-ce qui distingue structurellement l'amoxicilline de l'ampicilline ?","c":["Un OH en para du noyau aromatique","Un NH2 sur le carbone α","Un groupe méthoxy en 6α","Un COOH sur le carbone α"],"r":"Un OH en para du noyau aromatique","x":"L'amoxicilline provient de l'hydroxylation en para de l'ampicilline ; elle est résorbée à ~80 % contre 25-40 % pour l'ampicilline."},{"id":"02-q-temo-structure","t":"qcm","q":"La témocilline se distingue de la ticarcilline par :","c":["Un groupe méthoxy en 6α","Un atome de fluor","Un OH en para","Un cycle pipérazine-dione"],"r":"Un groupe méthoxy en 6α","x":"« Notons que la témocilline est une pénicilline méthoxylée en 6α. »"},{"id":"02-q-fluclox-RR","t":"qcm","q":"Dans la flucloxacilline, quels sont les substituants R et R' du phényle de l'isoxazole ?","c":["R = F, R' = Cl","R = H, R' = Cl","R = H, R' = H","R = Cl, R' = Cl"],"r":"R = F, R' = Cl","x":"Oxacilline H/H, cloxacilline H/Cl, flucloxacilline F/Cl."},{"id":"02-q-6apa","t":"qcm","q":"Comment obtient-on industriellement le 6-APA ?","c":["Par hydrolyse de la pénicilline G (ou V) par la pénicilline amidase","Par synthèse totale (1957)","Par action d'une β-lactamase sur la pénicilline G","Par acylation de l'acide pénicilloïque"],"r":"Par hydrolyse de la pénicilline G (ou V) par la pénicilline amidase","x":"La pénicilline amidase de Penicillium chrysogenum scinde la pénicilline G en 6-APA + acide phénylacétique ; la synthèse totale n'a jamais été rentable."},{"id":"02-q-noyau","t":"qcm","q":"Le noyau des pénicillines associe un cycle β-lactame à :","c":["Un cycle thiazolidine","Un cycle thiazine","Un cycle isoxazole","Un cycle pipérazine"],"r":"Un cycle thiazolidine","x":"β-lactame (4 pièces) accolé à une thiazolidine (5 pièces) ; la thiazine est le cycle des céphalosporines."},{"id":"02-q-precurseurs","t":"qcm","q":"De quels acides aminés dérive le squelette de la pénicilline ?","c":["Valine et cystéine","Alanine et sérine","Lysine et glycine","Valine et méthionine"],"r":"Valine et cystéine","x":"Le squelette dérive de la cystéine et de la valine, ce qui est prouvé."},{"id":"02-q-meca","t":"qcm","q":"Quelles enzymes les pénicillines inhibent-elles ?","c":["Les DD-transpeptidases et DD-carboxypeptidases","La dihydroptéroate synthétase","L'ADN-gyrase","La sous-unité 30S du ribosome"],"r":"Les DD-transpeptidases et DD-carboxypeptidases","x":"Ces enzymes à sérine confondent la pénicilline avec le D-Ala-D-Ala terminal du précurseur de peptidoglycane."},{"id":"02-q-mycoplasme","t":"vrai_faux","q":"Les pénicillines sont efficaces contre les mycoplasmes.","c":["Vrai","Faux"],"r":"Faux","x":"Les β-lactames inhibent la biosynthèse de la paroi : sans effet sur les organismes dépourvus de paroi comme les mycoplasmes."},{"id":"02-q-bactericide","t":"vrai_faux","q":"Les pénicillines et les céphalosporines sont bactériostatiques.","c":["Vrai","Faux"],"r":"Faux","x":"Elles sont toutes deux bactéricides."},{"id":"02-q-pkpd-beta","t":"qcm","q":"Quel paramètre PK/PD gouverne l'efficacité des β-lactamines ?","c":["%fT > CMI","Cmax/CMI","AUC24/CMI","Demi-vie seule"],"r":"%fT > CMI","x":"β-lactamines = temps-dépendantes : maintenir la concentration libre au-dessus de la CMI suffisamment longtemps."},{"id":"02-q-pkpd-amino","t":"qcm","q":"Les aminoglycosides sont :","c":["Concentration-dépendants (pic/CMI)","Temps-dépendants (T > CMI)","Dépendants de l'AUC/CMI","Indépendants de la CMI"],"r":"Concentration-dépendants (pic/CMI)","x":"Aminoglycosides = obtenir un pic élevé par rapport à la CMI ; effet post-antibiotique."},{"id":"02-q-betalactamase-produit","t":"qcm","q":"Quel produit inactif résulte de l'hydrolyse de la pénicilline par une β-lactamase ?","c":["Acide pénicilloïque","Acide pénicillénique","6-APA","Acide phénylacétique"],"r":"Acide pénicilloïque","x":"Piège : l'acide pénicillénique se forme en milieu acide (estomac), l'acide pénicilloïque par les β-lactamases."},{"id":"02-q-encombrant","t":"qcm","q":"Comment a-t-on rendu des pénicillines résistantes aux β-lactamases ?","c":["Groupements encombrants protégeant la fonction lactame","Augmentation de l'hydrophilie de la chaîne latérale","Ajout d'un NH2 sur le carbone α","Formation d'un sel avec la benzathine"],"r":"Groupements encombrants protégeant la fonction lactame","x":"Groupements encombrants + radical acyle électrocaptant (acido-résistance) : oxacilline, cloxacilline, flucloxacilline."},{"id":"02-q-hydrophilie","t":"qcm","q":"Quel effet a l'augmentation de l'hydrophilie de la chaîne latérale ?","c":["Élargissement du spectre aux Gram −","Résistance aux β-lactamases","Action prolongée","Perte de l'activité sur les Gram +"],"r":"Élargissement du spectre aux Gram −","x":"NH2 → aminopénicillines, COOR → carboxypénicillines, NH-CO-NH-R → uréidopénicillines."},{"id":"02-q-amino-blactamases","t":"vrai_faux","q":"Les aminopénicillines sont actives sur les staphylocoques producteurs de β-lactamases.","c":["Vrai","Faux"],"r":"Faux","x":"Les aminopénicillines sont très sensibles aux β-lactamases."},{"id":"02-q-pip-voie","t":"qcm","q":"La pipéracilline est :","c":["Une acyluréidopénicilline parentérale, toujours associée au tazobactam","Une aminopénicilline orale","Une carboxypénicilline orale","Une pénicilline résistante aux pénicillinases"],"r":"Une acyluréidopénicilline parentérale, toujours associée au tazobactam","x":"Acido-sensible donc parentérale ; seul représentant commercialisé en Belgique (PIPERACILLINE-TAZOBACTAM EG®)."},{"id":"02-q-tazobactam","t":"qcm","q":"Le tazobactam est :","c":["Un inhibiteur de β-lactamases","Une carboxypénicilline","Un sel retard de pénicilline","Un aminoside"],"r":"Un inhibiteur de β-lactamases","x":"Associé à la pipéracilline pour la protéger des β-lactamases."},{"id":"02-q-penG-spectre","t":"qcm","q":"Le spectre de la pénicilline G est :","c":["Étroit, Gram + (hors producteurs de pénicillinases)","Large, Gram + et Gram −","Limité aux Gram −","Limité aux anaérobies"],"r":"Étroit, Gram + (hors producteurs de pénicillinases)","x":"Les producteurs de pénicillinases (nombreux staphylocoques, bacilles Gram −) lui résistent."},{"id":"02-q-allergie-pourcent","t":"qcm","q":"Quelle proportion de la population a une vraie hypersensibilité IgE-médiée à la pénicilline ?","c":["Moins de 1 %","Environ 10 %","Environ 25 %","Environ 5 %"],"r":"Moins de 1 %","x":"~10 % se déclarent allergiques, mais < 1 % le sont vraiment : l'allergie est surestimée."},{"id":"02-q-cross-reac","t":"qcm","q":"Risque de réaction croisée avec une céphalosporine de 1re génération chez un allergique aux pénicillines :","c":["Jusqu'à ~1-8 %","Toujours < 0,1 %","Environ 50 %","Nul"],"r":"Jusqu'à ~1-8 %","x":"1re génération ou chaîne latérale similaire : ~1-8 % ; 3e-4e générations : généralement < 1 %."},{"id":"02-q-maladie-serique","t":"qcm","q":"La maladie sérique sous pénicilline est une hypersensibilité de type :","c":["III","I","II","IV"],"r":"III","x":"Type III = complexes immuns ; type I = anaphylaxie ; type II = anémie hémolytique, thrombopénie."},{"id":"02-q-ampi-po","t":"vrai_faux","q":"L'ampicilline per os est bien résorbée (environ 80 %).","c":["Vrai","Faux"],"r":"Faux","x":"Ampicilline : 25-40 % (diminue avec la dose) ; c'est l'amoxicilline qui est résorbée à ~80 %."},{"id":"02-q-temo-indic","t":"qcm","q":"Les carboxypénicillines (dont la témocilline) devraient être réservées :","c":["Aux infections à Gram − insensibles aux aminopénicillines","Aux angines à streptocoques","Aux abcès à staphylocoques","Aux infections à mycoplasmes"],"r":"Aux infections à Gram − insensibles aux aminopénicillines","x":"Leur spectre s'étend à de nombreux Gram − ; NEGABAN® : IU compliquées, pyélonéphrites, infections respiratoires basses, peau et tissus mous."},{"id":"03-q03-01","t":"qcm","q":"Qu'est-ce qui distingue chimiquement les céphalosporines des pénicillines ?","c":["Le cycle thiazolidine est remplacé par un cycle thiazine","Le cycle β-lactame est remplacé par un cycle azétidine","Le soufre est remplacé par un oxygène","Le COOH est remplacé par un sulfonate"],"r":"Le cycle thiazolidine est remplacé par un cycle thiazine","x":"Les céphalosporines possèdent un cycle thiazine (6 chaînons) à la place du thiazolidine (5 chaînons) des pénicillines."},{"id":"03-q03-02","t":"qcm","q":"Quel intermédiaire de synthèse sert à préparer les céphalosporines hémi-synthétiques ?","c":["Acide 7-aminocéphalosporanique (7-ACA)","Acide 6-aminopénicillanique (6-APA)","Acide clavulanique","Noyau carbapénème"],"r":"Acide 7-aminocéphalosporanique (7-ACA)","x":"On module la chaîne latérale portée par le groupement 7-amino du 7-ACA, obtenu par hydrolyse de la céphalosporine C."},{"id":"03-q03-03","t":"qcm","q":"ZINNAT® contient :","c":["Du céfuroxime axétil","Du céfuroxime sodique","Du céfadroxil","De la ceftriaxone"],"r":"Du céfuroxime axétil","x":"ZINNAT®, CEFUROXIME EG® et CEFUROXIME SANDOZ® = céfuroxime axétil (oral) ; ZINACEF® et CEFUROXIM FRESENIUS KABI® = céfuroxime sodique (injectable)."},{"id":"03-q03-04","t":"qcm","q":"DURACEF® correspond à :","c":["Céfadroxil","Céfalexine","Céfazoline","Céfuroxime"],"r":"Céfadroxil","x":"DURACEF® et CEFADROXIL SANDOZ® = céfadroxil (groupe I, p.o.)."},{"id":"03-q03-05","t":"qcm","q":"KEFORAL® correspond à :","c":["Céfalexine","Céfadroxil","Céfépime","Céfotaxime"],"r":"Céfalexine","x":"KEFORAL® = céfalexine, dérivé non hydroxylé du céfadroxil (groupe I, p.o.)."},{"id":"03-q03-06","t":"qcm","q":"CLAFORAN® est le nom commercial de :","c":["Céfotaxime sodique","Ceftazidime","Ceftriaxone","Céfépime"],"r":"Céfotaxime sodique","x":"CLAFORAN® = céfotaxime sodique, céphalosporine du groupe III."},{"id":"03-q03-07","t":"qcm","q":"ROCEPHINE® appartient à quel groupe de céphalosporines ?","c":["Groupe III","Groupe I","Groupe II","Groupe V"],"r":"Groupe III","x":"ROCEPHINE® = ceftriaxone, groupe III (avec le céfotaxime et la ceftazidime)."},{"id":"03-q03-08","t":"qcm","q":"ZINFORO® (ceftaroline) se distingue des autres céphalosporines par son activité sur :","c":["Les Staphylococcus aureus méticillino-résistants (MRSA)","Pseudomonas aeruginosa","Les entérocoques","Les bactéries atypiques (Legionella, Mycoplasma, Chlamydia)"],"r":"Les Staphylococcus aureus méticillino-résistants (MRSA)","x":"La ceftaroline (groupe V) est active sur les MRSA et les S. pneumoniae résistants à la pénicilline, mais inactive sur P. aeruginosa, la plupart des entérocoques et les atypiques."},{"id":"03-q03-09","t":"qcm","q":"MERONEM® est le nom commercial de :","c":["Méropénème","Imipénème + cilastatine","Aztréonam","Ceftazidime"],"r":"Méropénème","x":"MERONEM® = méropénème, carbapénème plus stable que l'imipénème, utilisable seul. L'imipénème + cilastatine = TIENAM®."},{"id":"03-q03-10","t":"qcm","q":"AZACTAM® et CAYSTON® contiennent :","c":["Aztréonam, un monobactame","Méropénème, un carbapénème","Tazobactam, un inhibiteur de β-lactamases","Ceftazidime, une C3G"],"r":"Aztréonam, un monobactame","x":"L'aztréonam est un monobactame de synthèse actif uniquement sur les aérobies Gram négatif."},{"id":"03-q03-11","t":"qcm","q":"Quelle est la seule différence structurale entre le céfadroxil et la céfalexine ?","c":["Un OH en para sur le benzène exocyclique du céfadroxil","Un CH3 en 3 sur la céfalexine seulement","Un groupe méthoxyimino sur le céfadroxil","Un ester axétil sur la céfalexine"],"r":"Un OH en para sur le benzène exocyclique du céfadroxil","x":"La céfalexine est le dérivé non hydroxylé du céfadroxil sur le noyau benzène exocyclique (même relation qu'ampicilline/amoxicilline)."},{"id":"03-q03-12","t":"qcm","q":"Lesquelles de ces caractéristiques améliorent souvent la biodisponibilité orale d'une céphalosporine ?","c":["NH2 en α du lien amide, estérification du COOH, -CH3 ou Cl en 3","Azote quaternaire en 3 et forme zwitterionique","Radical ATMO en 7","Sel sodique du COOH"],"r":"NH2 en α du lien amide, estérification du COOH, -CH3 ou Cl en 3","x":"Règle en gras p.56 : NH2 en α du lien amide, estérification du COOH et -CH3 ou Cl en 3."},{"id":"03-q03-13","t":"qcm","q":"Pourquoi le céfuroxime axétil peut-il être administré par voie orale ?","c":["C'est un ester acétoxyéthylique (prodrogue) du céfuroxime","Il possède un azote quaternaire","Il porte un NH2 en α du lien amide","Il est associé à un inhibiteur de β-lactamases"],"r":"C'est un ester acétoxyéthylique (prodrogue) du céfuroxime","x":"L'ester axétil (en rouge dans la structure) est une prodrogue du céfuroxime administrable par la voie orale."},{"id":"03-q03-14","t":"qcm","q":"Quel radical est présent systématiquement dans les céphalosporines du groupe III (sauf le céfotétan) ?","c":["Aminothiazolylméthoxyiminométhyle (ATMO)","p-Hydroxyphénylglycyle","Tétrazolylacétyle","1-Acétoxyéthyle"],"r":"Aminothiazolylméthoxyiminométhyle (ATMO)","x":"L'ATMO est sans doute responsable de l'élargissement du spectre à certaines souches Gram - difficilement traitables."},{"id":"03-q03-15","t":"qcm","q":"Pourquoi le céfuroxime est-il considéré comme le précurseur des C3G ?","c":["Il introduit un substituant méthoxyimino en α du C=O amide","Il possède un azote quaternaire","Il est actif sur les Pseudomonas","Il a un chaînon en 7 identique à celui de l'amoxicilline"],"r":"Il introduit un substituant méthoxyimino en α du C=O amide","x":"Son chaînon en 7 diffère radicalement de ceux des groupes I et II par ce méthoxyimino, que l'on retrouve dans l'ATMO des C3G."},{"id":"03-q03-16","t":"vrai_faux","q":"Vrai ou faux : les inhibiteurs de β-lactamases sont des antibiotiques à part entière.","c":["Vrai","Faux"],"r":"Faux","x":"Les inhibiteurs de β-lactamases ne sont pas des antibiotiques : ils potentialisent la β-lactamine associée et élargissent son emploi aux souches productrices de β-lactamases."},{"id":"03-q03-17","t":"qcm","q":"Le sulbactam et l'acide clavulanique sont des inhibiteurs des β-lactamases de type :","c":["Irréversible","Réversible","Compétitif uniquement","Allostérique"],"r":"Irréversible","x":"« Irréversibles » est écrit en rouge dans le cours : ce sont de puissants inhibiteurs irréversibles des β-lactamases des Gram + et Gram -."},{"id":"03-q03-18","t":"qcm","q":"Pourquoi la ceftazidime est-elle particulièrement soluble dans l'eau ?","c":["Elle possède un azote quaternaire (pyridinium)","Elle est estérifiée","Elle porte un CH3 en 3","Elle n'a pas de cycle β-lactame"],"r":"Elle possède un azote quaternaire (pyridinium)","x":"L'azote quaternaire la rend très soluble ; la forme zwitterionique favoriserait le passage de la paroi bactérienne."},{"id":"03-q03-19","t":"qcm","q":"Les céphalosporines du groupe I sont :","c":["Actives sur Gram + (10x moins que la pénicilline G), sur quelques Gram -, et sensibles aux céphalosporinases","Actives sur la majorité des Gram -, y compris Pseudomonas","Actives sur les MRSA","Résistantes à la plupart des céphalosporinases des Gram -"],"r":"Actives sur Gram + (10x moins que la pénicilline G), sur quelques Gram -, et sensibles aux céphalosporinases","x":"Définition du groupe I (p.56)."},{"id":"03-q03-20","t":"qcm","q":"Qu'est-ce qui différencie le céfépime (groupe IV) du groupe III ?","c":["Une sensibilité nettement moindre à un certain nombre de β-lactamases","Une activité sur les MRSA","Une administration orale","L'absence de radical aminothiazole"],"r":"Une sensibilité nettement moindre à un certain nombre de β-lactamases","x":"Le céfépime est le seul représentant du groupe IV ; son spectre s'étend à des germes résistants à d'autres C3G."},{"id":"03-q03-21","t":"qcm","q":"Un patient a une allergie documentée à la pénicilline IgE-médiée. Quelle affirmation est correcte ?","c":["Les C1G ne sont pas des alternatives ; céfuroxime, C3G et C4G possibles sous surveillance hospitalière","Toutes les céphalosporines peuvent être délivrées sans précaution","Seules les céphalosporines de 1re génération sont autorisées","Aucune β-lactamine n'est jamais envisageable"],"r":"Les C1G ne sont pas des alternatives ; céfuroxime, C3G et C4G possibles sous surveillance hospitalière","x":"Positionnement des céphalosporines (p.63)."},{"id":"03-q03-22","t":"qcm","q":"Quelle proportion de patients allergiques aux pénicillines sont également allergiques aux céphalosporines ?","c":["Environ 10 %","Environ 1 %","Environ 50 %","100 %"],"r":"Environ 10 %","x":"Effets indésirables des céphalosporines (p.64)."},{"id":"03-q03-23","t":"qcm","q":"Avec quelle céphalosporine l'anémie hémolytique est-elle surtout décrite ?","c":["Ceftriaxone","Céfadroxil","Céfuroxime axétil","Céfépime"],"r":"Ceftriaxone","x":"Anémie hémolytique décrite surtout avec la ceftriaxone et le céfotétan (p.64)."},{"id":"03-q03-24","t":"qcm","q":"Pourquoi l'imipénème est-il associé à la cilastatine (TIENAM®) ?","c":["La cilastatine inhibe de manière réversible la déhydropeptidase rénale qui dégrade l'imipénème","La cilastatine est un inhibiteur irréversible des β-lactamases","La cilastatine élargit le spectre aux Gram +","La cilastatine permet l'absorption orale"],"r":"La cilastatine inhibe de manière réversible la déhydropeptidase rénale qui dégrade l'imipénème","x":"L'imipénème est métabolisé par ouverture du cycle β-lactame lors de l'excrétion urinaire ; le méropénème, plus stable, s'utilise seul."},{"id":"03-q03-25","t":"vrai_faux","q":"Vrai ou faux : le noyau carbapénème contient un atome de soufre, comme les pénicillines.","c":["Vrai","Faux"],"r":"Faux","x":"Le noyau carbapénème ne possède pas d'atome de soufre et présente une double liaison 2-3 comme les céphalosporines."},{"id":"03-q03-26","t":"qcm","q":"Que démontrent les nocardicines et les monobactames ?","c":["Qu'une structure β-lactamique bicyclique n'est pas indispensable à l'activité antibiotique","Que le soufre est indispensable à l'activité","Que les β-lactames sont inactifs sur les Gram -","Que l'ATMO est indispensable à l'activité"],"r":"Qu'une structure β-lactamique bicyclique n'est pas indispensable à l'activité antibiotique","x":"Phrase en bleu souligné (p.66)."},{"id":"03-q03-27","t":"qcm","q":"Le spectre de l'aztréonam est limité aux :","c":["Micro-organismes aérobies Gram négatif","Gram + uniquement","Anaérobies","MRSA"],"r":"Micro-organismes aérobies Gram négatif","x":"Monobactame de synthèse actif que sur les aérobies Gram - (p.66)."},{"id":"03-q03-28","t":"qcm","q":"Quelle est la place des C3G en pratique ambulatoire ?","c":["Seulement les IST","Premier choix des angines","Premier choix des cystites simples","Toutes les infections respiratoires"],"r":"Seulement les IST","x":"Les C3G sont réservées aux infections graves, le plus souvent hospitalières ; en ambulatoire, seule place : les IST."},{"id":"03-q03-29","t":"qcm","q":"Le tazobactam est associé à :","c":["La pipéracilline et le ceftolozane","L'amoxicilline uniquement","L'imipénème","L'aztréonam"],"r":"La pipéracilline et le ceftolozane","x":"PIPERACILLINE/TAZOBACTAM EG® et ZEBRAXA® (ceftolozane + tazobactam)."},{"id":"04-q-chloramph-groupement","t":"qcm","q":"Quel groupement porte le cycle aromatique du chloramphénicol en para ?","c":["NO2","SO2CH3","NH2","Cl"],"r":"NO2","x":"Chloramphénicol : p-nitrophényle. Le thiamphénicol est l'analogue méthylsulfonylé (SO2CH3)."},{"id":"04-q-thiamph-difference","t":"qcm","q":"Qu'est-ce qui distingue le thiamphénicol du chloramphénicol ?","c":["Un CH3-SO2- à la place du NO2","Un OCH3 en 6","Un Cl à la place d'un OH","Une lysine sur l'amide"],"r":"Un CH3-SO2- à la place du NO2","x":"Le thiamphénicol est l'analogue méthylsulfonylé du chloramphénicol ; mêmes propriétés physico-chimiques, toxicité médullaire moindre."},{"id":"04-q-phenicoles-ei","t":"qcm","q":"Quel est le principal effet indésirable du chloramphénicol et du thiamphénicol ?","c":["Atteintes de la moelle osseuse (aplasie, agranulocytose, thrombocytopénie)","Néphrotoxicité","Allongement du QT","Dyschromies dentaires"],"r":"Atteintes de la moelle osseuse (aplasie, agranulocytose, thrombocytopénie)","x":"Toxicité médullaire parfois mortelle ; surveillance de l'hémogramme. Le thiamphénicol est mieux toléré sur le plan hématologique."},{"id":"04-q-idiosyncrasique","t":"vrai_faux","q":"Vrai ou faux : l'aplasie médullaire au chloramphénicol est proportionnelle à la dose reçue.","c":["Vrai","Faux"],"r":"Faux","x":"C'est un effet idiosyncrasique : imprévisible, sans rapport entre dose et effet (une seule exposition peut être fatale) ni avec la durée d'exposition."},{"id":"04-q-sous-unite-30s","t":"qcm","q":"Quelles familles inhibent la sous-unité ribosomale 30S ?","c":["Tétracyclines et aminosides","Macrolides et lincosamides","Chloramphénicol et acide fusidique","Macrolides et aminosides"],"r":"Tétracyclines et aminosides","x":"30S : tétracyclines et aminosides. 50S : macrolides, chloramphénicol/thiamphénicol, acide fusidique, lincosamides."},{"id":"04-q-ribosome-procaryote","t":"qcm","q":"Quel ARNr constitue la petite sous-unité (30S) du ribosome procaryote ?","c":["ARNr 16S","ARNr 18S","ARNr 23S","ARNr 28S"],"r":"ARNr 16S","x":"Procaryotes : 50S = ARNr 23S + 5S ; 30S = ARNr 16S. Eucaryotes : 40S = ARNr 18S ; 60S = 28S, 5.8S, 5S."},{"id":"04-q-tetra-squelette","t":"qcm","q":"Sur quel noyau repose le squelette des tétracyclines ?","c":["Naphtacène","Naphtalène","Quinoléine","Stéroïde"],"r":"Naphtacène","x":"Toutes les tétracyclines possèdent un noyau naphtacène (4 cycles accolés) diversement substitué."},{"id":"04-q-tetra-epimerisation","t":"qcm","q":"Quel carbone des tétracyclines s'épimérise en solution acide (4 < pH < 8) pour donner l'épitétracycline peu active ?","c":["C4","C6","C12a","C2"],"r":"C4","x":"Le C4 porte le groupement N(CH3)2 ; son épimérisation forme l'épitétracycline, peu active."},{"id":"04-q-doxy-rsa","t":"qcm","q":"Par rapport à la tétracycline, que possède la doxycycline ?","c":["Un OH en R5 au lieu de R6","Un N(CH3)2 en R7","Un Cl en R7","Une lysine en R2"],"r":"Un OH en R5 au lieu de R6","x":"Minocycline : N(CH3)2 en R7 ; chlortétracycline : Cl en R7 ; lymécycline : lysine en R2."},{"id":"04-q-minocycline-marque","t":"qcm","q":"Quelle spécialité contient de la minocycline ?","c":["KLINOTAB®","VIBRATAB®","TETRALYSAL®","TYGACIL®"],"r":"KLINOTAB®","x":"Minocycline : KLINOTAB®, MINO-50®, MINOTAB®, MINOCYCLINE EG®. VIBRATAB® = doxycycline ; TETRALYSAL® = lymécycline ; TYGACIL® = tigécycline."},{"id":"04-q-lymecycline","t":"qcm","q":"Pourquoi la lymécycline (TETRALYSAL®) est-elle plus soluble dans l'eau au pH physiologique ?","c":["Présence d'une lysine en R2","Présence d'un OH en R5","Absence du N(CH3)2","Présence d'un métaphosphate"],"r":"Présence d'une lysine en R2","x":"La lysine en R2 augmente la solubilité ; la lymécycline peut être considérée comme une prodrogue de la tétracycline."},{"id":"04-q-tetra-calcium","t":"vrai_faux","q":"Vrai ou faux : on peut prendre une tétracycline avec un verre de lait pour protéger l'estomac.","c":["Vrai","Faux"],"r":"Faux","x":"Les tétracyclines forment avec le Ca2+ des chélates stables et difficilement résorbables : à éviter avec les aliments riches en calcium."},{"id":"04-q-tigecycline","t":"qcm","q":"La tigécycline (TYGACIL®) est :","c":["Une glycylcycline dérivée de la minocycline, i.v. à l'hôpital","Un macrolide à 16 atomes","Un aminoside pour nébulisation","Une tétracycline topique pour l'acné"],"r":"Une glycylcycline dérivée de la minocycline, i.v. à l'hôpital","x":"Groupement glycylamido encombré en position 9 de la minocycline, contre les résistances (pompes d'efflux) ; i.v. 2 fois/jour pour infections cutanées et intra-abdominales compliquées."},{"id":"04-q-tetra-enfant","t":"qcm","q":"Quel effet indésirable des tétracyclines justifie de les éviter chez l'enfant de moins de 8 ans ?","c":["Dyschromies dentaires et hypoplasie de l'émail","Ototoxicité","Aplasie médullaire","Allongement du QT"],"r":"Dyschromies dentaires et hypoplasie de l'émail","x":"Grande affinité des tétracyclines pour le tissu osseux."},{"id":"04-q-macrolide-structure","t":"qcm","q":"Un macrolide est caractérisé par :","c":["Un macrocycle lactonique de 14, 15 ou 16 atomes substitué par un aminoose et un ose","Un noyau naphtacène","Un cyclitol dont deux OH sont remplacés par des amines","Un noyau β-lactame"],"r":"Un macrocycle lactonique de 14, 15 ou 16 atomes substitué par un aminoose et un ose","x":"Sauf les kétolides, où une cétone remplace un sucre (le cladinose)."},{"id":"04-q-clarithro-rsa","t":"qcm","q":"Quelle modification de l'érythromycine donne la clarithromycine ?","c":["CH3O à la place du OH en position 6","Oxime en 9","Azote inséré dans le cycle (15 atomes)","Cétone à la place du cladinose"],"r":"CH3O à la place du OH en position 6","x":"Roxithromycine : oxime en 9 ; azithromycine : azalide à 15 atomes ; télithromycine : kétolide."},{"id":"04-q-azithro-cycle","t":"qcm","q":"Combien d'atomes compte le macrocycle de l'azithromycine ?","c":["15 dont un azote","14","16","18"],"r":"15 dont un azote","x":"Azamacrolide (azalide) à 15 atomes ; demi-vie beaucoup plus longue (une prise par jour, voire unique)."},{"id":"04-q-heliclar","t":"qcm","q":"HELICLAR® contient :","c":["Clarithromycine","Azithromycine","Amoxicilline","Oméprazole"],"r":"Clarithromycine","x":"Clarithromycine : BICLAR®, CLARITHROMYCINE EG®, HELICLAR® ; utilisée avec amoxicilline + oméprazole contre H. pylori."},{"id":"04-q-erythro-cyp","t":"qcm","q":"Par quel mécanisme l'érythromycine provoque-t-elle de nombreuses interactions ?","c":["Inhibition du CYP3A4","Induction du CYP3A4","Chélation des cations","Compétition pour la sécrétion tubulaire"],"r":"Inhibition du CYP3A4","x":"Elle ralentit le métabolisme de la théophylline, carbamazépine, ciclosporine, cisapride, disopyramide, ergotamine… (gangrène avec l'ergotamine)."},{"id":"04-q-erythro-qt","t":"vrai_faux","q":"Vrai ou faux : le risque de torsades de pointes avec l'érythromycine est surtout lié à une injection i.v. trop rapide.","c":["Vrai","Faux"],"r":"Vrai","x":"Allongement de l'intervalle QT avec risque de torsades de pointes, surtout en cas d'injection i.v. trop rapide d'érythromycine."},{"id":"04-q-spiramycine","t":"qcm","q":"Dans quelle situation la spiramycine (ROVAMYCINE®) peut-elle être utile ?","c":["Toxoplasmose pendant la grossesse","Infection à Clostridium difficile","Tuberculose","Acné"],"r":"Toxoplasmose pendant la grossesse","x":"Mélange de spiramycines I, II, III (16 atomes), spectre analogue à l'érythromycine."},{"id":"04-q-fidaxomicine-meca","t":"qcm","q":"Quel est le mécanisme d'action de la fidaxomicine ?","c":["Inhibition de l'ARN polymérase bactérienne (site distinct des rifamycines)","Fixation à la sous-unité 50S","Fixation à la sous-unité 30S","Inhibition de la paroi"],"r":"Inhibition de l'ARN polymérase bactérienne (site distinct des rifamycines)","x":"Bien que structurellement apparentée aux macrolides (lactone de 18 atomes), elle est bactéricide et inhibe la synthèse de l'ARN."},{"id":"04-q-aminosides-rouge","t":"qcm","q":"Quelle phrase rouge du cours caractérise les aminosides ?","c":["La marge thérapeutique-toxique est étroite","Ils sont actifs per os","Ils sont surtout actifs sur les anaérobies","Ils sont sans danger pendant la grossesse"],"r":"La marge thérapeutique-toxique est étroite","x":"Ototoxicité et néphrotoxicité, parfois très tardives ; à éviter pendant la grossesse."},{"id":"04-q-aminosides-distribution","t":"qcm","q":"Pourquoi les aminosides sont-ils oto- et néphrotoxiques ?","c":["Distribution extracellulaire avec fortes concentrations dans le rein et l'oreille interne","Métabolisme hépatique en dérivés toxiques","Chélation du calcium","Inhibition du CYP3A4"],"r":"Distribution extracellulaire avec fortes concentrations dans le rein et l'oreille interne","x":"Fortes concentrations dans le rein, l'endolymphe et la périlymphe → toxicité rénale et cochléaire."},{"id":"04-q-aminosides-voie","t":"vrai_faux","q":"Vrai ou faux : les aminosides sont bien absorbés par voie orale.","c":["Vrai","Faux"],"r":"Faux","x":"Polycations : absorption digestive < 1 % ; usage parentéral ou local."},{"id":"04-q-streptomycine","t":"qcm","q":"La streptomycine résulte de la condensation de :","c":["Streptidine, streptose et N-méthylglucosamine","Désosamine et cladinose","Deux aminoglucosides et un aminohydroxycyclohexane","Lysine et tétracycline"],"r":"Streptidine, streptose et N-méthylglucosamine","x":"Premier aminoside (1943, Waksman), Streptomyces griseus ; longtemps seul traitement efficace de la tuberculose."},{"id":"04-q-paromomycine","t":"qcm","q":"Quel aminoside est encore utilisé comme antiseptique intestinal (GABBRORAL®) ?","c":["Paromomycine","Néomycine","Tobramycine","Amikacine"],"r":"Paromomycine","x":"Néomycine et paromomycine sont très mal résorbées ; seul le sulfate de paromomycine est encore utilisé comme antiseptique intestinal."},{"id":"04-q-tobi","t":"qcm","q":"TOBI® (solution pour nébuliseur) contient :","c":["Tobramycine","Gentamicine","Néomycine","Azithromycine"],"r":"Tobramycine","x":"Tobramycine : OBRACIN® (i.m./i.v.), TOBI® (nébuliseur), TOBREX® et TOBRADEX® (ophtalmique)."},{"id":"04-q-clinda-rsa","t":"qcm","q":"Quelle est la différence structurale entre la lincomycine et la clindamycine ?","c":["Clindamycine : Cl à la place d'un OH (R = Cl)","Clindamycine : OCH3 en 6","Clindamycine : N(CH3)2 en 7","Aucune, ce sont des synonymes"],"r":"Clindamycine : Cl à la place d'un OH (R = Cl)","x":"La clindamycine est le dérivé hémisynthétique chloré de la lincomycine (LINCOCIN®), d'usage beaucoup plus répandu."},{"id":"04-q-confusion-dalacin","t":"qcm","q":"Piège : DALACIN C® et ZINDACLIN® contiennent tous deux…","c":["De la clindamycine","De l'érythromycine","De la doxycycline","De la lincomycine"],"r":"De la clindamycine","x":"Clindamycine systémique (DALACIN C®) et en usage externe contre l'acné (DALACIN®, ZINDACLIN®). Ne pas confondre avec ZINERYT® (érythromycine + acétate de zinc)."},{"id":"05-q05-01","t":"qcm","q":"Quelle est la DCI de RIFADINE® ?","c":["Rifampicine","Rifabutine","Rifaximine","Rifamycine SV"],"r":"Rifampicine","x":"RIFADINE® = rifampicine (hémisynthèse de la rifamycine SV)."},{"id":"05-q05-02","t":"qcm","q":"Quelle est la DCI de MYCOBUTIN® ?","c":["Rifabutine","Rifampicine","Rifaximine","Mupirocine"],"r":"Rifabutine","x":"MYCOBUTIN® = rifabutine (mycobactéries atypiques, M. avium)."},{"id":"05-q05-03","t":"qcm","q":"TARGAXAN® contient :","c":["Rifaximine","Teicoplanine","Linézolide","Rifabutine"],"r":"Rifaximine","x":"TARGAXAN® = rifaximine ; attention à ne pas confondre avec TARGOCID® (teicoplanine)."},{"id":"05-q05-04","t":"qcm","q":"TARGOCID® contient :","c":["Teicoplanine","Rifaximine","Vancomycine","Linézolide"],"r":"Teicoplanine","x":"TARGOCID® = teicoplanine, glycopeptide."},{"id":"05-q05-05","t":"qcm","q":"BACTROBAN® contient :","c":["Mupirocine","Bacitracine","Acide fusidique","Tyrothricine"],"r":"Mupirocine","x":"BACTROBAN® = mupirocine (acide pseudomonique)."},{"id":"05-q05-06","t":"qcm","q":"Quelle spécialité ne contient PAS de linézolide ?","c":["TARGOCID®","ZYVOXID®","LINEZOLID ACCORD®","LINEZOLID FRESENIUS KABI®"],"r":"TARGOCID®","x":"TARGOCID® est la teicoplanine."},{"id":"05-q05-07","t":"qcm","q":"Quelle caractéristique structurale de l'acide fusidique le cours souligne-t-il ?","c":["Un stéroïde de forme trans-syn-trans, contrairement aux stéroïdes hormonaux","Un macrocycle ansa comme les rifamycines","Un cycle β-lactame","Un glycopeptide tricyclique"],"r":"Un stéroïde de forme trans-syn-trans, contrairement aux stéroïdes hormonaux","x":"L'acide fusidique a une structur
