b","trametinib","idelalisib","temsirolimus","sunitinib","sorafenib","pazopanib","lenvatinib","olaparib","bortezomib","ixazomib","carfilzomib","trabectedine","temoporfine","tretinoine"],"q":["13-q01","13-q02","13-q08","13-q09","13-q10","13-q11","13-q12","13-q13","13-q14","13-q15","13-q16","13-q17","13-q20","13-q21","13-q22","13-q23","13-q24","13-q25","13-q26","13-q30"],"c":["13-suffixe-tinib","13-voie-orale-ipk","13-bcr-abl-philadelphie","13-resistance-imatinib","13-erbb","13-alk","13-voie-ras-raf-mek-erk","13-btk","13-cdk46","13-multikinases","13-parp","13-proteasome-cancer","13-comparaison-zomib","13-ecteinascidines","13-photochimiotherapie","13-retinoides"]},{"t":"Questions d'examen","s":"Ce que le prof a demandé en cours, parties 1 et 2","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre mélangé, comme le jour J","type":"boss"}],"cartes":[{"id":"p:antitumoraux:0","lab":"Question du prof · 18/09/2025","q":"Question courte : quels sont les alcaloïdes actifs sur les microtubules ?","r":"Alcaloïdes de la pervenche de Madagascar (vinblastine, vincristine, vindésine, vinorelbine : empêchent la polymérisation des microtubules), taxanes de l'if (paclitaxel, docétaxel : stabilisent les microtubules), et la colchicine (goutte)."},{"id":"p:antitumoraux:1","lab":"Question du prof · 18/09/2025","q":"Vrai ou faux : le paclitaxel a été isolé à partir de la pervenche de Madagascar.","r":"Faux. Le paclitaxel vient de l'if (Taxus brevifolia) ; la pervenche de Madagascar donne la vinblastine et la vincristine."},{"id":"p:antitumoraux:2","lab":"Question du prof · 06/11/2025","q":"Le mesna est-il un anticancéreux ? Pourquoi l'utilise-t-on ? Quelle est son indication ?","r":"Non. Le mesna (UROMITEXAN®) est un thiol uroprotecteur : éliminé dans l'urine, il neutralise l'acroléine libérée par le cyclophosphamide et l'ifosfamide, responsable de cystites hémorragiques. On l'associe à ces alkylants. (Aussi mucolytique : MISTABRON®.)"},{"id":"p:antitumoraux:3","lab":"Question du prof · 06/11/2025","q":"Le terme « antagoniste de l'acide folique » est-il exact ? Parlez-moi des antimétabolites.","r":"Pas exact au sens strict : les antimétabolites ne sont pas des antagonistes de récepteurs ; ce sont des analogues de métabolites (folates, purines, pyrimidines) qui inhibent les enzymes de synthèse des nucléotides ou sont incorporés dans l'ADN/ARN. Ex. : méthotrexate (DHFR), 5-FU (thymidylate synthase), mercaptopurine, cytarabine."},{"id":"p:antitumoraux:4","lab":"Question du prof · 06/11/2025","q":"Parlez-moi du méthotrexate : mécanisme, indications selon la dose, risque d'erreur de délivrance.","r":"Méthotrexate (LEDERTREXATE®, EMTREXATE®) : antifolique inhibiteur de la DHFR -> plus de THF -> plus de thymidine ni de purines. Hautes doses : antitumoral (avec « rescue » par l'acide folinique). Faibles doses, une fois par semaine : psoriasis, polyarthrite rhumatoïde. Même boîte de comprimés : une prise quotidienne au lieu d'hebdomadaire = intoxication grave (aplasie) ; des pharmaciens ont été condamnés ; boîtes désormais avec avertissement."},{"id":"p:antitumoraux:5","lab":"Question du prof · 13/11/2025","q":"Parlez-moi des inhibiteurs de l'aromatase : noms, noms commerciaux, structure, mécanisme, indication.","r":"Aromatase (CYP19) : transforme les androgènes (testostérone, androstènedione) en estrogènes. Inhibiteurs : non stéroïdiens triazolés létrozole (FEMARA®, à dessiner) et anastrozole (ARIMIDEX®) ; stéroïdien exémestane (AROMASIN®, inhibiteur irréversible). Indication : cancer du sein hormonodépendant chez la femme ménopausée."},{"id":"p:antitumoraux:6","lab":"Question du prof · 20/11/2025","q":"Parlez-moi de GLIVEC® / imatinib : mécanisme (BCR-ABL), indication globale.","r":"Imatinib (GLIVEC®, génériques) : inhibiteur de la tyrosine kinase BCR-ABL, protéine de fusion issue du chromosome de Philadelphie (translocation 9;22) -> leucémie myéloïde chronique. Voie orale. Résistances -> dasatinib, nilotinib, ponatinib. Pas de structure à dessiner."},{"id":"p:antitumoraux:7","lab":"Question du prof · 20/11/2025","q":"Parlez-moi des anticancéreux alkylants.","r":"Voir la question ouverte 1 : de l'ypérite aux moutardes azotées ; ion aziridinium qui alkyle le N7 de la guanine ; pontages de l'ADN ; moutardes (chlorambucil, melphalan), phosphoramides (cyclophosphamide ENDOXAN®, ifosfamide + mesna), nitrosourées, busulfan, triazènes, dérivés du platine (cisplatine)."},{"id":"p:antitumoraux:8","lab":"Question du prof · 20/11/2025","q":"Bévacizumab (AVASTIN®) : qu'est-ce que le VEGF, comment fonctionne un anti-VEGF ?","r":"VEGF = facteur de croissance de l'endothélium vasculaire, qui stimule l'angiogenèse dont la tumeur a besoin pour se développer. Le bévacizumab (AVASTIN®) est un anticorps monoclonal qui fixe le VEGF circulant -> anti-angiogénique (cancers colorectaux métastatiques notamment)."},{"id":"p:antitumoraux:9","lab":"Question du prof · 20/11/2025 · reformulée","q":"Parlez-moi des inhibiteurs du protéasome : qu'est-ce que le protéasome, pourquoi l'inhiber dans un cancer, quelles molécules ?","r":"Le protéasome (26S) dégrade les protéines marquées par l'ubiquitine (polyubiquitinylées). Parmi elles, p53, protéine suppresseur de tumeur : inhiber le protéasome maintient p53 et freine la prolifération anarchique. Bortézomib (VELCADE®) : dipeptide boré, liaison réversible, injectable, myélome multiple. Ixazomib (NINLARO®) : boré, pro-drogue orale. Carfilzomib (KYPROLIS®) : non boré, liaison irréversible, toxicité cardiaque (développé contre les résistances)."},{"id":"p:antitumoraux:10","lab":"Question du prof · 20/11/2025 · reformulée","q":"L'utilisation d'anticorps monoclonaux est-elle de l'immunothérapie ? Définissez l'immunothérapie et donnez-en les deux types.","r":"Non : un anticorps monoclonal est une nature chimique, pas un mécanisme. L'immunothérapie consiste à stimuler, désinhiber ou modifier les cellules immunitaires du patient pour qu'elles attaquent la tumeur. 1) Inhibiteurs de points de contrôle immunitaire : bloquent les régulateurs négatifs des lymphocytes T (CTLA-4 : ipilimumab, YERVOY® ; PD-1/PD-L1 : pembrolizumab, KEYTRUDA®). 2) Cellules CAR-T : lymphocytes T du patient prélevés, modifiés par un vecteur rétroviral pour exprimer un récepteur antigénique chimérique, réinjectés (thérapie génique, ATMP ; lymphomes, leucémies aiguës)."},{"id":"p:antitumoraux:11","lab":"Question du prof · 20/11/2025 · reformulée","q":"Pourquoi la trétinoïne (acide tout-trans-rétinoïque) est-elle utilisée en oncologie ?","r":"C'est le produit d'oxydation de la vitamine A (alcool -> acide). Elle induit la différenciation des cellules myéloïdes cancéreuses et inhibe leur prolifération : traitement efficace de la leucémie promyélocytaire aiguë, avec peu d'effets indésirables ; tératogène (comme la vitamine A à haute dose)."},{"id":"p:antitumoraux:12","lab":"Question du prof · 13/11/2025 · reformulée","q":"Pourquoi l'hydroxyurée est-elle utilisée dans la drépanocytose ?","r":"Inhibiteur de la ribonucléotide réductase (antimétabolite, HYDREA®) ; dans la drépanocytose (SIKLOS®) elle augmente l'hémoglobine fœtale et réduit les crises vaso-occlusives. Lien fait par le prof avec la malaria (le trait drépanocytaire protège en partie du paludisme)."},{"id":"e1:antitumoraux:0:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des agents alkylants. → Origine","r":"Ypérite (moutarde au soufre, gaz de combat 1914-1918) : leucopénie chez les soldats -> moutardes à l'azote."},{"id":"e1:antitumoraux:0:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des agents alkylants. → Mécanisme","r":"Formation d'un ion aziridinium (ou carbocation) qui alkyle de façon covalente le N7 de la guanine ; agents bifonctionnels -> pontages de l'ADN, blocage de la réplication. Non spécifique des cellules cancéreuses."},{"id":"e1:antitumoraux:0:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des agents alkylants. → Moutardes azotées","r":"Chlorambucil (LEUKERAN®), melphalan (ALKERAN®), estramustine (vectorisée par l'estradiol)."},{"id":"e1:antitumoraux:0:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des agents alkylants. → Phosphoramides","r":"Cyclophosphamide (ENDOXAN®), ifosfamide (HOLOXAN®) : pro-drogues activées par le foie ; libèrent l'acroléine toxique pour la vessie -> mesna (UROMITEXAN®)."},{"id":"e1:antitumoraux:0:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des agents alkylants. → Autres","r":"Busulfan (alkylsulfonate), nitrosourées lipophiles (carmustine : passent la barrière hémato-encéphalique), dacarbazine/témozolomide (TEMODAL®, méthylants)."},{"id":"e1:antitumoraux:0:5","lab":"Question ouverte · partie 1","q":"Parlez-moi des agents alkylants. → Dérivés du platine","r":"Cisplatine (cis-[Pt(NH3)2Cl2], découverte par sérendipité), carboplatine, oxaliplatine (ELOXATIN®) : pontages intra-brins de l'ADN."},{"id":"e1:antitumoraux:1:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimétabolites antitumoraux. → Principe","r":"Analogues de métabolites (folates, purines, pyrimidines) qui bloquent la synthèse des nucléotides ou sont incorporés dans l'ADN/ARN."},{"id":"e1:antitumoraux:1:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimétabolites antitumoraux. → Antifoliques","r":"Méthotrexate (LEDERTREXATE®, EMTREXATE®) : inhibiteur de la DHFR ; « rescue » par l'acide folinique ; faibles doses hebdomadaires en psoriasis et polyarthrite rhumatoïde. Raltitrexed, pemetrexed (ALIMTA®)."},{"id":"e1:antitumoraux:1:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimétabolites antitumoraux. → Analogues des purines","r":"Mercaptopurine (PURI-NETHOL®), tioguanine, fludarabine, cladribine."},{"id":"e1:antitumoraux:1:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimétabolites antitumoraux. → Analogues des pyrimidines","r":"5-fluorouracile (inhibe la thymidylate synthase), capécitabine (XELODA®, pro-drogue orale), cytarabine, gemcitabine."},{"id":"e1:antitumoraux:1:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimétabolites antitumoraux. → Autre","r":"Hydroxyurée (HYDREA®, SIKLOS® : inhibiteur de la ribonucléotide réductase ; drépanocytose)."},{"id":"e1:antitumoraux:2:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des thérapies ciblées et de l'immunothérapie anticancéreuses. → Principe","r":"Passer de cytotoxiques non sélectifs à des molécules qui visent une cible propre à la cellule tumorale ; voie orale pour les petites molécules (-tinib), injection pour les anticorps (-mab)."},{"id":"e1:antitumoraux:2:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des thérapies ciblées et de l'immunothérapie anticancéreuses. → Inhibiteurs de tyrosine kinase","r":"BCR-ABL (chromosome de Philadelphie, LMC) : imatinib (GLIVEC®), puis dasatinib, nilotinib, ponatinib pour les résistances. EGFR : erlotinib, géfitinib, afatinib ; HER2 + EGFR : lapatinib. ALK : crizotinib, alectinib, lorlatinib. BRAF : encorafénib, dabrafénib. BTK : ibrutinib (IMBRUVICA®)."},{"id":"e1:antitumoraux:2:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des thérapies ciblées et de l'immunothérapie anticancéreuses. → Anticorps monoclonaux","r":"Anti-CD20 rituximab (MABTHERA®), anti-VEGF bévacizumab (AVASTIN®), anti-HER2 trastuzumab (HERCEPTIN®), anti-EGFR cetuximab (ERBITUX®)."},{"id":"e1:antitumoraux:2:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des thérapies ciblées et de l'immunothérapie anticancéreuses. → Inhibiteurs du protéasome","r":"Bortézomib (VELCADE®), ixazomib, carfilzomib : maintien de p53, myélome multiple."},{"id":"e1:antitumoraux:2:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des thérapies ciblées et de l'immunothérapie anticancéreuses. → Immunothérapie","r":"Inhibiteurs de points de contrôle (ipilimumab anti-CTLA-4, pembrolizumab anti-PD-1) et cellules CAR-T (cellules autologues génétiquement modifiées)."},{"id":"e2:antitumoraux:0","lab":"QROC · partie 2","q":"Le mesna est-il un anticancéreux ?","r":"Non. C'est un thiol (2-mercaptoéthanesulfonate) éliminé dans l'urine, où il neutralise l'acroléine, métabolite toxique du cyclophosphamide et de l'ifosfamide responsable de cystites hémorragiques. On l'associe donc à ces alkylants (UROMITEXAN®)."},{"id":"e2:antitumoraux:1","lab":"QROC · partie 2","q":"Pourquoi le méthotrexate est-il une source d'erreurs de délivrance ?","r":"Même molécule et mêmes comprimés pour deux usages : antitumoral à hautes doses et immunomodulateur à faibles doses une fois par semaine (psoriasis, polyarthrite rhumatoïde). Une prise quotidienne au lieu d'hebdomadaire entraîne une toxicité grave (aplasie) ; les boîtes portent désormais un avertissement sur la posologie."},{"id":"e2:antitumoraux:2","lab":"QROC · partie 2","q":"Quels alcaloïdes agissent sur les microtubules ?","r":"Alcaloïdes de la pervenche de Madagascar (vinblastine, vincristine, vinorelbine : empêchent la polymérisation) et taxanes de l'if (paclitaxel, docétaxel : stabilisent les microtubules) ; on y rattache la colchicine. Même cible que la griséofulvine et le mébendazole."},{"id":"e2:antitumoraux:3","lab":"QROC · partie 2","q":"Le bortézomib et le carfilzomib ont-ils le même mode de liaison au protéasome ?","r":"Non. Le bortézomib (dipeptide boré) se lie de façon réversible grâce à l'atome de bore ; injectable. Le carfilzomib (tétrapeptide époxycétone, sans bore) se lie de façon irréversible ; développé contre les résistances, avec une toxicité cardiaque. L'ixazomib est boré comme le bortézomib mais est une pro-drogue orale."}]},{"id":"pesticides","t":"Pesticides","court":"Pesticides","img":"","sym":"bug","niveaux":[{"t":"Pesticides et pédiculicides","s":"Organochlorés, organophosphorés, pyréthrinoïdes, diméticone","type":"n","m":["dimeticone","ddt","lindane","parathion","malathion","pyrethrine-i","permethrine"],"q":["14-q-dimeticone-meca","14-q-dimeticone-struct","14-q-lindane-struct","14-q-organochlores-statut","14-q-op-mecanisme","14-q-op-antidote","14-q-zalvor"],"c":["14-pediculose-options-belgique","14-dimeticone-asphyxie","14-organochlores-interdits","14-organophosphores-ache","14-pyrethrines-vs-permethrine"]},{"t":"Questions d'examen","s":"Ce que le prof a demandé en cours, parties 1 et 2","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre mélangé, comme le jour J","type":"boss"}],"cartes":[{"id":"p:pesticides:0","lab":"Question du prof · 20/11/2025 · reformulée","q":"Comment agit la diméticone contre les poux et pourquoi est-elle si peu toxique ?","r":"Polymère de siloxanes (huile de silicone) qui forme un film asphyxiant : il bouche les stigmates respiratoires des poux et des lentes. Action purement physique, sans mécanisme pharmacologique, donc pas de résistance ; non absorbée (la diméticone est même utilisée par voie orale comme pansement gastrique)."},{"id":"p:pesticides:1","lab":"Question du prof · 20/11/2025 · reformulée","q":"Pourquoi le DDT, qui a sauvé des millions de vies, est-il aujourd'hui interdit ?","r":"Très lipophile et peu dégradable : demi-vie d'environ 15 ans dans l'environnement, bioaccumulation dans les graisses des animaux et de l'homme, dispersion (retrouvé dans les neiges de l'Antarctique), effets de perturbateur endocrinien et risques de cancers. Interdit en Belgique, comme le lindane."},{"id":"p:pesticides:2","lab":"Question du prof · 20/11/2025 · reformulée","q":"Quel est le mécanisme des organophosphorés, leurs symptômes d'intoxication et leur antidote ?","r":"Inhibition (phosphorylation covalente) de l'acétylcholinestérase -> accumulation d'acétylcholine -> hyperactivité parasympathique : hypersalivation, bronchoconstriction, bradycardie, myosis, nausées, vomissements, incontinence, convulsions, arrêt cardio-respiratoire. Antidote : pralidoxime (ammonium quaternaire qui réactive la cholinestérase) + atropine (anticholinergique)."},{"id":"p:pesticides:3","lab":"Question du prof · 20/11/2025 · reformulée","q":"Comment traite-t-on la gale ?","r":"Perméthrine (pyréthrinoïde) crème 5 % (ZALVOR®) en une application sur tout le corps ; ou ivermectine per os (voir anthelminthiques) ; traiter l'entourage et le linge."},{"id":"e1:pesticides:0:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des pesticides utilisés en pharmacie (pédiculose et gale). → Contexte","r":"Pédiculose (poux, rentrée scolaire) et gale (Sarcoptes scabiei, contagieuse) ; traiter l'entourage."},{"id":"e1:pesticides:0:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des pesticides utilisés en pharmacie (pédiculose et gale). → Organochlorés (historiques)","r":"DDT (dichlorodiphényltrichloroéthane) et lindane : neurotoxiques pour l'insecte, très efficaces (DDT et paludisme, Nobel 1948) mais lipophiles, rémanents, bioaccumulés, perturbateurs endocriniens : interdits."},{"id":"e1:pesticides:0:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des pesticides utilisés en pharmacie (pédiculose et gale). → Organophosphorés","r":"Parathion, malathion (et gaz de combat sarin, tabun, soman) : inhibiteurs de l'acétylcholinestérase ; intoxications (syndrome cholinergique) ; antidote pralidoxime + atropine ; usage limité."},{"id":"e1:pesticides:0:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des pesticides utilisés en pharmacie (pédiculose et gale). → Pyréthrines et pyréthrinoïdes","r":"Pyréthrines naturelles des fleurs de pyrèthre, peu toxiques ; perméthrine (ZALVOR® 5 %) contre la gale et pour les moustiquaires."},{"id":"e1:pesticides:0:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des pesticides utilisés en pharmacie (pédiculose et gale). → Diméticone","r":"Seul traitement enregistré contre les poux : siloxane asphyxiant, action physique, peu toxique, pas de résistance."},{"id":"e2:pesticides:0","lab":"QROC · partie 2","q":"Comment agit la diméticone contre les poux ?","r":"C'est une silicone qui enrobe le pou et obstrue ses orifices respiratoires : action physique (asphyxie), sans mécanisme pharmacologique, donc pas de résistance."},{"id":"e2:pesticides:1","lab":"QROC · partie 2","q":"Mécanisme des organophosphorés ?","r":"Ils phosphorylent de façon covalente la sérine du site actif de l'acétylcholinestérase -> accumulation d'acétylcholine, paralysie de l'insecte (toxiques aussi chez l'homme)."}]},{"id":"immunite","t":"Médicaments de l'immunité","court":"Immunité","img":"","sym":"shield","niveaux":[{"t":"Immunomodulateurs","s":"Interférons, SEP, S1P, ImIDs","type":"n","m":["peginterferon-alfa-2a","cladribine","interferon-beta-1a","interferon-beta-1b","fumarate-de-dimethyle","glatiramere","fingolimod","ozanimod","ponesimod","siponimod","teriflunomide","leflunomide","alemtuzumab","natalizumab","ocrelizumab","ofatumumab","lenalidomide","thalidomide","pomalidomide","apremilast"],"q":["14-q-pegasys","14-q-ifn-gamma","14-q-mavenclad","14-q-glatiramere","14-q-fingolimod-lympho","14-q-teriflunomide","14-q-ac-sep","14-q-lenalido-contra","14-q-imids-rsa","14-q-apremilast"],"c":["14-vaccins-hors-cours","14-interferons-types","14-ifn-indications","14-fumarate-mecanisme","14-glatiramere-mbp","14-s1p-modulateurs","14-imids-teratogenes","14-myelome-multiple","14-apremilast-pde4","14-immunosuppresseurs-risques","14-corticosteroides-immunosuppression"]},{"t":"Immunosuppresseurs","s":"Azathioprine, calcineurine, mTOR, IMPDH","type":"n","m":["azathioprine","ciclosporine","tacrolimus","pimecrolimus","everolimus","sirolimus","acide-mycophenolique","mycophenolate-mofetil","basiliximab"],"q":["14-q-fumarate-struct","14-q-azathioprine-origine","14-q-calcineurine","14-q-ciclosporine-origine","14-q-protopic","14-q-mofetil","14-q-basiliximab"],"c":["14-calcineurine","14-mtor","14-impdh-mofetil"]},{"t":"Questions d'examen","s":"Ce que le prof a demandé en cours, parties 1 et 2","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre mélangé, comme le jour J","type":"boss"}],"cartes":[{"id":"p:immunite:0","lab":"Question du prof · 20/11/2025","q":"Quel est le point commun du mécanisme des principaux immunosuppresseurs ?","r":"La voie de l'interleukine 2 (IL-2), cytokine clé de la différenciation et de la prolifération des lymphocytes T : la ciclosporine et le tacrolimus empêchent sa synthèse (inhibition de la calcineurine), les inhibiteurs de mTOR bloquent sa signalisation. La plupart sont d'origine naturelle (champignons, Streptomyces)."},{"id":"p:immunite:1","lab":"Question du prof · 20/11/2025 · reformulée","q":"Quelle différence entre un immunomodulateur et un immunosuppresseur ?","r":"L'immunomodulateur agit directement ou indirectement sur le système immunitaire pour réguler la réponse (infection, maladie auto-immune : interférons, fumarate de diméthyle, glatiramère, ImIDs, aprémilast). L'immunosuppresseur vise à bloquer la réponse immunitaire (prévention du rejet de greffe : ciclosporine, tacrolimus, mTOR, mycophénolate, azathioprine), avec un risque infectieux accru."},{"id":"p:immunite:2","lab":"Question du prof · 20/11/2025 · reformulée","q":"Qu'est-ce que la calcineurine et comment agissent la ciclosporine et le tacrolimus ?","r":"La calcineurine est une protéine phosphatase qui active des facteurs de transcription (NFAT) nécessaires à la synthèse de l'interleukine 2. Ciclosporine (NEORAL SANDIMMUN®) et tacrolimus (PROGRAFT®, ADVAGRAFT®, PROTOPIC® en crème) l'inhibent -> plus d'IL-2 -> plus d'activation ni de prolifération des lymphocytes T. Produits d'origine naturelle (champignon ; Streptomyces)."},{"id":"p:immunite:3","lab":"Question du prof · 20/11/2025 · reformulée","q":"Pourquoi la thalidomide est-elle revenue en thérapeutique ?","r":"Retirée pour son effet tératogène (phocomélie), on a compris que cet effet traduisait une action sur le développement des tissus : elle est immunomodulatrice et anti-angiogénique. Elle et ses dérivés (lénalidomide REVLIMID®, pomalidomide IMNOVID®) sont utilisés dans le myélome multiple, sous contraception stricte."},{"id":"p:immunite:4","lab":"Question du prof · 20/11/2025 · reformulée","q":"Pourquoi pégyle-t-on l'interféron et quelles sont les indications des interférons α et β ?","r":"La pégylation (PEG greffé) augmente la taille et la durée de vie (moins d'élimination rénale) : une injection par semaine. Peginterféron α-2a (PEGASYS®) : hépatites B et C chroniques. Interféron β (AVONEX®, BETAFERON®) : prévention des poussées de sclérose en plaques."},{"id":"e1:immunite:0:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des immunosuppresseurs. → Indications et risques","r":"Prévention du rejet de greffe, maladies auto-immunes ; risques d'infections et de cancers, interactions (CYP3A4)."},{"id":"e1:immunite:0:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des immunosuppresseurs. → Inhibiteurs de la calcineurine","r":"Ciclosporine (champignon) et tacrolimus : complexe avec une immunophiline -> inhibition de la calcineurine -> pas d'activation de NFAT -> pas de transcription de l'IL-2."},{"id":"e1:immunite:0:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des immunosuppresseurs. → Inhibiteurs de mTOR","r":"Sirolimus, évérolimus : bloquent la réponse des lymphocytes à l'IL-2 (prolifération)."},{"id":"e1:immunite:0:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des immunosuppresseurs. → Antimétabolites","r":"Acide mycophénolique / mycophénolate mofétil (ester pro-drogue) : inhibition de l'IMPDH -> synthèse des purines (guanine) dans les lymphocytes."},{"id":"e1:immunite:0:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des immunosuppresseurs. → Corticostéroïdes","r":"Immunosuppression large (inhibition de la transcription de cytokines)."},{"id":"e1:immunite:1:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des immunomodulateurs utilisés dans la sclérose en plaques et les maladies inflammatoires. → Interférons","r":"IFN-β (AVONEX®, REBIF®, BETAFERON®) : réduisent les poussées de SEP ; IFN-α pégylé (PEGASYS®) : hépatites."},{"id":"e1:immunite:1:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des immunomodulateurs utilisés dans la sclérose en plaques et les maladies inflammatoires. → Petites molécules SEP","r":"Fumarate de diméthyle (TECFIDERA®, oral, à dessiner), tériflunomide (AUBAGIO®), cladribine (MAVENCLAD®)."},{"id":"e1:immunite:1:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des immunomodulateurs utilisés dans la sclérose en plaques et les maladies inflammatoires. → Glatiramère","r":"COPAXONE® : polypeptide synthétique (Ala, Glu, Lys, Tyr) qui mime la protéine basique de la myéline -> moins de rechutes."},{"id":"e1:immunite:1:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des immunomodulateurs utilisés dans la sclérose en plaques et les maladies inflammatoires. → Modulateurs S1P","r":"Fingolimod (GILENYA), ozanimod, ponésimod, siponimod : retiennent les lymphocytes dans les ganglions ; origine fongique (myriocine)."},{"id":"e1:immunite:1:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des immunomodulateurs utilisés dans la sclérose en plaques et les maladies inflammatoires. → ImIDs et PDE4","r":"Thalidomide, lénalidomide (REVLIMID®), pomalidomide : myélome multiple, tératogènes. Aprémilast (OTEZLA®) : inhibiteur de PDE4, psoriasis."},{"id":"e2:immunite:0","lab":"QROC · partie 2","q":"Pourquoi pégyle-t-on les interférons ?","r":"La fixation de polyéthylène glycol augmente la taille de la protéine et diminue son élimination rénale et sa dégradation : durée d'action prolongée (une injection par semaine, PEGASYS®) et moins d'immunogénicité."},{"id":"e2:immunite:1","lab":"QROC · partie 2","q":"Pourquoi l'azathioprine provoque-t-elle une dépression médullaire ?","r":"C'est une pro-drogue de la mercaptopurine, antagoniste des bases puriques : elle freine la synthèse de l'ADN des cellules qui se divisent vite, surtout les leucocytes de la moelle -> effet antimitotique (comme les antitumoraux), d'où l'immunosuppression et le risque de leucopénie."}]}]};</script>

function pick(a,n){return mel(a).slice(0,n)}
