."}, {"id": "ch8_5-028", "t": "Usage", "q": "Usages de l'arnica ?", "a": "Usage **topique** anti-ecchymotique et anti-inflammatoire : contusions, ecchymoses, phlébites superficielles, foulures, inflammations musculaires. En homéopathie per os : dilutions uniquement, jamais la teinture mère."}, {"id": "ch8_5-029", "t": "Origine", "q": "Alantolactone : source, type et propriété ?", "a": "Racines d'**aunée** (*Inula helenium*) ; **eudesmanolide** ; antibactérienne (Gram +) et antifongique, entraînable à la vapeur."}, {"id": "ch8_5-030", "t": "Origine", "q": "De quelle plante est extraite l'artémisinine ?", "a": "**Armoise annuelle**, *Artemisia annua* (Qinghao, Astéracées), parties aériennes."}, {"id": "ch8_5-031", "t": "Structure", "q": "Quelles sont les particularités structurales de l'artémisinine ?", "a": "Lactone sesquiterpénique de type particulier : **δ-lactone (6 atomes)** en contact avec 2 cycles différents et un **endoperoxyde** (O–O)."}, {"id": "ch8_5-032", "t": "Usage", "q": "Activité de l'artémisinine et groupement responsable ?", "a": "**Antimalarique puissant** ; activité liée à la **structure peroxydique** (endoperoxyde)."}, {"id": "ch8_5-033", "t": "Pourquoi ?", "q": "Pourquoi a-t-on développé l'artéméther et l'artésunate ?", "a": "L'artémisinine est **peu soluble dans l'eau et les huiles**. Après réduction en dihydroartémisinine : **éthers** (artéméther, artééther) plus solubles dans les huiles (IM) ; **ester** hémisuccinate sodique (artésunate) hydrosoluble (IM/IV)."}, {"id": "ch8_5-034", "t": "Structure", "q": "Bilobalide : caractéristiques structurales et source ?", "a": "Sesquiterpène lactonique tétracyclique : **1 tertiobutyle**, **3 cycles lactoniques** ; feuilles de *Ginkgo biloba*."}, {"id": "ch8_5-035", "t": "Toxicité", "q": "Anisatine : source, structure particulière et mode d'action ?", "a": "Fruits du **badianier du Japon / shikimi** (*Illicium anisatum*) ; 2 lactones dont une **β-lactone** (rare) ; **antagoniste du GABA** → convulsions, myosis, dyspnée, apnée, coma, mort."}, {"id": "ch8_5-036", "t": "Comparaison", "q": "Badiane de Chine vs badiane du Japon ?", "a": "**Badiane de Chine** (*Illicium verum*) : épice/digestif. **Badiane du Japon / shikimi** (*I. anisatum*) : contient l'**anisatine** très toxique ; fruits plus petits, irréguliers, à extrémités recourbées ; falsification à l'origine d'accidents."}, {"id": "ch8_5-037", "t": "Toxicité", "q": "Picrotoxinine : source et propriétés ?", "a": "Baies d'*Anamirta cocculus* (coques du Levant) ; C15 très toxique (2 γ-lactones + époxy) ; poison de pêche ; excitant médullaire et bulbaire ; réactif de neuropharmacologie."}, {"id": "ch8_5-038", "t": "Classe", "q": "Classez : parthénolide, cynaropicrine, matricine, hélénaline, alantolactone.", "a": "Germacranolide : **parthénolide** ; guaianolides : **cynaropicrine, matricine** ; pseudoguaianolide : **hélénaline** ; eudesmanolide : **alantolactone**."}, {"id": "ch8_5-039", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Artémisinine** — δ-lactone + endoperoxyde (Artemisia annua, antimalarique)."}, {"id": "ch8_5-040", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Hélénaline** — pseudoguaianolide de l'arnica (cyclopenténone + α-méthylène-γ-lactone)."}, {"id": "ch8_5-041", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Matricine** — guaianolide de la matricaire, précurseur du chamazulène."}, {"id": "ch8_6-001", "t": "Définition", "q": "Combien de carbones ont les diterpènes et quel est leur précurseur ?", "a": "**20 C** ; précurseur **GGPP** (géranylgéranyl-pyrophosphate), formé par couplage « tête à queue » IPP + FPP."}, {"id": "ch8_6-002", "t": "Définition", "q": "Existe-t-il une propriété commune à tous les diterpènes ?", "a": "Non : structures très différentes (nombre de cycles variable), **activités très diversifiées** ; beaucoup de plantes toxiques en contiennent (Euphorbiacées, Thyméléacées)."}, {"id": "ch8_6-003", "t": "Classe", "q": "Classez selon leur nombre de cycles : acide abiétique, rosmanol, stévioside, salvinorine A, ginkgolides, taxol.", "a": "Tricyclique : **acide abiétique** ; tétracycliques : **rosmanol, stévioside, salvinorine A** ; hexacyclique : **ginkgolides** ; noyau **taxane** tricyclique : **taxol**."}, {"id": "ch8_6-004", "t": "Origine", "q": "L'acide abiétique est un constituant de quelle matière première ?", "a": "De la **colophane**, partie résineuse de la **térébenthine** (pins)."}, {"id": "ch8_6-005", "t": "Usage", "q": "Quels sont les débouchés de la colophane ?", "a": "Sous formes **chimiquement modifiées** (sels, esters, formes hydrogénées, polymérisées) : propriétés de **collant** et d'**hydrophobicité** → industries diverses, **sparadraps**."}, {"id": "ch8_6-006", "t": "Structure", "q": "Acide abiétique : type de diterpène et fonction ?", "a": "Diterpène **tricyclique** porteur d'un **acide carboxylique** (et d'un diène conjugué, isopropyle)."}, {"id": "ch8_6-007", "t": "Origine", "q": "D'où provient le rosmanol et quelle est son activité ?", "a": "Des feuilles de **romarin** (*Rosmarinus officinalis*) ; **antioxydant** puissant (O-diphénol diterpénique)."}, {"id": "ch8_6-008", "t": "Pourquoi ?", "q": "À quoi est due l'activité antioxydante des extraits de romarin ?", "a": "En partie à l'**acide rosmarinique** (acide phénol), mais surtout aux **O-diphénols diterpéniques** (**carnosol, rosmanol**), plus efficaces que les antioxydants synthétiques ; action synergique."}, {"id": "ch8_6-009", "t": "Origine", "q": "Nom latin et famille de la stévia ?", "a": "*Stevia rebaudiana* (Astéracées), « herbe sucrée du Paraguay »."}, {"id": "ch8_6-010", "t": "Usage", "q": "Quel est le statut réglementaire des glycosides de stéviol et de la plante dans l'UE ?", "a": "Depuis 2011, les **glycosides de stéviol purifiés** sont autorisés comme édulcorants (**E960**) ; la plante et ses feuilles séchées ne sont **pas** autorisées comme denrée."}, {"id": "ch8_6-011", "t": "Comparaison", "q": "Stévioside vs rébaudioside A : pouvoir sucrant ?", "a": "Stévioside : **150 à 300 ×** le saccharose ; rébaudioside A : **250 à 450 ×**."}, {"id": "ch8_6-012", "t": "Structure", "q": "Quels types de liaisons relient les oses au stéviol dans le stévioside ?", "a": "Une liaison **éther** (oses sur l'OH en C13 : sophorose) et une liaison **ester** (glucose sur le COOH en C19)."}, {"id": "ch8_6-013", "t": "Classe", "q": "À quelle classe appartiennent les glycosides de stéviol ?", "a": "**Hétérosides diterpéniques tétracycliques** (génine : stéviol)."}, {"id": "ch8_6-014", "t": "Origine", "q": "Qu'est-ce que le rubusoside ?", "a": "Hétéroside diterpénique très proche du stévioside (présent aussi dans Stevia), des feuilles de *Rubus suavissimus* ; 100–120 × plus sucré que le saccharose (« sweet tea »)."}, {"id": "ch8_6-015", "t": "Origine", "q": "Salvinorine A : plante source ?", "a": "**Sauge des devins**, *Salvia divinorum* (Mexique)."}, {"id": "ch8_6-016", "t": "Usage", "q": "Mécanisme et particularité pharmacologique de la salvinorine A ?", "a": "**Agoniste sélectif des récepteurs opioïdes κ (KOR)** ; premier composé agissant sur ces récepteurs qui **ne soit pas un alcaloïde** ; plus puissant hallucinogène naturel."}, {"id": "ch8_6-017", "t": "Structure", "q": "Salvinorine A : éléments structuraux à repérer ?", "a": "Diterpène **tétracyclique**, beaucoup d'oxygène dont une **lactone** et un **noyau furane** ; pas d'azote."}, {"id": "ch8_6-018", "t": "Usage", "q": "Comment la salvinorine A est-elle consommée et quels sont ses effets ?", "a": "Feuilles **mâchées** (absorption perlinguale) ou **fumées** → effets hallucinogènes rapides et de courte durée (≈ 200 µg suffisent)."}, {"id": "ch8_6-019", "t": "Structure", "q": "Ginkgolides : caractéristiques structurales ?", "a": "Diterpènes lactoniques complexes : structure **hexacyclique**, **1 groupe tertiobutyle**, **3 cycles lactoniques**."}, {"id": "ch8_6-020", "t": "Usage", "q": "Quelle est la cible du ginkgolide B ?", "a": "Il **inhibe le PAF** (platelet activating factor) : agrégation plaquettaire, thromboformation, inflammation."}, {"id": "ch8_6-021", "t": "Usage", "q": "Indications des extraits de ginkgo ?", "a": "Troubles **circulatoires** ; troubles cognitifs liés à la sénescence (mémoire, attention, vertiges, acouphènes) ; **démences modérées** (Alzheimer…)."}, {"id": "ch8_6-022", "t": "Comparaison", "q": "Bilobalide vs ginkgolides ?", "a": "Tous deux des feuilles de ginkgo avec tertiobutyle et 3 lactones, mais le **bilobalide** est un **sesquiterpène (C15)** et les **ginkgolides** des **diterpènes (C20)** hexacycliques."}, {"id": "ch8_6-023", "t": "Toxicité", "q": "Pourquoi l'if à baies (Taxus baccata) est-il toxique ?", "a": "Toutes ses parties (sauf l'**arille**) contiennent des **taxines** : **alcaloïdes diterpéniques (pseudo-alcaloïdes)**, noyau taxane estérifié par l'acide 3-diméthylamino-3-phénylpropionique."}, {"id": "ch8_6-024", "t": "Origine", "q": "Comment a été découvert le taxol et de quelle plante ?", "a": "Screening du **NCI** sur des extraits d'**écorce** de **Taxus brevifolia** (if du Pacifique)."}, {"id": "ch8_6-025", "t": "Structure", "q": "Taxol : noyau de base et fonction azotée ?", "a": "Noyau **taxane** (diterpène **tricyclique**) ; diterpène azoté à fonction **amide**."}, {"id": "ch8_6-026", "t": "Usage", "q": "Usage du taxol ?", "a": "**Anticancéreux** (vu au semestre 2) ; le docétaxel partage le même noyau."}, {"id": "ch8_6-027", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Stévioside** — stéviol + sophorose (éther, C13) + glucose (ester, C19)."}, {"id": "ch8_6-028", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Salvinorine A** — diterpène tétracyclique à lactone et furane (agoniste κ)."}, {"id": "ch8_6-029", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Acide abiétique** — diterpène tricyclique acide de la colophane."}, {"id": "ch8_7-001", "t": "Définition", "q": "Comment se forme le squalène ?", "a": "Couplage **« queue à queue »** de **deux FPP** (C15) avec réduction → squalène **C30** ; il n'y a plus de pyrophosphate."}, {"id": "ch8_7-002", "t": "Origine", "q": "Où trouve-t-on le squalène ?", "a": "Abondant dans l'**huile de foie de requin** ; en faible quantité dans l'**insaponifiable de l'huile d'olive** ; constituant du **sébum** ; intermédiaire de la biosynthèse du cholestérol."}, {"id": "ch8_7-003", "t": "Usage", "q": "Citez des usages du squalène.", "a": "Bactéricide et **immunostimulant (adjuvant de vaccin)** ; intermédiaire d'excipients (**squalane**) ; caoutchouc synthétique ; **squalénisation** de médicaments (nanoparticules, ex. gemcitabine)."}, {"id": "ch8_7-004", "t": "Pourquoi ?", "q": "Pourquoi squalénise-t-on la gemcitabine ?", "a": "La gemcitabine est inactivée par **désamination**. En greffant l'acide squalénique sur cette fonction, on la protège ; les conjugués s'auto-organisent en **nanoparticules** → circulation plus longue, **doses 5 × plus faibles**, moins de résistance."}, {"id": "ch8_7-005", "t": "Définition", "q": "Quel intermédiaire du squalène détermine le type de cyclisation ?", "a": "Le **2,3-époxysqualène** ; sa conformation sur l'enzyme de cyclisation décide triterpène ou stéroïde."}, {"id": "ch8_7-006", "t": "Comparaison", "q": "Conformations du 2,3-époxysqualène : quels produits ?", "a": "**Chaise/chaise/chaise/bateau** → **dammarane** → triterpènes (30 C). **Chaise/bateau/chaise/bateau** → **lanostérol** → déméthylation → **stéroïdes (27 C)**."}, {"id": "ch8_7-007", "t": "Classe", "q": "Quels sont les 3 grands groupes de triterpènes/stéroïdes cyclisés ?", "a": "**Triterpènes tétracycliques**, **triterpènes pentacycliques**, **stéroïdes**."}, {"id": "ch8_7-008", "t": "Structure", "q": "Triterpène tétracyclique de type dammarane : caractéristiques ?", "a": "4 cycles d'aspect stéroïdien, **30 C** ; **CH3 en C8** (et non en C13 comme les stéroïdes) ; précurseur de toutes les génines triterpéniques ; rare ; hétérosides du **ginseng**."}, {"id": "ch8_7-009", "t": "Comparaison", "q": "Dammarane vs stéroïdes : différence de précurseur et de structure ?", "a": "Dammarane (triterpène) issu de la conformation CCCB ; stéroïdes issus du **lanostérol** (CBCB). Différence de stéréochimie : **CH3 en 8** (dammarane) vs **CH3 en 13** (stéroïdes)."}, {"id": "ch8_7-010", "t": "Comparaison", "q": "Oléanane, ursane, lupane : différences ?", "a": "**Oléanane** (β-amyrine) : 5e cycle à 6, **2 CH3 sur C20** (> 50 % des cas). **Ursane** (α-amyrine) : 5e cycle à 6, **CH3 sur C19 et C20**. **Lupane** : 5e cycle **à 5**, **isopropyle sur C19** (peu fréquent)."}, {"id": "ch8_7-011", "t": "Structure", "q": "Éléments structuraux communs aux triterpènes pentacycliques ?", "a": "**Toujours un OH en C3**, habituellement une **d.l. C12-C13** ; oxydation fréquente des méthyles C23, C28, C30 (alcool, aldéhyde, COOH) ; parfois carbones cycliques oxydés."}, {"id": "ch8_7-012", "t": "Structure", "q": "Acide oléanolique vs hédéragénine ?", "a": "Acide oléanolique : oléanane avec **C28 = COOH** ; hédéragénine : **C28 = COOH + C23 = CH2OH**."}, {"id": "ch8_7-013", "t": "Origine", "q": "Que contient la résine d'encens indien comme triterpènes ?", "a": "Des acides triterpéniques pentacycliques **libres** (génines) de type **ursane** : **acide boswellique**, acide 11-céto-β-boswellique, acide acétyl-11-céto-β-boswellique."}, {"id": "ch8_7-014", "t": "Comparaison", "q": "Les acides boswelliques sont-ils des saponosides ?", "a": "**Non** : ce sont des **génines libres** (pas d'oses) — attention piège du cours."}, {"id": "ch8_7-015", "t": "Définition", "q": "Combien de C ont les génines stéroïdiques et quel squelette est le plus intéressant ?", "a": "**27 C** ; squelette **hexacyclique spirostane**."}, {"id": "ch8_7-016", "t": "Structure", "q": "Qu'est-ce qu'un squelette spirostane ?", "a": "6 cycles dont un cycle **furanique** et un cycle **pyranique**, avec un **carbone spiro en C22** (2 cycles reliés par un seul atome)."}, {"id": "ch8_7-017", "t": "Structure", "q": "Que se passe-t-il si l'OH en C26 d'une génine stéroïdique est engagé dans une liaison osidique ?", "a": "La structure est **pentacyclique** (et non hexacyclique) ; elle n'existe qu'à l'état d'hétérosides et l'hydrolyse redonne spontanément un **spirostane**."}, {"id": "ch8_7-018", "t": "Structure", "q": "Variations structurales des génines stéroïdiques ?", "a": "Limitées : **toujours OH en C3**, **d.l. C5-C6** présente ou non, parfois OH en C1, C2, C5, C6 ; seule la configuration de **C25** varie."}, {"id": "ch8_7-019", "t": "Usage", "q": "À quoi servent industriellement diosgénine et hécogénine ?", "a": "**Hémisynthèse d'hormones stéroïdiennes** : contraceptifs, anabolisants, anti-inflammatoires (diosgénine → progestérone ; 1er contraceptif oral dans les années 60)."}, {"id": "ch8_7-020", "t": "Origine", "q": "Sources de la diosgénine et de l'hécogénine ?", "a": "Diosgénine : **Dioscorées** dont l'**igname** (tubercules) ; hécogénine : **agaves**."}, {"id": "ch8_7-021", "t": "Méthode", "q": "Décrivez l'extraction de la diosgénine.", "a": "Diosgénine sous forme d'**hétérosides** (triosides) → **hydrolyse acide** ; filtration ; fraction insoluble (génines) neutralisée, lavée puis extraite à l'**éther de pétrole**."}, {"id": "ch8_7-022", "t": "Toxicité", "q": "Igname : précaution ?", "a": "Tubercule alimentaire tropical, mais **toxique cru**."}, {"id": "ch8_7-023", "t": "Usage", "q": "Les préparations de Dioscorea villosa (wild yam) sont-elles des « hormones naturelles » ?", "a": "**Non** : aucune preuve que l'homme possède les enzymes pour transformer la diosgénine en hormones sexuelles, ni d'efficacité sur la ménopause."}, {"id": "ch8_7-024", "t": "Définition", "q": "Définissez les saponosides.", "a": "**Hétérosides de PM élevé** dont la génine (sapogénine) est **stéroïdique** (surtout monocotylédones) ou **triterpénique** (surtout dicotylédones) ; caractérisés par leurs propriétés **tensioactives** et leur **pouvoir moussant**."}, {"id": "ch8_7-025", "t": "Toxicité", "q": "Quelles propriétés toxiques présentent la plupart des saponosides ?", "a": "**Hémolytiques** et **très toxiques pour les animaux à sang froid** (poissons)."}, {"id": "ch8_7-026", "t": "Pourquoi ?", "q": "Rôle des saponosides pour la plante ?", "a": "**Protection** contre les insectes et les maladies (bactéries, champignons)."}, {"id": "ch8_7-027", "t": "Structure", "q": "Pourquoi les saponosides sont-ils tensioactifs ?", "a": "Structure **amphiphile** : partie sucrée **hydrophile** + génine **lipophile**."}, {"id": "ch8_7-028", "t": "Structure", "q": "Quels oses trouve-t-on dans les saponosides ?", "a": "Oses banals (glucose, galactose, rhamnose, arabinose…), souvent avec l'**acide glucuronique ou galacturonique** ; parfois acylés ; souvent 3 à 5 oses (jusqu'à 11)."}, {"id": "ch8_7-029", "t": "Comparaison", "q": "Monodesmoside vs bidesmoside ?", "a": "**Monodesmoside** : un seul chaînon osidique, en général sur l'**OH en 3** (éther). **Bidesmoside** : un 2e chaînon sur un **autre OH** (éther) ou parfois sur un **COOH** de la génine (**ester**)."}, {"id": "ch8_7-030", "t": "Méthode", "q": "Qu'est-ce que l'indice de mousse ?", "a": "Degré de **dilution** d'un décocté aqueux de drogue qui, dans des conditions déterminées, donne une **mousse persistante** (Pharmacopée française) ; caractérise les drogues à saponosides."}, {"id": "ch8_7-031", "t": "Pourquoi ?", "q": "D'où viennent les activités biologiques des saponosides ?", "a": "De leur **caractère amphiphile** et de leur **interaction avec les stérols membranaires**."}, {"id": "ch8_7-032", "t": "Toxicité", "q": "Dans quelles conditions les saponosides sont-ils hémolytiques ? Effet intestinal ?", "a": "Hémolyse **seulement par contact direct avec le sang** (pas lors d'ingestion) ; dans l'intestin, ils **augmentent la perméabilité** aux grosses molécules (intéressant et dangereux)."}, {"id": "ch8_7-033", "t": "Usage", "q": "Citez les grandes catégories d'emploi des drogues à saponosides avec un exemple.", "a": "**Anti-inflammatoires** (réglisse, souci, marron d'Inde), **cicatrisants** (hydrocotyle, souci), **veinotoniques** (marron d'Inde, petit houx), **expectorants** (réglisse, polygala, lierre, primevère), diurétiques ; **ginseng** adaptogène."}, {"id": "ch8_7-034", "t": "Origine", "q": "Saponaire et bois de Panama : intérêt ?", "a": "Plantes à saponines (*Saponaria officinalis*, *Quillaja saponaria*) utilisées autrefois pour **se laver et laver le linge** ; extraits de bois de Panama encore dans des shampoings."}, {"id": "ch8_7-035", "t": "Origine", "q": "Réglisse : nom latin, partie utilisée, constituant principal ?", "a": "*Glycyrrhiza glabra* ; **racines et stolons** séchés ; **acide glycyrrhizique (glycyrrhizine)** + flavonoïdes."}, {"id": "ch8_7-036", "t": "Structure", "q": "Décrivez la structure de la glycyrrhizine.", "a": "Saponoside **triterpénique C30 pentacyclique, type oléanane** ; d.l. C12-C13 ; **cétone en C11** ; **COOH en C30** ; **monodesmoside** : chaînon de **2 acides glucuroniques** sur l'OH en 3."}, {"id": "ch8_7-037", "t": "Définition", "q": "Comment s'appelle la génine de la glycyrrhizine ?", "a": "**Acide glycyrrhétique = énoxolone**, obtenue par hydrolyse."}, {"id": "ch8_7-038", "t": "Méthode", "q": "Pourquoi la glycyrrhizine est-elle facilement détectée en CLHP-UV ?", "a": "Sa **cétone en C11 conjuguée à la d.l. C12-C13** absorbe à **254 nm**."}, {"id": "ch8_7-039", "t": "Usage", "q": "Usages de la réglisse ?", "a": "Respiratoire : **expectorant**, spasmolytique, anti-inflammatoire ; digestif : spasmolytique, **anti-ulcère gastrique**, anti-inflammatoire ; **édulcorant** des tisanes (laxatives) ; énoxolone en usage externe (brûlures, dermatites, érythèmes)."}, {"id": "ch8_7-040", "t": "Toxicité", "q": "Quels risques présente un usage prolongé de réglisse ?", "a": "**Intoxication de type cortisonique** (potentialisation de l'aldostérone) : **œdèmes, hypertension** ; ne pas dépasser 4 à 6 semaines sans avis médical ; intoxications par abus de confiseries/boissons."}, {"id": "ch8_7-041", "t": "Origine", "q": "Marronnier d'Inde : nom latin, origine, partie utilisée ?", "a": "*Aesculus hippocastanum* ; originaire des **Balkans/Turquie** (pas d'Inde) ; **graines** brun acajou."}, {"id": "ch8_7-042", "t": "Structure", "q": "Décrivez l'aescine.", "a": "**Mélange** d'hétérosides proches ; saponoside **triterpénique pentacyclique type oléanane**, d.l. C12-C13, CH2OH en C28 et C24, OH en 3, 16, 21, 22 (21-22 **estérifiés** par de petits acides) ; **monodesmoside** (trisaccharide Glc–ac. glucuronique–ose sur OH-3)."}, {"id": "ch8_7-043", "t": "Usage", "q": "Activités et indications de l'aescine ?", "a": "**Vasoconstrictrice** (retour veineux), **anti-inflammatoire**, **anti-œdémateuse** → **insuffisance veineuse**, **hémorroïdes**, œdèmes des varices et phlébites."}, {"id": "ch8_7-044", "t": "Toxicité", "q": "Marron d'Inde vs châtaigne ?", "a": "Le **marron** (graine du marronnier, âcre et amère) **n'est pas comestible** ; la châtaigne (*Castanea*) l'est."}, {"id": "ch8_7-045", "t": "Origine", "q": "Ginseng : nom latin, partie utilisée, contrôle Ph. Eur. ?", "a": "*Panax ginseng* ; **racine** séchée ; teneur minimale en **ginsénosides Rg1 + Rb1** (HPLC)."}, {"id": "ch8_7-046", "t": "Structure", "q": "Décrivez le ginsénoside Rb1.", "a": "Saponoside **triterpénique C30 tétracyclique type dammarane** ; d.l. C24-C25 ; OH en C3, C12, C20 ; **bidesmoside** : 2 chaînons bisaccharidiques sur les OH en **3 et 20**."}, {"id": "ch8_7-047", "t": "Usage", "q": "Que signifie « adaptogène » (ginseng) ?", "a": "Capable de **stimuler la résistance non spécifique** de l'organisme (fatigue, stress) ; ginseng utilisé comme tonique, convalescence, manque d'énergie."}, {"id": "ch8_7-048", "t": "Comparaison", "q": "Classez réglisse, marronnier, ginseng : génine et type desmoside.", "a": "**Réglisse** : oléanane, monodesmoside (2 GlcA) ; **marronnier** (aescine) : oléanane, monodesmoside ; **ginseng** (Rb1) : dammarane tétracyclique, **bidesmoside**."}, {"id": "ch8_7-049", "t": "Définition", "q": "Phytostérols : définition et localisation.", "a": "Stérols **spécifiques des végétaux** (le cholestérol étant animal) ; dans la **fraction lipidique** (insaponifiable des huiles) ; les plus fréquents : sitostérol, stigmastérol, campestérol."}, {"id": "ch8_7-050", "t": "Structure", "q": "En quoi les phytostérols diffèrent-ils du cholestérol ?", "a": "Même squelette (C27) mais la **chaîne latérale** porte **1 ou 2 C supplémentaires** (méthyle ou éthyle en C24) ; peuvent être insaturés."}, {"id": "ch8_7-051", "t": "Structure", "q": "Sitostérol vs stigmastérol ?", "a": "**Sitostérol** : cholestérol + **éthyle en C24** ; **stigmastérol** : sitostérol + **d.l. C22-C23**."}, {"id": "ch8_7-052", "t": "Origine", "q": "Sources commerciales du sitostérol et du stigmastérol ?", "a": "Sitostérol : insaponifiable des huiles de **soja, maïs, coton** ; stigmastérol : insaponifiable de l'**huile de soja** (nom lié à la fève de Calabar, *Physostigma venenosum*)."}, {"id": "ch8_7-053", "t": "Usage", "q": "Usages industriels du sitostérol et du stigmastérol ?", "a": "Sitostérol : hormones sexuelles, 19-nor-stéroïdes, spironolactone (dégradation microbiologique) ; stigmastérol : hémisynthèse de la **progestérone** (rendement 60 %)."}, {"id": "ch8_7-054", "t": "Usage", "q": "Où retrouve-t-on le sitostérol en phytothérapie ?", "a": "Dans des plantes de l'**hyperplasie bénigne de la prostate** : sabal, ortie, prunier d'Afrique."}, {"id": "ch8_7-055", "t": "Pourquoi ?", "q": "Comment les phytostérols agissent-ils sur la cholestérolémie ?", "a": "Structure proche du cholestérol → ils **occupent ses sites d'absorption intestinale** → **LDL ↓** sans modifier le HDL."}, {"id": "ch8_7-056", "t": "Définition", "q": "Phytostanols : origine et statut ?", "a": "Obtenus par **hydrogénation** des phytostérols (ex. sitostanol) ; présents dans aliments enrichis/compléments ; données bénéfices/risques à long terme **insuffisantes** → régime méditerranéen préférable."}, {"id": "ch8_7-057", "t": "Usage", "q": "Quel est le lien entre la levure de riz rouge et les statines ?", "a": "*Monascus ruber* cultivé sur riz produit des **monacolines**, dont la **monacoline K** = statine (= lovastatine) qui inhibe l'**HMG-CoA réductase** (synthèse du mévalonate et du cholestérol)."}, {"id": "ch8_7-058", "t": "Définition", "q": "Définissez les acides biliaires.", "a": "**Stéroïdes acides** formés dans le **foie** à partir du **cholestérol** (perte d'une unité tricarbonée de la chaîne latérale + hydroxylations), ex. acide cholique."}, {"id": "ch8_7-059", "t": "Définition", "q": "Qu'est-ce qu'un sel biliaire ?", "a": "Amide de l'acide biliaire avec la **glycine** ou la **taurine**, sous forme de sel sodique."}, {"id": "ch8_7-060", "t": "Pourquoi ?", "q": "Rôle physiologique des sels biliaires ?", "a": "**Émulsifier les graisses** (détergents : squelette peu polaire + chaîne polaire) et principale voie d'**élimination du cholestérol** (défaut → athérosclérose, lithiase)."}, {"id": "ch8_7-061", "t": "Usage", "q": "Acide ursodésoxycholique : structure clé et usages ?", "a": "Pas d'OH en 12, **OH en 7β** ; **dissolution des calculs cholestéroliques** (diminue le cholestérol biliaire), **cirrhose biliaire primitive**."}, {"id": "ch8_7-062", "t": "Origine", "q": "Comment obtient-on les acides biliaires pharmaceutiques ?", "a": "Purification de **bile fraîche** de volaille ou de **bœuf** (certificats sanitaires contre l'**ESB**)."}, {"id": "ch8_7-063", "t": "Structure", "q": "Cardénolide vs bufadiénolide (hétérosides cardiotoniques) ?", "a": "**Cardénolide** : génine stéroïdique + **γ-lactone mono-insaturée** (5 atomes) ; **bufadiénolide** : **δ-lactone di-insaturée** (6 atomes). Oses : désoxyoses sur l'OH en 3β. (détaillés au Q2)"}, {"id": "ch8_7-064", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Glycyrrhizine** — oléanane 11-céto + 2 acides glucuroniques sur OH-3 (réglisse)."}, {"id": "ch8_7-065", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Diosgénine** — génine stéroïdique spirostane (igname)."}, {"id": "ch8_7-066", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Ginsénoside Rb1** — dammarane bidesmoside (ginseng)."}, {"id": "ch8_7-067", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Squalène** — triterpène acyclique C30, précurseur des triterpènes et stéroïdes."}, {"id": "ch8_7-068", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Acide oléanolique** — triterpène pentacyclique oléanane, C28 = COOH."}, {"id": "ch8_8-001", "t": "Définition", "q": "Comment se forment les caroténoïdes ?", "a": "Duplication **« queue à queue »** de **deux GGPP (C20)** → tétraterpènes **C40** (8 unités isopréniques), puis **désaturation progressive**."}, {"id": "ch8_8-002", "t": "Pourquoi ?", "q": "Pourquoi les caroténoïdes sont-ils colorés ?", "a": "Système d'environ **10 d.l. conjuguées** qui absorbe la lumière visible → jaune, orange, rouge ; il faut **> 5 d.l. conjuguées** pour être coloré (3 = incolore)."}, {"id": "ch8_8-003", "t": "Pourquoi ?", "q": "Pourquoi les caroténoïdes sont-ils sensibles à l'oxydation ?", "a": "Leur système de **diènes conjugués** riche en électrons réagit facilement avec l'oxygène et les radicaux (ce qui en fait aussi des **piégeurs de radicaux libres**)."}, {"id": "ch8_8-004", "t": "Comparaison", "q": "Carotènes vs xanthophylles ?", "a": "**Carotènes** = **hydrocarbures** (lycopène, β-carotène) ; **xanthophylles** = même squelette **+ oxygène** (OH, C=O : lutéine, zéaxanthine, capsanthine…)."}, {"id": "ch8_8-005", "t": "Structure", "q": "Quelles structures cycliques peut-on trouver aux extrémités des caroténoïdes ?", "a": "**Cyclopentanique**, **cyclohexanique**, **cyclohexénique** (2 types : **β** et **ε** selon la position de la d.l.), **benzénique** ; ou aucune (acyclique : lycopène)."}, {"id": "ch8_8-006", "t": "Définition", "q": "Propriétés physico-chimiques générales des caroténoïdes ?", "a": "**Liposolubles**, **piégeurs de radicaux libres** (antioxydants), sensibles à l'oxydation et à la lumière."}, {"id": "ch8_8-007", "t": "Pourquoi ?", "q": "Pourquoi les feuilles jaunissent-elles en automne ?", "a": "La **chlorophylle**, qui masque les autres pigments en été, est dégradée plus vite → les **caroténoïdes** (et anthocyanes) deviennent visibles."}, {"id": "ch8_8-008", "t": "Pourquoi ?", "q": "Rôles des caroténoïdes chez les végétaux ?", "a": "**Attraction** des pollinisateurs/disperseurs ; **photosynthèse** (capture d'énergie à d'autres longueurs d'onde que la chlorophylle) ; **protection contre la photo-oxydation**."}, {"id": "ch8_8-009", "t": "Usage", "q": "Comment certains herbicides utilisent-ils les caroténoïdes ?", "a": "Ils **bloquent la biosynthèse des caroténoïdes** → **blanchiment** des feuilles qui meurent à la lumière (perte de photoprotection)."}, {"id": "ch8_8-010", "t": "Usage", "q": "Usages des caroténoïdes comme colorants ?", "a": "Colorants naturels efficaces et non toxiques : **pharmacie, cosmétique, agro-alimentaire** (formes pharmaceutiques, chair de poisson, jaune d'œuf, charcuteries, confiseries)."}, {"id": "ch8_8-011", "t": "Définition", "q": "L'homme peut-il synthétiser les caroténoïdes ?", "a": "**Non** : l'homme et les animaux les tirent des végétaux (ex. couleur des flamants roses liée à l'alimentation)."}, {"id": "ch8_8-012", "t": "Usage", "q": "Intérêts des caroténoïdes pour la santé humaine ?", "a": "Action **antioxydante** ; rôle protecteur possible contre des cancers (β-carotène : poumon ; lutéine : côlon ; lycopène : prostate) ; « pilules à bronzer »."}, {"id": "ch8_8-013", "t": "Toxicité", "q": "Précautions avec les caroténoïdes ?", "a": "« Pilules à bronzer » : coloration de la peau **sans protection UV** ; **contre-indiqués** en cas de **glaucome** ou d'atteinte rétinienne (risque de cristallisation)."}, {"id": "ch8_8-014", "t": "Définition", "q": "Sous quelles formes sont commercialisés les caroténoïdes ?", "a": "Extraits naturels (**rocou E160b, paprika E160c**), carotènes isolés (carotte, peau de tomate), caroténoïdes de synthèse ; en **suspension huileuse** ou **dispersion H/E** (émulsion, atomisat)."}, {"id": "ch8_8-015", "t": "Pourquoi ?", "q": "Pourquoi le β-carotène est-il une provitamine A ?", "a": "Son **oxydation** coupe la molécule en **deux molécules de rétinal**, réduites en **rétinol (vitamine A)**."}, {"id": "ch8_8-016", "t": "Toxicité", "q": "β-carotène vs rétinol : toxicité en excès ?", "a": "Le **β-carotène** est stocké dans le foie et **un excès n'est pas toxique**, contrairement au **rétinol**."}, {"id": "ch8_8-017", "t": "Structure", "q": "Lycopène vs β-carotène ?", "a": "Même formule C40H56 : le **lycopène** est l'**isomère acyclique** ; le **β-carotène** possède un **cycle β-ionone** à chaque extrémité."}, {"id": "ch8_8-018", "t": "Origine", "q": "Sources du lycopène ?", "a": "Surtout **tomates** et dérivés ; aussi pastèque, pamplemousse rose, orange sanguine, abricot, cynorhodon, huile de palme."}, {"id": "ch8_8-019", "t": "Pourquoi ?", "q": "Comment améliorer l'absorption du lycopène ?", "a": "Consommer l'aliment **cuit** et avec des **lipides** (le lycopène est liposoluble)."}, {"id": "ch8_8-020", "t": "Usage", "q": "Propriétés du lycopène ?", "a": "Colorant alimentaire ; **un des antioxydants les plus puissants** (≈ 100 × l'α-tocophérol) : protège ADN, LDL, cellules vasculaires ; protection possible (cancers de la prostate, poumon, tube digestif ; maladies cardiovasculaires)."}, {"id": "ch8_8-021", "t": "Origine", "q": "Rocou : origine, pigment et usage ?", "a": "Enveloppe des graines du **rocouyer** (*Bixa orellana*) ; **bixine** (xanthophylle acyclique, COOH + ester méthylique, **liposoluble**) ; colorant alimentaire (fromages, margarine…)."}, {"id": "ch8_8-022", "t": "Origine", "q": "Pigment majoritaire du paprika et son type ?", "a": "**Capsanthine** : **xanthophylle** à terminaison **cyclopentanique**, liposoluble ; teneur croissante à la maturation."}, {"id": "ch8_8-023", "t": "Définition", "q": "L'oléorésine de Capsicum est-elle obtenue par exsudation ?", "a": "Non, **par extraction** ; utilisée comme colorant, pour sa saveur et en usage externe analgésique."}, {"id": "ch8_8-024", "t": "Origine", "q": "Le safran : quelle partie de quelle plante ?", "a": "Les **stigmates** (avec l'extrémité du style) de *Crocus sativus* (Iridacées)."}, {"id": "ch8_8-025", "t": "Structure", "q": "Crocine : structure et classe ?", "a": "Ester de **crocétine** (diacide polyénique **C20**, diterpène particulier ; 9 d.l. conjuguées y compris C=O) avec 2 **gentiobioses** (Glc β1→6 Glc)."}, {"id": "ch8_8-026", "t": "Comparaison", "q": "Crocétine vs crocine : solubilité ?", "a": "**Crocétine** (R = H, diacide libre) : **liposoluble** ; **crocine** (R = gentiobiose) : **hydrosoluble**."}, {"id": "ch8_8-027", "t": "Origine", "q": "Quels monoterpènes caractérisent le safran ?", "a": "**Picrocrocine** (hétéroside à saveur **amère**, *picros*) et **safranal** (arôme)."}, {"id": "ch8_8-028", "t": "Pourquoi ?", "q": "Pourquoi le safran est-il souvent falsifié ?", "a": "Récolte manuelle des stigmates (beaucoup de fleurs pour peu de drogue) → **prix très élevé** → substitutions et ajouts frauduleux ; contrôle indispensable."}, {"id": "ch8_8-029", "t": "Usage", "q": "Usages et perspectives du safran ?", "a": "Surtout **épice/colorant** ; peu utilisé en thérapeutique ; études animales : crocine et mémoire, crocétine (proche de l'acide rétinoïque, anticancéreuse, moins tératogène que la vitamine A), safranal et SNC."}, {"id": "ch8_8-030", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**β-Carotène** — carotène C40 à 2 cycles β-ionone (provitamine A)."}, {"id": "ch8_8-031", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Lycopène** — carotène C40 acyclique (tomate)."}, {"id": "ch8_8-032", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Crocine** — crocétine (C20) diestérifiée par 2 gentiobioses (safran, hydrosoluble)."}, {"id": "ch9-001", "t": "Définition", "q": "Définition d'une vitamine ?", "a": "Composé organique sans valeur énergétique propre, nécessaire à l'organisme, qui doit être en partie apporté par l'alimentation (synthèse humaine insuffisante)."}, {"id": "ch9-002", "t": "Classe", "q": "Quelles sont les vitamines liposolubles et leur point commun ?", "a": "A, D, E, K : elles appartiennent à des classes phytochimiques différentes mais sont toutes solubles dans les huiles grasses (et solvants organiques)."}, {"id": "ch9-003", "t": "Origine", "q": "Sources principales : vitamines A/D vs E/K ?", "a": "A et D : huiles et graisses animales (poissons, huile de foie de morue) + provitamines A végétales (caroténoïdes). E et K : huiles végétales."}, {"id": "ch9-004", "t": "Structure", "q": "Nommez cette vitamine (C20, chaîne polyénique, CH2OH).", "a": "Rétinol (vitamine A)."}, {"id": "ch9-005", "t": "Définition", "q": "Combien de carbones dans le rétinol ?", "a": "20 carbones."}, {"id": "ch9-006", "t": "Définition", "q": "Qu'est-ce que la provitamine A et comment est-elle convertie ?", "a": "Le β-carotène (dimère de la vitamine A) : transformé en rétinal dans la muqueuse intestinale, puis réduit en rétinol."}, {"id": "ch9-007", "t": "Origine", "q": "Sources de β-carotène ?", "a": "Carottes, melons, abricots, légumes vert foncé (persil, épinard), spiruline."}, {"id": "ch9-008", "t": "Définition", "q": "Stockage et absorption de la vitamine A ?", "a": "Stockée au foie sous forme d'esters d'acides gras ; absorbée comme les lipides, en présence de bile."}, {"id": "ch9-009", "t": "Usage", "q": "Rôles physiologiques de la vitamine A ?", "a": "Synthèse des pigments visuels et adaptation à l'obscurité, différenciation des épithéliums (cornée), immunité (anti-infectieuse), croissance, fertilité, reproduction."}, {"id": "ch9-010", "t": "Définition", "q": "En quelles unités exprime-t-on la vitamine A et pourquoi ?", "a": "En équivalents rétinol (ER) ou UI (1 ER = 1 µg de rétinol = 3,33 UI), à cause de la diversité des sources."}, {"id": "ch9-011", "t": "Toxicité", "q": "Risque d'un excès de vitamine A ?", "a": "Tératogène en début de grossesse (attention à l'automédication)."}, {"id": "ch9-012", "t": "Toxicité", "q": "Signes d'une carence en vitamine A ?", "a": "Rare (malabsorption) : perte de vision crépusculaire, sécheresse des muqueuses et conjonctives (→ cécité)."}, {"id": "ch9-013", "t": "Usage", "q": "Dérivés synthétiques de la vitamine A et précaution ?", "a": "Acitrétine (psoriasis), isotrétinoïne (acné) : sous contraception (2 ans après l'arrêt de l'acitrétine, 1 mois pour l'isotrétinoïne)."}, {"id": "ch9-014", "t": "Comparaison", "q": "Vitamine D3 vs D2 ?", "a": "D3 = cholécalciférol, exclusivement animale (isolée de la bile). D2 = ergocalciférol, végétale ou microbienne (isolée de l'ergot de seigle). Toutes deux sécostéroïdes."}, {"id": "ch9-015", "t": "Structure", "q": "Nommez cette vitamine (sécostéroïde, chaîne du cholestérol).", "a": "Cholécalciférol (vitamine D3)."}, {"id": "ch9-016", "t": "Structure", "q": "Nommez cette vitamine (sécostéroïde, chaîne de l'ergostérol avec C=C en 22).", "a": "Ergocalciférol (vitamine D2)."}, {"id": "ch9-017", "t": "Définition", "q": "Qu'est-ce qu'un sécostéroïde ?", "a": "Un stéroïde dont un cycle (le cycle B pour la vitamine D) est ouvert."}, {"id": "ch9-018", "t": "Définition", "q": "Comment la vitamine D3 est-elle synthétisée dans la peau ?", "a": "Les UV ouvrent le cycle B du 7-déhydrocholestérol des couches profondes de la peau → cholécalciférol."}, {"id": "ch9-019", "t": "Définition", "q": "Comment la vitamine D est-elle activée ?", "a": "2 hydroxylations : foie → 25-hydroxyvitamine D ; rein → 1,25-dihydroxyvitamine D (active)."}, {"id": "ch9-020", "t": "Usage", "q": "Rôles de la vitamine D ?", "a": "Ossification (régulation du métabolisme du Ca et du P, absorption intestinale) ; immunité (interleukines, cytokines) ; prolifération et différenciation cellulaire."}, {"id": "ch9-021", "t": "Toxicité", "q": "Carence et excès de vitamine D ?", "a": "Carence : rachitisme (enfant), ostéomalacie (adulte). Excès : hypercalcémie (troubles digestifs, constipation, stupeur, calcifications tissulaires)."}, {"id": "ch9-022", "t": "Usage", "q": "Quand recommande-t-on une supplémentation en vitamine D ?", "a": "En hiver ; chez l'enfant allaité ; en prévention des fractures ostéoporotiques avec du calcium."}, {"id": "ch9-023", "t": "Origine", "q": "Sources de vitamine E ?", "a": "Huiles végétales (germe de blé surtout, tournesol, soja, arachide, olive) ; moins : céréales, amandes, légumes verts ; animales : beurre, poissons gras."}, {"id": "ch9-024", "t": "Structure", "q": "Nommez cette vitamine (chromanol + chaîne saturée).", "a": "α-Tocophérol (vitamine E)."}, {"id": "ch9-025", "t": "Comparaison", "q": "Tocophérols vs tocotriénols ?", "a": "Tocophérols (les plus importants) : chaîne latérale saturée. Tocotriénols (rôle accessoire) : chaîne à 3 doubles liaisons."}, {"id": "ch9-026", "t": "Structure", "q": "Qu'est-ce qui différencie α, β, γ, δ-tocophérols ?", "a": "Le nombre et la position des CH3 sur le cycle chromanol : α (5,7,8), β (5,8), γ (7,8), δ (8)."}, {"id": "ch9-027", "t": "Usage", "q": "Rôle de la vitamine E ?", "a": "Antioxydant tissulaire protégeant les AGPI des phospholipides membranaires contre les radicaux libres ; stabilisation des membranes, agrégation plaquettaire, cofacteur enzymatique ; conservateur alimentaire."}, {"id": "ch9-028", "t": "Pourquoi ?", "q": "Pourquoi une carence en vitamine E accompagne-t-elle une alimentation très riche en AGPI ?", "a": "Carence de consommation : la vitamine E est utilisée pour empêcher l'oxydation des AGPI apportés ; ce n'est pas une carence d'apport."}, {"id": "ch9-029", "t": "Classe", "q": "À quelle classe phytochimique appartiennent les vitamines K ?", "a": "Aux naphtoquinones (avec une chaîne latérale d'origine terpénique, nombre de C multiple de 5)."}, {"id": "ch9-030", "t": "Comparaison", "q": "Vitamine K1 vs K2 ?", "a": "K1 = phytoménadione (phylloquinone), végétale (huiles de soja/colza, légumes verts), chaîne C20 à 1 double liaison (diterpène). K2 = ménaquinones, bactériennes (flore, laitages fermentés), chaîne 5C + 5C × n (n = 6-9)."}, {"id": "ch9-031", "t": "Usage", "q": "Rôle physiologique de la vitamine K ?", "a": "Cofacteur d'une γ-carboxylase activant la prothrombine et d'autres protéines de l'hémostase → coagulation ; carboxylation de l'ostéocalcine (os)."}, {"id": "ch9-032", "t": "Usage", "q": "Pourquoi administre-t-on de la vitamine K au nouveau-né ?", "a": "Faibles réserves, lait maternel pauvre, flore intestinale absente → risque hémorragique ; prévention orale ou IM à la naissance."}, {"id": "ch9-033", "t": "Usage", "q": "Usage de la vitamine K1 chez l'adulte ?", "a": "Antidote en cas d'effet exagéré des anticoagulants coumariniques (phytoménadione orale, parfois IV lente ; à répéter car demi-vie courte)."}, {"id": "ch9-034", "t": "Comparaison", "q": "Rôle préférentiel K1 vs K2 ?", "a": "K1 : surtout coagulation (forme des médicaments). K2 : plutôt calcification des tissus mous (intérêt dans l'ostéoporose)."}, {"id": "ch9-035", "t": "Définition", "q": "La cuisson détruit-elle la vitamine K1 ?", "a": "Non."}, {"id": "ch10-001", "t": "Définition", "q": "Définissez les hétérosides cyanogènes.", "a": "Hétérosides capables de libérer du **HCN** ; les plus communs sont des **O-hétérosides d'α-hydroxynitriles** (cyanhydrines) dérivés d'acides aminés."}, {"id": "ch10-002", "t": "Toxicité", "q": "Mécanisme de la toxicité de l'HCN ?", "a": "**Anoxie cytotoxique** : les ions CN⁻ se fixent sur la **cytochrome-oxydase** → oxygène inutilisable par la cellule (céphalées, vertiges, troubles respiratoires, coma, asphyxie)."}, {"id": "ch10-003", "t": "Toxicité", "q": "Traitement d'une intoxication cyanhydrique ?", "a": "Hospitalier : lavage gastrique, **oxygénothérapie**, chélation des CN par la **vitamine B12** et **thiosulfate de sodium** (stimule la détoxication)."}, {"id": "ch10-004", "t": "Pourquoi ?", "q": "Pourquoi l'intoxication aiguë par HCN d'origine végétale est-elle rare ?", "a": "Détoxication enzymatique rapide par la **rhodanase** (thiosulfate sulfure transférase) : CN⁻ → **thiocyanate (SCN⁻)** éliminé dans les urines."}, {"id": "ch10-005", "t": "Toxicité", "q": "Quelles intoxications chroniques sont liées aux hétérosides cyanogènes et où ?", "a": "En **Afrique tropicale** (manioc, sorgho mal détoxiqués) : **goitres** (thiocyanates captant l'iode) et **neuropathies** (ataxie, konzo ; carence en acides aminés soufrés)."}, {"id": "ch10-006", "t": "Structure", "q": "Par quoi diffèrent les ≈ 60 hétérosides cyanogènes connus ?", "a": "Par la **chaîne osidique** (glucose, gentiobiose) et par l'**α-hydroxynitrile**, dérivé d'un acide aminé **aliphatique** (valine) ou **aromatique** (phénylalanine)."}, {"id": "ch10-007", "t": "Origine", "q": "De quels acides aminés dérivent amygdaloside, prunasoside et linamaroside ?", "a": "Amygdaloside et prunasoside : **phénylalanine** (aromatique) ; linamaroside : **valine** (aliphatique)."}, {"id": "ch10-008", "t": "Pourquoi ?", "q": "Décrivez les 2 étapes enzymatiques de libération de l'HCN.", "a": "1) **β-glucosidase** : hétéroside → sucre(s) + **α-hydroxynitrile** ; 2) **hydroxynitrile-lyase** : α-hydroxynitrile → **HCN** + **aldéhyde ou cétone**."}, {"id": "ch10-009", "t": "Toxicité", "q": "Dose létale minimale d'HCN chez l'adulte ?", "a": "Environ **50 mg**."}, {"id": "ch10-010", "t": "Structure", "q": "Structure de l'amygdaloside ?", "a": "**β-Gentiobioside** (Glc β1→6 Glc) du **(R)-mandélonitrile** : Ph–CH(CN)–O–gentiobiose."}, {"id": "ch10-011", "t": "Origine", "q": "Où trouve-t-on l'amygdaloside ?", "a": "**Amandes amères** (*Prunus amygdalus* var. *amara*) et **noyaux** d'abricots, pêches, cerises, prunes."}, {"id": "ch10-012", "t": "Toxicité", "q": "Dose létale d'amandes amères chez l'enfant et symptômes ?", "a": "**6 à 10 amandes amères** ; asthénie, hypotension, céphalées, troubles respiratoires, tachycardie."}, {"id": "ch10-013", "t": "Définition", "q": "Qu'est-ce que l'émulsine ?", "a": "Mélange enzymatique des amandes : **β-glucosidase + hydroxynitrile-lyase**."}, {"id": "ch10-014", "t": "Pourquoi ?", "q": "Produits de l'hydrolyse complète de l'amygdaloside ?", "a": "**2 glucoses + benzaldéhyde + HCN**."}, {"id": "ch10-015", "t": "Structure", "q": "Structure du prunasoside ?", "a": "**β-Glucoside** (un seul glucose) du **(R)-mandélonitrile**."}, {"id": "ch10-016", "t": "Origine", "q": "Source du prunasoside et ancien usage ?", "a": "Feuilles fraîches du **laurier-cerise** (*Prunus laurocerasus*) ; eau distillée de laurier-cerise dans des sirops (bronchopulmonaires, aromatisant, stimulant respiratoire) — abandonnée au profit du benzaldéhyde."}, {"id": "ch10-017", "t": "Structure", "q": "Structure du linamaroside ?", "a": "**β-Glucoside de la cyanhydrine de l'acétone** : (CH3)2C(CN)–O–Glc."}, {"id": "ch10-018", "t": "Origine", "q": "Où trouve-t-on le linamaroside ?", "a": "**Plantules de lin** (faible dans les graines) et **tubercules et feuilles de manioc**."}, {"id": "ch10-019", "t": "Pourquoi ?", "q": "Produits de l'hydrolyse du linamaroside ?", "a": "**Linamarase** → **glucose + acétone + HCN**."}, {"id": "ch10-020", "t": "Méthode", "q": "Comment détoxiquer le manioc ?", "a": "1. **Trempage dans l'eau**, 2. **cuisson** (la friture ou une cuisson insuffisante peuvent laisser des cyanures)."}, {"id": "ch10-021", "t": "Origine", "q": "Quel hétéroside cyanogène contient le sorgho ?", "a": "La **durrhine** (teneur décroissante avec la croissance) ; cuire les grains à la vapeur ; formation de p-hydroxybenzaldéhyde."}, {"id": "ch10-022", "t": "Définition", "q": "Définissez les glucosinolates.", "a": "**S-hétérosides soufrés anioniques** : **oximes sulfonées** (Glc–S–C(R)=N–O–SO3⁻)."}, {"id": "ch10-023", "t": "Structure", "q": "Orientation de l'oxime dans les glucosinolates ?", "a": "**Syn** par rapport au **thioglycoside**, **anti** par rapport à la **chaîne latérale R** (variable, issue de l'acide aminé précurseur)."}, {"id": "ch10-024", "t": "Définition", "q": "Les glucosinolates ont-ils une odeur ?", "a": "Non, **insipides et inodores** tels quels ; c'est après hydrolyse qu'apparaissent des saveurs et odeurs fortes."}, {"id": "ch10-025", "t": "Origine", "q": "Dans quelles familles trouve-t-on les glucosinolates ?", "a": "**Brassicacées** (moutarde, radis, cresson, navet, choux…) et apparentées (câpres, capucines) — ordre des Capparidales."}, {"id": "ch10-026", "t": "Pourquoi ?", "q": "Décrivez la transformation des glucosinolates à pH neutre.", "a": "Tissus lésés → **myrosinase** (thioglucosidase) hydrolyse le thioglucoside → **élimination de sulfate** → intermédiaire qui se **réarrange** en **isothiocyanate R–N=C=S** volatil, piquant."}, {"id": "ch10-027", "t": "Classe", "q": "Classez les glucosinolates selon leur précurseur : glucotropéoline, sinalbine, glucobrassicine, sinigroside, progoitrine.", "a": "Aromatiques : **glucotropéoline** (benzyl, capucine), **sinalbine** (p-hydroxybenzyl, moutarde blanche), **glucobrassicine** (indolylméthyl, choux). Aliphatiques : **sinigroside** (allyl, moutarde noire, raifort), **progoitrine** (colza)."}, {"id": "ch10-028", "t": "Origine", "q": "Quel glucosinolate contient la moutarde noire et que libère-t-elle ?", "a": "**Sinigroside** (allyl-glucosinolate) → **isothiocyanate d'allyle** (essence de moutarde)."}, {"id": "ch10-029", "t": "Usage", "q": "Propriétés thérapeutiques des glucosinolates/isothiocyanates ?", "a": "**Antiseptiques**, **« réchauffants »** (rubéfiants, voire vésicants) : pastilles d'erysimum, shampooings à la capucine, **sinapisme** (cataplasme de farine de moutarde)."}, {"id": "ch10-030", "t": "Toxicité", "q": "Essence de moutarde noire : précautions ?", "a": "Dosée en **isothiocyanate d'allyle** : toxique, **lacrymogène**, irritante, **vésicante**, saveur très brûlante ; utilisation restreinte (liste des toxiques) ; analogie avec le gaz moutarde."}, {"id": "ch10-031", "t": "Usage", "q": "Intérêt santé du brocoli ?", "a": "Son glucosinolate libère le **sulforaphane** : protection possible contre les cancérigènes (↑ glutathion S-transférase, ↓ dégradation de l'ADN, antiprolifératif, pro-apoptotique)."}, {"id": "ch10-032", "t": "Comparaison", "q": "Thiocyanate vs isothiocyanate ?", "a": "**Thiocyanate** R–S–C≡N (ou SCN⁻ issu de la détoxication des cyanures, antithyroïdien) ; **isothiocyanate** R–N=C=S (produit de la myrosinase sur les glucosinolates, piquant)."}, {"id": "ch10-033", "t": "Structure", "q": "Structure de l'alliine ?", "a": "**Sulfoxyde de S-allyl-L-cystéine** : CH2=CH–CH2–S(=O)–CH2–CH(NH2)–COOH."}, {"id": "ch10-034", "t": "Pourquoi ?", "q": "Décrivez la formation de l'allicine.", "a": "Tissus d'ail lésés → **alliinase** : alliine → **acide pyruvique + NH3 + acide allylsulfénique** (2-propénylsulfénique) ; 2 acides allylsulféniques se **dimérisent** (–H2O) en **allicine** (thiosulfinate de diallyle)."}, {"id": "ch10-035", "t": "Structure", "q": "Qu'est-ce que l'allicine chimiquement ?", "a": "Un **thiosulfinate de diallyle** : CH2=CH–CH2–S(=O)–S–CH2–CH=CH2."}, {"id": "ch10-036", "t": "Usage", "q": "Activités de l'ail et de l'allicine ?", "a": "**Antimicrobiennes** ; consommation régulière inversement corrélée au **cancer gastrique** ; ESCOP : prévention de l'**athérosclérose** (↓ cholestérol, fluidité sanguine, antioxydant)."}, {"id": "ch10-037", "t": "Méthode", "q": "En quoi est standardisée la poudre d'ail de la Ph. Eur. ?", "a": "En **allicine** (teneur minimale, dosage **HPLC**)."}, {"id": "ch10-038", "t": "Pourquoi ?", "q": "Que devient l'allicine en milieu huileux/alcoolique ?", "a": "Elle se condense en **ajoènes** (E et Z) : **antiagrégants plaquettaires**, intérêt en prévention de cancers."}, {"id": "ch10-039", "t": "Pourquoi ?", "q": "Que devient l'allicine à la distillation à la vapeur d'eau ?", "a": "**Disulfure et trisulfure de diallyle**, constituants majoritaires de l'**essence d'ail** (prévention du cancer gastrique : inhibition des nitrosamines)."}, {"id": "ch10-040", "t": "Comparaison", "q": "Ail vs oignon : précurseurs soufrés ?", "a": "**Ail** : **alliine** (S-allyl-cystéine sulfoxyde) → acide allylsulfénique → allicine. **Oignon** : **pas d'alliine** mais **S-(1-propényl)-cystéine sulfoxyde** → acide **1-propénylsulfénique** **lacrymogène** → disulfures."}, {"id": "ch10-041", "t": "Usage", "q": "Propriétés de l'oignon ?", "a": "Antimicrobien, antiagrégant plaquettaire ; réputé hypoglycémiant, anti-allergique, protecteur gastrique ; **pas d'extraits standardisés**."}, {"id": "ch10-042", "t": "Définition", "q": "Quelles substances piquantes déjà vues dans d'autres chapitres sont rappelées ?", "a": "**Gingérols** (Zingibéracées), **isothiocyanates** (glucosinolates), **thiosulfinates** (Alliacées)."}, {"id": "ch10-043", "t": "Classe", "q": "À quelle famille chimique appartiennent capsaïcine et pipérine ?", "a": "Ce sont des **amides d'acides carboxyliques** présents dans la partie **résine** d'oléorésines obtenues **par extraction**."}, {"id": "ch10-044", "t": "Structure", "q": "Définissez chimiquement la capsaïcine.", "a": "**Vanillylamide de l'acide 8-méthyl-non-6-énoïque** (phénol + méthoxyle + amide + chaîne insaturée ramifiée)."}, {"id": "ch10-045", "t": "Pourquoi ?", "q": "Quelle est la double origine biogénétique de la capsaïcine ?", "a": "Partie **aromatique** (vanillylamine) issue de la **phénylalanine** ; partie **aliphatique** issue de la voie des **polyacétates**."}, {"id": "ch10-046", "t": "Usage", "q": "Usages thérapeutiques de l'oléorésine de Capsicum ?", "a": "**Analgésique en usage externe** (brûlure puis anesthésie locale sans altérer toucher ni chaleur) : douleurs articulaires, névralgies du trijumeau, post-zona, prurit du diabétique ; aérosols d'autodéfense."}, {"id": "ch10-047", "t": "Toxicité", "q": "Oléorésine vs teinture de Capsicum ?", "a": "Ne pas confondre : l'**oléorésine** est riche en capsaïcinoïdes ; la **teinture** en contient environ **200 fois moins**."}, {"id": "ch10-048", "t": "Origine", "q": "Poivre : comment obtient-on l'oléorésine et que contient-elle ?", "a": "Épuisement des fruits de *Piper nigrum* par **éthanol/acétone** → oléorésine = **HE** (caryophyllène, pinènes, sabinène, limonène) + **résine à principes piquants** (amides, surtout **pipérine**)."}, {"id": "ch10-049", "t": "Structure", "q": "Pipérine : structure et instabilité ?", "a": "**Amide** de l'acide pipérique (méthylènedioxyphényle + diène) avec la **pipéridine** ; à la lumière, isomérisation des d.l. en **isochavicine** sans saveur."}, {"id": "ch10-050", "t": "Usage", "q": "Propriétés du poivre et de la pipérine ?", "a": "Antibactérien ; **apéritif et digestif** (sécrétions salivaires, gastriques, biliaires) ; pipérine **hépatoprotectrice**, **augmente la résorption de médicaments** (lipophile), **insecticide**."}, {"id": "ch10-051", "t": "Comparaison", "q": "Poivre vert, noir, blanc ?", "a": "**Vert** : fruits immatures frais/surgelés/saumure ; **noir** : fruits immatures **séchés** ; **blanc** : fruits **mûrs** débarrassés de l'épicarpe et du mésocarpe externe, séchés."}, {"id": "ch10-052", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Amygdaloside** — (R)-mandélonitrile gentiobioside (amandes amères)."}, {"id": "ch10-053", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Linamaroside** — glucoside de la cyanhydrine de l'acétone (lin, manioc)."}, {"id": "ch10-054", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Capsaïcine** — vanillylamide (piment)."}, {"id": "ch10-055", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Pipérine** — amide à noyau pipéridine (poivre)."}, {"id": "ch10-056", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Sulforaphane** — isothiocyanate à sulfoxyde (brocoli)."}, {"id": "ch10-057", "t": "Structure", "q": "Reconnaître : quelle molécule est représentée ?", "a": "**Alliine** — sulfoxyde de S-allyl-L-cystéine (ail)."}, {"id": "ch11-001", "t": "Définition", "q": "Définition générale d'un alcaloïde ?", "a": "Composé organique azoté, plus ou moins basique, d'origine naturelle (le plus souvent végétale), de distribution restreinte, présentant à faible dose des propriétés pharmacologiques marquées."}, {"id": "ch11-002", "t": "Définition", "q": "Quels critères complémentaires aident à distinguer les alcaloïdes ?", "a": "Réactions communes de précipitation et de coloration avec certains réactifs ; composés mono- ou polycycliques."}, {"id": "ch11-003", "t": "Définition", "q": "Origine du mot « alcaloïde » ?", "a": "Meissner (début XIXe) : rappelle le caractère alcalin (arabe al kaly), mis à profit pour l'extraction et le dosage."}, {"id": "ch11-004", "t": "Définition", "q": "Qui a isolé les premiers alcaloïdes ?", "a": "Les pharmaciens Pelletier et Caventou, à partir de 1815 (caféine, émétine, strychnine, quinine…)."}, {"id": "ch11-005", "t": "Comparaison", "q": "Alcaloïdes vrais, pseudo-alcaloïdes, proto-alcaloïdes ?", "a": "Vrais : issus d'acides aminés, N hétérocyclique. Pseudo : N hétérocyclique mais pas issu d'un AA (acétate, terpènes). Proto : amines simples, N hors hétérocycle."}, {"id": "ch11-006", "t": "Origine", "q": "Exemples d'alcaloïdes vrais et leur acide aminé précurseur ?", "a": "Morphine (isoquinoléique ← tyrosine), hyoscyamine (tropanique ← ornithine), ergométrine (indolique ← tryptophane)."}, {"id": "ch11-007", "t": "Origine", "q": "Exemples de pseudo-alcaloïdes ?", "a": "Coniine et γ-conicéine de la ciguë (métabolisme de l'acétate) ; solanidine, alcaloïde stéroïdique de la pomme de terre (terpènes)."}, {"id": "ch11-008", "t": "Origine", "q": "Exemples de proto-alcaloïdes ?", "a": "Dérivés de la phényléthylamine : mescaline (peyotl), (−)-éphédrine (éphédra)."}, {"id": "ch11-009", "t": "Structure", "q": "Ce composé de la ciguë est-il un alcaloïde vrai ?", "a": "Non : coniine = pseudo-alcaloïde (pipéridine issue de l'acétate, pas d'un AA)."}, {"id": "ch11-010", "t": "Structure", "q": "À quel type d'alcaloïde appartient l'éphédrine ?", "a": "Proto-alcaloïde : phényléthylamine, azote hors cycle."}, {"id": "ch11-011", "t": "Structure", "q": "Type d'alcaloïde et origine de la mescaline ?", "a": "Proto-alcaloïde (phényléthylamine) du peyotl, cactus hallucinogène."}, {"id": "ch11-012", "t": "Classe", "q": "Quelles substances azotées ne sont PAS considérées comme des alcaloïdes ?", "a": "Acides aminés, la plupart des amines simples, amino-sucres, peptides, alkylamides non cyclisés, bétalaïnes (colorants), dérivés nitrés (ex. acide aristolochique)."}, {"id": "ch11-013", "t": "Structure", "q": "Ce composé azoté est-il un alcaloïde ?", "a": "Non : acide aristolochique = dérivé nitré (NO2), responsable de nécroses du rein."}, {"id": "ch11-014", "t": "Classe", "q": "La sérotonine est-elle un alcaloïde ?", "a": "Non : les alkylamines/arylalkylamines largement distribuées ne sont pas des alcaloïdes."}, {"id": "ch11-015", "t": "Classe", "q": "Aconitine, coniine, colchicine sont-elles des alcaloïdes ?", "a": "Oui, elles sont couramment considérées comme des alcaloïdes."}, {"id": "ch11-016", "t": "Définition", "q": "Sous quelle forme les alcaloïdes sont-ils présents dans la plante ?", "a": "Dissous dans le suc vacuolaire sous forme de sels organiques, ou insolubles, combinés aux tanins."}, {"id": "ch11-017", "t": "Définition", "q": "Caractères physiques généraux des alcaloïdes ?", "a": "MM 100 à 900 ; saveur amère ; non oxygénés et légers : liquides entraînables à la vapeur d'eau (coniine) ; oxygénés ou lourds : solides cristallins."}, {"id": "ch11-018", "t": "Origine", "q": "Donnez deux extrêmes de teneur en alcaloïdes.", "a": "Quelques mg/kg pour les antitumoraux de la pervenche de Madagascar ; > 15 % pour le quinquina."}, {"id": "ch11-019", "t": "Comparaison", "q": "Solubilité d'un alcaloïde tertiaire en milieu alcalin vs acide ?", "a": "Alcalin : base non ionisée → soluble dans les solvants organiques apolaires et les alcools, insoluble dans l'eau. Acide : sel ionisé → soluble dans l'eau et les alcools, insoluble dans les solvants organiques apolaires. Réversible."}, {"id": "ch11-020", "t": "Définition", "q": "Qu'est-ce qu'un alcaloïde quaternaire et quelle est sa solubilité ?", "a": "Azote à 4 liaisons carbonées, toujours ionisé : soluble dans l'eau même alcaline, non extractible par solvant organique."}, {"id": "ch11-021", "t": "Piège", "q": "Un tertiaire protoné (sel, N–H⁺) est-il quaternaire ?", "a": "Non : la liaison avec un H ne le rend pas quaternaire ; le critère est la solubilité dans l'eau alcaline (réponse du prof)."}, {"id": "ch11-022", "t": "Structure", "q": "Alcaloïde tertiaire ou quaternaire ?", "a": "Tertiaire : codéine (N-CH3 à 3 liaisons C, salifiable, extractible en milieu alcalin)."}, {"id": "ch11-023", "t": "Définition", "q": "De quoi dépend la basicité d'un alcaloïde tertiaire ?", "a": "De la disponibilité du doublet libre de l'azote."}, {"id": "ch11-024", "t": "Structure", "q": "Cet hétérocycle est-il salifiable ?", "a": "Non : indole — le doublet de l'azote participe à l'aromaticité."}, {"id": "ch11-025", "t": "Structure", "q": "Nommez cet hétérocycle ; est-il basique ?", "a": "Pyridine : oui, le cycle est aromatique sans le doublet de l'azote, qui reste disponible."}, {"id": "ch11-026", "t": "Structure", "q": "Nommez cet hétérocycle saturé à 6 chaînons.", "a": "Pipéridine (basique, salifiable)."}, {"id": "ch11-027", "t": "Structure", "q": "Nommez cet hétérocycle bicyclique azoté (N en 1).", "a": "Quinoléine (basique) — noyau de la quinine."}, {"id": "ch11-028", "t": "Structure", "q": "Nommez cet hétérocycle bicyclique azoté (N en 2).", "a": "Isoquinoléine."}, {"id": "ch11-029", "t": "Comparaison", "q": "Pyrrole/indole vs pyridine/quinoléine/pipéridine : basicité ?", "a": "Pyrrole et indole : doublet engagé dans l'aromaticité → non salifiables. Pyridine, quinoléine, isoquinoléine (aromatiques sans le doublet) et pyrrolidine, pipéridine (non aromatiques) : doublet disponible → salifiables."}, {"id": "ch11-030", "t": "Définition", "q": "Effet des substituants sur la basicité des alcaloïdes ?", "a": "Groupements électrodonneurs adjacents à l'azote l'exaltent ; électroattracteurs (C=O) la diminuent ou la suppriment (amide)."}, {"id": "ch11-031", "t": "Méthode", "q": "Quelles sont les 3 grandes méthodes d'extraction des alcaloïdes ?", "a": "1) Solvant organique non polaire en milieu alcalin ; 2) solvant organique polaire (alcool) en milieu neutre ou acide ; 3) eau à pH acide. Puis isolement : cristallisation fractionnée, chromatographie préparative."}, {"id": "ch11-032", "t": "Méthode", "q": "Étapes de l'extraction en milieu alcalin ?", "a": "Alcalinisation de la drogue + solvant apolaire → bases tertiaires (+ impuretés lipophiles) ; + acide dilué → sels en phase aqueuse ; ré-alcalinisation + solvant organique non miscible → bases purifiées ; évaporation → alcaloïdes tertiaires totaux."}, {"id": "ch11-033", "t": "Méthode", "q": "Que contient l'extrait par eau acide et quelles sont les 3 suites possibles ?", "a": "Sels de tertiaires + quaternaires. Suites : alcalinisation + CH2Cl2 (tertiaires ; quaternaires restent dans l'eau) ; réactif de Mayer (précipité d'iodomercurates) ; résine échangeuse d'ions (tertiaires + quaternaires sous forme de sels)."}, {"id": "ch11-034", "t": "Méthode", "q": "Quelles bases utilise-t-on pour alcaliniser une solution de sels d'alcaloïdes ?", "a": "NaOH, NH4OH ou Na2CO3 : les alcaloïdes tertiaires, insolubles dans l'eau, précipitent."}, {"id": "ch11-035", "t": "Méthode", "q": "Réactifs généraux de précipitation des alcaloïdes ?", "a": "Bouchardat (iodo-ioduré), Mayer (tétraiodomercurate de K), Dragendorff (tétraiodobismuthate de K) ; réactifs phosphotungstique, silicotungstique (en milieu aqueux acide)."}, {"id": "ch11-036", "t": "Méthode", "q": "Pourquoi utilise-t-on le réactif de Mayer pour les quaternaires ?", "a": "Ils sont impossibles à extraire par un solvant organique à partir de leurs solutions aqueuses ; on les précipite sous forme d'iodomercurates."}, {"id": "ch11-037", "t": "Méthode", "q": "Méthodes de dosage des alcaloïdes ?", "a": "Titrimétrie (tertiaires : acidimétrie directe, en retour, en milieu non aqueux), spectrophotométrie (UV ou après réaction colorée), CLHP."}, {"id": "ch11-038", "t": "Usage", "q": "Exemples d'activités pharmacologiques des alcaloïdes ?", "a": "Analgésique (morphine), anesthésique local (cocaïne), antiparasitaire (quinine), anticancéreux (vinblastine), curarisants, SN autonome, cardiovasculaire ; toxicité souvent notable."}, {"id": "ch11-039", "t": "Structure", "q": "Cet alcaloïde réagit-il avec NaOH, avec HCl, ou les deux ?", "a": "Les deux : morphine = phénol (NaOH) + amine tertiaire (HCl), amphotère."}, {"id": "ch11-040", "t": "Pourquoi ?", "q": "Pourquoi la coniine est-elle volatile ?", "a": "Non oxygénée, faible masse (8 C + 1 N, comme un monoterpène) : liquide entraînable à la vapeur d'eau."}], "pl": [{"id": "acerola", "hd": "img/plantes-hd/acerola.jpg", "iw": 300, "nom": "Acérola", "lat": "Malpighia punicifolia", "partie": "fruits", "rep": "vitamine C", "tous": ["vitamine C (fruit le plus riche, ~20× les agrumes)"], "img": "img/plantes/acerola.jpg", "usage": "Source de vitamine C (compléments alimentaires).", "w": "Malpighia_emarginata", "ch": "ch1"}, {"id": "rosa-canina", "hd": "img/plantes-hd/rosa-canina.jpg", "iw": 252, "nom": "Églantier", "lat": "Rosa canina L.", "partie": "faux-fruits (cynorrhodons)", "rep": "vitamine C", "tous": ["vitamine C"], "img": "img/plantes/rosa-canina.jpg", "usage": "2e source e d'allyle", "tous": ["sinigroside → isothiocyanate d'allyle"], "img": "img/plantes/raifort.jpg", "usage": "Condiment piquant.", "w": "Armoracia_rusticana", "ch": "ch10"}, {"id": "ail", "hd": "", "iw": 0, "nom": "Ail", "lat": "Allium sativum L.", "partie": "bulbe (caïeux)", "rep": "alliine → allicine", "tous": ["alliine → allicine", "ajoènes, di/trisulfure de diallyle"], "img": "", "usage": "Antimicrobien, antiagrégant, prévention de l'athérosclérose et du cancer gastrique ; poudre d'ail Ph. Eur. standardisée en allicine.", "w": "Allium_sativum", "ch": "ch10"}, {"id": "oignon", "hd": "", "iw": 0, "nom": "Oignon", "lat": "Allium cepa L.", "partie": "bulbe", "rep": "sulfoxyde de S--L-cystéine → acide 1-propénylsulfénique", "tous": ["sulfoxyde de S-(1-propényl)-L-cystéine → acide 1-propénylsulfénique (lacrymogène)"], "img": "", "usage": "Antimicrobien, antiagrégant ; pas d'extraits standardisés.", "w": "Allium_cepa", "ch": "ch10"}, {"id": "piment", "hd": "img/plantes-hd/piment.jpg", "iw": 276, "nom": "Piment", "lat": "Capsicum frutescens L. / C. annuum L.", "partie": "fruits", "rep": "capsaïcine", "tous": ["capsaïcine (capsaïcinoïdes)"], "img": "img/plantes/piment.jpg", "usage": "Oléorésine en usage externe analgésique ; aérosols d'autodéfense.", "w": "Capsicum_frutescens_L._/_C._annuum", "ch": "ch10"}, {"id": "poivrier", "hd": "img/plantes-hd/poivrier.jpg", "iw": 400, "nom": "Poivrier", "lat": "Piper nigrum L.", "partie": "fruits (poivres vert, noir, blanc)", "rep": "pipérine", "tous": ["pipérine (amide)", "HE : caryophyllène, pinènes, sabinène, limonène"], "img": "img/plantes/poivrier.jpg", "usage": "Épice apéritive et digestive ; pipérine hépatoprotectrice, augmente la résorption de médicaments, insecticide.", "w": "Piper_nigrum", "ch": "ch10"}], "chap": [{"id": "ch0", "num": "0", "t": "0. Introduction à la pharmacognosie", "court": "Introduction", "sym": "book", "fam": "base", "niveaux": [{"t": "Pharmacognosie et Drogue végétale et qualité", "s": "Organisation d'une monographie", "type": "n", "m": [], "q": ["ch0-q01", "ch0-q02", "ch0-q03", "ch0-q06", "ch0-q07", "vf50-5", "vf50-7"], "c": ["ch0-001", "ch0-002", "ch0-003", "ch0-004", "ch0-005", "ch0-006", "ch0-007", "ch0-008", "ch0-009", "ch0-010", "ch0-011", "ch0-019"], "pl": []}, {"t": "Métabolites primaires et secondaires", "s": "Drogues végétales, Pharmacopée européenne, métabolites primaires et secondaires", "type": "n", "m": [], "q": ["ch0-q04", "ch0-q05", "vf50-3"], "c": ["ch0-012", "ch0-013", "ch0-014", "ch0-015", "ch0-016", "ch0-017", "ch0-018"], "pl": []}, {"t": "Questions d'examen", "s": "4 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch0:0", "lab": "Tombé à l'examen", "q": "Métabolites primaires et secondaires : définition, utilité pour la plante (et l'Homme)", "r": "**Primaires** : vitaux, communs à tous les organismes : glucides (énergie, structure), lipides (énergie, membranes), acides aminés/protéines, acides nucléiques, métabolites énergétiques phosphorés (ATP).\n**Secondaires** : non vitaux pour la cellule, très nombreux et variés, distribution restreinte (espèce, famille). La plante étant immobile, ils servent à : **se défendre** (odeurs, toxicité, amertume contre les herbivores ; antimicrobiens, phytoalexines) · **allélopathie** (juglone du noyer) · **protection** contre UV, gel · **attirer pollinisateurs et disperseurs** (couleurs, odeurs, phéromones mimées par certaines orchidées).\n**Pour l'Homme** : principes actifs des médicaments, toxiques, colorants, arômes, édulcorants, excipients."}, {"id": "p:ch0:1", "lab": "Nouvelle question au format examen", "q": "Quels sont les points principaux d'une monographie de drogue végétale de la Pharmacopée européenne ?", "r": "Titre (nom latin + français) · **Définition** (espèce, partie utilisée, état — entière/fragmentée, séchée — et **teneur minimale** en constituants) · Production (si pertinent) · **Caractères** (aspect macroscopique, odeur, saveur) · **Identification** : A macroscopie, B microscopie de la poudre (éléments caractéristiques), C **CCM** (et/ou réactions chimiques) · **Essais** : éléments étrangers, perte à la dessiccation, cendres totales, cendres insolubles dans HCl, indice d'amertume/de gonflement, métaux lourds, aflatoxines, résidus de pesticides, contamination microbienne, falsifications · **Dosage** (spectrophotométrie, CLHP, CPG, indices pour les huiles) · Conservation · Étiquetage."}, {"id": "p:ch0:2", "lab": "Nouvelle question au format examen", "q": "Schématisez les grandes voies de biosynthèse depuis la photosynthèse et placez les classes du cours", "r": "Photosynthèse → glucose → glycolyse : **PEP + érythrose-4-P** → **acide shikimique** → chorismate → Phe, Tyr, Trp. Phe → (PAL) → **acide cinnamique** → C6-C3 (phénylpropènes, coumarines, lignanes, curcumine, baumes) ; C6-C1 (benzoïque, vanilline, salicylés) ; acide gallique directement depuis le shikimate (tanins galliques).\nGlycolyse → **pyruvate** → **acétyl-CoA** → (1) malonyl-CoA → **voie des acétates/polycétides** : AG, quinones (anthraquinones), cycle A des flavonoïdes ; (2) **voie du mévalonate** → IPP/DMAPP (C5) → GPP C10 (monoterpènes, iridoïdes) → FPP C15 (sesquiterpènes) → GGPP C20 (diterpènes) ; 2 FPP → squalène C30 (triterpènes, stéroïdes, saponosides) ; 2 GGPP → C40 (caroténoïdes). (Il existe aussi la voie plastidiale du MEP/non-mévalonate.)\n**Voie mixte** (acétate + shikimate) : flavonoïdes, anthocyanes, tanins condensés, stilbènes, isoflavonoïdes.\n**Acides aminés** → alcaloïdes, hétérosides cyanogènes, glucosinolates, sulfoxydes de cystéine."}, {"id": "p:ch0:3", "lab": "Nouvelle question au format examen", "q": "Définissez : hétéroside, génine (aglycone), O- / C- / S- / N-hétéroside. Donnez un exemple de chaque. Quel est l'intérêt de la partie osidique ?", "r": "Hétéroside = ose(s) + partie non glucidique (génine/aglycone) liés par l'anomère de l'ose. **O** : rutoside, salicoside, sennosides · **C** (liaison C–C, résistante à l'hydrolyse acide → hydrolyse oxydative FeCl₃) : aloïne, acide carminique, vitexine · **S** : glucosinolates (thioglucose) · **N** : nucléosides. Le sucre ↑ la **solubilité dans l'eau**, la stabilité, conditionne le transport/stockage (vacuole) et souvent la pharmacocinétique (sennosides = prodrogues hydrolysées dans le côlon). Les génines sont plus lipophiles."}]}, {"id": "ch1", "num": "1", "t": "1. Glucides", "court": "Glucides", "sym": "hexa", "fam": "glu", "niveaux": [{"t": "Les oses simples", "s": "Aldoses, cétoses, Fischer et Haworth, anomères", "type": "n", "m": ["glucose", "galactose", "mannose", "fructose", "tagatose", "ribose", "xylose"], "q": ["ch1-q01", "ch1-q02", "ch1-q03", "ch1-q04", "ch1-q05", "ch1-q06", "ch1-q08", "ch1-q09", "ch1-q12", "ch1-q14", "ch1-q16", "ch1-q19", "ch1-q20", "ch1-q23", "ch1-q28", "ch1-q29", "ch1-q32", "ch1-q48", "mx00", "mx01", "mx02", "mx03", "vf50-4", "qcm51-1"], "c": ["ch1-001", "ch1-002", "ch1-003", "ch1-004", "ch1-005", "ch1-006", "ch1-007", "ch1-008", "ch1-009", "ch1-010", "ch1-011", "ch1-012", "ch1-013", "ch1-014", "ch1-015", "ch1-016", "ch1-017", "ch1-018", "ch1-019", "ch1-020", "ch1-021", "ch1-024", "ch1-028", "ch1-036", "ch1-039", "ch1-043", "ch1-044", "ch1-049", "ch1-050", "ch1-052", "ch1-071", "ch1-073", "ch1-078", "ch1-085", "ch1-090", "ch1-092", "ch1-102", "ch1-118", "ch1-123"], "pl": ["miel"], "lv": 0}, {"t": "Oses modifiés", "s": "Désoxyoses, acides uroniques, polyols, glucosamine, vitamine C", "type": "n", "m": ["rhamnose", "desoxyribose", "sorbitol", "mannitol", "xylitol", "acide-glucuronique", "acide-galacturonique", "acide-gluconique", "glucosamine", "vitamine-c"], "q": ["ch1-q07", "ch1-q10", "ch1-q11", "ch1-q15", "ch1-q39", "ch1-q42", "ch1-q43", "ch1-q44", "ch1-q46"], "c": ["ch1-022", "ch1-025", "ch1-026", "ch1-029", "ch1-030", "ch1-031", "ch1-032", "ch1-033", "ch1-034", "ch1-035", "ch1-037", "ch1-038", "ch1-040", "ch1-041", "ch1-042", "ch1-045", "ch1-046", "ch1-047", "ch1-048", "ch1-076", "ch1-097", "ch1-113", "ch1-114", "ch1-125", "ch1-129", "ch1-130", "ch1-131", "ch1-132", "ch1-133", "ch1-135"], "pl": ["acerola", "rosa-canina", "argousier", "sorbier", "frene-a-fleurs", "acacia-senegal", "ispaghul"], "lv": 1}, {"t": "Di- et oligosaccharides", "s": "Saccharose, lactose, lactulose, cyclodextrines, acarbose", "type": "n", "m": ["saccharose", "maltose", "lactose", "lactulose", "lactitol", "rutinose", "neohesperidose", "raffinose", "beta-cyclodextrine", "acarbose"], "q": ["ch1-q17", "ch1-q18", "ch1-q21", "ch1-q22", "ch1-q24", "ch1-q25", "ch1-q26", "mx04", "mx05", "mx06", "mx07", "mx08", "mx09", "mx10"], "c": ["ch1-051", "ch1-053", "ch1-054", "ch1-055", "ch1-056", "ch1-057", "ch1-058", "ch1-059", "ch1-060", "ch1-061", "ch1-062", "ch1-063", "ch1-064", "ch1-065", "ch1-066", "ch1-067", "ch1-068", "ch1-069", "ch1-072", "ch1-074", "ch1-075", "ch1-077", "ch1-079", "ch1-088"], "pl": ["betterave", "canne-a-sucre"], "lv": 2}, {"t": "Polysaccharides homogènes", "s": "Amidon, cellulose, inuline, dextranes, chitine", "type": "n", "m": ["amylose", "amylopectine", "cellulose", "inuline", "dextrane", "lentinane", "chitine", "chitosane"], "q": ["ch1-q13", "ch1-q27", "ch1-q30", "ch1-q31", "ch1-q41", "mx11", "mx12", "mx13"], "c": ["ch1-080", "ch1-081", "ch1-082", "ch1-083", "ch1-084", "ch1-086", "ch1-087", "ch1-091", "ch1-093", "ch1-094", "ch1-095", "ch1-120", "ch1-126", "ch1-127", "ch1-128"], "pl": ["cotonnier", "kapokier", "chicoree", "shiitake", "sterculia"], "lv": 3}, {"t": "Polysaccharides hétérogènes et fibres", "s": "Algues, gommes, mucilages, pectines, GAG, héparines", "type": "n", "m": ["alginate", "agar", "carraghenane", "gomme-arabique", "galactomannane", "pectine", "xanthane", "acide-hyaluronique", "chondroitine-sulfate", "heparine"], "q": ["ch1-q33", "ch1-q34", "ch1-q35", "ch1-q36", "ch1-q37", "ch1-q38", "ch1-q40", "ch1-q45", "ch1-q47", "mx14"], "c": ["ch1-023", "ch1-027", "ch1-070", "ch1-089", "ch1-096", "ch1-098", "ch1-099", "ch1-100", "ch1-101", "ch1-103", "ch1-104", "ch1-105", "ch1-106", "ch1-107", "ch1-108", "ch1-109", "ch1-110", "ch1-111", "ch1-112", "ch1-115", "ch1-116", "ch1-117", "ch1-119", "ch1-121", "ch1-122", "ch1-124", "ch1-134", "ch1-136", "ch1-137", "ch1-138", "ch1-139", "ch1-140"], "pl": ["lin", "chanvre", "astragalus-gummifer", "psyllium", "caroubier", "guar", "pommier", "fucus", "gelidium", "chondrus-crispus"], "lv": 4}, {"t": "Questions d'examen", "s": "37 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch1:0", "lab": "Liste du prof", "q": "Quelle est la différence entre les gommes vraies et les autres types de gommes ?", "r": "Les gommes dites vraies sont des **exsudats d'arbres ou d'arbustes** : polymères très ramifiés et très hétérogènes comportant divers oses et des **acides uroniques** (glucuronique ou galacturonique). Jadis adoucissants dans les sirops contre la toux, elles restent utilisées comme **gélifiants, épaississants et laxatifs de lest** (gomme arabique, adragante, de Sterculia). Les **mucilages** sont différents : composés d'unités de **mannose et de galactose** (galactomannanes), ce ne sont **pas des exsudats** mais des poudres obtenues par **broyage de l'albumen des graines**. La gomme **xanthane** est d'origine **bactérienne**, donc pas un exsudat non plus."}, {"id": "p:ch1:1", "lab": "Liste du prof", "q": "Quelle est la différence entre les fibres alimentaires et les autres polysaccharides (homogènes et hétérogènes) ?", "r": "Les fibres alimentaires sont des **polysaccharides autres que les glucanes α(1-4)** (amidon) ou des structures de type **lignine**. Elles peuvent être **solubles ou non** dans l'intestin ; on les appelle ainsi car on les retrouve dans l'**alimentation** : cellulose (glucose β1-4), hémicelluloses (chaînes de xylose + acide glucuronique et autres sucres), lignine (polymère de phénylpropènes) ; puis, solubles : pectines, gommes, mucilages, inuline. Les fibres arrivent **intactes dans le côlon** et ne sont dégradées que par la **flore commensale** → activité **prébiotique**."}, {"id": "p:ch1:2", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Amidon** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Homogène : amylose (Glc α1→4, linéaire) + amylopectine (α1→4 + ramifications α1→6)\n**Source** : Céréales, tubercules (pomme de terre), manioc\n**Usage** : Réserve glucidique végétale ; excipient (diluant, délitant) ; insoluble dans l'eau froide, empois à chaud", "img": ["img/schemas/ch1-amylose-amylopectine.png", "img/schemas/ch1-cellulose.png"]}, {"id": "p:ch1:3", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Cellulose** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Homogène : Glc β1→4 linéaire\n**Source** : Paroi végétale ; bois (délignification), coton\n**Usage** : Excipient (cellulose microcristalline, dérivés : MC, HPMC, CMC) ; coton hydrophile ; fibre insoluble"}, {"id": "p:ch1:4", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Inuline** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Fructane : Fru β2→1, glucose terminal, G(F)n n = 2-60\n**Source** : Racine de chicorée (industriel), ail, oignon, asperge, topinambour\n**Usage** : Fibre soluble **bifidogène**, prébiotique ; diurétique ; réserve à la place de l'amidon. La liaison β2→1 résiste à l'acide gastrique et aux enzymes digestives"}, {"id": "p:ch1:5", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Chitine / chitosane** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Homogène aminé : N-acétylglucosamine β1→4 ; chitosane = chitine partiellement désacétylée (NaOH à chaud) → cationique en milieu acide\n**Source** : Carapace de crustacés, cuticule d'insectes, paroi des champignons\n**Usage** : Biocompatible, hydratant, cicatrisant : peau artificielle, pansements (brûlures, cornée), fils de suture résorbables, implants dentaires, lentilles ; source de glucosamine"}, {"id": "p:ch1:6", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Dextrane** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Homogène : Glc α1→6 (+ ramifications α1→3)\n**Source** : Bactéries (*Leuconostoc mesenteroides*) sur saccharose\n**Usage** : Selon le PM : 60-70 000 = succédané du plasma (remplissage vasculaire) ; 40 000 = troubles thrombo-emboliques, micro-circulation ; 1 000 = prévention des réactions anaphylactiques aux dextranes ; larmes artificielles, collyres"}, {"id": "p:ch1:7", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Lentinane** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Homogène : glucane β1→3 avec ramifications β1→6\n**Source** : Shiitake (*Lentinula edodes*)\n**Usage** : Immunostimulant"}, {"id": "p:ch1:8", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Alginates** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène : acides mannuronique et guluronique (liaisons 1→4)\n**Source** : Algues brunes (laminaires, fucus)\n**Usage** : Gel « radeau » anti-reflux gastro-œsophagien ; pansements hémostatiques ; épaississant"}, {"id": "p:ch1:9", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Agar-agar** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène : galactose + 3,6-anhydrogalactose (+ ac. galacturonique, sulfates)\n**Source** : Algues rouges (*Gelidium*)\n**Usage** : Soluble à chaud, gel ferme au refroidissement, non assimilable : milieux de culture, électrophorèse ; laxatif de lest, pansement gastro-intestinal ; gélifiant alimentaire (remplace la gélatine)"
