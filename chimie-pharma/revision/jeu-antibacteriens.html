ges","06-fosfomycine-peptidoglycane","06-trometamol-paire-ions","06-fosfomycine-urinaire","06-tuberculose","06-tb-deux-phases","06-tb-intention","06-tb-resistance-monotherapie","06-tb-acides-mycoliques","06-inh-imao","06-bedaquiline-atp","06-bcg","06-lepre-traitement","06-dapsone-acide-folique"]},{"t":"Questions d'examen","s":"Ce que le prof a demandé en cours, parties 1 et 2","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre mélangé, comme le jour J","type":"boss"}],"cartes":[{"id":"p:antibacteriens:0","lab":"Question du prof · 18/09/2025","q":"Parlez-moi des sulfamidés antibactériens : comment ont-ils été découverts, relations structure-activité, mécanisme d'action, classification systématique ; donnez des exemples (systémiques, urinaires, intestinaux) et les principaux effets indésirables. (« pas une virgule en moins »)","r":"Découverte : PRONTOSIL® (Domagk, Nobel 1939), colorant azoïque inactif in vitro, pro-drogue libérant in vivo le sulfanilamide. RSA : benzène non substitué, NH2 aromatique primaire en para (ou groupe labile azo/amide), SO2NH substituable (hétérocycle -> pharmacocinétique). Mécanisme : analogue du PABA, inhibition compétitive de la dihydroptéroate synthétase -> plus d'acide folique bactérien ; bactériostatique ; toxicité sélective car l'homme trouve l'acide folique dans l'alimentation. Classification : systémiques/urinaires (sulfaméthoxazole, dans BACTRIM®), intestinaux (sulfasalazine, SALAZOPYRINE®), usage externe (sulfadiazine argentique, FLAMMAZINE®). Effets indésirables : allergies cutanées (Stevens-Johnson), troubles sanguins, cristallurie, grossesse (1er trimestre) ; résistances -> indications restreintes."},{"id":"p:antibacteriens:1","lab":"Question du prof · 18/09/2025","q":"Expliquez le mécanisme d'action des sulfamidés antibactériens.","r":"Analogue structural du PABA : le sulfamidé entre en compétition avec lui et inhibe la dihydroptéroate synthétase, enzyme qui incorpore le PABA pour former l'acide dihydroptéroïque puis l'acide folique. Sans folates (THF), pas de synthèse des bases puriques et de la thymidine -> la bactérie ne se divise plus : effet bactériostatique."},{"id":"p:antibacteriens:2","lab":"Question du prof · 18/09/2025","q":"Quel est l'intérêt de l'association sulfaméthoxazole + triméthoprime au niveau mécanistique au sein de la bactérie ?","r":"Double blocage séquentiel de la même voie : le sulfaméthoxazole inhibe la DHPS (synthèse de l'acide folique), le triméthoprime inhibe la dihydrofolate réductase (réduction DHF -> THF). Effet synergique, moins de résistances : co-trimoxazole (BACTRIM®, EUSAPRIM®), rapport 1 : 5."},{"id":"p:antibacteriens:3","lab":"Question du prof · 18/09/2025","q":"Le triméthoprime est-il un sulfamidé antibactérien ? Pourquoi ?","r":"Non : il n'a pas de fonction sulfonamide (c'est une 2,4-diaminopyrimidine). C'est pourtant un antibactérien : il inhibe sélectivement la dihydrofolate réductase bactérienne, en aval des sulfamidés."},{"id":"p:antibacteriens:4","lab":"Question du prof · 18/09/2025","q":"La mésalazine est-elle un sulfamidé antibactérien ? Quelle est l'indication de la sulfasalazine et pourquoi agit-elle au niveau intestinal ?","r":"Non, la mésalazine (acide 5-aminosalicylique) est un anti-inflammatoire, pas un sulfamidé antibactérien. La sulfasalazine (SALAZOPYRINE®) est une pro-drogue : la liaison azo est coupée par les bactéries du côlon, libérant sulfapyridine + mésalazine, qui agit localement dans l'intestin : maladie de Crohn, rectocolite ulcéreuse (aussi polyarthrite rhumatoïde)."},{"id":"p:antibacteriens:5","lab":"Question du prof · 18/09/2025","q":"Vrai ou faux : les sulfamidés antibactériens sont à l'origine des antidiabétiques oraux (sulfamides hypoglycémiants).","r":"Vrai. On a observé un effet hypoglycémiant de certains sulfamidés antibactériens, ce qui a conduit aux sulfamides hypoglycémiants (antidiabétiques oraux)."},{"id":"p:antibacteriens:6","lab":"Question du prof · 18/09/2025","q":"Vrai ou faux : la pénicilline a été découverte pendant la Première Guerre mondiale.","r":"Faux. Fleming a découvert la pénicilline en 1928 (entre les deux guerres) ; elle a été produite industriellement pendant la Seconde Guerre mondiale."},{"id":"p:antibacteriens:7","lab":"Question du prof · 18/09/2025","q":"Tableau : pour chaque classe d'antibiotiques, donnez la cible moléculaire, un exemple (DCI, nom commercial), bactéricide ou bactériostatique, et la structure générale qui explique le mécanisme.","r":"β-lactames (pénicillines, céphalosporines) : transpeptidases de la paroi, ex. amoxicilline, bactéricides, noyau β-lactame. Aminosides : sous-unité 30S, ex. gentamicine, bactéricides, aminoses liés à un aminocyclitol. Tétracyclines : 30S, ex. doxycycline (VIBRATAB®), bactériostatiques, 4 cycles accolés. Macrolides : 50S, ex. clarithromycine (BICLAR®), bactériostatiques, macrocycle lactonique + oses. Chloramphénicol : 50S, bactériostatique. Quinolones : ADN gyrase/topo-isomérase IV, ex. ciprofloxacine (CIPROXINE®), bactéricides, acide 4-oxo-quinoléine-3-carboxylique. Sulfamidés : DHPS, sulfaméthoxazole, bactériostatiques, sulfonamide en para du NH2."},{"id":"p:antibacteriens:8","lab":"Question du prof · 18/09/2025","q":"Des molécules agissent sur des bactéries Gram + : pourquoi agissent-elles sur certains Gram + et pas sur certains Gram – ?","r":"La paroi des Gram + est épaisse (peptidoglycane) mais directement accessible ; celle des Gram – est fine mais protégée par une membrane externe (LPS) que la molécule doit traverser par des porines. Une molécule peu hydrophile ou volumineuse atteint mal sa cible chez les Gram – ; certaines bactéries produisent aussi des β-lactamases. D'où un spectre surtout Gram + (péni G) et l'élargissement vers les Gram – par des groupes hydrophiles (NH2 des aminopénicillines)."},{"id":"p:antibacteriens:9","lab":"Question du prof · 18/09/2025","q":"Parlez-moi des pénicillines : découverte, structure chimique générale, mécanisme d'action, pourquoi certaines sont acido-résistantes et d'autres sensibles aux β-lactamases ; inhibiteurs de β-lactamases ; pénicillines à spectre élargi, en particulier les aminopénicillines.","r":"Voir la question ouverte 1 de la fiche examen : découverte (Fleming 1928, Penicillium) ; structure (β-lactame + thiazolidine, valine + cystéine, COOH, chaîne R) ; mécanisme (analogue du D-Ala-D-Ala, acylation des transpeptidases, bactéricide) ; acido-résistance (R attracteur : péni V) ; résistance aux pénicillinases (R encombrant : flucloxacilline) ; inhibiteurs de β-lactamases (acide clavulanique, AUGMENTIN®) ; spectre élargi (aminopénicillines ampicilline, amoxicilline ; témocilline ; pipéracilline + tazobactam)."},{"id":"p:antibacteriens:10","lab":"Question du prof · 25/09/2025","q":"Décrivez la structure générale d'une pénicilline (à dessiner et expliquer).","r":"Bicycle 6-APA : cycle β-lactame (azétidinone, amide cyclique à 4 atomes tendu) accolé au cycle thiazolidine (S, 2 méthyles), dérivé de la condensation valine + cystéine ; COOH en C2 (acide, pKa ≈ 2,7) ; amide exocyclique NH-CO-R en C6 : le radical R module acido-résistance, résistance aux β-lactamases et spectre."},{"id":"p:antibacteriens:11","lab":"Question du prof · 25/09/2025","q":"Expliquez d'un point de vue structurel le mécanisme d'action d'une pénicilline ; quel est son pharmacophore ?","r":"Le pharmacophore est le noyau β-lactame : sa conformation mime le dipeptide D-Ala-D-Ala terminal du peptidoglycane. La transpeptidase (PBP) attaque le carbonyle du β-lactame tendu et reste acylée (ester stable) : plus de pontage du peptidoglycane -> paroi fragile -> lyse : bactéricide."},{"id":"p:antibacteriens:12","lab":"Question du prof · 25/09/2025","q":"Que sont les β-lactamines ? Mécanisme d'action du noyau β-lactame sur la paroi ; quelles pénicillines obtient-on par hémisynthèse ?","r":"β-lactamines = antibiotiques contenant un noyau β-lactame (pénicillines, céphalosporines, carbapénèmes, monobactames). Le β-lactame acyle les transpeptidases de la paroi. Par hémisynthèse (6-APA + différentes chaînes R) on obtient : péni V (acido-résistante), flucloxacilline (résistante aux pénicillinases), aminopénicillines ampicilline/amoxicilline (spectre élargi), carboxy- et uréidopénicillines."},{"id":"p:antibacteriens:13","lab":"Question du prof · 25/09/2025","q":"Pourquoi une pénicilline est-elle acido-résistante et une autre pas, sur base de la structure chimique ?","r":"En milieu acide, l'oxygène du carbonyle de la chaîne latérale attaque le β-lactame tendu (réarrangement). Si R est électro-attracteur (péni V : O-phényle), cet oxygène est moins nucléophile : acido-résistante, utilisable per os. Péni G (benzyle) : acido-sensible, injectable."},{"id":"p:antibacteriens:14","lab":"Question du prof · 25/09/2025","q":"Parlez-moi de la pénicilline V (PENI-ORAL).","r":"Pénicilline V = phénoxyméthylpénicilline, première pénicilline active par voie orale grâce au groupement phénoxy électro-attracteur (acido-résistante) ; reste sensible aux pénicillinases ; ancien nom commercial PENI-ORAL® (péni + oral, sans S)."},{"id":"p:antibacteriens:15","lab":"Question du prof · 09/10/2025","q":"Sur base de la structure de la pénicilline, donnez un exemple de simplification moléculaire utilisé aujourd'hui (monobactame, aztréonam) ; dessinez le noyau.","r":"Monobactame : on ne garde que le cycle β-lactame (monocyclique), suffisant pour l'activité ; modèle naturel la nocardicine. Aztréonam (AZACTAM®, CAYSTON® en inhalation, mucoviscidose) : monobactame de synthèse actif sur les Gram – (Pseudomonas). Dessiner l'azétidinone portant le groupe sulfonique sur l'azote."},{"id":"p:antibacteriens:16","lab":"Question du prof · 09/10/2025","q":"Un inhibiteur de β-lactamase est-il un antibiotique ? Pourquoi ? Pourquoi l'associe-t-on à l'amoxicilline ? Peut-on l'associer à un antibiotique non β-lactame ?","r":"Non : l'acide clavulanique a un noyau β-lactame mais pas d'activité antibactérienne utile ; c'est un inhibiteur irréversible (suicide) des β-lactamases. On l'associe à l'amoxicilline (AUGMENTIN®) pour la protéger des bactéries productrices de β-lactamases. Avec un antibiotique non β-lactame, aucun intérêt : il protège seulement les β-lactames."},{"id":"p:antibacteriens:17","lab":"Question du prof · 09/10/2025","q":"Quels sont le mécanisme d'action et les indications de la doxycycline ?","r":"Tétracycline : fixation à la sous-unité 30S du ribosome (bloque la fixation de l'ARNt), bactériostatique. Indications retenues par le prof : infections bactériennes (et acné, seule ou avec la minocycline/lymécycline), paludisme (prophylaxie), maladie de Lyme. VIBRATAB®."},{"id":"p:antibacteriens:18","lab":"Question du prof · 09/10/2025","q":"Citez au moins trois classes d'antibiotiques utilisées dans le traitement de l'acné (usage interne ou externe).","r":"Tétracyclines (doxycycline, minocycline, lymécycline TETRALYSAL®) en usage interne ; macrolides (érythromycine en usage externe) ; lincosamides (clindamycine, DALACIN C®)."},{"id":"p:antibacteriens:19","lab":"Question du prof · 16/10/2025","q":"Quinolones : structure, mécanisme d'action, générations, résistances, indications et pourquoi leur usage est aujourd'hui limité.","r":"Structure : acide 4-oxo-1,4-dihydroquinoléine-3-carboxylique ; fluor en 6 et pipérazine en 7 = fluoroquinolones (ciprofloxacine). Mécanisme : inhibition de l'ADN gyrase (topo-isomérase II) et de la topo-isomérase IV -> bactéricide. Générations : 1re acide nalidixique (urinaire), 2e ciprofloxacine, ofloxacine, lévofloxacine (énantiomère pur), 3e moxifloxacine (pneumo). Effets indésirables : tendinites/rupture du tendon d'Achille, allongement du QT, photosensibilisation, grossesse/enfant. Résistances -> l'EMA limite leur usage aux infections où d'autres antibiotiques ne conviennent pas."},{"id":"p:antibacteriens:20","lab":"Question du prof · 20/11/2025","q":"Parlez-moi des tétracyclines au sens large : structure générale, mécanisme (30S), effets indésirables liés à la fixation du calcium, indications particulières.","r":"Structure générale : 4 cycles accolés (naphtacène) portant OH, cétones et amines (amphotères, jaunes). Mécanisme : sous-unité 30S, bactériostatique. Effets indésirables : chélation du calcium -> coloration des dents et dépôts osseux (pas avant 8 ans, ni fin de grossesse/allaitement) ; diminution d'absorption avec lait, antiacides, fer ; photosensibilisation. Indications : doxycycline (infections, acné, paludisme, Lyme), minocycline, lymécycline (acné)."},{"id":"p:antibacteriens:21","lab":"Question du prof · 20/11/2025","q":"Parlez-moi du chloramphénicol (structure, mécanisme) ; quelle alternative peut-on utiliser (thiamphénicol, aérosol) ?","r":"Chloramphénicol : nitrobenzène + propanediol + dichloroacétamide ; se fixe sur la 50S, bactériostatique ; toxicité hématologique grave (aplasie médullaire idiosyncrasique) -> usage local (collyre). Alternative : thiamphénicol (le NO2 remplacé par SO2CH3, pas d'aplasie), URFAMYCINE® ; FLUIMUCIL ANTIBIOTIC® = glycinate de thiamphénicol + acétylcystéine en aérosol. Palmitate de chloramphénicol pour masquer l'amertume."},{"id":"p:antibacteriens:22","lab":"Question du prof · 17/09/2026","q":"Parlez-moi de l'amoxicilline : mécanisme d'action, effets indésirables ; pourquoi met-on de l'amoxicilline et pas une tétracycline ?","r":"Amoxicilline : aminopénicilline (péni G + NH2), inhibe les transpeptidases -> bactéricide ; spectre élargi vers certains Gram – ; acido-résistante, bonne biodisponibilité orale ; sensible aux β-lactamases (d'où AUGMENTIN®). Effets indésirables : allergie, diarrhée, éruptions. Préférée à une tétracycline car bactéricide, utilisable chez l'enfant et la femme enceinte, sans chélation du calcium."},{"id":"p:antibacteriens:23","lab":"Question du prof · 17/09/2026","q":"Parlez-moi de la pénicilline sensible aux pénicillinases et acido-sensible (question ouverte d'une page).","r":"Pénicilline G (benzylpénicilline) : sensible aux pénicillinases et acido-sensible -> injectable ; PENICILLINE®, forme retard EXTENCIN® (sel de benzathine). Spectre surtout Gram + (streptocoques, syphilis). Dessiner la structure (bleu souligné). Comparer avec péni V (acido-résistante) et flucloxacilline (résistante aux pénicillinases)."},{"id":"p:antibacteriens:24","lab":"Question du prof · 17/09/2026","q":"Que se passe-t-il dans une bactérie si elle ne synthétise plus d'acide folique ? Et chez l'humain en cas de carence ?","r":"Bactérie : plus de THF -> plus de bases puriques ni de thymidine -> plus de réplication : arrêt de la croissance (bactériostatique). Humain : carence en folates -> anémie macrocytaire (mégaloblastique), troubles de la division cellulaire, anomalies de fermeture du tube neural chez le fœtus (d'où acide folique, FOLAVIT®, en début de grossesse)."},{"id":"p:antibacteriens:25","lab":"Question du prof · Notion","q":"Comment ont été découverts les sulfamides antibactériens ? Décrivez la découverte fortuite des sulfamides hypoglycémiants et dessinez leur structure.","r":"Découverte : PRONTOSIL® (colorant azoïque) -> sulfanilamide (pro-drogue). Sulfamides hypoglycémiants : effet hypoglycémiant observé chez des patients traités par des sulfamidés antibactériens -> développement des sulfonylurées (structure : Ar-SO2-NH-CO-NH-R)."},{"id":"p:antibacteriens:26","lab":"Question du prof · Notion","q":"Quelle est la structure de l'acide folique et son autre nom ? Dessinez la structure d'un sulfonamide.","r":"Acide folique = acide ptéroylglutamique (vitamine B9) : noyau ptéridine + PABA + acide glutamique. Sulfonamide : Ar-SO2-NH2 ; sulfanilamide : benzène avec NH2 et SO2NH2 en para."},{"id":"e1:antibacteriens:0:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des pénicillines. → Découverte et origine","r":"Fleming (1928), Penicillium notatum ; c'est un antibiotique au sens strict (produit par un micro-organisme) ; production industrielle pendant la Seconde Guerre mondiale. Hémisynthèse à partir de l'acide 6-aminopénicillanique (6-APA) obtenu par la pénicilline amidase."},{"id":"e1:antibacteriens:0:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des pénicillines. → Structure générale (à dessiner)","r":"Bicycle condensant valine + cystéine : cycle β-lactame (amide cyclique à 4 atomes, très tendu) accolé au cycle thiazolidine ; COOH en position 2 (pKa ≈ 2,7) ; amide exocyclique portant le radical R qui module les propriétés."},{"id":"e1:antibacteriens:0:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des pénicillines. → Mécanisme d'action","r":"Le noyau β-lactame mime l'extrémité D-Ala-D-Ala du peptidoglycane : il acyle de façon covalente les DD-transpeptidases (PBP) -> plus de pontage du peptidoglycane -> lyse : bactéricide, temps-dépendant. Plus actif sur Gram + (paroi épaisse, accessible) que sur Gram – (membrane externe à traverser)."},{"id":"e1:antibacteriens:0:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des pénicillines. → Pourquoi acido-résistante ou non","r":"En milieu acide, l'oxygène du carbonyle de la chaîne R attaque le β-lactame tendu. Un R électro-attracteur (péni V : phénoxyméthyl) diminue cette réactivité -> acido-résistante, active per os ; péni G : acido-sensible, injectable."},{"id":"e1:antibacteriens:0:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des pénicillines. → Résistance aux β-lactamases","r":"Les pénicillinases hydrolysent le β-lactame. Un R encombrant (flucloxacilline : isoxazolyl substitué) protège le carbonyle -> pénicilline résistante aux pénicillinases (staphylocoques producteurs)."},{"id":"e1:antibacteriens:0:5","lab":"Question ouverte · partie 1","q":"Parlez-moi des pénicillines. → Classification + exemples","r":"Sensibles aux pénicillinases et acido-sensible : pénicilline G (PENICILLINE®, forme retard EXTENCIN® avec benzathine). Acido-résistante : pénicilline V (PENI-ORAL®). Résistante aux pénicillinases : flucloxacilline (FLOXAPEN®, STAPHYCID®). Spectre élargi : aminopénicillines ampicilline, amoxicilline (AMOXICILLINE SANDOZ®…) ; carboxypénicilline témocilline (NEGABAN®) ; uréidopénicilline pipéracilline (+ tazobactam)."},{"id":"e1:antibacteriens:0:6","lab":"Question ouverte · partie 1","q":"Parlez-moi des pénicillines. → Inhibiteurs de β-lactamases","r":"Acide clavulanique (AUGMENTIN® avec amoxicilline), sulbactam, tazobactam : β-lactames sans activité antibiotique propre, inhibiteurs irréversibles (suicide) des β-lactamases, associés uniquement à un β-lactame."},{"id":"e1:antibacteriens:0:7","lab":"Question ouverte · partie 1","q":"Parlez-moi des pénicillines. → Effets indésirables","r":"Allergie (souvent surestimée ; hypersensibilité de type I, IgE), troubles digestifs, réaction croisée possible avec les céphalosporines."},{"id":"e1:antibacteriens:1:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des sulfamidés antibactériens. → Découverte","r":"PRONTOSIL® (Domagk, Nobel 1939) : colorant azoïque inactif in vitro, pro-drogue libérant le sulfanilamide in vivo. Effet hypoglycémiant observé -> sulfamides hypoglycémiants (antidiabétiques oraux)."},{"id":"e1:antibacteriens:1:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des sulfamidés antibactériens. → Relations structure-activité","r":"Benzène non substitué ; NH2 aromatique primaire en para du SO2NH (ou groupe labile libérant le NH2 : azo, amide) ; le sulfonamide peut être substitué sur l'azote (hétérocycle) -> pharmacocinétique."},{"id":"e1:antibacteriens:1:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des sulfamidés antibactériens. → Mécanisme d'action","r":"Analogue structural du PABA : inhibition compétitive de la dihydroptéroate synthétase -> plus de synthèse d'acide folique par la bactérie (l'homme le trouve dans l'alimentation : toxicité sélective). Effet bactériostatique."},{"id":"e1:antibacteriens:1:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des sulfamidés antibactériens. → Association au triméthoprime","r":"Triméthoprime : inhibiteur sélectif de la DHFR bactérienne (pas un sulfamidé). Double blocage séquentiel de la voie des folates : co-trimoxazole (BACTRIM®, EUSAPRIM®), rapport 1 : 5."},{"id":"e1:antibacteriens:1:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des sulfamidés antibactériens. → Classification et exemples","r":"Systémique/urinaire : sulfaméthoxazole (dans BACTRIM®). Intestinal : sulfasalazine (SALAZOPYRINE®), pro-drogue scindée par les bactéries coliques en sulfapyridine + mésalazine (anti-inflammatoire, Crohn/RCH ; PENTASA®, CLAVERSAL®). Usage externe : sulfadiazine argentique (FLAMMAZINE®, brûlures)."},{"id":"e1:antibacteriens:1:5","lab":"Question ouverte · partie 1","q":"Parlez-moi des sulfamidés antibactériens. → Effets indésirables","r":"Allergies cutanées (Stevens-Johnson), troubles hématologiques, cristallurie ; grossesse (antifolate, 1er trimestre) : éviter, supplémenter en acide folique si inévitable. Résistances -> indications aujourd'hui restreintes."},{"id":"e2:antibacteriens:0","lab":"QROC · partie 2","q":"Le triméthoprime est-il un sulfamidé antibactérien ? Pourquoi l'associe-t-on au sulfaméthoxazole ?","r":"Non : il ne possède pas la fonction sulfonamide (c'est une 2,4-diaminopyrimidine). C'est un antibactérien qui inhibe la dihydrofolate réductase bactérienne (sélectivité ~ 40 000 vs humaine). Associé au sulfaméthoxazole (inhibiteur de la DHPS en amont), il bloque deux étapes successives de la voie des folates : effet synergique (co-trimoxazole, BACTRIM®)."},{"id":"e2:antibacteriens:1","lab":"QROC · partie 2","q":"Un inhibiteur de β-lactamase est-il un antibiotique ?","r":"Non. L'acide clavulanique possède un noyau β-lactame mais n'a pas d'activité antibactérienne utile : il se lie de façon irréversible aux β-lactamases et protège l'antibiotique associé. Il n'a donc d'intérêt qu'avec un β-lactame sensible aux β-lactamases (amoxicilline : AUGMENTIN®) ; associé à un antibiotique non β-lactame, il ne sert à rien."},{"id":"e2:antibacteriens:2","lab":"QROC · partie 2","q":"Pourquoi la pénicilline V est-elle active par voie orale et pas la pénicilline G ?","r":"Le groupement phénoxyméthyl de la péni V est électro-attracteur : il diminue la nucléophilie de l'oxygène du carbonyle de la chaîne latérale, qui en milieu acide attaque le β-lactame tendu. La péni V est donc acido-résistante (PENI-ORAL®) ; la péni G est hydrolysée dans l'estomac et s'administre en injection."},{"id":"e2:antibacteriens:3","lab":"QROC · partie 2","q":"Pourquoi les tétracyclines sont-elles déconseillées chez l'enfant de moins de 8 ans et la femme enceinte ?","r":"Leurs fonctions OH/cétone forment des chélates stables avec le calcium : fixation dans les dents (coloration jaune) et les os en croissance. La même chélation (Ca, Mg, Fe, antiacides, lait) diminue l'absorption digestive."}]},{"id":"antimycosiques","t":"Antimycosiques","court":"Antimycosiques","img":"icons/antimycosiques-180.png","sym":"flask","niveaux":[{"t":"Ergostérol et azolés","s":"Cible, imidazolés, triazolés, interactions","type":"n","m":["imidazole","triazole","clotrimazole","bifonazole","isoconazole","miconazole","ketoconazole","itraconazole","posaconazole","fluconazole","voriconazole","ergosterol"],"q":["07-q01","07-q02","07-q13","07-q14","07-q15","07-q16","07-q21","07-q26","07-q27","07-q28","07-q29"],"c":["07-mycoses-locales-generalisees","07-dermatomycoses","07-azoles-ergosterol","07-cyp51-interactions","07-ketoconazole-hepatotoxicite","07-ketoconazole-cushing","07-triazoles-per-os","07-azoles-interactions","07-nitroimidazoles-meca","07-rouge-iso-miconazole","07-rouge-triazole-n","07-rouge-ergosterol-cholesterol"]},{"t":"Les autres antifongiques","s":"Polyènes, allylamines, morpholine, échinocandines, griséofulvine","type":"n","m":["griseofulvine","terbinafine","amorolfine","amphotericine-b","nystatine","caspofungine","acide-undecylenique","iode","sulfure-de-selenium","dequalinium"],"q":["07-q05","07-q06","07-q07","07-q08","07-q09","07-q10","07-q11","07-q25"],"c":["07-cibles-antimycosiques","07-dermatophytes","07-tubuline-mitose","07-medicaments-tubuline","07-polyenes-usage","07-amphotericine-formes","07-nystatine-oropharynx","07-squalene-epoxydase","07-paroi-chitine-glucane"]},{"t":"Questions d'examen","s":"Ce que le prof a demandé en cours, parties 1 et 2","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre mélangé, comme le jour J","type":"boss"}],"cartes":[{"id":"p:antimycosiques:0","lab":"Question du prof · 18/09/2025","q":"Les antifongiques azolés inhibent une enzyme clé de la synthèse de l'ergostérol : laquelle ?","r":"La lanostérol 14-α-déméthylase (CYP51), enzyme à cytochrome P450 de la synthèse de l'ergostérol."},{"id":"p:antimycosiques:1","lab":"Question du prof · 18/09/2025","q":"Pourquoi s'appellent-ils « azolés », quel est leur mécanisme d'action ?","r":"« Azolés » car ils portent un noyau azole : imidazole (2 N) ou 1,2,4-triazole (3 N). L'azote non substitué se lie au fer de l'hème de la 14-α-déméthylase -> plus d'ergostérol, accumulation de stérols méthylés toxiques -> membrane fongique altérée (fongistatique)."},{"id":"p:antimycosiques:2","lab":"Question du prof · 16/10/2025","q":"Expliquez pourquoi le mécanisme d'action des azolés explique les interactions médicamenteuses rencontrées chez les patients.","r":"La cible est un CYP : l'azole se lie aussi aux CYP humains (surtout 3A4) et augmente les concentrations des médicaments qu'ils métabolisent. Le même mécanisme explique l'hépatotoxicité et l'inhibition de la synthèse des stéroïdes (kétoconazole)."},{"id":"p:antimycosiques:3","lab":"Question du prof · 13/11/2025","q":"Peut-on utiliser le kétoconazole chez un patient sous corticoïdes oraux ? Pourquoi ?","r":"Non : le kétoconazole inhibe la synthèse endogène de cortisol (utilisé dans le syndrome de Cushing) et les CYP qui métabolisent les corticoïdes : risque d'interaction et de déséquilibre ; incohérent avec un traitement corticoïde."},{"id":"e1:antimycosiques:0:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimycosiques azolés. → Cible et mécanisme","r":"Inhibition de la lanostérol 14-α-déméthylase (CYP51), enzyme à cytochrome P450 de la synthèse de l'ergostérol, stérol de la membrane fongique (≠ cholestérol humain). L'azote N3 (imidazole) ou N4 (triazole) se coordonne au fer de l'hème."},{"id":"e1:antimycosiques:0:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimycosiques azolés. → Structures","r":"Noyau imidazole (2 N) ou 1,2,4-triazole (3 N) dont un azote est substitué par des noyaux aromatiques (souvent halogénés)."},{"id":"e1:antimycosiques:0:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimycosiques azolés. → Imidazolés (surtout usage local)","r":"Clotrimazole (CANESTENE®), miconazole (DAKTARIN®), bifonazole, isoconazole (TRAVOGEN®) ; kétoconazole (NIZORAL®, usage externe : hépatotoxique per os)."},{"id":"e1:antimycosiques:0:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimycosiques azolés. → Triazolés (per os, systémiques)","r":"Fluconazole (DIFLUCAN®), itraconazole (SPORANOX®), voriconazole (VFEND®), posaconazole (NOXAFIL®)."},{"id":"e1:antimycosiques:0:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimycosiques azolés. → Interactions et effets indésirables","r":"Inhibition des CYP humains (CYP3A4) -> augmentation des taux d'autres médicaments ; kétoconazole : hépatotoxicité, inhibition de la stéroïdogenèse (utilisé dans le syndrome de Cushing)."},{"id":"e1:antimycosiques:1:0","lab":"Question ouverte · partie 1","q":"Classez les antimycosiques selon leur cible. → Membrane - ergostérol","r":"Polyènes (amphotéricine B : ABELCET®, AMBISOME® ; nystatine) se fixent sur l'ergostérol et forment des pores. Azolés et allylamines (terbinafine, LAMISIL® : squalène époxydase) et morpholines (amorolfine, LOCERYL®) bloquent sa synthèse."},{"id":"e1:antimycosiques:1:1","lab":"Question ouverte · partie 1","q":"Classez les antimycosiques selon leur cible. → Paroi fongique","r":"Échinocandines (caspofungine, CANCIDAS®) : inhibition de la β-1,3-glucane synthase."},{"id":"e1:antimycosiques:1:2","lab":"Question ouverte · partie 1","q":"Classez les antimycosiques selon leur cible. → Microtubules","r":"Griséofulvine : inhibe la polymérisation de la tubuline (dermatophytes)."},{"id":"e1:antimycosiques:1:3","lab":"Question ouverte · partie 1","q":"Classez les antimycosiques selon leur cible. → Autres","r":"Antiseptiques : polyvidone iodée (ISOBETADINE®), acide undécylénique, sulfure de sélénium, chlorure de déqualinium."},{"id":"e2:antimycosiques:0","lab":"QROC · partie 2","q":"Pourquoi les azolés provoquent-ils de nombreuses interactions médicamenteuses ?","r":"Parce que leur cible, la 14-α-déméthylase, est un cytochrome P450 : l'azote du noyau azolé se lie au fer de l'hème. La sélectivité pour le CYP fongique n'est que partielle : ils inhibent aussi les CYP hépatiques humains (surtout 3A4), d'où l'augmentation des concentrations des médicaments métabolisés par ces enzymes."},{"id":"e2:antimycosiques:1","lab":"QROC · partie 2","q":"Qu'est-ce qui distingue l'ergostérol du cholestérol et pourquoi est-ce utile ?","r":"L'ergostérol (stérol fongique) possède des doubles liaisons supplémentaires (C7-C8, C22) et un méthyle en C24. Cette différence permet une certaine sélectivité des polyènes (affinité supérieure pour l'ergostérol) et des inhibiteurs de sa synthèse."}]},{"id":"antiprotozoaires","t":"Antiprotozoaires et antimalariques","court":"Antiprotozoaires","img":"icons/antiprotozoaires-180.png","sym":"flask","niveaux":[{"t":"Nitroimidazolés et amoebicides","s":"Métronidazole, émétine, pentamidine, atovaquone","type":"n","m":["emetine","metronidazole","ornidazole","tinidazole","nimorazole","niridazole","praziquantel","pentamidine","atovaquone"],"q":["07-q17","07-q18","07-q20","07-q22","07-q23","07-q24"],"c":["07-protozoaires","07-alcaloides","07-amoebicides","07-nitroimidazoles-meca","07-helicobacter-pylori","07-trypanosomiases","07-pentamidine-arn","08-paludisme","08-cycle-asexue","08-paludisme-cerebral","08-cycle-sexue","08-formes-hepatiques","08-prevention-anophele","08-vaccin-mosquirix","08-primaquine","08-amidines"]},{"t":"Antimalariques","s":"Quinoléines, artémisinine, proguanil, pyriméthamine","type":"n","m":["chloroquine","quinine","quinidine","hydroxychloroquine","mefloquine","lumefantrine","artemisinine","artemether","artesunate","proguanil","pyrimethamine"],"q":["07-q21","08-q1","08-q2","08-q3","08-q4","08-q5","08-q6","08-q8","08-q9","08-q10","08-q11","08-q12"],"c":["08-heme-hemozoine","08-prodrogue-proguanil","08-dhfr-parasite","08-pont-peroxyde","08-toxoplasmose","08-chimioprophylaxie","08-traitement-malaria"]},{"t":"Questions d'examen","s":"Ce que le prof a demandé en cours, parties 1 et 2","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre mélangé, comme le jour J","type":"boss"}],"cartes":[{"id":"p:antiprotozoaires:0","lab":"Question du prof · 23/10/2025","q":"Parlez-moi du mécanisme d'action des dérivés nitrofuranes ou nitroimidazolés ; donnez des exemples et des indications particulières.","r":"Groupe NO2 réduit dans les micro-organismes anaérobies -> intermédiaires radicalaires qui lèsent l'ADN. Nitrofuranes : nitrofurantoïne (FURADANTINE®, infections urinaires), nifuroxazide. Nitroimidazolés : métronidazole (FLAGYL®) : amibiase, trichomonase, vaginites, anaérobies, Helicobacter pylori ; effet antabuse avec l'alcool."},{"id":"p:antiprotozoaires:1","lab":"Question du prof · 23/10/2025","q":"Dans l'éradication d'Helicobacter pylori, on utilise une trithérapie : quels sont les trois produits ? Parlez-moi de leur mécanisme d'action.","r":"Amoxicilline (paroi, transpeptidases), clarithromycine (ribosome 50S ; HELICLAR®, BICLAR®), métronidazole (réduction du nitro, ADN), avec un inhibiteur de la pompe à protons."},{"id":"p:antiprotozoaires:2","lab":"Question du prof · 23/10/2025","q":"Le triméthoprime est-il un sulfamidé antibactérien ? Pourquoi a-t-il des propriétés antibactériennes avec le sulfaméthoxazole ? (question reprise au cours sur le proguanil)","r":"Non, pas de fonction sulfonamide. Il inhibe la DHFR, en aval de la DHPS inhibée par le sulfamidé : double blocage de la voie des folates. Le proguanil (cyclisé en cycloguanil) a une structure proche et inhibe la DHFR du plasmodium."},{"id":"p:antiprotozoaires:3","lab":"Question du prof · 23/10/2025","q":"Rappelez les deux autres indications de la doxycycline.","r":"Paludisme (chimioprophylaxie) et maladie de Lyme (en plus de son usage antibactérien et dans l'acné)."},{"id":"p:antiprotozoaires:4","lab":"Question du prof · 20/11/2025","q":"Question ouverte possible sur les antimalariques.","r":"Voir la question ouverte 1 : paludisme, quinoléines (hème), artémisinine (pont peroxyde), antifoliques (proguanil, pyriméthamine), atovaquone, doxycycline ; prévention."},{"id":"e1:antiprotozoaires:0:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimalariques. → Le paludisme","r":"Plasmodium transmis par l'anophèle femelle ; cycle asexué chez l'homme (foie puis érythrocytes : anémie, paludisme cérébral), cycle sexué chez le moustique. Formes exoérythrocytaires (hypnozoïtes : primaquine) vs érythrocytaires."},{"id":"e1:antiprotozoaires:0:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimalariques. → Quinoléines","r":"Quinine (alcaloïde du quinquina), chloroquine (NIVAQUINE®), hydroxychloroquine, méfloquine (LARIAM®), luméfantrine (RIAMET® + artéméther) : empêchent la détoxification de l'hème (polymérisation en hémozoïne) dans la vacuole digestive du parasite."},{"id":"e1:antiprotozoaires:0:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimalariques. → Dérivés de l'artémisinine","r":"Artémisinine, artéméther, artésunate : pont endoperoxyde activé par le fer de l'hème -> radicaux libres toxiques pour le parasite."},{"id":"e1:antiprotozoaires:0:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimalariques. → Antifoliques","r":"Proguanil (pro-drogue cyclisée, proche du triméthoprime) et pyriméthamine (DARAPRIM®) : inhibiteurs de la DHFR du plasmodium. MALARONE® = atovaquone + proguanil."},{"id":"e1:antiprotozoaires:0:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimalariques. → Autres","r":"Doxycycline en chimioprophylaxie ; atovaquone (analogue de l'ubiquinone)."},{"id":"e1:antiprotozoaires:0:5","lab":"Question ouverte · partie 1","q":"Parlez-moi des antimalariques. → Prévention","r":"Éviter le contact avec les anophèles (moustiquaires, répulsifs), chimioprophylaxie selon la zone, vaccin Mosquirix®."},{"id":"e1:antiprotozoaires:1:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des nitroimidazolés. → Structure","r":"Imidazole portant un groupe nitro (en 5) : métronidazole (FLAGYL®) ; ornidazole (TIBERAL®), tinidazole, nimorazole."},{"id":"e1:antiprotozoaires:1:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des nitroimidazolés. → Mécanisme","r":"Pro-drogues : réduction du groupe NO2 dans les micro-organismes anaérobies -> intermédiaires radicalaires qui lèsent l'ADN. Même mécanisme que les nitrofuranes (nitrofurantoïne)."},{"id":"e1:antiprotozoaires:1:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des nitroimidazolés. → Indications","r":"Amibiase (amoebicides mixtes), trichomonase, vaginites, infections à anaérobies, Clostridioides difficile, éradication d'Helicobacter pylori (trithérapie)."},{"id":"e1:antiprotozoaires:1:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des nitroimidazolés. → Effets indésirables","r":"Goût métallique, effet antabuse avec l'alcool."},{"id":"e2:antiprotozoaires:0","lab":"QROC · partie 2","q":"Quels sont les trois médicaments de la trithérapie d'éradication d'Helicobacter pylori et leurs mécanismes ?","r":"Amoxicilline (pénicilline : inhibition des transpeptidases de la paroi), clarithromycine (macrolide : sous-unité 50S du ribosome), métronidazole (nitroimidazolé : réduction du nitro -> lésions de l'ADN), associés à un inhibiteur de la pompe à protons. Trois mécanismes différents pour limiter les résistances."},{"id":"e2:antiprotozoaires:1","lab":"QROC · partie 2","q":"Pourquoi le proguanil a-t-il une activité antipaludique ?","r":"C'est une pro-drogue (biguanide) métabolisée en cycloguanil, dont la structure cyclisée est très proche du triméthoprime : il inhibe la dihydrofolate réductase du plasmodium."}]},{"id":"anthelminthiques","t":"Anthelminthiques","court":"Anthelminthiques","img":"icons/anthelminthiques-180.png","sym":"flask","niveaux":[{"t":"Les vers","s":"Pipérazine, benzimidazolés, niclosamide, ivermectine","type":"n","m":["piperazine","mebendazole","flubendazole","albendazole","niclosamide","ivermectine"],"q":["08-q15","08-q16","08-q17","08-q18","08-q19","08-q20"],"c":["08-helminthes","08-piperazine-difference","08-benzimidazoles-tubuline","08-oxyurose","08-gale","08-ivermectine-gaba","08-onchocercose"]},{"t":"Questions d'examen","s":"Ce que le prof a demandé en cours, parties 1 et 2","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre mélangé, comme le jour J","type":"boss"}],"cartes":[{"id":"p:anthelminthiques:0","lab":"Question du prof · 13/11/2025","q":"Quel anthelminthique agit par ses propriétés antimitotiques (tubuline) tout en étant peu résorbé ?","r":"Le mébendazole (VERMOX®) : benzimidazole qui inhibe la polymérisation de la tubuline du ver, peu résorbé donc actif dans l'intestin."},{"id":"p:anthelminthiques:1","lab":"Question du prof · 18/09/2025","q":"Question courte : quels sont les alcaloïdes actifs sur les microtubules ?","r":"Alcaloïdes de la pervenche (vinblastine, vincristine, vinorelbine), taxanes de l'if (paclitaxel, docétaxel) et colchicine ; même cible que la griséofulvine et le mébendazole."},{"id":"e1:anthelminthiques:0:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des anthelminthiques. → Les helminthes","r":"Nématodes (vers ronds : ascaris, oxyures) et cestodes (vers plats : ténia) ; transmission oro-fécale. Les médicaments doivent rester dans l'intestin (peu résorbés)."},{"id":"e1:anthelminthiques:0:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des anthelminthiques. → Pipérazine","r":"Agoniste des récepteurs GABA des neurones moteurs du ver -> entrée de chlorure, hyperpolarisation, paralysie flasque ; sélective car le GABA humain est surtout central."},{"id":"e1:anthelminthiques:0:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des anthelminthiques. → Benzimidazolés","r":"Mébendazole (VERMOX®), flubendazole, albendazole : liaison à la β-tubuline du ver -> pas de microtubules (transport, absorption du glucose) ; vers ronds surtout."},{"id":"e1:anthelminthiques:0:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des anthelminthiques. → Niclosamide","r":"YOMESAN® : vers plats (ténia), découple la phosphorylation oxydative du ver."},{"id":"e1:anthelminthiques:0:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des anthelminthiques. → Ivermectine","r":"Lactone macrocyclique d'origine naturelle (avermectines) ; ouverture des canaux chlorure -> paralysie ; onchocercose et gale (per os)."},{"id":"e2:anthelminthiques:0","lab":"QROC · partie 2","q":"Pourquoi la pipérazine paralyse-t-elle le ver sans effet central chez l'homme ?","r":"Agoniste GABA : chez le ver, le GABA agit sur les neurones moteurs périphériques (entrée de Cl- -> hyperpolarisation -> paralysie). Chez l'homme, les récepteurs GABA sont surtout centraux et la pipérazine passe peu la barrière hémato-encéphalique ; elle est en outre peu résorbée."}]},{"id":"antiseptiques-intestinaux","t":"Antiseptiques intestinaux","court":"Antiseptiques intestinaux","img":"","sym":"pill","niveaux":[{"t":"Antiseptiques intestinaux","s":"Nifuroxazide et nitrofurannes","type":"n","m":["nifuroxazide"],"q":["08-q21"],"c":["08-antiseptiques-intestinaux"]},{"t":"Questions d'examen","s":"Ce que le prof a demandé en cours, parties 1 et 2","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre mélangé, comme le jour J","type":"boss"}],"cartes":[{"id":"p:antiseptiques-intestinaux:0","lab":"Question du prof · 23/10/2025","q":"Mécanisme d'action des dérivés nitrofuranes (lien avec le nifuroxazide).","r":"Réduction du NO2 du nitrofurane en dérivés aminés via des intermédiaires réactifs qui lèsent l'ADN bactérien ; peu sélectif. Nifuroxazide : abandonné (efficacité médiocre, rémanence)."},{"id":"e2:antiseptiques-intestinaux:0","lab":"QROC · partie 2","q":"Pourquoi n'utilise-t-on quasiment plus d'antiseptiques intestinaux ?","r":"Ils sont peu sélectifs : ils détruisent aussi la flore commensale, qui a un rôle physiologique majeur ; le nifuroxazide (nitrofurane) avait une efficacité limitée sur la diarrhée et posait un problème de rémanence. On préfère cibler le germe responsable ou rééquilibrer la flore avec des probiotiques (diarrhée post-antibiotique)."}]},{"id":"desinfectants","t":"Désinfectants et antiseptiques de contact","court":"Désinfectants","img":"","sym":"drop","niveaux":[{"t":"Alcools, aldéhydes et oxydants","s":"Éthanol, formaldéhyde, borés, peroxydes, chlorés","type":"n","m":["ethanol","formaldehyde","acide-borique","borax","peroxyde-d-hydrogene","peroxyde-d-uree","permanganate-de-potassium","hypochlorite","chloramine-t"],"q":["08-q10","08-q11","08-q24","08-q26"],"c":["08-desinfectant-antiseptique","08-alcool-pharmacopee","08-acide-borique-paillettes","08-volumes-h2o2","08-lentilles-catalase","08-blanchiment-dentaire","08-javel-dakin","08-antiseptiques-usuels"]},{"t":"Antiseptiques de contact","s":"Chlorhexidine, phénols, ammoniums quaternaires, mercuriels","type":"n","m":["chlorhexidine","hexamidine","hexetidine","chloroxylenol","hexachlorophene","chlorure-de-benzalkonium","cetrimide","bromure-de-dodeclonium","nonoxinol-9","thiomersal","merbromine","eosine","argent-colloidal"],"q":["08-q27","08-q28","08-q29","08-q30","08-q31"],"c":["08-spectre-antiseptiques","08-amidines","08-spermicide"]},{"t":"Questions d'examen","s":"Ce que le prof a demandé en cours, parties 1 et 2","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre mélangé, comme le jour J","type":"boss"}],"cartes":[{"id":"p:desinfectants:0","lab":"Question du prof · 18/09/2025","q":"Parlez-moi de la polyvidone iodée : pourquoi l'iode, pourquoi la polyvinylpyrrolidone ?","r":"L'iode est un oxydant à large spectre (bactéries, virus, champignons, spores). Complexé à la polyvinylpyrrolidone, il est libéré progressivement : moins irritant, moins colorant, action prolongée (ISOBETADINE®)."},{"id":"p:desinfectants:1","lab":"Question du prof · 23/10/2025","q":"Pourquoi l'alcool dénaturé n'a-t-il pas la même utilisation que l'éthanol ?","r":"L'alcool dénaturé contient un additif (souvent un dérivé éthéré) qui le rend impropre à la consommation : il échappe à la fiscalité des boissons alcoolisées et sert à l'usage externe ; l'éthanol pur (alcool à 94-96°) est taxé."},{"id":"p:desinfectants:2","lab":"Question du prof · 23/10/2025 · reformulée","q":"Quelle différence entre un désinfectant et un antiseptique de contact ?","r":"Le désinfectant agit sur tous les micro-organismes présents sur des surfaces inertes (sols, matériel) et peut être toxique pour la peau ; l'antiseptique s'applique sur les tissus vivants (peau, muqueuses). Un antiseptique peut désinfecter une surface, mais un désinfectant n'est pas forcément utilisable sur la peau. Les deux agissent surtout par des mécanismes physico-chimiques (membranes, oxydation)."},{"id":"p:desinfectants:3","lab":"Question du prof · 23/10/2025 · reformulée","q":"Eau oxygénée : que signifient 30 %, 100 volumes, 10 volumes ? Pourquoi neutraliser après la désinfection des lentilles ?","r":"Le perhydrol à 30 % libère 100 fois son volume d'oxygène (100 volumes) : dangereux, irritant, explosif si secoué. Dilué 10 fois : 3 % = 10 volumes (antiseptique). Pour les lentilles (~1 %), il faut ensuite neutraliser l'H2O2 résiduel (catalase -> eau + oxygène) pour ne pas brûler la cornée."},{"id":"p:desinfectants:4","lab":"Question du prof · 23/10/2025 · reformulée","q":"Pourquoi utiliser le chlorure de benzalkonium pour désinfecter une plaie ? Autres usages ?","r":"Ammonium quaternaire tensioactif cationique (« un savon ») qui désorganise les membranes ; en solution aqueuse il ne provoque pas de douleur, contrairement à l'alcool (CEDIUM®). Aussi conservateur des collyres et de certains vaccins."},{"id":"p:desinfectants:5","lab":"Question du prof · 23/10/2025 · reformulée","q":"Pourquoi le thiomersal est-il cité par les antivaccins et pourquoi n'est-ce pas un vrai risque ?","r":"C'est un dérivé mercuriel organique, antiseptique et conservateur présent dans certains vaccins (presque plus utilisé). Les quantités injectées sont infimes et sous forme organique, sans rapport avec une intoxication au mercure (alimentaire par ex.)."},{"id":"p:desinfectants:6","lab":"Question du prof · 23/10/2025 · reformulée","q":"À quoi servent les comprimés de chloramine T (CLONAZONE®) ?","r":"Chlore organique stabilisé : libèrent la chloramine dans l'eau et la désinfectent (bactéries, parasites, virus) ; non toxiques par voie orale : eau de boisson en trekking (ou petites piscines)."},{"id":"e1:desinfectants:0:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des désinfectants et antiseptiques de contact. → Définitions","r":"Stérilisation : destruction de tous les micro-organismes (dispositifs médicaux). Désinfection : objets et surfaces inertes. Antisepsie : tissus vivants (peau, muqueuses)."},{"id":"e1:desinfectants:0:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des désinfectants et antiseptiques de contact. → Alcools et aldéhydes","r":"Éthanol 70 % (dénaturation des protéines), alcool dénaturé ; formaldéhyde (désinfectant)."},{"id":"e1:desinfectants:0:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des désinfectants et antiseptiques de contact. → Oxydants","r":"Peroxyde d'hydrogène (eau oxygénée, catalase), permanganate de potassium ; hypochlorite de sodium (eau de Javel, DAKIN®), chloramine T."},{"id":"e1:desinfectants:0:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des désinfectants et antiseptiques de contact. → Halogènes iodés","r":"Polyvidone iodée (ISOBETADINE®, BRAUNOL®) : iode libéré progressivement par le complexe avec la PVP."},{"id":"e1:desinfectants:0:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des désinfectants et antiseptiques de contact. → Biguanides et ammoniums quaternaires","r":"Chlorhexidine (HIBISCRUB®), hexamidine (HEXOMEDINE®) ; benzalkonium (CEDIUM®), cétrimide : tensioactifs cationiques."},{"id":"e1:desinfectants:0:5","lab":"Question ouverte · partie 1","q":"Parlez-moi des désinfectants et antiseptiques de contact. → Autres","r":"Phénols (chloroxylénol : DETTOL®), dérivés mercuriels (thiomersal), éosine, argent, acide borique."},{"id":"e2:desinfectants:0","lab":"QROC · partie 2","q":"Quel est l'intérêt de la polyvidone iodée par rapport à la teinture d'iode ?","r":"L'iode est complexé à la polyvinylpyrrolidone, qui le libère progressivement : même spectre large de l'iode (oxydant), mais moins irritant, moins colorant et action prolongée (ISOBETADINE®)."},{"id":"e2:desinfectants:1","lab":"QROC · partie 2","q":"Pourquoi l'eau boriquée est-elle adaptée au lavage des yeux ?","r":"Solution d'acide borique à 3,5 % : pH et osmolarité proches de la neutralité, peu irritante, propriétés antiseptiques ; utilisée sur une compresse propre (aussi BORADRINE®, BOROSTYROL® en ophtalmologie)."}]},{"id":"antiviraux","t":"Antiviraux","court":"Antiviraux","img":"","sym":"virus","niveaux":[{"t":"Acides nucléiques (rappel)","s":"Oses, bases, nucléosides, nucléotides","type":"n","m":["ribose","desoxyribose","adenine","guanine","thymine","cytosine","uracile","adenosine","desoxyadenosine","guanosine","desoxyguanosine","thymidine","desoxythymidine","cytidine","desoxycytidine","uridine","desoxyuridine","adenosine-triphosphate"],"q":["09-q-nucleoside-def","09-q-ribose-desoxy","09-q-thymine-uracile","09-q-purines","09-q-guanine-oxo","09-q-amp","09-q-triphosphate-polaire","09-q-cycle-ordre","09-q-integrase","09-q-remdesivir-analogue","09-q-aciclovir-tk","09-q-aciclovir-guanosine","09-q-ganciclovir-vs-aciclovir","09-q-cidofovir","09-q-maribavir"],"c":["09-virus-parasite-intracellulaire","09-acide-nucleique-viral","09-capside","09-enveloppe-virion","09-cycle-attachement","09-cycle-penetration","09-cycle-decapsidation","09-cycle-replication","09-cycle-assemblage","09-cycle-liberation","09-sida-vih","09-cycle-vih","09-integrase","09-protease-vih","09-cibles-anti-vih","09-principe-antimetabolites","09-activation-triphosphate","09-nucleotide-composition","09-ribose-desoxyribose","09-purines-pyrimidines","09-nucleoside","09-desoxynucleoside","09-nucleotides-nmp-ndp-ntp","09-adn-arn","09-vaccination-influenza","09-ribavirine-figure","09-bronchiolite-vrs","09-covid-repositionnes","09-remdesivir-prodrogue","09-antimetabolites-guanosine"]},{"t":"Virus respiratoires","s":"Adamantanes, neuraminidase, VRS, SARS-CoV-2","type":"n","m":["amantadine","rimantadine","zanamivir","oseltamivir","palivizumab","nirsevimab","nirmatrelvir","remdesivir"],"q":["09-q-vih-gp120","09-q-amantadine-b","09-q-amantadine-parkinson","09-q-tamiflu","09-q-oseltamivir-prodrogue","09-q-oseltamivir-indication","09-q-nirsevimab-cible","09-q-nirsevimab-saison","09-q-mpro","09-q-ritonavir-role"],"c":["09-grippe-influenza","09-amantadine-m2","09-amantadine-parkinson","09-neuraminidase","09-oseltamivir-plus-indique","09-nirsevimab-schema","09-nirsevimab-mecanisme","09-sars-cov-2-proteases","09-ritonavir-booster"]},{"t":"Herpès et CMV","s":"Aciclovir, ganciclovir, foscarnet, maribavir","type":"n","m":["foscarnet","aciclovir","ganciclovir","penciclovir","famciclovir","valaciclovir","cidofovir","valganciclovir","maribavir","letermovir"],"q":["09-q-foscarnet-seul","09-q-zovirax","09-q-valganciclovir-pept1","09-q-cymevene-valcyte","09-q-valaciclovir-piege"],"c":["09-transcriptase-reverse","09-foscarnet-adn-arn","09-prodrogues-valine","09-cidofovir-cmv-resistant","09-ganciclovir-toxicite","09-maribavir-ul97"]},{"t":"VIH","s":"INTI, INNTI, protéase, intégrase, CCR5","type":"n","m":["ritonavir","zidovudine","didanosine","lamivudine","emtricitabine","abacavir","entecavir","tenofovir-disoproxil","adefovir-dipivoxil","nevirapine","etravirine","atazanavir","darunavir","lopinavir","fostemsavir","maraviroc","raltegravir"],"q":["10-q10-01","10-q10-02","10-q10-03","10-q10-04","10-q10-05","10-q10-06","10-q10-07","10-q10-08","10-q10-09","10-q10-10","10-q10-11","10-q10-12","10-q10-13","10-q10-14","10-q10-15","10-q10-16","10-q10-17","10-q10-19","10-q10-20","10-q10-21","10-q10-22","10-q10-23","10-q10-24","10-q10-28","10-q10-29","10-q10-30"],"c":["10-classes-antiretroviraux","10-tritherapie","10-mecanisme-inti","10-nucleosidique-vs-nucleotidique","10-vhb-transcriptase-inverse","10-hepatite-b-chronique-active","10-vaccin-hepatite-b","10-inhibiteurs-protease-peptidomimetiques","10-entree-vih-gp120-gp41","10-tropisme-vih","10-integrase","10-prodrogues-antivirales","10-vhc-petit-virus-arn","10-hepatite-c-aigue-chronique","10-pas-vaccin-hepatite-c"]},{"t":"Hépatites et divers","s":"VHC, ribavirine, interférons","type":"n","m":["sofosbuvir","ledipasvir","ribavirine","fludarabine","interferons"],"q":["10-q10-25","10-q10-26","10-q10-27"],"c":["10-aad-hepatite-c","10-ribavirine-large-spectre","10-fludarabine-anticancereux","10-interferons-cytokines"]},{"t":"Questions d'examen","s":"Ce que le prof a demandé en cours, parties 1 et 2","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre mélangé, comme le jour J","type":"boss"}],"cartes":[{"id":"p:antiviraux:0","lab":"Question du prof · 06/11/2025","q":"Pourquoi la vaccination contre l'hépatite B est-elle indispensable pour les professionnels de la santé ?","r":"Le virus de l'hépatite B se transmet par le sang ; le pharmacien (vaccination, contacts avec le sang des patients) y est exposé. L'hépatite B peut devenir chronique (cirrhose, cancer du foie) ; un vaccin efficace existe, d'où la vaccination obligatoire/recommandée avant les stages."},{"id":"p:antiviraux:1","lab":"Question du prof · 06/11/2025","q":"Dans quelle classe se trouve le sofosbuvir et quel est son mécanisme ?","r":"Sofosbuvir (SOVALDI®, HARVONI®, EPCLUSA®) : antiviral à action directe contre le VHC ; pro-drogue nucléotidique, inhibiteur de la polymérase NS5B (ARN polymérase ARN-dépendante) -> terminaison de chaîne. Pas de structure à dessiner."},{"id":"e1:antiviraux:0:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des antiviraux antimétabolites des nucléosides (antiherpétiques). → Rappel structural","r":"Nucléoside = base (purine : adénine, guanine ; pyrimidine : cytosine, thymine, uracile) + ribose/2-désoxyribose ; nucléotide = nucléoside phosphaté."},{"id":"e1:antiviraux:0:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des antiviraux antimétabolites des nucléosides (antiherpétiques). → Principe","r":"Analogue d'un nucléoside, activé en triphosphate (1re phosphorylation par la thymidine kinase virale -> sélectivité), incorporé par l'ADN polymérase virale : terminaison de chaîne."},{"id":"e1:antiviraux:0:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des antiviraux antimétabolites des nucléosides (antiherpétiques). → Aciclovir (à dessiner)","r":"Analogue acyclique de la guanosine (pas de 3'-OH) ; ACICLOVIR SANDOZ®, ACICLOVIR EG® ; herpès, varicelle-zona."},{"id":"e1:antiviraux:0:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des antiviraux antimétabolites des nucléosides (antiherpétiques). → Pro-drogues","r":"Valaciclovir (ZELITREX®, ester de valine : meilleure biodisponibilité orale), famciclovir -> penciclovir ; valganciclovir (VALCYTE®) -> ganciclovir (CMV)."},{"id":"e1:antiviraux:0:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des antiviraux antimétabolites des nucléosides (antiherpétiques). → Autres","r":"Cidofovir (CMV résistant), foscarnet (FOSCAVIR® : non nucléosidique, inhibe directement l'ADN polymérase), maribavir (UL97)."},{"id":"e1:antiviraux:1:0","lab":"Question ouverte · partie 1","q":"Parlez-moi des antirétroviraux (VIH). → Cycle et cibles","r":"Attachement (gp120/CD4, corécepteurs CCR5/CXCR4), fusion (gp41), transcription inverse, intégration, maturation par la protéase."},{"id":"e1:antiviraux:1:1","lab":"Question ouverte · partie 1","q":"Parlez-moi des antirétroviraux (VIH). → INTI","r":"Analogues nucléosidiques triphosphorylés : zidovudine (RETROVIR®), lamivudine (EPIVIR®), emtricitabine, abacavir ; nucléotidique : ténofovir disoproxil (VIREAD®)."},{"id":"e1:antiviraux:1:2","lab":"Question ouverte · partie 1","q":"Parlez-moi des antirétroviraux (VIH). → INNTI","r":"Liaison allostérique à la transcriptase inverse : névirapine (VIRAMUNE®), étravirine."},{"id":"e1:antiviraux:1:3","lab":"Question ouverte · partie 1","q":"Parlez-moi des antirétroviraux (VIH). → Inhibiteurs de protéase","r":"Peptidomimétiques : darunavir (PREZISTA®), atazanavir, lopinavir (KALETRA® + ritonavir à faible dose = booster par inhibition du CYP3A4)."},{"id":"e1:antiviraux:1:4","lab":"Question ouverte · partie 1","q":"Parlez-moi des antirétroviraux (VIH). → Autres","r":"Intégrase : raltégravir (ISENTRESS®) ; CCR5 : maraviroc (CELSENTRI®) ; attachement : fostemsavir. Plurithérapie pour éviter les résistances."},{"id":"e2:antiviraux:0","lab":"QROC · partie 2","q":"Pourquoi le valaciclovir est-il préféré à l'aciclovir per os ?","r":"C'est l'ester L-valine de l'aciclovir : il est absorbé via des transporteurs d'acides aminés/peptides puis hydrolysé en aciclovir. Biodisponibilité nettement supérieure, donc moins de prises."},{"id":"e2:antiviraux:1","lab":"QROC · partie 2","q":"Pourquoi ajoute-t-on du ritonavir à faible dose dans PAXLOVID® ou KALETRA® ?","r":"Le ritonavir est un puissant inhibiteur du CYP3A4 : à faible dose, il n'agit pas comme antiviral mais ralentit le métabolisme du nirmatrelvir ou du lopinavir et augmente leurs concentrations (« booster ») ; attention aux interactions."}]},{"id":"antitumoraux","t":"Antitumoraux","court":"Antitumoraux","img":"","sym":"target","niveaux":[{"t":"Agents alkylants","s":"Moutardes, nitrosourées, platines, détoxifiants","type":"n","m":["yperite","chlorambucil","melphalan","busulfan","cyclophosphamide","ifosfamide","thiotepa","estramustine","carmustine","fotemustine","cisplatine","carboplatine","oxaliplatine","dacarbazine","temozolomide","mesna","dexrazoxane"],"q":["11-q11-01","11-q11-02","11-q11-03","11-q11-04","11-q11-05","11-q11-06","11-q11-07","11-q11-09","11-q11-10","11-q11-11","11-q11-13","11-q11-14","11-q11-15","11-q11-16","11-q11-17","11-q11-18","11-q11-25"],"c":["11-cancer-definition","11-epidemiologie-cancer-2022","11-strategies-traitement-cancer","11-chimiotherapie-definition","11-therapies-ciblees-hormono-immuno","11-cellules-car-t","11-manque-selectivite-antitumoraux","11-ei-communs-antitumoraux","11-hyperuricemie-chimiotherapie","11-moutardes-origine","11-alkylants-mecanisme","11-phosphoramides-phosphoramidase","11-estradiol-vecteur","11-nitrosourees-bhe","11-serendipite-cisplatine","11-complexes-platine-structure","11-detoxifiants","11-acroleine-mesna","11-chelation-du-fer","11-maladie-de-bowen"]},{"t":"Antimétabolites","s":"Antifoliques, analogues puriques et pyrimidiques","type":"n","m":["methotrexate","raltitrexed","pemetrexed","mercaptopurine","tioguanine","clofarabine","fluorouracil","capecitabine","cytarabine","gemcitabine","hydroxyuree"],"q":["11-q11-12","11-q11-19","11-q11-20","11-q11-21","11-q11-22","11-q11-23","11-q11-24","11-q11-26","11-q11-27","11-q11-28","11-q11-29","11-q11-30","11-q11-31"],"c":["11-antimetabolites-definition","11-methotrexate-faibles-doses","11-acide-folinique-methotrexate","11-isosterie-raltitrexed","11-medicament-orphelin","11-arabinose-vs-ribose","11-prodrogue-capecitabine","11-drepanocytose"]},{"t":"Intercalants et topo-isomérases","s":"Anthracyclines, psoralènes, camptothécines, étoposide","type":"n","m":["proflavine","daunorubicine","doxorubicine","epirubicine","idarubicine","mitoxantrone","amsacrine","bleomycine","psoralene","8-methoxypsoralene","bergaptene","camptothecine","irinotecan","topotecan","podophyllotoxine","etoposide","ten
