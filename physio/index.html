  <tr><td><b>Glucose</b></td><td>Filtré librement, <span class="k">réabsorbé au TCP par cotransport Na⁺ (saturable)</span> : au-delà du <span class="k">seuil rénal / Tm</span> (≈ 1,8 g/L de glycémie) → <span class="k">glucosurie</span> (idem AA, corps cétoniques, lactate, vitamines hydrosolubles)</td></tr>
  <tr><td><b>Protéines</b></td><td>Peu filtrées ; réabsorbées ~100 % par pinocytose. Protéinurie : physiologique (effort, fièvre, stress) ou pathologique (pré-rénale, rénale, post-rénale)</td></tr>
  <tr><td><b>Eau</b></td><td>Aquaporines partout <span class="k">sauf la branche ascendante de Henlé</span> ; au TCD/TC, nombre réglé par l'<span class="k">ADH</span></td></tr>
  <tr><td><b>Urée</b></td><td>50-70 % réabsorbée, contribue au gradient médullaire ; perméabilité du TC médullaire ↑ par l'ADH ; excrétion insuffisante → urémie</td></tr>

  <tr><td><b>H⁺, ions organiques</b></td><td><span class="k">Sécrétion</span> (capillaires → lumière) : H⁺ (pH), bilirubine, urate, oxalate, <b>médicaments</b> (pénicilline, PAH)</td></tr></table>
  <p><b>Pharmaco</b> au TCD/TC : IEC (↓ Ang II/aldostérone), antagonistes de l'aldostérone, bloqueurs des canaux Na⁺ (diurétiques épargneurs de K⁺).</p>
  <p><b>Troubles tubulaires</b> : hypoaldostéronisme (Addison), <span class="k">diabète insipide</span> (central : pas d'ADH ; néphrogénique : pas de réponse) → polyurie d'urine diluée ; <span class="k">diabète sucré</span> → glucosurie → diurèse osmotique → polyurie, polydipsie.</p>`,
  why: [["Chez un sujet normal, comment est le liquide qui entre dans le tube distal précoce (près de la macula densa) ?", "Hypotonique par rapport au plasma (~100 mOsm/L), car la branche ascendante a réabsorbé du NaCl sans eau. Il ne contient ni glucose (réabsorbé au TCP) ni albumine (examen 2019)."]],

{ id: "clair", title: "La clairance",

  <p>Interprétation : <span class="k">C < DFG → réabsorption nette</span> ; <span class="k">C > DFG → sécrétion nette</span>.</p>

{ id: "conc", title: "Concentration des urines : contre-courant",
  html: `<p>Osmolarité du plasma/LEC ≈ <span class="k">300 mOsm/L</span>. Le rein peut produire une urine de <span class="k">≈ 50 à 1 200 mOsm/L</span> selon l'hydratation, grâce au <span class="k">gradient osmotique médullaire</span> (300 → 1 200 mOsm/L vers la papille).</p>
  <ul><li><b>Anse de Henlé = multiplicateur à contre-courant</b> : branche <span class="k">descendante perméable à l'eau</span> (l'eau sort, le liquide se concentre) ; branche <span class="k">ascendante imperméable à l'eau et qui réabsorbe activement le NaCl (NKCC2)</span> (le liquide se dilue, l'interstitium se concentre).</li>
  <li><b>Vasa recta = échangeur à contre-courant</b> : très perméables, <span class="k">débit très faible</span> → emportent l'eau et le Na⁺ réabsorbés sans « laver » le gradient.</li>
  <li><b>Urée</b> recyclée (TC médullaire ↔ anse) : contribue ~la moitié du gradient profond.</li>
  <li><b>ADH</b> → aquaporines au TCD/TC : l'eau sort vers l'interstitium hypertonique → <span class="k">urine concentrée</span>. Sans ADH : TCD/TC imperméables → <span class="k">urine diluée</span> abondante.</li></ul>`,

  talk: { prompt: "Explique comment le rein concentre l'urine (schéma de l'anse et des vasa recta).", check: ["Gradient 300 → 1 200 mOsm/L", "Descendante perméable à l'eau, ascendante imperméable + NaCl actif", "Vasa recta : échangeur, débit faible", "Urée", "ADH + aquaporines au TC → urine concentrée"] },
  traps: ["Dire que l'ADH agit sur l'anse de Henlé (elle agit sur TCD/TC).", "Inverser les perméabilités des deux branches."] },

{ id: "volosm", title: "Régulation du volume et de l'osmolarité ; miction",
  html: `<p><span class="k">Le contenu en Na⁺ détermine le volume du LEC</span> ; <span class="k">le contenu en eau détermine l'osmolarité</span>.</p>
  <p><b>Volume</b> :</p>
  <ul><li><span class="k">Diurèse de pression</span> : volume ↑ → DC ↑ → PA ↑ → débit urinaire ↑ → volume normalisé (lent : heures, mais puissant).</li>
  <li><span class="k">Réflexe des récepteurs volumiques</span> (rapide, < 1 h) : volume ↑ → distension auriculaire → ↓ sympathique rénal (DFG ↑), ↓ ADH, ↑ ANP → natriurèse et diurèse.</li>
  <li>SRAA (cf. chapitre 1).</li></ul>
  <p><b>Osmolarité</b> : osmolarité ↑ (excès de Na⁺) → osmorécepteurs hypothalamiques → <span class="k">ADH</span> → réabsorption d'eau sans Na⁺ ; et <span class="k">soif</span> (déshydratation intracellulaire des neurones) → ingestion d'eau. (L'arrêt de la soif est anticipé par des récepteurs oropharyngés et gastriques.)</p>
  <p><b>Déshydratation</b> (⭐ contrôle intégré, « savoir refaire une partie du schéma ») : ↓ volume ET ↑ osmolarité → baroréflexe (sympathique), SRAA, ADH, soif ; ↓ ANP → conservation d'eau et de sel.</p>
  <p><b>Miction</b> : vessie = <span class="k">détrusor</span> (lisse) + <span class="k">trigone/sphincter interne</span> (lisse) + <span class="k">sphincter externe (strié, nerf honteux)</span>. <span class="k">Parasympathique : contraction du détrusor, relâchement du sphincter interne</span> ; sympathique : l'inverse (continence). Réflexe : étirement → nerfs pelviens → moelle sacrée → parasympathique ↑, sympathique ↓, nerf honteux inhibé → vidange ; <b>rétrocontrôle positif</b> (le flux urétral renforce la contraction). Contrôle volontaire par le sphincter externe (appris).</p>`,
  why: [["Pourquoi boire de l'eau de mer aggrave-t-il la déshydratation ?", "Son osmolarité dépasse la capacité maximale de concentration du rein : pour éliminer ce sel, il faut plus d'eau que celle bue."]],
  talk: { prompt: "Construis le schéma de la réponse intégrée à une déshydratation (contrôle intégré).", check: ["Stimuli : ↓ volume/PA et ↑ osmolarité", "Capteurs : barorécepteurs, récepteurs auriculaires, osmorécepteurs, juxtaglomérulaire", "Effecteurs : sympathique, SRAA (Ang II, aldostérone), ADH, soif, ANP ↓", "Réponses : vasoconstriction, conservation de Na⁺ et d'eau, ingestion", "Rétrocontrôles négatifs"] },
  traps: ["Confondre régulation du volume (Na⁺) et de l'osmolarité (eau)."] },

{ id: "ph", title: "Régulation rénale du pH",
  html: `<p>pH artériel <span class="k">7,40</span> (veineux 7,35) ; urine 4,5-8 ; suc gastrique 0,8. Production quotidienne d'acides (CO₂ volatil + acides non volatils : AG, corps cétoniques, protéines) > bases → il faut <b>excréter du H⁺ par le rein</b>.</p>
  <p><b>3 systèmes</b> (⭐ « retenir les tampons et les valeurs de pH ») :</p>
  <ol><li><b>Tampons chimiques</b> (secondes) : <span class="k">bicarbonate (majeur dans le LEC)</span>, <span class="k">protéines (LIC)</span>, <span class="k">hémoglobine (acide carbonique)</span>, <span class="k">phosphates (LIC et urine)</span>.</li>
  <li><b>Respiration</b> (minutes) : pH ↓ → chimiorécepteurs → ventilation ↑ → CO₂ éliminé.</li>

{ id: "org", title: "Organisation, neurotransmetteurs, LCR et barrière hémato-encéphalique",
  html: `<p><b>SNC</b> (encéphale + moelle) ; <b>SNP</b> : afférences (récepteur → SNC) et efférences (SNC → effecteurs) : <span class="k">somatiques</span> (muscle strié, volontaire) et <span class="k">autonomes</span> (muscle lisse, cœur, glandes : sympathique « fight or flight », parasympathique « rest and digest »).</p>
  <p><b>Neurotransmetteurs</b> : petites molécules (~20 : <span class="k">GABA</span>, glutamate, glycine ; amines : dopamine, A, NA, sérotonine, histamine ; <span class="k">ACh</span>) et <b>neuropeptides</b> (> 100 : endorphines, enképhalines = opioïdes endogènes, TRH…). Convergence/divergence ; inhibition feed-forward/feed-back.</p>
  <p><b>Récepteurs sensoriels</b> : mécano-, chimio-, thermo-, photo-, nocicepteurs ; stimuli externes ou internes (pression, T° interne, pH, O₂, CO₂).</p>
  <p><b>LCR</b> : produit par les <span class="k">plexus choroïdes</span> (ventricules) : filtrat plasmatique + transports actifs ; pauvre en cellules et protéines, K⁺ bas et stable ; <span class="k">~140 mL, ~500 mL produits/jour</span> ; résorbé par les granulations arachnoïdiennes vers les sinus veineux. Rôles : nutrition, <b>amortissement des chocs</b>. Ponction lombaire (diagnostic, péridurale). Excès/obstruction : <b>hydrocéphalie</b>. Méninges : dure-mère, arachnoïde, pie-mère.</p>
  <p><b>Barrière hémato-encéphalique</b> : capillaires très peu perméables (jonctions serrées, astrocytes) → <span class="k">les substances liposolubles passent (O₂, CO₂, anesthésiques, alcool), les hydrosolubles passent mal</span>. Crucial pour le choix des médicaments à visée centrale. Cellules gliales : astrocytes, microglie (défense), oligodendrocytes (myéline).</p>`,
  why: [["Pourquoi le CO₂ stimule-t-il la ventilation via le LCR mais pas les H⁺ du sang ?", "Le CO₂ liposoluble traverse la BHE et s'hydrate dans le LCR (pauvre en tampons) → H⁺ ↑ près des chimiorécepteurs centraux ; les H⁺ sanguins passent mal."]],
  talk: { prompt: "Qu'est-ce que la barrière hémato-encéphalique et quelles conséquences pour la pharmacologie ?", check: ["Capillaires à jonctions serrées + astrocytes", "Liposolubles passent, hydrosolubles non", "Exemples : anesthésiques, alcool, O₂/CO₂", "Choix d'un antibiotique pour un abcès cérébral", "LCR : production, volume, rôle"] },
  traps: [] },

{ id: "moelle", title: "Moelle épinière et réflexes spinaux",
  html: `<p>31 paires de nerfs rachidiens (cervicaux, thoraciques, lombaires, sacrés, coccygiens) : chaque paire ↔ un <b>dermatome</b> et un <b>myotome</b>. Substance grise (corps cellulaires) : <span class="k">corne dorsale = sensitive</span>, <span class="k">corne ventrale = motrice</span> ; substance blanche : faisceaux d'axones myélinisés.</p>
  <p><b>Arc réflexe</b> : récepteur → afférence → (≥ 1 interneurone) → efférence → effecteur. Involontaire, répétable, inné.</p>
  <table><tr><th>Réflexe</th><th>Récepteur</th><th>Réponse</th></tr>
  <tr><td><b>Myotatique (d'étirement)</b>, ex. rotulien</td><td><span class="k">Fuseau neuromusculaire</span> (en parallèle, mesure la longueur)</td><td><span class="k">Monosynaptique</span> : contraction du muscle étiré + inhibition réciproque de l'antagoniste ; maintient le tonus</td></tr>
  <tr><td><b>Myotatique inverse (Golgi)</b></td><td><span class="k">Organe tendineux de Golgi</span> (en série, mesure la tension)</td><td>Relâchement du muscle (inhibition autogène) + activation de l'antagoniste → protège le tendon</td></tr>
  <tr><td><b>De retrait (flexion)</b> + extension croisée</td><td>Nocicepteurs</td><td><span class="k">Polysynaptique</span>, avant la prise de conscience ; inhibable volontairement</td></tr></table>
  <p><b>Générateurs centraux</b> spinaux : mouvements rythmiques (marche, mastication, respiration). <b>Cellules de Renshaw</b> : interneurones inhibiteurs (rétrocontrôle négatif sur le motoneurone α) — bloquées par la <span class="k">toxine tétanique</span> → contractures.</p>
  <table><tr><th>Syndrome du motoneurone inférieur (périphérique)</th><th>Syndrome du motoneurone supérieur (central)</th></tr>
  <tr><td>Réflexes ↓ ou absents, <span class="k">paralysie flasque</span>, <span class="k">atrophie</span></td><td>Réflexes présents (souvent exagérés), mouvements inappropriés/spasticité, <span class="k">pas d'atrophie</span></td></tr></table>
  <p><b>Choc spinal</b> : après un trauma médullaire sévère, aréflexie transitoire en aval (perte brutale des influx descendants).</p>`,
  why: [["Fuseau vs organe de Golgi : pourquoi des réponses opposées ?", "Le fuseau, en parallèle, signale un étirement (risque d'élongation) → contraction ; Golgi, en série, signale une tension excessive (risque de rupture) → relâchement."]],
  talk: { prompt: "Décris le réflexe rotulien (schéma) et ce qu'apporte son examen en clinique.", check: ["Fuseau → afférence Ia → corne dorsale → motoneurone α → quadriceps (monosynaptique)", "Inhibition réciproque des ischio-jambiers (interneurone)", "Absent : atteinte du motoneurone inférieur/nerf", "Exagéré : atteinte centrale (motoneurone supérieur)"] },
  traps: ["Dire que le réflexe de retrait est monosynaptique.", "Confondre fuseau (longueur) et Golgi (tension)."] },

{ id: "ence", title: "Encéphale : tronc, cervelet, diencéphale, cortex",
  html: `<ul><li><b>Bulbe (myélencéphale)</b> : conduction ; noyaux de nerfs crâniens ; <span class="k">centres respiratoire, cardiaque, vasomoteur, digestif</span>.</li>
  <li><b>Pont + cervelet (métencéphale)</b> : relais cortex-cervelet, posture.</li>
  <li><b>Mésencéphale</b> : mouvements oculaires, posture inconsciente, formation réticulée (éveil, sommeil), noyau rouge, <span class="k">substance noire (dopamine)</span>.</li>
  <li><b>Cervelet</b> : <span class="k">compare l'intention motrice et le mouvement réel → coordonne et corrige</span> ; apprentissage moteur. Lésion : <span class="k">ataxie</span> (démarche ébrieuse), base élargie, <span class="k">dysmétrie</span>, tremblement d'action (invisible au repos).</li>
  <li><b>Diencéphale</b> : <span class="k">thalamus</span> = relais de toutes les informations sensitives (sauf olfaction directe au limbique) vers le cortex ; <span class="k">hypothalamus</span> = lien SNC-endocrinien (hypophyse), <span class="k">régulateur principal du SNA</span>, <span class="k">thermostat</span>, faim, soif.</li>
  <li><b>Cortex</b> : circonvolutions (~2 400 cm²), 2 hémisphères reliés par le corps calleux ; aires primaires motrice et somatosensorielle (homoncules : représentation <b>disproportionnée</b> selon la densité de récepteurs) ; <span class="k">chaque hémisphère contrôle le côté opposé</span>. Dominance gauche (90 %) pour langage, calcul, logique ; droite : espace, musique.</li></ul>
  <p><b>Nerfs crâniens</b> : 12 paires, sensitifs, moteurs ou mixtes (à connaître de loin) ; ex. IX, X : baroréflexe, goût ; VII, IX, X : goût ; VIII : audition/équilibre ; X : parasympathique viscéral.</p>
  <p><b>Réflexe vestibulo-oculaire</b> : rotation de la tête → canaux semi-circulaires → muscles oculaires bougent les yeux en sens inverse → image stable.</p>`,
  why: [["Comment distinguer un tremblement cérébelleux d'un tremblement parkinsonien ?", "Cérébelleux : pendant/à la fin du mouvement (intention), absent au repos. Parkinsonien : au repos, disparaît pendant le mouvement (cas TD d'Alban)."]],
  talk: { prompt: "Rôles du cervelet, du thalamus et de l'hypothalamus.", check: ["Cervelet : comparateur, coordination, apprentissage ; ataxie, dysmétrie", "Thalamus : relais sensitif vers le cortex", "Hypothalamus : SNA, hypophyse, T°, faim/soif", "Croisement des voies"] },
  traps: [] },

{ id: "mvt", title: "Contrôle du mouvement : pyramidal, extrapyramidal, ganglions de la base ; sensibilité",
  html: `<p><b>Voies sensitives</b> : <span class="k">colonnes dorsales</span> (toucher fin, pression, proprioception) et <span class="k">faisceau spinothalamique</span> (température, douleur, stimuli mécaniques excessifs) → thalamus → cortex somatosensoriel. Le réflexe de retrait se fait au niveau spinal, avant la conscience.</p>
  <table><tr><th>Système pyramidal (cortico-spinal latéral)</th><th>Système extrapyramidal (ventro-médian)</th></tr>
  <tr><td><span class="k">Mouvements volontaires fins et complexes</span>, surtout fléchisseurs (mains, face, parole) ; fibres cortico-spinales, cortico-bulbaires, cortico-ponto-cérébelleuses (informent le cervelet de l'intention)</td><td><span class="k">Posture, tonus, mouvements automatiques/antigravitaires</span>, surtout extenseurs proximaux ; voies du tronc cérébral (vestibulo-, réticulo-spinales), modulation des fibres γ</td></tr>
  <tr><td>Lésion (AVC) : <span class="k">hémiparésie controlatérale</span> (face, main), troubles du langage</td><td>Lésion : rigidité, troubles du tonus ; médicaments (neuroleptiques, métoclopramide) → syndromes extrapyramidaux</td></tr></table>
  <p><b>Ganglions de la base</b> (autour du thalamus) : planification et initiation du mouvement, lien motivation-émotion-mouvement. <b>Maladie de Parkinson</b> : dégénérescence des neurones <span class="k">dopaminergiques de la substance noire</span> → <span class="k">tremblement de repos, rigidité, bradykinésie/akinésie</span>, posture courbée, marche à petits pas. Facteurs favorisants : âge, <b>pesticides</b>, génétique. Traitement : L-DOPA (+ inhibiteur de dopa-décarboxylase périphérique), agonistes dopaminergiques.</p>`,
  why: [["Pourquoi donne-t-on de la L-DOPA et pas de la dopamine ?", "La dopamine ne traverse pas la BHE ; son précurseur L-DOPA oui, et il est converti en dopamine dans le cerveau."]],
  talk: { prompt: "Cas TD (open book) : Alban, 62 ans, ancien agriculteur, tremblement de repos, mouvements lents et rigides, marche courbée. Explique.", check: ["Parkinson : perte des neurones dopaminergiques (substance noire)", "Circuit des ganglions de la base → initiation du mouvement altérée", "Signes : tremblement de repos, rigidité, bradykinésie", "Facteurs : âge, pesticides", "Réflexes spinaux et proprioception conservés ; traitement L-DOPA"] },
  traps: ["Dire que le Parkinson est une lésion pyramidale.", "Oublier le croisement : AVC gauche → paralysie droite."] },

{ id: "som", title: "Conscience, sommeil, émotions, mémoire, pharmacologie",
  html: `<p><b>EEG</b> : ondes α (éveil calme), β (éveil concentré) ; ondes lentes dans le sommeil ; tracés anormaux dans l'épilepsie.</p>
  <p><b>Sommeil</b> : inhibition active par la <span class="k">formation réticulée</span> ; indispensable au SNC (privation → irritabilité). <span class="k">Sommeil lent</span> : seuil de stimulation ↑, tonus et réflexes ↓, FC/FR/PA ↓ (reposant). <span class="k">Sommeil paradoxal (REM)</span> : formation réticulée très active, atonie avec secousses (yeux), <b>rêves</b>, apprentissage chez le jeune ; perturbé tôt dans le Parkinson. Mélatonine et lumière bleue des écrans (cas TD : difficulté d'endormissement).</p>
  <p><b>Système limbique</b> : émotions (réactions végétatives via l'hypothalamus), afférence olfactive directe.</p>
  <p><b>Mémoire</b> : <span class="k">court terme</span> (capacité limitée, activité électrique ; amnésie rétrograde après hypoxie/choc) ; <span class="k">long terme</span> (modifications chimiques/structurelles) : <span class="k">procédurale</span> (« comment », cervelet) et <span class="k">déclarative</span> (« quoi », hippocampe, cortex). Le passage à long terme dépend de la motivation, de la concentration et du sommeil.</p>
  <p><b>Pharmacologie</b> : tranquillisation (système limbique), <span class="k">anesthésie générale</span> (suppression de la conscience : les influx arrivent au cortex mais ne sont plus interprétés), <span class="k">analgésie</span> (interception des voies ou inhibition centrale).</p>`,
  why: [["Pourquoi réviser puis dormir est-il plus efficace que réviser toute la nuit ?", "La consolidation vers la mémoire à long terme se fait en partie pendant le sommeil ; la privation de sommeil dégrade aussi l'attention et la mémoire de travail."]],
  talk: { prompt: "Compare sommeil lent et sommeil paradoxal.", check: ["Formation réticulée", "Lent : seuil ↑, tonus ↓, viscères ralentis", "Paradoxal : activité cérébrale intense, atonie + mouvements oculaires, rêves", "Rôle dans l'apprentissage"] },
  traps: [] },

{ id: "sna", title: "Système nerveux autonome",
  html: `<p>Non volontaire, <b>moteur</b> (muscle lisse, cœur, glandes exo/endocrines), assure l'<b>homéostasie</b> par rétrocontrôle négatif ; commandé par l'<span class="k">hypothalamus, le tronc cérébral et le cortex</span>.</p>
  <table><tr><th></th><th>Sympathique</th><th>Parasympathique</th><th>Somatique</th></tr>
  <tr><td>Origine</td><td><span class="k">Thoraco-lombaire</span> ; chaîne ganglionnaire paravertébrale et plexus</td><td><span class="k">Cranio-sacrée</span> (III, VII, IX, X ; S2-S4) ; ganglions près des organes</td><td>Toute la moelle</td></tr>
  <tr><td>Neurones</td><td>2 (pré- et post-ganglionnaire)</td><td>2</td><td>1 motoneurone</td></tr>
  <tr><td>Synapse ganglionnaire</td><td colspan="2">ACh → <span class="k">récepteur nicotinique</span></td><td>—</td></tr>
  <tr><td>Médiateur sur la cible</td><td><span class="k">Noradrénaline</span> → α/β (lents, protéine G) ; (sudoripares : ACh)</td><td><span class="k">ACh → muscarinique</span> (lent, protéine G)</td><td>ACh → nicotinique (rapide)</td></tr></table>
  <p><b>Innervation réciproque</b> de la plupart des organes, <b>sauf</b> (sympathique seul) : <span class="k">muscle lisse vasculaire, glandes sudoripares, muscles piloérecteurs, foie, reins, médullosurrénale</span>. La médullosurrénale = ganglion sympathique modifié (libère A dans le sang).</p>
  <table><tr><th>Organe</th><th>Sympathique</th><th>Parasympathique</th></tr>
  <tr><td>Cœur</td><td>FC ↑, force ↑ (β1)</td><td>FC ↓ (M2)</td></tr>
  <tr><td>Bronches</td><td>Dilatation (β2)</td><td>Constriction (M3), sécrétions ↑</td></tr>
  <tr><td>Pupille</td><td>Mydriase (α1)</td><td>Myosis</td></tr>
  <tr><td>Tube digestif</td><td>Motricité et sécrétions ↓, sphincters contractés</td><td>Motricité et sécrétions ↑</td></tr>
  <tr><td>Vessie</td><td>Détrusor relâché, sphincter interne contracté</td><td>Détrusor contracté, sphincter relâché</td></tr>
  <tr><td>Vaisseaux</td><td>VC (α1) ; VD muscle (β2)</td><td>(peu d'innervation)</td></tr>
  <tr><td>Métabolisme</td><td>Glycogénolyse, lipolyse</td><td>—</td></tr></table>
  <p>Troubles : dysautonomies ; <span class="k">syndrome de Horner</span> (lésion sympathique : myosis, ptosis, anhidrose). SNA <b>NANC</b> : VIP, NO, substance P, sérotonine.</p>`,
  why: [["Cas TD Thibaut (salbutamol à forte dose) : pourquoi tachycardie et hypertension ?", "Le salbutamol est un β2-agoniste (bronchodilatateur) ; à forte dose, il perd sa sélectivité et stimule aussi les β1 cardiaques (FC, force ↑) ; il a aussi des effets anabolisants (dopage) et hypokaliémiants (troubles du rythme)."]],
  talk: { prompt: "Compare l'organisation du sympathique et du parasympathique (schéma) et donne leurs effets sur 5 organes.", check: ["Thoraco-lombaire vs cranio-sacré", "2 neurones, ACh nicotinique au ganglion", "NA (α/β) vs ACh (muscarinique)", "Exceptions à l'innervation réciproque", "Effets cœur, bronches, pupille, digestif, vessie"] },
  traps: ["Dire que le récepteur ganglionnaire est muscarinique.", "Oublier que les glandes sudoripares sympathiques utilisent l'ACh."] },

{ id: "thermo", title: "Sensibilité, thermorégulation, fièvre",
  html: `<p><b>Récepteurs sensoriels</b> : très sensibles (sauf nocicepteurs) ; codage de l'intensité par la <span class="k">fréquence des PA</span> (tout ou rien) ; <span class="k">adaptation</span>. Localisation : <span class="k">petit champ récepteur + forte densité = bonne résolution</span> (bout des doigts, lèvres) → homoncule disproportionné.</p>
  <p><b>Thermorécepteurs</b> : canaux <span class="k">TRP</span> (froid, chaud, brûlant) ; peau, moelle, viscères, et <span class="k">hypothalamus (Δ < 0,1 °C)</span>.</p>
  <p><b>Hypothalamus = thermostat</b> : antérieur = centre de thermolyse ; postérieur = centre de thermogenèse.</p>
  <table><tr><th>Lutte contre la chaleur</th><th>Lutte contre le froid</th></tr>
  <tr><td>Vasodilatation cutanée, <span class="k">sudation</span>, polypnée, comportement</td><td>Vasoconstriction cutanée, <span class="k">frissons</span>, piloérection, <span class="k">tissu adipeux brun</span>, hormones (T3/T4, catécholamines)</td></tr></table>
  <p>Zone de thermoneutralité entre les températures critiques inférieure et supérieure. Enfant vs adulte : plus de surface relative → se refroidit plus vite.</p>
  <p><b>Fièvre</b> : agents pyrogènes → <span class="k">PGE₂</span> (COX de l'endothélium de la barrière) → neurones du centre de thermogenèse (AMPc) → <span class="k">consigne relevée</span> → frissons, vasoconstriction jusqu'à la nouvelle consigne. Rôles : immunité (ROS), isolement, repos. <b>Antipyrétiques</b> (AINS, paracétamol) : ↓ PGE₂ → consigne normale. Anesthésie générale et alcool altèrent la thermorégulation.</p>`,
  why: [["Pourquoi frissonne-t-on au début d'une fièvre alors qu'on a déjà chaud ?", "La consigne hypothalamique a été relevée par la PGE₂ : la température réelle est « trop basse » par rapport à la nouvelle consigne, donc le corps produit et conserve de la chaleur."]],
  talk: { prompt: "Explique la thermorégulation et le mécanisme de la fièvre.", check: ["Thermorécepteurs périphériques et hypothalamiques", "Centres antérieur/postérieur", "Réponses au chaud et au froid", "Fièvre : pyrogènes → PGE₂ → consigne ↑", "Antipyrétiques : inhibition de la COX"] },
  traps: ["Dire que la fièvre est une défaillance du thermostat (c'est un réglage à une consigne plus haute)."] },

{ id: "douleur", title: "Nociception et douleur",
  html: `<p>Douleur = <b>signal d'alarme</b> protecteur ; aiguë (corrélée à la lésion) vs chronique (peu liée au stimulus) ; réactions végétatives (sympathique : FC, FR, sudation) ; modulée par les émotions (limbique) et l'expérience ; moins perçue en situation de stress.</p>
  <p><b>Récepteurs</b> : terminaisons nerveuses libres, activées par des stimuli intenses et par des médiateurs des tissus lésés (<span class="k">ATP, bradykinine, prostaglandines, histamine, H⁺, K⁺</span>).</p>
  <p><b>Fibres</b> : <span class="k">Aδ myélinisées → douleur rapide</span> (« première douleur », bien localisée) ; <span class="k">C non myélinisées → douleur lente</span> (sourde, persistante, mal localisée).</p>
  <p><b>Types</b> : somatique superficielle (peau) / profonde (os, articulations, crampe) / <span class="k">viscérale</span> (colique, ulcère) ; <b>neurogène/neuralgique</b> (influx né sur le trajet du nerf : zona, sciatique, membre fantôme) ; <span class="k">douleur projetée (référée)</span> : douleur viscérale ressentie sur un territoire cutané précis (convergence dans la moelle ; ex. cœur → bras gauche, appendicite d'abord péri-ombilicale puis fosse iliaque droite quand le péritoine pariétal est touché).</p>
  <p><b>Voie</b> : faisceau spinothalamique → formation réticulée, thalamus → cortex. <b>Modulation</b> : <span class="k">« gate control »</span> (les fibres du toucher activent des interneurones à enképhalines qui ferment la porte) et <span class="k">contrôle inhibiteur descendant</span> (sérotonine, noradrénaline, opioïdes endogènes).</p>
  <p><b>Douleur chronique / hyperalgésie</b> : pas d'adaptation des nocicepteurs, <span class="k">sensibilisation périphérique (PG)</span>, hyperexcitabilité centrale, contrôle descendant ↓.</p>
  <p><b>Pharmaco</b> : <span class="k">AINS</span> (périphérie : ↓ sensibilisation), <span class="k">anesthésiques locaux</span> (bloquent les canaux Na⁺ → pas de PA), froid (ralentit la conduction), péridurale, <span class="k">morphiniques</span> (imitent les opioïdes endogènes), α2-agonistes, anesthésie générale (conscience). Définitions : analgésie, hyperalgésie, hypoesthésie, hyperesthésie, dysesthésie.</p>`,
  why: [["Pourquoi met-on de la glace sur une entorse ?", "Le froid ralentit la conduction nerveuse et diminue l'activité des nocicepteurs (analgésie) ; il provoque une vasoconstriction qui limite l'œdème et l'inflammation (cas TD Pascale)."]],
  talk: { prompt: "Explique les deux douleurs après une piqûre et les moyens de moduler la douleur.", check: ["Aδ rapide localisée vs C lente diffuse", "Médiateurs (bradykinine, PG…)", "Spinothalamique → thalamus → cortex", "Gate control + contrôle descendant", "Cibles pharmacologiques (AINS, anesthésiques locaux, morphiniques)"] },
  traps: ["Inverser fibres Aδ (rapides) et C (lentes)."] },

{ id: "sens", title: "Sens spéciaux : odorat, goût, ouïe, équilibre, vision",
  html: `<p><b>Odorat</b> : neurones olfactifs (vie 4-8 semaines), récepteurs couplés aux protéines G (AMPc), ~350 gènes chez l'homme (> 1 000 rongeurs) ; épithélium ~5-10 cm² (chien ~150 cm²) ; → bulbe olfactif → limbique/cortex (pas de relais thalamique obligatoire). Réflexes digestifs (salivation…). Organe voméro-nasal absent chez l'homme.</p>
  <p><b>Goût</b> : 2 000-5 000 bourgeons, cellules renouvelées en ~2 semaines ; <span class="k">sucré, salé, acide, amer (très sensible), umami</span> ; canaux ioniques (salé, acide) et protéines G (sucré, amer, umami) ; nerfs <span class="k">VII, IX, X</span> → thalamus → cortex, tronc (réflexes digestifs), limbique. Rôle de la mastication, de la T° (rétro-olfaction : un repas chaud dégage plus d'arômes).</p>
  <p><b>Ouïe</b> : oreille externe → <span class="k">osselets (marteau, enclume, étrier)</span> : convertissent l'onde aérienne en vibration liquide (adaptation d'impédance) → cochlée : <span class="k">membrane basilaire</span> (base : aigus ; apex : graves, tonotopie) → <span class="k">cellules ciliées de l'organe de Corti</span> (canaux mécanosensibles reliés par les « tip links ») → nerf VIII. Homme : 20-20 000 Hz, sensibilité max 1 000-4 000 Hz ; > 130 dB = douleur. Surdité de transmission (bouchon, otite) vs de perception (cellules ciliées, ototoxiques). Trompe d'Eustache : équilibre des pressions (otite lors d'un rhume).</p>
  <p><b>Équilibre</b> : <span class="k">canaux semi-circulaires</span> (cupule, endolymphe : <b>rotations</b>) ; <span class="k">utricule et saccule</span> (otolithes : <b>position de la tête, accélérations linéaires</b>) → VIII → noyaux vestibulaires → moelle (vestibulo-spinal), cervelet, noyaux oculomoteurs (réflexe vestibulo-oculaire), thalamus/cortex. Dysfonction : vertige, <span class="k">nystagmus</span>, tête penchée.</p>
  <p><b>Vision</b> : 3 tuniques (sclérotique/cornée, choroïde, rétine) ; <span class="k">humeur aqueuse</span> produite par le corps ciliaire, évacuée par le canal de Schlemm → excès = <span class="k">glaucome</span> (pression intraoculaire ↑ ; traitements : ↓ production, ↑ évacuation) ; <b>photorécepteurs</b> : <span class="k">bâtonnets</span> (vision nocturne, sensibles) et <span class="k">cônes</span> (couleurs, acuité, fovéa) ; accommodation (cristallin, muscle ciliaire parasympathique) ; pupille (iris). Larmes : lubrification ; sécheresse oculaire liée aux écrans (clignement ↓). Strabisme : déséquilibre des muscles oculomoteurs (toxine botulique : bloque la libération d'ACh → relâche le muscle trop fort).</p>`,
  why: [["Pourquoi un rhume fait-il parfois mal aux oreilles ?", "La trompe d'Eustache, bouchée par l'inflammation, n'égalise plus la pression de l'oreille moyenne → tympan tiré, douleur, voire otite (cas TD respi de Jeanne)."]],
  talk: { prompt: "Explique comment un son est transformé en influx nerveux.", check: ["Tympan → osselets (adaptation air → liquide)", "Fenêtre ovale → périlymphe → membrane basilaire", "Tonotopie (base aigus, apex graves)", "Cellules ciliées, tip links, canaux mécanosensibles", "Nerf VIII → tronc → thalamus → cortex auditif"] },
  traps: ["Confondre canaux semi-circulaires (rotation) et otolithes (gravité, accélération linéaire)."] }
],

{ id: "axe", title: "Axe hypothalamo-hypophyso-gonadique",
  html: `<p>Le système reproducteur n'est <b>pas vital pour l'individu</b> mais indispensable à l'espèce ; il est mis « en veille » si la survie est menacée (maladie, perte de poids).</p>
  <p><b>GnRH</b> (hypothalamus, demi-vie 2-4 min, <span class="k">sécrétion pulsatile</span>) : <span class="k">centre tonique</span> (sécrétion basale, dans les deux sexes, peu actif avant la puberté) et <span class="k">centre cyclique</span> (<b>seulement chez la femme</b> : si œstrogènes élevés → décharge massive pré-ovulatoire).</p>
  <p><b>FSH et LH</b> (adénohypophyse, pulsatiles) : la GnRH ne les règle pas séparément ; c'est l'<span class="k">inhibine</span> (gonades) qui freine sélectivement la <b>FSH</b> (et l'activine la stimule).</p>
  <ul><li><span class="k">FSH</span> : croissance folliculaire et synthèse d'œstrogènes (femme) ; cellules de Sertoli, spermatogenèse (homme).</li>
  <li><span class="k">LH</span> : ovulation, formation et maintien du corps jaune, progestérone (femme) ; cellules de Leydig, testostérone (homme).</li></ul>
  <p><b>Rétrocontrôle</b> : négatif dans la plupart des cas (testostérone, progestérone, œstrogènes bas, inhibine) ; <span class="k">positif quand le rapport E/P est élevé</span> (fin de phase folliculaire) → pic de LH. Influences externes : développement corporel (leptine), photopériode (mélatonine, chez l'animal), facteurs sociaux, stimulations sensorielles, exercice intense, stress.</p>`,
  why: [["Pourquoi une sportive de haut niveau très maigre peut-elle perdre ses règles ?", "Le manque d'énergie (leptine basse) et le stress freinent la GnRH pulsatile → FSH/LH ↓ → pas de cycle : le système reproducteur est mis en veille."]],

  traps: ["Dire que l'homme a un centre cyclique.", "Oublier l'inhibine."] },

{ id: "diff", title: "Différenciation sexuelle et puberté",
  html: `<p><b>4 « sexes »</b> : chromosomique (XX/XY), gonadique, phénotypique (caractères sexuels), psychologique.</p>
  <ul><li>Le chromosome <b>Y</b> porte le <span class="k">facteur de détermination testiculaire (SRY)</span> → testicule.</li>
  <li>Testicule fœtal : <span class="k">AMH (hormone anti-müllérienne, Sertoli)</span> → régression des canaux de Müller ; <span class="k">testostérone (Leydig)</span> → canaux de Wolff → voies génitales masculines (DHT → organes externes).</li>
  <li><b>En l'absence de testostérone</b> fœtale, le tractus se développe en féminin <span class="k">de façon passive</span> (sans hormone ovarienne).</li>
  <li>Cerveau : chez le fœtus masculin, les androgènes (aromatisés en œstrogènes dans le cerveau) empêchent le développement du centre cyclique ; chez la femme, l'<span class="k">α-fœtoprotéine</span> lie les œstrogènes plasmatiques et protège le cerveau.</li></ul>
  <p><b>Puberté</b> : âge où l'on peut se reproduire (≠ maturité sexuelle) ; croissance allométrique des organes sexuels ; réactivation de la GnRH pulsatile ; atteinte vers 55-60 % du poids adulte (leptine), facteurs génétiques, psychosociaux ; âge des premières règles en baisse au cours du siècle.</p>`,
  why: [["Un fœtus XY dont les cellules ne répondent pas à la testostérone : quel phénotype ?", "Féminin externe (insensibilité aux androgènes), mais sans utérus car l'AMH a fait régresser les canaux de Müller."]],
  talk: { prompt: "Comment se différencient les voies génitales masculines et féminines ?", check: ["SRY → testicule", "AMH : régression de Müller", "Testostérone : Wolff ; DHT : organes externes", "Féminin : développement passif", "Différenciation cérébrale"] },
  traps: ["Dire que les ovaires fœtaux « féminisent » les voies génitales (c'est passif)."] },

{ id: "homme", title: "Reproduction masculine",
  html: `<p><b>Testicules</b> (glandes amphicrines, extra-abdominales dans le scrotum : <span class="k">spermatogenèse à ~2-3 °C sous la T° corporelle</span>) ; muscle crémaster ; <span class="k">circulation à contre-courant</span> (thermorégulation, testostérone). Non-descente : <span class="k">cryptorchidie</span> (~1 %, plus si prématuré) → infertilité, risque tumoral.</p>
  <p><b>Tubes séminifères</b> : <span class="k">cellules de Sertoli</span> (nourrissent, <span class="k">barrière hémato-testiculaire</span>, inhibine/activine, aromatase, ABP = androgen-binding protein, antioxydants) ; entre les tubes : <span class="k">cellules de Leydig → testostérone</span> (sous LH).</p>
  <p><b>Spermatogenèse</b> : <span class="k">≈ 64 jours (40-60 j)</span>, continue dès la puberté ; maturation et stockage dans l'<b>épididyme</b> (~6 m). Spermatozoïde : acrosome (enzymes : hyaluronidase), mitochondries (substrat : <b>fructose</b>), flagelle (~3 mm/min).</p>
  <p><b>Régulation</b> : GnRH → <span class="k">LH → Leydig → testostérone</span> ; <span class="k">FSH (+ testostérone locale) → Sertoli → spermatogenèse</span> ; rétrocontrôle négatif : <span class="k">testostérone → GnRH/LH</span>, <span class="k">inhibine → FSH</span>.</p>
  <p><b>Effets de la testostérone</b> : différenciation fœtale, sexe psychologique, organes génitaux et glandes annexes, caractères sexuels secondaires, <span class="k">anabolisme (muscle ↑, hématocrite ↑)</span>, ostéogenèse ; hyperplasie bénigne de la prostate (DHT).</p>
  <p><b>Plasma séminal</b> (vésicules séminales, prostate, glande bulbo-urétrale) : <span class="k">fructose (énergie)</span>, électrolytes (pH basique → neutralise l'acidité vaginale), prostaglandines, enzymes (coagulation puis liquéfaction), lubrification. Sperme : 2,5-6 mL, ~66 millions/mL ; <span class="k">stérilité si < 20 millions/mL</span> (ou motilité réduite, formes anormales). Fertilité masculine déclinant lentement avec l'âge.</p>`,
  why: [["Pourquoi un anabolisant (testostérone exogène) rend-il infertile ?", "Elle exerce un rétrocontrôle négatif → LH et FSH ↓ → la testostérone intratesticulaire (très élevée, nécessaire à la spermatogenèse) chute et les testicules s'atrophient."]],
  talk: { prompt: "Explique la régulation hormonale de la spermatogenèse (schéma).", check: ["GnRH → LH/FSH", "LH → Leydig → testostérone", "FSH + testostérone → Sertoli → spermatogenèse", "Inhibine → FSH ; testostérone → LH/GnRH", "Rôles des Sertoli, barrière hémato-testiculaire"] },
  traps: ["Inverser Leydig (testostérone) et Sertoli (soutien, inhibine)."] },

{ id: "femme", title: "Ovaires, ovocytes et voies génitales féminines",
  html: `<p><b>Ovocytes</b> : tous formés pendant la <span class="k">vie fœtale</span> (maximum à mi-gestation, puis apoptose massive) ; méiose bloquée au stade d'<span class="k">ovocyte primaire (prophase I)</span> jusqu'à l'ovulation, parfois 20-50 ans → <span class="k">fertilité qui chute avec l'âge, risque de trisomie ↑</span>.</p>
  <p><b>Ovaires</b> : glandes amphicrines, 4 × 2 × 1 cm ; maturation cyclique des follicules de la puberté à la ménopause ; <span class="k">œstrogènes (phase folliculaire), progestérone (phase lutéale)</span>.</p>
  <p><b>Trompes (oviductes)</b> : pavillon, épithélium cilié ; transport de l'ovocyte et des spermatozoïdes, <span class="k">site de la fécondation (ampoule)</span>, transport de l'embryon.</p>
  <p><b>Utérus</b> : <span class="k">endomètre</span> (prolifère et involue selon les hormones), <span class="k">myomètre</span> (muscle lisse, contractilité selon E/P) ; nutrition, protection et expulsion du fœtus. <b>Col</b> : mucus perméable sous œstrogènes. <b>Vagin</b> : flore lactique → pH acide (anti-infectieux).</p>`,
  why: [["Pourquoi le risque de trisomie 21 augmente-t-il avec l'âge maternel ?", "Les ovocytes sont restés bloqués en méiose I pendant des décennies : la séparation des chromosomes à la reprise de la méiose est plus souvent défectueuse."]],
  talk: { prompt: "Compare la gamétogenèse masculine et féminine.", check: ["Homme : continue dès la puberté, millions/jour", "Femme : stock fixé avant la naissance, méiose bloquée", "Reprise de la méiose à chaque ovulation", "Conséquences de l'âge"] },
  traps: [] },

{ id: "cycle", title: "Le cycle ovarien et menstruel",
  html: `<p><b>Phase folliculaire</b> (J1 = début des règles chez la femme, ~14 j) : FSH recrute une vague de follicules → <span class="k">sélection puis dominance</span> d'un follicule (les autres : <b>atrésie</b>).</p>
  <ul><li><b>Modèle 2 cellules-2 gonadotrophines</b> : <span class="k">LH → cellules de la thèque → androgènes</span> ; <span class="k">FSH → cellules de la granulosa → aromatase → œstradiol</span> ; la granulosa sécrète le liquide folliculaire, se multiplie, augmente ses récepteurs à la FSH.</li>
  <li>Œstradiol ↑ → endomètre prolifère, mucus cervical perméable ; d'abord rétrocontrôle négatif, puis, <span class="k">quand E/P est élevé et soutenu, rétrocontrôle positif → centre cyclique → pic de GnRH → pic de LH</span>.</li></ul>
  <p><b>Ovulation</b> (~J14, ~24-36 h après le pic de LH) : rupture du follicule, l'ovocyte (+ cellules de la granulosa) est capté par la trompe. Ovocyte viable <span class="k">~24 h</span>, spermatozoïde <span class="k">~48 h (jusqu'à 3-5 j)</span>. Chez la femme, ovulation <b>spontanée</b> (chez certaines espèces : induite par l'accouplement).</p>
  <p><b>Phase lutéale</b> (~14 j, durée assez fixe) : le follicule devient <span class="k">corps jaune</span> (thèque + granulosa, très vascularisé, sous LH) → <span class="k">progestérone</span> (+ œstrogènes, inhibine) → endomètre sécrétoire ; <span class="k">rétrocontrôle négatif → LH/FSH ↓</span> (pas de nouvelle ovulation).</p>
  <p><b>Sans grossesse</b> : <span class="k">lutéolyse</span> (régression du corps jaune ; chez l'animal par PGF₂α utérine ; chez la femme d'origine surtout ovarienne) → chute de P et E → menstruation et levée du rétrocontrôle → FSH ↑ → nouveau cycle. <b>Avec grossesse</b> : l'<span class="k">hCG</span> embryonnaire maintient le corps jaune.</p>
  <p>Pas d'activité cyclique : avant la puberté, pendant la grossesse, après l'accouchement (allaitement), après la ménopause, en cas de trouble. Cycle anovulatoire : pas de corps jaune.</p>`,
  why: [["Pourquoi la LH chute-t-elle sept jours après l'ovulation ?", "Les œstrogènes et la progestérone du corps jaune suppriment la sécrétion de GnRH et de LH (rapport E/P bas → rétrocontrôle négatif). Examen 2019."],
        ["Mode d'action de la pilule progestative prise 3 semaines à partir du 7ᵉ jour ?", "Elle maintient un rapport E/P bas → rétrocontrôle négatif permanent → pas de pic de LH, pas d'ovulation ; elle épaissit aussi le mucus cervical. L'arrêt (semaine sans pilule) provoque une hémorragie de privation."]],
  talk: { prompt: "Décris le cycle ovarien avec les courbes de FSH, LH, œstradiol et progestérone.", check: ["Phase folliculaire : FSH, recrutement, dominance, œstradiol ↑", "Modèle 2 cellules : thèque (LH, androgènes) et granulosa (FSH, aromatase)", "Rétrocontrôle positif → pic de LH → ovulation", "Corps jaune → progestérone → FB −", "Lutéolyse → règles ; hCG si grossesse"] },
  traps: ["Placer le pic de progestérone avant l'ovulation.", "Dire que l'ovulation est déclenchée par la FSH (c'est le pic de LH)."] },

{ id: "hormones", title: "Effets des œstrogènes et de la progestérone",
  html: `<table><tr><th>Œstrogènes (ovaires, placenta, surrénales ; phyto-œstrogènes)</th><th>Progestérone (corps jaune, placenta > 12ᵉ semaine)</th></tr>
  <tr><td>
  <ul><li>Croissance et maturation folliculaires</li><li>Prépare vagin, col (mucus perméable aux spermatozoïdes), organes externes</li><li><span class="k">Endomètre : prolifération</span> ; myomètre : tonus ↑ ; sensibilité à l'ocytocine ↑</li><li>Glande mammaire : canaux</li><li>Répartition des graisses</li><li><span class="k">Os : freinent les ostéoclastes (anti-ostéoporose)</span></li><li>Rétention de Na⁺ et d'eau ; ↑ GH, PRL</li></ul></td>
  <td>
  <ul><li>« Pro-gestation » : <span class="k">endomètre sécrétoire</span> (glandes, nidation)</li><li><span class="k">Calme le myomètre</span> (E/P ↓ → pas de contractions)</li><li><span class="k">Rétrocontrôle négatif sur la GnRH</span> : pas de nouvelle ovulation</li><li>Glande mammaire : acini, préparation à la lactation</li><li>Mucus cervical épais ; T° basale ↑ (~0,3-0,5 °C après l'ovulation)</li><li>Demi-vie courte → chute rapide à la lutéolyse</li></ul></td></tr></table>
  <p><b>Rapport E/P</b> : FB − quand E/P bas (phase lutéale, début folliculaire) ; FB + quand E/P élevé (fin de phase folliculaire).</p>
  <p>Le développement musculaire dépend de la <b>présence d'androgènes</b>, pas de l'absence d'œstrogènes.</p>`,
  why: [["Pourquoi la ménopause favorise-t-elle l'ostéoporose ?", "Les œstrogènes atténuent l'effet de la PTH sur les ostéoclastes ; leur chute libère la résorption osseuse."]],
  talk: { prompt: "Compare les effets des œstrogènes et de la progestérone sur l'utérus, le col, la glande mammaire et l'hypothalamus.", check: ["Endomètre prolifératif vs sécrétoire", "Myomètre contractile vs calme", "Mucus perméable vs épais", "Canaux vs acini mammaires", "FB + (E/P élevé) vs FB −"] },
  traps: [] },

{ id: "acte", title: "Acte sexuel, fécondation, grossesse, accouchement, lactation",
  html: `<p><b>Érection</b> : <span class="k">parasympathique (ACh, VIP, NO → GMPc)</span> → vasodilatation des artérioles du pénis → engorgement des corps caverneux et spongieux (inhibiteurs de la PDE5 : prolongent le GMPc). <b>Émission</b> (sympathique, ocytocine : contraction du canal déférent, mélange avec le plasma séminal) puis <b>éjaculation</b> (réflexe : muscles ischio- et bulbo-caverneux). Résolution : vasoconstriction (sympathique), <b>période réfractaire</b> chez l'homme (pas chez la femme). Phases : excitation, plateau, orgasme, résolution (femme : vasodilatation vaginale, mucus, redressement de l'utérus).</p>
  <p><b>Transport des spermatozoïdes</b> : col (obstacle), utérus (contractions favorisées par E/P ↑, PG du sperme, ocytocine), trompe. <span class="k">Capacitation</span> dans les voies féminines, <span class="k">réaction acrosomique</span> au contact de la zone pellucide → fécondation dans l'<b>ampoule</b> → zygote → nidation vers J6-7.</p>
  <p><b>Grossesse</b> : <span class="k">hCG</span> (trophoblaste, base des tests) maintient le corps jaune jusqu'à ce que le <span class="k">placenta prenne le relais (> 12ᵉ semaine)</span> pour la progestérone ; œstrogènes placentaires ↑ en fin de grossesse ; hPL (lactogène placentaire : épargne du glucose maternel), relaxine (relâche les ligaments pelviens, col).</p>
  <p><b>Accouchement</b> : stress fœtal → <span class="k">cortisol fœtal</span> → placenta : E ↑, P ↓, PGF₂α ↑ → sensibilité du myomètre à l'ocytocine ↑ → <span class="k">réflexe de Ferguson (rétrocontrôle positif)</span> : étirement du col → ocytocine → contractions → étirement ↑.</p>
  <p><b>Lactation</b> : prolactine (production ; freinée pendant la grossesse par les fortes E/P, levée à l'accouchement) ; <span class="k">ocytocine → éjection (réflexe de succion)</span> ; la succion ↑ prolactine et freine la GnRH (aménorrhée de lactation). <span class="k">Colostrum</span> : riche en immunoglobulines (chez l'homme, IgG déjà transférées par le placenta hémochorial).</p>
  <p><b>Ménopause</b> (~45-50 ans) : <span class="k">épuisement folliculaire</span> → plus de réponse ovarienne → <span class="k">œstrogènes ↓, inhibine ↓ → FSH et LH ↑</span> (perte du rétrocontrôle) ; bouffées de chaleur, ostéoporose, risque cardiovasculaire ↑ ; les surrénales deviennent la source principale d'œstrogènes (aromatisation des androgènes).</p>`,
  why: [["Comment un test de grossesse fonctionne-t-il ?", "Il détecte l'hCG produite par le trophoblaste dès la nidation, dans l'urine ou le sang."]],
  talk: { prompt: "Explique les mécanismes hormonaux de l'accouchement et de la lactation.", check: ["Stress fœtal → cortisol fœtal", "E ↑, P ↓, PGF₂α → myomètre sensible", "Ferguson : rétrocontrôle positif ocytocine", "Prolactine (production) vs ocytocine (éjection)", "Succion, aménorrhée de lactation"] },
  traps: ["Dire que l'érection est sympathique (elle est parasympathique ; l'émission est sympathique)."] }
],

concepts: [
{ id: "exo", title: "Exercice aigu : réponses cardio-vasculaires et sanguines",
  html: `<p><b>Exercice</b> = une séance ; <b>entraînement</b> = répétition sur plusieurs semaines (adaptations).</p>

  <p><b>Respiration</b> : ventilation ↑ (commande centrale + chimiorécepteurs + propriocepteurs) ; l'échauffement accélère la montée de VO₂. Exercice très intense (athlète) : <span class="k">hypoxémie d'effort, hypercapnie, acidose</span> (temps de transit capillaire ↓, œdème interstitiel ?, fatigue des muscles respiratoires).</p>
  <p><b>Hormones à l'effort</b> : <span class="k">adrénaline ↑</span> (proportionnelle à l'intensité), <span class="k">cortisol ↑</span>, <span class="k">glucagon ↑ / insuline ↓</span> (glycémie maintenue ; éviter un repas sucré juste avant l'effort → pic d'insuline puis hypoglycémie), <span class="k">aldostérone</span> (hyperkaliémie d'effort), T3/T4 (turnover ↑), <span class="k">endorphines</span> (euphorie, analgésie). Hormones gonadiques : pas d'effet direct.</p>`,
  why: [["Pourquoi l'insuline baisse-t-elle pendant l'effort alors que les muscles consomment du glucose ?", "La contraction musculaire fait migrer GLUT4 à la membrane indépendamment de l'insuline ; la baisse d'insuline (sympathique α2) laisse le foie libérer du glucose et le tissu adipeux des acides gras."]],
  talk: { prompt: "Décris toutes les réponses physiologiques à un effort aérobie intense (cardio, respi, sang, hormones).", check: ["Fick : FC, VES, extraction", "Redistribution du débit (α, β2, métabolites)", "Ventilation, gaz du sang, effet Bohr", "Hormones : A, cortisol, glucagon/insuline, endorphines", "Thermorégulation (sudation, volume plasmatique ↓)"] },

{ id: "sed", title: "Physiologie de la sédentarité",
  html: `<p><b>Comportement sédentaire</b> = tout comportement d'éveil à <span class="k">faible dépense énergétique (≤ 1,5 MET)</span>, assis ou couché (adultes : 5 à 11,5 h/jour). <span class="k">Sédentarité ≠ inactivité physique</span> : on peut faire du sport et être très sédentaire (4 profils combinant activité et sédentarité).</p>
  <p><b>MET</b> (équivalent métabolique) : 1 MET ≈ dépense au repos (≈ 1 kcal/kg/h, ≈ 3,5 mL O₂/kg/min). Marche ≈ 3-4 MET, course ≈ 8-12 MET.</p>
  <p><b>Court terme</b> : « <span class="k">résistance à l'exercice</span> » : avec ≤ ~5 000 pas/jour, une heure de course ne suffit plus à améliorer le métabolisme des lipides après un repas gras (oxydation des graisses ↓, triglycérides ↑) ; ~8 500 pas/jour protègent.</p>

  traps: [] },

{ id: "meta", title: "Métabolisme : nutriments, absorption/post-absorption, jeûne, IMC",
  html: `<p><b>Énergie</b> : glucides ≈ <span class="k">4 kcal/g</span> (17 kJ), protéines ≈ <span class="k">4 kcal/g</span>, lipides ≈ <span class="k">9 kcal/g</span> (38 kJ). Couvrir les besoins énergétiques est « facile », couvrir les besoins métaboliques (AA essentiels, vitamines, fibres) plus complexe.</p>
  <p><b>Composition corporelle</b> : avec l'âge, % d'eau et de protéines (muscle) ↓, % de lipides ↑ ; différences selon le sexe.</p>
  <p><span class="k">IMC = poids (kg) / taille² (m²)</span> (Quetelet) : 18,5-25 normal, 25-30 surpoids, ≥ 30 obésité. Un IMC normal et stable tout au long de la vie est associé au risque cardiovasculaire le plus bas. Besoins selon âge, sexe, activité (MET) ; les apports dépassent souvent les besoins.</p>
  <table><tr><th>Phase d'absorption (repas)</th><th>Post-absorption (à jeun)</th></tr>
  <tr><td><span class="k">Insuline</span> : glucose capté, glycogenèse (foie, muscle), lipogenèse, protéosynthèse ; chylomicrons → lipoprotéine lipase → TG stockés</td><td><span class="k">Glucagon, adrénaline, cortisol, GH</span> : glycogénolyse, néoglucogenèse, lipolyse ; le cerveau garde le glucose, les autres tissus passent aux acides gras</td></tr></table>
  <p><b>Lipoprotéines</b> : chylomicrons (lipides alimentaires, voie lymphatique), VLDL (TG hépatiques), LDL (cholestérol vers les tissus), HDL (retour du cholestérol au foie).</p>
  <p><b>Jeûne prolongé</b> : réserves de glycogène épuisées en ~24 h → néoglucogenèse (AA musculaires, glycérol, lactate) → puis <span class="k">corps cétoniques</span> utilisés par le cerveau (épargne des protéines) → au-delà, protéolyse vitale.</p>
  <p><b>Fibres</b> : non digestibles ; régulent le transit, nourrissent le microbiote (AGV), ralentissent l'absorption du glucose, ↓ cholestérol ; apports actuels (~17-24 g/j) inférieurs aux recommandations (~25-30 g/j).</p>`,
  why: [["Pourquoi le cerveau peut-il survivre à un jeûne prolongé ?", "Après quelques jours, il utilise les corps cétoniques produits par le foie à partir des acides gras, ce qui réduit le besoin de néoglucogenèse à partir des protéines musculaires."]],

{ id: "integ", title: "Intégration multi-systèmes : homéostasie hydro-électrolytique, glymphatique",
  html: `<p><b>Homéostasie hydro-électrolytique</b> (⭐ « uniquement schéma de droite (b) ») : les systèmes cardio-vasculaire, rénal, endocrinien, nerveux et le comportement (soif, appétit pour le sel) coopèrent.</p>
  <ul><li><b>(a) ↓ PA/volume</b> : récepteurs de volume auriculaires et barorécepteurs → réflexes cardio-vasculaires (DC ↑, vasoconstriction), soif, ADH (conservation d'eau), SRAA (Na⁺) → PA et volume restaurés.</li>
  <li><b>(b) ↑ PA/volume</b> : récepteurs auriculaires et barorécepteurs → <span class="k">DC ↓ et vasodilatation</span>, <span class="k">soif ↓</span>, <span class="k">ADH ↓, ANP ↑, rénine/aldostérone ↓</span> → <span class="k">excrétion de sels et d'eau</span> → volume LEC et LIC ↓ → PA ↓.</li></ul>
  <p><b>Équilibre potassique</b> (⭐ « hyper/hypo ») : K⁺ plasmatique 3,5-5 mmol/L ; aldostérone → sécrétion de K⁺. <span class="k">Hyperkaliémie</span> → dépolarisation partielle → troubles du rythme (risque d'arrêt) ; <span class="k">hypokaliémie</span> → hyperpolarisation → faiblesse musculaire, arythmies. Insuline, adrénaline (β2) font entrer le K⁺ dans les cellules.</p>
  <p><b>Système glymphatique</b> : épuration du cerveau par le LCR circulant le long des espaces périvasculaires (aquaporines astrocytaires) ; dépend de la <b>pulsatilité artérielle</b>, de la <b>pompe respiratoire</b> et surtout du <span class="k">sommeil profond (NREM)</span> (espace extracellulaire ↑ ~60 %). Diminue avec l'âge ; un défaut est impliqué dans les maladies neurodégénératives (accumulation de protéines, ex. β-amyloïde).</p>`,
  why: [["Quel lien entre sommeil et prévention de la démence ?", "Le drainage glymphatique est maximal pendant le sommeil profond ; un sommeil insuffisant réduit l'élimination des déchets protéiques cérébraux."]],

{ id: "age", title: "Vieillissement et fin de vie",
  html: `<p>Espérance de vie ↑ (alimentation, antibiotiques, vaccins, soins dentaires) ; l'effort médical se concentre sur les personnes âgées.</p>
  <p>Maturation : le <span class="k">rein</span> atteint son maximum fonctionnel tôt (1-2 ans), le <span class="k">poumon</span> vers 12-15 ans (d'où l'impact des maladies respiratoires de l'enfance).</p>
  <p><b>Perte de fonction avec l'âge</b>, d'abord : <span class="k">respiratoire</span> (volume résiduel ↑ aux dépens des réserves, VO₂max ↓), <span class="k">rénale</span> (perfusion et <b>DFG ↓</b> → <span class="k">adapter la posologie</span> des médicaments à élimination rénale, ex. théophylline), <span class="k">cardio-vasculaire</span> (rigidité artérielle, PA systolique ↑).</p>
  <p>Trajectoires : vieillissement normal, accéléré (neurodégénératif), avec facteurs de risque (avec/sans prise en charge), pathologique.</p>

function buildPlan(start, exam) {
  const total = Math.max(10, diffDays(start, exam)); const learnSpan = Math.max(ORDER.length, Math.floor(total * 0.55)); const step = Math.max(1, Math.floor(learnSpan / ORDER.length));
  const plan = {}; const add = (d, t) => { if (d < 0 || d >= total) return; (plan[d] = plan[d] || []).push(t); };
  ORDER.forEach((id, i) => { const d0 = i * step; add(d0, ["new", id]); [1, 3, 7, 14, 30].forEach(g => add(d0 + g, ["rev", id])); });
  for (let d = Math.max(0, total - 12); d < total; d++) add(d, ["oral", null]);
  return { plan, total, step };
}

<p class="small" style="margin-top:0">Chaque outil de cette page applique une méthode dont l'efficacité a été mesurée dans des études contrôlées en psychologie cognitive et en sciences de l'éducation. La grande revue de Dunlosky et al. (2013) a évalué 10 techniques d'étude : <b>se tester</b> (pratique de récupération) et <b>espacer les révisions</b> obtiennent la note d'utilité la plus élevée ; l'<b>entrelacement</b>, l'<b>interrogation élaborative</b> et l'<b>auto-explication</b> une note moyenne ; <b>relire, surligner et résumer</b> une note faible.</p>
<div class="box trap" style="margin-bottom:0"><b>À éviter :</b> relire le PDF plusieurs fois ou surligner. On a l'impression de savoir parce que le texte est familier, mais on ne s'entraîne pas à le retrouver seule, ce que l'examen exige.</div></div>

<div class="card"><h2>Les méthodes, et où elles sont dans la page</h2>
<div class="method"><b>1. Se tester plutôt que relire (pratique de récupération)</b><br><span class="small">Flashcards, Quiz, Séance du jour. Dans l'étude de Roediger &amp; Karpicke (2006), les étudiants qui s'étaient testés retenaient nettement plus une semaine plus tard que ceux qui avaient relu. Réponds toujours <b>avant</b> de voir la réponse, même si tu n'es pas sûre.</span></div>
<div class="method"><b>2. Espacer les séances</b><br><span class="small">Plan J+1, J+3, J+7, J+14, J+30 et boîtes des flashcards. Cepeda et al. (2008, plus de 1 350 participants) montrent que l'intervalle optimal entre deux révisions augmente avec le délai jusqu'à l'examen. Mieux vaut 15 minutes réparties sur 5 jours que 75 minutes la veille.</span></div>
<div class="method"><b>3. Réapprendre jusqu'au critère, sur plusieurs séances (réapprentissage successif)</b><br><span class="small">Dans les sessions, une question ratée revient jusqu'à ce que tu la réussisses ; puis elle revient les jours suivants. Rawson &amp; Dunlosky recommandent de réussir chaque élément au moins une fois par séance, sur environ 3 séances espacées : c'est ce qui rend le souvenir durable.</span></div>
<div class="method"><b>4. Mélanger les types de problèmes (entrelacement)</b><br><span class="small">Onglet Mélange et Séance du jour. En maths, des élèves ayant mélangé les types d'exercices ont nettement mieux réussi un test surprise un mois plus tard (61 % contre 38 % dans un essai sur 787 élèves de Rohrer et al.). Le gain vient surtout du fait qu'il faut <b>choisir la méthode</b> : c'est pour cela que l'onglet Mélange te demande d'abord « quelle méthode ? ». C'est plus difficile sur le moment, et c'est normal.</span></div>
<div class="method"><b>5. Exemples résolus puis aide qui s'estompe</b><br><span class="small">Onglet Exemples guidés. Au début d'un apprentissage, étudier un exemple résolu est plus efficace que de chercher seule (Sweller ; Renkl). Ensuite, on retire les étapes en commençant par la fin (« estompage arrière », Renkl &amp; Atkinson), jusqu'à résoudre seule. Le niveau s'adapte à tes réussites.</span></div>
<div class="method"><b>6. Se demander « pourquoi ? » et s'expliquer les étapes</b><br><span class="small">Encadrés « Pourquoi ? » de la Leçon active et boutons « pourquoi ? » des exemples. Relier chaque règle à sa raison (interrogation élaborative, auto-explication) aide à comprendre et à transférer à des problèmes nouveaux.</span></div>
<div class="method"><b>7. Expliquer à voix haute, sans regarder</b><br><span class="small">Encadrés « Explique à voix haute ». C'est une forme de rappel libre et d'auto-explication. La liste à cocher te montre ce que tu as oublié.</span></div>
<div class="method"><b>8. Se tester avant d'apprendre (pré-test)</b><br><span class="small">Bouton Pré-test. Essayer de répondre avant d'avoir étudié, même en se trompant, améliore la mémorisation de ce qu'on apprend ensuite (Richland, Kornell &amp; Kao, 2009 ; Kornell, Hays &amp; Bjork, 2009).</span></div>
<div class="method"><b>9. Noter sa certitude et corriger les erreurs « sûres »</b><br><span class="small">Boutons Sûre / Hésitante / Au hasard et tableau de calibration. Les erreurs commises avec une forte confiance sont paradoxalement les mieux corrigées après le feedback (effet d'hypercorrection, Butterfield &amp; Metcalfe, 2001). Comparer ta confiance à tes résultats t'apprend aussi à savoir ce que tu sais vraiment.</span></div>
<div class="method"><b>10. Rendre les bases automatiques (sprints)</b><br><span class="small">Onglet Sprint. Quand les conversions, abréviations et densités sont instantanées, ta mémoire de travail reste disponible pour le raisonnement. On vise d'abord la précision, ensuite la vitesse. Honnêtement : cette idée est surtout étudiée pour le calcul de base chez les enfants, et une étude n'a pas trouvé d'avantage de rétention au simple entraînement chronométré par rapport à la même quantité de pratique. Utilise donc les sprints en complément, pas à la place des autres méthodes.</span></div>
<div class="method"><b>11. Une méthode de calcul stable, avec les unités</b><br><span class="small">Dans les corrections, chaque étape garde son unité (mg, g, mL). En formation infirmière, apprendre à poser les calculs de doses avec les unités (analyse dimensionnelle) a amélioré la précision par rapport au calcul classique. Écris toujours l'unité à chaque ligne et vérifie l'ordre de grandeur.</span></div>
</div>

<div class="card"><h2>Spécial physiologie (examen oral) : ce qui change</h2>
<div class="method"><b>Rappel libre à voix haute</b><br><span class="small">L'oral exige de <b>produire</b> une explication structurée, pas de reconnaître la bonne réponse. Les encadrés « Explique à voix haute » et l'onglet 🎤 Oral blanc t'entraînent exactement à cela : prépare par écrit, parle sans notes, puis compare à la grille. C'est la forme de test la plus exigeante et la plus proche de l'examen (rappel libre).</span></div>
<div class="method"><b>Schémas reconstruits, pas recopiés</b><br><span class="small">L'onglet 🧩 cache progressivement les cases d'un schéma (1/3, 2/3, feuille blanche). Recréer un schéma de mémoire est une pratique de récupération ; le refaire à J+3 puis J+7 l'espace. Dessiner en expliquant combine deux codages (verbal + visuel), ce qui aide particulièrement une mémoire visuelle.</span></div>
<div class="method"><b>Relier les systèmes (interrogation élaborative)</b><br><span class="small">La prof évalue le « savoir transposer » : les « Pourquoi ? » et les cas de TD t'obligent à relier cœur, rein, hormones et respiration. Se demander « qu'est-ce qui se passerait si… ? » est plus efficace que relire.</span></div>
<div class="method"><b>Préparer la question TP/TD à livre ouvert</b><br><span class="small">Un livre ouvert ne sert que si tu sais où chercher : fais pour chaque cas de TD une fiche d'une page (schéma + mots-clés), et entraîne-toi sur les cas de la page de chaque chapitre.</span></div></div>

<div class="card"><h2>Mode d'emploi conseillé</h2><ol class="steps">
<li><b>Un nouveau chapitre</b> (60 min) : pré-test → Leçon active (notion par notion : « pourquoi ? », voix haute, « Me tester ») → 1 schéma ⭐ en mode « cacher 1/3 ».</li>
<li><b>Les jours suivants</b> (20 min par chapitre prévu) : Séance du jour du chapitre + un schéma à un niveau plus difficile + une question d'oral.</li>
<li><b>Chaque semaine</b> : un oral blanc multi-chapitres depuis la page générale, chronométré, si possible enregistré sur ton téléphone.</li>
<li><b>Les 12 derniers jours</b> : oraux blancs, schémas sur feuille blanche, anciens examens ; plus de grosse relecture la veille, dors (le sommeil consolide la mémoire).</li>
<li><b>Sources</b> : PPT et schémas de synthèse de WebCampus, tes transcriptions Notability, Sherwood (livre de référence) pour approfondir une notion ratée.</li></ol></div>

function fmt(n, d = 8) {
  if (typeof n !== "number" || !isFinite(n)) return String(n);
  let s = (Math.round(n * 10 ** d) / 10 ** d).toFixed(d).replace(/0+$/, "").replace(/\.$/, "");
  const [i, f] = s.split(".");
  const ii = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return f ? ii + "," + f : ii;
}
function parseNum(s) {
  if (s == null) return NaN;

  if (s === "½") return 0.5;
  if (/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)) { const [a, b] = s.split("/"); return parseFloat(a) / parseFloat(b); }
  if (!/^-?(\d+\.?\d*|\.\d+)(e-?\d+)?$/i.test(s)) return NaN;
  return parseFloat(s);
}
function near(x, target, tol) {
  if (isNaN(x)) return false;
  if (tol && tol.abs != null) return Math.abs(x - target) <= tol.abs + 1e-12;
  const rel = tol && tol.rel != null ? tol.rel : 0.005;
  return Math.abs(x - target) <= Math.max(Math.abs(target) * rel, 1e-12);
}

/* ---------- répétition espacée (Leitner) ---------- */
function cardState(id) { return S.cards[id] || { box: 0, due: null, seen: 0, lapses: 0 }; }
function gradeCard(id, g) { // g: 0 raté, 1 difficile, 2 bien, 3 facile
  const st = cardState(id); st.seen++;
  if (g === 0) { st.box = 0; st.lapses++; }
  else if (g === 1) st.box = Math.max(1, st.box);
  else if (g === 2) st.box = Math.min(INTERVALS.length - 1, st.box + 1);
  else st.box = Math.min(INTERVALS.length - 1, st.box + 2);
  st.due = addDays(today(), g === 0 ? 0 : INTERVALS[st.box]);
  S.cards[id] = st; save();
}
function dueCards() { const t = today(); return CARDS.filter(c => { const s = S.cards[c.id]; return !s || !s.due || s.due <= t; }); }
function logItem(id, ok) { (S.items[id] = S.items[id] || []).push(ok ? 1 : 0); if (S.items[id].length > 12) S.items[id].shift(); save(); }
function logGen(id, ok) { (S.gens[id] = S.gens[id] || []).push(ok ? 1 : 0); if (S.gens[id].length > 15) S.gens[id].shift(); save(); }
function logConf(c, ok) { if (!c) return; S.conf[c][1]++; if (ok) S.conf[c][0]++; save(); }

/* ---------- maîtrise par notion ---------- */
function mastery(cid) {
  const parts = [];
  const cs = CARDS.filter(c => c.c === cid);
  if (cs.length) parts.push(cs.reduce((a, c) => a + Math.min(cardState(c.id).box, 4) / 4, 0) / cs.length);
  const qs = ITEMS.filter(q => q.c === cid);
  if (qs.length) parts.push(qs.reduce((a, q) => { const r = S.items[q.id] || []; const last = r.slice(-3); return a + (last.length ? last.reduce((x, y) => x + y, 0) / 3 : 0); }, 0) / qs.length);
  const gs = Object.entries(GENS).filter(([k, g]) => g.c === cid);
  if (gs.length) parts.push(gs.reduce((a, [k]) => { const r = (S.gens[k] || []).slice(-5); return a + (r.length ? r.reduce((x, y) => x + y, 0) / 5 : 0); }, 0) / gs.length);
  const ss = (DATA.schemas || []).filter(s => s.c === cid);
  if (ss.length) parts.push(ss.reduce((a, s) => { const r = (S.sch[s.id] || []).slice(-2); return a + (r.length ? r.reduce((x, y) => x + y, 0) / (2 * 2) : 0); }, 0) / ss.length);
  return parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : 0;
}
function lvl(m) { return m >= .85 ? ["Automatique", "var(--ok)"] : m >= .6 ? ["Solide", "var(--accent)"] : m >= .25 ? ["En cours", "var(--warn)"] : ["À découvrir", "var(--muted)"]; }

function mcqHTML(it) {

  let h = (it.ctx ? `<div class="ctx">${esc(it.ctx)}</div>` : "") + `<div class="q">${it.q}</div><div class="opts">`;
  o.forEach((t, k) => {
    let cls = "";
    if (it._ans) { if (k === it.a) cls = "ok"; else if (k === it._sel) cls = "ko"; }
    else if (k === it._sel) cls = "sel";
    h += `<button class="opt ${cls}" ${it._ans ? "disabled" : ""} onclick="selOpt(${k})"><span class="n">${k + 1}</span><span>${t}</span></button>`;
  });
  h += `</div>`;
  if (!it._ans) h += confHTML(it._sel == null);
  else h += fbHTML(it, it._sel === it.a, it.ex);
  return h;
}
function selOpt(k) { P.queue[0]._sel = k; renderItem(); }
function numHTML(it) {
  let h = (it.ctx ? `<div class="ctx">${esc(it.ctx)}</div>` : "") + `<div class="q">${it.q}</div>`;
  h += `<div class="row" style="flex-wrap:nowrap"><input id="ans" class="num ${it._ans ? (it._ok ? "ok" : "ko") : ""}" inputmode="decimal" autocomplete="off"
     placeholder="ta réponse" ${it._ans ? `value="${esc(it._raw)}" disabled` : ""} onkeydown="if(event.key==='Enter'&&!${!!it._ans})submit('mid')">
     ${it.unit ? `<b style="min-width:40px">${esc(it.unit)}</b>` : ""}</div>`;
  if (!it._ans) h += confHTML(false) + `<div class="small muted" style="margin-top:6px">Virgule ou point acceptés. <span class="kbd">Entrée</span> = « hésitante ».</div>`;
  else h += fbHTML(it, it._ok, (it.steps ? `<ol class="steps">${it.steps.map(s => `<li>${s}</li>`).join("")}</ol>` : "") + (it.ex || ""));
  return h;
}
function fbHTML(it, ok, ex) {
  const good = it.t === "num" ? `${fmt(it.ans)} ${it.unit || ""}` : (it.o || ["Vrai", "Faux"])[it.a];
  let h = `<div class="fb ${ok ? "ok" : "ko"}"><b>${ok ? "Juste !" : "Pas encore."}</b> ${ok ? "" : `Réponse : <b>${good}</b>`}
    ${ex ? `<div class="ex">${ex}</div>` : ""}</div>`;
  if (!ok && it._conf === "sure") h += `<div class="hyper">💡 <b>Erreur commise avec assurance.</b> C'est justement ce type d'erreur qui se corrige le mieux quand on s'y arrête (effet d'hypercorrection) : relis l'explication et redis-la avec tes mots avant de continuer. Cette question reviendra dans quelques minutes.</div>`;
  else if (!ok) h += `<div class="small muted" style="margin-top:8px">Cette question reviendra plus loin dans la session jusqu'à ce que tu la réussisses.</div>`;
  if (ok && it._conf === "guess") h += `<div class="small muted" style="margin-top:8px">Juste, mais au hasard : elle comptera comme « à revoir ».</div>`;
  h += `<div class="row" style="margin-top:12px"><button class="btn primary" id="nextBtn" onclick="nextItem()">Continuer →</button></div>`;
  return h;
}
function submit(conf) {
  const it = P.queue[0];
  if (it.t === "num") {
    const raw = $("#ans").value; const x = parseNum(raw);
    if (isNaN(x)) { $("#ans").classList.add("ko"); return; }
    it._raw = raw; it._ok = near(x, it.ans, it.tol);
  } else { if (it._sel == null) return; it._ok = it._sel === it.a; }
  it._ans = true; it._conf = conf; logConf(conf, it._ok);
  const counted = it._ok && conf !== "guess";
  if (it.gen) logGen(it.gen, counted); else logItem(it.id, counted);
  P.results.push({ it, ok: it._ok, conf });
  renderItem();
  document.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); nextItem(); } };
  const nb = $("#nextBtn"); nb && nb.focus({ preventScroll: true });
}
function nextItem() {
  const it = P.queue.shift();
  const retry = !it._ok || it._conf === "guess";
  if (retry && !P.opts.noRetry) {
    const again = it.gen && GENS[it.gen] ? makeGen(it.gen) : { ...it, _ans: false, _sel: null, _ok: null, _conf: null, _raw: null };
    P.queue.splice(Math.min(P.queue.length, 4), 0, again);

  renderItem();
}
function endSession() {

  const sure = r.filter(x => x.conf === "sure"), sureOk = sure.filter(x => x.ok).length;
  const misses = r.filter(x => !x.ok).map(x => x.it).filter((v, i, a) => a.findIndex(y => (y.q || y.front) === (v.q || v.front)) === i);
  if (P && P.opts.onEnd) P.opts.onEnd(ok, n);

   <div class="big" style="margin-top:10px">${ok} / ${n}</div><div class="muted">réussies du premier coup</div>
   ${sure.length ? `<p class="small">Calibration : quand tu étais <b>sûre</b>, tu avais raison dans <b>${Math.round(sureOk / sure.length * 100)} %</b> des cas ${sureOk / sure.length < .9 ? "→ ta confiance dépasse encore ta maîtrise, continue à t'auto-tester." : "→ ta confiance est fiable."}</p>` : ""}
   ${misses.length ? `<div style="text-align:left"><h3>À retravailler</h3><ul class="small">${misses.slice(0, 12).map(m => `<li>${m.q || m.front}</li>`).join("")}</ul></div>` : ""}

/* ---------- Sprint d'automatisme ---------- */

};

}
function renderSprint() {

   <div class="small muted">✅ ${SP.ok} · ❌ ${SP.ko}</div><div class="q" style="font-size:22px;margin:18px 0">${it.q}</div>`;
  if (it.o) { h += `<div class="opts">${it.o.map((t, k) => `<button class="opt" onclick="spAns(${k})"><span class="n">${k + 1}</span><span>${t}</span></button>`).join("")}</div>`; }
  else h += `<div class="row" style="justify-content:center;flex-wrap:nowrap"><input id="sp" class="num" style="max-width:220px;text-align:center" inputmode="decimal" autocomplete="off"><b>${it.unit || ""}</b></div><div class="small muted" style="margin-top:6px"><span class="kbd">Entrée</span> pour valider</div>`;

}
function spAns(v) {

let MX = null;

function nextMix() {

}
function mixMethod(k) { MX.methodOk = MX.opts[k] === GENS[MX.cur.gen].method; MX.stage = 1; document.onkeydown = null; renderMix(); }
function mixCalc() { const raw = $("#mx").value; const x = parseNum(raw); if (isNaN(x)) return; MX.raw = raw; MX.calcOk = near(x, MX.cur.ans, MX.cur.tol); MX.n++; if (MX.calcOk && MX.methodOk) MX.ok++; logGen(MX.cur.gen, MX.calcOk && MX.methodOk); MX.stage = 2; renderMix(); }

if (DATA.hub && typeof HUB_HOME === "function") VIEWS.home = HUB_HOME;

</script>

</style>
<script>
/* Navigation interne sans quitter le cadre Notion : les pages s'ouvrent dans une vue intégrée */
(function () {
  const top_ = (() => { try { return window.parent !== window && window.parent.__galNav ? window.parent : null; } catch (e) { return null; } })();
  window.__galNav = true;
  window.openViewer = function (u) {
    if (top_) return top_.openViewer(u);
    let v = document.getElementById("viewer");
    if (!v) { v = document.createElement("div"); v.id = "viewer"; v.innerHTML = '<div class="vbar"><button onclick="closeViewer()">← Retour à la page générale</button><span class="vt"></span></div><iframe title="page"></iframe>'; document.body.appendChild(v); }
    const f = v.querySelector("iframe"); f.onload = () => { try { v.querySelector(".vt").textContent = f.contentDocument.title; } catch (e) {} };
    f.src = u + (u.includes("?") ? "&" : "?") + "v=1795026676"; v.style.display = "flex"; document.documentElement.style.overflow = "hidden";
  };
  window.closeViewer = function () {
    if (top_) return top_.closeViewer();
    const v = document.getElementById("viewer"); if (v) { v.style.display = "none"; v.querySelector("iframe").src = "about:blank"; }
    document.documentElement.style.overflow = "";
    if (typeof go === "function" && typeof VIEWS !== "undefined" && VIEWS.home) { try { go("home"); } catch (e) {} }
  };
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest("a"); if (!a) return;
    const h = a.getAttribute("href"); if (!h || a.target || /^(https?:|#|mailto:|javascript:)/i.test(h)) return;
    e.preventDefault();
    const url = new URL(h, location.href);
    const isHome = /\/(galenique|physio)\/(index\.html)?$/.test(url.pathname);
    if (isHome) { const v = document.getElementById("viewer"); if (top_) top_.closeViewer(); else if (v && v.style.display === "flex") closeViewer(); else openViewer(url.href); return; }
    openViewer(url.href);
  }, true);
})();
</script>
