<script>
/* ================= DONNÉES DU COURS ================= */
const r10 = x => Math.round(x * 1e10) / 1e10;
const FTAB = [["acide acétylsalicylique", 0.67], ["paracétamol", 0.72], ["codéine phosphate", 0.69], ["caféine", 0.67], ["ibuprofène", 0.90], ["bismuth sous-gallate", 0.37], ["oxyde de zinc", 0.16]];
const PG = (a, b) => `<span class="pg">p. ${a}${b ? "–" + b : ""}</span>`;
const DATA = {
id: "lehir", key: "mphab311-lehir", sumKey: "mphab311-sum-lehir", hubUrl: "index.html",
kicker: "MPHAB311 · Livre de référence n° 1",
title: "Le Hir · Pharmacie galénique (9e éd.) : guide de lecture",
sub: "Quelles pages lire pour chaque chapitre du cours · ce que le livre ajoute ou dit autrement · exercices interactifs dans le style du livre",

concepts: [
{ id: "guide", title: "Mode d'emploi du livre",
  html: `<p>Le Hir est un <b>abrégé</b> organisé par <span class="k">opérations</span> (broyer, dissoudre, stériliser…) puis par <span class="k">voies d'administration</span>, alors que le cours est organisé par <span class="k">propriétés physicochimiques</span>. Il faut donc <b>piocher</b> dans plusieurs parties pour un même chapitre du cours.</p>
  <div class="box trap"><b>Édition</b> : le cours cite la <b>8<sup>e</sup> édition</b> ; tu as la <b>9<sup>e</sup></b>. Le plan est le même, mais les numéros de page peuvent être décalés de quelques pages : cherche par titre de section.</div>
  <div class="box"><b>Numéros de page</b> : toutes les pages citées ici sont les <b>numéros imprimés</b> en haut des pages du livre. Dans ton PDF, ajoute <b>12</b> (p. 323 du livre = page 335 du PDF).</div>
  <table><tr><th>Partie du livre</th><th>Pages</th><th>Chapitres du cours concernés</th></tr>
  <tr><td>1. Vie d'un médicament, BPF</td><td>${PG(1, 35)}</td><td>Ch. 1 (conception, formulation : p. 1–5)</td></tr>
  <tr><td>2. Excipients et conditionnement</td><td>${PG(36, 117)}</td><td>Ch. 1, Ch. 5 (surfactifs), Ch. 8 (glycérides), <b>Ch. 9</b></td></tr>
  <tr><td>3. Opérations pharmaceutiques</td><td>${PG(118, 225)}</td><td>Ch. 2, Ch. 3, Ch. 5, <b>Ch. 7</b></td></tr>
  <tr><td>4. Formes pharmaceutiques</td><td>${PG(226, 375)}</td><td>Ch. 3 (isotonie), <b>Ch. 8</b>, calculs</td></tr></table>
  <p><b>Comment lire</b> : 1) fais d'abord la séance du chapitre dans la page du cours ; 2) lis les pages <span class="k">★ indispensables</span> ci-dessous ; 3) fais le quiz « Le Hir » de ce chapitre ; 4) les pages ☆ sont des compléments si tu as le temps.</p>
  <p><b>Exercices</b> : le livre ne contient pas de séries d'exercices, seulement des <span class="k">exemples chiffrés</span> (isotonie, facteur de déplacement, HLB, F<sub>0</sub>). Les onglets <i>Exercices</i> et <i>Exemples guidés</i> génèrent des variantes de ces exemples à l'infini.</p>`,
  why: [["Pourquoi lire le livre si le cours suffit pour l'examen ?", "Le livre donne le « pourquoi » derrière les règles du cours (ex. pourquoi on ne dépasse pas 40 °C pour le beurre de cacao). Comprendre le mécanisme te permet de reconstruire une réponse que tu as oubliée."]],
  traps: ["Lire le livre en entier : il fait 375 pages et couvre bien plus que le cours. Suis la liste ★.", "Apprendre les chiffres du livre à la place de ceux du cours quand ils diffèrent : à l'examen, c'est le cours qui fait foi."] },

{ id: "c1", title: "Ch. 1 · Le médicament ↔ Le Hir",
  html: `<table><tr><th></th><th>Pages</th><th>À chercher</th></tr>
  <tr><td>★</td><td>${PG(2, 5)}</td><td>Connaissance du principe actif (propriétés physiques, chimiques, devenir dans l'organisme), puis les choix de <b>formulation</b> : PA → voie → forme → excipients → conditionnement → procédé</td></tr>
  <tr><td>★</td><td>${PG(36, 37)}</td><td>Définitions <b>excipient / véhicule / base</b> et la seule propriété commune à tous les excipients : <span class="k">l'inertie</span> (vis-à-vis du PA, du conditionnement et de l'organisme)</td></tr>
  <tr><td>★</td><td>${PG(93, 96)}</td><td>Le <b>verre</b> : composition (SiO<sub>2</sub> vitrifiant, Na<sub>2</sub>O fondant, CaO stabilisant), rôle du B<sub>2</sub>O<sub>3</sub>, structure semi-organisée</td></tr>
  <tr><td>☆</td><td>${PG(96, 117)}</td><td>Plastiques, élastomères, métaux et <b>essais</b> des matériaux de conditionnement</td></tr>
  <tr><td>☆</td><td>${PG(6, 35)}</td><td>Assurance qualité, BPF, libération des lots (culture générale)</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Le cours définit le médicament comme <b>PA + excipient + conditionnement</b> : c'est exactement le plan du chapitre 2 du livre (p. 36). Le livre insiste davantage sur le fait qu'on ne <span class="k">remplace jamais un excipient par un autre sans étude</span> : certains retiennent le PA, d'autres en augmentent l'activité.</div>`,
  why: [["Pourquoi l'inertie est-elle la seule propriété commune ?", "Chaque excipient a une fonction différente (diluant, conservateur, émulsionnant…), mais aucun ne doit modifier l'effet du PA, interagir avec le récipient ou avoir un effet propre sur le patient."],
        ["Pourquoi ajoute-t-on du B₂O₃ dans le verre pharmaceutique ?", "Il remplace une partie de la silice, diminue le coefficient de dilatation (le verre supporte mieux les chocs thermiques, ex. autoclave) et rend le verre plus neutre chimiquement."]],
  talk: { prompt: "Explique les 3 inerties d'un excipient avec un exemple pour chacune.", check: ["Vis-à-vis du PA : ne pas inhiber ni augmenter son activité (poudres adsorbantes)", "Vis-à-vis du conditionnement : ne pas dissoudre le récipient ni être absorbé par lui", "Vis-à-vis de l'organisme : pas d'activité propre (vérifiée par des essais d'innocuité)"] },
  traps: ["Confondre véhicule (préparations liquides) et base (préparations solides et semi-solides)."] },

{ id: "c2", title: "Ch. 2 · L'état solide ↔ Le Hir",
  html: `<table><tr><th></th><th>Pages</th><th>À chercher</th></tr>
  <tr><td>★</td><td>${PG(119, 125)}</td><td><b>Pulvérisation</b> : opérations préliminaires, appareils de broyage</td></tr>
  <tr><td>★</td><td>${PG(125, 130)}</td><td><b>Tamisage</b> et contrôle granulométrique : numéro de tamis = côté de la maille en µm</td></tr>
  <tr><td>★</td><td>${PG(130, 136)}</td><td><b>Mélange</b> des poudres : facteurs, mélangeurs, contrôle de l'homogénéité (un mélange parfaitement homogène n'existe pas), eutectiques</td></tr>
  <tr><td>★</td><td>${PG(184, 191)}</td><td><b>Granulés</b> : granulation humide/sèche, densité apparente avant et après tassement, porosité, <b>surface spécifique</b> (m²/g, par adsorption de gaz), friabilité</td></tr>
  <tr><td>★</td><td>${PG(137, 137)}</td><td>Polymorphisme et solubilité : la forme <span class="k">la moins stable</span> est la plus soluble ; l'amorphe est plus soluble que le cristallin</td></tr>
  <tr><td>☆</td><td>${PG(237, 262)}</td><td><b>Comprimés</b> : compression, lubrifiants, délitants, essais</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Le cours présente l'indice de Carr et le rapport d'Hausner ; Le Hir parle surtout du <b>volume apparent avant et après tassement</b> (p. 188) sans les nommer. Pour les seuils chiffrés d'écoulement, utilise le cours ou Aulton (ch. 12).</div>`,
  why: [["Pourquoi un mélange de poudres n'est-il jamais parfaitement homogène ?", "La répartition des particules est aléatoire : on ne peut parler que d'une probabilité d'avoir la bonne teneur, et l'écart dépend de la taille de l'échantillon. On prend donc la dose unitaire comme taille d'échantillon."],
        ["Pourquoi la surface spécifique d'un granulé poreux est-elle plus grande que celle de ses grains ?", "Elle inclut la surface des pores internes, mesurée par adsorption d'une couche monomoléculaire de gaz (azote, argon)."]],
  talk: { prompt: "Explique le lien entre polymorphisme, solubilité et stabilité.", check: ["La forme la moins stable est la plus soluble", "L'amorphe est plus soluble que le cristallin", "Mais la forme instable peut se transformer en forme stable au stockage"] },
  traps: ["Croire que la forme la plus stable est la plus soluble : c'est l'inverse."] },

{ id: "c3", title: "Ch. 3 · Substances en solution ↔ Le Hir",
  html: `<table><tr><th></th><th>Pages</th><th>À chercher</th></tr>
  <tr><td>★</td><td>${PG(136, 139)}</td><td><b>Dissolution</b> : solubilité vs vitesse de dissolution, termes descriptifs de la Pharmacopée (tableau 3.3), température, pH, polymorphisme, additifs, <b>Noyes-Whitney</b></td></tr>
  <tr><td>★</td><td>${PG(294, 298)}</td><td><b>Isotonie</b> des injectables : hématies dans NaCl 9 ‰ / 50 ‰ / 4 ‰, osmolalité, <span class="k">279 mOsm/kg</span>, abaissement cryoscopique <span class="k">0,52 °C</span>, calcul pour le glucose et le NaCl, contrôle par hématies</td></tr>
  <tr><td>★</td><td>${PG(293, 295)}</td><td><b>pH</b> des injectables : tolérance pH 4–10 sans tampon, pourquoi une solution tamponnée est <span class="k">moins bien tolérée</span>, tampons utilisables</td></tr>
  <tr><td>★</td><td>${PG(336, 338)}</td><td><b>Collyres</b> : isotonie, pH, conservateurs des multidoses, adjuvants</td></tr>
  <tr><td>☆</td><td>${PG(71, 72)}</td><td><b>Cyclodextrines</b> (solubilisation par inclusion)</td></tr>
  <tr><td>☆</td><td>${PG(91, 92)}</td><td><b>Antioxydants</b> et conservateurs antimicrobiens</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Le cours donne 3 méthodes d'isotonisation (cryoscopique, équivalents NaCl, White-Vincent). Le Hir en présente une <b>4<sup>e</sup></b> : compter les <span class="k">milliosmoles</span> et compléter jusqu'à 279 mOsm/kg. Le résultat est le même, c'est une bonne façon de vérifier tes calculs (onglet Exercices).</div>
  <div class="formula">ξ (mOsm/kg) = ΔT / 1,86 × 1000   ·   C isotonique (g/L) ≈ 0,279 × M / i</div>`,
  why: [["Pourquoi une solution tamponnée à pH non physiologique fait-elle plus mal ?", "Le tampon de la solution entre en compétition avec celui des tissus : le retour à la neutralité est plus lent, la douleur dure et les tissus peuvent être lésés. Sans tampon, l'organisme neutralise vite."],
        ["Pourquoi le calcul donne 8,82 ‰ pour le NaCl alors qu'on utilise 9 ‰ ?", "Le calcul utilise i = 1,85 (dissociation incomplète) ; la valeur expérimentale au cryoscope est 9 ‰. Avec i = 2, on trouverait 8,16 ‰, encore acceptable."],
        ["Pourquoi le glucose est-il « isotonique » de 50 à 100 g/kg ?", "Il diffuse à travers la membrane des hématies : la mesure à l'hématocrite donne 100 ‰ alors que le calcul donne 50 ‰. D'où la distinction iso-osmotique (même pression osmotique) / isotonique (hématies intactes)."]],
  talk: { prompt: "Explique ce qui arrive aux hématies dans NaCl 9 ‰, 50 ‰ et 4 ‰, avec les mots exacts.", check: ["9 ‰ : rien, isotonie", "50 ‰ : hypertonique, l'eau sort, plasmolyse", "4 ‰ : hypotonique, l'eau entre, turgescence puis hémolyse", "Hémolyse dès 4,8–4,4 ‰, complète à 3,2 ‰"] },
  traps: ["Le Hir dit que la Pharmacopée donne les solubilités à 20 °C : retiens la valeur de ton cours si elle diffère.", "Le borate est interdit dans les injectables (hémolytique) mais permis dans les collyres."] },

{ id: "c4", title: "Ch. 4 · Rhéologie ↔ Le Hir",
  html: `<div class="box trap">Le Hir n'a <b>pas de chapitre de rhéologie</b>. Pour ce chapitre, le meilleur livre est <b>Aulton, ch. 6</b> (p. 81–100) : voir la page Aulton.</div>
  <table><tr><th></th><th>Pages</th><th>À chercher</th></tr>
  <tr><td>★</td><td>${PG(158, 159)}</td><td>Essais des émulsions : viscosimètre à mobile tournant, fluides <b>plastique, pseudoplastique, dilatant</b>, <b>thixotropie</b> ; pour les émulsions épaisses, on mesure la dureté (pénétromètre)</td></tr>
  <tr><td>★</td><td>${PG(70, 75)}</td><td><b>Viscosifiants</b> : gommes arabique et adragante, celluloses (méthylcellulose, CMC sodique)</td></tr>
  <tr><td>☆</td><td>${PG(78, 80)}</td><td><b>Macrogols (PEG)</b> : liquides sous PM 600, solides au-delà de 1000, viscosité qui augmente avec le PM</td></tr>
  <tr><td>☆</td><td>${PG(138, 139)}</td><td>La viscosité <span class="k">ralentit la dissolution</span> (elle réduit la diffusion)</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Le livre utilise la viscosité comme <b>outil</b> : stabiliser une émulsion (Stokes), ralentir la croissance des cristaux d'une suspension, prolonger l'action d'un collyre. C'est le « pourquoi » des agents viscosifiants du cours.</div>`,
  why: [["Pourquoi la viscosité freine-t-elle la dissolution ?", "Le coefficient de diffusion D est inversement proportionnel à la viscosité : les molécules quittent moins vite la couche de diffusion autour du solide."]],
  traps: ["Chercher la loi de Newton ou les rhéogrammes dans Le Hir : ils n'y sont pas."] },

{ id: "c5", title: "Ch. 5 · Systèmes dispersés ↔ Le Hir",
  html: `<table><tr><th></th><th>Pages</th><th>À chercher</th></tr>
  <tr><td>★</td><td>${PG(83, 90)}</td><td><b>Surfactifs</b> : classes anioniques/cationiques/non ioniques, leurs incompatibilités, et la <b>HLB</b> de Griffin (tableau 2.4, formules HLB = E/5 et HLB = 20(1 − S/A), additivité, domaines d'utilisation)</td></tr>
  <tr><td>★</td><td>${PG(151, 159)}</td><td><b>Émulsions</b> : L/H et H/L, rupture par <span class="k">coalescence</span> (irréversible) ou <span class="k">crémage/sédimentation</span> (réversible), loi de <b>Stokes</b>, émulsionnants, diagrammes ternaires, préparation, essais (type, homogénéité, stabilité)</td></tr>
  <tr><td>★</td><td>${PG(159, 163)}</td><td><b>Suspensions</b> : préparation, croissance des cristaux, sédimentation</td></tr>
  <tr><td>☆</td><td>${PG(163, 164)}</td><td>Solutions micellaires, mousses, aérosols</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Même logique que le cours : Stokes explique les 3 leviers de stabilité (petits globules, densités proches, phase continue visqueuse). Le Hir ajoute la façon de <b>déterminer le type</b> d'émulsion : dilution, colorants (Soudan III liposoluble), microscope et <span class="k">conductivité</span> (méthode de la Pharmacopée : une L/H conduit le courant).</div>
  <div class="formula">HLB mélange = Σ (fraction × HLB)   ·   v = 2 r² g (D₁ − D₂) / 9 η</div>`,
  why: [["Pourquoi le crémage est-il réversible et la coalescence non ?", "Au crémage, les globules restent séparés par leur film d'émulsionnant : une agitation les redisperse. À la coalescence, les globules fusionnent et les phases se séparent : il faut refaire l'émulsion."],
        ["Pourquoi les surfactifs non ioniques sont-ils les plus utilisés ?", "Ils n'ont pas les incompatibilités des ioniques (pH, ions calcium des eaux dures, mélange anionique + cationique) et sont moins irritants."],
        ["Pourquoi chauffe-t-on les deux phases à la même température pour émulsionner ?", "Une différence de température ferait figer une partie de la phase grasse ; vers 50–80 °C la dispersion est meilleure, et on agite jusqu'au refroidissement."]],
  talk: { prompt: "Cite les domaines d'utilisation des surfactifs selon leur HLB (valeurs de Le Hir).", check: ["Émulsionnants H/L : 3 à 6", "Mouillants : 7 à 9", "Antimousses : ≤ 8 (surtout 1,5 à 3)", "Émulsionnants L/H : 8 à 18", "Détergents : 13 à 15", "Solubilisants : 15 à 18"] },
  traps: ["Le Hir écrit L/H (lipophile dans hydrophile) l'ancien H/E : ce sont les mêmes émulsions.", "Les valeurs HLB du livre peuvent différer légèrement de celles du cours (ex. polysorbate 80 = 14,9) : à l'examen, prends celles de l'énoncé."] },

{ id: "c7", title: "Ch. 7 · Stérilisation ↔ Le Hir",
  html: `<table><tr><th></th><th>Pages</th><th>À chercher</th></tr>
  <tr><td>★</td><td>${PG(194, 199)}</td><td>Mécanismes (chaleur humide : hydrolyse et dénaturation des protéines ; rayonnements : oxydation ; gaz : alkylation), sensibilité des micro-organismes, <b>valeur D</b>, <b>NAS &lt; 10<sup>−6</sup></b>, valeur stérilisatrice <b>F<sub>0</sub></b> (z = 10 °C, réf. 121 °C, F<sub>0</sub> ≥ 8 min) et tableau 3.8</td></tr>
  <tr><td>★</td><td>${PG(202, 207)}</td><td><b>Chaleur sèche</b> (≈ 180 °C ; 250–350 °C pour dépyrogéner) et <b>autoclave</b> : correspondances pression/température, 121 °C 15 min, 134 °C 10 min pour le matériel, 18 min si risque de prions (ATNC : le livre écrit 121 °C, la recommandation française actuelle est 134 °C pendant 18 min), purge d'air, validation</td></tr>
  <tr><td>★</td><td>${PG(207, 210)}</td><td><b>Filtration stérilisante</b> : 0,22 µm, germe de référence <i>Pseudomonas diminuta</i>, limites (virus, mycoplasmes)</td></tr>
  <tr><td>★</td><td>${PG(210, 214)}</td><td><b>Rayonnements</b> (UV peu pénétrants, rayonnements ionisants) et <b>gaz</b> (formol, oxyde d'éthylène explosif de 3 à 83 % dans l'air)</td></tr>
  <tr><td>☆</td><td>${PG(214, 225)}</td><td>Conditionnement aseptique, zones à atmosphère contrôlée, essai de stérilité, indicateurs biologiques</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Le cours liste les méthodes et les préparations concernées ; Le Hir explique <b>pourquoi la stérilité absolue n'existe pas</b> : la courbe de survie est logarithmique, d'où une probabilité (NAS) et l'intérêt de partir d'une charge microbienne la plus faible possible.</div>
  <div class="formula">L = 10<sup>(T − 121)/10</sup>   ·   temps pour F₀ = 8 : t = 8 / L   ·   N = N₀ × 10<sup>−t/D</sup></div>`,
  why: [["Pourquoi purger l'air de l'autoclave ?", "L'air conduit mal la chaleur : il retarde l'homogénéisation de la température, et un mélange air-vapeur n'atteint pas la température de la vapeur saturante à la même pression."],
        ["Pourquoi la chaleur sèche est-elle proscrite à l'hôpital pour le matériel à risque prion ?", "Elle est inactive sur les ATNC ; seul l'autoclave est utilisable dans ce cas (cycle de 18 min ; recommandation française actuelle : 134 °C)."],
        ["Pourquoi préfère-t-on stériliser dans le conditionnement définitif ?", "La préparation n'est plus manipulée après la stérilisation : pas de recontamination possible, contrairement à la filtration qui impose ensuite une répartition aseptique."]],
  talk: { prompt: "Donne les correspondances pression/température de l'autoclave et les cycles de référence.", check: ["0,5 bar → 110 °C ; 1 bar → 121 °C ; 2 bars → 134 °C ; 3 bars → 144 °C", "Médicaments : 121 °C, 15 min", "Matériel résistant : 134 °C, 10 min", "Risque ATNC : 18 min (134 °C selon la recommandation actuelle)"] },
  traps: ["Les pressions sont en bar « au-dessus de la pression atmosphérique » (manomètre à zéro = 100 °C).", "La filtration ne retient pas tous les virus ni les mycoplasmes."] },

{ id: "c8", title: "Ch. 8 · Préparations rectales ↔ Le Hir",
  html: `<table><tr><th></th><th>Pages</th><th>À chercher</th></tr>
  <tr><td>★</td><td>${PG(318, 320)}</td><td>Actions <b>mécanique, locale, systémique</b> ; absorption : veines hémorroïdales supérieures → veine porte (foie), moyennes et inférieures → circulation générale ; biodisponibilité (fusion, diffusion, absorption) ; avantages et limites</td></tr>
  <tr><td>★</td><td>${PG(320, 322)}</td><td>Qualités d'un excipient ; <b>beurre de cacao</b> (polymorphisme : seule la forme β est stable et fond à 32–35 °C, ne jamais dépasser 40 °C), huiles hydrogénées, <b>glycérides hémisynthétiques</b> (les plus utilisés), macrogolglycérides</td></tr>
  <tr><td>★</td><td>${PG(323, 323)}</td><td><b>Facteur de déplacement</b> : même définition que le cours, formule M = F − f·S, exemple du phénobarbital sodique (f = 0,62) et méthode si f est inconnu</td></tr>
  <tr><td>★</td><td>${PG(324, 328)}</td><td>Fabrication (fondoir, coulée, refroidissement, moules-emballages) et <b>essais</b> : uniformité de masse, résistance à la rupture (&gt; 20 N), désagrégation (30 min gras / 60 min hydrosolubles), temps de ramollissement à 36 °C</td></tr>
  <tr><td>☆</td><td>${PG(57, 60)}</td><td>Beurre de cacao et glycérides comme matières premières</td></tr></table>
  <div class="box trap"><h4>⚠️ Différence avec le cours</h4>Le Hir calcule l'excipient pour <b>le nombre exact</b> de suppositoires (M = F − f·S, avec F = contenance totale du moule). Le cours demande de prévoir <span class="k">un suppositoire supplémentaire (n + 1)</span>. À l'examen, applique la règle du cours.</div>
  <div class="formula">M = F − f·S   (plusieurs PA : M = F − Σ fᵢ·Sᵢ)</div>`,
  why: [["Pourquoi ne faut-il pas fondre complètement le beurre de cacao ?", "Fondu en entier, il recristallise en un mélange de formes instables qui fond vers 23–24 °C : les suppositoires ne se démoulent pas. Fondu partiellement vers 35–36 °C, les cristaux β restants servent de germes à la forme stable."],
        ["Pourquoi la voie rectale n'évite-t-elle que partiellement l'effet de premier passage ?", "Les veines hémorroïdales supérieures se jettent dans la veine porte ; seules les moyennes et inférieures évitent le foie. Tout dépend de l'endroit où le suppositoire se dissout."],
        ["Pourquoi la densité de l'excipient doit-elle être constante ?", "Les suppositoires sont répartis en volume (alvéoles du moule) alors que la formule est en poids."]],
  talk: { prompt: "Explique comment Le Hir détermine la quantité d'excipient quand le facteur de déplacement est inconnu.", check: ["Masse avec tout le PA et trop peu d'excipient", "Coulée au fond des alvéoles puis complétée par de l'excipient pur", "Raclage, démoulage, pesée des suppositoires", "On en déduit l'excipient par différence"] },
  traps: ["Oublier le n + 1 du cours parce que le livre ne le met pas.", "Le facteur dépend de l'excipient : f est donné pour le beurre de cacao dans le livre."] },

{ id: "c9", title: "Ch. 9 · Excipients ↔ Le Hir",
  html: `<p>C'est le chapitre du cours le mieux couvert : la <b>partie 2 du livre</b> est entièrement consacrée aux excipients.</p>
  <table><tr><th></th><th>Pages</th><th>À chercher</th></tr>
  <tr><td>★</td><td>${PG(38, 52)}</td><td><b>Eau</b> : distillation, permutation, osmose inverse, ultrafiltration ; eau purifiée, hautement purifiée, <b>eau ppi</b></td></tr>
  <tr><td>★</td><td>${PG(52, 54)}</td><td>Éthanol, propylène-glycol, glycérol</td></tr>
  <tr><td>★</td><td>${PG(54, 67)}</td><td>Glycérides, cires (graisse de laine), paraffines, vaseline, silicones</td></tr>
  <tr><td>★</td><td>${PG(67, 81)}</td><td>Sucres, <b>amidons</b> (empois au-delà de 80 °C), gommes, cyclodextrines, <b>celluloses</b>, gélatine, polyvidone, <b>macrogols</b></td></tr>
  <tr><td>★</td><td>${PG(81, 93)}</td><td>Silice, talc, oxyde de titane ; <b>surfactifs et HLB</b> ; antioxydants, conservateurs, colorants, aromatisants</td></tr></table>
  <div class="box why2"><h4>🔗 Parallèle avec le cours</h4>Le cours classe les excipients par <b>fonction</b> (solvant, conservateur, isotonisant…) ; le livre les classe par <b>nature chimique</b>. Exercice utile : pour chaque excipient lu dans le livre, retrouve sa catégorie dans le cours (onglet Mélange).</div>`,
  why: [["Pourquoi le sorbitol est-il intéressant avec les acides aminés ?", "Ce n'est pas un sucre réducteur : il ne donne pas la réaction de Maillard (brunissement, perte d'activité) contrairement au glucose."],
        ["Pourquoi les PEG ne sont-ils pas tous des liquides ?", "Leur état dépend du poids moléculaire : liquides sous 600, solides cireux au-dessus de 1000, d'où leur emploi comme bases de suppositoires hydrosolubles ou de pommades."]],
  traps: ["Le Hir appelle la graisse de laine « lanoléine » ou « lanoline » : c'est le même excipient."] },

{ id: "calc", title: "Calculs (partie éliminatoire) ↔ Le Hir",

  <tr><td>Isotonie (3 méthodes)</td><td>Méthode des <b>milliosmoles</b> (279 mOsm/kg) et méthode cryoscopique (0,52 °C) ; pas d'équivalents NaCl ni de White-Vincent</td><td>${PG(296, 297)}</td></tr>

  <tr><td>Stérilisation</td><td>Tableau des valeurs L et temps équivalents à F<sub>0</sub> = 8</td><td>${PG(199, 199)}</td></tr>

  <div class="box"><b>Stratégie</b> : utilise la méthode des milliosmoles comme <b>contre-vérification</b> d'un calcul d'isotonie fait par la méthode du cours. Si les deux résultats sont proches, ton calcul est bon.</div>`,

  traps: ["Appliquer la formule du livre (sans n + 1) à un exercice du cours."] }
],

const METHODS_HTML = `
<div class="card"><h2>Pourquoi cette page est construite ainsi</h2>
<p class="small" style="margin-top:0">Chaque outil de cette page applique une méthode dont l'efficacité a été mesurée dans des études contrôlées en psychologie cognitive et en sciences de l'éducation. La grande revue de Dunlosky et al. (2013) a évalué 10 techniques d'étude : <b>se tester</b> (pratique de récupération) et <b>espacer les révisions</b> obtiennent la note d'utilité la plus élevée ; l'<b>entrelacement</b>, l'<b>interrogation élaborative</b> et l'<b>auto-explication</b> une note moyenne ; <b>relire, surligner et résumer</b> une note faible.</p>
<div class="box trap" style="margin-bottom:0"><b>À éviter :</b> relire le PDF plusieurs fois ou surligner. On a l'impression de savoir parce que le texte est familier, mais on ne s'entraîne pas à le retrouver seule, ce que l'examen exige.</div></div>

<div class="card"><h2>Les méthodes, et où elles sont dans la page</h2>
<div class="method"><b>1. Se tester plutôt que relire (pratique de récupération)</b><br><span class="small">Flashcards, Quiz, Séance du jour. Dans l'étude de Roediger &amp; Karpicke (2006), les étudiants qui s'étaient testés retenaient nettement plus une semaine plus tard que ceux qui avaient relu. Réponds toujours <b>avant</b> de voir la réponse, même si tu n'es pas sûre.</span></div>
<div class="method"><b>2. Espacer les séances</b><br><span class="small">Plan J+1, J+3, J+7, J+14, J+30 et boîtes des flashcards. Cepeda et al. (2008, plus de 1 350 participants) montrent que l'intervalle optimal entre deux révisions augmente avec le délai jusqu'à l'examen. Mieux vaut 15 minutes réparties sur 5 jours que 75 minutes la veille.</span></div>
<div class="method"><b>3. Réapprendre jusqu'au critère, sur plusieurs séances (réapprentissage successif)</b><br><span class="small">Dans les sessions, une question ratée revient jusqu'à ce que tu la réussisses ; puis elle revient les jours suivants. Rawson &amp; Dunlosky recommandent de réussir chaque élément au moins une fois par séance, sur environ 3 séances espacées : c'est ce qui rend le souvenir durable.</span></div>
<div class="method"><b>4. Mélanger les types de problèmes (entrelacement)</b><br><span class="small">Onglet Mélange et Séance du jour. En maths, des élèves ayant mélangé les types d'exercices ont nettement mieux réussi un test surprise un mois plus tard (61 % contre 38 % dans un essai sur 787 élèves de Rohrer et al.). Le gain vient surtout du fait qu'il faut <b>choisir la méthode</b> : c'est pour cela que l'onglet Mélange te demande d'abord « quelle méthode ? ». C'est plus difficile sur le moment, et c'est normal.</span></div>
<div class="method"><b>5. Exemples résolus puis aide qui s'estompe</b><br><span class="small">Onglet Exemples guidés. Au début d'un apprentissage, étudier un exemple résolu est plus efficace que de chercher seule (Sweller ; Renkl). Ensuite, on retire les étapes en commençant par la fin (« estompage arrière », Renkl &amp; Atkinson), jusqu'à résoudre seule. Le niveau s'adapte à tes réussites.</span></div>
<div class="method"><b>6. Se demander « pourquoi ? » et s'expliquer les étapes</b><br><span class="small">Encadrés « Pourquoi ? » de la Leçon active et boutons « pourquoi ? » des exemples. Relier chaque règle à sa raison (interrogation élaborative, auto-explication) aide à comprendre et à transférer à des problèmes nouveaux.</span></div>
<div class="method"><b>7. Expliquer à voix haute, sans regarder</b><br><span class="small">Encadrés « Explique à voix haute ». C'est une forme de rappel libre et d'auto-explication. La liste à cocher te montre ce que tu as oublié.</span></div>
<div class="method"><b>8. Se tester avant d'apprendre (pré-test)</b><br><span class="small">Bouton Pré-test. Essayer de répondre avant d'avoir étudié, même en se trompant, améliore la mémorisation de ce qu'on apprend ensuite (Richland, Kornell &amp; Kao, 2009 ; Kornell, Hays &amp; Bjork, 2009).</span></div>
<div class="method"><b>9. Noter sa certitude et corriger les erreurs « sûres »</b><br><span class="small">Boutons Sûre / Hésitante / Au hasard et tableau de calibration. Les erreurs commises avec une forte confiance sont paradoxalement les mieux corrigées après le feedback (effet d'hypercorrection, Butterfield &amp; Metcalfe, 2001). Comparer ta confiance à tes résultats t'apprend aussi à savoir ce que tu sais vraiment.</span></div>
<div class="method"><b>10. Rendre les bases automatiques (sprints)</b><br><span class="small">Onglet Sprint. Quand les conversions, abréviations et densités sont instantanées, ta mémoire de travail reste disponible pour le raisonnement. On vise d'abord la précision, ensuite la vitesse. Honnêtement : cette idée est surtout étudiée pour le calcul de base chez les enfants, et une étude n'a pas trouvé d'avantage de rétention au simple entraînement chronométré par rapport à la même quantité de pratique. Utilise donc les sprints en complément, pas à la place des autres méthodes.</span></div>
<div class="method"><b>11. Une méthode de calcul stable, avec les unités</b><br><span class="small">Dans les corrections, chaque étape garde son unité (mg, g, mL). En formation infirmière, apprendre à poser les calculs de doses avec les unités (analyse dimensionnelle) a amélioré la précision par rapport au calcul classique. Écris toujours l'unité à chaque ligne et vérifie l'ordre de grandeur.</span></div>
</div>

<div class="card"><h2>Spécial galénique : ce qui change pour ce cours</h2>
<div class="method"><b>Questions ouvertes : rédiger, pas reconnaître</b><br><span class="small">L'examen comporte des questions ouvertes. Reconnaître la bonne réponse dans un QCM ne prouve pas qu'on sait la produire. Les « Questions d'examen » te font rédiger (ou dire) ta réponse, puis la comparer point par point à la réponse attendue : c'est du rappel libre, la forme de test la plus exigeante et la plus proche de l'examen.</span></div>
<div class="method"><b>Partie calculs éliminatoire : viser le sur-apprentissage</b><br><span class="small">Une seule erreur de calcul fait échouer tout le cours. Pour cette partie, « réussir une fois » ne suffit pas : continue à t'entraîner après avoir réussi (problèmes mélangés chaque jour, sans calculatrice), et vérifie systématiquement unités et ordre de grandeur. L'entraînement prolongé au-delà de la première réussite ralentit l'oubli à court terme ; l'espacer garde l'effet sur la durée.</span></div>
<div class="method"><b>Mélanger les chapitres</b><br><span class="small">La « Séance mélangée » et l'« Examen blanc » de la page générale tirent des questions de tous les chapitres : c'est l'entrelacement appliqué au cours entier, comme le jour de l'examen.</span></div></div>

<div class="card"><h2>Mode d'emploi conseillé</h2><ol class="steps">
<li><b>Un nouveau chapitre</b> (45-60 min) : pré-test → Leçon active (notion par notion : « pourquoi ? », voix haute, « Me tester ») → exemples guidés s'il y en a → questions d'examen.</li>
<li><b>Les jours suivants</b> (15-20 min par chapitre prévu) : Séance du jour du chapitre, aux dates du plan (J+1, J+3, J+7, J+14, J+30).</li>
<li><b>Chaque jour</b> : 5 problèmes de calcul mélangés (partie éliminatoire) et, si tu as le temps, un sprint de 60 s.</li>
<li><b>Notions « En cours »</b> : rouvre-les dans la Leçon (mode « Masquer l'essentiel »), refais leur test.</li>
<li><b>Les 10 derniers jours</b> : examens blancs et séances mélangées depuis la page générale ; plus de grosse relecture la veille, dors.</li>
<li><b>Livres</b> (Le Hir, Aulton) : utilise-les pour approfondir une notion ratée, pas pour tout relire.</li></ol></div>

function cardState(id) { return S.cards[id] || { box: 0, due: null, seen: 0, lapses: 0 }; }
function gradeCard(id, g) { // g: 0 raté, 1 difficile, 2 bien, 3 facile
  const st = cardState(id); st.seen++;
  if (g === 0) { st.box = 0; st.lapses++; }
  else if (g === 1) st.box = Math.max(1, st.box);
  else if (g === 2) st.box = Math.min(INTERVALS.length - 1, st.box + 1);
  else st.box = Math.min(INTERVALS.length - 1, st.box + 2);
  st.due = addDays(today(), g === 0 ? 0 : INTERVALS[st.box]);
  S.cards[id] = st; save();
}
function dueCards() { const t = today(); return CARDS.filter(c => { const s = S.cards[c.id]; return !s || !s.due || s.due <= t; }); }
function logItem(id, ok) { (S.items[id] = S.items[id] || []).push(ok ? 1 : 0); if (S.items[id].length > 12) S.items[id].shift(); save(); }

/* ---------- maîtrise par notion ---------- */
function mastery(cid) {
  const parts = [];
  const cs = CARDS.filter(c => c.c === cid);
  if (cs.length) parts.push(cs.reduce((a, c) => a + Math.min(cardState(c.id).box, 4) / 4, 0) / cs.length);
  const qs = ITEMS.filter(q => q.c === cid);
  if (qs.length) parts.push(qs.reduce((a, q) => { const r = S.items[q.id] || []; const last = r.slice(-3); return a + (last.length ? last.reduce((x, y) => x + y, 0) / 3 : 0); }, 0) / qs.length);
  const gs = Object.entries(GENS).filter(([k, g]) => g.c === cid);
  if (gs.length) parts.push(gs.reduce((a, [k]) => { const r = (S.gens[k] || []).slice(-5); return a + (r.length ? r.reduce((x, y) => x + y, 0) / 5 : 0); }, 0) / gs.length);
  return parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : 0;
}

let W = null;
function worked(i) {
  markDay();

  const nBlank = level === 0 ? 0 : level === 1 ? 1 : level === 2 ? Math.min(2, ex.steps.length) : ex.steps.length;
  W = { i, w, ex, level, blanks: ex.steps.map((s, k) => k >= ex.steps.length - nBlank), checked: false };

function renderWorked() {
  const { w, ex, level, blanks, checked } = W;

      h += `<div class="blank"><input class="num ${checked ? (st ? "ok" : "ko") : ""}" id="w${k}" inputmode="decimal" autocomplete="off" ${checked ? "disabled" : ""} value="${checked ? esc(W.raw[k]) : ""}"> <b>${s.unit || ""}</b></div>

    }
    h += `</li>`;
  });
  h += `</ol>`;
  if (level === 0 && !checked) h += `<div class="box talk"><b>Auto-explication :</b> avant de continuer, dis à voix haute pourquoi chaque étape est nécessaire. Clique « pourquoi ? » seulement pour vérifier.</div>

  else h += `<div class="fb ${W.ok ? "ok" : "ko"}"><b>${W.ok ? "Bravo, niveau suivant débloqué." : "Pas encore : on reste à ce niveau (ou on redescend) pour consolider."}</b></div>

}

let SP = null;
function sprint(i) {

function nextMix() {
  const keys = Object.keys(GENS); let k; do { k = pick(keys); } while (MX.last === k && keys.length > 1); MX.last = k;
  MX.cur = makeGen(k); MX.stage = 0; MX.methodOk = null; renderMix();
}
function renderMix() {
  const it = MX.cur; const fams = [...new Set(Object.values(GENS).map(g => g.method))];
  let h = `<div class="card"><div class="row" style="justify-content:space-between"><span class="pill">Problèmes mélangés</span><span class="small muted">${MX.ok} / ${MX.n} justes</span></div>
  <p class="small muted">Les types de problèmes arrivent dans le désordre, comme à l'examen. D'abord : <b>quelle méthode ?</b> Ensuite seulement : le calcul.</p>
  ${it.ctx ? `<div class="ctx">${esc(it.ctx)}</div>` : ""}<div class="q">${it.q}</div>`;
  if (MX.stage === 0) {
    MX.opts = MX.opts && MX.optsFor === it ? MX.opts : shuffle(fams).slice(0, 4); if (!MX.opts.includes(GENS[it.gen].method)) MX.opts[rnd(0, MX.opts.length - 1)] = GENS[it.gen].method; MX.optsFor = it;
    h += `<div class="small" style="margin-bottom:6px"><b>Étape 1 :</b> quelle méthode s'applique ?</div><div class="opts">${MX.opts.map((m, k) => `<button class="opt" onclick="mixMethod(${k})"><span class="n">${k + 1}</span><span>${m}</span></button>`).join("")}</div>`;
    document.onkeydown = e => { const k = +e.key; if (k >= 1 && k <= MX.opts.length) mixMethod(k - 1); };
  } else {
    h += `<div class="small" style="margin:0 0 8px;color:${MX.methodOk ? "var(--ok)" : "var(--ko)"}">${MX.methodOk ? "✓ Bonne méthode" : "✗ La méthode était"} : ${GENS[it.gen].method}</div>`;
    h += `<div class="row" style="flex-wrap:nowrap"><input id="mx" class="num ${MX.stage === 2 ? (MX.calcOk ? "ok" : "ko") : ""}" inputmode="decimal" autocomplete="off" ${MX.stage === 2 ? `disabled value="${esc(MX.raw)}"` : ""}> <b>${it.unit || ""}</b></div>`;
    if (MX.stage === 1) h += `<div class="row" style="margin-top:10px"><button class="btn primary" onclick="mixCalc()">Valider le calcul</button></div>`;
    else h += `<div class="fb ${MX.calcOk ? "ok" : "ko"}"><b>${MX.calcOk ? "Juste !" : "Réponse : " + fmt(it.ans) + " " + (it.unit || "")}</b><div class="ex"><ol class="steps">${(it.steps || []).map(s => `<li>${s}</li>`).join("")}</ol></div></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="mxn" onclick="nextMix()">Problème suivant →</button><button class="btn ghost" onclick="go('home')">Arrêter</button></div>`;
  }
  h += `</div>`; V().innerHTML = h;
  const inp = $("#mx"); if (inp && MX.stage === 1) { inp.focus({ preventScroll: true }); inp.onkeydown = e => { if (e.key === "Enter") mixCalc(); }; }
  if (MX.stage === 2) { const b = $("#mxn"); b && b.focus({ preventScroll: true }); }
}
function mixMethod(k) { MX.methodOk = MX.opts[k] === GENS[MX.cur.gen].method; MX.stage = 1; document.onkeydown = null; renderMix(); }
function mixCalc() { const raw = $("#mx").value; const x = parseNum(raw); if (isNaN(x)) return; MX.raw = raw; MX.calcOk = near(x, MX.cur.ans, MX.cur.tol); MX.n++; if (MX.calcOk && MX.methodOk) MX.ok++; logGen(MX.cur.gen, MX.calcOk && MX.methodOk); MX.stage = 2; renderMix(); }

/* ---------- Maîtrise ---------- */
VIEWS.mastery = () => {
  const t = today(); const next = [];
  for (let d = 0; d < 7; d++) { const day = addDays(t, d); next.push([day, CARDS.filter(c => { const s = S.cards[c.id]; return d === 0 ? (!s || !s.due || s.due <= day) : s && s.due === day; }).length]); }
  const c = S.conf; const pc = a => a[1] ? Math.round(a[0] / a[1] * 100) + " %" : "–";
  V().innerHTML = `<div class="card"><h2>Ma maîtrise</h2><p class="small muted" style="margin-top:0">Score par notion = flashcards (boîte atteinte) + quiz (3 dernières réponses) + problèmes (5 derniers). « Automatique » = au moins 85 %. Une réponse juste « au hasard » ne compte pas.</p>
  ${DATA.concepts.map(x => { const m = mastery(x.id); const [l, col] = lvl(m); return `<div class="mast"><a href="#" onclick="go('lesson','${x.id}');return false" style="color:inherit">${x.title}</a><div class="bar"><i style="width:${m * 100}%;background:${col}"></i></div><span class="lvl" style="color:${col}">${Math.round(m * 100)}%</span></div>`; }).join("")}
  </div>
  <div class="card"><h3 style="margin-top:0">Calibration de ta confiance</h3><table class="tbl"><tr><th>Quand tu dis…</th><th>tu as raison</th><th>réponses</th></tr>
  <tr><td>✅ Sûre</td><td>${pc(c.sure)}</td><td>${c.sure[1]}</td></tr><tr><td>🤔 Hésitante</td><td>${pc(c.mid)}</td><td>${c.mid[1]}</td></tr><tr><td>🎲 Au hasard</td><td>${pc(c.guess)}</td><td>${c.guess[1]}</td></tr></table>
  <div class="small muted">Idéal : « Sûre » proche de 100 %. Si c'est plus bas, tu surestimes ce que tu sais : c'est le signal pour te tester davantage plutôt que relire.</div></div>
  <div class="card"><h3 style="margin-top:0">Flashcards à revoir les 7 prochains jours</h3><div class="plan">${next.map(([d, n]) => `<div class="${d === t ? "today" : ""}"><b>${n}</b>${frDate(d)}</div>`).join("")}</div></div>
  <div class="card"><h3 style="margin-top:0">Exemples guidés</h3>${DATA.worked.map(w => `<div class="mast"><span>${w.title}</span><div class="bar"><i style="width:${((S.worked[w.id] || 0) / 3) * 100}%"></i></div><span class="lvl">${(S.worked[w.id] || 0) + 1}/4</span></div>`).join("")}</div>`;
};

/* ---------- Méthodes (science de l'apprentissage) ---------- */
VIEWS.methods = () => { V().innerHTML = METHODS_HTML; };

/* ---------- Réglages ---------- */
VIEWS.settings = () => {
  V().innerHTML = `<div class="card"><h2>Sauvegarde de ta progression</h2>
  <p class="small muted" style="margin-top:0">Ta progression est enregistrée dans ce navigateur. Dans Notion, la page intégrée a sa propre mémoire, distincte de la page ouverte directement. Pour changer d'appareil : copie le code ci-dessous et colle-le de l'autre côté.</p>
  <textarea id="exp" rows="4" style="font-size:12px">${esc(JSON.stringify(S))}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText($('#exp').value);this.textContent='Copié ✓'">Copier</button>
  <button class="btn" onclick="try{S=JSON.parse($('#exp').value);save();go('home')}catch(e){alert('Code invalide')}">Importer le code collé</button></div></div>
  <div class="card"><h2>Recommencer</h2><p class="small muted" style="margin-top:0">Efface toute la progression de cette séance (cartes, scores, plan).</p>
  <button class="btn" style="border-color:var(--ko);color:var(--ko)" onclick="if(confirm('Tout effacer ?')){S=blank();save();go('home')}">Tout effacer</button></div>
  <div class="card small muted">Raccourcis clavier : <span class="kbd">espace</span> retourner une carte · <span class="kbd">1</span>–<span class="kbd">4</span> noter une carte ou choisir une option · <span class="kbd">Entrée</span> valider / continuer.</div>`;
};

/* ================= DÉMARRAGE ================= */
if (DATA.hub && typeof HUB_HOME === "function") VIEWS.home = HUB_HOME;
load();
$("#hKick").textContent = DATA.kicker; $("#hTitle").textContent = DATA.title; $("#hSub").textContent = DATA.sub;
go("home");
</script>
