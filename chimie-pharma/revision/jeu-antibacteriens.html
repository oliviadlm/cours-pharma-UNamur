e stéroïdienne trans-syn-trans, ce qui n'est pas le cas des stéroïdes hormonaux."},{"id":"05-q05-08","t":"qcm","q":"L'acide fusidique agit sur :","c":["La sous-unité ribosomale 50S","La sous-unité ribosomale 30S","L'ARN polymérase","Le bactoprénol"],"r":"La sous-unité ribosomale 50S","x":"Comme macrolides, chloramphénicol et thiamphénicol (EF-G selon la figure p.101)."},{"id":"05-q05-09","t":"vrai_faux","q":"L'acide fusidique est actif sur les Gram − .","c":["Vrai","Faux"],"r":"Faux","x":"Il est actif sur les Gram + (surtout S. aureus) et inactif sur les Gram −."},{"id":"05-q05-10","t":"qcm","q":"Quelle est la cible des rifamycines ?","c":["La sous-unité β de l'ARN polymérase bactérienne","L'ADN gyrase","La sous-unité 30S","L'isoleucyl-ARNt synthétase"],"r":"La sous-unité β de l'ARN polymérase bactérienne","x":"Elles inhibent la transcription et ont peu d'action sur l'ARN polymérase humaine."},{"id":"05-q05-11","t":"qcm","q":"Quel substituant R différencie la rifampicine de la rifamycine SV (R = H) ?","c":["CH=N–N(4-méthylpipérazine)","Une spiro-pipéridine N-isobutyle","Un noyau pyrido-imidazole","Un ester acétoxyéthylique"],"r":"CH=N–N(4-méthylpipérazine)","x":"La rifampicine porte R = HC=N–N-pipérazine-N-CH3 (p.95)."},{"id":"05-q05-12","t":"qcm","q":"La rifampicine est un inducteur de :","c":["CYP1A2, CYP2C9, CYP3A4","CYP2D6 uniquement","Aucune enzyme","La glucuronidation uniquement"],"r":"CYP1A2, CYP2C9, CYP3A4","x":"Induction des enzymes hépatiques → interactions avec coumariniques, antiépileptiques, contraceptifs, ADO, corticostéroïdes, antirétroviraux."},{"id":"05-q05-13","t":"qcm","q":"Quelles sont les deux indications majeures de la rifampicine selon le cours ?","c":["Tuberculose (en association) et prophylaxie de la méningite à méningocoque chez l'enfant","Impétigo et acné","Encéphalopathie hépatique et diarrhée","Endocardite et SARM"],"r":"Tuberculose (en association) et prophylaxie de la méningite à méningocoque chez l'enfant","x":"p.96."},{"id":"05-q05-14","t":"vrai_faux","q":"La rifampicine en sirop est disponible en spécialité en Belgique.","c":["Vrai","Faux"],"r":"Faux","x":"Elle n'existe pas en spécialité : préparation magistrale à partir de la matière première."},{"id":"05-q05-15","t":"qcm","q":"Pourquoi la rifampicine a-t-elle une action prolongée ?","c":["Élimination biliaire avec cycle entérohépatique","Élimination rénale lente","Forme dépôt injectable","Liaison irréversible à l'ARN polymérase humaine"],"r":"Élimination biliaire avec cycle entérohépatique","x":"p.96."},{"id":"05-q05-16","t":"qcm","q":"Quel est le caractère acido-basique de la rifampicine ?","c":["Amphotère","Acide uniquement","Basique uniquement","Neutre"],"r":"Amphotère","x":"Rifamycine : acide ; rifampicine et rifabutine : amphotères (solubles dans acides et alcalis)."},{"id":"05-q05-17","t":"qcm","q":"Quelle partie de la rifabutine est surlignée en rouge dans le cours ?","c":["Le cycle imidazoline spiro-pipéridine N-isobutyle (et la C=O quinonique)","La chaîne acétate de l'anse","Le groupe méthoxy","Le furanone"],"r":"Le cycle imidazoline spiro-pipéridine N-isobutyle (et la C=O quinonique)","x":"C'est la différence structurale avec la rifamycine SV ; la rifabutine dérive de la rifamycine S (naphtoquinone)."},{"id":"05-q05-18","t":"qcm","q":"La mupirocine inhibe :","c":["L'isoleucyl-ARNt synthétase bactérienne","La sous-unité 50S","L'ARN polymérase","La transpeptidase"],"r":"L'isoleucyl-ARNt synthétase bactérienne","x":"Liaison réversible et spécifique → inhibition de la synthèse protéique."},{"id":"05-q05-20","t":"qcm","q":"Quelles sont les seules indications des glycopeptides selon le cours ?","c":["Infections graves à staphylocoques résistant aux pénicillines et prévention des endocardites si pénicillines impossibles","Tuberculose et lèpre","Impétigo et acné","Infections urinaires basses"],"r":"Infections graves à staphylocoques résistant aux pénicillines et prévention des endocardites si pénicillines impossibles","x":"Phrase en bleu souligné p.98."},{"id":"05-q05-21","t":"qcm","q":"La vancomycine inhibe la synthèse de la paroi en se liant à :","c":["La terminaison D-Ala-D-Ala des précurseurs","Les PLP (transpeptidases)","Le bactoprénol","Le LPS"],"r":"La terminaison D-Ala-D-Ala des précurseurs","x":"Elle altère aussi la perméabilité membranaire et la synthèse de l'ARN."},{"id":"05-q05-22","t":"vrai_faux","q":"La vancomycine est active per os dans les infections systémiques car elle est bien absorbée.","c":["Vrai","Faux"],"r":"Faux","x":"Glycopeptide : pas actif per os, voie parentérale (i.v., i.m.)."},{"id":"05-q05-23","t":"qcm","q":"Le linézolide est :","c":["Une oxazolidinone obtenue par synthèse chimique (1987)","Un produit d'extraction de Streptomyces","Un glycopeptide","Une rifamycine"],"r":"Une oxazolidinone obtenue par synthèse chimique (1987)","x":"Et non par extraction à partir d'un micro-organisme."},{"id":"05-q05-24","t":"qcm","q":"Le linézolide bloque la synthèse protéique en :","c":["Inhibant la formation d'un complexe d'initiation 50S fonctionnel","Bloquant EF-G","Se fixant sur la 30S","Inhibant l'isoleucyl-ARNt synthétase"],"r":"Inhibant la formation d'un complexe d'initiation 50S fonctionnel","x":"p.100 (bleu souligné)."},{"id":"05-q05-25","t":"qcm","q":"Sur quels germes le linézolide est-il actif (cours) ?","c":["Gram + y compris ERV et SARM","Gram − uniquement","Mycobactéries atypiques","Anaérobies Gram −"],"r":"Gram + y compris ERV et SARM","x":"Il pénètre mal dans les Gram −."},{"id":"05-q05-26","t":"qcm","q":"Quel antibiotique polypeptidique est un « détergent membranaire » spécifiquement actif sur les Gram − ?","c":["Polymyxine B","Bacitracine","Tyrocidine","Gramicidine"],"r":"Polymyxine B","x":"Cationique, se lie au LPS et déplace Ca²⁺/Mg²⁺."},{"id":"05-q05-27","t":"qcm","q":"La bacitracine agit en :","c":["Bloquant le recyclage du bactoprénol","Se liant au LPS","Inhibant l'ARN polymérase","Se liant à D-Ala-D-Ala"],"r":"Bloquant le recyclage du bactoprénol","x":"Inhibition de la synthèse de la paroi à une autre étape que les β-lactamines."},{"id":"05-q05-28","t":"qcm","q":"La tyrothricine est :","c":["Un mélange de tyrocidines et de gramicidines (Bacillus brevis)","Un mélange de bacitracines A à F","Une polymyxine","Un glycopeptide"],"r":"Un mélange de tyrocidines et de gramicidines (Bacillus brevis)","x":"p.92 ; usage bucco-pharyngé (LEMOCIN®, TYROTHRICINE-LIDOCAINE®)."},{"id":"05-q05-29","t":"qcm","q":"NEOBACITRACINE® associe :","c":["Bacitracine + néomycine","Bacitracine + polymyxine E","Tyrothricine + lidocaïne","Néomycine + dexaméthasone"],"r":"Bacitracine + néomycine","x":"p.93."},{"id":"05-q05-30","t":"qcm","q":"Pourquoi les polypeptides sont-ils utilisés en usage externe ?","c":["Ils sont mal résorbés et relativement toxiques","Ils sont détruits par la lumière","Ils sont trop lipophiles","Ils sont inactifs in vivo"],"r":"Ils sont mal résorbés et relativement toxiques","x":"p.92."},{"id":"06-q06-01","t":"qcm","q":"Selon la phrase rouge du cours, pourquoi faut-il limiter l'utilisation des quinolones ?","c":["Développement rapide de résistance et effets indésirables parfois très invalidants","Coût élevé et faible biodisponibilité","Spectre limité aux Gram −","Coloration des urines en rouge"],"r":"Développement rapide de résistance et effets indésirables parfois très invalidants","x":"Phrase rouge p.110, en accord avec l'Agence européenne des médicaments (EMA)."},{"id":"06-q06-02","t":"qcm","q":"Quelle modification structurale distingue l'acide nalidixique du noyau quinoléine ?","c":["Le carbone en position 8 est remplacé par un azote (noyau naphtyridine)","Un fluor en position 6","Un cyclopropyle sur N1","Une pipérazine en position 7"],"r":"Le carbone en position 8 est remplacé par un azote (noyau naphtyridine)","x":"L'acide nalidixique est un dérivé naphtyridine ; F en 6 caractérise les fluoroquinolones."},{"id":"06-q06-03","t":"qcm","q":"Qu'est-ce qui caractérise toutes les quinolones de seconde génération ?","c":["Un fluor en position 6","Un noyau naphtyridine","Un groupe nitro sur un furane","Un 3e cycle contenant du soufre"],"r":"Un fluor en position 6","x":"Elles possèdent toutes un F en 6 et conservent généralement le fragment pipérazin-1-yle de l'acide pipémidique : ce sont les fluoroquinolones."},{"id":"06-q06-04","t":"qcm","q":"Quel substituant porte la ciprofloxacine sur l'azote N1 ?","c":["Un cyclopropyle","Un éthyle","Un 2-fluoroéthyle","Un méthyle"],"r":"Un cyclopropyle","x":"La norfloxacine et la péfloxacine ont un N1-éthyle, la fléroxacine un CH2CH2F, la ciprofloxacine un cyclopropyle."},{"id":"06-q06-05","t":"qcm","q":"CIPROXINE® correspond à :","c":["Ciprofloxacine","Lévofloxacine","Moxifloxacine","Ofloxacine"],"r":"Ciprofloxacine","x":"CIPROXINE®, CIPROFLOXACINE SANDOZ®/EG®/TEVA® ; CILOXAN® en collyre."},{"id":"06-q06-06","t":"qcm","q":"TAVANIC® correspond à :","c":["Lévofloxacine","Ofloxacine","Moxifloxacine","Ciprofloxacine"],"r":"Lévofloxacine","x":"TAVANIC® = lévofloxacine, isomère lévogyre de l'ofloxacine."},{"id":"06-q06-07","t":"qcm","q":"AVELOX® correspond à :","c":["Moxifloxacine","Lévofloxacine","Ciprofloxacine","Bédaquiline"],"r":"Moxifloxacine","x":"AVELOX® = moxifloxacine, quinolone de 3e génération."},{"id":"06-q06-08","t":"qcm","q":"TRAFLOXAL® est un collyre à base de :","c":["Ofloxacine","Ciprofloxacine","Lévofloxacine","Moxifloxacine"],"r":"Ofloxacine","x":"CILOXAN® = ciprofloxacine (aussi usage otique) ; TRAFLOXAL® = ofloxacine."},{"id":"06-q06-09","t":"vrai_faux","q":"L'isomère dextrogyre de l'ofloxacine est inactif et dépourvu de toxicité.","c":["Vrai","Faux"],"r":"Faux","x":"Il est en principe inactif mais a la même toxicité que l'isomère lévogyre actif : d'où le chiral switch vers la lévofloxacine."},{"id":"06-q06-10","t":"qcm","q":"Quelle est la cible des quinolones ?","c":["La topo-isomérase II (DNA-gyrase)","L'ARN polymérase ADN-dépendante","La dihydroptéroate synthétase","La pyruvyl transférase"],"r":"La topo-isomérase II (DNA-gyrase)","x":"Elles s'intercalent sous forme de complexe de magnésium entre les brins du DNA bactérien et empêchent leur soudure à l'état surenroulé."},{"id":"06-q06-11","t":"qcm","q":"Sous quelle forme les quinolones s'intercalent-elles entre les brins du DNA bactérien ?","c":["Complexe de magnésium","Complexe de zinc","Paire d'ions avec le trométamol","Ester phosphorique"],"r":"Complexe de magnésium","x":"Concept souligné p.106."},{"id":"06-q06-12","t":"qcm","q":"Quelle est la contre-indication principale des fluoroquinolones ?","c":["Grossesse, allaitement et période de croissance (< 18 ans)","Insuffisance rénale uniquement","Allergie à la pénicilline","Déficit en G6PD"],"r":"Grossesse, allaitement et période de croissance (< 18 ans)","x":"Atteinte du cartilage articulaire observée chez l'animal en croissance."},{"id":"06-q06-13","t":"qcm","q":"Quel effet indésirable tendineux est typique des fluoroquinolones ?","c":["Tendinite pouvant aller jusqu'à la rupture du tendon d'Achille","Ostéoporose","Crampes musculaires par hypokaliémie","Myasthénie"],"r":"Tendinite pouvant aller jusqu'à la rupture du tendon d'Achille","x":"Concept souligné p.111."},{"id":"06-q06-14","t":"vrai_faux","q":"Les quinolones sont un bon choix pour les infections urinaires basses non compliquées.","c":["Vrai","Faux"],"r":"Faux","x":"« Attention » (bleu souligné) : pour les infections urinaires basses non compliquées, les quinolones ne sont pas un bon choix ; elles sont indiquées dans les infections urinaires compliquées (pyélonéphrite, prostatite aiguë)."},{"id":"06-q06-15","t":"qcm","q":"Quelle quinolone est citée pour les infections respiratoires de l'adulte allergique à la pénicilline ?","c":["Moxifloxacine","Ciprofloxacine","Acide nalidixique","Ofloxacine"],"r":"Moxifloxacine","x":"Activité accrue sur les Gram + dont S. pneumoniae et les atypiques (mycoplasme, chlamydia)."},{"id":"06-q06-16","t":"qcm","q":"Avec quelles quinolones l'allongement du QT est-il « certainement » décrit ?","c":["Ciprofloxacine, lévofloxacine, moxifloxacine","Acide nalidixique et acide pipémidique","Norfloxacine uniquement","Aucune, c'est un effet des nitrofurannes"],"r":"Ciprofloxacine, lévofloxacine, moxifloxacine","x":"Possible aussi avec la norfloxacine et l'ofloxacine."},{"id":"06-q06-17","t":"qcm","q":"Quel antiseptique urinaire colore les urines en rouge ?","c":["Nitrofurantoïne","Fosfomycine","Méthénamine","Ciprofloxacine"],"r":"Nitrofurantoïne","x":"FURADANTINE MC® ; phrase en bleu p.112."},{"id":"06-q06-18","t":"qcm","q":"Pourquoi les nitrofurannes ont-ils peu d'effets sur les cellules de l'hôte ?","c":["Les bactéries réduisent le groupe NO2 beaucoup plus vite que les cellules humaines","Ils ne pénètrent pas dans les cellules humaines","Ils sont inactivés par le foie","Ils ciblent la paroi, absente chez l'homme"],"r":"Les bactéries réduisent le groupe NO2 beaucoup plus vite que les cellules humaines","x":"Ce sont les métabolites réduits qui lèsent le DNA."},{"id":"06-q06-19","t":"qcm","q":"Pour quelle infection les nitrofurannes sont-ils de premier choix ?","c":["Infections non compliquées des voies urinaires basses chez la femme adulte","Pyélonéphrite","Prostatite aiguë","Pneumonie communautaire"],"r":"Infections non compliquées des voies urinaires basses chez la femme adulte","x":"Comme le triméthoprime (bleu souligné p.111)."},{"id":"06-q06-20","t":"qcm","q":"Quel est le rôle du trométamol dans MONURIL® ?","c":["Former une paire d'ions avec la fosfomycine pour augmenter son absorption digestive","Acidifier l'urine","Inhiber les β-lactamases","Ralentir l'élimination rénale"],"r":"Former une paire d'ions avec la fosfomycine pour augmenter son absorption digestive","x":"La fosfomycine, ionisée à pH neutre, est sinon mal absorbée."},{"id":"06-q06-21","t":"qcm","q":"La méthénamine est associée à l'acide hippurique pour :","c":["Acidifier l'urine, car le formaldéhyde n'est libéré qu'en milieu acide","Augmenter son absorption digestive","Élargir son spectre aux anaérobies","Diminuer sa toxicité rénale"],"r":"Acidifier l'urine, car le formaldéhyde n'est libéré qu'en milieu acide","x":"p.103."},{"id":"06-q06-22","t":"qcm","q":"Quelle est la structure de l'isoniazide ?","c":["Pyridine substituée en 4 par un hydrazide –CO–NH–NH2","Pyrazine portant un carboxamide","Pyridine substituée en 3 par un carboxamide","Deux 4-aminophényles reliés par un SO2"],"r":"Pyridine substituée en 4 par un hydrazide –CO–NH–NH2","x":"Isonicotinylhydrazide ; la pyrazine-carboxamide est le pyrazinamide, la pyridine-3-carboxamide la nicotinamide, la diaminodiphénylsulfone la dapsone."},{"id":"06-q06-23","t":"qcm","q":"Quel effet indésirable de l'isoniazide est dû à une carence en pyridoxine ?","c":["Neuropathies périphériques","Coloration orange des urines","Allongement du QT","Hypernatrémie"],"r":"Neuropathies périphériques","x":"Troubles neuropsychiatriques : hyperactivité, euphorie, neuropathies périphériques par carence en pyridoxine."},{"id":"06-q06-24","t":"qcm","q":"Quelle découverte inattendue a été faite avec l'isoniazide ?","c":["Elle inhibe la monoamine oxydase (origine des IMAO)","Elle inhibe l'ATP synthase","Elle est active sur la lèpre","Elle est un inducteur enzymatique"],"r":"Elle inhibe la monoamine oxydase (origine des IMAO)","x":"Euphorie observée lors des premiers essais."},{"id":"06-q06-25","t":"qcm","q":"TEBRAZID® correspond à :","c":["Pyrazinamide","Éthambutol","Isoniazide","Bédaquiline"],"r":"Pyrazinamide","x":"NICOTIBINE® = isoniazide ; MYAMBUTOL® = éthambutol ; SIRTURO® = bédaquiline."},{"id":"06-q06-26","t":"qcm","q":"Quel antituberculeux est un dérivé de l'éthylène diamine capable de chélater le zinc ?","c":["Éthambutol","Pyrazinamide","Isoniazide","Streptomycine"],"r":"Éthambutol","x":"Dérivé de l'éthylène diamine (comme l'EDTA), MYAMBUTOL®."},{"id":"06-q06-27","t":"qcm","q":"Le pyrazinamide est une pro-drogue convertie en :","c":["Acide pyrazinoïque","Acide nicotinique","Formaldéhyde","Acide isonicotinique"],"r":"Acide pyrazinoïque","x":"Par la pyrazinamidase dans le granulome ; il inhiberait la synthèse des acides gras."},{"id":"06-q06-28","t":"qcm","q":"Quelle est la cible de la bédaquiline (SIRTURO®) ?","c":["L'ATP synthase mycobactérienne","La DNA-gyrase","La sous-unité 30S du ribosome","La dihydroptéroate synthétase"],"r":"L'ATP synthase mycobactérienne","x":"Enzyme indispensable à l'approvisionnement énergétique de M. tuberculosis ; réservée à la TB multirésistante."},{"id":"06-q06-29","t":"qcm","q":"Quelle est la composition de la phase de continuation du traitement antituberculeux ?","c":["Isoniazide + rifampicine pendant 4 mois ou plus","Pyrazinamide + éthambutol pendant 2 mois","Streptomycine seule","Bédaquiline + isoniazide pendant 6 mois"],"r":"Isoniazide + rifampicine pendant 4 mois ou plus","x":"Après une phase intensive de 2-3 mois (rifampicine + isoniazide + éthambutol et/ou pyrazinamide)."},{"id":"06-q06-30","t":"qcm","q":"Le BCG est :","c":["Un vaccin vivant non virulent issu d'une souche atténuée de Mycobacterium bovis","Un vaccin inactivé de Mycobacterium tuberculosis","Un vaccin sous-unitaire recombinant","Une immunoglobuline anti-tuberculeuse"],"r":"Un vaccin vivant non virulent issu d'une souche atténuée de Mycobacterium bovis","x":"Calmette et Guérin, 1921 ; meilleurs résultats chez les jeunes enfants ; non indiqué systématiquement en Belgique."},{"id":"06-q06-31","t":"qcm","q":"Quel est le mécanisme de la dapsone ?","c":["Inhibition de la synthèse d'acide folique (analogue du PABA)","Inhibition de la topo-isomérase II","Inhibition de l'ARN polymérase","Inhibition de la synthèse du peptidoglycane"],"r":"Inhibition de la synthèse d'acide folique (analogue du PABA)","x":"Comme les sulfamides et le PAS : inhibition de la dihydroptéroate synthétase."},{"id":"07-q01","t":"qcm","q":"Quelle est la DCI de DAKTARIN® ?","c":["Miconazole","Clotrimazole","Isoconazole","Kétoconazole"],"r":"Miconazole","x":"DAKTARIN® = nitrate de miconazole (usage externe)."},{"id":"07-q02","t":"qcm","q":"Quel noyau distingue structurellement l'isoconazole du miconazole ?","c":["La position des Cl sur le benzyle (2,6 vs 2,4)","Un triazole à la place de l'imidazole","Un groupe nitro","Une pipérazine acétylée"],"r":"La position des Cl sur le benzyle (2,6 vs 2,4)","x":"Les Cl en rouge p.132 : 2,6-dichlorobenzyle (isoconazole) vs 2,4-dichlorobenzyle (miconazole)."},{"id":"07-q05","t":"qcm","q":"Quelle molécule est la seule allylamine commercialisée chez nous ?","c":["Terbinafine","Amorolfine","Griséofulvine","Fluconazole"],"r":"Terbinafine","x":"La terbinafine inhibe la squalène époxydase."},{"id":"07-q06","t":"qcm","q":"LOCERYL® contient :","c":["Amorolfine","Terbinafine","Clotrimazole","Bifonazole"],"r":"Amorolfine","x":"Amorolfine (dérivé de la morpholine), vernis à ongles contre les onychomycoses."},{"id":"07-q07","t":"qcm","q":"Quel antifongique inhibe la synthèse du β-(1,3)-D-glucane de la paroi ?","c":["Caspofungine","Voriconazole","Nystatine","Amorolfine"],"r":"Caspofungine","x":"CANCIDAS® : mécanisme qui rappelle celui des β-lactames chez les bactéries."},{"id":"07-q08","t":"vrai_faux","q":"La griséofulvine est mieux résorbée en présence de matières grasses.","c":["Vrai","Faux"],"r":"Vrai","x":"Elle est lipophile : mieux résorbée avec un repas gras."},{"id":"07-q09","t":"qcm","q":"Sur quelle structure cellulaire agit la griséofulvine ?","c":["Les microtubules (fuseau mitotique)","La paroi de glucane","L'ergostérol membranaire","La chaîne respiratoire"],"r":"Les microtubules (fuseau mitotique)","x":"Premier exemple de médicament agissant sur le cytosquelette."},{"id":"07-q10","t":"qcm","q":"AMBISOME® est une forme de :","c":["Amphotéricine B en liposomes","Amphotéricine B en complexe lipidique","Nystatine en suspension","Caspofungine injectable"],"r":"Amphotéricine B en liposomes","x":"ABELCET® = complexe lipidique ; AMBISOME® = liposomes."},{"id":"07-q11","t":"qcm","q":"Quel est l'effet indésirable majeur de l'amphotéricine B en IV ?","c":["Néphrotoxicité","Hépatotoxicité","Ototoxicité","Photosensibilisation"],"r":"Néphrotoxicité","x":"Toxicité surtout rénale ; aussi torsades de pointes, hypokaliémie, convulsions…"},{"id":"07-q13","t":"qcm","q":"Quelle est l'utilisation particulière du kétoconazole en endocrinologie ?","c":["Traitement du syndrome de Cushing","Traitement de l'hypothyroïdie","Traitement du diabète","Contraception"],"r":"Traitement du syndrome de Cushing","x":"Inhibiteur de la stéroïdogenèse (synthèse du cortisol) ; comprimés 200 mg."},{"id":"07-q14","t":"qcm","q":"Lequel de ces antifongiques n'est PAS un triazolé ?","c":["Kétoconazole","Itraconazole","Fluconazole","Voriconazole"],"r":"Kétoconazole","x":"Le kétoconazole est un imidazolé."},{"id":"07-q15","t":"qcm","q":"Quel triazolé est chimiquement proche du fluconazole et actif sur toutes les espèces de Candida et d'Aspergillus et sur Scedosporium ?","c":["Voriconazole","Itraconazole","Posaconazole","Clotrimazole"],"r":"Voriconazole","x":"VFEND® ; large spectre."},{"id":"07-q16","t":"qcm","q":"VFEND® contient :","c":["Voriconazole","Fluconazole","Posaconazole","Itraconazole"],"r":"Voriconazole","x":"VFEND® = voriconazole."},{"id":"07-q21","t":"qcm","q":"La chloroquine (anc. NIVAQUINE®) est un dérivé de :","c":["La quinine","L'imidazole","La morpholine","L'ubiquinone"],"r":"La quinine","x":"Amoebicide, aussi anti-inflammatoire et antimalarique."},{"id":"07-q25","t":"qcm","q":"FLUOMIZIN (chlorure de déqualinium) est indiqué dans :","c":["La vaginose bactérienne","La candidose oropharyngée","Le pityriasis versicolor","L'aspergillose invasive"],"r":"La vaginose bactérienne","x":"Comprimés vaginaux ; antiseptique tensioactif, dérivé de la quinoléine."},{"id":"07-q26","t":"vrai_faux","q":"Le clotrimazole est utilisé par voie orale dans les mycoses systémiques.","c":["Vrai","Faux"],"r":"Faux","x":"Usage dermatologique (CANESTENE DERM, LOTRIDERM® avec bétaméthasone) et vaginal (CANESTENE GYN)."},{"id":"07-q27","t":"qcm","q":"Quelles marques contiennent de l'iode (polyvidone iodée / teinture) ?","c":["ISOBETADINE®, BRAUNODERM®, BRAUNOL®, IODEX®","DAKTARIN®, DAKTOZIN®","LAMISIL®, LOCERYL®","CANCIDAS®, VFEND®"],"r":"ISOBETADINE®, BRAUNODERM®, BRAUNOL®, IODEX®","x":"L'iode reste un antimycosique de choix (antiseptique mycoses + bactéries)."},{"id":"07-q28","t":"qcm","q":"Dans les structures de l'itraconazole et du fluconazole, quel atome est mis en rouge ?","c":["L'azote supplémentaire du triazole","Le fluor","L'oxygène du dioxolane","Le chlore"],"r":"L'azote supplémentaire du triazole","x":"C'est ce qui distingue le triazole (3 N) de l'imidazole (2 N)."},{"id":"07-q29","t":"qcm","q":"Sur quel stérol la membrane fongique repose-t-elle, et quel est son équivalent humain ?","c":["Ergostérol / cholestérol","Cholestérol / ergostérol","Lanostérol / squalène","Zymostérol / cortisol"],"r":"Ergostérol / cholestérol","x":"Tableau p.131 : CYP51 → ergostérol chez le champignon, CYP51A1 → cholestérol chez l'homme."},{"id":"07-q17","t":"qcm","q":"Quel est le mécanisme d'action du métronidazole ?","c":["Réduction du groupe NO2 en dérivés toxiques qui altèrent l'ADN","Inhibition du CYP51","Inhibition de la synthèse de la paroi","Inhibition du complexe III"],"r":"Réduction du groupe NO2 en dérivés toxiques qui altèrent l'ADN","x":"Réduction bien plus rapide chez les germes que dans les cellules de l'hôte ; même mode d'action que les nitrofurannes."},{"id":"07-q18","t":"qcm","q":"Quel nitroimidazolé (TIBERAL®) se prend une fois par jour grâce à sa longue demi-vie ?","c":["Ornidazole","Métronidazole","Niridazole","Nimorazole"],"r":"Ornidazole","x":"Ornidazole et tinidazole : demi-vie beaucoup plus élevée."},{"id":"07-q20","t":"qcm","q":"Quelle molécule est un alcaloïde de l'ipéca, amoebicide tissulaire et émétique ?","c":["Émétine","Chloroquine","Praziquantel","Pentamidine"],"r":"Émétine","x":"La déhydroémétine est moins toxique."},{"id":"07-q22","t":"qcm","q":"Quel est le mécanisme de l'atovaquone ?","c":["Inhibition du transfert d'électrons au complexe III","Inhibition de la tubuline","Formation de pores dans la membrane","Inhibition de la squalène époxydase"],"r":"Inhibition du transfert d'électrons au complexe III","x":"Analogue structural de l'ubiquinone."},{"id":"07-q23","t":"qcm","q":"PENTACARINAT® (pentamidine) est utilisé en aérosol pour :","c":["La prévention de la pneumonie à Pneumocystis carinii","Le traitement de l'onychomycose","Le traitement de la vaginose bactérienne","L'éradication d'H. pylori"],"r":"La prévention de la pneumonie à Pneumocystis carinii","x":"En cas de résistance ou CI au co-trimoxazole (SIDA)."},{"id":"07-q24","t":"qcm","q":"Comment agit le praziquantel ?","c":["Il augmente la perméabilité des membranes du parasite au calcium → paralysie en contraction","Il inhibe le CYP51","Il bloque la paroi de chitine","Il réduit son groupe nitro"],"r":"Il augmente la perméabilité des membranes du parasite au calcium → paralysie en contraction","x":"Actif sur la plupart des trématodes ; DRONCIT® à usage vétérinaire en Belgique."},{"id":"08-q1","t":"qcm","q":"Quelle propriété distingue la quinine de son diastéréoisomère, la quinidine ?","c":["La quinine est lévogyre et ne précipite pas avec KI","La quinine est dextrogyre et précipite avec KI","La quinine ne possède pas de groupe méthoxy","La quinine n'a pas de groupe vinyle"],"r":"La quinine est lévogyre et ne précipite pas avec KI","x":"La quinidine est dextrogyre (antiarythmique) ; la quinine, lévogyre, ne précipite pas avec KI."},{"id":"08-q2","t":"qcm","q":"LARIAM® contient :","c":["Chlorhydrate de méfloquine","Chloroquine","Quinine","Atovaquone + proguanil"],"r":"Chlorhydrate de méfloquine","x":"LARIAM® = chlorhydrate de méfloquine, réservé aux cas résistant à la chloroquine."},{"id":"08-q3","t":"vrai_faux","q":"La chloroquine est active sur Plasmodium falciparum dans la plupart des régions.","c":["Vrai","Faux"],"r":"Faux","x":"Elle est prophylactique contre P. vivax, P. ovale et P. malariae ; inactive vis-à-vis de P. falciparum sauf dans les rares régions sans résistance connue."},{"id":"08-q4","t":"qcm","q":"Quel est l'effet indésirable principal de la méfloquine qui justifie de commencer le traitement au moins 2 semaines avant le départ ?","c":["Troubles psychiques (insomnie, cauchemars, anxiété, hallucinations)","Photosensibilisation","Coloration des dents","Insuffisance rénale"],"r":"Troubles psychiques (insomnie, cauchemars, anxiété, hallucinations)","x":"Commencer tôt permet de les détecter avant le voyage."},{"id":"08-q5","t":"qcm","q":"Composition d'un comprimé de RIAMET® ?","c":["20 mg d'artéméther + 120 mg de luméfantrine","120 mg d'artéméther + 20 mg de luméfantrine","250 mg d'atovaquone + 100 mg de proguanil","100 mg de doxycycline"],"r":"20 mg d'artéméther + 120 mg de luméfantrine","x":"Rapport artéméther/luméfantrine 1:6."},{"id":"08-q6","t":"qcm","q":"Comment la luméfantrine et l'artéméther agissent-ils dans la vacuole digestive du parasite ?","c":["Ils altèrent la transformation de l'hème toxique en hémozoïne non toxique","Ils inhibent la dihydrofolate réductase","Ils bloquent le complexe III mitochondrial","Ils inhibent la polymérisation de la tubuline"],"r":"Ils altèrent la transformation de l'hème toxique en hémozoïne non toxique","x":"L'hème, produit de dégradation de l'hémoglobine, est toxique pour le parasite ; l'hémozoïne est le pigment non toxique."},{"id":"08-q8","t":"qcm","q":"Quelle différence structurale sépare la pyriméthamine de la forme active du proguanil ?","c":["Un azote en moins et un C2H5 à la place du fragment diméthyle","Un chlore en plus","Un CF3 à la place du Cl","Un cycle quinoléine à la place du phényle"],"r":"Un azote en moins et un C2H5 à la place du fragment diméthyle","x":"Pyriméthamine (DARAPRIM®) : 2,4-diaminopyrimidine."},{"id":"08-q9","t":"qcm","q":"Le proguanil et la pyriméthamine ont le même mode d'action que :","c":["Le triméthoprime","Le sulfaméthoxazole","L'atovaquone","La quinine"],"r":"Le triméthoprime","x":"Ce sont des inhibiteurs de la dihydrofolate réductase plus actifs chez le parasite que chez l'homme."},{"id":"08-q10","t":"qcm","q":"Quel élément structural est responsable de l'activité de l'artémisinine ?","c":["Le pont peroxyde intramoléculaire, qui donne des radicaux libres en présence de fer","La lactone, qui acyle les protéines","Le méthyle en 9","Le noyau quinoléine"],"r":"Le pont peroxyde intramoléculaire, qui donne des radicaux libres en présence de fer","x":"Les chélateurs du fer qui pénètrent dans les cellules inhibent l'effet antipaludique."},{"id":"08-q11","t":"qcm","q":"Quelle modification chimique de l'artémisinine (lactol) conduit à l'artéméther ?","c":["Méthylation","Éthylation","Fixation d'un sel sodique de l'acide succinique","Chloration"],"r":"Méthylation","x":"Éthylation → artééther ; acide succinique (sel sodique) → artésunate."},{"id":"08-q12","t":"qcm","q":"Pour le traitement du paludisme, la quinine :","c":["Ne s'utilise jamais en monothérapie","Est le premier choix en monothérapie","Est réservée à la prophylaxie","N'est plus disponible en Belgique"],"r":"Ne s'utilise jamais en monothérapie","x":"En Belgique, elle est disponible en vrac (préparation magistrale) pour la malaria."},{"id":"08-q15","t":"qcm","q":"Mécanisme d'action de la pipérazine ?","c":["Agoniste des récepteurs GABA des vers → paralysie flasque","Inhibition de la polymérisation de la tubuline","Découplage de la phosphorylation oxydative","Inhibition de la DHFR"],"r":"Agoniste des récepteurs GABA des vers → paralysie flasque","x":"Hyperpolarisation des membranes musculaires ; le ver se détache et est expulsé par le transit."},{"id":"08-q16","t":"qcm","q":"Seul benzimidazole commercialisé à usage humain en Belgique :","c":["Mébendazole (VERMOX®)","Albendazole","Flubendazole","Niclosamide (YOMESAN®)"],"r":"Mébendazole (VERMOX®)","x":"Flubendazole et albendazole : usage vétérinaire."},{"id":"08-q17","t":"qcm","q":"Les benzimidazolés sont le deuxième exemple de médicaments agissant sur le cytosquelette. Quel est le premier ?","c":["La griséofulvine","La colchicine","L'ivermectine","La terbinafine"],"r":"La griséofulvine","x":"Les benzimidazolés inhibent la polymérisation de la tubuline en microtubules chez certains parasites du tube digestif."},{"id":"08-q18","t":"vrai_faux","q":"Le mébendazole peut être pris sans problème pendant le premier trimestre de la grossesse.","c":["Vrai","Faux"],"r":"Faux","x":"Contre-indiqué au 1er trimestre (suspicion de tératogénicité)."},{"id":"08-q19","t":"qcm","q":"Traitement de premier choix d'une infestation à Taenia :","c":["Niclosamide","Mébendazole","Pipérazine","Ivermectine"],"r":"Niclosamide","x":"YOMESAN® ; inactif sur les vers ronds."},{"id":"08-q20","t":"qcm","q":"Quel type de paralysie l'ivermectine provoque-t-elle chez le parasite ?","c":["Paralysie en hypertonie","Paralysie flasque","Aucune paralysie, elle détruit les œufs","Paralysie par découplage mitochondrial"],"r":"Paralysie en hypertonie","x":"Effet sur l'entrée d'ions chlorure sous l'effet du GABA ; la pipérazine, elle, donne une paralysie flasque."},{"id":"08-q21","t":"qcm","q":"Pourquoi les spécialités à base de nifuroxazide ont-elles été retirées du marché ?","c":["Manque de preuves d'efficacité et risque de pollution des nappes phréatiques","Hépatotoxicité","Troubles psychiques","Allergie au mercure"],"r":"Manque de preuves d'efficacité et risque de pollution des nappes phréatiques","x":"Ancien ERCEFURYL®, nitrofuranne utilisé dans les diarrhées bactériennes."},{"id":"08-q24","t":"qcm","q":"Le perhydrol correspond à :","c":["Une solution de H2O2 à 30 % (100 volumes)","Une solution de H2O2 à 3 % (10 volumes)","Une solution de H2O2 à 6 % (20 volumes)","Du peroxyde d'urée"],"r":"Une solution de H2O2 à 30 % (100 volumes)","x":"Toujours le diluer avant de le vendre en vrac ; 3 % (10 v) pour les plaies."},{"id":"08-q26","t":"qcm","q":"L'eau de Dakin (DAKINCOOPER STABILISE®) est :","c":["Une solution d'hypochlorite sodique à 0,5 %","Une solution d'eau oxygénée à 3 %","Une solution d'acide borique à 3,5 %","Une solution de chloramine T"],"r":"Une solution d'hypochlorite sodique à 0,5 %","x":"L'eau de Javel est aussi une solution d'hypochlorite (potassique ou sodique)."},{"id":"08-q27","t":"qcm","q":"Quel antiseptique est vendu en comprimés (CLONAZONE®) pour désinfecter l'eau de piscine ou de source ?","c":["Chloramine T","Chlorhexidine","Chlorure de benzalkonium","Thiomersal"],"r":"Chloramine T","x":"Tosylchloramide sodique ; dégage du Cl2 en milieu acide ; remplace avantageusement l'hypochlorite."},{"id":"08-q28","t":"qcm","q":"Combien de groupements méthylènes possède la chaîne centrale de l'hexamidine ?","c":["6","3","5","10"],"r":"6","x":"Propamidine : 3 ; pentamidine : 5."},{"id":"08-q29","t":"qcm","q":"DETTOL® contient :","c":["Chloroxylénol","Hexachlorophène","Chlorhexidine","Chlorure de benzalkonium"],"r":"Chloroxylénol","x":"Halogénophénol obtenu par chloration du xylénol ; précipite par ajout d'eau. L'hexachlorophène n'est plus commercialisé."},{"id":"08-q30","t":"qcm","q":"Deux conservateurs des collyres cités dans le cours :","c":["Chlorure de benzalkonium et thiomersal","Éthanol et formol","Chlorhexidine et hexétidine","Éosine et merbromine"],"r":"Chlorure de benzalkonium et thiomersal","x":"Le benzalkonium (ammonium quaternaire) et le thiomersal (mercuriel) sont utilisés comme agents conservateurs dans les collyres."},{"id":"08-q31","t":"qcm","q":"Pourquoi la merbromine ne devrait-elle plus être utilisée ?","c":["Risque d'allergie et d'intoxication lors d'applications cutanées répétées","Elle est inactive","Elle est explosive","Elle décolore la peau"],"r":"Risque d'allergie et d'intoxication lors d'applications cutanées répétées","x":"Dérivé mercuriel ; l'éosine (tétrabromée, sans mercure) est un antiseptique faible."},{"id":"09-q-nucleoside-def","t":"qcm","q":"Comment appelle-t-on l'ensemble base azotée + ribose (sans phosphate) ?","c":["Nucléoside","Nucléotide","Nucléoïde","Nucléocapside"],"r":"Nucléoside","x":"Base + ribose = nucléoside ; + phosphate = nucléotide (NMP). Le nucléoïde est le peloton d'acide nucléique viral, la nucléocapside = capside + nucléoïde."},{"id":"09-q-ribose-desoxy","t":"qcm","q":"Quelle différence structurale distingue le 2-désoxyribose du ribose ?","c":["Absence d'OH en 2","Absence d'OH en 3","Absence du CH2OH en 5","Cycle à 6 atomes au lieu de 5"],"r":"Absence d'OH en 2","x":"Le 2-désoxyribose (ADN) n'a pas d'OH sur le carbone 2 ; le ribose (ARN) porte des OH en 2 et 3."},{"id":"09-q-thymine-uracile","t":"qcm","q":"Qu'est-ce qui différencie la thymine de l'uracile ?","c":["Un méthyle en 5","Un NH2 en 4","Un C=O en 6","Un azote en 7"],"r":"Un méthyle en 5","x":"La thymine est l'uracile portant un CH3 en position 5 (p.183)."},{"id":"09-q-purines","t":"qcm","q":"Parmi ces bases, lesquelles sont des purines ?","c":["Adénine et guanine","Cytosine et thymine","Uracile et cytosine","Adénine et cytosine"],"r":"Adénine et guanine","x":"Purines : adénine et guanine (bicycle) ; pyrimidines : thymine, cytosine, uracile."},{"id":"09-q-guanine-oxo","t":"qcm","q":"Quelle base purique porte un C=O en 6 et un NH2 en 2 ?","c":["Guanine","Adénine","Cytosine","Thymine"],"r":"Guanine","x":"La guanine porte C=O en 6 et NH2 en 2 ; l'adénine porte seulement un NH2 en 6."},{"id":"09-q-amp","t":"vrai_faux","q":"L'adénosine liée à un phosphate s'appelle adénosine monophosphate (AMP), qui est un nucléotide.","c":["Vrai","Faux"],"r":"Vrai","x":"Adénosine + 1 phosphate = AMP = A ; avec 2 ou 3 phosphates : ADP, ATP."},{"id":"09-q-triphosphate-polaire","t":"qcm","q":"Pourquoi n'administre-t-on pas directement les dérivés triphosphates des antimétabolites ?","c":["Ils sont très polaires et pénètrent peu ou pas dans les cellules","Ils sont trop toxiques pour le foie","Ils sont inactifs sur les polymérases","Ils sont détruits par l'acidité gastrique"],"r":"Ils sont très polaires et pénètrent peu ou pas dans les cellules","x":"Les antimétabolites sont donnés sous forme de base ou de nucléoside puis transformés en triphosphates par les enzymes de la cellule ou du virus."},{"id":"09-q-cycle-ordre","t":"qcm","q":"Quel est l'ordre correct des étapes de la multiplication virale ?","c":["Attachement → pénétration → décapsidation → réplication → assemblage → libération","Pénétration → attachement → réplication → décapsidation → libération → assemblage","Attachement → décapsidation → pénétration → assemblage → réplication → libération","Décapsidation → attachement → pénétration → réplication → libération → assemblage"],"r":"Attachement → pénétration → décapsidation → réplication → assemblage → libération","x":"Les six étapes du cours : attachement (adsorption), pénétration, décapsidation, réplication, assemblage, libération."},{"id":"09-q-vih-gp120","t":"qcm","q":"Lors de l'attachement du VIH, quelle protéine virale reconnaît le CD4 du lymphocyte T4 ?","c":["gp120","Neuraminidase","Protéine M2","Protéine F"],"r":"gp120","x":"Le VIH se fixe par reconnaissance entre la gp120 et la protéine CD4 (plus un co-récepteur)."},{"id":"09-q-integrase","t":"qcm","q":"Quelle enzyme du VIH incorpore l'ADN viral au génome de la cellule hôte ?","c":["Intégrase","Transcriptase réverse","Protéase à acides aspartiques","ARN polymérase cellulaire"],"r":"Intégrase","x":"La transcriptase réverse fabrique l'ADN double brin, l'intégrase l'incorpore au génome, la protéase découpe les précurseurs polyprotéiques."},{"id":"09-q-amantadine-b","t":"qcm","q":"Pourquoi l'amantadine est-elle inactive sur l'influenza B ?","c":["La protéine-canal M2 est absente chez l'influenza B","L'influenza B n'a pas de neuraminidase","L'influenza B est un virus à ADN","L'amantadine n'est pas absorbée per os"],"r":"La protéine-canal M2 est absente chez l'influenza B","x":"Amantadine et rimantadine se fixent sur le canal ionique M2, absent chez le type B."},{"id":"09-q-amantadine-parkinson","t":"qcm","q":"Par quel mécanisme l'amantadine agit-elle dans la maladie de Parkinson ?","c":["Elle augmente la libération de dopamine","Elle inhibe la neuraminidase","Elle bloque la thymidine kinase","Elle inhibe la transcriptase inverse"],"r":"Elle augmente la libération de dopamine","x":"C'est un antiparkinsonien mineur, seul dans les formes débutantes ou en association."},{"id":"09-q-tamiflu","t":"qcm","q":"Quelle est la DCI du TAMIFLU® ?","c":["Oseltamivir","Zanamivir","Amantadine","Remdésivir"],"r":"Oseltamivir","x":"TAMIFLU® = oseltamivir, prodrogue ester orale, inhibiteur de la neuraminidase."},{"id":"09-q-oseltamivir-prodrogue","t":"qcm","q":"Comment l'oseltamivir est-il activé ?","c":["Hydrolyse de son ester par des estérases hépatiques en acide carboxylique","Phosphorylation par la thymidine kinase virale","Oxydation par le CYP en sulfoxyde","Clivage par la protéase Mpro"],"r":"Hydrolyse de son ester par des estérases hépatiques en acide carboxylique","x":"Prodrogue : l'ester éthylique est hydrolysé par les estérases hépatiques, libérant l'acide carboxylique inhibiteur de la neuraminidase."},{"id":"09-q-oseltamivir-indication","t":"vrai_faux","q":"L'oseltamivir reste aujourd'hui indiqué en prophylaxie de la grippe chez tous les adultes non vaccinés.","c":["Vrai","Faux"],"r":"Faux","x":"L'oseltamivir n'est plus indiqué pour le traitement ou la prophylaxie de la grippe (rapport coûts-bénéfices négatif) et ne remplace en aucun cas la vaccination."},{"id":"09-q-nirsevimab-cible","t":"qcm","q":"Sur quoi se lie le nirsévimab (BEYFORTUS®) ?","c":["Les sous-unités F1 et F2 de la protéine de fusion du VRS","La neuraminidase du virus influenza","La protéine M2 du virus influenza A","La protéase 3CLpro du SARS-CoV-2"],"r":"Les sous-unités F1 et F2 de la protéine de fusion du VRS","x":"Il bloque la protéine F en conformation de préfusion et empêche l'entrée du VRS dans la cellule."},{"id":"09-q-nirsevimab-saison","t":"qcm","q":"Combien d'administrations de nirsévimab sont recommandées par saison de VRS ?","c":["Une seule","Une par mois, maximum 5","Deux à un mois d'intervalle","Une par semaine"],"r":"Une seule","x":"Une seule administration de nirsévimab par saison ; le schéma mensuel (max 5 doses) est celui du palivizumab."},{"id":"09-q-mpro","t":"qcm","q":"Quelle est la cible du nirmatrelvir ?","c":["La protéase principale Mpro (3CLpro, nsp5) du SARS-CoV-2","L'ARN polymérase ARN-dépendante (nsp12)","La protéase PLpro","La neuraminidase"],"r":"La protéase principale Mpro (3CLpro, nsp5) du SARS-CoV-2","x":"Inhibiteur peptidomimétique de Mpro ; sans Mpro, la RdRp n'est pas libérée et le virus ne se réplique pas."},{"id":"09-q-ritonavir-role","t":"qcm","q":"Quel est le rôle du ritonavir dans le PAXLOVID® ?","c":["Ralentir le métabolisme du nirmatrelvir","Inhiber directement la protéase du SARS-CoV-2","Inhiber l'ARN polymérase virale","Bloquer l'entrée du virus dans la cellule"],"r":"Ralentir le métabolisme du nirmatrelvir","x":"Le ritonavir est un inhibiteur de protéase non actif contre le SARS-CoV-2, associé à faible dose pour ralentir le métabolisme du nirmatrelvir."},{"id":"09-q-remdesivir-analogue","t":"qcm","q":"Le remdésivir est une prodrogue analogue nucléotidique de quel nucléoside ?","c":["Adénosine","Guanosine","Cytidine","Thymidine"],"r":"Adénosine","x":"Son triphosphate imite l'ATP et inhibe de manière compétitive l'ARN polymérase ARN-dépendante du SARS-CoV-2."},{"id":"09-q-foscarnet-seul","t":"qcm","q":"Quel antiviral, phosphonoformate non nucléosidique, est le seul à agir sur les virus à ADN et à ARN ?","c":["Foscarnet","Aciclovir","Cidofovir","Ganciclovir"],"r":"Foscarnet","x":"Le foscarnet trisodique (FOSCAVIR®) inhibe l'ADN polymérase des herpèsvirus/VHB et la transcriptase inverse des rétrovirus."},{"id":"09-q-aciclovir-tk","t":"qcm","q":"Quelle enzyme réalise la première phosphorylation (en monophosphate) de l'aciclovir ?","c":["La thymidine kinase d'origine virale","Les kinases cellulaires","Les estérases hépatiques","La kinase UL97 humaine"],"r":"La thymidine kinase d'origine virale","x":"Monophosphate par la thymidine kinase virale, puis triphosphate par les kinases cellulaires ; le triphosphate inhibe l'ADN polymérase virale."},{"id":"09-q-aciclovir-guanosine","t":"qcm","q":"L'aciclovir, le ganciclovir et le penciclovir sont des antimétabolites de quel nucléoside ?","c":["Guanosine","Adénosine","Cytidine","Uridine"],"r":"Guanosine","x":"Ils conservent la guanine et remplacent le ribose par une chaîne acyclique."},{"id":"09-q-zovirax","t":"qcm","q":"ZOVIRAX® et VIRATOP® contiennent quelle DCI, en usage dermatologique ?","c":["Aciclovir","Valaciclovir","Ganciclovir","Foscarnet"],"r":"Aciclovir","x":"Usage dermatologique de l'aciclovir : ZOVIRAX®, ACICLOVIR EG®, ACICLOVIR TEVA®, VIRATOP®."},{"id":"09-q-ganciclovir-vs-aciclovir","t":"qcm","q":"Structuralement, qu'a le ganciclovir de plus que l'aciclovir ?","c":["Un CH2OH supplémentaire sur la chaîne acyclique","Un ester de valine","Une cytosine à la place de la guanine","Un groupe phosphonate"],"r":"Un CH2OH supplémentaire sur la chaîne acyclique","x":"Aciclovir : CH2-O-CH2-CH2OH ; ganciclovir : CH2-O-CH(CH2OH)2 (p.192)."},{"id":"09-q-valganciclovir-pept1","t":"qcm","q":"Pourquoi le valganciclovir a-t-il une biodisponibilité orale (~60 %) bien supérieure au ganciclovir (~6 %) ?","c":["Son ester de valine en fait un substrat du transporteur peptidique PEPT1","Il est plus lipophile grâce à deux acétates","Il n'a pas besoin d'être phosphorylé","Il est protégé de l'acidité gastrique par un enrobage"],"r":"Son ester de valine en fait un substrat du transporteur peptidique PEPT1","x":"L'estérification par la valine augmente l'absorption intestinale via PEPT1 ; il est ensuite hydrolysé en ganciclovir."},{"id":"09-q-cymevene-valcyte","t":"qcm","q":"Associez correctement : CYMEVENE® et VALCYTE®","c":["CYMEVENE® = ganciclovir i.v. ; VALCYTE® = valganciclovir per os","CYMEVENE® = valganciclovir per os ; VALCYTE® = ganciclovir i.v.","CYMEVENE® = cidofovir ; VALCYTE® = valaciclovir","CYMEVENE® = aciclovir ; VALCYTE® = valaciclovir"],"r":"CYMEVENE® = ganciclovir i.v. ; VALCYTE® = valganciclovir per os","x":"Le valganciclovir (VALCYTE®) est une prodrogue orale du ganciclovir (CYMEVENE®, i.v.)."},{"id":"09-q-cidofovir","t":"qcm","q":"Le cidofovir (VISTIDE®) est un analogue de quel nucléoside ?","c":["Cytidine","Guanosine","Adénosine","Thymidine"],"r":"Cytidine","x":"Analogue de la cytidine, actif après phosphorylation sur le CMV résistant au ganciclovir (rétinite à CMV chez l'immunodéficient)."},{"id":"09-q-maribavir","t":"qcm","q":"Quelle est la cible du maribavir (LIVTENCITY®) ?","c":["La protéine kinase UL97 du CMV","La thymidine kinase de l'HSV","L'ADN polymérase humaine","La neuraminidase"],"r":"La protéine kinase UL97 du CMV","x":"Inhibiteur compétitif de UL97 : bloque la réplication, la maturation, l'encapsidation et la sortie nucléaire de l'ADN du CMV."},{"id":"09-q-valaciclovir-piege","t":"vrai_faux","q":"Le valaciclovir (ZELITREX®) est une prodrogue de l'aciclovir qui a une meilleure biodisponibilité orale que celui-ci.","c":["Vrai","Faux"],"r":"Vrai","x":"Ester de valine (le dessin p.193 montre la chaîne de l'aciclovir), spectre comparable à l'aciclovir mais meilleure biodisponibilité orale. Piège : ne pas confondre avec le valganciclovir (VALCYTE®), prodrogue du ganciclovir."},{"id":"10-q10-01","t":"qcm","q":"Quelle est la DCI de RETROVIR® ?","c":["Zidovudine","Lamivudine","Abacavir","Névirapine"],"r":"Zidovudine","x":"RETROVIR® = zidovudine, aussi appelée azidothymidine ou AZT (p.196)."},{"id":"10-q10-02","t":"qcm","q":"COMBIVIR® associe :","c":["Lamivudine + zidovudine","Abacavir + lamivudine","Lopinavir + ritonavir","Sofosbuvir + lédipasvir"],"r":"Lamivudine + zidovudine","x":"COMBIVIR® = lamivudine 150 mg + zidovudine 300 mg ; KIVEXA® = abacavir 600 mg + lamivudine 300 mg (p.196)."},{"id":"10-q10-03","t":"qcm","q":"Pourquoi un INTI incorporé dans l'ADN viral arrête-t-il l'élongation du brin ?","c":["Il ne possède pas de fonction OH en 3' pour former le lien phosphate suivant","Il détruit l'ARN viral","Il inhibe l'intégrase","Il empêche la fixation de gp120 à CD4"],"r":"Il ne possède pas de fonction OH en 3' pour former le lien phosphate suivant","x":"Les INTI, transformés en triphosphates, n'ont pas de 3'-OH : l'extension du brin s'arrête (p.196)."},{"id":"10-q10-04","t":"qcm","q":"Dans la zidovudine, quel groupe remplace le 3'-OH de la thymidine ?","c":["Un groupe azido (N3)","Un atome de soufre","Un atome de fluor","Une double liaison 2',3'"],"r":"Un groupe azido (N3)","x":"AZT = azidothymidine : N3 en 3' (en rouge sur la structure du cours). Le S dans le cycle caractérise la lamivudine ; la double liaison, la stavudine (p.197)."},{"id":"10-q10-05","t":"qcm","q":"Quelle différence structurale distingue l'emtricitabine de la lamivudine ?","c":["Un fluor en position 5 de la cytosine","Un groupe azido en 3'","Une base purique au lieu de pyrimidique","Un cycle cyclopentène"],"r":"Un fluor en position 5 de la cytosine","x":"L'emtricitabine (EMTRIVA®) est un dérivé proche de la lamivudine : même oxathiolane, avec F sur la cytosine (p.196, 198)."},{"id":"10-q10-06","t":"vrai_faux","q":"La lamivudine est aussi utilisée dans l'hépatite B chronique, sous le nom ZEFFIX®.","c":["Vrai","Faux"],"r":"Vrai","x":"Lamivudine = EPIVIR® (VIH) et ZEFFIX® (hépatite B chronique active, parfois avec l'interféron) (p.196, 209)."},{"id":"10-q10-07","t":"qcm","q":"L'entécavir (BARACLUDE®) est un analogue structural de :","c":["La guanosine","La thymidine","La cytidine","L'adénosine monophosphate"],"r":"La guanosine","x":"Entécavir = analogue de la guanosine ; après triphosphorylation, il inhibe l'ADN polymérase du VHB (p.198)."},{"id":"10-q10-08","t":"vrai_faux","q":"L'entécavir est utilisé principalement comme antiherpétique.","c":["Vrai","Faux"],"r":"Faux","x":"Développé initialement comme antiherpétique, il s'est révélé peu actif dans cette indication mais très actif contre le VHB ; il est utilisé exclusivement dans l'hépatite B chronique active (p.198, 209)."},{"id":"10-q10-09","t":"qcm","q":"Pourquoi certains inhibiteurs de la transcriptase inverse sont-ils actifs contre le virus de l'hépatite B ?","c":["Le VHB possède une ADN polymérase à activité transcriptase inverse","Le VHB est un rétrovirus à ARN","Le VHB utilise le co-récepteur CCR5","Le VHB possède une intégrase"],"r":"Le VHB possède une ADN polymérase à activité transcriptase inverse","x":"Le VHB, virus à ADN, est l'un des rares virus non rétroviraux à utiliser la transcription inverse dans sa réplication (p.199, 208)."},{"id":"10-q10-10","t":"qcm","q":"Le ténofovir est un inhibiteur nucléotidique de la transcriptase inverse, c'est-à-dire :","c":["Un analogue nucléosidique monophosphate","Un analogue non nucléosidique","Un peptidomimétique","Une protéine du groupe des cytokines"],"r":"Un analogue nucléosidique monophosphate","x":"Il est utilisé sous forme de prodrogue, le ténofovir disoproxil (VIREAD®), dans le VIH et l'hépatite B chronique active (p.199)."},{"id":"10-q10-11","t":"qcm","q":"Quelle molécule est un inhibiteur NON nucléosidique de la transcriptase inverse ?","c":["Névirapine","Abacavir","Didanosine","Ténofovir disoproxil"],"r":"Névirapine","x":"Névirapine (VIRAMUNE®, voie orale) et étravirine (INTELENCE®) sont des INNTI (p.200)."},{"id":"10-q10-12","t":"qcm","q":"Quel effet indésirable le cours cite-t-il pour l'étravirine (INTELENCE®) ?","c":["Réactions cutanées parfois sévères","Ototoxicité","Coloration des dents","Photosensibilisation"],"r":"Réactions cutanées parfois sévères","x":"Parmi ses nombreux effets indésirables possibles : réactions cutanées parfois sévères (p.200)."},{"id":"10-q10-13","t":"qcm","q":"Comment agissent les inhibiteurs de la protéase du VIH ?","c":["Ils empêchent la transformation des précurseurs gag et gag/pol en protéines structurales et enzymes","Ils bloquent l'intégration de l'ADN viral","Ils empêchent la liaison gp120–CCR5","Ils arrêtent l'élongation de l'ADN par absence de 3'-OH"],"r":"Ils empêchent la transformation des précurseurs gag et gag/pol en protéines structurales et enzymes","x":"Étape finale de maturation virale ; la plupart sont des peptidomimétiques (p.201)."},{"id":"10-q10-14","t":"vrai_faux","q":"Le lopinavir est disponible seul et en association avec le ritonavir.","c":["Vrai","Faux"],"r":"Faux","x":"Le lopinavir n'est disponible qu'en association fixe avec le ritonavir (KALETRA®) (p.201)."},{"id":"10-q10-15","t":"qcm","q":"Quel nom commercial correspond au darunavir ?","c":["PREZISTA®","NORVIR®","CELSENTRI®","ISENTRESS®"],"r":"PREZISTA®","x":"Darunavir = PREZISTA®, DARUNAVIR VIATRIS® ; NORVIR® = ritonavir ; CELSENTRI® = maraviroc ; ISENTRESS® = raltégravir (p.201, 206, 207)."},{"id":"10-q10-16","t":"qcm","q":"Sur les structures du cours, quelle différence distingue le darunavir de l'amprénavir ?","c":["Un bis-tétrahydrofurane au lieu d'un tétrahydrofurane","Deux thiazoles","Un fluor sur la sulfonamide","Un cycle quinoléine"],"r":"Un bis-tétrahydrofurane au lieu d'un tétrahydrofurane","x":"Le cycle supplémentaire du darunavir est dessiné en bleu p.203 ; le reste du squelette (hydroxyéthylamine, sulfonamide aminophényle) est commun."},{"id":"10-q10-17","t":"qcm","q":"Le fostemsavir (RUKOBIA®) appartient à la classe des :","c":["Inhibiteurs de l'attachement","Inhibiteurs d'intégrase","Antagonistes du CCR5","Inhibiteurs de fusion"],"r":"Inhibiteurs de l'attachement","x":"Prodrogue du temsavir, qui se lie à la sous-unité gp120 et inhibe l'interaction virus–CD4 (p.204-205)."},{"id":"10-q10-19","t":"qcm","q":"Que faut-il connaître avant de prescrire le maraviroc (CELSENTRI®) ?","c":["Le tropisme du virus (co-récepteur CCR5 ou CXCR4)","Le taux d'ALAT","Le génotype du VHC","Le statut vaccinal contre l'hépatite B"],"r":"Le tropisme du virus (co-récepteur CCR5 ou CXCR4)","x":"Le maraviroc, antagoniste du CCR5, n'est indiqué que pour le VIH-1 à tropisme CCR5 (p.206-207)."},{"id":"10-q10-20","t":"qcm","q":"Un virus VIH qui utilise exclusivement le co-récepteur CXCR4 est dit :","c":["X4","R5","R5/X4","CD4"],"r":"X4","x":"R5 = CCR5 exclusivement ; X4 = CXCR4 exclusivement ; R5/X4 = double tropisme (p.206)."},{"id":"10-q10-21","t":"qcm","q":"Le raltégravir (ISENTRESS®) inhibe :","c":["L'intégrase du VIH","La protéase du VIH","La transcriptase inverse","La polymérase NS5B"],"r":"L'intégrase du VIH","x":"L'intégrase insère l'ADN viral dans le génome de l'hôte ; le raltégravir est particulièrement intéressant chez les malades résistants aux autres antiviraux (p.207)."},{"id":"10-q10-22","t":"vrai_faux","q":"Il existe actuellement un vaccin contre l'hépatite C.","c":["Vrai","Faux"],"r":"Faux","x":"Phrase rouge : actuellement, il n'existe pas de vaccin contre l'hépatite C, mais la recherche se poursuit. Il en existe un, sûr et efficace, contre l'hépatite B (p.208, 210)."},{"id":"10-q10-23","t":"qcm","q":"Quel pourcentage de patients infectés par le VHC les antiviraux permettent-ils de guérir selon le cours ?","c":["Environ 90 %","Environ 30 %","Environ 50 %","100 %"],"r":"Environ 90 %","x":"Les médicaments antiviraux guérissent environ 90 % des sujets infectés ; l'OMS recommande des schémas avec des AAD (p.210)."},{"id":"10-q10-24","t":"qcm","q":"Le sofosbuvir (SOVALDI®) agit en inhibant :","c":["La polymérase NS5B du VHC","La protéase du VIH","L'ADN polymérase humaine","L'intégrase du VIH"],"r":"La polymérase NS5B du VHC","x":"Inhibiteur nucléotidique de l'ARN polymérase du VHC, prodrogue ; il ne semble pas agir sur l'ADN ou l'ARN polymérase humaine (p.211)."},{"id":"10-q10-25","t":"qcm","q":"HARVONI® associe :","c":["Sofosbuvir + lédipasvir","Sofosbuvir + ribavirine","Lopinavir + ritonavir","Abacavir + lamivudine"],"r":"Sofosbuvir + lédipasvir","x":"Lédipasvir avec sofosbuvir = HARVONI® ; le sofosbuvir se trouve aussi dans EPCLUSA® (p.211)."},{"id":"10-q10-26","t":"qcm","q":"La ribavirine est :","c":["Un analogue nucléosidique de la guanosine à large spectre antiviral","Un AAD spécifique de la protéase NS3/4A","Un interféron pégylé","Un inhibiteur non nucléosidique de la transcriptase inverse"],"r":"Un analogue nucléosidique de la guanosine à large spectre antiviral","x":"Activité in vitro contre de nombreux virus à ADN ou à ARN (herpès, grippe, VIH…) ; dans l'hépatite C, associée en cas d'échec (p.211)."},{"id":"10-q10-27","t":"qcm","q":"La fludarabine (FLUDARABINE TEVA®) est principalement utilisée comme :","c":["Anticancéreux (LLC à cellules B)","Antiviral contre l'hépatite C","Antirétroviral","Antiherpétique topique"],"r":"Anticancéreux (LLC à cellules B)","x":"Analogue de base purique (2-fluoro-adénine) dont le ribose est remplacé par un arabinose ; antimétabolite de l'adénosine (p.212)."},{"id":"10-q10-28","t":"qcm","q":"Quelles propriétés le cours attribue-t-il aux interférons ?","c":["Antivirales, antiprolifératives et immunomodulatrices","Antibactériennes et antifongiques","Uniquement antivirales","Inhibitrices de la protéase du VIH"],"r":"Antivirales, antiprolifératives et immunomodulatrices","x":"Protéines du groupe des cytokines, produites par génie génétique ; PEGASYS® = interféron alfa-2a pégylé (p.213)."},{"id":"10-q10-29","t":"qcm","q":"Quels antiviraux oraux l'OMS préconise-t-elle dans l'hépatite B chronique ?","c":["Ténofovir ou entécavir","Sofosbuvir ou lédipasvir","Ribavirine ou interféron","Maraviroc ou raltégravir"],"r":"Ténofovir ou entécavir","x":"Les plus puissants contre le VHB, rarement de pharmacorésistance, un comprimé par jour, peu d'effets secondaires (p.208)."},{"id":"10-q10-30","t":"vrai_faux","q":"Il existe un traitement antiviral spécifique de l'hépatite B aiguë.","c":["Vrai","Faux"],"r":"Faux","x":"Pas de traitement spécifique de l'hépatite B aiguë : soins de confort, équilibre nutritionnel, réhydratation. C'est l'hépatite B chronique qui se traite par antiviraux oraux (p.208)."},{"id":"11-q11-01","t":"qcm","q":"Quel atome de l'ypérite a été remplacé pour obtenir les moutardes à l'azote ?","c":["Le soufre","Le chlore","Le carbone central","L'oxygène"],"r":"Le soufre","x":"Ypérite = bis(2-chloroéthyl)sulfure ; en remplaçant S par N on obtient les moutardes à l'azote, moins toxiques."},{"id":"11-q11-02","t":"qcm","q":"Quelle est la cible nucléophile principale des agents alkylants dans l'ADN ?","c":["Le N7 (–N=) de la guanine","Le phosphate du squelette","Le N3 de la thymine","Le 2'-OH du ribose"],"r":"Le N7 (–N=) de la guanine","x":"Les alkylants lient entre elles des guanines (–N=) : pontage bicaténaire covalent stable."},{"id":"11-q11-03","t":"qcm","q":"LEUKERAN® contient :","c":["Chlorambucil","Melphalan","Busulfan","Cyclophosphamide"],"r":"Chlorambucil","x":"LEUKERAN® = chlorambucil ; ALKERAN® = melphalan."},{"id":"11-q11-04","t":"qcm","q":"Quelle chaîne en para du cycle distingue le melphalan du chlorambucil ?","c":["Une chaîne d'acide aminé CH2-CH(NH2)-COOH","Une chaîne butyrique (CH2)3-COOH","Un groupe sulfonate","Un phosphoramide cyclique"],"r":"Une chaîne d'acide aminé CH2-CH(NH2)-COOH","x":"Le melphalan dérive de la phénylalanine ; ce caractère amphotère plus marqué le rend plus soluble dans les acides."},{"id":"11-q11-05","t":"vrai_faux","q":"Le busulfan est le seul représentant des alkylsulfonates et est indiqué dans le conditionnement avant greffe de cellules souches hématopoïétiques.","c":["Vrai","Faux"],"r":"Vrai","x":"Busulfan (BUSULFAN FRENIUS KABI®) : CH3-SO2-O-(CH2)4-O-SO2-CH3, seul alkylsulfonate."},{"id":"11-q11-06","t":"qcm","q":"Quel lien existe entre cyclophosphamide et ifosfamide ?","c":["Isomères de position","Énantiomères","L'un est la prodrogue de l'autre","Aucun, classes différentes"],"r":"Isomères de position","x":"Ifosfamide (HOLOXAN®) = isomère de position du cyclophosphamide (ENDOXAN®) : un bras chloroéthyle est déplacé sur le N du cycle."},{"id":"11-q11-07","t":"qcm","q":"Quel phosphoramide est le seul soluble dans l'éthanol et les solvants organiques ?","c":["Thiotepa","Cyclophosphamide","Ifosfamide","Busulfan"],"r":"Thiotepa","x":"Les trois phosphoramides sont solubles dans l'eau, mais seul le thiotepa (TEPADINA®) l'est aussi dans l'éthanol."},{"id":"11-q11-09","t":"qcm","q":"Quelle propriété explique l'usage des nitrosourées dans les tumeurs du SNC ?","c":["Elles sont lipophiles et traversent la barrière hémato-méningée","Elles sont très hydrosolubles","Elles se fixent à la phosphoramidase","Elles libèrent du diazométhane"],"r":"Elles sont lipophiles et traversent la barrière hémato-méningée","x":"Fotémustine et carmustine : lipophiles ; la carmustine est l'antimitotique de choix des tumeurs du SNC."},{"id":"11-q11-10","t":"qcm","q":"Dans le cisplatine, quels ligands sont labiles ?","c":["Les deux chlorures","Les deux NH3","Tous les quatre","Aucun"],"r":"Les deux chlorures","x":"Structure commune : Pt(II), 2 substituants azotés peu labiles et 2 labiles (Cl ou O) ; dans l'eau les Cl sont remplacés par H2O/OH."},{"id":"11-q11-11","t":"qcm","q":"Quelle est l'indication phare du cisplatine selon le cours ?","c":["Tumeurs testiculaires ou ovariennes","Glioblastome","Leucémie myéloïde chronique","Psoriasis"],"r":"Tumeurs testiculaires ou ovariennes","x":"L'efficacité du cisplatine dans le cancer du testicule a été rapidement démontrée."},{"id":"11-q11-12","t":"qcm","q":"ELOXATIN® est utilisé dans le carcinome colorectal en association avec :","c":["Le fluorouracil et l'acide folique","Le méthotrexate","Le mesna","Le busulfan"],"r":"Le fluorouracil et l'acide folique","x":"ELOXATIN® = oxaliplatine, associé au fluorouracil et à l'acide folique (selon le cours) dans le carcinome colorectal."},{"id":"11-q11-13","t":"qcm","q":"Comment la découverte du cisplatine est-elle qualifiée ?","c":["Sérendipité (découverte accidentelle)","Criblage à haut débit","Conception rationnelle par modélisation","Extraction d'une plante"],"r":"Sérendipité (découverte accidentelle)","x":"Rosenberg (1965) étudiait l'effet du courant électrique sur E. coli avec des électrodes de platine."},{"id":"11-q11-14","t":"qcm","q":"La dacarbazine agirait en libérant dans la cellule :","c":["Du diazométhane, donneur de méthyle","De l'acroléine","Un ion aziridinium chloré","De l'estradiol"],"r":"Du diazométhane, donneur de méthyle","x":"Dacarbazine (DACARBAZINE MEDAC®) : mélanome métastasé, maladie de Hodgkin, sarcome."},{"id":"11-q11-15","t":"qcm","q":"TEMODAL® (temozolomide) se distingue de la dacarbazine car il :","c":["S'administre par voie buccale","Est un dérivé du platine","Est un antifolique","Ne traverse aucune membrane"],"r":"S'administre par voie buccale","x":"Temozolomide : per os, métabolite actif qui méthyle le DNA ; glioblastomes et astrocytomes."},{"id":"11-q11-16","t":"qcm","q":"Par quel groupe le mesna neutralise-t-il l'acroléine ?","c":["Le groupe SH (thiol)","Le groupe sulfonate","Un atome de platine","Un cycle aziridine"],"r":"Le groupe SH (thiol)","x":"Mesna = HS-CH2CH2SO3Na ; le SH réagit avec l'acroléine pour donner un produit non toxique."},{"id":"11-q11-17","t":"vrai_faux","q":"UROMITEXAN® et MISTABRON® contiennent la même molécule.","c":["Vrai","Faux"],"r":"Vrai","x":"Les deux = mesna : IV contre l'acroléine (UROMITEXAN®), aérosol contre l'encombrement bronchique de la mucoviscidose (MISTABRON®)."},{"id":"11-q11-18","t":"qcm","q":"Le dexrazoxane protège contre la cardiotoxicité des anthracyclines principalement par :","c":["Chélation du fer","Neutralisation de l'acroléine","Inhibition de la DHFR","Alkylation de l'ADN"],"r":"Chélation du fer","x":"Son métabolite à cycle ouvert chélate le fer et réduit le stress oxydatif ; il inhibe aussi la topo-isomérase II."},{"id":"11-q11-19","t":"qcm","q":"Quelles différences structurales séparent le méthotrexate de l'acide folique ?","c":["NH2 en 4 à la place du C=O et N10 méthylé","Thiophène à la place du benzène","Pyrrolopyrimidine à la place de la ptéridine","Absence de glutamate"],"r":"NH2 en 4 à la place du C=O et N10 méthylé","x":"Le thiophène = raltitrexed ; la pyrrolopyrimidine = pemetrexed."},{"id":"11-q11-20","t":"qcm","q":"Pourquoi l'acide folinique n'est-il donné que quelques heures APRÈS le méthotrexate à haute dose ?","c":["Pour ne pas annihiler l'effet antitumoral","Parce qu'il est instable","Parce qu'il précipite avec le méthotrexate","Pour éviter une interaction avec le mesna"],"r":"Pour ne pas annihiler l'effet antitumoral","x":"L'acide folinique (ou lévofolinique) contrecarre la toxicité hématologique mais, donné trop tôt, il annulerait l'effet sur la tumeur."},{"id":"11-q11-21","t":"qcm","q":"Quelle enzyme le raltitrexed (TOMUDEX®) inhibe-t-il ?","c":["La thymidylate synthase","La dihydrofolate réductase uniquement","La ribonucléotide réductase","La topo-isomérase II"],"r":"La thymidylate synthase","x":"La thymidylate synthase méthyle le dUMP en thymidine monophosphate ; indication : cancer colorectal avancé."},{"id":"11-q11-22","t":"qcm","q":"ALIMTA® (pemetrexed) est indiqué dans :","c":["Le mésothéliome pleural malin non résécable et le CBNPC déjà traité","La drépanocytose","Les kératoses solaires","Les tumeurs testiculaires"],"r":"Le mésothéliome pleural malin non résécable et le CBNPC déjà traité","x":"Le pemetrexed inhibe TS, DHFR et GARFT."},{"id":"11-q11-23","t":"qcm","q":"LANVIS® contient :","c":["Tioguanine","Mercaptopurine","Fludarabine","Cladribine"],"r":"Tioguanine","x":"PURI-NETHOL® = mercaptopurine ; LANVIS® = tioguanine (analogues de la purine, poudres jaunâtres)."},{"id":"11-q11-24","t":"qcm","q":"Quelle molécule a le statut de médicament orphelin dans la LAL réfractaire de l'enfant ?","c":["Clofarabine (EVOLTRA®)","Cladribine (LITAK®)","Cytarabine (CYTOSAR®)","Gemcitabine"],"r":"Clofarabine (EVOLTRA®)","x":"Médicament orphelin : maladie grave touchant moins de 5 personnes sur 10 000 dans l'UE."},{"id":"11-q11-25","t":"qcm","q":"Quel est l'autre nom de la cladribine ?","c":["Chlorodéoxyadénosine","Cytosine arabinoside","Hydroxycarbamide","2,2'-difluorodéoxycytidine"],"r":"Chlorodéoxyadénosine","x":"Cladribine (LEUSTATIN®, LITAK®) : leucémies."},{"id":"11-q11-26","t":"qcm","q":"Le 5-fluorouracile est :","c":["Un uracile portant un F en position 5, inactif tel quel","Une cytidine difluorée","Une prodrogue orale","Une purine thiolée"],"r":"Un uracile portant un F en position 5, inactif tel quel","x":"Il est métabolisé en 5-FdUMP et 5-FdUTP incorporés dans l'ADN."},{"id":"11-q11-27","t":"vrai_faux","q":"La capécitabine doit être injectée, contrairement au 5-FU.","c":["Vrai","Faux"],"r":"Faux","x":"C'est l'inverse : la capécitabine (XELODA®) est une prodrogue orale du 5-FU, qui lui doit être injecté."},{"id":"11-q11-28","t":"qcm","q":"Quelle différence structurale sépare la cytarabine de la cytidine ?","c":["Un arabinose au lieu du ribose","Deux fluors en 2'","Un F en 5 de la base","Un 5'-désoxyribose"],"r":"Un arabinose au lieu du ribose","x":"Ara-C : antimétabolite le plus utilisé dans les leucémies aiguës myéloïdes et lymphoblastiques."},{"id":"11-q11-29","t":"qcm","q":"Quelle molécule est utilisée dans l'adénocarcinome du pancréas selon le cours ?","c":["Gemcitabine","Cytarabine","Mercaptopurine","Busulfan"],"r":"Gemcitabine","x":"Gemcitabine : CBNPC, pancréas, vessie, sein métastatique."},{"id":"11-q11-30","t":"qcm","q":"Quelle est la formule de l'hydroxyurée et sa cible ?","c":["H2N-CO-NHOH ; ribonucléotide réductase","H2N-CO-NH2 ; DHFR","HS-CH2CH2SO3H ; acroléine","CH3-SO2-O-(CH2)4-O-SO2-CH3 ; ADN"],"r":"H2N-CO-NHOH ; ribonucléotide réductase","x":"HYDREA®/SIKLOS® : inhibe la conversion des ribonucléotides en désoxyribonucléotides."},{"id":"11-q11-31","t":"qcm","q":"Selon le cours, quel effet de l'hydroxyurée est le mieux corrélé à la réduction des crises drépanocytaires ?","c":["La diminution des neutrophiles (effet cytoréducteur)","L'augmentation de l'HbF","L'hydratation des hématies","L'inhibition de la thymidylate synthase"],"r":"La diminution des neutrophiles (effet cytoréducteur)","x":"La corrélation avec la hausse d'HbF est inconstante ; la baisse des neutrophiles est le facteur le plus fortement corrélé."},{"id":"12-q12-01","t":"qcm","q":"Le létrozole (FEMARA®) contient quel hétérocycle ?","c":["Un 1,2,4-triazole","Un imidazole","Un stéroïde","Une acridine"],"r":"Un 1,2,4-triazole","x":"Le létrozole est un inhibiteur non stéroïdien : un CH central porte un 1,2,4-triazol-1-yle et deux 4-cyanophényles."},{"id":"12-q12-02","t":"qcm","q":"Combien de groupements nitrile (–C≡N) porte le létrozole ?","c":["2","1","3","0"],"r":"2","x":"Deux benzonitriles en para, symétriques autour du CH central portant le triazole."},{"id":"12-q12-03","t":"qcm","q":"Quelle est la position du groupement méthoxy du méthoxsalène (MOPSORALEN®) sur le noyau psoralène ?","c":["8","5","3","4'"],"r":"8","x":"Méthoxsalène = 8-méthoxypsoralène ; le 5-méthoxypsoralène est le bergaptène."},{"id":"12-q12-04","t":"qcm","q":"Quelle est la DCI de l'ARIMIDEX® ?","c":["Anastrozole","Létrozole","Exémestane","Tamoxifène"],"r":"Anastrozole","x":"ARIMIDEX® = anastrozole, inhibiteur non stéroïdien de l'aromatase."},{"id":"12-q12-05","t":"qcm","q":"L'AROMASIN® (exémestane) est…","c":["Un inhibiteur stéroïdien de l'aromatase","Un inhibiteur non stéroïdien de l'aromatase","Un SERM","Un antiandrogène"],"r":"Un inhibiteur stéroïdien de l'aromatase","x":"L'exémestane est le seul inhibiteur stéroïdien de l'aromatase du cours."},{"id":"12-q12-06","t":"qcm","q":"CAMPTO® correspond à…","c":["Irinotécan","Topotécan","Étoposide","Camptothécine"],"r":"Irinotécan","x":"CAMPTO® = irinotécan, dérivé hémisynthétique de la camptothécine (topo-isomérase I)."},{"id":"12-q12-07","t":"qcm","q":"HYCAMTIN® (topotécan) est indiqué dans…","c":["Le carcinome ovarien récidivant après échec du platine","Les cancers colorectaux métastasés","Le psoriasis","Le liposarcome non résécable"],"r":"Le carcinome ovarien récidivant après échec du platine","x":"Le topotécan est utilisé dans le carcinome ovarien récidivant après échec des traitements à base de platine."},{"id":"12-q12-08","t":"qcm","q":"Quelle anthracycline est commercialisée sous le nom de ZAVEDOS® ?","c":["Idarubicine","Daunorubicine","Épirubicine","Doxorubicine"],"r":"Idarubicine","x":"ZAVEDOS® = idarubicine."},{"id":"12-q12-09","t":"qcm","q":"Parmi ces marques, laquelle ne contient PAS de doxorubicine ?","c":["FARMORUBICINE®","CAELYX®","MYOCET®","ADRIBLASTINA®"],"r":"FARMORUBICINE®","x":"FARMORUBICINE® contient l'épirubicine, épimère de la doxorubicine."},{"id":"12-q12-10","t":"qcm","q":"Quel est l'effet indésirable majeur des anthracyclines ?","c":["Cardiomyopathies, même après l'arrêt du traitement","Photosensibilisation","Déficit en cortisol","Brûlures cutanées"],"r":"Cardiomyopathies, même après l'arrêt du traitement","x":"Myélosuppression et surtout cardiomyopathies qui peuvent apparaître même après l'arrêt."},{"id":"12-q12-11","t":"qcm","q":"Pourquoi l'idarubicine est-elle mieux résorbée que la daunorubicine ?","c":["Elle n'a pas de méthoxy en position 4, donc elle est plus lipophile","Elle a un OH supplémentaire en R'","Elle n'a pas d'aminosucre","C'est un épimère au niveau du sucre"],"r":"Elle n'a pas de méthoxy en position 4, donc elle est plus lipophile","x":"Absence du groupement méthoxy en position 4 → plus lipophile → mieux résorbée."},{"id":"12-q12-12","t":"qcm","q":"Quelle différence structurale distingue la doxorubicine de la daunorubicine ?","c":["R' = OH (C(=O)CH2OH) au lieu de H","Absence du méthoxy en 4","Épimérie de l'OH du sucre","Absence d'aminosucre"],"r":"R' = OH (C(=O)CH2OH) au lieu de H","x":"Daunorubicine : R = OCH3, R' = H ; doxorubicine : R = OCH3, R' = OH."},{"id":"12-q12-13","t":"vrai_faux","q":"Vrai ou faux : l'amsacrine est à la fois un agent intercalant et un inhibiteur de la topo-isomérase II.","c":["Vrai","Faux"],"r":"Vrai","x":"L'amsacrine, dérivé de l'acridine, est un agent intercalant et un inhibiteur de la topo-isomérase II, utilisé dans les leucémies."},{"id":"12-q12-14","t":"qcm","q":"La bléomycine est…","c":["Un pseudo-intercalant qui provoque des cassures de l'ADN","Un inhibiteur de la topo-isomérase I","Un poison du fuseau","Un SERM"],"r":"Un pseudo-intercalant qui provoque des cassures de l'ADN","x":"Élaborée par Streptomyces verticillus, la bléomycine (A2 majoritaire) est un pseudo-intercalant capable de provoquer une cassure de l'ADN."},{"id":"12-q12-15","t":"qcm","q":"Que signifie PUVA ?","c":["Psoralène + UVA","Photothérapie par UV artificiels","Psoralène + UVB","Photosensibilisation par vitamine A"],"r":"Psoralène + UVA","x":"Photochimiothérapie combinant un psoralène et une exposition aux UVA (320-380 nm)."},{"id":"12-q12-16","t":"qcm","q":"En moyenne, combien de temps après la prise orale de psoralène la concentration épidermique est-elle maximale ?","c":["2 à 4 heures","30 minutes","8 heures","24 heures"],"r":"2 à 4 heures","x":"Maximum 2 à 4 h après la prise buccale, persistance environ 8 h."},{"id":"12-q12-17","t":"vrai_faux","q":"Vrai ou faux : à l'obscurité, les psoralènes forment des liaisons covalentes avec le DNA.","c":["Vrai","Faux"],"r":"Faux","x":"À l'obscurité ils s'intercalent sans former de liaisons covalentes ; c'est la lumière qui les active et provoque les adduits."},{"id":"12-q12-18","t":"qcm","q":"Quelle topo-isomérase coupe et ressoude un seul brin de DNA ?","c":["La topo-isomérase I","La topo-isomérase II","Les deux","Aucune"],"r":"La topo-isomérase I","x":"Topo I : un brin ; topo II : les deux brins, ressoudés après modification de la torsion."},{"id":"12-q12-19","t":"qcm","q":"Lequel de ces inhibiteurs de la topo-isomérase II n'a PAS d'effet intercalant ?","c":["Étoposide","Amsacrine","Doxorubicine","Daunorubicine"],"r":"Étoposide","x":"Étoposide et téniposide n'ont pas d'effet intercalant, contrairement à l'amsacrine et aux anthracyclines."},{"id":"12-q12-20","t":"qcm","q":"Pourquoi le téniposide est-il administré par voie intraveineuse ?","c":["Il est acidosensible","Il est trop lipophile","Il est photosensibilisant","Il est cardiotoxique"],"r":"Il est acidosensible","x":"L'étoposide est utilisable per os, le téniposide est acidosensible et donné en IV."},{"id":"12-q12-21","t":"qcm","q":"Le WARTEC® (podophyllotoxine) est utilisé…","c":["En usage local pour les verrues","Par voie IV dans les leucémies","Per os dans le cancer du poumon","Dans le psoriasis avec UVA"],"r":"En usage local pour les verrues","x":"La podophyllotoxine n'est plus utilisée qu'en usage local, pour traiter les verrues."},{"id":"12-q12-22","t":"qcm","q":"Les alcaloïdes de la pervenche (vinblastine, vincristine…) agissent en…","c":["Inhibant la polymérisation de la tubuline en microtubules","Empêchant la dépolymérisation des microtubules","Inhibant la topo-isomérase I","S'intercalant dans le DNA"],"r":"Inhibant la polymérisation de la tubuline en microtubules","x":"Ils inhibent l'assemblage de la tubuline en microtubules lors de la métaphase ; les taxoïdes, eux, empêchent la dépolymérisation."},{"id":"12-q12-23","t":"qcm","q":"D'après le tableau du cours, qu'est-ce qui distingue la vincristine de la vinblastine ?","c":["R1 = CHO au lieu de CH3","Un amide CONH2 au lieu de l'ester","Un cycle tétrahydropyridine","Absence d'acétate"],"r":"R1 = CHO au lieu de CH3","x":"Vinblastine : R1 = CH3 ; vincristine : R1 = CHO ; le reste est identique."},{"id":"12-q12-24","t":"qcm","q":"Quel alcaloïde de la pervenche est obtenu par hémisynthèse parmi ces trois sulfates : vindésine, vincristine, vinblastine ?","c":["Vindésine","Vincristine","Vinblastine","Aucun"],"r":"Vindésine","x":"Le premier cité (vindésine) est obtenu par hémi-synthèse, les deux autres sont d'origine naturelle."},{"id":"12-q12-25","t":"qcm","q":"Quelle est la différence structurale entre le docétaxel et le paclitaxel sur la chaîne latérale (dessin du cours) ?","c":["Boc (tert-butoxycarbonyle) au lieu du benzoyle sur l'azote","Un OH en plus sur le noyau oxétane","Absence du cycle phényle","Un thiophène à la place du phényle"],"r":"Boc (tert-butoxycarbonyle) au lieu du benzoyle sur l'azote","x":"Paclitaxel : NH–CO–Ph ; docétaxel : NH–CO–O–C(CH3)3."},{"id":"12-q12-26","t":"qcm","q":"Le paclitaxel bloque la mitose car il…","c":["Active la polymérisation de oné","x":"PS341, VELCADE® (p.268)."},{"id":"13-q24","t":"qcm","q":"Quel groupe fonctionnel du bortézomib lui permet une liaison réversible au protéasome ?","c":["L'acide boronique B(OH)2","L'époxyde","L'acrylamide","Le nitrile"],"r":"L'acide boronique B(OH)2","x":"Liaison réversible (bore) ; l'époxykétone (irréversible) est celle du carfilzomib (p.269)."},{"id":"13-q25","t":"qcm","q":"Quel inhibiteur du protéasome n'est PAS boré et agit de façon irréversible ?","c":["Carfilzomib","Bortézomib","Ixazomib","Olaparib"],"r":"Carfilzomib","x":"KYPROLIS® : époxykétone, IV, toxicité cardiaque (p.269)."},{"id":"13-q26","t":"qcm","q":"Quel effet indésirable est fréquemment associé au bortézomib selon le tableau du cours ?","c":["Neuropathie","Toxicité cardiaque","Photosensibilisation","Aucun"],"r":"Neuropathie","x":"La toxicité cardiaque est celle du carfilzomib (p.269)."},{"id":"13-q27","t":"qcm","q":"L'ipilimumab (YERVOY®) est un inhibiteur de point de contrôle de type…","c":["anti-CTLA-4","anti-PD-1","anti-CD20","anti-VEGF"],"r":"anti-CTLA-4","x":"Le pembrolizumab (KEYTRUDA®) est anti-PD-1 (p.269)."},{"id":"13-q29","t":"qcm","q":"Où se lie la trabectédine (YONDELIS®) ?","c":["Au petit sillon de l'ADN","Au site ATP de BCR-ABL","Au protéasome 20S","Au récepteur PD-1"],"r":"Au petit sillon de l'ADN","x":"Ecteinascidine d'un tunicier ; sarcomes des tissus mous (p.270)."},{"id":"13-q30","t":"qcm","q":"Comment la trétinoïne diffère-t-elle de la vitamine A ?","c":["Le CH2OH est remplacé par COOH","Elle a un cycle aromatique en plus","Elle possède un bore","Le COOH est remplacé par CH2OH"],"r":"Le CH2OH est remplacé par COOH","x":"Acide tout-trans rétinoïque, VESANOID®, leucémie promyélocytaire aiguë (p.272)."},{"id":"14-q-dimeticone-meca","t":"qcm","q":"Comment agit la diméticone contre les poux ?","c":["Elle bouche leurs stigmates respiratoires et les tue par asphyxie","Elle inhibe leur acétylcholinestérase","Elle bloque les canaux sodiques neuronaux","Elle dissout la chitine"],"r":"Elle bouche leurs stigmates respiratoires et les tue par asphyxie","x":"Polydiméthylsiloxane formant un film asphyxiant ; non toxique, pas de résistance."},{"id":"14-q-dimeticone-struct","t":"qcm","q":"Quel motif répété correspond à la diméticone ?","c":["—[O-Si(CH3)2]n—","—[CH2-CHCl]n—","—[O-CH2-CH2]n—","—[NH-CO]n—"],"r":"—[O-Si(CH3)2]n—","x":"Polymère organominéral de la famille des siloxanes."},{"id":"14-q-lindane-struct","t":"qcm","q":"Quelle structure correspond au lindane ?","c":["Un cyclohexane portant 6 atomes de chlore","Deux p-chlorophényles reliés à un CCl3","Un thiophosphate de p-nitrophényle","Un ester de cyclopropane dichlorovinylique"],"r":"Un cyclohexane portant 6 atomes de chlore","x":"Le lindane (γ-hexachlorocyclohexane) et le DDT sont des organochlorés interdits en Belgique."},{"id":"14-q-organochlores-statut","t":"vrai_faux","q":"Le DDT et le lindane sont encore utilisés comme antiscabieux en Belgique.","c":["Vrai","Faux"],"r":"Faux","x":"Ils sont aujourd'hui interdits en Belgique ; ils étaient parfois utilisés contre la gale."},{"id":"14-q-op-mecanisme","t":"qcm","q":"Le malathion et le parathion agissent en :","c":["Inhibant de façon covalente l'acétylcholinestérase","Bouchant les stigmates respiratoires","Activant les récepteurs S1P","Inhibant la calcineurine"],"r":"Inhibant de façon covalente l'acétylcholinestérase","x":"Organophosphorés dérivés des gaz de combat (tabun, sarin, soman)."},{"id":"14-q-op-antidote","t":"qcm","q":"Quel est le réactivateur des cholinestérases cité pour traiter une intoxication aux organophosphorés ?","c":["Pralidoxime","Atropine","Perméthrine","Diméticone"],"r":"Pralidoxime","x":"L'atropine à forte dose (1 mg) est l'anticholinergique ; le pralidoxime réactive l'enzyme."},{"id":"14-q-zalvor","t":"qcm","q":"ZALVOR 5 % crème contient :","c":["Perméthrine","Diméticone","Malathion","Lindane"],"r":"Perméthrine","x":"50 mg/g ; gale et poux du pubis."},{"id":"14-q-pegasys","t":"qcm","q":"PEGASYS® (peginterféron α-2a) est indiqué dans :","c":["L'hépatite chronique B et l'hépatite C","La sclérose en plaques","Le myélome multiple","La dermatite atopique"],"r":"L'hépatite chronique B et l'hépatite C","x":"Les interférons β (AVONEX®, REBIF®, BETAFERON®…) sont ceux de la SEP."},{"id":"14-q-ifn-gamma","t":"qcm","q":"L'interféron de type II (IFN-γ) est sécrété par :","c":["Les lymphocytes T activés et les cellules NK","Les fibroblastes","Les macrophages uniquement","Les hépatocytes"],"r":"Les lymphocytes T activés et les cellules NK","x":"IFN-α : macrophages ; IFN-β : fibroblastes (type I)."},{"id":"14-q-fumarate-struct","t":"qcm","q":"Le fumarate de diméthyle est :","c":["Le diester méthylique de l'acide fumarique (double liaison trans)","Le diester méthylique de l'acide maléique (cis)","Un ester de l'acide mycophénolique","Un polysiloxane"],"r":"Le diester méthylique de l'acide fumarique (double liaison trans)","x":"Ester de méthyle de l'acide fumarique, métabolisé en fumarate de monométhyle."},{"id":"14-q-mavenclad","t":"qcm","q":"MAVENCLAD® (voie orale, SEP très active) contient :","c":["Cladribine","Tériflunomide","Fingolimod","Azathioprine"],"r":"Cladribine","x":"Analogue des purines déjà vu en antitumoral (forme injectable)."},{"id":"14-q-glatiramere","t":"qcm","q":"La structure de l'acétate de glatiramère (COPAXONE®) a été conçue pour ressembler à :","c":["La protéine basique de la myéline","La sphingosine-1-phosphate","L'interleukine 2","L'acétylcholine"],"r":"La protéine basique de la myéline","x":"Il se fixerait sur le CMH II des cellules présentatrices d'antigène et empêcherait l'activation T par la MBP."},{"id":"14-q-fingolimod-lympho","t":"qcm","q":"Comment le fingolimod provoque-t-il une lymphopénie ?","c":["En inhibant la sortie des lymphocytes du thymus et des ganglions","En détruisant les lymphocytes B CD20+","En inhibant l'IMPDH","En bloquant la calcineurine"],"r":"En inhibant la sortie des lymphocytes du thymus et des ganglions","x":"Phosphorylé, il module les récep
