e cadre de cette UE, les noms commerciaux ne sont pas à retenir."}, {"id": "p:ch7:2", "lab": "Liste du prof", "q": "Dia 41 : l'aloïnoside porte un rhamnose sur le CH2O en C3, alors que le texte parle d'un glucose ; pourquoi ?", "r": "Oui, cela peut être un autre sucre que le glucose (ici le rhamnose)."}, {"id": "p:ch7:3", "lab": "Question ouverte d'examen", "q": "**Dérivés anthracéniques laxatifs** : structure requise, formes anthrones / anthraquinones, O- et C-hétérosides, monomères / dimères, mécanisme d'action et précautions. Citez deux drogues.", "r": "Dérivés **1,8-dihydroxyanthracéniques** : OH en **1 et 8 indispensables**, C3 substitué (CH3, CH2OH, COOH).\n**Anthraquinones** (C=O en 9 et 10, oxydées) vs **anthrones** (C=O en 9, CH2 en 10, réduites) ; **dimères** = dianthrones liées C10–C10' (sennosides) ; **O-hétérosides** (hydrolyse facile) vs **C-hétérosides** (glucose sur C10, très stables : aloïnes).\n**Mécanisme** : hétérosides = **prodrogues** non absorbées, hydrolysées par la flore du **côlon** puis réduites en **anthrones actives** → latence **8–10 h**.\n**Précautions** : anthrones de la plante **fraîche irritantes** (bourdaine utilisée après 1 an ou chauffage) ; usage de courte durée.\nDrogues : **séné** (sennosides), **bourdaine** (frangulosides), **cascara** (cascarosides), **aloès** (aloïnes), rhubarbe."}, {"id": "p:ch7:4", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Sennoside B** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Quinones\n**Solubilité** : dérivé anthracénique, dianthrone O-hétéroside\n**Sans chauffage** : H₂O"}, {"id": "p:ch7:5", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Aloïne** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Dérivé anthracénique\n**Solubilité** : C-hétéroside d'anthrone\n**Sans chauffage** : H₂O"}, {"id": "p:ch7:6", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Aloïne** ?", "r": "**Aloïne** : C-hétéroside d'anthrone (barbaloïne), latex d'aloès ; laxatif stimulant."}, {"id": "p:ch7:7", "lab": "Nouvelle question au format examen", "q": "Arbutoside, coenzyme Q10 : classe, source, activité, précautions", "r": "**Arbutoside** : glucoside d'**hydroquinone** (rattaché aux benzoquinones et dérivés) ; feuilles de busserole (*Arctostaphylos uva-ursi*) ; hydrolysé → hydroquinone éliminée dans l'urine → **antiseptique urinaire**, actif surtout en urine **alcaline** ; usage court (hydroquinone potentiellement toxique), contre-indiqué grossesse/enfant ; dépigmentant en cosmétique (réglementé). **Coenzyme Q10** (ubiquinone) : benzoquinone + chaîne de 10 unités isopréniques ; transporteur d'électrons de la chaîne respiratoire mitochondriale, antioxydant ; complément (myalgies sous statines, qui ↓ sa synthèse)."}, {"id": "p:ch7:8", "lab": "Nouvelle question au format examen", "q": "Vitamines K1 et K2 (naphtoquinones) : structure, sources, rôle ; différences et similitudes avec la vit. E", "r": "**K1** (phylloquinone) : 2-méthyl-1,4-naphtoquinone + chaîne phytyle ; légumes verts. **K2** (ménaquinones) : chaîne polyisoprénique ; bactéries intestinales, aliments fermentés. Rôle : cofacteur de la γ-carboxylation des facteurs II, VII, IX, X (et ostéocalcine) → coagulation ; antidote des AVK ; injection au nouveau-né. **Vit. E** (tocophérols) : noyau **chromane** (phénol) + chaîne phytyle ; antioxydant membranaire (protège les AGPI). Similitudes : liposolubles, chaîne terpénique (phytyle), dérivées en partie du shikimate (noyau aromatique) + mévalonate/MEP ; différences : K = quinone redox de la coagulation ; E = phénol antioxydant."}, {"id": "p:ch7:9", "lab": "Nouvelle question au format examen", "q": "Acide carminique : structure et usage", "r": "Anthraquinone **C-glucoside** (hydrosoluble), extrait de la **cochenille** (*Dactylopius coccus*, insecte) ; colorant rouge **carmin E120** (alimentaire, cosmétique, pharmaceutique) ; couleur dépendant du pH ; allergies possibles ; non végétalien."}, {"id": "p:ch7:10", "lab": "Nouvelle question au format examen", "q": "Dérivés anthracéniques laxatifs : distinguez anthrones / anthraquinones, O- / C-hétérosides, génines, monomères / dimères. Mode d'action. Pourquoi ne pas utiliser l'écorce fraîche de bourdaine ?", "r": "**Anthraquinone** : forme oxydée (C9 et C10 = C=O). **Anthrone** : forme réduite (C10 = CH₂/CH), la plus active et la plus irritante. **Dianthrone** : dimère de 2 anthrones liées C10-C10' (sennosides = dianthrones O-glucosides ; sennidines = génines). **O-hétérosides** (sucre sur un OH phénolique, souvent en 8 : sennosides, glucofrangulosides) → hydrolyse acide. **C-hétérosides** (sucre lié en C10 : **aloïnes**) → résistants à l'acide, hydrolyse oxydative. **Cascarosides** (cascara) : à la fois O- et C-hétérosides. Squelette toujours **1,8-dihydroxyanthracénique**. **Rhéine** : anthraquinone à COOH (rhubarbe, séné).\n**Mode d'action** : hétérosides non absorbés dans le grêle (prodrogues) → côlon : β-glucosidases bactériennes libèrent les génines, réduites en **anthrones** actives → inhibition de la réabsorption d'eau et de Na⁺, ↑ sécrétion de Cl⁻/K⁺ et d'eau, ↑ péristaltisme (via prostaglandines) ; effet en 8-12 h.\n**Bourdaine fraîche** : contient des anthrones libres → émétique, coliques violentes ; il faut la **vieillir 1 an** ou la chauffer (oxydation des anthrones en anthraquinones). Drogues : séné (folioles et gousses : sennosides A/B), bourdaine (écorce : frangulosides, glucofrangulosides), cascara (écorce : cascarosides), aloès (latex : aloïnes), rhubarbe (racine).\n**Précautions** : usage court (≤ 1-2 semaines) ; hypokaliémie (danger avec digitaliques, antiarythmiques, diurétiques hypokaliémiants) ; mélanose colique ; contre-indiqués chez l'enfant < 12 ans, grossesse, allaitement, occlusion, MICI, douleurs abdominales inexpliquées."}, {"id": "p:ch7:11", "lab": "Nouvelle question au format examen", "q": "Hypéricine et hyperforine (millepertuis) : classe, activité, risques", "r": "**Hypéricine** : **naphtodianthrone** (dimère d'anthrone condensé) ; rouge, fluorescente ; **photosensibilisante** (photodermatoses). **Hyperforine** : phloroglucinol prénylé ; principal responsable de l'effet **antidépresseur** (dépression légère à modérée : inhibe la recapture de plusieurs neuromédiateurs) et surtout **inducteur puissant du CYP3A4 et de la P-gp** (via PXR) → ↓ efficacité de la pilule contraceptive, ciclosporine, anticoagulants, antirétroviraux, digoxine ; syndrome sérotoninergique avec ISRS."}]}, {"id": "ch8_1", "num": "8.1", "t": "8.1. Biosynthèse des terpènes", "court": "Biosynthèse des terpènes", "sym": "leaf", "fam": "ter", "niveaux": [{"t": "Place dans le métabolisme", "s": "Formation de l'« isoprène actif »", "type": "n", "m": ["acide-mevalonique", "ipp", "dmapp"], "q": ["ch8_1-q01", "ch8_1-q02", "ch8_1-q03", "ch8_1-q08", "ch8_1-q10"], "c": ["ch8_1-001", "ch8_1-002", "ch8_1-003", "ch8_1-004", "ch8_1-005", "ch8_1-006", "ch8_1-007", "ch8_1-008", "ch8_1-009", "ch8_1-018", "ch8_1-019", "ch8_1-020"], "pl": []}, {"t": "Couplages tête à queue", "s": "Couplages queue à queue", "type": "n", "m": ["gpp", "fpp", "ggpp"], "q": ["ch8_1-q04", "ch8_1-q05", "ch8_1-q06", "ch8_1-q07", "ch8_1-q09"], "c": ["ch8_1-010", "ch8_1-011", "ch8_1-012", "ch8_1-013", "ch8_1-014", "ch8_1-015", "ch8_1-016", "ch8_1-017"], "pl": []}, {"t": "Questions d'examen", "s": "2 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch8_1:0", "lab": "Question ouverte d'examen", "q": "Expliquez la **biogenèse des terpènes** (voie de l'acide mévalonique) jusqu'aux mono-, sesqui-, di-, tri- et tétraterpènes.", "r": "**Règle isoprénique** : assemblage d'unités ramifiées en **C5**.\nAcétate (3 acétyl-CoA) → HMG-CoA → (**HMG-CoA réductase**, cible des statines) **acide mévalonique** → **IPP** ⇄ **DMAPP**.\nCouplage **tête à queue** : DMAPP + IPP → **GPP C10** (monoterpènes) ; + IPP → **FPP C15** (sesquiterpènes) ; + IPP → **GGPP C20** (diterpènes).\nCouplage **queue à queue** : 2 FPP → **squalène C30** (triterpènes et stéroïdes) ; 2 GGPP → **C40** (caroténoïdes). Exceptions : monoterpènes **irréguliers** (pyréthrines)."}, {"id": "p:ch8_1:1", "lab": "Nouvelle question au format examen", "q": "Biogenèse des terpènes et stéroïdes : IPP, DMAPP, GPP, FPP, GGPP, squalène", "r": "Acétyl-CoA → **acide mévalonique** → **IPP** (isopentényl-PP, C5) ⇌ **DMAPP**. Couplage « tête-queue » : DMAPP + IPP → **GPP** (C10 → monoterpènes) ; + IPP → **FPP** (C15 → sesquiterpènes) ; + IPP → **GGPP** (C20 → diterpènes). Couplage « queue-queue » : 2 FPP → **squalène** (C30) → époxysqualène → triterpènes et stéroïdes (lanostérol, cycloarténol chez les plantes) ; 2 GGPP → phytoène (C40) → caroténoïdes. Règle isoprénique : multiples de C5 (sauf irrégularités : iridoïdes nor-, pyréthrines « irrégulières »)."}]}, {"id": "ch8_2", "num": "8.2", "t": "8.2. Huiles essentielles", "court": "Huiles essentielles", "sym": "leaf", "fam": "ter", "niveaux": [{"t": "Définition et perception des odeurs", "s": "Localisation et répartition botanique · Propriétés physico-chimiques · Modes d'obtention · Origine biogénétique et classification des terpènes", "type": "n", "m": ["chamazulene"], "q": ["ch8_2-q01", "ch8_2-q02", "ch8_2-q03", "ch8_2-q18", "ch8_2-q20", "ch8_2-q24", "ch8_2-q26"], "c": ["ch8_2-001", "ch8_2-002", "ch8_2-003", "ch8_2-004", "ch8_2-005", "ch8_2-006", "ch8_2-007", "ch8_2-008", "ch8_2-009", "ch8_2-010", "ch8_2-011", "ch8_2-012", "ch8_2-014", "ch8_2-035", "ch8_2-049", "ch8_2-055", "ch8_2-078", "ch8_2-079"], "pl": []}, {"t": "Hydrocarbures monoterpéniques", "s": "Monoterpènes oxygénés acycliques · Monoterpènes oxygénés cycliques et aromatiques", "type": "n", "m": ["citronellol", "citronellal", "citral", "geraniol", "linalol", "acetate-de-linalyle", "limonene", "alpha-pinene", "menthol", "menthone", "carvone", "terpinene-4-ol", "thymol", "carvacrol", "cineole", "camphre"], "q": ["ch8_2-q04", "ch8_2-q05", "ch8_2-q06", "ch8_2-q07", "ch8_2-q08", "ch8_2-q09", "ch8_2-q10", "ch8_2-q11", "ch8_2-q12", "ch8_2-q13", "ch8_2-q14", "ch8_2-q15", "ch8_2-q25"], "c": ["ch8_2-015", "ch8_2-016", "ch8_2-018", "ch8_2-019", "ch8_2-020", "ch8_2-021", "ch8_2-022", "ch8_2-023", "ch8_2-024", "ch8_2-025", "ch8_2-026", "ch8_2-027", "ch8_2-028", "ch8_2-029", "ch8_2-030", "ch8_2-031", "ch8_2-032", "ch8_2-033", "ch8_2-034", "ch8_2-036", "ch8_2-038", "ch8_2-039", "ch8_2-040", "ch8_2-063", "ch8_2-080", "ch8_2-081"], "pl": ["menthe-poivree", "lavande", "eucalyptus", "romarin", "citron", "bergamotier", "oranger-amer", "pin-sylvestre", "pin-maritime", "citronnelle", "melisse"]}, {"t": "Monoterpènes bicycliques cétoniques", "s": "Sesquiterpènes des HE · HE à composés aromatiques · Variabilité et chémotypes", "type": "n", "m": ["thuyone", "fenchone", "pinocamphone", "bisabolol", "farnesol", "nerolidol"], "q": ["ch8_2-q16", "ch8_2-q17", "ch8_2-q21", "ch8_2-q27", "vf50-8"], "c": ["ch8_2-013", "ch8_2-017", "ch8_2-037", "ch8_2-041", "ch8_2-042", "ch8_2-043", "ch8_2-044", "ch8_2-045", "ch8_2-046", "ch8_2-047", "ch8_2-048", "ch8_2-050", "ch8_2-051", "ch8_2-052", "ch8_2-053", "ch8_2-054", "ch8_2-056", "ch8_2-057", "ch8_2-058", "ch8_2-059", "ch8_2-069"], "pl": ["thym", "sauge-officinale", "matricaire"]}, {"t": "Intérêt pharmaceutique et activités", "s": "Toxicité · Hétérosides de substances volatiles", "type": "n", "m": [], "q": ["ch8_2-q19", "ch8_2-q22", "ch8_2-q23"], "c": ["ch8_2-060", "ch8_2-061", "ch8_2-062", "ch8_2-064", "ch8_2-065", "ch8_2-066", "ch8_2-067", "ch8_2-068", "ch8_2-070", "ch8_2-071", "ch8_2-072", "ch8_2-073", "ch8_2-074", "ch8_2-075", "ch8_2-076", "ch8_2-077"], "pl": []}, {"t": "Questions d'examen", "s": "10 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch8_2:0", "lab": "Liste du prof", "q": "Chapitre 8-2 : faut-il connaître la posologie de chaque HE et le pourcentage des composés principaux (dias 24, 26, 28, 29, 40) ?", "r": "Non : ni la posologie de chaque HE, ni le pourcentage des composés principaux, ni les pourcentages exacts de la dia 40. Les noms des composés suffisent."}, {"id": "p:ch8_2:1", "lab": "Liste du prof", "q": "Chapitre 8-2 : quelle différence entre « chimiotype » et « chémotype » ?", "r": "Ce sont deux termes interchangeables. Ils désignent des individus d'une même espèce qui diffèrent par la présence ou l'absence d'une ou plusieurs substances chimiques."}, {"id": "p:ch8_2:2", "lab": "Liste du prof", "q": "Les noms de spécialités doivent-ils être retenus ?", "r": "Non, dans le cadre de cette UE les noms commerciaux ne sont pas à retenir."}, {"id": "p:ch8_2:3", "lab": "Question ouverte d'examen", "q": "Expliquez les notions de **chimiotype (chémotype)** et donnez les principales **toxicités** des huiles essentielles.", "r": "**Chémotype = chimiotype** (termes interchangeables) : individus d'une même espèce qui diffèrent par la présence ou l'absence d'une ou plusieurs substances chimiques — ex. thym à thymol, à carvacrol, à linalol, à géraniol, à 1,8-cinéole…\n**Toxicité** : jamais pures sur la peau (irritantes, **sensibilisantes**, allergie de type IV) ; **cétones bicycliques** (thuyone, camphre, pinocamphone) **neurotoxiques / convulsivantes** ; menthol → **spasme de la glotte** chez le jeune enfant ; HE de Citrus obtenues par expression → **furocoumarines photosensibilisantes**."}, {"id": "p:ch8_2:4", "lab": "Tombé à l'examen · Q3 huiles essentielles", "q": "Concerne les **huiles essentielles** : quelles sont les caractéristiques vues au cours permettant de définir une huile essentielle ? Des composés de 2 classes phytochimiques différentes se trouvent dans les HE : pour chacune, choisissez un composé (nom et structure), l'utilisation principale de l'HE qui en contient et une plante.", "r": "**Caractéristiques (déf. Ph. Eur.)** : produit **odorant**, de **composition complexe**, obtenu d'une **matière végétale botaniquement définie** par **entraînement à la vapeur d'eau**, **distillation sèche** ou **procédé mécanique sans chauffage** (Citrus). Liquide, **volatil**, entraînable à la vapeur, **lipophile**, très peu soluble dans l'eau, **moins dense que l'eau**, souvent **instable**.\n**Classe 1 — TERPÈNES** (mono- C10 / sesquiterpènes C15, voie du mévalonate) : ex. **thymol** → HE de **thym** (*Thymus vulgaris*), antiseptique ; ou menthol → menthe poivrée ; ou 1,8-cinéole → eucalyptus.\n**Classe 2 — PHÉNYLPROPANOÏDES** (C6-C3, voie des shikimates) : ex. **eugénol** → **clou de girofle**, antiseptique / anesthésique dentaire ; ou anéthole → anis, badiane, fenouil ; ou aldéhyde cinnamique → cannelle.\nRappel : choisir une structure différente de celles déjà présentes dans l'examen."}, {"id": "p:ch8_2:5", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Menthol** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Monoterpène oxygéné cyclique (HE)\n**Solubilité** : SO\n**Sans chauffage** : NON"}, {"id": "p:ch8_2:6", "lab": "Tombé à l'examen", "q": "Caractéristiques permettant de définir une HE", "r": "**Définition Ph. Eur.** : produit odorant, généralement de composition complexe, obtenu à partir d'une matière première végétale botaniquement définie, soit par **entraînement à la vapeur d'eau**, soit par **distillation sèche**, soit par un **procédé mécanique approprié sans chauffage** (expression des zestes de Citrus).\n**Caractéristiques** : liquides à T° ordinaire · volatiles, odeur aromatique propre (PM < 300) · entraînables à la vapeur d'eau · très peu solubles dans l'eau · lipophiles → solubles dans les solvants organiques apolaires et l'alcool de titre élevé · généralement moins denses que l'eau · parfois très instables (insaturations, aldéhydes → oxydation, polymérisation → résinification) → conserver au frais, à l'abri de l'air et de la lumière.\n**Localisation** : poches sécrétrices (zestes d'agrumes), poils glanduleux (Lamiacées : menthe, thym), canaux sécréteurs (Apiacées : anis vert, fenouil) ; organes variés : sommités fleuries (lavande), boutons floraux (giroflier), feuilles (eucalyptus), fruits (badiane), écorce (cannelle), rhizome (gingembre).\n**Variabilité d'une HE** : chimiotypes · cycle végétatif / période de récolte · organe · facteurs extrinsèques (sol, climat, altitude) · procédé d'extraction et conservation.\n**Usages** : antiseptiques, eupeptiques (digestion), décongestionnants respiratoires, spasmolytiques, sédatifs, anti-inflammatoires, rubéfiants (douleurs musculaires), insectifuges ; parfumerie, agro-alimentaire."}, {"id": "p:ch8_2:7", "lab": "Tombé à l'examen", "q": "Deux classes phytochimiques présentes dans les HE : un composé (nom + structure), plante, usage", "r": "**Classe 1 — Terpènes** (monoterpènes C10, sesquiterpènes C15 ; voie du mévalonate) :\nSous-classe — Composé — Plante — Usage de l'HE\nHydrocarbure monoterpénique — Limonène, α-pinène — Citron (zeste), térébenthine — Parfumerie, aromatisant\nMonoterpène oxygéné acyclique — Citronellal, citronellol, citral, linalol, acétate de linalyle — Citronnelle (*Cymbopogon*), mélisse, lavande — Insectifuge ; lavande : sédatif\nMonoterpène oxygéné cyclique — Menthol, menthone — Menthe poivrée — Digestif, spasmolytique (côlon irritable), rafraîchissant\nMonoterpène phénolique (aromatique) — Thymol — Thym — Antiseptique puissant, spasmolytique\nOxyde bicyclique — 1,8-cinéole (eucalyptol) — Eucalyptus globulus — Décongestionnant respiratoire, expectorant\nCétone bicyclique — Camphre, thuyone — Sauge, thuya, camphrier — Rubéfiant ; thuyone neurotoxique, convulsivante\nSesquiterpènes — α-bisabolol, chamazulène, farnésol — Camomille allemande (matricaire) — Anti-inflammatoire cutané\n**Classe 2 — Dérivés du phénylpropène** (C6-C3, voie des shikimates) :\nComposé — Plante — Usage\n**Eugénol** — Clou de girofle — Anesthésique et antiseptique dentaire\n**Aldéhyde cinnamique** — Cannelle (écorce) — Antiseptique, arôme\n**Anéthole** — Anis vert, badiane, fenouil — Digestif, carminatif ; trouble l'eau (effet « pastis » : précipite car insoluble)\n**Myristicine** — Noix de muscade — Hallucinogène à forte dose (transformée en dérivé amphétaminique)\nDérivés C6-C1 aussi possibles : vanilline, salicylate de méthyle (gaulthérie).\nLa consigne demande souvent une molécule **différente** de celles du tableau Q1."}, {"id": "p:ch8_2:8", "lab": "Nouvelle question au format examen", "q": "Bisabolol, chamazulène, farnésol : classe, origine, usage. D'où vient la couleur bleue de l'HE de camomille allemande ?", "r": "Sesquiterpènes. **α-Bisabolol** : camomille allemande (matricaire), anti-inflammatoire, cicatrisant cutané, cosmétiques apaisants. **Chamazulène** : azulène bleu, **artéfact de distillation** : la **matricine** (lactone sesquiterpénique incolore de la fleur) est transformée à la chaleur de l'entraînement à la vapeur → HE bleue ; anti-inflammatoire. **Farnésol** : alcool sesquiterpénique acyclique (dérivé du FPP), muguet, tilleul ; parfumerie, déodorants (bactériostatique)."}, {"id": "p:ch8_2:9", "lab": "Nouvelle question au format examen", "q": "Comparez cinéole et anéthole ; menthol et thymol ; citral et citronellal", "r": "**Cinéole** : monoterpène, **oxyde** bicyclique (éther), eucalyptus/niaouli, expectorant, non phénolique → NON avec NaOH. **Anéthole** : **phénylpropène** (voie des shikimates), anis/fenouil/badiane, digestif ; éther méthylique de phénol → NON. Communs : constituants majeurs d'HE, volatils, lipophiles. **Menthol** : monoterpène cyclique **saturé**, alcool secondaire (non aromatique) ; **thymol** : monoterpène **aromatique phénolique** → réagit avec NaOH, antiseptique plus puissant. **Citral** (géranial + néral, aldéhyde α,β-insaturé, citronnelle/verveine, odeur citronnée, allergisant) vs **citronellal** (aldéhyde non conjugué, insectifuge) : monoterpènes oxygénés acycliques."}]}, {"id": "ch8_3", "num": "8.3", "t": "8.3. Oléorésines, gommo-résines, gommo-oléorésines", "court": "Oléorésines", "sym": "leaf", "fam": "ter", "niveaux": [{"t": "Oléorésines et Térébenthine et colophane", "s": "Térébenthine, colophane, mastic, encens indien, myrrhe, baumes", "type": "n", "m": [], "q": ["ch8_3-q01", "ch8_3-q04", "ch8_3-q05"], "c": ["ch8_3-001", "ch8_3-002", "ch8_3-003", "ch8_3-006", "ch8_3-007", "ch8_3-008", "ch8_3-009", "ch8_3-010", "ch8_3-022"], "pl": ["pistachier-lentisque"]}, {"t": "Mastic et Gommo-résines", "s": "Térébenthine, colophane, mastic, encens indien, myrrhe, baumes", "type": "n", "m": ["acide-boswellique"], "q": ["ch8_3-q02", "ch8_3-q06", "ch8_3-q07", "ch8_3-q08", "ch8_3-q09"], "c": ["ch8_3-004", "ch8_3-011", "ch8_3-012", "ch8_3-013", "ch8_3-014", "ch8_3-015", "ch8_3-016", "ch8_3-017"], "pl": ["boswellia"]}, {"t": "Gommo-oléorésines", "s": "Baumes de Tolu et du Pérou", "type": "n", "m": [], "q": ["ch8_3-q03", "ch8_3-q10", "ch8_3-q11", "ch8_3-q12", "qcm51-4"], "c": ["ch8_3-005", "ch8_3-018", "ch8_3-019", "ch8_3-020", "ch8_3-021"], "pl": ["myrrhe", "baumes-tolu-perou"]}, {"t": "Questions d'examen", "s": "2 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch8_3:0", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Acide abiétique** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Diterpène (colophane)\n**Solubilité** : SO\n**Sans chauffage** : OUI + NaOH (COOH)"}, {"id": "p:ch8_3:1", "lab": "Nouvelle question au format examen", "q": "Oléorésines, gommes-résines, oléogommes-résines : composition générale. Baumes de Tolu et du Pérou, térébenthine, encens indien", "r": "Résine = mélange solide amorphe (acides résiniques diterpéniques/triterpéniques, alcools, esters) insoluble dans l'eau. **Oléorésine** = HE + résine ; **gomme-résine** = gomme + résine ; **oléogomme-résine** = HE + gomme + résine (myrrhe, encens). Obtenues par **exsudation** (incision) ou extraction. **Térébenthine** : oléorésine de pins (gemmage) → distillation : **essence de térébenthine** (α/β-pinènes ; rubéfiant, solvant) + **colophane** (résidu : acide abiétique ; adhésifs, sparadraps, archets ; allergisant de contact). **Encens indien** (*Boswellia serrata*) : oléogomme-résine, **acides boswelliques** (triterpènes pentacycliques, inhibiteurs de la 5-lipoxygénase) → anti-inflammatoire (arthrose, MICI). Myrrhe (*Commiphora*) : antiseptique buccal, astringent."}]}, {"id": "ch8_4", "num": "8.4", "t": "8.4. Monoterpènes particuliers", "court": "Monoterpènes", "sym": "leaf", "fam": "ter", "niveaux": [{"t": "Iridoïdes et Extraction et propriétés des iridoïdes", "s": "Iridoïdes, sécoiridoïdes et pyréthrines", "type": "n", "m": ["iridodial", "loganoside", "secologanoside", "harpagoside", "gentiopicroside", "oleuropeine", "valtrate"], "q": ["ch8_4-q01", "ch8_4-q02", "ch8_4-q03", "ch8_4-q05", "ch8_4-q06", "ch8_4-q17", "qcm51-2", "qcm51-9"], "c": ["ch8_4-001", "ch8_4-002", "ch8_4-004", "ch8_4-005", "ch8_4-006", "ch8_4-007", "ch8_4-008", "ch8_4-009", "ch8_4-010", "ch8_4-011", "ch8_4-012", "ch8_4-013", "ch8_4-014", "ch8_4-015", "ch8_4-016", "ch8_4-017", "ch8_4-038"], "pl": []}, {"t": "Composés amers et Harpagophyton", "s": "Oléuropéoside · Valépotriates", "type": "n", "m": ["harpagide"], "q": ["ch8_4-q07", "ch8_4-q08", "ch8_4-q09", "ch8_4-q10", "ch8_4-q11", "ch8_4-q12", "ch8_4-q13", "vf50-2"], "c": ["ch8_4-003", "ch8_4-018", "ch8_4-019", "ch8_4-020", "ch8_4-021", "ch8_4-022", "ch8_4-023", "ch8_4-024", "ch8_4-025", "ch8_4-026", "ch8_4-027", "ch8_4-028", "ch8_4-039"], "pl": ["gentiane-jaune", "trefle-d-eau", "harpagophyton", "olivier", "valeriane"]}, {"t": "Pyréthrines", "s": "Iridoïdes, sécoiridoïdes et pyréthrines", "type": "n", "m": ["pyrethrine"], "q": ["ch8_4-q04", "ch8_4-q14", "ch8_4-q15", "ch8_4-q16"], "c": ["ch8_4-029", "ch8_4-030", "ch8_4-031", "ch8_4-032", "ch8_4-033", "ch8_4-034", "ch8_4-035", "ch8_4-036", "ch8_4-037"], "pl": ["pyrethre"]}, {"t": "Questions d'examen", "s": "6 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch8_4:0", "lab": "Question ouverte d'examen", "q": "**Iridoïdes et sécoiridoïdes** : structure de base, exemples et intérêt.", "r": "**Iridoïdes** : monoterpènes à squelette **iridane bicyclique cyclopenta[c]pyranique** ; tête de file **loganoside**. Le plus souvent **glucosides** (OH en C-1 de la génine), la glucosylation **stabilise le cycle pyranique** ; sinon ester (valépotriates).\n**Sécoiridoïdes** : rupture de la liaison **7-8** → seul le noyau pyranique reste ; tête de file **sécologanoside** (précurseur d'alcaloïdes indolomonoterpéniques).\nBiosynthèse : géraniol → iridodial → loganoside → sécologanoside. Composés **instables** (noircissement), extraits par **solvants polaires**.\nPropriétés : **amers / apéritifs** (loganoside, gentiopicroside — gentiane), **anti-inflammatoire** (harpagoside — harpagophyton), antioxydant / hypotenseur (oléuropéine — olivier), **cytotoxiques** (valépotriates — valériane)."}, {"id": "p:ch8_4:1", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Sécologanoside** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Monoterpène particulier\n**Solubilité** : sécoiridoïde (hétéroside)\n**Sans chauffage** : H₂O"}, {"id": "p:ch8_4:2", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Loganoside** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Monoterpène particulier\n**Solubilité** : iridoïde (hétéroside)\n**Sans chauffage** : H₂O"}, {"id": "p:ch8_4:3", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Iridoïdes** ?", "r": "**Iridoïdes** : monoterpènes à squelette cyclopenta\\[c\\]pyrane (souvent hétérosides, amers) ; loganoside, harpagoside, valépotriates."}, {"id": "p:ch8_4:4", "lab": "Nouvelle question au format examen", "q": "Iridoïdes et sécoiridoïdes : structure de base, différence, exemples (loganoside, sécologanoside, valépotriates, harpagoside, gentiopicroside, oleuropéine)", "r": "Monoterpènes particuliers à squelette **iridane** : cyclopentane accolé à un **pyrane** (cyclopenta\\[c\\]pyrane), le plus souvent **glucosylés** en C1 (hétérosides hémiacétaliques, instables, amers). **Sécoiridoïdes** : cyclopentane **ouvert** (rupture C7-C8). Exemples : **loganoside** (trèfle d'eau, apéritif amer) → **sécologanoside** (précurseur, avec la tryptamine, des **alcaloïdes indolomonoterpéniques** via la strictosidine) ; **gentiopicroside** (gentiane : amer, sécrétions gastriques et biliaires) ; **oleuropéine** (feuilles d'olivier : antioxydant, hypotenseur) ; **harpagoside** (racine secondaire d'harpagophyton/griffe du diable : anti-inflammatoire, douleurs articulaires) ; **valépotriates** (valtrate…, valériane : iridoïdes non glycosylés, esters, instables, **cytotoxiques et mutagènes** (alkylants) → doivent être **absents** des extraits de valériane, qui sont sédatifs par d'autres composés)."}, {"id": "p:ch8_4:5", "lab": "Nouvelle question au format examen", "q": "Pyréthrines : classe, source, mode d'action, avantages et limites", "r": "**Monoterpènes irréguliers** (acide chrysanthémique/pyréthrique estérifié par des rethrolones) ; capitules de *Tanacetum cinerariifolium* (pyrèthre de Dalmatie). Insecticides de contact : maintiennent ouverts les **canaux Na⁺** des neurones des insectes → effet « knock-down » ; peu toxiques pour les mammifères (dégradés), toxiques pour poissons et chats ; **photolabiles** → pyréthrinoïdes de synthèse (perméthrine : poux, gale) ; synergiste pipéronyl-butoxyde."}]}, {"id": "ch8_5", "num": "8.5", "t": "8.5. Sesquiterpènes particuliers", "court": "Sesquiterpènes", "sym": "leaf", "fam": "ter", "niveaux": [{"t": "Origine et généralités", "s": "Biogenèse et structure · Extraction, caractérisation, réactivité", "type": "n", "m": ["matricine"], "q": ["ch8_5-q01", "ch8_5-q09", "ch8_5-q10"], "c": ["ch8_5-001", "ch8_5-002", "ch8_5-003", "ch8_5-004", "ch8_5-005", "ch8_5-006", "ch8_5-007", "ch8_5-008", "ch8_5-009", "ch8_5-010", "ch8_5-011", "ch8_5-012"], "pl": []}, {"t": "Allergie de contact et allergies croisées", "s": "Propriétés par type de squelette · Parthénolide — grande camomille", "type": "n", "m": ["parthenolide", "cynaropicrine", "helenaline", "artemisinine", "anisatine"], "q": ["ch8_5-q02", "ch8_5-q04"], "c": ["ch8_5-013", "ch8_5-014", "ch8_5-015", "ch8_5-016", "ch8_5-017", "ch8_5-018", "ch8_5-021"], "pl": ["grande-camomille"]}, {"t": "Cynaropicrine — artichaut", "s": "Matricine — matricaire · Hélénaline — arnica · Alantolactone — aunée", "type": "n", "m": [], "q": ["ch8_5-q03", "ch8_5-q08"], "c": ["ch8_5-019", "ch8_5-020", "ch8_5-022", "ch8_5-023", "ch8_5-024", "ch8_5-025", "ch8_5-026", "ch8_5-027", "ch8_5-028", "ch8_5-029", "ch8_5-038", "ch8_5-040", "ch8_5-041"], "pl": ["arnica", "aunee"]}, {"t": "Artémisinine — armoise annuelle", "s": "Bilobalide, picrotoxinine, anisatine", "type": "n", "m": [], "q": ["ch8_5-q05", "ch8_5-q06", "ch8_5-q07", "qcm51-6"], "c": ["ch8_5-030", "ch8_5-031", "ch8_5-032", "ch8_5-033", "ch8_5-034", "ch8_5-035", "ch8_5-036", "ch8_5-037", "ch8_5-039"], "pl": ["armoise-annuelle", "badianier-japon"]}, {"t": "Questions d'examen", "s": "5 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch8_5:0", "lab": "Liste du prof", "q": "Pourriez-vous réexpliquer le phénomène d'« allergies croisées entre des plantes » (chap. 8-5, dia 10) ?", "r": "Les allergies croisées proviennent de la présence d'un **haptène** (une partie d'un antigène). On crée des anticorps qui reconnaissent ce fragment moléculaire, ici le groupement **α-méthylène-γ-lactone**. Dès lors, les plantes contenant une substance sesquiterpénique portant ce groupement donneront une réponse de type allergique : si on a déjà réagi une première fois à l'haptène, on peut réagir à une autre plante contenant le même fragment."}, {"id": "p:ch8_5:1", "lab": "Question ouverte d'examen", "q": "**Lactones sesquiterpéniques** : structure caractéristique, propriétés physico-chimiques, activités et explication des **allergies croisées** entre plantes.", "r": "Sesquiterpène **C15** (issu du **FPP**) + **lactone** ; le plus souvent **α-méthylène-γ-lactone**, très réactive envers les –SH et –NH2 des protéines (alkylation irréversible). Surtout chez les **Astéracées**.\nLiposolubles (CH2Cl2) ; **fragiles** : ouverture de la lactone en milieu alcalin, refermeture en milieu acide avec modification de la stéréochimie.\nExemples : **parthénolide** (grande camomille, migraines), **hélénaline** (arnica, usage externe), **matricine** → chamazulène, **artémisinine** (endoperoxyde, antimalarique), anisatine (très toxique).\n**Allergies croisées** : l'α-méthylène-γ-lactone se comporte en **haptène** ; après sensibilisation, toute plante contenant ce même fragment déclenche la réaction allergique."}, {"id": "p:ch8_5:2", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Artémisinine** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Sesquiterpène\n**Solubilité** : lactone sesquiterpénique à pont endoperoxyde\n**Sans chauffage** : SO"}, {"id": "p:ch8_5:3", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Cynaropicrine / matricine / hélénaline** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Lactones sesquiterpéniques\n**Solubilité** : SO\n**Sans chauffage** : NON (lactone)"}, {"id": "p:ch8_5:4", "lab": "Nouvelle question au format examen", "q": "Lactones sesquiterpéniques : fonction clé, toxicité commune, exemples (parthénolide, cynaropicrine, matricine, hélénaline, artémisinine, anisatine)", "r": "Fonction **α-méthylène-γ-lactone** : accepteur de Michael → se lie aux **thiols** (SH des protéines) → activités (anti-inflammatoire, cytotoxique) et **allergies de contact** (dermatites des Astéracées, allergies croisées). **Parthénolide** : grande camomille (*Tanacetum parthenium*), prévention de la migraine. **Cynaropicrine** : artichaut (amertume, cholérétique). **Matricine** : camomille allemande → chamazulène. **Hélénaline** : **arnica**, anti-inflammatoire, usage **externe uniquement** (ecchymoses, contusions ; toxique per os : gastro-entérite, cardiotoxicité). **Artémisinine** : *Artemisia annua*, pont **endoperoxyde** indispensable → radicaux toxiques pour *Plasmodium* → antipaludique (dérivés artésunate, artéméther ; combinaisons ACT). **Anisatine** : badiane du Japon (*Illicium anisatum*), **neurotoxique convulsivante** (antagoniste GABA-A) → risque de confusion/falsification avec la badiane de Chine."}]}, {"id": "ch8_6", "num": "8.6", "t": "8.6. Diterpènes", "court": "Diterpènes", "sym": "leaf", "fam": "ter", "niveaux": [{"t": "Biosynthèse et diversité", "s": "Acide abiétique — colophane · Rosmanol — romarin", "type": "n", "m": ["acide-abietique", "rosmanol", "stevioside", "salvinorine-a", "ginkgolides", "taxol"], "q": ["ch8_6-q01", "ch8_6-q06", "ch8_6-q07"], "c": ["ch8_6-001", "ch8_6-002", "ch8_6-003", "ch8_6-004", "ch8_6-005", "ch8_6-006", "ch8_6-007", "ch8_6-008", "ch8_6-029"], "pl": []}, {"t": "Glycosides de stéviol — Stévia", "s": "Salvinorine A — sauge des devins", "type": "n", "m": [], "q": ["ch8_6-q02", "ch8_6-q03", "ch8_6-q09"], "c": ["ch8_6-009", "ch8_6-010", "ch8_6-011", "ch8_6-012", "ch8_6-013", "ch8_6-014", "ch8_6-015", "ch8_6-016", "ch8_6-017", "ch8_6-018", "ch8_6-027", "ch8_6-028"], "pl": ["stevia", "sauge-devins"]}, {"t": "Ginkgolides — Ginkgo biloba", "s": "Taxines et taxol — ifs", "type": "n", "m": [], "q": ["ch8_6-q04", "ch8_6-q05", "ch8_6-q08"], "c": ["ch8_6-019", "ch8_6-020", "ch8_6-021", "ch8_6-022", "ch8_6-023", "ch8_6-024", "ch8_6-025", "ch8_6-026"], "pl": ["ginkgo", "if-pacifique"]}, {"t": "Questions d'examen", "s": "4 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch8_6:0", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Stévioside** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Diterpène (ent-kaurène) hétéroside\n**Solubilité** : H₂O\n**Sans chauffage** : NON (ester glucosylique, osidique)"}, {"id": "p:ch8_6:1", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Rosmanol** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Diterpène phénolique (abiétane)\n**Solubilité** : SO\n**Sans chauffage** : OUI + NaOH (phénols)"}, {"id": "p:ch8_6:2", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Taxol** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Diterpène (taxane)\n**Solubilité** : SO\n**Sans chauffage** : NON"}, {"id": "p:ch8_6:3", "lab": "Nouvelle question au format examen", "q": "Diterpènes : acide abiétique, salvinorine A, stévioside, ginkgolides, rosmanol, taxol", "r": "**Acide abiétique** : acide résinique de la colophane (pins) ; adhésifs ; allergène de contact. **Salvinorine A** : *Salvia divinorum* ; diterpène **non azoté**, agoniste puissant des récepteurs **κ-opioïdes** → hallucinogène dissociatif. **Stévioside** : édulcorant (voir Q9). **Ginkgolides** : lactones diterpéniques (cage, 3 lactones + tert-butyle) des feuilles de *Ginkgo biloba* ; antagonistes du **PAF** ; extraits standardisés (flavonoïdes + terpènes, acides ginkgoliques éliminés car allergisants) : troubles circulatoires, cognitifs ; risque hémorragique. **Rosmanol** : diterpène phénolique (abiétane) du romarin/sauge ; puissant antioxydant (conservateur naturel alimentaire). **Taxol (paclitaxel)** : diterpène (taxane) de l'écorce d'if du Pacifique (*Taxus brevifolia*) ; production par **hémisynthèse** à partir de la 10-désacétylbaccatine III des aiguilles d'if européen (*T. baccata*) ; **stabilise les microtubules** (bloque la dépolymérisation) → anticancéreux (sein, ovaire) ; docétaxel. L'if est très toxique (taxines cardiotoxiques)."}]}, {"id": "ch8_7", "num": "8.7", "t": "8.7. Triterpènes & stéroïdes", "court": "Triterpènes", "sym": "leaf", "fam": "ter", "niveaux": [{"t": "Squalène et Origine des triterpènes et des stéroïdes", "s": "Génines triterpéniques · Génines stéroïdiques", "type": "n", "m": ["squalene", "triterpene-tetracyclique", "triterpene-pentacyclique", "acide-oleanolique", "diosgenine"], "q": ["ch8_7-q01", "ch8_7-q02", "ch8_7-q03", "ch8_7-q04", "ch8_7-q06", "ch8_7-q09", "ch8_7-q10", "ch8_7-q13"], "c": ["ch8_7-001", "ch8_7-002", "ch8_7-003", "ch8_7-004", "ch8_7-005", "ch8_7-006", "ch8_7-007", "ch8_7-008", "ch8_7-009", "ch8_7-010", "ch8_7-011", "ch8_7-012", "ch8_7-013", "ch8_7-014", "ch8_7-015", "ch8_7-016", "ch8_7-017", "ch8_7-018", "ch8_7-019", "ch8_7-020", "ch8_7-021", "ch8_7-022", "ch8_7-023", "ch8_7-065", "ch8_7-067", "ch8_7-068"], "pl": ["bois-de-panama", "igname"]}, {"t": "Saponosides", "s": "Saponosides", "type": "n", "m": [], "q": ["ch8_7-q05"], "c": ["ch8_7-024", "ch8_7-025", "ch8_7-026", "ch8_7-027", "ch8_7-028", "ch8_7-029", "ch8_7-030", "ch8_7-031", "ch8_7-032", "ch8_7-033", "ch8_7-034"], "pl": ["saponaire"]}, {"t": "Réglisse — glycyrrhizine et énoxolone", "s": "Marronnier d'Inde — aescine · Ginseng — ginsénosides · Phytostérols et phytostanols", "type": "n", "m": ["glycyrrhizine", "enoxolone", "aescine", "ginsenoside-rb1", "stigmasterol", "sitosterol"], "q": ["ch8_7-q07", "ch8_7-q08", "ch8_7-q11", "ch8_7-q14", "qcm51-7"], "c": ["ch8_7-035", "ch8_7-036", "ch8_7-037", "ch8_7-038", "ch8_7-039", "ch8_7-040", "ch8_7-041", "ch8_7-042", "ch8_7-043", "ch8_7-044", "ch8_7-045", "ch8_7-046", "ch8_7-047", "ch8_7-048", "ch8_7-049", "ch8_7-050", "ch8_7-051", "ch8_7-052", "ch8_7-053", "ch8_7-054", "ch8_7-055", "ch8_7-056", "ch8_7-064", "ch8_7-066"], "pl": ["ginseng"]}, {"t": "Rappel et Acides et sels biliaires", "s": "Hétérosides cardiotoniques", "type": "n", "m": ["acide-cholique", "acide-ursodesoxycholique"], "q": ["ch8_7-q12"], "c": ["ch8_7-057", "ch8_7-058", "ch8_7-059", "ch8_7-060", "ch8_7-061", "ch8_7-062", "ch8_7-063"], "pl": []}, {"t": "Questions d'examen", "s": "6 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch8_7:0", "lab": "Question ouverte d'examen", "q": "**Saponosides** : définition, types de génines, propriétés et exemples.", "r": "Hétérosides de PM élevé dont la génine (**sapogénine**) est **stéroïdique** (C27, type **spirostane** ; monocotylédones — ex. diosgénine) ou **triterpénique** (C30, souvent pentacyclique oléanane/ursane/lupane ; dicotylédones). Mono- ou bidesmosides.\nPropriétés : **tensioactifs, moussants** (indice de mousse), **hémolytiques**, toxiques pour les animaux à sang froid.\nExemples : **glycyrrhizine** (réglisse, génine énoxolone ; risque de **pseudo-aldostéronisme**), **aescine** (marronnier d'Inde, insuffisance veineuse), **ginsénoside Rb1** (ginseng, dammarane, adaptogène)."}, {"id": "p:ch8_7:1", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Acide boswellique / oléanolique** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Triterpène pentacyclique (génine)\n**Solubilité** : SO\n**Sans chauffage** : OUI + NaOH (COOH)"}, {"id": "p:ch8_7:2", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Ginsénoside Rb1** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Saponoside triterpénique (dammarane, tétracyclique)\n**Solubilité** : H₂O\n**Sans chauffage** : NON"}, {"id": "p:ch8_7:3", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Aescine** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Saponoside triterpénique\n**Solubilité** : H₂O\n**Sans chauffage** : OUI + NaOH (acide glucuronique)"}, {"id": "p:ch8_7:4", "lab": "Nouvelle question au format examen", "q": "Triterpènes et stéroïdes : squalène, tétracycliques vs pentacycliques, acide oléanolique, diosgénine, phytostérols, acides biliaires", "r": "**Squalène** (C30 acyclique) : précurseur, huile d'olive, foie de requin ; émollient, adjuvant vaccinal. **Tétracycliques** : dammarane (ginsénosides), lanostane/cucurbitane, stéroïdes. **Pentacycliques** : oléanane (acide oléanolique, glycyrrhétique, aescine), ursane (acide ursolique, boswelliques), lupane. **Acide oléanolique** : feuilles d'olivier, gui ; hépatoprotecteur, anti-inflammatoire. **Diosgénine** : sapogénine stéroïdique de type **spirostane** (ignames *Dioscorea*, fenugrec) → matière première de l'**hémisynthèse des hormones stéroïdiennes** (progestérone, corticoïdes : dégradation de Marker). **Phytostérols** (β-sitostérol, stigmastérol, campestérol) : ↓ absorption intestinale du cholestérol (margarines enrichies) ; HBP (sitostérol). **Acides biliaires** : stéroïdes en C24 ; **ursodésoxycholique** (bile d'ours) : dissolution des calculs cholestéroliques, cholangite biliaire primitive."}, {"id": "p:ch8_7:5", "lab": "Nouvelle question au format examen", "q": "Saponosides : propriétés communes ; glycyrrhizine/énoxolone, aescine, ginsénoside Rb1", "r": "Hétérosides de triterpènes ou de stéroïdes ; **amphiphiles** → moussent dans l'eau (tensioactifs), **hémolytiques** (complexent le cholestérol membranaire ; toxiques en IV, peu absorbés per os), irritants des muqueuses, toxiques pour les poissons ; expectorants. **Glycyrrhizine** (acide glycyrrhizique) : racine de **réglisse** = acide **glycyrrhétique** (énoxolone, triterpène pentacyclique oléanane) + 2 acides glucuroniques ; ~50× plus sucrante que le saccharose ; expectorant, antiulcéreux, anti-inflammatoire, spasmolytique ; **énoxolone** = génine, anti-inflammatoire cutané/buccal. Toxicité (> 20 g réglisse/j prolongé) : inhibe la 11β-HSD2 → **pseudo-hyperaldostéronisme** : HTA, rétention hydrosodée, œdèmes, **hypokaliémie**. **Aescine** : mélange de saponosides des graines de **marronnier d'Inde** ; veinotonique, anti-œdémateux, anti-exsudatif (jambes lourdes, hémorroïdes, ecchymoses). **Ginsénoside Rb1** : saponoside triterpénique tétracyclique (**dammarane**) de la racine de *Panax ginseng* ; **adaptogène** (fatigue, convalescence) ; interactions (warfarine), insomnie."}]}, {"id": "ch8_8", "num": "8.8", "t": "8.8. Caroténoïdes", "court": "Caroténoïdes", "sym": "leaf", "fam": "ter", "niveaux": [{"t": "Pigments végétaux", "s": "Biogenèse et structure · Caractéristiques et distribution", "type": "n", "m": ["lycopene", "beta-carotene"], "q": ["ch8_8-q01", "ch8_8-q02", "ch8_8-q07", "ch8_8-q08"], "c": ["ch8_8-001", "ch8_8-002", "ch8_8-003", "ch8_8-004", "ch8_8-005", "ch8_8-006", "ch8_8-007", "ch8_8-011"], "pl": []}, {"t": "Fonctions, intérêt et emplois", "s": "β-carotène et lycopène", "type": "n", "m": [], "q": ["ch8_8-q03", "ch8_8-q04", "ch8_8-q05", "ch8_8-q06"], "c": ["ch8_8-008", "ch8_8-009", "ch8_8-010", "ch8_8-012", "ch8_8-013", "ch8_8-014", "ch8_8-015", "ch8_8-016", "ch8_8-017", "ch8_8-018", "ch8_8-019", "ch8_8-020", "ch8_8-030", "ch8_8-031"], "pl": ["tomate", "carotte"]}, {"t": "Rocou et Capsicum", "s": "Safran", "type": "n", "m": ["crocine"], "q": [], "c": ["ch8_8-021", "ch8_8-022", "ch8_8-023", "ch8_8-024", "ch8_8-025", "ch8_8-026", "ch8_8-027", "ch8_8-028", "ch8_8-029", "ch8_8-032"], "pl": ["rocouyer", "poivron-paprika", "safran"]}, {"t": "Questions d'examen", "s": "6 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch8_8:0", "lab": "Question ouverte d'examen", "q": "**Caroténoïdes** : structure, propriétés, différence carotènes / xanthophylles, et intérêt du lycopène et du β-carotène.", "r": "**Tétraterpènes C40** : 2 GGPP couplés **queue à queue**, puis désaturation ; ~**10 doubles liaisons conjuguées** → couleur jaune-orange-rouge et **sensibilité à l'oxydation**.\n**Carotènes** = hydrocarbures (lycopène acyclique, β-carotène bicyclique) ; **xanthophylles** = carotènes **oxygénés** (lutéine, zéaxanthine).\n**Liposolubles**, antioxydants ; apport végétal obligatoire.\n**β-carotène** = **provitamine A** (non toxique en excès) ; **lycopène** (tomate, mieux absorbé cuit et avec des lipides) : antioxydant puissant. **Crocine** (safran) : ester de crocétine **hydrosoluble**."}, {"id": "p:ch8_8:1", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Caroténoïde (β-carotène, lycopène)** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Tétraterpène\n**Solubilité** : SO\n**Sans chauffage** : NON"}, {"id": "p:ch8_8:2", "lab": "Tombé à l'examen", "q": "Colorant lipophile (classe, plante, structure, stabilité, utilisation)", "r": "**Caroténoïdes** — tétraterpènes C40, formés par dimérisation **« queue à queue » de 2 GGPP** (8 unités isopréniques), puis désaturations → **11 doubles liaisons conjuguées** (chromophore → jaune, orange, rouge).\n- **Carotènes** = hydrocarbures : **β-carotène** (carotte ; 2 cycles β-ionone ; provitamine A), α-carotène, **lycopène** (tomate ; acyclique, rouge).\n- **Xanthophylles** = carotènes oxygénés (OH, époxydes…) : lutéine (jaune d'œuf, épinard), capsanthine (paprika), zéaxanthine.\n**Propriétés** : liposolubles ; très sensibles à l'oxydation, à la lumière et à la chaleur (diènes conjugués) ; piégeurs de radicaux libres et de l'oxygène singulet.\n**Rôles** : plante → photosynthèse (capte d'autres longueurs d'onde que la chlorophylle), photoprotection, attraction des pollinisateurs et des disperseurs de graines. L'Homme ne les synthétise pas.\n**Utilisations** : colorants naturels non toxiques (pharmacie, cosmétique, agro-alimentaire : formes galéniques, jaune d'œuf, chair de saumon, charcuterie, confiserie) ; antioxydants (affections dégénératives ; lycopène et cancer de la prostate, maladies cardiovasculaires) ; β-carotène = provitamine A ; « pilules à bronzer » (coloration, mais **aucune protection UV**) ; protection en cas de photosensibilisation. Prudence : β-carotène à forte dose chez les fumeurs (↑ cancer du poumon dans les essais d'intervention). Herbicides bloquant leur synthèse en agriculture.\nCas particulier : **crocine** (safran) = apocaroténoïde glycosylé → **hydrosoluble**."}, {"id": "p:ch8_8:3", "lab": "Tombé à l'examen", "q": "Lycopène vs carotènes ; stévioside ; oligo- vs polysaccharides", "r": "**Lycopène vs β-carotène** : tous deux carotènes (tétraterpènes, hydrocarbures, 11 doubles liaisons conjuguées), liposolubles, antioxydants. Lycopène : **acyclique**, rouge, tomate, pas de provitamine A, protecteur (prostate, cardiovasculaire). β-carotène : **2 cycles β-ionone** aux extrémités, orange, carotte, **provitamine A**.\n**Stévioside** : diterpène (ent-kaurène) **hétéroside** (stéviol + 3 glucoses), feuilles de *Stevia rebaudiana* ; ~300× plus sucrant que le saccharose, non calorique, non cariogène → édulcorant (avec le rébaudioside A).\n**Oligo vs poly** : communs = oses liés par des liaisons osidiques (C, H, O). Oligosaccharides : 2-10 oses (3-10 au sens strict), solubles dans l'eau et l'alcool dilué, souvent goût sucré ; certains font partie d'hétérosides (rutinose). Polysaccharides : > 10 oses, haut PM, souvent insolubles ou forment des gels/colloïdes ; homogènes (1 seul ose : amidon, cellulose, inuline, dextrane, chitine) ou hétérogènes (plusieurs : gommes, pectines, alginates, agar, xanthane, GAG)."}, {"id": "p:ch8_8:4", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Capsicum** ?", "r": "**Capsicum** : piments, paprika ; capsaïcinoïdes (piquant, analgésique local) + caroténoïdes (capsanthine) ; oléorésine obtenue par **extraction**."}, {"id": "p:ch8_8:5", "lab": "Nouvelle question au format examen", "q": "Caroténoïdes apparentés : crocine. Pourquoi est-elle hydrosoluble ?", "r": "**Crocine** = **digentiobioside de crocétine** (apocaroténoïde C20 issu de la coupure oxydative de la zéaxanthine) ; stigmates de **safran** (*Crocus sativus*) ; hydrosoluble grâce aux **2 gentiobioses** (sucres) aux extrémités → colorant jaune des préparations aqueuses (riz, paella) ; l'arôme vient du safranal (dérivé de la picrocrocine). Épice la plus chère → nombreuses falsifications."}]}, {"id": "ch9", "num": "9", "t": "9. Vitamines liposolubles", "court": "Vitamines", "sym": "pill", "fam": "vit", "niveaux": [{"t": "Généralités et Vitamine A", "s": "Vitamines A, D, E, K", "type": "n", "m": ["retinol"], "q": ["ch9-q01", "ch9-q02", "ch9-q03", "ch9-q04"], "c": ["ch9-001", "ch9-002", "ch9-003", "ch9-004", "ch9-005", "ch9-006", "ch9-007", "ch9-008", "ch9-009", "ch9-010", "ch9-011", "ch9-012", "ch9-013"], "pl": []}, {"t": "Vitamine D et Vitamine E", "s": "Vitamines A, D, E, K", "type": "n", "m": ["cholecalciferol", "ergocalciferol", "7-dehydrocholesterol", "calcitriol", "alpha-tocopherol"], "q": ["ch9-q05", "ch9-q06", "ch9-q07", "ch9-q08", "ch9-q09"], "c": ["ch9-014", "ch9-015", "ch9-016", "ch9-017", "ch9-018", "ch9-019", "ch9-020", "ch9-021", "ch9-022", "ch9-023", "ch9-024", "ch9-025", "ch9-026", "ch9-027", "ch9-028"], "pl": []}, {"t": "Vitamine K", "s": "Vitamines A, D, E, K", "type": "n", "m": [], "q": ["ch9-q10", "ch9-q11", "ch9-q12"], "c": ["ch9-029", "ch9-030", "ch9-031", "ch9-032", "ch9-033", "ch9-034", "ch9-035"], "pl": []}, {"t": "Questions d'examen", "s": "3 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch9:0", "lab": "Liste du prof", "q": "Dia 20 : pourquoi les carences en vitamine E sont-elles liées à une alimentation riche en PUVA (AGPI) alors qu'on trouve 10 mg de vitamine E par g d'AGPI ?", "r": "La vitamine E est fortement utilisée pour prévenir l'oxydation des AGPI apportés par la nourriture, ce qui provoque une carence par consommation de la vitamine E. Il ne s'agit donc pas d'une carence d'apport mais d'une carence de consommation."}, {"id": "p:ch9:1", "lab": "Question ouverte d'examen", "q": "**Vitamines liposolubles A, D, E, K** : classe chimique, origine, rôle et une particularité de chacune.", "r": "**A** = rétinol (C20) ; provitamine **β-carotène** (caroténoïdes végétaux) ; vision, épithéliums ; **excès tératogène**. Sources animales (huile de foie de morue).\n**D** = **sécostéroïdes** : D3 cholécalciférol (peau, UV, 7-déhydrocholestérol), D2 ergocalciférol ; activation foie (25-OH) puis rein (1-OH) ; os, Ca/P.\n**E** = **tocophérols** (noyau chromanol) ; **antioxydant** des AGPI ; carence **de consommation** si alimentation très riche en AGPI. Huiles végétales.\n**K** = **naphtoquinones** : K1 phytoménadione (végétale), K2 ménaquinones (bactériennes) ; **coagulation** ; antidote des anticoagulants coumariniques."}, {"id": "p:ch9:2", "lab": "Nouvelle question au format examen", "q": "Vitamines liposolubles A, D, E, K : origine, classe, rôle, toxicité", "r": "**A** (rétinol) : diterpénoïde ; provitamine = β-carotène (végétaux) ; vision (rhodopsine), épithéliums, immunité ; toxicité : hypervitaminose (hépatique, HTIC), **tératogène** (rétinoïdes). **D** (D2 ergocalciférol des champignons/levures, D3 cholécalciférol de la peau sous UVB, huile de foie de morue) : sécostéroïde ; hydroxylée foie (25) puis rein (1α) → calcitriol : absorption Ca/P, os ; toxicité : hypercalcémie. **E** (tocophérols, tocotriénols) : chromanol + chaîne ; huiles végétales (germe de blé, tournesol) ; antioxydant (additif E306-309) ; carence de consommation avec AGPI. **K** : voir N30. Toutes : absorbées avec les graisses (bile), stockées → risque de surdosage pour A et D."}]}, {"id": "ch10", "num": "10", "t": "10. Dérivés directs d'acides aminés", "court": "Dérivés d'acides aminés", "sym": "link", "fam": "aa", "niveaux": [{"t": "Hétérosides cyanogènes", "s": "Types de structure et transformations · Amygdaloside — amandes amères · Prunasoside — laurier-cerise", "type": "n", "m": ["amygdaloside", "prunasoside", "linamaroside"], "q": ["ch10-q01", "ch10-q03", "ch10-q04"], "c": ["ch10-001", "ch10-002", "ch10-003", "ch10-004", "ch10-006", "ch10-007", "ch10-008", "ch10-009", "ch10-010", "ch10-011", "ch10-012", "ch10-013", "ch10-014", "ch10-015", "ch10-016", "ch10-052"], "pl": ["amandier-amer", "laurier-cerise", "sorgho"]}, {"t": "Linamaroside — lin et manioc", "s": "Glucosinolates · Glucosinolates", "type": "n", "m": ["glucosinolate-type", "isothiocyanate", "sulforaphane"], "q": ["ch10-q02", "ch10-q05", "ch10-q06", "ch10-q07", "vf50-10"], "c": ["ch10-005", "ch10-017", "ch10-018", "ch10-019", "ch10-020", "ch10-021", "ch10-022", "ch10-023", "ch10-024", "ch10-025", "ch10-026", "ch10-027", "ch10-028", "ch10-029", "ch10-030", "ch10-031", "ch10-032", "ch10-053", "ch10-056"], "pl": ["manioc", "moutarde-noire", "moutarde-blanche", "capucine", "brocoli", "raifort"]}, {"t": "Ail et Oignon", "s": "Hétérosides cyanogènes, glucosinolates, sulfoxydes de cystéine, substances piqua", "type": "n", "m": ["alliine", "allicine"], "q": ["ch10-q08", "ch10-q09", "ch10-q10"], "c": ["ch10-033", "ch10-034", "ch10-035", "ch10-036", "ch10-037", "ch10-038", "ch10-039", "ch10-040", "ch10-041", "ch10-057"], "pl": ["ail", "oignon"]}, {"t": "Substances piquantes", "s": "Substances piquantes", "type": "n", "m": ["capsaicine", "piperine"], "q": ["ch10-q11", "ch10-q12", "ch10-q13"], "c": ["ch10-042", "ch10-043", "ch10-044", "ch10-045", "ch10-046", "ch10-047", "ch10-048", "ch10-049", "ch10-050", "ch10-051", "ch10-054", "ch10-055"], "pl": ["piment", "poivrier"]}, {"t": "Questions d'examen", "s": "9 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch10:0", "lab": "Question ouverte d'examen", "q": "**Hétérosides cyanogènes et glucosinolates** : structures types, transformation enzymatique et conséquences (toxicité, intérêt).", "r": "**Cyanogènes** = **O-hétérosides d'α-hydroxynitriles** issus d'acides aminés : **amygdaloside**, **prunasoside** (Phe), **linamaroside** (Val). Broyage → **β-glucosidase** → cyanhydrine → **hydroxynitrile-lyase** → **HCN** + carbonyle. HCN bloque la **cytochrome-oxydase** ; détoxication par la rhodanase ; **manioc** : trempage puis cuisson.\n**Glucosinolates** = **S-hétérosides** anioniques (oximes sulfonées, Brassicacées) ; **myrosinase** → **isothiocyanate R–N=C=S** piquant, volatil ; ex. brocoli → **sulforaphane** (protecteur anticancer possible)."}, {"id": "p:ch10:1", "lab": "Question ouverte d'examen", "q": "Donnez le **schéma d'obtention de l'allicine** à partir de l'alliine et expliquez la **différence entre l'ail et l'oignon**.", "r": "**Alliine** (sulfoxyde de S-allyl-L-cystéine) —(**alliinase**, au broyage)→ acide **allylsulfénique** (+ pyruvate + NH3) → **2 molécules se condensent** → **allicine** (thiosulfinate de diallyle : odeur, antimicrobien) → ajoènes (antiagrégants) ou di/trisulfures de diallyle.\n**Oignon** : pas d'alliine mais **sulfoxyde de S-propényl-L-cystéine** → acide **1-propénylsulfénique** → facteur **lacrymogène**."}, {"id": "p:ch10:2", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Glucosinolate (« oxime sulfoné »)** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Dérivés d'acides aminés\n**Solubilité** : hétéroside soufré\n**Sans chauffage** : H₂O (anion sulfaté)"}, {"id": "p:ch10:3", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Capsaïcine** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Amide de vanillylamine (substance piquante)\n**Solubilité** : SO\n**Sans chauffage** : OUI + NaOH (phénol) ; amide NON"}, {"id": "p:ch10:4", "lab": "Tombé à l'examen", "q": "Ail : nom chimique et commun de la molécule, réaction, effets", "r": "**Alliine** = sulfoxyde de S-allyl-L-cystéine (inodore, dans le bulbe frais intact). Au broyage : **alliinase** → acide **allylsulfénique** + acide pyruvique + NH₃ ; 2 acides allylsuléniques se condensent (− H₂O) → **allicine** (thiosulfinate de diallyle, odeur d'ail), instable → ajoène, sulfures de diallyle.\n**Effets** : antimicrobien ; anti-agrégant plaquettaire, prévention de l'athérosclérose et des troubles vasculaires, légèrement hypolipémiant et hypotenseur ; prévention de certains cancers (gastrique). Poudre d'ail standardisée en alliine. Précaution : risque hémorragique avec anticoagulants.\n**Oignon** : contient l'**isoalliine** (S-1-propényl-cystéine sulfoxyde) → facteur **lacrymogène** (propanethial-S-oxyde) au lieu de l'allicine."}, {"id": "p:ch10:5", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Linamaroside** ?", "r": "**Linamaroside** : hétéroside cyanogène (acétone-cyanhydrine + glucose) ; manioc, lin."}, {"id": "p:ch10:6", "lab": "Nouvelle question au format examen", "q": "Hétérosides cyanogènes : amygdaloside, prunasoside, linamaroside — structure, libération du HCN, toxicité", "r": "α-Hydroxynitrile (cyanhydrine) glycosylé, dérivé d'un acide aminé (Phe pour amygdaloside/prunasoside, Val pour linamaroside). Lésion des tissus → **β-glucosidase** → cyanhydrine → (hydroxynitrile lyase) → aldéhyde/cétone + **HCN**. **Amygdaloside** = gentiobiose + mandélonitrile ; **amandes amères**, noyaux d'abricot, pêche → benzaldéhyde (odeur d'amande amère) + HCN. **Prunasoside** = glucose + mandélonitrile ; feuilles de laurier-cerise (eau de laurier-cerise, autrefois sédatif). **Linamaroside** : manioc, lin → acétone + HCN. HCN : inhibe la cytochrome c oxydase (asphyxie cellulaire). Amygdaline (« laetrile ») : prétendu anticancéreux, inefficace et dangereux."}, {"id": "p:ch10:7", "lab": "Nouvelle question au format examen", "q": "Glucosinolates : structure type, transformation en isothiocyanate, exemple du brocoli (sulforaphane), activités, toxicité", "r": "Structure : **β-thioglucose**–S–C(=N–O–SO₃⁻)–**R** (chaîne latérale R dépendant de l'acide aminé précurseur ; oxime en **Z** par rapport au thioglucose). Lésion → **myrosinase** (thioglucosidase) → aglycone instable → à pH neutre, perte du sulfate + réarrangement de Lossen → **isothiocyanate R–N=C=S** (odeur piquante, soufrée) ; à pH acide → nitriles ; certains → thiocyanates. **Brocoli** : glucoraphanine → **sulforaphane** (inducteur des enzymes de détoxification de phase II, glutathion-S-transférase → effet **chimioprotecteur** anticancer). Moutarde noire : sinigrine → isothiocyanate d'allyle (rubéfiant : cataplasmes de farine de moutarde ; lacrymogène, irritant). Capucine : antibactérien. Brassicacées : chou, radis, cresson, navet, colza. Toxicité : glucobrassicine/progoitrine → thiocyanates et goitrine → **goitre** (capte l'iode) chez l'animal surconsommant des choux."}, {"id": "p:ch10:8", "lab": "Nouvelle question au format examen", "q": "Capsaïcine et pipérine : classe, source, mécanisme, usages", "r": "**Capsaïcine** : amide d'un acide gras ramifié et de la **vanillylamine** (partie aromatique phénolique + chaîne aliphatique) ; piments (*Capsicum annuum*, *C. frutescens*) ; agoniste des récepteurs **TRPV1** → brûlure puis désensibilisation des fibres nociceptives → **analgésique local** (douleurs neuropathiques : patch à forte dose ; crèmes antirhumatismales) ; sprays au poivre ; irritante pour les yeux et muqueuses. **Pipérine** : amide de pipéridine (alcaloïde) du **poivre noir** (*Piper nigrum*) ; piquante ; ↑ biodisponibilité d'autres molécules (inhibition de la glucuronoconjugaison, du CYP3A4 et de la P-gp) : associée à la curcumine."}]}, {"id": "ch11", "num": "11", "t": "11. Alcaloïdes (généralités)", "court": "Alcaloïdes", "sym": "target", "fam": "alc", "niveaux": [{"t": "Historique et définition", "s": "Biogenèse et types · Substances azotées qui ne sont pas des alcaloïdes · Répartition et caractères", "type": "n", "m": ["coniine", "gamma-coniceine", "ephedrine", "mescaline", "morphine", "quinine", "hyoscyamine", "acide-aristolochique"], "q": ["ch11-q01", "ch11-q02", "ch11-q03", "ch11-q11", "ch11-q12"], "c": ["ch11-001", "ch11-002", "ch11-003", "ch11-004", "ch11-005", "ch11-006", "ch11-007", "ch11-008", "ch11-009", "ch11-010", "ch11-011", "ch11-012", "ch11-013", "ch11-014", "ch11-015", "ch11-016", "ch11-017", "ch11-018", "ch11-026", "ch11-027", "ch11-039", "ch11-040"], "pl": ["cigue", "quinquina"]}, {"t": "Tertiaires vs quaternaires", "s": "Basicité des alcaloïdes tertiaires · Extraction et isolement", "type": "n", "m": ["indole", "pyrrole", "pyrrolidine", "piperidine", "pyridine", "quinoleine", "isoquinoleine", "codeine", "butylscopolamine"], "q": ["ch11-q04", "ch11-q05", "ch11-q06", "ch11-q07", "ch11-q08", "ch11-q09", "ch11-q13"], "c": ["ch11-019", "ch11-020", "ch11-021", "ch11-022", "ch11-023", "ch11-024", "ch11-025", "ch11-028", "ch11-029", "ch11-030", "ch11-031", "ch11-032", "ch11-033", "ch11-034", "ch11-036"], "pl": []}, {"t": "Caractérisation, identification, dosage", "s": "Propriétés et utilisation", "type": "n", "m": [], "q": ["ch11-q10"], "c": ["ch11-035", "ch11-037", "ch11-038"], "pl": []}, {"t": "Questions d'examen", "s": "7 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch11:0", "lab": "Liste du prof", "q": "Comment reconnaître un alcaloïde sur base de sa structure (molécule azotée non reprise dans la liste dia 9) ?", "r": "Les alcaloïdes sont reconnaissables par la présence d'une composante azotée, de laquelle il faut déduire les acides aminés, la plupart des amines simples, les amino-sucres, les peptides, les alkylamides non cyclisés, les bétalaïnes (colorants) et les dérivés nitrés (NO2)."}, {"id": "p:ch11:1", "lab": "Liste du prof", "q": "Dia 14 : un alcaloïde tertiaire en milieu acide (N à 4 liaisons) devient-il quaternaire ? La règle de solubilité concerne-t-elle les formes non ionisées ?", "r": "L'alcaloïde est surtout délimité par sa capacité à être soluble ou non dans l'eau alcaline : un alcaloïde tertiaire ne le sera pas, tandis qu'un quaternaire le sera. L'engagement d'une liaison avec un hydrogène ne fait pas passer un alcaloïde tertiaire vers quaternaire."}, {"id": "p:ch11:2", "lab": "Liste du prof", "q": "Pourriez-vous réexpliquer l'extraction et l'isolement des alcaloïdes ?", "r": "Cfr explication donnée au cours (voir les schémas d'extraction en milieu alcalin et par l'eau acide)."}, {"id": "p:ch11:3", "lab": "Question ouverte d'examen", "q": "**Alcaloïdes** : définition, ce qui n'en est pas, distinction tertiaire / quaternaire et importance du procédé d'extraction.", "r": "**Définition** : composé organique **azoté**, plus ou moins **basique**, d'origine naturelle, de **distribution restreinte**, à **propriétés pharmacologiques marquées à faible dose** ; réactions communes de précipitation (Bouchardat, Mayer, Dragendorff).\n**Ne sont pas** : acides aminés, la plupart des amines simples, amino-sucres, peptides, alkylamides non cyclisés, bétalaïnes, dérivés nitrés.\n**Tertiaires** : base (milieu alcalin) → solvants organiques ; sel (milieu acide) → eau ; réversible. **Quaternaires** : toujours ionisés → **solubles dans l'eau même alcaline**. Protoner un tertiaire ne le rend pas quaternaire.\n**Extraction** : solvant organique **en milieu alcalin** (tertiaires seulement) ou **eau / alcool acidifié** (sels de tertiaires + quaternaires)."}, {"id": "p:ch11:4", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Quinine / chlorhydrate de quinine** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Alcaloïde quinoléique\n**Solubilité** : Base : SO ; chlorhydrate : H₂O\n**Sans chauffage** : OUI + HCl (N tertiaire) ; le sel libère la base par NaOH"}, {"id": "p:ch11:5", "lab": "Tombé à l'examen", "q": "Définition, classes, tertiaire vs quaternaire, hétérocycles", "r": "**Définition** : composé organique **azoté**, plus ou moins **basique**, d'origine naturelle (surtout végétale), de distribution restreinte, à **propriétés pharmacologiques marquées à faible dose** ; donne des réactions communes de précipitation (Mayer, Dragendorff) ; mono- ou polycyclique.\n**Classes** : **alcaloïdes vrais** (dérivés d'un acide aminé, N dans un hétérocycle) · **pseudo-alcaloïdes** (N hétérocyclique mais pas dérivé d'un acide aminé : alcaloïdes terpéniques/stéroïdiques, caféine) · **proto-alcaloïdes** (amines simples dérivées d'acides aminés, N hors cycle : éphédrine, mescaline).\n**Tertiaire vs quaternaire** : tertiaire = base libre en milieu alcalin → insoluble dans l'eau, soluble dans les solvants organiques ; ses **sels** (milieu acide) sont hydrosolubles. Quaternaire (N⁺R₄) = **toujours ionisé** quel que soit le pH → soluble dans l'eau, insoluble dans les solvants apolaires, même en milieu alcalin.\n**Hétérocycles à reconnaître** : **indole** (benzène + pyrrole ; N non basique, doublet engagé dans l'aromaticité) · **pipéridine** (cycle saturé à 6 avec N ; très basique) · **pyridine** (aromatique à 6 avec N ; faiblement basique) · **quinoléine** (benzène + pyridine ; quinine)."}, {"id": "p:ch11:6", "lab": "Tombé à l'examen", "q": "Méthodes d'extraction + schéma d'extraction d'un alcaloïde tertiaire (pourquoi pas pour un quaternaire ?)", "r": "**3 méthodes** :\n1. Solvant organique **apolaire en milieu alcalin** (alcaloïdes tertiaires sous forme de bases).\n2. Solvant organique **polaire (alcool)** en milieu neutre ou acide (extrait sels + bases).\n3. **Eau acidifiée** (sels hydrosolubles).\n**Schéma pour un tertiaire** :\n1. Drogue pulvérisée + base (NH₄OH, Na₂CO₃, chaux) → libère les bases ; (délipidation préalable à l'éther de pétrole si drogue grasse).\n2. Extraction par solvant organique apolaire (CH₂Cl₂, éther) → bases dans la phase organique.\n3. Épuisement par une **solution aqueuse acide** (H₂SO₄ ou HCl dilué) → alcaloïdes passent en sels dans la phase aqueuse (impuretés neutres restent dans le solvant).\n4. Alcalinisation de la phase aqueuse → bases libres.\n5. Ré-extraction par solvant organique → évaporation → alcaloïdes totaux (purification par chromatographie, cristallisation).\n**Quaternaire** : reste ionisé en milieu alcalin → ne passe jamais dans le solvant apolaire → extraction par eau / alcool puis précipitation (réactif de Mayer, sel de Reinecke) ou résines échangeuses d'ions."}]}], "tri": [{"id": "oses", "lv": 1, "t": "Quel type d'ose ?", "cats": {"Ose classique": ["D-Glucose", "D-Galactose", "D-Mannose", "D-Fructose", "D-Tagatose", "D-Ribose", "D-Xylose"], "Désoxyose": ["L-Rhamnose", "2-Désoxy-D-ribose"], "Acide uronique": ["Acide D-glucuronique", "Acide D-galacturonique"], "Acide aldonique": ["Acide gluconique"], "Polyol": ["Sorbitol", "Mannitol", "Xylitol"], "Ose aminé": ["Glucosamine"]}, "ch": "ch1"}, {"id": "aldcet", "lv": 0, "t": "Aldose ou cétose ?", "cats": {"Aldose": ["Glucose", "Galactose", "Mannose", "Ribose", "Xylose"], "Cétose": ["Fructose", "Tagatose"]}, "ch": "ch1"}, {"id": "cycle", "lv": 0, "t": "Cycle pyranique ou furanique ?", "cats": {"Pyranique (6 atomes)": ["Glucose (glucopyranose)", "Galactose du lactose", "Glucose de l'amidon"], "Furanique (5 atomes)": ["Fructose du saccharose", "Fructose de l'inuline", "Ribose de l'ARN"]}, "ch": "ch1"}, {"id": "reduc", "lv": 2, "t": "Sucre réducteur ou non ?", "cats": {"Réducteur": ["Maltose", "Lact
