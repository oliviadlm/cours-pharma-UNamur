teurs S1P (agoniste puissant, antagoniste fonctionnel au long cours)."},{"id":"14-q-teriflunomide","t":"qcm","q":"Le tériflunomide (AUBAGIO®) est :","c":["Le métabolite actif du léflunomide","Un dérivé du thalidomide","Un ester du fumarate","Un anticorps anti-CD52"],"r":"Le métabolite actif du léflunomide","x":"Le léflunomide est utilisé dans la polyarthrite rhumatoïde."},{"id":"14-q-ac-sep","t":"qcm","q":"Quel anticorps cible le CD52 des lymphocytes ?","c":["Alemtuzumab (LEMTRADA®)","Natalizumab (TYSABRI®)","Ocrélizumab (OCREVUS®)","Basiliximab (SIMULECT®)"],"r":"Alemtuzumab (LEMTRADA®)","x":"Natalizumab : intégrines ; ocrélizumab/ofatumumab : CD20 ; basiliximab : récepteur de l'IL-2."},{"id":"14-q-lenalido-contra","t":"qcm","q":"Pour le lénalidomide, la contraception stricte doit être assurée :","c":["De 4 semaines avant le début jusqu'à 4 semaines après l'arrêt","Seulement pendant le traitement","De 1 semaine avant jusqu'à 1 semaine après","Elle n'est pas nécessaire"],"r":"De 4 semaines avant le début jusqu'à 4 semaines après l'arrêt","x":"Risque tératogène, comme le thalidomide."},{"id":"14-q-imids-rsa","t":"qcm","q":"Quelle différence structurale distingue le lénalidomide du pomalidomide ?","c":["Le lénalidomide a un seul C=O sur l'isoindoline (CH2 à la place de l'autre)","Le lénalidomide n'a pas de NH2","Le pomalidomide n'a pas de glutarimide","Le pomalidomide est un ester"],"r":"Le lénalidomide a un seul C=O sur l'isoindoline (CH2 à la place de l'autre)","x":"Les deux portent un NH2 aromatique ; le thalidomide n'en a pas."},{"id":"14-q-apremilast","t":"qcm","q":"L'aprémilast (OTEZLA®) inhibe :","c":["La phosphodiestérase 4","La calcineurine","mTOR","L'acétylcholinestérase"],"r":"La phosphodiestérase 4","x":"↑ AMPc → ↓ TNF-α, IL-23, IL-17 ; rhumatisme psoriasique, psoriasis, ulcères buccaux de Behçet."},{"id":"14-q-azathioprine-origine","t":"qcm","q":"L'azathioprine (IMURAN®) est un antagoniste des purines dérivé de :","c":["La 6-mercaptopurine","La cladribine","L'acide mycophénolique","La myriocine"],"r":"La 6-mercaptopurine","x":"Structure : purine reliée par un S (thioéther) à un 1-méthyl-4-nitroimidazole."},{"id":"14-q-calcineurine","t":"qcm","q":"Quel couple partage le même mécanisme (inhibition de la calcineurine) ?","c":["Ciclosporine et tacrolimus","Évérolimus et sirolimus","Azathioprine et mycophénolate","Fingolimod et ozanimod"],"r":"Ciclosporine et tacrolimus","x":"La calcineurine stimule la synthèse d'IL-2 ; évérolimus/sirolimus inhibent mTOR."},{"id":"14-q-ciclosporine-origine","t":"qcm","q":"La ciclosporine est un produit de fermentation de :","c":["Tolypocladium inflatum","Streptomyces","Penicillium","Isaria sinclairii"],"r":"Tolypocladium inflatum","x":"Tacrolimus : Streptomyces ; acide mycophénolique : Penicillium ; myriocine (précurseur du fingolimod) : Isaria sinclairii."},{"id":"14-q-protopic","t":"qcm","q":"PROTOPIC® est :","c":["Du tacrolimus en application cutanée (dermite atopique)","Du pimécrolimus","De la ciclosporine orale","De l'évérolimus"],"r":"Du tacrolimus en application cutanée (dermite atopique)","x":"ELIDEL® = pimécrolimus, même indication."},{"id":"14-q-mofetil","t":"qcm","q":"Pourquoi l'acide mycophénolique est-il estérifié en mycophénolate mofétil (CELLCEPT®) ?","c":["Pour augmenter sa biodisponibilité","Pour le rendre injectable","Pour diminuer sa toxicité rénale","Pour le rendre actif sur l'IL-2"],"r":"Pour augmenter sa biodisponibilité","x":"Inhibiteur de l'IMPDH, utilisé dans la prévention des rejets aigus de greffe de rein."},{"id":"14-q-basiliximab","t":"qcm","q":"SIMULECT® (basiliximab) est dirigé contre :","c":["Le récepteur de l'interleukine 2","Le CD20","Les intégrines","mTOR"],"r":"Le récepteur de l'interleukine 2","x":"Prévention du rejet aigu après transplantation rénale de novo (adulte et enfant)."}],"c":[{"id":"01-toxicite-selective","t":"Toxicité sélective","e":"La difficulté de concevoir un antibactérien est que la molécule doit être fatale au pathogène sans être toxique pour les cellules hôtes. Les cibles exploitées sont intéressantes parce qu'elles sont absentes chez l'homme ou suffisamment différentes structurellement et fonctionnellement."},{"id":"01-antibiotique-definition","t":"Antibiotique vs antibactérien de synthèse","e":"Au sens strict, un antibiotique (anti = contre, bios = la vie) est une substance produite naturellement par des champignons ou des bactéries pour se combattre mutuellement ; le terme est réservé à l'action sur les bactéries (on parle d'antifongique pour les champignons, d'antiviral pour les virus). Les antibactériens de synthèse sont conçus sur base de modèles naturels ou non. On trouve des produits naturels, hémisynthétiques et de synthèse totale."},{"id":"01-bactericide-bacteriostatique","t":"Bactéricide vs bactériostatique","e":"Un bactéricide tue les bactéries jusqu'à la dernière (d'où l'intérêt d'un traitement de durée adéquate). Un bactériostatique les empêche de se diviser, ce qui peut suffire chez le patient immunocompétent. La distinction repose sur des analyses in vitro, difficilement transposables en clinique, et la supériorité des bactéricides dans les infections graves n'est pas étayée par des données cliniques."},{"id":"01-antiseptique","t":"Antiseptique","e":"Substance qui tue ou prévient la croissance de bactéries, de champignons et de virus sur les surfaces externes du corps (peau, intestin), de manière non ciblée (parfois même la cellule). Selon qu'il tue ou inhibe, on parle de bactéricide/fongicide/virucide ou de bactériostatique/fongistatique."},{"id":"01-desinfectant","t":"Désinfectant","e":"Agit sur des objets inanimés et des surfaces inertes : matériel médical, sols, murs, conduites d'eau, sièges, poignées de porte, brancards, intérieurs d'ambulance… Résultat : réduction importante de la charge microbienne, sans garantie d'élimination totale."},{"id":"01-sterilisation","t":"Stérilisation","e":"Élimine tout germe microbien d'une préparation (absence de tout germe viable), principalement par des méthodes physiques (traitement thermique) et dans une moindre mesure chimiques (oxyde d'éthylène). Utilisée dans le domaine bio-industriel pour les médicaments et dispositifs médicaux."},{"id":"01-selectivite-cible","t":"Sélectivité de la cible","e":"La sélectivité d'action des antibactériens dépend de la sélectivité de leur cible : d'où l'importance de connaître la structure des bactéries (procaryotes) et ce qui les distingue des cellules humaines."},{"id":"01-procaryote","t":"Bactérie : organisme unicellulaire procaryote","e":"Les bactéries sont des organismes unicellulaires à structure procaryote : pas de noyau ni d'organites, un chromosome unique de forme arrondie (circulaire) et parfois de petites molécules d'ADN circulaires appelées plasmides."},{"id":"01-structure-bacterie","t":"Structure schématique d'une bactérie","e":"Éléments constants : paroi (forme et protection, absente chez les mycoplasmes), membrane plasmique, cytoplasme, appareil nucléaire (ADN circulaire), ribosomes (synthèse des protéines). Éléments facultatifs : plasmides, capsule (virulence), flagelles (mobilité), pili (pilus commun, pilus sexuel)."},{"id":"01-peptidoglycane","t":"Paroi riche en peptidoglycane","e":"La plupart des bactéries (sauf les mycoplasmes) sont entourées d'une paroi solide riche en peptidoglycane, qui leur donne leur forme. Le peptidoglycane est un polymère où la N-acétylglucosamine (NAG) et l'acide N-acétylmuramique (NAM = NAG + acide lactique sur le C3) sont liés en β(1→4) ; des peptides relient les NAM via leur acide lactique."},{"id":"01-classification-oxygene","t":"Classement selon le mode de vie (oxygène)","e":"Aérobies strictes : vivent uniquement en présence d'O2. Aérobies facultatives : en présence ou en absence d'O2. Anaérobies : uniquement en absence d'O2."},{"id":"01-classification-forme","t":"Classement selon la forme","e":"Cocci : bactéries arrondies (ex. streptocoques, angine). Bacilles : bâtonnets allongés (ex. salmonelles). Autres : spirochètes (Treponema pallidum, syphilis), mycoplasmes sans paroi (Mycoplasma pneumoniae, infections respiratoires), bactéries intracellulaires."},{"id":"01-coloration-gram","t":"Coloration de Gram (structure de la paroi)","e":"Méthode la plus utilisée en bactériologie médicale (Hans Christian Gram), qui donne une information rapide. Étapes : coloration au violet de gentiane (cristal violet) ; mordançage au lugol ; décoloration rapide à l'alcool (+ acétone) = temps de différenciation ; recoloration à la safranine ou à la fuchsine. Gram+ = violet, Gram− = rouge/orange."},{"id":"01-gram-positif","t":"Bactéries à Gram positif","e":"Conservent la coloration violette car leur paroi, épaisse, s'oppose au passage de l'alcool. Elles possèdent une couche épaisse de peptidoglycane située au-dessus de leur membrane. Exemples (classification CBIP) : Staphylococcus aureus, streptocoques, pneumocoque, entérocoques (cocci) ; Listeria, Clostridium (bacilles)."},{"id":"01-gram-negatif","t":"Bactéries à Gram négatif et LPS","e":"Se décolorent à l'alcool : leur paroi est plus fine et plus riche en lipides (phospholipides, LPS = lipopolysaccharides), ce qui laisse l'éthanol (lipophile) pénétrer. Elles ont une mince couche de peptidoglycane entourée d'une membrane interne et d'une membrane externe rendue perméable par des porines. Exemples : Neisseria (cocci), E. coli, Klebsiella, Pseudomonas aeruginosa, H. influenzae (bacilles)."},{"id":"01-cibles-therapeutiques","t":"Principales cibles exploitées en thérapeutique","e":"Cinq grandes cibles : synthèse de la paroi bactérienne (β-lactamines, glycopeptides), membrane cellulaire (polymyxines, daptomycine), synthèse des acides nucléiques (fluoroquinolones, rifamycines), ribosomes/synthèse protéique (50S : macrolides, lincosamides, phénicolés… ; 30S : aminosides, tétracyclines) et métabolisme de l'acide folique (sulfamidés, triméthoprime). Cette carte sert de fil conducteur pour relier structure, cible et activité."},{"id":"01-prontosil-prodrug","t":"Historique : PRONTOSIL®, une pro-drug","e":"En 1935, Domagk (prix Nobel 1939) observe que des souris infectées par des streptocoques survivent grâce au sulfamidophényldiamino-diazobenzène (PRONTOSIL®, RUBIAZOL®), un colorant azoïque. Actif in vivo mais pas in vitro, il est métabolisé en 4-aminobenzènesulfonamide (seul actif) et en dérivé triaminobenzénique : le PRONTOSIL® est une pro-drug du sulfanilamide."},{"id":"01-rsa-noyau-aromatique","t":"RSA des sulfamidés : le noyau aromatique","e":"Les substituants SO2NH2 et NH2 doivent impérativement être en para. L'ajout d'un substituant supplémentaire et/ou le remplacement du benzène par un hétérocycle supprime ou réduit drastiquement l'activité."},{"id":"01-rsa-nh2","t":"RSA des sulfamidés : le groupement NH2","e":"Le NH2 doit rester primaire. Un NH2 porteur d'un groupement labile éliminé lors de la métabolisation reste envisageable (-N=N-, -NH-CO-R). Quand le NH2 est substitué, le caractère basique est perdu (cas des sulfamidés à usage intestinal)."},{"id":"01-rsa-sulfonamide","t":"RSA des sulfamidés : le groupement sulfonamide","e":"La monosubstitution du sulfamoyle par un hétérocycle aromatique (5-6 chaînons, 1-3 hétéroatomes) augmente généralement l'activité ; un OCH3 sur cet hétérocycle allonge considérablement le T1/2 (jusqu'à une semaine pour la sulfaméthoxydiazine). La disubstitution de l'azote du sulfamoyle inactive généralement la molécule."},{"id":"01-effet-hypoglycemiant","t":"Effet hypoglycémiant des sulfamides","e":"Découvert à Montpellier vers 1942 par Janbon : en traitant la fièvre typhoïde par un sulfamidé (2254 RP, glyprothiazole), il observe des hypoglycémies graves (convulsions, comas, améliorés par le glucose). Confirmé chez le chien, cet effet est à l'origine des sulfamidés hypoglycémiants (Tome III)."},{"id":"01-vitamine-b9","t":"Acide folique = vitamine essentielle (B9)","e":"L'acide folique est constitué d'un cycle ptéridine, d'acide para-aminobenzoïque et de glutamate. Les mammifères synthétisent le cycle ptéridine mais ne savent pas y greffer les deux autres éléments : l'homme doit le trouver dans l'alimentation (feuilles, épinards). Bactéries et plantes le synthétisent."},{"id":"01-microorganismes-synthese-folates","t":"Les micro-organismes doivent synthétiser leurs folates","e":"Les micro-organismes ne peuvent pas résorber l'acide folique : ils doivent le synthétiser à partir de ses fragments (ptéridine + acide p-aminobenzoïque + acide glutamique)."},{"id":"01-reduction-folates-dhfr","t":"Réduction de l'acide folique : DHF puis THF par la dihydrofolate réductase","e":"L'acide folique subit deux réductions (NADPH) : en acide dihydrofolique puis en acide tétrahydrofolique (THF), la forme active. La seconde réduction est réalisée par la dihydrofolate réductase (DHFR), cible du triméthoprime (et du méthotrexate)."},{"id":"01-thf-pyrimidines","t":"THF et synthèse des bases pyrimidiniques (dTMP)","e":"Le THF transfère des groupes monocarbonés. Ses dérivés participent à la conversion dUMP → dTMP, catalysée par la thymidylate synthase, qui fournit la thymidine nécessaire à la synthèse de l'ADN ; réaction particulièrement importante dans les cellules en division rapide (hématopoïèse)."},{"id":"01-thf-purines-acides-amines","t":"THF, bases puriques et acides aminés","e":"Deux des dix étapes de la transformation du 5-PRP en IMP (précurseur de l'AMP, ADP, ATP, GMP, GDP, GTP) nécessitent le tétrahydrofolate. Le THF intervient aussi dans la synthèse de méthionine, histidine et sérine, et le CH3-THF (ou plutôt la S-adénosylméthionine) donne le méthyle des méthylations d'amines biologiques."},{"id":"01-deficit-folates-anemie","t":"Déficit en folates : anémie macrocytaire","e":"Un déficit en folates entraîne surtout une anémie à hématies de taille augmentée (anémie macrocytaire, mégaloblastique) par perturbation de la synthèse de l'ADN, ainsi que des troubles neurologiques peu spécifiques et digestifs. Causes : troubles de la résorption, 2e-3e trimestres de grossesse, traitement chronique (phénytoïne, phénobarbital). Chez la femme enceinte : risque accru d'avortement ou de malformations (tube neural)."},{"id":"01-indications-acide-folique","t":"Indications de l'acide folique (FOLAVIT®)","e":"États de carence (anémie macrocytaire) ; prévention des anomalies congénitales du tube neural (spina bifida) – indispensable si la femme enceinte prend des antiépileptiques, éventuellement systématique à ~0,5 mg/jour ; méthotrexate à faibles doses (polyarthrite rhumatoïde, psoriasis grave) pour diminuer certains effets indésirables ; traitement chronique par phénytoïne ou phénobarbital."},{"id":"01-folates-cible-pharmacologique","t":"Le métabolisme des folates comme cible pharmacologique","e":"L'importance des folates pour la multiplication cellulaire explique leur intérêt comme cible. Chez les bactéries, l'inhibition de la synthèse des folates (sulfamidés) ou de leur réduction (triméthoprime) limite la disponibilité du THF nécessaire à leur croissance et à leur multiplication."},{"id":"01-analogues-paba","t":"Inhibiteurs de la synthèse d'acide folique = analogues du PABA","e":"Les sulfamidés antibactériens, les sulfones (dapsone) et l'acide para-aminosalicylique sont des analogues structuraux de l'acide para-aminobenzoïque (APAB, PABA). Ces faux substrats entrent en compétition avec lui lors de la synthèse de l'acide folique, qu'ils perturbent."},{"id":"01-dihydropteroate-synthetase","t":"Dihydroptéroate synthétase","e":"Enzyme microbienne responsable de l'incorporation de l'acide para-aminobenzoïque pour former l'acide folique nécessaire à la croissance de certaines bactéries. C'est la cible des sulfamidés."},{"id":"01-sulfamides-bacteriostatiques","t":"Les sulfamidés sont bactériostatiques","e":"En inhibant la synthèse de l'acide folique, les sulfamidés empêchent la croissance et la multiplication des micro-organismes : ils sont bactériostatiques mais non bactéricides."},{"id":"01-plasmodium-antipaludique","t":"Plasmodium et antifolates","e":"Le plasmodium (protozoaire parasite) synthétise lui aussi l'acide folique ; inhiber cette synthèse inhibe sa réplication. Les inhibiteurs de la synthèse d'acide folique ont donc des propriétés antibiotiques et antipaludiques."},{"id":"01-dhfr-bacterienne-selectivite","t":"DHFR bactérienne et sélectivité du triméthoprime","e":"Le triméthoprime inhibe de manière préférentielle la dihydrofolate réductase bactérienne, avec une sélectivité bactérie/homme d'environ 40 000 (les deux enzymes sont différentes). Il est parfois utilisé dans les infections urinaires (entérobactéries)."},{"id":"01-association-deux-niveaux","t":"Association triméthoprime + sulfamidé : action à deux niveaux","e":"Le triméthoprime empêche la réduction de l'acide dihydrofolique et le sulfamidé prévient la synthèse de l'acide folique : deux étapes successives de la même voie sont bloquées. C'est le principe du co-trimoxazole (BACTRIM®, EUSAPRIM®), dont le spectre est plus large que celui du sulfamidé seul."},{"id":"01-cotrimoxazole-rares-indications","t":"Co-trimoxazole : de rares indications","e":"Morsures (chat, chien, humain) chez l'enfant allergique à la pénicilline ; infections urinaires compliquées (pyélonéphrite aiguë, prostatite) si CI aux quinolones ; coqueluche si CI à l'azithromycine (diminue la transmission, pas la durée) ; VIH : prophylaxie et traitement de la toxoplasmose et de la pneumonie à Pneumocystis jirovecii ; abcès cutanés non compliqués à MRSA, selon culture et antibiogramme."},{"id":"01-acide-folinique-rescue","t":"Acide folinique et « rescue » du méthotrexate","e":"L'acide folinique et son isomère actif, l'acide lévofolinique, contrecarrent les effets toxiques du méthotrexate à doses élevées (rescue). Ils ne sont administrés que quelques heures après le méthotrexate pour ne pas neutraliser son effet antitumoral."},{"id":"01-amphoteres","t":"Sulfamidés amphotères","e":"Poudres blanches peu solubles dans l'eau, l'alcool et les solvants organiques, assez solubles dans l'acétone. Ils sont amphotères : caractère acide (-SO2NH-R, influencé par R) et basique (-NH2, perdu si le NH2 est substitué). Solubles dans les acides et bases diluées ; sels d'acides minéraux = acides ; sels Na+ = alcalins."},{"id":"01-classification-sulfamides","t":"Classification des sulfamidés selon leur usage","e":"Classés selon leurs caractéristiques pharmacocinétiques, leur application et leur durée d'action : sulfamidés systémiques, urinaires (rapidement résorbés, excrétés par le rein sous forme active : sulfaméthoxazole/triméthoprime), intestinaux (très peu résorbés, éliminés par l'intestin : sulfasalazine) et à usage externe (sulfadiazine argentique)."},{"id":"01-resistance-sulfamides","t":"Résistance à l'effet des sulfamidés","e":"De nombreux sulfamidés systémiques ont été retirés du commerce à cause de l'apparition de résistances, dues à divers mécanismes dont une production accrue d'acide para-aminobenzoïque par certains germes. Le sulfaméthoxazole n'est plus utilisé qu'en association avec le triméthoprime."},{"id":"01-sulfasalazine-vecteur","t":"Sulfasalazine : vecteur (pro-drug) de la mésalazine","e":"La sulfasalazine est hydrolysée dans l'intestin en sulfapyridine (sulfamidé antibactérien) et en mésalazine (5-ASA, anti-inflammatoire). C'est la mésalazine qui est efficace dans la colite ulcéreuse ; la sulfasalazine en empêche la résorption dans la partie haute de l'intestin. On tend aujourd'hui à utiliser la mésalazine seule (formes gastro-résistantes, lavements, suppositoires)."},{"id":"01-argyrisme","t":"Argyrisme","e":"Affection provoquée par une exposition excessive à l'argent (métal ou composés). Symptôme le plus frappant : coloration gris-ardoise de la peau. L'usage prolongé de sulfadiazine argentique peut conduire à un argyrisme local."},{"id":"01-effets-indesirables-cotrimoxazole","t":"Effets indésirables du co-trimoxazole","e":"Perturbation de la flore commensale (diarrhées, levures, champignons) ; allergies (rash, troubles hématologiques, maladie sérique, allergie croisée avec les sulfamidés hypoglycémiants) ; troubles hépatiques et rénaux rares ; DRESS, Stevens-Johnson, Lyell (rares, très graves) ; SDRA (très rare, très grave) ; hémolyse si déficit en G6PD ; troubles hématologiques et hyperkaliémie dus au triméthoprime."},{"id":"01-grossesse-cotrimoxazole","t":"Co-trimoxazole et grossesse","e":"Au premier trimestre, il existe des indices d'un effet tératogène du triméthoprime (interférence avec le métabolisme de l'acide folique) : le co-trimoxazole y est déconseillé. S'il ne peut être évité, une supplémentation en acide folique est recommandée. Les données aux 2e et 3e trimestres sont rassurantes."},{"id":"02-usage-approprie-atb","t":"Usage approprié des antibiotiques","e":"Pour limiter les résistances : dose correcte (suffisamment élevée), durée correcte (la plus courte possible), fréquence correcte, limiter les cures successives chez un même patient et le nombre de traitements dans la population, respecter les conditions d'administration (ex. en lien avec le repas)."},{"id":"02-spectre-activite","t":"Spectre d'activité","e":"Chaque antibiotique possède un spectre d'activité propre : l'ensemble des souches de microorganismes qui lui sont sensibles."},{"id":"02-cmi","t":"CMI (concentration minimale inhibitrice)","e":"Pour une souche donnée, la CMI est la concentration minimale d'antibiotique qui inhibe visuellement la croissance du microorganisme. Elle s'exprime en mg/l."},{"id":"02-souche-resistante","t":"Souche résistante","e":"Une souche bactérienne est résistante à un antibiotique lorsqu'après administration de la dose maximale, la concentration plasmatique ne peut atteindre la CMI du microorganisme. Des souches « sensibles » deviennent résistantes quand la CMI ne suffit plus."},{"id":"02-temps-dependant","t":"Antibiotiques temps-dépendants (β-lactamines)","e":"Pour les pénicillines et céphalosporines, l'efficacité dépend surtout de la durée pendant laquelle la concentration libre reste supérieure à la CMI entre deux prises (%fT > CMI). Elle dépend de la dose, de la demi-vie, mais surtout de l'intervalle entre les prises. À retenir : β-lactamines = maintenir la concentration au-dessus de la CMI suffisamment longtemps."},{"id":"02-concentration-dependant","t":"Antibiotiques concentration-dépendants (aminoglycosides)","e":"L'efficacité augmente avec un pic de concentration élevé par rapport à la CMI (Cmax/CMI). Ils ont un effet post-antibiotique (inhibition persistante sous la CMI) : des doses plus élevées et plus espacées peuvent être privilégiées. À retenir : aminoglycosides = pic élevé / CMI."},{"id":"02-auc-cmi","t":"Exposition globale AUC/CMI (fluoroquinolones)","e":"Pour certains antibiotiques, notamment les fluoroquinolones, c'est l'exposition globale au cours du temps qui détermine l'efficacité : paramètre PK/PD = AUC sur 24 h / CMI."},{"id":"02-sante-publique","t":"Surconsommation d'antibiotiques = problème de santé publique","e":"La surconsommation d'antibiotiques est un réel problème de santé publique dont le pharmacien doit être conscient. En Belgique, l'usage et l'antibiorésistance sont détaillés dans le rapport BELMAP."},{"id":"02-choix-antibiotique","t":"Choix de l'antibiotique : profil d'activité, germe, antibiogramme","e":"Le choix dépend du foyer, du ou des pathogènes et de l'anamnèse médicamenteuse. Entre molécules d'efficacité similaire : spectre aussi étroit que possible, effets indésirables, résistances locales, observance, coût. Il est guidé par le profil d'activité et la nature du germe, et peut être orienté par l'antibiogramme (culture sur gélose avec pastilles d'antibiotiques)."},{"id":"02-tropisme","t":"Tropisme","e":"Certains antibiotiques ont un tropisme marqué pour certains organes. Ex. : pour une infection urinaire, on choisit un antibiotique éliminé sous forme active par voie rénale."},{"id":"02-guide-bapcoc","t":"Guide belge de traitement anti-infectieux (BAPCOC)","e":"Le choix selon le tableau clinique renvoie au « Guide belge de traitement anti-infectieux en pratique ambulatoire » de la BAPCOC, consultable via le CBIP (cbip.be, chapitre 12) ; mise à jour 2026 (mai 2026)."},{"id":"02-beta-lactame-thiazolidine","t":"Cycle β-lactame + cycle thiazolidine","e":"La pénicilline contient un système bicyclique apparemment fort instable : un cycle β-lactame à 4 pièces accolé à un cycle thiazolidine à 5 pièces. Le squelette dérive de deux acides aminés, la cystéine et la valine (dans la figure, partie valine en rouge, partie cystéine en bleu). Structure établie par Dorothy Hodgkin (diffraction des rayons X, 1945)."},{"id":"02-penicilline-amidase","t":"Pénicilline amidase","e":"Enzyme de Penicillium chrysogenum (découverte en 1957) qui scinde la pénicilline G en 6-APA et en acide phénylacétique. Le 6-APA est ensuite acylé (chlorure d'acide ou anhydride) sur le NH2 en 6 : c'est la voie hémi-synthétique vers toutes les pénicillines semi-synthétiques."},{"id":"02-inhibition-paroi","t":"Inhibition de la biosynthèse de la paroi (sans effet sur les mycoplasmes)","e":"Les β-lactames (pénicillines et céphalosporines) empêchent la biosynthèse de la paroi bactérienne en peptidoglycane. Elles sont donc sans effet sur les organismes dépourvus de paroi comme les mycoplasmes."},{"id":"02-peptidoglycane","t":"Peptidoglycane (muréine)","e":"Polymère de N-acétyl-D-glucosamine et d'acide N-acétyl-muramique portant une chaîne peptidique (L-Ala, acide D-glutamique, L-Lys, D-Ala). Chez les Gram −, il est recouvert d'une membrane externe (lipopolysaccharides), absente chez les Gram +."},{"id":"02-dd-transpeptidases","t":"DD-transpeptidases et D-Ala-D-Ala C-terminal","e":"Les DD-transpeptidases assurent le pontage final du peptidoglycane : elles relient le chaînon oligopeptidique du précurseur (terminé par D-Ala-D-Ala) à la L-Lys du peptidoglycane existant, en libérant le D-Ala terminal. Une DD-carboxypeptidase peut hydrolyser le lien D-Ala-D-Ala sans pontage."},{"id":"02-analogie-dala-dala","t":"Analogie structurale pénicilline / D-Ala-D-Ala","e":"Les DD-transpeptidases et DD-carboxypeptidases (enzymes à sérine) confondent les pénicillines avec leur substrat naturel, le précurseur de peptidoglycane, grâce à l'analogie structurale avec le résidu D-Ala-D-Ala terminal. La sérine du site catalytique attaque (attaque nucléophile) le cycle β-lactame."},{"id":"02-bactericides","t":"β-lactames bactéricides","e":"Les pénicillines et les céphalosporines sont toutes deux bactéricides."},{"id":"02-acidoresistance","t":"Acidorésistance — tension cyclique","e":"Certaines pénicillines (pén. G) sont détruites par l'acidité gastrique. Forte tension cyclique : la protonation de l'azote lactamique crée deux centres + voisins, et l'O de l'amide externe attaque le carbone β-lactamique très électrophile → acide pénicillénique. Le proton catalyse la rupture du lien amide intracyclique."},{"id":"02-radical-r-attracteur","t":"Plus le radical R est attracteur, plus la pénicilline est acidorésistante","e":"Plus R est attracteur (plus l'acide R-COOH est fort), plus l'induction sur le CO-NH exocyclique s'oppose à la dégradation du noyau β-lactame, car l'O devient moins nucléophile. Ex. : acide phénoxyacétique (pén. V) plus fort que l'acide phénylacétique (pén. G)."},{"id":"02-beta-lactamases","t":"Sensibilité aux β-lactamases (pénicillinases)","e":"Dans l'espace périplasmique, les β-lactamases hydrolysent la fonction lactame → acide pénicilloïque inactif, dégradé en D-pénicillamine et acide pénaldique, ou décarboxylé en acide pénilloïque. Leur production est la raison majeure des résistances aux pénicillines."},{"id":"02-classification-penicillines","t":"Classification des pénicillines","e":"Selon la résistance aux acides et aux β-lactamases : 1) sensibles aux pénicillinases et acido-sensibles (pén. G) ; 2) sensibles aux pénicillinases et acido-résistantes (pén. V) ; 3) résistantes aux pénicillinases et acido-résistantes (oxacilline, cloxacilline, flucloxacilline) ; 4) à spectre élargi (amino-, carboxy-, uréidopénicillines) ; 5) amidinopénicillines."},{"id":"02-groupements-encombrants","t":"Résistance aux β-lactamases : groupements encombrants + radical acyle électrocaptant","e":"Pour résister à l'hydrolyse enzymatique par les β-lactamases, on protège la fonction lactame par des groupements encombrants, tout en gardant la résistance aux acides grâce à un radical acyle électrocaptant (ex. oxacilline, cloxacilline, flucloxacilline)."},{"id":"02-hydrophilie-spectre","t":"Hydrophilie de la chaîne latérale → élargissement du spectre","e":"L'augmentation de l'hydrophilie de la chaîne latérale élargit le spectre aux Gram − en plus des Gram +. Fonction hydrophile sur le carbone α du benzyle de la pén. G : NH2 → aminopénicillines ; COOR → carboxypénicillines ; NH-CO-NH-R → uréidopénicillines."},{"id":"02-aminopenicillines-sensibles","t":"Les aminopénicillines sont très sensibles aux β-lactamases","e":"Ampicilline et amoxicilline ne sont pas actives sur les staphylocoques producteurs de β-lactamases ni sur certaines souches d'Haemophilus influenzae et d'Escherichia coli."},{"id":"02-acyluréido-parenterale","t":"Pipéracilline : voie parentérale car acido-sensible","e":"La pipéracilline (acyluréidopénicilline) n'est administrable que par voie parentérale car elle est acido-sensible ; elle est toujours associée au tazobactam, inhibiteur de β-lactamases."},{"id":"02-allergie-surestimee","t":"Allergie aux pénicillines : souvent surestimée","e":"Environ 10 % des patients déclarent une allergie à la pénicilline, mais moins de 1 % de la population a une vraie hypersensibilité IgE-médiée ; l'anaphylaxie touche 0,01-0,05 % des exposés. La majorité perd la sensibilisation après ~10 ans. Un test cutané (± oral challenge sous surveillance) permet de confirmer ou d'infirmer."},{"id":"02-allergie-criteres","t":"Quand renoncer aux pénicillines","e":"Seuls les antécédents d'anaphylaxie (< 1 h après la prise) ou d'urticaire, hypotension, arythmie cardiaque, œdème angioneurotique, œdème laryngé et/ou bronchospasme dans les 72 h suivant la prise doivent faire renoncer aux pénicillines."},{"id":"02-cross-reactivite-cephalo","t":"Cross-réactivité pénicillines / céphalosporines","e":"Céphalosporines de 1re génération ou à chaînes latérales similaires : risque jusqu'à ~1-8 % selon les études. 3e-4e générations ou chaînes latérales différentes : risque de réaction IgE immédiate généralement < 1 %."},{"id":"02-gell-coombs","t":"Hypersensibilités (Gell et Coombs)","e":"Type I : immédiate, IgE, dégranulation des mastocytes (anaphylaxie à la pénicilline). Type II : cytotoxique, IgG/IgM + complément (anémie hémolytique médicamenteuse, thrombopénie). Type III : complexes immuns déposés dans les tissus, 3-10 jours (maladie sérique). Type IV : retardée 48-72 h, lymphocytes T + macrophages (dermatite de contact, exanthème au sulfamide)."},{"id":"03-thiazolidine-thiazine","t":"Cycle thiazolidine (pénicillines) vs cycle thiazine (céphalosporines)","e":"Les céphalosporines se distinguent chimiquement des pénicillines par le remplacement du cycle thiazolidine (5 chaînons, S + N) par un cycle thiazine (6 chaînons). Le cycle thiazine est plus résistant que le cycle thiazolidine."},{"id":"03-pharmacomodulation-cephalo","t":"Vaste pharmacomodulation de la céphalosporine C","e":"La céphalosporine C (isolée de Cephalosporium acremonium par G. Brotzu, 1945, Cagliari) a une activité modérée sur Gram + et Gram -. Son profil pharmacologique et sa relative résistance aux pénicillinases ont amené une vaste pharmacomodulation, inspirée en bonne partie des pénicillines, pour améliorer le modèle naturel."},{"id":"03-mecanisme-cephalo","t":"Mécanisme similaire aux pénicillines ; moins sensible aux β-lactamases","e":"Les céphalosporines agissent comme les pénicillines (inhibition de la synthèse du peptidoglycane via les PBP, effet bactéricide). Elles restent sensibles aux β-lactamases (céphalosporinases), mais leur cycle β-lactame est moins sensible à la dégradation par les β-lactamases."},{"id":"03-7-aca-synthese","t":"Acide 7-aminocéphalosporanique (7-ACA), intermédiaire de synthèse","e":"Les céphalosporines hémi-synthétiques se préparent en modulant la chaîne latérale portée par le groupement 7-amino du 7-ACA, obtenu par hydrolyse de la céphalosporine C. Jusqu'en 1962, aucun procédé enzymatique (amidase) ni chimique rentable ne permettait cette hydrolyse."},{"id":"03-classification-spectre","t":"Classification des céphalosporines par spectre d'activité (groupes)","e":"Les céphalosporines sont classées en groupes (générations) définis par leur spectre d'activité : trois groupes principaux (I, II, III), plus un groupe IV (céfépime) et un groupe V (ceftaroline). Globalement, en montant de groupe, l'activité sur les Gram - et la résistance aux céphalosporinases augmentent, tandis que l'activité sur les Gram + diminue (groupes I à III)."},{"id":"03-groupe-i","t":"Groupe I (1re génération)","e":"Actives sur Gram + mais 10x moins puissantes que la pénicilline G ; actives sur quelques Gram - ; sensibles aux céphalosporinases. En Belgique : céfadroxil, céfalexine (p.o.), céfazoline (parentérale). Le chaînon en 7 est le plus souvent comparable à celui des aminopénicillines."},{"id":"03-groupe-ii","t":"Groupe II (2e génération)","e":"Moins actives sur Gram + ; spectre étendu vis-à-vis des Gram - (les Pseudomonas résistent) ; résistance à certaines céphalosporinases. En Belgique : céfuroxime. Par voie i.v., surtout pour les infections nécessitant une hospitalisation et les infections nosocomiales."},{"id":"03-groupe-iii","t":"Groupe III (3e génération)","e":"Nettement moins actives sur les Gram + ; actives contre la majorité des Gram -, y compris les Pseudomonas ; résistance à la plupart des céphalosporinases des Gram -. En Belgique : céfotaxime, ceftazidime, ceftriaxone. Majoritairement actives seulement par voie parentérale."},{"id":"03-groupe-iv","t":"Groupe IV (4e génération) : céfépime","e":"Un seul représentant actuellement, le céfépime, qui se différencie du groupe III par une sensibilité nettement moindre à un certain nombre de β-lactamases. Son spectre s'étend à des Gram + et Gram - résistants à d'autres C3G."},{"id":"03-groupe-v-mrsa","t":"Groupe V : ceftaroline et Staphylococcus aureus méticillino-résistants (MRSA)","e":"Le groupe V (ceftaroline) a un spectre similaire à celui du céfotaxime, mais est actif sur les Staphylococcus aureus méticillino-résistants (MRSA) et sur les S. pneumoniae résistants à la pénicilline. Il est inactif sur la plupart des entérocoques, P. aeruginosa et les bactéries « atypiques » (Legionella pneumophila, Mycoplasma pneumoniae, Chlamydia)."},{"id":"03-biodisponibilite-orale-cephalo","t":"Règle structurale de biodisponibilité orale des céphalosporines","e":"La présence d'un NH2 en α du lien amide, l'estérification du COOH et la présence en 3 d'un -CH3 ou d'un Cl permettent souvent d'améliorer la biodisponibilité orale (p.o.). Exemples : céfadroxil et céfalexine (NH2 en α + CH3 en 3), céfuroxime axétil (COOH estérifié)."},{"id":"03-prodrogue-axetil","t":"Céfuroxime axétil : prodrogue administrable par la voie orale","e":"Le céfuroxime sous forme de sel sodique doit être administré en i.m. ou i.v. L'ester acétoxyéthylique (axétil) du céfuroxime est une prodrogue administrable par la voie orale."},{"id":"03-precurseur-c3g","t":"Le céfuroxime, précurseur des céphalosporines de 3e génération","e":"Le chaînon en position 7 du céfuroxime diffère radicalement de celui de la plupart des céphalosporines des groupes I et II : introduction d'un substituant méthoxyimino en α du C=O amide. Il peut donc être considéré comme le précurseur des céphalosporines de 3e génération."},{"id":"03-c3g-parenterale-hospitalier","t":"C3G : administration parentérale, réservées aux infections graves","e":"Les céphalosporines du groupe III ne sont majoritairement actives qu'après administration parentérale. Elles sont réservées au traitement, le plus souvent en milieu hospitalier, des infections graves résistant aux autres traitements (pneumonie sévère, méningite bactérienne, infection de plaie) et aux infections nosocomiales. En pratique ambulatoire, elles n'ont de place que dans les IST."},{"id":"03-atmo","t":"Radical aminothiazolylméthoxyiminométhyle (ATMO)","e":"Présent systématiquement dans les céphalosporines du groupe III (exception faite du céfotétan), le radical ATMO est sans doute responsable de l'élargissement du spectre d'activité à certaines souches Gram - difficilement traitables."},{"id":"03-meningites-lcr","t":"Méningites bactériennes et C3G","e":"Les concentrations atteintes par le céfotaxime sodique, la ceftazidime et la ceftriaxone dans le liquide céphalo-rachidien permettent de traiter les méningites bactériennes attribuées à Haemophilus influenzae."},{"id":"03-azote-quaternaire-zwitterion","t":"Azote quaternaire et forme zwitterionique (ceftazidime, céfépime)","e":"La ceftazidime est particulièrement soluble dans l'eau grâce à son azote quaternaire (pyridinium). Sa forme zwitterionique (charge + et COO-) favoriserait le passage de la paroi bactérienne. Le céfépime existe aussi sous forme zwitterionique au pH physiologique, ce qui serait favorable au passage de la paroi."},{"id":"03-positionnement-ambulatoire","t":"Positionnement des céphalosporines en pratique ambulatoire","e":"En ambulatoire, les céphalosporines sont rarement prescrites en premier choix. Elles ont une place en cas de résistance documentée à la pénicilline ou aux aminopénicillines, et en cas d'allergie documentée à la pénicilline non IgE-médiée."},{"id":"03-allergie-ige-mediee","t":"Allergie à la pénicilline IgE-médiée vs non IgE-médiée","e":"Allergie non IgE-médiée documentée : les céphalosporines ont une place. Allergie IgE-médiée documentée : les céphalosporines de 1re génération ne sont pas des alternatives ; le céfuroxime (2e génération) et les C3G/C4G peuvent être utilisés à condition de surveiller le patient en milieu hospitalier."},{"id":"03-ei-cephalo","t":"Effets indésirables principaux des céphalosporines","e":"Réactions allergiques (y compris choc anaphylactique) ; environ 10 % des patients allergiques aux pénicillines seront aussi allergiques aux céphalosporines. Troubles hématologiques (entre autres anémie hémolytique, décrite surtout avec la ceftriaxone et le céfotétan) et rarement troubles hépatiques."},{"id":"03-ceftolozane-dernier-recours","t":"Ceftolozane/tazobactam : traitement de dernier recours","e":"Le ceftolozane (associé au tazobactam : ZEBRAXA®) est réservé aux infections intra-abdominales compliquées, pneumonies nosocomiales et infections urinaires compliquées (y compris pyélonéphrites), en cas d'hospitalisation. Pour limiter les résistances, il n'est à envisager qu'en dernier recours, en cas de multirésistance et après antibiogramme."},{"id":"03-carbapenemes","t":"Les carbapénèmes","e":"Noyau carbapénème (acide 7-oxo-1-azabicyclo[3.2.0]hept-2-ène-2-carboxylique) : pas de soufre, double liaison 2-3 comme les céphalosporines, très instable chimiquement. Administrés par voie i.v. ; spectre d'activité très large et grande résistance à la plupart des β-lactamases ; utilisés dans les infections à Gram + et Gram - et contre des germes résistants aux C3G/C4G (Enterobacter, Serratia, Pseudomonas)."},{"id":"03-imipeneme-cilastatine","t":"Imipénème + cilastatine (TIENAM®)","e":"L'imipénème est métabolisé par ouverture du cycle β-lactame durant la phase d'excrétion urinaire, après filtration glomérulaire. La cilastatine inhibe de manière réversible la déhydropeptidase rénale responsable de ce catabolisme. Le méropénème, plus stable, peut être utilisé seul."},{"id":"03-monobactames","t":"Les monobactames : un β-lactame bicyclique n'est pas indispensable","e":"En 1976, une équipe japonaise isole les nocardicines (A à G), lactames monocycliques naturelles à noyau azétidin-2-one, à activité antibiotique faible mais indiscutable. Elles démontrent qu'une structure β-lactamique bicyclique n'est pas un requis structural indispensable à l'activité antibiotique. L'aztréonam est un monobactame de synthèse."},{"id":"03-aztreonam-spectre","t":"Aztréonam : monobactame de synthèse actif uniquement sur les aérobies Gram négatif","e":"L'aztréonam (AZACTAM®, CAYSTON®) est un monobactame de synthèse actif uniquement sur les micro-organismes aérobies Gram négatif. Il est utilisé en inhalation chez les patients atteints de mucoviscidose avec infection chronique à P. aeruginosa. Le risque d'allergie croisée avec les autres β-lactames est faible."},{"id":"03-inhibiteurs-pas-antibiotiques","t":"Les inhibiteurs de β-lactamases ne sont pas des antibiotiques","e":"Les inhibiteurs de β-lactamases (acide clavulanique, sulbactam, tazobactam) ne sont pas des antibiotiques. Ils sont associés à une β-lactamine pour potentialiser son effet et élargir son emploi aux souches devenues résistantes par production de β-lactamases (enzymes qui ouvrent le cycle β-lactame)."},{"id":"03-inhibiteurs-irreversibles","t":"Inhibiteurs IRRÉVERSIBLES des β-lactamases","e":"Le sulbactam sodique et l'acide clavulanique sont des β-lactames dont l'activité antibiotique est très faible mais qui sont de puissants inhibiteurs irréversibles des β-lactamases produites par les germes Gram + et Gram -. Le tazobactam a des propriétés proches."},{"id":"03-pseudomonas-nosocomial","t":"Pseudomonas aeruginosa et infections nosocomiales","e":"Pseudomonas : bacilles Gram négatif, aérobies stricts ; P. aeruginosa est pathogène et fréquemment rencontré dans les infections nosocomiales, surtout chez les sujets fragiles. Une infection nosocomiale (du grec nosos, maladie, et komein, soigner) survient suite à des soins médicaux (hôpital, dentiste, domicile…)."},{"id":"03-tableau-recap-betalactamines","t":"À retenir : β-lactamines (tableau récapitulatif)","e":"Toutes les β-lactamines inhibent la synthèse du peptidoglycane (liaison aux PBP) → effet bactéricide. Le spectre varie selon la molécule (Gram +, Gram -, anaérobies, P. aeruginosa…). De nombreuses β-lactamines sont sensibles aux β-lactamases → intérêt des inhibiteurs. Adapter le choix à l'infection, au germe probable et au contexte (résistances locales)."},{"id":"04-bacteriostatique-phenicoles","t":"Activité bactériostatique (chloramphénicol, thiamphénicol)","e":"Le chloramphénicol et le thiamphénicol ont une activité antibiotique de type bactériostatique à large spectre : ils arrêtent la multiplication bactérienne sans tuer directement les germes. Ils agissent comme inhibiteurs de la traduction."},{"id":"04-ribosomes-procaryotes-eucaryotes","t":"Ribosomes procaryotes (70S = 50S + 30S) vs eucaryotes (80S = 60S + 40S)","e":"Procaryotes : grande sous-unité 50S (ARNr 23S + 5S) et petite sous-unité 30S (ARNr 16S). Eucaryotes : grande sous-unité 60S (ARNr 28S, 5.8S, 5S) et petite 40S (ARNr 18S). Ces différences permettent de concevoir des antibiotiques qui agissent spécifiquement sur les ribosomes procaryotes sans effet chez les eucaryotes."},{"id":"04-cibles-50s-30s","t":"Sous-unité 50S vs sous-unité 30S","e":"Inhibiteurs de la sous-unité 50S : macrolides, chloramphénicol et thiamphénicol, acide fusidique (et lincosamides, p.89). Inhibiteurs de la sous-unité 30S : tétracyclines et aminosides. Tous sont des inhibiteurs de la traduction."},{"id":"04-aplasiant-idiosyncrasique","t":"Toxicité aplasiante et idiosyncrasique du chloramphénicol","e":"Le chloramphénicol est aplasiant (aplasie médullaire) : accidents rares (~0,1 %) mais presque toujours mortels, d'où son retrait per os dans l'UE. C'est un agent idiosyncrasique : toxicité imprévisible, sans rapport entre dose et effet (une seule exposition peut être fatale) ni entre effet et durée d'exposition (aplasie possible longtemps après l'arrêt)."},{"id":"04-agranulocytose","t":"Agranulocytose","e":"État anormal caractérisé par la disparition aiguë et sélective de la lignée des polynucléaires (un type de globules blancs) dans le sang. C'est un des effets médullaires du chloramphénicol et du thiamphénicol."},{"id":"04-thrombocytopenie","t":"Thrombocytopénie (thrombopénie)","e":"Abaissement du nombre de plaquettes sanguines. Effet indésirable des phénicolés (toxicité médullaire) et aussi des tétracyclines."},{"id":"04-tetracyclines-couleur-amphotere","t":"Tétracyclines : couleur jaune et caractère amphotère","e":"Les tétracyclines sont jaunes (elles absorbent dans le visible). Elles sont amphotères : groupement aminé basique en position 4 et fonctions énols (vinylogues d'acide carboxylique) et phénol, acides faibles. Elles se dégradent en milieu alcalin (pH > 8,5) et s'épimérisent en C4 en solution acide (4 < pH < 8) en épitétracycline peu active."},{"id":"04-chelates-agents-complexants","t":"Chélates stables et agents complexants","e":"Les tétracyclines forment des chélates stables et difficilement résorbables avec les cations trivalents (Fe3+) ou divalents (Cu2+, Zn2+, Ca2+). On évite donc de les administrer avec des aliments riches en calcium. Les formes orales sont souvent associées à des agents complexants (métaphosphates) qui complexent les métaux et protègent ainsi les tétracyclines."},{"id":"04-doxycycline-plus-utilisee","t":"La doxycycline est de loin la tétracycline la plus utilisée","e":"Phrase soulignée du cours : parmi les tétracyclines, la doxycycline (VIBRATAB®, DOXYCYCLINE EG®/SANDOZ®) est de loin la plus utilisée (maladie de Lyme, prévention du paludisme, acné)."},{"id":"04-glycylcyclines","t":"Glycylcyclines","e":"Analogues de tétracyclines développés pour contrer les mécanismes de résistance aux tétracyclines (notamment les pompes d'efflux). La tigécycline (TYGACIL®), dérivé de la minocycline, en est le premier représentant : groupement glycylamido encombré en position 9."},{"id":"04-indications-ambulatoires-tetracyclines","t":"Indications ambulatoires des tétracyclines : maladie de Lyme, paludisme, acné","e":"La doxycycline est utilisée dans la maladie de Lyme au stade précoce et pour la prévention du paludisme chez le voyageur (résistance, CI ou intolérance à la méfloquine). Les tétracyclines sont parfois utilisées à faible posologie pendant plusieurs semaines dans certains types d'acné, surtout après échec d'un traitement topique."},{"id":"04-maladie-de-lyme","t":"Maladie de Lyme (borréliose)","e":"Maladie infectieuse due à Borrelia burgdorferi, transmise par les tiques. Une tache rouge s'étendant de façon centrifuge autour de la piqûre peut apparaître entre 3 jours et 1 mois après ; une phase secondaire (atteintes articulaires, cutanées, cardiaques, neurologiques, fatigue) peut survenir des semaines à des années plus tard."},{"id":"04-tetracyclines-grossesse-enfant","t":"Tétracyclines : enfant < 8 ans, fin de grossesse, allaitement","e":"Grande affinité pour le tissu osseux : chez l'enfant de moins de 8 ans, dyschromies dentaires et hypoplasies de l'émail. Contre-indiquées chez la femme enceinte en fin de grossesse et chez la femme qui allaite (anomalies dentaires chez l'enfant)."},{"id":"04-macrolides-generalites","t":"Macrolides : définition structurale","e":"Macrocycle lactonique polyhydroxylé de 14, 15 ou 16 atomes, substitué (sauf kétolides) par un aminoose (liaison osidique acétal) et un ose. Actifs sur les Gram + (très peu sur les Gram −), spectre analogue à la pénicilline G, actifs per os et peu toxiques. Fixation à la sous-unité 50S."},{"id":"04-neomacrolides","t":"Néomacrolides","e":"Dérivés de l'érythromycine (roxithromycine, clarithromycine, azithromycine) : mieux absorbés per os, demi-vie plus longue (administration moins fréquente), spectre similaire et moins d'effets indésirables gastro-intestinaux. Ils remplacent de plus en plus l'érythromycine par voie orale."},{"id":"04-helicobacter-ulcere","t":"Ulcère gastrique et Helicobacter pylori","e":"Pour l'ulcère gastrique avec présence établie d'Helicobacter pylori, on préconise l'association de deux antibiotiques à fortes doses (amoxicilline + clarithromycine) et d'oméprazole (inhibiteur de la pompe à protons)."},{"id":"04-toxoplasmose-spiramycine","t":"Spiramycine et toxoplasmose pendant la grossesse","e":"La spiramycine (ROVAMYCINE®), macrolide à 16 atomes, peut être utile dans le traitement de la toxoplasmose pendant la grossesse."},{"id":"04-ketolides","t":"Kétolides (télithromycine)","e":"Chimiquement apparentés aux macrolides : une fonction cétone remplace un sucre (le cladinose, cétone en C3) de l'érythromycine. La télithromycine possède le plus d'effets indésirables graves (hépatotoxicité, aggravation de myasthénie, troubles de l'accommodation, allongement du QT)."},{"id":"04-fidaxomicine-clostridium","t":"Clostridium difficile : fidaxomicine, métronidazole, vancomycine","e":"La fidaxomicine (DIFICLIR®), lactone macrocyclique de 18 atomes, est bactéricide et inhibe l'ARN polymérase bactérienne (site distinct des rifamycines). Administrée per os, peu absorbée, elle agit localement dans le tube digestif contre C. difficile. Les autres antibiotiques de cette indication sont le métronidazole et la vancomycine."},{"id":"04-macrolides-allergie-penicilline","t":"Macrolides chez les patients allergiques à la pénicilline","e":"Les macrolides peuvent avoir une place chez des patients allergiques à la pénicilline si un antibiotique s'avère nécessaire dans une affection telle l'angine à streptocoques. Ils ne sont pas de premier choix pour le traitement empirique des infections à pneumocoques et à H. influenzae (souvent résistants)."},{"id":"04-macrolides-qt-hepatite-ototox","t":"Effets indésirables des macrolides : hépatite, ototoxicité, QT","e":"Érythromycine et la majorité des macrolides : malaises gastriques, altérations hépatiques réversibles voire hépatite cholestatique, ototoxicité à doses élevées, effets centraux, allongement de l'intervalle QT avec risque de torsades de pointes, surtout en cas d'injection i.v. trop rapide d'érythromycine."},{"id":"04-macrolides-cyp3a4","t":"Nombreux risques d'interactions médicamenteuses (CYP3A4)","e":"L'érythromycine inhibe le CYP3A4 et ralentit le métabolisme hépatique de ses substrats : théophylline, carbamazépine, ciclosporine, cisapride, disopyramide, ergotamine et autres dérivés de l'ergot. Avec l'ergotamine : vasoconstriction et gangrène."},{"id":"04-aminosides-definition","t":"Amino(glyco)sides : définition et toxicité","e":"Polyols cycliques (cyclitols) dont deux OH sont remplacés par une amine ou une guanidine. Mal résorbés (voie parentérale ou locale), généralement oto- et néphrotoxiques, avec une dose toxique proche de la dose thérapeutique. Actifs sur les Gram − et quelques Gram + pénicillo-résistants ; réservés aux infections sévères à Gram −."},{"id":"04-aminosides-marge-etroite","t":"La marge thérapeutique-toxique est étroite","e":"Phrase rouge du cours : chez les aminosides, la marge entre dose thérapeutique et dose toxique est étroite. Ototoxicité et néphrotoxicité peuvent apparaître, parfois très tardivement ; ils doivent être évités pendant la grossesse. C'est aussi pourquoi gentamicine et tobramycine sont utilisées en usage externe ophtalmique."},{"id":"04-aminosides-distribution","t":"Distribution extracellulaire : toxicité rénale et cochléaire","e":"La distribution des aminosides est essentiellement extracellulaire : de fortes concentrations sont trouvées dans le rein, l'endolymphe et la périlymphe de l'oreille interne, ce qui explique leur toxicité rénale et cochléaire. Concentration dans le LCR < 10 % de celle du plasma ; élimination urinaire, accumulation en insuffisance rénale ; posologie selon la masse maigre."},{"id":"04-vaccins-traces-antibiotiques","t":"Traces d'antibiotiques dans les vaccins","e":"De nombreux vaccins contiennent des traces d'antibiotiques : gentamicine, néomycine, polymyxine B ou streptomycine."},{"id":"04-aminosides-mal-resorbes","t":"Néomycine et paromomycine : très mal résorbées, antiseptique intestinal","e":"Néomycine et paromomycine (deux aminoglucosides + un sucre + un aminohydroxycyclohexane) sont très mal résorbées et trop toxiques par voie parentérale ; seul le sulfate de paromomycine est encore utilisé comme antiseptique intestinal (GABBRORAL®). La néomycine se retrouve en usage otique et ophtalmique en association."},{"id":"04-aminosides-grossesse","t":"Aminosides à éviter pendant la grossesse","e":"En raison de leurs effets toxiques (néphrotoxicité et ototoxicité), les amino(glyco)sides doivent être évités pendant la grossesse."},{"id":"04-aminosides-positionnement","t":"Positionnement des aminosides","e":"Actifs sur les Gram − aérobies, les staphylocoques et certaines mycobactéries, pas sur la plupart des Gram + ni les anaérobies. Plus utilisés qu'exceptionnellement en monothérapie : associés à une pénicilline ou une céphalosporine (infections graves à entérobactéries, Pseudomonas aeruginosa, certaines endocardites à streptocoques/entérocoques)."},{"id":"04-streptomycine-apparentes","t":"Drogues chimiquement apparentées à la streptomycine","e":"Kanamycine, gentamicine, amikacine, dibékacine, tobramycine et netilmicine sont chimiquement apparentées à la streptomycine et ont des indications similaires : deux aminoglucosides reliés par un aminohydroxycyclohexane."},{"id":"04-lincosamides-50s","t":"Lincosamides : ribosome 50S et acné","e":"Les lincosamides (lincomycine, clindamycine) ont une activité très proche des macrolides : ils inhibent la synthèse protéique au niveau du ribosome 50S. La clindamycine est aussi utilisée en usage externe dans le traitement de l'acné (DALACIN®, ZINDACLIN®)."},{"id":"04-clindamycine-peau-morsures","t":"Clindamycine : infections de la peau/tissus mous et morsures","e":"Indications ambulatoires : infections de la peau et des tissus mous (impétigo, cellulite, érysipèle) chez les patients allergiques à la pénicilline (IgE-médiée) lorsqu'une antibiothérapie systémique est indiquée ; morsures de chats, de chiens ou d'humains chez les enfants allergiques à la pénicilline (IgE-médiée)."},{"id":"04-ophtalmologie-antibiotiques","t":"Usage ophtalmique (chloramphénicol, gentamicine, tobramycine)","e":"Le chloramphénicol n'est plus utilisé qu'en usage externe, notamment en ophtalmologie (collyre, DE ICOL® avec dexaméthasone). Gentamicine (DEXAGENTA POS®) et tobramycine (TOBREX®, TOBRADEX®) sont utilisées en usage ophtalmique en raison de leurs effets indésirables et de leur marge thérapeutique étroite."},{"id":"05-polypeptides-generalites","t":"Antibiotiques polypeptidiques","e":"Mélanges de substances polypeptidiques renfermant souvent des acides aminés de la série D. En général mal résorbés et relativement toxiques, ils sont utilisés en usage externe (nasal, ophtalmique…). Solubles dans l'eau, moins dans l'alcool, insolubles dans les solvants organiques. Groupe non homogène sur le plan du mécanisme."},{"id":"05-polymyxines-mecanisme","t":"Polymyxines : altération de la membrane","e":"Molécules cationiques qui se lient au LPS et aux phospholipides de la membrane externe des Gram −, déplacent Ca²⁺ et Mg²⁺ et désorganisent la membrane → ↑ perméabilité → fuite du contenu cellulaire → effet bactéricide, comme un « détergent membranaire »."},{"id":"05-bacitracine-mecanisme","t":"Bacitracine : blocage du bactoprénol","e":"La bacitracine inhibe la synthèse de la paroi, mais à une étape différente des β-lactamines : elle bloque le recyclage du bactoprénol, transporteur lipidique qui fait passer les précurseurs du peptidoglycane à travers la membrane."},{"id":"05-tyrocidine-mecanisme","t":"Tyrocidine : action membranaire","e":"La tyrocidine s'insère dans la membrane cytoplasmique, interagit avec ses phospholipides et en désorganise la structure et la perméabilité : fuite d'ions et de constituants intracellulaires, mort bactérienne rapide (bactéricide). Mode d'action qualifié d'unique : pénétration dans la phase lipidique."},{"id":"05-tyrothricine-composition","t":"Tyrothricine","e":"Mélange de tyrocidine A et B et de gramicidine S, J1 et J2 isolées de Bacillus brevis ; polypeptides cycliques de 6 à 10 acides aminés. Active contre les Gram +, utilisée en usage bucco-pharyngé en association (pastilles à sucer : LEMOCIN®, TYROTHRICINE-LIDOCAINE®)."},{"id":"05-sous-unite-50s","t":"Sous-unités ribosomales 50S","e":"L'acide fusidique perturbe le fonctionnement de la sous-unité ribosomale 50S, au même titre que les macrolides, le chloramphénicol et le thiamphénicol. Le linézolide agit aussi sur la 50S en inhibant la formation du complexe d'initiation."},{"id":"05-fusidique-steroide","t":"Acide fusidique : stéroïde trans-syn-trans","e":"L'acide fusidique, isolé de Fusidium coccineum, a une structure stéroïdienne de forme trans-syn-trans, ce qui n'est pas le cas des stéroïdes hormonaux. Bactériostatique à faible concentration, bactéricide à plus forte concentration sur les Gram + (S. aureus) ; inactif sur les Gram −."},{"id":"05-rifamycines-mecanisme","t":"Rifamycines : inhibition de l'ARN polymérase bactérienne","e":"Mécanisme d'action différent des antibiotiques vus avant (paroi, traduction) : les rifamycines inhibent l'ARN polymérase bactérienne en se fixant sur sa sous-unité β ; elles ont peu d'action sur l'ARN polymérase humaine. Elles inhibent donc la transcription (copie de l'ADN en ARN)."},{"id":"05-rifamycines-proprietes","t":"Propriétés physico-chimiques des rifamycines","e":"Produits orangés à rouges. La rifamycine est acide (soluble dans les bases : phénol en para d'une cétone, vinylogue d'acide carboxylique) ; la rifampicine et la rifabutine sont amphotères (solubles dans les acides et les alcalis). Peu solubles dans l'eau, solubles dans l'alcool et les solvants organiques."},{"id":"05-induction-enzymatique","t":"Induction des enzymes hépatiques (rifampicine)","e":"La rifampicine induit les enzymes hépatiques (CYP1A2, CYP2C9, CYP3A4) et accélère la biotransformation de nombreux médicaments : anticoagulants coumariniques, antiépileptiques, contraceptifs, antidiabétiques oraux, corticostéroïdes, antirétroviraux. Le risque d'interactions est donc élevé."},{"id":"05-rifampicine-elimination","t":"Élimination biliaire et cycle entérohépatique","e":"Les rifamycines actives per os sont principalement éliminées par voie biliaire ; il s'établit un cycle entérohépatique, d'où une action prolongée."},{"id":"05-rifampicine-prophylaxie-meningo","t":"Prophylaxie de la méningite à méningocoque chez l'enfant","e":"Chez l'enfant en contact étroit avec un patient atteint d'infection à méningocoques : rifampicine 10 mg/kg toutes les 12 heures pendant 2 jours (4 administrations). Le sirop n'existe pas en spécialité en Belgique : il est préparé en magistrale (rifampicine disponible comme matière première chez les grossistes et dans les coffrets d'urgence)."},{"id":"05-encephalopathie-hepatique","t":"Encéphalopathie hépatique (rifaximine)","e":"La rifaximine (TARGAXAN®) n'est quasiment pas absorbée et agit localement sur la flore intestinale ; elle est utilisée en prévention des récidives d'épisodes d'encéphalopathie hépatique, généralement en association au lactulose."},{"id":"05-mupirocine-usage-externe","t":"Mupirocine : usage externe uniquement","e":"La mupirocine (acide pseudomonique, BACTROBAN®) est un antibiotique à spectre étroit (staphylocoques, streptocoques) dont l'indication principale, en usage externe uniquement, est l'impétigo (surinfection de lésions cutanées par streptocoque ou staphylocoque)."},{"id":"05-mupirocine-mecanisme","t":"Mupirocine : inhibition de la synthèse protéique","e":"La mupirocine inhibe la synthèse protéique bactérienne en se liant réversiblement et spécifiquement à l'isoleucyl-ARNt synthétase bactérienne. Sa structure est totalement différente de celle de tout autre antibactérien connu."},{"id":"05-glycopeptides-gram-plus","t":"Glycopeptides : actifs essentiellement sur Gram +","e":"Vancomycine (VANCOMYCIN SANDOZ®) et teicoplanine (TARGOCID®) sont actives essentiellement sur les Gram +. Étant des glycopeptides, elles ne sont pas actives per os : voie parentérale (i.v., i.m.)."},{"id":"05-glycopeptides-indications","t":"Indications des glycopeptides","e":"Seules indications : traitement des infections graves à staphylocoques résistant aux pénicillines, et prévention des endocardites bactériennes lorsque les pénicillines ne peuvent être administrées (allergies, résistances)."},{"id":"05-vancomycine-mecanisme","t":"Vancomycine : mécanisme","e":"Glycopeptide tricyclique qui inhibe la synthèse de la paroi en se liant avec une forte affinité à la terminaison D-alanyl-D-alanine des précurseurs du peptidoglycane ; lentement bactéricide sur les micro-organismes en division. Elle altère aussi la perméabilité de la membrane et la synthèse de l'ARN."},{"id":"05-linezolide-spectre","t":"Linézolide : Gram + multirésistants","e":"Le linézolide est actif contre les Gram + résistants à la plupart des antibiotiques, y compris les entérocoques résistants à la vancomycine (ERV) et les Staphylococcus aureus méticillino-résistants (SARM). Il n'est pas actif sur les Gram −, dans lesquels il pénètre mal."},{"id":"05-oxazolidinone-synthese","t":"Oxazolidinone obtenue par synthèse","e":"Le linézolide est une oxazolidinone substituée obtenue par synthèse chimique en 1987, et non par extraction à partir d'un micro-organisme comme beaucoup d'autres antibiotiques. Sa structure chimique est originale."},{"id":"05-linezolide-restriction","t":"Linézolide : usage réservé","e":"Afin de limiter le risque de résistance, le linézolide ne peut être utilisé que dans les infections graves par des coques Gram + résistants aux antibiotiques courants (p. ex. les glycopeptides), ou en cas d'effets indésirables graves avec les glycopeptides."},{"id":"05-linezolide-mecanisme","t":"Linézolide : complexe d'initiation 50S","e":"Le linézolide bloque la synthèse des protéines bactériennes en se liant aux ribosomes et en inhibant la formation d'un complexe d'initiation 50S fonctionnel, comme les macrolides, le chloramphénicol et l'acide fusidique (qui agissent aussi sur la 50S)."},{"id":"05-rifabutine-rouge","t":"Rifabutine : partie en rouge dans la structure","e":"Dans la structure de la rifabutine (p.97), le prof met en rouge la C=O quinonique et le cycle imidazoline spiro-condensé à la pipéridine N-isobutyle : c'est ce qui la distingue de la rifamycine SV/rifampicine. Elle dérive de la rifamycine S (naphtoquinone)."},{"id":"05-figure-autres-classes","t":"Figure : Antibiotiques à retenir, autres classes","e":"À retenir : polypeptides (tyrocidine) = membrane ; bacitracine = paroi (bactoprénol) ; acide fusidique = EF-G (50S) ; rifamycines = ARN polymérase ; mupirocine = isoleucyl-ARNt synthétase ; vancomycine = D-Ala-D-Ala ; linézolide = initiation de la synthèse protéique (50S)."},{"id":"05-figure-mecanismes-generale","t":"Figure résumée des mécanismes d'action","e":"1) Paroi : β-lactamines, glycopeptides. 2) Membrane plasmique : polymyxines (Gram −), daptomycine (Gram +). 3) Acides nucléiques : fluoroquinolones (ADN gyrase, topo-isomérase II), rifamycines (ARN polymérase). 4) Ribosomes 70S : 50S (macrolides, lincosamides, phénicolés, oxazolidinones, streptogramines) ; 30S (aminosides, tétracyclines). 5) Antimétabolites de l'acide folique : sulfamidés, triméthoprime. 6) Membrane externe (Gram −) : polymyxines. 7) Autres cibles : acide fusidique (EF-G), mupirocine (isoleucyl-ARNt synthétase), nitroimidazolés, nitrofurantoïne."},{"id":"06-antiseptique-urinaire","t":"Antiseptiques urinaires : élimination sous forme active","e":"Plusieurs antibactériens systémiques éliminés sous forme active dans l'urine peuvent servir d'antiseptiques urinaires, car leur concentration urinaire dépasse souvent la concentration plasmatique : certains sulfamidés (sulfaméthoxazole), pénicillines, céphalosporines, thiamphénicol, tétracyclines. Les quinolones et les nitrofurannes sont les deux classes principales d'antiseptiques urinaires."},{"id":"06-methenamine-milieu-acide","t":"Méthénamine : libération de formaldéhyde en milieu acide","e":"La méthénamine (urotropine) libère lentement du formaldéhyde dans l'urine, mais seulement en milieu acide ; c'est pourquoi on l'associe à l'acide hippurique. Sa puissance est insuffisante pour les infections aiguës."},{"id":"06-quinolones-sens-strict","t":"Quinolones au sens strict","e":"Dérivés de l'acide 1,4-dihydro-4-oxo-quinoléine-3-carboxylique. L'acide nalidixique (1965), chef de file historique, a un noyau naphtyridine (N à la place du C8). Les fluoroquinolones (années 80) ajoutent un fluor en position 6 avec un retour au noyau quinoléine."},{"id":"06-quinolones-topoisomerase","t":"Mécanisme des quinolones : inhibition de la topo-isomérase II (DNA-gyrase)","e":"La topo-isomérase II coupe les deux brins de DNA pour réduire leur surenroulement puis les ressoude à l'état surenroulé (DNA compact). Les quinolones s'intercalent sous forme de complexe de magnésium entre les deux brins du DNA bactérien et empêchent cette soudure, donc la formation de chromosomes compacts. Les différences entre chromosomes bactériens et humains expliquent l'absence habituelle d'effet sur le DNA humain."},{"id":"06-generations-quinolones","t":"Générations de quinolones","e":"1re génération (acide nalidixique, pipémidique, oxolinique, cinoxacine) : spectre étroit, surtout Gram −, réservées aux infections urinaires inférieures, retirées du marché. 2e génération = fluoroquinolones : F en 6 et souvent pipérazin-1-yle de l'acide pipémidique, spectre élargi à certains Gram + et aux mycobactéries (cipro, oflo, lévo). 3e génération : moxifloxacine, activité accrue sur Gram + (S. pneumoniae) et atypiques (mycoplasme, chlamydia). Attention : la figure récapitulative IA p.114 numérote autrement (lévo 3e, moxi 4e) ; le texte du cours classe la moxifloxacine en 3e génération."},{"id":"06-bioisosterie-quinolones","t":"Bioisostérie dans les quinolones de 1re génération","e":"Le cours fait remarquer l'utilisation du concept de bioisostérie dans le développement des antiseptiques urinaires de 1re génération : par exemple un CH remplacé par un N (naphtyridine de l'acide nalidixique, cinnoline de la cinoxacine vs quinoléine de l'acide oxolinique)."},{"id":"06-troisieme-cycle-chiral-switch","t":"Azote quinoléique internalisé et chiral switch (ofloxacine → lévofloxacine)","e":"Fluméquine, ofloxacine et rufloxacine ont l'azote quinoléique internalisé dans un 3e cycle. L'ofloxacine possède un carbone asymétrique ; son isomère lévogyre, la lévofloxacine, a été commercialisé seul (chiral switch). L'isomère dextrogyre est en principe inactif mais a la même toxicité."},{"id":"06-quinolones-collyres","t":"Usage ophtalmique et otique des quinolones","e":"Les quinolones de 2e génération existent en collyres pour les infections bactériennes à Gram − (en particulier Pseudomonas aeruginosa) résistantes à d'autres traitements : ciprofloxacine (CILOXAN®, aussi pour usage otique) et ofloxacine (TRAFLOXAL®)."},{"id":"06-rouge-limiter-quinolones","t":"Limiter l'utilisation des quinolones (EMA)","e":"En raison du développement rapide de résistance et des effets indésirables parfois très invalidants, il est important de limiter l'utilisation des quinolones, comme le préconise également l'Agence européenne des médicaments (EMA)."},{"id":"06-quinolones-indications","t":"Positionnement des quinolones en ambulatoire","e":"Infections urogénitales : infections urinaires compliquées (pyélonéphrite, prostatite aiguë). Attention : pour les infections urinaires basses non compliquées, les quinolones ne sont pas un bon choix. Infections respiratoires : moxifloxacine chez l'adulte allergique à la pénicilline (pneumonie communautaire, rares bronchites aiguës, exacerbation de BPCO, rhinosinusite aiguë)."},{"id":"06-quinolones-qt","t":"Allongement de l'intervalle QT","e":"Un allongement de l'intervalle QT avec risque de torsades de pointes est décrit, certainement avec la ciprofloxacine, la lévofloxacine et la moxifloxacine, et possible avec la norfloxacine et l'ofloxacine."},{"id":"06-quinolones-ci-cartilage","t":"Contre-indication principale : grossesse, allaitement, croissance","e":"Les fluoroquinolones sont contre-indiquées pendant la grossesse, l'allaitement et la période de croissance corporelle (< 18 ans), car une atteinte du cartilage articulaire a été observée chez l'animal en croissance."},{"id":"06-quinolones-tendinites","t":"Tendinites et rupture du tendon d'Achille","e":"Parmi les effets indésirables des fluoroquinolones (troubles neurosensoriels, vertiges, céphalées, leucopénies, thrombopénies, anémies), on note particulièrement des tendinites conduisant parfois à la rupture du tendon d'Achille."},{"id":"06-photosensibilisation","t":"Photosensibilisation","e":"Accidents cutanés dus à l'action combinée de la lumière (UVA, UVB) et d'une substance chimique, touchant surtout les zones découvertes. Les fluoroquinolones en donnent, même après exposition modérée ; la sparfloxacine (très photosensibilisante) a été retirée dans la plupart des pays. Autres photosensibilisants : psoralènes, sulfamides, tétracyclines, certaines phénothiazines."},{"id":"06-quinolones-resistance","t":"Résistance aux fluoroquinolones","e":"Une résistance aux fluoroquinolones par modification de la topo-isomérase à la suite d'une mutation est possible."},{"id":"06-nitrofurannes-urine-acide","t":"Nitrofurannes : élimination urinaire et milieu acide","e":"Les nitrofurannes ont un large spectre (Gram +, Gram −, anaérobies), sont éliminés dans les urines et sont plus actifs en milieu acide (pH < 5,5). Le NO2 sur le furane est réduit par les bactéries bien plus vite que par l'hôte ; les métabolites réduits lèsent le DNA."},{"id":"06-nitrofurannes-premier-choix","t":"Premier choix des infections urinaires basses non compliquées","e":"Les nitrofurannes, comme le triméthoprime, sont des médicaments de premier choix pour les infections non compliquées des voies urinaires basses chez les femmes adultes."},{"id":"06-nitrofurantoine-urines-rouges","t":"La nitrofurantoïne colore les urines en rouge","e":"Effet à connaître pour prévenir le patient ; les nitrofurannes sont des poudres jaunes-orangées."},{"id":"06-fosfomycine-peptidoglycane","t":"Fosfomycine : inhibition précoce de la synthèse du peptidoglycane","e":"La fosfomycine inhibe la pyruvyl transférase impliquée dans une des premières réactions de la synthèse du peptidoglycane. Cette étape étant intracytoplasmique, la fosfomycine doit pénétrer dans la bactérie (par un système de transport)."},{"id":"06-trometamol-paire-ions","t":"Trométamol : paire d'ions et absorption digestive (MONURIL®)","e":"La fosfomycine est ionisée à pH neutre et mal absorbée par voie digestive. Le trométamol (trométhamine, tampon de biologie) forme avec elle une paire d'ions qui augmente son absorption digestive (MONURIL®). La forme injectable, riche en sodium, peut donner une hypernatrémie."},{"id":"06-fosfomycine-urinaire","t":"Fosfomycine et infections urinaires","e":"Non liée aux protéines plasmatiques, bien diffusée, non métabolisée, la fosfomycine s'élimine dans l'urine à forte concentration : elle est utilisée dans la cystite aiguë de la femme (staphylocoque, Proteus, Serratia…). Injectable, elle n'est jamais utilisée seule."},{"id":"06-tuberculose","t":"Tuberculose","e":"Maladie infectieuse due au bacille de Koch (Mycobacterium tuberculosis), surtout pulmonaire mais aussi osseuse, rénale, méningée… Transmise par l'air. Environ un quart de la population mondiale a été infecté ; 1,3 million de décès en 2022 (OMS). La tuberculose multirésistante reste une crise de santé publique."},{"id":"06-tb-deux-phases","t":"Traitement de la tuberculose en deux phases","e":"1) Phase intensive quotidienne (2-3 mois) avec 3 ou 4 substances : rifampicine et isoniazide associés à l'éthambutol ou au pyrazinamide, pour éviter la résistance quand le nombre de germes est maximal. 2) Phase de 4 mois ou plus avec isoniazide + rifampicine, 2 à 3 fois par semaine. Le traitement dure 4 à 6 mois ; l'arrêter précocement ou sans avis médical est dangereux (résistance). Chez les sujets à risque : chimio-prophylaxie à l'isoniazide."},{"id":"06-tb-intention","t":"Tuberculostatiques de première et de seconde intention","e":"Médicaments de première intention (majeurs : isoniazide, rifampicine, pyrazinamide, éthambutol) et de seconde intention (alternatifs : éthionamide, protionamide, PAS, D-cyclosérine…) utilisés lorsque des résistances apparaissent. La streptomycine n'est plus de première intention."},{"id":"06-tb-resistance-monotherapie","t":"Résistance rapide en monothérapie","e":"En monothérapie, une résistance apparaît rapidement avec tous les antituberculeux ; d'où l'association de 3 voire 4 principes actifs pendant la phase d'instauration."},{"id":"06-tb-acides-mycoliques","t":"Mécanisme mal connu des antituberculeux majeurs","e":"Les mécanismes d'action des antituberculeux majeurs comme l'isoniazide sont encore très mal connus ; un mécanisme possible serait l'inhibition de la synthèse des acides mycoliques de la paroi des mycobactéries. Ceux de l'éthambutol et du pyrazinamide restent aussi mal élucidés."},{"id":"06-inh-imao","t":"L'isoniazide inhibe la monoamine oxydase (IMAO)","e":"Lors des premiers essais, des patients sous isoniazide étaient euphoriques ; on a découvert que l'isoniazide inhibait la MAO (dégradation de la sérotonine et de la noradrénaline), ce qui a ouvert la voie aux antidépresseurs IMAO."},{"id":"06-bedaquiline-atp","t":"Bédaquiline : approvisionnement énergétique de M. tuberculosis","e":"La bédaquiline (diarylquinoléine) inhibe spécifiquement l'ATP synthase mycobactérienne, indispensable à l'approvisionnement énergétique de Mycobacterium tuberculosis. Elle est réservée à la tuberculose pulmonaire multirésistante, en association."},{"id":"06-bcg","t":"Vaccin BCG","e":"Vaccin vivant non virulent préparé par Calmette et Guérin à partir d'une souche atténuée de Mycobacterium bovis (1921), injecté par voie intradermique. Meilleurs résultats chez les jeunes enfants (miliaire et méningite évitées dans 70-80 % des cas), protection de 10 à 15 ans. En Belgique (risque 0,03 %/an), la vaccination systématique n'est pas indiquée et le vaccin n'est pas disponible pour le moment ; à envisager chez l'enfant de moins de 5 ans à intradermoréaction négative faisant un séjour prolongé en région fortement endémique."},{"id":"06-lepre-traitement","t":"Traitement de la lèpre","e":"La lèpre (maladie de Hansen, Mycobacterium leprae) peut être traitée par la rifampicine et les sulfamidés à longue durée d'action, mais les sulfones, surtout la dapsone, sont les plus utilisées."},{"id":"06-dapsone-acide-folique","t":"Dapsone : inhibiteur de la synthèse d'acide folique","e":"Comme les sulfamides et l'acide para-aminosalicylique, la dapsone est un analogue du PABA ; en compétition avec lui, elle inhibe la dihydroptéroate synthétase (incorporation du PABA dans l'acide dihydroptéroïque, précurseur de l'acide folique)."},{"id":"07-mycoses-locales-generalisees","t":"Mycoses locales vs généralisées","e":"Les mycoses sont le plus souvent locales (Candida, Epidermophyton, Microsporum, Trichophyton, Malassezia) ; elles peuvent être généralisées (Aspergillus, Blastomyces, Candida…). Généralisée → traitement systémique. Superficielle → traitement local, moins d'effets indésirables généraux ; le systémique seulement si échec local, infection étendue ou récidives fréquentes. Mycose du cuir chevelu : systémique généralement nécessaire."},{"id":"07-dermatomycoses","t":"Dermatomycoses","e":"Les plus fréquentes : tinea pedis (pied d'athlète), onychomycose (mycose unguéale), tinea corporis, tinea cruris, intertrigo à Candida (plis cutanés) et pityriasis versicolor."},{"id":"07-cibles-antimycosiques","t":"Cibles des antimycosiques","e":"Les principaux antimycosiques agissent sur la paroi fongique (caspofungine), la membrane riche en ergostérol (polyènes), la biosynthèse de l'ergostérol (azolés, terbinafine, amorolfine) ou les microtubules impliqués dans la division cellulaire (griséofulvine)."},{"id":"07-dermatophytes","t":"Dermatophytes","e":"Champignons qui se développent dans les tissus « morts » de la peau et de ses annexes (couche cornée, cheveux, ongles) : Microsporum, Epidermophyton, Trichophyton. Cible de la griséofulvine (fongistatique)."},{"id":"07-tubuline-mitose","t":"Cytosquelette, tubuline et mitose","e":"La tubuline (dimères α/β) polymérise en microtubules (13 protofilaments, ~25 nm). Lors de la mitose, ils se dépolymérisent puis se repolymérisent en fuseau mitotique. La griséofulvine empêche la formation du fuseau : premier médicament agissant sur le cytosquelette."},{"id":"07-medicaments-tubuline","t":"Médicaments agissant sur la tubuline","e":"Selon leur pharmacocinétique : antinéoplasiques (alcaloïdes de la pervenche qui inhibent la polymérisation ; taxoïdes qui empêchent la dépolymérisation), antihelminthiques benzimidazolés, antigoutteux (colchicine, podophyllotoxine) et antifongique (griséofulvine)."},{"id":"07-polyenes-usage","t":"Polyènes : usage externe et tractus gastro-intestinal","e":"Macrolides à doubles liaisons conjuguées portant souvent un aminosucre. Non résorbés : usage externe (pommades, ovules, comprimés vaginaux) ou per os pour traiter des infections du tractus gastro-intestinal. En IV, toxicité très grande, surtout rénale."},{"id":"07-amphotericine-formes","t":"Amphotéricine B : formes injectables et liposomes","e":"Absorption orale très faible. Molécule peu soluble quel que soit le pH : formes galéniques spéciales, ABELCET® (complexe lipidique) et AMBISOME® (liposomes). IV réservée aux formes graves de mycoses systémiques et/ou profondes ; dose test souvent administrée avant la perfusion. Liposomes : moins toxiques, plus grand volume de distribution."},{"id":"07-nystatine-oropharynx","t":"Nystatine : candidoses oropharyngées","e":"Polyène moins efficace que l'amphotéricine B, utilisé en suspension dans les affections bucco-pharyngées (candidoses oropharyngées), fréquentes chez les immunodéprimés (VIH+, sous corticoïdes)."},{"id":"07-azoles-ergosterol","t":"Les azolés bloquent la synthèse de l'ergostérol","e":"Les dérivés imidazolés et triazolés bloquent la synthèse de l'ergostérol, constituant essentiel de la membrane des levures et champignons ; chez les mammifères, c'est le cholestérol qui joue ce rôle."},{"id":"07-cyp51-interactions","t":"Mécanisme d'action et explication des interactions (CYP51)","e":"Un azote du noyau imidazole/triazole se lie au fer de l'hème du CYP51 fongique (stérol 14-α-déméthylase) → blocage de l'ergostérol. Les CYP humains (CYP3A4, CYP2C9, CYP2C19) ressemblent au CYP51 : les azolés les inhibent aussi → hausse des concentrations des médicaments métabolisés, toxicité possible. Le CYP51 humain (CYP51A1) produit le cholestérol."},{"id":"07-ketoconazole-hepatotoxicite","t":"Hépatotoxicité du kétoconazole","e":"Le kétoconazole, 2e imidazolé utilisé par voie orale (bonne biodisponibilité), n'est plus utilisé qu'exceptionnellement par voie systémique à cause de son hépatotoxicité ; il reste en crème et shampooing (NIZORAL®)."},{"id":"07-ketoconazole-cushing","t":"Kétoconazole et syndrome de Cushing","e":"Inhibiteur de la stéroïdogenèse : inhibe plusieurs CYP surrénaliens (17α-hydroxylase surtout, 11-hydroxylation, clivage de la chaîne latérale du cholestérol à fortes doses, lyase C17-20) → baisse du cortisol, de l'aldostérone et des androgènes. Comprimés de 200 mg indiqués dans le syndrome de Cushing (adulte et enfant > 12 ans)."},{"id":"07-triazoles-per-os","t":"Triazolés per os","e":"Itraconazole, posaconazole, fluconazole, voriconazole : utilisés per os pour des mycoses systémiques graves (souvent chez l'immunodéprimé). Itraconazole efficace dans l'aspergillose ; voriconazole à large spectre (Candida, Aspergillus, Scedosporium)."},{"id":"07-azoles-interactions","t":"Interactions médicamenteuses des azolés","e":"Kétoconazole, itraconazole et voriconazole inhibent le CYP3A4 : ralentissement du métabolisme et hausse des concentrations plasmatiques de ses substrats (ciclosporine, triazolam, midazolam…). Effets indésirables des azolés : atteinte hépatique grave (surtout kétoconazole), troubles GI, céphalées, prurit, baisse de
