<style>
:root{--bg:#07141d;--bg2:#0d2230;--carte:#ffffff;--encre:#1b2233;--doux:#6b7385;--bleu:#0e8aa6;--bleu2:#0b6f86;--or:#f5b82e;--vert:#16a34a;--vert-p:#dcfce7;--rouge:#e5484d;--rouge-p:#fee2e2;--trait:#e6e8ef;--violet:#0d9488}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#061520}html,body{margin:0;min-height:100%}
body{background:transparent;color:#fff;font:16px/1.45 -apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;overscroll-behavior:none}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 20px)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
.ic.f{fill:currentColor;stroke:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .logo{width:42px;height:42px;border-radius:12px;background:#fff}
.top h1{font-size:1.15rem;margin:0;flex:1;line-height:1.15}.top h1 small{display:block;font-weight:400;opacity:.7;font-size:.78rem}
.stats{display:flex;gap:8px;margin:6px 0 14px}
.stat{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.stat b{font-size:1.1rem;display:block;line-height:1}.stat span{font-size:.72rem;opacity:.75}
.stat .ic{width:26px;height:26px}
.flamme{color:#ff8a3d}.etoile{color:var(--or)}.eclair{color:#7dd3fc}
.rang{background:linear-gradient(135deg,#0e8aa6,#0d9488);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.rang .t{display:flex;justify-content:space-between;font-size:.85rem;opacity:.9}
.barre{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:6px}
.barre i{display:block;height:100%;background:linear-gradient(90deg,#fde68a,#f5b82e);border-radius:99px;transition:width .5s}
.obj{margin-top:8px;font-size:.8rem;opacity:.9;display:flex;gap:6px;align-items:center}
.sect{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:18px 4px 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--carte);color:var(--encre);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mode .ic{width:28px;height:28px;color:var(--bleu2)}
.mode b{font-size:.98rem}.mode small{color:var(--doux);font-size:.76rem;line-height:1.25}
.mode.vedette{grid-column:1/-1;background:linear-gradient(135deg,#f5b82e,#ff8a3d);color:#2a1600}
.mode.vedette .ic{color:#2a1600}.mode.vedette small{color:#4a2a00}
.chemin{display:flex;flex-direction:column;gap:10px}
.niv{display:flex;align-items:center;gap:12px;background:var(--carte);color:var(--encre);border-radius:18px;padding:12px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.niv:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.niv .rond{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--bleu);color:#fff;font-weight:800;font-size:1.1rem;flex:none}
.niv.boss .rond{background:var(--violet)}
.niv.fini .rond{background:var(--vert)}
.niv.verrou{opacity:.55}.niv.verrou .rond{background:#9aa1b2}
.niv .tx{flex:1}.niv .tx b{display:block;font-size:.95rem;line-height:1.2}.niv .tx small{color:var(--doux);font-size:.75rem;display:block;line-height:1.25}
.niv .etoiles{display:flex;gap:2px;color:#d7dae3}.niv .etoiles .on{color:var(--or)}
.niv .maitrise{height:5px;background:var(--trait);border-radius:9px;margin-top:5px;overflow:hidden}.niv .maitrise i{display:block;height:100%;background:var(--vert)}
/* écran de jeu */
.jeu{display:none}.jeu.on{display:block}.accueil.off{display:none}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud .quit{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.hud .prog{flex:1;height:14px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.hud .prog i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#16a34a);transition:width .3s}
.coeurs{display:flex;gap:2px;color:var(--rouge)}.coeurs .vide{color:rgba(255,255,255,.25)}
.combo{text-align:center;font-weight:800;color:var(--or);height:22px;font-size:.95rem}
.timer{text-align:center;font-weight:800;font-size:1.3rem;color:#7dd3fc}
.q{background:var(--carte);color:var(--encre);border-radius:22px;padding:18px 16px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.q .type{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--bleu2);font-weight:700;display:flex;gap:6px;align-items:center}
.q h2{font-size:1.12rem;margin:8px 0 12px;line-height:1.3}
.q .struct{display:block;margin:0 auto 10px;max-width:100%;max-height:200px;background:#fff}
.q .grand{font-size:1.5rem;font-weight:800;text-align:center;color:var(--bleu2);margin:6px 0 14px}
.choix{display:grid;gap:9px}
.ch{background:#f4f5f9;border:2px solid var(--trait);border-radius:14px;padding:12px 12px;text-align:left;font-size:.95rem;color:var(--encre);box-shadow:0 3px 0 var(--trait)}
.ch:active{transform:translateY(2px);box-shadow:none}
.ch.ok{background:var(--vert-p);border-color:var(--vert);box-shadow:0 3px 0 var(--vert)}
.ch.ko{background:var(--rouge-p);border-color:var(--rouge);box-shadow:0 3px 0 var(--rouge);animation:shake .35s}
.vf{grid-template-columns:1fr 1fr}.vf .ch{text-align:center;font-weight:700;font-size:1.05rem}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;border-radius:14px;padding:12px;font-size:.9rem;display:none}
.fb.on{display:block}.fb.ok{background:var(--vert-p);color:#14532d}.fb.ko{background:var(--rouge-p);color:#7f1d1d}
.fb b{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.suite{width:100%;margin-top:14px;background:var(--bleu);color:#fff;border-radius:16px;padding:14px;font-weight:800;font-size:1.02rem;box-shadow:0 5px 0 var(--bleu2);display:none}
.suite.on{display:block}.suite:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bleu2)}
.reveal{background:#f4f5f9;border-radius:14px;padding:12px;margin-top:10px;display:none;font-size:.93rem}
.reveal.on{display:block}
.auto{display:none;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.auto.on{display:grid}
.auto button{border-radius:14px;padding:12px 6px;font-weight:700;font-size:.85rem;color:#fff}
.auto .a1{background:var(--rouge)}.auto .a2{background:#f59e0b}.auto .a3{background:var(--vert)}
.voir{width:100%;margin-top:12px;background:var(--encre);color:#fff;border-radius:14px;padding:12px;font-weight:700}
canvas.dessin{width:100%;height:260px;background:#fff;border:2px dashed #c7cbd8;border-radius:14px;touch-action:none;display:block}
.outils{display:flex;gap:8px;margin-top:6px}.outils button{flex:1;background:#eef0f6;color:var(--encre);border-radius:10px;padding:8px;font-size:.85rem}
.paire{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paire button{background:#f4f5f9;border:2px solid var(--trait);border-radius:12px;padding:10px 8px;font-size:.85rem;color:var(--encre);min-height:52px}
.paire button.sel{border-color:var(--bleu);background:#e7ecfd}
.paire button.fait{visibility:hidden}
.paire button.ko{border-color:var(--rouge);animation:shake .35s}
/* fin */
.fin{text-align:center;padding:10px 0}
.fin .grosse{font-size:2.4rem;font-weight:900;margin:6px 0}
.fin .etoiles{display:flex;justify-content:center;gap:6px;color:rgba(255,255,255,.25)}.fin .etoiles .on{color:var(--or)}
.fin .etoiles .ic{width:46px;height:46px}
.gains{display:flex;gap:10px;justify-content:center;margin:14px 0}
.gains div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 14px}
.gains b{display:block;font-size:1.3rem}
.erreurs{background:var(--carte);color:var(--encre);border-radius:16px;padding:12px;text-align:left;margin-top:10px;font-size:.88rem}
.erreurs li{margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-120px);background:#fff;color:var(--encre);border-radius:16px;padding:10px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .35s;z-index:9;display:flex;gap:8px;align-items:center;max-width:92%}
.toast.on{transform:translateX(-50%) translateY(0);visibility:visible;transition:transform .35s}
.toast{visibility:hidden;transition:transform .35s,visibility 0s .35s;transform:translateX(-50%) translateY(calc(-100% - env(safe-area-inset-top) - 60px))!important}.toast.on{transform:translateX(-50%) translateY(0)!important}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:rgba(255,255,255,.07);border-radius:14px;padding:8px 4px;text-align:center;font-size:.66rem;opacity:.45}
.badge.on{opacity:1;background:rgba(245,184,46,.18)}
.badge .ic{width:26px;height:26px;color:var(--or);display:block;margin:0 auto 4px}
.note{font-size:.75rem;opacity:.6;text-align:center;margin-top:18px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:8}

.atl{background:#fff;border-radius:16px;margin:0 -4px}
.atl-barre{display:flex;gap:4px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.atl-barre::-webkit-scrollbar{display:none}
.atl-o{flex:1 0 auto;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:12px;background:#f1f3f8;color:#1b2233;font-size:.62rem}
.atl-o .ic{width:22px;height:22px}.atl-o.on{background:#0b6f86;color:#fff}
.atl-b2{justify-content:space-between;align-items:center}
.atl-coul{display:flex;gap:6px}.atl-c{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #d4d8e3}.atl-c.on{box-shadow:0 0 0 3px #0b6f86}
.atl-taille{display:flex;gap:4px}.atl-t{width:34px;height:34px;border-radius:10px;background:#f1f3f8;display:grid;place-items:center}.atl-t i{display:block;border-radius:50%;background:#1b2233}.atl-t.on{background:#dbe3ff}
.atl-atomes{display:none;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding:4px 2px;scrollbar-width:none}.atl-atomes::-webkit-scrollbar{display:none}.atl-atomes.on{display:flex}
.atl-atomes button{flex:none;min-width:40px;padding:7px 8px;border-radius:10px;background:#f1f3f8;color:#1b2233;font-weight:700;font-size:.9rem}.atl-atomes button.on{background:#0b6f86;color:#fff}
.atl-zone{position:relative;overflow:hidden;border-radius:14px}
.atl canvas{display:block;width:100%;height:56vh;max-height:520px;min-height:300px;background:#fff;border:2px solid #e3e6ee;border-radius:14px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.atl-aide{position:absolute;left:8px;right:8px;bottom:6px;font-size:.7rem;color:#8a91a3;pointer-events:none;text-align:center}
.atl-b3 button{flex:1;display:flex;gap:4px;align-items:center;justify-content:center;padding:9px 6px;border-radius:12px;background:#f1f3f8;color:#1b2233;font-size:.78rem}
.atl-b3 .atl-voir{background:#1b2233;color:#fff;font-weight:700;flex:1.6}
.atl.plein{position:fixed;inset:0;z-index:20;border-radius:0;margin:0;padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;flex-direction:column}
.atl.plein .atl-zone{flex:1;display:flex}.atl.plein canvas{height:auto;flex:1;max-height:none}
body.sans-scroll{overflow:hidden}
/* la page ne défile pas elle-même : un cadre intérieur défile (évite le flou d'iOS sous l'heure en mode app) */
html,body{height:100%;overflow:hidden}
.defile{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;z-index:1}
body.sans-scroll .defile{overflow:hidden}
@media (min-width:700px){.atl canvas{height:62vh;max-height:none}}


.atl-calque{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);max-width:80%;max-height:70%;opacity:0;pointer-events:none;mix-blend-mode:multiply;touch-action:none;-webkit-user-drag:none;user-select:none;transform-origin:center}
.atl-calque.on{pointer-events:auto;cursor:move;outline:2px dashed rgba(59,95,240,.55);outline-offset:4px;border-radius:6px}
.atl-feuille{position:absolute;left:6px;right:6px;bottom:6px;background:#fff;border-radius:16px;box-shadow:0 -6px 30px rgba(15,21,48,.25);padding:10px;transform:translateY(calc(100% + 12px));opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;pointer-events:none;max-height:72%;display:flex;flex-direction:column}
.atl-feuille.mini .atl-f-corps{display:none}
.atl-ajust{display:none;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.atl-feuille.mini .atl-ajust{display:flex}
.atl-ajust button{min-width:40px;background:#f1f3f8;color:#1b2233;border-radius:10px;padding:8px 10px;font-weight:700}
.atl-ajust label{flex:1;display:flex;gap:6px;align-items:center;font-size:.72rem;color:#5d6577;min-width:150px}.atl-ajust input{flex:1}
.atl-feuille.on{transform:none;opacity:1;pointer-events:auto}
.atl-f-tete{display:flex;gap:6px;align-items:center;color:#1b2233}.atl-f-tete b{flex:1}
.atl-f-tete button{background:#f1f3f8;color:#1b2233;border-radius:10px;padding:6px 10px;font-size:.8rem}.atl-f-tete button.on{background:#0b6f86;color:#fff}
.atl-f-corps{overflow:auto;min-height:0;flex:1;text-align:center}.atl-f-corps img{max-width:100%;max-height:30vh;display:block;margin:4px auto}.atl-f-corps p{margin:4px 0;font-size:.82rem;color:#5d6577}
.atl-note{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.atl-note button{border-radius:12px;padding:11px 4px;font-weight:700;font-size:.85rem;color:#fff}
.atl-note .a1{background:#e5484d}.atl-note .a2{background:#f59e0b}.atl-note .a3{background:#16a34a}
.atl-suite{display:none;margin-top:8px;background:#0b6f86;color:#fff;border-radius:12px;padding:12px;font-weight:800;box-shadow:0 4px 0 #0a5568}.atl-suite.on{display:block}

/* ===== monde : chambre de nuit ===== */
.ciel{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(130% 70% at 50% 0%,#12445a 0%,#0b2a3a 42%,#061520 100%);overflow:hidden}
.ciel::before{content:"";position:absolute;inset:-60px;background:url(decor/corps.jpg?v=1795223275) center/cover;filter:blur(26px) saturate(1.3);opacity:.32}
.ciel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,21,32,0) 0%,rgba(6,21,32,.55) 70%,rgba(6,21,32,.85) 100%)}
.ciel i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(255,214,107,.55);opacity:0;animation:luciole 9s ease-in-out infinite;z-index:1}
@keyframes luciole{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}50%{transform:translate(18px,-40px)}80%{opacity:.7}100%{opacity:0;transform:translate(-10px,-90px)}}
.app{position:relative;z-index:1}
.hero{position:relative;margin:calc(-1*(env(safe-area-inset-top) + 10px)) -14px 0;height:calc(42vh + env(safe-area-inset-top));min-height:250px;max-height:440px}
.hero-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 62%,transparent 100%)}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(180deg,rgba(6,21,32,.7),rgba(6,21,32,0));z-index:1;pointer-events:none}
.hero-haut{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 12px);display:flex;align-items:center;gap:10px;z-index:2}
.hero-haut .logo{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.hero-t{flex:1;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.5)}.hero-t small{display:block;font-size:.8rem;opacity:.9}.hero-t b{font-size:1.3rem}
.rond-btn{width:40px;height:40px;border-radius:50%;background:rgba(6,21,32,.45);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center}
.guir{position:absolute;left:0;right:0;bottom:-4px;width:100%;height:auto;z-index:2;overflow:visible}
.guir .fil{fill:none;stroke:rgba(20,18,60,.9);stroke-width:1.6}
.guir .ampoule{fill:#3a3f7a;stroke:rgba(255,255,255,.15);stroke-width:.6}
.guir .ampoule.on{fill:#ffd66b;stroke:#fff3c4;filter:drop-shadow(0 0 4px #ffd66b) drop-shadow(0 0 9px rgba(255,190,80,.8));animation:scint 3s ease-in-out infinite}
@keyframes scint{0%,100%{opacity:1}50%{opacity:.55}}
.lum{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.78rem;color:#ffe9a8;margin:4px 0 10px;text-shadow:0 0 12px rgba(255,214,107,.5)}
.stat,.mode,.niv,.rang{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14)}
.rang{background:linear-gradient(135deg,rgba(14,138,166,.5),rgba(13,148,136,.42));border:1px solid rgba(255,255,255,.18);display:flex;gap:12px;align-items:center}
.rang .rg{flex:1}
.anneau{width:56px;height:56px;flex:none;position:relative}.anneau>svg{width:56px;height:56px;transform:rotate(-90deg)}
.anneau b .ic{width:26px;height:26px;vertical-align:0;color:#ffd66b;stroke-width:3}
.anneau circle{fill:none;stroke-width:6}.anneau .f{stroke:rgba(255,255,255,.18)}.anneau .p{stroke:#ffd66b;stroke-linecap:round;transition:stroke-dashoffset .8s}
.anneau b{position:absolute;inset:0;display:grid;place-items:center;font-size:.7rem;line-height:1.05;text-align:center}
.go{display:flex;align-items:center;gap:12px;width:100%;background:linear-gradient(135deg,#ffd66b,#ff9fb8);color:#2a0d14;border-radius:20px;padding:13px 14px;box-shadow:0 6px 0 #b9577a,0 0 34px rgba(255,190,120,.35);text-align:left;margin:12px 0 2px}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #b9577a}
.go .r{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;animation:respire 2.4s ease-in-out infinite;color:#b9577a}
.go .r .ic{width:22px;height:22px;fill:currentColor}
.go small{display:block;font-size:.75rem;opacity:.8}.go b{font-size:1.05rem}
@keyframes respire{50%{transform:scale(1.08);box-shadow:0 0 22px rgba(255,255,255,.7)}}
.mode{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.13);box-shadow:0 6px 0 rgba(2,10,16,.35)}
.mode .ic{color:#b3c0ff}.mode small{color:rgba(255,255,255,.68)}
.mode.vedette{background:linear-gradient(135deg,rgba(14,138,166,.85),rgba(13,148,136,.8));color:#fff}
.mode.vedette .ic{color:#fff}.mode.vedette small{color:rgba(255,255,255,.88)}
.chemin{position:relative}
.chemin::before{content:"";position:absolute;left:35px;top:24px;bottom:24px;border-left:3px dotted rgba(255,214,107,.4)}
.niv{position:relative;background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.13);box-shadow:0 6px 0 rgba(2,10,16,.35)}

/* iOS 26.1+ en mode app : la zone de l'heure est floutée par le système -> bande unie dessous, décor juste en dessous */

/* ===== salon immersif ===== */
.salon{position:relative;width:100vw;margin:calc(-1*(env(safe-area-inset-top) + 10px)) 0 0 calc(50% - 50vw);height:calc(70vh + env(safe-area-inset-top));min-height:440px;max-height:780px;overflow:hidden;touch-action:none;perspective:900px;-webkit-mask-image:linear-gradient(180deg,#000 90%,transparent);mask-image:linear-gradient(180deg,#000 90%,transparent);-webkit-user-select:none;user-select:none}
.salon .cam,.salon .tilt{position:absolute;left:0;top:0;will-change:transform;transform-style:preserve-3d}
.salon .piece{position:relative}
.salon .piece video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.salon::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 90px);background:linear-gradient(180deg,rgba(6,21,32,.55),rgba(6,21,32,0));z-index:5;pointer-events:none}

@keyframes pouss{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:.85;transform:translateY(-26px)}}
.salon .hero-haut{z-index:6}
.salon-bas{position:absolute;left:12px;right:12px;bottom:calc(10% + 4px);display:flex;align-items:center;gap:8px;z-index:6;pointer-events:none}
.salon-bas .astuce{flex:1;font-size:.72rem;opacity:.9;transition:opacity .6s}.salon-bas .astuce span{background:rgba(6,21,32,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:5px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center}

.guir-w{position:relative;height:40px;width:100vw;margin:-38px 0 0 calc(50% - 50vw);z-index:2}.guir-w .guir{position:absolute;left:0;right:0;top:0;bottom:auto;height:40px}
.sol{position:absolute;width:130px;height:44px;border-radius:50%;pointer-events:none;z-index:1}
.sol.on{background:radial-gradient(ellipse,rgba(255,214,107,.42),rgba(255,214,107,0) 70%)}
.sol.ici{background:radial-gradient(ellipse,rgba(255,244,190,.85),rgba(255,214,107,0) 70%);animation:solp 2.4s ease-in-out infinite}

.borne{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;z-index:3}
.borne .b-ic{position:relative;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,214,107,.85),0 6px 14px rgba(0,0,0,.45);animation:flotteB 3s ease-in-out infinite}

@keyframes flotteB{50%{transform:translateY(-5px)}}
.perso{position:absolute;transform:translate(-50%,-100%);z-index:2;cursor:pointer;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}
.perso::after{content:"";position:absolute;left:14%;right:14%;bottom:-5%;height:11%;border-radius:50%;background:rgba(10,5,40,.5);z-index:-1;filter:blur(2px)}
.perso.gauche .gel{transform:scaleX(-1)}
.perso.hop .gel{animation:hop .5s ease-out}

/* la gélule */
.gel{width:100%;height:auto;display:block;overflow:visible}
.gel .corps{transform-origin:50px 112px;animation:respG 2.2s ease-in-out infinite}
@keyframes respG{50%{transform:translateY(-3px) scaleY(1.02)}}
.gel .yeux{transform-origin:50px 46px;animation:cligne 4.2s infinite}

.gel .bras{stroke:#0e2f3f;stroke-width:4.5;fill:none;stroke-linecap:round}
.gel .pied{fill:#0e2f3f}

.pionmini{position:absolute;top:50%;width:28px;margin:-36px 0 0 -14px;transition:left .45s cubic-bezier(.3,1.4,.5,1);pointer-events:none}

.sta .ile img{width:52px;height:52px;object-fit:contain}
.sta .ile .ic{width:34px;height:34px;color:#0e7490}
.sta b{font-size:.84rem;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.sta small{font-size:.7rem;opacity:.8;display:flex;align-items:center;gap:3px;justify-content:center;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.sta small .ic{width:12px;height:12px;color:#ffd66b}
.sta .num{position:absolute;left:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:#0c3b4d;border:2px solid rgba(255,255,255,.35);font-size:.72rem;font-weight:800;display:grid;place-items:center}
.sta .fini{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:#4ade80;color:#06301c;display:grid;place-items:center;box-shadow:0 0 0 3px #061520}
.sta .fini .ic{width:15px;height:15px;color:#06301c;stroke-width:3}
.sta.verrou .ile{background:rgba(255,255,255,.1)}.sta.verrou .ile>span{background:rgba(20,18,70,.9)}
.sta.verrou .ile img{opacity:.25;filter:grayscale(1)}.sta.verrou .ile .ic{color:rgba(255,255,255,.55)}
.sta.verrou b,.sta.verrou small{opacity:.5}
.sta.ici .ile{animation:halo2 2.4s ease-in-out infinite}
@keyframes halo2{50%{box-shadow:0 8px 0 rgba(2,10,16,.45),0 0 0 4px rgba(6,21,32,.7),0 0 34px 10px rgba(255,214,107,.55)}}
.pion{position:absolute;left:0;top:0;width:64px;height:64px;margin:-112px 0 0 -32px;z-index:4;cursor:pointer}
.pion img{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 5px rgba(0,0,0,.5));animation:sautille 1.6s ease-in-out infinite;z-index:1}
.pion::after{content:"";position:absolute;left:50%;bottom:-4px;width:36px;height:9px;margin-left:-18px;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(2px);animation:ombre 1.6s ease-in-out infinite}
.pion.marche img{animation:none}.pion.marche::after{animation:none}
.pion.hop img{animation:hop .5s ease-out}
@keyframes sautille{50%{transform:translateY(-9px)}}
@keyframes ombre{50%{transform:scale(.7);opacity:.6}}
@keyframes hop{40%{transform:translateY(-34px) rotate(-8deg)}}
.bulle{position:absolute;z-index:5;transform:translate(-50%,-100%);margin-top:-122px;background:#fff;color:#2a0d14;border-radius:14px;padding:7px 11px;font-size:.78rem;font-weight:700;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:monte .4s both;pointer-events:none}
.bulle::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
/* écran chapitre */
.hero.mini{height:calc(170px + env(safe-area-inset-top));min-height:0}
.chap-tete{display:flex;align-items:center;gap:10px;margin:-36px 0 12px;position:relative;z-index:3}
.chap-tete .ci{width:58px;height:58px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.chap-tete .ci img{width:48px;height:48px;object-fit:contain}.chap-tete .ci .ic{color:#0e7490;width:30px;height:30px}
.chap-tete h1{margin:14px 0 0;font-size:1.25rem;flex:1;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.6)}.chap-tete h1 small{display:block;font-weight:400;opacity:.75;font-size:.76rem}
.niv.prof .rond{background:linear-gradient(145deg,#ff9fb8,#d9577a)}
.niv.verrou.prof .rond,.niv.verrou.boss .rond{background:rgba(255,255,255,.1);color:rgba(255,255,255,.55)}
.go.suivant{background:linear-gradient(135deg,#7cf0c5,#7dd3fc);box-shadow:0 6px 0 #1f7a91,0 0 34px rgba(124,240,197,.3)}
.go.suivant .r{color:#1f7a91}
.hud .progw{flex:1;position:relative;height:14px}
.hud .progw .prog{width:100%}
.pionmini{position:absolute;top:50%;width:34px;height:34px;margin:-21px 0 0 -17px;transition:left .45s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));pointer-events:none}

.suite{background:linear-gradient(135deg,#38bdd2,#2dd4bf);box-shadow:0 5px 0 #4b3aa8}
@media (prefers-reduced-motion:reduce){.ciel i,.rayons,.halo,.go .r,.niv.actuel .rond,.coffre .bx,.guir .ampoule.on{animation:none}}

","meca":"Cycle A aromatique, cétone en 17. Œstrogène principal après la ménopause (tissu adipeux).","img":"mol/e1.svg","dessin":true,"cp":"ch2-6-7-croissance-reproduction"},{"id":"e3","dci":"Estriol","marq":"","marques":[],"classe":"Stéroïdes","sous":"","meca":"3 OH (3, 16α, 17β). Œstrogène de la grossesse (placenta).","img":"mol/e3.svg","dessin":true,"cp":"ch2-6-7-croissance-reproduction"},{"id":"dhc","dci":"7-Déhydrocholestérol","marq":"","marques":[],"classe":"Vitamine D","sous":"","meca":"Cholestérol avec une 2e double liaison (7-8) dans la peau. Les UVB ouvrent le cycle B → prévitamine D3.","img":"mol/dhc.svg","dessin":true,"cp":"ch2-5-eau-electrolytes"},{"id":"d3","dci":"Cholécalciférol (vitamine D3)","marq":"","marques":[],"classe":"Vitamine D","sous":"","meca":"Sécostéroïde : cycle B ouvert. Inactif : hydroxylé dans le foie puis le rein.","img":"mol/d3.svg","dessin":true,"cp":"ch2-5-eau-electrolytes"},{"id":"d25","dci":"25-Hydroxycholécalciférol (calcifédiol)","marq":"","marques":[],"classe":"Vitamine D","sous":"","meca":"OH en 25 ajouté dans le foie. Forme de réserve, dosée dans le sang.","img":"mol/d25.svg","dessin":true,"cp":"ch2-5-eau-electrolytes"},{"id":"d125","dci":"1,25-Dihydroxycholécalciférol (calcitriol)","marq":"","marques":[],"classe":"Vitamine D","sous":"","meca":"OH en 1α ajouté dans le rein (sous PTH). Forme active : absorption intestinale du Ca²⁺ et du phosphate.","img":"mol/d125.svg","dessin":true,"cp":"ch2-5-eau-electrolytes"},{"id":"aa","dci":"Acide arachidonique","marq":"","marques":[],"classe":"Médiateurs","sous":"","meca":"Acide gras 20:4 ω-6 libéré des phospholipides par la PLA2 → prostaglandines, thromboxanes (COX), leucotriènes (LOX).","img":"mol/aa.svg","dessin":true,"cp":"ch2-8-9-cytokines-mediateurs"},{"id":"epa","dci":"EPA","marq":"","marques":[],"classe":"Médiateurs","sous":"","meca":"Acide eicosapentaénoïque 20:5 ω-3 (poissons gras) : eicosanoïdes moins inflammatoires et moins pro-agrégants.","img":"mol/epa.svg","dessin":true  déficit en :","c":["Facteur VIII","Facteur IX","Facteur VII","Facteur XII"],"r":"Facteur VIII","x":"B = facteur IX."},{"id":"semhem-q13","t":"qcm","q":"Dans l'hémophilie, on observe :","c":["Un TCA allongé isolé","Un TP allongé isolé","Des plaquettes basses","Des D-dimères très élevés"],"r":"Un TCA allongé isolé","x":"Voie intrinsèque."},{"id":"semhem-q14","t":"qcm","q":"L'emicizumab :","c":["Mime le FVIIIa en reliant FIXa et FX","Remplace le FIX","Inhibe l'antithrombine","Est un antifibrinolytique"],"r":"Mime le FVIIIa en reliant FIXa et FX","x":"Anticorps bispécifique."}],"c":[{"id":"ch1-s0c0","t":"Pourquoi le glucose est-il si surveillé ?","e":"Le cerveau (~120 g/j) et les globules rouges (pas de mitochondries) dépendent du glucose : l'hypoglycémie aiguë est vite dangereuse. À l'inverse, l'hyperglycémie glyque les protéines (fixation non enzymatique du glucose) et diminue leur fonction : c'est la base des lésions du diabète.","mc":"Dépendants du glucose: cerveau (~120 g/j) · globules rouges | Hypoglycémie: vite dangereuse | Hyperglycémie: glycation des protéines · lésions du diabète"},{"id":"ch1-s0c0w","t":"Pourquoi les globules rouges ne peuvent-ils utiliser que le glucose ?","e":"Ils n'ont pas de mitochondries : pas de cycle de Krebs, pas de β-oxydation, pas de phosphorylation oxydative. Seule la glycolyse anaérobie leur fournit de l'ATP (2 ATP par glucose), avec du lactate en sortie.","mc":"pas de mitochondries · pas de Krebs · pas de β-oxydation · glycolyse anaérobie · 2 ATP · lactate"},{"id":"ch1-s0c1","t":"Stocker le sucre en trop : glycogène puis graisse","e":"Après un repas, le glucose remplit d'abord le glycogène (foie ~150 g, muscles ~250-300 g ; réserves épuisées en ~24 h). Quand le glycogène est saturé et qu'on est sédentaire, le foie convertit l'excès via l'acétyl-CoA en acides gras puis en TG, exportés en VLDL vers le tissu adipeux.","mc":"Ordre: glycogène d'abord · foie ~150 g · muscles ~250-300 g | Excès: acétyl-CoA · acides gras · TG · VLDL · tissu adipeux"},{"id":"ch1-s0c1w","t":"Que se passe-t-il si les TG s'accumulent dans le foie ?","e":"Ils ne peuvent pas rester dans les hépatocytes : sinon on obtient un foie gras (stéatose), non fonctionnel. C'est pourquoi le foie les exporte sous forme de VLDL.","mc":"TG dans le foie · foie gras (stéatose) · non fonctionnel · export en VLDL"},{"id":"ch1-s0c2","t":"Le plasma « laiteux » après un repas gras","e":"Après un repas riche en graisses (ex. frites + bière), le plasma devient trouble et blanc : c'est une émulsion de chylomicrons qui transportent les TG alimentaires. L'association sucre + graisse est la pire : le sucre est transformé en graisse et la graisse alimentaire arrive en même temps.","mc":"repas gras · plasma trouble · chylomicrons · TG alimentaires · sucre + graisse = pire association"},{"id":"ch1-s0c3","t":"Le foie : le seul qui relâche du glucose","e":"Seuls le foie (90 %), le rein (10 %) et un peu l'intestin possèdent la glucose-6-phosphatase : ce sont les seuls à pouvoir remettre du glucose libre dans le sang. Le glycogène musculaire ne sert qu'au muscle.","mc":"glucose-6-phosphatase · foie (90 %) · rein (10 %) · intestin · glycogène musculaire pour le muscle seul"},{"id":"ch1-s0c3w","t":"Pourquoi un patient avec une insuffisance hépatique fait-il des hypoglycémies ?","e":"Parce que le foie est le seul organe qui libère du glucose (glycogénolyse + néoglucogenèse) entre les repas : sans foie fonctionnel, la glycémie de jeûne n'est plus maintenue.","mc":"foie seul libère du glucose · glycogénolyse · néoglucogenèse · glycémie de jeûne non maintenue · hypoglycémie"},{"id":"ch1-s0c4","t":"90 % du cholestérol vient du foie","e":"Le cholestérol est surtout synthétisé par le foie à partir de l'acétyl-CoA (le réflexe du prof : une question de molécule → pense acétyl-CoA ; une question d'organe → pense foie). Il est indispensable : précurseur des hormones stéroïdes (cortisol, aldostérone, progestérone, testostérone, œstrogènes) et de la vitamine D. C'est son excès qui pose problème.","mc":"synthétisé par le foie · indispensable · excès"},{"id":"ch1-s0c4w","t":"Quel est l'organe responsable de la synthèse du cholestérol, et à partir de quoi ?","e":"Le foie, à partir de l'acétyl-CoA (enzyme-clé : HMG-CoA réductase). Question posée en cours par le prof.","mc":"foie · acétyl-CoA · HMG-CoA réductase"},{"id":"ch1-s0c5","t":"Le régime protéiné : efficace mais risqué","e":"Sans sucres ni graisses, les acides aminés sont utilisés directement et on stocke peu de graisse : le régime fait fondre la masse grasse. Mais on suractive le cycle de l'urée : surcharge rénale.","mc":"AA utilisés directement · peu de stockage · masse grasse ↓ · cycle de l'urée suractivé · surcharge rénale"},{"id":"ch1-s0c5w","t":"Pourquoi un régime hyperprotéiné peut-il abîmer les reins ?","e":"La dégradation massive des acides aminés libère beaucoup d'azote (NH₃) que le foie transforme en urée via le cycle de l'urée ; le rein doit éliminer toute cette urée.","mc":"dégradation des AA · azote (NH₃) · urée (foie) · élimination rénale · charge rénale"},{"id":"ch1-s0c6","t":"Les corps cétoniques : carburant de relais","e":"En jeûne, l'acétyl-CoA issu des AG déborde le cycle de Krebs : le foie le transforme en β-hydroxybutyrate, acétoacétate (et acétone). Ils passent dans le sang et nourrissent muscles, cœur puis cerveau. Ce sont des acides : légère acidose ; en excès (diabète décompensé, jeûne prolongé, alcool) → coma acido-cétonique.","mc":"jeûne · acétyl-CoA déborde Krebs · β-hydroxybutyrate · acétoacétate · acétone · muscles, cœur, cerveau · acidose · coma acido-cétonique"},{"id":"ch1-s0c6w","t":"Pourquoi les acides gras ne peuvent-ils pas refaire du glucose ?","e":"L'acétyl-CoA ne peut pas redonner de pyruvate (la pyruvate déshydrogénase est irréversible). Seul le glycérol des TG peut entrer dans la néoglucogenèse. Les AG donnent donc de l'ATP ou des corps cétoniques, pas du glucose.","mc":"pyruvate déshydrogénase irréversible · acétyl-CoA ≠ pyruvate · seul le glycérol → glucose · AG → ATP ou corps cétoniques"},{"id":"ch1-s1c0","t":"Métabolisme, anabolisme, catabolisme","e":"Métabolisme : ensemble des réactions chimiques catalysées par des enzymes. Anabolisme : synthèses, endergoniques, non spontanées, demandent de l'énergie. Catabolisme : dégradations, exergoniques, spontanées, produisent de l'énergie à stocker sous forme utilisable (ATP).","mc":"Métabolisme: réactions enzymatiques | Anabolisme: synthèses · endergoniques · demandent de l'énergie | Catabolisme: dégradations · exergoniques · produisent de l'ATP"},{"id":"ch1-s1c1","t":"Les transporteurs GLUT","e":"Le glucose entre par diffusion facilitée (selon le gradient). GLUT-1 et 3 : forte affinité, fonctionnent en permanence (cerveau, érythrocytes). GLUT-2 : faible affinité, « senseur » (foie, cellules β du pancréas, intestin). GLUT-4 : muscle et adipocyte, stocké dans des vésicules et envoyé à la membrane sous l'effet de l'insuline.","mc":"diffusion facilitée · GLUT-1 et 3 · GLUT-2 · GLUT-4 · sous l'effet de l'insuline"},{"id":"ch1-s1c1w","t":"Pourquoi le glucose ne ressort-il pas de la cellule après son entrée ?","e":"Il est immédiatement phosphorylé en glucose-6-phosphate (hexokinase), plus polaire, qui ne traverse plus la membrane. Cela maintient aussi une concentration intracellulaire basse de glucose libre, donc le gradient d'entrée.","mc":"hexokinase · glucose-6-phosphate · polaire · ne traverse plus la membrane · gradient d'entrée maintenu"},{"id":"ch1-s1c2","t":"Hexokinase vs glucokinase","e":"Hexokinase (I) : tous les tissus, haute affinité, phosphoryle glucose, fructose, galactose → fourniture de base. Glucokinase (hexokinase IV) : foie et cellules β, faible affinité, glucose uniquement → elle ne travaille vraiment qu'après un repas : senseur et tampon (libération d'insuline, mise en réserve en glycogène).","mc":"Hexokinase (I) · Glucokinase (hexokinase IV) · senseur et tampon"},{"id":"ch1-s1c3","t":"Glycémie normale","e":"À jeun : 0,7-0,9 g/L (3,8-5,1 mmol/L). 5 L de sang ne contiennent que ~5 g de glucose, contre ~400 g stockés en glycogène. Le corps consomme ~160 g de glucose par jour, dont ~120 g pour le cerveau.","mc":"0,7-0,9 g/L à jeun · 3,8-5,1 mmol/L · ~5 g dans le sang · ~400 g en glycogène · ~160 g/j consommés · ~120 g pour le cerveau"},{"id":"ch1-s2c0","t":"Glycolyse : bilan et enzymes-clés","e":"Dans le cytosol de toutes les cellules : glucose → 2 pyruvates + 2 ATP + 2 NADH. Trois étapes irréversibles et régulées : hexokinase, phosphofructokinase-1, pyruvate kinase. Le pyruvate donne du lactate (anaérobie) ou de l'acétyl-CoA (aérobie), carrefour des voies.","mc":"Lieu: cytosol · toutes les cellules | Bilan: 2 pyruvates · 2 ATP · 2 NADH | Étapes irréversibles: hexokinase · phosphofructokinase-1 · pyruvate kinase | Pyruvate: lactate ou acétyl-CoA"},{"id":"ch1-s2c0w","t":"Quelles molécules freinent la glycolyse et lesquelles l'accélèrent ?","e":"Freinent (énergie abondante) : ATP, NADH, citrate. Accélèrent (déficit) : ADP, AMP. C'est la régulation allostérique, à l'échelle de la cellule.","mc":"Freinent: ATP · NADH · citrate | Accélèrent: ADP · AMP | régulation allostérique"},{"id":"ch1-s2c1","t":"Trois niveaux de régulation","e":"1) La cellule : régulation allostérique. 2) L'organe : le foie fournit du glucose aux autres et stocke après un repas. 3) L'organisme : hormones → récepteur → second messager AMPc → protéine kinase A → phosphorylation des enzymes-clés.","mc":"cellule · organe · organisme · AMPc"},{"id":"ch1-s2c2","t":"Glucagon vs insuline sur la glycolyse","e":"Glucagon (hypoglycémie, cellules α) : AMPc ↑ dans le foie → phosphorylation (PFK-2, pyruvate kinase) → glycolyse hépatique arrêtée, le glucose est gardé pour cerveau, GR et muscle. Insuline (hyperglycémie, cellules β) : AMPc ↓ dans foie, muscle et adipocytes → déphosphorylation → glycolyse et stockage.","mc":"Glucagon · foie · Insuline"},{"id":"ch1-s2c2w","t":"Pourquoi dit-on que le glucagon agit surtout sur le foie ?","e":"Son rôle est d'élever la glycémie ; or seule une production hépatique de glucose peut le faire. L'insuline, elle, fait baisser la glycémie en agissant sur de nombreux tissus (foie, muscle, adipocytes).","mc":"glucagon → glycémie ↑ · seul le foie libère du glucose · insuline: foie, muscle, adipocytes"},{"id":"ch1-s2c3","t":"Lactate, LDH et cycle de Cori","e":"En anaérobie (effort intense, érythrocytes), le pyruvate est réduit en lactate par la LDH, ce qui régénère le NAD⁺. Le lactate part au foie, redevient pyruvate puis glucose (néoglucogenèse) : c'est le cycle de Cori. LDH-5 (muscle) : pyruvate → lactate ; LDH-1 (cœur) : lactate → pyruvate.","mc":"anaérobie · LDH · pyruvate → lactate · NAD⁺ régénéré · cycle de Cori · néoglucogenèse hépatique · LDH-5 muscle · LDH-1 cœur"},{"id":"ch1-s2c3w","t":"Pourquoi une LDH sanguine élevée a-t-elle un intérêt clinique ?","e":"La LDH est intracellulaire : elle monte dans le sang quand des cellules sont détruites (hémolyse, infarctus, atteinte hépatique ou musculaire, cancers à renouvellement rapide comme les lymphomes). Attention au faux positif d'un tube hémolysé.","mc":"LDH intracellulaire · lyse cellulaire · hémolyse · infarctus · foie, muscle · lymphomes · faux positif (tube hémolysé)"},{"id":"ch1-s2c4","t":"Cycle de Krebs : bilan","e":"Dans la mitochondrie, chaque pyruvate → acétyl-CoA (pyruvate déshydrogénase, irréversible) → cycle : par glucose, 6 CO₂, 4 ATP (2 glycolyse + 2 GTP), 2 FADH₂ et 10 NADH, à réoxyder par la chaîne respiratoire.","mc":"mitochondrie · pyruvate déshydrogénase (irréversible) · acétyl-CoA · 6 CO₂ · 4 ATP (dont 2 GTP) · 10 NADH · 2 FADH₂ · chaîne respiratoire"},{"id":"ch1-s2c5","t":"Voie des pentoses phosphates : deux rôles","e":"Dans toutes les cellules : 1) ribose-5-phosphate pour les nucléotides ; 2) NADPH/H⁺ pour les biosynthèses réductrices (AG, cholestérol, stéroïdes : foie, tissu adipeux, glande mammaire, surrénales, gonades) et la protection : réduction du glutathion dans les GR, hydroxylations de détoxification dans le foie.","mc":"ribose-5-phosphate · NADPH/H⁺ · glutathion"},{"id":"ch1-s2c5w","t":"Pourquoi la voie des pentoses est-elle vitale pour le globule rouge ?","e":"Le GR n'a plus de noyau (pas besoin de ribose) mais il est exposé à l'oxygène : le NADPH qu'elle produit sert à régénérer le glutathion réduit, qui protège l'hémoglobine et la membrane contre l'oxydation (repris au chapitre 4).","mc":"GR sans noyau (pas besoin de ribose) · exposé à l'O₂ · NADPH · glutathion réduit · protection de l'hémoglobine et de la membrane"},{"id":"ch1-s2c6","t":"Glycogène : synthèse, dégradation, régulation","e":"Polymère ramifié de glucose (α-1→4, branches α-1→6 tous les ~15 résidus). Synthèse via l'UDP-glucose par la glycogène synthase ; dégradation par la glycogène phosphorylase. Glucagon (foie) et adrénaline (muscle) : AMPc ↑ → phosphorylase activée, synthase inhibée → glycémie ↑. Insuline : l'inverse. Dans le muscle aussi : AMP et Ca²⁺-calmoduline activent la phosphorylase.","mc":"glycogène synthase · glycogène phosphorylase · Glucagon (foie) et adrénaline (muscle) · Insuline"},{"id":"ch1-s2c7","t":"Néoglucogenèse","e":"Synthèse de glucose à partir du lactate, du glycérol et des acides aminés (alanine), après ~18 h de jeûne. Foie (90 %), rein, intestin. Elle contourne les 3 étapes irréversibles de la glycolyse avec 4 enzymes : pyruvate carboxylase, PEP carboxykinase, fructose-1,6-bisphosphatase, glucose-6-phosphatase. La pyruvate carboxylase ne travaille qu'en présence d'acétyl-CoA (assez d'énergie). Le glucagon l'active.","mc":"Substrats: lactate · glycérol · alanine | Quand: ~18 h de jeûne | Où: foie (90 %) · rein · intestin | Enzymes: pyruvate carboxylase · PEP carboxykinase · fructose-1,6-bisphosphatase · glucose-6-phosphatase"},{"id":"ch1-s3c0","t":"Les lipides et leur transport","e":"AG saturés et insaturés (oméga-3 : EPA, DHA ; acide arachidonique C20:4), TG, phospholipides, isoprénoïdes, cholestérol. Insolubles dans le plasma : transportés liés à l'albumine (AG) ou dans des lipoprotéines (chylomicrons, VLDL, LDL, HDL, par densité croissante). Détails au chapitre 4.","mc":"Lipides: AG saturés/insaturés · oméga-3 (EPA, DHA) · acide arachidonique · TG · phospholipides · cholestérol | Transport: albumine (AG) · lipoprotéines (chylomicrons, VLDL, LDL, HDL)"},{"id":"ch1-s3c1","t":"Digestion des graisses","e":"Dans le duodénum, les sels biliaires (dérivés amphiphiles du cholestérol) émulsionnent les graisses ; les lipases pancréatiques hydrolysent les TG (positions 1 et 3) en 2-monoacylglycérol + AG ; micelles absorbées par l'intestin.","mc":"duodénum · sels biliaires · émulsion · lipases pancréatiques · 2-monoacylglycérol + AG · micelles"},{"id":"ch1-s3c2","t":"β-oxydation","e":"Activation en acyl-CoA dans le cytosol (coût 2 ATP) → passage dans la mitochondrie grâce à la carnitine → coupure par blocs de 2 C en acétyl-CoA. Valeurs du cours : un tour = 1 FADH₂ + 1 NADH + 1 acétyl-CoA ≈ 17 ATP ; palmitate (C16) ≈ 129 ATP. Pas de β-oxydation dans les GR.","mc":"acyl-CoA (2 ATP) · carnitine · mitochondrie · blocs de 2 C · acétyl-CoA · ~17 ATP par tour · palmitate ≈ 129 ATP · pas dans les GR"},{"id":"ch1-s3c3","t":"Synthèse des acides gras","e":"Dans le cytosol (surtout le foie) à partir de l'acétyl-CoA sorti de la mitochondrie sous forme de citrate. Enzyme-clé : acétyl-CoA carboxylase (→ malonyl-CoA), activée par le citrate et l'insuline, inhibée par l'AMP, l'adrénaline et le glucagon. Produit : palmitate (C16), avec du NADPH.","mc":"acétyl-CoA carboxylase · insuline · adrénaline · glucagon"},{"id":"ch1-s3c4","t":"Triglycérides : stockage et lipolyse","e":"Synthèse à partir du glycérol-3-phosphate (issu du DHAP de la glycolyse) : il faut du glucose pour stocker les graisses. Lipolyse dans l'adipocyte par la lipase hormono-sensible, activée par adrénaline et glucagon (AMPc), inhibée par l'insuline. Réserves ≈ 12 % du poids.","mc":"glycérol-3-phosphate (DHAP) · il faut du glucose pour stocker · lipase hormono-sensible · adrénaline, glucagon (AMPc) ↑ · insuline ↓ · ~12 % du poids"},{"id":"ch1-s3c5","t":"Cholestérol : synthèse et régulation","e":"3 acétyl-CoA → HMG-CoA → (HMG-CoA réductase, enzyme-clé, NADPH) mévalonate → isoprènes → squalène → cholestérol (27 C). Rétro-inhibée par le mévalonate et le cholestérol ; inhibée par le glucagon, stimulée par l'insuline. Estérifié pour être stocké (ACAT dans les cellules, LCAT dans le sang). Trois rôles : membranes, acides biliaires, hormones stéroïdes.","mc":"Voie: 3 acétyl-CoA · HMG-CoA · HMG-CoA réductase (NADPH) · mévalonate · squalène · cholestérol (27 C) | Régulation: rétro-inhibition · glucagon ↓ · insuline ↑ | Rôles: membranes · acides biliaires · hormones stéroïdes"},{"id":"ch1-s3c5w","t":"Quels médicaments ciblent l'enzyme-clé de la synthèse du cholestérol ?","e":"Les statines, inhibiteurs de la HMG-CoA réductase (lien avec le séminaire dyslipidémies et athérosclérose).","mc":"statines · inhibiteurs de la HMG-CoA réductase · dyslipidémies"},{"id":"ch1-s4c0","t":"Pas de réserve d'acides aminés","e":"20 AA dont 8 essentiels. Pas de stock comme le glycogène ou les TG : les seules « réserves » sont les protéines, surtout musculaires, mobilisées en cas de jeûne. Les AA circulent librement dans le plasma ; ~400 g de protéines synthétisés par jour.","mc":"20 AA · 8 essentiels · pas de stock · protéines musculaires mobilisées au jeûne · ~400 g/j synthétisés"},{"id":"ch1-s4c1","t":"Transamination et transaminases","e":"Transfert du groupe aminé d'un AA vers un α-cétoacide, avec le phosphate de pyridoxal (vitamine B6). ALAT (alanine ↔ pyruvate, surtout cytoplasmique) et ASAT (aspartate ↔ oxaloacétate, surtout mitochondriale) : marqueurs des lésions hépatiques.","mc":"phosphate de pyridoxal (vitamine B6) · ALAT · ASAT"},{"id":"ch1-s4c1w","t":"Que signifie une ALAT augmentée sans ASAT ?","e":"L'ALAT est surtout cytoplasmique : sa hausse seule indique une lésion hépatocytaire où les mitochondries sont encore épargnées. Si l'ASAT (mitochondriale) monte aussi, la lésion est plus grave.","mc":"ALAT cytoplasmique · lésion hépatocytaire · mitochondries épargnées · ASAT (mitochondriale) = lésion plus grave"},{"id":"ch1-s4c2","t":"Ammoniac, glutamine, alanine","e":"Le NH₃ est très toxique : la périphérie l'envoie au foie sous forme de glutamine (AA le plus abondant du plasma). Le muscle exporte de l'alanine vers le foie pour la néoglucogenèse (2e AA le plus abondant). Le glutamate est le pivot (glutamate déshydrogénase).","mc":"NH₃ toxique · glutamine (AA le plus abondant) · alanine du muscle → néoglucogenèse · glutamate pivot · glutamate déshydrogénase"},{"id":"ch1-s4c3","t":"Cycle de l'urée","e":"Uniquement dans le foie ; urée éliminée par le rein. Coût : 3 ATP par urée. Mitochondrie : NH₃ + CO₂ → carbamoyl-phosphate, + ornithine → citrulline. Cytosol : + aspartate → argininosuccinate → fumarate + arginine → urée + ornithine.","mc":"foie uniquement · 3 ATP par urée · mitochondrie: carbamoyl-phosphate · citrulline · cytosol: argininosuccinate · arginine → urée + ornithine · élimination rénale"},{"id":"ch1-s4c4","t":"Amines biogènes","e":"Décarboxylation d'AA → amines actives, dégradées par les MAO : GABA (du glutamate), histamine (de l'histidine), dopamine (de la L-DOPA) puis noradrénaline et adrénaline, sérotonine (du 5-hydroxytryptophane) puis mélatonine. Revues en détail aux chapitres 2.9 et 2.10, et dans la liste des molécules à dessiner.","mc":"MAO · GABA · histamine · dopamine · sérotonine"},{"id":"ch1-s5c0","t":"Principe","e":"Les NADH et FADH₂ de Krebs et de la β-oxydation cèdent leurs électrons à 4 complexes de la membrane interne mitochondriale (I NADH-ubiquinone réductase, II succinate-ubiquinone réductase, III ubiquinone-cytochrome c réductase, IV cytochrome oxydase), avec le coenzyme Q et le cytochrome c comme navettes. L'accepteur final est l'O₂. Le gradient de protons fait tourner l'ATP synthase (complexe V).","mc":"NADH · FADH₂ · complexes I à IV · membrane interne · coenzyme Q · cytochrome c · O₂ accepteur final · gradient de H⁺ · ATP synthase (complexe V)"},{"id":"ch1-s5c1","t":"Les poisons du complexe IV","e":"CO (combustion incomplète, inodore), H₂S (odeur → intoxication rare), cyanures (HCN, KCN ; incendies de plastiques) bloquent le fer de la cytochrome oxydase → plus d'ATP → mort cellulaire rapide. Traitement du cyanure : thiosulfate de sodium.","mc":"CO · H₂S · cyanures · thiosulfate de sodium"},{"id":"ch2a-s0c0","t":"Critères d'un neurotransmetteur","e":"Produit dans un neurone, retrouvé dans les boutons terminaux, libéré à l'arrivée d'un potentiel d'action, effet sur le neurone post-synaptique, puis inactivé (recapture ou dégradation). Plus de 60 molécules. 50 % des synapses du SNC sont glutamatergiques.","mc":"produit par un neurone · boutons terminaux · potentiel d'action · effet post-synaptique · inactivé (recapture, dégradation) · 50 % glutamatergiques"},{"id":"ch2a-s0c1","t":"Les 4 étapes de la transmission synaptique","e":"1) Synthèse locale dans le bouton (ex. choline acétyltransférase : choline + acétyl-CoA → acétylcholine ; les neuropeptides, eux, sont faits dans le corps cellulaire). 2) Excrétion : entrée de Ca²⁺ → exocytose des vésicules. 3) Fixation au récepteur → cascade. 4) Inactivation : enzyme (acétylcholinestérase) ou recapture.","mc":"Synthèse · Excrétion · Fixation · Inactivation"},{"id":"ch2a-s0c1w","t":"Comment l'acétylcholine fait-elle contracter le muscle ?","e":"À la jonction neuromusculaire, elle se fixe sur les récepteurs nicotiniques (5 sous-unités, récepteur canal) → entrée de Na⁺ → dépolarisation de la fibre → contraction. L'acétylcholinestérase en hydrolyse environ la moitié ; la choline est recaptée.","mc":"jonction neuromusculaire · récepteur nicotinique · Na⁺ entre · dépolarisation · contraction · acétylcholinestérase · choline recaptée"},{"id":"ch2a-s0c2","t":"D'où vient la sélectivité d'une hormone ?","e":"« Notre système hormonal n'est pas en mesure d'envoyer un messager ayant une destination précise » : la sélectivité vient de la répartition des récepteurs. Une même hormone, un même second messager (AMPc) peuvent avoir des effets opposés selon la cellule. Les mêmes récepteurs à différents endroits expliquent les effets indésirables des médicaments.","mc":"pas de destination précise · répartition des récepteurs · même messager, effets opposés · effets indésirables"},{"id":"ch2a-s0c2w","t":"Pourquoi donne-t-on de la L-DOPA (et pas de la dopamine) avec un inhibiteur périphérique dans la maladie de Parkinson ?","e":"On veut augmenter la dopamine dans le SNC, mais les récepteurs dopaminergiques existent aussi en périphérie (tube digestif : nausées, vomissements). La dopamine ne passe pas la barrière hémato-encéphalique ; la L-DOPA oui. L'inhibiteur périphérique limite sa transformation hors du cerveau, donc les effets indésirables (repris en 2.10).","mc":"dopamine dans le SNC · récepteurs périphériques (nausées) · dopamine ne passe pas la BHE · L-DOPA passe · inhibiteur périphérique"},{"id":"ch2a-s0c3","t":"Amplification du signal","e":"Une molécule d'hormone active un récepteur, qui active de nombreuses molécules effectrices : la transduction amplifie le signal (cascade).","mc":"une hormone · un récepteur · nombreuses molécules effectrices · cascade · amplification"},{"id":"ch2a-s1c0","t":"Stress aigu vs stress chronique","e":"L'exemple du prof : recevoir sa copie d'examen = stress immédiat → adrénaline (hydrophile, effet en secondes). La période de blocus = stress qui s'installe → cortisol (lipophile, effet lent par les gènes). Le cortisol mesuré en fin de session est plus élevé.","mc":"Stress aigu: adrénaline · hydrophile · secondes | Stress chronique: cortisol · lipophile · gènes · lent"},{"id":"ch2a-s1c0w","t":"Pourquoi l'adrénaline agit-elle en quelques secondes et le cortisol en quelques heures ?","e":"L'adrénaline (hydrophile) agit via un récepteur membranaire et un second messager qui phosphoryle des enzymes déjà présentes. Le cortisol (lipophile) agit sur un récepteur intracellulaire qui modifie l'expression de gènes : il faut synthétiser de nouvelles protéines.","mc":"Adrénaline: récepteur membranaire · second messager · enzymes existantes | Cortisol: récepteur intracellulaire · gènes · nouvelles protéines"},{"id":"ch2a-s1c1","t":"Les 4 types de récepteurs","e":"1) Récepteurs-enzymes (tyrosine kinase : insuline ; guanylate cyclase : ANP). 2) Récepteurs canaux ioniques (nicotinique, GABA-A). 3) Récepteurs couplés aux protéines G (le plus grand groupe : adrénaline, glucagon). 4) Récepteurs intracellulaires (cytoplasmiques ou nucléaires : stéroïdes, hormones thyroïdiennes).","mc":"Récepteurs-enzymes · Récepteurs canaux ioniques · Récepteurs couplés aux protéines G · Récepteurs intracellulaires"},{"id":"ch2a-s1c2","t":"Comment les hormones modifient le métabolisme","e":"Soit par phosphorylation/déphosphorylation des enzymes-clés (hydrophiles), soit en modifiant la quantité d'enzyme synthétisée (lipophiles). Exemple spécialisé : l'ADH fait insérer des aquaporines dans les cellules du tubule rénal.","mc":"phosphorylation/déphosphorylation · quantité · aquaporines"},{"id":"ch2a-s2c0","t":"Hormones peptidiques","e":"Séquence codée par l'ADN ; traduction dans les ribosomes puis le RE rugueux ; modifications dans le RE et le Golgi ; stockage en vésicules ; sécrétion au signal (souvent ↑ Ca²⁺ intracellulaire) ; transport libre dans le sang ; récepteur membranaire.","mc":"ADN · ribosomes · RE rugueux · Golgi · vésicules · sécrétion (Ca²⁺) · transport libre · récepteur membranaire"},{"id":"ch2a-s2c1","t":"Le noyau stérane","e":"Base de toutes les hormones stéroïdes : trois cycles à 6 carbones et un cycle à 5 carbones (dessiné au tableau). Le cholestérol (27 C) est le point de départ des hormones sexuelles, des glucocorticoïdes, des minéralocorticoïdes et de la vitamine D.","mc":"3 cycles à 6 C · 1 cycle à 5 C · cholestérol (27 C) · hormones sexuelles · glucocorticoïdes · minéralocorticoïdes · vitamine D"},{"id":"ch2a-s2c1w","t":"Que se passe-t-il après la sécrétion d'une hormone stéroïde ?","e":"Pas de stockage (elle diffuse dès sa synthèse) ; transport sanguin lié à des protéines (albumine ou protéines spécifiques) ; traversée de la membrane ; récepteur intracellulaire ; métabolisme hépatique (biotransformation puis conjugaison) avant élimination.","mc":"pas de stockage · protéines de transport · traverse la membrane · récepteur intracellulaire · métabolisme hépatique · conjugaison"},{"id":"ch2a-s2c2","t":"Hormones dérivées d'acides aminés","e":"Souvent de la tyrosine. Les catécholamines (adrénaline, noradrénaline, dopamine) sont hydrophiles (récepteurs membranaires). Les hormones thyroïdiennes (T3, T4) sont les seules lipophiles du groupe : récepteurs intracellulaires.","mc":"tyrosine · catécholamines hydrophiles · récepteurs membranaires · T3, T4 lipophiles · récepteurs intracellulaires"},{"id":"ch2a-s2c3","t":"Qui sécrète quoi (à connaître)","e":"Hypothalamus : ocytocine, vasopressine (ADH), CRH, GnRH, GHRH, somatostatine, TRH, dopamine. Adénohypophyse : ACTH, FSH, LH, TSH, GH, prolactine, MSH. Corticosurrénales : aldostérone, cortisol, androgènes. Médullosurrénales : adrénaline, noradrénaline. Thyroïde : T3, T4, calcitonine. Parathyroïdes : PTH. Pancréas : insuline (β), glucagon (α), somatostatine, PP. Ovaires : œstrogènes, progestérone. Testicules : testostérone. Épiphyse : mélatonine.","mc":"Hypothalamus · Adénohypophyse · Corticosurrénales · Médullosurrénales · Thyroïde · Parathyroïdes · Pancréas · Ovaires · Testicules · Épiphyse"},{"id":"ch2a-s3c0","t":"Antéhypophyse","e":"Contrôlée par l'hypothalamus via des libérines (releasing hormones, stimulent) et des statines (inhibiting hormones) déversées dans le système porte hypophysaire. Elle sécrète des stimulines qui agissent sur une autre glande, sauf la GH et la prolactine qui agissent directement.","mc":"libérines · statines · système porte · GH et la prolactine"},{"id":"ch2a-s3c1","t":"Post-hypophyse (neurohypophyse)","e":"Projection de l'hypothalamus : elle ne fabrique rien, elle stocke et libère l'ocytocine et la vasopressine (ADH), produites par les noyaux paraventriculaire et supraoptique de l'hypothalamus et descendues le long des axones.","mc":"stocke et libère · ocytocine · vasopressine (ADH)"},{"id":"ch2a-s3c2","t":"Rétrocontrôle négatif","e":"Pour que le système ne s'emballe pas, les hormones périphériques (ex. cortisol) freinent l'hypothalamus et l'hypophyse quand leur concentration dépasse un seuil. Exception : les œstrogènes peuvent exercer un rétrocontrôle positif selon la phase du cycle (chapitre 2.7).","mc":"hormones périphériques freinent hypothalamus et hypophyse · seuil · cortisol · exception: œstrogènes (rétrocontrôle positif)"},{"id":"ch2a-s3c2w","t":"Pourquoi un traitement prolongé aux corticoïdes peut-il donner une insuffisance surrénalienne à l'arrêt ?","e":"Le cortisol exogène freine en permanence CRH et ACTH : les surrénales ne sont plus stimulées et s'atrophient. À l'arrêt brutal, elles ne produisent plus assez de cortisol (repris en 2.3).","mc":"cortisol exogène · CRH et ACTH freinées · atrophie des surrénales · arrêt brutal · insuffisance surrénalienne"},{"id":"ch2a-s4c0","t":"Tyrosine kinases et médicaments","e":"Une kinase transfère un phosphate de l'ATP sur une tyrosine. Cibles pharmacologiques : pour information imatinib (GLIVEC®, inhibiteur de la tyrosine kinase BCR-ABL du chromosome Philadelphie, leucémie myéloïde chronique) ; trastuzumab (HER2, cancer du sein).","mc":"kinase · phosphate de l'ATP sur une tyrosine · imatinib (BCR-ABL) · trastuzumab (HER2)"},{"id":"ch2a-s4c1","t":"Guanylate cyclase, NO et GMPc","e":"Deux formes : membranaire (activée par l'ANP de l'oreillette) et soluble (activée par le NO qui traverse les membranes). Elles forment du GMPc à partir du GTP → protéines kinases → vasodilatation. Le GMPc est dégradé par les phosphodiestérases (PDE).","mc":"membranaire · soluble · NO · GMPc · phosphodiestérases (PDE)"},{"id":"ch2a-s4c1w","t":"Comment agit le sildénafil (VIAGRA®) et pourquoi est-il contre-indiqué en cas de trouble cardiaque ?","e":"C'est un inhibiteur de la PDE5, présente surtout dans les corps caverneux : le GMPc n'est plus dégradé, la vasodilatation locale (érection) est prolongée. La sélectivité n'est pas parfaite : effets cardiovasculaires possibles, d'où la contre-indication (comme le tadalafil, le vardénafil).","mc":"inhibiteur de la PDE5 · corps caverneux · GMPc ↑ · vasodilatation · érection · effets cardiovasculaires · contre-indication"},{"id":"ch2a-s4c2","t":"Caféine et théophylline","e":"Inhibiteurs compétitifs non spécifiques des phosphodiestérases (11 types) : l'AMPc dure plus longtemps. Le prof : beaucoup de café → inhibition générale des PDE → migraines possibles.","mc":"caféine · théophylline · inhibiteurs compétitifs non spécifiques des PDE · AMPc prolongé · migraines"},{"id":"ch2a-s5c0","t":"GABA-A : la cible des calmants","e":"5 sous-unités autour d'un canal à Cl⁻. Il est modulé allostériquement : benzodiazépines, barbituriques, alcool, certains anesthésiques le rendent plus sensible au GABA → le canal s'ouvre davantage → beaucoup de Cl⁻ entre → la cellule « s'endort » (sédation, effet anxiolytique, sommeil).","mc":"5 sous-unités · canal Cl⁻ · modulation allostérique · benzodiazépines · barbituriques · alcool · sédation · anxiolyse"},{"id":"ch2a-s5c0w","t":"Pourquoi l'entrée de Cl⁻ diminue-t-elle l'excitabilité du neurone ?","e":"Le Cl⁻ est chargé négativement : en entrant, il rend l'intérieur encore plus négatif (hyperpolarisation). Le potentiel de membrane s'éloigne du seuil : la cellule est plus difficile à dépolariser. « C'est purement une question de charge positive et négative. »","mc":"Cl⁻ négatif · intérieur plus négatif · hyperpolarisation · loin du seuil · moins excitable"},{"id":"ch2a-s6c0","t":"AMPc : le signal de faim","e":"L'adénylate cyclase transforme l'ATP en AMPc, « signal de faim (F-A-I-M) ou de stress ». Il se lie aux 2 sous-unités régulatrices de la PKA (4 AMPc) qui libèrent les 2 sous-unités catalytiques → phosphorylation des enzymes-clés (dans le foie : glycolyse inhibée, néoglucogenèse et glycogénolyse activées). Dégradé par les phosphodiestérases en 5'-AMP.","mc":"adénylate cyclase · ATP → AMPc · signal de faim ou de stress · 4 AMPc · PKA · sous-unités catalytiques · phosphorylation · phosphodiestérases"},{"id":"ch2a-s6c0w","t":"Pourquoi la toxine cholérique donne-t-elle des diarrhées massives ?","e":"pour information Elle bloque l'adénylate cyclase des entérocytes en position active : AMPc élevé en permanence → sécrétion excessive d'ions dans l'intestin → l'eau suit.","mc":"toxine cholérique · adénylate cyclase bloquée active · AMPc permanent · sécrétion d'ions · l'eau suit · diarrhées"},{"id":"ch2a-s6c1","t":"Phospholipase C, IP3, DAG, calcium","e":"Via αq, la PLC coupe le PIP2 de la membrane en IP3 (hydrophile, diffuse dans le cytoplasme, ouvre les canaux Ca²⁺ du RE) et DAG (lipophile, reste dans la membrane). Le Ca²⁺ (« troisième messager ») + le DAG activent la protéine kinase C. Le Ca²⁺ se lie aussi à la calmoduline. Effets : contraction des muscles lisses et cardiaque, sécrétions, libération de neurotransmetteurs.","mc":"αq · IP3 · DAG · Ca²⁺ · protéine kinase C · calmoduline"},{"id":"ch2a-s6c2","t":"La variété des ligands","e":"Photons (rhodopsine), ions, odeurs et goûts, acides aminés (glutamate, GABA-B), amines (acétylcholine muscarinique, adrénaline, dopamine, histamine, sérotonine, mélatonine), nucléotides, lipides (prostaglandines, leucotriènes, thromboxane), peptides. Le prof utilise des synonymes : RCPG = récepteur métabotropique ; récepteur canal = ionotropique. « Un examen peut taper des synonymes. »","mc":"synonymes · métabotropique · ionotropique"},{"id":"ch2a-s7c0","t":"Fonctionnement","e":"Le récepteur attend dans le cytoplasme, inactivé par une protéine de choc thermique HSP90 (ou directement dans le noyau). L'hormone lipophile se lie → HSP90 se détache → le complexe migre dans le noyau → se fixe sur l'HRE (hormone response element) de l'ADN → transcription ↑ ou ↓. Effet lent mais durable.","mc":"cytoplasme · HSP90 · HRE"},{"id":"ch2a-s7c0w","t":"Comment agit le tamoxifène ?","e":"pour information Ligand du récepteur intracellulaire des œstrogènes : effet anti-œstrogène sur le sein (cancers hormono-dépendants), effet œstrogène sur l'endomètre et l'os.","mc":"tamoxifène · récepteur des œstrogènes · anti-œstrogène sur le sein · œstrogène sur l'endomètre et l'os"},{"id":"ch2a-s7c1","t":"PPAR : α foie, γ tissu adipeux","e":"Récepteurs nucléaires activés par les AG et leurs dérivés, qui s'associent au RXR et agissent sur les PPRE. PPAR-α : surtout le foie (moyen mnémotechnique du prof : « alpha-foie ») → cible des fibrates (hypolipémiants). PPAR-γ : surtout le tissu adipeux → cible des glitazones (thiazolidinediones, antidiabétiques). PPAR-β/δ : ubiquitaires.","mc":"RXR · PPAR-α · foie · fibrates · PPAR-γ · tissu adipeux · glitazones"},{"id":"ch2b-s0c0","t":"Deux phases, deux hormones","e":"Phase absorptive (après le repas) : une seule hormone, l'insuline, sur foie, muscle et tissu adipeux → glycogène et lipides. Phase post-absorptive : le glucagon maintient la glycémie entre 0,7 et 0,9 g/L en agissant sur le foie uniquement (glycogénolyse, néoglucogenèse, β-oxydation et corps cétoniques). Adrénaline, cortisol et hormones thyroïdiennes s'ajoutent en situation de stress ou de besoin accru.","mc":"Phase absorptive · insuline · Phase post-absorptive · glucagon · foie uniquement"},{"id":"ch2b-s1c0","t":"Structure","e":"Hormone peptidique de 51 acides aminés : deux chaînes A et B reliées par 2 ponts disulfures, plus un troisième à l'intérieur de la chaîne A. Produite par les cellules β des îlots de Langerhans (65-80 %) ; α = glucagon (15-20 %), δ = somatostatine, PP = polypeptide pancréatique.","mc":"peptidique de 51 acides aminés · 2 ponts disulfures · un troisième · β"},{"id":"ch2b-s1c1","t":"Biosynthèse","e":"1) Pré-pro-insuline dans les ribosomes, avec une séquence signal hydrophobe vers le RE. 2) Dans le RE : le peptide signal est coupé, les ponts disulfures se forment → pro-insuline. 3) Golgi puis vésicules : des endopeptidases coupent le peptide C → insuline, stockée avec du zinc. 4) Hyperglycémie → libération de l'insuline et du peptide C.","mc":"Pré-pro-insuline · pro-insuline · peptide C · insuline · zinc"},{"id":"ch2b-s1c1w","t":"À quoi sert le dosage du peptide C ?","e":"Il est sécrété en même temps que l'insuline endogène, alors que l'insuline injectée n'en contient pas. On l'utilise donc comme marqueur de la sécrétion propre du pancréas chez un diabétique traité par insuline.","mc":"peptide C · sécrété avec l'insuline endogène · absent de l'insuline injectée · marqueur de la sécrétion propre"},{"id":"ch2b-s1c2","t":"Récepteur et transduction","e":"Récepteur à activité tyrosine kinase : 2 chaînes α extracellulaires, 2 chaînes β transmembranaires ; autophosphorylation puis phosphorylation de l'IRS-1. Deux voies : métabolique (activation d'une phosphodiestérase → AMPc ↓ → enzymes déphosphorylées) et croissance (protéine G RAS → MAP kinases → prolifération). pour information des mutations de RAS sont fréquentes dans les tumeurs.","mc":"tyrosine kinase · IRS-1 · métabolique · AMPc ↓ · croissance · RAS"},{"id":"ch2b-s1c3","t":"Effets de l'insuline","e":"Seule hormone hypoglycémiante et principale hormone anabolisante. Glucides : translocation de GLUT-4 (muscle, tissu adipeux, dépendants de l'insuline), glycogène ↑, glycolyse ↑, néoglucogenèse ↓. Lipides : seule hormone qui maintient les réserves lipidiques (lipogenèse ↑ via pyruvate déshydrogénase et acétyl-CoA carboxylase, lipolyse ↓). Protéines : captation des AA et synthèse protéique ↑.","mc":"Seule hormone hypoglycémiante · GLUT-4 · seule hormone qui maintient les réserves lipidiques"},{"id":"ch2b-s1c3w","t":"Pourquoi faut-il surveiller la kaliémie sous insuline ?","e":"L'insuline fait entrer le K⁺ dans les cellules : risque d'hypokaliémie. À l'inverse, on l'utilise (avec du glucose) pour traiter une hyperkaliémie menaçante.","mc":"insuline fait entrer le K⁺ · hypokaliémie · traitement de l'hyperkaliémie (insuline + glucose)"},{"id":"ch2b-s1c4","t":"Régulation de la sécrétion","e":"Stimulus principal : la glycémie. Renforcent : AG et corps cétoniques, hormones gastro-intestinales (incrétines, préparation au repas), acétylcholine (stimulation vagale). Inhibent : somatostatine, adrénaline (récepteurs α2), le jeûne. Demi-vie : 5 minutes ; dégradée par le foie et le rein.","mc":"glycémie · hormones gastro-intestinales · acétylcholine · somatostatine · 5 minutes"},{"id":"ch2b-s2c0","t":"L'antagoniste de l'insuline","e":"Peptide de 29 AA, une seule chaîne, issu du pré-proglucagon, cellules α. Récepteur couplé à une protéine Gs → adénylate cyclase → AMPc (« signal de faim ») → PKA. Récepteurs dans le foie : glycogénolyse (phosphorylase activée) et néoglucogenèse (fructose-1,6-bisphosphatase activée) → glycémie ↑.","mc":"29 AA, une seule chaîne · α · couplé à une protéine Gs · dans le foie"},{"id":"ch2b-s2c0w","t":"Insuline vs glucagon : quelle différence de récepteur ?","e":"Insuline : récepteur-enzyme à activité tyrosine kinase, sur foie, muscle et tissu adipeux. Glucagon : RCPG Gs (AMPc ↑), sur le foie seulement.","mc":"Insuline: tyrosine kinase · foie, muscle, tissu adipeux | Glucagon: RCPG Gs · AMPc · foie seul"},{"id":"ch2b-s2c1","t":"Régulation et usage","e":"Stimulus principal : l'hypoglycémie. Renforcent : AG ↓, hormone de croissance (« sans glucose, pas de croissance »), système sympathique. Inhibent : somatostatine, insuline, hyperglycémie. Demi-vie 5 min (foie). En thérapeutique : hypoglycémie sévère. Sa séquence est identique chez l'homme, le bœuf et le porc.","mc":"Stimule: hypoglycémie · AG ↓ · GH · sympathique | Inhibe: somatostatine · insuline · hyperglycémie | demi-vie 5 min · traitement de l'hypoglycémie sévère"},{"id":"ch2b-s3c0","t":"Fight or flight","e":"Sécrétée par la médullosurrénale (80 % adrénaline, 20 % noradrénaline) lors du stress aigu, sur ordre du sympathique (cellules chromaffines = neurones post-ganglionnaires ; acétylcholine sur récepteurs nicotiniques). Elle mobilise le glucose et les AG, accélère le cœur, dilate les bronches et redistribue le sang vers les muscles.","mc":"médullosurrénale · 80 % adrénaline · 20 % noradrénaline · stress aigu · sympathique · cellules chromaffines · glucose et AG mobilisés · cœur ↑ · bronchodilatation"},{"id":"ch2b-s3c0w","t":"Pourquoi une hypoglycémie s'accompagne-t-elle de tachycardie et de sueurs ?","e":"L'hypoglycémie déclenche une sécrétion d'adrénaline (contre-régulation) : effet β1 sur le cœur (tachycardie, palpitations) et activation sympathique (sueurs, tremblements).","mc":"hypoglycémie · adrénaline (contre-régulation) · β1 · tachycardie · palpitations · sueurs · tremblements"},{"id":"ch2b-s3c1","t":"Noradrénaline vs adrénaline","e":"La noradrénaline n'agit pratiquement pas sur les récepteurs β2 (le méthyle de l'adrénaline compte pour la reconnaissance) : pas d'effet métabolique notable, surtout vasoconstrictrice (α1). C'est le neurotransmetteur du sympathique post-ganglionnaire.","mc":"noradrénaline · peu d'effet β2 · méthyle de l'adrénaline · vasoconstriction (α1) · sympathique post-ganglionnaire"},{"id":"ch2b-s3c2","t":"Dégradation : COMT et MAO","e":"COMT (catéchol-O-méthyltransférase, cytoplasmique, spécifique des catécholamines) méthyle un OH du noyau catéchol ; MAO (monoamine oxydase, membrane externe des mitochondries) fait une désamination oxydative. L'ordre peut s'inverser ; produit final urinaire : acide vanillylmandélique (acide 3-méthoxy-4-hydroxymandélique).","mc":"COMT · MAO · acide vanillylmandélique"},{"id":"ch2b-s3c2w","t":"Comment agissent l'entacapone et les IMAO ?","e":"Entacapone et tolcapone inhibent la COMT : la dopamine (issue de la L-DOPA) est moins dégradée → antiparkinsoniens. Les IMAO bloquent la MAO → plus de monoamines (antidépresseurs ; IMAO-B dans Parkinson).","mc":"entacapone · tolcapone · inhibent la COMT · antiparkinsoniens · IMAO · antidépresseurs · IMAO-B (Parkinson)"},{"id":"ch2b-s3c3","t":"Adrénaline en urgence et phéochromocytome","e":"Adrénaline IM (seringue auto-injectable) dans le choc anaphylactique : vasoconstriction (α1), bronchodilatation (β2). Phéochromocytome : tumeur des cellules chromaffines → excès de catécholamines (HTA, tachycardie, hyperglycémie) ; diagnostic par les métanéphrines urinaires. L'aplasie médullosurrénale ne donne pas de symptômes.","mc":"Anaphylaxie: adrénaline IM · α1 vasoconstriction · β2 bronchodilatation | Phéochromocytome: cellules chromaffines · HTA · tachycardie · métanéphrines urinaires"},{"id":"ch2b-s4c0","t":"Biosynthèse","e":"Dans la zone fasciculée de la corticosurrénale, sous l'ACTH. Le cholestérol arrive du foie par les LDL. Enzyme-clé : 20,22-hydroxylase (NADPH) → prégnénolone, puis progestérone → 17-OH-progestérone → 11-désoxycortisol → cortisol (voie parallèle → corticostérone → aldostérone ; et DHEA → hormones sexuelles). Cortisol : 21 C, cétone en 3 et 20, OH en 11, 17, 21. Cortisone : cortisol oxydé en C11 (11β-hydroxystéroïde déshydrogénase), 7 fois moins sécrétée.","mc":"zone fasciculée · ACTH · LDL · 20,22-hydroxylase · prégnénolone · cortisol · Cortisone"},{"id":"ch2b-s4c1","t":"Rythme et transport","e":"Maximum en fin de nuit (« starter métabolique » du réveil), puis baisse jusqu'au soir. Transporté à plus de 90 % par la transcortine, le reste par l'albumine. Dégradé par le foie (glucuro- ou sulfoconjugaison), éliminé par rein et bile.","mc":"maximum en fin de nuit · transcortine (> 90 %) · albumine · foie (glucuro-, sulfoconjugaison) · rein et bile"},{"id":"ch2b-s4c2","t":"Effets métaboliques : « diabétogène »","e":"Glucides : induction des enzymes de la néoglucogenèse (PEPCK, glucose-6-phosphatase) → glycémie ↑ ; effet permissif (renforce glucagon et adrénaline). Protéines : protéolyse musculaire (AA pour la néoglucogenèse). Lipides : facilite la lipolyse des catécholamines, mais redistribution des graisses (Cushing).","mc":"Glucides · permissif · Protéines · Lipides"},{"id":"ch2b-s4c3","t":"Effets anti-inflammatoires et immunosuppresseurs","e":"1) Induction de la lipocortine qui inhibe la phospholipase A2 → plus d'acide arachidonique → ni prostaglandines (COX) ni leucotriènes (LOX). 2) Inhibition de NF-κB (induction de son inhibiteur IκB, liaison directe) → moins de cytokines (IL-1, IL-2, TNF-α), de COX-2, de molécules d'adhésion. Usage : asthme, allergies, maladies auto-immunes, greffes.","mc":"lipocortine · phospholipase A2 · NF-κB"},{"id":"ch2b-s4c3w","t":"Pourquoi les corticoïdes sont-ils plus puissants que les AINS ?","e":"Les AINS bloquent seulement la COX (prostaglandines). Les corticoïdes agissent en amont (PLA2 : prostaglandines + leucotriènes) et sur la transcription des médiateurs de l'inflammation (NF-κB).","mc":"AINS: COX seule | Corticoïdes: PLA2 (prostaglandines + leucotriènes) · NF-κB · transcription des médiateurs"},{"id":"ch2b-s4c4","t":"Effet minéralocorticoïde","e":"À forte dose, le cortisol se fixe sur le récepteur de l'aldostérone : rétention de Na⁺, volume sanguin ↑, œdèmes, HTA. Les corticoïdes de synthèse sont conçus pour en être dépourvus (relations structure-activité vues en chimie pharmaceutique).","mc":"forte dose · récepteur de l'aldostérone · rétention de Na⁺ · œdèmes · HTA · corticoïdes de synthèse sans effet minéralocorticoïde"},{"id":"ch2b-s4c5","t":"Corticothérapie, Cushing et sevrage","e":"Cushing (surtout iatrogène) : hyperglycémie (« diabète stéroïdien »), fonte musculaire et ostéoporose, redistribution des graisses (visage lunaire, bosse de bison, obésité facio-tronculaire, vergetures), infections, troubles électrolytiques, ulcères. Le cortisol exogène freine l'ACTH → atrophie surrénalienne : l'arrêt doit être progressif (paliers de 10-15 %) ; un arrêt brutal → insuffisance surrénalienne aiguë, potentiellement mortelle.","mc":"Cushing · atrophie surrénalienne · progressif"},{"id":"ch2b-s5c0","t":"Biosynthèse en 3 étapes","e":"1) Piège à iodure : pompe ATP-dépendante des cellules folliculaires (transport actif). 2) Synthèse de la thyréoglobuline (glycoprotéine riche en tyrosines) → exocytose dans la colloïde. 3) Dans la lumière, la peroxydase (TPO) oxyde l'iodure et iode les tyrosines → MIT et DIT ; couplage DIT + DIT = T4, MIT + DIT = T3, toujours sur la thyréoglobuline. Sécrétion : endocytose de la colloïde, protéolyse, libération. ~100 µg/j.","mc":"Piège à iodure · thyréoglobuline · peroxydase · MIT · DIT · DIT + DIT = T4 · MIT + DIT = T3"},{"id":"ch2b-s5c0w","t":"Comment agissent le propylthiouracile et le thiamazol ?","e":"Ce sont des thiourées qui inhibent la peroxydase : plus d'oxydation de l'iodure ni de couplage MIT/DIT → moins de T3/T4. Traitement de l'hyperthyroïdie (Basedow).","mc":"thiourées · propylthiouracile · thiamazol · peroxydase inhibée · moins de T3/T4 · hyperthyroïdie (Basedow)"},{"id":"ch2b-s5c1","t":"T4 produite, T3 active","e":"La thyroïde produit ~20 fois plus de T4 que de T3, mais la T3 est plus active (passe mieux les membranes, plus affine). En périphérie, une désiodase transforme T4 en T3. Transport : surtout la TBG (thyroxine binding globulin), aussi l'albumine. Récepteur dans le noyau (sur l'ADN), contrairement aux stéroïdes.","mc":"T3 est plus active · désiodase · TBG · dans le noyau"},{"id":"ch2b-s5c2","t":"Effets","e":"1) Croissance et développement, surtout du cerveau (myélinisation) : un déficit chez l'embryon donne un retard mental irréversible (crétinisme). 2) Métabolisme de base ↑ : néoglucogenèse, glycolyse, lipolyse, consommation d'O₂, chaleur. 3) Cœur : ↑ des récepteurs β-adrénergiques → tachycardie, force ↑.","mc":"Croissance et développement · crétinisme · Métabolisme de base ↑ · Cœur"},{"id":"ch2b-s5c3","t":"Régulation","e":"Hypothalamus : TRH (stimulée par T3/T4 bas ou le froid intense) → antéhypophyse : TSH → capture d'iode, synthèse, sécrétion et croissance de la thyroïde. Rétrocontrôle négatif de T3/T4 sur TRH et TSH.","mc":"TRH · froid intense · TSH"},{"id":"ch2b-s5c4","t":"Goitre, hyper- et hypothyroïdie","e":"Goitre par carence iodée (besoin ~200 µg/j) : T3/T4 ↓ → TSH ↑ → la thyroïde grossit pour capter plus d'iode. Hyperthyroïdie (2 % des femmes) : adénome sécrétant ou maladie de Basedow (auto-anticorps qui stimulent le récepteur de la TSH) : amaigrissement, tachycardie, nervosité, exophtalmie. Hypothyroïdie (TSH ↑) : carence iodée, thyroïdite de Hashimoto (auto-anticorps destructeurs), iatrogène : ralentissement, prise de poids, frilosité, myxœdème.","mc":"Goitre par carence iodée · Hyperthyroïdie · maladie de Basedow · stimulent le récepteur de la TSH · Hypothyroïdie · thyroïdite de Hashimoto"},{"id":"ch2b-s5c4w","t":"Pourquoi la TSH est-elle élevée dans une hypothyroïdie primaire ?","e":"La thyroïde ne produit plus assez de T3/T4 : le rétrocontrôle négatif disparaît, l'hypophyse augmente la TSH. C'est le dosage de première ligne.","mc":"hypothyroïdie primaire · T3/T4 ↓ · plus de rétrocontrôle négatif · TSH ↑ · dosage de première ligne"},{"id":"ch2c-s0c0","t":"Régulation nerveuse et hormonale","e":"La régulation nerveuse est la plus rapide : le parasympathique (nerf vague, acétylcholine) stimule toutes les fonctions digestives (HCl, enzymes, motilité). La régulation hormonale ajuste ensuite selon le contenu de l'estomac et du duodénum. Toutes ces hormones sont peptidiques (sauf l'histamine, dérivée d'un acide aminé) : récepteurs membranaires.","mc":"nerveuse · parasympathique · acétylcholine · hormonale · peptidiques"},{"id":"ch2c-s1c0","t":"Une même histamine, deux récepteurs","e":"H1 : réactions allergiques (vasodilatation, bronchospasme) → antihistaminiques H1 (allergie). H2 : estomac → sécrétion acide → anti-H2 (ranitidine, famotidine) contre l'hyperacidité. « On est vraiment sur une question de récepteur, mais c'est la même histamine. »","mc":"même histamine · H1: allergie · bronchospasme · antihistaminiques | H2: estomac · acidité · anti-H2 (ranitidine, famotidine)"},{"id":"ch2c-s1
