<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Méthodes de calculs — le jeu</title>
<link rel="manifest" href="jeu-calculs.webmanifest">
<link rel="apple-touch-icon" href="icons/jeu-180.png">
<link rel="icon" type="image/png" href="icons/jeu-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calculs jeu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e1613">
<style>
:root{--bg:#0f1530;--bg2:#18214a;--carte:#ffffff;--encre:#1b2233;--doux:#6b7385;--bleu:#2f8a84;--bleu2:#226b66;--or:#f5b82e;--vert:#16a34a;--vert-p:#dcfce7;--rouge:#e5484d;--rouge-p:#fee2e2;--trait:#e6e8ef;--violet:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#1e1613}html,body{margin:0;min-height:100%}
body{background:transparent;color:#fff;font:16px/1.45 -apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;overscroll-behavior:none}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 20px)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
.ic.f{fill:currentColor;stroke:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .logo{width:42px;height:42px;border-radius:12px;background:#fff}
.top h1{font-size:1.15rem;margin:0;flex:1;line-height:1.15}.top h1 small{display:block;font-weight:400;opacity:.7;font-size:.78rem}
.stats{display:flex;gap:8px;margin:6px 0 14px}
.stat{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.stat b{font-size:1.1rem;display:block;line-height:1}.stat span{font-size:.72rem;opacity:.75}
.stat .ic{width:26px;height:26px}
.flamme{color:#ff8a3d}.etoile{color:var(--or)}.eclair{color:#7dd3fc}
.rang{background:linear-gradient(135deg,#3b5ff0,#7c3aed);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.rang .t{display:flex;justify-content:space-between;font-size:.85rem;opacity:.9}
.barre{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:6px}
.barre i{display:block;height:100%;background:linear-gradient(90deg,#fde68a,#f5b82e);border-radius:99px;transition:width .5s}
.obj{margin-top:8px;font-size:.8rem;opacity:.9;display:flex;gap:6px;align-items:center}
.sect{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:18px 4px 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--carte);color:var(--encre);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mode .ic{width:28px;height:28px;color:var(--bleu2)}
.mode b{font-size:.98rem}.mode small{color:var(--doux);font-size:.76rem;line-height:1.25}
.mode.vedette{grid-column:1/-1;background:linear-gradient(135deg,#f5b82e,#ff8a3d);color:#2a1600}
.mode.vedette .ic{color:#2a1600}.mode.vedette small{color:#4a2a00}
.chemin{display:flex;flex-direction:column;gap:10px}
.niv{display:flex;align-items:center;gap:12px;background:var(--carte);color:var(--encre);border-radius:18px;padding:12px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.niv:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.niv .rond{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--bleu);color:#fff;font-weight:800;font-size:1.1rem;flex:none}
.niv.boss .rond{background:var(--violet)}
.niv.fini .rond{background:var(--vert)}
.niv.verrou{opacity:.55}.niv.verrou .rond{background:#9aa1b2}
.niv .tx{flex:1}.niv .tx b{display:block;font-size:.95rem;line-height:1.2}.niv .tx small{color:var(--doux);font-size:.75rem;display:block;line-height:1.25}
.niv .etoiles{display:flex;gap:2px;color:#d7dae3}.niv .etoiles .on{color:var(--or)}
.niv .maitrise{height:5px;background:var(--trait);border-radius:9px;margin-top:5px;overflow:hidden}.niv .maitrise i{display:block;height:100%;background:var(--vert)}
/* écran de jeu */
.jeu{display:none}.jeu.on{display:block}.accueil.off{display:none}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud .quit{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.hud .prog{flex:1;height:14px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.hud .prog i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#16a34a);transition:width .3s}
.coeurs{display:flex;gap:2px;color:var(--rouge)}.coeurs .vide{color:rgba(255,255,255,.25)}
.combo{text-align:center;font-weight:800;color:var(--or);height:22px;font-size:.95rem}
.timer{text-align:center;font-weight:800;font-size:1.3rem;color:#7dd3fc}
.q{background:var(--carte);color:var(--encre);border-radius:22px;padding:18px 16px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.q .type{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--bleu2);font-weight:700;display:flex;gap:6px;align-items:center}
.q h2{font-size:1.12rem;margin:8px 0 12px;line-height:1.3}
.q .struct{display:block;margin:0 auto 10px;max-width:100%;max-height:200px;background:#fff}
.q .grand{font-size:1.5rem;font-weight:800;text-align:center;color:var(--bleu2);margin:6px 0 14px}
.choix{display:grid;gap:9px}
.ch{background:#f4f5f9;border:2px solid var(--trait);border-radius:14px;padding:12px 12px;text-align:left;font-size:.95rem;color:var(--encre);box-shadow:0 3px 0 var(--trait)}
.ch:active{transform:translateY(2px);box-shadow:none}
.ch.ok{background:var(--vert-p);border-color:var(--vert);box-shadow:0 3px 0 var(--vert)}
.ch.ko{background:var(--rouge-p);border-color:var(--rouge);box-shadow:0 3px 0 var(--rouge);animation:shake .35s}
.vf{grid-template-columns:1fr 1fr}.vf .ch{text-align:center;font-weight:700;font-size:1.05rem}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;border-radius:14px;padding:12px;font-size:.9rem;display:none}
.fb.on{display:block}.fb.ok{background:var(--vert-p);color:#14532d}.fb.ko{background:var(--rouge-p);color:#7f1d1d}
.fb b{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.suite{width:100%;margin-top:14px;background:var(--bleu);color:#fff;border-radius:16px;padding:14px;font-weight:800;font-size:1.02rem;box-shadow:0 5px 0 var(--bleu2);display:none}
.suite.on{display:block}.suite:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bleu2)}
.reveal{background:#f4f5f9;border-radius:14px;padding:12px;margin-top:10px;display:none;font-size:.93rem}
.reveal.on{display:block}
.auto{display:none;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.auto.on{display:grid}
.auto button{border-radius:14px;padding:12px 6px;font-weight:700;font-size:.85rem;color:#fff}
.auto .a1{background:var(--rouge)}.auto .a2{background:#f59e0b}.auto .a3{background:var(--vert)}
.voir{width:100%;margin-top:12px;background:var(--encre);color:#fff;border-radius:14px;padding:12px;font-weight:700}
canvas.dessin{width:100%;height:260px;background:#fff;border:2px dashed #c7cbd8;border-radius:14px;touch-action:none;display:block}
.outils{display:flex;gap:8px;margin-top:6px}.outils button{flex:1;background:#eef0f6;color:var(--encre);border-radius:10px;padding:8px;font-size:.85rem}
.paire{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paire button{background:#f4f5f9;border:2px solid var(--trait);border-radius:12px;padding:10px 8px;font-size:.85rem;color:var(--encre);min-height:52px}
.paire button.sel{border-color:var(--bleu);background:#e7ecfd}
.paire button.fait{visibility:hidden}
.paire button.ko{border-color:var(--rouge);animation:shake .35s}
/* fin */
.fin{text-align:center;padding:10px 0}
.fin .grosse{font-size:2.4rem;font-weight:900;margin:6px 0}
.fin .etoiles{display:flex;justify-content:center;gap:6px;color:rgba(255,255,255,.25)}.fin .etoiles .on{color:var(--or)}
.fin .etoiles .ic{width:46px;height:46px}
.gains{display:flex;gap:10px;justify-content:center;margin:14px 0}
.gains div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 14px}
.gains b{display:block;font-size:1.3rem}
.erreurs{background:var(--carte);color:var(--encre);border-radius:16px;padding:12px;text-align:left;margin-top:10px;font-size:.88rem}
.erreurs li{margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-120px);background:#fff;color:var(--encre);border-radius:16px;padding:10px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .35s;z-index:9;display:flex;gap:8px;align-items:center;max-width:92%}
.toast.on{transform:translateX(-50%) translateY(0);visibility:visible;transition:transform .35s}
.toast{visibility:hidden;transition:transform .35s,visibility 0s .35s;transform:translateX(-50%) translateY(calc(-100% - env(safe-area-inset-top) - 60px))!important}.toast.on{transform:translateX(-50%) translateY(0)!important}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:rgba(255,255,255,.07);border-radius:14px;padding:8px 4px;text-align:center;font-size:.66rem;opacity:.45}
.badge.on{opacity:1;background:rgba(245,184,46,.18)}
.badge .ic{width:26px;height:26px;color:var(--or);display:block;margin:0 auto 4px}
.note{font-size:.75rem;opacity:.6;text-align:center;margin-top:18px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:8}

.atl{background:#fff;border-radius:16px;margin:0 -4px}
.atl-barre{display:flex;gap:4px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.atl-barre::-webkit-scrollbar{display:none}
.atl-o{flex:1 0 auto;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:12px;background:#f1f3f8;color:#1b2233;font-size:.62rem}
.atl-o .ic{width:22px;height:22px}.atl-o.on{background:#226b66;color:#fff}
.atl-b2{justify-content:space-between;align-items:center}
.atl-coul{display:flex;gap:6px}.atl-c{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #d4d8e3}.atl-c.on{box-shadow:0 0 0 3px #226b66}
.atl-taille{display:flex;gap:4px}.atl-t{width:34px;height:34px;border-radius:10px;background:#f1f3f8;display:grid;place-items:center}.atl-t i{display:block;border-radius:50%;background:#1b2233}.atl-t.on{background:#dbe3ff}
.atl-atomes{display:none;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding:4px 2px;scrollbar-width:none}.atl-atomes::-webkit-scrollbar{display:none}.atl-atomes.on{display:flex}
.atl-atomes button{flex:none;min-width:40px;padding:7px 8px;border-radius:10px;background:#f1f3f8;color:#1b2233;font-weight:700;font-size:.9rem}.atl-atomes button.on{background:#226b66;color:#fff}
.atl-zone{position:relative;overflow:hidden;border-radius:14px}
.atl canvas{display:block;width:100%;height:56vh;max-height:520px;min-height:300px;background:#fff;border:2px solid #e3e6ee;border-radius:14px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.atl-aide{position:absolute;left:8px;right:8px;bottom:6px;font-size:.7rem;color:#8a91a3;pointer-events:none;text-align:center}
.atl-b3 button{flex:1;display:flex;gap:4px;align-items:center;justify-content:center;padding:9px 6px;border-radius:12px;background:#f1f3f8;color:#1b2233;font-size:.78rem}
.atl-b3 .atl-voir{background:#1b2233;color:#fff;font-weight:700;flex:1.6}
.atl.plein{position:fixed;inset:0;z-index:20;border-radius:0;margin:0;padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;flex-direction:column}
.atl.plein .atl-zone{flex:1;display:flex}.atl.plein canvas{height:auto;flex:1;max-height:none}
body.sans-scroll{overflow:hidden}
/* la page ne défile pas elle-même : un cadre intérieur défile (évite le flou d'iOS sous l'heure en mode app) */
html,body{height:100%;overflow:hidden}
.defile{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;z-index:1}
body.sans-scroll .defile{overflow:hidden}
@media (min-width:700px){.atl canvas{height:62vh;max-height:none}}


.atl-calque{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);max-width:80%;max-height:70%;opacity:0;pointer-events:none;mix-blend-mode:multiply;touch-action:none;-webkit-user-drag:none;user-select:none;transform-origin:center}
.atl-calque.on{pointer-events:auto;cursor:move;outline:2px dashed rgba(59,95,240,.55);outline-offset:4px;border-radius:6px}
.atl-feuille{position:absolute;left:6px;right:6px;bottom:6px;background:#fff;border-radius:16px;box-shadow:0 -6px 30px rgba(15,21,48,.25);padding:10px;transform:translateY(calc(100% + 12px));opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;pointer-events:none;max-height:72%;display:flex;flex-direction:column}
.atl-feuille.mini .atl-f-corps{display:none}
.atl-ajust{display:none;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.atl-feuille.mini .atl-ajust{display:flex}
.atl-ajust button{min-width:40px;background:#f1f3f8;color:#1b2233;border-radius:10px;padding:8px 10px;font-weight:700}
.atl-ajust label{flex:1;display:flex;gap:6px;align-items:center;font-size:.72rem;color:#5d6577;min-width:150px}.atl-ajust input{flex:1}
.atl-feuille.on{transform:none;opacity:1;pointer-events:auto}
.atl-f-tete{display:flex;gap:6px;align-items:center;color:#1b2233}.atl-f-tete b{flex:1}
.atl-f-tete button{background:#f1f3f8;color:#1b2233;border-radius:10px;padding:6px 10px;font-size:.8rem}.atl-f-tete button.on{background:#226b66;color:#fff}
.atl-f-corps{overflow:auto;min-height:0;flex:1;text-align:center}.atl-f-corps img{max-width:100%;max-height:30vh;display:block;margin:4px auto}.atl-f-corps p{margin:4px 0;font-size:.82rem;color:#5d6577}
.atl-note{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.atl-note button{border-radius:12px;padding:11px 4px;font-weight:700;font-size:.85rem;color:#fff}
.atl-note .a1{background:#e5484d}.atl-note .a2{background:#f59e0b}.atl-note .a3{background:#16a34a}
.atl-suite{display:none;margin-top:8px;background:#226b66;color:#fff;border-radius:12px;padding:12px;font-weight:800;box-shadow:0 4px 0 #12309e}.atl-suite.on{display:block}

/* ===== monde : chambre de nuit ===== */
.ciel{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(130% 70% at 50% 0%,#5a3a2a 0%,#2e211b 42%,#1e1613 100%);overflow:hidden}
.ciel::before{content:"";position:absolute;inset:-60px;background:url(decor/monde-1920.jpg?v=4) center/cover;filter:blur(26px) saturate(1.3);opacity:.32}
.ciel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,22,19,0) 0%,rgba(30,22,19,.55) 70%,rgba(30,22,19,.85) 100%)}
.ciel i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(255,214,107,.55);opacity:0;animation:luciole 9s ease-in-out infinite;z-index:1}
@keyframes luciole{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}50%{transform:translate(18px,-40px)}80%{opacity:.7}100%{opacity:0;transform:translate(-10px,-90px)}}
.app{position:relative;z-index:1}
.hero{position:relative;margin:calc(-1*(env(safe-area-inset-top) + 10px)) -14px 0;height:calc(42vh + env(safe-area-inset-top));min-height:250px;max-height:440px}
.hero-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 62%,transparent 100%)}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(180deg,rgba(30,22,19,.7),rgba(30,22,19,0));z-index:1;pointer-events:none}
.hero-haut{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 12px);display:flex;align-items:center;gap:10px;z-index:2}
.hero-haut .logo{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.hero-t{flex:1;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.5)}.hero-t small{display:block;font-size:.8rem;opacity:.9}.hero-t b{font-size:1.3rem}
.rond-btn{width:40px;height:40px;border-radius:50%;background:rgba(30,22,19,.45);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center}
.guir{position:absolute;left:0;right:0;bottom:-4px;width:100%;height:auto;z-index:2;overflow:visible}
.guir .fil{fill:none;stroke:rgba(20,18,60,.9);stroke-width:1.6}
.guir .ampoule{fill:#3a3f7a;stroke:rgba(255,255,255,.15);stroke-width:.6}
.guir .ampoule.on{fill:#ffd66b;stroke:#fff3c4;filter:drop-shadow(0 0 4px #ffd66b) drop-shadow(0 0 9px rgba(255,190,80,.8));animation:scint 3s ease-in-out infinite}
@keyframes scint{0%,100%{opacity:1}50%{opacity:.55}}
.lum{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.78rem;color:#ffe9a8;margin:4px 0 10px;text-shadow:0 0 12px rgba(255,214,107,.5)}
.stat,.mode,.niv,.rang{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14)}
.rang{background:linear-gradient(135deg,rgba(79,179,169,.5),rgba(233,135,75,.42));border:1px solid rgba(255,255,255,.18);display:flex;gap:12px;align-items:center}
.rang .rg{flex:1}
.anneau{width:56px;height:56px;flex:none;position:relative}.anneau>svg{width:56px;height:56px;transform:rotate(-90deg)}
.anneau b .ic{width:26px;height:26px;vertical-align:0;color:#ffd66b;stroke-width:3}
.anneau circle{fill:none;stroke-width:6}.anneau .f{stroke:rgba(255,255,255,.18)}.anneau .p{stroke:#ffd66b;stroke-linecap:round;transition:stroke-dashoffset .8s}
.anneau b{position:absolute;inset:0;display:grid;place-items:center;font-size:.7rem;line-height:1.05;text-align:center}
.go{display:flex;align-items:center;gap:12px;width:100%;background:linear-gradient(135deg,#ffd66b,#ff9fb8);color:#2b1340;border-radius:20px;padding:13px 14px;box-shadow:0 6px 0 #b9577a,0 0 34px rgba(255,190,120,.35);text-align:left;margin:12px 0 2px}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #b9577a}
.go .r{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;animation:respire 2.4s ease-in-out infinite;color:#b9577a}
.go .r .ic{width:22px;height:22px;fill:currentColor}
.go small{display:block;font-size:.75rem;opacity:.8}.go b{font-size:1.05rem}
@keyframes respire{50%{transform:scale(1.08);box-shadow:0 0 22px rgba(255,255,255,.7)}}
.mode{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.13);box-shadow:0 6px 0 rgba(12,8,6,.35)}
.mode .ic{color:#b3c0ff}.mode small{color:rgba(255,255,255,.68)}
.mode.vedette{background:linear-gradient(135deg,rgba(79,179,169,.85),rgba(233,135,75,.8));color:#fff}
.mode.vedette .ic{color:#fff}.mode.vedette small{color:rgba(255,255,255,.88)}
.chemin{position:relative}
.chemin::before{content:"";position:absolute;left:35px;top:24px;bottom:24px;border-left:3px dotted rgba(255,214,107,.4)}
.niv{position:relative;background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.13);box-shadow:0 6px 0 rgba(12,8,6,.35)}
.niv .tx small{color:rgba(255,255,255,.66)}
.niv .etoiles{color:rgba(255,255,255,.2)}

/* ===== salon immersif ===== */
.salon{position:relative;width:100vw;margin:calc(-1*(env(safe-area-inset-top) + 10px)) 0 0 calc(50% - 50vw);height:calc(70vh + env(safe-area-inset-top));min-height:440px;max-height:780px;overflow:hidden;touch-action:none;perspective:900px;-webkit-mask-image:linear-gradient(180deg,#000 90%,transparent);mask-image:linear-gradient(180deg,#000 90%,transparent);-webkit-user-select:none;user-select:none}

s le PA ; coulée semi-solide", "Étalonner le moule (E) · couler à 10 % de PA (M, S) · calculer f · masse d'excipient avec 1 suppo en plus"], "r": "Chauffer 2-3 °C au-dessus de la T° de fusion, incorporer le PA avant la coulée (attention sédimentation)", "x": "Chauffer 2-3 °C au-dessus de la T° de fusion, incorporer le PA avant la coulée (attention sédimentation)", "cp": "coulee"}, {"id": "2-k23", "t": "qcm", "q": "Fusion crémeuse : principe ?", "c": ["Fondre 2/3 de la masse, ajouter 1/3 froid, puis le PA ; coulée semi-solide", "Moins de sédimentation, durcissement plus rapide", "10 %", "Étalonner le moule (E) · couler à 10 % de PA (M, S) · calculer f · masse d'excipient avec 1 suppo en plus"], "r": "Fondre 2/3 de la masse, ajouter 1/3 froid, puis le PA ; coulée semi-solide", "x": "Fondre 2/3 de la masse, ajouter 1/3 froid, puis le PA ; coulée semi-solide", "cp": "coulee"}, {"id": "2-k24", "t": "qcm", "q": "Avantages de la fusion crémeuse ?", "c": ["Moins de sédimentation, durcissement plus rapide", "Étalonner le moule (E) · couler à 10 % de PA (M, S) · calculer f · masse d'excipient avec 1 suppo en plus", "Chauffer 2-3 °C au-dessus de la T° de fusion, incorporer le PA avant la coulée (attention sédimentation)", "10 %"], "r": "Moins de sédimentation, durcissement plus rapide", "x": "Moins de sédimentation, durcissement plus rapide", "cp": "coulee"}, {"id": "2-k25", "t": "qcm", "q": "Les 4 étapes de calcul des suppositoires ?", "c": ["Étalonner le moule (E) · couler à 10 % de PA (M, S) · calculer f · masse d'excipient avec 1 suppo en plus", "Fondre 2/3 de la masse, ajouter 1/3 froid, puis le PA ; coulée semi-solide", "Chauffer 2-3 °C au-dessus de la T° de fusion, incorporer le PA avant la coulée (attention sédimentation)", "Moins de sédimentation, durcissement plus rapide"], "r": "Étalonner le moule (E) · couler à 10 % de PA (M, S) · calculer f · masse d'excipient avec 1 suppo en plus", "x": "Étalonner le moule (E) · couler à 10 % de PA (M, S) · calculer f · masse d'excipient avec 1 suppo en plus", "cp": "coulee"}, {"id": "2-k26", "t": "qcm", "q": "% de PA arbitraire de la 2e coulée ?", "c": ["10 %", "5 %", "20 %", "50 %"], "r": "10 %", "x": "10 %", "cp": "coulee"}, {"id": "2-k27", "t": "qcm", "q": "Formule du facteur de déplacement ?", "c": ["f = (E − M) ÷ S", "f = (M − E) ÷ S", "f = (E − M) × S", "f = S ÷ (E − M)"], "r": "f = (E − M) ÷ S", "x": "f = (E − M) ÷ S", "cp": "facteur"}, {"id": "2-k28", "t": "qcm", "q": "E = ?", "c": ["g d'excipient dans 1 suppositoire sans PA (1re coulée)", "f = (E − M) ÷ S", "g de masse dans 1 suppositoire avec PA (2e coulée)", "M = 2,7432 g · S = 0,3048 g"], "r": "g d'excipient dans 1 suppositoire sans PA (1re coulée)", "x": "g d'excipient dans 1 suppositoire sans PA (1re coulée)", "cp": "facteur"}, {"id": "2-k29", "t": "qcm", "q": "M = ?", "c": ["g de masse dans 1 suppositoire avec PA (2e coulée)", "g de PA dans 1 suppositoire", "g d'excipient dans 1 suppositoire sans PA (1re coulée)", "Masse d'excipient déplacée par 1 g de PA"], "r": "g de masse dans 1 suppositoire avec PA (2e coulée)", "x": "g de masse dans 1 suppositoire avec PA (2e coulée)", "cp": "facteur"}, {"id": "2-k30", "t": "qcm", "q": "S = ?", "c": ["g de PA dans 1 suppositoire", "g de masse dans 1 suppositoire avec PA (2e coulée)", "f = (E − M) ÷ S", "M = 2,7432 g · S = 0,3048 g"], "r": "g de PA dans 1 suppositoire", "x": "g de PA dans 1 suppositoire", "cp": "facteur"}, {"id": "2-k31", "t": "qcm", "q": "Signification de f ?", "c": ["Masse d'excipient déplacée par 1 g de PA", "M = 2,7432 g · S = 0,3048 g", "f = (E − M) ÷ S", "g de masse dans 1 suppositoire avec PA (2e coulée)"], "r": "Masse d'excipient déplacée par 1 g de PA", "x": "Masse d'excipient déplacée par 1 g de PA", "cp": "facteur"}, {"id": "2-k32", "t": "qcm", "q": "Suppo à 10 % de PA pesant 3,048 g : M et S ?", "c": ["M = 2,7432 g · S = 0,3048 g", "M = 0,3048 g · S = 2,7432 g", "M = 3,048 g · S = 0,3048 g", "M = 2,7432 g · S = 3,048 g"], "r": "M = 2,7432 g · S = 0,3048 g", "x": "M = 2,7432 g · S = 0,3048 g", "cp": "facteur"}, {"id": "2-k33", "t": "qcm", "q": "Formule de la masse d'excipient par suppositoire ?", "c": ["M = E − Σ (fi × Si)", "M = E + Σ (fi × Si)", "M = E − Σ Si", "M = (E − Si) ÷ fi"], "r": "M = E − Σ (fi × Si)", "x": "M = E − Σ (fi × Si)", "cp": "base"}, {"id": "2-k34", "t": "qcm", "q": "En pratique, on prépare combien de suppositoires ?", "c": ["n + 1", "n", "n − 1", "2 n"], "r": "n + 1", "x": "n + 1", "cp": "base"}, {"id": "2-k35", "t": "qcm", "q": "Unité de S dans f × S ?", "c": ["Grammes (convertir les mg)", "Milligrammes", "Pourcentage", "Millilitres"], "r": "Grammes (convertir les mg)", "x": "Grammes (convertir les mg)", "cp": "base"}, {"id": "2-k36", "t": "qcm", "q": "8 suppos de 1 g à 100 mg d'aspirine (f 0,67) : base en pratique ?", "c": ["0,933 × 9 = 8,397 g", "0,933 × 8 = 7,464 g", "0,900 × 9 = 8,100 g", "0,967 × 9 = 8,703 g"], "r": "0,933 × 9 = 8,397 g", "x": "0,933 × 9 = 8,397 g", "cp": "base"}], "c": [{"id": "1-masse", "t": "Les unités de masse (pesée)", "q": "Explique comment convertir 25 cg en mg, puis 12,5 mg en g, sans regarder.", "e": "À dire : 1 cg = 10 mg, donc 25 cg = 250 mg ; 1 mg = 0,001 g, donc 12,5 mg = 0,0125 g ; Unité plus petite → on multiplie ; plus grande → on divise ; J'ai vérifié l'ordre de grandeur. Pièges à éviter : Croire que 1 g = 100 mg (c'est 1000 mg ; 1 g = 100 cg). Oublier le zéro de position : 12,5 mg = 0,0125 g (et non 0,125 g). Confondre mg et µg (facteur 1000).", "mc": "Échelle: g → dg → cg → mg · ×10 à chaque cran · ctg = cg | Repères: 1 g = 1000 mg · 1 g = 100 cg · 1 cg = 10 mg · 1 mg = 1000 µg | Méthode: plus petit → on multiplie · plus grand → on divise · passer par le gramme | Pièges: 1 g ≠ 100 mg · 12,5 mg = 0,0125 g · mg ≠ µg"}, {"id": "1-volume", "t": "Les unités de volume et les cuillères", "q": "Explique comment trouver le volume de suspension pour 8 jours à 4 cuillères à café par jour.", "e": "À dire : 1 C à c = 5 mL ; 4 × 5 = 20 mL par jour ; 20 × 8 = 160 mL. Pièges à éviter : Inverser C à s (15 mL) et C à d (10 mL). Oublier de multiplier par le nombre de jours.", "mc": "Volumes: 1 L = 1000 mL · 1 dL = 100 mL · 1 mL = 1 cm³ | Cuillères: C à s = 15 mL · C à d = 10 mL · C à c = 5 mL | Calculs: volume ÷ prise = nombre de prises · prise × fois par jour × jours | Pièges: C à s ≠ C à d · oublier les jours"}, {"id": "1-magistrale", "t": "La préparation magistrale", "q": "Définis la préparation magistrale et cite ses 4 intérêts.", "e": "À dire : Préparée extemporanément ; À l'officine, sous la surveillance du pharmacien ; Le plus souvent sur prescription médicale ; Personnalisation de la posologie (âge, évolution) ; Association de principes actifs ; Spécialité non disponible ; Intérêt économique. Pièges à éviter : Dire « toujours sur prescription » : c'est « le plus souvent ». Oublier un des 4 intérêts (souvent l'intérêt économique).", "mc": "Définition: extemporanément · à l'officine · sous la surveillance du pharmacien · le plus souvent sur prescription | 4 intérêts: personnaliser la posologie (âge, évolution) · associer des PA · spécialité indisponible · intérêt économique | Piège: « le plus souvent », pas « toujours »"}, {"id": "1-abrev", "t": "Lire une prescription : les abréviations", "q": "Lis à voix haute « Rp X 10 mg, Y 5 mg pf 1 gél dt 20 » comme si tu l'expliquais à un stagiaire.", "e": "À dire : Rp = prenez ; 10 mg de X et 5 mg de Y par gélule (pf 1 gél) ; dt 20 = 20 gélules à délivrer ; Quantités à peser : 200 mg de X et 100 mg de Y. Pièges à éviter : Confondre qs (autant qu'il en faut) et ad (jusqu'à). Oublier de multiplier la dose par le nombre « dt ».", "mc": "Abréviations: Rp = prenez · S\\ = étiquette · pf = pour faire · dt = donnez · qs = autant qu'il en faut · ad = jusqu'à | Lecture: doses écrites pour 1 unité · × nombre « dt » | Exemple: 10 mg × 20 = 200 mg · 5 mg × 20 = 100 mg | Piège: qs ≠ ad"}, {"id": "1-rp", "t": "Du Rp à la quantité à peser", "q": "Explique la démarche complète pour 160 mL de suspension à 100 mg/5 mL à partir de comprimés à 250 mg.", "e": "À dire : Concentration 20 mg/mL → 3200 mg ; 3200 ÷ 250 = 12,8 → 13 comprimés ; Excès 50 mg = 0,2 comprimé ; Retirer 0,2 × masse d'un comprimé. Pièges à éviter : Confondre la quantité de PA (mg) avec le nombre de comprimés. Retirer l'excès de PA en mg au lieu de la masse de poudre correspondante.", "mc": "Démarche: concentration × volume = PA total · PA total ÷ dosage = comprimés · arrondir au-dessus | Excès: PA en trop ÷ PA par comprimé · × masse d'un comprimé = poudre à retirer | Exemple: 3200 mg ÷ 250 = 12,8 → 13 · excès 0,2 comprimé | Pièges: mg ≠ nombre de comprimés · retirer de la poudre, pas des mg"}, {"id": "1-pct", "t": "Les concentrations en %", "q": "Explique comment trouver la dose de codéine dans 1 cuillère à café d'un sirop à 0,10 % (m/V).", "e": "À dire : 0,10 % = 0,10 g / 100 mL ; = 1 mg/mL ; C à c = 5 mL → 5 mg. Pièges à éviter : Calculer le % sur la somme des ingrédients au lieu du volume final (« ad »). Oublier de convertir ctg/mg en g avant de calculer un %.", "mc": "Définitions: % m/m = g / 100 g · % m/V = g / 100 mL · % V/V = mL / 100 mL | Repère: 1 % (m/V) = 10 mg/mL | Exemple: 0,10 % = 1 mg/mL · C à c = 5 mL → 5 mg | Pièges: % sur le volume final (ad) · convertir en g avant le %"}, {"id": "1-densite", "t": "Les densités", "q": "Explique comment mesurer le volume de teinture (d = 0,9) pour 540 g de sirop à 5 % (m/m).", "e": "À dire : 5 % de 540 g = 27 g de teinture ; V = m ÷ d ; 27 ÷ 0,9 = 30 mL ; d < 1 donc volume > masse : cohérent. Pièges à éviter : Multiplier au lieu de diviser (V = m ÷ d, pas m × d). Donner la masse (27 g) quand on demande un volume. Oublier que la densité de l'eau vaut exactement 1.", "mc": "Formules: m = V × d · V = m ÷ d | Tableau: eau 1 · éthanol 0,79 · méthanol 0,80 · propylène glycol 1,04 · éther 0,71 · huile de paraffine 0,86 | Exemple: 5 % de 540 g = 27 g · 27 ÷ 0,9 = 30 mL | Contrôle: d < 1 → volume > masse | Pourquoi peser: liquides visqueux"}, {"id": "2-trit", "t": "La trituration : le principe", "q": "Explique à un camarade ce qu'est une trituration et pourquoi on en a besoin.", "e": "À dire : Quantité de PA trop petite pour une pesée précise ; Excès de PA mélangé à un diluant ; On prélève la quantité de mélange qui contient la dose ; Plus dilué = masse pesée plus grande = plus précis. Pièges à éviter : Confondre ‰ (pour mille) et % (pour cent) : facteur 10 d'écart. Croire que la trituration change la dose reçue : elle ne change que la masse pesée.", "mc": "Principe: PA trop petit pour une pesée précise · excès de PA + diluant · on prélève le mélange qui contient la dose | Effet: plus dilué → masse pesée plus grande → plus précis · la dose reçue ne change pas | Piège: ‰ ≠ % (facteur 10)"}, {"id": "2-tritcalc", "t": "Calculer une trituration", "q": "Explique comment trouver la masse de trituration à 2 ‰ pour 10 gélules à 50 µg d'éthinylœstradiol.", "e": "À dire : 50 µg × 10 = 500 µg = 0,5 mg de PA ; 2 ‰ = 2 mg pour 1000 mg ; 0,5 mg × 500 = 250 mg de trituration. Pièges à éviter : Répondre la quantité de PA (0,5 mg) au lieu de la quantité de trituration (250 mg). Oublier de convertir les µg en mg avant d'appliquer le facteur. Multiplier par 100 pour une trituration à 1 ‰ (c'est × 1000).", "mc": "2 étapes: PA total (dose × nombre) · masse de trituration qui contient ce PA | Facteurs: 1 ‰ → × 1000 · 2 ‰ → × 500 · 1 % → × 100 · 10 % → × 10 | Exemple: 50 µg × 10 = 0,5 mg · × 500 = 250 mg | Pièges: répondre le PA au lieu de la trituration · µg → mg d'abord"}, {"id": "2-lecture", "t": "Lire le Rp : µg et chiffres romains", "q": "Lis à voix haute : « dt VI », « dt XIV », « dt XL », « dt XC ».", "e": "À dire : VI = 6 ; XIV = 14 ; XL = 40 ; XC = 90. Pièges à éviter : Lire IV comme 6. Oublier la conversion µg → mg (facteur 1000).", "mc": "Chiffres romains: I 1 · V 5 · X 10 · L 50 · C 100 | Soustraction: IV 4 · IX 9 · XL 40 · XC 90 | Exemples: VI 6 · XIV 14 | Unités: 1 mg = 1000 µg | Pièges: IV ≠ 6 · dt X et dt XX"}, {"id": "2-gelmix", "t": "Gélules complexes et spécialités", "q": "Explique la différence de calcul entre « Cipramil® 10 mg (comprimés à 20 mg) » et « métoclopramide 5 mg (trituration à 10 %) » pour 120 gélules.", "e": "À dire : Cipramil : 1200 mg ÷ 20 = 60 comprimés ; Métoclopramide : 600 mg de PA ; Trituration 10 % → × 10 = 6 g à peser. Pièges à éviter : Multiplier par 120 quand la question demande « par gélule ». Oublier que 10 ctg = 100 mg.", "mc": "Spécialité: PA total ÷ dosage du comprimé · Cipramil 1200 mg ÷ 20 = 60 comprimés | Trituration 10 %: PA × 10 · 600 mg → 6 g | Lecture: « par gélule » → pas × dt · 10 ctg = 100 mg | Pourquoi: un comprimé contient aussi des excipients"}, {"id": "2-coulee", "t": "Suppositoires : préparation par coulée", "q": "Compare la fusion claire et la fusion crémeuse, puis cite les 4 étapes du calcul.", "e": "À dire : Claire : 2-3 °C au-dessus de la T° de fusion, PA avant coulée, risque de sédimentation ; Crémeuse : 2/3 fondu + 1/3 froid, coulée semi-solide ; Avantages : moins de sédimentation, durcissement plus rapide ; Étapes : étalonner (E), 10 % de PA (M, S), calculer f, masse d'excipient avec 1 suppo en plus. Pièges à éviter : Inverser 2/3 fondu et 1/3 froid. Oublier le suppositoire supplémentaire.", "mc": "Fusion claire: 2-3 °C au-dessus de la T° de fusion · PA avant la coulée · risque de sédimentation | Fusion crémeuse: 2/3 fondu + 1/3 froid · coulée semi-solide · moins de sédimentation · durcit plus vite | 4 étapes: étalonner (E) · couler à 10 % (M, S) · calculer f · excipient pour n + 1"}, {"id": "2-facteur", "t": "Le facteur de déplacement (f)", "q": "Explique d'où viennent E, M et S et calcule f avec l'exemple 20,50 g / 7 et 26,89 g / 9.", "e": "À dire : E = masse d'un suppositoire pur = 20,50 ÷ 7 = 2,93 g ; 1 suppo à 10 % = 26,89 ÷ 9 = 2,99 g ; M = 2,99 × 0,9 = 2,689 g ; S = 2,99 × 0,1 = 0,299 g ; f = (2,93 − 2,689) ÷ 0,299 ≈ 0,81. Pièges à éviter : Diviser par le nombre total de suppositoires au lieu de travailler sur 1 suppositoire. Prendre S = 10 % de E au lieu de 10 % du suppositoire avec PA. Écrire f = (M − E) ÷ S (signe inversé).", "mc": "Symboles: E = 1 suppo pur · M = excipient dans 1 suppo à 10 % · S = PA dans ce suppo | Formule: f = (E − M) ÷ S | Méthode: travailler sur 1 suppositoire · M = 90 % · S = 10 % | Exemple: (2,93 − 2,689) ÷ 0,299 ≈ 0,81 | Pièges: S = 10 % du suppo avec PA · signe de f"}, {"id": "2-base", "t": "La masse d'excipient en pratique", "q": "Explique comment calculer la base pour « phénobarbital 40 mg (f 0,82), aminophylline 200 mg (f 0,88), dt X » avec 8 suppos purs = 15,76 g.", "e": "À dire : E = 15,76 ÷ 8 = 1,97 g ; Σ f·S = 0,82 × 0,04 + 0,88 × 0,2 = 0,2088 g ; M = 1,97 − 0,2088 = 1,7612 g ; × 11 (dt X + 1) = 19,37 g. Pièges à éviter : Oublier de convertir les mg de PA en g dans f × S. Multiplier par n au lieu de n + 1. Oublier un des PA dans la somme.", "mc": "Formule: M = E − Σ (f × S) · S en grammes | Pratique: préparer n + 1 suppositoires · masse totale = M × (n + 1) | Exemple: 1,97 − 0,2088 = 1,7612 g · × 11 = 19,37 g | Pièges: mg → g · n au lieu de n + 1 · oublier un PA"}], "ex": [{"id": "1-x1", "s": "Unités de pesée", "ctx": "", "q": "25 cg est égal à", "st": ["1 cg = 10 mg", "25 cg = 25 × 10 mg = <b>250 mg</b>"], "tip": "", "o": ["0,025 mg", "0,25 mg", "2,5 mg", "25 mg", "250 mg"], "a": 4}, {"id": "1-x2", "s": "Unités de pesée", "ctx": "", "q": "1 g est égal à", "st": ["1 g = 1000 mg (et non 100 ni 10 000)", "1 g = 100 cg → réponse <b>100 cg</b>"], "tip": "", "o": ["100 mg", "10000 mg", "100 cg", "1000 cg"], "a": 2}, {"id": "1-x3", "s": "Unités de pesée", "ctx": "", "q": "12,5 mg est égal à", "st": ["1 mg = 0,001 g", "12,5 mg = 12,5 ÷ 1000 = <b>0,0125 g</b>"], "tip": "", "o": ["125 g", "1,25 g", "0,125 g", "0,0125 g", "0,00125 g", "0,000125 g"], "a": 3}, {"id": "1-x4", "s": "Unités de pesée", "ctx": "", "q": "58 cg est égal à", "st": ["1 cg = 0,01 g", "58 cg = 58 ÷ 100 = <b>0,58 g</b>"], "tip": "", "o": ["5,8 g", "0,58 g", "0,058 g", "0,0058 g", "0,00058 g"], concepts: [
{ id: "masse", title: "Les unités de masse (pesée)",
  html: `<p>À l'officine, on pèse en <b>grammes</b> et en sous-multiples. Chaque cran vaut <span class="k">×10</span> :</p>
  <div class="formula">g → dg → cg → mg</div>

  <tr><td>1 g</td><td><span class="k">10 dg = 100 cg = 1000 mg</span></td></tr>
  <tr><td>1 cg (écrit aussi <b>ctg</b>)</td><td><span class="k">10 mg = 0,01 g</span></td></tr>
  <tr><td>1 mg</td><td><span class="k">0,1 cg = 0,001 g = 1000 µg</span></td></tr>
  <tr><td>1 µg (microgramme)</td><td><span class="k">0,001 mg</span></td></tr></table>
  <p><b>Règle de déplacement de la virgule</b> : vers une unité plus petite, on <span class="k">multiplie</span> (le nombre grandit) ; vers une unité plus grande, on <span class="k">divise</span>. g → mg : virgule de <span class="k">3 rangs vers la droite</span>.</p>
  <p><b>Contrôle de vraisemblance</b> : un résultat en g doit être un <span class="k">plus petit nombre</span> que le même résultat en mg.</p>`,
  why: [["Pourquoi faut-il maîtriser les cg alors qu'on les utilise peu ailleurs ?", "Les prescriptions et formulaires belges utilisent encore les cg/ctg (ex. « acide benzoïque 18 ctg »). Une erreur d'un facteur 10 sur une dose est une erreur médicamenteuse grave."],
        ["Pourquoi passer par le gramme quand on hésite ?", "Le gramme sert de pivot : convertir d'abord en g puis vers l'unité voulue évite de mélanger les facteurs 10, 100 et 1000."]],

  traps: ["Croire que 1 g = 100 mg (c'est 1000 mg ; 1 g = 100 cg).", "Oublier le zéro de position : 12,5 mg = 0,0125 g (et non 0,125 g).", "Confondre mg et µg (facteur 1000)."] },

{ id: "volume", title: "Les unités de volume et les cuillères",
  html: `<table><tr><th>Unité</th><th>Équivalence</th></tr>

{ id: "magistrale", title: "La préparation magistrale",
  html: `<p><b>Définition</b> : médicament préparé <span class="k">extemporanément</span> à l'officine, <span class="k">sous la surveillance du pharmacien</span>, et le plus souvent <span class="k">sur prescription médicale</span>.</p>
  <p>Elle garde une place importante dans l'arsenal thérapeutique, notamment pour :</p>

  talk: { prompt: "Définis la préparation magistrale et cite ses 4 intérêts.", check: ["Préparée extemporanément", "À l'officine, sous la surveillance du pharmacien", "Le plus souvent sur prescription médicale", "Personnalisation de la posologie (âge, évolution)", "Association de principes actifs", "Spécialité non disponible", "Intérêt économique"] },

{ id: "abrev", title: "Lire une prescription : les abréviations",
  html: `<table><tr><th>Abréviation</th><th>Signification</th></tr>

  <p>« aqua q.s. ad 200 mL » = on ajoute de l'eau <span class="k">jusqu'à un volume final de 200 mL</span>.</p>`,

        ["Pourquoi les doses du Rp sont-elles « par unité » ?", "Le prescripteur écrit la composition d'UNE pièce (pf 1 gél) ; la quantité totale dépend du « dt »."]],
  talk: { prompt: "Lis à voix haute « Rp X 10 mg, Y 5 mg pf 1 gél dt 20 » comme si tu l'expliquais à un stagiaire.", check: ["Rp = prenez", "10 mg de X et 5 mg de Y par gélule (pf 1 gél)", "dt 20 = 20 gélules à délivrer", "Quantités à peser : 200 mg de X et 100 mg de Y"] },

{ id: "rp", title: "Du Rp à la quantité à peser",
  html: `<p><b>1. Quantité totale de principe actif (PA)</b> = <span class="k">dose par unité × nombre d'unités (dt)</span>.</p>
  <p><b>2. Si on part d'une spécialité</b> (comprimés, gélules du commerce) :</p>
  <div class="formula">nombre d'unités = quantité totale ÷ dosage d'une unité</div>
  <p>Ex. 30 mg × 60 gélules = 1800 mg ; avec des gélules à 50 mg : 1800 ÷ 50 = <span class="k">36 gélules</span>.</p>
  <p><b>3. Si le résultat n'est pas entier</b> : on prend <span class="k">le nombre entier supérieur</span>, on broie, puis on <span class="k">retire l'excès de poudre</span> au prorata :</p>
  <div class="formula">poudre à enlever = (PA en excès ÷ PA par comprimé) × masse d'un comprimé</div>
  <p>Ex. besoin 3200 mg, comprimés à 250 mg → 12,8 → <span class="k">13 comprimés</span> (3250 mg). Excès 50 mg = 0,2 comprimé ; si 1 comprimé pèse 1 g → enlever <span class="k">0,2 g</span>.</p>`,
  why: [["Pourquoi arrondir au supérieur et non à l'inférieur ?", "Avec moins de comprimés, il manquerait du PA : impossible à rattraper. Avec un de plus, on retire l'excès de poudre pesée."],
        ["Pourquoi la poudre à retirer est-elle proportionnelle à la masse du comprimé ?", "Le PA est réparti uniformément dans la poudre broyée : retirer 0,2 comprimé de PA revient à retirer 0,2 × la masse d'un comprimé."]],
  talk: { prompt: "Explique la démarche complète pour 160 mL de suspension à 100 mg/5 mL à partir de comprimés à 250 mg.", check: ["Concentration 20 mg/mL → 3200 mg", "3200 ÷ 250 = 12,8 → 13 comprimés", "Excès 50 mg = 0,2 comprimé", "Retirer 0,2 × masse d'un comprimé"] },
  traps: ["Confondre la quantité de PA (mg) avec le nombre de comprimés.", "Retirer l'excès de PA en mg au lieu de la masse de poudre correspondante."] },

{ id: "pct", title: "Les concentrations en %",
  html: `<table><tr><th>Notation</th><th>Signifie</th></tr>
  <tr><td><b>% (m/m)</b></td><td><span class="k">g de substance pour 100 g</span> de préparation</td></tr>
  <tr><td><b>% (m/V)</b></td><td><span class="k">g de substance pour 100 mL</span> de préparation</td></tr>
  <tr><td><b>% (V/V)</b></td><td><span class="k">mL de substance pour 100 mL</span> de préparation</td></tr></table>
  <div class="formula">masse (g) = % × quantité finale ÷ 100</div>
  <p>Ex. minoxidil 3 % (m/V) ad 200 mL → <span class="k">3 × 200 ÷ 100 = 6 g</span>.</p>
  <p><b>Retrouver un %</b> : % = masse (g) ÷ volume (mL) × 100. Ex. 10 ctg (0,10 g) dans 250 mL → <span class="k">0,04 %</span>.</p>
  <p><b>Quantité par prise</b> : un % (m/V) donne une concentration : 0,04 % = 0,04 g/100 mL = <span class="k">0,4 mg/mL</span> → par C à c (5 mL) : <span class="k">2 mg</span>.</p>
  <p><b>Astuce</b> : 1 % (m/V) = <span class="k">10 mg/mL</span>.</p>`,
  why: [["Pourquoi préciser m/m, m/V ou V/V ?", "Pour un liquide de densité ≠ 1, 100 g et 100 mL ne sont pas la même quantité : le même « % » donnerait des masses différentes."],
        ["Pourquoi 1 % (m/V) = 10 mg/mL ?", "1 g dans 100 mL = 1000 mg dans 100 mL = 10 mg dans 1 mL."]],
  talk: { prompt: "Explique comment trouver la dose de codéine dans 1 cuillère à café d'un sirop à 0,10 % (m/V).", check: ["0,10 % = 0,10 g / 100 mL", "= 1 mg/mL", "C à c = 5 mL → 5 mg"] },
  traps: ["Calculer le % sur la somme des ingrédients au lieu du volume final (« ad »).", "Oublier de convertir ctg/mg en g avant de calculer un %."] },

{ id: "densite", title: "Les densités",
  html: `<p>On mesure en général le <b>volume</b> d'un liquide. Mais pour un liquide <span class="k">très visqueux</span> (ou quand la formule est en masse), on doit <b>peser</b> : la densité permet de passer du volume à la masse.</p>
  <p>La densité compare la masse d'un volume de liquide à celle du même volume d'eau : celle de l'eau vaut <span class="k">1</span> (1 mL d'eau pèse 1 g).</p>
  <div class="formula">m = V × d    ·    V = m ÷ d</div>
  <table><tr><th>Solvant (20 °C)</th><th>Densité</th></tr>
  <tr><td>Éthanol</td><td><span class="k">0,79</span></td></tr><tr><td>Méthanol</td><td><span class="k">0,80</span></td></tr>
  <tr><td>Propylène glycol</td><td><span class="k">1,04</span></td></tr><tr><td>Isopropanol</td><td><span class="k">0,79</span></td></tr>
  <tr><td>Éther</td><td><span class="k">0,71</span></td></tr><tr><td>Acétone</td><td><span class="k">0,79</span></td></tr>
  <tr><td>Huile de paraffine</td><td><span class="k">0,86</span></td></tr></table>
  <p><b>Moyen mnémotechnique</b> : les alcools et l'acétone ≈ <span class="k">0,79–0,80</span> ; seul le <span class="k">propylène glycol</span> dépasse 1 ; l'éther est le plus léger (<span class="k">0,71</span>).</p>
  <p><b>Contrôle</b> : si d &lt; 1, le volume (mL) est <span class="k">plus grand</span> que la masse (g) ; si d &gt; 1, il est plus petit.</p>`,
  why: [["Pourquoi pèse-t-on les liquides visqueux ?", "Un liquide visqueux colle aux parois de l'éprouvette : le volume mesuré serait imprécis. Peser la masse correspondante (m = V × d) est plus exact."],
        ["Pourquoi 27 g de teinture (d = 0,9) font-ils 30 mL ?", "d < 1 : le liquide est plus léger que l'eau, donc il faut plus de volume pour la même masse : 27 ÷ 0,9 = 30 mL."]],
  talk: { prompt: "Explique comment mesurer le volume de teinture (d = 0,9) pour 540 g de sirop à 5 % (m/m).", check: ["5 % de 540 g = 27 g de teinture", "V = m ÷ d", "27 ÷ 0,9 = 30 mL", "d < 1 donc volume > masse : cohérent"] },
  traps: ["Multiplier au lieu de diviser (V = m ÷ d, pas m × d).", "Donner la masse (27 g) quand on demande un volume.", "Oublier que la densité de l'eau vaut exactement 1."] }
],

  const pairs = [["cg", "mg"], ["mg", "g"], ["cg", "g"], ["g", "mg"], ["g", "cg"], ["µg", "mg"], ["mg", "µg"], ["ctg", "mg"], ["dg", "mg"], ["mg", "cg"]];

  const v = pick(vals[f]); const ans = r10(v * U[f] / U[t]);
  return { q: `${fmt(v)} ${f} = ? ${t === "ctg" ? "cg" : t}`, ans, unit: t, tol: { rel: 0.001 }, steps: [`1 ${f} = ${fmt(r10(U[f] / U[t]), 8)} ${t}`, `${fmt(v)} × ${fmt(r10(U[f] / U[t]), 8)} = <b>${fmt(ans, 8)} ${t}</b>`] };
} },

const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function fmt(n, d = 8) {
  if (typeof n !== "number" || !isFinite(n)) return String(n);
  let s = (Math.round(n * 10 ** d) / 10 ** d).toFixed(d).replace(/0+$/, "").replace(/\.$/, "");
  const [i, f] = s.split(".");
  const ii = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return f ? ii + "," + f : ii;
}
function parseNum(s) {
  if (s == null) return NaN;
  s = String(s).trim().replace(/\s| /g, "").replace(",", ".");
  if (s === "½") return 0.5;
  if (/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)) { const [a, b] = s.split("/"); return parseFloat(a) / parseFloat(b); }
  if (!/^-?(\d+\.?\d*|\.\d+)(e-?\d+)?$/i.test(s)) return NaN;
  return parseFloat(s);
}
function near(x, target, tol) {
  if (isNaN(x)) return false;
  if (tol && tol.abs != null) return Math.abs(x - target) <= tol.abs + 1e-12;
  const rel = tol && tol.rel != null ? tol.rel : 0.005;
  return Math.abs(x - target) <= Math.max(Math.abs(target) * rel, 1e-12);
}

  <tr><td><b>E</b></td><td><span class="k">g d'excipient dans 1 suppositoire sans PA</span> (1<sup>re</sup> coulée)</td></tr>
  <tr><td><b>M</b></td><td><span class="k">g de masse (excipient) dans 1 suppositoire avec PA</span> (2<sup>e</sup> coulée)</td></tr>
  <tr><td><b>S</b></td><td><span class="k">g de PA dans 1 suppositoire</span></td></tr></table>
  <p><b>Exemple du cours</b> : 7 suppositoires purs = 20,51 g → <span class="k">E = 2,93 g</span>. 11 suppositoires à 10 % = 33,528 g → 1 suppo = 3,048 g → <span class="k">M = 3,048 × 0,9 = 2,7432 g</span> et <span class="k">S = 3,048 × 0,1 = 0,3048 g</span>. f = (2,93 − 2,7432) ÷ 0,3048 = <span class="k">0,61</span>.</p>`,
  why: [["Pourquoi M = 90 % et S = 10 % du suppositoire de la 2e coulée ?", "On a coulé un mélange contenant 10 % de PA : chaque suppositoire contient donc 10 % de PA (S) et 90 % de masse (M)."],
        ["Que signifie f = 0,61 ?", "1 g d'oxytétracycline prend la place de 0,61 g d'excipient : il faut retirer 0,61 g d'excipient par g de PA ajouté."]],
  talk: { prompt: "Explique d'où viennent E, M et S et calcule f avec l'exemple 20,50 g / 7 et 26,89 g / 9.", check: ["E = masse d'un suppositoire pur = 20,50 ÷ 7 = 2,93 g", "1 suppo à 10 % = 26,89 ÷ 9 = 2,99 g", "M = 2,99 × 0,9 = 2,689 g ; S = 2,99 × 0,1 = 0,299 g", "f = (2,93 − 2,689) ÷ 0,299 ≈ 0,81"] },
  traps: ["Diviser par le nombre total de suppositoires au lieu de travailler sur 1 suppositoire.", "Prendre S = 10 % de E au lieu de 10 % du suppositoire avec PA.", "Écrire f = (M − E) ÷ S (signe inversé)."] },

{ id: "base", title: "La masse d'excipient en pratique",
  html: `<div class="formula">M = E − Σ (f<sub>i</sub> × S<sub>i</sub>)</div>
  <p>Pour <b>1 suppositoire</b> : on part de E (masse d'un suppositoire d'excipient pur) et on retire, pour chaque PA, sa masse déplacée f × S (S en <b>grammes</b>).</p>
  <p><b>E</b> = masse d'un suppositoire pur du moule (<span class="k">masse totale ÷ nombre</span>) ou le poids indiqué « suppo de 1 g / de 2 g ».</p>
  <p><b>En pratique</b> : on multiplie par <span class="k">n + 1</span> suppositoires (dt + 1).</p>
  <p><b>Exemple</b> : 6 suppositoires de 2 g à 125 mg de paracétamol (f = 0,72) : M = 2 − 0,72 × 0,125 = <span class="k">1,91 g</span> → × 7 = <span class="k">13,37 g</span>.</p>
  <p>Les PA eux-mêmes se pèsent aussi pour n + 1 : 200 mg × 7 = <span class="k">1,4 g</span>.</p>`,
  why: [["Pourquoi soustraire f × S et pas S ?", "1 g de PA ne remplace pas forcément 1 g d'excipient : il en remplace f g (selon sa densité relative à la base)."],
        ["Pourquoi le piège « n » est-il si fréquent dans les QCM ?", "La réponse calculée pour n suppositoires est souvent proposée : elle est juste mathématiquement mais fausse « en pratique »."]],
  talk: { prompt: "Explique comment calculer la base pour « phénobarbital 40 mg (f 0,82), aminophylline 200 mg (f 0,88), dt X » avec 8 suppos purs = 15,76 g.", check: ["E = 15,76 ÷ 8 = 1,97 g", "Σ f·S = 0,82 × 0,04 + 0,88 × 0,2 = 0,2088 g", "M = 1,97 − 0,2088 = 1,7612 g", "× 11 (dt X + 1) = 19,37 g"] },
  traps: ["Oublier de convertir les mg de PA en g dans f × S.", "Multiplier par n au lieu de n + 1.", "Oublier un des PA dans la somme."] }
],

trit: { c: "tritcalc", method: "Trituration : PA → masse de mélange", make() {
  const [lab, , fac] = pick(TRIT); const ug = Math.random() < .5;
  const dose = ug ? pick([10, 20, 25, 30, 50, 100]) : pick([0.1, 0.2, 0.25, 0.5, 1, 2, 5]); const n = pick([10, 20, 30, 40, 50, 60]);
  const paMg = r10((ug ? dose / 1000 : dose) * n); const ans = r10(paMg * fac);
  return { ctx: `Rp PA ${fmt(dose)} ${ug ? "µg" : "mg"}\n   pf 1 gél dt ${roman(n)}`, q: `Masse de trituration à ${lab} à peser (mg) ?`, ans, unit: "mg", tol: { rel: 0.001 },
    steps: [`dt ${roman(n)} = ${n}`, `PA total : ${fmt(dose)} ${ug ? "µg" : "mg"} × ${n} = ${fmt(paMg)} mg`, `Trituration à ${lab} → × ${fac}`, `${fmt(paMg)} × ${fac} = <b>${fmt(ans)} mg</b>`] };

romain: { c: "lecture", method: "Lecture du Rp (µg, chiffres romains)", make() {

  const v = pick([20, 30, 50, 250, 400, 900, 1500]); return { q: `${v} µg = ? mg`, ans: r10(v / 1000), unit: "mg", tol: { rel: 0.001 }, steps: [`1 µg = 0,001 mg`, `${v} ÷ 1000 = <b>${fmt(v / 1000)} mg</b>`] };

spec: { c: "gelmix", method: "Spécialité ou trituration dans une gélule", make() {
  const n = pick([30, 60, 90, 120]);
  if (Math.random() < .5) { const dos = pick([10, 20, 25, 50]); const d = pick([5, 10, 25].filter(x => x <= dos)); const tot = d * n; if (tot % dos) return this.make();
    return { ctx: `Rp … PA ${d} mg (utiliser comprimés à ${dos} mg)\n   pf 1 gél dt ${n}`, q: "Nombre de comprimés à utiliser ?", ans: tot / dos, unit: "", steps: [`${d} × ${n} = ${tot} mg`, `${tot} ÷ ${dos} = <b>${tot / dos}</b>`] }; }
  const d = pick([1, 2, 5, 10]); const [lab, , fac] = pick(TRIT.slice(2)); const tot = d * n; const ans = r10(tot * fac / 1000);
  return { ctx: `Rp … PA ${d} mg (utiliser trituration à ${lab})\n   pf 1 gél dt ${n}`, q: "Masse de trituration à peser (g) ?", ans, unit: "g", tol: { rel: 0.001 }, steps: [`PA : ${d} × ${n} = ${tot} mg`, `× ${fac} = ${fmt(tot * fac)} mg = <b>${fmt(ans)} g</b>`] };
} },
facteur: { c: "facteur", method: "Facteur de déplacement f = (E − M) ÷ S", make() {
  const E0 = pick([1.97, 2.0, 2.93, 3.0]); const f0 = pick([0.55, 0.61, 0.65, 0.7, 0.75, 0.81, 0.85]); const n1 = rnd(6, 8), n2 = rnd(8, 11);
  const W0 = E0 / (0.9 + 0.1 * f0); const t1 = Math.round(n1 * E0 * 100) / 100; const t2 = Math.round(n2 * W0 * 1000) / 1000;
  const E = t1 / n1, W = t2 / n2, M = W * 0.9, S = W * 0.1, f = (E - M) / S;
  return { raw: { n1, t1, n2, t2 }, ctx: `${n1} suppositoires de masse pure pèsent ${fmt(t1)} g.\n${n2} suppositoires à 10 % de PA pèsent ${fmt(t2)} g.`, q: "Facteur de déplacement f (2 décimales) ?", ans: Math.round(f * 100) / 100, unit: "", tol: { abs: 0.02 },
    steps: [`E = ${fmt(t1)} ÷ ${n1} = ${fmt(E, 4)} g`, `1 suppo à 10 % = ${fmt(t2)} ÷ ${n2} = ${fmt(W, 4)} g`, `M = ${fmt(W, 4)} × 0,9 = ${fmt(M, 4)} g ; S = ${fmt(S, 4)} g`, `f = (${fmt(E, 4)} − ${fmt(M, 4)}) ÷ ${fmt(S, 4)} = <b>${fmt(f, 2)}</b>`] };
} },
base: { c: "base", method: "Masse d'excipient M = E − Σ f·S (n + 1)", make() {
  const n = pick([6, 8, 10, 12, 20]); const k = rnd(1, 2); const pas = shuffle(PAS).slice(0, k).map(([nm, f]) => [nm, f, pick([20, 40, 75, 100, 125, 200, 250, 300])]);
  const mould = Math.random() < .5; let E, ctxE, stE;
  if (mould) { const n0 = pick([6, 7, 8]); const e0 = pick([1.97, 2.0, 2.93]); const tot = Math.round(n0 * e0 * 100) / 100; E = tot / n0; ctxE = `\n${n0} suppositoires de masse pure (même moule) pèsent ${fmt(tot)} g.`; stE = `E = ${fmt(tot)} ÷ ${n0} = ${fmt(E, 4)} g`; }
  else { E = pick([1, 2, 3]); ctxE = ""; stE = `E = ${E} g (suppositoire de ${E} g)`; }
  const sum = pas.reduce((a, [, f, mg]) => a + f * mg / 1000, 0); const M = E - sum; const ans = r10(M * (n + 1));
  return { ctx: `Rp ${pas.map(([nm, f, mg]) => `${nm} ${mg} mg (f = ${fmt(f)})`).join("\n   ")}\n   p.f. 1 suppositoire${mould ? "" : " de " + E + " g"} dt ${roman(n)}${ctxE}`, q: "Masse de base à peser en pratique (g) ?", ans, unit: "g", tol: { rel: 0.002 },
    steps: [stE, `Σ f·S = ${pas.map(([, f, mg]) => `${fmt(f)} × ${fmt(mg / 1000)}`).join(" + ")} = ${fmt(sum, 4)} g`, `M = ${fmt(E, 4)} − ${fmt(sum, 4)} = ${fmt(M, 4)} g par suppositoire`, `dt ${roman(n)} = ${n} → en pratique ${n + 1}`, `${fmt(M, 4)} × ${n + 1} = <b>${fmt(ans, 4)} g</b>`] };
} },
paprat: { c: "base", method: "Quantité de PA en pratique (n + 1)", make() {
