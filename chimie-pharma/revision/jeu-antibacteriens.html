<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Antibactériens — le jeu</title>
<link rel="manifest" href="jeu-antibacteriens.webmanifest">
<link rel="apple-touch-icon" href="icons/antibacteriens-180.png">
<link rel="icon" type="image/png" href="icons/antibacteriens-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Antibact. jeu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a3fd6">
<style>
:root{--bg:#0f1530;--bg2:#18214a;--carte:#ffffff;--encre:#1b2233;--doux:#6b7385;--bleu:#3b5ff0;--bleu2:#1a3fd6;--or:#f5b82e;--vert:#16a34a;--vert-p:#dcfce7;--rouge:#e5484d;--rouge-p:#fee2e2;--trait:#e6e8ef;--violet:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -200px,#2a3a8f,var(--bg));color:#fff;font:16px/1.45 -apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;overscroll-behavior:none}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 20px)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
.ic.f{fill:currentColor;stroke:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .logo{width:42px;height:42px;border-radius:12px;background:#fff}
.top h1{font-size:1.15rem;margin:0;flex:1;line-height:1.15}.top h1 small{display:block;font-weight:400;opacity:.7;font-size:.78rem}
.stats{display:flex;gap:8px;margin:6px 0 14px}
.stat{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.stat b{font-size:1.1rem;display:block;line-height:1}.stat span{font-size:.72rem;opacity:.75}
.stat .ic{width:26px;height:26px}
.flamme{color:#ff8a3d}.etoile{color:var(--or)}.eclair{color:#7dd3fc}
.rang{background:linear-gradient(135deg,#3b5ff0,#7c3aed);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.rang .t{display:flex;justify-content:space-between;font-size:.85rem;opacity:.9}
.barre{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:6px}
.barre i{display:block;height:100%;background:linear-gradient(90deg,#fde68a,#f5b82e);border-radius:99px;transition:width .5s}
.obj{margin-top:8px;font-size:.8rem;opacity:.9;display:flex;gap:6px;align-items:center}
.sect{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:18px 4px 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--carte);color:var(--encre);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mode .ic{width:28px;height:28px;color:var(--bleu2)}
.mode b{font-size:.98rem}.mode small{color:var(--doux);font-size:.76rem;line-height:1.25}
.mode.vedette{grid-column:1/-1;background:linear-gradient(135deg,#f5b82e,#ff8a3d);color:#2a1600}
.mode.vedette .ic{color:#2a1600}.mode.vedette small{color:#4a2a00}
.chemin{display:flex;flex-direction:column;gap:10px}
.niv{display:flex;align-items:center;gap:12px;background:var(--carte);color:var(--encre);border-radius:18px;padding:12px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.niv:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.niv .rond{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--bleu);color:#fff;font-weight:800;font-size:1.1rem;flex:none}
.niv.boss .rond{background:var(--violet)}
.niv.fini .rond{background:var(--vert)}
.niv.verrou{opacity:.55}.niv.verrou .rond{background:#9aa1b2}
.niv .tx{flex:1}.niv .tx b{display:block;font-size:.95rem;line-height:1.2}.niv .tx small{color:var(--doux);font-size:.75rem;display:block;line-height:1.25}
.niv .etoiles{display:flex;gap:2px;color:#d7dae3}.niv .etoiles .on{color:var(--or)}
.niv .maitrise{height:5px;background:var(--trait);border-radius:9px;margin-top:5px;overflow:hidden}.niv .maitrise i{display:block;height:100%;background:var(--vert)}
/* écran de jeu */
.jeu{display:none}.jeu.on{display:block}.accueil.off{display:none}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud .quit{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.hud .prog{flex:1;height:14px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.hud .prog i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#16a34a);transition:width .3s}
.coeurs{display:flex;gap:2px;color:var(--rouge)}.coeurs .vide{color:rgba(255,255,255,.25)}
.combo{text-align:center;font-weight:800;color:var(--or);height:22px;font-size:.95rem}
.timer{text-align:center;font-weight:800;font-size:1.3rem;color:#7dd3fc}
.q{background:var(--carte);color:var(--encre);border-radius:22px;padding:18px 16px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.q .type{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--bleu2);font-weight:700;display:flex;gap:6px;align-items:center}
.q h2{font-size:1.12rem;margin:8px 0 12px;line-height:1.3}
.q .struct{display:block;margin:0 auto 10px;max-width:100%;max-height:200px;background:#fff}
.q .grand{font-size:1.5rem;font-weight:800;text-align:center;color:var(--bleu2);margin:6px 0 14px}
.choix{display:grid;gap:9px}
.ch{background:#f4f5f9;border:2px solid var(--trait);border-radius:14px;padding:12px 12px;text-align:left;font-size:.95rem;color:var(--encre);box-shadow:0 3px 0 var(--trait)}
.ch:active{transform:translateY(2px);box-shadow:none}
.ch.ok{background:var(--vert-p);border-color:var(--vert);box-shadow:0 3px 0 var(--vert)}
.ch.ko{background:var(--rouge-p);border-color:var(--rouge);box-shadow:0 3px 0 var(--rouge);animation:shake .35s}
.vf{grid-template-columns:1fr 1fr}.vf .ch{text-align:center;font-weight:700;font-size:1.05rem}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;border-radius:14px;padding:12px;font-size:.9rem;display:none}
.fb.on{display:block}.fb.ok{background:var(--vert-p);color:#14532d}.fb.ko{background:var(--rouge-p);color:#7f1d1d}
.fb b{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.suite{width:100%;margin-top:14px;background:var(--bleu);color:#fff;border-radius:16px;padding:14px;font-weight:800;font-size:1.02rem;box-shadow:0 5px 0 var(--bleu2);display:none}
.suite.on{display:block}.suite:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bleu2)}
.reveal{background:#f4f5f9;border-radius:14px;padding:12px;margin-top:10px;display:none;font-size:.93rem}
.reveal.on{display:block}
.auto{display:none;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.auto.on{display:grid}
.auto button{border-radius:14px;padding:12px 6px;font-weight:700;font-size:.85rem;color:#fff}
.auto .a1{background:var(--rouge)}.auto .a2{background:#f59e0b}.auto .a3{background:var(--vert)}
.voir{width:100%;margin-top:12px;background:var(--encre);color:#fff;border-radius:14px;padding:12px;font-weight:700}
canvas.dessin{width:100%;height:260px;background:#fff;border:2px dashed #c7cbd8;border-radius:14px;touch-action:none;display:block}
.outils{display:flex;gap:8px;margin-top:6px}.outils button{flex:1;background:#eef0f6;color:var(--encre);border-radius:10px;padding:8px;font-size:.85rem}
.paire{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paire button{background:#f4f5f9;border:2px solid var(--trait);border-radius:12px;padding:10px 8px;font-size:.85rem;color:var(--encre);min-height:52px}
.paire button.sel{border-color:var(--bleu);background:#e7ecfd}
.paire button.fait{visibility:hidden}
.paire button.ko{border-color:var(--rouge);animation:shake .35s}
/* fin */
.fin{text-align:center;padding:10px 0}
.fin .grosse{font-size:2.4rem;font-weight:900;margin:6px 0}
.fin .etoiles{display:flex;justify-content:center;gap:6px;color:rgba(255,255,255,.25)}.fin .etoiles .on{color:var(--or)}
.fin .etoiles .ic{width:46px;height:46px}
.gains{display:flex;gap:10px;justify-content:center;margin:14px 0}
.gains div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 14px}
.gains b{display:block;font-size:1.3rem}
.erreurs{background:var(--carte);color:var(--encre);border-radius:16px;padding:12px;text-align:left;margin-top:10px;font-size:.88rem}
.erreurs li{margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-120px);background:#fff;color:var(--encre);border-radius:16px;padding:10px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .35s;z-index:9;display:flex;gap:8px;align-items:center;max-width:92%}
.toast.on{transform:translateX(-50%) translateY(0)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:rgba(255,255,255,.07);border-radius:14px;padding:8px 4px;text-align:center;font-size:.66rem;opacity:.45}
.badge.on{opacity:1;background:rgba(245,184,46,.18)}
.badge .ic{width:26px;height:26px;color:var(--or);display:block;margin:0 auto 4px}
.note{font-size:.75rem;opacity:.6;text-align:center;margin-top:18px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:8}
</style></head><body>

}, {"id": "trimethoprime", "dci": "Triméthoprime", "marq": "BACTRIM® (+ sulfaméthoxazole)", "marques": ["BACTRIM® (+ sulfaméthoxazole)", "EUSAPRIM® (+ sulfaméthoxazole)"], "classe": "Antifolates : inhibiteurs de la dihydrofolate réductase", "sous": "Inhibiteur sélectif de la DHFR bactérienne", "meca": "Inhibe de manière préférentielle la dihydrofolate réductase bactérienne (sélectivité bactérie/homme d'environ 40 000, car la DHFR humaine est différente) : empêche la réduction de l'acide dihydrofolique en THF. Bactérios", "img": "../assets/rdkit/trimethoprime.svg", "dessin": true, "ch": "01_bases_sulfamides"}, {"id": "sulfamethoxazole", "dci": "Sulfaméthoxazole", "marq": "BACTRIM® (+ triméthoprime)", "marques": ["BACTRIM® (+ triméthoprime)", "EUSAPRIM® (+ triméthoprime)"], "classe": "Sulfamidés antibactériens", "sous": "Sulfamidé systémique / urinaire", "meca": "Analogue du PABA, inhibe la dihydroptéroate synthétase (prévient la synthèse de l'acide folique chez les micro-organismes). Bactériostatique.", "img": "../assets/rdkit/sulfamethoxazole.svg", "dessin": true, "ch": "01_bases_sulfamides"}, {"id": "co-trimoxazole", "dci": "Co-trimoxazole", "marq": "BACTRIM®", "marques": ["BACTRIM®", "EUSAPRIM®"], "classe": "Antifolates en association", "sous": "Sulfamidé + inhibiteur de la DHFR (rapport 1 : 5)", "meca": "Action à deux niveaux de la même voie : le sulfaméthoxazole inhibe la synthèse de l'acide folique (dihydroptéroate synthétase) et le triméthoprime empêche la réduction de l'acide dihydrofolique (dihydrofolate réductase).", "img": "../assets/rdkit/co-trimoxazole.svg", "dessin": true, "ch": "01_bases_sulfamides"}, {"id": "sulfasalazine", "dci": "Sulfasalazine", "marq": "SALAZOPYRINE®", "marques": ["SALAZOPYRINE®"], "classe": "Sulfamidés", "sous": "Sulfamidé intestinal (pro-drug de la mésalazine)", "meca": "Pro-drug : la mésalazine libérée dans l'intestin est la partie efficace (effet anti-inflammatoire). La sulfasalazine n'est que le vecteur qui en empêche la résor uinolones_urinaires_TB_lepre"}, {"id": "moxifloxacine", "dci": "Moxifloxacine", "marq": "AVELOX®", "marques": ["AVELOX®", "MOXIFLOXACINE TEVA®", "MOXIFLOXACINE EG®", "MOXIFLOXACINE SANDOZ®"], "classe": "Fluoroquinolones", "sous": "Quinolone de 3e génération", "meca": "Inhibe la topo-isomérase II (DNA-gyrase).", "img": "../assets/rdkit/moxifloxacine.svg", "dessin": false, "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "nitrofurantoine", "dci": "Nitrofurantoïne", "marq": "FURADANTINE MC®", "marques": ["FURADANTINE MC®"], "classe": "Nitrofurannes", "sous": "", "meca": "Les bactéries réduisent le groupe NO2 beaucoup plus vite que les cellules de l'organisme ; ce sont les métabolites réduits qui lèsent le DNA (d'où peu d'effets sur les cellules de l'hôte).", "img": "../assets/rdkit/nitrofurantoine.svg", "dessin": false, "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "fosfomycine", "dci": "Fosfomycine", "marq": "MONURIL® (+ trométamol)", "marques": ["MONURIL® (+ trométamol)"], "classe": "Fosfomycine (acide phosphonique époxydé)", "sous": "Inhibiteur précoce de la synthèse du peptidoglycane", "meca": "Inhibe la pyruvyl transférase impliquée dans l'une des premières réactions (intracytoplasmique) de la synthèse du peptidoglycane ; elle doit donc pénétrer dans la bactérie, via un système de transport.", "img": "../assets/rdkit/fosfomycine.svg", "dessin": false, "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "isoniazide", "dci": "Isoniazide", "marq": "NICOTIBINE®", "marques": ["NICOTIBINE®"], "classe": "Tuberculostatiques majeurs (1re intention)", "sous": "Dérivé de la nicotinamide (hydrazide de l'acide isonicotinique)", "meca": "Mécanisme encore mal connu ; un mécanisme possible serait l'inhibition de la synthèse des acides mycoliques de la paroi des mycobactéries. Inhibe aussi la monoamine oxydase (MAO).", "img": "../assets/rdkit/isoniazide.svg", "dessin": true, "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "pyrazinamide", "dci": "Pyrazinamide", "marq": "TEBRAZID®", "marques": ["TEBRAZID®"], "classe": "Tuberculostatiques majeurs (1re intention)", "sous": "Dérivé de la nicotinamide (pro-drogue)", "meca": "Mal connu : pro-drogue qui diffuse dans le granulome de M. tuberculosis où la pyrazinamidase la convertit en acide pyrazinoïque, qui inhiberait la synthèse des acides gras.", "img": "../assets/rdkit/pyrazinamide.svg", "dessin": false, "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "ethambutol", "dci": "Éthambutol", "marq": "MYAMBUTOL®", "marques": ["MYAMBUTOL®"], "classe": "Tuberculostatiques majeurs (1re intention)", "sous": "Dérivé de l'éthylène diamine", "meca": "Méconnu : capté par les mycobactéries en phase de croissance exponentielle, il semble inhiber l'incorporation de l'acide mycolique ou de l'arabinose dans la paroi.", "img": "../assets/rdkit/ethambutol.svg", "dessin": false, "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "bedaquiline", "dci": "Bédaquiline", "marq": "SIRTURO®", "marques": ["SIRTURO®"], "classe": "Diarylquinoléines", "sous": "Réservée à la tuberculose multirésistante", "meca": "Inhibe spécifiquement l'ATP synthase mycobactérienne, enzyme indispensable à l'approvisionnement énergétique de Mycobacterium tuberculosis.", "img": "../assets/rdkit/bedaquiline.svg", "dessin": false, "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "dapsone", "dci": "Dapsone", "marq": "", "marques": [], "classe": "Sulfones", "sous": "Inhibiteur de la synthèse d'acide folique", "meca": "Même mécanisme que les sulfamidés : analogue du PABA, entre en compétition avec lui et inhibe la dihydroptéroate synthétase → inhibition de la synthèse d'acide folique.", "img": "../assets/rdkit/dapsone.svg", "dessin": true, "ch": "06_quinolones_urinaires_TB_lepre"}], "q": [{"id": "01-q01", "t": "qcm", "q": "Quelle(s) DCI contient le BACTRIM® ?", "c": ["Sulfaméthoxazole + triméthoprime", "Sulfasalazine", "Sulfadiazine argentique", "Triméthoprime seul"], "r": "Sulfaméthoxazole + triméthoprime", "x": "BACTRIM® et EUSAPRIM® = co-trimoxazole (rapport triméthoprime : sulfaméthoxazole 1 : 5).", "ch": "01_bases_sulfamides"}, {"id": "01-q02", "t": "qcm", "q": "FLAMMAZINE® et SULFASIL® contiennent :", "c": ["Sulfadiazine argentique", "Sulfasalazine", "Mésalazine", "Sulfaméthoxazole"], "r": "Sulfadiazine argentique", "x": "Sulfamidé le plus utilisé en usage externe, surtout pour les brûlures infectées.", "ch": "01_bases_sulfamides"}, {"id": "01-q03", "t": "qcm", "q": "Lequel de ces noms commerciaux ne contient PAS de mésalazine seule ?", "c": ["SALAZOPYRINE®", "PENTASA®", "CLAVERSAL®", "COLITOFALK®"], "r": "SALAZOPYRINE®", "x": "SALAZOPYRINE® = sulfasalazine, pro-drug libérant la mésalazine et la sulfapyridine. CLAVERSAL®, COLITOFALK®, ASAMOVON® et PENTASA® = mésalazine seule.", "ch": "01_bases_sulfamides"}, {"id": "01-q04", "t": "qcm", "q": "Quelle enzyme les sulfamidés inhibent-ils ?", "c": ["Dihydroptéroate synthétase", "Dihydrofolate réductase", "Thymidylate synthase", "DD-transpeptidase"], "r": "Dihydroptéroate synthétase", "x": "Enzyme microbienne qui incorpore le PABA pour former l'acide folique. La DHFR est la cible du triméthoprime.", "ch": "01_bases_sulfamides"}, {"id": "01-q05", "t": "qcm", "q": "Quelle enzyme le triméthoprime inhibe-t-il préférentiellement ?", "c": ["Dihydrofolate réductase bactérienne", "Dihydroptéroate synthétase", "Dihydrofolate réductase humaine", "Cyclooxygénase"], "r": "Dihydrofolate réductase bactérienne", "x": "Sélectivité bactérie/homme d'environ 40 000, les deux enzymes étant différentes.", "ch": "01_bases_sulfamides"}, {"id": "01-q06", "t": "vrai_faux", "q": "Les sulfamidés sont bactéricides.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Ils empêchent la croissance et la multiplication des micro-organismes : bactériostatiques mais non bactéricides.", "ch": "01_bases_sulfamides"}, {"id": "01-q07", "t": "qcm", "q": "Selon les RSA, où doivent se trouver le NH2 et le SO2NH2 sur le noyau aromatique d'un sulfamidé ?", "c": ["En para", "En ortho", "En méta", "Peu importe"], "r": "En para", "x": "Les substituants doivent impérativement être en para, comme dans le PABA qu'ils imitent.", "ch": "01_bases_sulfamides"}, {"id": "01-q08", "t": "qcm", "q": "Quel effet a la disubstitution de l'azote du groupement sulfamoyle ?", "c": ["Elle inactive généralement la molécule", "Elle augmente l'activité", "Elle allonge la demi-vie à une semaine", "Elle rend la molécule bactéricide"], "r": "Elle inactive généralement la molécule", "x": "C'est la monosubstitution par un hétérocycle aromatique qui augmente l'activité ; un OCH3 sur cet hétérocycle allonge le T1/2.", "ch": "01_bases_sulfamides"}, {"id": "01-q09", "t": "vrai_faux", "q": "Le NH2 d'un sulfamidé peut porter un groupement labile éliminé lors de la métabolisation (ex. -N=N-).", "c": ["Vrai", "Faux"], "r": "Vrai", "x": "Le NH2 doit rester primaire, mais un groupement labile (-N=N-, -NH-CO-R) reste envisageable : c'est le cas du PRONTOSIL® et de la sulfasalazine.", "ch": "01_bases_sulfamides"}, {"id": "01-q10", "t": "qcm", "q": "Pourquoi le PRONTOSIL® est-il qualifié de pro-drug ?", "c": ["Il est inactif in vitro et métabolisé en sulfanilamide actif", "Il est actif in vitro mais pas in vivo", "Il est d'origine naturelle", "Il inhibe directement la DHFR"], "r": "Il est inactif in vitro et métabolisé en sulfanilamide actif", "x": "Il est métabolisé en 4-aminobenzènesulfonamide (sulfanilamide, seul actif) et en dérivé triaminobenzénique.", "ch": "01_bases_sulfamides"}, {"id": "01-q11", "t": "qcm", "q": "De quels trois éléments l'acide folique est-il constitué ?", "c": ["Cycle ptéridine, acide para-aminobenzoïque, glutamate", "Cycle purine, PABA, glycine", "Cycle ptéridine, acide salicylique, glutamate", "Pyrimidine, benzène, aspartate"], "r": "Cycle ptéridine, acide para-aminobenzoïque, glutamate", "x": "Les mammifères savent synthétiser la ptéridine mais pas y greffer le PABA et le glutamate.", "ch": "01_bases_sulfamides"}, {"id": "01-q12", "t": "qcm", "q": "Quelle est la forme active de l'acide folique ?", "c": ["Acide tétrahydrofolique (THF)", "Acide dihydrofolique", "Acide para-aminobenzoïque", "Acide dihydroptéroïque"], "r": "Acide tétrahydrofolique (THF)", "x": "Deux réductions successives, la seconde par la dihydrofolate réductase.", "ch": "01_bases_sulfamides"}, {"id": "01-q13", "t": "qcm", "q": "Un déficit en folates entraîne essentiellement :", "c": ["Une anémie macrocytaire", "Une anémie microcytaire", "Une hyperkaliémie", "Une hypoglycémie"], "r": "Une anémie macrocytaire", "x": "Hématies de taille augmentée (anémie mégaloblastique) par perturbation de la synthèse de l'ADN.", "ch": "01_bases_sulfamides"}, {"id": "01-q14", "t": "qcm", "q": "Quelle réaction, dépendante des dérivés du THF, fournit la thymidine pour l'ADN ?", "c": ["dUMP → dTMP par la thymidylate synthase", "5-PRP → IMP", "Sérine → glycine", "Dihydrofolate → tétrahydrofolate"], "r": "dUMP → dTMP par la thymidylate synthase", "x": "Réaction particulièrement importante dans les cellules en division rapide.", "ch": "01_bases_sulfamides"}, {"id": "01-q15", "t": "qcm", "q": "Lequel de ces composés n'est PAS un analogue structural du PABA inhibant la synthèse d'acide folique ?", "c": ["Triméthoprime", "Sulfamidés antibactériens", "Sulfones (dapsone)", "Acide para-aminosalicylique"], "r": "Triméthoprime", "x": "Le triméthoprime n'est pas un faux substrat du PABA : il inhibe l'étape suivante (DHFR).", "ch": "01_bases_sulfamides"}, {"id": "01-q16", "t": "qcm", "q": "Quel effet indésirable est spécifiquement attribué au triméthoprime ?", "c": ["Hyperkaliémie", "Argyrisme", "Hémolyse en cas de déficit en G6PD", "Allergie croisée avec les sulfamidés hypoglycémiants"], "r": "Hyperkaliémie", "x": "Le cours cite l'hyperkaliémie et les troubles hématologiques (interférence avec les folates) dus au triméthoprime.", "ch": "01_bases_sulfamides"}, {"id": "01-q17", "t": "vrai_faux", "q": "Le co-trimoxazole est déconseillé au premier trimestre de la grossesse.", "c": ["Vrai", "Faux"], "r": "Vrai", "x": "Indices d'effet tératogène du triméthoprime ; si inévitable, supplémentation en acide folique. Données rassurantes aux 2e et 3e trimestres.", "ch": "01_bases_sulfamides"}, {"id": "01-q18", "t": "qcm", "q": "Dans la sulfasalazine, quelle partie est efficace dans la colite ulcéreuse ?", "c": ["La mésalazine (5-ASA)", "La sulfapyridine", "Le pont azo", "La sulfasalazine intacte"], "r": "La mésalazine (5-ASA)", "x": "La sulfasalazine n'est que le vecteur (pro-drug) qui empêche la résorption de la mésalazine dans la partie haute de l'intestin.", "ch": "01_bases_sulfamides"}, {"id": "01-q19", "t": "qcm", "q": "Les sulfamidés intestinaux sont caractérisés par :", "c": ["Une très faible résorption et une élimination intestinale", "Une résorption rapide et une excrétion rénale sous forme active", "Une application sur les brûlures", "Une demi-vie d'une semaine"], "r": "Une très faible résorption et une élimination intestinale", "x": "Le 2e choix décrit les sulfamidés urinaires.", "ch": "01_bases_sulfamides"}, {"id": "01-q20", "t": "qcm", "q": "Pourquoi les sulfamidés sont-ils amphotères ?", "c": ["Ils ont un caractère acide (-SO2NH-R) et basique (-NH2)", "Ils sont à la fois hydrophiles et lipophiles", "Ils agissent sur les Gram+ et les Gram−", "Ils forment des sels d'argent"], "r": "Ils ont un caractère acide (-SO2NH-R) et basique (-NH2)", "x": "D'où leur solubilité dans les acides et les bases diluées.", "ch": "01_bases_sulfamides"}, {"id": "01-q21", "t": "qcm", "q": "Quel produit agit sur des surfaces inertes (sols, poignées, brancards) ?", "c": ["Un désinfectant", "Un antiseptique", "Un antibiotique", "Un bactériostatique"], "r": "Un désinfectant", "x": "L'antiseptique agit sur les surfaces externes du corps ; le désinfectant sur les objets inanimés.", "ch": "01_bases_sulfamides"}, {"id": "01-q22", "t": "qcm", "q": "Lors de la coloration de Gram, pourquoi les Gram− se décolorent-elles à l'alcool ?", "c": ["Leur paroi est fine et riche en lipides (LPS), l'éthanol pénètre", "Leur couche de peptidoglycane est épaisse", "Elles n'ont pas de paroi", "Elles ne fixent pas le lugol"], "r": "Leur paroi est fine et riche en lipides (LPS), l'éthanol pénètre", "x": "Les Gram+ ont une couche épaisse de peptidoglycane qui s'oppose au passage de l'alcool.", "ch": "01_bases_sulfamides"}, {"id": "01-q23", "t": "qcm", "q": "Quelles bactéries sont dépourvues de paroi ?", "c": ["Les mycoplasmes", "Les spirochètes", "Les entérobactéries", "Les staphylocoques"], "r": "Les mycoplasmes", "x": "La paroi est présente chez toutes les bactéries sauf les mycoplasmes (ex. Mycoplasma pneumoniae).", "ch": "01_bases_sulfamides"}, {"id": "01-q24", "t": "vrai_faux", "q": "Il est démontré cliniquement que les bactéricides sont supérieurs aux bactériostatiques dans les infections graves.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Cette idée n'est pas étayée par des données cliniques ; la distinction repose sur des analyses in vitro.", "ch": "01_bases_sulfamides"}, {"id": "01-q25", "t": "qcm", "q": "Quel mécanisme de résistance aux sulfamidés le cours cite-t-il ?", "c": ["Une production accrue de PABA par certains germes", "Une β-lactamase", "Une mutation de l'ADN-gyrase", "L'absence de paroi"], "r": "Une production accrue de PABA par certains germes", "x": "Le PABA en excès déplace l'inhibiteur compétitif.", "ch": "01_bases_sulfamides"}, {"id": "01-q26", "t": "qcm", "q": "Quel hétérocycle porte le sulfonamide du sulfaméthoxazole ?", "c": ["Un 5-méthylisoxazole", "Une pyrimidine", "Une pyridine", "Un thiadiazole"], "r": "Un 5-méthylisoxazole", "x": "Pyrimidine = sulfadiazine ; pyridine = sulfapyridine (dans la sulfasalazine) ; thiadiazole = 2254 RP (sulfamide hypoglycémiant historique).", "ch": "01_bases_sulfamides"}, {"id": "01-q27", "t": "qcm", "q": "Quel motif structural caractérise le triméthoprime ?", "c": ["Une 2,4-diaminopyrimidine liée par un CH2 à un 3,4,5-triméthoxyphényle", "Un benzènesulfonamide para-aminé", "Un acide salicylique aminé en 5", "Un cycle ptéridine lié au PABA"], "r": "Une 2,4-diaminopyrimidine liée par un CH2 à un 3,4,5-triméthoxyphényle", "x": "Le triméthoprime n'est pas un sulfamidé. Le 2e choix = sulfanilamide, le 3e = mésalazine, le 4e = acide folique.", "ch": "01_bases_sulfamides"}, {"id": "01-q28", "t": "qcm", "q": "Quel effet indésirable local une utilisation prolongée de sulfadiazine argentique peut-elle provoquer ?", "c": ["Argyrisme (peau gris-ardoise)", "Coloration rouge des urines", "Photosensibilisation", "Rupture du tendon d'Achille"], "r": "Argyrisme (peau gris-ardoise)", "x": "Ses composants (sulfadiazine, Ag+) peuvent être résorbés lors d'un traitement long ou sur une grande surface.", "ch": "01_bases_sulfamides"}, {"id": "01-q30", "t": "qcm", "q": "Quand administre-t-on l'acide folinique dans le « rescue » du méthotrexate à hautes doses ?", "c": ["Quelques heures après le méthotrexate", "En même temps que le méthotrexate", "La veille du méthotrexate", "Jamais avec le méthotrexate"], "r": "Quelques heures après le méthotrexate", "x": "Pour ne pas neutraliser les effets antitumoraux du méthotrexate.", "ch": "01_bases_sulfamides"}, {"id": "02-q-clamoxyl", "t": "qcm", "q": "Quelle est la DCI de DELAMOXYLE® ?", "c": ["Amoxicilline", "Ampicilline", "Flucloxacilline", "Témocilline"], "r": "Amoxicilline", "x": "AMOXICILLIN AB®, AMOXICILLINE EG®, AMOXICILLINE SANDOZ®, CLAMOXYL® et DELAMOXYLE® = amoxicilline.", "ch": "02_penicillines"}, {"id": "02-q-staphycid", "t": "qcm", "q": "STAPHYCID® contient :", "c": ["Flucloxacilline", "Pénicilline V", "Amoxicilline", "Pipéracilline"], "r": "Flucloxacilline", "x": "FLOXAPEN® et STAPHYCID® = flucloxacilline (pénicilline résistante aux pénicillinases).", "ch": "02_penicillines"}, {"id": "02-q-negaban", "t": "qcm", "q": "NEGABAN® correspond à :", "c": ["Témocilline", "Ticarcilline", "Pipéracilline", "Ampicilline"], "r": "Témocilline", "x": "NEGABAN® = témocilline, carboxypénicilline méthoxylée en 6α.", "ch": "02_penicillines"}, {"id": "02-q-extencin", "t": "qcm", "q": "EXTENCIN® est :", "c": ["Pénicilline G + benzathine", "Pénicilline V + benzathine", "Pipéracilline + tazobactam", "Amoxicilline + benzathine"], "r": "Pénicilline G + benzathine", "x": "La pénicilline G associée à la benzathine forme un sel peu soluble (résorption IM sur 2-4 semaines).", "ch": "02_penicillines"}, {"id": "02-q-penV-acidores", "t": "qcm", "q": "Quelle modification rend la pénicilline V acidorésistante par rapport à la pénicilline G ?", "c": ["Remplacement de l'acide phénylacétique par l'acide phénoxyacétique (plus fort)", "Ajout d'un NH2 sur le carbone α", "Hydroxylation en para du phényle", "Méthoxylation en 6α"], "r": "Remplacement de l'acide phénylacétique par l'acide phénoxyacétique (plus fort)", "x": "Le phénoxyméthyle, plus attracteur, rend l'O du C=O exocyclique moins nucléophile : il n'attaque plus le carbone β-lactamique en milieu acide.", "ch": "02_penicillines"}, {"id": "02-q-amox-vs-ampi", "t": "qcm", "q": "Qu'est-ce qui distingue structurellement l'amoxicilline de l'ampicilline ?", "c": ["Un OH en para du noyau aromatique", "Un NH2 sur le carbone α", "Un groupe méthoxy en 6α", "Un COOH sur le carbone α"], "r": "Un OH en para du noyau aromatique", "x": "L'amoxicilline provient de l'hydroxylation en para de l'ampicilline ; elle est résorbée à ~80 % contre 25-40 % pour l'ampicilline.", "ch": "02_penicillines"}, {"id": "02-q-temo-structure", "t": "qcm", "q": "La témocilline se distingue de la ticarcilline par :", "c": ["Un groupe méthoxy en 6α", "Un atome de fluor", "Un OH en para", "Un cycle pipérazine-dione"], "r": "Un groupe méthoxy en 6α", "x": "« Notons que la témocilline est une pénicilline méthoxylée en 6α. »", "ch": "02_penicillines"}, {"id": "02-q-fluclox-RR", "t": "qcm", "q": "Dans la flucloxacilline, quels sont les substituants R et R' du phényle de l'isoxazole ?", "c": ["R = F, R' = Cl", "R = H, R' = Cl", "R = H, R' = H", "R = Cl, R' = Cl"], "r": "R = F, R' = Cl", "x": "Oxacilline H/H, cloxacilline H/Cl, flucloxacilline F/Cl.", "ch": "02_penicillines"}, {"id": "02-q-6apa", "t": "qcm", "q": "Comment obtient-on industriellement le 6-APA ?", "c": ["Par hydrolyse de la pénicilline G (ou V) par la pénicilline amidase", "Par synthèse totale (1957)", "Par action d'une β-lactamase sur la pénicilline G", "Par acylation de l'acide pénicilloïque"], "r": "Par hydrolyse de la pénicilline G (ou V) par la pénicilline amidase", "x": "La pénicilline amidase de Penicillium chrysogenum scinde la pénicilline G en 6-APA + acide phénylacétique ; la synthèse totale n'a jamais été rentable.", "ch": "02_penicillines"}, {"id": "02-q-noyau", "t": "qcm", "q": "Le noyau des pénicillines associe un cycle β-lactame à :", "c": ["Un cycle thiazolidine", "Un cycle thiazine", "Un cycle isoxazole", "Un cycle pipérazine"], "r": "Un cycle thiazolidine", "x": "β-lactame (4 pièces) accolé à une thiazolidine (5 pièces) ; la thiazine est le cycle des céphalosporines.", "ch": "02_penicillines"}, {"id": "02-q-precurseurs", "t": "qcm", "q": "De quels acides aminés dérive le squelette de la pénicilline ?", "c": ["Valine et cystéine", "Alanine et sérine", "Lysine et glycine", "Valine et méthionine"], "r": "Valine et cystéine", "x": "Le squelette dérive de la cystéine et de la valine, ce qui est prouvé.", "ch": "02_penicillines"}, {"id": "02-q-meca", "t": "qcm", "q": "Quelles enzymes les pénicillines inhibent-elles ?", "c": ["Les DD-transpeptidases et DD-carboxypeptidases", "La dihydroptéroate synthétase", "L'ADN-gyrase", "La sous-unité 30S du ribosome"], "r": "Les DD-transpeptidases et DD-carboxypeptidases", "x": "Ces enzymes à sérine confondent la pénicilline avec le D-Ala-D-Ala terminal du précurseur de peptidoglycane.", "ch": "02_penicillines"}, {"id": "02-q-mycoplasme", "t": "vrai_faux", "q": "Les pénicillines sont efficaces contre les mycoplasmes.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Les β-lactames inhibent la biosynthèse de la paroi : sans effet sur les organismes dépourvus de paroi comme les mycoplasmes.", "ch": "02_penicillines"}, {"id": "02-q-bactericide", "t": "vrai_faux", "q": "Les pénicillines et les céphalosporines sont bactériostatiques.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Elles sont toutes deux bactéricides.", "ch": "02_penicillines"}, {"id": "02-q-pkpd-beta", "t": "qcm", "q": "Quel paramètre PK/PD gouverne l'efficacité des β-lactamines ?", "c": ["%fT > CMI", "Cmax/CMI", "AUC24/CMI", "Demi-vie seule"], "r": "%fT > CMI", "x": "β-lactamines = temps-dépendantes : maintenir la concentration libre au-dessus de la CMI suffisamment longtemps.", "ch": "02_penicillines"}, {"id": "02-q-pkpd-amino", "t": "qcm", "q": "Les aminoglycosides sont :", "c": ["Concentration-dépendants (pic/CMI)", "Temps-dépendants (T > CMI)", "Dépendants de l'AUC/CMI", "Indépendants de la CMI"], "r": "Concentration-dépendants (pic/CMI)", "x": "Aminoglycosides = obtenir un pic élevé par rapport à la CMI ; effet post-antibiotique.", "ch": "02_penicillines"}, {"id": "02-q-betalactamase-produit", "t": "qcm", "q": "Quel produit inactif résulte de l'hydrolyse de la pénicilline par une β-lactamase ?", "c": ["Acide pénicilloïque", "Acide pénicillénique", "6-APA", "Acide phénylacétique"], "r": "Acide pénicilloïque", "x": "Piège : l'acide pénicillénique se forme en milieu acide (estomac), l'acide pénicilloïque par les β-lactamases.", "ch": "02_penicillines"}, {"id": "02-q-encombrant", "t": "qcm", "q": "Comment a-t-on rendu des pénicillines résistantes aux β-lactamases ?", "c": ["Groupements encombrants protégeant la fonction lactame", "Augmentation de l'hydrophilie de la chaîne latérale", "Ajout d'un NH2 sur le carbone α", "Formation d'un sel avec la benzathine"], "r": "Groupements encombrants protégeant la fonction lactame", "x": "Groupements encombrants + radical acyle électrocaptant (acido-résistance) : oxacilline, cloxacilline, flucloxacilline.", "ch": "02_penicillines"}, {"id": "02-q-hydrophilie", "t": "qcm", "q": "Quel effet a l'augmentation de l'hydrophilie de la chaîne latérale ?", "c": ["Élargissement du spectre aux Gram −", "Résistance aux β-lactamases", "Action prolongée", "Perte de l'activité sur les Gram +"], "r": "Élargissement du spectre aux Gram −", "x": "NH2 → aminopénicillines, COOR → carboxypénicillines, NH-CO-NH-R → uréidopénicillines.", "ch": "02_penicillines"}, {"id": "02-q-amino-blactamases", "t": "vrai_faux", "q": "Les aminopénicillines sont actives sur les staphylocoques producteurs de β-lactamases.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Les aminopénicillines sont très sensibles aux β-lactamases.", "ch": "02_penicillines"}, {"id": "02-q-pip-voie", "t": "qcm", "q": "La pipéracilline est :", "c": ["Une acyluréidopénicilline parentérale, toujours associée au tazobactam", "Une aminopénicilline orale", "Une carboxypénicilline orale", "Une pénicilline résistante aux pénicillinases"], "r": "Une acyluréidopénicilline parentérale, toujours associée au tazobactam", "x": "Acido-sensible donc parentérale ; seul représentant commercialisé en Belgique (PIPERACILLINE-TAZOBACTAM EG®).", "ch": "02_penicillines"}, {"id": "02-q-tazobactam", "t": "qcm", "q": "Le tazobactam est :", "c": ["Un inhibiteur de β-lactamases", "Une carboxypénicilline", "Un sel retard de pénicilline", "Un aminoside"], "r": "Un inhibiteur de β-lactamases", "x": "Associé à la pipéracilline pour la protéger des β-lactamases.", "ch": "02_penicillines"}, {"id": "02-q-penG-spectre", "t": "qcm", "q": "Le spectre de la pénicilline G est :", "c": ["Étroit, Gram + (hors producteurs de pénicillinases)", "Large, Gram + et Gram −", "Limité aux Gram −", "Limité aux anaérobies"], "r": "Étroit, Gram + (hors producteurs de pénicillinases)", "x": "Les producteurs de pénicillinases (nombreux staphylocoques, bacilles Gram −) lui résistent.", "ch": "02_penicillines"}, {"id": "02-q-allergie-pourcent", "t": "qcm", "q": "Quelle proportion de la population a une vraie hypersensibilité IgE-médiée à la pénicilline ?", "c": ["Moins de 1 %", "Environ 10 %", "Environ 25 %", "Environ 5 %"], "r": "Moins de 1 %", "x": "~10 % se déclarent allergiques, mais < 1 % le sont vraiment : l'allergie est surestimée.", "ch": "02_penicillines"}, {"id": "02-q-cross-reac", "t": "qcm", "q": "Risque de réaction croisée avec une céphalosporine de 1re génération chez un allergique aux pénicillines :", "c": ["Jusqu'à ~1-8 %", "Toujours < 0,1 %", "Environ 50 %", "Nul"], "r": "Jusqu'à ~1-8 %", "x": "1re génération ou chaîne latérale similaire : ~1-8 % ; 3e-4e générations : généralement < 1 %.", "ch": "02_penicillines"}, {"id": "02-q-maladie-serique", "t": "qcm", "q": "La maladie sérique sous pénicilline est une hypersensibilité de type :", "c": ["III", "I", "II", "IV"], "r": "III", "x": "Type III = complexes immuns ; type I = anaphylaxie ; type II = anémie hémolytique, thrombopénie.", "ch": "02_penicillines"}, {"id": "02-q-ampi-po", "t": "vrai_faux", "q": "L'ampicilline per os est bien résorbée (environ 80 %).", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Ampicilline : 25-40 % (diminue avec la dose) ; c'est l'amoxicilline qui est résorbée à ~80 %.", "ch": "02_penicillines"}, {"id": "02-q-temo-indic", "t": "qcm", "q": "Les carboxypénicillines (dont la témocilline) devraient être réservées :", "c": ["Aux infections à Gram − insensibles aux aminopénicillines", "Aux angines à streptocoques", "Aux abcès à staphylocoques", "Aux infections à mycoplasmes"], "r": "Aux infections à Gram − insensibles aux aminopénicillines", "x": "Leur spectre s'étend à de nombreux Gram − ; NEGABAN® : IU compliquées, pyélonéphrites, infections respiratoires basses, peau et tissus mous.", "ch": "02_penicillines"}, {"id": "03-q03-01", "t": "qcm", "q": "Qu'est-ce qui distingue chimiquement les céphalosporines des pénicillines ?", "c": ["Le cycle thiazolidine est remplacé par un cycle thiazine", "Le cycle β-lactame est remplacé par un cycle azétidine", "Le soufre est remplacé par un oxygène", "Le COOH est remplacé par un sulfonate"], "r": "Le cycle thiazolidine est remplacé par un cycle thiazine", "x": "Les céphalosporines possèdent un cycle thiazine (6 chaînons) à la place du thiazolidine (5 chaînons) des pénicillines.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-02", "t": "qcm", "q": "Quel intermédiaire de synthèse sert à préparer les céphalosporines hémi-synthétiques ?", "c": ["Acide 7-aminocéphalosporanique (7-ACA)", "Acide 6-aminopénicillanique (6-APA)", "Acide clavulanique", "Noyau carbapénème"], "r": "Acide 7-aminocéphalosporanique (7-ACA)", "x": "On module la chaîne latérale portée par le groupement 7-amino du 7-ACA, obtenu par hydrolyse de la céphalosporine C.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-03", "t": "qcm", "q": "ZINNAT® contient :", "c": ["Du céfuroxime axétil", "Du céfuroxime sodique", "Du céfadroxil", "De la ceftriaxone"], "r": "Du céfuroxime axétil", "x": "ZINNAT®, CEFUROXIME EG® et CEFUROXIME SANDOZ® = céfuroxime axétil (oral) ; ZINACEF® et CEFUROXIM FRESENIUS KABI® = céfuroxime sodique (injectable).", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-04", "t": "qcm", "q": "DURACEF® correspond à :", "c": ["Céfadroxil", "Céfalexine", "Céfazoline", "Céfuroxime"], "r": "Céfadroxil", "x": "DURACEF® et CEFADROXIL SANDOZ® = céfadroxil (groupe I, p.o.).", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-05", "t": "qcm", "q": "KEFORAL® correspond à :", "c": ["Céfalexine", "Céfadroxil", "Céfépime", "Céfotaxime"], "r": "Céfalexine", "x": "KEFORAL® = céfalexine, dérivé non hydroxylé du céfadroxil (groupe I, p.o.).", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-06", "t": "qcm", "q": "CLAFORAN® est le nom commercial de :", "c": ["Céfotaxime sodique", "Ceftazidime", "Ceftriaxone", "Céfépime"], "r": "Céfotaxime sodique", "x": "CLAFORAN® = céfotaxime sodique, céphalosporine du groupe III.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-07", "t": "qcm", "q": "ROCEPHINE® appartient à quel groupe de céphalosporines ?", "c": ["Groupe III", "Groupe I", "Groupe II", "Groupe V"], "r": "Groupe III", "x": "ROCEPHINE® = ceftriaxone, groupe III (avec le céfotaxime et la ceftazidime).", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-08", "t": "qcm", "q": "ZINFORO® (ceftaroline) se distingue des autres céphalosporines par son activité sur :", "c": ["Les Staphylococcus aureus méticillino-résistants (MRSA)", "Pseudomonas aeruginosa", "Les entérocoques", "Les bactéries atypiques (Legionella, Mycoplasma, Chlamydia)"], "r": "Les Staphylococcus aureus méticillino-résistants (MRSA)", "x": "La ceftaroline (groupe V) est active sur les MRSA et les S. pneumoniae résistants à la pénicilline, mais inactive sur P. aeruginosa, la plupart des entérocoques et les atypiques.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-09", "t": "qcm", "q": "MERONEM® est le nom commercial de :", "c": ["Méropénème", "Imipénème + cilastatine", "Aztréonam", "Ceftazidime"], "r": "Méropénème", "x": "MERONEM® = méropénème, carbapénème plus stable que l'imipénème, utilisable seul. L'imipénème + cilastatine = TIENAM®.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-10", "t": "qcm", "q": "AZACTAM® et CAYSTON® contiennent :", "c": ["Aztréonam, un monobactame", "Méropénème, un carbapénème", "Tazobactam, un inhibiteur de β-lactamases", "Ceftazidime, une C3G"], "r": "Aztréonam, un monobactame", "x": "L'aztréonam est un monobactame de synthèse actif uniquement sur les aérobies Gram négatif.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-11", "t": "qcm", "q": "Quelle est la seule différence structurale entre le céfadroxil et la céfalexine ?", "c": ["Un OH en para sur le benzène exocyclique du céfadroxil", "Un CH3 en 3 sur la céfalexine seulement", "Un groupe méthoxyimino sur le céfadroxil", "Un ester axétil sur la céfalexine"], "r": "Un OH en para sur le benzène exocyclique du céfadroxil", "x": "La céfalexine est le dérivé non hydroxylé du céfadroxil sur le noyau benzène exocyclique (même relation qu'ampicilline/amoxicilline).", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-12", "t": "qcm", "q": "Lesquelles de ces caractéristiques améliorent souvent la biodisponibilité orale d'une céphalosporine ?", "c": ["NH2 en α du lien amide, estérification du COOH, -CH3 ou Cl en 3", "Azote quaternaire en 3 et forme zwitterionique", "Radical ATMO en 7", "Sel sodique du COOH"], "r": "NH2 en α du lien amide, estérification du COOH, -CH3 ou Cl en 3", "x": "Règle en gras p.56 : NH2 en α du lien amide, estérification du COOH et -CH3 ou Cl en 3.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-13", "t": "qcm", "q": "Pourquoi le céfuroxime axétil peut-il être administré par voie orale ?", "c": ["C'est un ester acétoxyéthylique (prodrogue) du céfuroxime", "Il possède un azote quaternaire", "Il porte un NH2 en α du lien amide", "Il est associé à un inhibiteur de β-lactamases"], "r": "C'est un ester acétoxyéthylique (prodrogue) du céfuroxime", "x": "L'ester axétil (en rouge dans la structure) est une prodrogue du céfuroxime administrable par la voie orale.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-14", "t": "qcm", "q": "Quel radical est présent systématiquement dans les céphalosporines du groupe III (sauf le céfotétan) ?", "c": ["Aminothiazolylméthoxyiminométhyle (ATMO)", "p-Hydroxyphénylglycyle", "Tétrazolylacétyle", "1-Acétoxyéthyle"], "r": "Aminothiazolylméthoxyiminométhyle (ATMO)", "x": "L'ATMO est sans doute responsable de l'élargissement du spectre à certaines souches Gram - difficilement traitables.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-15", "t": "qcm", "q": "Pourquoi le céfuroxime est-il considéré comme le précurseur des C3G ?", "c": ["Il introduit un substituant méthoxyimino en α du C=O amide", "Il possède un azote quaternaire", "Il est actif sur les Pseudomonas", "Il a un chaînon en 7 identique à celui de l'amoxicilline"], "r": "Il introduit un substituant méthoxyimino en α du C=O amide", "x": "Son chaînon en 7 diffère radicalement de ceux des groupes I et II par ce méthoxyimino, que l'on retrouve dans l'ATMO des C3G.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-16", "t": "vrai_faux", "q": "Vrai ou faux : les inhibiteurs de β-lactamases sont des antibiotiques à part entière.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Les inhibiteurs de β-lactamases ne sont pas des antibiotiques : ils potentialisent la β-lactamine associée et élargissent son emploi aux souches productrices de β-lactamases.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-17", "t": "qcm", "q": "Le sulbactam et l'acide clavulanique sont des inhibiteurs des β-lactamases de type :", "c": ["Irréversible", "Réversible", "Compétitif uniquement", "Allostérique"], "r": "Irréversible", "x": "« Irréversibles » est écrit en rouge dans le cours : ce sont de puissants inhibiteurs irréversibles des β-lactamases des Gram + et Gram -.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-18", "t": "qcm", "q": "Pourquoi la ceftazidime est-elle particulièrement soluble dans l'eau ?", "c": ["Elle possède un azote quaternaire (pyridinium)", "Elle est estérifiée", "Elle porte un CH3 en 3", "Elle n'a pas de cycle β-lactame"], "r": "Elle possède un azote quaternaire (pyridinium)", "x": "L'azote quaternaire la rend très soluble ; la forme zwitterionique favoriserait le passage de la paroi bactérienne.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-19", "t": "qcm", "q": "Les céphalosporines du groupe I sont :", "c": ["Actives sur Gram + (10x moins que la pénicilline G), sur quelques Gram -, et sensibles aux céphalosporinases", "Actives sur la majorité des Gram -, y compris Pseudomonas", "Actives sur les MRSA", "Résistantes à la plupart des céphalosporinases des Gram -"], "r": "Actives sur Gram + (10x moins que la pénicilline G), sur quelques Gram -, et sensibles aux céphalosporinases", "x": "Définition du groupe I (p.56).", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-20", "t": "qcm", "q": "Qu'est-ce qui différencie le céfépime (groupe IV) du groupe III ?", "c": ["Une sensibilité nettement moindre à un certain nombre de β-lactamases", "Une activité sur les MRSA", "Une administration orale", "L'absence de radical aminothiazole"], "r": "Une sensibilité nettement moindre à un certain nombre de β-lactamases", "x": "Le céfépime est le seul représentant du groupe IV ; son spectre s'étend à des germes résistants à d'autres C3G.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-21", "t": "qcm", "q": "Un patient a une allergie documentée à la pénicilline IgE-médiée. Quelle affirmation est correcte ?", "c": ["Les C1G ne sont pas des alternatives ; céfuroxime, C3G et C4G possibles sous surveillance hospitalière", "Toutes les céphalosporines peuvent être délivrées sans précaution", "Seules les céphalosporines de 1re génération sont autorisées", "Aucune β-lactamine n'est jamais envisageable"], "r": "Les C1G ne sont pas des alternatives ; céfuroxime, C3G et C4G possibles sous surveillance hospitalière", "x": "Positionnement des céphalosporines (p.63).", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-22", "t": "qcm", "q": "Quelle proportion de patients allergiques aux pénicillines sont également allergiques aux céphalosporines ?", "c": ["Environ 10 %", "Environ 1 %", "Environ 50 %", "100 %"], "r": "Environ 10 %", "x": "Effets indésirables des céphalosporines (p.64).", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-23", "t": "qcm", "q": "Avec quelle céphalosporine l'anémie hémolytique est-elle surtout décrite ?", "c": ["Ceftriaxone", "Céfadroxil", "Céfuroxime axétil", "Céfépime"], "r": "Ceftriaxone", "x": "Anémie hémolytique décrite surtout avec la ceftriaxone et le céfotétan (p.64).", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-24", "t": "qcm", "q": "Pourquoi l'imipénème est-il associé à la cilastatine (TIENAM®) ?", "c": ["La cilastatine inhibe de manière réversible la déhydropeptidase rénale qui dégrade l'imipénème", "La cilastatine est un inhibiteur irréversible des β-lactamases", "La cilastatine élargit le spectre aux Gram +", "La cilastatine permet l'absorption orale"], "r": "La cilastatine inhibe de manière réversible la déhydropeptidase rénale qui dégrade l'imipénème", "x": "L'imipénème est métabolisé par ouverture du cycle β-lactame lors de l'excrétion urinaire ; le méropénème, plus stable, s'utilise seul.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-25", "t": "vrai_faux", "q": "Vrai ou faux : le noyau carbapénème contient un atome de soufre, comme les pénicillines.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Le noyau carbapénème ne possède pas d'atome de soufre et présente une double liaison 2-3 comme les céphalosporines.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-26", "t": "qcm", "q": "Que démontrent les nocardicines et les monobactames ?", "c": ["Qu'une structure β-lactamique bicyclique n'est pas indispensable à l'activité antibiotique", "Que le soufre est indispensable à l'activité", "Que les β-lactames sont inactifs sur les Gram -", "Que l'ATMO est indispensable à l'activité"], "r": "Qu'une structure β-lactamique bicyclique n'est pas indispensable à l'activité antibiotique", "x": "Phrase en bleu souligné (p.66).", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-27", "t": "qcm", "q": "Le spectre de l'aztréonam est limité aux :", "c": ["Micro-organismes aérobies Gram négatif", "Gram + uniquement", "Anaérobies", "MRSA"], "r": "Micro-organismes aérobies Gram négatif", "x": "Monobactame de synthèse actif que sur les aérobies Gram - (p.66).", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-28", "t": "qcm", "q": "Quelle est la place des C3G en pratique ambulatoire ?", "c": ["Seulement les IST", "Premier choix des angines", "Premier choix des cystites simples", "Toutes les infections respiratoires"], "r": "Seulement les IST", "x": "Les C3G sont réservées aux infections graves, le plus souvent hospitalières ; en ambulatoire, seule place : les IST.", "ch": "03_cephalo_betalactames"}, {"id": "03-q03-29", "t": "qcm", "q": "Le tazobactam est associé à :", "c": ["La pipéracilline et le ceftolozane", "L'amoxicilline uniquement", "L'imipénème", "L'aztréonam"], "r": "La pipéracilline et le ceftolozane", "x": "PIPERACILLINE/TAZOBACTAM EG® et ZEBRAXA® (ceftolozane + tazobactam).", "ch": "03_cephalo_betalactames"}, {"id": "04-q-chloramph-groupement", "t": "qcm", "q": "Quel groupement porte le cycle aromatique du chloramphénicol en para ?", "c": ["NO2", "SO2CH3", "NH2", "Cl"], "r": "NO2", "x": "Chloramphénicol : p-nitrophényle. Le thiamphénicol est l'analogue méthylsulfonylé (SO2CH3).", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-thiamph-difference", "t": "qcm", "q": "Qu'est-ce qui distingue le thiamphénicol du chloramphénicol ?", "c": ["Un CH3-SO2- à la place du NO2", "Un OCH3 en 6", "Un Cl à la place d'un OH", "Une lysine sur l'amide"], "r": "Un CH3-SO2- à la place du NO2", "x": "Le thiamphénicol est l'analogue méthylsulfonylé du chloramphénicol ; mêmes propriétés physico-chimiques, toxicité médullaire moindre.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-phenicoles-ei", "t": "qcm", "q": "Quel est le principal effet indésirable du chloramphénicol et du thiamphénicol ?", "c": ["Atteintes de la moelle osseuse (aplasie, agranulocytose, thrombocytopénie)", "Néphrotoxicité", "Allongement du QT", "Dyschromies dentaires"], "r": "Atteintes de la moelle osseuse (aplasie, agranulocytose, thrombocytopénie)", "x": "Toxicité médullaire parfois mortelle ; surveillance de l'hémogramme. Le thiamphénicol est mieux toléré sur le plan hématologique.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-idiosyncrasique", "t": "vrai_faux", "q": "Vrai ou faux : l'aplasie médullaire au chloramphénicol est proportionnelle à la dose reçue.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "C'est un effet idiosyncrasique : imprévisible, sans rapport entre dose et effet (une seule exposition peut être fatale) ni avec la durée d'exposition.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-sous-unite-30s", "t": "qcm", "q": "Quelles familles inhibent la sous-unité ribosomale 30S ?", "c": ["Tétracyclines et aminosides", "Macrolides et lincosamides", "Chloramphénicol et acide fusidique", "Macrolides et aminosides"], "r": "Tétracyclines et aminosides", "x": "30S : tétracyclines et aminosides. 50S : macrolides, chloramphénicol/thiamphénicol, acide fusidique, lincosamides.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-ribosome-procaryote", "t": "qcm", "q": "Quel ARNr constitue la petite sous-unité (30S) du ribosome procaryote ?", "c": ["ARNr 16S", "ARNr 18S", "ARNr 23S", "ARNr 28S"], "r": "ARNr 16S", "x": "Procaryotes : 50S = ARNr 23S + 5S ; 30S = ARNr 16S. Eucaryotes : 40S = ARNr 18S ; 60S = 28S, 5.8S, 5S.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-tetra-squelette", "t": "qcm", "q": "Sur quel noyau repose le squelette des tétracyclines ?", "c": ["Naphtacène", "Naphtalène", "Quinoléine", "Stéroïde"], "r": "Naphtacène", "x": "Toutes les tétracyclines possèdent un noyau naphtacène (4 cycles accolés) diversement substitué.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-tetra-epimerisation", "t": "qcm", "q": "Quel carbone des tétracyclines s'épimérise en solution acide (4 < pH < 8) pour donner l'épitétracycline peu active ?", "c": ["C4", "C6", "C12a", "C2"], "r": "C4", "x": "Le C4 porte le groupement N(CH3)2 ; son épimérisation forme l'épitétracycline, peu active.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-doxy-rsa", "t": "qcm", "q": "Par rapport à la tétracycline, que possède la doxycycline ?", "c": ["Un OH en R5 au lieu de R6", "Un N(CH3)2 en R7", "Un Cl en R7", "Une lysine en R2"], "r": "Un OH en R5 au lieu de R6", "x": "Minocycline : N(CH3)2 en R7 ; chlortétracycline : Cl en R7 ; lymécycline : lysine en R2.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-minocycline-marque", "t": "qcm", "q": "Quelle spécialité contient de la minocycline ?", "c": ["KLINOTAB®", "VIBRATAB®", "TETRALYSAL®", "TYGACIL®"], "r": "KLINOTAB®", "x": "Minocycline : KLINOTAB®, MINO-50®, MINOTAB®, MINOCYCLINE EG®. VIBRATAB® = doxycycline ; TETRALYSAL® = lymécycline ; TYGACIL® = tigécycline.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-lymecycline", "t": "qcm", "q": "Pourquoi la lymécycline (TETRALYSAL®) est-elle plus soluble dans l'eau au pH physiologique ?", "c": ["Présence d'une lysine en R2", "Présence d'un OH en R5", "Absence du N(CH3)2", "Présence d'un métaphosphate"], "r": "Présence d'une lysine en R2", "x": "La lysine en R2 augmente la solubilité ; la lymécycline peut être considérée comme une prodrogue de la tétracycline.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-tetra-calcium", "t": "vrai_faux", "q": "Vrai ou faux : on peut prendre une tétracycline avec un verre de lait pour protéger l'estomac.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Les tétracyclines forment avec le Ca2+ des chélates stables et difficilement résorbables : à éviter avec les aliments riches en calcium.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-tigecycline", "t": "qcm", "q": "La tigécycline (TYGACIL®) est :", "c": ["Une glycylcycline dérivée de la minocycline, i.v. à l'hôpital", "Un macrolide à 16 atomes", "Un aminoside pour nébulisation", "Une tétracycline topique pour l'acné"], "r": "Une glycylcycline dérivée de la minocycline, i.v. à l'hôpital", "x": "Groupement glycylamido encombré en position 9 de la minocycline, contre les résistances (pompes d'efflux) ; i.v. 2 fois/jour pour infections cutanées et intra-abdominales compliquées.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-tetra-enfant", "t": "qcm", "q": "Quel effet indésirable des tétracyclines justifie de les éviter chez l'enfant de moins de 8 ans ?", "c": ["Dyschromies dentaires et hypoplasie de l'émail", "Ototoxicité", "Aplasie médullaire", "Allongement du QT"], "r": "Dyschromies dentaires et hypoplasie de l'émail", "x": "Grande affinité des tétracyclines pour le tissu osseux.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-macrolide-structure", "t": "qcm", "q": "Un macrolide est caractérisé par :", "c": ["Un macrocycle lactonique de 14, 15 ou 16 atomes substitué par un aminoose et un ose", "Un noyau naphtacène", "Un cyclitol dont deux OH sont remplacés par des amines", "Un noyau β-lactame"], "r": "Un macrocycle lactonique de 14, 15 ou 16 atomes substitué par un aminoose et un ose", "x": "Sauf les kétolides, où une cétone remplace un sucre (le cladinose).", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-clarithro-rsa", "t": "qcm", "q": "Quelle modification de l'érythromycine donne la clarithromycine ?", "c": ["CH3O à la place du OH en position 6", "Oxime en 9", "Azote inséré dans le cycle (15 atomes)", "Cétone à la place du cladinose"], "r": "CH3O à la place du OH en position 6", "x": "Roxithromycine : oxime en 9 ; azithromycine : azalide à 15 atomes ; télithromycine : kétolide.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-azithro-cycle", "t": "qcm", "q": "Combien d'atomes compte le macrocycle de l'azithromycine ?", "c": ["15 dont un azote", "14", "16", "18"], "r": "15 dont un azote", "x": "Azamacrolide (azalide) à 15 atomes ; demi-vie beaucoup plus longue (une prise par jour, voire unique).", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-heliclar", "t": "qcm", "q": "HELICLAR® contient :", "c": ["Clarithromycine", "Azithromycine", "Amoxicilline", "Oméprazole"], "r": "Clarithromycine", "x": "Clarithromycine : BICLAR®, CLARITHROMYCINE EG®, HELICLAR® ; utilisée avec amoxicilline + oméprazole contre H. pylori.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-erythro-cyp", "t": "qcm", "q": "Par quel mécanisme l'érythromycine provoque-t-elle de nombreuses interactions ?", "c": ["Inhibition du CYP3A4", "Induction du CYP3A4", "Chélation des cations", "Compétition pour la sécrétion tubulaire"], "r": "Inhibition du CYP3A4", "x": "Elle ralentit le métabolisme de la théophylline, carbamazépine, ciclosporine, cisapride, disopyramide, ergotamine… (gangrène avec l'ergotamine).", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-erythro-qt", "t": "vrai_faux", "q": "Vrai ou faux : le risque de torsades de pointes avec l'érythromycine est surtout lié à une injection i.v. trop rapide.", "c": ["Vrai", "Faux"], "r": "Vrai", "x": "Allongement de l'intervalle QT avec risque de torsades de pointes, surtout en cas d'injection i.v. trop rapide d'érythromycine.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-spiramycine", "t": "qcm", "q": "Dans quelle situation la spiramycine (ROVAMYCINE®) peut-elle être utile ?", "c": ["Toxoplasmose pendant la grossesse", "Infection à Clostridium difficile", "Tuberculose", "Acné"], "r": "Toxoplasmose pendant la grossesse", "x": "Mélange de spiramycines I, II, III (16 atomes), spectre analogue à l'érythromycine.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-fidaxomicine-meca", "t": "qcm", "q": "Quel est le mécanisme d'action de la fidaxomicine ?", "c": ["Inhibition de l'ARN polymérase bactérienne (site distinct des rifamycines)", "Fixation à la sous-unité 50S", "Fixation à la sous-unité 30S", "Inhibition de la paroi"], "r": "Inhibition de l'ARN polymérase bactérienne (site distinct des rifamycines)", "x": "Bien que structurellement apparentée aux macrolides (lactone de 18 atomes), elle est bactéricide et inhibe la synthèse de l'ARN.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-aminosides-rouge", "t": "qcm", "q": "Quelle phrase rouge du cours caractérise les aminosides ?", "c": ["La marge thérapeutique-toxique est étroite", "Ils sont actifs per os", "Ils sont surtout actifs sur les anaérobies", "Ils sont sans danger pendant la grossesse"], "r": "La marge thérapeutique-toxique est étroite", "x": "Ototoxicité et néphrotoxicité, parfois très tardives ; à éviter pendant la grossesse.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-aminosides-distribution", "t": "qcm", "q": "Pourquoi les aminosides sont-ils oto- et néphrotoxiques ?", "c": ["Distribution extracellulaire avec fortes concentrations dans le rein et l'oreille interne", "Métabolisme hépatique en dérivés toxiques", "Chélation du calcium", "Inhibition du CYP3A4"], "r": "Distribution extracellulaire avec fortes concentrations dans le rein et l'oreille interne", "x": "Fortes concentrations dans le rein, l'endolymphe et la périlymphe → toxicité rénale et cochléaire.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-aminosides-voie", "t": "vrai_faux", "q": "Vrai ou faux : les aminosides sont bien absorbés par voie orale.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Polycations : absorption digestive < 1 % ; usage parentéral ou local.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-streptomycine", "t": "qcm", "q": "La streptomycine résulte de la condensation de :", "c": ["Streptidine, streptose et N-méthylglucosamine", "Désosamine et cladinose", "Deux aminoglucosides et un aminohydroxycyclohexane", "Lysine et tétracycline"], "r": "Streptidine, streptose et N-méthylglucosamine", "x": "Premier aminoside (1943, Waksman), Streptomyces griseus ; longtemps seul traitement efficace de la tuberculose.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-paromomycine", "t": "qcm", "q": "Quel aminoside est encore utilisé comme antiseptique intestinal (GABBRORAL®) ?", "c": ["Paromomycine", "Néomycine", "Tobramycine", "Amikacine"], "r": "Paromomycine", "x": "Néomycine et paromomycine sont très mal résorbées ; seul le sulfate de paromomycine est encore utilisé comme antiseptique intestinal.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-tobi", "t": "qcm", "q": "TOBI® (solution pour nébuliseur) contient :", "c": ["Tobramycine", "Gentamicine", "Néomycine", "Azithromycine"], "r": "Tobramycine", "x": "Tobramycine : OBRACIN® (i.m./i.v.), TOBI® (nébuliseur), TOBREX® et TOBRADEX® (ophtalmique).", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-clinda-rsa", "t": "qcm", "q": "Quelle est la différence structurale entre la lincomycine et la clindamycine ?", "c": ["Clindamycine : Cl à la place d'un OH (R = Cl)", "Clindamycine : OCH3 en 6", "Clindamycine : N(CH3)2 en 7", "Aucune, ce sont des synonymes"], "r": "Clindamycine : Cl à la place d'un OH (R = Cl)", "x": "La clindamycine est le dérivé hémisynthétique chloré de la lincomycine (LINCOCIN®), d'usage beaucoup plus répandu.", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "04-q-confusion-dalacin", "t": "qcm", "q": "Piège : DALACIN C® et ZINDACLIN® contiennent tous deux…", "c": ["De la clindamycine", "De l'érythromycine", "De la doxycycline", "De la lincomycine"], "r": "De la clindamycine", "x": "Clindamycine systémique (DALACIN C®) et en usage externe contre l'acné (DALACIN®, ZINDACLIN®). Ne pas confondre avec ZINERYT® (érythromycine + acétate de zinc).", "ch": "04_phenicols_tetra_macrolides_aminosides_lincos"}, {"id": "05-q05-01", "t": "qcm", "q": "Quelle est la DCI de RIFADINE® ?", "c": ["Rifampicine", "Rifabutine", "Rifaximine", "Rifamycine SV"], "r": "Rifampicine", "x": "RIFADINE® = rifampicine (hémisynthèse de la rifamycine SV).", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-02", "t": "qcm", "q": "Quelle est la DCI de MYCOBUTIN® ?", "c": ["Rifabutine", "Rifampicine", "Rifaximine", "Mupirocine"], "r": "Rifabutine", "x": "MYCOBUTIN® = rifabutine (mycobactéries atypiques, M. avium).", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-03", "t": "qcm", "q": "TARGAXAN® contient :", "c": ["Rifaximine", "Teicoplanine", "Linézolide", "Rifabutine"], "r": "Rifaximine", "x": "TARGAXAN® = rifaximine ; attention à ne pas confondre avec TARGOCID® (teicoplanine).", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-04", "t": "qcm", "q": "TARGOCID® contient :", "c": ["Teicoplanine", "Rifaximine", "Vancomycine", "Linézolide"], "r": "Teicoplanine", "x": "TARGOCID® = teicoplanine, glycopeptide.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-05", "t": "qcm", "q": "BACTROBAN® contient :", "c": ["Mupirocine", "Bacitracine", "Acide fusidique", "Tyrothricine"], "r": "Mupirocine", "x": "BACTROBAN® = mupirocine (acide pseudomonique).", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-06", "t": "qcm", "q": "Quelle spécialité ne contient PAS de linézolide ?", "c": ["TARGOCID®", "ZYVOXID®", "LINEZOLID ACCORD®", "LINEZOLID FRESENIUS KABI®"], "r": "TARGOCID®", "x": "TARGOCID® est la teicoplanine.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-07", "t": "qcm", "q": "Quelle caractéristique structurale de l'acide fusidique le cours souligne-t-il ?", "c": ["Un stéroïde de forme trans-syn-trans, contrairement aux stéroïdes hormonaux", "Un macrocycle ansa comme les rifamycines", "Un cycle β-lactame", "Un glycopeptide tricyclique"], "r": "Un stéroïde de forme trans-syn-trans, contrairement aux stéroïdes hormonaux", "x": "L'acide fusidique a une structure stéroïdienne trans-syn-trans, ce qui n'est pas le cas des stéroïdes hormonaux.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-08", "t": "qcm", "q": "L'acide fusidique agit sur :", "c": ["La sous-unité ribosomale 50S", "La sous-unité ribosomale 30S", "L'ARN polymérase", "Le bactoprénol"], "r": "La sous-unité ribosomale 50S", "x": "Comme macrolides, chloramphénicol et thiamphénicol (EF-G selon la figure p.101).", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-09", "t": "vrai_faux", "q": "L'acide fusidique est actif sur les Gram − .", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Il est actif sur les Gram + (surtout S. aureus) et inactif sur les Gram −.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-10", "t": "qcm", "q": "Quelle est la cible des rifamycines ?", "c": ["La sous-unité β de l'ARN polymérase bactérienne", "L'ADN gyrase", "La sous-unité 30S", "L'isoleucyl-ARNt synthétase"], "r": "La sous-unité β de l'ARN polymérase bactérienne", "x": "Elles inhibent la transcription et ont peu d'action sur l'ARN polymérase humaine.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-11", "t": "qcm", "q": "Quel substituant R différencie la rifampicine de la rifamycine SV (R = H) ?", "c": ["CH=N–N(4-méthylpipérazine)", "Une spiro-pipéridine N-isobutyle", "Un noyau pyrido-imidazole", "Un ester acétoxyéthylique"], "r": "CH=N–N(4-méthylpipérazine)", "x": "La rifampicine porte R = HC=N–N-pipérazine-N-CH3 (p.95).", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-12", "t": "qcm", "q": "La rifampicine est un inducteur de :", "c": ["CYP1A2, CYP2C9, CYP3A4", "CYP2D6 uniquement", "Aucune enzyme", "La glucuronidation uniquement"], "r": "CYP1A2, CYP2C9, CYP3A4", "x": "Induction des enzymes hépatiques → interactions avec coumariniques, antiépileptiques, contraceptifs, ADO, corticostéroïdes, antirétroviraux.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-13", "t": "qcm", "q": "Quelles sont les deux indications majeures de la rifampicine selon le cours ?", "c": ["Tuberculose (en association) et prophylaxie de la méningite à méningocoque chez l'enfant", "Impétigo et acné", "Encéphalopathie hépatique et diarrhée", "Endocardite et SARM"], "r": "Tuberculose (en association) et prophylaxie de la méningite à méningocoque chez l'enfant", "x": "p.96.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-14", "t": "vrai_faux", "q": "La rifampicine en sirop est disponible en spécialité en Belgique.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Elle n'existe pas en spécialité : préparation magistrale à partir de la matière première.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-15", "t": "qcm", "q": "Pourquoi la rifampicine a-t-elle une action prolongée ?", "c": ["Élimination biliaire avec cycle entérohépatique", "Élimination rénale lente", "Forme dépôt injectable", "Liaison irréversible à l'ARN polymérase humaine"], "r": "Élimination biliaire avec cycle entérohépatique", "x": "p.96.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-16", "t": "qcm", "q": "Quel est le caractère acido-basique de la rifampicine ?", "c": ["Amphotère", "Acide uniquement", "Basique uniquement", "Neutre"], "r": "Amphotère", "x": "Rifamycine : acide ; rifampicine et rifabutine : amphotères (solubles dans acides et alcalis).", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-17", "t": "qcm", "q": "Quelle partie de la rifabutine est surlignée en rouge dans le cours ?", "c": ["Le cycle imidazoline spiro-pipéridine N-isobutyle (et la C=O quinonique)", "La chaîne acétate de l'anse", "Le groupe méthoxy", "Le furanone"], "r": "Le cycle imidazoline spiro-pipéridine N-isobutyle (et la C=O quinonique)", "x": "C'est la différence structurale avec la rifamycine SV ; la rifabutine dérive de la rifamycine S (naphtoquinone).", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-18", "t": "qcm", "q": "La mupirocine inhibe :", "c": ["L'isoleucyl-ARNt synthétase bactérienne", "La sous-unité 50S", "L'ARN polymérase", "La transpeptidase"], "r": "L'isoleucyl-ARNt synthétase bactérienne", "x": "Liaison réversible et spécifique → inhibition de la synthèse protéique.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-20", "t": "qcm", "q": "Quelles sont les seules indications des glycopeptides selon le cours ?", "c": ["Infections graves à staphylocoques résistant aux pénicillines et prévention des endocardites si pénicillines impossibles", "Tuberculose et lèpre", "Impétigo et acné", "Infections urinaires basses"], "r": "Infections graves à staphylocoques résistant aux pénicillines et prévention des endocardites si pénicillines impossibles", "x": "Phrase en bleu souligné p.98.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-21", "t": "qcm", "q": "La vancomycine inhibe la synthèse de la paroi en se liant à :", "c": ["La terminaison D-Ala-D-Ala des précurseurs", "Les PLP (transpeptidases)", "Le bactoprénol", "Le LPS"], "r": "La terminaison D-Ala-D-Ala des précurseurs", "x": "Elle altère aussi la perméabilité membranaire et la synthèse de l'ARN.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-22", "t": "vrai_faux", "q": "La vancomycine est active per os dans les infections systémiques car elle est bien absorbée.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Glycopeptide : pas actif per os, voie parentérale (i.v., i.m.).", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-23", "t": "qcm", "q": "Le linézolide est :", "c": ["Une oxazolidinone obtenue par synthèse chimique (1987)", "Un produit d'extraction de Streptomyces", "Un glycopeptide", "Une rifamycine"], "r": "Une oxazolidinone obtenue par synthèse chimique (1987)", "x": "Et non par extraction à partir d'un micro-organisme.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-24", "t": "qcm", "q": "Le linézolide bloque la synthèse protéique en :", "c": ["Inhibant la formation d'un complexe d'initiation 50S fonctionnel", "Bloquant EF-G", "Se fixant sur la 30S", "Inhibant l'isoleucyl-ARNt synthétase"], "r": "Inhibant la formation d'un complexe d'initiation 50S fonctionnel", "x": "p.100 (bleu souligné).", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-25", "t": "qcm", "q": "Sur quels germes le linézolide est-il actif (cours) ?", "c": ["Gram + y compris ERV et SARM", "Gram − uniquement", "Mycobactéries atypiques", "Anaérobies Gram −"], "r": "Gram + y compris ERV et SARM", "x": "Il pénètre mal dans les Gram −.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-26", "t": "qcm", "q": "Quel antibiotique polypeptidique est un « détergent membranaire » spécifiquement actif sur les Gram − ?", "c": ["Polymyxine B", "Bacitracine", "Tyrocidine", "Gramicidine"], "r": "Polymyxine B", "x": "Cationique, se lie au LPS et déplace Ca²⁺/Mg²⁺.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-27", "t": "qcm", "q": "La bacitracine agit en :", "c": ["Bloquant le recyclage du bactoprénol", "Se liant au LPS", "Inhibant l'ARN polymérase", "Se liant à D-Ala-D-Ala"], "r": "Bloquant le recyclage du bactoprénol", "x": "Inhibition de la synthèse de la paroi à une autre étape que les β-lactamines.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-28", "t": "qcm", "q": "La tyrothricine est :", "c": ["Un mélange de tyrocidines et de gramicidines (Bacillus brevis)", "Un mélange de bacitracines A à F", "Une polymyxine", "Un glycopeptide"], "r": "Un mélange de tyrocidines et de gramicidines (Bacillus brevis)", "x": "p.92 ; usage bucco-pharyngé (LEMOCIN®, TYROTHRICINE-LIDOCAINE®).", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-29", "t": "qcm", "q": "NEOBACITRACINE® associe :", "c": ["Bacitracine + néomycine", "Bacitracine + polymyxine E", "Tyrothricine + lidocaïne", "Néomycine + dexaméthasone"], "r": "Bacitracine + néomycine", "x": "p.93.", "ch": "05_polypeptides_autres_ATB"}, {"id": "05-q05-30", "t": "qcm", "q": "Pourquoi les polypeptides sont-ils utilisés en usage externe ?", "c": ["Ils sont mal résorbés et relativement toxiques", "Ils sont détruits par la lumière", "Ils sont trop lipophiles", "Ils sont inactifs in vivo"], "r": "Ils sont mal résorbés et relativement toxiques", "x": "p.92.", "ch": "05_polypeptides_autres_ATB"}, {"id": "06-q06-01", "t": "qcm", "q": "Selon la phrase rouge du cours, pourquoi faut-il limiter l'utilisation des quinolones ?", "c": ["Développement rapide de résistance et effets indésirables parfois très invalidants", "Coût élevé et faible biodisponibilité", "Spectre limité aux Gram −", "Coloration des urines en rouge"], "r": "Développement rapide de résistance et effets indésirables parfois très invalidants", "x": "Phrase rouge p.110, en accord avec l'Agence européenne des médicaments (EMA).", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-02", "t": "qcm", "q": "Quelle modification structurale distingue l'acide nalidixique du noyau quinoléine ?", "c": ["Le carbone en position 8 est remplacé par un azote (noyau naphtyridine)", "Un fluor en position 6", "Un cyclopropyle sur N1", "Une pipérazine en position 7"], "r": "Le carbone en position 8 est remplacé par un azote (noyau naphtyridine)", "x": "L'acide nalidixique est un dérivé naphtyridine ; F en 6 caractérise les fluoroquinolones.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-03", "t": "qcm", "q": "Qu'est-ce qui caractérise toutes les quinolones de seconde génération ?", "c": ["Un fluor en position 6", "Un noyau naphtyridine", "Un groupe nitro sur un furane", "Un 3e cycle contenant du soufre"], "r": "Un fluor en position 6", "x": "Elles possèdent toutes un F en 6 et conservent généralement le fragment pipérazin-1-yle de l'acide pipémidique : ce sont les fluoroquinolones.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-04", "t": "qcm", "q": "Quel substituant porte la ciprofloxacine sur l'azote N1 ?", "c": ["Un cyclopropyle", "Un éthyle", "Un 2-fluoroéthyle", "Un méthyle"], "r": "Un cyclopropyle", "x": "La norfloxacine et la péfloxacine ont un N1-éthyle, la fléroxacine un CH2CH2F, la ciprofloxacine un cyclopropyle.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-05", "t": "qcm", "q": "CIPROXINE® correspond à :", "c": ["Ciprofloxacine", "Lévofloxacine", "Moxifloxacine", "Ofloxacine"], "r": "Ciprofloxacine", "x": "CIPROXINE®, CIPROFLOXACINE SANDOZ®/EG®/TEVA® ; CILOXAN® en collyre.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-06", "t": "qcm", "q": "TAVANIC® correspond à :", "c": ["Lévofloxacine", "Ofloxacine", "Moxifloxacine", "Ciprofloxacine"], "r": "Lévofloxacine", "x": "TAVANIC® = lévofloxacine, isomère lévogyre de l'ofloxacine.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-07", "t": "qcm", "q": "AVELOX® correspond à :", "c": ["Moxifloxacine", "Lévofloxacine", "Ciprofloxacine", "Bédaquiline"], "r": "Moxifloxacine", "x": "AVELOX® = moxifloxacine, quinolone de 3e génération.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-08", "t": "qcm", "q": "TRAFLOXAL® est un collyre à base de :", "c": ["Ofloxacine", "Ciprofloxacine", "Lévofloxacine", "Moxifloxacine"], "r": "Ofloxacine", "x": "CILOXAN® = ciprofloxacine (aussi usage otique) ; TRAFLOXAL® = ofloxacine.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-09", "t": "vrai_faux", "q": "L'isomère dextrogyre de l'ofloxacine est inactif et dépourvu de toxicité.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "Il est en principe inactif mais a la même toxicité que l'isomère lévogyre actif : d'où le chiral switch vers la lévofloxacine.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-10", "t": "qcm", "q": "Quelle est la cible des quinolones ?", "c": ["La topo-isomérase II (DNA-gyrase)", "L'ARN polymérase ADN-dépendante", "La dihydroptéroate synthétase", "La pyruvyl transférase"], "r": "La topo-isomérase II (DNA-gyrase)", "x": "Elles s'intercalent sous forme de complexe de magnésium entre les brins du DNA bactérien et empêchent leur soudure à l'état surenroulé.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-11", "t": "qcm", "q": "Sous quelle forme les quinolones s'intercalent-elles entre les brins du DNA bactérien ?", "c": ["Complexe de magnésium", "Complexe de zinc", "Paire d'ions avec le trométamol", "Ester phosphorique"], "r": "Complexe de magnésium", "x": "Concept souligné p.106.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-12", "t": "qcm", "q": "Quelle est la contre-indication principale des fluoroquinolones ?", "c": ["Grossesse, allaitement et période de croissance (< 18 ans)", "Insuffisance rénale uniquement", "Allergie à la pénicilline", "Déficit en G6PD"], "r": "Grossesse, allaitement et période de croissance (< 18 ans)", "x": "Atteinte du cartilage articulaire observée chez l'animal en croissance.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-13", "t": "qcm", "q": "Quel effet indésirable tendineux est typique des fluoroquinolones ?", "c": ["Tendinite pouvant aller jusqu'à la rupture du tendon d'Achille", "Ostéoporose", "Crampes musculaires par hypokaliémie", "Myasthénie"], "r": "Tendinite pouvant aller jusqu'à la rupture du tendon d'Achille", "x": "Concept souligné p.111.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-14", "t": "vrai_faux", "q": "Les quinolones sont un bon choix pour les infections urinaires basses non compliquées.", "c": ["Vrai", "Faux"], "r": "Faux", "x": "« Attention » (bleu souligné) : pour les infections urinaires basses non compliquées, les quinolones ne sont pas un bon choix ; elles sont indiquées dans les infections urinaires compliquées (pyélonéphrite, prostatite aiguë).", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-15", "t": "qcm", "q": "Quelle quinolone est citée pour les infections respiratoires de l'adulte allergique à la pénicilline ?", "c": ["Moxifloxacine", "Ciprofloxacine", "Acide nalidixique", "Ofloxacine"], "r": "Moxifloxacine", "x": "Activité accrue sur les Gram + dont S. pneumoniae et les atypiques (mycoplasme, chlamydia).", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-16", "t": "qcm", "q": "Avec quelles quinolones l'allongement du QT est-il « certainement » décrit ?", "c": ["Ciprofloxacine, lévofloxacine, moxifloxacine", "Acide nalidixique et acide pipémidique", "Norfloxacine uniquement", "Aucune, c'est un effet des nitrofurannes"], "r": "Ciprofloxacine, lévofloxacine, moxifloxacine", "x": "Possible aussi avec la norfloxacine et l'ofloxacine.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-17", "t": "qcm", "q": "Quel antiseptique urinaire colore les urines en rouge ?", "c": ["Nitrofurantoïne", "Fosfomycine", "Méthénamine", "Ciprofloxacine"], "r": "Nitrofurantoïne", "x": "FURADANTINE MC® ; phrase en bleu p.112.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-q06-18", "t": "qcm", "q": "Pourquoi les nitrofurannes ont-ils peu d'effets sur les cellules de l'hôte ?", "c": ["Les bactéries réduisent le groupe NO2 beaucoup plus vite que les cellules humaines", "Ils ne pénètrent pas dans les cellules humaines", "Ils sont inactivés par le foie", "Ils ciblent la paroi, absente
