e activée, voie intrinsèque) allongé isolément (TP et plaquettes normaux) ; 2) correction du TCA par un plasma normal (= déficit, pas d'inhibiteur) ; 3) dosage des FVIII et FIX.","mc":"TCA · allongé isolément · correction · dosage"},{"id":"semhem-s4c1w","t":"Pourquoi le TCA est-il allongé et le temps de Quick normal dans l'hémophilie ?","e":"Le FVIII et le FIX appartiennent à la voie intrinsèque, explorée par le TCA. Le temps de Quick explore la voie extrinsèque (FT, VII) et commune : il reste normal.","mc":"FVIII et FIX · voie intrinsèque · TCA allongé · temps de Quick (extrinsèque) normal"},{"id":"semhem-s4c2","t":"Traitement et complications","e":"Substitution : FVIII (plasmatique ou recombinant) ou FIX ; desmopressine dans l'hémophilie A légère ; emicizumab (Hemlibra®) : anticorps bispécifique qui relie FIXa et FX et mime le FVIIIa (sous-cutané, prophylaxie). Complications : infections transmises autrefois par les produits sanguins (VIH, hépatites), anticorps inhibiteurs anti-FVIII/IX, arthropathie.","mc":"FVIII · FIX · emicizumab · bispécifique · mime le FVIIIa · anticorps inhibiteurs"},{"id":"semhem-s4c3","t":"Autres déficits","e":"Déficits héréditaires rares en II, V, VII, X, XI, XIII et fibrinogène. Remarque : le déficit en FXII allonge le TCA sans saigner (rôle mineur in vivo).","mc":"déficits rares (II, V, VII, X, XI, XIII, fibrinogène) · déficit en FXII · TCA allongé sans saigner"},{"id":"semhem-s5c0","t":"Hyperfibrinolyse","e":"Fibrinolyse excessive non compensée → le caillot se dissout trop tôt → saignements. Congénitale (déficit en PAI-1 ou en α2-antiplasmine) ou acquise (CIVD, tumeurs, anévrismes). Diagnostic : temps de lyse des euglobulines (test de von Kaulla). Traitement : antifibrinolytiques (acide tranexamique).","mc":"PAI-1 · α2-antiplasmine · antifibrinolytiques"}],"chap":[{"id":"ch1","t":"Rappel des différentes voies métaboliques","court":"Voies métaboliques","sym":"muscle","niveaux":[{"t":"LE schéma à savoir faire : période alimentaire vs période de jeûne","s":"Pourquoi le glucose est-il si surveillé ?, Stocker le sucre en trop : glycogène puis graisse, Le plasma « laiteux » après un repas gras, Le foie : le seul qui relâche du glucose","type":"n","m":[],"q":["ch1-q00","ch1-q01","ch1-q06","ch1-q08","ch1-q11","ch1-q12","ch1-q16","ch1-q17","ch1-q19","ch1-q22","ch1-q26"],"c":["ch1-s0c0","ch1-s0c0w","ch1-s0c1","ch1-s0c1w","ch1-s0c2","ch1-s0c3","ch1-s0c3w","ch1-s0c4","ch1-s0c4w","ch1-s0c5","ch1-s0c5w","ch1-s0c6","ch1-s0c6w"]},{"t":"Principes de base et vue d'ensemble","s":"Métabolisme, anabolisme, catabolisme, Les transporteurs GLUT, Hexokinase vs glucokinase, Glycémie normale","type":"n","m":[],"q":["ch1-q02","ch1-q03"],"c":["ch1-s1c0","ch1-s1c1","ch1-s1c1w","ch1-s1c2","ch1-s1c3"]},{"t":"Métabolisme glucidique","s":"Glycolyse : bilan et enzymes-clés, Trois niveaux de régulation, Glucagon vs insuline sur la glycolyse, Lactate, LDH et cycle de Cori","type":"n","m":[],"q":["ch1-q04","ch1-q05","ch1-q07","ch1-q09","ch1-q10"],"c":["ch1-s2c0","ch1-s2c0w","ch1-s2c1","ch1-s2c2","ch1-s2c2w","ch1-s2c3","ch1-s2c3w","ch1-s2c4","ch1-s2c5","ch1-s2c5w","ch1-s2c6","ch1-s2c7"]},{"t":"Métabolisme lipidique","s":"Les lipides et leur transport, Digestion des graisses, β-oxydation, Synthèse des acides gras","type":"n","m":[],"q":["ch1-q13","ch1-q14","ch1-q15","ch1-q18"],"c":["ch1-s3c0","ch1-s3c1","ch1-s3c2","ch1-s3c3","ch1-s3c4","ch1-s3c5","ch1-s3c5w"]},{"t":"Métabolisme protéique","s":"Pas de réserve d'acides aminés, Transamination et transaminases, Ammoniac, glutamine, alanine, Cycle de l'urée","type":"n","m":[],"q":["ch1-q20","ch1-q21","ch1-q23"],"c":["ch1-s4c0","ch1-s4c1","ch1-s4c1w","ch1-s4c2","ch1-s4c3","ch1-s4c4"]},{"t":"Phosphorylation oxydative","s":"Principe, Les poisons du complexe IV","type":"n","m":[],"q":["ch1-q24","ch1-q25"],"c":["ch1-s5c0","ch1-s5c1"]},{"t":"Questions d'examen","s":"Les questions du prof, avec réponse et mots-clés","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre","type":"boss"}],"cartes":[{"id":"p:ch1:0","lab":"Question reformulée","q":"Expliquez, sur la base d'un schéma, ce qui se passe dans l'organisme en période alimentaire puis en période de jeûne (sans noms d'enzymes).","r":"Schéma : intestin → sang → foie / muscle / tissu adipeux / cerveau / GR, avec deux couleurs (repas, jeûne). Repas : insuline ↑ ; glucose → ATP + glycogène (foie, muscle) ; excès → acétyl-CoA → AG → TG exportés en VLDL vers le tissu adipeux ; graisses alimentaires en chylomicrons → TG ; AA → renouvellement des protéines, excès → urée + AG. Jeûne : glucagon ↑, insuline ↓ ; glycogénolyse hépatique (seul le foie libère du glucose) → néoglucogenèse (lactate, glycérol, alanine) ; lipolyse → AG → β-oxydation → corps cétoniques (muscles, cerveau après adaptation) ; si le jeûne se prolonge, protéolyse musculaire. Le glucose est réservé au cerveau et aux GR.","mc":"Repas: insuline ↑ · glycogène (foie, muscle) · lipogenèse → VLDL · chylomicrons · tissu adipeux | Jeûne: glucagon ↑ · glycogénolyse hépatique · néoglucogenèse (lactate, glycérol, alanine) · lipolyse · β-oxydation · corps cétoniques | Schéma: intestin · sang · foie · muscle · tissu adipeux · cerveau · GR"},{"id":"p:ch1:1","lab":"Question du prof · Ch. 1 · JMD","q":"Quel est l'organe responsable de la synthèse du cholestérol, à partir de quel substrat, et à quoi sert ce cholestérol ?","r":"Le foie (~90 %), à partir de l'acétyl-CoA (HMG-CoA réductase). Rôles : membranes (fluidité), acides biliaires, hormones stéroïdes (cortisol, aldostérone, progestérone, testostérone, œstrogènes) et vitamine D.","mc":"Organe: foie (~90 %) | Substrat: acétyl-CoA · HMG-CoA réductase | Rôles: membranes · acides biliaires · hormones stéroïdes · vitamine D"},{"id":"p:ch1:2","lab":"Question reformulée","q":"Pourquoi un régime hyperprotéiné fait-il maigrir et quel est son risque ?","r":"Sans glucides ni lipides, les AA sont utilisés pour l'énergie et la synthèse : peu de stockage de graisses, la masse grasse diminue. Mais l'azote des AA doit être éliminé : suractivation du cycle de l'urée (foie) et charge rénale accrue.","mc":"Pourquoi: AA utilisés pour l'énergie · peu de stockage de graisses | Risque: azote à éliminer · cycle de l'urée (foie) · charge rénale"},{"id":"p:ch1:3","lab":"Question reformulée","q":"Dans quel ordre l'organisme mobilise-t-il ses réserves pendant un effort prolongé ou un jeûne ?","r":"1) glucose circulant ; 2) glycogène (hépatique pour la glycémie, musculaire pour le muscle) : ~30-40 min d'effort ; 3) TG → AG → β-oxydation (plus d'ATP mais plus lent) et corps cétoniques ; 4) protéines musculaires → AA → néoglucogenèse (jeûne de 24-48 h).","mc":"Ordre: glucose circulant · glycogène (30-40 min) · TG → AG → β-oxydation · corps cétoniques · protéines → néoglucogenèse (24-48 h)"},{"id":"p:ch1:4","lab":"Question reformulée","q":"Pourquoi les corps cétoniques sont-ils indispensables au cerveau en jeûne prolongé, et quel est le risque de leur accumulation ?","r":"Ils servent de carburant relais : après quelques jours de jeûne le cerveau en tire une grande partie de son énergie, ce qui épargne le glucose pour les cellules gluco-dépendantes (GR). Accumulation (diabète décompensé, jeûne prolongé, alcool) : acétose, odeur d'acétone, puis coma acido-cétonique.","mc":"Rôle: carburant relais du cerveau · épargne du glucose · GR gluco-dépendants | Risque: diabète décompensé · jeûne · alcool · odeur d'acétone · coma acido-cétonique"},{"id":"p:ch1:5","lab":"Question reformulée","q":"Expliquez la différence entre hexokinase et glucokinase et l'intérêt de cette différence.","r":"Hexokinase : tous les tissus, haute affinité, fourniture de base même à glycémie basse. Glucokinase : foie et cellules β, faible affinité, glucose seul : elle ne fonctionne qu'après un repas → senseur (sécrétion d'insuline) et tampon (mise en réserve en glycogène). Résultat : en jeûne, le glucose reste disponible pour les tissus périphériques.","mc":"Hexokinase: tous les tissus · haute affinité · fourniture de base | Glucokinase: foie · cellules β · faible affinité · après un repas · senseur · tampon (glycogène)"},{"id":"p:ch1:6","lab":"Question reformulée","q":"Quels sont les rôles du NADPH produit par la voie des pentoses phosphates ?","r":"Biosynthèses réductrices (AG, cholestérol, stéroïdes : foie, tissu adipeux, glande mammaire, surrénales, gonades) ; réduction du glutathion dans les GR (protection contre l'oxydation) ; hydroxylations de détoxification dans le foie (bilirubine, médicaments).","mc":"NADPH: biosynthèses réductrices (AG, cholestérol, stéroïdes) · glutathion réduit (GR) · détoxification hépatique (hydroxylations)"}]},{"id":"ch2a","t":"Communications intercellulaires : messagers et récepteurs","court":"Messagers et récepteurs","sym":"coeur","niveaux":[{"t":"Les messagers : qui parle à qui ?","s":"Critères d'un neurotransmetteur, Les 4 étapes de la transmission synaptique, D'où vient la sélectivité d'une hormone ?, Amplification du signal","type":"n","m":[],"q":["ch2a-q00","ch2a-q01","ch2a-q03"],"c":["ch2a-s0c0","ch2a-s0c1","ch2a-s0c1w","ch2a-s0c2","ch2a-s0c2w","ch2a-s0c3"]},{"t":"Hormones hydrophiles vs lipophiles","s":"Stress aigu vs stress chronique, Les 4 types de récepteurs, Comment les hormones modifient le métabolisme","type":"n","m":[],"q":["ch2a-q23"],"c":["ch2a-s1c0","ch2a-s1c0w","ch2a-s1c1","ch2a-s1c2"]},{"t":"Structure chimique et classification des hormones","s":"Hormones peptidiques, Le noyau stérane, Hormones dérivées d'acides aminés, Qui sécrète quoi (à connaître)","type":"n","m":[],"q":["ch2a-q18","ch2a-q19"],"c":["ch2a-s2c0","ch2a-s2c1","ch2a-s2c1w","ch2a-s2c2","ch2a-s2c3"]},{"t":"L'axe hypothalamo-hypophysaire et le rétrocontrôle","s":"Antéhypophyse, Post-hypophyse (neurohypophyse), Rétrocontrôle négatif","type":"n","m":[],"q":["ch2a-q20","ch2a-q21","ch2a-q22"],"c":["ch2a-s3c0","ch2a-s3c1","ch2a-s3c2","ch2a-s3c2w"]},{"t":"Récepteurs-enzymes : tyrosine kinase et guanylate cyclase","s":"Tyrosine kinases et médicaments, Guanylate cyclase, NO et GMPc, Caféine et théophylline","type":"n","m":[],"q":["ch2a-q02","ch2a-q11","ch2a-q12","ch2a-q13","ch2a-q14"],"c":["ch2a-s4c0","ch2a-s4c1","ch2a-s4c1w","ch2a-s4c2"]},{"t":"Récepteurs couplés aux protéines G (RCPG) et seconds messagers","s":"AMPc : le signal de faim, Phospholipase C, IP3, DAG, calcium, La variété des ligands","type":"n","m":[],"q":["ch2a-q04","ch2a-q05","ch2a-q06","ch2a-q07","ch2a-q08","ch2a-q09","ch2a-q10","ch2a-q24","ch2a-q25"],"c":["ch2a-s5c0","ch2a-s5c0w","ch2a-s6c0","ch2a-s6c0w","ch2a-s6c1","ch2a-s6c2"]},{"t":"Récepteurs intracellulaires et PPAR","s":"Fonctionnement, PPAR : α foie, γ tissu adipeux","type":"n","m":[],"q":["ch2a-q15","ch2a-q16","ch2a-q17"],"c":["ch2a-s7c0","ch2a-s7c0w","ch2a-s7c1"]},{"t":"Questions d'examen","s":"Les questions du prof, avec réponse et mots-clés","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre","type":"boss"}],"cartes":[{"id":"p:ch2a:0","lab":"Question du prof · 21/09/2026","q":"Quels sont les différents types de messagers que l'on peut retrouver dans l'organisme ?","r":"Hormones classiques (glande endocrine → sang → organe cible, endocrine) ; médiateurs (anciennes hormones locales : paracrine et autocrine ; ex. histamine, NO) ; cytokines (peptides de croissance, d'involution et d'immunité : IL-1, IL-6, TNF-α) ; neurotransmetteurs (fente synaptique : acétylcholine, catécholamines, GABA…). Transmission électrique (nerfs, rapide) vs chimique (hormones, plus lente).","mc":"Messagers: hormones (endocrine) · médiateurs (paracrine, autocrine) · cytokines (IL-1, IL-6, TNF-α) · neurotransmetteurs | Transmission: électrique (rapide) · chimique (plus lente)"},{"id":"p:ch2a:1","lab":"Question du prof · 21/09/2026","q":"Expliquez-moi, sur la base d'un schéma, l'activation d'un récepteur couplé à une protéine G, sous-unité αs.","r":"Schéma : membrane avec récepteur à 7 hélices (N dehors, C dedans), protéine G trimérique αβγ avec GDP sur α, adénylate cyclase, ATP → AMPc, PKA. 1) Ligand (ex. glucagon, adrénaline sur β) → changement de conformation. 2) α échange GDP → GTP et se dissocie de βγ. 3) αs-GTP stimule l'adénylate cyclase : ATP → AMPc. 4) 4 AMPc libèrent les 2 sous-unités catalytiques de la PKA → phosphorylation des enzymes-clés (foie : glycogène phosphorylase activée, glycolyse inhibée → glycémie ↑). 5) Arrêt : activité GTPase de α (GTP → GDP), réassociation ; AMPc dégradé par les phosphodiestérases.","mc":"Schéma: 7 hélices · protéine G αβγ · GDP → GTP · adénylate cyclase · ATP → AMPc · PKA | Effet: phosphorylation des enzymes-clés · glycogène phosphorylase (foie) | Arrêt: GTPase de α · phosphodiestérase"},{"id":"p:ch2a:2","lab":"Question du prof · 2025 · 2.2","q":"Sur la base d'un schéma, illustrez le fonctionnement d'un récepteur à activité tyrosine kinase (avec un exemple).","r":"Schéma : récepteur de l'insuline (2 sous-unités α extracellulaires liant l'hormone, 2 β transmembranaires avec domaine kinase). Liaison de l'insuline → activation du domaine tyrosine kinase → autophosphorylation de tyrosines du récepteur (ATP → ADP) → recrutement et phosphorylation de protéines intracellulaires (substrats du récepteur) → cascade → effets (ex. translocation de GLUT-4, synthèse de glycogène, croissance). Autres exemples : IGF, EGF, PDGF (croissance et division cellulaire).","mc":"Récepteur: insuline · 2 α + 2 β · domaine tyrosine kinase | Étapes: autophosphorylation · substrats phosphorylés · cascade · GLUT-4 | Autres: IGF · EGF · PDGF"},{"id":"p:ch2a:3","lab":"Question du prof · 2025 · 2.2","q":"Sur la base d'un schéma, illustrez le fonctionnement d'un récepteur canal ionique (avec un exemple).","r":"Schéma : récepteur GABA-A à 5 sous-unités autour d'un pore, sites GABA et site benzodiazépine. Le ligand se fixe → le canal s'ouvre → passage d'ions selon le gradient. GABA-A : entrée de Cl⁻ → hyperpolarisation → excitabilité ↓ (inhibition). Modulation allostérique (benzodiazépines, barbituriques, alcool) : ouverture renforcée → sédation. Contre-exemple cationique : récepteur nicotinique (Na⁺ entre → dépolarisation → contraction musculaire).","mc":"Exemple: GABA-A · 5 sous-unités · pore | Mécanisme: ouverture · Cl⁻ entre · hyperpolarisation · inhibition | Modulateurs: benzodiazépines · barbituriques · alcool | Contre-exemple: nicotinique · Na⁺ · dépolarisation"},{"id":"p:ch2a:4","lab":"Question reformulée","q":"Sur la base d'un schéma, illustrez l'activation d'un RCPG couplé à une sous-unité αq.","r":"Ligand (ex. noradrénaline sur α1, angiotensine II) → échange GDP/GTP sur αq → activation de la phospholipase C → hydrolyse du PIP2 en IP3 (diffuse, ouvre les canaux Ca²⁺ du RE) et DAG (reste dans la membrane). Ca²⁺ + DAG → protéine kinase C ; Ca²⁺-calmoduline. Effet : contraction du muscle lisse vasculaire (vasoconstriction), sécrétions.","mc":"Exemples: noradrénaline α1 · angiotensine II | Cascade: αq · phospholipase C · PIP2 → IP3 + DAG · Ca²⁺ du RE · protéine kinase C | Effet: vasoconstriction · sécrétions"},{"id":"p:ch2a:5","lab":"Question du prof · 21/09/2026","q":"Dessinez un noyau stérane et citez les hormones qui en dérivent.","r":"Trois cycles à 6 carbones accolés (A, B, C) et un cycle à 5 carbones (D). Dérivés du cholestérol : glucocorticoïdes (cortisol), minéralocorticoïdes (aldostérone), hormones sexuelles (progestérone, testostérone, œstradiol) et vitamine D (cycle B ouvert).","mc":"Noyau stérane: 3 cycles à 6 C (A, B, C) · 1 cycle à 5 C (D) | Dérivés: cortisol · aldostérone · progestérone · testostérone · œstradiol · vitamine D","st":[{"n":"Cholestérol","img":"mol/chol.svg"},{"n":"Cortisol","img":"mol/cortisol.svg"},{"n":"Testostérone","img":"mol/testo.svg"},{"n":"Estradiol","img":"mol/e2.svg"}]},{"id":"p:ch2a:6","lab":"Question reformulée","q":"Comparez les hormones hydrophiles et lipophiles (récepteur, transduction, vitesse, transport), avec un exemple de chaque.","r":"Hydrophiles : récepteur membranaire, second messager, phosphorylation d'enzymes existantes, action rapide et brève, transport libre (ex. adrénaline, insuline). Lipophiles : traversent la membrane, récepteur intracellulaire, complexe sur l'ADN (HRE), synthèse de nouvelles protéines, action lente et durable, protéines de transport (ex. cortisol, T3/T4, stéroïdes sexuels).","mc":"Hydrophiles: récepteur membranaire · second messager · rapide et bref · transport libre · adrénaline, insuline | Lipophiles: récepteur intracellulaire · HRE (ADN) · nouvelles protéines · lent et durable · protéines de transport · cortisol, T3/T4"},{"id":"p:ch2a:7","lab":"Question reformulée","q":"Expliquez l'intérêt d'associer à la L-DOPA un inhibiteur périphérique dans la maladie de Parkinson.","r":"Les récepteurs de la dopamine existent dans le SNC (effet voulu) mais aussi en périphérie (tube digestif : nausées, vomissements ; cœur). La dopamine ne franchit pas la barrière hémato-encéphalique : on donne son précurseur, la L-DOPA. L'inhibiteur périphérique de sa conversion (inhibiteur de la dopa-décarboxylase) laisse plus de L-DOPA arriver au cerveau et réduit les effets indésirables périphériques.","mc":"Problème: dopamine ne passe pas la BHE · récepteurs périphériques (nausées, cœur) | Solution: L-DOPA · inhibiteur de la dopa-décarboxylase périphérique · plus de L-DOPA au cerveau · moins d'effets indésirables"},{"id":"p:ch2a:8","lab":"Question reformulée","q":"Qu'est-ce que le récepteur PPAR-α et quel médicament l'utilise ? Et PPAR-γ ?","r":"Récepteurs nucléaires activés par les AG et dérivés, hétérodimères avec RXR, se fixent aux PPRE. PPAR-α : foie → fibrates (hypolipémiants). PPAR-γ : tissu adipeux → glitazones (antidiabétiques, sensibilisent à l'insuline).","mc":"PPAR: récepteurs nucléaires · AG · hétérodimère RXR · PPRE | PPAR-α: foie · fibrates | PPAR-γ: tissu adipeux · glitazones"},{"id":"p:ch2a:9","lab":"Question reformulée","q":"Expliquez le mécanisme d'action des inhibiteurs de la PDE5 et celui de la caféine.","r":"NO → guanylate cyclase soluble → GMPc → vasodilatation ; le GMPc est dégradé par les PDE. Le sildénafil inhibe sélectivement la PDE5 (corps caverneux) → GMPc ↑ → érection ; prudence en cas de pathologie cardiaque. Caféine et théophylline : inhibiteurs compétitifs non spécifiques des PDE → AMPc ↑.","mc":"Voie: NO · guanylate cyclase soluble · GMPc · vasodilatation | PDE5: sildénafil · GMPc ↑ · érection · prudence cardiaque | Caféine: inhibiteur non spécifique des PDE · AMPc ↑"}]},{"id":"ch2b","t":"Les hormones du métabolisme énergétique","court":"Hormones du métabolisme","sym":"glande","niveaux":[{"t":"L'insuline","s":"Structure, Biosynthèse, Récepteur et transduction, Effets de l'insuline","type":"n","m":[],"q":["ch2b-q00","ch2b-q01","ch2b-q02","ch2b-q03","ch2b-q04","ch2b-q05","ch2b-q07","ch2b-q09","ch2b-q12","ch2b-q13"],"c":["ch2b-s0c0","ch2b-s1c0","ch2b-s1c1","ch2b-s1c1w","ch2b-s1c2","ch2b-s1c3","ch2b-s1c3w","ch2b-s1c4"]},{"t":"Le glucagon","s":"L'antagoniste de l'insuline, Régulation et usage","type":"n","m":[],"q":["ch2b-q06"],"c":["ch2b-s2c0","ch2b-s2c0w","ch2b-s2c1"]},{"t":"L'adrénaline (et la noradrénaline)","s":"Fight or flight, Noradrénaline vs adrénaline, Dégradation : COMT et MAO, Adrénaline en urgence et phéochromocytome","type":"n","m":["tyr","ldopa","dopa","nad","ad","nmn","mn","vma","mt","dopac","hva"],"q":["ch2b-q08","ch2b-q10","ch2b-q11","ch2b-q14","ch2b-q15"],"c":["ch2b-s3c0","ch2b-s3c0w","ch2b-s3c1","ch2b-s3c2","ch2b-s3c2w","ch2b-s3c3"]},{"t":"Les glucocorticoïdes (cortisol)","s":"Biosynthèse, Rythme et transport, Effets métaboliques : « diabétogène », Effets anti-inflammatoires et immunosuppresseurs","type":"n","m":["chol","cortisol","cortisone"],"q":["ch2b-q16","ch2b-q17","ch2b-q18","ch2b-q19","ch2b-q20","ch2b-q21","ch2b-q23"],"c":["ch2b-s4c0","ch2b-s4c1","ch2b-s4c2","ch2b-s4c3","ch2b-s4c3w","ch2b-s4c4","ch2b-s4c5"]},{"t":"Les hormones thyroïdiennes (T3, T4)","s":"Biosynthèse en 3 étapes, T4 produite, T3 active, Effets, Régulation","type":"n","m":["t4","t3"],"q":["ch2b-q22","ch2b-q24","ch2b-q25","ch2b-q26","ch2b-q27","ch2b-q28"],"c":["ch2b-s5c0","ch2b-s5c0w","ch2b-s5c1","ch2b-s5c2","ch2b-s5c3","ch2b-s5c4","ch2b-s5c4w"]},{"t":"Questions d'examen","s":"Les questions du prof, avec réponse et mots-clés","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre","type":"boss"}],"cartes":[{"id":"p:ch2b:0","lab":"Question du prof · 21/09/2026","q":"Que savez-vous de la biosynthèse de l'insuline ?","r":"Cellules β des îlots de Langerhans. Ribosomes : pré-pro-insuline (séquence signal hydrophobe → RE). RE : coupure du peptide signal, formation des ponts disulfures → pro-insuline. Golgi et vésicules : coupure du peptide C → insuline (51 AA, chaînes A et B, 2 ponts inter-chaînes + 1 dans A), stockée avec du zinc. Sécrétion lors de l'hyperglycémie : insuline + peptide C (marqueur de la sécrétion endogène).","mc":"Lieu: cellules β · îlots de Langerhans | Étapes: pré-pro-insuline · peptide signal (RE) · ponts disulfures · pro-insuline · Golgi · peptide C coupé | Insuline: 51 AA · chaînes A et B · zinc | Marqueur: peptide C"},{"id":"p:ch2b:1","lab":"Question du prof · 21/09/2026","q":"Expliquez, sur la base d'un schéma, la régulation de la sécrétion d'insuline au niveau cellulaire.","r":"Cellule β : glucose entre par GLUT-2 (indépendant de l'insuline) → glucokinase → glycolyse, Krebs, chaîne respiratoire → ATP ↑ → fermeture du canal K⁺-ATP → dépolarisation → ouverture des canaux Ca²⁺ voltage-dépendants → Ca²⁺ ↑ → exocytose des vésicules d'insuline. Modulateurs : incrétines et acétylcholine (↑), somatostatine et adrénaline α2 (↓). Les sulfonylurées ferment le canal K⁺-ATP.","mc":"Cellule β: GLUT-2 · glucokinase · ATP ↑ · canal K⁺-ATP fermé · dépolarisation · canaux Ca²⁺ · exocytose | Modulateurs: incrétines · acétylcholine ↑ · somatostatine · adrénaline α2 ↓ | Médicament: sulfonylurées"},{"id":"p:ch2b:2","lab":"Question du prof · 2025 · 2.3","q":"Décrivez la biosynthèse du cortisol à partir du cholestérol (schéma général) et dessinez cholestérol, cortisol et cortisone.","r":"Zone fasciculée, sous ACTH ; cholestérol hépatique apporté par les LDL. Cholestérol —(20,22-hydroxylase, NADPH)→ prégnénolone → progestérone → 17-OH-progestérone → 11-désoxycortisol → cortisol (21 C ; C=O en 3 et 20 ; OH en 11, 17, 21). Autres branches : corticostérone → aldostérone ; 17-OH-prégnénolone → DHEA → hormones sexuelles. Cortisone = cortisol avec C=O en 11 (11β-HSD). Voir la page Molécules pour les structures.","mc":"Lieu: zone fasciculée · ACTH · LDL | Voie: cholestérol · 20,22-hydroxylase · prégnénolone · progestérone · 17-OH-progestérone · 11-désoxycortisol · cortisol | Cortisone: C=O en 11 · 11β-HSD","st":[{"n":"Cholestérol","img":"mol/chol.svg"},{"n":"Cortisol","img":"mol/cortisol.svg"},{"n":"Cortisone","img":"mol/cortisone.svg"}]},{"id":"p:ch2b:3","lab":"Question du prof · 2025 · 2.3","q":"Expliquez les effets du cortisol et pourquoi ils agissent sur le métabolisme (3 grands effets).","r":"1) Métabolique : néoglucogenèse (PEPCK, G6Pase), protéolyse musculaire, lipolyse facilitée → glycémie ↑ (diabétogène, permissif). 2) Immunitaire : anti-inflammatoire (lipocortine → PLA2 bloquée → plus de prostaglandines ni leucotriènes ; NF-κB inhibé) et immunosuppresseur (cytokines ↓). 3) Circulatoire / minéralocorticoïde : à forte dose rétention de Na⁺, œdèmes, HTA ; renforce les effets vasculaires des catécholamines. Logique : adapter l'organisme à un stress prolongé en fournissant du glucose.","mc":"Métabolique: néoglucogenèse · protéolyse · lipolyse · glycémie ↑ | Immunitaire: anti-inflammatoire · lipocortine (PLA2) · NF-κB · immunosuppresseur | Circulatoire: rétention Na⁺ · HTA · permissif des catécholamines"},{"id":"p:ch2b:4","lab":"Question du prof · 2025 · 2.3","q":"Un patient sous corticoïdes au long cours arrête brutalement son traitement. Que risque-t-il et pourquoi ?","r":"Le cortisol exogène a freiné CRH et ACTH par rétrocontrôle négatif : les corticosurrénales, non stimulées, se sont atrophiées. À l'arrêt brutal, elles ne produisent plus de cortisol : insuffisance surrénalienne aiguë (hypoglycémie, hypotension, choc), potentiellement mortelle. D'où une diminution progressive par paliers.","mc":"Mécanisme: rétrocontrôle négatif · CRH et ACTH freinées · atrophie des surrénales | Risque: insuffisance surrénalienne aiguë · hypoglycémie · hypotension · choc | Conduite: arrêt progressif par paliers"},{"id":"p:ch2b:5","lab":"Question du prof · 2025 · 2.3","q":"Expliquez, sur la base d'un schéma, la régulation des hormones thyroïdiennes et ce qui se passe en cas d'hypo- et d'hyperthyroïdie. Où peut-on agir si T3/T4 sont trop élevées ?","r":"Axe TRH (hypothalamus, stimulée par T3/T4 bas et le froid) → TSH (antéhypophyse) → thyroïde : captation d'iode, thyréoglobuline, iodation par la peroxydase, couplage MIT/DIT → T4 (et T3), désiodation périphérique T4 → T3 ; rétrocontrôle négatif. Hypothyroïdie primaire : T3/T4 ↓, TSH ↑ (carence iodée → goitre ; Hashimoto). Hyperthyroïdie : T3/T4 ↑, TSH ↓ (adénome, Basedow : anticorps stimulant le récepteur de la TSH). Agir sur l'excès : inhiber la peroxydase (thiourées : propylthiouracile, thiamazol), chirurgie ; transport par TBG et albumine.","mc":"Axe: TRH · TSH · T4 → T3 · rétrocontrôle négatif | Synthèse: iode · thyréoglobuline · peroxydase · MIT/DIT | Hypo: T3/T4 ↓ · TSH ↑ · goitre · Hashimoto | Hyper: T3/T4 ↑ · TSH ↓ · Basedow · thiourées"},{"id":"p:ch2b:6","lab":"Question reformulée","q":"Décrivez la biosynthèse de l'adrénaline (enzymes et cofacteurs) et sa dégradation.","r":"Tyrosine —(tyrosine hydroxylase, limitante, BH4)→ L-DOPA —(DOPA décarboxylase)→ dopamine —(dopamine β-hydroxylase, vitamine C)→ noradrénaline —(N-méthyltransférase, SAM)→ adrénaline (médullosurrénale). Dégradation : COMT (méthylation d'un OH du catéchol) et MAO (désamination oxydative), dans un ordre ou l'autre → aldéhyde → acide vanillylmandélique urinaire.","mc":"Synthèse: tyrosine · tyrosine hydroxylase (BH4) · L-DOPA · DOPA décarboxylase · dopamine · dopamine β-hydroxylase (vitamine C) · noradrénaline · PNMT (SAM) · adrénaline | Dégradation: COMT · MAO · acide vanillylmandélique","st":[{"n":"L-Tyrosine","img":"mol/tyr.svg"},{"n":"L-DOPA","img":"mol/ldopa.svg"},{"n":"Dopamine","img":"mol/dopa.svg"},{"n":"Noradrénaline","img":"mol/nad.svg"},{"n":"Adrénaline","img":"mol/ad.svg"},{"n":"Acide vanillylmandélique (VMA)","img":"mol/vma.svg"}]},{"id":"p:ch2b:7","lab":"Question reformulée","q":"Quel effet aura un antagoniste α2 ? Et un agoniste β2 sur les bronches ?","r":"α2 présynaptique freine normalement la libération de noradrénaline : l'antagoniste augmente sa libération (effets sympathiques accrus). Agoniste β2 : bronchodilatation (Gs → AMPc ↑), utilisé dans l'asthme.","mc":"Antagoniste α2: lève le frein présynaptique · noradrénaline ↑ | Agoniste β2: Gs · AMPc ↑ · bronchodilatation · asthme"},{"id":"p:ch2b:8","lab":"Question reformulée","q":"Comparez l'insuline et le glucagon (cellules, structure, récepteur, organes cibles, effets, régulation).","r":"Insuline : cellules β, 51 AA (A + B, 3 ponts S-S), récepteur tyrosine kinase, foie + muscle + tissu adipeux, hypoglycémiante et anabolisante (GLUT-4, glycogène, lipogenèse), stimulée par l'hyperglycémie. Glucagon : cellules α, 29 AA (1 chaîne), RCPG Gs → AMPc, foie seul, hyperglycémiant (glycogénolyse, néoglucogenèse), stimulé par l'hypoglycémie. Les deux : demi-vie 5 min, freinés par la somatostatine.","mc":"Insuline: cellules β · 51 AA · tyrosine kinase · foie, muscle, tissu adipeux · hypoglycémiante · anabolisante | Glucagon: cellules α · 29 AA · RCPG Gs · foie · hyperglycémiant | Commun: demi-vie 5 min · somatostatine"}]},{"id":"ch2c","t":"Les hormones gastro-intestinales","court":"Hormones digestives","sym":"estomac","niveaux":[{"t":"Régulation de la sécrétion gastrique","s":"Une même histamine, deux récepteurs","type":"n","m":[],"q":["ch2c-q00","ch2c-q01","ch2c-q02","ch2c-q03"],"c":["ch2c-s0c0","ch2c-s1c0","ch2c-s1c0w"]},{"t":"Sécrétions pancréatiques et biliaires : sécrétine et CCK","s":"Sécrétine, Cholécystokinine (CCK)","type":"n","m":[],"q":["ch2c-q04","ch2c-q05","ch2c-q15"],"c":["ch2c-s2c0","ch2c-s2c1"]},{"t":"Les incrétines : GIP et GLP-1","s":"Deux stratégies médicamenteuses","type":"n","m":[],"q":["ch2c-q06","ch2c-q07","ch2c-q08","ch2c-q09","ch2c-q10","ch2c-q11","ch2c-q12","ch2c-q13","ch2c-q14"],"c":["ch2c-s3c0","ch2c-s3c0w","ch2c-s4c0"]},{"t":"Questions d'examen","s":"Les questions du prof, avec réponse et mots-clés","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre","type":"boss"}],"cartes":[{"id":"p:ch2c:0","lab":"Question reformulée","q":"Sur la base d'un schéma, expliquez la régulation hormonale et nerveuse de la sécrétion gastrique.","r":"Stimulation : nerf vague (ACh) ; estomac plein → gastrine (cellules G de l'antre) → HCl (cellules pariétales) et pepsinogène (cellules principales) ; ACh + gastrine → histamine (cellules ECL) → récepteurs H2 → renforce l'HCl. Freins : pH ≈ 2 inhibe la gastrine (rétrocontrôle) ; somatostatine (cellules D) inhibe gastrine, histamine et CCK via Gi ; VIP ; sécrétine et GIP depuis le duodénum.","mc":"Stimulation: nerf vague (ACh) · gastrine (cellules G) · histamine (ECL, H2) · HCl (cellules pariétales) · pepsinogène | Freins: pH ≈ 2 · somatostatine (cellules D) · sécrétine · GIP"},{"id":"p:ch2c:1","lab":"Question reformulée","q":"Qu'est-ce qu'une incrétine ? Décrivez le GIP et le GLP-1 et leur intérêt thérapeutique.","r":"Hormone peptidique digestive, libérée en réponse à un repas, qui stimule la sécrétion d'insuline (RCPG des cellules β) de manière glucose-dépendante. GIP : cellules K (duodénum, jéjunum), 42 AA, insuline ↑. GLP-1 : cellules L (iléon, côlon), 30 AA, insuline ↑, glucagon ↓, vidange gastrique ↓, satiété. Tous deux dégradés par la DPP-4. Thérapie du diabète de type 2 et de l'obésité : analogues du GLP-1 (exénatide, sémaglutide OZEMPIC®, tirzépatide MOUNJARO®) ou inhibiteurs de la DPP-4 (gliptines).","mc":"Définition: hormone digestive · insuline ↑ glucose-dépendante | GIP: cellules K · duodénum | GLP-1: cellules L · iléon · glucagon ↓ · vidange gastrique ↓ · satiété | Dégradation: DPP-4 | Médicaments: sémaglutide · tirzépatide · gliptines"},{"id":"p:ch2c:2","lab":"Question reformulée","q":"Quels sont les rôles de la sécrétine et de la cholécystokinine ?","r":"Sécrétine (cellules S, chyme acide) : bicarbonate pancréatique → neutralisation, sécrétion biliaire, inhibition gastrique. CCK (cellules I, lipides et AA) : enzymes pancréatiques ↑, contraction de la vésicule biliaire, vidange gastrique ralentie.","mc":"Sécrétine: cellules S · chyme acide · bicarbonate pancréatique | CCK: cellules I · lipides, AA · enzymes pancréatiques · vésicule biliaire · vidange ralentie"},{"id":"p:ch2c:3","lab":"Question reformulée","q":"Qu'est-ce que la leptine et pourquoi s'y est-on intéressé dans l'obésité ?","r":"Adipokine sécrétée par les adipocytes proportionnellement aux réserves ; agit sur l'hypothalamus (inhibe le neuropeptide Y) → satiété, thermogenèse. Des mutations de la leptine ou de son récepteur donnent des obésités sévères génétiques. Les mimétiques de la leptine sont peu efficaces (pas d'effet endocrine, résistance).","mc":"Leptine: adipokine · proportionnelle aux réserves · hypothalamus · neuropeptide Y ↓ · satiété | Obésité: mutations génétiques · résistance · mimétiques peu efficaces"}]},{"id":"ch2d","t":"Eau, électrolytes et éléments minéraux","court":"Eau et électrolytes","sym":"rein","niveaux":[{"t":"Sodium, potassium et les 4 hormones « A »","s":"Le sodium règle la pression, Le potassium règle les membranes","type":"n","m":[],"q":["ch2d-q00","ch2d-q04"],"c":["ch2d-s0c0","ch2d-s0c1"]},{"t":"Le peptide natriurétique atrial (ANP)","s":"La seule hormone hypotensive","type":"n","m":[],"q":["ch2d-q01","ch2d-q02"],"c":["ch2d-s1c0","ch2d-s1c0w"]},{"t":"Le système rénine-angiotensine-aldostérone (SRAA)","s":"Effets de l'angiotensine II, Ce qui déclenche la rénine, Trois cibles thérapeutiques","type":"n","m":[],"q":["ch2d-q03","ch2d-q05"],"c":["ch2d-s2c0","ch2d-s2c1","ch2d-s2c2"]},{"t":"L'aldostérone","s":"Mécanisme, Stimuli, Conn, réglisse, insuffisance surrénale","type":"n","m":["aldo"],"q":["ch2d-q06","ch2d-q07","ch2d-q08","ch2d-q09","ch2d-q10"],"c":["ch2d-s3c0","ch2d-s3c1","ch2d-s3c2","ch2d-s3c2w"]},{"t":"L'hormone antidiurétique (ADH, vasopressine)","s":"Biosynthèse et récepteurs, Régulation, Diabète insipide","type":"n","m":[],"q":["ch2d-q11","ch2d-q12","ch2d-q13"],"c":["ch2d-s4c0","ch2d-s4c1","ch2d-s4c1w","ch2d-s4c2"]},{"t":"Calcium et phosphate : PTH, calcitriol, calcitonine","s":"Parathormone (PTH), Calcitriol, Calcitonine, Pourquoi la vitamine D compte tant en officine","type":"n","m":["dhc","d3","d25","d125"],"q":["ch2d-q14","ch2d-q15","ch2d-q16","ch2d-q17","ch2d-q18","ch2d-q19"],"c":["ch2d-s5c0","ch2d-s5c0w","ch2d-s5c1","ch2d-s5c2","ch2d-s5c3"]},{"t":"Questions d'examen","s":"Les questions du prof, avec réponse et mots-clés","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre","type":"boss"}],"cartes":[{"id":"p:ch2d:0","lab":"Question du prof · 2025 · 2.5","q":"Expliquez l'équilibre phosphocalcique et le rôle de la vitamine D (biosynthèse à dessiner).","r":"Calcémie 2,5 mmol/L. PTH (parathyroïdes, calcémie basse) : ostéoblastes → IL-1 → ostéoclastes → résorption ; rein : Ca²⁺ réabsorbé, phosphate excrété, 1α-hydroxylase activée. Calcitriol : cholestérol → 7-déshydrocholestérol (foie) → UV → cholécalciférol D3 (peau) → 25-OH-D3 calcifédiol (foie) → 1,25-(OH)₂-D3 calcitriol (rein, PTH) ; récepteur nucléaire ; calbindines → absorption intestinale de Ca²⁺ et phosphate. Calcitonine (cellules C thyroïde, calcémie haute) : effet inverse. Carences : rachitisme, ostéomalacie.","mc":"PTH: parathyroïdes · ostéoclastes · Ca²⁺ réabsorbé · phosphate excrété · 1α-hydroxylase | Vitamine D: 7-déshydrocholestérol · UV · cholécalciférol · calcifédiol (foie) · calcitriol (rein) · calbindines | Calcitonine: cellules C · effet inverse | Carences: rachitisme · ostéomalacie","st":[{"n":"7-Déhydrocholestérol","img":"mol/dhc.svg"},{"n":"Cholécalciférol (vitamine D3)","img":"mol/d3.svg"},{"n":"25-Hydroxycholécalciférol (calcifédiol)","img":"mol/d25.svg"},{"n":"1,25-Dihydroxycholécalciférol (calcitriol)","img":"mol/d125.svg"}]},{"id":"p:ch2d:1","lab":"Question du prof · 2025 · 2.5","q":"Une oreillette trop dilatée libère une hormone. Laquelle, et que fait-elle au niveau rénal et vasculaire ?","r":"L'ANP (28 AA, récepteur guanylate cyclase). Trop de volume → il faut éliminer : rein : moins de réabsorption de Na⁺ (natriurèse, l'eau suit) ; vaisseaux : vasodilatation ; freine rénine, aldostérone et ADH. Pression ↓.","mc":"Hormone: ANP · oreillette · guanylate cyclase | Rein: natriurèse · eau suit | Vaisseaux: vasodilatation | Freine: rénine · aldostérone · ADH"},{"id":"p:ch2d:2","lab":"Question reformulée","q":"Décrivez le système rénine-angiotensine-aldostérone et les médicaments qui le ciblent.","r":"Hypovolémie / pression basse / sympathique (β1) / NaCl bas à la macula densa → rénine (appareil juxtaglomérulaire) : angiotensinogène (foie) → angiotensine I → (ECA) → angiotensine II → AT1 (Gq, Ca²⁺) : vasoconstriction, aldostérone (zone glomérulée : Na⁺ réabsorbé, K⁺ excrété), ADH, soif → volume et pression ↑. Médicaments : aliskiren (rénine), IECA, sartans (AT1), spironolactone (aldostérone).","mc":"Déclencheurs: hypovolémie · pression ↓ · β1 · macula densa | Cascade: rénine · angiotensinogène · angiotensine I · ECA · angiotensine II · AT1 | Effets: vasoconstriction · aldostérone · ADH · soif | Médicaments: aliskiren · IECA · sartans · spironolactone"},{"id":"p:ch2d:3","lab":"Question du prof · 2025 · 2.5","q":"L'aldostérone est-elle hydrophile ou lipophile ? Quel est son mode d'action ?","r":"Lipophile (stéroïde dérivé du cholestérol) → récepteur intracellulaire → expression de gènes : canaux Na⁺ et Na⁺/K⁺-ATPase des cellules du tubule distal → Na⁺ réabsorbé, K⁺ et H⁺ excrétés.","mc":"Nature: lipophile · stéroïde | Action: récepteur intracellulaire · gènes · canaux Na⁺ · Na⁺/K⁺-ATPase · tubule distal | Effet: Na⁺ réabsorbé · K⁺ et H⁺ excrétés"},{"id":"p:ch2d:4","lab":"Question reformulée","q":"Un patient hypertendu a une hypokaliémie. Quelle hypothèse hormonale ? Et chez un grand consommateur de réglisse ?","r":"Hyperaldostéronisme primaire (syndrome de Conn : adénome de la corticosurrénale) : rétention de Na⁺ et d'eau → HTA, fuite de K⁺ → hypokaliémie. La glycyrrhizine de la réglisse a une action aldostérone-like : même tableau.","mc":"Hypothèse: hyperaldostéronisme primaire · syndrome de Conn · adénome | Tableau: rétention Na⁺ · HTA · hypokaliémie | Réglisse: glycyrrhizine · effet aldostérone-like"},{"id":"p:ch2d:5","lab":"Question reformulée","q":"Expliquez le mode d'action de l'ADH et pourquoi l'alcool fait uriner.","r":"ADH (hypothalamus, post-hypophyse), stimulée par l'osmolalité ↑ et l'hypovolémie. V2 (tube collecteur, Gs, AMPc) → insertion d'aquaporines → réabsorption d'eau. V1 (vaisseaux, Gq, Ca²⁺) → vasoconstriction. L'alcool inhibe sa sécrétion → diurèse, déshydratation (gueule de bois). Manque d'ADH ou de V2 → diabète insipide (polyurie).","mc":"ADH: hypothalamus · post-hypophyse · osmolalité ↑ | V2: Gs · AMPc · aquaporines · réabsorption d'eau | V1: Gq · vasoconstriction | Alcool: inhibe l'ADH · diurèse | Déficit: diabète insipide"}]},{"id":"ch2e","t":"Croissance et reproduction","court":"Croissance et reproduction","sym":"repro","niveaux":[{"t":"L'hormone de croissance (GH, somatotropine)","s":"Biosynthèse et sécrétion, Effets directs et indirects, Régulation, Pathologies et dopage","type":"n","m":[],"q":["ch2e-q00","ch2e-q01","ch2e-q02","ch2e-q03","ch2e-q04"],"c":["ch2e-s0c0","ch2e-s0c1","ch2e-s0c2","ch2e-s0c2w","ch2e-s0c3"]},{"t":"Hormones thyroïdiennes, androgènes et facteurs de croissance hématopoïétiques","s":"Hormones thyroïdiennes et androgènes dans la croissance, Érythropoïétine (EPO), Thrombopoïétine (TPO)","type":"n","m":[],"q":["ch2e-q05","ch2e-q06","ch2e-q07"],"c":["ch2e-s1c0","ch2e-s1c1","ch2e-s1c1w","ch2e-s1c2"]},{"t":"Biosynthèse des hormones sexuelles (schéma n° 1 à retenir)","s":"Ce que ce schéma explique, L'aromatase et la 5α-réductase en thérapeutique, Transport et catabolisme","type":"n","m":["testo","dht","dhea","proges","e2","e1","e3"],"q":["ch2e-q08","ch2e-q09","ch2e-q10","ch2e-q11","ch2e-q19"],"c":["ch2e-s2c0","ch2e-s2c1","ch2e-s2c2"]},{"t":"Axe gonadotrope, cycle menstruel et contraception (schéma n° 2 à retenir)","s":"Œstrogènes : récepteurs et effets, Progestérone et mifépristone, La pilule, Modulateurs du récepteur aux œstrogènes","type":"n","m":[],"q":["ch2e-q12","ch2e-q13","ch2e-q14","ch2e-q15","ch2e-q16"],"c":["ch2e-s3c0","ch2e-s3c1","ch2e-s3c2","ch2e-s3c2w","ch2e-s3c3"]},{"t":"Androgènes chez l'homme, prolactine et ocytocine","s":"Testostérone, Prolactine : une régulation à part, Ocytocine","type":"n","m":[],"q":["ch2e-q17","ch2e-q18"],"c":["ch2e-s4c0","ch2e-s4c1","ch2e-s4c2"]},{"t":"Questions d'examen","s":"Les questions du prof, avec réponse et mots-clés","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre","type":"boss"}],"cartes":[{"id":"p:ch2e:0","lab":"Question du prof · 2025 · 2.6","q":"Le rein a-t-il une fonction endocrine ? Justifiez.","r":"Oui, pour trois raisons : 1) rénine (appareil juxtaglomérulaire → SRAA, pression artérielle) ; 2) calcitriol (1α-hydroxylation du calcifédiol sous PTH → absorption du calcium) ; 3) EPO (en réponse à l'hypoxie → production de GR). D'où, dans l'insuffisance rénale, anémie, troubles phosphocalciques, HTA.","mc":"Rein endocrine: rénine (SRAA) · calcitriol (1α-hydroxylation) · EPO (hypoxie, GR) | Insuffisance rénale: anémie · troubles phosphocalciques · HTA"},{"id":"p:ch2e:1","lab":"Question du prof · 2025 · 2.6","q":"Expliquez les effets directs et indirects de l'hormone de croissance et sa régulation.","r":"GH : 191 AA, antéhypophyse, sécrétion pulsatile. Directs : lipolyse, effet anti-insuline (glycémie ↑), synthèse protéique. Indirects : le foie produit les IGF-1/2 (somatomédines), récepteurs tyrosine kinase proches de l'insuline → croissance des os et des tissus. Régulation : GHRH (stimulée par hypoglycémie, sommeil, effort) ↑, somatostatine ↓, rétrocontrôle des IGF. Excès : gigantisme / acromégalie ; déficit : nanisme.","mc":"GH: 191 AA · antéhypophyse · pulsatile | Directs: lipolyse · anti-insuline · synthèse protéique | Indirects: IGF-1 (foie) · tyrosine kinase · croissance | Régulation: GHRH · somatostatine | Pathologies: gigantisme · acromégalie · nanisme"},{"id":"p:ch2e:2","lab":"Question du prof · 2025 · 2.7","q":"Sur la base d'un schéma, décrivez la biosynthèse des hormones sexuelles à partir du cholestérol (structures de la liste à dessiner).","r":"Cholestérol (LDL) → prégnénolone (20,22-hydroxylase) → progestérone (21 C) ; prégnénolone → 17-OH-prégnénolone → DHEA → androstènedione → testostérone (19 C) → DHT (5α-réductase). Aromatase : testostérone → œstradiol, androstènedione → œstrone (18 C, cycle A aromatique) ; œstriol. Organes : gonades, corticosurrénale (DHEA), placenta. Voir la page Molécules.","mc":"Voie: cholestérol · prégnénolone · progestérone (21 C) · DHEA · androstènedione · testostérone (19 C) · DHT (5α-réductase) | Aromatase: œstradiol · œstrone (18 C, cycle A aromatique) · œstriol | Organes: gonades · surrénale · placenta","st":[{"n":"Cholestérol","img":"mol/chol.svg"},{"n":"Progestérone","img":"mol/proges.svg"},{"n":"DHEA","img":"mol/dhea.svg"},{"n":"Testostérone","img":"mol/testo.svg"},{"n":"Dihydrotestostérone (DHT)","img":"mol/dht.svg"},{"n":"Estradiol","img":"mol/e2.svg"},{"n":"Estrone","img":"mol/e1.svg"},{"n":"Estriol","img":"mol/e3.svg"}]},{"id":"p:ch2e:3","lab":"Question du prof · 2025 · 2.7","q":"Expliquez, sur la base des deux schémas du cours, le cycle menstruel (hormones et endomètre) et le mode d'action de la pilule.","r":"GnRH pulsatile → FSH/LH. Phase folliculaire : FSH → follicule → œstradiol → prolifération de l'endomètre. Œstradiol élevé → rétrocontrôle positif → pic de LH → ovulation (J14). Phase lutéale : corps jaune → progestérone → endomètre sécrétoire et vascularisé. Sans fécondation : régression du corps jaune → chute de progestérone → règles ; avec : hCG maintient le corps jaune. Pilule : œstroprogestatif stable → rétrocontrôle négatif → FSH et LH basses → pas d'ovulation ; endomètre et glaire défavorables.","mc":"Folliculaire: FSH · œstradiol · prolifération | Ovulation: rétrocontrôle positif · pic de LH · J14 | Lutéale: corps jaune · progestérone · endomètre sécrétoire | Règles: chute de progestérone | Pilule: rétrocontrôle négatif · FSH/LH ↓ · pas d'ovulation"},{"id":"p:ch2e:4","lab":"Question du prof · 2025 · 2.7","q":"Qu'est-ce que la mifépristone et comment agit-elle ?","r":"RU-486 (MIFEGYNE®), antagoniste du récepteur de la progestérone : l'endomètre ne peut plus être maintenu → interruption de grossesse (seule molécule abortive médicale utilisée).","mc":"Mifépristone: RU-486 · MIFEGYNE® · antagoniste de la progestérone · endomètre non maintenu · interruption de grossesse"},{"id":"p:ch2e:5","lab":"Question reformulée","q":"Pourquoi un homme atteint de cirrhose peut-il développer une gynécomastie ?","r":"Les œstrogènes sont normalement dégradés par le foie (conjugaison). En cas de cirrhose, ils s'accumulent → féminisation (gynécomastie, perte de pilosité).","mc":"Cirrhose: œstrogènes non dégradés (foie) · accumulation · gynécomastie · perte de pilosité"},{"id":"p:ch2e:6","lab":"Question reformulée","q":"Pourquoi les neuroleptiques peuvent-ils provoquer une montée de lait ?","r":"La dopamine est la statine de la prolactine (frein permanent). Les neuroleptiques bloquent les récepteurs dopaminergiques → le frein est levé → prolactine ↑ → galactorrhée.","mc":"Dopamine: frein de la prolactine | Neuroleptiques: bloquent D2 · prolactine ↑ · galactorrhée"}]},{"id":"ch2f","t":"Cytokines et médiateurs","court":"Cytokines et médiateurs","sym":"virus","niveaux":[{"t":"Les cytokines","s":"Cytokine vs hormone, TNF-α, IL-1, IL-6 : l'inflammation aiguë, TNF-α et interférons, Facteurs de croissance","type":"n","m":[],"q":["ch2f-q00","ch2f-q01","ch2f-q02","ch2f-q12","ch2f-q14","ch2f-q18"],"c":["ch2f-s0c0","ch2f-s0c1","ch2f-s0c1w","ch2f-s0c2","ch2f-s0c3"]},{"t":"La cascade de l'acide arachidonique : COX et LOX","s":"L'acide arachidonique et l'EPA, Effets des prostanoïdes, Les leucotriènes","type":"n","m":["aa","epa"],"q":["ch2f-q03","ch2f-q04","ch2f-q05","ch2f-q06","ch2f-q07"],"c":["ch2f-s1c0","ch2f-s1c1","ch2f-s1c1w","ch2f-s1c2"]},{"t":"L'aspirine : mécanisme et effets indésirables","s":"Pourquoi une faible dose suffit, Les effets indésirables s'expliquent par les médiateurs","type":"n","m":[],"q":["ch2f-q08","ch2f-q09","ch2f-q10","ch2f-q11"],"c":["ch2f-s2c0","ch2f-s2c1","ch2f-s2c1w"]},{"t":"Le monoxyde d'azote (NO) et les endothélines","s":"Les trois NO synthases, Effet vasodilatateur, Endothélines","type":"n","m":["arg","noha","cit"],"q":["ch2f-q13","ch2f-q15","ch2f-q16"],"c":["ch2f-s3c0","ch2f-s3c1","ch2f-s3c2"]},{"t":"L'histamine","s":"Allergie et choc anaphylactique","type":"n","m":["hist"],"q":["ch2f-q17","ch2f-q19"],"c":["ch2f-s4c0"]},{"t":"Questions d'examen","s":"Les questions du prof, avec réponse et mots-clés","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre","type":"boss"}],"cartes":[{"id":"p:ch2f:0","lab":"Question reformulée","q":"Sur la base d'un schéma, décrivez la cascade de l'acide arachidonique et situez-y les cibles des anti-inflammatoires.","r":"Phospholipides membranaires —PLA2 (bloquée par les corticoïdes via la lipocortine)→ acide arachidonique → COX-1/COX-2 (bloquées par les AINS, l'aspirine, les coxibs) → PGG2 → PGH2 → PGE2, PGI2 (endothélium), TXA2 (plaquettes) ; → 5-LOX (+FLAP) → 5-HPETE → LTA4 → LTB4 (chimiotactisme) et LTC4/D4/E4 (bronchoconstriction ; antileucotriènes).","mc":"Cascade: phospholipides · PLA2 · acide arachidonique · COX-1/COX-2 · PGH2 · PGE2 · PGI2 · TXA2 · 5-LOX · leucotriènes | Cibles: corticoïdes (lipocortine) · AINS · aspirine · coxibs · antileucotriènes","st":[{"n":"Acide arachidonique","img":"mol/aa.svg"},{"n":"EPA","img":"mol/epa.svg"}]},{"id":"p:ch2f:1","lab":"Question du prof · 24/10/2025","q":"Expliquez le mécanisme d'action de l'aspirine, pourquoi une faible dose est anti-agrégante, et ses principaux effets indésirables.","r":"Acétylation irréversible d'une sérine des COX. Faible dose (75-325 mg/j) : la COX-1 plaquettaire est bloquée ; la plaquette sans noyau ne peut pas la resynthétiser → plus de TXA2 pendant 8-10 jours, alors que l'endothélium refait sa COX et sa PGI2 → anti-agrégation. Dose plus forte : COX-2 aussi → anti-inflammatoire. Effets indésirables : ulcère (PGE2 ↓), asthme (déviation vers les leucotriènes), atteinte rénale, saignements, syndrome de Reye chez l'enfant.","mc":"Mécanisme: acétylation irréversible · sérine des COX | Faible dose: COX-1 plaquettaire · pas de noyau · TXA2 ↓ 8-10 j · PGI2 conservée · anti-agrégation | EI: ulcère · asthme · rein · saignements · syndrome de Reye"},{"id":"p:ch2f:2","lab":"Question reformulée","q":"Expliquez la balance TXA2/PGI2 et pourquoi les coxibs augmentent le risque de thrombose.","r":"TXA2 (COX-1 plaquettaire) : pro-agrégant, vasoconstricteur. PGI2 (COX-2 endothéliale) : anti-agrégante, vasodilatatrice. Un coxib bloque la PGI2 sans toucher le TXA2 → balance pro-thrombotique.","mc":"TXA2: COX-1 · plaquettes · pro-agrégant · vasoconstricteur | PGI2: COX-2 · endothélium · anti-agrégant · vasodilatateur | Coxibs: PGI2 ↓ · TXA2 intact · thrombose"},{"id":"p:ch2f:3","lab":"Question du prof · 24/10/2025","q":"Décrivez la biosynthèse du NO (structures) et son mécanisme vasodilatateur.","r":"L-arginine —NO synthase (NADPH, O₂)→ N-hydroxy-L-arginine → L-citrulline + NO. eNOS et nNOS constitutives (Ca²⁺-calmoduline), iNOS inductible (cytokines, macrophages). Le NO diffuse vers le muscle lisse → guanylate cyclase soluble → GMPc → relaxation (vasodilatation) ; anti-agrégant. Donneurs de NO : dérivés nitrés ; PDE5 inhibée → GMPc prolongé.","mc":"Synthèse: L-arginine · NO synthase (NADPH, O₂) · N-hydroxy-L-arginine · L-citrulline + NO | Isoformes: eNOS · nNOS · iNOS | Effet: guanylate cyclase soluble · GMPc · vasodilatation · anti-agrégant | Médicaments: dérivés nitrés · inhibiteurs PDE5","st":[{"n":"L-Arginine","img":"mol/arg.svg"},{"n":"N-Hydroxy-L-arginine","img":"mol/noha.svg"},{"n":"L-Citrulline","img":"mol/cit.svg"}]},{"id":"p:ch2f:4","lab":"Question du prof · 24/10/2025","q":"L'histamine : biosynthèse, récepteurs et rôle dans l'allergie.","r":"Histidine —histidine décarboxylase→ histamine (CO₂), stockée dans les granules des mastocytes (et cellules ECL). H1 (Gq, Ca²⁺) : bronchoconstriction, vasodilatation, œdème, prurit → antihistaminiques H1. H2 (Gs, AMPc) : HCl gastrique → anti-H2. Allergie : IgE → dégranulation mastocytaire ; choc anaphylactique → adrénaline.","mc":"Synthèse: histidine · histidine décarboxylase · mastocytes | H1: Gq · bronchoconstriction · œdème · prurit · antihistaminiques | H2: Gs · HCl gastrique · anti-H2 | Allergie: IgE · dégranulation · choc · adrénaline","st":[{"n":"Histamine","img":"mol/hist.svg"}]},{"id":"p:ch2f:5","lab":"Question reformulée","q":"Quelles sont les cytokines de la phase aiguë de l'inflammation et leurs effets locaux et systémiques ?","r":"TNF-α, IL-1, IL-6 (macrophages). Local : molécules d'adhésion, recrutement des leucocytes, COX-2. Systémique : fièvre (PGE2 hypothalamique), protéines de la phase aiguë hépatiques (CRP), leucocytose ; en excès, choc septique (TNF).","mc":"Cytokines: TNF-α · IL-1 · IL-6 · macrophages | Local: adhésion · recrutement des leucocytes · COX-2 | Systémique: fièvre (PGE2) · CRP · leucocytose · choc septique"}]},{"id":"ch2g","t":"Les neuromédiateurs","court":"Neuromédiateurs","sym":"brain","niveaux":[{"t":"L'acétylcholine","s":"Nicotiniques vs muscariniques, Toxines et médicaments","type":"n","m":["ach"],"q":["ch2g-q00","ch2g-q01","ch2g-q02","ch2g-q03","ch2g-q11"],"c":["ch2g-s0c0","ch2g-s1c0","ch2g-s1c0w","ch2g-s1c1"]},{"t":"Les acides aminés neuromédiateurs : glutamate, glycine, GABA","s":"Glutamate (excitateur), Glycine (inhibitrice), GABA et récepteur GABA-A","type":"n","m":["glu","gly","gaba"],"q":["ch2g-q04","ch2g-q05","ch2g-q06","ch2g-q07","ch2g-q08"],"c":["ch2g-s2c0","ch2g-s2c1","ch2g-s2c2","ch2g-s2c2w"]},{"t":"Noradrénaline et dopamine","s":"Dopamine : récepteurs et effets, Maladie de Parkinson, Schizophrénie","type":"n","m":[],"q":["ch2g-q09","ch2g-q10","ch2g-q12","ch2g-q17"],"c":["ch2g-s3c0","ch2g-s3c1","ch2g-s3c2","ch2g-s3c2w"]},{"t":"Sérotonine et mélatonine","s":"Où et comment, Humeur, sommeil, dépression, Nausées et migraine, Mélatonine","type":"n","m":["trp","5ht","mel"],"q":["ch2g-q13","ch2g-q14","ch2g-q15","ch2g-q16"],"c":["ch2g-s4c0","ch2g-s4c1","ch2g-s4c2","ch2g-s4c3","ch2g-s5c0"]},{"t":"Questions d'examen","s":"Les questions du prof, avec réponse et mots-clés","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre","type":"boss"}],"cartes":[{"id":"p:ch2g:0","lab":"Question reformulée","q":"Décrivez la biosynthèse de la dopamine dans le SNC et son rôle dans la maladie de Parkinson et dans la schizophrénie, avec les traitements.","r":"Tyrosine —(tyrosine hydroxylase)→ L-DOPA —(DOPA décarboxylase)→ dopamine (→ noradrénaline). Parkinson : perte des neurones de la substance noire → dopamine ↓ dans le striatum → L-DOPA (+ inhibiteur périphérique de la décarboxylase), inhibiteurs de la COMT/MAO-B, agonistes. Schizophrénie : excès de dopamine → neuroleptiques anti-D2 ; effets indésirables : syndrome extrapyramidal, hyperprolactinémie.","mc":"Synthèse: tyrosine · L-DOPA · dopamine | Parkinson: substance noire · dopamine ↓ · L-DOPA + inhibiteur de la décarboxylase · COMT · MAO-B | Schizophrénie: excès de dopamine · neuroleptiques anti-D2 · extrapyramidal · hyperprolactinémie","st":[{"n":"L-Tyrosine","img":"mol/tyr.svg"},{"n":"L-DOPA","img":"mol/ldopa.svg"},{"n":"Dopamine","img":"mol/dopa.svg"}]},{"id":"p:ch2g:1","lab":"Question reformulée","q":"Expliquez le fonctionnement du récepteur GABA-A et pourquoi les benzodiazépines et l'alcool sont sédatifs.","r":"Glutamate —(glutamate décarboxylase)→ GABA. GABA-A : canal Cl⁻ pentamérique ; le GABA l'ouvre → Cl⁻ entre → hyperpolarisation → inhibition. Benzodiazépines, barbituriques, alcool : modulateurs allostériques positifs → ouverture renforcée → sédation, anxiolyse, myorelaxation ; effets additifs (danger de l'association).","mc":"GABA: glutamate décarboxylase | GABA-A: canal Cl⁻ · hyperpolarisation · inhibition | Modulateurs: benzodiazépines · barbituriques · alcool · effets additifs","st":[{"n":"Glutamate","img":"mol/glu.svg"},{"n":"GABA","img":"mol/gaba.svg"}]},{"id":"p:ch2g:2","lab":"Question reformulée","q":"Décrivez la voie tryptophane → sérotonine → mélatonine (structures) et les rôles de la sérotonine.","r":"L-tryptophane → (tryptophane hydroxylase) 5-hydroxytryptophane → (décarboxylase) sérotonine (5-HT, noyau indole) → (épiphyse : N-acétylation puis O-méthylation) mélatonine. Rôles de la 5-HT : humeur (dépression), sommeil, nausées (5-HT3), migraine (5-HT1, triptans), motilité intestinale, plaquettes. Dégradation par la MAO-A.","mc":"Voie: tryptophane · 5-hydroxytryptophane · sérotonine (noyau indole) · N-acétylation · O-méthylation · mélatonine (épiphyse) | 5-HT: humeur · sommeil · nausées (5-HT3) · migraine (triptans) · intestin · MAO-A","st":[{"n":"L-Tryptophane","img":"mol/trp.svg"},{"n":"Sérotonine","img":"mol/5ht.svg"},{"n":"Mélatonine","img":"mol/mel.svg"}]},{"id":"p:ch2g:3","lab":"Question reformulée","q":"Comparez les récepteurs nicotiniques et muscariniques de l'acétylcholine (structure, localisation, effets).","r":"Nicotiniques : récepteurs canaux pentamériques ; ganglions, médullosurrénale, jonction neuromusculaire → contraction du muscle strié. Muscariniques : RCPG ; organes du parasympathique → bradycardie, myosis, digestion (sécrétions, motilité), bronchoconstriction. Synthèse : acétyl-CoA + choline (choline acétyltransférase) ; dégradation : acétylcholinestérase.","mc":"Nicotiniques: récepteurs canaux · ganglions · médullosurrénale · jonction neuromusculaire | Muscariniques: RCPG · parasympathique · bradycardie · myosis · bronchoconstriction | ACh: choline acétyltransférase · acétylcholinestérase","st":[{"n":"Acétylcholine","img":"mol/ach.svg"}]},{"id":"p:ch2g:4","lab":"Question du prof · 24/10/2025","q":"Si l'on injecte de l'acétylcholine, quels sont les effets au niveau cardiaque et oculaire ?","r":"Effets parasympathiques muscariniques, opposés à la noradrénaline : baisse de la fréquence cardiaque, myosis (contraction de la pupille).","mc":"Effets muscariniques: bradycardie · myosis · opposés à la noradrénaline"}]},{"id":"ch4","t":"Le sang","court":"Le sang","sym":"drop","niveaux":[{"t":"Le plasma : électrolytes, déchets azotés, protéines","s":"Plasma vs sérum, hématocrite, Acide urique et goutte, Créatine et créatinine, Protéines plasmatiques","type":"n","m":[],"q":["ch4-q21","ch4-q22","ch4-q23","ch4-q24","ch4-q25","ch4-q26"],"c":["ch4-s0c0","ch4-s0c1","ch4-s0c2","ch4-s0c3","ch4-s0c3w"]},{"t":"Les érythrocytes : érythropoïèse, vitamine B12, acide folique","s":"Le globule rouge, Vitamine B12 (cobalamine), Acide folique et grossesse","type":"n","m":[],"q":["ch4-q00","ch4-q01","ch4-q02","ch4-q03","ch4-q35"],"c":["ch4-s1c0","ch4-s1c1","ch4-s1c1w","ch4-s1c2"]},{"t":"Le métabolisme particulier du GR : 2,3-BPG et glutathion","s":"Le 2,3-BPG, Le glutathion contre le stress oxydatif, Déficit en G6PD (favisme), Dégradation des GR","type":"n","m":["gsh"],"q":["ch4-q05","ch4-q06","ch4-q07","ch4-q08"],"c":["ch4-s2c0","ch4-s2c0w","ch4-s2c1","ch4-s2c2","ch4-s2c3"]},{"t":"L'hémoglobine, le fer et le transport des gaz","s":"Structure et biosynthèse, Le fer, Transport de l'O₂ : effet coopératif, Transport du CO₂ et pouvoir tampon","type":"n","m":["heme"],"q":["ch4-q04","ch4-q09","ch4-q10","ch4-q11","ch4-q12","ch4-q13"],"c":["ch4-s3c0","ch4-s3c1","ch4-s3c1w","ch4-s3c2","ch4-s3c3","ch4-s3c4"]},{"t":"Dégradation de l'hémoglobine et ictères","s":"Les trois types d'ictère","type":"n","m":[],"q":["ch4-q14","ch4-q15","ch4-q31","ch4-q32","ch4-q33","ch4-q34"],"c":["ch4-s4c0","ch4-s4c0w"]},{"t":"Les groupes sanguins ABO et Rhésus","s":"ABO, Rhésus et grossesse","type":"n","m":[],"q":["ch4-q16","ch4-q27","ch4-q28","ch4-q29","ch4-q30"],"c":["ch4-s5c0","ch4-s5c1"]},{"t":"Plaquettes et hémostase","s":"Les plaquettes, Hémostase primaire en 4 étapes, La coagulation (hémostase secondaire), Vitamine K","type":"n","m":[],"q":["ch4-q17","ch4-q18","ch4-q19","ch4-q20","ch4-q36","ch4-q37"],"c":["ch4-s6c0","ch4-s6c1","ch4-s6c1w","ch4-s6c2","ch4-s6c3","ch4-s6c3w","ch4-s6c4","ch4-s6c5"]},{"t":"Questions d'examen","s":"Les questions du prof, avec réponse et mots-clés","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre","type":"boss"}],"cartes":[{"id":"p:ch4:0","lab":"Question reformulée","q":"Expliquez le rôle du glutathion dans le globule rouge, sa régénération, et ce qui se passe en cas de déficit en G6PD.","r":"Glutathion = γ-Glu-Cys-Gly, thiol réducteur. O₂⁻ → (SOD) H₂O₂ → (glutathion peroxydase, 2 GSH → GSSG) H₂O. Régénération : glutathion réductase + NADPH de la voie des pentoses (G6PD = 1re enzyme). Déficit en G6PD : pas de NADPH → GSH non régénéré → oxydation de l'Hb (corps de Heinz) et de la membrane → hémolyse aiguë après fèves, infections, médicaments oxydants (aspirine, sulfamides).","mc":"Glutathion: γ-Glu-Cys-Gly · thiol réducteur | Détox: SOD · H₂O₂ · glutathion peroxydase · 2 GSH → GSSG | Régénération: glutathion réductase · NADPH · voie des pentoses · G6PD | Déficit: hémolyse · corps de Heinz · fèves · aspirine · sulfamides","st":[{"n":"Glutathion (GSH)","img":"mol/gsh.svg"}]},{"id":"p:ch4:1","lab":"Question reformulée","q":"Quel est le rôle du 2,3-bisphosphoglycérate et pourquoi le GR « sacrifie »-t-il un ATP pour le produire ?","r":"Formé à partir du 1,3-BPG (shunt de Rapoport-Luebering) au lieu de produire de l'ATP → 1 seul ATP net sur cette voie. Il se fixe sur la désoxyhémoglobine et diminue son affinité pour l'O₂ → libération de l'O₂ dans les tissus (déplacement de la courbe à droite). Augmente en altitude et en anémie.","mc":"2,3-BPG: shunt de Rapoport-Luebering · 1 seul ATP | Rôle: désoxyhémoglobine · affinité pour l'O₂ ↓ · libération dans les tissus · courbe à droite | Augmente: altitude · anémie"},{"id":"p:ch4:2","lab":"Question du prof · 3/11/2025","q":"Classez les anémies selon le VGM et la régénération ; donnez les causes biochimiques principales.","r":"Microcytaires (VGM < 80) : carence en fer (apport, absorption, pertes : règles, saignement digestif ; ferritine basse), thalassémies. Macrocytaires (VGM > 100) : carence en B12 (Biermer : pas de facteur intrinsèque ; régime végétalien) ou folates → anémie mégaloblastique. Régénératives (réticulocytes ↑) : hémorragie, hémolyse (G6PD, drépanocytose, incompatibilité Rh). Non régénératives : atteinte de la moelle (myélogramme), insuffisance rénale (EPO ↓).","mc":"Microcytaires: VGM < 80 · fer · ferritine basse · thalassémies | Macrocytaires: VGM > 100 · B12 (Biermer) · folates · mégaloblastique | Régénératives: réticulocytes ↑ · hémorragie · hémolyse | Non régénératives: moelle · EPO ↓"},{"id":"p:ch4:3","lab":"Question reformulée","q":"Dessinez l'hème et décrivez le métabolisme du fer (absorption, transport, stockage, régulation).","r":"Hème : porphyrine (4 pyrroles + ponts méthène) + Fe²⁺. Fer : 10-20 mg ingérés, ~1 mg absorbé (duodénum ; Fe³⁺ → Fe²⁺ par la vitamine C ; fer héminique mieux absorbé) ; sortie de l'entérocyte par la ferroportine ; transport par la transferrine ; stockage : ferritine (marqueur des réserves), hémosidérine ; régulation par l'hepcidine hépatique (bloque la ferroportine). Pas d'excrétion active (pertes cellulaires). Carence → anémie microcytaire ; excès → hémochromatose.","mc":"Hème: porphyrine · 4 pyrroles · Fe²⁺ | Absorption: 1 mg/j · duodénum · Fe³⁺ → Fe²⁺ (vitamine C) · ferroportine | Transport: transferrine | Stockage: ferritine · hémosidérine | Régulation: hepcidine | Pathologies: anémie microcytaire · hémochromatose","st":[{"n":"Hème","img":"img/ch4-2-dia008.webp"}]},{"id":"p:ch4:4","lab":"Question reformulée","q":"Décrivez la dégradation de l'hémoglobine et expliquez les trois types d'ictère.","r":"Rate : hème → biliverdine (+ Fe + CO) → bilirubine non conjuguée → sang lié à l'albumine → foie : glucuroconjugaison → bilirubine conjuguée → bile → intestin : urobilinogène → stercobiline (selles), urobiline (urines). Ictère pré-hépatique (hémolyse : non conjuguée ↑), hépatique (mixte), post-hépatique (obstruction : conjuguée ↑, selles décolorées, urines foncées).","mc":"Dégradation: rate · biliverdine (+ Fe + CO) · bilirubine non conjuguée · albumine · glucuroconjugaison (foie) · bile · stercobiline · urobiline | Ictères: pré-hépatique (non conjuguée) · hépatique (mixte) · post-hépatique (conjuguée)"},{"id":"p:ch4:5","lab":"Question reformulée","q":"Sur la base d'un schéma, décrivez l'hémostase primaire, la coagulation et la fibrinolyse, et situez les cibles des antithrombotiques.","r":"Primaire : vasoconstriction → adhésion (vWF, GPIb, collagène) → activation (ADP, TXA2, thrombine) → agrégation (fibrinogène, GPIIb/IIIa). Secondaire : FT-VIIa → Xa-Va → thrombine → fibrine (XIIIa) ; vitamine K pour II, VII, IX, X. Régulation : antithrombine, protéines C et S. Fibrinolyse : t-PA → plasmine → D-dimères. Cibles : aspirine (COX-1/TXA2), clopidogrel (récepteur de l'ADP), anti-GPIIb/IIIa, héparine (antithrombine), AVK (vitamine K), thrombolytiques (t-PA).","mc":"Primaire: vasoconstriction · adhésion (vWF, GPIb) · activation (ADP, TXA2) · agrégation (fibrinogène, GPIIb/IIIa) | Coagulation: FT-VIIa · Xa-Va · thrombine · fibrine · vitamine K | Fibrinolyse: t-PA · plasmine · D-dimères | Cibles: aspirine · clopidogrel · héparine · AVK · thrombolytiques"},{"id":"p:ch4:6","lab":"Question reformulée","q":"Expliquez la base biochimique des groupes ABO et le risque d'une mère Rh−.","r":"Ose terminal de la chaîne oligosaccharidique : H (O) = fucose ; A = + N-acétylgalactosamine ; B = + galactose. Anticorps naturels IgM contre l'antigène absent. Rh : une mère Rh− immunisée par un 1er enfant Rh+ fabrique des anti-D (IgG) qui traversent le placenta et détruisent les GR d'un 2e enfant Rh+ → prévention par immunoglobulines anti-D.","mc":"ABO: ose terminal · H = fucose · A = N-acétylgalactosamine · B = galactose · IgM naturelles | Rhésus: mère Rh− · 1er enfant Rh+ · anti-D (IgG) · placenta · immunoglobulines anti-D"}]},{"id":"ch5","t":"Le foie","court":"Le foie","sym":"foie","niveaux":[{"t":"Anatomie et organisation du foie","s":"Double irrigation, Le lobule, Les cellules","type":"n","m":[],"q":["ch5-q00","ch5-q01"],"c":["ch5-s0c0","ch5-s0c1","ch5-s0c1w","ch5-s0c2"]},{"t":"Le foie et le métabolisme","s":"Pour lui-même, Glucides : garder la glycémie, Lipides, Acides aminés et ammoniac","type":"n","m":[],"q":["ch5-q02","ch5-q03"],"c":["ch5-s1c0","ch5-s1c1","ch5-s1c1w","ch5-s1c2","ch5-s1c3"]},{"t":"Usine de production, stockage et défense","s":"Ce que le foie fabrique, Stockage et immunité","type":"n","m":[],"q":["ch5-q04","ch5-q05"],"c":["ch5-s2c0","ch5-s2c0w","ch5-s2c1"]},{"t":"Le métabolisme de l'alcool","s":"Absorption, Cinétique d'ordre 0, Effets à court terme et lendemain","type":"n","m":["etoh","ach2","acoh"],"q":["ch5-q06","ch5-q07","ch5-q08"],"c":["ch5-s3c0","ch5-s3c1","ch5-s3c1w","ch5-s3c2"]},{"t":"Alcool à long terme : stéatose, cirrhose, carences","s":"Stéatose → fibrose → cirrhose, Autres organes et carences","type":"n","m":[],"q":["ch5-q13","ch5-q14"],"c":["ch5-s4c0","ch5-s4c0w","ch5-s4c1","ch5-s4c1w"]},{"t":"Antabuse, éthylène glycol et méthanol","s":"Effet antabuse, Éthylène glycol (antigel), Méthanol (alcool frelaté), Le traitement : un inhibiteur compétitif","type":"n","m":["meoh","hcho","hcooh","eg","ox"],"q":["ch5-q09","ch5-q10","ch5-q11","ch5-q12"],"c":["ch5-s5c0","ch5-s5c0w","ch5-s5c1","ch5-s5c2","ch5-s5c3","ch5-s5c3w"]},{"t":"Biotransformation et excrétion biliaire","s":"Phase I : fonctionnalisation, Phase II : conjugaison, Excrétion et premier passage","type":"n","m":[],"q":["ch5-q15"],"c":["ch5-s6c0","ch5-s6c1","ch5-s6c1w","ch5-s6c2"]},{"t":"Épreuves fonctionnelles hépatiques","s":"Biosynthèse, Cholestase vs cytolyse","type":"n","m":[],"q":["ch5-q16","ch5-q17"],"c":["ch5-s7c0","ch5-s7c1"]},{"t":"Questions d'examen","s":"Les questions du prof, avec réponse et mots-clés","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre","type":"boss"}],"cartes":[{"id":"p:ch5:0","lab":"Question du prof · Dia 137","q":"Comment le sang et la bile circulent-ils dans le lobule hépatique ?","r":"À contre-courant : le sang de l'espace porte (veine porte + artère hépatique) vers la veine centrolobulaire par les sinusoïdes ; la bile des canalicules vers le canal biliaire de l'espace porte.","mc":"Contre-courant: sang espace porte → veine centrolobulaire · sinusoïdes · bile → canal biliaire"},{"id":"p:ch5:1","lab":"Question du prof · Dia 137","q":"Pourquoi le foie peut-il libérer du glucose dans le sang ?","r":"Grâce à la glucose-6-phosphatase (absente du muscle) : le glucose-6-P issu de la glycogénolyse ou de la néoglucogenèse est déphosphorylé et sort.","mc":"Clé: glucose-6-phosphatase · absente du muscle · glycogénolyse · néoglucogenèse"},{"id":"p:ch5:2","lab":"Question du prof · Dia 137","q":"Par quelles voies l'éthanol est-il métabolisé dans le foie ?","r":"ADH (NAD⁺) → acétaldéhyde → ALDH → acide acétique → acétyl-CoA ; voie MEOS (P450, NADPH, O₂), inductible chez le buveur régulier (~10 % en plus). Une ADH gastrique existe aussi.","mc":"Voie principale: ADH · NAD⁺ · acétaldéhyde · ALDH · acide acétique · acétyl-CoA | Voie secondaire: MEOS · P450 · inductible | Autre: ADH gastrique","st":[{"n":"Éthanol","img":"mol/etoh.svg"},{"n":"Acétaldéhyde (éthanal)","img":"mol/ach2.svg"},{"n":"Acide acétique","img":"mol/acoh.svg"}]},{"id":"p:ch5:3","lab":"Question du prof · Dia 137","q":"Que deviennent les acides gras dans le foie à jeun ?","r":"β-oxydation : énergie pour le foie, NADH pour la néoglucogenèse, et excès d'acétyl-CoA transformé en corps cétoniques pour les autres tissus.","mc":"À jeun: β-oxydation · NADH (néoglucogenèse) · acétyl-CoA en excès · corps cétoniques"},{"id":"p:ch5:4","lab":"Question du prof · Dia 137","q":"Comment le foie élimine-t-il l'ammoniac issu des acides aminés ?","r":"Il le transforme en urée (cycle de l'urée), éliminée par le rein.","mc":"Ammoniac: cycle de l'urée · foie · urée éliminée par le rein"},{"id":"p:ch5:5","lab":"Question du prof · Dia 137","q":"Que signifie « l'élimination de l'alcool suit une cinétique d'ordre 0 » ?","r":"Vitesse constante (≈ 0,15 g/L/h), indépendante de la concentration, car l'ADH est saturée.","mc":"Ordre 0: vitesse constante · 0,15 g/L/h · ADH saturée · indépendante de la concentration"},{"id":"p:ch5:6","lab":"Question du prof · Dia 137","q":"Comment passe-t-on de la stéatose à la cirrhose, et quelles lésions sont réversibles ?","r":"Excès d'acétyl-CoA et NADH → synthèse d'AG → stéatose (réversible) → hépatite alcoolique → fibrose (collagène des cellules d'Ito) → cirrhose (irréversible).","mc":"Étapes: stéatose (réversible) · hépatite alcoolique · fibrose (cellules d'Ito) · cirrhose (irréversible) | Cause: acétyl-CoA et NADH en excès"},{"id":"p:ch5:7","lab":"Question du prof · Dia 137","q":"Qu'est-ce qu'un médicament avec effet antabuse ?","r":"Un médicament qui inhibe l'aldéhyde déshydrogénase (disulfirame/DEDTC) : avec l'alcool, l'acétaldéhyde s'accumule → flush, nausées, vomissements, tachycardie, hypotension.","mc":"Antabuse: disulfirame · DEDTC · ALDH bloquée · acétaldéhyde ↑ · flush · nausées · tachycardie · hypotension"},{"id":"p:ch5:8","lab":"Question du prof · Dia 137","q":"Quelles protéines plasmatiques ne sont pas synthétisées par le foie ?","r":"Les γ-globulines (immunoglobulines), produites par les plasmocytes.","mc":"Exception: γ-globulines · plasmocytes"},{"id":"p:ch5:9","lab":"Question du prof · Dia 137","q":"Quelles protéines augmentent ou diminuent lors de la phase aiguë de l'inflammation ?","r":"↑ CRP, fibrinogène, haptoglobine, orosomucoïde (sous IL-1, IL-6, TNF-α) ; ↓ albumine et transferrine.","mc":"Positives: CRP · fibrinogène · haptoglobine · orosomucoïde | Négatives: albumine · transferrine | Cytokines: IL-1 · IL-6 · TNF-α"},{"id":"p:ch5:10","lab":"Question du prof · Dia 137","q":"Pourquoi une cirrhose peut-elle provoquer des œdèmes et une ascite ?","r":"Albumine ↓ → pression oncotique ↓ ; hypertension portale → liquide dans le péritoine.","mc":"Cirrhose: albumine ↓ · pression oncotique ↓ · hypertension portale · ascite"},{"id":"p:ch5:11","lab":"Question du prof · Dia 137","q":"Que faire en cas d'ingestion de méthanol ou d'éthylène glycol ?","r":"Hôpital en urgence : fomépizole (ou éthanol) pour bloquer l'ADH par compétition, éviter la formation d'acide formique ou oxalique ; corriger l'acidose ; dialyse si nécessaire.","mc":"Urgence: fomépizole · éthanol · ADH bloquée · acide formique · acide oxalique · acidose · dialyse","st":[{"n":"Méthanol","img":"mol/meoh.svg"},{"n":"Formol (formaldéhyde)","img":"mol/hcho.svg"},{"n":"Acide formique","img":"mol/hcooh.svg"},{"n":"Éthylène glycol","img":"mol/eg.svg"},{"n":"Acide oxalique","img":"mol/ox.svg"}]},{"id":"p:ch5:12","lab":"Question du prof · Dia 137","q":"Pourquoi donner de la vitamine B1 à un patient alcoolique ?","r":"Carence fréquente (apport, absorption, stockage) ; prévenir l'encéphalopathie de Wernicke, surtout avant d'apporter du glucose.","mc":"Vitamine B1: carence (apport, absorption, stockage) · encéphalopathie de Wernicke · avant le glucose"},{"id":"p:ch5:13","lab":"Question du prof · Dia 137","q":"Quelle est la différence entre les réactions de phase I et de phase II ?","r":"Phase I : fonctionnalisation (oxydation P450, réduction, hydrolyse). Phase II : conjugaison (glucuronide, sulfate, glycine, méthyle, acétyle, glutathion) → plus hydrosoluble.","mc":"Phase I: fonctionnalisation · P450 · oxydation · réduction · hydrolyse | Phase II: conjugaison · glucuronide · sulfate · glutathion · hydrosoluble"},{"id":"p:ch5:14","lab":"Question du prof · Dia 137","q":"Qu'est-ce que l'effet de premier passage hépatique ?","r":"Après une prise orale, le médicament passe par la veine porte et le foie avant la circulation générale : une partie est déjà métabolisée, ce qui diminue la biodisponibilité.","mc":"Premier passage: prise orale · veine porte · foie · métabolisme avant la circulation · biodisponibilité ↓"},{"id":"p:ch5:15","lab":"Question du prof · Dia 137 · facultatif","q":"Quels marqueurs s'élèvent en cas de cholestase, et lesquels en cas de cytolyse ?","r":"Cholestase : bilirubine conjuguée, phosphatases alcalines, γ-GT. Cytolyse : ALAT, ASAT (GLDH si lésions sévères, LDH).","mc":"Cholestase: bilirubine conjuguée · phosphatases alcalines · γ-GT | Cytolyse: ALAT · ASAT · GLDH · LDH"},{"id":"p:ch5:16","lab":"Question du prof · Dia 137","q":"Qu'est-ce qui distingue la maladie de Gilbert de la maladie de Crigler-Najjar (types I et II) ?","r":"Même enzyme (UDP-glucuronyltransférase) : Gilbert = activité légèrement réduite, ictère léger bénin ; Crigler-Najjar I = enzyme absente, ictère grave dès la naissance (photothérapie quotidienne, greffe) ; type II = activité très réduite, moins sévère.","mc":"Enzyme: UDP-glucuronyltransférase | Gilbert: activité légèrement ↓ · bénin | Crigler-Najjar I: enzyme absente · ictère grave · photothérapie | Type II: activité très ↓"},{"id":"p:ch5:17","lab":"Question du prof · Dia 137 · facultatif","q":"Pourquoi l'albumine est-elle un marqueur tardif de l'insuffisance hépatique ?","r":"Sa demi-vie est longue (15-19 jours) : elle baisse seulement quand la maladie est chronique et avancée (les facteurs de coagulation, eux, baissent vite).","mc":"Albumine: demi-vie 15-19 j · baisse tardive · maladie chronique | Facteurs de coagulation: baissent vite"}]},{"id":"semdiab","t":"Le diabète","court":"Séminaire diabète","sym":"sucre","niveaux":[{"t":"Définition et classification","s":"Définition, Les types, Épidémiologie","type":"n","m":[],"q":["semdiab-q00"],"c":["semdiab-s0c0","semdiab-s0c1","semdiab-s0c2"]},{"t":"Symptômes et diagnostic","s":"Les « 4 P » du type 1, L'HbA1c, Glucosurie, cétonurie, peptide C, Dépistage du type 1","type":"n","m":[],"q":["semdiab-q01","semdiab-q02","semdiab-q03","semdiab-q04","semdiab-q05"],"c":["semdiab-s1c0","semdiab-s1c1","semdiab-s1c1w","semdiab-s1c2","semdiab-s1c3"]},{"t":"Physiopathologie : type 1 et type 2","s":"Type 1, Type 2 : d'abord l'insulinorésistance","type":"n","m":[],"q":["semdiab-q06","semdiab-q07","semdiab-q08"],"c":["semdiab-s2c0","semdiab-s2c1","semdiab-s2c1w"]},{"t":"Complications aiguës","s":"Acidocétose (type 1), État hyperglycémique hyperosmolaire (type 2), Hypoglycémie = urgence","type":"n","m":[],"q":["semdiab-q09","semdiab-q10","semdiab-q12"],"c":["semdiab-s3c0","semdiab-s3c1","semdiab-s3c2","semdiab-s3c2w"]},{"t":"Complications chroniques","s":"Microangiopathie, Macroangiopathie, Neuropathie, infections, pied diabétique","type":"n","m":[],"q":["semdiab-q11"],"c":["semdiab-s4c0","semdiab-s4c1","semdiab-s4c2","semdiab-s5c0"]},{"t":"Questions d'examen","s":"Les questions du prof, avec réponse et mots-clés","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre","type":"boss"}],"cartes":[{"id":"p:semdiab:0","lab":"Question reformulée","q":"Comparez la physiopathologie du diabète de type 1 et de type 2.","r":"Type 1 : destruction auto-immune des cellules β (anti-GAD65, IA-2, ZnT8, insuline), carence absolue, symptômes quand il reste 10-20 % des β ; jeune, mince ; risque d'acidocétose ; insuline obligatoire. Type 2 : insulinorésistance (muscle : DAG/céramides → IRS-PI3K-Akt ↓ → GLUT4 ↓ ; foie ; tissu adipeux), hyperinsulinisme compensateur puis épuisement des β ; obésité androïde, sédentarité ; souvent asymptomatique ; risque d'état hyperosmolaire.","mc":"Type 1: auto-immun · cellules β détruites · anti-GAD65 · carence absolue · acidocétose · insuline | Type 2: insulinorésistance · DAG/céramides · GLUT4 ↓ · hyperinsulinisme · épuisement des β · obésité androïde · état hyperosmolaire"},{"id":"p:semdiab:1","lab":"Question reformulée","q":"Expliquez le principe biochimique de l'HbA1c et son intérêt.","r":"Glycation non enzymatique : glucose + NH₂ de l'Hb → base de Schiff → réarrangement d'Amadori → cétoamine stable. Proportionnelle à la glycémie moyenne pendant la vie du GR (120 j) → reflet des 2-3 derniers mois ; diagnostic (≥ 6,5 %) et suivi ; corrélée au risque de complications.","mc":"Glycation: non enzymatique · base de Schiff · Amadori · cétoamine | Intérêt: GR 120 j · 2-3 derniers mois · diagnostic ≥ 6,5 % · suivi · complications"},{"id":"p:semdiab:2","lab":"Question reformulée","q":"Expliquez la formation de l'acidocétose diabétique.","r":"Carence en insuline + glucagon, adrénaline, cortisol ↑ → lipolyse → AG libres → β-oxydation hépatique → acétyl-CoA en excès → cétogenèse (acétoacétate, β-hydroxybutyrate) → acidose ; hyperglycémie → glucosurie → diurèse osmotique, déshydratation ; vomissements, respiration de Kussmaul, coma. Traitement : insuline + réhydratation (surveiller le potassium).","mc":"Cause: carence en insuline · glucagon, adrénaline, cortisol ↑ | Voie: lipolyse · β-oxydation · acétyl-CoA · cétogenèse · acidose | Signes: déshydratation · vomissements · Kussmaul · coma | Traitement: insuline · réhydratation · potassium"},{"id":"p:semdiab:3","lab":"Question reformulée","q":"Quels sont les critères biologiques du diagnostic du diabète et du prédiabète ?","r":"Diabète : à jeun ≥ 1,26 g/L ; HbA1c ≥ 6,5 % ; HGPO 2 h ≥ 2,00 g/L ; aléatoire ≥ 2,00 g/L + symptômes (confirmer par 2 résultats). Prédiabète : à jeun 1,00-1,25 ; HGPO 1,40-1,99 ; HbA1c 5,7-6,4 %.","mc":"Diabète: à jeun ≥ 1,26 g/L · HbA1c ≥ 6,5 % · HGPO ≥ 2,00 g/L · aléatoire ≥ 2,00 g/L + symptômes | Prédiabète: 1,00-1,25 g/L · HGPO 1,40-1,99 · HbA1c 5,7-6,4 %"},{"id":"p:semdiab:4","lab":"Question reformulée","q":"Décrivez les complications chroniques du diabète.","r":"Microangiopathie (rétinopathie, néphropathie), macroangiopathie (athérosclérose : infarctus, AVC, artérite), neuropathie (poly-, mono-, végétative), infections, pied diabétique. Prévention : équilibre glycémique (HbA1c), contrôle de la tension, des lipides, arrêt du tabac.","mc":"Micro: rétinopathie · néphropathie | Macro: athérosclérose · infarctus · AVC · artérite | Autres: neuropathie · infections · pied diabétique | Prévention: HbA1c · tension · lipides · tabac"}]},{"id":"semhem","t":"Les maladies hémorragiques","court":"Séminaire hémorragies","sym":"shield","niveaux":[{"t":"Hémostase primaire : les thrombocytopénies","s":"Thrombocytopénie : définition, Thrombocytopénie médicamenteuse immuno-allergique, Thrombocytopénie induite par l'héparine (TIH), PTI : purpura thrombocytopénique immunologique","type":"n","m":[],"q":["semhem-q00","semhem-q01","semhem-q02","semhem-q03","semhem-q04","semhem-q05","semhem-q06","semhem-q07","semhem-q11","semhem-q12"],"c":["semhem-s0c0","semhem-s1c0","semhem-s1c1","semhem-s1c2","semhem-s1c2w","semhem-s1c3","semhem-s1c4"]},{"t":"Thrombopathies et maladie de von Willebrand","s":"Thrombopathies, Maladie de von Willebrand, Autres traitements","type":"n","m":[],"q":["semhem-q08","semhem-q09"],"c":["semhem-s2c0","semhem-s2c1","semhem-s2c1w","semhem-s2c2"]},{"t":"Hémostase secondaire : vitamine K et CIVD","s":"Hypovitaminose K, CIVD : coagulation intravasculaire disséminée","type":"n","m":[],"q":["semhem-q10"],"c":["semhem-s3c0","semhem-s3c0w","semhem-s3c1"]},{"t":"Les hémophilies A et B","s":"Mécanisme, Diagnostic en 3 étapes, Traitement et complications, Autres déficits","type":"n","m":[],"q":["semhem-q13","semhem-q14"],"c":["semhem-s4c0","semhem-s4c1","semhem-s4c1w","semhem-s4c2","semhem-s4c3","semhem-s5c0"]},{"t":"Questions d'examen","s":"Les questions du prof, avec réponse et mots-clés","type":"prof"},{"t":"Boss : examen blanc","s":"Tout le chapitre","type":"boss"}],"cartes":[{"id":"p:semhem:0","lab":"Question reformulée","q":"Expliquez la physiopathologie de la thrombocytopénie induite par l'héparine et sa prise en charge.","r":"PF4 (granules α, chargé +) + héparine (chargée −) → complexe immunogène → IgG anti-PF4/héparine → activation des plaquettes (FcγRIIa), des monocytes et de l'endothélium → consommation plaquettaire et thromboses. Plus fréquente avec l'HNF (chaînes longues). Arrêter toute héparine et instaurer immédiatement un anticoagulant non héparinique.","mc":"Mécanisme: PF4 + héparine · IgG anti-PF4/héparine · activation plaquettaire · thromboses | Risque: HNF > HBPM | Conduite: arrêt de l'héparine · anticoagulant non héparinique"},{"id":"p:semhem:1","lab":"Question reformulée","q":"Décrivez les rôles du facteur de von Willebrand et les types de la maladie.","r":"Adhésion (GPIb ↔ collagène), agrégation en microcirculation, transport et protection du FVIII. Type 1 : déficit quantitatif partiel ; type 2 : qualitatif (2A, 2B + thrombocytopénie, 2M, 2N : FVIII bas) ; type 3 : absence totale. Traitement : desmopressine, concentrés de vWF, acide tranexamique.","mc":"vWF: adhésion (GPIb, collagène) · agrégation · protège le FVIII | Types: 1 quantitatif partiel · 2 qualitatif (2A, 2B, 2M, 2N) · 3 absence totale | Traitement: desmopressine · concentrés de vWF · acide tranexamique"},{"id":"p:semhem:2","lab":"Question reformulée","q":"Comparez PTI et PTT.","r":"PTI : auto-anticorps anti-GPIIb/IIIa → destruction splénique des plaquettes → purpura ; diagnostic d'élimination ; corticoïdes, IgIV. PTT : déficit en ADAMTS13 → multimères géants de vWF → microthrombi → thrombocytopénie de consommation, anémie hémolytique mécanique (schizocytes), atteinte neurologique et rénale ; urgence : échanges plasmatiques.","mc":"PTI: auto-anticorps anti-GPIIb/IIIa · rate · purpura · corticoïdes · IgIV | PTT: ADAMTS13 · multimères de vWF · microthrombi · schizocytes · échanges plasmatiques"},{"id":"p:semhem:3","lab":"Question reformulée","q":"Comment diagnostique-t-on une hémophilie, et comment la traite-t-on ?","r":"TCA allongé isolé → corrigé par un plasma normal → dosage FVIII (A) ou FIX (B). Récessive liée à l'X. Traitement : concentrés de FVIII/FIX, desmopressine (A légère), emicizumab (anticorps bispécifique mimant le FVIIIa).","mc":"Diagnostic: TCA allongé isolé · correction par plasma normal · dosage FVIII/FIX · lié à l'X | Traitement: concentrés · desmopressine (A légère) · emicizumab"},{"id":"p:semhem:4","lab":"Question reformulée","q":"Quel bilan évoque une hypovitaminose K et quelles en sont les causes ?","r":"TP allongé (INR ↑), II, VII, IX, X ↓, facteur V et fibrinogène normaux, plaquettes normales. Causes : nouveau-né, malabsorption/obstruction biliaire, antibiotiques, AVK. Traitement : vitamine K.","mc":"Bilan: TP allongé · II, VII, IX, X ↓ · facteur V normal · plaquettes normales | Causes: nouveau-né · obstruction biliaire · antibiotiques · AVK | Traitement: vitamine K"},{"id":"p:semhem:5","lab":"Question reformulée","q":"Expliquez pourquoi la CIVD associe thromboses et hémorragies.","r":"Activation généralisée de la coagulation (sepsis, cancer, obstétrique, trauma) → microthrombi (ischémie, défaillance d'organes) qui consomment plaquettes et facteurs → plus rien pour arrêter les saignements ; fibrinolyse secondaire (D-dimères ↑↑). Traiter la cause.","mc":"CIVD: activation généralisée · microthrombi · consommation · plaquettes ↓ · facteurs ↓ · hémorragies · D-dimères ↑↑ | Causes: sepsis · cancer · obstétrique · trauma | Traiter la cause"}]}]};</script>

 var cartes=due.concat(neufs).filter(function(x){return x.kind==='carte'}), autres=due.concat(neufs).concat(reste).filter(function(x){return x.kind!=='carte'});
 var sel=autres.slice(0,nb-2).concat(cartes.slice(0,1));
