": "Acide iduronique-2-O-sulfate + glucosamine-N-sulfate-6-O-sulfate (trisulfatée)."}, {"id": "ch1-136", "t": "Définition", "q": "Mode d'action de l'héparine ?", "a": "Complexe héparine–antithrombine–thrombine → inhibition de la coagulation ; un pentasaccharide (glucosamine 3-O-sulfatée) active l'antithrombine (anti-Xa)."}, {"id": "ch1-137", "t": "Toxicité", "q": "Effets indésirables et antidote de l'héparine ?", "a": "Hémorragie (antidote : protamine) et thrombopénie."}, {"id": "ch1-138", "t": "Comparaison", "q": "Héparines non fractionnées vs HBPM ?", "a": "HBPM : hydrolyse partielle, PM < 8000, durée d'action plus longue, voie SC, plus faciles à utiliser."}, {"id": "ch1-139", "t": "Méthode", "q": "Quel contaminant recherche la Ph. Eur. dans l'héparine et comment ?", "a": "La chondroïtine persulfatée (fraude 2008), par RMN du proton et électrophorèse capillaire."}, {"id": "ch1-140", "t": "Origine", "q": "Sources d'extraction de l'héparine ?", "a": "Poumons de bœuf ou muqueuse intestinale de bœuf, porc ou mouton (solutions alcalines)."}, {"id": "ch2-001", "t": "Définition", "q": "Définition Ph. Eur. des huiles grasses végétales (Olea herbaria) ?", "a": "Principalement des triglycérides d'acides gras (forme liquide, mais la définition inclut les formes solides), avec de petites quantités d'AG libres, glycérides partiels, cires et substances insaponifiables."}, {"id": "ch2-002", "t": "Définition", "q": "Citez 3 rôles des lipides pour les organismes vivants.", "a": "Réserve/énergie ; constituants des structures cellulaires (phospho- et glycolipides membranaires) ; éléments de revêtement (cires et cutine)."}, {"id": "ch2-003", "t": "Comparaison", "q": "Lipides vs huiles essentielles : quelle propriété physique les distingue ?", "a": "Les lipides sont non volatils ; les huiles essentielles sont volatiles."}, {"id": "ch2-004", "t": "Définition", "q": "Glycérides, cérides, stérides : quels esters ?", "a": "AG + glycérol → glycérides ; AG + alcool aliphatique de PM élevé → cérides (cires) ; AG + stérol → stérides."}, {"id": "ch2-005", "t": "Structure", "q": "Dessinez la formule générale d'un triglycéride.", "a": "Glycérol (CH2–CH–CH2) dont les 3 OH sont estérifiés : CH2-O-CO-R1 / CH-O-CO-R2 / CH2-O-CO-R3."}, {"id": "ch2-006", "t": "Définition", "q": "Qu'est-ce que le glycérol ?", "a": "Glycérine = propane-1,2,3-triol, polyalcool à 3 fonctions alcool ; partie hydrophile des glycérides."}, {"id": "ch2-007", "t": "Pourquoi ?", "q": "Pourquoi les AG naturels ont-ils un nombre pair de C ?", "a": "Ils sont synthétisés à partir d'acétate (unités en C2)."}, {"id": "ch2-008", "t": "Définition", "q": "Triglycérides homogènes ou hétérogènes dans les huiles ?", "a": "En général hétérogènes : R1, R2 et R3 sont différents."}, {"id": "ch2-009", "t": "Pourquoi ?", "q": "Pourquoi la plupart des corps gras fondent-ils progressivement ?", "a": "Ce sont des mélanges complexes de triglycérides, chacun ayant son propre point de fusion."}, {"id": "ch2-010", "t": "Usage", "q": "Particularité du beurre de cacao et usage ?", "a": "Constitué principalement d'un seul triglycéride (palmitique, stéarique, oléique) → PF net juste < T° corporelle → excipient pour suppositoires."}, {"id": "ch2-011", "t": "Méthode", "q": "Deux méthodes pour scinder la liaison ester d'un triglycéride ?", "a": "Hydrolyse enzymatique (lipase) → glycérol + AG insolubles ; saponification à chaud (KOH/NaOH) → glycérol + savons (sels d'AG), tous deux hydrosolubles."}, {"id": "ch2-012", "t": "Définition", "q": "Qu'est-ce qu'un savon ?", "a": "Un sel sodique ou potassique d'acide gras (R-COO⁻ Na⁺), amphiphile et tensioactif (moussant, mouillant, émulsionnant)."}, {"id": "ch2-013", "t": "Définition", "q": "Classez les AG selon la longueur de chaîne.", "a": "Longue chaîne 14–22 C (surtout 16 et 18) ; très longue chaîne > 22 C ; chaînes courtes dans les beurres."}, {"id": "ch2-014", "t": "Structure", "q": "Acide butyrique : nombre de C et particularité ?", "a": "C4:0, CH3-(CH2)2-COOH ; soluble dans l'eau."}, {"id": "ch2-015", "t": "Structure", "q": "Acide laurique : nombre de C et source principale ?", "a": "C12:0 ; beurre de coco (AG majoritaire)."}, {"id": "ch2-016", "t": "Structure", "q": "Acide palmitique : formule ?", "a": "CH3-(CH2)14-COOH (C16:0)."}, {"id": "ch2-017", "t": "Structure", "q": "Acide stéarique : nombre de C ?", "a": "C18:0, CH3-(CH2)16-COOH."}, {"id": "ch2-018", "t": "Comparaison", "q": "Acide stéarique vs oléique : différence et conséquence ?", "a": "Tous deux C18 ; stéarique saturé (graisses solides), oléique mono-insaturé cis (huiles liquides) : la double liaison abaisse le point de fusion."}, {"id": "ch2-019", "t": "Toxicité", "q": "Pourquoi les AG saturés ont-ils mauvaise réputation ?", "a": "En excès, ils réduisent les récepteurs LDL hépatiques → le foie capte moins de LDL → ↑ LDL-cholestérol sanguin → risque cardiovasculaire."}, {"id": "ch2-020", "t": "Définition", "q": "LDL vs HDL ?", "a": "LDL : transportent le cholestérol vers les cellules, dépôt athéromateux (« mauvais ») ; HDL : ramènent le cholestérol vers le foie (« bon »)."}, {"id": "ch2-021", "t": "Comparaison", "q": "Avantage culinaire des AG saturés ?", "a": "Moins susceptibles de rancir, supportent mieux la chaleur de cuisson."}, {"id": "ch2-022", "t": "Origine", "q": "Huile de coco : AG majoritaire et usages ?", "a": "Acide laurique ; solide < 25 °C ; contient de la vitamine D ; excipient pour suppositoires, margarine."}, {"id": "ch2-023", "t": "Origine", "q": "Huile de palme : origine, couleur, AG majoritaire ?", "a": "Fruits d'Elaeis ; rouge (caroténoïdes) + vitamine E ; acide palmitique majoritaire (+ oléique)."}, {"id": "ch2-024", "t": "Définition", "q": "Notation Δ vs ω ?", "a": "Δ : position de la 1re double liaison comptée depuis le carboxyle (C1) ; ω (n-) : depuis le CH3 terminal (notation du cours)."}, {"id": "ch2-025", "t": "Définition", "q": "Que signifie C20:5 ?", "a": "Acide gras à 20 carbones et 5 doubles liaisons."}, {"id": "ch2-026", "t": "Définition", "q": "Configuration des doubles liaisons des AG naturels ?", "a": "Cis (Z) : les deux chaînes du même côté ; les trans sont des produits de transformation non naturels."}, {"id": "ch2-027", "t": "Définition", "q": "AG mono-insaturé vs polyinsaturé ?", "a": "Mono : 1 seule double liaison (ω9) ; poly (AGPI/PUFA) : ≥ 2 doubles liaisons (ω3, ω6), non conjuguées."}, {"id": "ch2-028", "t": "Structure", "q": "Acide oléique : notation et position de la double liaison ?", "a": "C18:1 ω9, double liaison cis en 9 (Δ9)."}, {"id": "ch2-029", "t": "Usage", "q": "Propriétés de l'acide oléique pour l'organisme ?", "a": "Principal mono-insaturé, synthétisable ou alimentaire ; constituant membranaire ; effet bénéfique cardiovasculaire (↓ LDL)."}, {"id": "ch2-030", "t": "Usage", "q": "Pourquoi les huiles riches en oléique peuvent-elles servir en cuisson ?", "a": "Les triglycérides d'acide oléique supportent la chaleur (cuisson à feu moyen)."}, {"id": "ch2-031", "t": "Origine", "q": "Huile d'olive : partie, obtention, AG majoritaire, usages ?", "a": "Fruits d'Olea europaea, pression à froid ; acide oléique ; alimentaire, cholagogue et légèrement laxative, solvant de médicaments, raffinée → injectables."}, {"id": "ch2-032", "t": "Origine", "q": "Huile d'amande douce : origine et usage ?", "a": "Graines de Prunus dulcis (pression à froid) ; oléique majoritaire ; non alimentaire, cosméto/dermato (adoucissant, émollient)."}, {"id": "ch2-033", "t": "Origine", "q": "Huile de colza : AG et intérêt ?", "a": "Brassica napus, graines ; oléique majoritaire + LA + ALA ; huile alimentaire bien équilibrée."}, {"id": "ch2-034", "t": "Structure", "q": "Acide ricinoléique : structure ?", "a": "Acide 12-hydroxy-oléique : C18:1 ω9 cis Δ9 avec OH en C12."}, {"id": "ch2-035", "t": "Origine", "q": "Dans quelle huile l'acide ricinoléique est-il l'acide gras majoritaire ?", "a": "L'huile de ricin (Ricinus communis, graines)."}, {"id": "ch2-036", "t": "Méthode", "q": "Quel indice est important pour l'acide ricinoléique / l'huile de ricin ?", "a": "L'indice d'hydroxyle (OH libre en C12)."}, {"id": "ch2-037", "t": "Usage", "q": "Quel antifongique prépare-t-on à partir de l'acide ricinoléique ?", "a": "L'acide undécylénique (C11), utilisé contre les mycoses."}, {"id": "ch2-038", "t": "Toxicité", "q": "Huile de ricin comme laxatif : problème ?", "a": "Purgatif : altération de la muqueuse intestinale, pertes importantes d'eau et d'électrolytes → usage peu fréquent, à proscrire en chronique."}, {"id": "ch2-039", "t": "Usage", "q": "Huile de ricin polyoxyéthylénée : usage et précaution ?", "a": "Véhicule pour injectables en pharmacotechnie ; attention aux réactions allergiques."}, {"id": "ch2-040", "t": "Toxicité", "q": "Ricine : nature et mécanisme ?", "a": "Glycoprotéine (lectine) très toxique de la graine de ricin ; perturbe les ribosomes (synthèse protéique) ; injection/inhalation bien plus toxiques que l'ingestion."}, {"id": "ch2-041", "t": "Toxicité", "q": "L'huile de ricin purifiée contient-elle de la ricine ?", "a": "Non : la ricine est hydrosoluble et reste dans le tourteau."}, {"id": "ch2-042", "t": "Structure", "q": "Acide érucique : structure et sources ?", "a": "Acide 13-docosénoïque, C22:1 ω9 ; graines de colza (anciennes variétés) et de moutarde."}, {"id": "ch2-043", "t": "Toxicité", "q": "Pourquoi a-t-on sélectionné des colzas sans acide érucique ?", "a": "Suspicion de toxicité myocardique (expérimentation chez la souris)."}, {"id": "ch2-044", "t": "Classe", "q": "Trois principaux ω6 ?", "a": "Acide linoléique (LA, C18:2), γ-linolénique (GLA, C18:3), arachidonique (AA, C20:4)."}, {"id": "ch2-045", "t": "Usage", "q": "Rôles des ω6 ?", "a": "Élaboration d'AG hautement insaturés et d'eicosanoïdes séries 1 et 2 : système nerveux, cardiovasculaire, immunité, cicatrisation, réactions allergiques et inflammatoires."}, {"id": "ch2-046", "t": "Structure", "q": "Acide linoléique : notation et doubles liaisons ?", "a": "C18:2 ω6, doubles liaisons cis en 9 et 12 (1re en 6 depuis le CH3)."}, {"id": "ch2-047", "t": "Définition", "q": "Pourquoi le LA est-il dit « essentiel » ?", "a": "L'organisme ne peut pas le fabriquer."}, {"id": "ch2-048", "t": "Origine", "q": "Citez 5 huiles riches en acide linoléique.", "a": "Maïs, tournesol, soja, germes de blé, pépins de raisin (+ sésame, carthame, noix)."}, {"id": "ch2-049", "t": "Origine", "q": "Huile de germes de blé : particularité ?", "a": "Riche en acide linoléique et en vitamine E."}, {"id": "ch2-050", "t": "Origine", "q": "Huile de sésame : usages ?", "a": "Solvant des médicaments, laxatif doux, insaponifiable en cosmétologie."}, {"id": "ch2-051", "t": "Comparaison", "q": "Tournesol classique vs hybride ?", "a": "Classique : riche en linoléique ; hybride : ≈ riche en oléique → plus stable à la chaleur."}, {"id": "ch2-052", "t": "Origine", "q": "Huile de noix : intérêt nutritionnel ?", "a": "Riche en LA mais contient aussi de l'ALA (ω3) → bon rapport ω6/ω3."}, {"id": "ch2-053", "t": "Structure", "q": "Acide γ-linolénique (GLA) : notation et positions ?", "a": "C18:3 ω6, doubles liaisons en 6, 9, 12."}, {"id": "ch2-054", "t": "Origine", "q": "Trois sources de GLA ?", "a": "Graines de bourrache (la plus riche), pépins de cassis, graines d'onagre."}, {"id": "ch2-055", "t": "Usage", "q": "Usages des huiles de bourrache et d'onagre ?", "a": "Cosmétologie (élasticité de l'épiderme, rides), compléments alimentaires ; onagre/ménopause sans efficacité prouvée ; bourrache : arthrite rhumatoïde évoquée."}, {"id": "ch2-056", "t": "Définition", "q": "Facteurs freinant la conversion LA → GLA ?", "a": "Excès de cholestérol, AG trans/saturés, alcool, vieillissement, diabète."}, {"id": "ch2-057", "t": "Origine", "q": "DGLA : structure et seule source directe ?", "a": "C20:3 ω6 = GLA + 2 C ; lait maternel ; → eicosanoïdes série 1."}, {"id": "ch2-058", "t": "Structure", "q": "Acide arachidonique : notation ?", "a": "C20:4 ω6 (Δ5, 8, 11, 14)."}, {"id": "ch2-059", "t": "Origine", "q": "Sources d'acide arachidonique ?", "a": "Jaune d'œuf, tissus gras animaux ; absent des huiles végétales."}, {"id": "ch2-060", "t": "Usage", "q": "Eicosanoïdes de série 2 : origine et effets ?", "a": "Issus de l'acide arachidonique : cicatrisation mais médiateurs allergiques ; excès → arthrite, eczéma, psoriasis, maladies auto-immunes."}, {"id": "ch2-061", "t": "Usage", "q": "Eicosanoïdes de série 1 : origine et effets ?", "a": "Issus du DGLA : protection des artères et du cœur, anti-inflammatoires, stimulation immunitaire."}, {"id": "ch2-062", "t": "Classe", "q": "Trois principaux ω3 ?", "a": "α-linolénique (ALA, C18:3), EPA (C20:5), DHA (C22:6)."}, {"id": "ch2-063", "t": "Usage", "q": "Rôles des ω3 (eicosanoïdes série 3) ?", "a": "Membranes ; développement neurologique fœtus/nourrisson ; cardiovasculaire (élasticité, tension) ; agrégation plaquettaire ; immunité, anti-inflammatoire."}, {"id": "ch2-064", "t": "Structure", "q": "ALA : notation et positions ?", "a": "C18:3 ω3, doubles liaisons en 9, 12, 15."}, {"id": "ch2-065", "t": "Origine", "q": "Sources végétales d'ALA ?", "a": "Lin (≈ moitié de l'huile), noix, colza, soja."}, {"id": "ch2-066", "t": "Pourquoi ?", "q": "Pourquoi l'huile de lin se conserve-t-elle mal ?", "a": "Très insaturée (ALA) → s'oxyde vite, rancit, siccative (sèche en se résinifiant)."}, {"id": "ch2-067", "t": "Usage", "q": "Pourquoi broyer les graines de lin données aux poules (œufs ω3) ?", "a": "Intactes, leurs mucilages exercent une action laxative et elles sont évacuées sans être digérées."}, {"id": "ch2-068", "t": "Structure", "q": "EPA : nom complet et notation ?", "a": "Acide eicosapentaénoïque, C20:5 ω3."}, {"id": "ch2-069", "t": "Définition", "q": "Comment l'EPA est-il formé dans l'organisme ?", "a": "À partir de l'ALA : 2 désaturations + 1 élongation ; taux de conversion très faible → apport alimentaire nécessaire."}, {"id": "ch2-070", "t": "Structure", "q": "DHA : nom complet et notation ?", "a": "Acide docosahexaénoïque, C22:6 ω3."}, {"id": "ch2-071", "t": "Usage", "q": "Rôles du DHA ?", "a": "Développement du cerveau et de la rétine ; formation et motilité des spermatozoïdes."}, {"id": "ch2-072", "t": "Pourquoi ?", "q": "Pourquoi ajoute-t-on du DHA aux laits pour bébé ?", "a": "Le fœtus et le nourrisson ne le synthétisent pas ; le lait maternel en contient selon l'alimentation de la mère."}, {"id": "ch2-073", "t": "Définition", "q": "EPA et DHA sont-ils strictement essentiels ?", "a": "Non (synthétisables à partir d'ALA) mais production très insuffisante → apport alimentaire."}, {"id": "ch2-074", "t": "Origine", "q": "Principales sources d'EPA/DHA ?", "a": "Poissons gras (saumon, sardine…), huile de foie de morue (+ vitamines A et D)."}, {"id": "ch2-075", "t": "Toxicité", "q": "Risques de qualité des huiles de poisson ?", "a": "Polluants liposolubles (mercure, plomb, PCB, dioxines) → dépollution ; oxydation rapide."}, {"id": "ch2-076", "t": "Méthode", "q": "Comment protéger les AGPI de l'oxydation ?", "a": "Supprimer l'O2, protéger de la lumière, réfrigérer, éliminer les ions métalliques, ajouter un antioxydant (vitamine E)."}, {"id": "ch2-077", "t": "Comparaison", "q": "Formes des suppléments d'ω3 ?", "a": "Naturelle (triglycérides) et hémisynthétique (esters éthyliques) : biodisponibilité des esters éthyliques 2–3× moindre (résistance aux lipases)."}, {"id": "ch2-078", "t": "Toxicité", "q": "Effets indésirables des suppléments d'huile de poisson ?", "a": "Nausées, éructations ; allongement du temps de saignement (anticoagulants, aspirine, hémophilie) ; excès de vitamine A (tératogène)."}, {"id": "ch2-079", "t": "Pourquoi ?", "q": "Pourquoi éviter un excès d'ω6 ?", "a": "Compétition pour les mêmes enzymes : ↓ formation des ω3 longs, effet pro-inflammatoire (asthme, arthrite)."}, {"id": "ch2-080", "t": "Définition", "q": "Rapport ω6/ω3 recommandé ?", "a": "≈ 5 (souvent > 10 dans la population actuelle)."}, {"id": "ch2-081", "t": "Définition", "q": "Répartition recommandée des matières grasses ?", "a": "≤ 30 % des calories : ½ mono-insaturés, ¼ polyinsaturés (ω6/ω3 = 5), ¼ saturés."}, {"id": "ch2-082", "t": "Origine", "q": "Comment se forment les AG trans ?", "a": "Hydrogénation ruminale (faible %, produits laitiers, bœuf) ; hydrogénation industrielle partielle ; raffinage ; chauffage excessif ou répété des huiles."}, {"id": "ch2-083", "t": "Toxicité", "q": "Effets des AG trans sur la santé ?", "a": "↑ LDL et ↓ HDL → risque cardiovasculaire."}, {"id": "ch2-084", "t": "Usage", "q": "Pourquoi l'industrie hydrogène-t-elle les huiles ?", "a": "Pour obtenir des margarines solides à T° ambiante, tolérant les hautes T° de cuisson et se conservant mieux."}, {"id": "ch2-085", "t": "Définition", "q": "À partir de combien de C les AG sont-ils insolubles dans l'eau ?", "a": "À partir de C10 (l'acide butyrique C4 est soluble)."}, {"id": "ch2-086", "t": "Définition", "q": "Influence du nombre de C et de doubles liaisons sur le PF des triglycérides ?", "a": "PF ↑ avec le nombre de C ; PF ↓ quand le nombre de doubles liaisons augmente."}, {"id": "ch2-087", "t": "Définition", "q": "Que provoque l'oxydation des doubles liaisons par l'air ?", "a": "Le rancissement des graisses."}, {"id": "ch2-088", "t": "Méthode", "q": "Indice d'acide : définition et intérêt ?", "a": "mg de KOH pour neutraliser les acides libres de 1 g ; à T° ordinaire ; mesure l'altération ou la qualité du raffinage ; crucial pour les injectables (douleur)."}, {"id": "ch2-089", "t": "Méthode", "q": "Indice de saponification : définition ?", "a": "mg de KOH pour neutraliser les acides libres ET saponifier les esters de 1 g ; à chaud (reflux) ; plus élevé si les chaînes sont courtes."}, {"id": "ch2-090", "t": "Méthode", "q": "Indice d'esters : définition et calcul ?", "a": "mg de KOH pour saponifier les seuls esters de 1 g ; IE = IS – IA."}, {"id": "ch2-091", "t": "Méthode", "q": "Indice de peroxyde : définition, unité, intérêt ?", "a": "Milliéquivalents d'O2 actif par kg (iodométrie) ; apprécie conservation, oxydation et rancissement au stockage."}, {"id": "ch2-092", "t": "Méthode", "q": "Indice d'hydroxyle : principe ?", "a": "Acétylation des OH libres (anhydride acétique/pyridine) puis dosage de l'acide acétique libéré ; ex. acide ricinoléique."}, {"id": "ch2-093", "t": "Méthode", "q": "Étapes de la peroxydation d'un AGPI ?", "a": "Arrachement d'un H (UV, chaleur, métaux) → radical → délocalisation en diène conjugué → + O2 → radical peroxyle → arrache un H à un autre lipide → hydroperoxyde + nouveau radical (chaîne) → aldéhydes/cétones (rance, toxiques)."}, {"id": "ch2-095", "t": "Définition", "q": "Définition de l'insaponifiable ?", "a": "Constituants lipophiles non glycéridiques (non estérifiés) non transformés en savon lors de la saponification ; 0,3–2 % de l'huile ; AG libres exclus."}, {"id": "ch2-096", "t": "Définition", "q": "Que trouve-t-on dans l'insaponifiable ?", "a": "Hydrocarbures (squalène), vitamines A et E, alcools aliphatiques de PM élevé, triterpènes, stérols (phytostérols)."}, {"id": "ch2-097", "t": "Usage", "q": "Applications thérapeutiques d'insaponifiables ?", "a": "Avocat + soja : appoint des douleurs arthrosiques ; palmier de Floride et prunier d'Afrique : hypertrophie de la prostate."}, {"id": "ch2-098", "t": "Usage", "q": "Emplois pharmaceutiques des huiles ?", "a": "Excipients (injectables, dermato, suppositoires, polissage), nutrition parentérale, hypocholestérolémiantes, anti-inflammatoires, source de vitamines/stérols, olive cholagogue, ricin purgatif, fongicide."}, {"id": "ch2-099", "t": "Définition", "q": "Propriétés définissant une cire ?", "a": "Plasticité (malléable à T° ambiante), PF > 45 °C (sauf cires liquides), faible viscosité fondue, hydrophobie."}, {"id": "ch2-100", "t": "Définition", "q": "Composition chimique générale d'une cire ?", "a": "Esters d'acides gras (C18–22) et d'alcools à très longue chaîne (C26–30, jusqu'à C72) + hydrocarbures saturés à nombre impair de C + alcanes fonctionnalisés ; très stables."}, {"id": "ch2-101", "t": "Origine", "q": "Cire de carnauba : origine et particularité ?", "a": "Feuilles du palmier Copernicia cerifera (Brésil) ; surtout des esters ; PF le plus élevé des cires naturelles (80–88 °C)."}, {"id": "ch2-102", "t": "Usage", "q": "Usages de la cire de carnauba ?", "a": "Sticks (démoulage, consistance, brillance), enrobage de comprimés, confiserie et biscuiterie (E903)."}, {"id": "ch2-103", "t": "Comparaison", "q": "Pourquoi « huile de jojoba » est-il un nom abusif ?", "a": "C'est une cire liquide (> 10 °C) : esters d'acides et d'alcools mono-insaturés C20–C22, sans glycérol."}, {"id": "ch2-104", "t": "Usage", "q": "Intérêts cosmétiques du jojoba ?", "a": "Adoucissant, pas de sensation grasse, non comédogène (régule le sébum), riche en antioxydants ; substitut du blanc de baleine ; pas d'usage alimentaire."}, {"id": "ch2-105", "t": "Origine", "q": "Cire jaune : origine et composition ?", "a": "Glandes cirières abdominales d'Apis mellifica ; hydrocarbures, acide cérotique et alcool mélissique libres, esters (palmitate de mélissyle…), propolis."}, {"id": "ch2-106", "t": "Comparaison", "q": "Cire jaune vs cire blanche ?", "a": "Cera alba = cire jaune blanchie (soleil ou agents chimiques) ; excipient (dragées, cérats, crèmes), bougies ; cire jaune : additif E901."}, {"id": "ch2-107", "t": "Origine", "q": "Lanoline : origine et composition ?", "a": "Glandes sébacées du mouton (Ovis aries) ; esters d'AG (C18–C26) et de stérols/triterpènes (cholestérol, lanostérol) ou d'alcools C26."}, {"id": "ch2-108", "t": "Usage", "q": "Lanoline : propriété, usage et précaution ?", "a": "Absorbe au moins 2× son poids d'eau ; excipient dermatologique ; peut être allergisante."}, {"id": "ch2-109", "t": "Origine", "q": "Gomme laque : origine et usage ?", "a": "Sécrétion de l'insecte Kerria lacca ; esters d'acides hydroxylés (aleuritique) et sesquiterpènes ; enrobages entériques, laques pour cheveux."}, {"id": "ch2-110", "t": "Comparaison", "q": "Cires vs huiles végétales : alcool estérifié ?", "a": "Cires : alcools aliphatiques à très longue chaîne (ou stérols pour la lanoline) ; huiles : glycérol."}, {"id": "ch3-001", "t": "Définition", "q": "Pourquoi les AA intéressent-ils la pharmacognosie ?", "a": "Précurseurs de métabolites secondaires : dérivés du phénylpropène, alcaloïdes, purines, hétérosides cyanogènes, glucosinolates, sulfoxydes de cystéine."}, {"id": "ch3-002", "t": "Origine", "q": "De quoi proviennent Phe, Tyr et Trp ?", "a": "De l'acide shikimique (voie des shikimates)."}, {"id": "ch3-003", "t": "Définition", "q": "D'où provient l'azote des AA chez les plantes ?", "a": "De l'atmosphère via des bactéries qui réduisent N2 en ammoniac (absorbé ou oxydé en nitrates) ; la plupart des plantes absorbent les nitrates."}, {"id": "ch3-004", "t": "Origine", "q": "Quelle famille assimile directement l'ammoniac grâce à une symbiose ?", "a": "Les Fabacées, avec les bactéries Rhizobium des nodules."}, {"id": "ch3-005", "t": "Définition", "q": "Rôle des orages dans le cycle de l'azote ?", "a": "Les éclairs oxydent N2 en oxydes nitriques, dissous dans la pluie, transformés en nitrates dans le sol."}, {"id": "ch3-006", "t": "Toxicité", "q": "Deux AA neurotoxiques d'algues ?", "a": "Acide kaïnique (analogue du glutamate) et BMAA (β-N-méthylamino-L-alanine, algues bleues)."}, {"id": "ch3-007", "t": "Classe", "q": "Les AA inusuels toxiques sont-ils primaires ou secondaires ?", "a": "Considérés comme métabolites secondaires."}, {"id": "ch3-008", "t": "Origine", "q": "Thaumatine : origine ?", "a": "Fruits de Thaumatococcus daniellii (Afrique) ; E957."}, {"id": "ch3-009", "t": "Usage", "q": "Thaumatine : propriétés ?", "a": "Édulcorant 3000× le saccharose, saveur sucrée persistante ; relativement stable à la chaleur : pasteurisable mais non stérilisable."}, {"id": "ch3-010", "t": "Origine", "q": "Papaïne et bromélaïne : sources ?", "a": "Papaïne : papaye (Carica papaya) ; bromélaïne : ananas (Ananas comosus)."}, {"id": "ch3-011", "t": "Usage", "q": "Usages des enzymes protéolytiques végétales ?", "a": "Troubles de la digestion ; œdèmes (bromélaïne) ; hernie discale : injection intradiscale de chymopapaïne (papaïne purifiée)."}, {"id": "ch3-012", "t": "Définition", "q": "Définition des lectines ?", "a": "Protéines ou glycoprotéines se liant spécifiquement et réversiblement à certains résidus sucrés des membranes cellulaires."}, {"id": "ch3-013", "t": "Origine", "q": "Citez 5 sources de lectines.", "a": "Graines de ricin, de jequirity (Abrus precatorius), baies de gui, racines d'ortie, haricots."}, {"id": "ch3-014", "t": "Toxicité", "q": "Quelles lectines résistent aux enzymes digestives ?", "a": "Celles du ricin, du jequirity et du haricot ; elles sont détruites par la chaleur."}, {"id": "ch3-015", "t": "Toxicité", "q": "Haricots crus : risque ?", "a": "Lectines non détruites → gastro-entéropathie sévère mais d'évolution favorable ; la cuisson les détruit."}, {"id": "ch3-016", "t": "Définition", "q": "Gélatine : obtention ?", "a": "Hydrolyse partielle du collagène par ébullition prolongée de peaux et tissus conjonctifs (porc, bœuf)."}, {"id": "ch3-017", "t": "Usage", "q": "Usages de la gélatine ?", "a": "Gélifiant alimentaire, gélules pharmaceutiques (parfois remplacée par des dérivés de cellulose depuis la vache folle)."}, {"id": "ch4-001", "t": "Définition", "q": "Quelles sont les 2 grandes voies biosynthétiques des métabolites secondaires ?", "a": "La voie des shikimates et la voie des acétates (dont celle de l'acide mévalonique)."}, {"id": "ch4-002", "t": "Définition", "q": "Quel composé est le carrefour entre la voie des acétates et celle des shikimates ?", "a": "L'acide pyruvique (CH3-CO-COOH), issu de la glycolyse."}, {"id": "ch4-003", "t": "Définition", "q": "Comment l'acide pyruvique donne-t-il l'acide acétique ?", "a": "Par oxydation."}, {"id": "ch4-004", "t": "Définition", "q": "Avec quel ose l'acide pyruvique réagit-il pour donner l'acide shikimique ?", "a": "L'érythrose (ose à 4 C)."}, {"id": "ch4-005", "t": "Définition", "q": "Que donne la condensation de l'acide acétique ?", "a": "Les acides gras (libres ou estérifiés dans huiles et cires) et les polyacétates (anthraquinones, anthracyclines)."}, {"id": "ch4-006", "t": "Définition", "q": "Quelles classes dérivent de l'acide mévalonique ?", "a": "Terpènes et stéroïdes : H.E., résines, saponines, iridoïdes, lactones sesquiterpéniques, hétérosides cardiotoniques."}, {"id": "ch4-007", "t": "Classe", "q": "Citez deux classes d'origine mixte polyacétates + shikimates.", "a": "Flavonoïdes et tanins catéchiques."}, {"id": "ch4-008", "t": "Classe", "q": "Quelle classe est d'origine mixte polyacétates + terpènes ?", "a": "Les cannabinoïdes."}, {"id": "ch4-009", "t": "Définition", "q": "Quels produits naturels dérivent des acides aminés (schéma général) ?", "a": "Protéines, peptides, glucosinolates, hétérosides cyanogénétiques, alcaloïdes."}, {"id": "ch4-010", "t": "Définition", "q": "Que donne l'acide shikimique directement (2 exemples du schéma) ?", "a": "L'acide gallique (→ tanins galliques) et la phénylalanine (→ acide cinnamique, phénylpropènes)."}, {"id": "ch4-011", "t": "Définition", "q": "Définir un hétéroside.", "a": "Molécule formée d'un ou plusieurs oses liés à une partie non glucidique de nature chimique diversifiée (génine ou aglycone). Synonyme : glycoside."}, {"id": "ch4-012", "t": "Définition", "q": "Holoside vs hétéroside ?", "a": "Holoside : uniquement des oses et dérivés d'oses. Hétéroside : oses + génine. Les deux sont des osides."}, {"id": "ch4-013", "t": "Définition", "q": "Synonyme de génine ?", "a": "Aglycone : la partie non glucidique d'un hétéroside."}, {"id": "ch4-014", "t": "Définition", "q": "Sur quel carbone de l'ose se fait la liaison hétérosidique ?", "a": "Le C1 anomère (OH hémiacétalique), en jonction α ou β, par condensation avec perte d'eau."}, {"id": "ch4-015", "t": "Classe", "q": "Sur quoi repose la classification des hétérosides ?", "a": "Sur la nature de la génine, plus précisément l'atome X portant l'H qui se condense avec l'OH hémiacétalique de l'ose."}, {"id": "ch4-016", "t": "Classe", "q": "Que sont les O-hétérosides ?", "a": "Hétérosides d'alcools, de phénols ou d'acides (X = O) ; les plus répandus dans le règne végétal."}, {"id": "ch4-017", "t": "Classe", "q": "Que sont les C-hétérosides ?", "a": "Hétérosides où la liaison entre ose et génine est une liaison C-C."}, {"id": "ch4-018", "t": "Classe", "q": "Que sont les S-hétérosides ?", "a": "Hétérosides de thiols (X = S)."}, {"id": "ch4-019", "t": "Définition", "q": "De combien d'oses peut être composée la partie osidique ? Quels oses ?", "a": "Mono-, di-, tri-osidique… ; glucose, galactose, pentoses, acides galacturonique, glucuronique…"}, {"id": "ch4-020", "t": "Comparaison", "q": "Hétéroside ou génine : lequel est le plus polaire ?", "a": "L'hétéroside, TOUJOURS plus polaire que la génine correspondante."}, {"id": "ch4-021", "t": "Méthode", "q": "Quels solvants pour extraire des hétérosides ?", "a": "Solvants assez polaires : méthanol, éthanol, acétone, parfois avec de l'eau, voire l'eau seule."}, {"id": "ch4-022", "t": "Méthode", "q": "Quels solvants pour extraire des génines ?", "a": "Solvants organiques moins polaires : dichlorométhane, acétate d'éthyle, diéthyléther."}, {"id": "ch4-023", "t": "Définition", "q": "Quelles réactions enzymatiques interviennent dans la transformation des précurseurs ?", "a": "Hydrolyse, oxydation, réduction, perte d'azote…"}, {"id": "ch4b-024", "t": "Définition", "q": "Comment se forme l'acide shikimique ?", "a": "Acide pyruvique + érythrose → composé en C7 → cyclisation (–H2O) → réduction (NADPH) → acide shikimique."}, {"id": "ch4b-025", "t": "Structure", "q": "Décrire la structure de l'acide shikimique.", "a": "Cyclohexène non aromatique, COOH conjugué à la double liaison, 3 OH (3,4,5)."}, {"id": "ch4b-026", "t": "Origine", "q": "D'où vient le nom « shikimique » ?", "a": "Du nom japonais (Shikimi-no-ki) du badianier du Japon, Illicium anisatum, dont les fruits toxiques (convulsions) ont permis de l'isoler en 1885."}, {"id": "ch4b-027", "t": "Origine", "q": "Dans quel fruit non toxique retrouve-t-on l'acide shikimique ?", "a": "Le fruit du badianier de Chine (Illicium verum) = anis étoilé."}, {"id": "ch4b-028", "t": "Définition", "q": "Quelles 5 substances l'acide shikimique remplace-t-il chez les mutants d'E. coli ?", "a": "3 AA aromatiques (phénylalanine, tyrosine, tryptophane) et 2 acides aromatiques (o- et p-hydroxybenzoïque)."}, {"id": "ch4b-029", "t": "Définition", "q": "Qui synthétise le noyau aromatique dans la nature ?", "a": "Seuls les végétaux et les micro-organismes."}, {"id": "ch4b-030", "t": "Définition", "q": "Quelle est l'autre voie d'aromatogenèse que celle des shikimates ?", "a": "La voie de l'acétate : polycétoesters (polyacétates) cyclisés en composés polycycliques."}, {"id": "ch4b-031", "t": "Définition", "q": "Quels AA aromatiques l'homme doit-il recevoir par l'alimentation ? Lequel peut-il fabriquer ?", "a": "Phénylalanine et tryptophane ; il transforme la phénylalanine en tyrosine (foie)."}, {"id": "ch4b-032", "t": "Usage", "q": "Quel est l'intérêt pharmaceutique de l'acide shikimique ?", "a": "Matière première de l'hémisynthèse de l'oseltamivir, inhibiteur de neuraminidase (grippe aviaire, A/H1N1)."}, {"id": "ch4b-033", "t": "Toxicité", "q": "Quelle conséquence a eu la demande en acide shikimique ?", "a": "Pénurie de « bon anis » (Illicium verum) et falsification par d'autres espèces, certaines très toxiques."}, {"id": "ch4b-034", "t": "Définition", "q": "Quel intermédiaire relie l'acide shikimique aux AA aromatiques ?", "a": "L'acide chorismique."}, {"id": "ch4b-035", "t": "Classe", "q": "Que signifie C6-C1 ?", "a": "Noyau benzénique (6 C) portant 1 carbone (COOH, CHO, CH2OH…) : ex. acide benzoïque, gallique, vanilline, salicylés."}, {"id": "ch4b-036", "t": "Classe", "q": "Que signifie C6-C3 ?", "a": "Noyau aromatique de 6 C substitué par une chaîne aliphatique insaturée de 3 C (phénylpropène) : acide cinnamique et dérivés, lignanes, coumarines."}, {"id": "ch4b-037", "t": "Structure", "q": "Structure de l'acide gallique ?", "a": "Acide 3,4,5-trihydroxybenzoïque : COOH + 3 OH phénoliques adjacents."}, {"id": "ch4b-038", "t": "Usage", "q": "À quoi sert l'acide gallique dans la plante ?", "a": "Matériau de base des tanins galliques (= hydrolysables)."}, {"id": "ch4b-039", "t": "Définition", "q": "Caractéristiques des tanins galliques (rappel 4B) ?", "a": "Polyphénols complexes de PM élevé, hydrosolubles, formant avec les protéines des composés insolubles et indigestes."}, {"id": "ch4b-040", "t": "Structure", "q": "Structure de la vanilline ?", "a": "4-hydroxy-3-méthoxybenzaldéhyde (aldéhyde + phénol + méthoxyle)."}, {"id": "ch4b-041", "t": "Origine", "q": "D'où vient le nom « acide salicylique/spiréique » ?", "a": "De Salix (saule) et Spiraea (reine des prés), plantes de la Ph. Eur. dont les hétérosides donnent cet acide après hydrolyse et oxydation."}, {"id": "ch4b-042", "t": "Origine", "q": "Quelle partie du saule est utilisée ?", "a": "L'écorce des jeunes branches."}, {"id": "ch4b-043", "t": "Structure", "q": "Qu'est-ce que le salicoside ?", "a": "Salicine = glucoside de l'alcool salicylique (le phénol est lié au glucose, CH2OH libre)."}, {"id": "ch4b-044", "t": "Usage", "q": "Propriétés du salicoside ?", "a": "Analgésique et antirhumatismal ; isolé dès 1827 par Leroux."}, {"id": "ch4b-045", "t": "Définition", "q": "Sous quelles formes le salicoside existe-t-il dans l'écorce de saule ?", "a": "Tel quel et sous forme d'esters : salicortine, fragiline, populine."}, {"id": "ch4b-046", "t": "Définition", "q": "Qu'est-ce que la salicortine ?", "a": "Ester entre le CH2OH du salicoside et un acide cyclique."}, {"id": "ch4b-047", "t": "Définition", "q": "Fragiline et populine ?", "a": "Esters de l'OH en 6 du glucose du salicoside avec l'acide acétique (fragiline) ou benzoïque (populine)."}, {"id": "ch4b-048", "t": "Méthode", "q": "Comment dose-t-on le salicoside dans l'écorce de saule ?", "a": "Après saponification : on obtient le salicoside provenant de la totalité des dérivés salicylés."}, {"id": "ch4b-049", "t": "Usage", "q": "Usages actuels des extraits de saule ?", "a": "États fébriles, affections rhumatismales, céphalées."}, {"id": "ch4b-050", "t": "Comparaison", "q": "Saule vs aspirine sur la formule sanguine ?", "a": "Les extraits de saule ne la modifient pas : pas d'effet antiagrégant plaquettaire (contrairement à l'aspirine)."}, {"id": "ch4b-051", "t": "Origine", "q": "Partie utilisée de la reine des prés ?", "a": "Les sommités fleuries (odeur de salicylate de méthyle après froissement en présence d'eau)."}, {"id": "ch4b-052", "t": "Structure", "q": "Qu'est-ce que le monotropitoside ?", "a": "Salicylate de méthyle combiné à un disaccharide (glucose-xylose) par son phénol."}, {"id": "ch4b-053", "t": "Structure", "q": "Qu'est-ce que la spiréine ?", "a": "Glucoside de l'aldéhyde salicylique."}, {"id": "ch4b-054", "t": "Définition", "q": "Comment obtient-on l'acide salicylique à partir de la spiréine ?", "a": "Hydrolyse puis oxydation de l'aldéhyde."}, {"id": "ch4b-055", "t": "Usage", "q": "Usage historique et actuel de l'acide salicylique ?", "a": "1874 : antiseptique, fébrifuge, antirhumatismal ; effets indésirables majeurs → réservé à l'usage externe comme kératolytique."}, {"id": "ch4b-056", "t": "Pourquoi ?", "q": "Pourquoi les dérivés salicylés naturels ne sont-ils pas irritants ?", "a": "Leur fonction phénol est combinée à un ose."}, {"id": "ch4b-057", "t": "Définition", "q": "Comment a-t-on obtenu l'aspirine ?", "a": "En acétylant la fonction phénol de l'acide salicylique (substance de synthèse, commercialisée dès 1899)."}, {"id": "ch4b-058", "t": "Usage", "q": "Doses et usages de l'aspirine (cours) ?", "a": "Antipyrétique et analgésique à dose ± élevée ; antiagrégant plaquettaire depuis 1984 à faible dose."}, {"id": "ch4b-059", "t": "Origine", "q": "Origine du salicylate de méthyle ?", "a": "Essence de Wintergreen : feuilles de Gaultheria procumbens (Éricacée) ou surtout écorce de bouleau (Betula lenta) ; aussi reine des prés (hydrodistillation)."}, {"id": "ch4b-060", "t": "Définition", "q": "Sous quelle forme le salicylate de méthyle existe-t-il dans le bouleau et la reine des prés ?", "a": "Sous forme d'hétéroside (monotropitoside)."}, {"id": "ch4b-061", "t": "Usage", "q": "Usages du salicylate de méthyle ?", "a": "Cosmétiques, antirhumatismaux à usage externe, aromatisation alimentaire."}, {"id": "ch4b-062", "t": "Toxicité", "q": "Toxicité du salicylate de méthyle ?", "a": "Intoxications salicylées quand les quantités ingérées atteignent environ 10 ml."}, {"id": "ch4b-063", "t": "Définition", "q": "Quelle enzyme forme l'acide cinnamique ? Quelle réaction ?", "a": "La PAL (phénylalanine ammonia-lyase) : elle détache l'ammoniac de la phénylalanine (désamination)."}, {"id": "ch4b-064", "t": "Définition", "q": "Définir un baume.", "a": "Oléorésine (mélange d'H.E. et de résines) obtenue par incision des troncs et exsudation, riche en acides benzoïque et cinnamique et leurs esters, avec un peu de vanilline."}, {"id": "ch4b-065", "t": "Pourquoi ?", "q": "Pourquoi les baumes ont-ils une odeur suave ?", "a": "Présence d'une faible quantité de vanilline."}, {"id": "ch4b-066", "t": "Méthode", "q": "Quels indices sont applicables aux baumes ?", "a": "Indice acide, indice de saponification et indice ester."}, {"id": "ch4b-067", "t": "Définition", "q": "Citez les 4 baumes décrits dans les pharmacopées.", "a": "Baume du Pérou, baume de Tolu, benjoin du Laos, benjoin de Sumatra."}, {"id": "ch4b-068", "t": "Origine", "q": "Origine et aspect du baume du Pérou ?", "a": "Myroxylon balsamum var. pereira (Fabacées), Amérique centrale (pas du Pérou), tronc scarifié à chaud ; liquide visqueux."}, {"id": "ch4b-069", "t": "Usage", "q": "Usage du baume du Pérou ?", "a": "Externe : antiseptique et cicatrisant (crevasses, gerçures, brûlures) ; aussi en inhalations. Attention allergisant."}, {"id": "ch4b-070", "t": "Origine", "q": "Origine et aspect du baume de Tolu ?", "a": "Myroxylon balsamum (= M. toluiferum), Colombie/Venezuela, incision profonde du tronc ; masse solide."}, {"id": "ch4b-071", "t": "Usage", "q": "Usage du baume de Tolu ?", "a": "Interne : antiseptique et expectorant (sirops contre la toux) ; inhalations."}, {"id": "ch4b-072", "t": "Comparaison", "q": "Benjoin du Laos vs benjoin de Sumatra : acide majoritaire ?", "a": "Laos (Styrax tonkinensis) : acide benzoïque >> cinnamique. Sumatra (Styrax spp.) : acide cinnamique >> benzoïque."}, {"id": "ch4b-073", "t": "Usage", "q": "Usage des benjoins ?", "a": "Usage externe : antiseptique en inhalations (même usage pour les 2)."}, {"id": "ch4b-074", "t": "Structure", "q": "Donnez un exemple d'ester des baumes.", "a": "Le cinnamate de benzyle."}, {"id": "ch4b-075", "t": "Structure", "q": "Acide caféique : structure ?", "a": "Acide 3,4-dihydroxycinnamique (C6-C3 avec catéchol)."}, {"id": "ch4b-076", "t": "Définition", "q": "Sous quelles formes trouve-t-on l'acide caféique ?", "a": "Rarement libre : estérifié ou combiné avec des sucres."}, {"id": "ch4b-077", "t": "Usage", "q": "Propriétés des dérivés d'acides phénols C6-C3 ?", "a": "Traitement de maladies inflammatoires ou allergiques ; antioxydants, antiradicalaires, antihépatotoxiques."}, {"id": "ch4b-078", "t": "Définition", "q": "Qu'est-ce qu'un « dérivé acide » de l'acide caféique ?", "a": "Ester formé entre le COOH de l'acide caféique et un OH alcoolique d'une autre substance acide ; la molécule garde un COOH libre."}, {"id": "ch4b-079", "t": "Structure", "q": "Qu'est-ce que l'acide cichorique ? Où le trouve-t-on ?", "a": "Ester dicaféique de l'acide tartrique ; Echinacea purpurea."}, {"id": "ch4b-080", "t": "Structure", "q": "Qu'est-ce que l'acide chlorogénique ?", "a": "Ester de l'acide caféique et de l'acide quinique (acide cyclique non aromatique)."}, {"id": "ch4b-081", "t": "Origine", "q": "Où trouve-t-on l'acide chlorogénique en grande quantité ?", "a": "Dans le café (et de nombreuses plantes)."}, {"id": "ch4b-082", "t": "Structure", "q": "Qu'est-ce que la cynarine ? Origine ?", "a": "Ester dicaféique de l'acide quinique ; feuilles d'artichaut (Cynara scolymus)."}, {"id": "ch4b-083", "t": "Structure", "q": "Qu'est-ce que l'acide rosmarinique ?", "a": "Ester de l'acide caféique et de l'acide α-hydroxy-dihydrocaféique (acide aromatique) ; romarin."}, {"id": "ch4b-084", "t": "Usage", "q": "Propriétés de l'acide rosmarinique ?", "a": "Antioxydant puissant et antihépatotoxique."}, {"id": "ch4b-085", "t": "Structure", "q": "Composition de l'actéoside (verbascoside) ?", "a": "Acide caféique + glucose sur lequel se greffent un rhamnose et le dihydroxyphényléthanol."}, {"id": "ch4b-086", "t": "Origine", "q": "Dans quelles plantes trouve-t-on l'actéoside ?", "a": "Plantes anti-inflammatoires : harpagophyton, frêne, plantain…"}, {"id": "ch4b-087", "t": "Comparaison", "q": "Échinacoside vs actéoside ?", "a": "L'échinacoside a 1 glucose supplémentaire (3 oses) ; présent dans divers Echinacea."}, {"id": "ch4b-088", "t": "Définition", "q": "Quelles liaisons trouve-t-on dans les hétérosides complexes de l'acide caféique ?", "a": "Une liaison ester (COOH caféique + OH de l'ose) et des liaisons éther (entre oses, ou entre glucose et dihydroxyphényléthanol)."}, {"id": "ch4b-089", "t": "Définition", "q": "Caractéristiques des phénylpropènes des H.E. ?", "a": "Entraînables à la vapeur d'eau (PM peu élevé), odorants, contribuent aux propriétés antimicrobiennes des épices."}, {"id": "ch4b-090", "t": "Définition", "q": "Comment l'aldéhyde cinnamique dérive-t-il de l'acide cinnamique ?", "a": "Par réduction du COOH en CHO."}, {"id": "ch4b-091", "t": "Origine", "q": "Origine de l'aldéhyde cinnamique ?", "a": "Constituant majoritaire des essences de cannelle (écorce) : Cinnamomum zeylanicum (Ceylan), C. cassia (Chine)."}, {"id": "ch4b-092", "t": "Origine", "q": "Origine de l'eugénol ?", "a": "Constituant majoritaire de l'essence de clou de girofle (boutons floraux de Syzygium aromaticum = Eugenia caryophyllata)."}, {"id": "ch4b-093", "t": "Usage", "q": "Usage de l'essence de girofle ?", "a": "Anesthésique et antiseptique dentaire (dus à l'eugénol)."}, {"id": "ch4b-094", "t": "Origine", "q": "Origine de la myristicine ?", "a": "Noix de muscade (Myristica fragrans, Myristicacées)."}, {"id": "ch4b-095", "t": "Toxicité", "q": "Toxicité de la myristicine ?", "a": "Effets hallucinogènes si plusieurs grammes de muscade ; serait aminée en MMDA (analogue de l'amphétamine)."}, {"id": "ch4b-096", "t": "Structure", "q": "Quels substituants rendent la myristicine très lipophile ?", "a": "Le méthylènedioxy et le méthoxy."}, {"id": "ch4b-097", "t": "Origine", "q": "Origines du trans-anéthole ?", "a": "Essences anisées : anis vert (Pimpinella anisum), fenouil (Foeniculum vulgare) — Apiacées — et anis étoilé (Illicium verum, Illiciacées)."}, {"id": "ch4b-098", "t": "Usage", "q": "Propriétés et usages de l'anéthole ?", "a": "Plantes à propriétés digestives ; boissons anisées (pastis, anisette, ouzo, raki)."}, {"id": "ch4b-099", "t": "Structure", "q": "Qu'est-ce qu'un curcuminoïde ?", "a": "Dérivé du dicinnamoylméthane (2 C6-C3 + 1 CH2) = diarylheptanoïde (7 C entre les 2 noyaux aromatiques)."}, {"id": "ch4b-100", "t": "Usage", "q": "Propriétés de la curcumine comme colorant ?", "a": "Colorant atoxique autorisé E100, stable à la chaleur, peu sensible aux variations de pH."}, {"id": "ch4b-101", "t": "Usage", "q": "Activités de la curcumine ?", "a": "Puissant antioxydant, anti-inflammatoire (aigu et chronique), inhibe le cancer à toutes les étapes (initiation, promotion, progression) dans les essais."}, {"id": "ch4b-102", "t": "Définition", "q": "Problème majeur de la curcumine chez l'homme et solutions ?", "a": "Très mal assimilée ; ajout de pipérine (+2000 %), dérivés hémisynthétiques, formes galéniques (cyclodextrines)."}, {"id": "ch4b-103", "t": "Origine", "q": "Sources de curcumine ? Partie utilisée ?", "a": "Rhizome de Curcuma domestica et Curcuma xanthorrhiza (Temoe-Lawaq), Zingibéracées."}, {"id": "ch4b-104", "t": "Usage", "q": "Activités du rhizome de curcuma ?", "a": "Cholagogue, protection du parenchyme hépatique, antioxydant, hypolipidémiant."}, {"id": "ch4b-105", "t": "Origine", "q": "Que sont les gingérols et d'où viennent-ils ?", "a": "Principes piquants de la résine du rhizome de gingembre (Zingiber officinale, drogue à oléorésine)."}, {"id": "ch4b-106", "t": "Définition", "q": "Origine biogénétique des gingérols ?", "a": "Mixte : partie aromatique dérivée de l'acide cinnamique + chaîne aliphatique issue des polyacétates (longueur variable)."}, {"id": "ch4b-107", "t": "Usage", "q": "Usage du gingembre ?", "a": "Contre les nausées et vomissements."}, {"id": "ch4b-108", "t": "Définition", "q": "Définir les lignanes.", "a": "Composés polycycliques de bas PM formés par le couplage de 2 unités phénylpropaniques (C6-C3 ×2)."}, {"id": "ch4b-109", "t": "Comparaison", "q": "Lignane vs lignine ?", "a": "Lignane : dimère de bas PM ; lignine : polymère du bois de taille importante, unité de base C6-C3."}, {"id": "ch4b-110", "t": "Définition", "q": "Quel est le précurseur commun des lignanes ?", "a": "L'alcool cinnamique transformé en alcool coniférylique, qui forme des radicaux libres et se dimérise par voie enzymatique."}, {"id": "ch4b-111", "t": "Définition", "q": "Étapes acide cinnamique → alcool coniférylique ?", "a": "1. Réduction du COOH ; 2. oxydation du cycle aromatique ; 3. méthylation de l'OH en 3."}, {"id": "ch4b-112", "t": "Classe", "q": "1er type de couplage des lignanes ?", "a": "Couplage uniquement entre les chaînes latérales (ex. sécoisolaricirésinol ; puis éventuellement lactone)."}, {"id": "ch4b-113", "t": "Classe", "q": "2e type de couplage des lignanes ?", "a": "Couplage par les chaînes latérales ET entre le noyau aromatique d'une unité et la chaîne latérale de l'autre → aryltétraline."}, {"id": "ch4b-114", "t": "Définition", "q": "Qu'est-ce qu'une tétraline ?", "a": "Tétrahydronaphtalène."}, {"id": "ch4b-115", "t": "Origine", "q": "Quel lignane trouve-t-on dans les graines de lin ?", "a": "Le sécoisolaricirésinol diglucoside (SDG), en teneurs très élevées."}, {"id": "ch4b-116", "t": "Usage", "q": "Propriétés des lignanes du lin ?", "a": "Antioxydantes et œstrogéniques (SDG = phyto-œstrogène)."}, {"id": "ch4b-117", "t": "Origine", "q": "Origine de la podophyllotoxine ?", "a": "Podophylline = extrait alcoolique de la résine des racines de podophylle (Podophyllum peltatum, Berbéridacées)."}, {"id": "ch4b-118", "t": "Usage", "q": "Mécanisme et usage de la podophyllotoxine ?", "a": "Lactone inhibant la synthèse de la tubuline (mitose) ; utilisée contre verrues et condylomes."}, {"id": "ch4b-119", "t": "Toxicité", "q": "Pourquoi la podophyllotoxine n'est-elle pas utilisée per os contre le cancer ?", "a": "Trop toxique ; elle a servi de modèle aux dérivés semi-synthétiques (étoposide, téniposide)."}, {"id": "ch4b-120", "t": "Définition", "q": "Étapes de biosynthèse de la coumarine ?", "a": "Phe → (PAL) désamination + ortho-hydroxylation → acide trans-2-hydroxycinnamique → isomérisation (lumière) en cis → lactonisation (–H2O)."}, {"id": "ch4b-121", "t": "Origine", "q": "D'où vient le nom « coumarine » ?", "a": "De « coumarou », nom vénézuélien de la graine de Dipteryx odorata (fève tonka, Fabacées), utilisée pour aromatiser des tabacs."}, {"id": "ch4b-122", "t": "Origine", "q": "Plantes à odeur de coumarine ?", "a": "Flouve odorante (graminée), mélilot (après hydrolyse), aspérule odorante (vin de mai, Maitrank), fève tonka."}, {"id": "ch4b-123", "t": "Pourquoi ?", "q": "Pourquoi le mélilot ne sent la coumarine qu'après froissement en présence d'eau ?", "a": "La coumarine y est sous forme d'hétéroside : il faut une hydrolyse pour la libérer."}, {"id": "ch4b-124", "t": "Toxicité", "q": "Toxicité de la coumarine ?", "a": "Pas anticoagulante, mais hépatotoxique à fortes doses → teneurs maximales de 2 à 5 ppm dans les denrées (Directive européenne)."}, {"id": "ch4b-125", "t": "Définition", "q": "Sur quel carbone la majorité des coumarines naturelles sont-elles hydroxylées ? Pourquoi ?", "a": "C7 : hydroxylation en para de la chaîne latérale de l'acide cinnamique avant ortho-hydroxylation, isomérisation et lactonisation."}, {"id": "ch4b-126", "t": "Usage", "q": "Propriété découverte chez les 7-hydroxycoumarines ?", "a": "Anti-inflammatoire (anti-COX2)."}, {"id": "ch4b-127", "t": "Structure", "q": "Esculoside ?", "a": "6-O-glucoside de l'esculétol (esculétine = 6,7-dihydroxycoumarine)."}, {"id": "ch4b-128", "t": "Structure", "q": "Fraxoside ?", "a": "8-O-glucoside du fraxétol (6-méthoxy-7,8-dihydroxycoumarine)."}, {"id": "ch4b-129", "t": "Origine", "q": "Où trouve-t-on fraxoside et esculoside ? Usage ?", "a": "Écorce de frêne (Fraxinus excelsior) : affections articulaires douloureuses."}, {"id": "ch4b-130", "t": "Usage", "q": "Usage des extraits d'écorce de marronnier d'Inde (esculoside) ?", "a": "Fragilité capillaire (insuffisance veineuse), hémorroïdes ; dermato-cosmétique (filtrent une partie des UV)."}, {"id": "ch4b-131", "t": "Définition", "q": "Qu'est-ce qu'une phytoalexine ? Exemple coumarinique ?", "a": "Substance synthétisée par la plante après une infection bactérienne ou fongique, antimicrobienne ; scopolétine de la pomme de terre."}, {"id": "ch4b-132", "t": "Définition", "q": "Pourquoi les coumarines intéressent-elles la chimiotaxonomie ? Familles ?", "a": "Distribution limitée ; surtout Apiacées, Rutacées, Astéracées, Fabacées, Solanacées."}, {"id": "ch4b-133", "t": "Origine", "q": "Quel événement a mené à la découverte des anticoagulants coumariniques ?", "a": "Hémorragies fatales de bétail (USA, Wisconsin, 1922) nourri de mélilot moisi ; principe isolé en 1941 (bishydroxycoumarine = dicoumarol)."}, {"id": "ch4b-134", "t": "Définition", "q": "Que contient le mélilot et que devient-il normalement ?", "a": "Le mélilotoside (glucoside de l'acide 2-hydroxycinnamique) : hydrolyse enzymatique puis lactonisation → coumarine."}, {"id": "ch4b-135", "t": "Définition", "q": "Formation du dicoumarol dans le fourrage moisi ?", "a": "Hydrolyse du mélilotoside, hydroxylation en C4, puis dimérisation par couplage avec du formol."}, {"id": "ch4b-136", "t": "Usage", "q": "Mécanisme des anticoagulants 4-hydroxycoumariniques ?", "a": "Anti-vitamine K : interfèrent avec la vitamine K hépatique, nécessaire à la synthèse d'une prothrombine normale."}, {"id": "ch4b-137", "t": "Usage", "q": "Quel point structural commun ont les anticoagulants de synthèse dérivés du dicoumarol ?", "a": "Ils sont toujours hydroxylés en C4 (ex. warfarine, 1956)."}, {"id": "ch4b-138", "t": "Usage", "q": "Utilisation clinique des AVK coumariniques ?", "a": "Seuls après initiation par l'héparine, en prévention/traitement de la coagulation (affections thrombo-emboliques)."}, {"id": "ch4b-139", "t": "Définition", "q": "Comment se forment les furocoumarines ?", "a": "Prénylation du noyau benzénique d'une 7-hydroxycoumarine en C6 ou C8, cyclisation, élimination d'un reste hydroxypropyle → noyau furane."}, {"id": "ch4b-140", "t": "Classe", "q": "Furocoumarines linéaires vs angulaires ?", "a": "Linéaires : prénylation en C6. Angulaires : prénylation en C8."}, {"id": "ch4b-141", "t": "Structure", "q": "Psoralène, bergaptène, xanthotoxine : substituants ?", "a": "Psoralène : aucun ; bergaptène : OCH3 en 5 (R1) ; xanthotoxine : OCH3 en 8 (R2)."}, {"id": "ch4b-142", "t": "Méthode", "q": "Propriété optique des furocoumarines ?", "a": "Chromophore étendu → absorbent la lumière et fluorescent intensément sous UV longs (UV-A 320-380 nm)."}, {"id": "ch4b-143", "t": "Toxicité", "q": "Mécanisme de la phototoxicité/mutagénicité des psoralènes ?", "a": "Formation d'adduits avec les bases pyrimidiques de l'ADN (thymine) par une ou deux cycloadditions."}, {"id": "ch4b-144", "t": "Origine", "q": "Citez des plantes phototoxiques à furocoumarines.", "a": "Apiacées : grande berce, berce du Caucase (+++), angélique, céleri, panais, persil ; Rutacées : rue, bergamotier (+++)."}, {"id": "ch4b-145", "t": "Usage", "q": "Usage cosmétique des furocoumarines et risque ?", "a": "Écrans de protection solaire ; à doses trop élevées : phototoxicité (dermatites, brûlures)."}, {"id": "ch4b-146", "t": "Usage", "q": "Usage thérapeutique de la xanthotoxine ?", "a": "Vitiligo et psoriasis par PUVA-thérapie : per os 2 h avant exposition aux UVA."}, {"id": "ch4b-147", "t": "Toxicité", "q": "Précautions de la PUVA-thérapie ?", "a": "Risque de cataracte, de mélanome ; tératogène → contraception obligatoire chez la femme."}, {"id": "ch4b-148", "t": "Toxicité", "q": "Mécanisme de l'interaction pamplemousse-médicaments ?", "a": "Inhibition du CYP3A4 intestinal par les furocoumarines (prénylées/dimérisées) et flavonoïdes → ↑ biodisponibilité."}, {"id": "ch4b-149", "t": "Toxicité", "q": "Médicaments les plus sensibles au pamplemousse ?", "a": "Inhibiteurs calciques et autres antihypertenseurs, antiarythmiques, antihistaminiques non sédatifs, benzodiazépines, statines, certains antitumoraux."}, {"id": "ch4b-150", "t": "Toxicité", "q": "Durée/importance de l'effet du jus de pamplemousse ?", "a": "Un verre (250 ml) suffit ; effets jusqu'à 3 jours ou plus, même consommé 12 h avant ; imprévisible et parfois grave."}, {"id": "ch5-001", "t": "Définition", "q": "Qu’appelle-t-on « produits mixtes » sur le plan biosynthétique ?", "a": "Des composés issus de l’allongement d’un phénylpropane (voie des shikimates) par addition successive d’unités dicarbonées (voie des acétates)."}, {"id": "ch5-002", "t": "Classe", "q": "Citez les 4 classes phytochimiques issues de la biosynthèse mixte vues au cours.", "a": "Stilbénoïdes, flavonoïdes, anthocyanes, tanins catéchiques."}, {"id": "ch5-003", "t": "Définition", "q": "Définition d’un polyphénol naturel ?", "a": "Substance comprenant au moins un noyau aromatique (souvent benzénique) et au moins deux groupes OH (fonctions phénols) sur ce noyau."}, {"id": "ch5-004", "t": "Pourquoi ?", "q": "Quelle est la propriété principale commune des polyphénols et de quoi dépend son intensité ?", "a": "Antioxydants, piégeurs de radicaux libres ; d’autant plus marquée que le nombre de fonctions phénols sur le cycle aromatique est important."}, {"id": "ch5-005", "t": "Classe", "q": "Citez 2 exemples de polyphénols hors biosynthèse mixte.", "a": "Acides-phénols dérivés du phénylpropane (acide caféique et dérivés) ; certains diterpènes (rosmanol)."}, {"id": "ch5-006", "t": "Usage", "q": "Pour quelles pathologies l’intérêt antioxydant des polyphénols est-il étudié ?", "a": "Prévention/traitement du cancer, des maladies cardiovasculaires, inflammatoires et neurodégénératives."}, {"id": "ch5-007", "t": "Usage", "q": "Dans quelles industries les polyphénols sont-ils utilisés comme additifs ?", "a": "Industrie pharmaceutique, agro-alimentaire, cosmétique."}, {"id": "ch5-008", "t": "Définition", "q": "De quoi dépend l’efficacité des polyphénols in vivo ?", "a": "De leur biodisponibilité : nature, concentration, vitesse d’absorption dans l’intestin grêle, interactions avec d’autres aliments."}, {"id": "ch5-009", "t": "Définition", "q": "Quels sont les 2 radicaux oxygénés principaux et lequel est le plus toxique ?", "a": "L’anion superoxyde O2•− (radical chargé, donc polaire) et le radical hydroxyle •OH, excessivement toxique (arrache un H à n’importe quelle molécule organique)."}, {"id": "ch5-010", "t": "Définition", "q": "Décrivez la chaîne de peroxydation initiée par •OH.", "a": "•OH + RH → H2O + R• ; R• + O2 → ROO• ; ROO• + R′H → ROOH + R′• ; ROOH + Fe2+ → Fe3+ + RO• (alkoxyle, lipophile) ; RO• + R″H → ROH + R″•…"}, {"id": "ch5-011", "t": "Définition", "q": "Dans quelles circonstances se forment les radicaux libres ?", "a": "Anoxie, inflammation, rayonnements électromagnétiques…"}, {"id": "ch5-012", "t": "Définition", "q": "Quelles biomolécules sont attaquées par les radicaux libres et avec quelles conséquences ?", "a": "Lipides (peroxydation), protéines (dégradées), sucres, acides nucléiques ; tous les compartiments cellulaires touchés → mutations, cancérisation, altérations cellulaires."}, {"id": "ch5-013", "t": "Définition", "q": "Citez les défenses endogènes contre les radicaux libres.", "a": "Superoxyde dismutase (O2•− → H2O2 + O2) ; glutathion-peroxydase et catalase (peroxydes/hydroperoxydes → eau : ROOH + 2 GSH → ROH + H2O + GSSG)."}, {"id": "ch5-014", "t": "Définition", "q": "Citez les antioxydants exogènes.", "a": "Sélénium, zinc, vitamines E, C, A, polyphénols, caroténoïdes."}, {"id": "ch5-015", "t": "Classe", "q": "Définition des stilbénoïdes ?", "a": "Composés phénoliques (libres ou hétérosidiques) à 2 noyaux benzéniques séparés par un pont éthane (bisbenzyles) ou éthène (stilbènes proprement dits)."}, {"id": "ch5-016", "t": "Comparaison", "q": "Bisbenzyles vs stilbènes ?", "a": "Bisbenzyles : pont éthane, surtout dans les mousses (hépatiques). Stilbènes : pont éthène, généralement de configuration E, présents dans de nombreuses familles de végétaux supérieurs."}, {"id": "ch5-017", "t": "Structure", "q": "Dessinez et décrivez le resvératrol.", "a": "Stilbène E : 3,5-dihydroxyphényle–CH=CH–4-hydroxyphényle (trans-3,5,4′-trihydroxystilbène)."}, {"id": "ch5-018", "t": "Origine", "q": "Origines du resvératrol ?", "a": "Composé minoritaire des vins rouges ; renouée du Japon (Polygonum cuspidatum), surtout sous forme d’hétérosides de resvératrol et d’hydroxyresvératrol."}, {"id": "ch5-019", "t": "Usage", "q": "Propriétés du resvératrol ?", "a": "Antioxydantes, anti-inflammatoires, anticancéreuses, phyto-œstrogènes."}, {"id": "ch5-020", "t": "Définition", "q": "Qu’est-ce que le « French paradox » ?", "a": "Faible incidence de maladies cardiaques en France malgré une alimentation riche en AG saturés, attribuée notamment à la consommation régulière de vin rouge (resvératrol, flavonoïdes, tanins, anthocyanes)."}, {"id": "ch5-021", "t": "Classe", "q": "Quelle classe ? 2 benzènes reliés par –CH=CH– avec des OH phénoliques.", "a": "Stilbénoïdes (stilbène), voie mixte. Ex. resvératrol."}, {"id": "ch5b-001", "t": "Définition", "q": "Quels rôles jouent les flavonoïdes dans la plante ?", "a": "Pigments (jaunes…) des fleurs/fruits/feuilles ; certains visibles seulement par les insectes (proche UV) → pollinisation ; copigmentation ; protection des tissus contre les UV (cuticule foliaire)."}, {"id": "ch5b-002", "t": "Définition", "q": "Quelle est l’origine biosynthétique commune des flavonoïdes ?", "a": "Condensation d’un triacétate (→ cycle A) et de l’acide p-hydroxycinnamique (→ cycle B + 3 C) donnant une chalcone, puis cyclisation en flavonoïde (cycle C = pyrone)."}, {"id": "ch5b-003", "t": "Structure", "q": "Squelette général des flavonoïdes ?", "a": "C6-C3-C6 : 2 cycles benzéniques A et B + cycle central C (noyau pyrone). Numérotation : O1, C2 (porte B), C3, C4 (cétone), 5-8 sur A, 1′-6′ sur B."}, {"id": "ch5b-004", "t": "Structure", "q": "Quelles positions du cycle A sont toujours hydroxylées ?", "a": "C5 et C7 (OH pouvant être éthérifiés, ou engagés dans une liaison hétérosidique). C6 et C8 : substitutions plus rares (OH, OCH3, isoprène, liaison C–C avec un sucre)."}, {"id": "ch5b-005", "t": "Structure", "q": "Substitution du cycle B des flavonoïdes ?", "a": "Toujours au moins 1 OH en 4′, souvent 2 OH (3′, 4′), rarement 3 (3′,4′,5′) ; parfois OCH3 ; 2′ et 6′ rarement substitués."}, {"id": "ch5b-006", "t": "Définition", "q": "Pourquoi les flavonoïdes sont-ils des polyphénols ?", "a": "Ils possèdent au moins 3 fonctions phénoliques (libres ou substituées) en 5, 7 et 4′."}, {"id": "ch5b-007", "t": "Définition", "q": "Sur quel cycle les génines flavonoïdiques se différencient-elles et selon quels critères ?", "a": "Sur l’hétérocycle central C : présence ou non de la cétone en 4, de la double liaison 2,3 et d’un OH en 3 (degré d’oxydation)."}, {"id": "ch5b-008", "t": "Classe", "q": "Caractéristiques d’une flavone ?", "a": "Cétone en 4, double liaison 2,3, pas de OH en 3 (« one »). Ex. apigénol, lutéolol."}, {"id": "ch5b-009", "t": "Classe", "q": "Caractéristiques d’un flavonol ?", "a": "Cétone en 4, double liaison 2,3, OH en 3 (« one + ol »). Ex. kaempférol, quercétol."}, {"id": "ch5b-010", "t": "Classe", "q": "Caractéristiques d’une flavanone ?", "a": "2,3-dihydroflavone : cétone en 4, pas de OH en 3, pas de double liaison 2,3 → 1 centre d’asymétrie supplémentaire (C2). Ex. naringénol, ériodictyol."}, {"id": "ch5b-011", "t": "Classe", "q": "Caractéristiques d’un dihydroflavonol ?", "a": "Cétone en 4, OH en 3, pas de double liaison 2,3 → 2 centres d’asymétrie (C2 et C3). Ex. dihydroquercétol (taxifoline)."}, {"id": "ch5b-012", "t": "Comparaison", "q": "Apigénol vs lutéolol ?", "a": "Deux flavones ; apigénol : R=H (1 OH sur B en 4′) ; lutéolol : R=OH (3′,4′-diOH)."}, {"id": "ch5b-013", "t": "Comparaison", "q": "Kaempférol vs quercétol ?", "a": "Deux flavonols ; kaempférol : 4′-OH seul ; quercétol : 3′,4′-diOH."}, {"id": "ch5b-014", "t": "Comparaison", "q": "Naringénol vs ériodictyol ?", "a": "Deux flavanones ; naringénol R=H (4′-OH), ériodictyol R=OH (3′,4′-diOH)."}, {"id": "ch5b-015", "t": "Structure", "q": "Qu’est-ce que l’hopéine ?", "a": "8-prénylnaringénine : flavanone (naringénine) portant une chaîne prényle (5 C) en C8 ; phyto-œstrogène du houblon."}, {"id": "ch5b-016", "t": "Définition", "q": "Qu’est-ce qu’un biflavonoïde ?", "a": "Dimère (surtout de flavones/flavanones) lié par des liaisons C–C (C6-C8″, C8-C8″, C3-C8″) ou C–O–C ; OH souvent méthylés ; peu d’hétérosides."}, {"id": "ch5b-017", "t": "Définition", "q": "Que désigne le terme « flavonoïdes » ?", "a": "Terme général englobant génines et hétérosides (plus correct d’appeler ces derniers « hétérosides flavonoïdiques »)."}, {"id": "ch5b-018", "t": "Définition", "q": "Composition de la partie osidique des hétérosides flavonoïdiques ?", "a": "Mono-, di- ou trisaccharidique ; monosides : galactose, glucose, rhamnose, pentoses… Liaison le plus souvent O-hétérosidique, parfois C-hétérosidique."}, {"id": "ch5b-019", "t": "Pourquoi ?", "q": "Position préférentielle du sucre chez les flavones, flavanones et flavonols ?", "a": "Flavones et flavanones (pas de OH en 3) : sur le phénol en 7. Flavonols : sur le OH en 3."}, {"id": "ch5b-020", "t": "Structure", "q": "Qu’est-ce que le rutinose ?", "a": "Disaccharide O-α-L-rhamnosyl-(1→6)-glucose."}, {"id": "ch5b-021", "t": "Structure", "q": "Qu’est-ce que le néohespéridose ?", "a": "Disaccharide O-α-L-rhamnosyl-(1→2)-glucose."}, {"id": "ch5b-022", "t": "Définition", "q": "Comment se fait la liaison du disaccharide avec la génine dans un O-hétéroside ?", "a": "Entre le OH hémiacétalique du glucose et un OH (phénolique) de la génine."}, {"id": "ch5b-023", "t": "Structure", "q": "Quels sucres portent quercitroside, hypéroside, isoquercitroside et rutoside (en 3 du quercétol) ?", "a": "Quercitroside : rhamnose ; hypéroside : galactose ; isoquercitroside : glucose ; rutoside : rutinose."}, {"id": "ch5b-024", "t": "Structure", "q": "Dessinez la diosmine.", "a": "Flavone : diosmétol (5,7,3′-OH ; 4′-OCH3) avec rutinose sur le OH en 7."}, {"id": "ch5b-025", "t": "Structure", "q": "Dessinez le rutoside.", "a": "Flavonol : quercétol avec rutinose (Rha α1→6 Glc) en 3."}, {"id": "ch5b-026", "t": "Structure", "q": "Dessinez le naringoside.", "a": "Flavanone : naringénol + néohespéridose (Rha α1→2 Glc) en 7."}, {"id": "ch5b-027", "t": "Définition", "q": "Qu’est-ce qu’un C-hétéroside ? Exemples ?", "a": "Hétéroside dont le sucre est lié par une liaison C–C (pas C–O) à la génine. Vitexine (glucose en C8 ; passiflore, aubépine), isovitexine (glucose en C6)."}, {"id": "ch5b-028", "t": "Comparaison", "q": "O-hétérosides vs C-hétérosides flavonoïdiques ?", "a": "O : liaison C–O (acétal), fréquents, hydrolysables (acide + chaleur). C : liaison C–C plus stable, plus difficilement hydrolysables, moins fréquents."}, {"id": "ch5b-029", "t": "Méthode", "q": "Solubilité des hétérosides flavonoïdiques ?", "a": "Toujours plus polaires que les génines ; solubles dans acétone, méthanol, éthanol + 20 à 50 % d’eau, à chaud. Certains ont une hydrosolubilité très faible."}, {"id": "ch5b-030", "t": "Méthode", "q": "Solubilité des génines flavonoïdiques ?", "a": "Solubles dans les solvants organiques moins polaires (extractibles par ceux-ci) ; si au moins 1 OH phénolique libre, solubles dans les hydroxydes alcalins."}, {"id": "ch5b-031", "t": "Usage", "q": "Pourquoi les flavonoïdes protègent-ils les membranes ?", "a": "Piégeurs de radicaux libres : empêchent les dégradations, notamment des phospholipides membranaires ; plus de phénols sur B = plus antioxydant."}, {"id": "ch5b-032", "t": "Usage", "q": "Inhibition de l’histidine décarboxylase par les flavonoïdes : conséquence ?", "a": "Empêche la formation d’histamine → effet anti-allergique."}, {"id": "ch5b-033", "t": "Usage", "q": "Inhibition de la 5-lipoxygénase et de la COX par les flavonoïdes : conséquence ?", "a": "Effets anti-inflammatoires et anti-allergiques."}, {"id": "ch5b-034", "t": "Usage", "q": "Inhibition de l’élastase et de l’hyaluronidase : conséquences ?", "a": "Élastase : empêche la dégradation du collagène. Hyaluronidase : conservation de la gaine vasculaire."}, {"id": "ch5b-035", "t": "Usage", "q": "Inhibition de la COMT par les flavonoïdes : conséquence ?", "a": "Augmente les catécholamines → élévation de la résistance capillaire."}, {"id": "ch5b-036", "t": "Usage", "q": "Inhibition de la phosphodiestérase de l’AMPc : conséquence ?", "a": "Effet anti-agrégant plaquettaire."}, {"id": "ch5b-037", "t": "Usage", "q": "Effets des flavonoïdes dans l’insuffisance veineuse ?", "a": "Diminuent la perméabilité des capillaires, renforcent leur résistance, augmentent le tonus veineux et la microcirculation (veinotropes, capillarotropes) : jambes lourdes, crampes, hémorroïdes."}, {"id": "ch5b-038", "t": "Définition", "q": "Qu’est-ce que l’insuffisance veineuse ?", "a": "Détérioration des parois veineuses et perte d’élasticité (tabac, alimentation grasse, station debout, âge…) → stase veineuse : jambes lourdes, enflées, douloureuses."}, {"id": "ch5b-039", "t": "Usage", "q": "Autres indications des flavonoïdes ?", "a": "Anti-inflammatoires, anti-allergiques, diurétiques ; certains hépatoprotecteurs, antispasmodiques, antibactériens, antiviraux ; anxiolytiques/sédatifs chez la souris (passiflore, aubépine, valériane)."}, {"id": "ch5b-040", "t": "Origine", "q": "Origine du rutoside ?", "a": "Boutons floraux de Sophora japonica (grand arbre de Chine), 15 à 30 % juste avant l’épanouissement."}, {"id": "ch5b-041", "t": "Pourquoi ?", "q": "Pourquoi a-t-on développé la troxérutine ?", "a": "Le rutoside est très peu soluble : la troxérutine (3′,4′,7-tris-(hydroxyéthyl)-rutoside) est facilement soluble dans l’eau (mais serait moins active) ; insuffisance veineuse ; Ph. Eur."}, {"id": "ch5b-042", "t": "Comparaison", "q": "Diosmine vs hespéridoside ?", "a": "Deux O-hétérosides de rutinose en 7 ; diosmine = flavone (double liaison 2,3), hespéridoside = flavanone (pas de double liaison 2,3). C’est la seule différence."}, {"id": "ch5b-043", "t": "Origine", "q": "Origine et forme d’extraction de la diosmine et de l’hespéridine ?", "a": "Péricarpe des Citrus, extraits sous forme de dérivés Ca ou Mg ; utilisés en mélange (≈ 9/1) dans l’insuffisance veineuse."}, {"id": "ch5b-044", "t": "Pourquoi ?", "q": "Qu’est-ce qui rend le naringoside amer ?", "a": "Le néohespéridose : liaison Rha α(1→2) Glc indispensable ; le rutinoside de naringénol (1→6) n’est pas amer."}, {"id": "ch5b-045", "t": "Comparaison", "q": "Hespéridoside vs néohespéridoside ?", "a": "Même génine (hespérétol) ; hespéridoside = rutinose (1→6), pas amer ; néohespéridoside = néohespéridose (1→2), amer."}, {"id": "ch5b-046", "t": "Méthode", "q": "Comment obtient-on la naringoside dihydrochalcone ?", "a": "Hémisynthèse : ouverture du cycle pyranique (2 h dans KOH 25 %) puis saturation de la double liaison formée (réduction Pd + H2)."}, {"id": "ch5b-047", "t": "Usage", "q": "Pouvoir sucrant des dihydrochalcones ?", "a": "Naringoside DHC : 500 × le saccharose ; néohespéridoside DHC : 1000–1800 × (E 959, USA et Europe)."}, {"id": "ch5b-048", "t": "Pourquoi ?", "q": "Conclusion structure–saveur pour les flavanones de Citrus ?", "a": "La liaison α(1→2) du néohespéridose est indispensable pour l’amertume ET pour la saveur sucrée ; une simple ouverture du cycle central transforme l’amer en sucré."}, {"id": "ch5b-049", "t": "Pourquoi ?", "q": "Pourquoi le mannose est-il doux-amer et le penta-acétyl-glucose amer ?", "a": "Les récepteurs amer et sucré de la langue sont très proches (3–4 Å) : une petite modification de structure suffit à passer de l’un à l’autre."}, {"id": "ch5b-050", "t": "Classe", "q": "Quels sont les 2 types de phyto-œstrogènes flavonoïdiques ?", "a": "Les isoflavones et les flavonoïdes prénylés."}, {"id": "ch5b-051", "t": "Classe", "q": "Qu’est-ce qu’une isoflavone ?", "a": "Dérivé du 3-phénylchromone (cycle B fixé en C3). Ex. génistéine (daïdzéine = sans OH en 5)."}, {"id": "ch5b-052", "t": "Structure", "q": "Dessinez la génistéine.", "a": "Isoflavone : 5,7-dihydroxy-3-(4-hydroxyphényl)chromone."}, {"id": "ch5b-053", "t": "Origine", "q": "Sources des isoflavones ?", "a": "Graines de soja (populations asiatiques), trèfle, luzerne."}, {"id": "ch5b-054", "t": "Toxicité", "q": "Quel effet indésirable des isoflavones a été observé chez l’animal ?", "a": "Infertilité des ovins australiens consommant du trèfle rouge en excès (moins actives chez les vaches : métabolisme différent)."}, {"id": "ch5b-055", "t": "Définition", "q": "Rôle des isoflavones chez les végétaux ?", "a": "Beaucoup sont des phytoalexines (produites en réponse à une infection, souvent fongique) ; certains dérivés (roténoïdes) sont insecticides."}, {"id": "ch5b-056", "t": "Pourquoi ?", "q": "Comment agissent les isoflavones comme phyto-œstrogènes ?", "a": "Après métabolisation (hydrolyse intestinale des hétérosides inactifs, métabolites comme l’équol), elles se lient aux récepteurs des œstrogènes (similarité avec le 17β-œstradiol) : œstrogènes faibles."}, {"id": "ch5b-057", "t": "Usage", "q": "Effets thérapeutiques attribués aux isoflavones ?", "a": "Inhibiteurs de tyrosine-kinase (↓ prolifération ; cancers du sein/prostate ?), génistéine anticancérigène (rattes), ↓ manifestations de la ménopause et risque d’ostéoporose."}, {"id": "ch5b-058", "t": "Origine", "q": "Drogue et famille du houblon ?", "a": "Humulus lupulus, Cannabaceae ; drogue : fleurs femelles (cônes à glandes à lupuline)."}, {"id": "ch5b-059", "t": "Usage", "q": "Propriétés du houblon et de la 8-prénylnaringénine ?", "a": "Houblon : apaisant, soporifique, bière. 8-PN (hopéine) : phyto-œstrogène soulageant la ménopause, actif à très faible dose (bien plus faible que les isoflavones)."}, {"id": "ch5b-060", "t": "Classe", "q": "Flavan-3-ols vs flavan-3,4-diols ?", "a": "Dérivés du 2-phénylchromane sans cétone en 4 ; flavan-3-ols : OH en 3 (catéchol, gallocatéchol) ; flavan-3,4-diols : OH en 3 et 4 ; précurseurs des tanins catéchiques."}, {"id": "ch5b-061", "t": "Classe", "q": "Qu’est-ce qu’une chalcone ?", "a": "Pas d’hétérocycle central ; chaîne tricarbonée cétonique α,β-insaturée entre A et B ; précurseur des flavonoïdes. Ex. isoliquiritigénine (réglisse)."}, {"id": "ch5b-062", "t": "Classe", "q": "Qu’est-ce qu’une aurone ?", "a": "Hétérocycle pentagonal (benzofuranone) ; rares ; pigments des fleurs de Chrysanthellum indicum."}, {"id": "ch5b-063", "t": "Classe", "q": "Qu’est-ce qu’un flavanolignane ?", "a": "Produit d’un couplage mixte entre un flavonoïde (taxifoline) et une unité phénylpropanique (alcool coniférylique). Les lignanes, eux, couplent 2 unités phénylpropaniques."}, {"id": "ch5b-064", "t": "Origine", "q": "Silymarine : origine et composition ?", "a": "Fruits mûrs du chardon-Marie (Silybum marianum = Carduus marianus) ; complexe de flavanolignanes dont la silibinine est majoritaire."}, {"id": "ch5b-065", "t": "Usage", "q": "Indications de la silymarine ?", "a": "Hépatoprotecteur : hépatite, cirrhose, calculs biliaires, ictère, dommages hépatotoxiques ; préventif contre CCl4, phalloïdine, alcool, médicaments."}, {"id": "ch5b-066", "t": "Méthode", "q": "Dans quelle substance la teneur en silymarine du fruit de chardon-Marie est-elle exprimée (Ph. Eur.) ?", "a": "En silibinine."}, {"id": "ch5b-067", "t": "Classe", "q": "Structure inconnue : 2-phénylchromone, cétone en 4, double liaison 2,3, OH en 3, sucre en 3. Classe ?", "a": "Flavonoïde → flavonol, O-hétéroside (type rutoside)."}, {"id": "ch5b-068", "t": "Classe", "q": "Structure inconnue : cycle B en C3 d’une chromone. Classe ?", "a": "Isoflavonoïde (isoflavone), phyto-œstrogène probable."}, {"id": "ch5b-069", "t": "Classe", "q": "Structure inconnue : 2-phénylchromanone sans double liaison 2,3, sans OH en 3. Classe ?", "a": "Flavanone (2,3-dihydroflavone)."}, {"id": "ch5b-070", "t": "Comparaison", "q": "Flavanone vs flavanol : ne pas confondre !", "a": "Flavanone = cétone en 4 sans double liaison 2,3 ; flavanol (flavan-3-ol) = pas de cétone, OH en 3 (catéchines)."}, {"id": "ch5b-071", "t": "Méthode", "q": "Les génines flavonoïdiques : H2O ou SO ? Réaction avec NaOH ?", "a": "SO (solvants organiques peu polaires). OUI + NaOH (phénols libres → phénolates solubles)."}, {"id": "ch5b-072", "t": "Méthode", "q": "Les hétérosides flavonoïdiques réagissent-ils avec HCl à froid ?", "a": "Non : l’hydrolyse acide des O-hétérosides nécessite un chauffage ; pas de fonction basique à salifier."}, {"id": "ch5c-001", "t": "Définition", "q": "Étymologie du mot anthocyane ?", "a": "Grec anthos (fleur) et kuanos (bleu) : couleur de la fleur de bleuet (Centaurea cyanus)."}, {"id": "ch5c-002", "t": "Définition", "q": "Que sont les anthocyanes ?", "a": "Pigments hydrosolubles responsables de la coloration rouge, rose, bleue, violette de la plupart des fleurs et des fruits."}, {"id": "ch5c-003", "t": "Définition", "q": "Rôles des anthocyanes dans la nature ?", "a": "Pollinisation (fleurs colorées attirant les insectes) et dispersion des graines (fruits colorés attirant les oiseaux)."}, {"id": "ch5c-004", "t": "Structure", "q": "Noyau de base des anthocyanes ?", "a": "2-phénylbenzopyrylium = cation flavylium (O+ dans le cycle C, contre-ion X−)."}, {"id": "ch5c-005", "t": "Définition", "q": "Origine biosynthétique des anthocyanes ?", "a": "Métabolisme des flavonoïdes ; les flavan-3,4-diols seraient leurs précurseurs."}, {"id": "ch5c-006", "t": "Pourquoi ?", "q": "D’où vient la couleur des anthocyanes ?", "a": "De la conjugaison des doubles liaisons du noyau central (pyrylium) avec les cycles aromatiques."}, {"id": "ch5c-007", "t": "Structure", "q": "Substitutions des anthocyanidols ?", "a": "Toujours hydroxylés en 3 ; OH ou OCH3 en 5, 7, 4′ ; souvent substitution en 3′, plus rarement 3′ et 5′."}, {"id": "ch5c-008", "t": "Définition", "q": "Que sont les 3-déoxyanthocyanes ?", "a": "Anthocyanes sans OH en 3, très rares (ex. Arrabidaea chica, colorant colombien précolombien)."}, {"id": "ch5c-009", "t": "Définition", "q": "Anthocyanidols vs anthocyanosides ?", "a": "Anthocyanidols (anthocyanidines) = génines, cationiques en milieu acide ; anthocyanosides = hétérosides. « Anthocyane » = terme général pour les deux."}, {"id": "ch5c-010", "t": "Structure", "q": "Pélargonidol, cyanidol, delphinidol : substituants et couleurs ?", "a": "Pélargonidol R1=R2=H (rouge éclatant) ; cyanidol R1=OH, R2=H (rouge foncé tirant sur le violet) ; delphinidol R1=R2=OH (pourpre)."}, {"id": "ch5c-011", "t": "Structure", "q": "Dessinez le cyanidol.", "a": "Cation flavylium 3,5,7,3′,4′-pentahydroxylé."}, {"id": "ch5c-012", "t": "Définition", "q": "Qu’est-ce qu’un métalloanthocyanoside ?", "a": "Complexe de PM élevé : 6 anthocyanosides + 6 flavonoïdes chélatant 2 atomes de Mg et/ou Fe."}, {"id": "ch5c-013", "t": "Structure", "q": "Positions et sucres habituels des anthocyanosides ?", "a": "Souvent 3-monosides ou 3,5-biosides ; monosaccharides (glucose, galactose, rhamnose) ou disaccharides (rutinose, xylosylglucose)."}, {"id": "ch5c-014", "t": "Origine", "q": "Quel est l’anthocyanoside majoritaire du raisin et du vin jeune ?", "a": "Le 3-glucoside de malvidine (œnine)."}, {"id": "ch5c-015", "t": "Structure", "q": "Par quoi les anthocyanosides peuvent-ils être acylés ?", "a": "Acides aromatiques phénylpropanoïques (p-coumarique, caféique, férulique) ou benzoïques (gallique), acides aliphatiques dicarboxyliques, ou les deux (savoir commenter, pas dessiner)."}, {"id": "ch5c-016", "t": "Définition", "q": "Forme d’un anthocyane à pH < 3 ?", "a": "Cation flavylium, forme stable, coloration violette/rouge ; bon électrophile, diacide faible (2 OH phénoliques)."}, {"id": "ch5c-017", "t": "Définition", "q": "Forme d’un anthocyane à pH 4-5 ?", "a": "Hémiacétal carbinol incolore (addition d’eau ; rupture de la conjugaison)."}, {"id": "ch5c-018", "t": "Définition", "q": "Formes à 3 < pH < 7 et à pH > 7 ?", "a": "3 < pH < 7 : anhydrobases neutres (formes quinoïdes colorées). pH > 7 : anhydrobases ionisées (quinoïdes colorées, bleues) ; chalcone jaune surtout à pH > 7."}, {"id": "ch5c-019", "t": "Pourquoi ?", "q": "Condition structurale pour former des structures quinoïdes ?", "a": "Au moins un OH libre en 5, 7 ou 4′."}, {"id": "ch5c-020", "t": "Définition", "q": "Expérience des fleurs de mauve séchées dans l’eau ?", "a": "pH ≈ 7 : bleu ; en acidifiant : bleu → violet → mauve → rouge ; en alcalinisant : turquoise, vert puis jaune (idem chou rouge, purée de pomme de terre bleue)."}, {"id": "ch5c-021", "t": "Pourquoi ?", "q": "Pourquoi les solutions d’anthocyanosides se décolorent-elles en milieu neutre ou peu acide ?", "a": "L’hydratation du cation en carbinol incolore est plus rapide que sa transformation en anhydrobase colorée."}, {"id": "ch5c-022", "t": "Pourquoi ?", "q": "Comment expliquer la coloration des plantes alors que le pH vacuolaire dépasse rarement 3 ?", "a": "Stabilisation de la structure : auto-association (auto-copigmentation), adsorption sur macromolécules (protéines, pectines), copigmentation intramoléculaire (sandwich sucres + acides acylants), copigmentation intermoléculaire (flavonoïdes) et complexation métallique."}, {"id": "ch5c-023", "t": "Définition", "q": "Qu’est-ce que l’auto-association (auto-copigmentation) ?", "a": "Empilement intermoléculaire d’anthocyanosides qui se protègent mutuellement (de l’hydratation)."}, {"id": "ch5c-024", "t": "Définition", "q": "Qu’est-ce que la copigmentation intramoléculaire ?", "a": "Dans un même anthocyanoside acylé, les acides acylants (ac. caféique…) et les sucres se replient et forment un « sandwich » autour de l’anthocyanidine."}, {"id": "ch5c-025", "t": "Définition", "q": "Qu’est-ce que la copigmentation intermoléculaire ?", "a": "Empilement de l’anthocyanidine avec d’autres molécules (copigments, ex. flavonoïdes), éventuellement avec complexation de métaux (Mg)."}, {"id": "ch5c-026", "t": "Méthode", "q": "Facteurs d’instabilité des anthocyanosides isolés ?", "a": "Eau, oxygène, lumière, température élevée."}, {"id": "ch5c-027", "t": "Méthode", "q": "Comment stabiliser les anthocyanosides ?", "a": "Par le dioxyde de soufre : dérivés sulfoniques en C4 stables (réaction réversible)."}, {"id": "ch5c-028", "t": "Méthode", "q": "Comment extrait-on les anthocyanes ?", "a": "Par un alcool + 0,1 à 1 % d’HCl ou d’acide trifluoroacétique (volatil), sous la forme cationique ; séparation sur colonne RP8 ou résine échangeuse d’ions."}, {"id": "ch5c-029", "t": "Usage", "q": "Activités pharmacologiques des anthocyanes ?", "a": "Piégeurs de radicaux libres ; inhibiteurs de l’élastase et de la collagénase (collagène des parois vasculaires) et de l’hyaluronidase ; veino-actifs."}, {"id": "ch5c-030", "t": "Usage", "q": "Emplois thérapeutiques des anthocyanes ?", "a": "Insuffisance veineuse et surtout ophtalmologie : troubles circulatoires de la rétine ou de la choroïde, amélioration de la vision crépusculaire."}, {"id": "ch5c-031", "t": "Usage", "q": "
