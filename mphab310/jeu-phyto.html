}, {"id": "p:ch1:10", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Carraghénanes** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène : galactanes sulfatés\n**Source** : Algues rouges\n**Usage** : Gélifiants, épaississants ; protecteurs de la muqueuse gastrique, laxatif mécanique"}, {"id": "p:ch1:11", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Gommes (arabique, adragante, sterculia)** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogènes très ramifiées : oses + acides uroniques\n**Source** : Exsudats d'arbres (naturels ou après blessure) : Acacia, Astragalus, Sterculia\n**Usage** : Gélifiants, épaississants, émulsionnants ; adoucissants (sirops) ; **sterculia = laxatif de lest**"}, {"id": "p:ch1:12", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Mucilages** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogènes (galactomannanes : mannose + galactose)\n**Source** : Albumen/tégument des graines : lin, psyllium (ispaghul), guar, fenugrec\n**Usage** : Laxatifs de lest, émollients, adoucissants"}, {"id": "p:ch1:13", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Pectines** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène : acide D-galacturonique α1→4 (partiellement méthylé), coudes de rhamnose (1→2) + ramifications\n**Source** : Fruits : Citrus (zestes), pommes (marc), coings\n**Usage** : Gélifiant (confitures) ; affections gastro-intestinales (diarrhées) : protection de la muqueuse, adsorption des toxines, activité bactériostatique"}, {"id": "p:ch1:14", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Gomme xanthane** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène : chaîne Glc β1→4 ; tous les 2 Glc, chaîne latérale mannose–ac. glucuronique–mannose (unité pentasaccharidique acétylée, pyruvylée → anionique)\n**Source** : Bactérie *Xanthomonas campestris*\n**Usage** : Stabilisant/épaississant de 1ᵉʳ choix des suspensions et émulsions ; pseudoplastique ; stable sur large gamme de pH et de T°, compatible avec les sels, non dégradé par les enzymes, sans goût"}, {"id": "p:ch1:15", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Acide hyaluronique** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène aminé : ac. D-glucuronique + N-acétylglucosamine (β1→3 / β1→4 alternées)\n**Source** : Humeur vitrée, liquide synovial ; industriellement crêtes de coq ou fermentation bactérienne\n**Usage** : Lubrifiant / amortisseur articulaire (arthrose du genou), chirurgie ophtalmique (cataracte, greffe de cornée), médecine esthétique (comblement des rides, moins allergisant que le collagène)"}, {"id": "p:ch1:16", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Chondroïtine sulfate** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène aminé : ac. glucuronique β1→3 N-acétylgalactosamine sulfatée ; unités reliées en β1→4\n**Source** : Cartilage de mammifères (traitement à la papaïne)\n**Usage** : Chondroprotecteur : anti-arthrosique symptomatique d'action lente (complément alimentaire) ; larmes artificielles"}, {"id": "p:ch1:17", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Héparines** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Glycosaminoglycanes : disaccharides trisulfatés (ac. iduronique-2-O-sulfate + glucosamine-N-sulfate-6-O-sulfate), liaisons α1→4/β1→4 ; pentasaccharide avec glucosamine-3-O-sulfate indispensable\n**Source** : Muqueuse intestinale de porc, poumon de bœuf\n**Usage** : Anticoagulant : active l'antithrombine III → inhibe thrombine et facteur Xa ; IV ou SC (sels Na/Ca). HNF vs HBPM (hydrolyse partielle, demi-vie plus longue, SC). Fondaparinux = pentasaccharide de synthèse (anti-Xa). EI : **hémorragie**, thrombopénie ; antidote **protamine**. Contrôle Ph. Eur. : absence de chondroïtine persulfatée (accidents allergiques graves) — RMN, électrophorèse capillaire"}, {"id": "p:ch1:18", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Tagatose** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Cétohexose (épimère du fructose en C4 = galactulose) — pas un polysaccharide\n**Source** : Lactose → galactosidase → galactose → isomérisation\n**Usage** : Édulcorant peu calorique, non cariogène, sans effet sur la glycémie, prébiotique"}, {"id": "p:ch1:19", "lab": "Tombé à l'examen · Q6 polysaccharides", "q": "**Lactitol** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Polyol disaccharidique (galactosyl-sorbitol), issu de la réduction du lactose\n**Source** : Lactose\n**Usage** : Laxatif osmotique ; édulcorant"}, {"id": "p:ch1:20", "lab": "Nouvelle question au format examen", "q": "Dessinez le glucose en Fischer et en Haworth (α et β). Distinguez D/L, α/β, pyranose/furanose", "r": "Fischer : chaîne verticale, C1 aldéhyde en haut ; **D** = OH du C5 (dernier C asymétrique) à droite. Haworth : cycle à 6 (pyranose = 5 C + O) ; **α** = OH anomérique en C1 du côté opposé au CH₂OH (en bas), **β** = même côté (en haut). Fructose : cétose, cycle à 5 (furanose) dans le saccharose et l'inuline. Mutarotation = interconversion α/β via la forme ouverte (sucres réducteurs).", "img": ["img/schemas/ch1-glucose-representations.png", "img/schemas/ch1-glucose-haworth.png", "img/schemas/ch1-types-oses.png"]}, {"id": "p:ch1:21", "lab": "Nouvelle question au format examen", "q": "Distinguez ose classique, désoxyose, acide uronique, polyol, ose aminé : un exemple et un intérêt de chacun", "r": "Type — Modification — Exemples — Intérêt\nOse classique — — — Glucose, galactose, mannose, fructose, ribose, xylose — Énergie, constituants\nDésoxyose — Un OH remplacé par H — Rhamnose (6-désoxymannose), désoxyribose (ADN), fucose, digitoxose — Sucres des hétérosides (rutinose) ; ADN\nAcide uronique — C6 oxydé en COOH — Ac. glucuronique, galacturonique — Gommes, pectines, GAG ; glucuroconjugaison (détoxification hépatique)\nAcide aldonique — C1 oxydé — Ac. gluconique — Gluconates (Ca, Fe)\nPolyol — C=O réduit en alcool — Sorbitol, mannitol, xylitol — Édulcorants non cariogènes, laxatifs osmotiques, diurétique osmotique (mannitol IV)\nOse aminé — OH en C2 remplacé par NH₂ — Glucosamine, galactosamine — Chitine, GAG ; glucosamine anti-arthrosique"}, {"id": "p:ch1:22", "lab": "Nouvelle question au format examen", "q": "Sorbitol, mannitol, xylitol : origine, propriétés, usages, effets indésirables", "r": "**Sorbitol** : réduction (hydrogénation) du glucose ; présent dans les fruits de Rosacées (sorbier) ; édulcorant (diabétiques, chewing-gums), humectant, excipient, laxatif osmotique, intermédiaire de synthèse de la vit. C. **Mannitol** : réduction du mannose ; manne du frêne, algues ; **diurétique osmotique IV** (œdème cérébral), excipient de comprimés (non hygroscopique). **Xylitol** : réduction du xylose (bois de bouleau) ; pouvoir sucrant ≈ saccharose, effet rafraîchissant, **anti-carie**. EI communs : ballonnements, diarrhée osmotique à forte dose. Xylitol très toxique pour le chien."}, {"id": "p:ch1:23", "lab": "Nouvelle question au format examen", "q": "Saccharose, maltose, lactose : oses, liaisons, caractère réducteur. Pourquoi 2 anomères pour le maltose et le lactose et pas pour le saccharose ? Différence saccharose / miel ?", "r": "Saccharose = α-D-Glc(1→2)β-D-Fru : les 2 C anomériques sont engagés → **non réducteur**, pas de mutarotation, une seule forme. Maltose = Glc α1→4 Glc ; lactose = Gal β1→4 Glc : le C1 du glucose terminal est **libre** → réducteurs, existent en **α et β** (mutarotation). Miel = surtout **sucre interverti** (glucose + fructose libres, issus de l'invertase des abeilles), plus riche en fructose, un peu de saccharose, eau, enzymes, traces de composés phénoliques ; sirop simple = saccharose dans l'eau."}, {"id": "p:ch1:24", "lab": "Nouvelle question au format examen", "q": "Lactulose et lactitol : structure, origine, usages", "r": "**Lactulose** = Gal β1→4 Fru (isomérisation du lactose en milieu alcalin) ; non hydrolysé dans l'intestin grêle → fermenté par la flore colique en acides organiques → **laxatif osmotique** ; acidification → ↓ absorption de NH₃ → **encéphalopathie hépatique** ; prébiotique. **Lactitol** = galactosyl-sorbitol (hydrogénation du lactose) ; laxatif osmotique, édulcorant."}, {"id": "p:ch1:25", "lab": "Nouvelle question au format examen", "q": "Rutinose vs néohespéridose : structure et conséquence gustative", "r": "Tous deux = **rhamnose + glucose**. Rutinose : Rha α1→**6** Glc (rutoside, hespéridoside → **non amers**). Néohespéridose : Rha α1→**2** Glc (naringoside, néohespéridoside → **amers**). L'ouverture du naringoside en chalcone puis hydrogénation → **néohespéridine dihydrochalcone** (NHDC) = édulcorant intense."}, {"id": "p:ch1:26", "lab": "Nouvelle question au format examen", "q": "Maltodextrines, cyclodextrines, acarbose : comparez", "r": "**Maltodextrines** : hydrolyse partielle de l'amidon (DE < 20), chaînes linéaires α1→4 ; énergie (nutrition sportive, entérale), excipient, agent de charge. **Cyclodextrines** : 6 (α), 7 (β) ou 8 (γ) glucoses α1→4 **en anneau** (action d'une glucosyltransférase bactérienne) ; extérieur hydrophile, **cavité hydrophobe** → **complexes d'inclusion** : ↑ solubilité, stabilité, masquage du goût de principes actifs. **Acarbose** : pseudo-tétrasaccharide d'origine bactérienne (*Actinoplanes*) ; **inhibiteur des α-glucosidases** intestinales → ↓ glycémie post-prandiale (diabète de type 2) ; EI : flatulences, diarrhée.", "img": ["img/schemas/ch1-cyclodextrines.png"]}, {"id": "p:ch1:27", "lab": "Nouvelle question au format examen", "q": "Prébiotique, probiotique, fibre alimentaire : définissez et donnez des exemples", "r": "**Prébiotique** : substrat non digestible, fermenté sélectivement par la flore colique bénéfique (bifidobactéries, lactobacilles) → effet santé : FOS, inuline, lactulose, GOS (lait). **Probiotique** : micro-organismes vivants bénéfiques en quantité suffisante (lactobacilles, bifidobactéries, *Saccharomyces boulardii*). **Fibres** : polysaccharides non α-glucanes + lignine, non digérés dans l'intestin grêle ; insolubles (cellulose, hémicelluloses, lignine : transit, lest) et solubles (pectines, gommes, mucilages, inuline : gel, satiété, ↓ cholestérol et pic glycémique, prébiotiques)."}, {"id": "p:ch1:28", "lab": "Nouvelle question au format examen", "q": "Gel d'aloès vs latex (suc) d'aloès : ne pas confondre", "r": "**Gel** = parenchyme central des feuilles : polysaccharides (acémannane, glucomannanes acétylés) → hydratant, cicatrisant, brûlures légères (usage cutané, cosmétique). **Latex / suc** = cellules péricycliques sous l'épiderme : **dérivés anthracéniques** (aloïnes A/B = C-hétérosides d'anthrones) → laxatif stimulant. Un gel mal préparé peut être contaminé par l'aloïne."}, {"id": "p:ch1:29", "lab": "Nouvelle question au format examen", "q": "Amidon vs cellulose ; dextrane vs gomme xanthane (comparez)", "r": "Amidon (α1→4 + α1→6, hélicoïdal, réserve, digestible par les amylases) vs cellulose (β1→4, linéaire, fibres H-liées, structurale, non digestible chez l'Homme) ; les deux = glucanes homogènes, excipients. Dextrane (glucane homogène α1→6, bactérien *Leuconostoc*, neutre, soluté de remplissage) vs xanthane (hétérogène anionique, bactérien *Xanthomonas*, épaississant/stabilisant) ; points communs : origine bactérienne, polysaccharides exocellulaires, obtenus par fermentation.", "img": ["img/schemas/ch1-amylose-amylopectine.png", "img/schemas/ch1-cellulose.png"]}, {"id": "p:ch1:30", "lab": "Tombé à l'examen", "q": "Comparez **oligosaccharides et polysaccharides** : points communs et différences.", "r": "communs = oses liés par des liaisons osidiques (C, H, O). Oligosaccharides : 2-10 oses (3-10 au sens strict), solubles dans l'eau et l'alcool dilué, souvent goût sucré ; certains font partie d'hétérosides (rutinose). Polysaccharides : > 10 oses, haut PM, souvent insolubles ou forment des gels/colloïdes ; homogènes (1 seul ose : amidon, cellulose, inuline, dextrane, chitine) ou hétérogènes (plusieurs : gommes, pectines, alginates, agar, xanthane, GAG)."}, {"id": "p:ch1:31", "lab": "Tombé à l'examen", "q": "Un patient veut un prébiotique : conseillez-vous des **GOS** ou des **FOS** ? Pourquoi ?", "r": "conseiller les **fructo-oligosaccharides** (ail, oignon, chicorée) : bifidogènes, prébiotiques (stimulent bifidobactéries et lactobacilles). Les **galacto-oligosaccharides** des légumineuses (raffinose, stachyose : haricots, pois chiches) sont peu digestes et fermentés en gaz → **flatulences**."}, {"id": "p:ch1:32", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Acide ascorbique (vit. C)** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Glucides\n**Solubilité** : dérivé d'ose (lactone, ène-diol)\n**Sans chauffage** : H₂O"}, {"id": "p:ch1:33", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Glucosamine** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Ose aminé\n**Solubilité** : H₂O\n**Sans chauffage** : OUI + HCl (NH₂)"}, {"id": "p:ch1:34", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Sorbitol** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Polyol\n**Solubilité** : H₂O\n**Sans chauffage** : NON"}, {"id": "p:ch1:35", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Vitamine C** ?", "r": "**Vitamine C** : dérivée du glucose (via la voie de l'acide glucuronique) ; lactone à ène-diol, réductrice, antioxydante ; hydroxylation de la proline → collagène ; anti-scorbutique, asthénie, cicatrisation, inhibe la formation des nitrosamines ; additif antioxydant (E300) ; sources : acérola, cynorrhodon, paprika ; production industrielle à partir du glucose via le sorbitol ; métabolisée en oxalate."}, {"id": "p:ch1:36", "lab": "Nouvelle question au format examen", "q": "Comment reconnaître qu'une structure inconnue est un alcaloïde ? Classez : nicotine, caféine, éphédrine, glucosamine, bétanine, capsaïcine, quinine", "r": "Critère : N (le plus souvent hétérocyclique, basique) **en excluant** acides aminés, amines simples, amino-sucres, peptides, alkylamides non cyclisés, bétalaïnes, dérivés nitrés. Nicotine : alcaloïde vrai (pyridine + pyrrolidine). Caféine : pseudo-alcaloïde (purine, non dérivée directement d'un acide aminé, très peu basique). Éphédrine : proto-alcaloïde (N hors cycle). Glucosamine : amino-sucre → **non**. Bétanine : bétalaïne (colorant de la betterave) → **non**. Capsaïcine : alkylamide non cyclisé → **non**. Quinine : alcaloïde vrai (quinoléine + quinuclidine)."}]}, {"id": "ch2", "num": "2", "t": "2. Lipides", "court": "Lipides", "sym": "drop", "fam": "lip", "niveaux": [{"t": "Généralités sur les lipides", "s": "Triglycérides · Acides gras saturés · Acides gras insaturés · ω9", "type": "n", "m": ["glycerol", "triglyceride", "acide-laurique", "acide-palmitique", "acide-stearique", "acide-oleique", "acide-linoleique", "acide-alpha-linolenique", "acide-gamma-linolenique", "epa", "dha"], "q": ["ch2-q01", "ch2-q02", "ch2-q03", "ch2-q14", "ch2-q16", "ch2-q17", "ch2-q18", "ch2-q19", "ch2-q21", "ch2-q27", "ch2-q28", "ch2-q30"], "c": ["ch2-001", "ch2-002", "ch2-003", "ch2-004", "ch2-005", "ch2-006", "ch2-007", "ch2-008", "ch2-009", "ch2-010", "ch2-011", "ch2-013", "ch2-014", "ch2-015", "ch2-016", "ch2-017", "ch2-018", "ch2-019", "ch2-020", "ch2-021", "ch2-022", "ch2-023", "ch2-024", "ch2-025", "ch2-026", "ch2-027", "ch2-028", "ch2-029", "ch2-030", "ch2-031", "ch2-032", "ch2-033", "ch2-046", "ch2-047", "ch2-048", "ch2-049", "ch2-053", "ch2-056", "ch2-064", "ch2-068", "ch2-070", "ch2-081", "ch2-083", "ch2-085", "ch2-086", "ch2-103"], "pl": ["amandier", "arachide", "cocotier", "cacaoyer", "palmier-huile", "tournesol", "sesame", "mais-soja-ble", "noyer", "argan", "bourrache", "onagre", "jojoba"]}, {"t": "ω9 particuliers et ω6", "s": "ω3", "type": "n", "m": ["acide-arachidonique", "acide-ricinoleique", "acide-erucique"], "q": ["ch2-q04", "ch2-q06", "ch2-q10", "ch2-q11", "ch2-q12", "ch2-q13", "ch2-q25", "ch2-q29", "qcm51-3"], "c": ["ch2-034", "ch2-035", "ch2-036", "ch2-037", "ch2-038", "ch2-039", "ch2-040", "ch2-041", "ch2-042", "ch2-043", "ch2-044", "ch2-045", "ch2-050", "ch2-051", "ch2-052", "ch2-054", "ch2-055", "ch2-057", "ch2-058", "ch2-059", "ch2-060", "ch2-061", "ch2-063", "ch2-065", "ch2-066", "ch2-067", "ch2-069", "ch2-071", "ch2-072", "ch2-073", "ch2-074", "ch2-075", "ch2-076", "ch2-077", "ch2-078"], "pl": ["colza", "ricin", "cassis", "foie-morue"]}, {"t": "Équilibre ω6/ω3 et recommandations", "s": "Acides gras trans · Propriétés physico-chimiques des AG et triglycérides · Contrôle de qualité", "type": "n", "m": ["acide-butyrique"], "q": ["ch2-q05", "ch2-q07", "ch2-q08", "ch2-q09", "ch2-q15", "ch2-q24", "ch2-q26"], "c": ["ch2-012", "ch2-079", "ch2-080", "ch2-082", "ch2-084", "ch2-087", "ch2-088", "ch2-089", "ch2-090", "ch2-091", "ch2-092", "ch2-093"], "pl": []}, {"t": "Emplois des huiles", "s": "Insaponifiable · Cires", "type": "n", "m": [], "q": ["ch2-q20", "ch2-q22", "ch2-q23"], "c": ["ch2-062", "ch2-095", "ch2-096", "ch2-097", "ch2-098", "ch2-099", "ch2-100", "ch2-101", "ch2-102", "ch2-104", "ch2-105", "ch2-106", "ch2-107", "ch2-108", "ch2-109", "ch2-110"], "pl": ["carnauba", "abeille", "mouton-lanoline", "kerria"]}, {"t": "Questions d'examen", "s": "13 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch2:0", "lab": "Liste du prof", "q": "Carences en vitamine E alors que les AGPI en apportent ? (chap. 9, dia 20)", "r": "La vitamine E est fortement utilisée pour prévenir l'oxydation des AGPI apportés par la nourriture : il s'agit d'une carence de consommation, pas d'une carence d'apport."}, {"id": "p:ch2:1", "lab": "Question ouverte d'examen", "q": "Expliquez les **indices** d'une huile végétale (acide, saponification, esters, peroxyde) et l'intérêt de les appliquer aux huiles.", "r": "**Indice d'acide** : mg de KOH pour neutraliser les **acides gras libres** d'1 g → altération (hydrolyse), qualité du raffinage.\n**Indice de saponification** : mg de KOH pour neutraliser les AG libres **et** saponifier les esters d'1 g → d'autant plus élevé que les chaînes sont **courtes**.\n**Indice d'esters** = IS – IA.\n**Indice de peroxyde** : oxygène actif (méq O2/kg) → **oxydation / rancissement** des AG insaturés.\n**Intérêt** : contrôle de l'identité, de la pureté et de la conservation (Ph. Eur.), détection des falsifications et de l'altération."}, {"id": "p:ch2:2", "lab": "Question ouverte d'examen", "q": "Comparez les **acides gras saturés et insaturés** (ω9, ω6, ω3, cis / trans) sur le plan chimique et pharmacologique. Donnez un exemple de chaque et une source végétale.", "r": "**Saturés** (butyrique C4, laurique C12, palmitique C16, stéarique C18) : pas de double liaison, solides, **stables** à l'oxydation, ↑ LDL.\n**Insaturés** : liquides, **oxydables**. Nomenclature ω depuis le CH3 terminal : **ω9** oléique (olivier) ; **ω6** linoléique (tournesol), γ-linolénique (bourrache, onagre), arachidonique ; **ω3** α-linolénique (lin, noix, colza), EPA et DHA (poissons gras).\nLA et ALA sont **essentiels**. AG naturels **cis (Z)** ; les **trans** proviennent de l'hydrogénation ou du chauffage."}, {"id": "p:ch2:3", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Acide laurique / palmitique / AG en C16** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Lipides\n**Solubilité** : AG saturé C12:0 / C16:0\n**Sans chauffage** : SO"}, {"id": "p:ch2:4", "lab": "Tombé à l'examen", "q": "Dessinez et commentez 2 AG (ALA, GLA, DHA, EPA, oléique, arachidonique) : source, utilisation, stabilité", "r": "AG — Formule — ω — Source principale — À dire\nButyrique — C4:0 — — — Beurre — Saturé, court\nLaurique — C12:0 — — — Coprah (coco), palmiste — Saturé\nPalmitique — C16:0 — — — Huile de palme, beurre de cacao — Saturé ; ↑ LDL-cholestérol\nStéarique — C18:0 — — — Beurre de cacao, graisses animales — Saturé\n**Oléique** — C18:1 Δ9 (cis) — ω9 — Huile d'olive — Mono-insaturé, stable, effet favorable sur le profil lipidique\nRicinoléique — C18:1 Δ9, 12-OH — ω9 — Huile de ricin — Laxatif stimulant (purgatif)\nÉrucique — C22:1 Δ13 — ω9 — Anciennes variétés de colza (moutarde) — Cardiotoxique (lipidose myocardique) → colza « 00 » à faible teneur\n**Linoléique (LA)** — C18:2 Δ9,12 — ω6 — Tournesol, maïs, soja — **Essentiel** ; précurseur de GLA → DGLA → arachidonique\n**γ-linolénique (GLA)** — C18:3 Δ6,9,12 — ω6 — Bourrache, onagre, pépins de cassis — Formé à partir de LA (Δ6-désaturase, conversion freinée par âge, diabète, alcool, cholestérol, AG trans) → DGLA → eicosanoïdes de série 1 anti-inflammatoires ; eczéma atopique, peau sèche, syndrome prémenstruel\nArachidonique — C20:4 Δ5,8,11,14 — ω6 — Jaune d'œuf, tissus animaux (absent des huiles végétales) — Précurseur des eicosanoïdes de série 2 (pro-inflammatoires)\n**α-linolénique (ALA)** — C18:3 Δ9,12,15 — ω3 — Lin, colza, noix, cameline, chia — **Essentiel** ; précurseur (faible conversion) d'EPA et DHA ; très oxydable → conserver au froid, à l'abri de la lumière\n**EPA** — C20:5 Δ5,8,11,14,17 — ω3 — Poissons gras (maquereau, saumon, sardine), huiles de poisson — → eicosanoïdes de série 3 : protection cardiovasculaire, anti-agrégant, anti-inflammatoire, ↓ triglycérides\n**DHA** — C22:6 Δ4,7,10,13,16,19 — ω3 — Poissons gras, microalgues — Développement du cerveau et de la rétine, spermatozoïdes ; femme enceinte/allaitante, nourrisson (ne le synthétise pas) → ajouté aux laits infantiles\n**Dessin** : chaîne en zigzag, COOH en C1 ; doubles liaisons **cis** ; ω = position de la 1ʳᵉ double liaison comptée depuis le CH₃ terminal ; les doubles liaisons sont séparées par un CH₂ (non conjuguées, « malonique »).\n**Cis / trans** : les AG naturels sont cis (molécule coudée, huile liquide). Les AG trans (hydrogénation partielle industrielle, ruminants) ↑ LDL et ↓ HDL → athérogènes.\n**Lesquels sont bons ?** Les insaturés (ω3 surtout, ω9) ; ratio ω6/ω3 idéalement ≈ 4-5 (régime occidental très déséquilibré en ω6). Saturés et trans en excès → risque cardiovasculaire."}, {"id": "p:ch2:5", "lab": "Tombé à l'examen", "q": "Sous quelle forme trouve-t-on majoritairement les AG dans les huiles ? (formule générale, liaison)", "r": "Sous forme de **triglycérides** (triacylglycérols) : 1 glycérol estérifié par 3 AG → 3 liaisons **ester** (–CH₂–O–CO–R).\n```javascript\nCH2–O–CO–R1\n\nCH –O–CO–R2\n\nCH2–O–CO–R3\n```\nUne huile grasse contient aussi en petite quantité : AG libres, glycérides partiels (mono/di), cires, phospholipides et **insaponifiable** (stérols, vitamines liposolubles A/E, squalène, alcools gras, triterpènes)."}, {"id": "p:ch2:6", "lab": "Tombé à l'examen", "q": "Comment obtient-on des savons ? (réaction à dessiner)", "r": "**Saponification** : chauffage de l'huile avec une base forte (NaOH → savon dur ; KOH → savon mou). Rupture des liaisons ester → **glycérol** + **3 sels d'AG (savons)**, tous deux hydrosolubles.\n```javascript\nTriglycéride + 3 NaOH  --(chaleur)-->  Glycérol + 3 R–COO⁻ Na⁺\n```\nCe qui ne se saponifie pas = **insaponifiable**."}, {"id": "p:ch2:7", "lab": "Tombé à l'examen", "q": "Comment et pourquoi différencier très facilement une huile grasse d'une HE ?", "r": "- **Test de la tache** sur papier : l'HE est volatile → la tache disparaît ; l'huile grasse laisse une tache grasse permanente.\n- HE = mélange de métabolites **secondaires** volatils (terpènes, phénylpropènes), odorants, entraînables à la vapeur d'eau, PM < 300.\n- Huile grasse = métabolites **primaires** (triglycérides), non volatils, inodores ou peu, saponifiables ; obtenue par pression ou extraction par solvant (puis raffinage, éventuellement hydrogénation)."}, {"id": "p:ch2:8", "lab": "Tombé à l'examen", "q": "Insaponifiable : où, quoi, comment l'obtenir ? + indices", "r": "**Définition** : constituants lipophiles non glycéridiques restant après saponification et extraits par un solvant organique d'une dilution aqueuse du savon ; non volatils à 100-105 °C, on pèse le résidu après lavage et évaporation. Les AG libres n'en font pas partie.\n**Contenu** : squalène, stérols (phytostérols → ↓ cholestérol), vit. A et E, alcools aliphatiques lourds, triterpènes.\n**Usages** : insaponifiables d'avocat et de soja (appoint de l'arthrose) ; palmier de Floride (*Serenoa*) et prunier d'Afrique (*Pygeum*) → hypertrophie bénigne de la prostate.\n**Indices (contrôle qualité des huiles)** :\n- **Indice d'acide** : mg KOH pour neutraliser les AG libres d'1 g → acidité, dégradation (hydrolyse).\n- **Indice de saponification** : mg KOH pour neutraliser les AG libres + saponifier les esters d'1 g → longueur moyenne des chaînes.\n- **Indice d'ester** = I. saponification − I. acide.\n- **Indice de peroxyde** : quantité d'oxygène actif (peroxydes) par kg → rancissement oxydatif."}, {"id": "p:ch2:9", "lab": "Nouvelle question au format examen", "q": "Cires : composition générale, cires végétales et animales du cours", "r": "Cires = **esters d'AG à longue chaîne et d'alcools gras à longue chaîne** (monoalcools), + hydrocarbures, alcools et acides libres ; très hydrophobes, insaponifiables en partie, résistantes. **Carnauba** (feuilles du palmier *Copernicia*, Brésil) : la plus dure, haut point de fusion → enrobage/lustrage des comprimés, cosmétiques. **Jojoba** : « huile » liquide qui est en fait une cire (esters C40-C42), très stable, cosmétique (peau, cheveux). **Cire d'abeille jaune / blanche** (blanche = blanchie) : bases de pommades, cérats, cosmétiques. **Lanoline** (suint de la laine de mouton) : esters de stérols (cholestérol) ; émulsionnant E/H, absorbe beaucoup d'eau, émollient ; allergisant possible."}, {"id": "p:ch2:10", "lab": "Nouvelle question au format examen", "q": "Acide érucique et acide ricinoléique : structure, source, intérêt", "r": "Érucique : C22:1 ω9 (Δ13), colza traditionnel et moutarde ; cardiotoxique chez l'animal (lipidose myocardique) → sélection du colza « double zéro » (pauvre en érucique et en glucosinolates). Ricinoléique : C18:1 ω9 avec **OH en C12**, ≈ 90 % de l'huile de ricin ; libéré par les lipases intestinales → **laxatif stimulant/purgatif** ; huile de ricin = excipient, cosmétique, lubrifiant (la graine contient la **ricine**, lectine très toxique, absente de l'huile pressée)."}, {"id": "p:ch2:11", "lab": "Nouvelle question au format examen", "q": "V/F : « Une huile riche en AGPI a un indice de peroxyde qui augmente vite » ; « Une carence en vit. E est surtout une carence d'apport » ; « L'ALA est converti efficacement en DHA »", "r": "V (les AGPI s'oxydent facilement → rancissement) · F (carence **de consommation** : la vit. E est consommée pour protéger les AGPI) · F (conversion très faible → apport direct par poisson/algues nécessaire)."}, {"id": "p:ch2:12", "lab": "Nouvelle question au format examen", "q": "Lectines, thaumatine, bromélaïne, papaïne, gélatine : commentez", "r": "**Lectines** : protéines/glycoprotéines liant spécifiquement des sucres → agglutinent les érythrocytes ; certaines très toxiques (ricine du ricin, phytohémagglutinine des haricots crus → cuisson indispensable) ; outils de laboratoire (groupage sanguin). **Thaumatine** : protéine de *Thaumatococcus daniellii* (Afrique de l'Ouest), ~2 000-3 000× plus sucrante que le saccharose, édulcorant et exhausteur de goût. **Bromélaïne** : protéase (cystéine-protéase) de l'ananas (tige) ; anti-œdémateuse, anti-inflammatoire, digestive ; attendrisseur. **Papaïne** : protéase du latex de papaye verte ; digestive, attendrisseur de viande, préparation de la chondroïtine, nettoyage des lentilles. **Gélatine** : protéine obtenue par hydrolyse partielle du **collagène** (os, peau de porc/bœuf, poisson) ; gélules, capsules molles, gélifiant alimentaire, substituts plasmatiques ; non végétale (agar = alternative)."}]}, {"id": "ch3", "num": "3", "t": "3. Acides aminés & protéines", "court": "Protides", "sym": "drop", "fam": "lip", "niveaux": [{"t": "Biosynthèse des acides aminés", "s": "Bref aperçu : biosynthèse, AA inusuels, protéines particulières", "type": "n", "m": [], "q": [], "c": ["ch3-001", "ch3-002", "ch3-003", "ch3-004", "ch3-005"], "pl": []}, {"t": "Acides aminés toxiques", "s": "Protéine édulcorante · Enzymes protéolytiques", "type": "n", "m": [], "q": ["ch3-q01", "ch3-q02", "ch3-q05"], "c": ["ch3-006", "ch3-007", "ch3-008", "ch3-009", "ch3-010", "ch3-011"], "pl": ["thaumatococcus", "papayer", "ananas"]}, {"t": "Protéines toxiques", "s": "Gélatine", "type": "n", "m": [], "q": ["ch3-q03", "ch3-q04"], "c": ["ch3-012", "ch3-013", "ch3-014", "ch3-015", "ch3-016", "ch3-017"], "pl": ["jequirity"]}, {"t": "Questions d'examen", "s": "0 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": []}, {"id": "ch4", "num": "4", "t": "4. Métabolites secondaires & hétérosides", "court": "Hétérosides", "sym": "flask", "fam": "shi", "niveaux": [{"t": "Principales voies biosynthétiques", "s": "Principales voies biosynthétiques — premières étapes — notion d'hétérosides", "type": "n", "m": [], "q": ["ch4-q01", "ch4-q02", "ch4-q03", "ch4-q04"], "c": ["ch4-001", "ch4-002", "ch4-003", "ch4-004", "ch4-005", "ch4-006", "ch4-007", "ch4-008", "ch4-009", "ch4-010", "ch4-023"], "pl": []}, {"t": "Notion d'hétérosides", "s": "Solubilités et extraction", "type": "n", "m": [], "q": ["ch4-q05", "ch4-q06", "ch4-q07", "ch4-q08"], "c": ["ch4-011", "ch4-012", "ch4-013", "ch4-014", "ch4-015", "ch4-016", "ch4-017", "ch4-018", "ch4-019", "ch4-020", "ch4-021", "ch4-022"], "pl": []}, {"t": "Questions d'examen", "s": "8 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch4:0", "lab": "Liste du prof", "q": "Y a-t-il seulement la voie des acétates et celle des shikimates à l'origine des métabolites secondaires ?", "r": "Oui, ce sont ces deux voies qui sont à l'origine de tous les métabolites secondaires mentionnés sur la slide."}, {"id": "p:ch4:1", "lab": "Liste du prof", "q": "Distinction entre glycosides et génines ?", "r": "Un aglycone, ou une génine, est un composé organique constitué de la partie non glucidique d'un hétéroside (le glycoside = l'hétéroside entier)."}, {"id": "p:ch4:2", "lab": "Liste du prof", "q": "Pourriez-vous expliquer la 2e diapositive (schéma des voies) ?", "r": "Explication orale au cours — voir le schéma des voies biosynthétiques dans l'onglet Schémas."}, {"id": "p:ch4:3", "lab": "Question ouverte d'examen", "q": "Qu'est-ce qu'un **hétéroside** ? Distinguez génine et glycoside, les types d'hétérosides et leurs propriétés de solubilité et d'hydrolyse.", "r": "**Hétéroside = génine (aglycone) + ose(s)**, liés sur le **C1 anomère** (α ou β) par condensation (–H2O).\n**Types** selon l'atome de la génine : **O-hétérosides** (alcool, phénol, acide — les plus fréquents), **C-hétérosides** (liaison C–C, difficilement hydrolysable), **S-hétérosides** (thiols, ex. glucosinolates).\n**Solubilité** : l'hétéroside est **toujours plus polaire** que sa génine → hétérosides dans MeOH, EtOH, eau ; génines dans CH2Cl2, AcOEt, éther.\n**Hydrolyse** : acide à chaud ou enzymatique (β-glucosidases) libère la génine."}, {"id": "p:ch4:4", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "Méthode : comment trouver la classe, H₂O ou SO, et la réaction sans chauffage d'une structure inconnue ?", "r": "1. **Classe** : regarde le squelette (C6-C1, C6-C3, C6-C3-C6, isoprènes C5n, quinone, N hétérocyclique…).\n2. **H₂O ou SO** : présence d'un ou plusieurs **sucres**, de COOH ionisés, de sels, de nombreux OH → H₂O. Squelette carboné dominant, génine, ester, AG libre, terpène non glycosylé → SO.\n3. **NaOH sans chauffage** : seules les fonctions **acides** réagissent → **COOH** (sel), **phénol** (phénolate), ène-diol (vit. C).\n4. **HCl sans chauffage** : seules les fonctions **basiques** → **N d'alcaloïde / amine** (sel).\n5. **NON** : ester, lactone, hétéroside (liaison osidique), éther, alcool, cétone, aldéhyde → il faut **chauffer** (saponification, hydrolyse acide)."}, {"id": "p:ch4:5", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Valtrate** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Iridoïde\n**Solubilité** : valépotriate (esters)\n**Sans chauffage** : SO"}, {"id": "p:ch4:6", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Pyréthrine** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Monoterpène irrégulier (ester)\n**Solubilité** : SO\n**Sans chauffage** : NON"}, {"id": "p:ch4:7", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Céphéline** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Alcaloïde isoquinoléique (ipéca)\n**Solubilité** : Base : SO\n**Sans chauffage** : OUI + HCl (N) + NaOH (phénol)"}]}, {"id": "ch4b", "num": "4B", "t": "4B. Voie des shikimates", "court": "Shikimates", "sym": "flask", "fam": "shi", "niveaux": [{"t": "Acide shikimique", "s": "Dérivés C6-C1 · Acide cinnamique et baumes", "type": "n", "m": ["acide-shikimique", "phenylalanine", "acide-benzoique", "acide-gallique", "vanilline", "salicoside", "alcool-salicylique", "aldehyde-salicylique", "spireine", "acide-salicylique", "aspirine", "salicylate-de-methyle", "monotropitoside", "acide-cinnamique", "cinnamate-de-benzyle"], "q": ["ch4b-q09", "ch4b-q10", "ch4b-q11", "ch4b-q12", "ch4b-q13", "ch4b-q14", "ch4b-q15", "ch4b-q16", "ch4b-q17", "ch4b-q18", "ch4b-q44"], "c": ["ch4b-024", "ch4b-025", "ch4b-026", "ch4b-027", "ch4b-028", "ch4b-029", "ch4b-030", "ch4b-031", "ch4b-032", "ch4b-033", "ch4b-034", "ch4b-035", "ch4b-037", "ch4b-038", "ch4b-039", "ch4b-040", "ch4b-041", "ch4b-042", "ch4b-043", "ch4b-044", "ch4b-045", "ch4b-046", "ch4b-047", "ch4b-048", "ch4b-049", "ch4b-050", "ch4b-051", "ch4b-052", "ch4b-053", "ch4b-054", "ch4b-055", "ch4b-056", "ch4b-057", "ch4b-058", "ch4b-059", "ch4b-060", "ch4b-061", "ch4b-062", "ch4b-063", "ch4b-064", "ch4b-065", "ch4b-066", "ch4b-067", "ch4b-068", "ch4b-069", "ch4b-070", "ch4b-071", "ch4b-072", "ch4b-073", "ch4b-074", "ch4b-081", "ch4b-090"], "pl": ["badianier-chine", "saule", "reine-des-pres", "gaultherie", "bouleau-lenta", "myroxylon", "benjoin", "cafeier", "cannelier"]}, {"t": "Acide caféique et dérivés", "s": "Phénylpropènes des huiles essentielles · Extension du phénylpropène · Lignanes", "type": "n", "m": ["alcool-coniferylique", "acide-cafeique", "acide-ferulique", "acide-chlorogenique", "cynarine", "acide-rosmarinique", "acteoside", "aldehyde-cinnamique", "eugenol", "anethole", "myristicine", "curcumine", "gingerol", "sdg", "podophyllotoxine"], "q": ["ch4b-q19", "ch4b-q20", "ch4b-q21", "ch4b-q22", "ch4b-q23", "ch4b-q24", "ch4b-q25", "ch4b-q26", "ch4b-q27", "ch4b-q28", "ch4b-q29", "ch4b-q30", "ch4b-q31", "ch4b-q32"], "c": ["ch4b-036", "ch4b-075", "ch4b-076", "ch4b-077", "ch4b-078", "ch4b-079", "ch4b-080", "ch4b-082", "ch4b-083", "ch4b-084", "ch4b-085", "ch4b-086", "ch4b-087", "ch4b-088", "ch4b-089", "ch4b-091", "ch4b-092", "ch4b-093", "ch4b-094", "ch4b-095", "ch4b-096", "ch4b-097", "ch4b-098", "ch4b-099", "ch4b-100", "ch4b-101", "ch4b-102", "ch4b-103", "ch4b-104", "ch4b-105", "ch4b-106", "ch4b-107", "ch4b-108", "ch4b-109", "ch4b-110", "ch4b-111", "ch4b-112", "ch4b-113", "ch4b-114", "ch4b-115", "ch4b-116", "ch4b-117", "ch4b-118", "ch4b-119"], "pl": ["echinacee", "artichaut", "giroflier", "muscadier", "anis-vert", "fenouil", "curcuma", "gingembre", "podophylle"]}, {"t": "Coumarines et Furocoumarines", "s": "Dérivés C6-C1 & du phénylpropène (C6-C3) — lignanes — coumarines — furocoumarine", "type": "n", "m": ["coumarine", "ombelliferone", "esculetol", "esculoside", "fraxoside", "scopoletine", "melilotoside", "dicoumarol", "psoralene", "bergaptene", "xanthotoxine"], "q": ["ch4b-q33", "ch4b-q34", "ch4b-q35", "ch4b-q36", "ch4b-q37", "ch4b-q38", "ch4b-q39", "ch4b-q40", "ch4b-q41", "ch4b-q42", "ch4b-q43", "vf50-1", "vf50-9"], "c": ["ch4b-120", "ch4b-121", "ch4b-122", "ch4b-123", "ch4b-124", "ch4b-125", "ch4b-126", "ch4b-127", "ch4b-128", "ch4b-129", "ch4b-130", "ch4b-131", "ch4b-132", "ch4b-133", "ch4b-134", "ch4b-135", "ch4b-136", "ch4b-137", "ch4b-138", "ch4b-139", "ch4b-140", "ch4b-141", "ch4b-142", "ch4b-143", "ch4b-144", "ch4b-145", "ch4b-146", "ch4b-147", "ch4b-148", "ch4b-149", "ch4b-150"], "pl": ["tonka", "melilot", "asperule", "frene", "marronnier", "berce-caucase", "pamplemousse"]}, {"t": "Questions d'examen", "s": "28 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch4b:0", "lab": "Liste du prof", "q": "Pourriez-vous réexpliquer à quoi sert la voie des shikimates ?", "r": "La voie des shikimates (via l'acide shikimique) sert à former les tanins galliques à partir de l'acide gallique et permet entre autres de former la phénylalanine, qui permettra la synthèse de l'acide cinnamique, lui-même à l'origine des coumarines, H.E., baumes, dérivés de l'acide caféique, etc."}, {"id": "p:ch4b:1", "lab": "Liste du prof", "q": "Les noms de spécialités sont-ils à retenir ?", "r": "Non : dans le cadre de cette UE, les noms commerciaux ne sont pas à retenir."}, {"id": "p:ch4b:2", "lab": "Question ouverte d'examen", "q": "À quoi sert la **voie des shikimates** ? Citez les grandes familles de composés qui en dérivent avec un exemple chacune.", "r": "Acide pyruvique + érythrose → **acide shikimique** : synthèse du **noyau aromatique** (végétaux, micro-organismes).\n→ **C6-C1** : acide benzoïque, **acide gallique** (→ tanins galliques), vanilline, salicylés (salicoside).\n→ **phénylalanine** → (PAL) **acide cinnamique** (C6-C3) → acides-phénols (caféique, chlorogénique), **phénylpropènes des HE** (eugénol, anéthole, aldéhyde cinnamique, myristicine), curcumine, **baumes**, **lignanes**, **coumarines** et **furocoumarines**."}, {"id": "p:ch4b:3", "lab": "Question ouverte d'examen", "q": "**Coumarines et furocoumarines** : structure de base, propriétés physico-chimiques, activités et précautions.", "r": "**Coumarine** = benzo-α-pyrone (**lactone** issue de la cyclisation d'un C6-C3) ; souvent **7-OH** (ombelliférone). Fluorescence bleue aux UV (identification).\nLa coumarine elle-même n'est **pas anticoagulante** (hépatotoxique) ; le **dicoumarol** (mélilot moisi, 4-hydroxycoumarine dimère) est **anti-vitamine K**.\n**Furocoumarines** = coumarine + cycle furane (linéaires : psoralène, bergaptène, xanthotoxine) : **photosensibilisantes / phototoxiques** → PUVA-thérapie (psoriasis, vitiligo) ; risques : brûlures, cancérogénicité. **Pamplemousse** : inhibition du **CYP3A4** (interactions médicamenteuses)."}, {"id": "p:ch4b:4", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Tanin gallique** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Shikimates\n**Solubilité** : tanin hydrolysable\n**Sans chauffage** : H₂O"}, {"id": "p:ch4b:5", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Bergaptène** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Furocoumarine\n**Solubilité** : SO\n**Sans chauffage** : NON (lactone : ouverture seulement à chaud)"}, {"id": "p:ch4b:6", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Eugénol / thymol** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Phénylpropène / monoterpène phénolique (HE)\n**Solubilité** : SO\n**Sans chauffage** : OUI + NaOH (phénol)"}, {"id": "p:ch4b:7", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Acide chlorogénique** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Dérivé du phénylpropène (ester caféoylquinique)\n**Solubilité** : H₂O\n**Sans chauffage** : OUI + NaOH (COOH + phénols)"}, {"id": "p:ch4b:8", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Salicoside** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Dérivé salicylé (hétéroside)\n**Solubilité** : H₂O\n**Sans chauffage** : NON (le phénol est engagé avec le glucose)"}, {"id": "p:ch4b:9", "lab": "Tombé à l'examen", "q": "Bergaptène : structure, précurseur, classe, propriétés", "r": "**Structure** : **5-méthoxypsoralène** (furocoumarine linéaire : coumarine + cycle furane accolé en 6,7 ; OCH₃ en 5).\n**Biosynthèse** : voie des **shikimates** — acide cinnamique → **ombelliférone** (7-hydroxycoumarine) → prénylation (DMAPP) → cycle furane.\n**Sources** : bergamote (HE de bergamote), Apiacées (céleri, panais, berce), Rutacées, figuier.\n**Propriétés** : **photosensibilisant** : sous UVA, forme des adduits avec les bases pyrimidiques de l'ADN → stimule la mélanogenèse ; utilisé (avec la **xanthotoxine** = 8-MOP) en **PUVAthérapie** du psoriasis et du vitiligo ; anciennement dans des produits solaires.\n**Toxicité** : phototoxicité (dermatites, phytophotodermatoses « des prés »), mutagène, cancérogène (mélanome, carcinomes), risque de cataracte."}, {"id": "p:ch4b:10", "lab": "Tombé à l'examen", "q": "Baumes : contenu, exemple, indices", "r": "**Baumes** = oléorésines riches en **acide benzoïque et acide cinnamique** (libres et estérifiés : benzoate et cinnamate de benzyle), + traces de **vanilline** (odeur suave) ; voie des shikimates (C6-C1 et C6-C3). Obtenus par **exsudation** après incision.\n**Exemples** : **baume du Pérou** (*Myroxylon balsamum* var. *pereirae*) : usage externe antiseptique, cicatrisant (allergisant de contact) ; **baume de Tolu** (*M. balsamum*, Colombie/Venezuela) : expectorant, antiseptique (sirops) ; **benjoins** (*Styrax*) : antiseptique, inhalations.\n**Indices** : acide, saponification, ester."}, {"id": "p:ch4b:11", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Eugénol** ?", "r": "**Eugénol** : phénylpropène, clou de girofle ; anesthésique et antiseptique dentaire."}, {"id": "p:ch4b:12", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Aldéhyde cinnamique** ?", "r": "**Aldéhyde cinnamique** : écorce de cannelle ; antiseptique, odeur ; allergisant."}, {"id": "p:ch4b:13", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Myristicine** ?", "r": "**Myristicine** : noix de muscade ; méthylènedioxy + méthoxy, très lipophile ; hallucinogène (analogue amphétaminique MMDA)."}, {"id": "p:ch4b:14", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Anéthole** ?", "r": "**Anéthole** : anis vert, badiane de Chine, fenouil ; digestif, carminatif ; trouble l'eau (louche)."}, {"id": "p:ch4b:15", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Curcumine** ?", "r": "**Curcumine** : rhizome de curcuma ; diféruloylméthane (extension du phénylpropène) ; colorant jaune stable à la chaleur ; cholagogue/cholérétique, hépatoprotecteur, antioxydant, hypolipémiant ; très faible biodisponibilité ↑ par la **pipérine**."}, {"id": "p:ch4b:16", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Gingérols** ?", "r": "**Gingérols** : principes piquants du rhizome de gingembre (oléorésine) ; nausées, vomissements (mal des transports)."}, {"id": "p:ch4b:17", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Podophyllotoxine** ?", "r": "**Podophyllotoxine** : lignane (lactone), résine de podophylle ; inhibe la polymérisation de la tubuline ; usage externe contre verrues et condylomes ; trop toxique per os ; hémisynthèse de l'étoposide."}, {"id": "p:ch4b:18", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Coumarine** ?", "r": "**Coumarine** : lactone de l'acide o-hydroxycinnamique ; fève tonka, mélilot ; odeur de foin ; **pas anticoagulante** ; hépatotoxique à forte dose."}, {"id": "p:ch4b:19", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Dicoumarol** ?", "r": "**Dicoumarol** : mélilot moisi (fermentation fongique) : 4-hydroxycoumarine dimérisée → **antivitamine K** (hémorragies du bétail) → modèle des AVK."}, {"id": "p:ch4b:20", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Psoralène, bergaptène, xanthotoxine** ?", "r": "**Psoralène, bergaptène, xanthotoxine** : furocoumarines photosensibilisantes (PUVA)."}, {"id": "p:ch4b:21", "lab": "Nouvelle question au format examen", "q": "Dessinez l'acide shikimique et la phénylalanine ; quel est le rôle de la PAL ?", "r": "Acide shikimique : cyclohexène portant un COOH et 3 OH (3,4,5-trihydroxy) ; précurseur des acides aminés aromatiques. Phénylalanine : Ph–CH₂–CH(NH₂)–COOH. La **phénylalanine ammonia-lyase** élimine NH₃ → **acide cinnamique** (Ph–CH=CH–COOH) : point d'entrée de tous les phénylpropanoïdes."}, {"id": "p:ch4b:22", "lab": "Nouvelle question au format examen", "q": "Dérivés C6-C1 : dessinez et commentez acide benzoïque, acide gallique, vanilline", "r": "**Acide benzoïque** : Ph–COOH ; baumes et benjoins ; conservateur antimicrobien (E210, et benzoate de Na) actif en milieu acide ; antifongique (pommade de Whitfield). **Acide gallique** : 3,4,5-trihydroxybenzoïque ; unité des tanins galliques ; antioxydant (gallates de propyle/octyle = additifs). **Vanilline** : 4-hydroxy-3-méthoxybenzaldéhyde ; gousses de vanille (formée au cours de la fermentation/« préparation » par hydrolyse de la glucovanilline) ; arôme majeur (souvent de synthèse, à partir de la lignine ou de l'eugénol)."}, {"id": "p:ch4b:23", "lab": "Nouvelle question au format examen", "q": "Dérivés salicylés : salicoside, aldéhyde et acide salicylique, monotropitoside, salicylate de méthyle", "r": "**Salicoside** : glucoside de l'alcool salicylique (saligénine), écorce de **saule** ; prodrogue : hydrolyse intestinale → saligénine → oxydée en **acide salicylique** (foie) ; analgésique, antipyrétique, anti-rhumatismal, sans l'agressivité gastrique de l'aspirine ; contre-indiqué en cas d'allergie aux salicylés. **Aldéhyde salicylique** : reine-des-prés (*Filipendula ulmaria*, ex-*Spiraea* → « a-spirine »). **Acide salicylique** : kératolytique (usage externe) ; acétylé → aspirine. **Monotropitoside** (gaulthérine) : primevéroside du salicylate de méthyle (gaulthérie, wintergreen) → libère le salicylate de méthyle. **Salicylate de méthyle** : ester, HE de gaulthérie, révulsif/analgésique local (baumes) ; **très toxique per os** (enfants)."}, {"id": "p:ch4b:24", "lab": "Nouvelle question au format examen", "q": "Dérivés du phénylpropène C6-C3 : acide cinnamique, alcool coniférylique, acide caféique, acide chlorogénique, acide rosmarinique, cynarine, actéoside", "r": "**Cinnamique** : précurseur commun ; baumes. **Alcool coniférylique** : monolignol → polymérisation en **lignine** et lignanes. **Caféique** : 3,4-dihydroxycinnamique, antioxydant. **Chlorogénique** : ester caféoyl-**quinique** ; café vert, artichaut ; antioxydant, cholérétique. **Rosmarinique** : ester caféique + acide 3,4-dihydroxyphényllactique ; Lamiacées (romarin, mélisse, sauge) ; antioxydant, anti-inflammatoire, antiviral (herpès). **Cynarine** : 1,3-dicaféoylquinique ; feuilles d'**artichaut** ; cholérétique, hépatoprotecteur, hypocholestérolémiant. **Actéoside** (verbascoside) : hétéroside phényléthanoïde (caféoyl + hydroxytyrosol + rhamnose/glucose) ; plantain, verveine ; antioxydant, anti-inflammatoire. Tous : phénols → solubles dans l'eau/alcool (esters de sucres/acides), oxydables."}, {"id": "p:ch4b:25", "lab": "Nouvelle question au format examen", "q": "Lignanes : définition, 2 types de couplage, lignanes du lin, podophyllotoxine", "r": "Dimères de 2 unités phénylpropaniques (C6-C3)₂. **Lignanes** au sens strict : couplage **8-8'** (β-β') des chaînes latérales ; **néolignanes** : autres couplages (8-5', 8-O-4', 3-3'…). **Lin** : sécoisolaricirésinol diglucoside → transformé par la flore en **entérolactone et entérodiol** (phyto-œstrogènes ; ménopause, prévention hormono-dépendante). **Podophyllotoxine** : lignane à lactone, rhizome de podophylle ; antimitotique (tubuline) ; verrues, condylomes (externe) ; dérivés d'hémisynthèse **étoposide/téniposide** (inhibiteurs de la topo-isomérase II, anticancéreux)."}, {"id": "p:ch4b:26", "lab": "Nouvelle question au format examen", "q": "Coumarines : structure de base, coumarine, ombelliférone, hétérosides coumariniques, dicoumarol. Pourquoi la coumarine n'est-elle pas anticoagulante ?", "r": "Squelette **2H-1-benzopyran-2-one** (lactone de l'acide o-hydroxycinnamique cis). **Coumarine** : fève tonka, mélilot, aspérule ; odeur de foin ; hépatotoxique à forte dose ; anti-œdémateuse. **Ombelliférone** (7-hydroxycoumarine) : fluorescence bleue sous UV (identification en CCM), précurseur des furocoumarines. **Hétérosides coumariniques** : esculoside (marronnier d'Inde écorce, frêne) → veinotonique, « vitamine P-like ». Lactone → ouverture en milieu alcalin **à chaud** (coumarinate), refermeture en milieu acide. **Dicoumarol** : formé dans le mélilot moisi (4-hydroxylation par moisissures + couplage de 2 molécules par le formaldéhyde) → **antivitamine K**. La coumarine simple n'a **pas** le 4-OH ni la structure dimère nécessaires pour inhiber la vitamine K époxyde réductase."}, {"id": "p:ch4b:27", "lab": "Nouvelle question au format examen", "q": "Curcumine et gingérols : classe, source, propriétés, biodisponibilité", "r": "**Curcumine** : extension du phénylpropène (diféruloylméthane, 2 unités C6-C3 reliées par un C central : C6-C3-C1-C3-C6) ; rhizome de *Curcuma longa* ; colorant jaune (E100) ; cholérétique/cholagogue, antioxydant, anti-inflammatoire, hypolipémiant ; quasi insoluble dans l'eau, très mal absorbée → pipérine, formulations. **Gingérols** : phénols piquants du rhizome de gingembre (se déshydratent en shogaols au séchage) ; antiémétique (mal des transports, nausées de grossesse), anti-inflammatoire ; drogue à oléorésine."}]}, {"id": "ch5", "num": "5", "t": "5. Polyphénols & stilbénoïdes", "court": "Polyphénols", "sym": "flower", "fam": "pol", "niveaux": [{"t": "Produits mixtes et Polyphénols", "s": "Radicaux libres", "type": "n", "m": [], "q": ["ch5-q01", "ch5-q02", "ch5-q03", "ch5-q07", "qcm51-5"], "c": ["ch5-001", "ch5-002", "ch5-003", "ch5-004", "ch5-005", "ch5-006", "ch5-007", "ch5-008", "ch5-009", "ch5-010", "ch5-011", "ch5-012", "ch5-013", "ch5-014"], "pl": []}, {"t": "Stilbénoïdes et resvératrol", "s": "Produits mixtes (voie des shikimates + acétates) — généralités, radicaux libres,", "type": "n", "m": ["resveratrol"], "q": ["ch5-q04", "ch5-q05", "ch5-q06"], "c": ["ch5-015", "ch5-016", "ch5-017", "ch5-018", "ch5-019", "ch5-020", "ch5-021"], "pl": ["renouee-japon", "vigne-rouge"]}, {"t": "Questions d'examen", "s": "3 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch5:0", "lab": "Question ouverte d'examen", "q": "Qu'est-ce qu'un **polyphénol** ? Situez les stilbènes et donnez la structure et les activités du **resvératrol**.", "r": "Polyphénol = au moins **1 noyau aromatique portant 2 OH phénoliques** ; produits souvent **mixtes** (shikimates + acétates) : stilbénoïdes, flavonoïdes, anthocyanes, tanins catéchiques. **Antioxydants** (plus il y a d'OH, plus l'effet est marqué) ; efficacité limitée par la **biodisponibilité**.\n**Stilbènes** : 2 noyaux benzéniques reliés par un pont **éthène** (E). **Resvératrol** (3,5,4′-trihydroxystilbène ; vin rouge, renouée du Japon) : antioxydant, anti-inflammatoire, phyto-œstrogène, « French paradox »."}, {"id": "p:ch5:1", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Resvératrol** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Stilbène\n**Solubilité** : SO (alcool)\n**Sans chauffage** : OUI + NaOH (phénols)"}, {"id": "p:ch5:2", "lab": "Tombé à l'examen", "q": "Resvératrol : structure, précurseur, classe, propriétés", "r": "**Structure** : trans-3,5,4'-trihydroxystilbène (2 cycles reliés par –CH=CH–).\n**Biosynthèse** : **stilbène** — p-coumaroyl-CoA (dérivé de l'acide **cinnamique**, voie des shikimates) + 3 malonyl-CoA (stilbène synthase) → c'est donc aussi un produit mixte, mais le précurseur attendu = **acide cinnamique / p-coumarique**.\n**Sources** : peau de raisin et vin rouge (composé minoritaire), renouée du Japon (*Polygonum cuspidatum*, source industrielle). Phytoalexine (défense contre les champignons).\n**Propriétés** : antioxydant, anti-inflammatoire, anticancéreux (in vitro), phyto-œstrogène, cardioprotecteur. Invoqué dans le **« paradoxe français »** (faible incidence cardiovasculaire malgré une alimentation riche en AG saturés, attribuée au vin rouge)."}]}, {"id": "ch5b", "num": "5B", "t": "5B. Flavonoïdes", "court": "Flavonoïdes", "sym": "flower", "fam": "pol", "niveaux": [{"t": "Rôles dans la plante", "s": "Structure générale C6-C3-C6 · Types de génines · Hétérosides", "type": "n", "m": ["apigenine", "luteoline", "diosmine", "quercetine", "kaempferol", "rutoside", "taxifoline", "naringoside", "vitexine", "isovitexine", "hopeine"], "q": ["ch5b-q01", "ch5b-q03", "ch5b-q04", "ch5b-q05", "ch5b-q08", "ch5b-q11", "ch5b-q12", "ch5b-q14"], "c": ["ch5b-001", "ch5b-002", "ch5b-003", "ch5b-004", "ch5b-005", "ch5b-007", "ch5b-008", "ch5b-009", "ch5b-010", "ch5b-011", "ch5b-012", "ch5b-013", "ch5b-014", "ch5b-016", "ch5b-017", "ch5b-018", "ch5b-019", "ch5b-020", "ch5b-021", "ch5b-022", "ch5b-023", "ch5b-026", "ch5b-027", "ch5b-028", "ch5b-067", "ch5b-069", "ch5b-070", "ch5b-072"], "pl": ["passiflore", "aubepine"]}, {"t": "Solubilités et extraction", "s": "Propriétés biologiques et indications", "type": "n", "m": [], "q": ["ch5b-q13", "ch5b-q22", "ch5b-q23"], "c": ["ch5b-029", "ch5b-030", "ch5b-031", "ch5b-032", "ch5b-033", "ch5b-034", "ch5b-035", "ch5b-036", "ch5b-037", "ch5b-038", "ch5b-039", "ch5b-071"], "pl": []}, {"t": "Flavonoïdes isolés", "s": "Amertume et saveur sucrée · Phyto-œstrogènes", "type": "n", "m": ["naringenine", "hesperidoside", "neohesperidoside", "naringoside-dhc", "neohesperidine-dhc", "genisteine", "daidzeine"], "q": ["ch5b-q02", "ch5b-q06", "ch5b-q07", "ch5b-q09", "ch5b-q10", "ch5b-q15", "ch5b-q16", "ch5b-q17", "ch5b-q18", "ch5b-q20", "ch5b-q24"], "c": ["ch5b-006", "ch5b-015", "ch5b-024", "ch5b-025", "ch5b-040", "ch5b-041", "ch5b-042", "ch5b-043", "ch5b-044", "ch5b-045", "ch5b-046", "ch5b-047", "ch5b-048", "ch5b-049", "ch5b-050", "ch5b-051", "ch5b-052", "ch5b-053", "ch5b-054", "ch5b-055", "ch5b-056", "ch5b-057", "ch5b-058", "ch5b-059", "ch5b-068"], "pl": ["sophora", "citrus", "houblon", "soja", "trefle-rouge"]}, {"t": "Substances apparentées", "s": "Flavones, flavonols, flavanones, dihydroflavonols, isoflavones, flavonoïdes prén", "type": "n", "m": ["isoliquiritigenine", "silibinine"], "q": ["ch5b-q19", "ch5b-q21"], "c": ["ch5b-060", "ch5b-061", "ch5b-062", "ch5b-063", "ch5b-064", "ch5b-065", "ch5b-066"], "pl": ["chardon-marie", "reglisse"]}, {"t": "Questions d'examen", "s": "17 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch5b:0", "lab": "Liste du prof", "q": "Distinction entre glycosides et génines ?", "r": "Un aglycone, ou génine, est la partie non glucidique d’un hétéroside (cfr cours)."}, {"id": "p:ch5b:1", "lab": "Liste du prof", "q": "Procédés d’extraction des flavonoïdes, dias 24 et 25 ?", "r": "Ces diapositives ne sont pas à connaître : les dias 16 à 26 ne font plus partie du cours."}, {"id": "p:ch5b:2", "lab": "Question ouverte d'examen", "q": "**Flavonoïdes** : structure de base, principales classes et comment les distinguer, propriétés physico-chimiques et usages.", "r": "Squelette **C6-C3-C6** (voie mixte) : cycle A (acétates) + cycle B (shikimates), cycle C = pyrone ; OH en **5, 7, 4′** (souvent 3′).\n**Classes** selon le cycle C : **flavones** (C=O en 4, double liaison 2-3 ; diosmine), **flavonols** (+ OH en 3 ; rutoside), **flavanones** (pas de double liaison 2-3 ; naringoside), **dihydroflavonols** (flavanone + OH en 3), **isoflavones** (cycle B en 3 ; génistéine), **chalcones** (cycle C ouvert).\nSucre en 7 (flavones, flavanones) ou en 3 (flavonols) ; O- vs C-hétérosides. Hétérosides → solvants polaires ; génines → solvants peu polaires ; phénols solubles en milieu alcalin.\n**Usages** : **veinotropes / capillarotropes**, antioxydants, anti-inflammatoires ; isoflavones = **phyto-œstrogènes** ; silymarine **hépatoprotectrice** ; néohespéridose amer, dihydrochalcones **sucrées**."}, {"id": "p:ch5b:3", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Génistéine** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Isoflavone (génine)\n**Solubilité** : SO / alcool\n**Sans chauffage** : OUI + NaOH (phénols)"}, {"id": "p:ch5b:4", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Naringoside / rutoside** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Flavanone / flavonol hétérosides\n**Solubilité** : H₂O\n**Sans chauffage** : OUI + NaOH (phénols)"}, {"id": "p:ch5b:5", "lab": "Tombé à l'examen", "q": "Voies biosynthétiques principales des flavonoïdes (+ les indiquer sur la flavone)", "r": "**Voie mixte** : squelette C6-C3-C6.\n- **Cycle A** (5,7-di-OH, alternance des OH en méta) ← voie des **acétates/polyacétates** : 3 malonyl-CoA (« triacétate »).\n- **Cycle B + les 3 C du cycle C** ← voie des **shikimates** : phénylalanine → acide cinnamique → p-coumaroyl-CoA (acide p-hydroxycinnamique).\n- Condensation par la chalcone synthase → **chalcone** → cyclisation (chalcone isomérase) → **flavanone** → les autres classes par oxydations successives.\nRepère : OH presque toujours en **5, 7 et 4'**."}, {"id": "p:ch5b:6", "lab": "Tombé à l'examen", "q": "Les 4 classes générales : un composé, sa structure, une plante", "r": "Classe — Caractère structural — Composé — Plante\n**Flavones** — C4=O, double liaison C2=C3, pas d'OH en 3 — Diosmine (diosmétine-7-rutinoside), apigénine, lutéoline — Citrus ; diosmine = veinotonique\n**Flavonols** — C4=O, C2=C3, **OH en 3** — Rutoside (quercétine-3-rutinoside), quercétine, kaempférol — *Sophora japonica* (boutons floraux), sarrasin\n**Flavanones** (dihydroflavones) — C4=O, C2–C3 **saturée** (C2 asymétrique) — Naringoside (amer), hespéridoside — Pamplemousse (naringoside), orange (hespéridoside)\n**Dihydroflavonols** (flavanonols) — C2–C3 saturée + OH en 3 — Taxifoline (dihydroquercétine) — Mélèze, chardon-marie (précurseur de la silybine)\nAutres groupes du cours : **isoflavones** (génistéine, soja), **flavanolignanes** (silymarine), **anthocyanes**, **flavan-3-ols** (catéchine → tanins condensés), **chalcones**."}, {"id": "p:ch5b:7", "lab": "Tombé à l'examen", "q": "Dessinez une chalcone et montrez comment obtenir un flavonoïde", "r": "**Chalcone** : 2 cycles benzéniques (A et B) reliés par une chaîne de 3 C **cétonique α,β-insaturée** (Ar–CO–CH=CH–Ar), pas d'hétérocycle central.\n**Transformation** : addition intramoléculaire (type Michael) du **OH en 2'** du cycle A sur la double liaison → fermeture de l'hétérocycle oxygéné **C (noyau pyrone/chromane)** → **flavanone** (enzyme : chalcone isomérase). Puis oxydations → flavones, dihydroflavonols → flavonols, etc."}, {"id": "p:ch5b:8", "lab": "Tombé à l'examen", "q": "Différences structurales flavone / flavonol / isoflavone (/ flavanone)", "r": "— Flavone — Flavonol — Isoflavone — Flavanone\nCétone en C4 —  —  —  — \nDouble liaison C2=C3 —  —  —  — \nOH en C3 —  —  — — (C3 porte le cycle B) — \nPosition du cycle B — C2 — C2 — **C3** — C2\nExemple — Diosmine — Rutoside — Génistéine — Naringoside"}, {"id": "p:ch5b:9", "lab": "Tombé à l'examen", "q": "Propriétés, mode d'action et utilisations des flavonoïdes", "r": "**Rôle dans la plante** : pigments (jaunes, parfois visibles seulement dans l'UV par les insectes → pollinisation), copigmentation des anthocyanes, protection contre les UV (cuticule foliaire).\n**Mode d'action** :\n- **Piégeurs de radicaux libres** (fonctions phénols ; plus le cycle B est hydroxylé — catéchol —, plus c'est antioxydant).\n- **Inhibiteurs enzymatiques** : histidine décarboxylase (anti-allergique) · 5-lipoxygénase et cyclo-oxygénase (anti-inflammatoire) · élastase (protège le collagène) · hyaluronidase (gaine vasculaire) · catéchol-O-méthyltransférase (↑ catécholamines → ↑ résistance capillaire) · phosphodiestérase de l'AMPc (anti-agrégant plaquettaire).\n**Utilisations** : **insuffisance veineuse** (↓ perméabilité, ↑ résistance capillaire : jambes lourdes, hémorroïdes) · anti-inflammatoires, anti-allergiques · diurétiques · certains anxiolytiques / favorisent le sommeil. Rutoside : très peu soluble → dérivés hydrosolubles (troxérutine) mais moins actifs."}, {"id": "p:ch5b:10", "lab": "Tombé à l'examen", "q": "Chardon-marie ; GOS vs FOS ; jus de pamplemousse ; manioc", "r": "**Chardon-marie** (*Silybum marianum*) : on utilise les **fruits** (« graines ») ; principe actif = **silymarine** (mélange de **flavanolignanes** : silybine, silychristine, silydianine). Hépatoprotecteur (troubles hépatiques, intoxication à l'amanite phalloïde : silibinine IV). **Extrait sec standardisé** plutôt que tisane car la silymarine est **très peu soluble dans l'eau** (et mal absorbée).\n**GOS vs FOS** : conseiller les **fructo-oligosaccharides** (ail, oignon, chicorée) : bifidogènes, prébiotiques (stimulent bifidobactéries et lactobacilles). Les **galacto-oligosaccharides** des légumineuses (raffinose, stachyose : haricots, pois chiches) sont peu digestes et fermentés en gaz → **flatulences**.\n**Pamplemousse** : le jus inhibe le **CYP3A4 intestinal** (furocoumarines : bergamottine et dérivés, inhibition irréversible) → ↑ biodisponibilité de nombreux médicaments (certaines statines, inhibiteurs calciques, immunosuppresseurs…), effet jusqu'à 3 jours après un seul verre. L'amertume vient du **naringoside** (flavanone à néohespéridose).\n**Manioc** (*Manihot esculenta*) : racine tubérisée riche en **amidon** (fécule, tapioca ; sans gluten), feuilles consommées en Afrique. Contient un **hétéroside cyanogène, le linamaroside** → libère du HCN : détoxification indispensable (épluchage, rouissage/trempage, fermentation, râpage, séchage, cuisson). Intoxication aiguë ou chronique (neuropathie, goitre par les thiocyanates)."}, {"id": "p:ch5b:11", "lab": "Tombé à l'examen · « Que savez-vous sur… »", "q": "Que savez-vous sur **Rutoside**, **diosmine** ?", "r": "**Rutoside**, **diosmine** : flavonol / flavone veinotoniques."}, {"id": "p:ch5b:12", "lab": "Nouvelle question au format examen", "q": "Flavanones des Citrus et du houblon : naringoside, hopéine ; feuilles sur Citrus « amères et sucrées »", "r": "**Naringoside** (naringénine-7-néohespéridoside) : pamplemousse, **amer** ; **hespéridoside** (rutinoside) : orange, non amer, veinotonique (et matière première de la diosmine). **Hopéine** (= 8-prénylnaringénine) : houblon, **phyto-œstrogène** très puissant. La note « molécules amères et sucrées, y compris chalcones » renvoie au passage néohespéridoside amer → **dihydrochalcone** (NHDC) sucrée, et aux flavanones/chalcones présentes dans les zestes et feuilles de Citrus."}, {"id": "p:ch5b:13", "lab": "Nouvelle question au format examen", "q": "Isoflavonoïdes et flavanolignanes : génistéine, silymarine", "r": "**Génistéine** : isoflavone (cycle B en C3), 5,7,4'-trihydroxy ; soja, trèfle rouge ; **phyto-œstrogène** (affinité ERβ) : bouffées de chaleur de la ménopause, ostéoporose ; prudence en cas de cancer hormonodépendant. **Silymarine** : flavanolignanes (dihydroflavonol taxifoline + alcool coniférylique) ; fruits de chardon-marie ; hépatoprotecteur (stabilise les membranes, antioxydant, ↑ synthèse protéique) ; amanite phalloïde."}, {"id": "p:ch5b:14", "lab": "Nouvelle question au format examen", "q": "Expliquez la couleur d'une anthocyane en fonction du pH (dessinez les formes)", "r": "pH \\ 7 : **base quinonique anionique** bleue (puis dégradation). Conséquence : extraction et conservation en milieu **acide** ; dans la plante, les couleurs bleues stables résultent de la **copigmentation** (intra-/intermoléculaire avec flavones, acides phénols) et de complexes métalliques (Al³⁺, Fe³⁺)."}, {"id": "p:ch5b:15", "lab": "Nouvelle question au format examen", "q": "Flavan-3-ols et proanthocyanidols dimères : catéchine, gallocatéchine ; pourquoi appeler les tanins condensés « proanthocyanidols » ?", "r": "**Catéchine** (flavan-3-ol : cycle C saturé, OH en 3, pas de C=O) et **gallocatéchine** (cycle B trihydroxylé) ; épigallocatéchine-3-gallate du thé vert (antioxydant ; extraits concentrés hépatotoxiques). **Proanthocyanidols dimères** (procyanidines B1-B4) : 2 flavan-3-ols liés C4→C8 ; pépins de raisin, aubépine, cacao ; veinotoniques, antioxydants. Nom « proanthocyanidols » car à chaud en milieu acide ils libèrent un **anthocyanidol** (cyanidol, delphinidol) coloré."}, {"id": "p:ch5b:16", "lab": "Nouvelle question au format examen", "q": "Question de synthèse : « De la plante au médicament » — une plante, plusieurs classes. Citez les constituants majeurs et leur intérêt pour : séné, camomille allemande, réglisse, marronnier d'Inde, thé, Citrus, ail, chardon-marie, saule, millepertuis", "r": "Plante — Constituants majeurs — Intérêt\nSéné — Sennosides A/B (dianthrones) — Laxatif stimulant\nCamomille allemande — Matricine → chamazulène, α-bisabolol, flavonoïdes (apigénine) — Anti-inflammatoire, spasmolytique\nRéglisse — Glycyrrhizine, flavonoïdes — Expectorant, antiulcéreux, édulcorant ; HTA/hypoK\nMarronnier d'Inde — Graine : aescine ; écorce : esculoside — Veinotonique, anti-œdémateux\nThé — Catéchines (EGCG), tanins, caféine, théanine — Antioxydant, stimulant\nCitrus — HE (limonène, citral), flavanones (naringoside, hespéridoside), pectines, furocoumarines — Arôme, veinotonique, gélifiant, interactions (pamplemousse)\nAil — Alliine → allicine, FOS — Antimicrobien, anti-agrégant, prébiotique\nChardon-marie — Silymarine (flavanolignanes) — Hépatoprotecteur\nSaule — Salicoside, tanins — Antalgique, antipyrétique\nMillepertuis — Hypéricine, hyperforine, flavonoïdes — Antidépresseur ; photosensibilisation, interactions CYP3A4"}]}, {"id": "ch5c", "num": "5C", "t": "5C. Anthocyanes", "court": "Anthocyanes", "sym": "flower", "fam": "pol", "niveaux": [{"t": "Définition et rôle", "s": "Structure · Couleur en fonction du pH", "type": "n", "m": ["cyanidol", "pelargonidol", "delphinidol", "oenine"], "q": ["ch5c-q01", "ch5c-q02", "ch5c-q03", "ch5c-q04", "ch5c-q05", "ch5c-q06", "ch5c-q08", "ch5c-q11", "ch5c-q13", "ch5c-q14"], "c": ["ch5c-001", "ch5c-002", "ch5c-003", "ch5c-004", "ch5c-005", "ch5c-006", "ch5c-007", "ch5c-008", "ch5c-009", "ch5c-010", "ch5c-011", "ch5c-012", "ch5c-013", "ch5c-014", "ch5c-015", "ch5c-016", "ch5c-017", "ch5c-018", "ch5c-019", "ch5c-020", "ch5c-039", "ch5c-040"], "pl": ["mauve"]}, {"t": "Stabilisation de la couleur dans la plante", "s": "Propriétés physico-chimiques et extraction", "type": "n", "m": [], "q": ["ch5c-q07", "ch5c-q09"], "c": ["ch5c-021", "ch5c-022", "ch5c-023", "ch5c-024", "ch5c-025", "ch5c-026", "ch5c-027", "ch5c-028"], "pl": []}, {"t": "Pharmacologie et emplois", "s": "Drogues à anthocyanes", "type": "n", "m": ["chrysanthemine"], "q": ["ch5c-q10", "ch5c-q12"], "c": ["ch5c-029", "ch5c-030", "ch5c-031", "ch5c-032", "ch5c-033", "ch5c-034", "ch5c-035", "ch5c-036", "ch5c-037", "ch5c-038"], "pl": ["bleuet", "myrtille"]}, {"t": "Questions d'examen", "s": "5 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch5c:0", "lab": "Liste du prof", "q": "Différence entre anthocyanes, anthocyanosides et anthocyanidols ?", "r": "« Anthocyane » est un terme général englobant les génines (anthocyanidols) et les hétérosides (anthocyanosides)."}, {"id": "p:ch5c:1", "lab": "Liste du prof", "q": "Auto-pigmentation et co-pigmentation intra-/intermoléculaire (dias 12-14) ?", "r": "Cfr explication orale. Les slides : l’empilement (auto-association entre anthocyanosides, sandwich sucres/acides acylants, copigments flavonoïdes, complexes métalliques) protège le cation de l’hydratation → couleur conservée malgré le pH vacuolaire > 3."}, {"id": "p:ch5c:2", "lab": "Question ouverte d'examen", "q": "**Anthocyanes** : définition (anthocyanidols, anthocyanosides), structure de base, stabilité en fonction du pH, extraction et usages.", "r": "**Anthocyane** = terme général englobant les génines (**anthocyanidols**) et les hétérosides (**anthocyanosides**).\nStructure : cation **flavylium** (2-phénylbenzopyrylium), **presque toujours OH en 3**, OH en 5, 7, 4′ (± 3′, 5′) ; ex. **cyanidol**.\n**pH** : flavylium **rouge** stable à pH < 3 → carbinol **incolore** (pH 4–5) → bases quinoïdes **bleues** → chalcone **jaune** (pH > 7). Stabilisés par auto-association, **copigmentation**, complexation métallique.\nInstables (lumière, O2, chaleur) ; extraits par **alcool + HCl dilué** (forme cationique).\n**Usages** : veino-actifs, vision crépusculaire (myrtille), colorant **E163** (raisin, cassis)."}, {"id": "p:ch5c:3", "lab": "Tombé à l'examen · Q1 tableau de structures", "q": "**Anthocyane (cyanidol / anthocyanoside)** : classe et sous-classe, H₂O ou SO, réaction sans chauffage avec NaOH ou HCl ?", "r": "**Classe** : Voie mixte\n**Solubilité** : anthocyanes\n**Sans chauffage** : H₂O"}, {"id": "p:ch5c:4", "lab": "Tombé à l'examen", "q": "Colorant hydrophile (classe, plante, structure, stabilité, utilisation) + pourquoi l'usage des anthocyanes est limité", "r": "**Anthocyanes** (voie mixte, issues du métabolisme des flavonoïdes, précurseurs flavan-3,4-diols) : dérivés du **cation flavylium** (2-phénylbenzopyrylium). Génines = **anthocyanidols** (cyanidol R1 = OH, R2 = H ; delphinidol ; pélargonidol…) ; hétérosides = **anthocyanosides** (3-monosides ou 3,5-diosides).\n**Sources** : fleurs (mauve, bleuet, coquelicot, hibiscus), fruits (cassis, myrtille, raisin, sureau).\n**Stabilité / pH** : pH \\ 7 base anionique bleue. Instables avec l'eau, l'oxygène, la lumière, la chaleur. Le SO₂ forme des dérivés sulfoniques en C4 (décoloration réversible). Stabilisation naturelle par copigmentation et complexes métalliques. **Extraction : alcool + ~1 % HCl.**\n**Activités** : antioxydants ; inhibiteurs de l'élastase et de la collagénase (protègent les parois vasculaires) et de la hyaluronidase ; **veino-actifs** (insuffisance veineuse) ; ophtalmologie (troubles circulatoires rétine/choroïde, vision crépusculaire — myrtille).\n**Usage limité** car **instables en milieu aqueux** (couleur qui change ou disparaît avec le pH) et **insolubles dans les lipides**. Additifs alimentaires non toxiques (E163 : boissons, confitures, confiserie).\nAutre colorant hydrosoluble possible : **crocine** (safran)."}]}, {"id": "ch6", "num": "6", "t": "6. Tanins", "court": "Tanins", "sym": "flower", "fam": "pol", "niveaux": [{"t": "Ancienne classification", "s": "Définition générale et classification actuelle · Tanins hydrolysables · Tanins hydrolysables", "type": "n", "m": ["acide-hhdp", "acide-ellagique", "pentagalloylglucose"], "q": ["ch6-q01", "ch6-q02", "ch6-q03", "ch6-q05", "ch6-q06", "ch6-q12", "ch6-q13", "ch6-q16"], "c": ["ch6-001", "ch6-002", "ch6-003", "ch6-004", "ch6-005", "ch6-006", "ch6-007", "ch6-008", "ch6-009", "ch6-010", "ch6-011", "ch6-012", "ch6-013", "ch6-015", "ch6-016", "ch6-020", "ch6-040", "ch6-041", "ch6-042"], "pl": ["chene-galle", "hamamelis"]}, {"t": "Pourquoi « hydrolysables » ?", "s": "Tanins condensés · Proanthocyanidols", "type": "n", "m": ["catechine", "epicatechine", "gallocatechine", "leucocyanidol", "procyanidine-dimere"], "q": ["ch6-q04", "ch6-q07", "ch6-q08", "ch6-q09", "ch6-q10", "qcm51-10"], "c": ["ch6-014", "ch6-017", "ch6-018", "ch6-019", "ch6-021", "ch6-022", "ch6-023", "ch6-024", "ch6-025", "ch6-026", "ch6-043"], "pl": ["ratanhia", "pelargonium-sidoides"]}, {"t": "Solubilité, extraction, caractérisation", "s": "Propriétés biologiques et emplois", "type": "n", "m": [], "q": ["ch6-q15"], "c": ["ch6-027", "ch6-028", "ch6-029", "ch6-030", "ch6-031", "ch6-032", "ch6-033", "ch6-034", "ch6-035"], "pl": []}, {"t": "Proanthocyanidols dimères et trimères", "s": "Pigments des vins rouges", "type": "n", "m": [], "q": ["ch6-q14"], "c": ["ch6-036", "ch6-037", "ch6-038", "ch6-039"], "pl": ["canneberge", "cannelle"]}, {"t": "Questions d'examen", "s": "2 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch6:0", "lab": "Question ouverte d'examen", "q": "À une personne qui ne sait pas ce que sont les **tanins**, comment allez-vous les définir (propriétés principales, biologiques et thérapeutiques) ? Il existe 2 types de structure : donnez la structure de base de chaque type.", "r": "**Définition** : composés polyphénoliques **hydrosolubles**, PM 500–3000, qui en plus des réactions des phénols **précipitent les protéines et les alcaloïdes**.\n**Propriétés principales** : tannantes (peau → cuir imputrescible), **astringence** (précipitation des glycoprotéines salivaires), complexation des protéines (affinité pour la proline).\n**Biologiques** : antioxydants, inhibiteurs enzymatiques, antiviraux, vasoconstricteurs locaux, antiseptiques.\n**Thérapeutiques** : **antidiarrhéiques**, **hémostatiques**, cicatrisants (plaies, brûlures), hémorroïdes, affections buccales.\n**Structures** : (1) **tanins hydrolysables** = esters de **glucose** et d'**acide gallique** (galliques) ou d'**HHDP / acide ellagique** (ellagiques) ; (2) **tanins condensés** = polymères **non osidiques** de **flavan-3-ols** (catéchine, gallocatéchine) liés **C4→C8** (ou C4→C6), qui donnent un **anthocyanidol** à chaud en milieu acide (proanthocyanidols)."}, {"id": "p:ch6:1", "lab": "Tombé à l'examen", "q": "À une personne qui ne sait pas ce que sont les tanins : définition, propriétés, 2 structures", "r": "**Définition** : composés **polyphénoliques hydrosolubles**, PM 500-3 000, qui, en plus des réactions classiques des phénols, **précipitent les alcaloïdes et les protéines**.\n**Propriétés** : **tannantes** (peau fraîche → cuir imputrescible par pontage des fibres de collagène) · **complexation** des macromolécules, surtout les protéines (affinité pour la proline) · **astringentes** (précipitent les glycoprotéines salivaires → âpreté) · **piégeurs de radicaux libres** · **inhibiteurs enzymatiques** : 5-lipoxygénase (anti-inflammatoire), hyaluronidase (gaine vasculaire), transcriptase inverse (antiviral).\n**Usages thérapeutiques** : vasoconstricteurs des petits vaisseaux superficiels · cicatrisants (blessures superficielles, brûlures, hémorroïdes) · **antidiarrhéiques** · antiseptiques (dermatoses, bouche, diarrhées infectieuses). Inconvénients : diminuent l'absorption du fer et de certains médicaments (alcaloïdes).\n**Les 2 types** :\n1. **Tanins hydrolysables** (galliques et ellagiques) : **polyesters d'un sucre (glucose) et d'acide phénol**. Galliques : acide **gallique** (1 liaison ester/molécule ; ex. pentagalloylglucose, tanin de la noix de galle). Ellagiques : acide **hexahydroxydiphénique (HHDP)** (2 liaisons ester) → libéré, il se lactonise en **acide ellagique**. Hydrolysés par acide + chaleur (ou tannase).\n2. **Tanins condensés** (catéchiques, proanthocyanidols) : **non hétérosidiques**, polymères de **flavan-3-ols** (catéchine, épicatéchine, gallocatéchine) liés C4→C8 (ou C4→C6) — liaisons C–C non hydrolysables. Thé vert, raisin (pépins), aubépine, cacao.\n**Les distinguer** : acide à chaud → condensés donnent un **anthocyanidol** rouge (+ phlobaphènes), hydrolysables donnent acide gallique / ellagique · **réaction de Stiasny** (formol + HCl) : condensés **précipitent**, hydrolysables restent en solution."}]}, {"id": "ch7", "num": "7", "t": "7. Quinones", "court": "Quinones", "sym": "sun", "fam": "qui", "niveaux": [{"t": "Définition et noyaux", "s": "Propriétés physico-chimiques · Biosynthèse et distribution · Benzoquinones · Naphtoquinones", "type": "n", "m": ["arbutoside", "hydroquinone", "primine", "coenzyme-q10", "plumbagone", "lawsone", "juglone", "vitamine-k1", "vitamine-k2"], "q": ["ch7-q01", "ch7-q02", "ch7-q03", "ch7-q04", "ch7-q05", "ch7-q06", "qcm51-8"], "c": ["ch7-001", "ch7-002", "ch7-003", "ch7-004", "ch7-005", "ch7-006", "ch7-007", "ch7-008", "ch7-009", "ch7-010", "ch7-011", "ch7-012", "ch7-013", "ch7-014", "ch7-015", "ch7-016", "ch7-017", "ch7-018", "ch7-019", "ch7-020", "ch7-021", "ch7-022", "ch7-023", "ch7-024", "ch7-025", "ch7-026", "ch7-027"], "pl": ["busserole", "drosera", "henne", "noyer-brou", "primevere-obconica"]}, {"t": "Anthraquinones tinctoriales", "s": "Dérivés 1,8-dihydroxyanthracéniques laxatifs · O-hétérosides et séchage", "type": "n", "m": ["acide-carminique", "chrysophanol", "aloe-emodol", "rheine", "emodol", "franguloside-a", "glucofranguloside-a", "sennidine-b", "sennoside-b"], "q": ["ch7-q07", "ch7-q08", "ch7-q09", "ch7-q10", "ch7-q11", "ch7-q19", "ch7-q21"], "c": ["ch7-028", "ch7-029", "ch7-030", "ch7-031", "ch7-032", "ch7-033", "ch7-034", "ch7-035", "ch7-036", "ch7-037", "ch7-038", "ch7-039", "ch7-040", "ch7-041", "ch7-042", "ch7-043", "ch7-044", "ch7-045", "ch7-046", "ch7-047", "ch7-048", "ch7-049", "ch7-050", "ch7-051", "ch7-052", "ch7-068", "ch7-074", "ch7-085", "ch7-086"], "pl": ["bourdaine", "sene", "rhubarbe", "cochenille"]}, {"t": "C-hétérosides et Solubilités, hydrolyse, transformations", "s": "Activité, mécanisme, relation structure–activité", "type": "n", "m": ["aloine-a", "aloine-b", "cascaroside-a", "aloinoside-a"], "q": ["ch7-q12", "ch7-q13", "ch7-q14", "ch7-q16", "ch7-q18", "vf50-6"], "c": ["ch7-053", "ch7-054", "ch7-055", "ch7-056", "ch7-057", "ch7-058", "ch7-059", "ch7-060", "ch7-061", "ch7-062", "ch7-063", "ch7-064", "ch7-065", "ch7-066", "ch7-067", "ch7-069", "ch7-070"], "pl": ["cascara", "aloes"]}, {"t": "Usage, contre-indications, effets indésirables", "s": "Naphtodianthrones · Divers", "type": "n", "m": ["diacerheine", "hypericine", "hyperforine"], "q": ["ch7-q15", "ch7-q17", "ch7-q20", "ch7-q22"], "c": ["ch7-071", "ch7-072", "ch7-073", "ch7-075", "ch7-076", "ch7-077", "ch7-078", "ch7-079", "ch7-080", "ch7-081", "ch7-082", "ch7-083", "ch7-084"], "pl": ["millepertuis"]}, {"t": "Questions d'examen", "s": "12 questions : liste du prof, sessions passées, nouvelles", "type": "prof"}, {"t": "Le Gardien : examen blanc", "s": "Tout le chapitre mélangé, comme le jour J", "type": "boss"}], "cartes": [{"id": "p:ch7:0", "lab": "Liste du prof", "q": "Dias 49-50 (et dosage des O- vs C-hétérosides) : que faut-il retenir ?", "r": "Les diapositives 45 à 53 ne sont pas à connaître et sont masquées."}, {"id": "p:ch7:1", "lab": "Liste du prof", "q": "Dia 60 : faut-il retenir les noms de spécialités ?", "r": "Dans l
