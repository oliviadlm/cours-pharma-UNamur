<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPHAB311 · Anciens examens</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--muted:#6b6f76;--line:#e3e0d8;--accent:#2f5d8a;--accent-soft:#e8f0f8;--ok:#2e7d4f;--ok-soft:#e6f4ec;--ko:#b3412e;--ko-soft:#fbeae6;--warn:#9a6a00;--warn-soft:#fff5dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:16px 14px 60px}
.kick{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-size:23px;margin:2px 0 4px} h2{font-size:18px;margin:4px 0 8px} h3{font-size:16px;margin:2px 0 6px}
.sub{color:var(--muted);font-size:14px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
nav button{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:7px 11px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.box{border-radius:9px;padding:9px 12px;margin:8px 0;font-size:14.5px}
.box.warn{background:var(--warn-soft)} .box.ko{background:var(--ko-soft)} .box.ok{background:var(--ok-soft)} .box.info{background:var(--accent-soft)}
.pill{display:inline-block;font-size:12px;border-radius:20px;padding:1px 9px;background:var(--accent-soft);color:var(--accent);margin-right:4px;white-space:nowrap}
.pill.th{background:#efeae0;color:#6a5a3a}
.stars{color:#c98a00;letter-spacing:1px}
table{border-collapse:collapse;width:100%;font-size:14px} td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
pre{white-space:pre-wrap;background:#faf8f3;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
.step{display:grid;grid-template-columns:1fr auto auto;gap:6px 8px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.step input{width:130px;font:inherit;padding:5px 8px;border:1.5px solid var(--line);border-radius:7px}
.step input.good{border-color:var(--ok);background:var(--ok-soft)} .step input.bad{border-color:var(--ko);background:var(--ko-soft)}
.step .u{color:var(--muted);font-size:13px;min-width:46px}
.corr{grid-column:1/-1;background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-size:14px}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;margin:4px 4px 0 0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:8px 11px;margin:6px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--ko);background:var(--ko-soft)}
.opt .vf{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.opt.done{cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{font:inherit;padding:5px 8px;border-radius:8px;border:1.5px solid var(--line)}
textarea{width:100%;min-height:150px;font:inherit;padding:9px;border:1.5px solid var(--line);border-radius:9px}
.keys label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:14.5px}
.score{font-size:28px;font-weight:700}
.bar{height:8px;background:#e9e6df;border-radius:9px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.stat b{font-size:20px;display:block}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.hidden{display:none}
@media (max-width:600px){.step{grid-template-columns:1fr auto}.step .u{display:none}}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:12px 0 4px}
.gal figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:zoom-in;transition:transform .15s,box-shadow .15s}
.gal figure:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.gal .ph{height:150px;display:flex;align-items:center;justify-content:center;background:#fff;padding:8px}
.gal .ph.photo{padding:0}
.gal img{max-width:100%;max-height:100%;object-fit:contain}
.gal .ph.photo img{width:100%;height:100%;object-fit:cover}
.gal figcaption{font-size:13px;padding:7px 9px 8px;line-height:1.35;border-top:1px solid var(--line)}
.gal .cr{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.gal .cr a{color:inherit}
#lb{position:fixed;inset:0;background:rgba(20,20,25,.82);display:none;align-items:center;justify-content:center;z-index:99;padding:20px;cursor:zoom-out}
#lb.on{display:flex} #lb div{background:#fff;border-radius:12px;padding:12px;max-width:92vw;max-height:90vh;display:flex;flex-direction:column;align-items:center}
#lb img{max-width:86vw;max-height:76vh;object-fit:contain} #lb p{margin:8px 0 0;font-size:14px;color:#333;text-align:center}
</style>
</head>

  let s = (Math.round(n * 10 ** d) / 10 ** d).toFixed(d).replace(/0+$/, "").replace(/\.$/, "");
  const [i, f] = s.split(".");
  return f ? i.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + "," + f : i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");

const pick = a => a[Math.floor(Math.random() * a.length)];
function supEx(dose, n, mPure, nPure, mMed, nMed, pa) {
  const E = mPure / nPure, u = mMed / nMed, M = 0.9 * u, S = 0.1 * u, f = (E - M) / S, base = (E - f * dose / 1000) * (n + 1);
  return { ctx: `Rp/ ${pa} ${dose} mg\n    excipient q.s.\n    pf 1 suppositoire dt ${n}\n\n${nPure} suppositoires de masse pure pèsent ${fmt(mPure)} g ; ${nMed} suppositoires à 10 % de PA pèsent ${fmt(mMed)} g.`,
    q: "a) Facteur de déplacement f ? b) Masse d'excipient à peser en pratique ?",
    steps: [
      { label: "E : masse d'un suppositoire de masse pure (g)", ans: E, unit: "g", tol: { rel: 0.002 }, show: `${fmt(mPure)} / ${nPure} = ${fmt(E, 4)} g`, why: "1re coulée : on étalonne le moule." },
      { label: "Masse d'un suppositoire à 10 % (g)", ans: u, unit: "g", tol: { rel: 0.002 }, show: `${fmt(mMed)} / ${nMed} = ${fmt(u, 5)} g`, why: "2e coulée, avec arbitrairement 10 % de PA." },
      { label: "M : masse d'excipient dans ce suppositoire (g)", ans: M, unit: "g", tol: { rel: 0.003 }, show: `${fmt(u, 5)} × 0,9 = ${fmt(M, 4)} g`, why: "90 % d'excipient." },
      { label: "S : masse de PA dans ce suppositoire (g)", ans: S, unit: "g", tol: { rel: 0.003 }, show: `${fmt(u, 5)} × 0,1 = ${fmt(S, 4)} g`, why: "10 % de PA." },
      { label: "a) f = (E − M) / S", ans: f, unit: "", tol: { abs: 0.01 }, show: `(${fmt(E, 4)} − ${fmt(M, 4)}) / ${fmt(S, 4)} = ${fmt(f, 3)}`, why: "Masse d'excipient déplacée par 1 g de PA." },
      { label: `b) Masse d'excipient pour ${n} + 1 = ${n + 1} suppositoires (g)`, ans: base, unit: "g", tol: { rel: 0.004 }, show: `(${fmt(E, 4)} − ${fmt(f, 3)} × ${fmt(dose / 1000)}) × ${n + 1} = ${fmt(base, 3)} g`, why: "« En pratique » = on prévoit 1 suppositoire de plus pour les pertes de coulée." }] };
}
function eqEx(V, agents, other) {
  // agents : [[nom, conc, unité ('%' m/V ou 'g/L' ou 'mg'), E]]
  const parts = agents.map(([nm, c, u, E]) => { const m = u === "%" ? c * V / 100 : u === "g/L" ? c * V / 1000 : c / 1000; return { nm, m, E, txt: u === "mg" ? `${fmt(c)} mg` : `${fmt(c)} ${u === "%" ? "%" : "g/L"} × ${V} mL = ${fmt(m, 4)} g` }; });
  const sum = parts.reduce((a, p) => a + p.m * p.E, 0), need = 0.9 * V / 100, add = need - sum;
  const steps = [
    { label: "Masse(s) de PA (g)", ans: parts.reduce((a, p) => a + p.m, 0), unit: "g (total)", tol: { rel: 0.003 }, show: parts.map(p => `${p.nm} : ${p.txt}`).join(" ; "), why: "On convertit tout en grammes pour le volume prescrit." },
    { label: "Équivalent NaCl apporté par les PA (g)", ans: sum, unit: "g", tol: { rel: 0.01 }, show: parts.map(p => `${fmt(p.m, 4)} × ${fmt(p.E)}`).join(" + ") + ` = ${fmt(sum, 4)} g`, why: "E = g de NaCl qui ont le même effet osmotique que 1 g de PA." },
    { label: `NaCl pour ${V} mL isotoniques (g)`, ans: need, unit: "g", tol: { rel: 0.003 }, show: `0,9 g/100 mL × ${V} mL = ${fmt(need, 4)} g`, why: "NaCl 0,9 % = isotonique." },
    { label: "NaCl à ajouter (mg)", ans: add * 1000, unit: "mg", tol: { rel: 0.01 }, show: `${fmt(need, 4)} − ${fmt(sum, 4)} = ${fmt(add, 4)} g = ${fmt(add * 1000, 1)} mg`, why: "On complète ce qui manque." }];
  if (other) steps.push({ label: `${other[0]} à ajouter à la place (mg)`, ans: add / other[1] * 1000, unit: "mg", tol: { rel: 0.01 }, show: `${fmt(add * 1000, 1)} / ${fmt(other[1])} = ${fmt(add / other[1] * 1000, 1)} mg`, why: `Autre agent : on divise la masse de NaCl manquante par son E (${fmt(other[1])}).` });
  return { ctx: `Rp/ ${agents.map(([nm, c, u, E]) => `${nm} ${fmt(c)} ${u === "%" ? "%" : u} (E = ${fmt(E)})`).join("\n    ")}\n    ${other ? other[0] + " q.s." : "NaCl q.s."}\n    aqua q.s. ad ${V} mL`, q: other ? `Quantité de NaCl, puis de ${other[0]}, pour isotoniser ?` : "Quantité de NaCl à ajouter pour isotoniser ?", steps };
}
function cryoEx(V, c, dT, pa) {
  const pct = (0.52 - c * dT) / 0.58, g = pct * V / 100;
  return { ctx: `${V} mL d'une solution à ${fmt(c)} % (m/V) de ${pa}\nΔT ${pa} (1 %) = ${fmt(dT)} ; ΔT NaCl (1 %) = 0,58`, q: "Quantité de NaCl à ajouter pour la rendre isotonique avec le sang ?",
    steps: [
      { label: "Abaissement dû au PA (°C)", ans: c * dT, unit: "°C", tol: { rel: 0.005 }, show: `${fmt(c)} × ${fmt(dT)} = ${fmt(c * dT, 4)} °C`, why: "ΔT est proportionnel à la concentration." },
      { label: "% de NaCl (g/100 mL)", ans: pct, unit: "%", tol: { rel: 0.005 }, show: `(0,52 − ${fmt(c * dT, 4)}) / 0,58 = ${fmt(pct, 4)} %`, why: "Il manque (0,52 − ΔT PA) ; 1 % de NaCl abaisse de 0,58 °C." },
      { label: `NaCl pour ${V} mL (g)`, ans: g, unit: "g", tol: { rel: 0.005 }, show: `${fmt(pct, 4)} × ${V} / 100 = ${fmt(g, 4)} g`, why: "Règle de trois sur le volume." }] };
}
function tritEx(ug, n, per1000, label) {
  const tot = ug * n / 1000, m = tot * 1000 / per1000;
  return { ctx: `Rp/ éthinylestradiol ${ug} µg\n    acétate de cyprotérone 2 mg\n    pf 1 gél dt ${n}`, q: `Quantité (mg) de trituration d'éthinylestradiol à ${label} à peser ?`,
    steps: [
      { label: "PA total (µg)", ans: ug * n, unit: "µg", show: `${ug} × ${n} = ${ug * n} µg`, why: "Dose × nombre de gélules." },
      { label: "PA total (mg)", ans: tot, unit: "mg", tol: { rel: 0.001 }, show: `${ug * n} µg = ${fmt(tot)} mg`, why: "On travaille en mg." },
      { label: "Trituration à peser (mg)", ans: m, unit: "mg", tol: { rel: 0.002 }, show: `${label} : ${fmt(per1000)} mg de PA dans 1000 mg → ${fmt(tot)} × 1000 / ${fmt(per1000)} = ${fmt(m, 2)} mg`, why: "Règle de trois sur la teneur de la trituration." }] };
}
function tritSurd(mg, n, pct) {
  const tot = mg * n, t = tot * 100 / pct, s = t * 1.05;
  return { ctx: `Rp/ dexaméthasone ${fmt(mg)} mg (utiliser trituration à ${pct} %)\n    pf ${n} gélules\nLa quantité de PA par gélule est < 10 mg : surdosage de 5 % nécessaire.`, q: `Quantité (g) de trituration à ${pct} % à peser ?`,
    steps: [
      { label: "PA total (mg)", ans: tot, unit: "mg", tol: { rel: 0.001 }, show: `${fmt(mg)} × ${n} = ${fmt(tot)} mg`, why: "Dose × nombre." },
      { label: "Trituration sans surdosage (mg)", ans: t, unit: "mg", tol: { rel: 0.002 }, show: `${pct} mg de PA dans 100 mg → ${fmt(tot)} × 100 / ${pct} = ${fmt(t)} mg`, why: `Trituration à ${pct} %.` },
      { label: "Avec 5 % de surdosage (g)", ans: s / 1000, unit: "g", tol: { rel: 0.002 }, show: `${fmt(t)} × 1,05 = ${fmt(s)} mg = ${fmt(s / 1000, 4)} g`, why: "Compense les pertes sur les parois (gélules < 10 mg de PA)." }] };
}
function alcoPP(v, dAbs, dDil) {
  const p = v * dAbs / dDil;
  return { ctx: `Mélange eau-alcool à ${v}° (% V/V) ; d alcool absolu = ${fmt(dAbs)} ; d alcool dilué = ${fmt(dDil)}`, q: "Titre pondéral (% m/m) ?",
    steps: [{ label: "% m/m", ans: p, unit: "%", tol: { rel: 0.003 }, show: `${v} × ${fmt(dAbs)} / ${fmt(dDil)} = ${fmt(p, 3)} %`, why: "% p/p = % V/V × d(alcool absolu) / d(mélange) : on passe de mL d'alcool par 100 mL à g d'alcool par 100 g." }] };
}
function alcoMix(L, t1, d1, p1, t2, p2, tf, df, pf) {
  const m1 = L * 1000 * d1, P = m1 * (pf - p1) / (p2 - pf), V = P / df;
  return { ctx: `${L} L d'alcool à ${t1}° (d = ${fmt(d1)})\nTitres pondéraux : ${t1}° = ${fmt(p1)} % ; ${tf}° = ${fmt(pf)} % ; ${t2}° = ${fmt(p2)} %\nAlcool à ${t2}° : d = ${fmt(df)}`, q: `Volume d'alcool à ${t2}° à ajouter pour obtenir un titre de ${tf}° ?`,
    steps: [
      { label: `Masse de l'alcool à ${t1}° (g)`, ans: m1, unit: "g", tol: { rel: 0.002 }, show: `${L * 1000} mL × ${fmt(d1)} = ${fmt(m1)} g`, why: "Les volumes ne s'additionnent pas (contraction) : on travaille en masses." },
      { label: `Masse d'alcool à ${t2}° (g)`, ans: P, unit: "g", tol: { rel: 0.003 }, show: `${fmt(m1)} × ${fmt(p1)} + P × ${fmt(p2)} = ${fmt(pf)} × (${fmt(m1)} + P) → P = ${fmt(m1)} × (${fmt(pf)} − ${fmt(p1)}) / (${fmt(p2)} − ${fmt(pf)}) = ${fmt(P, 1)} g`, why: "Conservation de l'alcool absolu, en titres pondéraux." },
      { label: `Volume d'alcool à ${t2}° (mL)`, ans: V, unit: "mL", tol: { rel: 0.004 }, show: `${fmt(P, 1)} / ${fmt(df)} = ${fmt(V, 1)} mL`, why: "V = m / d." }] };
}
function gabbro(conc, vol, cac, perDay, days, kg, lo, hi, tabMg, tabW) {
  const daily = cac * 5 * conc * perDay, mgkg = daily / kg, need = 5 * cac * perDay * days, pa = conc * vol, nTab = Math.ceil(pa / tabMg), excess = nTab * tabMg - pa, powder = excess / tabMg * tabW;
  return { ctx: `Rp/ Gabbroral® ${tabMg} mg\n    pf suspension à ${conc} mg/mL dt ${vol} mL\nS/ ${cac} c.à.c. ${perDay}x/jour pendant ${days} jours\nEnfant de ${kg} kg ; RCP : ${lo} à ${hi} mg/kg/jour ; 1 comprimé pèse ${tabW} mg`,
    q: "a) Posologie correcte ? b) Assez de suspension ? c) Combien de comprimés broyer ? d) Quelle masse de poudre enlever ?",
    steps: [
      { label: "a) Dose journalière prescrite (mg/jour)", ans: daily, unit: "mg/j", tol: { rel: 0.002 }, show: `${cac} × 5 mL × ${conc} mg/mL × ${perDay} = ${fmt(daily)} mg/jour`, why: "1 c.à.c. = 5 mL." },
      { label: "a) Dose maximale RCP (mg/jour)", ans: hi * kg, unit: "mg/j", show: `${hi} × ${kg} = ${hi * kg} mg/jour (min. ${lo * kg})`, why: `Soit ${fmt(mgkg, 1)} mg/kg/jour prescrits → ${mgkg > hi ? "TROP ÉLEVÉ : posologie incorrecte, on contacte le médecin" : mgkg < lo ? "trop faible" : "dans l'intervalle : correcte"}.` },
      { label: "b) Volume nécessaire (mL)", ans: need, unit: "mL", show: `${cac} × 5 × ${perDay} × ${days} = ${need} mL`, why: `${need <= vol ? `≤ ${vol} mL : la quantité suffit` : `> ${vol} mL : la quantité ne suffit pas`}.` },
      { label: "c) Nombre de comprimés à broyer", ans: nTab, unit: "comprimés", show: `${conc} × ${vol} = ${fmt(pa)} mg de PA → ${fmt(pa)} / ${tabMg} = ${fmt(pa / tabMg, 2)} → ${nTab} comprimés`, why: "On arrondit au comprimé entier supérieur." },
      { label: "d) Poudre à enlever (mg)", ans: powder, unit: "mg", tol: { rel: 0.003 }, show: `PA en trop : ${nTab * tabMg} − ${fmt(pa)} = ${fmt(excess)} mg → ${fmt(excess)} / ${tabMg} × ${tabW} = ${fmt(powder, 1)} mg de poudre`, why: "Le PA est réparti dans toute la poudre du comprimé : on enlève la masse de poudre qui contient le PA en trop." }] };
}

const OPEN = [
{ id: "o1", src: "2008 · 2009 · 2010 · 2011 · 2012 · 2013 · 2019 · 2022", star: 3, q: "Citez et expliquez les facteurs qui influencent la solubilité, puis les méthodes pour augmenter la solubilité d'un PA. Que faire si elles échouent ?",
  a: `<p><b>Facteurs</b> : nature des forces dans la molécule et le solvant ; solubilisation par <b>ionisation</b> (NaCl) ou par <b>polarité</b> ; <b>constante diélectrique</b> du solvant (polaires ε élevée : eau, glycérol, PG ; apolaires ε faible : huiles) ; <b>température</b> (augmente en général, exceptions : citrate de calcium, méthylcellulose) ; <b>pH</b> pour les acides et bases faibles ; état solide (polymorphisme, amorphe plus soluble).</p>
  <p><b>Les 7 moyens</b> (dia 142, « TUYAU ») :</p><ol>
  <li><b>Co-solvants</b> miscibles au solvant principal (propylène glycol, glycérol, éthanol ; ex. minoxidil, diazépam injectable).</li>
  <li><b>Température</b> (attention à la dégradation ; exceptions).</li>
  <li><b>pH</b> (Henderson-Hasselbalch) : acides faibles solubles à pH ≥ pKa + 2, bases faibles à pH ≤ pKa − 2.</li>
  <li><b>Solubilisation micellaire</b> au-dessus de la CMC : pseudosolubilisation (vitamines liposolubles, huiles essentielles, liposomes d'amphotéricine).</li>
  <li><b>Complexation</b> par cyclodextrines (cône tronqué, extérieur hydrophile, cavité lipophile ; β-CD la plus utilisée, néphrotoxique en injectable → hydroxypropyl) : piroxicam + β-CD = Brexine®.</li>
  <li><b>Substances hydrotropes</b> (salting-in) : benzoate de sodium pour la caféine, nicotinamide pour la riboflavine.</li>
  <li><b>Modification chimique</b> : sel ou ester soluble (succinate sodique de méthylprednisolone, 21-succinate sodique d'hydrocortisone en IV).</li></ol>
  <p><b>Si tout échoue</b> : formuler une <b>suspension</b> (ou une émulsion si le PA est huileux).</p>`,
  keys: ["ionisation et polarité", "constante diélectrique", "température + exceptions", "pH + Henderson-Hasselbalch (pKa ± 2)", "les 7 moyens avec 1 exemple chacun", "CMC / pseudosolubilisation", "cyclodextrines : structure + Brexine®", "hydrotropes : caféine, riboflavine", "suspension si échec"] },
{ id: "o2", src: "2010 · 2011 · 2013 · 2019 · août 2019 · 2022", star: 3, q: "Expliquez le graphique du palmitate de chloramphénicol : que montre-t-il, quelle propriété fondamentale de l'état solide illustre-t-il, et qu'est-ce que la sursaturation ?",
  a: `<p><b>Le graphique</b> : concentrations sériques de chloramphénicol (µg/mL) en fonction du temps (0 à 24 h) après des suspensions contenant des proportions variables de forme <b>α (stable)</b> et <b>β (métastable)</b> : M = 100 % α, N = 25:75 β:α, O = 50:50, P = 75:25, L = 100 % β.</p>
  <p><b>Lecture</b> : plus la proportion de forme <b>métastable β</b> augmente, plus le pic sérique est élevé (≈ 22 µg/mL avec 100 % β contre ≈ 2–3 µg/mL avec 100 % α). Même PA, même dose : la biodisponibilité change avec la forme cristalline.</p>
  <p><b>Propriété</b> : le <b>polymorphisme</b>, capacité d'une substance pure d'exister sous au moins deux structures cristallines différentes. Une seule forme est stable à T et P données ; les autres sont <b>métastables</b> : point de fusion plus bas, <b>solubilité et vitesse de dissolution plus élevées</b>. Le palmitate (prodrogue) doit être hydrolysé, ce qui exige qu'il soit dissous : la forme β, plus soluble, est mieux absorbée.</p>
  <p><b>Sursaturation</b> : une solution contient plus de soluté que la solubilité d'équilibre (de la forme stable) à cette température. La forme métastable, plus soluble, peut donner une concentration supérieure à la solubilité de la forme stable : la solution est sursaturée, donc instable, et la forme stable finit par précipiter (cristallisation).</p>
  <p><b>Conséquence pratique</b> : contrôler la forme cristalline des matières premières ; la forme métastable n'est utilisable que si sa conversion est lente pendant la durée de vie du médicament.</p>`,
  keys: ["axes : taux sériques / temps", "α stable, β métastable, mélanges", "plus de β → taux sériques plus élevés", "polymorphisme : définition", "métastable : plus soluble, fusion plus basse", "biodisponibilité", "sursaturation : définition + précipitation de la forme stable"] },
{ id: "o3", src: "2013 · 2018 · 2019 · août 2019 · 2022", star: 3, q: "Citez les différentes voies d'administration et donnez un exemple de forme galénique pour chacune.",

{ id: "o4", src: "2009 · 2012 · 2013 (+ annotation « question d'examen »)", star: 2, q: "Décrivez les différents types de fluides en rhéologie, avec leurs graphiques, et comment on peut viscosifier une solution.",
  a: `<p><b>Grandeurs</b> : contrainte de cisaillement τ, vitesse de cisaillement D, viscosité η = τ/D (Pa·s ; 1 Pa·s = 10 P) ; la viscosité des liquides diminue quand la température augmente.</p>
  <ul><li><b>Newtoniens</b> : viscosité constante quelle que soit la contrainte. D = f(τ) est une droite passant par l'origine ; η = f(D) est horizontale. Ex. : eau.</li>
  <li><b>Rhéofluidifiants (pseudoplastiques)</b> : la viscosité diminue avec le cisaillement, ils se fluidifient sous agitation (utiles pour les suspensions). Ex. : dispersions de méthylcellulose, gommes, alginate de sodium.</li>
  <li><b>Rhéoépaississants (dilatants)</b> : la viscosité augmente avec le cisaillement. Peu d'applications : pâtes, suspensions très chargées.</li>
  <li><b>Plastiques</b> : ne s'écoulent qu'au-delà d'un <b>seuil d'écoulement</b> (ordonnée à l'origine), qui correspond à la force pour vaincre la cohésion.</li>
  <li><b>Thixotropes</b> : la viscosité diminue avec le temps d'agitation puis revient au repos ; mémoire de la déformation = <b>hystérésis</b>. Ex. : gels.</li></ul>
  <p><b>Viscosifier</b> : polymères (colloïdes lyophiles) qui s'entourent d'une couche de solvatation : celluloses (hypromellose, CMC sodique, méthylcellulose), gommes, alginates, carbomères. Utilité : ralentir la sédimentation ou le crémage (Stokes), masquer le goût, prolonger l'action (collyre visqueux), gels cutanés, comprimés matriciels, effet muco-adhésif.</p>`,
  keys: ["τ, D, η = τ/D, Pa·s", "newtonien : graphiques", "rhéofluidifiant + exemple", "rhéoépaississant", "plastique : seuil d'écoulement", "thixotrope : hystérésis, gels", "agents viscosifiants + usages"] },
{ id: "o5", src: "2008 · 2010 · 2011 · 2012 · août 2019", star: 2, q: "Quelles sont les influences de la taille des particules ? Énoncez et expliquez la loi de Stokes, et l'influence de la viscosité sur la sédimentation.",
  a: `<p><b>Les 6 influences</b> (dia 60) : 1) vitesse de dissolution (Noyes-Whitney : petites particules = plus de surface = dissolution plus rapide, in vitro et in vivo) ; 2) écoulement des poudres (grosses sphériques coulent mieux que petites irrégulières) ; 3) homogénéité du mélange et sa stabilité ; 4) efficacité des lubrifiants (comprimés, gélules) ; 5) dépôt des particules inhalées (fraction respirable 1–6 µm) ; 6) stabilité des dispersions (suspensions, émulsions).</p>
  <p><b>Loi de Stokes</b> : v = 2 r² g (ρp − ρl) / 9 η (ou avec le diamètre : d² g (ρp − ρl) / 18 η). La vitesse de sédimentation augmente avec le carré de la taille et la différence de masse volumique, et diminue quand la viscosité du liquide augmente.</p>
  <p><b>Stabiliser</b> : microniser (r ↓), rapprocher les densités, <b>augmenter la viscosité de la phase externe</b> avec un agent viscosifiant : la sédimentation (suspension, E/H) ou le crémage (H/E) ralentit.</p>`,
  keys: ["6 influences", "Noyes-Whitney", "fraction respirable 1–6 µm", "formule de Stokes et ses termes", "r² : micronisation", "viscosité au dénominateur", "agents viscosifiants"] },
{ id: "o6", src: "2008 · 2009 · 2010 · 2011", star: 2, q: "Définissez préparation magistrale, préparation officinale et spécialité. Dans quelles circonstances la préparation magistrale est-elle indiquée ?",
  a: `<ul><li><b>Magistrale</b> : préparée <b>extemporanément</b> à l'officine, sous la surveillance du pharmacien, le plus souvent sur <b>prescription</b>. Ex. : ergotamine 1 mg + caféine 100 mg + cyclizine 50 mg, pf 1 gélule dt XX.</li>

{ id: "o8", src: "2008 · cours", star: 1, q: "La structure cristalline et son influence sur la biodisponibilité.",
  a: `<p>Solides cristallins : arrangements ordonnés (maille, 7 systèmes : cubique, tétragonal, orthorhombique, monoclinique, triclinique, hexagonal, rhomboédrique) ; amorphes : désordonnés et souvent plus solubles. <b>Polymorphisme</b> : formes différentes de densité, point de fusion, spectres, solubilité et vitesse de dissolution, d'où des différences de biodisponibilité (palmitate de chloramphénicol). <b>Pseudopolymorphisme</b> : hydrates et solvates ; les hydrates sont en général moins solubles (l'ampicilline anhydre est plus soluble que le trihydrate) ; la granulation humide peut créer un hydrate et le séchage une forme anhydre.</p>`,

const $ = s => document.querySelector(s);

let S; try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
S.q = S.q || {}; S.x = S.x || {}; S.o = S.o || {}; S.m = S.m || {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const TABS = [["home", "🎯 Ce qui tombe"], ["exo", "🧮 Exercices"], ["qcm", "✅ QCM"], ["qrm", "☑️ QRM"], ["open", "📝 Questions ouvertes"], ["blanc", "🧪 Examen blanc"]];
let cur = "home";
function go(t) { cur = t; stopTimer(); $("#nav").innerHTML = TABS.map(([k, l]) => `<button class="${k === t ? "on" : ""}" onclick="go('${k}')">${l}</button>`).join(""); VIEWS[t](); window.scrollTo(0, 0); }
const stars = n => `<span class="stars">${"★".repeat(n)}${"☆".repeat(3 - n)}</span>`;

  <div class="grid3">
    <div class="stat">Exercices réussis<b>${xok} / ${EXOS.length}</b><div class="bar"><i style="width:${xok / EXOS.length * 100}%"></i></div></div>

    <div class="stat">Questions ouvertes travaillées<b>${od.length} / ${OPEN.length}</b><div class="bar"><i style="width:${od.length / OPEN.length * 100}%"></i></div></div>
  </div>
  <div class="card"><h2>Ce qui revient d'une année à l'autre</h2>

  <div class="card"><h2>Comment utiliser cette page</h2>
  <ol><li><b>Exercices</b> : fais chaque énoncé original, puis 2 ou 3 variantes (bouton « ↻ Variante »). Objectif : 100 % juste, plusieurs jours de suite.</li>

// ---------- Exercices ----------
const CUR = {};
function exo() {
  const themes = [...new Set(EXOS.map(x => x.theme))];
  $("#view").innerHTML = `<div class="box warn">Remplis chaque étape puis clique « Vérifier ». Les virgules sont acceptées. Arrondis comme à l'examen (2 à 4 décimales) : une petite tolérance est prévue.</div>` +
    themes.map(t => `<h2 style="margin-top:18px">${t}</h2>` + EXOS.filter(x => x.theme === t).map(x => `<div class="card" id="c-${x.id}"></div>`).join("")).join("");
  EXOS.forEach(x => { CUR[x.id] = { ex: x.base(), orig: true }; drawExo(x.id); });
}
function drawExo(id, box) {
  const x = EXOS.find(e => e.id === id), c = CUR[id], el = box || $("#c-" + id), st = S.x[id];
  el.innerHTML = `<div class="row" style="justify-content:space-between"><div><span class="pill">${x.src}</span>${st ? (st.last ? `<span class="pill" style="background:var(--ok-soft);color:var(--ok)">✔ réussi</span>` : `<span class="pill" style="background:var(--ko-soft);color:var(--ko)">à refaire</span>`) : ""}</div><div>${c.orig ? "" : `<span class="pill th">variante</span>`}</div></div>
  <h3>${x.title}</h3><pre>${c.ex.ctx}</pre><div><b>${c.ex.q}</b></div>
  ${c.ex.steps.map((s, k) => `<div class="step"><span>${s.label}</span><input id="i-${id}-${k}" inputmode="decimal" onkeydown="if(event.key==='Enter')checkExo('${id}')"><span class="u">${s.unit || ""}</span><div class="corr hidden" id="k-${id}-${k}">${s.show}${s.why ? `<br><span class="sub">${s.why}</span>` : ""}</div></div>`).join("")}
  <div class="row" style="margin-top:8px"><button class="btn primary" onclick="checkExo('${id}')">Vérifier</button><button class="btn" onclick="solExo('${id}')">Correction complète</button><button class="btn" onclick="varExo('${id}')">↻ Variante</button>${c.orig ? "" : `<button class="btn" onclick="CUR['${id}']={ex:EXOS.find(e=>e.id==='${id}').base(),orig:true};drawExo('${id}')">↺ Énoncé original</button>`}</div>
  <div id="r-${id}"></div>${c.orig && (x.final || x.note) ? `<div class="box info hidden" id="f-${id}">${x.final || ""}${x.note ? `<br>⚠️ ${x.note}` : ""}</div>` : ""}`;
}
function checkExo(id) {
  const c = CUR[id]; let ok = 0;
  c.ex.steps.forEach((s, k) => { const inp = $(`#i-${id}-${k}`); const good = near(parseNum(inp.value), s.ans, s.tol); inp.className = inp.value ? (good ? "good" : "bad") : ""; if (good) ok++; else if (inp.value) $(`#k-${id}-${k}`).classList.remove("hidden"); });
  const all = ok === c.ex.steps.length;
  $("#r-" + id).innerHTML = all ? `<div class="box ok">✔ Tout est juste. Refais une variante dans quelques jours pour vérifier que c'est automatique.</div>` : `<div class="box ko">${ok} / ${c.ex.steps.length} étapes justes. Les corrections des étapes fausses sont affichées ; recommence sans regarder.</div>`;
  if (c.orig || all) { S.x[id] = { last: all, n: ((S.x[id] || {}).n || 0) + 1 }; save(); }
  const f = $("#f-" + id); if (f && all) f.classList.remove("hidden");
}
function solExo(id) { CUR[id].ex.steps.forEach((s, k) => $(`#k-${id}-${k}`).classList.remove("hidden")); const f = $("#f-" + id); if (f) f.classList.remove("hidden"); }
function varExo(id) { CUR[id] = { ex: EXOS.find(e => e.id === id).variant(), orig: false }; drawExo(id); }

// ---------- QCM ----------
let QF = { th: "all", mode: "all" };
function qcm() {
  const th = [...new Set(QCM.map(q => q.th))];
  let list = QCM.filter(q => QF.th === "all" || q.th === QF.th);
  if (QF.mode === "err") list = list.filter(q => S.q[q.id] && !S.q[q.id].last);
  if (QF.mode === "new") list = list.filter(q => !S.q[q.id]);
  if (QF.mode === "mix") list = shuffle(list);
  $("#view").innerHTML = `<div class="card row"><label>Thème <select onchange="QF.th=this.value;qcm()"><option value="all">Tous (${QCM.length})</option>${th.map(t => `<option ${QF.th === t ? "selected" : ""}>${t}</option>`).join("")}</select></label>
  <label>Afficher <select onchange="QF.mode=this.value;qcm()"><option value="all" ${QF.mode === "all" ? "selected" : ""}>Toutes, dans l'ordre</option><option value="mix" ${QF.mode === "mix" ? "selected" : ""}>Toutes, mélangées</option><option value="new" ${QF.mode === "new" ? "selected" : ""}>Jamais faites</option><option value="err" ${QF.mode === "err" ? "selected" : ""}>Mes erreurs</option></select></label><span class="sub">${list.length} question(s)</span></div>` +
    (list.length ? list.map((q, i) => qcard(q, i + 1)).join("") : `<div class="card">Rien à afficher ici 🎉</div>`);
}
function qcard(q, n) {
  return `<div class="card" id="q-${q.id}"><div><span class="pill">${q.src}</span><span class="pill th">${q.th}</span>${q.amb ? `<span class="pill" style="background:var(--warn-soft);color:var(--warn)">⚠️ ambiguë</span>` : ""}</div>
  <h3>${n}. ${q.q}</h3>${q.o.map((o, k) => `<button class="opt" id="o-${q.id}-${k}" onclick="ans('${q.id}',${k})">${"abcde"[k]}. ${o}</button>`).join("")}<div id="e-${q.id}"></div></div>`;
}
function ans(id, k) {
  const q = QCM.find(x => x.id === id); if ($(`#o-${id}-0`).classList.contains("done")) return;
  const ok = k === q.a; S.q[id] = { last: ok, n: ((S.q[id] || {}).n || 0) + 1 }; save();
  q.o.forEach((o, j) => { const b = $(`#o-${id}-${j}`); b.classList.add("done"); if (j === q.a) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); b.innerHTML += `<span class="vf">${q.v[j]}</span>`; });
  $("#e-" + id).innerHTML = `<div class="box ${ok ? "ok" : "ko"}">${ok ? "✔ Juste." : `✘ Réponse attendue : ${"abcde"[q.a]}.`}</div>${q.amb ? `<div class="box warn">⚠️ ${q.amb}</div>` : ""}`;
}

// ---------- QRM ----------
function qrm() {
  $("#view").innerHTML = `<div class="box info">Plusieurs réponses possibles : coche toutes celles qui sont justes, puis valide.</div>` + QRM.map(m => `<div class="card" id="m-${m.id}"><span class="pill">${m.src}</span><span class="pill th">${m.th}</span><h3>${m.q}</h3>
  ${m.o.map((o, k) => `<label class="opt" id="mo-${m.id}-${k}"><input type="checkbox" id="mc-${m.id}-${k}"> ${o}</label>`).join("")}
  <button class="btn primary" onclick="valQrm('${m.id}')">Valider</button><div id="me-${m.id}"></div></div>`).join("");
}
function valQrm(id) {
  const m = QRM.find(x => x.id === id); let ok = true;
  m.o.forEach((o, k) => { const c = $(`#mc-${id}-${k}`).checked, should = m.ok.includes(k); if (c !== should) ok = false; $(`#mo-${id}-${k}`).classList.add(should ? "right" : (c ? "wrong" : "x")); });
  S.m[id] = ok; save();
  $("#me-" + id).innerHTML = `<div class="box ${ok ? "ok" : "ko"}">${ok ? "✔ Tout juste." : "✘ Pas tout à fait (en vert : les bonnes réponses)."} ${m.ex}</div>`;
}

// ---------- Questions ouvertes ----------
function open_() {
  $("#view").innerHTML = `<div class="box info">Écris ta réponse comme à l'examen, sans regarder le cours. Puis ouvre le corrigé et coche honnêtement les points que tu as cités : le score est enregistré.</div>` + OPEN.map(o => `<div class="card" id="op-${o.id}"><div><span class="pill">${o.src}</span>${stars(o.star)}${S.o[o.id] != null ? `<span class="pill">dernier score : ${S.o[o.id]} %</span>` : ""}</div><h3>${o.q}</h3>
  <textarea id="t-${o.id}" placeholder="Ta réponse…"></textarea><button class="btn primary" onclick="showOpen('${o.id}')">Voir le corrigé</button>
  <div id="oc-${o.id}" class="hidden"><div class="box info">${o.a}</div>${gallery("exam:" + o.id)}<b>Coche ce que tu as cité :</b><div class="keys">${o.keys.map((k, i) => `<label><input type="checkbox" id="ok-${o.id}-${i}" onchange="scoreOpen('${o.id}')"> ${k}</label>`).join("")}</div><div id="os-${o.id}"></div></div></div>`).join("");
}
function showOpen(id) { $("#oc-" + id).classList.remove("hidden"); }
function scoreOpen(id) { const o = OPEN.find(x => x.id === id); const n = o.keys.filter((k, i) => $(`#ok-${id}-${i}`).checked).length; const p = Math.round(n / o.keys.length * 100); S.o[id] = p; save(); $("#os-" + id).innerHTML = `<div class="box ${p >= 80 ? "ok" : "warn"}">${p} % des points clés. ${p >= 80 ? "Bien : refais-la dans une semaine." : "Relis le corrigé, puis réécris ta réponse demain sans regarder."}</div>`; }

// ---------- Examen blanc ----------
let T = null, BL = null;
function stopTimer() { if (T) { clearInterval(T); T = null; } }
function blanc() {
  $("#view").innerHTML = `<div class="card"><h2>Examen blanc</h2><p>Composition tirée au hasard, comme les vraies sessions :</p><ul><li><b>3 exercices de calcul</b> (variantes des exercices d'examen), <b>éliminatoires</b> ;</li><li><b>12 QCM</b> ;</li><li><b>2 questions ouvertes</b>, corrigées par toi avec la grille.</li></ul><p>Durée conseillée : 2 heures, sans calculatrice si tu veux t'entraîner comme en 2009.</p><button class="btn primary" onclick="startBlanc()">Commencer</button></div>`;
}
function startBlanc() {
  const ex = shuffle(EXOS).slice(0, 3).map(x => ({ id: x.id, title: x.title, ex: x.variant() }));
  const qs = shuffle(QCM).slice(0, 12), op = shuffle(OPEN.filter(o => o.star >= 2)).slice(0, 2);
  BL = { ex, qs, op, ans: {}, end: Date.now() + 2 * 3600e3 };
  $("#view").innerHTML = `<div class="card row" style="justify-content:space-between;position:sticky;top:52px;z-index:4"><b>Examen blanc</b><span>⏱ <span class="timer" id="tm"></span></span><button class="btn primary" onclick="endBlanc()">Rendre ma copie</button></div>
  <h2>Partie 1 · Exercices (éliminatoire)</h2>${ex.map((e, i) => `<div class="card"><h3>Exercice ${i + 1}</h3><pre>${e.ex.ctx}</pre><b>${e.ex.q}</b>${e.ex.steps.map((s, k) => `<div class="step"><span>${s.label}</span><input id="b-${i}-${k}" inputmode="decimal"><span class="u">${s.unit || ""}</span><div class="corr hidden" id="bk-${i}-${k}">${s.show}</div></div>`).join("")}</div>`).join("")}
  <h2>Partie 2 · QCM</h2>${qs.map((q, i) => `<div class="card"><h3>${i + 1}. ${q.q}</h3>${q.o.map((o, k) => `<label class="opt" id="bo-${i}-${k}"><input type="radio" name="bq${i}" value="${k}"> ${"abcde"[k]}. ${o}<span class="vf hidden">${q.v[k]}</span></label>`).join("")}</div>`).join("")}
  <h2>Partie 3 · Questions ouvertes</h2>${op.map((o, i) => `<div class="card"><h3>${o.q}</h3><textarea></textarea><div class="hidden" id="bc-${i}"><div class="box info">${o.a}</div><div class="keys">${o.keys.map((k, j) => `<label><input type="checkbox" class="bkey-${i}"> ${k}</label>`).join("")}</div></div></div>`).join("")}
  <button class="btn primary" onclick="endBlanc()">Rendre ma copie</button><div id="bres"></div>`;
  const tick = () => { const s = Math.max(0, Math.round((BL.end - Date.now()) / 1000)); $("#tm").textContent = `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; if (!s) endBlanc(); };
  tick(); T = setInterval(tick, 1000);
}
function endBlanc() {
  if (!BL || BL.done) return; BL.done = true; stopTimer();
  let exOk = 0, exTot = 0, elim = false;
  BL.ex.forEach((e, i) => e.ex.steps.forEach((s, k) => { exTot++; const inp = $(`#b-${i}-${k}`); const g = near(parseNum(inp.value), s.ans, s.tol); inp.className = g ? "good" : "bad"; if (g) exOk++; else { elim = true; $(`#bk-${i}-${k}`).classList.remove("hidden"); } }));
  let qOk = 0; BL.qs.forEach((q, i) => { const r = document.querySelector(`input[name=bq${i}]:checked`); const k = r ? +r.value : -1; if (k === q.a) qOk++; q.o.forEach((o, j) => { const el = $(`#bo-${i}-${j}`); if (j === q.a) el.classList.add("right"); else if (j === k) el.classList.add("wrong"); el.querySelector(".vf").classList.remove("hidden"); }); });
  BL.op.forEach((o, i) => $("#bc-" + i).classList.remove("hidden"));
  $("#bres").innerHTML = `<div class="card"><h2>Résultat</h2>${elim ? `<div class="box ko"><b>Partie éliminatoire : échec</b> (${exOk}/${exTot} étapes justes). À l'examen, une seule erreur de calcul suffit à échouer : refais ces exercices jusqu'à 100 %.</div>` : `<div class="box ok"><b>Partie éliminatoire réussie</b> (${exOk}/${exTot}).</div>`}
  <p>QCM : <span class="score">${qOk} / ${BL.qs.length}</span></p><p>Questions ouvertes : coche les points cités dans les corrigés affichés plus haut.</p></div>`;
  $("#bres").scrollIntoView({ behavior: "smooth" });
}
/* ---------- Illustrations (Wikimedia Commons) ---------- */
function gallery(id) {
  if (typeof IMG === "undefined") return "";
  const key = id.includes(":") ? id : DATA.id + ":" + id, L = IMG[key];
  if (!L || !L.length) return "";
  return `<div class="gal">${L.map((g, i) => `<figure onclick="lightbox('${key}',${i})"><div class="ph ${g.s ? "" : "photo"}"><img loading="lazy" src="${g.u}" alt="${g.c.replace(/"/g, "&quot;")}" onerror="this.closest('figure').style.display='none'"></div><figcaption>${g.c}<span class="cr">${g.a ? g.a + " · " : ""}${g.l} · <a href="${g.d}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Wikimedia Commons</a></span></figcaption></figure>`).join("")}</div>`;
}
function lightbox(key, i) {
  let lb = document.getElementById("lb");
  if (!lb) { lb = document.createElement("div"); lb.id = "lb"; lb.onclick = () => lb.classList.remove("on"); document.body.appendChild(lb); }
  const g = IMG[key][i]; lb.innerHTML = `<div><img src="${g.u}" alt=""><p>${g.c}</p></div>`; lb.classList.add("on");
}

const DATA = { id: "exam" };
const VIEWS = { home, exo, qcm, qrm, open: open_, blanc };
go("home");
</script>
<style>
#viewer{position:fixed;inset:0;z-index:1000;background:#f6f4ef;display:none;flex-direction:column}
#viewer .vbar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:#fff;border-bottom:1px solid #e3e0d8;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#viewer .vbar button{border:1.5px solid #2f5d8a;background:#e8f0f8;color:#2f5d8a;border-radius:8px;padding:5px 12px;font:inherit;font-weight:600;cursor:pointer}
#viewer iframe{flex:1;border:0;width:100%;background:#f6f4ef}
</style>
<script>
/* Navigation interne sans quitter le cadre Notion : les pages s'ouvrent dans une vue intégrée */
(function () {
  const top_ = (() => { try { return window.parent !== window && window.parent.__galNav ? window.parent : null; } catch (e) { return null; } })();
  window.__galNav = true;
  window.openViewer = function (u) {
    if (top_) return top_.openViewer(u);
    let v = document.getElementById("viewer");
    if (!v) { v = document.createElement("div"); v.id = "viewer"; v.innerHTML = '<div class="vbar"><button onclick="closeViewer()">← Retour à la page générale</button><span class="vt"></span></div><iframe title="page"></iframe>'; document.body.appendChild(v); }
    const f = v.querySelector("iframe"); f.onload = () => { try { v.querySelector(".vt").textContent = f.contentDocument.title; } catch (e) {} };
    f.src = u; v.style.display = "flex"; document.documentElement.style.overflow = "hidden";
  };
  window.closeViewer = function () {
    if (top_) return top_.closeViewer();
    const v = document.getElementById("viewer"); if (v) { v.style.display = "none"; v.querySelector("iframe").src = "about:blank"; }
    document.documentElement.style.overflow = "";
    if (typeof go === "function" && typeof VIEWS !== "undefined" && VIEWS.home) { try { go("home"); } catch (e) {} }
  };
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest("a"); if (!a) return;
    const h = a.getAttribute("href"); if (!h || a.target || /^(https?:|#|mailto:|javascript:)/i.test(h)) return;
    e.preventDefault();
    const url = new URL(h, location.href);
    const isHome = /\/galenique\/(index\.html)?$/.test(url.pathname);
    if (isHome) { const v = document.getElementById("viewer"); if (top_) top_.closeViewer(); else if (v && v.style.display === "flex") closeViewer(); else openViewer(url.href); return; }
    openViewer(url.href);
  }, true);
})();
</script>

</body>
