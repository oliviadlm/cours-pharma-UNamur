e à pH neutre et mal absorbée par voie digestive. Le trométamol (trométhamine, tampon de biologie) forme avec elle une paire d'ions qui augmente son absorption digestive (MONURIL®). La forme injectable, riche en sodium, peut donner une hypernatrémie.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-fosfomycine-urinaire", "t": "Fosfomycine et infections urinaires", "e": "Non liée aux protéines plasmatiques, bien diffusée, non métabolisée, la fosfomycine s'élimine dans l'urine à forte concentration : elle est utilisée dans la cystite aiguë de la femme (staphylocoque, Proteus, Serratia…). Injectable, elle n'est jamais utilisée seule.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-tuberculose", "t": "Tuberculose", "e": "Maladie infectieuse due au bacille de Koch (Mycobacterium tuberculosis), surtout pulmonaire mais aussi osseuse, rénale, méningée… Transmise par l'air. Environ un quart de la population mondiale a été infecté ; 1,3 million de décès en 2022 (OMS). La tuberculose multirésistante reste une crise de santé publique.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-tb-deux-phases", "t": "Traitement de la tuberculose en deux phases", "e": "1) Phase intensive quotidienne (2-3 mois) avec 3 ou 4 substances : rifampicine et isoniazide associés à l'éthambutol ou au pyrazinamide, pour éviter la résistance quand le nombre de germes est maximal. 2) Phase de 4 mois ou plus avec isoniazide + rifampicine, 2 à 3 fois par semaine. Le traitement dure 4 à 6 mois ; l'arrêter précocement ou sans avis médical est dangereux (résistance). Chez les sujets à risque : chimio-prophylaxie à l'isoniazide.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-tb-intention", "t": "Tuberculostatiques de première et de seconde intention", "e": "Médicaments de première intention (majeurs : isoniazide, rifampicine, pyrazinamide, éthambutol) et de seconde intention (alternatifs : éthionamide, protionamide, PAS, D-cyclosérine…) utilisés lorsque des résistances apparaissent. La streptomycine n'est plus de première intention.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-tb-resistance-monotherapie", "t": "Résistance rapide en monothérapie", "e": "En monothérapie, une résistance apparaît rapidement avec tous les antituberculeux ; d'où l'association de 3 voire 4 principes actifs pendant la phase d'instauration.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-tb-acides-mycoliques", "t": "Mécanisme mal connu des antituberculeux majeurs", "e": "Les mécanismes d'action des antituberculeux majeurs comme l'isoniazide sont encore très mal connus ; un mécanisme possible serait l'inhibition de la synthèse des acides mycoliques de la paroi des mycobactéries. Ceux de l'éthambutol et du pyrazinamide restent aussi mal élucidés.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-inh-imao", "t": "L'isoniazide inhibe la monoamine oxydase (IMAO)", "e": "Lors des premiers essais, des patients sous isoniazide étaient euphoriques ; on a découvert que l'isoniazide inhibait la MAO (dégradation de la sérotonine et de la noradrénaline), ce qui a ouvert la voie aux antidépresseurs IMAO.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-bedaquiline-atp", "t": "Bédaquiline : approvisionnement énergétique de M. tuberculosis", "e": "La bédaquiline (diarylquinoléine) inhibe spécifiquement l'ATP synthase mycobactérienne, indispensable à l'approvisionnement énergétique de Mycobacterium tuberculosis. Elle est réservée à la tuberculose pulmonaire multirésistante, en association.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-bcg", "t": "Vaccin BCG", "e": "Vaccin vivant non virulent préparé par Calmette et Guérin à partir d'une souche atténuée de Mycobacterium bovis (1921), injecté par voie intradermique. Meilleurs résultats chez les jeunes enfants (miliaire et méningite évitées dans 70-80 % des cas), protection de 10 à 15 ans. En Belgique (risque 0,03 %/an), la vaccination systématique n'est pas indiquée et le vaccin n'est pas disponible pour le moment ; à envisager chez l'enfant de moins de 5 ans à intradermoréaction négative faisant un séjour prolongé en région fortement endémique.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-lepre-traitement", "t": "Traitement de la lèpre", "e": "La lèpre (maladie de Hansen, Mycobacterium leprae) peut être traitée par la rifampicine et les sulfamidés à longue durée d'action, mais les sulfones, surtout la dapsone, sont les plus utilisées.", "ch": "06_quinolones_urinaires_TB_lepre"}, {"id": "06-dapsone-acide-folique", "t": "Dapsone : inhibiteur de la synthèse d'acide folique", "e": "Comme les sulfamides et l'acide para-aminosalicylique, la dapsone est un analogue du PABA ; en compétition avec lui, elle inhibe la dihydroptéroate synthétase (incorporation du PABA dans l'acide dihydroptéroïque, précurseur de l'acide folique).", "ch": "06_quinolones_urinaires_TB_lepre"}], "prof": [{"d": "18/09/2025", "q": "Parlez-moi des sulfamidés antibactériens : comment ont-ils été découverts, relations structure-activité, mécanisme d'action, classification systématique ; donnez des exemples (systémiques, urinaires, intestinaux) et les principaux effets indésirables. (« pas une virgule en moins »)", "r": "Découverte : PRONTOSIL® (Domagk, Nobel 1939), colorant azoïque inactif in vitro, pro-drogue libérant in vivo le sulfanilamide. RSA : benzène non substitué, NH2 aromatique primaire en para (ou groupe labile azo/amide), SO2NH substituable (hétérocycle -> pharmacocinétique). Mécanisme : analogue du PABA, inhibition compétitive de la dihydroptéroate synthétase -> plus d'acide folique bactérien ; bactériostatique ; toxicité sélective car l'homme trouve l'acide folique dans l'alimentation. Classification : systémiques/urinaires (sulfaméthoxazole, dans BACTRIM®), intestinaux (sulfasalazine, SALAZOPYRINE®), usage externe (sulfadiazine argentique, FLAMMAZINE®). Effets indésirables : allergies cutanées (Stevens-Johnson), troubles sanguins, cristallurie, grossesse (1er trimestre) ; résistances -> indications restreintes."}, {"d": "18/09/2025", "q": "Expliquez le mécanisme d'action des sulfamidés antibactériens.", "r": "Analogue structural du PABA : le sulfamidé entre en compétition avec lui et inhibe la dihydroptéroate synthétase, enzyme qui incorpore le PABA pour former l'acide dihydroptéroïque puis l'acide folique. Sans folates (THF), pas de synthèse des bases puriques et de la thymidine -> la bactérie ne se divise plus : effet bactériostatique."}, {"d": "18/09/2025", "q": "Quel est l'intérêt de l'association sulfaméthoxazole + triméthoprime au niveau mécanistique au sein de la bactérie ?", "r": "Double blocage séquentiel de la même voie : le sulfaméthoxazole inhibe la DHPS (synthèse de l'acide folique), le triméthoprime inhibe la dihydrofolate réductase (réduction DHF -> THF). Effet synergique, moins de résistances : co-trimoxazole (BACTRIM®, EUSAPRIM®), rapport 1 : 5."}, {"d": "18/09/2025", "q": "Le triméthoprime est-il un sulfamidé antibactérien ? Pourquoi ?", "r": "Non : il n'a pas de fonction sulfonamide (c'est une 2,4-diaminopyrimidine). C'est pourtant un antibactérien : il inhibe sélectivement la dihydrofolate réductase bactérienne, en aval des sulfamidés."}, {"d": "18/09/2025", "q": "La mésalazine est-elle un sulfamidé antibactérien ? Quelle est l'indication de la sulfasalazine et pourquoi agit-elle au niveau intestinal ?", "r": "Non, la mésalazine (acide 5-aminosalicylique) est un anti-inflammatoire, pas un sulfamidé antibactérien. La sulfasalazine (SALAZOPYRINE®) est une pro-drogue : la liaison azo est coupée par les bactéries du côlon, libérant sulfapyridine + mésalazine, qui agit localement dans l'intestin : maladie de Crohn, rectocolite ulcéreuse (aussi polyarthrite rhumatoïde)."}, {"d": "18/09/2025", "q": "Vrai ou faux : les sulfamidés antibactériens sont à l'origine des antidiabétiques oraux (sulfamides hypoglycémiants).", "r": "Vrai. On a observé un effet hypoglycémiant de certains sulfamidés antibactériens, ce qui a conduit aux sulfamides hypoglycémiants (antidiabétiques oraux)."}, {"d": "18/09/2025", "q": "Vrai ou faux : la pénicilline a été découverte pendant la Première Guerre mondiale.", "r": "Faux. Fleming a découvert la pénicilline en 1928 (entre les deux guerres) ; elle a été produite industriellement pendant la Seconde Guerre mondiale."}, {"d": "18/09/2025", "q": "Tableau : pour chaque classe d'antibiotiques, donnez la cible moléculaire, un exemple (DCI, nom commercial), bactéricide ou bactériostatique, et la structure générale qui explique le mécanisme.", "r": "β-lactames (pénicillines, céphalosporines) : transpeptidases de la paroi, ex. amoxicilline, bactéricides, noyau β-lactame. Aminosides : sous-unité 30S, ex. gentamicine, bactéricides, aminoses liés à un aminocyclitol. Tétracyclines : 30S, ex. doxycycline (VIBRATAB®), bactériostatiques, 4 cycles accolés. Macrolides : 50S, ex. clarithromycine (BICLAR®), bactériostatiques, macrocycle lactonique + oses. Chloramphénicol : 50S, bactériostatique. Quinolones : ADN gyrase/topo-isomérase IV, ex. ciprofloxacine (CIPROXINE®), bactéricides, acide 4-oxo-quinoléine-3-carboxylique. Sulfamidés : DHPS, sulfaméthoxazole, bactériostatiques, sulfonamide en para du NH2."}, {"d": "18/09/2025", "q": "Des molécules agissent sur des bactéries Gram + : pourquoi agissent-elles sur certains Gram + et pas sur certains Gram – ?", "r": "La paroi des Gram + est épaisse (peptidoglycane) mais directement accessible ; celle des Gram – est fine mais protégée par une membrane externe (LPS) que la molécule doit traverser par des porines. Une molécule peu hydrophile ou volumineuse atteint mal sa cible chez les Gram – ; certaines bactéries produisent aussi des β-lactamases. D'où un spectre surtout Gram + (péni G) et l'élargissement vers les Gram – par des groupes hydrophiles (NH2 des aminopénicillines)."}, {"d": "18/09/2025", "q": "Parlez-moi des pénicillines : découverte, structure chimique générale, mécanisme d'action, pourquoi certaines sont acido-résistantes et d'autres sensibles aux β-lactamases ; inhibiteurs de β-lactamases ; pénicillines à spectre élargi, en particulier les aminopénicillines.", "r": "Voir la question ouverte 1 de la fiche examen : découverte (Fleming 1928, Penicillium) ; structure (β-lactame + thiazolidine, valine + cystéine, COOH, chaîne R) ; mécanisme (analogue du D-Ala-D-Ala, acylation des transpeptidases, bactéricide) ; acido-résistance (R attracteur : péni V) ; résistance aux pénicillinases (R encombrant : flucloxacilline) ; inhibiteurs de β-lactamases (acide clavulanique, AUGMENTIN®) ; spectre élargi (aminopénicillines ampicilline, amoxicilline ; témocilline ; pipéracilline + tazobactam)."}, {"d": "25/09/2025", "q": "Décrivez la structure générale d'une pénicilline (à dessiner et expliquer).", "r": "Bicycle 6-APA : cycle β-lactame (azétidinone, amide cyclique à 4 atomes tendu) accolé au cycle thiazolidine (S, 2 méthyles), dérivé de la condensation valine + cystéine ; COOH en C2 (acide, pKa ≈ 2,7) ; amide exocyclique NH-CO-R en C6 : le radical R module acido-résistance, résistance aux β-lactamases et spectre."}, {"d": "25/09/2025", "q": "Expliquez d'un point de vue structurel le mécanisme d'action d'une pénicilline ; quel est son pharmacophore ?", "r": "Le pharmacophore est le noyau β-lactame : sa conformation mime le dipeptide D-Ala-D-Ala terminal du peptidoglycane. La transpeptidase (PBP) attaque le carbonyle du β-lactame tendu et reste acylée (ester stable) : plus de pontage du peptidoglycane -> paroi fragile -> lyse : bactéricide."}, {"d": "25/09/2025", "q": "Que sont les β-lactamines ? Mécanisme d'action du noyau β-lactame sur la paroi ; quelles pénicillines obtient-on par hémisynthèse ?", "r": "β-lactamines = antibiotiques contenant un noyau β-lactame (pénicillines, céphalosporines, carbapénèmes, monobactames). Le β-lactame acyle les transpeptidases de la paroi. Par hémisynthèse (6-APA + différentes chaînes R) on obtient : péni V (acido-résistante), flucloxacilline (résistante aux pénicillinases), aminopénicillines ampicilline/amoxicilline (spectre élargi), carboxy- et uréidopénicillines."}, {"d": "25/09/2025", "q": "Pourquoi une pénicilline est-elle acido-résistante et une autre pas, sur base de la structure chimique ?", "r": "En milieu acide, l'oxygène du carbonyle de la chaîne latérale attaque le β-lactame tendu (réarrangement). Si R est électro-attracteur (péni V : O-phényle), cet oxygène est moins nucléophile : acido-résistante, utilisable per os. Péni G (benzyle) : acido-sensible, injectable."}, {"d": "25/09/2025", "q": "Parlez-moi de la pénicilline V (PENI-ORAL).", "r": "Pénicilline V = phénoxyméthylpénicilline, première pénicilline active par voie orale grâce au groupement phénoxy électro-attracteur (acido-résistante) ; reste sensible aux pénicillinases ; ancien nom commercial PENI-ORAL® (péni + oral, sans S)."}, {"d": "09/10/2025", "q": "Sur base de la structure de la pénicilline, donnez un exemple de simplification moléculaire utilisé aujourd'hui (monobactame, aztréonam) ; dessinez le noyau.", "r": "Monobactame : on ne garde que le cycle β-lactame (monocyclique), suffisant pour l'activité ; modèle naturel la nocardicine. Aztréonam (AZACTAM®, CAYSTON® en inhalation, mucoviscidose) : monobactame de synthèse actif sur les Gram – (Pseudomonas). Dessiner l'azétidinone portant le groupe sulfonique sur l'azote."}, {"d": "09/10/2025", "q": "Un inhibiteur de β-lactamase est-il un antibiotique ? Pourquoi ? Pourquoi l'associe-t-on à l'amoxicilline ? Peut-on l'associer à un antibiotique non β-lactame ?", "r": "Non : l'acide clavulanique a un noyau β-lactame mais pas d'activité antibactérienne utile ; c'est un inhibiteur irréversible (suicide) des β-lactamases. On l'associe à l'amoxicilline (AUGMENTIN®) pour la protéger des bactéries productrices de β-lactamases. Avec un antibiotique non β-lactame, aucun intérêt : il protège seulement les β-lactames."}, {"d": "09/10/2025", "q": "Quels sont le mécanisme d'action et les indications de la doxycycline ?", "r": "Tétracycline : fixation à la sous-unité 30S du ribosome (bloque la fixation de l'ARNt), bactériostatique. Indications retenues par le prof : infections bactériennes (et acné, seule ou avec la minocycline/lymécycline), paludisme (prophylaxie), maladie de Lyme. VIBRATAB®."}, {"d": "09/10/2025", "q": "Citez au moins trois classes d'antibiotiques utilisées dans le traitement de l'acné (usage interne ou externe).", "r": "Tétracyclines (doxycycline, minocycline, lymécycline TETRALYSAL®) en usage interne ; macrolides (érythromycine en usage externe) ; lincosamides (clindamycine, DALACIN C®)."}, {"d": "16/10/2025", "q": "Quinolones : structure, mécanisme d'action, générations, résistances, indications et pourquoi leur usage est aujourd'hui limité.", "r": "Structure : acide 4-oxo-1,4-dihydroquinoléine-3-carboxylique ; fluor en 6 et pipérazine en 7 = fluoroquinolones (ciprofloxacine). Mécanisme : inhibition de l'ADN gyrase (topo-isomérase II) et de la topo-isomérase IV -> bactéricide. Générations : 1re acide nalidixique (urinaire), 2e ciprofloxacine, ofloxacine, lévofloxacine (énantiomère pur), 3e moxifloxacine (pneumo). Effets indésirables : tendinites/rupture du tendon d'Achille, allongement du QT, photosensibilisation, grossesse/enfant. Résistances -> l'EMA limite leur usage aux infections où d'autres antibiotiques ne conviennent pas."}, {"d": "20/11/2025", "q": "Parlez-moi des tétracyclines au sens large : structure générale, mécanisme (30S), effets indésirables liés à la fixation du calcium, indications particulières.", "r": "Structure générale : 4 cycles accolés (naphtacène) portant OH, cétones et amines (amphotères, jaunes). Mécanisme : sous-unité 30S, bactériostatique. Effets indésirables : chélation du calcium -> coloration des dents et dépôts osseux (pas avant 8 ans, ni fin de grossesse/allaitement) ; diminution d'absorption avec lait, antiacides, fer ; photosensibilisation. Indications : doxycycline (infections, acné, paludisme, Lyme), minocycline, lymécycline (acné)."}, {"d": "20/11/2025", "q": "Parlez-moi du chloramphénicol (structure, mécanisme) ; quelle alternative peut-on utiliser (thiamphénicol, aérosol) ?", "r": "Chloramphénicol : nitrobenzène + propanediol + dichloroacétamide ; se fixe sur la 50S, bactériostatique ; toxicité hématologique grave (aplasie médullaire idiosyncrasique) -> usage local (collyre). Alternative : thiamphénicol (le NO2 remplacé par SO2CH3, pas d'aplasie), URFAMYCINE® ; FLUIMUCIL ANTIBIOTIC® = glycinate de thiamphénicol + acétylcystéine en aérosol. Palmitate de chloramphénicol pour masquer l'amertume."}, {"d": "17/09/2026", "q": "Parlez-moi de l'amoxicilline : mécanisme d'action, effets indésirables ; pourquoi met-on de l'amoxicilline et pas une tétracycline ?", "r": "Amoxicilline : aminopénicilline (péni G + NH2), inhibe les transpeptidases -> bactéricide ; spectre élargi vers certains Gram – ; acido-résistante, bonne biodisponibilité orale ; sensible aux β-lactamases (d'où AUGMENTIN®). Effets indésirables : allergie, diarrhée, éruptions. Préférée à une tétracycline car bactéricide, utilisable chez l'enfant et la femme enceinte, sans chélation du calcium."}, {"d": "17/09/2026", "q": "Parlez-moi de la pénicilline sensible aux pénicillinases et acido-sensible (question ouverte d'une page).", "r": "Pénicilline G (benzylpénicilline) : sensible aux pénicillinases et acido-sensible -> injectable ; PENICILLINE®, forme retard EXTENCIN® (sel de benzathine). Spectre surtout Gram + (streptocoques, syphilis). Dessiner la structure (bleu souligné). Comparer avec péni V (acido-résistante) et flucloxacilline (résistante aux pénicillinases)."}, {"d": "17/09/2026", "q": "Que se passe-t-il dans une bactérie si elle ne synthétise plus d'acide folique ? Et chez l'humain en cas de carence ?", "r": "Bactérie : plus de THF -> plus de bases puriques ni de thymidine -> plus de réplication : arrêt de la croissance (bactériostatique). Humain : carence en folates -> anémie macrocytaire (mégaloblastique), troubles de la division cellulaire, anomalies de fermeture du tube neural chez le fœtus (d'où acide folique, FOLAVIT®, en début de grossesse)."}, {"d": "Notion", "q": "Comment ont été découverts les sulfamides antibactériens ? Décrivez la découverte fortuite des sulfamides hypoglycémiants et dessinez leur structure.", "r": "Découverte : PRONTOSIL® (colorant azoïque) -> sulfanilamide (pro-drogue). Sulfamides hypoglycémiants : effet hypoglycémiant observé chez des patients traités par des sulfamidés antibactériens -> développement des sulfonylurées (structure : Ar-SO2-NH-CO-NH-R)."}, {"d": "Notion", "q": "Quelle est la structure de l'acide folique et son autre nom ? Dessinez la structure d'un sulfonamide.", "r": "Acide folique = acide ptéroylglutamique (vitamine B9) : noyau ptéridine + PABA + acide glutamique. Sulfonamide : Ar-SO2-NH2 ; sulfanilamide : benzène avec NH2 et SO2NH2 en para."}], "niveaux": [{"t": "Sulfamidés et antifolates", "s": "Bases, découverte, PABA, co-trimoxazole", "ch": ["01_bases_sulfamides"]}, {"t": "Pénicillines", "s": "Structure, β-lactame, acido-résistance, aminopénicillines", "ch": ["02_penicillines"]}, {"t": "Céphalosporines et autres β-lactames", "s": "Générations, carbapénèmes, monobactames, inhibiteurs", "ch": ["03_cephalo_betalactames"]}, {"t": "Le ribosome", "s": "Phénicols, tétracyclines, macrolides, aminosides, lincosamides", "ch": ["04_phenicols_tetra_macrolides_aminosides_lincos"]}, {"t": "Polypeptides et autres antibiotiques", "s": "Acide fusidique, rifamycines, glycopeptides, oxazolidinones", "ch": ["05_polypeptides_autres_ATB"]}, {"t": "Quinolones, urinaires, tuberculose", "s": "Fluoroquinolones, nitrofurantoïne, fosfomycine, antituberculeux", "ch": ["06_quinolones_urinaires_TB_lepre"]}, {"t": "Boss : examen blanc", "s": "", "ch": ["01_bases_sulfamides", "02_penicillines", "03_cephalo_betalactames", "04_phenicols_tetra_macrolides_aminosides_lincos", "05_polypeptides_autres_ATB", "06_quinolones_urinaires_TB_lepre"]}]};</script>

function poolNiveau(n){

function composer(items,ms,nb){

 var d=dayNum();
 var due=mel(items.filter(function(x){var b=S.box[x.id];return b&&b.d<=d&&b.b<5}));
 var neufs=mel(items.filter(function(x){return !S.box[x.id]}));
 var reste=mel(items.filter(function(x){var b=S.box[x.id];return b&&!(b.d<=d&&b.b<5)}));
 var cartes=due.concat(neufs).filter(function(x){return x.kind==='carte'}), autres=due.concat(neufs).concat(reste).filter(function(x){return x.kind!=='carte'});

 if(avecMarq.length>=4) sel.splice(Math.floor(sel.length/2),0,qPaires(pick(avecMarq,4)));

}

 var titre=G.coeurs<=0?'Plus de vies':etoiles===3?'Magnifique !':etoiles===2?'Très bien !':etoiles===1?'Niveau validé':'Encore un effort';
 var h='<div class="fin"><div class="etoiles">'+[1,2,3].map(function(k){return '<span class="'+(etoiles>=k?'on':'')+'">'+icf('etoile')+'</span>'}).join('')+'</div><div class="grosse">'+titre+'</div><div>'+esc(G.nom)+'</div>';
 h+='<div class="gains"><div><b>+'+G.xp+'</b>XP</div><div><b>'+G.ok+'</b>bonnes réponses</div><div><b>x'+G.maxCombo+'</b>meilleur combo</div></div>';
 if(G.erreurs.length) h+='<div class="erreurs"><b>À revoir (elles t\'attendent dans « Révision du jour ») :</b><ul>'+G.erreurs.slice(0,8).map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ul></div>';
 h+='<button class="suite on" id="rejouer">Rejouer</button><button class="suite on" id="maison" style="background:#fff;color:#1a3fd6;box-shadow:0 5px 0 #c7cbd8">Retour au menu</button></div>';
 var cle=G.cle,nom=G.nom; G=null; $('#jeu').innerHTML=h;
 if(etoiles>=2) confetti();
 $('#maison').onclick=accueil;
 $('#rejouer').onclick=function(){if(cle&&cle[0]==='n')lancerNiveau(+cle.slice(1));else{var m={'Révision du jour':'revision','Éclair 60 s':'eclair','Tableau partie 3':'tableau','Atelier dessin':'dessin','Questions du prof':'prof'}[nom];MODES[m]()}};
}
function toast(h){var t=$('#toast');t.innerHTML=h;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},2400)}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function confetti(){var cv=$('#confetti'),c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;var P=[],col=['#f5b82e','#3b5ff0','#16a34a','#e5484d','#7c3aed','#fff'];for(var i=0;i<120;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,v:2+Math.random()*4,r:4+Math.random()*5,c:col[i%6],a:Math.random()*6});var f=0;(function an(){c.clearRect(0,0,cv.width,cv.height);P.forEach(function(p){p.y+=p.v;p.x+=Math.sin((f+p.a)/10);c.fillStyle=p.c;c.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++f<150)requestAnimationFrame(an);else c.clearRect(0,0,cv.width,cv.height)})()}
accueil();
})();
</script></body></html>
