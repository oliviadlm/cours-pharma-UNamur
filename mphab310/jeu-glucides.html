 "gelidium", "nom": "Gelidium sp., Gracilaria sp.", "lat": "Gelidium sp., Gracilaria sp.", "partie": "thalle", "rep": "agar", "tous": ["agar (galactose + 3,6-anhydrogalactose)"], "img": "img/plantes/gelidium.jpg", "usage": "Extraction de l'agar-agar.", "lv": 4}, {"id": "chondrus-crispus", "nom": "Carragheen", "lat": "Chondrus crispus (+ Gigartina)", "partie": "thalle", "rep": "carraghénanes", "tous": ["carraghénanes (riches en O-SO3H)"], "img": "img/plantes/chondrus-crispus.jpg", "usage": "Extraction des carraghénanes.", "lv": 4}], "prof": [{"src": "Liste du prof", "q": "Quelle est la différence entre les gommes vraies et les autres types de gommes ?", "r": "Les gommes dites vraies sont des **exsudats d'arbres ou d'arbustes** : polymères très ramifiés et très hétérogènes comportant divers oses et des **acides uroniques** (glucuronique ou galacturonique). Jadis adoucissants dans les sirops contre la toux, elles restent utilisées comme **gélifiants, épaississants et laxatifs de lest** (gomme arabique, adragante, de Sterculia). Les **mucilages** sont différents : composés d'unités de **mannose et de galactose** (galactomannanes), ce ne sont **pas des exsudats** mais des poudres obtenues par **broyage de l'albumen des graines**. La gomme **xanthane** est d'origine **bactérienne**, donc pas un exsudat non plus.", "lv": 4}, {"src": "Liste du prof", "q": "Quelle est la différence entre les fibres alimentaires et les autres polysaccharides (homogènes et hétérogènes) ?", "r": "Les fibres alimentaires sont des **polysaccharides autres que les glucanes α(1-4)** (amidon) ou des structures de type **lignine**. Elles peuvent être **solubles ou non** dans l'intestin ; on les appelle ainsi car on les retrouve dans l'**alimentation** : cellulose (glucose β1-4), hémicelluloses (chaînes de xylose + acide glucuronique et autres sucres), lignine (polymère de phénylpropènes) ; puis, solubles : pectines, gommes, mucilages, inuline. Les fibres arrivent **intactes dans le côlon** et ne sont dégradées que par la **flore commensale** → activité **prébiotique**.", "lv": 4}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Amidon** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Homogène : amylose (Glc α1→4, linéaire) + amylopectine (α1→4 + ramifications α1→6)\n**Source** : Céréales, tubercules (pomme de terre), manioc\n**Usage** : Réserve glucidique végétale ; excipient (diluant, délitant) ; insoluble dans l'eau froide, empois à chaud", "lv": 3, "img": ["img/schemas/ch1-amylose-amylopectine.png", "img/schemas/ch1-cellulose.png"]}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Cellulose** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Homogène : Glc β1→4 linéaire\n**Source** : Paroi végétale ; bois (délignification), coton\n**Usage** : Excipient (cellulose microcristalline, dérivés : MC, HPMC, CMC) ; coton hydrophile ; fibre insoluble", "lv": 3}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Inuline** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Fructane : Fru β2→1, glucose terminal, G(F)n n = 2-60\n**Source** : Racine de chicorée (industriel), ail, oignon, asperge, topinambour\n**Usage** : Fibre soluble **bifidogène**, prébiotique ; diurétique ; réserve à la place de l'amidon. La liaison β2→1 résiste à l'acide gastrique et aux enzymes digestives", "lv": 3}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Chitine / chitosane** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Homogène aminé : N-acétylglucosamine β1→4 ; chitosane = chitine partiellement désacétylée (NaOH à chaud) → cationique en milieu acide\n**Source** : Carapace de crustacés, cuticule d'insectes, paroi des champignons\n**Usage** : Biocompatible, hydratant, cicatrisant : peau artificielle, pansements (brûlures, cornée), fils de suture résorbables, implants dentaires, lentilles ; source de glucosamine", "lv": 3}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Dextrane** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Homogène : Glc α1→6 (+ ramifications α1→3)\n**Source** : Bactéries (*Leuconostoc mesenteroides*) sur saccharose\n**Usage** : Selon le PM : 60-70 000 = succédané du plasma (remplissage vasculaire) ; 40 000 = troubles thrombo-emboliques, micro-circulation ; 1 000 = prévention des réactions anaphylactiques aux dextranes ; larmes artificielles, collyres", "lv": 3}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Lentinane** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Homogène : glucane β1→3 avec ramifications β1→6\n**Source** : Shiitake (*Lentinula edodes*)\n**Usage** : Immunostimulant", "lv": 3}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Alginates** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène : acides mannuronique et guluronique (liaisons 1→4)\n**Source** : Algues brunes (laminaires, fucus)\n**Usage** : Gel « radeau » anti-reflux gastro-œsophagien ; pansements hémostatiques ; épaississant", "lv": 4}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Agar-agar** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène : galactose + 3,6-anhydrogalactose (+ ac. galacturonique, sulfates)\n**Source** : Algues rouges (*Gelidium*)\n**Usage** : Soluble à chaud, gel ferme au refroidissement, non assimilable : milieux de culture, électrophorèse ; laxatif de lest, pansement gastro-intestinal ; gélifiant alimentaire (remplace la gélatine)", "lv": 4}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Carraghénanes** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène : galactanes sulfatés\n**Source** : Algues rouges\n**Usage** : Gélifiants, épaississants ; protecteurs de la muqueuse gastrique, laxatif mécanique", "lv": 4}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Gommes (arabique, adragante, sterculia)** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogènes très ramifiées : oses + acides uroniques\n**Source** : Exsudats d'arbres (naturels ou après blessure) : Acacia, Astragalus, Sterculia\n**Usage** : Gélifiants, épaississants, émulsionnants ; adoucissants (sirops) ; **sterculia = laxatif de lest**", "lv": 4}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Mucilages** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogènes (galactomannanes : mannose + galactose)\n**Source** : Albumen/tégument des graines : lin, psyllium (ispaghul), guar, fenugrec\n**Usage** : Laxatifs de lest, émollients, adoucissants", "lv": 4}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Pectines** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène : acide D-galacturonique α1→4 (partiellement méthylé), coudes de rhamnose (1→2) + ramifications\n**Source** : Fruits : Citrus (zestes), pommes (marc), coings\n**Usage** : Gélifiant (confitures) ; affections gastro-intestinales (diarrhées) : protection de la muqueuse, adsorption des toxines, activité bactériostatique", "lv": 4}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Gomme xanthane** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène : chaîne Glc β1→4 ; tous les 2 Glc, chaîne latérale mannose–ac. glucuronique–mannose (unité pentasaccharidique acétylée, pyruvylée → anionique)\n**Source** : Bactérie *Xanthomonas campestris*\n**Usage** : Stabilisant/épaississant de 1ᵉʳ choix des suspensions et émulsions ; pseudoplastique ; stable sur large gamme de pH et de T°, compatible avec les sels, non dégradé par les enzymes, sans goût", "lv": 4}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Acide hyaluronique** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène aminé : ac. D-glucuronique + N-acétylglucosamine (β1→3 / β1→4 alternées)\n**Source** : Humeur vitrée, liquide synovial ; industriellement crêtes de coq ou fermentation bactérienne\n**Usage** : Lubrifiant / amortisseur articulaire (arthrose du genou), chirurgie ophtalmique (cataracte, greffe de cornée), médecine esthétique (comblement des rides, moins allergisant que le collagène)", "lv": 1}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Chondroïtine sulfate** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Hétérogène aminé : ac. glucuronique β1→3 N-acétylgalactosamine sulfatée ; unités reliées en β1→4\n**Source** : Cartilage de mammifères (traitement à la papaïne)\n**Usage** : Chondroprotecteur : anti-arthrosique symptomatique d'action lente (complément alimentaire) ; larmes artificielles", "lv": 4}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Héparines** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Glycosaminoglycanes : disaccharides trisulfatés (ac. iduronique-2-O-sulfate + glucosamine-N-sulfate-6-O-sulfate), liaisons α1→4/β1→4 ; pentasaccharide avec glucosamine-3-O-sulfate indispensable\n**Source** : Muqueuse intestinale de porc, poumon de bœuf\n**Usage** : Anticoagulant : active l'antithrombine III → inhibe thrombine et facteur Xa ; IV ou SC (sels Na/Ca). HNF vs HBPM (hydrolyse partielle, demi-vie plus longue, SC). Fondaparinux = pentasaccharide de synthèse (anti-Xa). EI : **hémorragie**, thrombopénie ; antidote **protamine**. Contrôle Ph. Eur. : absence de chondroïtine persulfatée (accidents allergiques graves) — RMN, électrophorèse capillaire", "lv": 4}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Tagatose** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Cétohexose (épimère du fructose en C4 = galactulose) — pas un polysaccharide\n**Source** : Lactose → galactosidase → galactose → isomérisation\n**Usage** : Édulcorant peu calorique, non cariogène, sans effet sur la glycémie, prébiotique", "lv": 0}, {"src": "Tombé à l'examen · Q6 polysaccharides", "q": "**Lactitol** : donnez sa structure de base, sa source et son activité ou utilisation.", "r": "**Structure** : Polyol disaccharidique (galactosyl-sorbitol), issu de la réduction du lactose\n**Source** : Lactose\n**Usage** : Laxatif osmotique ; édulcorant", "lv": 2}, {"src": "Nouvelle question au format examen", "q": "Dessinez le glucose en Fischer et en Haworth (α et β). Distinguez D/L, α/β, pyranose/furanose", "r": "Fischer : chaîne verticale, C1 aldéhyde en haut ; **D** = OH du C5 (dernier C asymétrique) à droite. Haworth : cycle à 6 (pyranose = 5 C + O) ; **α** = OH anomérique en C1 du côté opposé au CH₂OH (en bas), **β** = même côté (en haut). Fructose : cétose, cycle à 5 (furanose) dans le saccharose et l'inuline. Mutarotation = interconversion α/β via la forme ouverte (sucres réducteurs).", "lv": 0, "img": ["img/schemas/ch1-glucose-representations.png", "img/schemas/ch1-glucose-haworth.png", "img/schemas/ch1-types-oses.png"]}, {"src": "Nouvelle question au format examen", "q": "Distinguez ose classique, désoxyose, acide uronique, polyol, ose aminé : un exemple et un intérêt de chacun", "r": "Type — Modification — Exemples — Intérêt\nOse classique — — — Glucose, galactose, mannose, fructose, ribose, xylose — Énergie, constituants\nDésoxyose — Un OH remplacé par H — Rhamnose (6-désoxymannose), désoxyribose (ADN), fucose, digitoxose — Sucres des hétérosides (rutinose) ; ADN\nAcide uronique — C6 oxydé en COOH — Ac. glucuronique, galacturonique — Gommes, pectines, GAG ; glucuroconjugaison (détoxification hépatique)\nAcide aldonique — C1 oxydé — Ac. gluconique — Gluconates (Ca, Fe)\nPolyol — C=O réduit en alcool — Sorbitol, mannitol, xylitol — Édulcorants non cariogènes, laxatifs osmotiques, diurétique osmotique (mannitol IV)\nOse aminé — OH en C2 remplacé par NH₂ — Glucosamine, galactosamine — Chitine, GAG ; glucosamine anti-arthrosique", "lv": 1}, {"src": "Nouvelle question au format examen", "q": "Sorbitol, mannitol, xylitol : origine, propriétés, usages, effets indésirables", "r": "**Sorbitol** : réduction (hydrogénation) du glucose ; présent dans les fruits de Rosacées (sorbier) ; édulcorant (diabétiques, chewing-gums), humectant, excipient, laxatif osmotique, intermédiaire de synthèse de la vit. C. **Mannitol** : réduction du mannose ; manne du frêne, algues ; **diurétique osmotique IV** (œdème cérébral), excipient de comprimés (non hygroscopique). **Xylitol** : réduction du xylose (bois de bouleau) ; pouvoir sucrant ≈ saccharose, effet rafraîchissant, **anti-carie**. EI communs : ballonnements, diarrhée osmotique à forte dose. Xylitol très toxique pour le chien.", "lv": 1}, {"src": "Nouvelle question au format examen", "q": "Saccharose, maltose, lactose : oses, liaisons, caractère réducteur. Pourquoi 2 anomères pour le maltose et le lactose et pas pour le saccharose ? Différence saccharose / miel ?", "r": "Saccharose = α-D-Glc(1→2)β-D-Fru : les 2 C anomériques sont engagés → **non réducteur**, pas de mutarotation, une seule forme. Maltose = Glc α1→4 Glc ; lactose = Gal β1→4 Glc : le C1 du glucose terminal est **libre** → réducteurs, existent en **α et β** (mutarotation). Miel = surtout **sucre interverti** (glucose + fructose libres, issus de l'invertase des abeilles), plus riche en fructose, un peu de saccharose, eau, enzymes, traces de composés phénoliques ; sirop simple = saccharose dans l'eau.", "lv": 2}, {"src": "Nouvelle question au format examen", "q": "Lactulose et lactitol : structure, origine, usages", "r": "**Lactulose** = Gal β1→4 Fru (isomérisation du lactose en milieu alcalin) ; non hydrolysé dans l'intestin grêle → fermenté par la flore colique en acides organiques → **laxatif osmotique** ; acidification → ↓ absorption de NH₃ → **encéphalopathie hépatique** ; prébiotique. **Lactitol** = galactosyl-sorbitol (hydrogénation du lactose) ; laxatif osmotique, édulcorant.", "lv": 2}, {"src": "Nouvelle question au format examen", "q": "Rutinose vs néohespéridose : structure et conséquence gustative", "r": "Tous deux = **rhamnose + glucose**. Rutinose : Rha α1→**6** Glc (rutoside, hespéridoside → **non amers**). Néohespéridose : Rha α1→**2** Glc (naringoside, néohespéridoside → **amers**). L'ouverture du naringoside en chalcone puis hydrogénation → **néohespéridine dihydrochalcone** (NHDC) = édulcorant intense.", "lv": 2}, {"src": "Nouvelle question au format examen", "q": "Maltodextrines, cyclodextrines, acarbose : comparez", "r": "**Maltodextrines** : hydrolyse partielle de l'amidon (DE < 20), chaînes linéaires α1→4 ; énergie (nutrition sportive, entérale), excipient, agent de charge. **Cyclodextrines** : 6 (α), 7 (β) ou 8 (γ) glucoses α1→4 **en anneau** (action d'une glucosyltransférase bactérienne) ; extérieur hydrophile, **cavité hydrophobe** → **complexes d'inclusion** : ↑ solubilité, stabilité, masquage du goût de principes actifs. **Acarbose** : pseudo-tétrasaccharide d'origine bactérienne (*Actinoplanes*) ; **inhibiteur des α-glucosidases** intestinales → ↓ glycémie post-prandiale (diabète de type 2) ; EI : flatulences, diarrhée.", "lv": 2, "img": ["img/schemas/ch1-cyclodextrines.png"]}, {"src": "Nouvelle question au format examen", "q": "Prébiotique, probiotique, fibre alimentaire : définissez et donnez des exemples", "r": "**Prébiotique** : substrat non digestible, fermenté sélectivement par la flore colique bénéfique (bifidobactéries, lactobacilles) → effet santé : FOS, inuline, lactulose, GOS (lait). **Probiotique** : micro-organismes vivants bénéfiques en quantité suffisante (lactobacilles, bifidobactéries, *Saccharomyces boulardii*). **Fibres** : polysaccharides non α-glucanes + lignine, non digérés dans l'intestin grêle ; insolubles (cellulose, hémicelluloses, lignine : transit, lest) et solubles (pectines, gommes, mucilages, inuline : gel, satiété, ↓ cholestérol et pic glycémique, prébiotiques).", "lv": 4}, {"src": "Nouvelle question au format examen", "q": "Gel d'aloès vs latex (suc) d'aloès : ne pas confondre", "r": "**Gel** = parenchyme central des feuilles : polysaccharides (acémannane, glucomannanes acétylés) → hydratant, cicatrisant, brûlures légères (usage cutané, cosmétique). **Latex / suc** = cellules péricycliques sous l'épiderme : **dérivés anthracéniques** (aloïnes A/B = C-hétérosides d'anthrones) → laxatif stimulant. Un gel mal préparé peut être contaminé par l'aloïne.", "lv": 0}, {"src": "Nouvelle question au format examen", "q": "Amidon vs cellulose ; dextrane vs gomme xanthane (comparez)", "r": "Amidon (α1→4 + α1→6, hélicoïdal, réserve, digestible par les amylases) vs cellulose (β1→4, linéaire, fibres H-liées, structurale, non digestible chez l'Homme) ; les deux = glucanes homogènes, excipients. Dextrane (glucane homogène α1→6, bactérien *Leuconostoc*, neutre, soluté de remplissage) vs xanthane (hétérogène anionique, bactérien *Xanthomonas*, épaississant/stabilisant) ; points communs : origine bactérienne, polysaccharides exocellulaires, obtenus par fermentation.", "lv": 3, "img": ["img/schemas/ch1-amylose-amylopectine.png", "img/schemas/ch1-cellulose.png"]}, {"src": "Tombé à l'examen", "q": "Comparez **oligosaccharides et polysaccharides** : points communs et différences.", "r": "communs = oses liés par des liaisons osidiques (C, H, O). Oligosaccharides : 2-10 oses (3-10 au sens strict), solubles dans l'eau et l'alcool dilué, souvent goût sucré ; certains font partie d'hétérosides (rutinose). Polysaccharides : > 10 oses, haut PM, souvent insolubles ou forment des gels/colloïdes ; homogènes (1 seul ose : amidon, cellulose, inuline, dextrane, chitine) ou hétérogènes (plusieurs : gommes, pectines, alginates, agar, xanthane, GAG).", "lv": 2}, {"src": "Tombé à l'examen", "q": "Un patient veut un prébiotique : conseillez-vous des **GOS** ou des **FOS** ? Pourquoi ?", "r": "conseiller les **fructo-oligosaccharides** (ail, oignon, chicorée) : bifidogènes, prébiotiques (stimulent bifidobactéries et lactobacilles). Les **galacto-oligosaccharides** des légumineuses (raffinose, stachyose : haricots, pois chiches) sont peu digestes et fermentés en gaz → **flatulences**.", "lv": 2}], "q6": [{"nom": "Amidon", "st": "Glc α1→4 (amylose) + ramifications α1→6 (amylopectine)", "src": "Céréales, tubercules, manioc", "use": "Réserve végétale ; excipient (diluant, délitant)", "stL": "Homogène : amylose (Glc α1→4, linéaire) + amylopectine (α1→4 + ramifications α1→6)", "srcL": "Céréales, tubercules (pomme de terre), manioc", "useL": "Réserve glucidique végétale ; excipient (diluant, délitant) ; insoluble dans l'eau froide, empois à chaud"}, {"nom": "Cellulose", "st": "Glc β1→4 linéaire", "src": "Paroi végétale, bois, coton", "use": "Excipient (microcristalline, MC, HPMC, CMC) ; coton hydrophile", "stL": "Homogène : Glc β1→4 linéaire", "srcL": "Paroi végétale ; bois (délignification), coton", "useL": "Excipient (cellulose microcristalline, dérivés : MC, HPMC, CMC) ; coton hydrophile ; fibre insoluble"}, {"nom": "Inuline", "st": "Fructane : Fru β2→1 + glucose terminal", "src": "Racine de chicorée", "use": "Fibre soluble bifidogène, prébiotique", "stL": "Fructane : Fru β2→1, glucose terminal, G(F)n n = 2-60", "srcL": "Racine de chicorée (industriel), ail, oignon, asperge, topinambour", "useL": "Fibre soluble **bifidogène**, prébiotique ; diurétique ; réserve à la place de l'amidon. La liaison β2→1 résiste à l'acide gastrique et aux enzymes digestives"}, {"nom": "Chitine / chitosane", "st": "N-acétylglucosamine β1→4", "src": "Carapaces de crustacés, insectes, champignons", "use": "Pansements, peau artificielle, fils de suture résorbables", "stL": "Homogène aminé : N-acétylglucosamine β1→4 ; chitosane = chitine partiellement désacétylée (NaOH à chaud) → cationique en milieu acide", "srcL": "Carapace de crustacés, cuticule d'insectes, paroi des champignons", "useL": "Biocompatible, hydratant, cicatrisant : peau artificielle, pansements (brûlures, cornée), fils de suture résorbables, implants dentaires, lentilles ; source de glucosamine"}, {"nom": "Dextrane", "st": "Glc α1→6 (+ ramifications α1→3)", "src": "Bactérie Leuconostoc mesenteroides sur saccharose", "use": "Succédané du plasma (remplissage vasculaire)", "stL": "Homogène : Glc α1→6 (+ ramifications α1→3)", "srcL": "Bactéries (*Leuconostoc mesenteroides*) sur saccharose", "useL": "Selon le PM : 60-70 000 = succédané du plasma (remplissage vasculaire) ; 40 000 = troubles thrombo-emboliques, micro-circulation ; 1 000 = prévention des réactions anaphylactiques aux dextranes ; larmes artificielles, collyres"}, {"nom": "Lentinane", "st": "Glucane β1→3 ramifié en β1→6", "src": "Shiitake (Lentinula edodes)", "use": "Immunostimulant", "stL": "Homogène : glucane β1→3 avec ramifications β1→6", "srcL": "Shiitake (*Lentinula edodes*)", "useL": "Immunostimulant"}, {"nom": "Alginates", "st": "Acides mannuronique et guluronique (1→4)", "src": "Algues brunes (laminaires, fucus)", "use": "Gel « radeau » anti-reflux ; pansements hémostatiques", "stL": "Hétérogène : acides mannuronique et guluronique (liaisons 1→4)", "srcL": "Algues brunes (laminaires, fucus)", "useL": "Gel « radeau » anti-reflux gastro-œsophagien ; pansements hémostatiques ; épaississant"}, {"nom": "Agar-agar", "st": "Galactose + 3,6-anhydrogalactose", "src": "Algues rouges (Gelidium)", "use": "Milieux de culture ; laxatif de lest ; gélifiant", "stL": "Hétérogène : galactose + 3,6-anhydrogalactose (+ ac. galacturonique, sulfates)", "srcL": "Algues rouges (*Gelidium*)", "useL": "Soluble à chaud, gel ferme au refroidissement, non assimilable : milieux de culture, électrophorèse ; laxatif de lest, pansement gastro-intestinal ; gélifiant alimentaire (remplace la gélatine)"}, {"nom": "Carraghénanes", "st": "Galactanes sulfatés", "src": "Algues rouges (Chondrus)", "use": "Gélifiants ; protecteurs de la muqueuse gastrique", "stL": "Hétérogène : galactanes sulfatés", "srcL": "Algues rouges", "useL": "Gélifiants, épaississants ; protecteurs de la muqueuse gastrique, laxatif mécanique"}, {"nom": "Gommes (arabique, adragante, sterculia)", "st": "Très ramifiées : oses + acides uroniques", "src": "Exsudats d'arbres (Acacia, Astragalus, Sterculia)", "use": "Émulsionnants, épaississants ; sterculia = laxatif de lest", "stL": "Hétérogènes très ramifiées : oses + acides uroniques", "srcL": "Exsudats d'arbres (naturels ou après blessure) : Acacia, Astragalus, Sterculia", "useL": "Gélifiants, épaississants, émulsionnants ; adoucissants (sirops) ; **sterculia = laxatif de lest**"}, {"nom": "Mucilages", "st": "Galactomannanes : mannose + galactose", "src": "Albumen des graines (lin, psyllium, guar)", "use": "Laxatifs de lest, émollients", "stL": "Hétérogènes (galactomannanes : mannose + galactose)", "srcL": "Albumen/tégument des graines : lin, psyllium (ispaghul), guar, fenugrec", "useL": "Laxatifs de lest, émollients, adoucissants"}, {"nom": "Pectines", "st": "Acide galacturonique α1→4 partiellement méthylé + rhamnose", "src": "Zestes de Citrus, marc de pomme", "use": "Gélifiant (confitures) ; antidiarrhéique", "stL": "Hétérogène : acide D-galacturonique α1→4 (partiellement méthylé), coudes de rhamnose (1→2) + ramifications", "srcL": "Fruits : Citrus (zestes), pommes (marc), coings", "useL": "Gélifiant (confitures) ; affections gastro-intestinales (diarrhées) : protection de la muqueuse, adsorption des toxines, activité bactériostatique"}, {"nom": "Gomme xanthane", "st": "Glc β1→4 + chaînes latérales Man–GlcA–Man (anionique)", "src": "Bactérie Xanthomonas campestris", "use": "Épaississant / stabilisant des suspensions et émulsions", "stL": "Hétérogène : chaîne Glc β1→4 ; tous les 2 Glc, chaîne latérale mannose–ac. glucuronique–mannose (unité pentasaccharidique acétylée, pyruvylée → anionique)", "srcL": "Bactérie *Xanthomonas campestris*", "useL": "Stabilisant/épaississant de 1ᵉʳ choix des suspensions et émulsions ; pseudoplastique ; stable sur large gamme de pH et de T°, compatible avec les sels, non dégradé par les enzymes, sans goût"}, {"nom": "Acide hyaluronique", "st": "Acide glucuronique + N-acétylglucosamine", "src": "Crêtes de coq, fermentation bactérienne", "use": "Arthrose du genou, chirurgie ophtalmique, comblement des rides", "stL": "Hétérogène aminé : ac. D-glucuronique + N-acétylglucosamine (β1→3 / β1→4 alternées)", "srcL": "Humeur vitrée, liquide synovial ; industriellement crêtes de coq ou fermentation bactérienne", "useL": "Lubrifiant / amortisseur articulaire (arthrose du genou), chirurgie ophtalmique (cataracte, greffe de cornée), médecine esthétique (comblement des rides, moins allergisant que le collagène)"}, {"nom": "Chondroïtine sulfate", "st": "Acide glucuronique + N-acétylgalactosamine sulfatée", "src": "Cartilage de mammifères", "use": "Chondroprotecteur anti-arthrosique ; larmes artificielles", "stL": "Hétérogène aminé : ac. glucuronique β1→3 N-acétylgalactosamine sulfatée ; unités reliées en β1→4", "srcL": "Cartilage de mammifères (traitement à la papaïne)", "useL": "Chondroprotecteur : anti-arthrosique symptomatique d'action lente (complément alimentaire) ; larmes artificielles"}, {"nom": "Héparines", "st": "GAG : acide iduronique sulfaté + glucosamine sulfatée", "src": "Muqueuse intestinale de porc", "use": "Anticoagulant (antithrombine III → anti-IIa, anti-Xa)", "stL": "Glycosaminoglycanes : disaccharides trisulfatés (ac. iduronique-2-O-sulfate + glucosamine-N-sulfate-6-O-sulfate), liaisons α1→4/β1→4 ; pentasaccharide avec glucosamine-3-O-sulfate indispensable", "srcL": "Muqueuse intestinale de porc, poumon de bœuf", "useL": "Anticoagulant : active l'antithrombine III → inhibe thrombine et facteur Xa ; IV ou SC (sels Na/Ca). HNF vs HBPM (hydrolyse partielle, demi-vie plus longue, SC). Fondaparinux = pentasaccharide de synthèse (anti-Xa). EI : **hémorragie**, thrombopénie ; antidote **protamine**. Contrôle Ph. Eur. : absence de chondroïtine persulfatée (accidents allergiques graves) — RMN, électrophorèse capillaire"}, {"nom": "Tagatose", "st": "Cétohexose, épimère du fructose en C4", "src": "Lactose → galactose → isomérisation", "use": "Édulcorant peu calorique, non cariogène", "stL": "Cétohexose (épimère du fructose en C4 = galactulose) — pas un polysaccharide", "srcL": "Lactose → galactosidase → galactose → isomérisation", "useL": "Édulcorant peu calorique, non cariogène, sans effet sur la glycémie, prébiotique"}, {"nom": "Lactitol", "st": "Galactosyl-sorbitol (polyol disaccharidique)", "src": "Réduction du lactose", "use": "Laxatif osmotique ; édulcorant", "stL": "Polyol disaccharidique (galactosyl-sorbitol), issu de la réduction du lactose", "srcL": "Lactose", "useL": "Laxatif osmotique ; édulcorant"}], "niveaux": [{"t": "Les oses simples", "s": "Aldoses, cétoses, Fischer et Haworth, anomères"}, {"t": "Oses modifiés", "s": "Désoxyoses, acides uroniques, polyols, glucosamine, vitamine C"}, {"t": "Di- et oligosaccharides", "s": "Saccharose, lactose, lactulose, cyclodextrines, acarbose"}, {"t": "Polysaccharides homogènes", "s": "Amidon, cellulose, inuline, dextranes, chitine"}, {"t": "Polysaccharides hétérogènes et fibres", "s": "Algues, gommes, mucilages, pectines, GAG, héparines"}, {"t": "Examen blanc Glucides", "s": "Boss"}]};</script>
