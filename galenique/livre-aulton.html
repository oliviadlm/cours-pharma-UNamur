<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPHAB311 · Aulton · guide de lecture</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--muted:#6b6f76;--line:#e3e0d8;--accent:#2f5d8a;--accent-soft:#e8f0f8;--ok:#2e7d4f;--ok-soft:#e6f4ec;--ko:#b3412e;--ko-soft:#fbeae6;--warn-soft:#fff5dc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:minmax(320px,40%) 1fr;height:100vh}
.left{overflow:auto;padding:14px 16px;border-right:1px solid var(--line)}
.right{display:flex;flex-direction:column;min-width:0;background:#e9e6df}
h1{font-size:19px;margin:0 0 2px} .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.note{background:var(--warn-soft);border-radius:8px;padding:8px 10px;font-size:13.5px;margin:8px 0}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.tabs button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:6px 10px}
summary{cursor:pointer;font-weight:600;padding:4px 0}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .n{font-weight:600;font-size:14px} .it .w{grid-column:1/2;color:var(--muted);font-size:13px}
.pg{grid-row:1/3;grid-column:2;align-self:center;border:1.5px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 9px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.pg:hover{background:var(--accent);color:#fff}
.diff{background:var(--ko-soft);border-radius:8px;padding:6px 9px;font-size:13px;margin:6px 0}
.bar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar button,.bar label.btn{border:1.5px solid var(--line);background:var(--card);border-radius:7px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer}
.bar input[type=number]{width:64px;font:inherit;padding:3px 5px;border:1.5px solid var(--line);border-radius:6px}
.bar .muted{color:var(--muted);font-size:12.5px}
#view{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:10px}
#view canvas{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);max-width:none}
.empty{max-width:420px;margin:40px auto;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}
.bigbtn{display:inline-block;margin-top:12px;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.ex{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.ex .q{white-space:pre-wrap;margin:6px 0}
.ex input{font:inherit;padding:5px 8px;border:1.5px solid var(--line);border-radius:7px;width:130px}
.ex button{border:1.5px solid var(--line);background:var(--card);border-radius:7px;padding:5px 10px;font:inherit;cursor:pointer;margin-left:4px}
.res{margin-top:6px;font-size:14px} .ok{color:var(--ok)} .ko{color:var(--ko)}
.steps{background:var(--accent-soft);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:13.5px}
select{font:inherit;padding:4px 6px;border-radius:7px;border:1.5px solid var(--line);max-width:100%}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:auto 70vh;height:auto}.left{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <a href="index.html" style="font-size:13px;color:var(--accent)">↖ Page générale du cours</a>
    <h1 id="t"></h1><div class="sub" id="s"></div>
    <div class="note" id="ed"></div>
    <div class="tabs"><button id="b1" class="on" onclick="tab(1)">📖 Où lire</button><button id="b2" onclick="tab(2)">🧮 Exercices de calcul</button></div>
    <div id="list"></div>
    <div id="exo" style="display:none"></div>
  </div>
  <div class="right">
    <div class="bar">
      <button onclick="go(cur-1)">◀</button>
      <span class="muted">PDF p.</span><input type="number" id="pin" min="1" onchange="go(+this.value)">
      <span class="muted" id="ptot"></span>
      <button onclick="go(cur+1)">▶</button>
      <button onclick="zoom(-0.15)">−</button><button onclick="zoom(0.15)">+</button>
      <label class="btn">📂 Changer de PDF<input type="file" accept="application/pdf" style="display:none" onchange="pickFile(this.files[0])"></label>
      <span class="muted" id="where"></span>
    </div>
    <div id="view"><div class="empty" id="empty">
      <b>Ouvre ton PDF du livre une seule fois.</b><br>Il reste sur ton ordinateur : il n'est envoyé nulle part, cette page le garde seulement dans ton navigateur pour les prochaines fois.<br>
      <label class="bigbtn">📂 Choisir le PDF<input type="file" accept="application/pdf" style="display:none" onchange="pickFile(this.files[0])"></label>
      <div style="margin-top:10px;font-size:13px" id="fname"></div>
    </div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
const pick = a => a[Math.floor(Math.random() * a.length)];
const r10 = x => Math.round(x * 1e10) / 1e10;
function fmt(n, d = 8) {
  if (typeof n !== "number" || !isFinite(n)) return String(n);
  let s = (Math.round(n * 10 ** d) / 10 ** d).toFixed(d).replace(/0+$/, "").replace(/\.$/, "");
  const [i, f] = s.split(".");
  const ii = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return f ? ii + "," + f : ii;
}
function parseNum(s) { if (s == null) return NaN; s = String(s).trim().replace(/\s| /g, "").replace(",", "."); if (!/^-?(\d+\.?\d*|\.\d+)(e-?\d+)?$/i.test(s)) return NaN; return parseFloat(s); }
function near(x, t, tol) { if (isNaN(x)) return false; if (tol && tol.abs != null) return Math.abs(x - t) <= tol.abs + 1e-12; const rel = tol && tol.rel != null ? tol.rel : 0.005; return Math.abs(x - t) <= Math.max(Math.abs(t) * rel, 1e-12); }
// chapitre : [page PDF du début, page imprimée du début]
const CH = { 1: [23, 1], 2: [36, 13], 3: [54, 30], 5: [76, 50], 6: [108, 81], 7: [129, 101], 8: [144, 114], 9: [157, 126], 11: [189, 156], 12: [206, 172], 15: [268, 229], 16: [288, 247], 17: [299, 257], 23: [408, 360], 24: [435, 386], 26: [458, 407], 27: [477, 424], 31: [558, 501], 38: [692, 626], 44: [808, 735], 50: [912, 833], 52: [941, 860] };
const BOOK = {
id: "aulton",
title: "Aulton's Pharmaceutics (en anglais)",
sub: "Complément au cours : pour chaque notion du cours, le passage d'Aulton qui l'explique. Clique sur la page, elle s'ouvre à droite.",
edition: "Tu as la <b>6<sup>e</sup> édition</b> (2021) ; le cours cite la 3<sup>e</sup> : les numéros de chapitre ont changé, les pages ci-dessous sont celles de ta 6<sup>e</sup>. Pour l'examen, <b>c'est le cours du prof qui compte</b> : lis ces passages seulement quand une notion n'est pas claire.",
pdfPage: it => CH[it.c][0] + (it.p - CH[it.c][1]),
sections: [
{ title: "Ch. 1 · Le médicament", items: [
  { c: 1, n: "Pourquoi et comment on conçoit une forme pharmaceutique", p: 1, w: "Chapter 1 « Design of dosage forms »" },
  { c: 50, n: "Conditionnement : verre, plastiques", p: 833, w: "Chapter 50 « Packaging »" }] },
{ title: "Ch. 2 · L'état solide", items: [
  { c: 8, n: "Polymorphisme, hydrates, amorphe", p: 114, w: "Chapter 8 « Solid-state properties »" },
  { c: 9, n: "Taille des particules et diamètres moyens", p: 126, w: "Chapter 9 « Particle size analysis »" },
  { c: 11, n: "Mélange des poudres, homogénéité", p: 156, w: "Chapter 11 « Mixing »" },
  { c: 12, n: "Écoulement : Hausner et Carr", p: 180, w: "Hausner < 1,2 bon écoulement, > 1,5 poudre cohésive" }] },
{ title: "Ch. 3 · Substances en solution", items: [
  { c: 2, n: "Solubilité et vitesse de dissolution (Noyes-Whitney)", p: 13, w: "Chapter 2 « Dissolution and solubility »" },
  { c: 3, n: "Ionisation : pKa et pH", p: 34, w: "Exemples chiffrés p. 35" },
  { c: 7, n: "Cinétique de dégradation (ordres 0 et 1, Arrhenius)", p: 101, w: "Chapter 7 « Kinetics », exemples p. 104–105" },
  { c: 38, n: "Isotonie : −0,52 °C et méthode cryoscopique", p: 635, w: "Même méthode que le cours, écrite w = (0,52 − a)/b" }] },
{ title: "Ch. 4 · Rhéologie (le meilleur passage des deux livres)", items: [
  { c: 6, n: "Viscosité, contrainte, vitesse de cisaillement, loi de Newton", p: 81, w: "Chapter 6 « Rheology »" },
  { c: 6, n: "Fluides non newtoniens : plastique, pseudoplastique, dilatant", p: 89, w: "Rhéogrammes" },
  { c: 6, n: "Thixotropie et boucle d'hystérésis", p: 91, w: "Baisse de viscosité réversible et dépendante du temps" }] },
{ title: "Ch. 5 · Systèmes dispersés", items: [
  { c: 5, n: "Colloïdes, potentiel zêta, floculation, Stokes", p: 50, w: "Chapter 5 « Disperse systems »" },
  { c: 26, n: "Suspensions floculées et défloculées", p: 407, w: "Chapter 26 « Suspensions »" },
  { c: 27, n: "Émulsions : émulsifiants et instabilités", p: 424, w: "Chapter 27 « Emulsions and creams »" },
  { c: 27, n: "Calcul du mélange d'émulsifiants (HLB)", p: 437, w: "Même calcul que le cours (Tween 80 / Span 80)" }] },
{ title: "Ch. 7 · Stérilisation", items: [
  { c: 15, n: "Cinétique de destruction des micro-organismes", p: 231, w: "Exemple chiffré des spores en ampoules" },
  { c: 16, n: "Les 5 méthodes, valeurs D et Z", p: 247, w: "Chapter 16 « Principles of sterilization »" },
  { c: 17, n: "Stérilisation en pratique, SAL 10⁻⁶", p: 257, w: "Exemple chiffré p. 268" }] },
{ title: "Ch. 8 · Préparations rectales", diff: "La « displacement value » d'Aulton est l'<b>inverse</b> du facteur de déplacement du cours (f = 1/DV). Aulton dit aussi que le beurre de cacao n'est plus utilisé, alors que le cours le présente : à l'examen, suis le cours.", items: [
  { c: 44, n: "Voie rectale : absorption, avantages, limites", p: 735, w: "Chapter 44 « Rectal and vaginal drug delivery »" },
  { c: 44, n: "Bases pour suppositoires", p: 739, w: "Bases grasses et hydrosolubles" },
  { c: 44, n: "Displacement value et exemple", p: 742, w: "Exemple chiffré p. 743" }] },
{ title: "Ch. 9 · Excipients", items: [
  { c: 24, n: "Excipients des solutions : cosolvants, tampons, édulcorants", p: 386, w: "Chapter 24 « Solutions »" },
  { c: 52, n: "Conservateurs antimicrobiens", p: 860, w: "Chapter 52" },
  { c: 31, n: "Excipients des comprimés : liants, délitants, lubrifiants", p: 501, w: "Chapter 31 « Tablets and compaction »" }] }
],
gens: {
dv: { method: "Suppositoires : passer de la displacement value d'Aulton à la méthode du cours", make() {
  const n = pick([6, 8, 10, 12]); const e = pick([1, 2]); const d = pick([0.1, 0.2, 0.25]); const DV = pick([1.25, 1.5, 2, 2.5, 3, 4]); const f = 1 / DV; const M = e - f * d; const ans = M * (n + 1);
  return { q: `Displacement value = ${fmt(DV)} (Aulton). ${n} suppositoires de ${e} g à ${fmt(d * 1000)} mg de PA. Masse de base à peser selon le cours (g) ?`, ans: r10(ans), unit: "g", tol: { rel: 0.003 }, steps: [`f = 1 / ${fmt(DV)} = ${fmt(f, 4)}`, `M = ${e} − ${fmt(f, 4)} × ${fmt(d)} = ${fmt(M, 4)} g par suppositoire`, `× ${n + 1} (n + 1) = <b>${fmt(ans, 3)} g</b>`] };
} },
hlb: { method: "Émulsion : masse de chaque émulsifiant pour une HLB requise", make() {
  const hi = pick([["Tween 80", 15], ["Tween 20", 16.7]]); const lo = pick([["Span 80", 4.3], ["Span 60", 4.7]]); const req = pick([9, 10, 10.5, 11, 12, 13]); const tot = pick([3, 4, 5, 6, 10]);
  const x = (req - lo[1]) / (hi[1] - lo[1]); const gh = x * tot;
  return { q: `HLB requise ${fmt(req)}, ${tot} g d'émulsifiants : ${hi[0]} (HLB ${fmt(hi[1])}) + ${lo[0]} (HLB ${fmt(lo[1])}). Masse de ${hi[0]} (g) ?`, ans: r10(gh), unit: "g", tol: { rel: 0.01 }, steps: [`x = (${fmt(req)} − ${fmt(lo[1])}) / (${fmt(hi[1])} − ${fmt(lo[1])}) = ${fmt(x, 3)}`, `${hi[0]} : ${fmt(x, 3)} × ${tot} = <b>${fmt(gh, 2)} g</b> ; ${lo[0]} : ${fmt(tot - gh, 2)} g`] };
} },
iso: { method: "Isotonie : méthode cryoscopique", make() {
  const pa = pick([["chlorhydrate de lidocaïne", 0.13], ["chlorhydrate de procaïne", 0.122], ["sulfate d'atropine", 0.073], ["chlorhydrate d'éphédrine", 0.169]]); const c = pick([0.5, 1, 2]); const V = pick([10, 30, 50, 100]);
  const a = c * pa[1]; const w = (0.52 - a) / 0.58; const g = w * V / 100;
  return { q: `${V} mL de ${pa[0]} à ${fmt(c)} % (ΔT d'une solution à 1 % = ${fmt(pa[1])} °C ; ΔT du NaCl à 1 % = 0,58 °C). Masse de NaCl (g) ?`, ans: r10(g), unit: "g", tol: { rel: 0.01 }, steps: [`ΔT de la solution = ${fmt(c)} × ${fmt(pa[1])} = ${fmt(a, 4)} °C`, `% NaCl = (0,52 − ${fmt(a, 4)}) / 0,58 = ${fmt(w, 4)} %`, `× ${V} / 100 = <b>${fmt(g, 4)} g</b>`] };
} }
}
};

const $ = s => document.querySelector(s);
$("#t").textContent = BOOK.title; $("#s").textContent = BOOK.sub; $("#ed").innerHTML = BOOK.edition;
function tab(n) { $("#list").style.display = n === 1 ? "" : "none"; $("#exo").style.display = n === 2 ? "" : "none"; $("#b1").classList.toggle("on", n === 1); $("#b2").classList.toggle("on", n === 2); }
$("#list").innerHTML = BOOK.sections.map((s, k) => `<details ${k === 0 ? "open" : ""}><summary>${s.title}</summary>${s.diff ? `<div class="diff">⚠️ ${s.diff}</div>` : ""}${s.items.map(it => {
  const pdf = BOOK.pdfPage(it);
  return `<div class="it"><span class="n">${it.n}</span><button class="pg" onclick="go(${pdf}, '${it.p}')" title="Page ${it.p} du livre = page ${pdf} du PDF">p. ${it.p} ›</button><span class="w">${it.w}</span></div>`; }).join("")}</details>`).join("");
// exercices
const EX = {};
$("#exo").innerHTML = `<div class="note">Seulement des calculs du programme, dans le style des exemples du livre. La correction suit toujours la méthode du cours.</div>` + Object.entries(BOOK.gens).map(([k, g]) => `<div class="ex" id="ex-${k}"><b>${g.method}</b> <button style="float:right" onclick="newEx('${k}')">↻ Autre</button><div class="q"></div><input placeholder="réponse" onkeydown="if(event.key==='Enter')check('${k}')"><button onclick="check('${k}')">Vérifier</button><button onclick="sol('${k}')">Correction</button><div class="res"></div></div>`).join("");
function newEx(k) { const e = BOOK.gens[k].make(); EX[k] = e; const b = $("#ex-" + k); b.querySelector(".q").innerHTML = (e.ctx ? e.ctx + "\n\n" : "") + e.q; b.querySelector("input").value = ""; b.querySelector(".res").innerHTML = ""; }
function check(k) { const e = EX[k], b = $("#ex-" + k); const ok = near(parseNum(b.querySelector("input").value), e.ans, e.tol); b.querySelector(".res").innerHTML = ok ? `<span class="ok">✔ Juste : ${fmt(e.ans, 4)} ${e.unit || ""}</span>` : `<span class="ko">✘ Pas encore. Réessaie ou affiche la correction.</span>`; }
function sol(k) { const e = EX[k]; $("#ex-" + k + " .res").innerHTML = `<div class="steps">${e.steps.join("<br>")}</div>`; }
Object.keys(BOOK.gens).forEach(newEx);
// ---- visionneuse PDF ----
let doc = null, cur = 1, scale = 0, want = null;
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
function db() { return new Promise((res, rej) => { const r = indexedDB.open("livres-galenique", 1); r.onupgradeneeded = () => r.result.createObjectStore("pdf"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function saveFile(f) { try { const d = await db(); d.transaction("pdf", "readwrite").objectStore("pdf").put(f, BOOK.id); } catch (e) {} }
async function loadSaved() { try { const d = await db(); return await new Promise(res => { const q = d.transaction("pdf").objectStore("pdf").get(BOOK.id); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } }
async function pickFile(f) { if (!f) return; await saveFile(f); openFile(f); }
async function openFile(f) {
  if (!window.pdfjsLib) { $("#fname").textContent = "Le lecteur PDF n'a pas pu se charger (connexion ?)."; return; }
  $("#fname").textContent = "Ouverture…";
  try { doc = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise; } catch (e) { $("#fname").textContent = "Ce fichier n'a pas pu être lu."; return; }
  $("#ptot").textContent = "/ " + doc.numPages; go(want || cur);
}
let rendering = false, pending = null;
async function go(n, printed) {
  if (printed) { $("#where").textContent = "→ page " + printed + " du livre"; if (window.innerWidth <= 820) document.querySelector(".right").scrollIntoView({ behavior: "smooth" }); }
  if (!doc) { want = n; return; }
  n = Math.max(1, Math.min(doc.numPages, n || 1)); cur = n; $("#pin").value = n;
  if (rendering) { pending = n; return; } rendering = true;
  const page = await doc.getPage(n); const v = $("#view"); const base = page.getViewport({ scale: 1 });
  if (!scale) scale = Math.max(0.5, (v.clientWidth - 24) / base.width);
  const vp = page.getViewport({ scale }); const dpr = window.devicePixelRatio || 1;
  const c = document.createElement("canvas"); c.width = vp.width * dpr; c.height = vp.height * dpr; c.style.width = vp.width + "px"; c.style.height = vp.height + "px";
  await page.render({ canvasContext: c.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
  v.innerHTML = ""; v.appendChild(c); v.scrollTop = 0; rendering = false;
  if (pending) { const p = pending; pending = null; go(p); }
}
function zoom(d) { scale = Math.max(0.4, (scale || 1) + d); go(cur); }
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); });
loadSaved().then(f => { if (f) openFile(f); });
</script>
<style>
#viewer{position:fixed;inset:0;z-index:1000;background:#f6f4ef;display:none;flex-direction:column}
#viewer .vbar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:#fff;border-bottom:1px solid #e3e0d8;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#viewer .vbar button{border:1.5px solid #2f5d8a;background:#e8f0f8;color:#2f5d8a;border-radius:8px;padding:5px 12px;font:inherit;font-weight:600;cursor:pointer}
#viewer iframe{flex:1;border:0;width:100%;background:#f6f4ef}
</style>
<script>
/* Navigation interne sans quitter le cadre Notion : les pages s'ouvrent dans une vue intégrée */
(function () {
  const top_ = (() => { try { return window.parent !== window && window.parent.__galNav ? window.parent : null; } catch (e) { return null; } })();
  window.__galNav = true;
  window.openViewer = function (u) {
    if (top_) return top_.openViewer(u);
    let v = document.getElementById("viewer");
    if (!v) { v = document.createElement("div"); v.id = "viewer"; v.innerHTML = '<div class="vbar"><button onclick="closeViewer()">← Retour à la page générale</button><span class="vt"></span></div><iframe title="page"></iframe>'; document.body.appendChild(v); }
    const f = v.querySelector("iframe"); f.onload = () => { try { v.querySelector(".vt").textContent = f.contentDocument.title; } catch (e) {} };
    f.src = u + (u.includes("?") ? "&" : "?") + "v=1794968025"; v.style.display = "flex"; document.documentElement.style.overflow = "hidden";
  };
  window.closeViewer = function () {
    if (top_) return top_.closeViewer();
    const v = document.getElementById("viewer"); if (v) { v.style.display = "none"; v.querySelector("iframe").src = "about:blank"; }
    document.documentElement.style.overflow = "";
    if (typeof go === "function" && typeof VIEWS !== "undefined" && VIEWS.home) { try { go("home"); } catch (e) {} }
  };
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest("a"); if (!a) return;
    const h = a.getAttribute("href"); if (!h || a.target || /^(https?:|#|mailto:|javascript:)/i.test(h)) return;
    e.preventDefault();
    const url = new URL(h, location.href);
    const isHome = /\/galenique\/(index\.html)?$/.test(url.pathname);
    if (isHome) { const v = document.getElementById("viewer"); if (top_) top_.closeViewer(); else if (v && v.style.display === "flex") closeViewer(); else openViewer(url.href); return; }
    openViewer(url.href);
  }, true);
})();
</script>

</body>
</html>
