Usage des anthocyanes comme colorants ?", "a": "Aucune toxicité ; additif E 163 (surtout peau de raisin et cassis) : boissons, confitures, confiserie."}, {"id": "ch5c-032", "t": "Pourquoi ?", "q": "Limites à l’emploi des anthocyanes comme colorants ?", "a": "Instabilité (surtout en milieu aqueux) et insolubilité dans les lipides."}, {"id": "ch5c-033", "t": "Origine", "q": "Composition des baies de myrtille ?", "a": "Eau, sucres, acides organiques ; anthocyanosides, acides-phénols, flavan-3-ols monomères, proanthocyanidols, tanins, flavonoïdes."}, {"id": "ch5c-034", "t": "Méthode", "q": "Teneur en anthocyanosides de la myrtille : exprimée en quoi (Ph. Eur.) ?", "a": "En chlorure de 3-glucoside-cyanidol (chrysanthémine), sur drogue desséchée."}, {"id": "ch5c-035", "t": "Usage", "q": "Usages de la myrtille ?", "a": "Astringent doux ; insuffisance veineuse, microcirculation, acuité visuelle en lumière atténuée ; (tanins, flavan-3-ols) diarrhées légères, spasmes des colites, entérites (inhibition de l’adhésion du colibacille)."}, {"id": "ch5c-036", "t": "Origine", "q": "Anthocyanosides du cassis ?", "a": "Glucoside et rutinoside de cyanidol et de delphinidol (+ flavonols, tanins, pectines, 10–15 % sucres)."}, {"id": "ch5c-037", "t": "Usage", "q": "Usages des baies de cassis ?", "a": "Comme la myrtille : insuffisance veineuse (microcirculation) et acuité visuelle."}, {"id": "ch5c-038", "t": "Usage", "q": "Usages des feuilles de vigne rouge ?", "a": "Insuffisance veineuse, symptômes hémorroïdaires, irritations oculaires bénignes (feuilles riches en anthocyanosides)."}, {"id": "ch5c-039", "t": "Méthode", "q": "Un anthocyanidol réagit-il avec NaOH à froid ? avec HCl ?", "a": "NaOH : OUI (perte de H+ des phénols → anhydrobases quinoïdes, changement de couleur). HCl : NON (le cation flavylium est déjà la forme stable en milieu acide)."}, {"id": "ch5c-040", "t": "Méthode", "q": "Les anthocyanes : H2O ou SO ?", "a": "H2O : pigments hydrosolubles (cation, + sucres pour les anthocyanosides), insolubles dans les lipides."}, {"id": "ch6-001", "t": "Définition", "q": "Qu’est-ce qu’une galle ?", "a": "Excroissance produite sur tiges, feuilles ou fruits, le plus souvent suite à des piqûres d’insectes parasites (parfois champignons)."}, {"id": "ch6-002", "t": "Définition", "q": "Définition générale des tanins ?", "a": "Composés polyphénoliques hydrosolubles de PM 500 à 3000 qui présentent, à côté des réactions classiques des phénols, la propriété de précipiter les alcaloïdes et les protéines."}, {"id": "ch6-003", "t": "Définition", "q": "Qu’est-ce que la propriété tannante ?", "a": "Transformation de la peau fraîche en cuir imputrescible par liaisons entre les fibres de collagène (résistance à l’eau, la chaleur, l’abrasion)."}, {"id": "ch6-004", "t": "Définition", "q": "Qu’est-ce que l’astringence ?", "a": "Précipitation des glycoprotéines de la salive qui perd son pouvoir lubrifiant → âpreté caractéristique."}, {"id": "ch6-005", "t": "Définition", "q": "Pour quel acide aminé les tanins ont-ils une très grande affinité ?", "a": "La proline."}, {"id": "ch6-006", "t": "Comparaison", "q": "Expliquez les tanins à une personne qui ne les connaît pas (question type d’examen) : définition, propriétés, 2 types de structures de base.", "a": "Définition : polyphénols hydrosolubles (PM 500–3000) qui précipitent protéines et alcaloïdes. Propriétés : tannantes (cuir), astringentes (salive), complexation des protéines (proline) ; biologiques : antioxydants, inhibiteurs de la 5-lipoxygénase, hyaluronidase, transcriptase inverse (antiviral) ; vasoconstricteurs locaux, régénération tissulaire, antiseptiques. Thérapeutiques : antidiarrhéiques, plaies/brûlures, hémorroïdes (chêne, hamamélis, ratanhia), affections buccales, dermatoses. Structures : (1) tanins HYDROLYSABLES = esters de glucose et d’acide gallique (galliques) ou d’HHDP/acide ellagique (ellagiques) — ex. penta-galloyl-glucose ; (2) tanins CONDENSÉS = polymères non osidiques de flavan-3-ols (catéchine/gallocatéchine) liés C4→C8/C6, donnant des anthocyanidols à chaud en milieu acide (proanthocyanidols)."}, {"id": "ch6-007", "t": "Classe", "q": "Quelles sont les 2 grandes classes de tanins ?", "a": "Tanins hydrolysables (galliques et ellagiques) et tanins condensés (catéchiques, proanthocyanidols). Il existe aussi des tanins complexes combinant les deux."}, {"id": "ch6-008", "t": "Définition", "q": "D’où vient le nom « tanins galliques » ?", "a": "Isolés au départ des noix de galle du chêne."}, {"id": "ch6-009", "t": "Structure", "q": "Structure de base d’un tanin gallique ?", "a": "Glucose estérifié par plusieurs molécules d’acide gallique (1 liaison ester par acide gallique). Ex. 1,2,3,4,6-penta-O-galloyl-β-D-glucose."}, {"id": "ch6-010", "t": "Définition", "q": "Pourquoi dit-on que les tanins galliques sont des hétérosides « tout à fait particuliers » ?", "a": "Plusieurs acides pour un seul sucre : le sucre est estérifié par plusieurs acides (liaisons esters) au lieu d’être lié par une liaison hétérosidique à une génine."}, {"id": "ch6-011", "t": "Définition", "q": "Tanin gallique le plus commun ?", "a": "Le penta-galloyl-glucose."}, {"id": "ch6-012", "t": "Pourquoi ?", "q": "Les mono- et digalloyl-glucoses sont-ils des tanins ?", "a": "Non : PM trop faible, pas de propriétés tannantes ; celles-ci apparaissent avec les triesters et esters de PM supérieurs."}, {"id": "ch6-013", "t": "Structure", "q": "Qu’est-ce que l’acide hexahydroxydiphénique ?", "a": "Acide résultant du couplage oxydatif C2–C2′ de 2 acides galliques (biphényle hexahydroxylé dicarboxylique) ; base des tanins ellagiques."}, {"id": "ch6-014", "t": "Structure", "q": "Combien de liaisons esters un HHDP forme-t-il avec le sucre ?", "a": "2 (une par COOH) ; un acide gallique n’en forme qu’une."}, {"id": "ch6-015", "t": "Structure", "q": "Comment se forme l’acide ellagique ?", "a": "Par rotation de 180° d’un cycle de l’HHDP puis double lactonisation ; il n’a plus de fonction acide mais 2 fonctions lactones."}, {"id": "ch6-016", "t": "Définition", "q": "Quels types de liaisons trouve-t-on dans les tanins ellagiques complexes ?", "a": "Esters (sucre–acide), éthers (entre unités phénoliques), lactones (acide ellagique)."}, {"id": "ch6-017", "t": "Pourquoi ?", "q": "Pourquoi « tanins hydrolysables » ?", "a": "En milieu acide + chauffage, ils s’hydrolysent en libérant le sucre et les acides correspondants (HHDP → acide ellagique) ; on pourrait aussi les appeler tanins saponifiables."}, {"id": "ch6-018", "t": "Structure", "q": "Monomère des tanins condensés ?", "a": "Unités flavan-3-ol : catéchol (catéchine, 2 OH sur B) ou gallocatéchol (gallocatéchine, 3 OH sur B) ; dérivés épi (OH en C3 α)."}, {"id": "ch6-019", "t": "Structure", "q": "Dessinez la catéchine.", "a": "Flavan-3-ol : 2-(3,4-dihydroxyphényl)chromane-3,5,7-triol, (2R,3S)."}, {"id": "ch6-020", "t": "Structure", "q": "Dessinez la gallocatéchine.", "a": "Flavan-3-ol à 3 OH sur le cycle B (3′,4′,5′) ; 5,7-OH ; 3-OH."}, {"id": "ch6-021", "t": "Comparaison", "q": "Les tanins condensés contiennent-ils des sucres ?", "a": "Non : dérivés non hétérosidiques (pas d’oses), bien différents des tanins galliques."}, {"id": "ch6-022", "t": "Définition", "q": "Relation flavonoïdes – tanins condensés ?", "a": "Dihydroflavonols → (réduction) → flavan-3,4-diols ; les unités flavaniques se lient par des liaisons C–C (4→8 ou 4→6) : condensation et polymérisation."}, {"id": "ch6-023", "t": "Structure", "q": "Liaisons interflavaniques des tanins condensés ?", "a": "C–C, majoritairement C4→C8 (aussi C4→C6), toujours trans par rapport au OH en C3 ; jusqu’à ~50 unités."}, {"id": "ch6-024", "t": "Définition", "q": "Trois appellations des tanins condensés ?", "a": "Tanins condensés ; tanins catéchiques (monomère catéchine) ; proanthocyanidols (plutôt dimères, trimères ; donnent des anthocyanidols par acide à chaud)."}, {"id": "ch6-025", "t": "Pourquoi ?", "q": "Que donne un tanin condensé traité par un acide à chaud ?", "a": "Pas les flavan-3-ols de départ mais un anthocyanidol coloré : cyanidol (procyanidols, monomère catéchine) ou delphinidol (prodelphinidols, monomère gallocatéchine)."}, {"id": "ch6-026", "t": "Comparaison", "q": "Procyanidols vs prodelphinidols ?", "a": "Procyanidols : monomère catéchol → cyanidol à chaud en milieu acide. Prodelphinidols : monomère gallocatéchol → delphinidol."}, {"id": "ch6-027", "t": "Méthode", "q": "Solubilité des tanins ?", "a": "Solubles dans l’eau en solutions colloïdales (selon le degré de polymérisation), dans l’acétone et les alcools ; extraction à l’eau bouillante pour le dosage."}, {"id": "ch6-028", "t": "Méthode", "q": "Réactions générales des tanins ?", "a": "Coloration avec FeCl3 (phénols), précipitation avec les sels de métaux lourds, précipitation avec la gélatine."}, {"id": "ch6-029", "t": "Méthode", "q": "Comment différencier tanins hydrolysables et condensés ?", "a": "Comportement en milieu acide à chaud (sucre + acides vs anthocyanidol) et réaction de Stiasny (formol/HCl) : les condensés précipitent, les hydrolysables restent en solution."}, {"id": "ch6-030", "t": "Usage", "q": "Propriétés biologiques des tanins (comme les flavonoïdes) ?", "a": "Piégeurs de radicaux libres (↓ peroxydation lipidique, ↓ ion superoxyde) ; inhibiteurs de la 5-lipoxygénase (anti-inflammatoire), de l’hyaluronidase (gaine vasculaire), de la transcriptase inverse (antiviral)."}, {"id": "ch6-031", "t": "Usage", "q": "Pourquoi utilise-t-on les tanins sur les plaies et brûlures ?", "a": "Effet vasoconstricteur sur les petits vaisseaux superficiels ; en limitant la perte de fluides et les agressions extérieures, ils favorisent la régénération des tissus."}, {"id": "ch6-032", "t": "Usage", "q": "Plantes à tanins contre les hémorroïdes ?", "a": "Chêne, cyprès, hamamélis, ratanhia."}, {"id": "ch6-033", "t": "Usage", "q": "Autres emplois des tanins ?", "a": "Antidiarrhéiques ; antiseptiques (antibactériens, antifongiques) par voie locale : dermatoses, cavité buccale, diarrhées infectieuses."}, {"id": "ch6-034", "t": "Origine", "q": "Citez des drogues à tanins de la Ph. Eur.", "a": "Aigremoine, alchémille, bistorte, écorce de chêne, feuille d’hamamélis, myrtille (fruit sec), racine de pélargonium, racine de ratanhia, tormentille — toutes dosées par la même méthode générale."}, {"id": "ch6-035", "t": "Usage", "q": "Qu’est-ce que le tannate de gélatine ?", "a": "Complexe tanin–gélatine utilisé comme « pansement interne » antidiarrhéique (couche protectrice sur les mucoprotéines) ; dispositif médical."}, {"id": "ch6-036", "t": "Usage", "q": "Propriétés des proanthocyanidols dimères/trimères ?", "a": "Antioxydants puissants ; inhibiteurs de l’histidine décarboxylase (allergie), élastase/collagénase, enzyme de conversion de l’angiotensine ; veino-actifs ; modulateurs du NO."}, {"id": "ch6-037", "t": "Origine", "q": "Canneberge, Pelargonium sidoides, myrtille : action commune des proanthocyanidols ?", "a": "Empêchent l’adhésion des bactéries : voies urinaires (canneberge), muqueuses respiratoires (Pelargonium), muqueuses intestinales (myrtille)."}, {"id": "ch6-038", "t": "Origine", "q": "Proanthocyanidols du cassis, de la cannelle, de l’aubépine : actions ?", "a": "Cassis (feuilles) : anti-inflammatoires, régénèrent le cartilage ; cannelle (écorce) : diabète de type 2 ; aubépine (baies) : régulation cardiaque."}, {"id": "ch6-039", "t": "Définition", "q": "Évolution des pigments du vin rouge au vieillissement ?", "a": "Jeune : rouge violacé (malvidine) et astringent (proanthocyanidines). 1 an : 50 % de malvidine liée aux tanins → plus stable, ambré, moins astringent. Plusieurs années : complexes plus gros → insolubilisation, précipitation."}, {"id": "ch6-040", "t": "Méthode", "q": "Penta-galloyl-glucose : H2O ou SO ? NaOH ? HCl ?", "a": "H2O (tanin hydrosoluble). OUI + NaOH (phénols → phénolates ; les esters, eux, demandent un chauffage). NON pour HCl (hydrolyse seulement à chaud)."}, {"id": "ch6-041", "t": "Méthode", "q": "Acide ellagique : quelles fonctions réagissent sans chauffage avec NaOH ?", "a": "Les 4 OH phénoliques → phénolates (OUI + NaOH). Les 2 lactones peuvent aussi s'ouvrir en milieu alcalin ; pas de COOH."}, {"id": "ch6-042", "t": "Classe", "q": "Structure inconnue : glucose estérifié par des unités trihydroxybenzoyles. Classe ?", "a": "Tanin hydrolysable gallique."}, {"id": "ch6-043", "t": "Classe", "q": "Structure inconnue : chaîne d’unités 2-phénylchromane-3-ol liées C4–C8, sans sucre. Classe ?", "a": "Tanin condensé (catéchique, proanthocyanidol)."}, {"id": "ch7-001", "t": "Définition", "q": "Qu'est-ce qu'une quinone ?", "a": "Composé oxygéné aromatique portant toujours 2 fonctions cétones sur un cycle aromatique, conjuguées à ses doubles liaisons."}, {"id": "ch7-002", "t": "Classe", "q": "Quels sont les 3 noyaux aromatiques des quinones et les quinones correspondantes ?", "a": "Benzène → benzoquinone ; naphtalène → naphtoquinone ; anthracène → anthraquinone."}, {"id": "ch7-003", "t": "Définition", "q": "Quelle est la voie de biosynthèse principale des quinones ?", "a": "La voie des polyacétates (acétates) ; mais comme elles proviennent de l'oxydation de phénols, on en trouve aussi dans d'autres classes à fonctions phénoliques."}, {"id": "ch7-004", "t": "Définition", "q": "Quelles sont les 2 grandes propriétés chimiques des quinones ?", "a": "1) Agents d'oxydation doux, interconversion aisée avec les hydroquinones (forme réduite phénolique) ; 2) tendance à l'addition de nucléophiles (carbonyle = centre électrophile)."}, {"id": "ch7-005", "t": "Pourquoi ?", "q": "Pourquoi les formes réduites (hydroquinones) sont-elles délicates à obtenir à l'extraction ?", "a": "Elles s'oxydent spontanément en quinones au cours de l'extraction."}, {"id": "ch7-006", "t": "Toxicité", "q": "Pourquoi les benzo- et naphtoquinones sont-elles allergisantes ?", "a": "Leur centre électrophile se combine aux fonctions amine et thiol des macromolécules → dermatites de sensibilisation."}, {"id": "ch7-007", "t": "Toxicité", "q": "Citez des situations d'allergie aux quinones vues au cours.", "a": "Travailleurs des bois exotiques (teck, palissandres : conjonctivites, réactions nasales), exceptionnellement instruments de musique en ces bois, horticulteurs (primine de Primula obconica)."}, {"id": "ch7-008", "t": "Structure", "q": "Nommez cette benzoquinone allergisante de Primula obconica.", "a": "Primine (2-méthoxy-6-pentyl-1,4-benzoquinone)."}, {"id": "ch7-009", "t": "Définition", "q": "Solubilités générales des quinones : génines vs hétérosides ?", "a": "Génines : pratiquement insolubles dans l'eau, solubles dans les solvants organiques (benzo-/naphtoquinones entraînables à la vapeur). Hétérosides : solubles dans l'eau et les solutions hydro-alcooliques."}, {"id": "ch7-010", "t": "Structure", "q": "Nommez ce composé et donnez sa drogue d'origine.", "a": "Arbutoside : O-β-glucoside de l'hydroquinone, feuilles de busserole (Arctostaphylos uva-ursi)."}, {"id": "ch7-011", "t": "Usage", "q": "À quoi sert la busserole et quel en est le principe actif ?", "a": "Antiseptique urinaire ; arbutoside (glucoside d'hydroquinone) des feuilles."}, {"id": "ch7-012", "t": "Origine", "q": "Busserole : nom latin, famille, partie utilisée ?", "a": "Arctostaphylos uva-ursi, Ericaceae ; feuilles coriaces, spatulées (ne pas confondre avec airelle et buis)."}, {"id": "ch7-013", "t": "Toxicité", "q": "Pourquoi l'hydroquinone n'est-elle plus utilisée comme dépigmentant cutané ?", "a": "Interdite dans l'UE depuis 2001 par crainte d'effets cancérigènes."}, {"id": "ch7-014", "t": "Structure", "q": "Nommez ce composé (quinone + longue chaîne terpénique).", "a": "Coenzyme Q10 = ubiquinone : benzoquinone + chaîne terpénique de 10 unités C5."}, {"id": "ch7-015", "t": "Définition", "q": "Pourquoi le coenzyme Q10 est-il parfois considéré comme un métabolite primaire ?", "a": "Il intervient comme transporteur d'électrons dans la respiration cellulaire et la photosynthèse ; il est universel (« ubiqui »)."}, {"id": "ch7-016", "t": "Usage", "q": "Quelle forme du Q10 est antioxydante et que protège-t-elle ?", "a": "L'ubiquinol (CoQ10H2, forme réduite polyphénolique) ; il préviendrait l'initiation et la propagation de la peroxydation lipidique (membranes, mitochondries)."}, {"id": "ch7-017", "t": "Comparaison", "q": "Ubiquinol vs α-tocophérol face à la peroxydation lipidique ?", "a": "L'ubiquinol agirait sur l'initiation ET la propagation ; l'α-tocophérol uniquement sur la propagation."}, {"id": "ch7-018", "t": "Origine", "q": "Sources alimentaires du coenzyme Q10 ?", "a": "Animales : poissons gras, volailles. Végétales : céréales complètes, noisettes, légumes, surtout épinards."}, {"id": "ch7-019", "t": "Structure", "q": "Nommez cette naphtoquinone des droséras.", "a": "Plumbagone (5-hydroxy-2-méthyl-1,4-naphtoquinone)."}, {"id": "ch7-020", "t": "Toxicité", "q": "Pourquoi le droséra est-il interdit à dose pondérale ?", "a": "Il contient de la plumbagone, naphtoquinone cytotoxique (comme la plupart des naphtoquinones)."}, {"id": "ch7-021", "t": "Usage", "q": "Usage ancien de la plumbagone ?", "a": "Antispasmodique et antibactérienne (Gram + et quelques Gram −) dans les affections respiratoires (toux d'irritation, toux spasmodiques)."}, {"id": "ch7-022", "t": "Comparaison", "q": "Lawsone vs juglone : position de l'OH et origine ?", "a": "Lawsone : OH en 2, henné (colorant cheveux/peau). Juglone : OH en 5, noyer (brou de noix, teinture du bois)."}, {"id": "ch7-023", "t": "Structure", "q": "Quelle naphtoquinone tinctoriale est représentée ?", "a": "Lawsone (2-hydroxy-1,4-naphtoquinone) du henné."}, {"id": "ch7-024", "t": "Structure", "q": "Quelle naphtoquinone tinctoriale est représentée ?", "a": "Juglone (5-hydroxy-1,4-naphtoquinone) du noyer."}, {"id": "ch7-025", "t": "Définition", "q": "Pourquoi trouve-t-on des naphtoquinones dans les bois résistants comme le teck ?", "a": "Elles sont antibactériennes et fongicides."}, {"id": "ch7-026", "t": "Structure", "q": "Nommez cette naphtoquinone à chaîne diterpénique.", "a": "Vitamine K1 (phytoménadione, phylloquinone) : ménadione + chaîne phytyle C20 à une double liaison."}, {"id": "ch7-027", "t": "Structure", "q": "Nommez cette naphtoquinone à longue chaîne polyprénylée insaturée.", "a": "Vitamine K2 (ménaquinone ; ici MK-7), d'origine bactérienne."}, {"id": "ch7-028", "t": "Structure", "q": "Nommez ce colorant anthraquinonique et son origine.", "a": "Acide carminique (carmin) : anthraquinone C-glucosidique tétra-hydroxylée à fonction acide, extraite des cochenilles (Coccus cacti)."}, {"id": "ch7-029", "t": "Usage", "q": "Usages du carmin ?", "a": "Colorant rouge E120 (cosmétique, agro-alimentaire) ; en pharmacie, indicateur d'homogénéité des triturations au 1/10 dans le lactose."}, {"id": "ch7-030", "t": "Piège", "q": "L'acide carminique a-t-il une activité laxative ?", "a": "Non : c'est une anthraquinone tinctoriale sans activité laxative."}, {"id": "ch7-031", "t": "Origine", "q": "D'où provient la cochenille ?", "a": "Insectes femelles desséchés (Coccus cacti) se développant sur le figuier de Barbarie, cultivés surtout au Pérou."}, {"id": "ch7-032", "t": "Définition", "q": "Quelle substitution est indispensable à l'activité laxative des dérivés anthracéniques ?", "a": "Deux fonctions phénoliques en 1 et 8 (dérivés 1,8-dihydroxyanthracéniques)."}, {"id": "ch7-033", "t": "Structure", "q": "Quelles positions sont toujours/parfois substituées sur les dérivés 1,8-dihydroxyanthracéniques ?", "a": "C3 toujours substitué par C-X (R2 = CH3, CH2OH ou COOH) ; C6 parfois par O-X (R1 = OH ou OCH3)."}, {"id": "ch7-034", "t": "Comparaison", "q": "Anthraquinone vs anthrone ?", "a": "Anthraquinone : 2 C=O en 9 et 10 (forme oxydée). Anthrone : 1 C=O en 9 et un CH2 (ou C substitué) en 10 (forme réduite)."}, {"id": "ch7-035", "t": "Définition", "q": "Pourquoi les dimères sont-ils toujours sous forme anthrone ?", "a": "Les 2 monomères sont liés par leur C10 (C10–C10') : il ne reste qu'une fonction cétone (C9) par monomère."}, {"id": "ch7-036", "t": "Définition", "q": "Quand se forment les dimères dianthrones ?", "a": "Lors du séchage de la drogue (dimérisation, enzymatique chez le séné)."}, {"id": "ch7-037", "t": "Structure", "q": "Chrysophanol, aloe-émodol, rhéine : quelle est la différence ?", "a": "Le substituant en C3 : CH3 (chrysophanol), CH2OH (aloe-émodol), COOH (rhéine) — degré d'oxydation croissant."}, {"id": "ch7-038", "t": "Structure", "q": "Nommez cette génine anthraquinonique à COOH en C3.", "a": "Rhéine (1,8-dihydroxy-anthraquinone-3-carboxylique)."}, {"id": "ch7-039", "t": "Structure", "q": "Nommez cette génine (CH3 en C3).", "a": "Chrysophanol."}, {"id": "ch7-040", "t": "Structure", "q": "Nommez cette génine (CH2OH en C3).", "a": "Aloe-émodol (aloe-émodine)."}, {"id": "ch7-041", "t": "Définition", "q": "Sous quelle forme trouve-t-on les génines libres monomères dans les drogues ?", "a": "Toujours sous forme oxydée (anthraquinone) : les anthrones libres sont peu stables et s'oxydent."}, {"id": "ch7-042", "t": "Comparaison", "q": "Homodianthrones vs hétérodianthrones (séné) ?", "a": "Homo : 2 moitiés identiques (R = COOH) → sennidines/sennosides A et B. Hétéro : moitiés différentes (R = CH2OH sur l'une) → C et D. A/B (et C/D) diffèrent par l'isomérie en 10,10'."}, {"id": "ch7-043", "t": "Structure", "q": "Nommez cette génine dimère du séné.", "a": "Sennidine B : homodianthrone (2 rhéine-anthrones liées C10–C10'), isomère méso."}, {"id": "ch7-044", "t": "Structure", "q": "Nommez cet hétéroside dimère du séné.", "a": "Sennoside B : sennidine B avec un glucose sur chaque OH en 8 et 8'."}, {"id": "ch7-045", "t": "Définition", "q": "Que deviennent les dérivés d'anthrones monomères de la plante fraîche au séchage ?", "a": "Deux voies : oxydation → anthraquinones monomères (bourdaine) ou dimérisation → dianthrones (séné)."}, {"id": "ch7-046", "t": "Origine", "q": "Bourdaine : nom latin, famille, drogue ?", "a": "Frangula alnus (= Rhamnus frangula), Rhamnaceae ; écorce de tige."}, {"id": "ch7-047", "t": "Comparaison", "q": "Écorce fraîche vs sèche de bourdaine ?", "a": "Fraîche : anthrones monomères (CH2 en 10), irritantes, détectées par le bleu de nitrotétrazolium. Sèche : anthraquinones monomères (actives), détectées par les alcalis (rouge)."}, {"id": "ch7-048", "t": "Méthode", "q": "Comment rend-on l'écorce de bourdaine utilisable ?", "a": "Après 1 an de conservation ou chauffage à 100 °C (oxydation des anthrones en hétérosides d'anthraquinones)."}, {"id": "ch7-049", "t": "Comparaison", "q": "Franguloside vs glucofranguloside ?", "a": "Franguloside : 1 sucre sur l'OH en 6 (A : rhamnose, B : apiose). Glucofranguloside : 2 sucres, en 6 (rhamnose/apiose) et glucose en 8. Formes anthraquinones."}, {"id": "ch7-050", "t": "Structure", "q": "Nommez cet O-hétéroside de la bourdaine (1 seul sucre).", "a": "Franguloside A (émodol-6-O-rhamnoside)."}, {"id": "ch7-051", "t": "Origine", "q": "Séné : espèces, origines, drogue ?", "a": "Cassia angustifolia (Arabie, cultivé en Inde, Tinnevelly) et C. acutifolia = C. senna (Afrique tropicale) ; folioles et gousses."}, {"id": "ch7-052", "t": "Méthode", "q": "Pourquoi sécher le séné vers 40 °C ?", "a": "Dimérisation enzymatique en hétérosides de dianthrones (sennosides) ; trop chaud → rupture de l'hétéroside et oxydation en anthraquinones monomères peu actives."}, {"id": "ch7-053", "t": "Comparaison", "q": "O-hétérosides vs C-hétérosides anthracéniques ?", "a": "O : ose lié par un O à un OH (hydrolyse : reflux 20 min en milieu acide). C : ose lié directement au C10 (liaison C–C), beaucoup plus stable (4 h reflux HCl + FeCl3)."}, {"id": "ch7-054", "t": "Origine", "q": "Dans quelles drogues trouve-t-on des C-hétérosides anthracéniques ?", "a": "Cascara et aloès (hétérosides monomères)."}, {"id": "ch7-055", "t": "Origine", "q": "Cascara : nom latin, famille, drogue ?", "a": "Rhamnus purshianus, Rhamnaceae (Amérique du Nord) ; écorce du tronc séchée, saveur très amère ; cascarosides ≥ 60 % des hétérosides."}, {"id": "ch7-056", "t": "Comparaison", "q": "Suc d'aloès vs gel d'aloès ?", "a": "Suc : s'écoule des faisceaux conducteurs, concentré (masses brun foncé), très amer, riche en dérivés hydroxyanthracéniques (laxatif). Gel : mucilage des cellules centrales, usage externe anti-inflammatoire/cosmétique."}, {"id": "ch7-057", "t": "Origine", "q": "Les 2 espèces d'aloès du cours ?", "a": "Aloe ferox (aloès du Cap) et Aloe barbadensis = Aloe vera (aloès des Barbades)."}, {"id": "ch7-058", "t": "Structure", "q": "Nommez ce C-hétéroside (glucose sur le C10).", "a": "Aloïne A (barbaloïne) : aloe-émodine-anthrone 10-C-glucoside."}, {"id": "ch7-059", "t": "Comparaison", "q": "Aloïne A vs aloïne B ?", "a": "Épimères au niveau du C10 (centre de chiralité créé par la liaison glucose–C10)."}, {"id": "ch7-060", "t": "Structure", "q": "Nommez cet hétéroside du cascara (C- et O-glucoside).", "a": "Cascaroside A : aloïne + glucose O-lié sur l'OH en 8."}, {"id": "ch7-061", "t": "Comparaison", "q": "Aloïnosides vs cascarosides ?", "a": "Tous deux : C-glucoside en C10 + 2e sucre O-lié. Aloïnosides (aloès) : sur le CH2OH en 3 (rhamnose). Cascarosides (cascara) : glucose sur l'OH en 8."}, {"id": "ch7-062", "t": "Définition", "q": "Solubilité des génines anthracéniques ?", "a": "Très peu solubles dans l'eau froide ; solubles dans les solvants organiques (éther, CH2Cl2), dans les bases fortes (phénols ; rouge) et dans le bicarbonate seulement si COOH."}, {"id": "ch7-063", "t": "Définition", "q": "Solubilité des hétérosides anthracéniques ?", "a": "Solubles dans l'eau et les solutions hydro-alcooliques (à chaud, + bicarbonate si COOH) ; polarité croissante avec le nombre d'oses ; insolubles dans les solvants organiques."}, {"id": "ch7-064", "t": "Méthode", "q": "Comment transformer les dimères dianthrones en monomères anthraquinones ?", "a": "Chauffage 20 min + FeCl3 en milieu neutre."}, {"id": "ch7-065", "t": "Définition", "q": "Que deviennent les génines libres ingérées ?", "a": "Absorbées dans l'intestin grêle, glucuroconjuguées au foie, éliminées par voie urinaire → peu d'activité laxative."}, {"id": "ch7-066", "t": "Toxicité", "q": "Quels dérivés anthracéniques faut-il exclure et pourquoi ?", "a": "Les anthrones monomères de la plante fraîche (CH2 en 10) : très irritantes pour l'intestin, la vessie et l'utérus."}, {"id": "ch7-067", "t": "Définition", "q": "Mécanisme d'activation des hétérosides anthracéniques ?", "a": "Non absorbés ni hydrolysés dans le grêle ; au côlon, hydrolysés par les β-glucosidases bactériennes ; les génines libérées sont réduites en anthrones actives in situ (prodrogues)."}, {"id": "ch7-068", "t": "Définition", "q": "Délai d'action des laxatifs anthracéniques et pourquoi ?", "a": "8 à 10 heures : le temps d'arriver au côlon et d'être activés par la flore."}, {"id": "ch7-069", "t": "Définition", "q": "Mécanisme d'action des dérivés hydroxyanthracéniques sur le côlon ?", "a": "Inhibition de la résorption de l'eau et du Na⁺ (+ sécrétion de K⁺) et augmentation du péristaltisme du côlon gauche et du sigmoïde (pistes : prostaglandines, calcium)."}, {"id": "ch7-070", "t": "Comparaison", "q": "Structure–activité : dérivés les plus intéressants vs à exclure vs inactifs ?", "a": "Intéressants : hétérosides sans CH2 en 10 (sennosides, rhéine-8-glucoside, aloïne, cascarosides). À exclure : anthrones monomères à CH2 en 10. Pratiquement inactives : génines libres (rhéine, aloe-émodine)."}, {"id": "ch7-071", "t": "Toxicité", "q": "Contre-indications des laxatifs anthracéniques ?", "a": "Enfants < 12 ans, grossesse et allaitement, douleur abdominale de cause indéterminée, antiarythmiques et digitaliques (risque d'hypokaliémie)."}, {"id": "ch7-072", "t": "Toxicité", "q": "Effets indésirables d'un usage prolongé des laxatifs anthracéniques ?", "a": "Hypokaliémie (troubles électrolytiques), trouble permanent du péristaltisme, mélanose colique ; usage limité à 8-10 jours."}, {"id": "ch7-073", "t": "Toxicité", "q": "Qu'est-ce que la mélanose colique ?", "a": "Affection bénigne due à l'abus de laxatifs anthraquinoniques : pigmentation foncée de la muqueuse colique."}, {"id": "ch7-074", "t": "Usage", "q": "Pourquoi préférer les formes sèches de laxatifs anthracéniques ?", "a": "En milieu liquide, les hétérosides (surtout O-) s'hydrolysent facilement en génines peu actives."}, {"id": "ch7-075", "t": "Usage", "q": "Usage du rhizome de rhubarbe ?", "a": "Traitement local d'appoint des inflammations/infections de la muqueuse buccale (gingivite) ; laxatif peu conseillé car ses tanins sont constipants."}, {"id": "ch7-076", "t": "Structure", "q": "Quel dérivé hémisynthétique de la rhéine est représenté et à quoi sert-il ?", "a": "Diacérhéine : rhéine diacétylée sur les OH 1 et 8 ; anti-inflammatoire et anti-arthrosique symptomatique à action lente."}, {"id": "ch7-077", "t": "Définition", "q": "Qu'est-ce qu'une naphtodianthrone ?", "a": "Structure à 2 cycles anthrones + 1 cycle naphtalène (système polycyclique condensé)."}, {"id": "ch7-078", "t": "Structure", "q": "Nommez ce composé rouge du millepertuis.", "a": "Hypéricine (naphtodianthrone ; pseudohypéricine : CH2OH au lieu d'un CH3)."}, {"id": "ch7-079", "t": "Toxicité", "q": "Quel effet indésirable est attribué à l'hypéricine ?", "a": "Photosensibilisation chez certaines personnes, à dose très élevée."}, {"id": "ch7-080", "t": "Origine", "q": "Millepertuis : nom latin et partie utilisée ?", "a": "Hypericum perforatum L. ; sommité fleurie séchée, récoltée pendant la floraison."}, {"id": "ch7-081", "t": "Origine", "q": "Quels autres constituants contient le millepertuis ?", "a": "Flavonoïdes (2-4 % : flavonols dont hypéroside, flavones dimères), acides caféique et chlorogénique, hyperforine, xanthones, procyanidols et tanins condensés."}, {"id": "ch7-082", "t": "Structure", "q": "Nommez ce dérivé prénylé du phloroglucinol du millepertuis.", "a": "Hyperforine (antibactérienne)."}, {"id": "ch7-083", "t": "Usage", "q": "Usages du millepertuis ?", "a": "Antidépresseur (molécules en synergie) ; huile rouge en usage externe (brûlures, cicatrisant, adoucissant, antiprurigineux) — ne pas s'exposer au soleil après application."}, {"id": "ch7-084", "t": "Pourquoi ?", "q": "Pourquoi l'hypéricine est-elle rouge ?", "a": "Toutes ses doubles liaisons et C=O sont conjuguées."}, {"id": "ch7-085", "t": "Méthode", "q": "Quel réactif détecte spécifiquement les anthrones ?", "a": "Le bleu de nitrotétrazolium."}, {"id": "ch7-086", "t": "Comparaison", "q": "Pourquoi la rhéine est-elle soluble dans NaHCO3 et pas le chrysophanol ?", "a": "La rhéine a un COOH en C3, salifiable par une base faible ; le chrysophanol n'a que des phénols, salifiables seulement par des bases fortes."}, {"id": "ch8_1-001", "t": "Définition", "q": "Énoncez la règle isoprénique.", "a": "Tous les terpènes sont formés par l'assemblage d'un nombre entier d'unités ramifiées en C5 (isoprène actif : IPP/DMAPP) → C10, C15, C20, C30, C40."}, {"id": "ch8_1-002", "t": "Méthode", "q": "Quelles sont les 3 séquences réactionnelles fondamentales de la biosynthèse des terpènes ?", "a": "1) Formation de l'« isoprène actif » (C5) à partir de l'acétate via l'acide mévalonique.\n2) Couplage tête à queue des unités C5 → mono (C10), sesqui (C15), diterpènes (C20).\n3) Couplage queue à queue d'unités C15 ou C20 → triterpènes (C30) et tétraterpènes (C40)."}, {"id": "ch8_1-003", "t": "Structure", "q": "Dessinez l'acide mévalonique. Combien a-t-il de carbones ?", "a": "HOOC–CH2–C(OH)(CH3)–CH2–CH2OH : 6 carbones (acide 3,5-dihydroxy-3-méthylpentanoïque)."}, {"id": "ch8_1-004", "t": "Méthode", "q": "Comment passe-t-on de l'acide acétique à l'acide mévalonique ?", "a": "Acide acétique + CoA → acétyl-CoA → acétoacétyl-CoA ; condensation acétyl-CoA + acétoacétyl-CoA (HMG-CoA synthétase) → HMG-CoA (3-hydroxy-3-méthylglutaryl-CoA) ; réduction par le NADPH (HMG-CoA réductase) → MVA."}, {"id": "ch8_1-005", "t": "Usage", "q": "Quelle enzyme est inhibée par les statines et par quels métabolites fongiques naturels ?", "a": "L'HMG-CoA réductase (HMG-CoA → acide mévalonique) ; inhibée par la mévastatine (Penicillium citrinum) et la lovastatine (Aspergillus terreus, Monascus ruber = levure rouge de riz) → effet hypocholestérolémiant."}, {"id": "ch8_1-006", "t": "Méthode", "q": "Comment l'acide mévalonique devient-il l'IPP ?", "a": "Par phosphorylation puis décarboxylation (perte d'un C) : MVA (C6) → isopenténylpyrophosphate IPP (C5)."}, {"id": "ch8_1-007", "t": "Définition", "q": "Qu'est-ce qu'un pyrophosphate ?", "a": "Deux molécules de phosphate condensées, liées par une liaison P–O–P (diphosphate)."}, {"id": "ch8_1-008", "t": "Structure", "q": "Quelle différence entre IPP et DMAPP ?", "a": "Ce sont deux isomères C5 : IPP = double liaison terminale (CH2=C(CH3)–CH2CH2–OPP) ; DMAPP = double liaison interne ((CH3)2C=CH–CH2–OPP), obtenu par isomérisation de l'IPP. Le DMAPP est la molécule starter."}, {"id": "ch8_1-009", "t": "Définition", "q": "Quel est l'autre nom de l'isoprène et pourquoi est-il réactif ?", "a": "Méthyl-butadiène (2-méthylbuta-1,3-diène) : diène conjugué très réactionnel, à la base de nombreux composés."}, {"id": "ch8_1-010", "t": "Définition", "q": "Qu'est-ce qu'un couplage « tête à queue » ? Donnez l'exemple du GPP.", "a": "La tête de l'IPP se greffe sur la queue du DMAPP : DMAPP + IPP → géranylpyrophosphate (GPP, C10)."}, {"id": "ch8_1-011", "t": "Classe", "q": "Quel est le précurseur de tous les monoterpènes ?", "a": "Le GPP (géranylpyrophosphate, C10)."}, {"id": "ch8_1-012", "t": "Classe", "q": "Quel est le précurseur des sesquiterpènes et comment est-il formé ?", "a": "Le FPP (farnésylpyrophosphate, C15) = GPP + IPP (couplage tête à queue)."}, {"id": "ch8_1-013", "t": "Classe", "q": "Quel est le précurseur des diterpènes et comment est-il formé ?", "a": "Le GGPP (géranylgéranylpyrophosphate, C20) = FPP + IPP (tête à queue)."}, {"id": "ch8_1-014", "t": "Classe", "q": "Comment se forme le squalène et de quoi est-il le précurseur ?", "a": "Par duplication avec réduction de 2 FPP selon un couplage queue à queue → squalène (C30), précurseur des triterpènes ET des stéroïdes."}, {"id": "ch8_1-015", "t": "Classe", "q": "Comment se forment les tétraterpènes (caroténoïdes) ?", "a": "Par duplication avec réduction de 2 GGPP (couplage queue à queue) → C40."}, {"id": "ch8_1-016", "t": "Définition", "q": "Qu'est-ce qu'un monoterpène irrégulier ? Exemple ?", "a": "Un monoterpène dont les 2 unités C5 ne se sont pas couplées tête à queue mais d'une façon différente ; ex. l'acide des pyréthrines."}, {"id": "ch8_1-017", "t": "Comparaison", "q": "Complétez : C5 → C10 → C15 → C20 → C30 → C40 (précurseurs et classes).", "a": "IPP/DMAPP (C5) → GPP (C10, monoterpènes) → FPP (C15, sesquiterpènes) → GGPP (C20, diterpènes) ; 2 FPP → squalène (C30, triterpènes/stéroïdes) ; 2 GGPP → C40 (caroténoïdes)."}, {"id": "ch8_1-018", "t": "Définition", "q": "Comment a-t-on montré l'origine acétique des terpènes ?", "a": "Par marquage isotopique : le squelette carboné provient de l'acétate ; l'acide mévalonique a ensuite été identifié comme précurseur universel."}, {"id": "ch8_1-019", "t": "Classe", "q": "Citez des classes de produits issues de la voie du mévalonate.", "a": "H.E. (partim : mono- et sesquiterpènes), iridoïdes, sesquiterpènes (lactones), diterpènes, triterpènes/saponines, cardiotoniques, stéroïdes, caroténoïdes."}, {"id": "ch8_1-020", "t": "Classe", "q": "Les cannabinoïdes ont une origine mixte : laquelle ?", "a": "Polyacétates + terpènes."}, {"id": "ch8_2-001", "t": "Définition", "q": "Donnez la définition Ph. Eur. d'une huile essentielle.", "a": "Produit odorant, généralement de composition complexe, obtenu à partir d'une matière première végétale botaniquement définie, soit par entraînement à la vapeur d'eau, soit par distillation sèche, soit par un procédé mécanique approprié sans chauffage."}, {"id": "ch8_2-002", "t": "Comparaison", "q": "Avec quoi ne faut-il pas confondre une HE ?", "a": "Avec la plante aromatique (elle aussi odorante, mais posologies et modes d'administration très différents) et avec les huiles grasses (lipides non volatils)."}, {"id": "ch8_2-003", "t": "Définition", "q": "Citez les caractères physico-chimiques communs des HE.", "a": "Liquides à T° ordinaire*, volatiles et d'odeur aromatique propre, entraînables à la vapeur d'eau, très peu solubles dans l'eau, lipophiles (solubles dans les solvants organiques apolaires et les alcools de titre élevé), moins denses que l'eau*, parfois très instables (insaturations, aldéhydes → oxydation, dimérisation, résines). (*exceptions)"}, {"id": "ch8_2-004", "t": "Définition", "q": "Quelle masse moléculaire maximale pour qu'un composé odorant soit volatil ?", "a": "< 300."}, {"id": "ch8_2-005", "t": "Définition", "q": "Comment se fait la perception des odeurs et pourquoi est-elle si personnelle ?", "a": "Contact des volatils avec des protéines membranaires des neurorécepteurs → signaux électriques au cerveau ; connexions avec le système limbique (hippocampe, amygdales, hypothalamus : mémoire des émotions) → réactions très personnelles."}, {"id": "ch8_2-006", "t": "Définition", "q": "Dans quelles structures sécrétrices les HE sont-elles stockées ? Exemples.", "a": "Poches à essence (agrumes), poils glanduleux (menthe, thym), canaux sécréteurs (anis vert)."}, {"id": "ch8_2-007", "t": "Origine", "q": "Donnez un exemple d'HE pour chaque organe : sommités fleuries, feuilles, bouton floral, rhizome, écorce, fruit.", "a": "Lavande ; eucalyptus ; giroflier ; gingembre ; cannelle ; badiane."}, {"id": "ch8_2-008", "t": "Origine", "q": "Citez les principales familles à HE avec un exemple.", "a": "Lamiacées (lavande, thym, menthe, sauge), Apiacées (anis vert, fenouil), Rutacées (agrumes), Myrtacées (eucalyptus, girofle), Lauracées (cannelle), Astéracées (camomille), Conifères (pin)."}, {"id": "ch8_2-009", "t": "Méthode", "q": "Quels sont les deux modes d'obtention des HE décrits dans la Ph. Eur. ?", "a": "La distillation par entraînement à la vapeur d'eau (mode principal) et l'expression mécanique."}, {"id": "ch8_2-010", "t": "Méthode", "q": "Expliquez le principe de l'entraînement à la vapeur d'eau.", "a": "Production de vapeur → passage à travers les plantes → l'HE est entraînée avec la vapeur → refroidissement (condensation) → séparation eau/HE par décantation. Possible grâce à la volatilité et au caractère lipophile des HE."}, {"id": "ch8_2-011", "t": "Méthode", "q": "Quelles HE sont obtenues par expression et quelle conséquence ?", "a": "Les HE de péricarpes frais de Citrus : elles contiennent des composés non volatils (< 6 %), dont des furocoumarines phototoxiques (bergaptène)."}, {"id": "ch8_2-012", "t": "Méthode", "q": "Que sont les concrètes et les absolues ? Peut-on les utiliser en médecine ?", "a": "Produits d'extraction par solvants lipophiles ; non destinés à l'usage médical (résidus de solvants et de pesticides, produits non volatils)."}, {"id": "ch8_2-013", "t": "Classe", "q": "De quelles voies biosynthétiques proviennent les constituants des HE ?", "a": "1) Terpènes (voie principale, mévalonate) : monoterpènes (les plus communs) et sesquiterpènes. 2) Composés aromatiques (voie de l'acide shikimique) : dérivés C6-C3 (phénylpropanes) et C6-C1."}, {"id": "ch8_2-014", "t": "Classe", "q": "Pourquoi ne trouve-t-on (presque) que des mono- et sesquiterpènes dans les HE ?", "a": "Seuls les terpènes les plus volatils, de masse moléculaire < 300 (C10 et C15), sont entraînés à la vapeur."}, {"id": "ch8_2-015", "t": "Classe", "q": "Selon quels critères classe-t-on les terpènes des HE ?", "a": "Le cycle (acycliques, mono- ou bicycliques) et les fonctions (hydrocarbures ; alcools, aldéhydes, cétones, phénols, esters, éthers-oxydes)."}, {"id": "ch8_2-016", "t": "Structure", "q": "Dessinez le limonène et donnez sa classe.", "a": "Hydrocarbure monoterpénique monocyclique : cyclohexène portant un méthyle sur la double liaison et un isopropényle en para."}, {"id": "ch8_2-017", "t": "Structure", "q": "Dessinez l'α-pinène et donnez sa classe.", "a": "Hydrocarbure monoterpénique bicyclique (pinane : cycle à 6 ponté par un C(CH3)2) avec double liaison endocyclique portant un méthyle."}, {"id": "ch8_2-018", "t": "Origine", "q": "Quelle HE est riche en limonène ? Origine botanique et partie utilisée ?", "a": "HE de citron : Citrus limon (Rutacées), épicarpes des fruits ; aussi bergamote, néroli, carvi."}, {"id": "ch8_2-019", "t": "Toxicité", "q": "Pourquoi doit-on vérifier l'absence de bergaptène dans l'HE de citron ?", "a": "Le bergaptène est une furocoumarine phototoxique (présente car les HE de Citrus sont obtenues par expression)."}, {"id": "ch8_2-020", "t": "Origine", "q": "Composés principaux et usage de l'HE de bergamote ? Précaution ?", "a": "Limonène + acétate de linalyle ; parfumerie et cosmétique (eau de Cologne). Contient du bergaptène → phototoxicité."}, {"id": "ch8_2-021", "t": "Origine", "q": "Quelles HE de pins contiennent de l'α-pinène et à quoi servent-elles ?", "a": "Pin sylvestre (feuilles et rameaux frais) : inhalations, parfumerie. Pin maritime → essence de térébenthine (via oléorésine obtenue par gemmage) : rubéfiant en usage externe."}, {"id": "ch8_2-022", "t": "Structure", "q": "Dessinez le citronellol. Fonction ? Origine ?", "a": "Alcool primaire monoterpénique acyclique (une seule double liaison) ; citronnelle, mélisse, géranium, rose."}, {"id": "ch8_2-023", "t": "Structure", "q": "Dessinez le citronellal. Fonction ? Origine ?", "a": "Aldéhyde monoterpénique acyclique (une seule double liaison) ; citronnelle (composé principal), citron, mélisse."}, {"id": "ch8_2-024", "t": "Structure", "q": "Qu'est-ce que le citral ?", "a": "Mélange de deux aldéhydes monoterpéniques acycliques α,β-insaturés isomères : citral A = géranial (E) et citral B = néral (Z) ; citron, mélisse, lemon-grass, verveine."}, {"id": "ch8_2-025", "t": "Structure", "q": "Dessinez le linalol. Quel type d'alcool ?", "a": "Alcool monoterpénique acyclique TERTIAIRE portant un vinyle ; lavande, néroli, coriandre."}, {"id": "ch8_2-026", "t": "Structure", "q": "Dessinez l'acétate de linalyle. Réagit-il avec NaOH à froid ?", "a": "Ester acétique du linalol ; NON à froid (la saponification d'un ester nécessite un chauffage). Lavande, bergamote, sauge sclarée."}, {"id": "ch8_2-027", "t": "Origine", "q": "HE de citronnelle : espèces, famille, composés principaux, usage.", "a": "Cymbopogon citratus, C. winterianus (Poacées), parties aériennes ; citronellal, citronellol, géraniol ; HE insectifuge."}, {"id": "ch8_2-028", "t": "Origine", "q": "Mélisse : espèce, famille, constituants de l'HE, propriétés.", "a": "Melissa officinalis (Lamiacées), feuille ; très peu d'HE (citral, citronellal) ; antiseptique, spasmolytique, sédative ; contient aussi de l'acide rosmarinique."}, {"id": "ch8_2-029", "t": "Origine", "q": "HE de lavande : espèce, organe, composés principaux, propriétés.", "a": "Lavandula angustifolia (Lamiacées), fleurs ; linalol + acétate de linalyle ; antiseptique, « calmante » (SNC), insectifuge."}, {"id": "ch8_2-030", "t": "Origine", "q": "Qu'est-ce que le néroli ?", "a": "L'HE de fleur d'oranger amer (Citrus aurantium ssp aurantium) : linalol, acétate de linalyle, limonène, pinène ; parfumerie, sédatif."}, {"id": "ch8_2-031", "t": "Structure", "q": "Dessinez le menthol. Classe et fonction ?", "a": "Monoterpène oxygéné monocyclique (p-menthane) ; alcool secondaire ; (–)-menthol."}, {"id": "ch8_2-032", "t": "Structure", "q": "Dessinez la menthone. Lien avec le menthol ?", "a": "Cétone correspondante du menthol (C=O à la place de CH–OH) ; monoterpène monocyclique."}, {"id": "ch8_2-033", "t": "Origine", "q": "Menthe poivrée : espèce, famille, organe, composés principaux, propriétés.", "a": "Mentha × piperita (Lamiacées), feuilles/parties aériennes fleuries ; menthol + menthone ; digestive, spasmolytique ; HE efficace dans le syndrome du côlon irritable (capsules gastro-résistantes, enrobage entérique)."}, {"id": "ch8_2-034", "t": "Pourquoi ?", "q": "Pourquoi l'HE de menthe est-elle liquide alors que le menthol cristallise ?", "a": "L'HE est un mélange complexe (menthol + menthone + autres) dont le mélange reste liquide ; le menthol pur cristallise en aiguilles."}, {"id": "ch8_2-035", "t": "Structure", "q": "Dessinez le thymol. Réagit-il avec NaOH à froid ?", "a": "Monoterpène aromatique (p-cymène) à fonction phénol ; OUI + NaOH → phénolate soluble dans l'eau."}, {"id": "ch8_2-036", "t": "Comparaison", "q": "Thymol vs carvacrol ?", "a": "Isomères phénoliques du p-cymène : thymol = OH en ortho de l'isopropyle ; carvacrol = OH en ortho du méthyle. Thym CT, origan (sarriette pour le carvacrol)."}, {"id": "ch8_2-037", "t": "Origine", "q": "HE de thym : espèce, organe, composé principal, propriétés.", "a": "Thymus vulgaris (Lamiacées), feuilles et fleurs ; thymol (+ carvacrol) ; HE très antiseptique ; thym antiseptique et spasmolytique."}, {"id": "ch8_2-038", "t": "Structure", "q": "Dessinez le 1,8-cinéole. Quel est son autre nom et sa fonction ?", "a": "Eucalyptol ; éther-oxyde bicyclique (pont O entre C1 et C8 du p-menthane)."}, {"id": "ch8_2-039", "t": "Origine", "q": "HE d'eucalyptus : espèce, famille, organe, composé principal, usage.", "a": "Eucalyptus globulus (Myrtacées), feuilles ; 1,8-cinéole (camphre limité) ; antiseptique, décongestionnant des voies respiratoires."}, {"id": "ch8_2-040", "t": "Origine", "q": "Quelle autre HE contient du cinéole et pour quel usage ?", "a": "HE de romarin (Rosmarinus officinalis, Lamiacées, feuilles et fleurs ; CT cinéole) : décongestionnant des voies respiratoires."}, {"id": "ch8_2-041", "t": "Structure", "q": "Dessinez le camphre. Classe ?", "a": "Monoterpène bicyclique cétonique (bornane-2-one)."}, {"id": "ch8_2-042", "t": "Structure", "q": "Dessinez la thuyone. Classe et danger ?", "a": "Monoterpène bicyclique cétonique (bicyclo[3.1.0]hexanone) ; neurotoxique, convulsivant."}, {"id": "ch8_2-043", "t": "Toxicité", "q": "Quels monoterpènes sont particulièrement toxiques ? Citez-en 3 et leurs sources.", "a": "Les monoterpènes bicycliques cétoniques (neurotoxiques, convulsions) : thuyone (sauge officinale, absinthe, thuya, tanaisie), camphre (camphrier, sauge d'Espagne), pinocamphone (hysope) ; aussi fenchone (fenouil amer)."}, {"id": "ch8_2-044", "t": "Toxicité", "q": "Pourquoi l'HE de sauge officinale n'est-elle pas utilisée ? Quelles sauges ont une HE à la Ph. Eur. ?", "a": "Riche en thuyone (toxique). Sauge sclarée (Salvia sclarea) et sauge d'Espagne (S. lavandulifolia, mais riche en camphre) sont pauvres en thuyone."}, {"id": "ch8_2-045", "t": "Classe", "q": "Citez des sesquiterpènes présents dans les HE.", "a": "Farnésol (fleur d'oranger, tilleul, palmarosa, rose), nérolidol (fleur d'oranger), bisabolol et chamazulène (fleur de matricaire)."}, {"id": "ch8_2-046", "t": "Structure", "q": "Reconnaître : bisabolol. Classe, origine, activité ?", "a": "Sesquiterpène (C15) alcool monocyclique ; HE de matricaire (composé majoritaire, avec ses oxydes) ; anti-inflammatoire."}, {"id": "ch8_2-047", "t": "Structure", "q": "Reconnaître : chamazulène. Classe et origine ?", "a": "Sesquiterpène aromatique de type azulène (bicycle 5-7, bleu) ; formé lors de l'hydrodistillation de la matricine (lactone sesquiterpénique) → couleur bleue de l'HE de matricaire."}, {"id": "ch8_2-048", "t": "Origine", "q": "Matricaire : espèce, famille, organe, composés de l'HE, activités.", "a": "Matricaria recutita = Chamomilla recutita (Astéracées), fleurs ; bisabolol (+ oxydes) majoritaire, chamazulène caractéristique ; HE anti-inflammatoire ; fleurs digestives et spasmolytiques."}, {"id": "ch8_2-049", "t": "Structure", "q": "Farnésol : classe et lien biosynthétique ?", "a": "Sesquiterpène acyclique, alcool primaire : forme alcool du FPP (C15)."}, {"id": "ch8_2-050", "t": "Classe", "q": "Citez les dérivés du phénylpropane (C6-C3) des HE et leur plante.", "a": "Eugénol (clou de girofle), aldéhyde cinnamique (cannelle), anéthole (anis vert, fenouil, badiane), myristicine (noix de muscade)."}, {"id": "ch8_2-051", "t": "Classe", "q": "L'eugénol est-il un terpène ?", "a": "Non : c'est un phénylpropanoïde (C6-C3), issu de la voie des shikimates (acide shikimique → phénylalanine → acide cinnamique). Il est pourtant présent dans une HE (girofle)."}, {"id": "ch8_2-052", "t": "Classe", "q": "Citez des dérivés C6-C1 des HE.", "a": "Vanilline (vanillier) et salicylate de méthyle (essence de wintergreen, Gaultheria) ; assez rares dans les HE."}, {"id": "ch8_2-053", "t": "Origine", "q": "Quelles HE contiennent de la coumarine ?", "a": "Cannelle, aspérule odorante, absolue de tonka."}, {"id": "ch8_2-054", "t": "Définition", "q": "Hors terpènes et aromatiques, quels autres composés trouve-t-on dans certaines HE ?", "a": "Des composés soufrés (Allium, Brassica)."}, {"id": "ch8_2-055", "t": "Définition", "q": "Définissez « chémotype ». Est-ce différent de « chimiotype » ?", "a": "Individus d'une même espèce botanique qui diffèrent par la présence ou l'absence d'une ou plusieurs substances chimiques (variation importante et constante liée au bagage génétique). Chémotype = chimiotype = race chimique : termes interchangeables."}, {"id": "ch8_2-056", "t": "Origine", "q": "Citez les chémotypes du thym (Thymus vulgaris).", "a": "Thymol, carvacrol, linalol, thuyanol, géraniol, α-terpinéol, 1,8-cinéole (nouveau CT)."}, {"id": "ch8_2-057", "t": "Définition", "q": "Quels facteurs influencent la composition d'une HE ?", "a": "Le procédé d'obtention (hydrodistillation vs solvants/CO2), le cycle végétatif (saison de récolte), le chémotype (génétique), les facteurs extrinsèques (climat, altitude, sol, pratiques culturales, heure de récolte)."}, {"id": "ch8_2-058", "t": "Pourquoi ?", "q": "Pourquoi le biotope influence-t-il davantage l'HE des Lamiacées ?", "a": "Leur HE est stockée en surface (poils sécréteurs) ; une localisation plus profonde donne une qualité plus constante."}, {"id": "ch8_2-059", "t": "Méthode", "q": "Comment la Ph. Eur. gère-t-elle la variabilité des HE ?", "a": "Analyse de très nombreux lots → normes (« fourchettes » de concentration) pour les constituants caractéristiques et représentatifs ; travail des experts de la Ph. Eur. (EDQM, Strasbourg)."}, {"id": "ch8_2-060", "t": "Usage", "q": "Quelles HE sont les plus antiseptiques et quelles fonctions chimiques en sont responsables ?", "a": "Phénols, aldéhydes et alcools : HE de thym, sarriettes, cannelles, girofle, tea tree, lavande, palmarosa, cumin ; actives aussi sur des souches antibiorésistantes et sur les champignons."}, {"id": "ch8_2-061", "t": "Usage", "q": "Citez des HE eupeptiques.", "a": "Menthe, anis, fenouil, badiane, matricaire, cannelle de Ceylan, genièvre, romarin (diminuent flatulences, crampes ; effets spasmogènes ou spasmolytiques selon la dose, ex. eugénol, anéthole)."}, {"id": "ch8_2-062", "t": "Usage", "q": "Citez des HE/constituants décongestionnants du tractus respiratoire.", "a": "HE de menthe poivrée, anis, fenouil, thym, eucalyptus, tea tree, pin sylvestre ; menthol, camphre, cinéole (+ effet expectorant)."}, {"id": "ch8_2-063", "t": "Usage", "q": "Citez des HE sédatives.", "a": "Lavande, néroli (fleur d'oranger), mélisse."}, {"id": "ch8_2-064", "t": "Usage", "q": "Citez des HE anti-inflammatoires/antinociceptives.", "a": "Matricaire (bisabolol, chamazulène), lavande, menthe poivrée (prurit, céphalées), clou de girofle/eugénol et myrrhe (bouche) ; usage externe : térébenthine, genévrier, wintergreen, romarin (douleurs articulaires)."}, {"id": "ch8_2-065", "t": "Usage", "q": "Citez des HE insectifuges.", "a": "Citronnelle, eucalyptus, tea tree, marjolaine, lavande."}, {"id": "ch8_2-066", "t": "Usage", "q": "Comment les HE sont-elles utilisées comme excipients ?", "a": "Aromatiser les formes orales (HE à anéthole : anis, fenouil, badiane ; menthes, orange, citron), parfumer les préparations dermopharmaceutiques (lavande, citron, citronnelle), assurer la conservation (pouvoir antiseptique)."}, {"id": "ch8_2-067", "t": "Toxicité", "q": "Pourquoi les HE sont-elles toxiques pour le SNC et plus dangereuses chez l'enfant ?", "a": "Liposolubles, elles s'accumulent dans les lipides dont le SNC ; système de détoxification immature chez le jeune enfant."}, {"id": "ch8_2-068", "t": "Toxicité", "q": "Qu'est-ce que le « spasme de la glotte » et quelle HE est en cause ?", "a": "Chez le jeune enfant, l'HE de menthe poivrée et le menthol (même en simple application sur narines/visage) peuvent provoquer dyspnée, convulsions, coma → éviter < 3 ans ; dérivés terpéniques contre-indiqués < 30 mois."}, {"id": "ch8_2-069", "t": "Toxicité", "q": "Quelles HE sont neurotoxiques (convulsions) ?", "a": "Celles à cétones bicycliques : thuya, absinthe, sauge, tanaisie (thuyone), hysope (pinocamphone), sauge d'Espagne et camphrier (camphre) ; aussi, à forte dose, eucalyptus, menthe, girofle."}, {"id": "ch8_2-070", "t": "Toxicité", "q": "Quel isomère de l'anéthole est le plus toxique ?", "a": "Le Z ou cis-anéthole (foie, SNC) ; le E ou trans-anéthole est environ 20 fois moins toxique. La Ph. Eur. limite le cis-anéthole (l'anéthole de synthèse en contient beaucoup)."}, {"id": "ch8_2-071", "t": "Toxicité", "q": "Quelles HE ont des effets psychotropes et par quels composés ?", "a": "HE de muscade et de persil : myristicine et/ou apiole."}, {"id": "ch8_2-072", "t": "Toxicité", "q": "Quelles HE provoquent irritation digestive et hématuries ?", "a": "Térébenthine et genévrier (pinènes), wintergreen (salicylate de méthyle) → normalement usage externe."}, {"id": "ch8_2-073", "t": "Toxicité", "q": "Quelles précautions en usage cutané ?", "a": "Jamais pures : toujours diluées (HE irritantes pour la peau et plus encore les muqueuses ; cannelles très irritantes). Éviter les yeux ; en cas d'accident, nettoyer avec une huile végétale."}, {"id": "ch8_2-074", "t": "Toxicité", "q": "Quel type d'allergie provoquent les HE ? Laquelle est la plus sensibilisante ?", "a": "Allergie de contact de type IV (retardée) ; touche 1-2 % de la population ; HE de cannelle de Chine la plus sensibilisante."}, {"id": "ch8_2-075", "t": "Toxicité", "q": "Quelles HE sont photosensibilisantes et pourquoi ?", "a": "Bergamote, citron vert, orange amère, mandarine, angélique, persil, céleri… : furocoumarines linéaires (psoralène, bergaptène, xanthotoxine) → dermatites, adduits à l'ADN ; éviter le soleil (UVA)."}, {"id": "ch8_2-076", "t": "Toxicité", "q": "Précautions pour la diffusion d'HE dans l'air ?", "a": "Éviter chez l'enfant < 30 mois, la femme enceinte ou allaitante, l'asthmatique et l'allergique aux parfums (portée hygiénique, pas une forme thérapeutique reconnue)."}, {"id": "ch8_2-077", "t": "Définition", "q": "Que sont les hétérosides de substances volatiles et quel est leur intérêt ?", "a": "Hétérosides dont les génines sont identiques aux constituants des HE (linalol, menthol, thymol, α-bisabolol, vanilline) ; ils justifient scientifiquement l'usage des plantes aromatiques en tisanes."}, {"id": "ch8_2-078", "t": "Comparaison", "q": "EXAMEN — Quelles sont les caractéristiques permettant de définir une HE ? Complétez ensuite le tableau des 2 classes phytochimiques.", "a": "Caractéristiques : produit odorant, de composition complexe, obtenu d'une matière végétale botaniquement définie par entraînement à la vapeur d'eau, distillation sèche ou procédé mécanique sans chauffage ; liquide, volatil, entraînable à la vapeur, lipophile, très peu soluble dans l'eau, moins dense que l'eau, instable.\nClasse 1 = TERPÈNES (mono-/sesquiterpènes) : ex. thymol (phénol p-cymène) → HE de thym (Thymus vulgaris), antiseptique ; ou menthol → menthe poivrée, spasmolytique ; ou 1,8-cinéole → eucalyptus, décongestionnant.\nClasse 2 = PHÉNYLPROPANOÏDES (C6-C3, voie des shikimates) : ex. eugénol → clou de girofle, antiseptique/anesthésique dentaire ; ou anéthole → anis vert/fenouil/badiane, eupeptique, aromatisant ; ou aldéhyde cinnamique → cannelle, antiseptique.\n(Choisir une structure différente de celles déjà présentes dans l'examen.)"}, {"id": "ch8_2-079", "t": "Méthode", "q": "Comment l'hydrodistillation peut-elle modifier la composition d'une HE ?", "a": "L'eau, la température et l'acidité de la plante induisent hydrolyses, réarrangements, isomérisations (ex. matricine → chamazulène). Les solvants ou le CO2 supercritique donnent des produits plus proches de la plante, mais extraient aussi des non-volatils."}, {"id": "ch8_2-080", "t": "Usage", "q": "Pourquoi l'HE de menthe est-elle formulée en capsules gastro-résistantes ?", "a": "Pour libérer l'HE dans l'intestin (enrobage entérique) dans le syndrome du côlon irritable (action spasmolytique) ; ne pas associer aux antiacides/IPP (dissolution prématurée)."}, {"id": "ch8_2-081", "t": "Comparaison", "q": "Classez : limonène, linalol, menthol, thymol, 1,8-cinéole, camphre selon cycle et fonction.", "a": "Limonène : monocyclique, hydrocarbure. Linalol : acyclique, alcool tertiaire. Menthol : monocyclique, alcool secondaire. Thymol : aromatique, phénol. 1,8-cinéole : bicyclique, éther-oxyde. Camphre : bicyclique, cétone."}, {"id": "ch8_3-001", "t": "Définition", "q": "Définissez une oléorésine.", "a": "Mélange d'huile essentielle et de résine (produits hétérogènes en partie dissous dans l'HE) ; produit de consistance molle ou semi-liquide, mal défini car très complexe."}, {"id": "ch8_3-002", "t": "Définition", "q": "Que peut-on trouver dans les oléorésines ?", "a": "Glucorésines (jalap), HE, acides terpéniques, acides aromatiques (benzoïque, cinnamique, férulique, salicylique, caféique), alcools résineux (résinotanols), esters."}, {"id": "ch8_3-003", "t": "Classe", "q": "Citez les 4 types d'oléorésines selon leur obtention.", "a": "1) Par exsudation : baumes (Pérou, Tolu), benjoins, térébenthine, mastic. 2) Par extraction au solvant puis remise en solution (capsicine du Capsicum, résine de podophylle). 3) Présentes dans des drogues utilisées telles quelles (poivre, gingembre, cardamome, piment). 4) Localisées dans des glandes séparables par battage (houblon, chanvre indien)."}, {"id": "ch8_3-004", "t": "Définition", "q": "Définissez une gommo-résine et donnez un exemple.", "a": "Exsudat principalement constitué de composés résineux et de gommes (polysaccharides) : encens indien (Boswellia serrata)."}, {"id": "ch8_3-005", "t": "Définition", "q": "Définissez une gommo-oléorésine et donnez un exemple.", "a": "Exsudat constitué de composés résineux, de gommes (polysaccharides) et de composés volatils (HE) : myrrhe (Commiphora molmol)."}, {"id": "ch8_3-006", "t": "Origine", "q": "Qu'est-ce que la térébenthine et où se trouve-t-elle dans la plante ?", "a": "Exsudat résineux (oléorésine) de diverses espèces de pins (Pinus sp., hémisphère Nord), localisé dans des canaux sécréteurs."}, {"id": "ch8_3-007", "t": "Méthode", "q": "Comment obtient-on la térébenthine ?", "a": "Traditionnellement par gemmage (écorcer puis inciser le tronc, recueillir l'oléorésine) ; aussi à partir des résidus de l'industrie du bois/pâte à papier (extraction des souches par solvant puis distillation)."}, {"id": "ch8_3-008", "t": "Comparaison", "q": "Térébenthine, essence de térébenthine et colophane : différences ?", "a": "Térébenthine = oléorésine brute (exsudat des pins). Essence de térébenthine = HE obtenue par entraînement à la vapeur de l'oléorésine (carbures monoterpéniques : α- et β-pinène ; liquide, rubéfiant en usage externe). Colophane = résine, résidu solide de la distillation (acides diterpéniques : acide abiétique)."}, {"id": "ch8_3-009", "t": "Usage", "q": "Quels sont les usages de la colophane ?", "a": "Formes chimiquement modifiées (sels, esters, hydrogénées, polymérisées) recherchées pour leur « collant » et leur hydrophobicité : sparadraps ; archets des instruments à cordes."}, {"id": "ch8_3-010", "t": "Classe", "q": "À quelle classe appartient l'acide abiétique et d'où provient-il ?", "a": "Acide diterpénique (C20) ; principal constituant de la colophane (résine des pins) ; « abiétique » vient d'Abies (sapins)."}, {"id": "ch8_3-011", "t": "Origine", "q": "Mastic : origine, composés de l'HE, usages ?", "a": "Exsudat résineux séché de Pistacia lentiscus var. latifolius (île de Chio) ; HE riche en α- et β-pinène ; antiseptique, antioxydant alimentaire, troubles gastriques ; actif contre Helicobacter pylori (gastrite, ulcère peptique)."}, {"id": "ch8_3-012", "t": "Origine", "q": "Encens indien : espèce, mode d'obtention, médecine traditionnelle ?", "a": "Boswellia serrata (Inde) ; exsudat résineux obtenu par incision du tronc ou des rameaux (Olibanum indicum) ; médecine ayurvédique (anti-inflammatoire)."}, {"id": "ch8_3-013", "t": "Structure", "q": "Reconnaître : acides boswelliques. Classe ?", "a": "Acides triterpéniques pentacycliques (type ursane, 30 C, 5 cycles) : acide boswellique, 11-céto-β-boswellique, acétyl-11-céto-β-boswellique ; COOH sur C4."}, {"id": "ch8_3-014", "t": "Méthode", "q": "Pourquoi et comment dose-t-on les acides 11-céto-boswelliques ?", "a": "Par HPLC avec détection à 250 nm : leur cétone est conjuguée avec la double liaison (absorption UV)."}, {"id": "ch8_3-015", "t": "Usage", "q": "Dans quelles pathologies l'encens indien a-t-il montré une efficacité clinique ?", "a": "Maladies inflammatoires chroniques : arthrite rhumatoïde (et arthrose du genou), asthme (inhibition des leucotriènes de la bronchoconstriction), colite ulcéreuse et maladie de Crohn."}, {"id": "ch8_3-016", "t": "Toxicité", "q": "Contre-indication de l'encens indien ?", "a": "Femme enceinte (possibilité d'avortement spontané selon la documentation indienne) ; attention aussi aux falsifications/confusions entre encens."}, {"id": "ch8_3-017", "t": "Comparaison", "q": "Encens indien vs encens biblique ?", "a": "Encens indien = Boswellia serrata ; l'encens biblique provient de Boswellia carteri. Nombreuses confusions → bien préciser l'origine."}, {"id": "ch8_3-018", "t": "Origine", "q": "Myrrhe : origine, définition Ph. Eur. ?", "a": "Gomme-résine durcie à l'air obtenue par incision ou exsudation spontanée du tronc et des rameaux de Commiphora molmol (ou autres Commiphora) ; Afrique du Nord-Est, Yémen ; analgésique depuis l'Antiquité."}, {"id": "ch8_3-019", "t": "Classe", "q": "À quoi la myrrhe doit-elle son odeur et quelles sont leurs propriétés ?", "a": "Aux furanosesquiterpènes (furanoeudesma-1,3-diène, curzérénone) : antibactériens, antifongiques, anesthésiques locaux, analgésiques."}, {"id": "ch8_3-020", "t": "Usage", "q": "Usages et forme d'utilisation de la myrrhe ?", "a": "Usage externe : inflammations des muqueuses de la bouche et du pharynx (aphtes, gingivite), petites irritations et blessures cutanées ; adjuvant pharyngite/amygdalite ; forme la plus utile : teinture (1:5 dans éthanol 90 %, action anesthésique locale)."}, {"id": "ch8_3-021", "t": "Origine", "q": "Quelle est la particularité de composition des baumes de Tolu et du Pérou ?", "a": "Oléorésines obtenues par exsudation, riches en acides benzoïque et cinnamique libres et estérifiés (benzoate, cinnamate de benzyle) — étudiées avec la voie des shikimates (Myroxylon)."}, {"id": "ch8_3-022", "t": "Pourquoi ?", "q": "Pourquoi l'essence de térébenthine contient-elle des monoterpènes et la colophane des diterpènes ?", "a": "La vapeur n'entraîne que les composés volatils (C10, pinènes) ; les acides diterpéniques C20 non volatils restent dans le résidu solide."}, {"id": "ch8_4-001", "t": "Définition", "q": "À quelle classe de terpènes appartiennent les iridoïdes ? Combien de C ?", "a": "Aux monoterpènes : normalement 10 C ; mais certains substitués en ont > 10 et d'autres ont perdu 1 C (absence du C-11)."}, {"id": "ch8_4-002", "t": "Méthode", "q": "Résumez la biosynthèse des iridoïdes.", "a": "Géraniol → oxydations (10-oxogéranial) → cyclisation → iridodial (2 CHO) → oxydation, cycle pyrane, méthylation, glucosylation → loganoside → coupure 7/8 → sécologanoside."}, {"id": "ch8_4-003", "t": "Définition", "q": "D'où vient le nom « iridoïde » ?", "a": "Des fourmis du genre Iridomyrmex, d'où furent isolés des composés de défense (iridodial, insecticide)."}, {"id": "ch8_4-004", "t": "Structure", "q": "Décrivez le squelette des iridoïdes. Quelle est la tête de file ?", "a": "Squelette IRIDANE bicyclique cyclopentapyranique : cyclopentane accolé à un cycle pyrane (1 O numéroté) ; 10 C + 1 CH3 (ester méthylique) ; tête de file : loganoside."}, {"id": "ch8_4-005", "t": "Structure", "q": "Dessinez le loganoside.", "a": "Iridoïde glucosylé : cyclopentane (OH en C7, CH3 en C8) accolé au dihydropyrane (O-2, C3=C4) ; COOCH3 (C-11) en C4 ; glucose sur l'OH en C1."}, {"id": "ch8_4-006", "t": "Structure", "q": "Qu'est-ce qu'un sécoiridoïde ? Tête de file ?", "a": "Iridoïde dont la liaison 7-8 est rompue (séco = couper) : il ne reste que le noyau pyranique ; tête de file : sécologanoside."}, {"id": "ch8_4-007", "t": "Structure", "q": "Dessinez le sécologanoside.", "a": "Dihydropyrane glucosylé en C1 avec vinyle en C9, COOCH3 en C4 et chaîne CH2–CHO en C5 (aldéhyde issu de la rupture 7-8)."}, {"id": "ch8_4-008", "t": "Usage", "q": "De quels alcaloïdes le sécologanoside est-il le précurseur ?", "a": "Des alcaloïdes indolomonoterpéniques et isoquinoléiques."}, {"id": "ch8_4-009", "t": "Structure", "q": "Comment est établie la liaison hétérosidique des iridoïdes ? Rôle du sucre ?", "a": "Presque toujours des glucosides : liaison entre l'OH anomérique du D-glucose et l'OH en C-1 de la génine ; la glucosylation stabilise le cycle pyranique."}, {"id": "ch8_4-010", "t": "Structure", "q": "Que devient l'OH en C-1 chez les iridoïdes non hétérosidiques ?", "a": "Il est engagé dans un autre type de liaison (ex. ester : valépotriates), ce qui stabilise aussi le cycle pyranique."}, {"id": "ch8_4-011", "t": "Structure", "q": "Quelles variations structurales observe-t-on au niveau du C-11 des iridoïdes ?", "a": "Carboxyle (COOH), carbométhoxyle (COOCH3, le plus fréquent), plus rarement hydroxyméthyle, aldéhyde, méthyle ; le C-11 peut même être absent (harpagoside, aucuboside) → plus 10 C."}, {"id": "ch8_4-012", "t": "Structure", "q": "Quelles variations portent sur le C-10 ?", "a": "Le CH3 en 10 peut être plus ou moins oxydé (CH2OH) ou remplacé par un époxyde (valépotriates : 8,10-époxyde)."}, {"id": "ch8_4-013", "t": "Structure", "q": "Quels groupes caractérisent les sécoiridoïdes en C-9 ? Exemples.", "a": "Vinyle en C-9 (sécologanoside) ou éthylidène en C-9 (oléuropéoside, avec en plus un ester en C7)."}, {"id": "ch8_4-014", "t": "Structure", "q": "Comment se forme la lactone du gentiopicroside ?", "a": "Les fonctions du sécoiridoïde réagissent entre elles (réduction de l'aldéhyde, déméthylation de l'ester) → recyclisation en cycle lactonique."}, {"id": "ch8_4-015", "t": "Méthode", "q": "Comment extrait-on les iridoïdes ? Pourquoi est-ce délicat ?", "a": "Par solvants polaires (alcools de titre variable) ; composés très instables qui s'hydrolysent et se transforment après la récolte (noircissement)."}, {"id": "ch8_4-016", "t": "Définition", "q": "Pourquoi appelait-on les iridoïdes « hétérosides chromogènes » ?", "a": "Parce que, très instables, ils provoquent un noircissement rapide des végétaux qui en contiennent après récolte (formation de produits colorés)."}, {"id": "ch8_4-017", "t": "Usage", "q": "Citez les propriétés intéressantes de quelques iridoïdes avec un exemple chacune.", "a": "Apéritives/amères : loganoside, gentiopicroside, amarogentioside ; anti-inflammatoires : harpagoside ; antioxydantes et hypotensives : oléuropéine. Toxiques (cytotoxiques, mutagènes) : valépotriates."}, {"id": "ch8_4-018", "t": "Origine", "q": "Où trouve-t-on le loganoside ?", "a": "Abondant chez les Loganiacées (genre Strychnos) ; présent dans le trèfle d'eau (Menyanthes trifoliata). Iridoïde amer."}, {"id": "ch8_4-019", "t": "Origine", "q": "Quels sécoiridoïdes amers contient la racine de gentiane jaune ?", "a": "Gentiopicroside (gentiopicrine) et amarogentioside (amarogentine, extrêmement amer) ; Gentiana lutea."}, {"id": "ch8_4-020", "t": "Usage", "q": "Quelles sont les propriétés de la racine de gentiane ?", "a": "Eupeptiques (digestives) liées à l'amertume : stimule les sécrétions gastriques et biliaires ; apéritif."}, {"id": "ch8_4-021", "t": "Structure", "q": "Reconnaître : harpagoside. Particularité structurale ?", "a": "Iridoïde glucosylé, ester cinnamique de l'harpagide ; PAS de C-11 (pas de 10e C)."}, {"id": "ch8_4-022", "t": "Origine", "q": "Harpagophyton : espèce, partie utilisée, origine géographique, activités.", "a": "Harpagophytum procumbens (griffe du diable, fruit en grappin), racines secondaires tubérifiées ; régions désertiques du Sud-Est de l'Afrique ; anti-inflammatoire et antirhumatismal (douleurs articulaires), stimulant de l'appétit."}, {"id": "ch8_4-023", "t": "Structure", "q": "Oléuropéine : classe et particularité ?", "a": "Sécoiridoïde glucosylé à fonctions phénols (ester d'hydroxytyrosol, éthylidène en C-9) ; polyphénol antioxydant."}, {"id": "ch8_4-024", "t": "Origine", "q": "Oléuropéine : origine, propriétés, contrôle ?", "a": "Feuilles d'olivier (Olea europaea, Oléacées) ; feuilles traditionnellement contre l'hypertension ; antioxydante, cosmétologie ; dosage HPLC (teneur minimale Ph. Eur.)."}, {"id": "ch8_4-025", "t": "Structure", "q": "Reconnaître : valépotriates. Que signifie leur nom ?", "a": "Triesters lipophiles de triols dérivés de l'iridane 8,10-époxydés : Valériane + époxyde + triesters. OH en C1 et C7 estérifiés par l'acide (iso)valérique, CH2OH en C11 par l'acide acétique."}, {"id": "ch8_4-026", "t": "Comparaison", "q": "Valtrates vs dihydrovaltrates ?", "a": "Valtrates = diènes (2 doubles liaisons) ; dihydrovaltrates = dérivés dihydro en 5-6, une seule double liaison en 3,4 (monoènes)."}, {"id": "ch8_4-027", "t": "Toxicité", "q": "Pourquoi les valépotriates sont-ils indésirables et comment les éviter ?", "a": "Cytotoxiques (fonction époxy) et mutagènes. Ils sont présents dans la racine fraîche et instables : dessiccation de 6 mois (dégradation) et extraits hydro-alcooliques à éthanol < 70 % (non extraits) → préparations dépourvues de valépotriates."}, {"id": "ch8_4-028", "t": "Définition", "q": "Dans quelles conditions les valépotriates se décomposent-ils et en quoi ?", "a": "Humidité, chaleur > 40 °C, acidité pH < 3 → aldéhydes insaturés dont le baldrinal."}, {"id": "ch8_4-029", "t": "Classe", "q": "À quelle classe appartiennent les pyréthrines ?", "a": "Aux monoterpènes irréguliers (l'acide cyclopropanique ne résulte pas d'un couplage tête à queue classique)."}, {"id": "ch8_4-030", "t": "Origine", "q": "D'où sont isolées les pyréthrines ?", "a": "Des capitules du pyrèthre de Dalmatie, Tanacetum cinerariifolium = Chrysanthemum cinerariaefolium (Astéracées) ; teneur plus élevée chez les clones sélectionnés."}, {"id": "ch8_4-031", "t": "Structure", "q": "Reconnaître : structure générale des pyréthrines. Pourquoi 6 esters ?", "a": "Esters d'un acide cyclopropanique (monoterpène irrégulier ; 2 possibilités de R1) et d'un alcool secondaire à noyau cyclopenténone (3 possibilités de R2) → 2 × 3 = 6 esters."}, {"id": "ch8_4-032", "t": "Comparaison", "q": "Séries I et II des pyréthrines selon le cours : R1 et activité ?", "a": "Selon le cours : R1 = CH3 → acide pyréthrique, série I : paralysie moins marquée mais plus stable → effet létal. R1 = CO2CH3 → acide chrysanthémique, série II : paralysie rapide mais effet létal faible. Synergie : la série I achève l'action de la série II. (Remarque : en chimie, l'acide chrysanthémique porte habituellement R1 = CH3 ; suivre la convention du cours.)"}, {"id": "ch8_4-033", "t": "Usage", "q": "Mode d'action et cibles des pyréthrines ?", "a": "Insecticides de contact ; poison nerveux (fibres sensitives et motrices) des animaux à sang froid : insectes, poissons, batraciens."}, {"id": "ch8_4-034", "t": "Usage", "q": "Avantages et usages des pyréthrines ?", "a": "Toxicité aiguë per os négligeable, pas d'effets cumulatifs, pas de résistance ; insecticide ménager (mouches, blattes, puces), vétérinaire (parasites externes des animaux)."}, {"id": "ch8_4-035", "t": "Définition", "q": "Propriétés physico-chimiques des pyréthrines et conséquence ?", "a": "Liquides huileux, non hydrosolubles, très instables (demi-vie ≈ 10 min à la lumière : hydrolyse des esters, photoisomérisation et oxydation des insaturations) → efficacité limitée dans le temps → pyréthrinoïdes de synthèse plus stables."}, {"id": "ch8_4-036", "t": "Usage", "q": "Que sont les pyréthrinoïdes ? Exemple pharmaceutique.", "a": "Analogues de synthèse plus stables des pyréthrines, utilisés en agriculture et en pharmacie : perméthrine (anti-poux)."}, {"id": "ch8_4-037", "t": "Méthode", "q": "Comment extrait-on les pyréthrines ?", "a": "Par solvants organiques (extraits à 25-50 %) ou CO2 supercritique (extraits très riches)."}, {"id": "ch8_4-038", "t": "Comparaison", "q": "Iridoïde vs sécoiridoïde : comment les distinguer sur une structure ?", "a": "Iridoïde : 2 cycles accolés (cyclopentane + dihydropyrane). Sécoiridoïde : uniquement le dihydropyrane (cyclopentane ouvert en 7-8), avec vinyle ou éthylidène en C9 et une chaîne en C5."}, {"id": "ch8_4-039", "t": "Classe", "q": "Les valépotriates sont-ils polaires comme la plupart des iridoïdes ?", "a": "Non : ce sont des iridoïdes non hétérosidiques, triesters lipophiles (extractibles par solvant organique peu polaire, non extraits par l'éthanol < 70 %)."}, {"id": "ch8_5-001", "t": "Définition", "q": "De quel précurseur dérivent les sesquiterpènes et comment est-il formé ?", "a": "Du **FPP** (farnésylpyrophosphate, C15), formé par couplage « tête à queue » d'un GPP (C10) et d'un IPP (C5)."}, {"id": "ch8_5-002", "t": "Définition", "q": "Définissez une lactone sesquiterpénique.", "a": "Sesquiterpène (C15) portant un cycle **lactonique** (ester cyclique) ; anciennement appelées « principes amers »."}, {"id": "ch8_5-003", "t": "Définition", "q": "Où trouve-t-on surtout les lactones sesquiterpéniques (famille et localisation) ?", "a": "Surtout chez les **Astéracées** ; dans les **poils sécréteurs** (feuilles, tiges, bractées de l'inflorescence) et les akènes ; rarement dans les organes souterrains."}, {"id": "ch8_5-004", "t": "Structure", "q": "Quel enchaînement structural est caractéristique et réactif dans la plupart des lactones sesquiterpéniques ?", "a": "L'**α-méthylène-γ-lactone** : lactone à 5 atomes portant un C=CH2 exocyclique en α du carbonyle."}, {"id": "ch8_5-005", "t": "Classe", "q": "Citez les 4 grands squelettes de lactones sesquiterpéniques et le nombre de C du cycle accolé à la lactone.", "a": "**Germacranolide** (10 C), **guaianolide** (7 C), **pseudoguaianolide** (7 C), **eudesmanolide** (6 C) — total toujours 15 C."}, {"id": "ch8_5-006", "t": "Définition", "q": "Que signifie le suffixe « -olide » ?", "a": "Il indique le **caractère lactonique** de la molécule."}, {"id": "ch8_5-007", "t": "Structure", "q": "Quelles tailles de cycle lactonique peut-on rencontrer et laquelle est la plus fréquente ?", "a": "**β-lactone** (4 atomes, rare), **γ-lactone** (5 atomes, la plus fréquente), **δ-lactone** (6 atomes)."}, {"id": "ch8_5-008", "t": "Définition", "q": "Dont dérivent tous les squelettes de lactones sesquiterpéniques ?", "a": "Du **germacranolide**, issu de la cyclisation du FPP en germacradiène puis oxydation et cyclisation lactonique."}, {"id": "ch8_5-009", "t": "Méthode", "q": "Comment extrait-on les lactones sesquiterpéniques ?", "a": "Pas de procédé spécifique : molécules liposolubles extraites au **CH2Cl2** puis fractionnement chromatographique ; entraînables à la vapeur d'eau si **PM < 300**."}, {"id": "ch8_5-010", "t": "Pourquoi ?", "q": "Pourquoi les lactones sesquiterpéniques sont-elles qualifiées de « fragiles » ?", "a": "Le cycle lactonique **s'ouvre en milieu alcalin** et se referme en milieu acide avec **modification de la stéréochimie** (artefacts)."}, {"id": "ch8_5-011", "t": "Méthode", "q": "Avec quel type de réactif détecte-t-on les lactones sesquiterpéniques ?", "a": "Réactifs **non spécifiques**, par ex. la **vanilline sulfurique**."}, {"id": "ch8_5-012", "t": "Pourquoi ?", "q": "Expliquez le mécanisme des activités biologiques (et toxiques) des α-méthylène-γ-lactones.", "a": "Le méthylène exocyclique est un accepteur de Michael : il réagit avec les nucléophiles biologiques (–SH, –NH2 des sites actifs d'enzymes et des protéines) → **alkylation irréversible** → activités biologiques, effets indésirables (allergie), toxicité."}, {"id": "ch8_5-013", "t": "Toxicité", "q": "Quel type d'allergie provoquent les lactones sesquiterpéniques et chez qui ?", "a": "**Dermatites de contact**, conjonctivites ; jardiniers, fleuristes, horticulteurs (artichaut, endive, chrysanthèmes, marguerites, camomille, arnica, aunée, laurier-sauce, Frullania)."}, {"id": "ch8_5-014", "t": "Pourquoi ?", "q": "Expliquez les allergies croisées entre plantes contenant des lactones sesquiterpéniques.", "a": "Le groupement **α-méthylène-γ-lactone** agit comme **haptène** (fixé aux protéines → allergène). Une fois sensibilisé, on réagit à toute plante contenant un sesquiterpène porteur du même fragment, même sans parenté botanique."}, {"id": "ch8_5-015", "t": "Origine", "q": "Quel est le principal constituant actif de la grande camomille et son type ?", "a": "Le **parthénolide**, lactone sesquiterpénique de type **germacranolide**."}, {"id": "ch8_5-016", "t": "Usage", "q": "Pour quelle indication l'EMA/HMPC recommande-t-elle la grande camomille ?", "a": "La **prophylaxie des migraines**."}, {"id": "ch8_5-017", "t": "Usage", "q": "Quels effets pharmacologiques ont été démontrés pour le parthénolide ?", "a": "Anti-inflammatoire (inhibe certaines **prostaglandines** et la **dégranulation des polynucléaires**), inhibe la **libération de sérotonine** et l'**agrégation plaquettaire**."}, {"id": "ch8_5-018", "t": "Origine", "q": "Nom latin de la grande camomille ?", "a": "*Tanacetum parthenium* L. (Astéracées)."}, {"id": "ch8_5-019", "t": "Origine", "q": "Quelle lactone sesquiterpénique est responsable de l'amertume des feuilles d'artichaut ? Type ?", "a": "La **cynaropicrine**, de type **guaianolide**."}, {"id": "ch8_5-020", "t": "Usage", "q": "Citez les activités des feuilles d'artichaut.", "a": "**Diurétique**, **cholagogue et cholérétique**, **hépatoprotecteur**, **hypocholestérolémiant** — activité due à l'ensemble des molécules (cynaropicrine, acides caféylquiniques, flavonoïdes)."}, {"id": "ch8_5-021", "t": "Structure", "q": "Matricine : type de squelette ?", "a": "**Guaianolide** (cyclopentane + cycloheptane accolés à une γ-lactone)."}, {"id": "ch8_5-022", "t": "Pourquoi ?", "q": "Que devient la matricine lors de l'hydrodistillation de la matricaire ?", "a": "Elle se décompose (perte d'acide acétique, d'eau et de CO2) en **chamazulène**, qui colore l'HE en **bleu**."}, {"id": "ch8_5-023", "t": "Comparaison", "q": "Bisabolol vs chamazulène dans l'HE de matricaire : lequel est présent dans la plante ?", "a": "Le **bisabolol** est présent dès le départ (plante et HE) ; le **chamazulène** est formé pendant la distillation à partir de la matricine."}, {"id": "ch8_5-024", "t": "Usage", "q": "Citez les propriétés de la matricaire.", "a": "**Antispasmodique** (troubles digestifs), **anti-inflammatoire** (interne et local : adoucissant, antiprurigineux), **antalgique** (cavité buccale)."}, {"id": "ch8_5-025", "t": "Origine", "q": "Hélénaline : plante source et type de squelette ?", "a": "Fleurs d'**arnica** (*Arnica montana*, Astéracées) ; **pseudoguaianolide**."}, {"id": "ch8_5-026", "t": "Structure", "q": "Quels sont les 2 sites très réactifs de l'hélénaline ?", "a": "L'**α-méthylène-γ-lactone** et l'enchaînement **ène-one** (cyclopenténone)."}, {"id": "ch8_5-027", "t": "Toxicité", "q": "Pourquoi l'arnica ne s'utilise-t-il qu'en usage externe et quelles précautions ?", "a": "L'hélénaline est **toxique per os** (douleurs abdominales, céphalées, palpitations, troubles respiratoires, mort à hautes doses). Ne pas appliquer sur plaies ouvertes, près des yeux ou de la bouche
