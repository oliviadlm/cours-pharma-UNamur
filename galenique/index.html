const CH = {};
CH.calc = (function () {
const r10 = x => Math.round(x * 1e10) / 1e10;
const ROM = [[100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
const roman = n => { let s = ""; for (const [v, r] of ROM) while (n >= v) { s += r; n -= v; } return s; };
const TRIT = [["1 ‰", 1, 1000], ["2 ‰", 2, 500], ["1 %", 10, 100], ["10 %", 100, 10]];
const EPA = [["sulfate d'atropine neutre", 0.14], ["homatropine HBr", 0.17], ["homatropine HBr", 0.19], ["lidocaïne HCl", 0.22], ["chlorhydrate d'hydromorphone", 0.22], ["phénobarbital sodique", 0.23], ["sulfadiazine sodique", 0.24], ["épinéphrine HCl", 0.26], ["sulfate de zinc", 0.15], ["iodure de potassium", 0.34], ["iodure de sodium", 0.38], ["thiomersal", 0.143]];
const FTAB = [["acide acétylsalicylique", 0.67], ["paracétamol", 0.72], ["codéine phosphate", 0.69], ["caféine", 0.67], ["ibuprofène", 0.90], ["diclofénac sodique", 0.64], ["bismuth sous-gallate", 0.37], ["oxyde de zinc", 0.16], ["lidocaïne HCl", 0.81], ["métoclopramide HCl", 0.74]];
const DATA = {
id: "calc", key: "mphab311-calc", sumKey: "mphab311-sum-calc", hubUrl: "index.html",
kicker: "MPHAB311 · Introduction à la galénique · Partim 2 (rappel MPHAB287)",
title: "Calculs · Préparations magistrales",
sub: "⚠️ Partie éliminatoire de l'examen : une seule erreur = échec pour tout le cours. Triturations · isotonie (3 méthodes) · suppositoires · alcoométrie · problèmes intégrés",

concepts: [
{ id: "rappel", title: "Rappels indispensables (MPHAB287)",
  html: `<div class="box trap" style="margin-top:0"><b>Règle de l'examen</b> : la question d'exercice <span class="k">doit se faire sans faute</span> ; <span class="k">une réponse incorrecte met en échec pour l'ensemble de la matière</span>. Au cours : « règles de 3, simples : <span class="k">sans machine à calculer</span> ».</div>
  <table><tr><th>Rappel</th><th>À savoir par cœur</th></tr>
  <tr><td>Masses</td><td><span class="k">1 g = 10 dg = 100 cg (ctg) = 1000 mg</span> ; <span class="k">1 mg = 1000 µg</span></td></tr>
  <tr><td>Cuillères</td><td><span class="k">C à s 15 mL · C à d 10 mL · C à c 5 mL</span></td></tr>
  <tr><td>Abréviations</td><td>Rp prenez · S\\ étiquette · <span class="k">pf pour faire</span> · <span class="k">dt donnez</span> · <span class="k">qs autant qu'il en faut</span> · <span class="k">ad jusqu'à</span></td></tr>
  <tr><td>%</td><td><span class="k">m/m g/100 g · m/V g/100 mL · V/V mL/100 mL</span> ; 1 % m/V = 10 mg/mL</td></tr>
  <tr><td>Densité</td><td><span class="k">m = V × d · V = m / d</span> ; éthanol 0,79 · méthanol 0,80 · <span class="k">PG 1,04</span> · isopropanol 0,79 · éther 0,71 · acétone 0,79 · huile de paraffine 0,86</td></tr>
  <tr><td>Chiffres romains</td><td>V 5 · X 10 · L 50 · C 100 ; IV 4, IX 9, XL 40, XC 90</td></tr></table>
  <p>Pour t'entraîner à fond sur ces bases : <a href="../mphab287/theorie-seance-1.html" target="_top">Séance 1</a> et <a href="../mphab287/theorie-seance-2.html" target="_top">Séance 2</a> de MPHAB287 (mêmes exercices que le syllabus de galénique).</p>`,
  why: [["Pourquoi s'entraîner sans calculatrice ?", "Le cours annonce des règles de 3 simples sans machine : il faut pouvoir poser chaque calcul à la main, avec les unités, et vérifier l'ordre de grandeur."]],
  talk: { prompt: "Récite les conversions, les cuillères, les abréviations et les densités du tableau.", check: ["g/cg/mg/µg", "15/10/5 mL", "pf, dt, qs, ad", "m/m, m/V, V/V", "m = V·d ; les 7 densités"] },
  traps: ["Oublier qu'une seule erreur de calcul = échec : toujours vérifier l'ordre de grandeur et les unités."] },

{ id: "trit", title: "Triturations",
  html: `<p>Quantité de PA <span class="k">trop petite pour être pesée avec précision</span> : on mélange un excès de PA à un diluant et on prélève la quantité de mélange qui contient la dose.</p>
  <p><b>Marche à suivre</b> : a) <span class="k">quantité totale de PA</span> (dose × nombre) ; b) <span class="k">quantité de trituration</span> qui la contient.</p>
  <table><tr><th>Trituration</th><th>Contient</th><th>Facteur</th></tr><tr><td>1 ‰ (« 10/00 », 1/1000)</td><td>1 mg / 1000 mg</td><td><span class="k">× 1000</span></td></tr><tr><td>2 ‰ (« 20/00 »)</td><td>2 mg / 1000 mg</td><td><span class="k">× 500</span></td></tr><tr><td>1 % (1/100)</td><td>1 g / 100 g</td><td><span class="k">× 100</span></td></tr><tr><td>10 %</td><td>10 g / 100 g</td><td><span class="k">× 10</span></td></tr></table>
  <p>Ex. cours : éthinylœstradiol 20 µg dt XX, trituration 1 ‰ → 0,4 mg de PA → <span class="k">400 mg</span>. Exercices supplémentaires : ergotamine 0,25 mg dt X, trituration 1/100 → 2,5 mg × 100 = <span class="k">250 mg</span>.</p>
  <p><b>Préparer la trituration</b> : 1 g de trituration à 10 % = <span class="k">100 mg de PA + 900 mg de diluant (lactose)</span>.</p>`,
  why: [["Pourquoi la quantité de trituration est-elle toujours plus grande que celle du PA ?", "La trituration ne contient qu'une fraction de PA (1 ‰, 1 %, 10 %) : pour apporter la même quantité de PA, il faut davantage de mélange."]],
  talk: { prompt: "Explique comment calculer la trituration de clobétasol à 10 % pour 25 mg de clobétasol, puis comment préparer 1 g de cette trituration.", check: ["25 mg × 10 = 250 mg de trituration", "1 g à 10 % = 100 mg de clobétasol + 900 mg de lactose"] },
  traps: ["Répondre la quantité de PA au lieu de la trituration.", "Confondre ‰ et %."] },

{ id: "iso", title: "Isotonie : les 3 méthodes de calcul",
  html: `<p><b>A. Abaissement cryoscopique</b> (% d'excipient) :</p>
  <div class="formula">% excipient (m/V) = (0,52 − Σ C%PA × ΔTPA) / ΔTexcipient</div>
  <p>C% = concentration (% m/V) du PA ; ΔT = abaissement d'une solution <span class="k">à 1 %</span> ; <span class="k">ΔT NaCl = 0,58</span>. Ex. NaI 10 cg + KI 10 cg ad 10 mL : chacun 1 % → (0,52 − 0,22 − 0,20)/0,58 = <span class="k">0,17 % = 17 mg/10 mL</span>.</p>
  <p><b>B. Équivalents en NaCl</b> : E = g de NaCl équivalant à <span class="k">1 g de PA</span>.</p>
  <div class="formula">NaCl à ajouter = 0,9 g/100 mL × V − Σ m(g) × E</div>
  <p>Ex. atropine sulfate 10 cg ad 10 mL (E 0,14) : 0,1 × 0,14 = 14 mg ; 90 mg − 14 mg = <span class="k">76 mg NaCl</span>. <b>Autre isotonisant</b> : <span class="k">diviser la masse de NaCl par l'E de l'isotonisant</span>. Ex. thiomersal 0,2 g/L, 200 mL, PG (E 0,42) : 40 mg × 0,143 = 0,006 g ; 1,8 − 0,006 = 1,794 g NaCl → <span class="k">1,794/0,42 = 4,271 g de PG</span>.</p>
  <p><b>C. White et Vincent</b> :</p>
  <div class="formula">V eau (mL) = Σ m(g) × E × 111,1   puis   V NaCl 0,9 % = V total − V eau</div>
  <p>Ex. atropine 10 cg ad 10 mL : 0,1 × 0,14 × 111,1 = <span class="k">1,56 mL d'eau</span> + <span class="k">8,44 mL de NaCl 0,9 %</span> (= 76 mg NaCl). Ex. 2 : KI 10 cg (0,34) + NaI 10 cg (0,38) + chlorbutol 5 cg (0,18) → 3,78 + 4,22 + 1,00 = <span class="k">9 mL d'eau + 1 mL de NaCl 0,9 %</span>.</p>
  <p><b>Piège</b> : si V eau &gt; V prescrit, la solution est <span class="k">hypertonique quoi qu'on fasse</span> → <span class="k">on contacte le médecin</span> (ex. atropine 900 mg ad 10 mL : V eau = 14 mL).</p>`,
  why: [["Pourquoi divise-t-on par l'E de l'isotonisant ?", "1 g de propylène glycol (E 0,42) ne vaut que 0,42 g de NaCl : pour remplacer x g de NaCl, il faut x / 0,42 g de PG."],
        ["Pourquoi les 3 méthodes donnent-elles le même résultat ?", "Elles traduisent toutes la même cible (pression osmotique du NaCl 0,9 %) : 76 mg de NaCl pour l'atropine, que l'on passe par E ou par White-Vincent."]],
  talk: { prompt: "Résous à voix haute : homatropine HBr 1 % (E 0,19), aqua qs 60 mL. NaCl à ajouter, puis volume de NaCl 0,9 %.", check: ["m = 0,6 g ; 0,6 × 0,19 = 0,114 g", "0,9 × 0,6 = 0,54 g de NaCl isotonique pour 60 mL", "0,54 − 0,114 = 0,426 g = 426 mg", "V eau = 0,6 × 0,19 × 111,1 = 12,67 mL → NaCl 0,9 % = 47,33 mL"] },
  traps: ["Oublier de convertir la masse du PA en grammes.", "Oublier de rapporter 0,9 % au volume total.", "Ne pas repérer une solution déjà hypertonique (téléphoner au médecin)."] },

{ id: "suppo", title: "Suppositoires",
  html: `<div class="formula">f = (E − M) / S    ·    M = E − Σ fi·Si   ·   × (n + 1)</div>
  <p>E : 1 suppo sans PA ; 2ᵉ coulée à <span class="k">10 % de PA</span> : M = 90 %, S = 10 % d'un suppositoire. Toujours <span class="k">S en g</span> et <span class="k">un suppositoire de plus en pratique</span>, y compris pour peser les PA.</p>
  <p>Syllabus : 8 suppos de 1 g à 100 mg d'aspirine (f 0,67) → 0,933 × 9 = <span class="k">8,397 g</span> ; 6 suppos de 2 g à 125 mg de paracétamol (f 0,72) → 1,91 × 7 = <span class="k">13,37 g</span> ; bismuth 200 mg (f 0,37) + ZnO 130 mg (f 0,16), suppos de 1 g dt 6 → bismuth <span class="k">1,4 g</span>, ZnO <span class="k">0,910 g</span>, base 0,9052 × 7 = <span class="k">6,3364 g</span>.</p>`,
  why: [["Pourquoi le piège « n » est-il si fréquent ?", "La réponse pour n suppositoires est souvent proposée dans le QCM : juste mathématiquement, fausse « en pratique »."]],
  talk: { prompt: "Calcule la base pour 6 suppos de 2 g à 125 mg de paracétamol (f = 0,72).", check: ["f·S = 0,72 × 0,125 = 0,09 g", "M = 2 − 0,09 = 1,91 g", "× 7 = 13,37 g"] },
  traps: ["Multiplier par n.", "Oublier de peser les PA aussi pour n + 1."] },

{ id: "alco", title: "Alcoométrie",
  html: `<p><b>Titre d'un alcool</b> : quantité d'alcool absolu dans 100 g ou 100 mL de mélange. <span class="k">Titre volumique (% V/V)</span> en <span class="k">degrés centésimaux</span> = mL d'alcool absolu pour 100 mL ; <span class="k">titre pondéral (% m/m)</span> = g pour 100 g. Les prescriptions utilisent généralement le <span class="k">titre volumique</span>.</p>
  <p>On prépare un alcool faible en diluant un <span class="k">« alcool fort »</span> avec de l'eau. Difficulté : <span class="k">l'eau et l'alcool se contractent en se mélangeant</span> (avec dégagement de chaleur) → <span class="k">on ne peut pas soustraire les volumes</span> ; on raisonne en <span class="k">masses</span> pour l'eau.</p>
  <div class="formula">V fort = V faible × T faible / T fort   ·   m eau = V faible·d faible − V fort·d fort</div>
  <p>Ex. 1 du syllabus : 80 mL d'alcool à 41° à partir d'alcool à 94,5° (d 0,8145 et 0,948) : V fort = 80 × 41/94,5 = <span class="k">34,71 mL</span> ; eau = 80 × 0,948 − 34,71 × 0,8145 = <span class="k">≈ 47,6 g (47,6 mL)</span>.</p>
  <div class="box trap">Les formules du syllabus sont des images que je n'ai pas pu lire ; la méthode ci-dessus est la méthode classique (conservation de l'alcool absolu + bilan de masse). Compare-la avec la correction donnée en séance.</div>`,
  why: [["Pourquoi ne peut-on pas faire 80 − 34,71 mL d'eau ?", "À cause de la contraction : 34,71 mL d'alcool + 45,29 mL d'eau donneraient moins de 80 mL. Les masses, elles, s'additionnent."]],
  talk: { prompt: "Explique comment préparer 80 mL d'alcool à 41° à partir d'alcool à 94,5°.", check: ["Conservation de l'alcool absolu : V fort = 80 × 41/94,5", "Contraction → raisonner en masses", "m eau = 80 × 0,948 − V fort × 0,8145"] },
  traps: ["Soustraire les volumes (contraction)."] },

{ id: "integre", title: "Problèmes intégrés (Gabbroral®, sirops)",
  html: `<p><b>« Pour aller plus loin »</b> du syllabus : Rp Gabbroral® 250 mg, pf suspension à 20 mg/mL, dt 140 mL, S\\ 1 c à c 4×/jour pendant 6 jours.</p>
  <ol><li>Quantité nécessaire : 4 × 5 mL × 6 j = <span class="k">120 mL ≤ 140 mL → suffisant</span>.</li>
  <li>Comprimés : 140 mL × 20 mg/mL = 2800 mg ; 2800/250 = 11,2 → <span class="k">12 comprimés</span>.</li>

eq: { c: "iso", method: "Isotonie : équivalents en NaCl", make() {

{ id: "w2", title: "Isotonie : équivalents NaCl + autre agent", gen: "eqother", make() {

{ id: "w3", title: "Isotonie : White et Vincent", gen: "wv", make() {
  const [nm, E] = pick([["homatropine HBr", 0.19], ["lidocaïne HCl", 0.22], ["phénobarbital sodique", 0.23]]); const c = pick([1, 2]); const V = pick([20, 50, 60]); const m = c * V / 100; const vw = m * E * 111.1;

    { label: "Masse de NaCl correspondante (mg)", ans: (V - vw) * 9, unit: "mg", tol: { rel: 0.01 }, show: `0,9 g/100 mL × ${fmt(V - vw, 2)} mL = ${fmt((V - vw) * 9, 1)} mg`, why: "Même résultat que la méthode des équivalents." }] };

{ id: "w4", title: "Alcoométrie complète", gen: "alco", make() {
  const V = pick([80, 100]); const Tt = 41, Tf = 94.5, dt = 0.948, df = 0.8145; const vf = V * Tt / Tf; const mt = V * dt, mf = vf * df;

{ id: "therap", title: "Classer selon le principe thérapeutique et la voie",

{ id: "pa", title: "Le principe actif",
  html: `<p>Préparer un médicament exige de connaître les propriétés physico-chimiques du PA, pour des raisons <span class="k">technologiques</span> et surtout <span class="k">biopharmaceutiques</span>.</p>
  <p><b>Propriétés importantes (11)</b> : <span class="k">caractères organoleptiques · taille des particules · forme des particules · forme cristalline · pKa · coefficient de partage · hygroscopicité · mouillabilité · solubilité · vitesse de dissolution · stabilité</span>.</p>

{ id: "excip", title: "L'excipient",
  html: `<p>Du latin <i>excipere</i> (recevoir) : l'excipient <span class="k">reçoit le PA et le transporte jusqu'au lieu d'absorption</span>. Synonymes : <span class="k">véhicule</span>, <span class="k">adjuvant</span> (<i>adjuvare</i>, aider) : il aide à la fabrication (<span class="k">adjuvant technologique</span>) et aide le PA à agir (<span class="k">adjuvant biopharmaceutique</span>). On parle de <span class="k">base</span> quand l'excipient est <span class="k">semi-solide</span>.</p>

  <p><b>Excipient ou PA ?</b> La frontière est relative : <span class="k">silice colloïdale</span> (excipient, mais PA anti-reflux), <span class="k">acide ascorbique</span>, <span class="k">hydroxyde d'aluminium</span> (PA des pansements gastriques, adjuvant des vaccins). L'équation « placebo = inerte » est abusive.</p>`,

concepts: [
{ id: "cristal", title: "Structure cristalline, polymorphisme, solvates",
  html: `<p>Un solide cristallin = arrangement ordonné de molécules ; l'unité structurelle est la <span class="k">maille cristalline</span>. Il existe <span class="k">7 systèmes</span> : triclinique, monoclinique, orthorhombique, tétragonal, hexagonal, rhomboédrique, cubique.</p>
  <p><b>Polymorphisme</b> : propriété d'une substance pure d'exister à l'état solide sous <span class="k">au moins deux structures cristallines</span>. Les polymorphes diffèrent par : densité, propriétés optiques, <span class="k">point de fusion</span>, diffraction X, spectre IR, <span class="k">solubilité, vitesse de dissolution</span>.</p>
  <p>À T et P données, <span class="k">une seule forme est stable</span> (notée <span class="k">I</span>) ; les autres (II, III…) sont <span class="k">métastables</span> et se transforment plus ou moins vite en forme stable. Les métastables ont en général un <span class="k">point de fusion plus bas</span> et une <span class="k">solubilité et vitesse de dissolution plus élevées</span>. Utilisables si la transformation est lente pendant la durée de vie du médicament ; sinon problèmes (croissance de cristaux, <i>caking</i>).</p>
  <p>Fréquent pour : <span class="k">corticoïdes, sulfamidés, barbituriques, indométhacine</span>. Exemple biopharmaceutique : <span class="k">palmitate de chloramphénicol</span> (taux sériques très variables selon la forme).</p>
  <p><b>Amorphe</b> = arrangement désordonné, souvent <span class="k">plus soluble</span> que le cristal. Fractions cristalline/amorphe mesurées par <span class="k">diffractométrie X</span>.</p>
  <p><b>Solvates / hydrates</b> (pseudopolymorphisme) : solvant emprisonné dans le cristal (hydrate si c'est l'eau). En général : <span class="k">la forme anhydre se dissout plus vite</span> (ampicilline anhydre &gt; trihydrate) ; les <span class="k">solvates non aqueux sont plus solubles</span> (acétate de fludrocortisone + n-amylique : 5×). La <span class="k">granulation humide</span> peut créer ou supprimer un hydrate (séchage).</p>`,
  why: [["Pourquoi le polymorphisme peut-il poser un problème de biodisponibilité ?", "Les formes cristallines ont des solubilités et vitesses de dissolution différentes : la quantité dissoute, donc absorbée, change (palmitate de chloramphénicol)."],
        ["Pourquoi peut-on parfois utiliser une forme métastable ?", "Elle est plus soluble ; si elle ne se transforme que très lentement en forme stable pendant la durée de vie du médicament, l'avantage est conservé sans risque."]],
  talk: { prompt: "Explique le polymorphisme, ses conséquences et l'exemple du palmitate de chloramphénicol.", check: ["≥ 2 structures cristallines pour une même substance", "Une seule stable (I), autres métastables (II, III…)", "Métastable : Tf plus bas, plus soluble, dissolution plus rapide", "Conséquence : biodisponibilité variable (palmitate de chloramphénicol)", "Amorphe souvent plus soluble ; hydrate : anhydre plus rapide"] },
  traps: ["Croire que la forme stable est la plus soluble (c'est l'inverse).", "Inverser : anhydre plus soluble que l'hydrate ; solvate non aqueux plus soluble que la forme non solvatée."] },

{ id: "taille", title: "Taille et forme des particules",
  html: `<p><b>Analyse granulométrique</b> : contrôle de la taille et de la distribution des tailles. Influence de la taille :</p>
  <ul><li><span class="k">Vitesse de dissolution</span> : les petites particules se dissolvent plus vite (<b>Noyes-Whitney</b> : dQ/dt = D·A/h × (Cs − C) ; ↓ taille → ↑ surface A).</li>
  <li><span class="k">Écoulement</span> : grosses particules sphériques s'écoulent mieux que petites irrégulières.</li>
  <li>Homogénéité et stabilité des mélanges ; efficacité des <span class="k">lubrifiants</span>.</li>
  <li>Dépôt pulmonaire : <span class="k">fraction respirable entre 1 et 6 µm</span>.</li>
  <li>Stabilité des suspensions/émulsions (<b>Stokes</b> : les grosses particules sédimentent plus vite).</li></ul>
  <p><b>Échelles</b> : <span class="k">10 µm – 1 mm</span> (poudres, granulés, pellets) ; <span class="k">région colloïdale 10 nm – 1 µm</span> (liposomes, nanosphères, émulsions parentérales).</p>
  <p><b>Diamètre équivalent</b> : diamètre de la sphère équivalente. En volume : V = π·d³/6 → 15 µm³ ⇒ <span class="k">dv = 3,06 µm</span>. En surface : S = π·d² → 46 µm² ⇒ <span class="k">ds = 3,83 µm</span>.</p>
  <p><b>Distribution</b> : tendance centrale = <span class="k">médiane</span> (50 % de part et d'autre), <span class="k">mode</span> (pic ; plusieurs pics = multimodale), <span class="k">moyenne</span> (pondérée). Dispersion : poudre <span class="k">monodispersée</span> (même taille) ou <span class="k">polydispersée</span> ; écart-type, quartiles (25 % et 75 %). Distribution souvent <span class="k">asymétrique</span> en pratique.</p>
  <p><b>Forme</b> : paramètres de la Pharmacopée européenne : <span class="k">diamètre de Feret, de Martin, de l'aire projetée</span>.</p>
  <p><b>Applications</b> : contrôle des matières premières, contrôle en cours de fabrication, avant/après broyage, produits finis, contamination particulaire des injectables, atmosphère des salles.</p>`,
  why: [["Pourquoi réduire la taille des particules accélère-t-il la dissolution ?", "Pour une même masse, des particules plus petites offrent une surface A plus grande ; dans Noyes-Whitney, la vitesse est proportionnelle à A."],
        ["Pourquoi la taille compte-t-elle pour un inhalateur ?", "Seules les particules d'environ 1 à 6 µm atteignent les voies respiratoires profondes ; trop grosses, elles se déposent dans la bouche et la gorge."]],
  talk: { prompt: "Cite 5 influences de la taille des particules en pharmacie et explique l'équation de Noyes-Whitney.", check: ["Dissolution (Noyes-Whitney : D, A, h, Cs − C)", "Écoulement", "Homogénéité des mélanges / lubrifiants", "Dépôt pulmonaire 1-6 µm", "Sédimentation (Stokes)"] },
  traps: ["Penser que les petites particules s'écoulent mieux (c'est l'inverse).", "Confondre médiane (50 %) et mode (pic)."] },

{ id: "poudre1", title: "Masse volumique et surface spécifique",
  html: `<p><b>Masse volumique</b> (g/cm³) : pour un solide, elle dépend aussi de l'arrangement moléculaire (structure cristalline, cristallinité) → deux solides chimiquement identiques peuvent différer.</p>
  <table><tr><th>Niveau</th><th>Ce qu'elle prend en compte</th></tr>
  <tr><td>Masse volumique <b>vraie</b> (cristalline)</td><td><span class="k">uniquement la fraction solide</span></td></tr>
  <tr><td>Masse volumique <b>particulaire</b></td><td>solide + <span class="k">pores intraparticulaires</span></td></tr>
  <tr><td>Masse volumique <b>vrac</b> (apparente, <i>bulk</i>)</td><td>+ <span class="k">espaces interparticulaires</span> ; mesurée dans une éprouvette graduée, éventuellement après tassement</td></tr></table>
  <p>Applications : excipients de remplissage (<span class="k">lactose</span>), <span class="k">remplissage des gélules</span> (carbonate calcique lourd vs léger), remplissage des mélangeurs.</p>
  <p><b>Surface spécifique</b> (m²/g) = surface totale des particules / masse sèche. Mesurée par <span class="k">adsorption physique d'un gaz</span> (couche monomoléculaire). Plus les grains sont fins, plus elle est grande. Pour des sphères de rayon r et masse volumique ρ :</p>
  <div class="formula">S spé = 3 / (ρ · r)</div>
  <p>Exemples : <span class="k">stéarate de magnésium</span> (lubrifiant) ; <span class="k">silice colloïdale anhydre (Aerosil® 200) ≈ 200 m²/g</span>, régulateur d'écoulement efficace à <span class="k">&lt; 1 %</span> (autres poudres ≈ 1 m²/g).</p>`,
  why: [["Pourquoi la silice colloïdale agit-elle à moins de 1 % ?", "Sa surface spécifique énorme (~200 m²/g) lui permet de recouvrir les autres particules et de réduire leurs frottements, même en très petite quantité."],
        ["Pourquoi la masse volumique vrac compte-t-elle pour remplir des gélules ?", "La gélule a un volume fixe : c'est la masse volumique vrac qui détermine quelle masse de poudre y entre (carbonate de calcium lourd vs léger)."]],
  talk: { prompt: "Explique les 3 masses volumiques et la surface spécifique, avec l'exemple de l'Aerosil®.", check: ["Vraie : fraction solide seule", "Particulaire : + pores intraparticulaires", "Vrac : + espaces interparticulaires", "Surface spécifique en m²/g, adsorption de gaz, S = 3/(ρ·r)", "Aerosil® 200 ≈ 200 m²/g, efficace < 1 %"] },
  traps: ["Inverser particulaire (pores intra) et vrac (espaces inter).", "Croire que des grosses particules ont une plus grande surface spécifique."] },

{ id: "ecoul", title: "Écoulement et compression",
  html: `<p><b>4 méthodes pour l'écoulement</b> : <span class="k">angle de repos</span> · <span class="k">taux de tassement</span> · <span class="k">vitesse d'écoulement à travers un orifice</span> · <span class="k">cellule de cisaillement</span> (complémentaires : l'idéal est d'en combiner plusieurs).</p>
  <p><b>Angle de repos</b> : angle du cône de poudre avec l'horizontale ; tan α = <span class="k">hauteur / rayon de la base</span>. Échelle de <b>Carr</b> :</p>
  <table><tr><th>Écoulement</th><th>Angle (°)</th></tr><tr><td>Excellent</td><td><span class="k">25-30</span></td></tr><tr><td>Bon</td><td><span class="k">31-35</span></td></tr><tr><td>Assez bon</td><td><span class="k">36-40</span></td></tr><tr><td>Passable</td><td><span class="k">41-45</span></td></tr><tr><td>Faible</td><td><span class="k">46-55</span></td></tr><tr><td>Très faible</td><td><span class="k">56-65</span></td></tr><tr><td>Extrêmement faible</td><td><span class="k">&gt; 66</span></td></tr></table>
  <div class="formula">Taux de tassement (%) = 100 × (V0 − VF) / V0</div>
  <p>V0 = volume vrac avant tassement, VF = après. Plus il est élevé, plus les interactions interparticulaires gênent l'écoulement.</p>
  <p>Vitesse à travers un orifice : seulement pour les poudres <span class="k">« free-flowing »</span> (masse ou volume écoulé en un temps donné). Cellule de cisaillement : partie inférieure fixe, partie supérieure mobile ; force pour cisailler la couche.</p>
  <p><b>Compression</b> : réarrangement particulaire (jusqu'au volume vrac minimum) → <span class="k">déformation élastique</span> → <span class="k">fragmentation</span> (matériaux cassants) ou <span class="k">déformation plastique</span> (permanente). Plastique et fragmentation forment le compact ; l'<span class="k">élasticité</span> cause <span class="k">clivage et laminage</span> (énergie relâchée après compression).</p>
  <p>Compromis du comprimé : <span class="k">résistance mécanique</span> suffisante mais <span class="k">porosité</span> pour laisser entrer les fluides digestifs : ↑ force de compression ⇒ ↓ porosité.</p>`,
  why: [["Pourquoi un matériau très élastique donne-t-il des comprimés qui se clivent ?", "Il stocke l'énergie pendant la compression et la relâche ensuite : le comprimé se fend (clivage, laminage)."],
        ["Pourquoi un fort taux de tassement signale-t-il un mauvais écoulement ?", "Si la poudre se tasse beaucoup, c'est que les particules s'accrochent entre elles et laissent des vides : les mêmes interactions freinent l'écoulement."]],
  talk: { prompt: "Décris les 4 méthodes d'évaluation de l'écoulement, l'échelle de Carr et la formule du taux de tassement.", check: ["Angle de repos (h / r)", "Taux de tassement = 100 (V0 − VF)/V0", "Orifice (free-flowing seulement)", "Cellule de cisaillement", "Carr : 25-30 excellent … > 66 extrêmement faible"] },
  traps: ["Diviser par VF au lieu de V0 dans le taux de tassement.", "Attribuer le clivage à la déformation plastique (c'est l'élasticité)."] },

{ id: "mouill", title: "Mouillage, dissolution et hygroscopicité",
  html: `<p><b>Mouillage</b> : étape qui précède la dissolution. Mesuré par l'<span class="k">angle de contact θ</span>. <b>Équation de Young</b> :</p>
  <div class="formula">γS/A = γS/L + γL/A · cos θ</div>
  <p><span class="k">Mouillage complet : θ = 0° (cos θ = 1)</span> ; θ varie de 0° à <span class="k">180° (mouillage insignifiant)</span>. Les PA hydrophobes (palmitate de chloramphénicol) se mouillent mal → on ajoute des <span class="k">tensio-actifs</span> qui diminuent γL/A et γS/L.</p>
  <p><b>Vitesse de dissolution</b> : dépend de l'état solide et de facteurs extrinsèques (hydrodynamique, température, viscosité, pH, pouvoir tampon, force ionique). <b>Noyes-Whitney</b> : dQ/dt = <span class="k">D·A/h × (Cs − C)</span> (D : coefficient de diffusion, A : surface, h : épaisseur de la couche de diffusion, Cs : concentration à saturation dans la couche, C : concentration dans le milieu).</p>
  <p><b>Hygroscopicité</b> : rétention d'eau (masse, adsorption, condensation capillaire, réaction, dissolution). <span class="k">Déliquescence</span> : le solide se dissout dans le film d'eau à sa surface. <span class="k">Efflorescence</span> : perte de l'eau de cristallisation sous une certaine humidité relative. Conséquences : hydrolyse, changement cristallin, écoulement, compression, lubrification, dissolution.</p>
  <p><b>Classes Ph. Eur.</b> (24 h, <span class="k">80 % HR, 25 °C</span>) :</p>
  <table><tr><th>Classe</th><th>Prise de masse</th></tr><tr><td>Non hygroscopique</td><td><span class="k">&lt; 0,2 %</span></td></tr><tr><td>Légèrement</td><td><span class="k">0,2 à 2 %</span></td></tr><tr><td>Hygroscopique</td><td><span class="k">2 à 15 %</span></td></tr><tr><td>Très hygroscopique</td><td><span class="k">&gt; 15 %</span></td></tr><tr><td>Déliquescent</td><td>formation d'un liquide</td></tr></table>`,
  why: [["Pourquoi un tensio-actif améliore-t-il le mouillage ?", "Il abaisse les tensions γL/A et γS/L ; d'après Young, cos θ augmente, donc l'angle de contact diminue."],
        ["Pourquoi la déliquescence et l'efflorescence sont-elles opposées ?", "L'une absorbe assez d'eau pour se dissoudre, l'autre perd son eau de cristallisation quand l'air est sec."]],
  talk: { prompt: "Explique l'équation de Young, les conditions de mouillage complet et les classes d'hygroscopicité.", check: ["γS/A = γS/L + γL/A cos θ", "θ = 0° : mouillage complet ; 180° : insignifiant", "Tensio-actifs ↓ γL/A et γS/L", "Conditions Ph. Eur. : 24 h, 80 % HR, 25 °C", "Seuils 0,2 / 2 / 15 %"] },
  traps: ["Dire que θ = 90° est un mouillage complet.", "Confondre déliquescence et efflorescence."] },

{ id: "operations", title: "Broyage, mélange, granulation, compression",
  html: `<p><b>Broyage</b> : fragmenter des unités solides en plus petites par des moyens mécaniques. Influence : dissolution, homogénéité, stabilité des dispersions, biodisponibilité. Propriétés influençant le broyage : <span class="k">dureté, ténacité (fibreux = difficile), point de fusion (chaleur produite), humidité, danger d'explosion (peroxyde de benzoyle)</span>. Officine : <span class="k">mortier et pilon</span>. Industrie : à couteaux, marteaux, billes, rouleaux, <span class="k">à jet de fluide (jet d'air)</span> = le plus utilisé pour <span class="k">microniser (&lt; 10 µm)</span>. Inconvénients : <span class="k">transformation polymorphique (cristallin → amorphe)</span>, poudre micronisée cohésive, peu dense, poussiéreuse ; agglomérats électrostatiques.</p>
  <p><b>Mélange</b> : association la plus homogène possible. Deux conditions préalables : <span class="k">expansion de la poudre (remplir au maximum aux 2/3)</span> et <span class="k">cisaillement tridimensionnel</span> (pas de zones mortes). Puis : mélanger assez longtemps et <span class="k">figer l'état aléatoire</span> (éviter la <span class="k">ségrégation</span>).</p>
  <p>Le <span class="k">mélange parfait n'existe pas</span> ; tolérance <span class="k">95-105 %</span> (dosage collectif sur 10 ou 20 comprimés) et <span class="k">85-115 %</span> (dosages individuels). <b>Mélange randomisé</b> : même probabilité partout ; loi binomiale :</p>
  <div class="formula">σR = √( P·(1 − P) / N )   ·   CV = σR / P</div>
  <p>N = 100 000, P = 0,5 → σ = 1,58·10⁻³, <span class="k">CV = 0,32 % (acceptable)</span> ; P = 0,001 → <span class="k">CV = 10 % (inacceptable)</span> → augmenter N (diminuer la taille des particules). <b>Mélange structuré</b> (<i>ordered mixing</i>) : fines particules adhérant aux grosses → limite la ségrégation.</p>
  <p><b>Règles pratiques en officine</b> : 1) réduire chaque substance en poudre séparément ; 2) même granulométrie ; 3) <span class="k">dilution progressive</span> : les constituants les plus faiblement dosés d'abord, par ordre croissant ; 4) constituant très faiblement dosé → <span class="k">trituration</span> (ex. à 1 %) ; 5) poudre qui colle au mortier → <span class="k">Aerosil® 200</span>.</p>
  <p><b>Granulation</b> : transformer une poudre en agglomérats (granulés) ; <span class="k">voie sèche (agrégation)</span> : compactage entre deux rouleaux puis concassage ; <span class="k">voie humide (agglutination)</span> ; dérivé : <span class="k">extrusion-sphéronisation</span> → pellets. Intérêt : <span class="k">figer l'homogénéité</span> et éviter la séparation des constituants dans les trémies.</p>
  <p><b>Compression</b> : agglomérer un volume constant de poudre ou de granulés dans des presses pharmaceutiques.</p>`,
  why: [["Pourquoi commence-t-on par les constituants les plus faiblement dosés ?", "En les diluant progressivement, on garantit leur répartition homogène ; ajoutés en dernier dans une grosse masse, ils resteraient mal dispersés."],
        ["Pourquoi le CV explose-t-il quand P est très petit ?", "Avec très peu de particules de PA par échantillon, le hasard pèse lourd : l'écart relatif au contenu moyen devient grand."]],
  talk: { prompt: "Explique comment réaliser un bon mélange de poudres à l'officine (conditions, règles pratiques, contrôle).", check: ["Expansion (2/3 max) et cisaillement 3D", "Temps suffisant puis éviter la ségrégation", "Broyer séparément, même granulométrie", "Dilution progressive, du plus faible au plus fort dosage", "Trituration si très faible dose ; Aerosil® si collage", "Tolérances 95-105 % / 85-115 %"] },
  traps: ["Remplir le mortier à ras bord.", "Croire que le mélange parfait est l'objectif réaliste."] }
],

{ t: "open", c: "cristal", q: "Qu'est-ce que le polymorphisme ? Quelles en sont les implications pharmaceutiques ?", a: "Propriété d'une substance pure d'exister à l'état solide sous au moins deux structures cristallines. Les polymorphes diffèrent par la densité, les propriétés optiques, le point de fusion, la diffraction X, l'IR, la solubilité et la vitesse de dissolution. Une seule forme est stable (I) à T et P données ; les métastables (II, III…) ont un Tf plus bas et sont plus solubles, et se transforment en forme stable (risque de croissance cristalline, caking). Implications : technologiques (écoulement, mélange, compression) et biopharmaceutiques (biodisponibilité, ex. palmitate de chloramphénicol). Fréquent : corticoïdes, sulfamidés, barbituriques, indométhacine.", keys: ["définition", "propriétés qui diffèrent", "stable I vs métastables", "métastable plus soluble, Tf plus bas", "palmitate de chloramphénicol", "conséquences technologiques et biopharmaceutiques"] },

{ id: "solub", title: "La solubilité : définitions et expressions",
  html: `<p>Quelle que soit la voie, un PA doit être <span class="k">dispersé (solubilisé) avant d'être absorbé</span> à travers les membranes. Beaucoup de PA sont formulés en <span class="k">solutions</span> (injectables, collyres) ou poudres à dissoudre. Un PA <span class="k">très peu soluble dans l'eau</span> pose des problèmes de <span class="k">formulation et/ou de biodisponibilité</span>.</p>
  <p><b>Solution</b> : système où les molécules de <span class="k">soluté</span> sont dispersées dans un <span class="k">solvant</span>. Au maximum de solubilité (à T et P données), la solution est <span class="k">saturée</span>. La solubilité influence la <span class="k">vitesse de dissolution</span> (Noyes-Whitney : dQ/dt = D·A/h × (Cs − C)).</p>
  <p><b>Expressions</b> : masse/volume (g/dm³ ou % m/V) · <span class="k">molarité</span> (mol de soluté par litre de solution) · termes de la Pharmacopée :</p>

  <tr><td>Peu soluble</td><td><span class="k">100 à 1000</span></td></tr><tr><td>Très peu soluble</td><td><span class="k">1000 à 10 000</span></td></tr>

  <p><b>Facteurs</b> : nature des forces dans la molécule et dans le solvant, et leur interaction. Solubilisation par <span class="k">ionisation</span> (NaCl dans l'eau) ou par <span class="k">polarité</span> (alcool dans l'eau). La polarité d'un solvant est liée à sa <span class="k">constante diélectrique ε</span> : ε élevée = <span class="k">solvant polaire</span> (eau, glycérol, propylène glycol) qui dissout les composés ioniques ; ε faible = <span class="k">apolaire</span> (benzène, huile) qui dissout les composés organiques.</p>`,

{ id: "augment", title: "Augmenter la solubilité : 7 moyens",
  html: `<ol><li><b>Co-solvants</b> : miscibles au solvant principal et bons solvants du PA : <span class="k">propylène glycol, glycérol, éthanol</span>. Ex. <span class="k">minoxidil</span> (PG, éthanol, isopropanol) ; <span class="k">diazépam injectable</span> (PG, éthanol).</li>
  <li><b>Augmenter la température</b> : la solubilité augmente en général (Pharmacopée : valeurs à <span class="k">20 °C</span>). Attention à la <span class="k">dégradation</span> ; exceptions : <span class="k">citrate de calcium, méthylcellulose</span>.</li>
  <li><b>Modifier le pH</b> : les acides et bases faibles sont <span class="k">plus solubles sous forme ionisée</span>. Henderson-Hasselbalch :<br>acides : <span class="k">pH = pKa + log [ionisée]/[non ionisée]</span> · bases : <span class="k">pH = pKa + log [non ionisée]/[ionisée]</span>.<br>Règle : <span class="k">acides faibles plus solubles à pH ≥ pKa + 2</span> ; <span class="k">bases faibles plus solubles à pH ≤ pKa − 2</span>.</li>
  <li><b>Solubilisation micellaire</b> : au-dessus de la <span class="k">concentration micellaire critique (CMC)</span>, les tensio-actifs forment des micelles dont le cœur lipophile dissout les PA hydrophobes = <span class="k">pseudosolubilisation</span>. Ex. solutions orales de vitamines liposolubles et d'huiles essentielles ; <span class="k">amphotéricine dans des liposomes</span>.</li>

  <li><b>Substances hydrotropes</b> (« salting in ») : grandes quantités de sels très solubles à gros ions : <span class="k">benzoate sodique → caféine</span> ; <span class="k">nicotinamide → riboflavine</span>.</li>

{ id: "stab", title: "La stabilité et les cinétiques de dégradation",
  html: `<p>Une dégradation entraîne perte d'activité, modifications physico-chimiques, parfois <span class="k">produits toxiques</span>. Ex. <span class="k">trétinoïne</span> : sensible à l'air, à la chaleur et à la lumière. Durée de validité : temps au terme duquel la teneur n'est plus que de <span class="k">95 % (voire 90 %)</span> de la concentration initiale.</p>
  <table><tr><th>Mécanisme</th><th>Exemples</th></tr>
  <tr><td>Hydrolyse</td><td>esters, amides, lactones, lactames : <span class="k">pénicilline</span></td></tr>
  <tr><td>Oxydation</td><td>phénols : <span class="k">morphine, adrénaline</span></td></tr>
  <tr><td>Isomérisation</td><td><span class="k">adrénaline</span> en solution ; cis-trans de la <span class="k">vitamine A</span></td></tr>
  <tr><td>Photodécomposition</td><td><span class="k">riboflavine, acide ascorbique</span></td></tr>
  <tr><td>Polymérisation</td><td><span class="k">aminopénicillines, trétinoïne</span></td></tr></table>
  <p><b>Cinétiques</b> : −d[D]/dt = k[D]ⁿ (n = ordre).</p>
  <p><b>Ordre 0</b> : vitesse <span class="k">constante, indépendante de la concentration</span> : <span class="k">[D]t = [D]0 − k0·t</span> (droite de pente −k0). Fréquent pour les substances <span class="k">à l'état solide ou en suspension</span>.</p>
  <p><b>Ordre 1</b> : vitesse <span class="k">proportionnelle à la quantité restante</span> : <span class="k">ln[D]t = ln[D]0 − k1·t</span> (ou log[D]t = log[D]0 − k1·t/2,303). Fréquent pour les <span class="k">substances en solution qui s'hydrolysent</span>.</p>
  <p><b>Température – équation d'Arrhenius</b> : <span class="k">log k = log A − Ea / (2,303·R·T)</span> (T en K). log k en fonction de 1/T donne une <span class="k">droite de pente −Ea/(2,303 R)</span> : on mesure k à températures élevées et on <span class="k">extrapole à 25 °C</span> (études de stabilité accélérée), en supposant que l'ordre ne change pas.</p>`,
  why: [["Pourquoi l'ordre 0 est-il typique des suspensions ?", "Seule la fraction dissoute se dégrade ; tant qu'il reste du solide pour la reconstituer, la concentration dissoute reste constante, donc la vitesse aussi."],
        ["Pourquoi chauffe-t-on pour étudier la stabilité ?", "La dégradation est plus rapide à haute température : on obtient k en peu de temps, puis Arrhenius permet d'extrapoler à 25 °C."]],
  talk: { prompt: "Compare les cinétiques d'ordre 0 et 1, et explique l'utilisation de l'équation d'Arrhenius.", check: ["Ordre 0 : vitesse constante, [D]t = [D]0 − k0 t, solides/suspensions", "Ordre 1 : vitesse ∝ concentration, ln[D]t = ln[D]0 − k1 t, solutions (hydrolyse)", "Arrhenius : log k = log A − Ea/(2,303 RT)", "Droite log k vs 1/T, extrapolation à 25 °C", "Validité : 95 % (90 %) de la teneur initiale"] },
  traps: ["Associer l'ordre 0 aux solutions (c'est l'ordre 1 qui y domine pour l'hydrolyse).", "Utiliser T en °C dans Arrhenius (il faut des kelvins)."] },

{ id: "osmo", title: "Propriétés osmotiques",
  html: `<p>Un soluté non volatil modifie, <span class="k">proportionnellement au nombre de particules</span>, la tension de vapeur, le <span class="k">point de congélation</span> et le point d'ébullition du solvant (propriétés colligatives). La plus importante en pharmacie : la <span class="k">pression osmotique</span>, liée à l'<span class="k">abaissement cryoscopique</span>.</p>
  <p><b>Osmose</b> : à travers une <span class="k">membrane semi-perméable</span>, l'eau migre de la solution <span class="k">la moins concentrée vers la plus concentrée</span>. <b>Pression osmotique</b> : pression minimale à exercer pour <span class="k">empêcher ce passage</span>. <b>van't Hoff (1886)</b> : <span class="k">P·V = n·R·T</span>.</p>
  <p><b>Osmolalité</b> : <span class="k">moles de soluté par kg de solvant</span> (≠ molarité : par litre de solution ; équivalentes pour l'eau en solution diluée). <b>Osmole</b> : 1 mol de glucose = <span class="k">1 osmole</span> ; 1 mol de NaCl = <span class="k">2 osmoles</span>. <b>Osmolarité</b> : <span class="k">Osm = α · n · C</span> (α : coefficient de dissociation 0 à 1 ; n : nombre de particules ; C : concentration molaire). En pratique : <span class="k">mOsm·kg⁻¹</span>.</p>
  <p><b>Globules rouges</b> : NaCl <span class="k">0,9 % = isotonique</span> (forme inchangée) · <span class="k">0,4 % = hypotonique</span> → l'eau entre : <span class="k">turgescence</span> · <span class="k">5 % = hypertonique</span> → l'eau sort : <span class="k">plasmolyse</span>.</p>`,
  why: [["Pourquoi 1 mol de NaCl compte-t-elle pour 2 osmoles ?", "Le NaCl se dissocie en Na⁺ et Cl⁻ : ce sont les particules, pas les molécules, qui comptent en osmose."]],
  talk: { prompt: "Explique l'osmose, la pression osmotique et ce qui arrive aux globules rouges dans du NaCl à 0,4 %, 0,9 % et 5 %.", check: ["Eau du moins concentré vers le plus concentré", "Pression osmotique = pression pour empêcher ce passage", "van't Hoff P·V = n·R·T", "0,9 % isotonique ; 0,4 % hypotonique → turgescence ; 5 % hypertonique → plasmolyse"] },
  traps: ["Inverser turgescence (hypotonique) et plasmolyse (hypertonique).", "Confondre osmolalité (par kg de solvant) et molarité (par L de solution)."] },

{ id: "isoto", title: "Isotonie et méthodes d'isotonisation",
  html: `<p>Doivent être <span class="k">isotoniques</span> (0,9 % NaCl) dans la mesure du possible : <span class="k">préparations injectables, collyres, instillations nasales, inhalations pulmonaires</span>. <span class="k">Iso-osmose</span> = état physique ; <span class="k">isotonie</span> = état clinique de cet équilibre.</p>
  <p><span class="k">Liquide lacrymal, plasma et NaCl 0,9 %</span> ont un <span class="k">ΔT = 0,52 °C</span> (congélation à −0,52 °C) : deux solutions de même ΔT sont <span class="k">iso-osmotiques</span>. ΔT &lt; 0,52 = <span class="k">hypotonique</span> ; ΔT &gt; 0,52 = <span class="k">hypertonique</span>.</p>
  <p><b>Tolérance oculaire</b> : un œil sain supporte <span class="k">0,7 à 1,6 % NaCl</span> ; il supporte <span class="k">mieux l'hypertonie que l'hypotonie</span> ; un œil malade est plus sensible.</p>
  <p><b>Agents isotonisants</b> : <span class="k">NaCl</span> si compatible · <span class="k">nitrate de sodium</span> avec les <span class="k">sels d'argent</span> · tampons (<span class="k">acide borique/borax</span> ; Na₂HPO₄/NaH₂PO₄), qui ajustent pH et osmolarité · <span class="k">glucose</span>, propylène glycol…</p>
  <p><b>3 méthodes de calcul</b> (détaillées dans la page Calculs) :</p>
  <ol><li><b>Abaissement cryoscopique</b> : <span class="k">% excipient (m/V) = (0,52 − Σ C%PA × ΔTPA) / ΔTexcipient</span> (ΔT d'une solution à 1 %).</li>
  <li><b>Équivalents en NaCl</b> : E = masse de NaCl qui produit la même pression osmotique que <span class="k">1 g de PA</span>. NaCl à ajouter = <span class="k">0,9 g/100 mL × V − Σ m·E</span> ; autre agent : diviser par son E.</li>
  <li><b>White et Vincent</b> : <span class="k">V eau (mL) = Σ m (g) × E × 111,1</span> (111,1 mL = volume qui rend 1 g de NaCl isotonique), puis compléter avec du <span class="k">NaCl 0,9 %</span>.</li></ol>`,
  why: [["Pourquoi utilise-t-on du nitrate de sodium avec les sels d'argent ?", "Le chlorure du NaCl précipiterait l'argent en AgCl insoluble."],
        ["D'où vient 111,1 mL ?", "1 g de NaCl à 0,9 % occupe 1 / 0,009 = 111,1 mL : c'est le volume d'eau qui rend 1 g de NaCl isotonique."]],
  talk: { prompt: "Explique pourquoi isotoniser, la valeur 0,52 °C, la tolérance de l'œil et le principe des 3 méthodes.", check: ["Injectables, collyres, nasal, inhalation", "ΔT = 0,52 °C = plasma, larmes, NaCl 0,9 %", "Œil : 0,7-1,6 %, tolère mieux l'hypertonie", "Cryoscopie : (0,52 − Σ C·ΔT)/ΔTex", "Équivalents NaCl : 0,9 % du volume − Σ m·E", "White-Vincent : V = Σ m·E·111,1 puis NaCl 0,9 %"] },
  traps: ["Dire que l'œil tolère mieux l'hypotonie.", "Utiliser du NaCl avec un sel d'argent."] }
],

gens: {
hh: { c: "augment", method: "Henderson-Hasselbalch", make() {
  const acid = Math.random() < .5; const pKa = pick([2, 3, 4, 5, 7, 8, 9]); const pH = pick([1, 2, 4, 6, 7, 8, 10].filter(x => Math.abs(x - pKa) <= 4 && x !== pKa));
  const d = pH - pKa; const ratio = acid ? d : -d; // log(ionisée/non ionisée)
  return { q: `${acid ? "Acide" : "Base"} faible de pKa ${pKa} dans une solution à pH ${pH}. log([ionisée]/[non ionisée]) = ?`, ans: ratio, unit: "", tol: { abs: 0.001 }, steps: [acid ? `Acide : pH = pKa + log [ionisée]/[non ionisée]` : `Base : pH = pKa + log [non ionisée]/[ionisée] → log [ionisée]/[non ionisée] = pKa − pH`, `= <b>${ratio}</b> → rapport ionisée/non ionisée = 10^${ratio}`, ratio >= 2 ? "Majoritairement ionisée : bonne solubilité." : ratio <= -2 ? "Majoritairement non ionisée : faible solubilité." : "Zone intermédiaire."] };
} },
ordre0: { c: "stab", method: "Cinétique d'ordre 0", make() {
  const C0 = pick([100, 200, 250, 500]); const k = pick([0.5, 1, 2, 2.5, 5]); const pct = pick([90, 95]); const t = r10(C0 * (1 - pct / 100) / k);
  return { q: `Suspension : concentration initiale ${C0} mg/mL, dégradation d'ordre 0 avec k0 = ${fmt(k)} mg/mL par mois. Temps (mois) pour atteindre ${pct} % de la teneur initiale ?`, ans: t, unit: "mois", tol: { rel: 0.01 }, steps: [`[D]t = [D]0 − k0·t → t = ([D]0 − [D]t) / k0`, `([D]0 − [D]t) = ${100 - pct} % de ${C0} = ${fmt(C0 * (100 - pct) / 100)} mg/mL`, `t = ${fmt(C0 * (100 - pct) / 100)} / ${fmt(k)} = <b>${fmt(t, 3)} mois</b>`] };
} },
ordre1: { c: "stab", method: "Cinétique d'ordre 1", make() {
  const k = pick([0.001, 0.002, 0.005, 0.01, 0.02]); const pct = pick([90, 95]); const t = r10(Math.log(100 / pct) / k);
  return { q: `Solution : dégradation d'ordre 1, k1 = ${fmt(k)} par jour. Temps (jours) pour que la teneur tombe à ${pct} % ?`, ans: t, unit: "jours", tol: { rel: 0.01 }, steps: [`ln[D]t = ln[D]0 − k1·t → t = ln([D]0/[D]t) / k1`, `ln(100/${pct}) = ${fmt(Math.log(100 / pct), 4)}`, `t = ${fmt(Math.log(100 / pct), 4)} / ${fmt(k)} = <b>${fmt(t, 1)} jours</b>`] };
} },
cryo: { c: "isoto", method: "Isotonie : abaissement cryoscopique", make() {
  const pa = pick([["lidocaïne HCl", 0.13], ["NaI", 0.22], ["KI", 0.2], ["éphédrine HCl", 0.165], ["procaïne HCl", 0.122]]); const c = pick([0.5, 1, 2]); const V = pick([10, 20, 50, 100, 250]);
  const pct = (0.52 - c * pa[1]) / 0.58; const g = r10(pct * V / 100);
  return { q: `Solution de ${pa[0]} à ${fmt(c)} % (m/V), ${V} mL (ΔT 1 % ${pa[0]} = ${fmt(pa[1])} ; ΔT NaCl = 0,58). Masse de NaCl (g) pour isotoniser ?`, ans: g, unit: "g", tol: { rel: 0.01 }, steps: [`% NaCl = (0,52 − ${fmt(c)} × ${fmt(pa[1])}) / 0,58 = ${fmt(pct, 4)} %`, `${fmt(pct, 4)} g/100 mL × ${V} mL = <b>${fmt(g, 4)} g</b>`] };
} },
osmol: { c: "osmo", method: "Osmolarité Osm = α·n·C", make() {
  const s = pick([["glucose", 1, 1], ["NaCl", 2, 1], ["CaCl₂", 3, 1], ["NaCl", 2, 0.9]]); const C = pick([0.1, 0.15, 0.3, 0.5]); const ans = r10(s[2] * s[1] * C * 1000);
  return { q: `Solution ${fmt(C)} M de ${s[0]} (α = ${fmt(s[2])}). Osmolarité en mOsm/L ?`, ans, unit: "mOsm/L", tol: { rel: 0.01 }, steps: [`n = ${s[1]} particule${s[1] > 1 ? "s" : ""} par molécule`, `Osm = α·n·C = ${fmt(s[2])} × ${s[1]} × ${fmt(C)} = ${fmt(ans / 1000)} Osm/L = <b>${fmt(ans)} mOsm/L</b>`] };
} }
},
worked: [
{ id: "w1", title: "Isotonie par la méthode cryoscopique", gen: "cryo", make() {
  const a = pick([["NaI", 0.22], ["KI", 0.2]]); const b = a[0] === "NaI" ? ["KI", 0.2] : ["NaI", 0.22]; const m = pick([5, 10, 20]); const V = pick([10, 20]);
  const ca = m / V, cb = ca; const num = 0.52 - (ca * a[1] + cb * b[1]); const pct = num / 0.58; const mg = pct * V / 100 * 1000;

concepts: [
{ id: "emuls", title: "Émulsions : définition, types, usages",
  html: `<p><b>Système dispersé</b> : système <span class="k">hétérogène</span> où une phase est dispersée dans une autre. Émulsions et suspensions sont des <span class="k">dispersions colloïdales</span>.</p>
  <p><b>Émulsion</b> : <span class="k">2 liquides non miscibles</span>, l'un dispersé en fines gouttelettes dans l'autre, stabilisé par un <span class="k">émulsifiant</span> (tensio-actif, solide finement divisé, ou polymère naturel/synthétique). Exemples : <span class="k">lait</span> (naturelle), <span class="k">mayonnaise</span> (jaune d'œuf = émulsifiant).</p>
  <p>Gouttelettes = <span class="k">phase dispersée (interne)</span> ; liquide qui les entoure = <span class="k">phase continue (externe)</span>. Types : <span class="k">H/E</span> (huile dans eau) et <span class="k">E/H</span> (eau dans huile) ; <span class="k">multiples</span> (H/E/H) : libération prolongée en SC/IM (<span class="k">vaccins</span>).</p>
  <p><b>Usages</b> : voie orale (émulsions laxatives à <span class="k">paraffine liquide, huile de ricin</span> ; ↑ biodisponibilité : <span class="k">griséofulvine</span>) ; voie IV (émulsions H/E de <span class="k">nutrition parentérale, gouttelettes &lt; 5 µm</span> ; véhicule de PA : <span class="k">taxol, diazépam</span>) ; usage externe (crèmes, laits).</p>
  <p><b>Théorie</b> : la dispersion augmente énormément la surface de contact ΔS, donc l'énergie libre <span class="k">E = γHE · ΔS</span> : le système est <span class="k">thermodynamiquement instable</span>. Les gouttelettes deviennent <span class="k">sphériques</span> (surface minimale) puis <span class="k">fusionnent (coalescence)</span> → retour à 2 phases, sauf si on ajoute un <b>émulsif</b>, qui sert à <span class="k">faciliter la dispersion</span> à la fabrication et à <span class="k">contrôler la stabilité</span> pendant la durée de validité.</p>
  <p>On ajoute aussi des <span class="k">conservateurs</span> (acide sorbique, benzoate sodique) et des <span class="k">antioxydants</span> (<span class="k">BHT dans la phase huileuse</span>, <span class="k">sulfites dans la phase aqueuse</span>).</p>`,

  traps: ["Confondre phase interne (dispersée) et externe (continue).", "Oublier que BHT = phase huileuse, sulfites = phase aqueuse."] },

{ id: "hlb", title: "Les émulsifs et la HLB",
  html: `<p>Les <b>tensio-actifs</b> (les plus utilisés) sont <span class="k">amphiphiles</span> et se concentrent à l'interface. Pour une émulsion <span class="k">H/E</span>, le tensio-actif doit être <span class="k">un peu plus hydrophile</span> ; pour une <span class="k">E/H</span>, <span class="k">un peu plus lipophile</span> (également hydrophile et lipophile = inutile). Les viscosifiants (gomme arabique) aident aussi.</p>
  <table><tr><th>Classe</th><th>Exemples</th></tr>
  <tr><td>Anioniques</td><td>carboxylates (savons), <span class="k">laurylsulfate de sodium</span> (shampooing), sulfonates (docusate sodique)</td></tr>
  <tr><td>Cationiques</td><td><span class="k">chlorure de benzalkonium</span>, bromure de cétrimide (peu utilisés comme émulsifs)</td></tr>
  <tr><td>Amphotères</td><td><span class="k">lécithine (IV)</span></td></tr>
  <tr><td>Non ioniques (<span class="k">les plus importants</span>)</td><td>esters de sorbitane (<span class="k">Span</span>), polysorbates (<span class="k">Tween</span>), éthers d'alcools gras polyoxyéthylénés (<span class="k">cétomacrogol 1000</span>)…</td></tr></table>
  <p><b>HLB</b> (Hydrophile-Lipophile Balance) : échelle semi-empirique de <span class="k">1 à 40</span>. <span class="k">7 = pivot</span> (même affinité pour l'eau et l'huile). <span class="k">HLB &lt; 7 : plus lipophile</span> ; <span class="k">&gt; 7 : plus hydrophile</span>.</p>
  <table><tr><th>HLB</th><th>Usage</th></tr>
  <tr><td><span class="k">1,5-3</span></td><td>anti-mousses</td></tr><tr><td><span class="k">4-7 (3-6)</span></td><td>émulsionnants <b>E/H</b></td></tr>
  <tr><td><span class="k">7-9</span></td><td>agents mouillants</td></tr><tr><td><span class="k">8-18</span></td><td>émulsionnants <b>H/E</b></td></tr>
  <tr><td><span class="k">13-15</span></td><td>détergents</td></tr><tr><td><span class="k">15-18</span></td><td>solubilisation micellaire</td></tr></table>
  <div class="formula">HLB (non ionique) = 20 × PM partie hydrophile / PM total</div>
  <p>Ex. <span class="k">Tween 20</span> : PM 1226 ; hydrophile = sorbitane 164 + PEG 880 = 1044 → HLB = 1044/1226 × 20 = <span class="k">17</span>. Ioniques : HLB parfois &gt; 20.</p>
  <p><b>HLB critique (optimale, requise)</b> de l'émulsion : HLB où sa stabilité est maximale ; on choisit de préférence <span class="k">2 tensio-actifs (1 lipophile + 1 hydrophile)</span> dont le mélange atteint cette HLB :</p>
  <div class="formula">HLB mélange = xA · HLB A + xB · HLB B   (xA + xB = 1)</div>`,
  why: [["Pourquoi combiner deux tensio-actifs ?", "En dosant un lipophile et un hydrophile, on règle précisément la HLB du mélange sur la HLB critique de l'émulsion."]],

  traps: ["Choisir un tensio-actif de HLB 5 pour une émulsion H/E.", "Oublier le facteur 20 dans la formule."] },

{ id: "instab", title: "Instabilités des émulsions et loi de Stokes",
  html: `<table><tr><th>Phénomène</th><th>Description</th></tr>
  <tr><td><b>Crémage</b></td><td>migration des gouttelettes <span class="k">vers le haut</span>, fréquent en <span class="k">H/E</span> (en E/H : sédimentation)</td></tr>
  <tr><td><b>Floculation</b></td><td>réunion des gouttelettes en <span class="k">agrégats</span>, sans forcément compromettre l'émulsion</td></tr>
  <tr><td><b>Coalescence</b></td><td><span class="k">fusion des gouttelettes</span> : processus majeur de la cassure</td></tr>
  <tr><td><b>Cassure</b></td><td>séparation <span class="k">irréversible</span> : il faut réémulsionner</td></tr>
  <tr><td><b>Inversion de phase</b></td><td>H/E devient E/H (ou l'inverse)</td></tr></table>
  <p><b>Loi de Stokes</b> : v = 2·r²·g·(ρp − ρl) / (9·η). Pour ralentir : <span class="k">microniser les gouttelettes (↓ r)</span>, <span class="k">augmenter la viscosité</span> de la phase externe, <span class="k">diminuer la différence de densité</span>.</p>`,
  why: [["Pourquoi la floculation est-elle moins grave que la coalescence ?", "Dans les flocs, les gouttelettes restent individuelles : une agitation les redisperse. La coalescence les fusionne de façon irréversible."]],
  talk: { prompt: "Classe les instabilités des émulsions de la moins grave à la plus grave, et donne les 3 leviers de la loi de Stokes.", check: ["Crémage/sédimentation, floculation (réversibles)", "Coalescence → cassure (irréversible)", "Inversion de phase", "↓ taille, ↑ viscosité, ↓ différence de densité"] },
  traps: ["Dire que le crémage est irréversible.", "Confondre floculation et coalescence."] },

{ id: "susp", title: "Les suspensions",
  html: `<p><b>Suspension</b> : dispersion colloïdale d'un <span class="k">solide finement divisé</span> dans une phase externe aqueuse ou huileuse, liquide ou semi-solide. Différences avec les émulsions : phase interne <span class="k">toujours solide</span> ; état de division <span class="k">acquis avant la préparation</span> ; taille <span class="k">constante</span> (pas de coalescence, mais croissance possible).</p>
  <p><b>Voies</b> : orale, rectale, parentérale <span class="k">sauf intraveineuse !</span>, pulmonaire, peau, nez, œil, oreille.</p>
  <p><b>Quand choisir une suspension ?</b> PA <span class="k">trop peu soluble</span> (volume de solution trop grand) ; échec des méthodes de solubilisation ; PA <span class="k">instable en solution ou de mauvais goût</span> (<span class="k">palmitate de chloramphénicol</span> au lieu du chloramphénicol très amer) ; <span class="k">action prolongée</span>.</p>
  <p><b>Problèmes de formulation</b> : <span class="k">mouillage</span> · <span class="k">sédimentation</span> (Stokes) · <span class="k">remise en suspension</span> · <span class="k">floculation</span> · <span class="k">croissance des particules</span>.</p>
  <p><b>Mouillage</b> : angle de contact (Young) ; PA hydrophobe → tensio-actif <span class="k">mouillant</span> (polysorbate 20 ou 80).</p>
  <p><b>Sédimentation</b> : acceptable si le sédiment se <span class="k">remet rapidement en suspension homogène</span> par agitation modérée, assez longtemps pour prélever une dose exacte (antibiotiques pédiatriques). Viscosifiants de préférence <span class="k">thixotropes</span>.</p>
  <p><b>Floculation</b> : les particules s'agglutinent pour réduire E = γSL · ΔS. Un <span class="k">mouillant à &lt; 1 %</span> (par rapport au solide) diminue γSL. <span class="k">En excès (&gt; 1 %)</span> → <span class="k">« caking »</span> : suspension <span class="k">défloculée</span>, sédiment <span class="k">dense et compact, difficile à redisperser</span>. On recherche une <span class="k">floculation contrôlée</span> : agrégats lacunaires, sédiment volumineux <span class="k">facile à redisperser</span>.</p>
  <p><b>Croissance des particules</b> : 1) <span class="k">Ostwald ripening</span> (grosses particules croissent aux dépens des petites) ; 2) <span class="k">variations de température</span> au stockage (&gt; 20 °C d'écart) ; 3) <span class="k">transformation polymorphique</span>.</p>`,
  why: [["Pourquoi une suspension ne peut-elle pas être injectée en IV ?", "Les particules solides pourraient obstruer les capillaires (embolie) : la voie IV exige des solutions (ou émulsions à très fines gouttelettes)."],
        ["Pourquoi recherche-t-on une floculation contrôlée plutôt qu'une défloculation ?", "Un sédiment floculé est lâche et volumineux, facile à remettre en suspension ; un sédiment défloculé est compact (caking) et ne se redisperse presque pas."]],
  talk: { prompt: "Explique les 5 problèmes de formulation d'une suspension et la notion de floculation contrôlée.", check: ["Mouillage (angle de contact, polysorbates)", "Sédimentation (Stokes, viscosifiants thixotropes)", "Remise en suspension", "Floculation contrôlée vs défloculation/caking (mouillant > 1 %)", "Croissance : Ostwald, température, polymorphisme"] },
  traps: ["Dire qu'on peut injecter une suspension en IV.", "Croire qu'ajouter beaucoup de mouillant améliore toujours la suspension (caking)."] }
],

{ id: "suppo", title: "Préparations rectales et suppositoires",
  html: `<p><b>Préparations rectales</b> : <span class="k">suppositoires</span>, capsules rectales, solutions et suspensions rectales, poudres et comprimés, préparations semi-solides, mousses rectales, tampons rectaux.</p>
  <p><b>Suppositoires</b> : préparations <span class="k">unidoses</span> de forme, volume et consistance adaptés au rectum ; PA <span class="k">dispersés ou dissous</span> dans un excipient (= <span class="k">base</span>) <span class="k">soluble ou dispersible dans l'eau, ou fondant à la température du corps</span>.</p>

  <p><b>Bases lipidiques</b> : selon le PA (liposoluble, hydrosoluble, insoluble), on obtient une <span class="k">solution, une émulsion ou une suspension</span>. Exigences : <span class="k">point de fusion 36-37 °C</span> et <span class="k">viscosité suffisante</span> pour éviter la sédimentation à la coulée.</p>

{ id: "facteur", title: "Le facteur de déplacement",
  html: `<p>L'incorporation du PA <span class="k">déplace une certaine quantité de masse</span> : il faut calculer le <b>facteur de déplacement f</b>, via <span class="k">3 coulées</span>.</p>
  <div class="formula">f = (E − M) / S    ·    M = E − Σ (fi · Si)</div>
  <p><b>E</b> = g d'excipient dans 1 suppositoire <span class="k">sans PA</span> (1<sup>re</sup> coulée) · <b>M</b> = g de masse dans 1 suppositoire <span class="k">avec PA</span> (2<sup>e</sup> coulée) · <b>S</b> = g de PA par suppositoire.</p>
  <ol><li><span class="k">Étalonner le moule</span> → E</li><li>Utiliser <span class="k">arbitrairement 10 % de PA</span> → M (90 %) et S (10 %)</li><li><span class="k">Calculer f</span></li><li>Calculer la masse d'excipient, en prévoyant <span class="k">1 suppositoire supplémentaire</span></li></ol>
  <p><b>Exemple du cours</b> (suppositoires de 2 g) : 10 suppos de masse = 20 g → <span class="k">E = 2 g</span> ; 10 suppos à 10 % = 20,5 g → 2,05 g → M = 2,05 × 0,9 ; S = 2,05 × 0,1 → <span class="k">f = (2 − 1,845) / 0,205 = 0,75</span>.</p>
  <p>10 suppositoires à 500 mg d'acide acétylsalicylique (f = 0,75) : M = 2 − 0,75 × 0,5 = <span class="k">1,625 g</span> → ×10 = <span class="k">16,25 g (théorique)</span> ; ×11 = <span class="k">17,88 g (pratique)</span>.</p>
  <p>Barbital 100 mg (f 0,79) + codéine 50 mg (f 0,67), 10 suppos adultes, 10 suppos de masse = 29,75 g → E = 2,975 ; M = 2,975 − (0,079 + 0,0335) = <span class="k">2,8625 g</span> → ×10 ≈ 28,6 g ; ×11 ≈ <span class="k">31,5 g en pratique</span> (le cours arrondit M à 2,86 → 31,46 g).</p>
  <p><b>Table d'indices de déplacement</b> (Webcampus) : ex. <span class="k">paracétamol 0,72</span>, <span class="k">acide acétylsalicylique 0,67</span>, <span class="k">ibuprofène 0,90</span>, <span class="k">oxyde de zinc 0,16</span>, <span class="k">bismuth sous-gallate 0,37</span>, codéine phosphate 0,69, caféine 0,67.</p>`,
  why: [["Pourquoi un f de 0,16 pour l'oxyde de zinc ?", "L'oxyde de zinc est très dense : 1 g occupe peu de volume et ne déplace que 0,16 g de base."]],
  talk: { prompt: "Explique les 3 coulées et calcule f pour 10 suppos purs = 20 g et 10 suppos à 10 % = 20,5 g.", check: ["E = 20/10 = 2 g", "1 suppo à 10 % = 2,05 g", "M = 1,845 g ; S = 0,205 g", "f = (2 − 1,845)/0,205 = 0,75", "Masse à peser : n + 1 suppositoires"] },
  traps: ["Oublier le suppositoire supplémentaire.", "Laisser S en mg dans f × S."] }
],

  const E0 = pick([1, 2, 2.975]); const f0 = pick([0.6, 0.67, 0.72, 0.75, 0.81, 0.9]); const n1 = pick([10, 8]); const n2 = pick([10, 12]);

  return { ctx: `${n1} suppositoires de masse pure pèsent ${fmt(t1)} g.\n${n2} suppositoires à 10 % de PA pèsent ${fmt(t2)} g.`, q: "Facteur de déplacement f (2 décimales) ?", ans: Math.round(f * 100) / 100, unit: "", tol: { abs: 0.02 }, steps: [`E = ${fmt(t1)}/${n1} = ${fmt(E, 4)} g`, `1 suppo à 10 % = ${fmt(t2)}/${n2} = ${fmt(W, 4)} g → M = ${fmt(M, 4)} ; S = ${fmt(S, 4)}`, `f = (${fmt(E, 4)} − ${fmt(M, 4)}) / ${fmt(S, 4)} = <b>${fmt(f, 2)}</b>`] };
} },
base: { c: "facteur", method: "Masse de base M = E − Σ f·S (n + 1)", make() {

} }

function buildPlan(start) {

  const plan = {}; const add = (d, t) => { if (d < 0 || d >= total) return; (plan[d] = plan[d] || []).push(t); };
  ORDER.forEach((id, i) => { const d0 = i * step; add(d0, ["new", id]); [1, 3, 7, 14, 30].forEach(g => add(d0 + g, ["rev", id])); });

}

const METHODS_HTML = `
<div class="card"><h2>Pourquoi cette page est construite ainsi</h2>
<p class="small" style="margin-top:0">Chaque outil de cette page applique une méthode dont l'efficacité a été mesurée dans des études contrôlées en psychologie cognitive et en sciences de l'éducation. La grande revue de Dunlosky et al. (2013) a évalué 10 techniques d'étude : <b>se tester</b> (pratique de récupération) et <b>espacer les révisions</b> obtiennent la note d'utilité la plus élevée ; l'<b>entrelacement</b>, l'<b>interrogation élaborative</b> et l'<b>auto-explication</b> une note moyenne ; <b>relire, surligner et résumer</b> une note faible.</p>
<div class="box trap" style="margin-bottom:0"><b>À éviter :</b> relire le PDF plusieurs fois ou surligner. On a l'impression de savoir parce que le texte est familier, mais on ne s'entraîne pas à le retrouver seule, ce que l'examen exige.</div></div>

<div class="card"><h2>Les méthodes, et où elles sont dans la page</h2>
<div class="method"><b>1. Se tester plutôt que relire (pratique de récupération)</b><br><span class="small">Flashcards, Quiz, Séance du jour. Dans l'étude de Roediger &amp; Karpicke (2006), les étudiants qui s'étaient testés retenaient nettement plus une semaine plus tard que ceux qui avaient relu. Réponds toujours <b>avant</b> de voir la réponse, même si tu n'es pas sûre.</span></div>
<div class="method"><b>2. Espacer les séances</b><br><span class="small">Plan J+1, J+3, J+7, J+14, J+30 et boîtes des flashcards. Cepeda et al. (2008, plus de 1 350 participants) montrent que l'intervalle optimal entre deux révisions augmente avec le délai jusqu'à l'examen. Mieux vaut 15 minutes réparties sur 5 jours que 75 minutes la veille.</span></div>
<div class="method"><b>3. Réapprendre jusqu'au critère, sur plusieurs séances (réapprentissage successif)</b><br><span class="small">Dans les sessions, une question ratée revient jusqu'à ce que tu la réussisses ; puis elle revient les jours suivants. Rawson &amp; Dunlosky recommandent de réussir chaque élément au moins une fois par séance, sur environ 3 séances espacées : c'est ce qui rend le souvenir durable.</span></div>
<div class="method"><b>4. Mélanger les types de problèmes (entrelacement)</b><br><span class="small">Onglet Mélange et Séance du jour. En maths, des élèves ayant mélangé les types d'exercices ont nettement mieux réussi un test surprise un mois plus tard (61 % contre 38 % dans un essai sur 787 élèves de Rohrer et al.). Le gain vient surtout du fait qu'il faut <b>choisir la méthode</b> : c'est pour cela que l'onglet Mélange te demande d'abord « quelle méthode ? ». C'est plus difficile sur le moment, et c'est normal.</span></div>
<div class="method"><b>5. Exemples résolus puis aide qui s'estompe</b><br><span class="small">Onglet Exemples guidés. Au début d'un apprentissage, étudier un exemple résolu est plus efficace que de chercher seule (Sweller ; Renkl). Ensuite, on retire les étapes en commençant par la fin (« estompage arrière », Renkl &amp; Atkinson), jusqu'à résoudre seule. Le niveau s'adapte à tes réussites.</span></div>
<div class="method"><b>6. Se demander « pourquoi ? » et s'expliquer les étapes</b><br><span class="small">Encadrés « Pourquoi ? » de la Leçon active et boutons « pourquoi ? » des exemples. Relier chaque règle à sa raison (interrogation élaborative, auto-explication) aide à comprendre et à transférer à des problèmes nouveaux.</span></div>
<div class="method"><b>7. Expliquer à voix haute, sans regarder</b><br><span class="small">Encadrés « Explique à voix haute ». C'est une forme de rappel libre et d'auto-explication. La liste à cocher te montre ce que tu as oublié.</span></div>
<div class="method"><b>8. Se tester avant d'apprendre (pré-test)</b><br><span class="small">Bouton Pré-test. Essayer de répondre avant d'avoir étudié, même en se trompant, améliore la mémorisation de ce qu'on apprend ensuite (Richland, Kornell &amp; Kao, 2009 ; Kornell, Hays &amp; Bjork, 2009).</span></div>
<div class="method"><b>9. Noter sa certitude et corriger les erreurs « sûres »</b><br><span class="small">Boutons Sûre / Hésitante / Au hasard et tableau de calibration. Les erreurs commises avec une forte confiance sont paradoxalement les mieux corrigées après le feedback (effet d'hypercorrection, Butterfield &amp; Metcalfe, 2001). Comparer ta confiance à tes résultats t'apprend aussi à savoir ce que tu sais vraiment.</span></div>
<div class="method"><b>10. Rendre les bases automatiques (sprints)</b><br><span class="small">Onglet Sprint. Quand les conversions, abréviations et densités sont instantanées, ta mémoire de travail reste disponible pour le raisonnement. On vise d'abord la précision, ensuite la vitesse. Honnêtement : cette idée est surtout étudiée pour le calcul de base chez les enfants, et une étude n'a pas trouvé d'avantage de rétention au simple entraînement chronométré par rapport à la même quantité de pratique. Utilise donc les sprints en complément, pas à la place des autres méthodes.</span></div>
<div class="method"><b>11. Une méthode de calcul stable, avec les unités</b><br><span class="small">Dans les corrections, chaque étape garde son unité (mg, g, mL). En formation infirmière, apprendre à poser les calculs de doses avec les unités (analyse dimensionnelle) a amélioré la précision par rapport au calcul classique. Écris toujours l'unité à chaque ligne et vérifie l'ordre de grandeur.</span></div>
</div>

<div class="card"><h2>Spécial galénique : ce qui change pour ce cours</h2>
<div class="method"><b>Questions ouvertes : rédiger, pas reconnaître</b><br><span class="small">L'examen comporte des questions ouvertes. Reconnaître la bonne réponse dans un QCM ne prouve pas qu'on sait la produire. Les « Questions d'examen » te font rédiger (ou dire) ta réponse, puis la comparer point par point à la réponse attendue : c'est du rappel libre, la forme de test la plus exigeante et la plus proche de l'examen.</span></div>
<div class="method"><b>Partie calculs éliminatoire : viser le sur-apprentissage</b><br><span class="small">Une seule erreur de calcul fait échouer tout le cours. Pour cette partie, « réussir une fois » ne suffit pas : continue à t'entraîner après avoir réussi (problèmes mélangés chaque jour, sans calculatrice), et vérifie systématiquement unités et ordre de grandeur. L'entraînement prolongé au-delà de la première réussite ralentit l'oubli à court terme ; l'espacer garde l'effet sur la durée.</span></div>
<div class="method"><b>Mélanger les chapitres</b><br><span class="small">La « Séance mélangée » et l'« Examen blanc » de la page générale tirent des questions de tous les chapitres : c'est l'entrelacement appliqué au cours entier, comme le jour de l'examen.</span></div></div>

<div class="card"><h2>Mode d'emploi conseillé</h2><ol class="steps">

<li><b>Chaque jour</b> : 5 problèmes de calcul mélangés (partie éliminatoire) et, si tu as le temps, un sprint de 60 s.</li>
<li><b>Notions « En cours »</b> : rouvre-les dans la Leçon (mode « Masquer l'essentiel »), refais leur test.</li>
<li><b>Les 10 derniers jours</b> : examens blancs et séances mélangées depuis la page générale ; plus de grosse relecture la veille, dors.</li>
<li><b>Livres</b> (Le Hir, Aulton) : utilise-les pour approfondir une notion ratée, pas pour tout relire.</li></ol></div>

  let s = (Math.round(n * 10 ** d) / 10 ** d).toFixed(d).replace(/0+$/, "").replace(/\.$/, "");

/* ---------- répétition espacée (Leitner) ---------- */
function cardState(id) { return S.cards[id] || { box: 0, due: null, seen: 0, lapses: 0 }; }
function gradeCard(id, g) { // g: 0 raté, 1 difficile, 2 bien, 3 facile
  const st = cardState(id); st.seen++;
  if (g === 0) { st.box = 0; st.lapses++; }
  else if (g === 1) st.box = Math.max(1, st.box);
  else if (g === 2) st.box = Math.min(INTERVALS.length - 1, st.box + 1);
  else st.box = Math.min(INTERVALS.length - 1, st.box + 2);
  st.due = addDays(today(), g === 0 ? 0 : INTERVALS[st.box]);
  S.cards[id] = st; save();
}
function dueCards() { const t = today(); return CARDS.filter(c => { const s = S.cards[c.id]; return !s || !s.due || s.due <= t; }); }
function logItem(id, ok) { (S.items[id] = S.items[id] || []).push(ok ? 1 : 0); if (S.items[id].length > 12) S.items[id].shift(); save(); }
function logGen(id, ok) { (S.gens[id] = S.gens[id] || []).push(ok ? 1 : 0); if (S.gens[id].length > 15) S.gens[id].shift(); save(); }
function logConf(c, ok) { if (!c) return; S.conf[c][1]++; if (ok) S.conf[c][0]++; save(); }

/* ---------- maîtrise par notion ---------- */
function mastery(cid) {
  const parts = [];
  const cs = CARDS.filter(c => c.c === cid);
  if (cs.length) parts.push(cs.reduce((a, c) => a + Math.min(cardState(c.id).box, 4) / 4, 0) / cs.length);
  const qs = ITEMS.filter(q => q.c === cid);
  if (qs.length) parts.push(qs.reduce((a, q) => { const r = S.items[q.id] || []; const last = r.slice(-3); return a + (last.length ? last.reduce((x, y) => x + y, 0) / 3 : 0); }, 0) / qs.length);
  const gs = Object.entries(GENS).filter(([k, g]) => g.c === cid);
  if (gs.length) parts.push(gs.reduce((a, [k]) => { const r = (S.gens[k] || []).slice(-5); return a + (r.length ? r.reduce((x, y) => x + y, 0) / 5 : 0); }, 0) / gs.length);
  return parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : 0;
}
