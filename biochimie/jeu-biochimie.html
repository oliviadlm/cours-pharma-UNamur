c0w","t":"Pourquoi un anti-H2 diminue-t-il l'acidité gastrique ?","e":"L'histamine des cellules ECL renforce l'effet de la gastrine sur les cellules pariétales via les récepteurs H2. Les bloquer réduit la production d'HCl.","mc":"histamine (cellules ECL) · récepteurs H2 · cellules pariétales · renforce la gastrine · HCl ↓"},{"id":"ch2c-s2c0","t":"Sécrétine","e":"Cellules S du duodénum et du jéjunum, stimulées par le chyme acide. Elle fait sécréter par les canaux pancréatiques un suc riche en bicarbonate → neutralise l'acidité qui arrive de l'estomac (le duodénum est moins protégé par le mucus). Elle stimule aussi la sécrétion biliaire et inhibe la fonction gastrique.","mc":"S · bicarbonate · neutralise"},{"id":"ch2c-s2c1","t":"Cholécystokinine (CCK)","e":"Cellules I du duodénum et du jéjunum, stimulées par les lipides et les AA. Double effet : ↑ des enzymes pancréatiques et contraction de la vésicule biliaire (libération de la bile). Elle ralentit la vidange gastrique. Point du prof : la vésicule biliaire ne sécrète rien, elle stocke et concentre la bile fabriquée par le foie.","mc":"I · enzymes pancréatiques · contraction de la vésicule biliaire · ne sécrète rien"},{"id":"ch2c-s3c0","t":"Deux stratégies médicamenteuses","e":"1) Analogues du GLP-1 résistants à la DPP-4 (injectables) : exénatide (le premier), puis liraglutide, sémaglutide (OZEMPIC®) ; le tirzépatide (MOUNJARO®, agoniste GLP-1 + GIP) est encore plus efficace. Diabète de type 2, surtout avec obésité (perte de poids). 2) Inhibiteurs de la DPP-4 = gliptines (oral) : ils augmentent le GLP-1 endogène, mais sont moins efficaces.","mc":"Analogues du GLP-1 · sémaglutide (OZEMPIC®) · MOUNJARO® · Inhibiteurs de la DPP-4 · gliptines"},{"id":"ch2c-s3c0w","t":"Pourquoi les incrétino-mimétiques donnent-ils rarement des hypoglycémies, contrairement aux sulfonylurées ?","e":"Leur effet insulinotrope n'apparaît qu'à glycémie normale ou élevée : ils potentialisent l'effet du glucose. Les sulfonylurées ferment le canal K⁺-ATP même sans glucose.","mc":"effet insulinotrope glucose-dépendant · peu d'hypoglycémie · sulfonylurées: canal K⁺-ATP fermé même sans glucose"},{"id":"ch2c-s4c0","t":"L'hormone du tissu adipeux","e":"Une adipokine (cytokine des adipocytes, gène ob), première hormone identifiée dans le tissu adipeux. Elle informe l'hypothalamus de la quantité de TG stockés : elle freine le neuropeptide Y (qui donne faim) → satiété et dépense énergétique ↑ (thermogenèse). Des mutations du gène de la leptine ou de son récepteur donnent des obésités génétiques (résistance à la leptine). Les mimétiques de la leptine ont peu d'intérêt : contrairement au GLP-1, pas d'effet endocrine sur l'insuline.","mc":"adipokine · hypothalamus · neuropeptide Y · satiété"},{"id":"ch2d-s0c0","t":"Le sodium règle la pression","e":"Na⁺ = cation extracellulaire principal (natrémie 140 mmol/L). L'eau le suit : un manque de Na⁺ fait partir l'eau du plasma → hypovolémie, hypotension ; un excès retient l'eau → hypertension. Facilement absorbé et excrété par le rein, très régulé.","mc":"extracellulaire · 140 mmol/L · hypotension"},{"id":"ch2d-s0c1","t":"Le potassium règle les membranes","e":"K⁺ = cation intracellulaire (> 90 % dans les cellules, ~150 mmol/L ; kaliémie ~4 mmol/L). Il maintient le potentiel de membrane (muscle, nerf, cœur) : une dyskaliémie donne un risque d'arythmie majeur. Il agit peu sur la pression. Excrétion surtout rénale (aldostérone) ; l'insuline le fait entrer dans les cellules.","mc":"K⁺ intracellulaire (> 90 %) · ~150 mmol/L dans les cellules · kaliémie ~4 mmol/L · potentiel de membrane · arythmie · aldostérone · insuline"},{"id":"ch2d-s1c0","t":"La seule hormone hypotensive","e":"Peptide de 28 AA avec un pont disulfure, sécrété par les myocytes des oreillettes quand elles sont distendues (trop de volume). Récepteur à activité guanylate cyclase (GMPc) sur rein et vaisseaux. Rein : moins de réabsorption de Na⁺ → natriurèse (l'eau suit). Vaisseaux : vasodilatation. Elle freine aussi rénine, aldostérone et ADH. Pas utilisable par voie orale (peptide).","mc":"28 AA · oreillettes · guanylate cyclase · natriurèse · vasodilatation"},{"id":"ch2d-s1c0w","t":"Une oreillette trop dilatée libère de l'ANP : que fait-elle au rein et aux vaisseaux ?","e":"Trop de volume = il faut éliminer de l'eau → on empêche la réabsorption du Na⁺ (natriurèse, l'eau suit) et on dilate les vaisseaux. Pression ↓. « Réfléchissez, ne retenez pas par cœur. »","mc":"trop de volume · natriurèse · l'eau suit · vasodilatation · pression ↓"},{"id":"ch2d-s2c0","t":"Effets de l'angiotensine II","e":"1) Vasoconstriction artériolaire puissante (10-40 fois l'adrénaline), rapide. 2) Stimule la synthèse d'aldostérone (rétention de Na⁺). 3) Stimule l'ADH et la soif. Résultat : volume et pression ↑. Un excès chronique favorise l'hypertrophie cardiaque.","mc":"Vasoconstriction · aldostérone · ADH"},{"id":"ch2d-s2c1","t":"Ce qui déclenche la rénine","e":"Tout ce qui signale une hypovolémie : baisse de pression dans l'artériole afférente (barorécepteurs), moins de NaCl à la macula densa, stimulation sympathique (récepteurs β1, l'adrénaline agit en synergie). Inhibée par l'ANP et l'angiotensine II (rétrocontrôle).","mc":"hypovolémie · barorécepteurs (artériole afférente) · NaCl ↓ à la macula densa · sympathique β1 | Freins: ANP · angiotensine II"},{"id":"ch2d-s2c2","t":"Trois cibles thérapeutiques","e":"Inhibiteurs de la rénine (aliskiren) ; IECA (inhibiteurs de l'enzyme de conversion : captopril, énalapril…) ; antagonistes AT1 (sartans : losartan…). Utilisés dans l'hypertension et l'insuffisance cardiaque.","mc":"Inhibiteurs de la rénine · IECA · antagonistes AT1"},{"id":"ch2d-s3c0","t":"Mécanisme","e":"Hormone stéroïde lipophile → récepteur intracellulaire → gènes. Cible : cellules du tube contourné distal (et collecteur). Elle active et fait synthétiser des canaux Na⁺ (luminaux) et la Na⁺/K⁺-ATPase (basolatérale) : Na⁺ réabsorbé (l'eau suit), K⁺ et H⁺ excrétés. C'est la seule hormone qui règle la kaliémie à ce point.","mc":"récepteur intracellulaire · tube contourné distal · canaux Na⁺ · Na⁺/K⁺-ATPase · K⁺ et H⁺ excrétés"},{"id":"ch2d-s3c1","t":"Stimuli","e":"1) Angiotensine II (le plus puissant : pression ou volémie basse). 2) Hyperkaliémie (très dangereuse). 3) Hyponatrémie. L'ACTH n'a qu'un effet mineur.","mc":"angiotensine II (le plus puissant) · hyperkaliémie · hyponatrémie · ACTH (mineur)"},{"id":"ch2d-s3c2","t":"Conn, réglisse, insuffisance surrénale","e":"Syndrome de Conn (hyperaldostéronisme primaire, adénome) : rétention de Na⁺ et d'eau, HTA, hypokaliémie (signe d'orientation). La glycyrrhizine de la réglisse imite l'aldostérone : même tableau. Insuffisance corticosurrénale (Addison) : le plus dangereux en aigu est le manque d'aldostérone → fuite d'eau et de Na⁺, hyperkaliémie.","mc":"Syndrome de Conn · HTA · hypokaliémie · glycyrrhizine · Insuffisance corticosurrénale"},{"id":"ch2d-s3c2w","t":"Qu'est-ce qu'un diurétique d'épargne potassique ?","e":"Les diurétiques classiques font perdre du K⁺ (risque d'hypokaliémie). Un antagoniste de l'aldostérone (spironolactone) bloque la réabsorption de Na⁺ et la sécrétion de K⁺ au tubule distal : diurèse sans perte de K⁺.","mc":"diurétiques classiques: perte de K⁺ · spironolactone · antagoniste de l'aldostérone · tubule distal · diurèse sans perte de K⁺"},{"id":"ch2d-s4c0","t":"Biosynthèse et récepteurs","e":"Peptide cyclique de 9 AA, produit par les noyaux supraoptique et paraventriculaire de l'hypothalamus, libéré par la post-hypophyse. V2 (tube collecteur, Gs → AMPc) : insertion d'aquaporines → réabsorption d'eau (urine concentrée). V1 (muscle lisse vasculaire, Gq → Ca²⁺) : vasoconstriction, à plus forte dose (d'où « vasopressine »).","mc":"supraoptique et paraventriculaire · post-hypophyse · V2 · aquaporines · V1"},{"id":"ch2d-s4c1","t":"Régulation","e":"Stimulée par une osmolalité ↑ (osmorécepteurs hypothalamiques), une baisse de volume ou de pression, l'angiotensine II. Inhibée par l'ANP et… l'alcool.","mc":"osmolalité ↑ · ANP · alcool"},{"id":"ch2d-s4c1w","t":"Pourquoi a-t-on soif et mal à la tête le lendemain d'une fête ?","e":"L'alcool inhibe la sécrétion d'ADH : moins d'aquaporines, on urine beaucoup plus (diurèse) et on se déshydrate. La « gueule de bois » est en grande partie cette perte d'eau à compenser.","mc":"alcool inhibe l'ADH · moins d'aquaporines · diurèse · déshydratation · gueule de bois"},{"id":"ch2d-s4c2","t":"Diabète insipide","e":"Manque d'ADH (central, hypothalamo-hypophysaire) ou de récepteurs V2 (néphrogénique) → polyurie massive (jusqu'à 20 L/jour) d'urine diluée et soif. Le central se traite par la desmopressine (MINIRIN®), aussi utilisée dans l'énurésie nocturne.","mc":"central · néphrogénique · polyurie · desmopressine"},{"id":"ch2d-s5c0","t":"Parathormone (PTH)","e":"Glandes parathyroïdes ; 115 AA (pré-pro-hormone) → PTH active de 84 AA ; hydrophile, RCPG Gs (AMPc). Stimulée par une calcémie ionisée basse. Os : ses récepteurs sont sur les ostéoblastes, qui libèrent des cytokines (IL-1) activant les ostéoclastes → résorption osseuse → Ca²⁺ et phosphate libérés. Rein : réabsorption de Ca²⁺ ↑, excrétion de phosphate ↑, activation de la 1α-hydroxylase (calcitriol).","mc":"parathyroïdes · 84 AA · calcémie ionisée basse · Os · ostéoblastes · ostéoclastes · Rein"},{"id":"ch2d-s5c0w","t":"Pourquoi la PTH, qui augmente la calcémie, agit-elle sur les ostéoblastes et pas directement sur les ostéoclastes ?","e":"Les ostéoclastes n'ont pas de récepteur à la PTH : ce sont les ostéoblastes qui reçoivent le signal et envoient des cytokines (IL-1) pour activer les ostéoclastes, qui dégradent l'os (collagénases).","mc":"ostéoclastes sans récepteur à la PTH · ostéoblastes · IL-1 · activation des ostéoclastes · résorption osseuse"},{"id":"ch2d-s5c1","t":"Calcitriol","e":"Hormone stéroïde, récepteur intracellulaire (intestin, os, rein). Intestin : induit les calbindines → absorption de Ca²⁺ et phosphate ↑ (effet principal). Os : minéralisation (ostéoblastes). Rein : réabsorption ↑. Carence : rachitisme (enfant), ostéomalacie (adulte, ostéoïde non minéralisé) → Ca²⁺ ↓ → PTH ↑ → dégradation osseuse. Ne pas confondre avec l'ostéoporose (perte de masse osseuse globale).","mc":"Intestin · calbindines · Os · Rein · rachitisme · ostéomalacie"},{"id":"ch2d-s5c2","t":"Calcitonine","e":"Peptide de 32 AA (pont disulfure 1-7), cellules C parafolliculaires de la thyroïde, sécrétée lors d'une hypercalcémie. Antagoniste de la PTH : excrétion rénale de Ca²⁺ et phosphate ↑, incorporation osseuse ↑, ostéoclastes inhibés. Médicament : calcitonine de saumon (maladie de Paget, hypercalcémie grave).","mc":"32 AA · C parafolliculaires · thyroïde · hypercalcémie"},{"id":"ch2d-s5c3","t":"Pourquoi la vitamine D compte tant en officine","e":"« Il n'y a pas une personne qui rentre dans une pharmacie qui n'aura pas besoin de vitamine D si elle fait sa prise de sang. » Complément alimentaire, traitement (tétanie, insuffisance osseuse, carences des pays peu ensoleillés, personnes âgées, enfants) et dosage biologique.","mc":"vitamine D en officine · complément alimentaire · tétanie · insuffisance osseuse · personnes âgées · enfants · dosage biologique"},{"id":"ch2e-s0c0","t":"Biosynthèse et sécrétion","e":"Polypeptide de 191 AA (2 ponts disulfures), sécrété par l'antéhypophyse de façon pulsatile : pics nocturnes après l'endormissement, repas, stress, effort ; 10-20 bouffées par jour à la puberté, puis baisse avec l'âge. Elle agit directement (contrairement aux autres stimulines).","mc":"191 AA · antéhypophyse · pulsatile"},{"id":"ch2e-s0c1","t":"Effets directs et indirects","e":"Directs (métabolisme) : lipolyse ↑ (il faut de l'ATP), hyperglycémie (effet anti-insuline), synthèse protéique ↑. Indirects : le foie (et l'os) produit les somatomédines = IGF-1 et IGF-2 → croissance des os (cartilage de conjugaison) et des tissus, via des récepteurs tyrosine kinase proches de celui de l'insuline.","mc":"Directs · Indirects · foie · somatomédines = IGF-1 et IGF-2"},{"id":"ch2e-s0c2","t":"Régulation","e":"Stimulée par la GHRH (somatolibérine, hypothalamus), elle-même stimulée par l'hypoglycémie prolongée, le sommeil, l'effort, le stress. Inhibée par la somatostatine (SRIF, 14 ou 28 AA) et par les IGF (rétrocontrôle).","mc":"GHRH · hypoglycémie · somatostatine"},{"id":"ch2e-s0c2w","t":"Pourquoi une hypoglycémie prolongée stimule-t-elle la GH ?","e":"La GH a des effets directs anti-insuline : lipolyse et épargne du glucose. Elle aide donc à remonter la glycémie et à fournir de l'énergie à partir des graisses.","mc":"GH anti-insuline · lipolyse · épargne du glucose · remonte la glycémie"},{"id":"ch2e-s0c3","t":"Pathologies et dopage","e":"Adénome hypophysaire → GH ↑ : gigantisme chez l'enfant (cartilages non soudés, croissance harmonieuse), acromégalie chez l'adulte (extrémités, visage). Déficit congénital → nanisme → GH recombinante (autrefois extraite d'hypophyses humaines : risque de Creutzfeldt-Jakob). Détournée pour le dopage.","mc":"gigantisme · acromégalie · nanisme"},{"id":"ch2e-s1c0","t":"Hormones thyroïdiennes et androgènes dans la croissance","e":"Les hormones thyroïdiennes stimulent la production de GH et sont indispensables au développement du SNC (crétinisme ; dépistage néonatal). La testostérone stimule muscles, pilosité, croissance osseuse et soudure des cartilages à la puberté.","mc":"Thyroïde: GH ↑ · développement du SNC · crétinisme · dépistage néonatal | Testostérone: muscles · pilosité · croissance osseuse · soudure des cartilages"},{"id":"ch2e-s1c1","t":"Érythropoïétine (EPO)","e":"Glycoprotéine (isoformes selon la glycosylation), produite par le foie chez le fœtus et par le rein chez l'adulte en réponse à l'hypoxie (altitude). Elle stimule les érythroblastes de la moelle → réticulocytes et GR ↑. EPO recombinante (époétines) dans l'anémie de l'insuffisance rénale chronique ; dopage (hématocrite > 50 % → sang visqueux, thromboses, HTA). « Je ne vous demande pas de retenir les noms » des EPO de synthèse.","mc":"foie chez le fœtus · rein chez l'adulte · hypoxie"},{"id":"ch2e-s1c1w","t":"Pourquoi un insuffisant rénal chronique est-il anémique ?","e":"Le rein ne produit plus assez d'EPO : la moelle fabrique moins de globules rouges (anémie hypoplasique). On le traite par EPO recombinante.","mc":"rein · EPO ↓ · moins de GR · anémie · EPO recombinante"},{"id":"ch2e-s1c2","t":"Thrombopoïétine (TPO)","e":"Glycoprotéine du foie et du rein (155 premiers AA communs avec l'EPO), stimule les mégacaryocytes → plaquettes. pour information analogues : romiplostim (protéine de fusion), eltrombopag (oral) dans les thrombopénies.","mc":"TPO · foie et rein · proche de l'EPO · mégacaryocytes · plaquettes · romiplostim · eltrombopag"},{"id":"ch2e-s2c0","t":"Ce que ce schéma explique","e":"Pourquoi certaines femmes ont un excès de testostérone, pourquoi les hommes produisent un peu d'œstrogènes, pourquoi la DHEA (surrénale, faible effet androgène) sert de précurseur de testostérone ou d'œstrogènes, et le rôle central du cholestérol produit par le foie. Les œstrogènes viennent des androgènes : la testostérone est « la forme la plus simple » dont on aromatise le cycle A.","mc":"excès de testostérone chez la femme · œstrogènes chez l'homme · DHEA (surrénale) · précurseur · cholestérol hépatique · œstrogènes issus des androgènes"},{"id":"ch2e-s2c1","t":"L'aromatase et la 5α-réductase en thérapeutique","e":"Inhibiteurs de l'aromatase : bloquent la production d'œstrogènes (cancers du sein hormono-dépendants après la ménopause). Finastéride pour information : inhibe la 5α-réductase (prostate, peau) → moins de DHT (hypertrophie bénigne de la prostate, alopécie).","mc":"Inhibiteurs de l'aromatase: œstrogènes ↓ · cancer du sein après ménopause | Finastéride: 5α-réductase · DHT ↓ · prostate · alopécie"},{"id":"ch2e-s2c2","t":"Transport et catabolisme","e":"98 % liés à la SHBG (sex hormone binding globulin), 2 % libres et actifs. Glucuro- ou sulfoconjugaison hépatique, élimination rénale, un peu biliaire avec cycle entéro-hépatique. Cirrhose : les œstrogènes ne sont plus dégradés → féminisation chez l'homme (gynécomastie, perte de pilosité).","mc":"SHBG · Cirrhose · gynécomastie"},{"id":"ch2e-s3c0","t":"Œstrogènes : récepteurs et effets","e":"Noyau estrane avec un cycle A aromatique (phénol) ; l'œstradiol est le plus puissant. Récepteurs nucléaires (ERE) : organes sexuels, hypothalamus, hypophyse, foie, os. Effets sexuels (caractères primaires et secondaires) et généraux : minéralisation osseuse, soudure des cartilages (les filles arrêtent de grandir à la puberté), foie (protéines de transport, facteurs de coagulation), effet favorable sur les lipides.","mc":"cycle A aromatique (phénol) · nucléaires · soudure des cartilages"},{"id":"ch2e-s3c1","t":"Progestérone et mifépristone","e":"Principal gestagène : prépare l'endomètre à la nidation et maintient la grossesse. La mifépristone (RU-486, MIFEGYNE®) est un antagoniste de la progestérone : l'endomètre ne peut plus être maintenu → interruption de grossesse. « Une molécule dont je vous demande de retenir le nom. »","mc":"progestérone · nidation · maintien de la grossesse | Mifépristone: RU-486 · MIFEGYNE® · antagoniste · interruption de grossesse"},{"id":"ch2e-s3c2","t":"La pilule","e":"Œstroprogestatif : rétrocontrôle négatif → FSH (freinée par l'œstrogène) et LH (freinée par le progestatif) basses → pas d'ovulation ; en plus, endomètre peu propice et glaire cervicale épaisse. Progestatif seul possible. Contraception d'urgence : ulipristal (ELLAONE®, jusqu'à 5 jours).","mc":"œstroprogestatif · rétrocontrôle négatif · FSH et LH basses · pas d'ovulation · endomètre · glaire épaisse · ulipristal (ELLAONE®)"},{"id":"ch2e-s3c2w","t":"Pourquoi la pilule empêche-t-elle l'ovulation ?","e":"Les hormones exogènes maintiennent un taux stable d'œstrogène et de progestatif qui freine l'hypothalamus et l'hypophyse : pas de pic de LH, donc pas d'ovulation.","mc":"taux stable d'œstrogène et progestatif · freine hypothalamus et hypophyse · pas de pic de LH · pas d'ovulation"},{"id":"ch2e-s3c3","t":"Modulateurs du récepteur aux œstrogènes","e":"Clomifène (CLOMID®) : bloque le rétrocontrôle des œstrogènes sur l'hypothalamus → FSH/LH ↑ → induction de l'ovulation (infertilité). Tamoxifène (NOLVADEX®) : anti-œstrogène sur le sein, œstrogène sur l'os et l'endomètre (cancer du sein).","mc":"Clomifène: bloque le rétrocontrôle · FSH/LH ↑ · induction de l'ovulation | Tamoxifène: anti-œstrogène (sein) · œstrogène (os, endomètre)"},{"id":"ch2e-s4c0","t":"Testostérone","e":"Testicule (cellules de Leydig, sous LH) ; la FSH agit sur les cellules de Sertoli (spermatogenèse), qui produisent l'inhibine (freine la FSH). Effets sexuels (organes génitaux, puberté, DHT) et anabolisants (muscle) : on a cherché à dissocier les deux (stéroïdes anabolisants). Rétrocontrôle de la testostérone sur l'hypothalamus.","mc":"LH · FSH · inhibine · anabolisants"},{"id":"ch2e-s4c1","t":"Prolactine : une régulation à part","e":"198 AA, 3 ponts disulfures (proche de la GH), cellules lactotropes de l'antéhypophyse. Sa statine est la dopamine (frein permanent) ; la succion du sein inhibe la dopamine → prolactine ↑ → lactation. Les agonistes dopaminergiques (bromocriptine) la diminuent ; les antagonistes (neuroleptiques) l'augmentent.","mc":"prolactine · 198 AA · cellules lactotropes · dopamine (frein) · succion → lactation · bromocriptine ↓ · neuroleptiques ↑"},{"id":"ch2e-s4c2","t":"Ocytocine","e":"9 AA avec un pont disulfure (proche de l'ADH), produite par l'hypothalamus et libérée par la post-hypophyse. Stimulée par la dilatation du col : contraction de l'utérus (accouchement) et éjection du lait.","mc":"ocytocine · 9 AA · hypothalamus · post-hypophyse · dilatation du col · contraction de l'utérus · éjection du lait"},{"id":"ch2f-s0c0","t":"Cytokine vs hormone","e":"Peptides ou glycoprotéines solubles qui règlent croissance, involution et immunité. Différences avec les hormones : sécrétées par plusieurs types cellulaires (pas une glande), action surtout autocrine ou paracrine (parfois endocrine), pléiotropie (une cytokine, plusieurs effets) et redondance (plusieurs cytokines, un même effet). Récepteurs membranaires à 2 sous-unités, souvent liés à des tyrosine kinases (JAK).","mc":"plusieurs types cellulaires · autocrine ou paracrine · pléiotropie · redondance"},{"id":"ch2f-s0c1","t":"TNF-α, IL-1, IL-6 : l'inflammation aiguë","e":"Produites surtout par les macrophages activés. En petite quantité : inflammation locale (molécules d'adhésion endothéliales, recrutement des leucocytes, chimiotactisme, induction de la COX-2). En grande quantité : effets systémiques : fièvre (hypothalamus, PGE2), protéines de la phase aiguë par le foie (CRP, fibrinogène), leucocytose. Ce sont les 3 paramètres recherchés en clinique.","mc":"macrophages · locale · COX-2 · systémiques · fièvre · protéines de la phase aiguë · leucocytose"},{"id":"ch2f-s0c1w","t":"Comment une infection donne-t-elle de la fièvre ?","e":"TNF-α, IL-1 et IL-6 atteignent l'hypothalamus et y induisent la COX-2 → PGE2 → élévation du point de consigne thermique. C'est pourquoi les AINS et le paracétamol font baisser la fièvre.","mc":"TNF-α · IL-1 · IL-6 · hypothalamus · COX-2 · PGE2 · point de consigne ↑ · AINS · paracétamol"},{"id":"ch2f-s0c2","t":"TNF-α et interférons","e":"Le TNF (tumor necrosis factor) : antitumoral et anti-infectieux, mais principal responsable du choc septique et impliqué dans la maladie de Crohn, la polyarthrite, l'athérosclérose → anti-TNF (anticorps). Interférons : type I (α, β) antiviraux (cellules infectées), type II (γ) immunomodulateur ; utilisés contre certaines hépatites, la sclérose en plaques, la leucémie myéloïde chronique.","mc":"TNF · choc septique · anti-TNF · Interférons"},{"id":"ch2f-s0c3","t":"Facteurs de croissance","e":"Hématopoïétiques : EPO, TPO, G-CSF, GM-CSF (chapitre 2.6). Non hématopoïétiques : FGF, EGF, PDGF, VEGF (angiogenèse, récepteurs VEGFR à tyrosine kinase). pour information anti-VEGF (bévacizumab) contre l'angiogenèse tumorale et dans la DMLA.","mc":"Hématopoïétiques: EPO · TPO · G-CSF · GM-CSF | Autres: FGF · EGF · PDGF · VEGF (angiogenèse) · anti-VEGF (bévacizumab)"},{"id":"ch2f-s1c0","t":"L'acide arachidonique et l'EPA","e":"Acide arachidonique : C20, 4 doubles liaisons (5, 8, 11, 14), ω-6, dérivé de l'acide linoléique, stocké en position 2 des phospholipides → prostaglandines et thromboxane de la série 2. EPA (acide eicosapentaénoïque) : C20, 5 doubles liaisons, ω-3 (huiles de poisson) → série 3 : TXA3 peu agrégant mais PGI3 vasodilatatrice et anti-agrégante → effet antithrombotique (avec une polémique sur les bénéfices réels).","mc":"Acide arachidonique · série 2 · EPA · TXA3 peu agrégant · PGI3 vasodilatatrice et anti-agrégante"},{"id":"ch2f-s1c1","t":"Effets des prostanoïdes","e":"Récepteurs RCPG (AMPc ou IP3/DAG). PGE2 : via COX-1, mucus gastrique et débit rénal ; via COX-2, inflammation (douleur, fièvre, rougeur, œdème) ; contractions utérines. TXA2 (plaquettes) : pro-agrégant et vasoconstricteur. PGI2 (endothélium) : anti-agrégante et vasodilatatrice. La balance TXA2/PGI2 règle le risque de thrombose artérielle.","mc":"RCPG · PGE2 · TXA2 · pro-agrégant et vasoconstricteur · PGI2 · anti-agrégante et vasodilatatrice · balance TXA2/PGI2"},{"id":"ch2f-s1c1w","t":"Pourquoi les coxibs augmentent-ils le risque cardiovasculaire ?","e":"Ils bloquent la COX-2 de l'endothélium (moins de PGI2 anti-agrégante) sans toucher la COX-1 des plaquettes (TXA2 intact) : la balance penche vers l'agrégation et la vasoconstriction → thrombose artérielle.","mc":"coxibs · COX-2 endothéliale · PGI2 ↓ · COX-1 plaquettaire intacte · TXA2 · thrombose artérielle"},{"id":"ch2f-s1c2","t":"Les leucotriènes","e":"Produits par les leucocytes et macrophages (5-LOX + FLAP). LTB4 : chimiotactisme (attire les leucocytes). Peptido-leucotriènes (LTC4, D4, E4) : bronchoconstriction puissante, perméabilité vasculaire ↑ (œdème). Rôle majeur dans l'asthme et l'allergie → antileucotriènes (montélukast).","mc":"LTB4 · chimiotactisme · Peptido-leucotriènes · bronchoconstriction"},{"id":"ch2f-s2c0","t":"Pourquoi une faible dose suffit","e":"Les cellules endothéliales ont un noyau : elles resynthétisent leur COX et refont de la PGI2. Les plaquettes, sans noyau, restent bloquées jusqu'à leur remplacement. D'où l'aspirine « cardio » quotidienne, et l'arrêt quelques jours avant une chirurgie ou un don de sang.","mc":"endothélium a un noyau · resynthèse de COX · PGI2 · plaquettes sans noyau · bloquées 8-10 j · aspirine « cardio » · arrêt avant chirurgie"},{"id":"ch2f-s2c1","t":"Les effets indésirables s'expliquent par les médiateurs","e":"1) Ulcères : moins de PGE2 gastroprotectrice (COX-1). 2) Asthme : l'acide arachidonique non utilisé par la COX part vers la 5-LOX → plus de leucotriènes → bronchoconstriction (pas d'aspirine ni d'AINS en 1re intention chez l'asthmatique). 3) Rein : moins de perfusion rénale (COX-1) → insuffisance rénale. 4) Saignements. 5) Chez l'enfant : syndrome de Reye (spécifique à l'aspirine) → ibuprofène ou paracétamol.","mc":"Ulcères · Asthme · Rein · Saignements · syndrome de Reye"},{"id":"ch2f-s2c1w","t":"Pourquoi un AINS peut-il déclencher une crise d'asthme ?","e":"En bloquant la COX, on accumule l'acide arachidonique, qui est dévié vers la 5-lipoxygénase : plus de peptido-leucotriènes, puissants bronchoconstricteurs.","mc":"COX bloquée · acide arachidonique dévié · 5-lipoxygénase · leucotriènes · bronchoconstriction"},{"id":"ch2f-s3c0","t":"Les trois NO synthases","e":"eNOS (endothélium) et nNOS (neurones) : constitutives, Ca²⁺-calmoduline dépendantes, petites quantités. iNOS : inductible par les cytokines pro-inflammatoires dans les macrophages → grandes quantités de NO (défense, mais aussi vasodilatation massive du choc septique).","mc":"eNOS · nNOS · iNOS · inductible"},{"id":"ch2f-s3c1","t":"Effet vasodilatateur","e":"Histamine, bradykinine ou acétylcholine stimulent l'endothélium → NO → diffuse dans le muscle lisse → guanylate cyclase soluble → GMPc → relaxation. Il inhibe aussi l'agrégation plaquettaire. Médicaments donneurs de NO : dérivés nitrés (trinitrine, angor), nitroprussiate, molsidomine ; les inhibiteurs de la PDE5 prolongent son effet.","mc":"guanylate cyclase soluble · GMPc · dérivés nitrés"},{"id":"ch2f-s3c2","t":"Endothélines","e":"Peptides de 21 AA (2 ponts disulfures), ET-1 la plus importante, formée par l'enzyme de conversion des endothélines. Effet paracrine sur le muscle lisse : vasoconstriction très puissante ; effet autocrine sur l'endothélium : libération de NO et de PGI2 (frein). Le tonus vasculaire = endothéline (constriction) vs NO + PGI2 (dilatation). Antagonistes (bosentan) dans l'hypertension artérielle pulmonaire.","mc":"ET-1 · 21 AA · enzyme de conversion des endothélines · vasoconstriction puissante · NO et PGI2 (frein) · hypertension artérielle pulmonaire"},{"id":"ch2f-s4c0","t":"Allergie et choc anaphylactique","e":"L'allergène + IgE fixées sur les mastocytes (peau, poumons, tube digestif) → dégranulation : histamine, leucotriènes, cytokines → vasodilatation, œdème, bronchoconstriction. En systémique : choc anaphylactique (chute de pression) → adrénaline IM immédiate (α1 vasoconstriction, β2 bronchodilatation), puis antihistaminique et corticoïde de fond.","mc":"mastocytes · dégranulation · choc anaphylactique · adrénaline"},{"id":"ch2g-s0c0","t":"Trois familles","e":"Excitateurs : acétylcholine, glutamate (entrée de cations → dépolarisation). Inhibiteurs : glycine, GABA (entrée de Cl⁻ → hyperpolarisation). À action complexe : noradrénaline, dopamine, sérotonine (RCPG, effets selon les sous-types). Arrêt de l'effet : dégradation enzymatique ou recapture.","mc":"Excitateurs · Inhibiteurs · À action complexe"},{"id":"ch2g-s1c0","t":"Nicotiniques vs muscariniques","e":"Nicotiniques (récepteurs canaux, pentamères) : ganglions (sympathiques et parasympathiques), médullosurrénale, jonction neuromusculaire → contraction du muscle strié. Muscariniques (RCPG, M1-M5) : organes cibles du parasympathique → digestion (sécrétion gastrique M1, motilité), cœur ralenti (M2), bronchoconstriction, myosis, sécrétions. « Je ne vous demande pas de retenir les sous-types muscariniques. »","mc":"Nicotiniques · jonction neuromusculaire · Muscariniques · parasympathique"},{"id":"ch2g-s1c0w","t":"Une injection d'acétylcholine : quels effets sur le cœur et l'œil ? (sans rien retenir par cœur)","e":"Le parasympathique fait l'inverse du sympathique (fight or flight) : la noradrénaline accélère le cœur et dilate la pupille, donc l'acétylcholine (muscarinique) ralentit le cœur et fait un myosis. « Si vous avez compris ça, il n'y a rien à retenir par cœur. »","mc":"parasympathique · muscarinique · bradycardie · myosis · inverse de la noradrénaline"},{"id":"ch2g-s1c1","t":"Toxines et médicaments","e":"La toxine botulique empêche la libération d'acétylcholine → paralysie (usage esthétique, spasticité). pour information les inhibiteurs de l'acétylcholinestérase (Alzheimer, myasthénie) et les antimuscariniques (atropine) sont vus en pharmacologie.","mc":"toxine botulique · libération d'ACh bloquée · paralysie · anticholinestérasiques (Alzheimer, myasthénie) · atropine"},{"id":"ch2g-s2c0","t":"Glutamate (excitateur)","e":"Formé à partir de l'α-cétoglutarate (cycle de Krebs) par transamination ou glutamate déshydrogénase. Neuromédiateur excitateur majeur du SNC (50 % des synapses) : entrée de Na⁺ et Ca²⁺, mémorisation. Récepteurs ionotropiques (NMDA, bloqué par le Mg²⁺ ; AMPA ; kaïnate) et métabotropiques (mGlu) pour information.","mc":"α-cétoglutarate · ionotropiques · métabotropiques"},{"id":"ch2g-s2c1","t":"Glycine (inhibitrice)","e":"Le plus simple des acides aminés ; dans la moelle et le tronc cérébral, récepteur canal Cl⁻ → hyperpolarisation. pour information la strychnine (taupicide) l'antagonise → convulsions.","mc":"glycine · moelle et tronc cérébral · canal Cl⁻ · hyperpolarisation · strychnine (convulsions)"},{"id":"ch2g-s2c2","t":"GABA et récepteur GABA-A","e":"GABA = acide γ-aminobutyrique, inhibiteur principal du SNC (calme, relâche les muscles). GABA-A : canal Cl⁻ pentamérique avec des sites pour les benzodiazépines, barbituriques, alcool, anesthésiques, neurostéroïdes qui augmentent l'ouverture → plus de Cl⁻ → hyperpolarisation → effet anxiolytique, sédatif, hypnotique, myorelaxant, anticonvulsivant. GABA-B : RCPG (Gi).","mc":"GABA · inhibiteur principal du SNC · GABA-A · canal Cl⁻ pentamérique · benzodiazépines · barbituriques · alcool · sédation · myorelaxation"},{"id":"ch2g-s2c2w","t":"Pourquoi l'entrée de chlorure rend-elle le neurone moins excitable ?","e":"Le Cl⁻ est négatif : plus il en entre, plus l'intérieur est négatif (hyperpolarisation) et plus le neurone est loin du seuil de dépolarisation. « C'est purement une question de charge. »","mc":"Cl⁻ négatif · hyperpolarisation · loin du seuil · moins excitable"},{"id":"ch2g-s3c0","t":"Dopamine : récepteurs et effets","e":"Neurones de la substance noire (mésencéphale) → corps strié (mouvement) ; aussi émotions, pensée, apprentissage. Récepteurs D1 à D5, tous RCPG : D1, D5 → Gs (AMPc ↑) ; D2, D3, D4 → Gi (AMPc ↓). En périphérie à faible dose : vasodilatation rénale et mésentérique (D1) ; nausées et vomissements (D2 de la zone gâchette).","mc":"substance noire · D1, D5 · D2, D3, D4"},{"id":"ch2g-s3c1","t":"Maladie de Parkinson","e":"Destruction des neurones dopaminergiques de la substance noire → manque de dopamine dans le striatum → tremblement de repos, rigidité, akinésie. Traitement : L-DOPA (et pas la dopamine, qui ne passe pas la barrière hémato-encéphalique) + inhibiteur périphérique de la DOPA décarboxylase ; inhibiteurs de la COMT (entacapone) et de la MAO-B ; agonistes dopaminergiques.","mc":"substance noire · dopamine ↓ (striatum) · tremblement · rigidité · akinésie · L-DOPA · inhibiteur de la DOPA décarboxylase · COMT · MAO-B"},{"id":"ch2g-s3c2","t":"Schizophrénie","e":"Associée à un excès de dopamine (voie méso-limbique). Traitée par les neuroleptiques, antagonistes des récepteurs D2 (halopéridol…). Effets indésirables des neuroleptiques typiques : syndrome extrapyramidal (pseudo-Parkinson, par blocage D2 du striatum) et hyperprolactinémie (la dopamine est la statine de la prolactine).","mc":"excès de dopamine · neuroleptiques · D2 · extrapyramidal"},{"id":"ch2g-s3c2w","t":"Pourquoi un neuroleptique peut-il donner des tremblements comme un parkinsonien ?","e":"Il bloque les récepteurs D2 partout, y compris dans le striatum où la dopamine contrôle le mouvement : on reproduit le manque de dopamine de la maladie de Parkinson.","mc":"neuroleptique · blocage D2 · striatum · syndrome parkinsonien · extrapyramidal"},{"id":"ch2g-s4c0","t":"Où et comment","e":"Dans le SNC, les cellules entérochromaffines du tube digestif (la majorité) et les plaquettes. 7 familles de récepteurs (5-HT1 à 5-HT7 ; 5-HT3 = canal ionique, les autres RCPG) : « je ne vous demande pas de retenir les sous-types ». Dégradée par la MAO-A → acide 5-hydroxyindolacétique (urines).","mc":"SNC · cellules entérochromaffines · plaquettes · 5-HT1 à 5-HT7 · 5-HT3 = canal · MAO-A · acide 5-hydroxyindolacétique"},{"id":"ch2g-s4c1","t":"Humeur, sommeil, dépression","e":"Longtemps appelée, avec l'ocytocine, « hormone du bonheur » : régule le sommeil et surtout l'humeur. Un manque est associé à la dépression → antidépresseurs qui augmentent la sérotonine dans la synapse (inhibiteurs de la recapture, IMAO). Le LSD, de structure proche (noyau indole, 2 carbones et un azote), est l'un des hallucinogènes actifs à la plus faible dose.","mc":"humeur · sommeil · dépression · inhibiteurs de la recapture · IMAO · LSD (noyau indole)"},{"id":"ch2g-s4c2","t":"Nausées et migraine","e":"En périphérie, la sérotonine (comme la dopamine) déclenche nausées et vomissements via les récepteurs 5-HT3 : le métoclopramide (PRIMPERAN®), développé comme anti-D2, bloque aussi 5-HT3 ; les sétrons sont des anti-5-HT3 (vomissements de la chimiothérapie). Migraine : des agonistes 5-HT1 (triptans) font une vasoconstriction indirecte. La motilité intestinale : « je ne vous demande pas vraiment de la retenir ».","mc":"nausées · 5-HT3 · métoclopramide · sétrons · migraine · triptans (5-HT1)"},{"id":"ch2g-s4c3","t":"Mélatonine","e":"Produite la nuit par l'épiphyse (glande pinéale) à partir de la sérotonine : règle le rythme veille-sommeil (nycthéméral).","mc":"mélatonine · épiphyse · la nuit · sérotonine · rythme veille-sommeil"},{"id":"ch2g-s5c0","t":"À laisser pour le séminaire","e":"« Les opioïdes endogènes et exogènes, je ne vais pas les voir ici ; vous pouvez laisser tomber ; on les verra dans un séminaire de biochimie humaine. » pour information enképhalines, endorphines, dynorphines ; récepteurs μ, δ, κ ; la morphine les mime (analgésie, dépression respiratoire, constipation).","mc":"à laisser pour le séminaire · enképhalines · endorphines · récepteurs μ, δ, κ · morphine"},{"id":"ch4-s0c0","t":"Plasma vs sérum, hématocrite","e":"Volume sanguin 5-6 L (8 % du poids). Centrifugé : ~45 % d'éléments figurés (99 % de GR) = hématocrite. Plasma = partie liquide avec les facteurs de coagulation (tube anticoagulé) ; sérum = plasma sans les protéines de coagulation (le sang a coagulé). Le K⁺ (3,5-5 mmol/L) est « hyper important » : contraction musculaire et automatisme cardiaque.","mc":"hématocrite · Plasma · sérum"},{"id":"ch4-s0c1","t":"Acide urique et goutte","e":"Produit final des purines (alimentaires et endogènes : renouvellement et lyse cellulaire) ; éliminé à 80 % par le rein, 20 % par l'intestin. Excès (hyperuricémie) → cristaux d'urate : goutte (arthrite, tophus) et lithiase rénale. Crise : colchicine, AINS ; fond : allopurinol (inhibe la xanthine oxydase) ; régime pauvre en purines (abats, viande rouge, fruits de mer, bière).","mc":"purines · 80 % par le rein · goutte · allopurinol"},{"id":"ch4-s0c2","t":"Créatine et créatinine","e":"Créatine (arginine + glycine) → créatine-phosphate (CPK) : réserve d'énergie rapide du muscle (le « coup de pédale »). CPK ↑ = lyse musculaire (infarctus, traumatisme, rhabdomyolyse). La créatinine (cyclisation) est produite à taux constant selon la masse musculaire et filtrée par le rein → sa clairance (formule de Cockcroft-Gault) estime la filtration glomérulaire : essentiel pour adapter les doses des médicaments.","mc":"CPK · créatinine · Cockcroft-Gault"},{"id":"ch4-s0c3","t":"Protéines plasmatiques","e":"Albumine : principale responsable de la pression oncotique (rétention d'eau dans les vaisseaux) et transport (hormones thyroïdiennes, AG, bilirubine, médicaments). Globulines : céruloplasmine (cuivre), haptoglobine (Hb libre), transferrine (fer), fibrinogène, SHBG, immunoglobulines (γ).","mc":"Albumine: pression oncotique · transport (hormones, AG, bilirubine, médicaments) | Globulines: céruloplasmine · haptoglobine · transferrine · fibrinogène · immunoglobulines"},{"id":"ch4-s0c3w","t":"Pourquoi une hypoalbuminémie donne-t-elle des œdèmes ?","e":"L'albumine retient l'eau dans les capillaires (pression oncotique). Si elle manque (cirrhose, dénutrition, syndrome néphrotique), l'eau passe dans les tissus.","mc":"albumine ↓ · pression oncotique ↓ · eau dans les tissus · cirrhose · dénutrition · syndrome néphrotique"},{"id":"ch4-s1c0","t":"Le globule rouge","e":"Pas une vraie cellule : pas de noyau ni de mitochondries. Vit 120 jours (« important de s'en souvenir ») ; on en fabrique plus de 2 millions par seconde dans la moelle, sous l'EPO. Les réticulocytes (GR jeunes, plus de noyau) reflètent la régénération : anémie régénérative (réticulocytes ↑, ex. hémorragie, hémolyse) vs non régénérative (moelle atteinte → myélogramme).","mc":"pas de noyau ni de mitochondries · 120 jours · EPO · réticulocytes · régénérative · non régénérative"},{"id":"ch4-s1c1","t":"Vitamine B12 (cobalamine)","e":"Noyau corrine avec du cobalt. Uniquement d'origine animale (micro-organismes) ; besoins 1-2 µg/j. Doit se lier au facteur intrinsèque des cellules pariétales de l'estomac, puis absorbée dans l'iléon : « on n'absorbera pas la B12 sans son facteur intrinsèque ». Coenzyme de la synthèse de méthionine, qui régénère le THF actif (acide folique) nécessaire aux bases puriques → ADN.","mc":"cobalt · facteur intrinsèque · iléon · THF"},{"id":"ch4-s1c1w","t":"Pourquoi une carence en B12 ou en folates donne-t-elle de grands globules rouges ?","e":"Sans THF actif, la synthèse d'ADN est ralentie : les précurseurs grossissent sans se diviser → anémie mégaloblastique et macrocytaire (VGM > 100 fL). L'anémie de Biermer (pernicieuse) est une carence en B12 par manque de facteur intrinsèque (auto-immune).","mc":"THF actif manquant · synthèse d'ADN ralentie · grosses cellules · anémie mégaloblastique · macrocytaire (VGM > 100) · Biermer · facteur intrinsèque"},{"id":"ch4-s1c2","t":"Acide folique et grossesse","e":"« Une femme enceinte, une femme qui a un désir de grossesse : de l'acide folique tous les jours. C'est super important » pour les futurs pharmaciens : la carence expose au spina bifida (défaut de fermeture du tube neural).","mc":"acide folique · femme enceinte ou désir de grossesse · tous les jours · spina bifida · tube neural"},{"id":"ch4-s2c0","t":"Le 2,3-BPG","e":"Formé à partir du 1,3-BPG (bisphosphoglycérate mutase) : le GR ne fait plus qu'un ATP net par glucose sur cette voie. Il se fixe sur la désoxyhémoglobine et diminue son affinité pour l'O₂ → l'oxygène est mieux libéré dans les tissus. Il augmente en altitude ou en anémie (adaptation).","mc":"un ATP · diminue son affinité pour l'O₂ · libéré dans les tissus"},{"id":"ch4-s2c0w","t":"Pourquoi le GR accepte-t-il de « perdre » un ATP ?","e":"Ce sacrifice produit le 2,3-BPG, qui fait lâcher l'O₂ à l'hémoglobine là où les tissus en ont besoin. « C'est un petit mal pour un bien. »","mc":"1 ATP perdu · 2,3-BPG · l'Hb lâche l'O₂ · tissus · « un petit mal pour un bien »"},{"id":"ch4-s2c1","t":"Le glutathion contre le stress oxydatif","e":"Le GR transporte l'O₂ : il produit des radicaux libres (superoxyde → SOD → H₂O₂). Le glutathion réduit (GSH) cède ses électrons via la glutathion peroxydase (sélénium) : H₂O₂ → H₂O, et 2 GSH → GSSG. La glutathion réductase le régénère avec le NADPH de la voie des pentoses. Il faut aussi de l'ATP pour le synthétiser. Autres antioxydants : vitamines E et C.","mc":"SOD · glutathion réduit (GSH) · glutathion peroxydase · glutathion réductase · NADPH"},{"id":"ch4-s2c2","t":"Déficit en G6PD (favisme)","e":"Maladie héréditaire très fréquente (~400 millions de personnes) : pas assez de glucose-6-phosphate déshydrogénase → pas de NADPH → glutathion non régénéré → Hb dénaturée (corps de Heinz), membrane abîmée → anémie hémolytique aiguë après un stress oxydant : fèves, infections, médicaments (aspirine, sulfamides antibactériens, primaquine…). « Retenez au moins l'aspirine et les sulfamidés. »","mc":"glucose-6-phosphate déshydrogénase · anémie hémolytique · aspirine · sulfamides antibactériens"},{"id":"ch4-s2c3","t":"Dégradation des GR","e":"Après 120 jours, les GR sont détruits par les macrophages de la rate, du foie et de la moelle (système phagocytaire mononucléaire). L'hémoglobine est recyclée (fer, AA) et l'hème devient bilirubine (section 5).","mc":"120 jours · macrophages · rate · foie · moelle · fer et AA recyclés · hème → bilirubine"},{"id":"ch4-s3c0","t":"Structure et biosynthèse","e":"HbA adulte = 4 sous-unités (2 α + 2 β), chacune = globine + hème → 4 O₂ par molécule (HbF fœtale α2γ2, plus affine). Hème synthétisé surtout dans la moelle : mitochondrie (succinyl-CoA + glycine → δ-aminolévulinate, enzyme limitante ALA synthase, rétro-inhibée par l'hème), cytosol (porphobilinogène → porphyrinogènes), retour mitochondrial (insertion du Fe²⁺ par la ferrochélatase). Défauts enzymatiques : porphyries.","mc":"4 sous-unités · 4 O₂ · δ-aminolévulinate · porphyries"},{"id":"ch4-s3c1","t":"Le fer","e":"3-5 g dans le corps (60-75 % dans l'Hb). On en mange 10-20 mg/j, on en absorbe ~1 mg (plus en carence) ; le Fe³⁺ est réduit en Fe²⁺ (vitamine C) ; le fer héminique (viande) est mieux absorbé. Transport par la transferrine (foie, 2 Fe³⁺, saturée au 1/3), stockage par la ferritine (dosage = reflet des réserves) et l'hémosidérine. Régulation par l'hepcidine (foie) : elle dégrade la ferroportine → moins d'absorption et de libération du fer.","mc":"héminique · transferrine · ferritine · hepcidine"},{"id":"ch4-s3c1w","t":"Comment distinguer une anémie ferriprive d'une carence en B12 sur la NFS ?","e":"Ferriprive : microcytaire (VGM < 80 fL) et hypochrome, ferritine basse. B12/folates : macrocytaire (VGM > 100 fL). L'hémochromatose (génétique, hepcidine défaillante) est l'inverse : surcharge en fer (foie, cœur, pancréas).","mc":"Ferriprive: microcytaire (VGM < 80) · hypochrome · ferritine basse | B12/folates: macrocytaire (VGM > 100) | Hémochromatose: surcharge · hepcidine"},{"id":"ch4-s3c2","t":"Transport de l'O₂ : effet coopératif","e":"La fixation de l'O₂ sur le Fe²⁺ est une oxygénation, pas une oxydation. L'Hb est allostérique : la 1re molécule d'O₂ facilite les suivantes (forme tendue T → relâchée R) → courbe sigmoïde. L'O₂ est mieux libéré (déplacement vers la droite) si pH ↓, CO₂ ↑, température ↑, 2,3-BPG ↑ : exactement les conditions du muscle à l'effort (effet Bohr).","mc":"oxygénation · allostérique · sigmoïde · libéré · effet Bohr"},{"id":"ch4-s3c3","t":"Transport du CO₂ et pouvoir tampon","e":"80 % sous forme de bicarbonate (anhydrase carbonique dans le GR : CO₂ + H₂O → H₂CO₃ → HCO₃⁻ + H⁺ ; le HCO₃⁻ sort contre du Cl⁻), ~10 % lié aux NH₂ de l'Hb (carbaminohémoglobine), ~10 % dissous. L'Hb fixe les H⁺ (histidines) : la désoxyhémoglobine est une meilleure base → tampon.","mc":"80 % bicarbonate · anhydrase carbonique · échange HCO₃⁻/Cl⁻ · ~10 % carbaminohémoglobine · ~10 % dissous · Hb tampon (histidines)"},{"id":"ch4-s3c4","t":"Hémoglobines inactives et anormales","e":"Carboxyhémoglobine : le CO a une affinité ~200 fois plus forte que l'O₂ → intoxication (oxygénothérapie hyperbare). Méthémoglobine : fer oxydé en Fe³⁺, ne fixe plus l'O₂. Drépanocytose : mutation de la chaîne β (HbS) → GR en faucille, hémolyse, occlusions ; fréquente en Afrique (protection relative contre le paludisme). Thalassémies : défaut de synthèse d'une chaîne.","mc":"Carboxyhémoglobine · Méthémoglobine · Drépanocytose · Thalassémies"},{"id":"ch4-s4c0","t":"Les trois types d'ictère","e":"Bilirubine > ~2 mg/dL → peau et yeux jaunes. 1) Pré-hépatique (hémolyse) : bilirubine non conjuguée ↑. 2) Hépatique (hépatite, cirrhose, déficit de conjugaison) : les deux. 3) Post-hépatique (calcul, tumeur bloquant les voies biliaires) : bilirubine conjuguée ↑ (urines foncées, selles décolorées).","mc":"Pré-hépatique · non conjuguée · Hépatique · Post-hépatique · conjuguée"},{"id":"ch4-s4c0w","t":"Pourquoi beaucoup de nouveau-nés sont-ils jaunes, et comment les traite-t-on ?","e":"Ils détruisent beaucoup de GR (HbF remplacée) alors que leur glucuronyltransférase est encore immature : bilirubine non conjuguée ↑ (ictère physiologique). La photothérapie transforme la bilirubine en un isomère hydrosoluble (lumirubine) éliminé sans conjugaison ; on évite ainsi le passage dans le cerveau (ictère nucléaire).","mc":"nouveau-né · beaucoup de GR détruits · glucuronyltransférase immature · non conjuguée ↑ · photothérapie · lumirubine · ictère nucléaire"},{"id":"ch4-s5c0","t":"ABO","e":"Antigènes = glycoprotéines/glycolipides de la membrane du GR ; c'est l'ose terminal qui compte : H (O) = N-acétylglucosamine – galactose – fucose ; A = + N-acétylgalactosamine ; B = + galactose. Gènes A et B codominants, O récessif. Anticorps naturels (IgM) contre l'antigène absent (formés contre des bactéries intestinales aux sucres similaires). O = donneur universel (en GR), AB = receveur universel.","mc":"glycoprotéines/glycolipides · ose terminal · fucose · N-acétylgalactosamine · galactose · naturels"},{"id":"ch4-s5c1","t":"Rhésus et grossesse","e":"85 % Rh+ (antigène D). Les Rh− ne font des anticorps anti-D (IgG, passent le placenta) qu'après contact. Mère Rh− avec un 1er enfant Rh+ : immunisation à l'accouchement ; 2e enfant Rh+ : les anti-D détruisent ses GR (maladie hémolytique du nouveau-né). Prévention : immunoglobulines anti-D à la mère.","mc":"85 % Rh+ · antigène D · anti-D (IgG) après contact · placenta · 2e enfant Rh+ · maladie hémolytique · immunoglobulines anti-D"},{"id":"ch4-s6c0","t":"Les plaquettes","e":"Fragments de mégacaryocytes (TPO), sans noyau mais avec mitochondries ; 150 000-400 000/mm³ ; vie 8-10 jours ; 1/3 en réserve dans la rate. Granules denses (ADP, sérotonine, Ca²⁺) et α (fibrinogène, vWF, facteurs).","mc":"mégacaryocytes · TPO · sans noyau · 150 000-400 000/mm³ · 8-10 jours · 1/3 dans la rate · granules denses (ADP) · granules α (fibrinogène, vWF)"},{"id":"ch4-s6c1","t":"Hémostase primaire en 4 étapes","e":"1) Vasoconstriction. 2) Adhésion au sous-endothélium (collagène) via le facteur von Willebrand et la GPIb. 3) Activation : changement de forme, libération des granules, synthèse de TXA2 (COX-1), exposition des phospholipides négatifs (flip-flop) ; agonistes : ADP, TXA2, thrombine, collagène. 4) Agrégation : le fibrinogène fait des ponts entre les GPIIb/IIIa activées → clou plaquettaire, fragile. Endothélium sain = anti-thrombotique (NO, PGI2).","mc":"Vasoconstriction · Adhésion · facteur von Willebrand · Activation · TXA2 · ADP, TXA2, thrombine · Agrégation · fibrinogène · GPIIb/IIIa"},{"id":"ch4-s6c1w","t":"Où agissent l'aspirine et le clopidogrel ?","e":"Aspirine : COX-1 plaquettaire → plus de TXA2 (irréversible). Clopidogrel : bloque le récepteur de l'ADP (P2Y12). Deux agonistes différents de l'activation → association en post-infarctus (cas clinique du cours de présentation).","mc":"Aspirine: COX-1 · TXA2 ↓ · irréversible | Clopidogrel: récepteur de l'ADP (P2Y12) | association post-infarctus"},{"id":"ch4-s6c2","t":"La coagulation (hémostase secondaire)","e":"Cascade de pro-enzymes (protéases à sérine) activées en série (suffixe « a »), sur les phospholipides plaquettaires, avec du Ca²⁺. Voie extrinsèque (facteur tissulaire + VIIa, le vrai démarrage in vivo) et intrinsèque (XII, XI, IX + VIII) → Xa + Va (prothrombinase) → thrombine (IIa) → fibrinogène → fibrine, stabilisée par le XIIIa. Modèle cellulaire : initiation, amplification, propagation.","mc":"pro-enzymes · Ca²⁺ · facteur tissulaire + VIIa · Xa + Va · thrombine (IIa) · fibrine · XIIIa"},{"id":"ch4-s6c3","t":"Vitamine K","e":"Indispensable à la γ-carboxylation des résidus glutamate des facteurs II, VII, IX, X (et protéines C et S) dans le foie : ils peuvent alors fixer le Ca²⁺ et les phospholipides. Absorbée avec les lipides (sels biliaires). Les antivitamines K (warfarine, acénocoumarol) en bloquent le recyclage : anticoagulants ; antidote : vitamine K.","mc":"γ-carboxylation · II, VII, IX, X · antivitamines K"},{"id":"ch4-s6c3w","t":"Pourquoi un patient avec une obstruction biliaire peut-il saigner ?","e":"Sans bile, les graisses et la vitamine K (liposoluble) ne sont plus absorbées : les facteurs II, VII, IX et X ne sont plus carboxylés et sont inactifs.","mc":"pas de bile · vitamine K non absorbée · liposoluble · II, VII, IX, X non carboxylés · saignements"},{"id":"ch4-s6c4","t":"Régulation et fibrinolyse","e":"Freins : antithrombine III (inhibe IIa et Xa ; renforcée par l'héparine), protéine C activée + protéine S (dégradent Va et VIIIa), TFPI. Fibrinolyse : plasminogène → plasmine (par le t-PA endothélial, l'urokinase) → dégradation de la fibrine en D-dimères ; inhibée par l'α2-antiplasmine et le PAI-1. Le t-PA recombinant (ACTILYSE®) sert à dissoudre un thrombus (infarctus).","mc":"antithrombine III · héparine · protéine C · protéine S · Fibrinolyse · plasmine · t-PA · D-dimères"},{"id":"ch4-s6c5","t":"La thrombine, chef d'orchestre","e":"1) Procoagulante (fibrinogène → fibrine, active V, VIII, XI, XIII). 2) Pro-agrégante (active les plaquettes). 3) Anticoagulante (avec la thrombomoduline, active la protéine C : rétrocontrôle). 4) Antifibrinolytique (active le TAFI).","mc":"Procoagulante · Pro-agrégante · Anticoagulante · Antifibrinolytique"},{"id":"ch5-s0c0","t":"Double irrigation","e":"Plus grosse glande (≈ 1,5 kg), sous la coupole diaphragmatique droite. ≈ 1,5 L de sang par minute : veine porte 75 % (nutriments de l'intestin) + artère hépatique 25 % (O₂). Trajet : espace porte → sinusoïdes → veine centrolobulaire → veines hépatiques → veine cave inférieure.","mc":"veine porte 75 % · artère hépatique 25 % · sinusoïdes"},{"id":"ch5-s0c1","t":"Le lobule","e":"Hexagonal ; à chaque coin un espace porte avec la triade (artère hépatique, veine porte, canal biliaire). Le sang va de la périphérie vers la veine centrale ; la bile va dans l'autre sens, vers les canaux biliaires de l'espace porte : contre-courant.","mc":"espace porte · sang · bile · contre-courant"},{"id":"ch5-s0c1w","t":"Comment le sang et la bile circulent-ils dans le lobule ? (question tuyau)","e":"En sens inverse : le sang de l'espace porte vers la veine centrolobulaire par les sinusoïdes ; la bile, sécrétée dans les canalicules entre hépatocytes, vers le canal biliaire de l'espace porte.","mc":"contre-courant · sang: espace porte → veine centrolobulaire · sinusoïdes · bile: canalicules → canal biliaire"},{"id":"ch5-s0c2","t":"Les cellules","e":"Hépatocytes (~70 %, 1 ou 2 noyaux) ; cholangiocytes (canaux biliaires) ; cellules de Kupffer = macrophages des sinusoïdes (immunité, GR vieillis) ; cellules d'Ito dans l'espace de Disse (stockent la vitamine A, produisent le collagène de la fibrose) ; cellules endothéliales.","mc":"Hépatocytes · cellules de Kupffer · cellules d'Ito"},{"id":"ch5-s1c0","t":"Pour lui-même","e":"Phase absorptive : il brûle surtout du glucose. À jeun : surtout des acides gras (β-oxydation), qui fournissent aussi le NADH nécessaire à la néoglucogenèse.","mc":"Après un repas: glucose | À jeun: acides gras · β-oxydation · NADH pour la néoglucogenèse"},{"id":"ch5-s1c1","t":"Glucides : garder la glycémie","e":"Glycémie à jeun 0,7-0,9 g/L. Après un repas, captation du glucose indépendante de l'insuline (GLUT-2) → glycogène, glycolyse, pentoses (NADPH), acides gras. À jeun : glycogénolyse puis néoglucogenèse (lactate, glycérol, acides aminés), sous glucagon.","mc":"indépendante de l'insuline · glycogénolyse · néoglucogenèse"},{"id":"ch5-s1c1w","t":"Pourquoi le foie peut-il libérer du glucose dans le sang ? (question tuyau)","e":"Il possède la glucose-6-phosphatase : il retire le phosphate du glucose-6-P, qui peut alors sortir de la cellule. Le muscle n'a pas cette enzyme : son glycogène ne sert qu'à lui.","mc":"glucose-6-phosphatase · glucose libre sort · absente du muscle"},{"id":"ch5-s1c2","t":"Lipides","e":"Après un repas : TAG, phospholipides, VLDL exportées ; synthèse de 90 % du cholestérol (≈ 1 g/j). À jeun : β-oxydation des AG venus du tissu adipeux → corps cétoniques pour les autres tissus (le foie ne les utilise pas).","mc":"VLDL · cholestérol · corps cétoniques"},{"id":"ch5-s1c3","t":"Acides aminés et ammoniac","e":"Pas de stockage des AA. Les ramifiés (Val, Leu, Ile) et aromatiques sont renvoyés dans le sang ; les autres servent à la synthèse des protéines (albumine, facteurs). À jeun : AA glucoformateurs → néoglucogenèse ; cétogènes → corps cétoniques. L'ammoniac toxique est éliminé sous forme d'urée (cycle de l'urée, foie) excrétée par le rein.","mc":"pas de stockage des AA · ramifiés et aromatiques renvoyés · synthèse des protéines · glucoformateurs · cétogènes · ammoniac → urée"},{"id":"ch5-s2c0","t":"Ce que le foie fabrique","e":"Protéines plasmatiques : albumine, transferrine, haptoglobine, céruloplasmine, complément, facteurs de coagulation, VLDL et HDL, protéines de la phase aiguë. Pas les γ-globulines (plasmocytes). Cholestérol, bile (500-1000 mL/j : sels biliaires glycocholate et taurocholate), hormones/précurseurs (angiotensinogène, kininogène, somatomédines sous GH, 25-hydroxylation de la vitamine D), créatine.","mc":"Protéines plasmatiques · facteurs de coagulation · Pas les γ-globulines · bile · angiotensinogène · somatomédines"},{"id":"ch5-s2c0w","t":"Quelles protéines augmentent ou diminuent lors de la phase aiguë de l'inflammation ? (question tuyau)","e":"Sous IL-1, IL-6, TNF-α : ↑ CRP, fibrinogène (vitesse de sédimentation), haptoglobine, orosomucoïde. ↓ albumine et transferrine (protéines négatives).","mc":"CRP · albumine · transferrine"},{"id":"ch5-s2c1","t":"Stockage et immunité","e":"Stocke vitamines A, B12, acide folique, minéraux (fer, cuivre), glycogène. Stockage en défaut dans la cirrhose ; à l'inverse, maladies de surcharge (hémochromatose : fer ; Wilson : cuivre). Les cellules de Kupffer détruisent bactéries et GR vieillis.","mc":"A · B12 · acide folique · fer · cuivre · cellules de Kupffer"},{"id":"ch5-s3c0","t":"Absorption","e":"Rapide (pic en 60-90 min) ; à jeun, en moins de 30 min. Accélérée par le chaud (vin chaud) et le CO₂ (champagne) ; ralentie par un repas (gras), qui garde l'alcool dans l'estomac où une ADH gastrique en dégrade une partie.","mc":"absorption rapide · pic 60-90 min · à jeun < 30 min · chaud et CO₂ accélèrent · repas gras ralentit · ADH gastrique"},{"id":"ch5-s3c1","t":"Cinétique d'ordre 0","e":"L'ADH est saturée : la vitesse d'élimination est constante (≈ 0,15 g/L/h), quelle que soit la quantité bue. Boire plus ne fait pas éliminer plus vite. Différences génétiques d'ADH/ALDH (populations asiatiques) et isoenzymes moins actives chez la femme.","mc":"ADH saturée · vitesse constante · 0,15 g/L/h · boire plus ≠ éliminer plus vite · différences génétiques · femmes"},{"id":"ch5-s3c1w","t":"Que signifie « l'élimination de l'alcool suit une cinétique d'ordre 0 » ? (question tuyau)","e":"La quantité éliminée par heure est fixe (≈ 0,15 g/L/h) car l'enzyme est saturée ; elle ne dépend pas de la concentration. Ex. : 1,5 g/L met environ 10 h à disparaître.","mc":"quantité fixe par heure · 0,15 g/L/h · enzyme saturée · 1,5 g/L ≈ 10 h"},{"id":"ch5-s3c2","t":"Effets à court terme et lendemain","e":"L'acétaldéhyde est directement cytotoxique : c'est lui le principal responsable des effets (rougeur, nausées, maux de tête). L'éthanol, très lipophile, passe la barrière hémato-encéphalique et renforce le GABA-A (lien avec ch2.10). Il inhibe la vasopressine → polyurie → déshydratation. Gastrite, vomissements.","mc":"acétaldéhyde · GABA-A · vasopressine · déshydratation"},{"id":"ch5-s4c0","t":"Stéatose → fibrose → cirrhose","e":"Excès d'acétyl-CoA et de NADH → synthèse d'acides gras → stéatose (foie gras, réversible à l'arrêt) → hépatite alcoolique → fibrose (cellules d'Ito, collagène) → cirrhose (irréversible). Signes : ictère, angiomes, gynécomastie, hypertension portale (varices), ascite, œdèmes, troubles de la coagulation.","mc":"stéatose · réversible · fibrose · cirrhose · hypertension portale · ascite"},{"id":"ch5-s4c0w","t":"Pourquoi une cirrhose donne-t-elle des œdèmes et une ascite ? (question tuyau)","e":"Le foie ne fabrique plus assez d'albumine → pression oncotique ↓ → l'eau sort des vaisseaux ; en plus, l'hypertension portale pousse le liquide dans le péritoine.","mc":"albumine ↓ · pression oncotique ↓ · hypertension portale · ascite · œdèmes"},{"id":"ch5-s4c1","t":"Autres organes et carences","e":"Pancréatite, épilepsie, polyneuropathie. Dénutrition : encéphalopathie de Wernicke (carence en vitamine B1, thiamine), pellagre (vitamine PP). Alcool et grossesse : syndrome d'alcoolisation fœtale.","mc":"pancréatite · épilepsie · polyneuropathie · encéphalopathie de Wernicke (B1) · pellagre (PP) · alcoolisation fœtale"},{"id":"ch5-s4c1w","t":"Pourquoi donner de la vitamine B1 à un patient alcoolique ? (question tuyau)","e":"Il en manque (apport, absorption et stockage hépatique diminués) ; la thiamine est un coenzyme du métabolisme du glucose. Perfuser du glucose sans B1 peut déclencher une encéphalopathie de Wernicke : on donne la B1 avant ou avec le glucose.","mc":"carence en B1 (thiamine) · apport, absorption, stockage ↓ · Wernicke · B1 avant le glucose"},{"id":"ch5-s5c0","t":"Effet antabuse","e":"Le disulfirame (Antabuse®, métabolite DEDTC) inhibe l'aldéhyde déshydrogénase → l'acétaldéhyde s'accumule si on boit : rougeur du visage, nausées, vomissements, tachycardie, hypotension. Utilisé dans le sevrage. D'autres médicaments ont un effet antabuse : c'est pour ça qu'on ne boit pas avec certains traitements (ex. métronidazole).","mc":"disulfirame · DEDTC · aldéhyde déshydrogénase bloquée · acétaldéhyde ↑ · flush · nausées · tachycardie · sevrage · métronidazole"},{"id":"ch5-s5c0w","t":"Qu'est-ce qu'un médicament avec effet antabuse ? (question tuyau)","e":"Un médicament qui bloque l'ALDH (ou provoque le même effet) : avec de l'alcool, l'acétaldéhyde s'accumule et donne une réaction très désagréable (flush, nausées, tachycardie, hypotension).","mc":"bloque l'ALDH · acétaldéhyde s'accumule · flush · nausées · tachycardie · hypotension"},{"id":"ch5-s5c1","t":"Éthylène glycol (antigel)","e":"Goût sucré : intoxication des enfants et animaux ; 30 mL peuvent tuer un adulte. Ivresse, puis tachycardie, puis insuffisance rénale (cristaux d'oxalate) et acidose. Drames de sirops contaminés (Haïti 1996).","mc":"antigel · goût sucré · enfants et animaux · 30 mL mortels · acide oxalique · cristaux d'oxalate · insuffisance rénale · acidose"},{"id":"ch5-s5c2","t":"Méthanol (alcool frelaté)","e":"Présent en traces dans les boissons fermentées (dégradation de la pectine) ; point d'ébullition plus bas (64 °C vs 78 °C) : il part dans la « tête de distillation », à éliminer. Distillations artisanales à risque (Mexique, Indonésie, Turquie…). Formol puis acide formique → acidose métabolique et cécité.","mc":"pectine · acidose métabolique · cécité"},{"id":"ch5-s5c3","t":"Le traitement : un inhibiteur compétitif","e":"Donner de l'éthanol (l'ADH le préfère et ne transforme plus le toxique) ou mieux le fomépizole (4-méthylpyrazole), inhibiteur de l'ADH, à l'hôpital ; dialyse si besoin. Le méthanol ou le glycol non transformés sont éliminés sans former les acides toxiques.","mc":"inhibiteur compétitif · éthanol · fomépizole (4-méthylpyrazole) · ADH bloquée · dialyse"},{"id":"ch5-s5c3w","t":"Que faire en cas d'ingestion de méthanol ou d'éthylène glycol ? (question tuyau)","e":"Urgence : bloquer l'ADH par compétition (éthanol) ou inhibition (fomépizole) pour empêcher la formation d'acide formique ou oxalique, corriger l'acidose, dialyse si nécessaire.","mc":"urgence · éthanol ou fomépizole · pas d'acide formique ni oxalique · corriger l'acidose · dialyse"},{"id":"ch5-s6c0","t":"Phase I : fonctionnalisation","e":"But : rendre les substances lipophiles plus hydrosolubles pour les éliminer. Phase I = ajouter ou démasquer un groupe fonctionnel (–OH…) : surtout les cytochromes P450 (hème + Fe, réductase avec NADPH, O₂), mais aussi monooxygénases à flavine, MAO, ADH/ALDH, estérases. Peut donner des métabolites instables (époxydes).","mc":"rendre hydrosoluble · fonctionnalisation · cytochromes P450 (hème, NADPH, O₂) · monooxygénases à flavine · MAO · estérases · époxydes"},{"id":"ch5-s6c1","t":"Phase II : conjugaison","e":"Accrocher une grosse molécule polaire sur le groupe créé : acide glucuronique (UDP-glucuronyltransférase, comme la bilirubine), sulfate, glycine, méthyle, acétate, glutathion (glutathion-S-transférase). Défauts de glucuronoconjugaison : Gilbert (léger, bénin) et Crigler-Najjar (type I : enzyme absente, ictère grave du nouveau-né, photothérapie 10-12 h/j ; type II : partiel).","mc":"acide glucuronique · glutathion · Gilbert · Crigler-Najjar"},{"id":"ch5-s6c1w","t":"Quelle est la différence entre phase I et phase II ? (question tuyau)","e":"Phase I : on crée ou démasque une fonction (oxydation par P450, réduction, hydrolyse). Phase II : on conjugue cette fonction à un groupe polaire (glucuronide, sulfate, glutathion…) pour l'excréter.","mc":"Phase I: créer ou démasquer une fonction · P450 · réduction · hydrolyse | Phase II: conjugaison · glucuronide · sulfate · glutathion"},{"id":"ch5-s6c2","t":"Excrétion et premier passage","e":"Rein : substances hydrosolubles. Bile : substances conjuguées, plus grosses (bilirubine, stéroïdes, métaux lourds, nombreux médicaments) → intestin ; un foie malade peut donc entraîner un surdosage. Effet de premier passage : un médicament pris par la bouche traverse le foie (veine porte) avant d'atteindre la circulation générale et peut y être largement métabolisé.","mc":"Bile · surdosage · Effet de premier passage"},{"id":"ch5-s7c0","t":"Biosynthèse","e":"facultatif Facteurs de coagulation : chutent vite (tendance hémorragique). Albumine : demi-vie longue (15-19 j) → marqueur tardif d'insuffisance hépatique chronique. Pseudo-cholinestérases ↓. Électrophorèse dans la cirrhose : albumine ↓, γ-globulines ↑.","mc":"vite · Albumine · tardif"},{"id":"ch5-s7c1","t":"Cholestase vs cytolyse","e":"facultatif Cholestase (bile bloquée) : bilirubine conjuguée ↑, phosphatases alcalines ↑ (aussi l'os, l'enfant), γ-GT ↑ (la plus sensible). Cytolyse (hépatite, surdosage de paracétamol) : ALAT (cytoplasme, spécifique du foie), ASAT (aussi cœur et muscle), GLDH (mitochondrie : lésions sévères), LDH.","mc":"Cholestase · phosphatases alcalines · γ-GT · Cytolyse · ALAT · ASAT"},{"id":"semdiab-s0c0","t":"Définition","e":"Diabète sucré = hyperglycémie chronique due à un défaut de sécrétion d'insuline absolu (type 1) ou relatif avec insulinorésistance (type 2). Ses séquelles touchent reins, yeux, nerfs, cœur et vaisseaux. « Dia-baïno » = passer au travers : les malades urinent beaucoup (polyurie).","mc":"hyperglycémie chronique · absolu · relatif · insulinorésistance · reins, yeux, nerfs, cœur et vaisseaux"},{"id":"semdiab-s0c1","t":"Les types","e":"Type 1 (~10 %) : le pancréas ne fait plus d'insuline ; surtout enfant et adolescent. Type 2 (~90 %) : l'organisme répond mal à l'insuline ; adulte, de plus en plus d'adolescents ; cause principale : obésité. Gestationnel : découvert pendant la grossesse. Secondaire : maladie du pancréas, endocrinopathie (ex. Cushing), médicaments (corticoïdes).","mc":"Type 1 · Type 2 · obésité · Gestationnel · Secondaire"},{"id":"semdiab-s0c2","t":"Épidémiologie","e":"OMS : de 200 millions (1990) à 830 millions (2022) de diabétiques. Belgique 2023 : 7,6 % diagnostiqués, mais plus d'un diabétique sur trois l'ignore → prévalence réelle ≈ 10 %.","mc":"830 millions de diabétiques (2022) · Belgique 7,6 % diagnostiqués · 1 sur 3 l'ignore · ≈ 10 % réels"},{"id":"semdiab-s1c0","t":"Les « 4 P » du type 1","e":"Polyurie (glycémie > seuil rénal ≈ 1,80 g/L → glucosurie → diurèse osmotique), polydipsie (soif), amaigrissement malgré une polyphagie, asthénie. Risque d'acidocétose (odeur d'acétone de l'haleine). Type 2 : symptômes discrets ou absents, diagnostic en moyenne ~7 ans trop tard → dépistage.","mc":"Polyurie · polydipsie · amaigrissement · polyphagie · acidocétose"},{"id":"semdiab-s1c1","t":"L'HbA1c","e":"Le glucose (aldéhyde) se fixe sans enzyme sur les NH₂ de l'hémoglobine : base de Schiff puis réarrangement d'Amadori → cétoamine = glycation non enzymatique. Comme le GR vit 120 jours, l'HbA1c reflète la glycémie moyenne des 2-3 derniers mois sur une seule prise de sang. 1 point d'HbA1c en moins ≈ −37 % de complications microvasculaires.","mc":"base de Schiff · Amadori · glycation non enzymatique · 2-3 derniers mois"},{"id":"semdiab-s1c1w","t":"Pourquoi l'HbA1c peut-elle être faussée ?","e":"Elle dépend de la durée de vie des GR : si elle diminue (hémolyse, saignement, anémie régénérative), l'HbA1c est faussement basse ; une carence en fer peut l'augmenter.","mc":"durée de vie des GR · hémolyse ou saignement → faussement basse · carence en fer → plus haute"},{"id":"semdiab-s1c2","t":"Glucosurie, cétonurie, peptide C","e":"Le glucose filtré est réabsorbé par SGLT2 (~90 %) et SGLT1 ; au-delà du seuil (~1,80 g/L), il passe dans l'urine (bandelette). Cétonurie (acétoacétate) : jeûne, régime cétogène ou carence en insuline. Le peptide C (libéré avec l'insuline par la proinsuline) mesure la sécrétion propre du patient, même s'il s'injecte de l'insuline (RS, 21/09).","mc":"SGLT2 (~90 %) · SGLT1 · seuil ~1,80 g/L · glucosurie · cétonurie (acétoacétate) · peptide C · sécrétion propre"},{"id":"semdiab-s1c3","t":"Dépistage du type 1","e":"Maladie auto-immune en 3 stades : 1) ≥ 2 auto-anticorps, glycémie normale ; 2) anticorps + dysglycémie ; 3) diabète clinique. Anticorps : anti-GAD65, anti-IA-2, anti-ZnT8, anti-insuline. Intérêt : surveiller et éviter l'acidocétose révélatrice.","mc":"auto-immun · 3 stades · anti-GAD65 · anti-IA-2 · anti-ZnT8 · anti-insuline · éviter l'acidocétose"},{"id":"semdiab-s2c0","t":"Type 1","e":"Destruction auto-immune des cellules β des îlots de Langerhans (« insulite », 5-10 ans ou plus). L'hyperglycémie n'apparaît que lorsqu'il ne reste plus que 10-20 % de cellules β. Terrain génétique + facteurs environnementaux (gradient nord-sud : un enfant finlandais a 7-8 fois plus de risque) ; virus suspectés.","mc":"destruction auto-immune des cellules β · insulite · 10-20 % de β restantes · terrain génétique · environnement · gradient nord-sud"},{"id":"semdiab-s2c1","t":"Type 2 : d'abord l'insulinorésistance","e":"Gènes de susceptibilité + environnement (graisses saturées, sucres rapides, sédentarité). L'anomalie de départ est l'insulinorésistance : les β compensent par un hyperinsulinisme pendant 10-20 ans, puis s'épuisent → insulino-déficience relative. Siège surtout dans le muscle : lipides ectopiques (DAG, céramides) → voie IRS-PI3K-Akt altérée → moins de GLUT4 à la membrane. Foie : production de glucose mal freinée. Tissu adipeux : lipolyse mal freinée.","mc":"insulinorésistance · hyperinsulinisme · muscle · DAG, céramides · IRS-PI3K-Akt · GLUT4"},{"id":"semdiab-s2c1w","t":"Pourquoi la graisse abdominale (« pomme ») est-elle plus dangereuse que la graisse « poire » ?","e":"Le tissu adipeux androïde viscéral libère beaucoup d'acides gras vers le foie et le muscle, où ils s'accumulent et bloquent la signalisation de l'insuline. La répartition gynoïde (cuisses, fesses) est moins liée à l'insulinorésistance. On l'estime par le tour de taille.","mc":"graisse androïde viscérale · AG vers foie et muscle · signalisation de l'insuline bloquée · gynoïde moins à risque · tour de taille"},{"id":"semdiab-s3c0","t":"Acidocétose (type 1)","e":"Pas assez d'insuline + hormones de contre-régulation → lipolyse → β-oxydation hépatique → excès d'acétyl-CoA → corps cétoniques (acétoacétate, β-hydroxybutyrate) → acidose. Plus glycémie > 1,8 g/L → polyurie, déshydratation, hypotension. Nausées, vomissements, puis coma avec respiration rapide (Kussmaul : on évacue le CO₂). Traitement : insuline (et réhydratation).","mc":"corps cétoniques · acidose · respiration rapide"},{"id":"semdiab-s3c1","t":"État hyperglycémique hyperosmolaire (type 2)","e":"Hyperglycémie majeure + hyperosmolarité + déshydratation profonde, sans acidocétose significative (il reste assez d'insuline pour freiner la lipolyse). Diurèse osmotique → hypovolémie → moins d'élimination du glucose → cercle vicieux ; l'eau sort des cellules (cerveau : troubles de la conscience).","mc":"type 2 · hyperglycémie majeure · hyperosmolarité · déshydratation · sans acidocétose · diurèse osmotique · troubles de la conscience"},{"id":"semdiab-s3c2","t":"Hypoglycémie = urgence","e":"Niveau 1 < 0,70 g/L ; niveau 2 < 0,54 g/L ; niveau 3 : besoin d'un tiers. Causes : insuline trop dosée, sulfamides hypoglycémiants (les biguanides comme la metformine n'en donnent pas, sauf jeûne). Signes adrénergiques (sueurs, palpitations, faim, tremblements) puis neuroglycopéniques (troubles de la vue, confusion, convulsions, coma). Grave chez l'alcoolique, l'insuffisant rénal ou hépatique, la personne âgée.","mc":"< 0,70 g/L niveau 1 · < 0,54 g/L niveau 2 · niveau 3 = tiers · insuline · sulfamides hypoglycémiants · pas la metformine · sueurs · confusion · coma"},{"id":"semdiab-s3c2w","t":"Pourquoi l'hypoglycémie est-elle plus urgente que l'hyperglycémie ?","e":"Le cerveau n'a que le glucose comme carburant : sans lui, il souffre en minutes (coma, séquelles, décès). JMD : « vous pouvez vivre des années avec une hyperglycémie… l'hypoglycémie aiguë entraîne un risque mortel ».","mc":"cerveau: glucose seul carburant · minutes · coma · décès · hyperglycémie tolérée des années"},{"id":"semdiab-s4c0","t":"Microangiopathie","e":"Petits vaisseaux : rétinopathie (œil), néphropathie (rein), neuropathie. Théorie métabolique : toxicité du glucose (glycation des protéines, produits de glycation avancée), aggravée par l'HTA et les dyslipidémies.","mc":"petits vaisseaux · rétinopathie · néphropathie · neuropathie · glycation · HTA · dyslipidémie"},{"id":"semdiab-s4c1","t":"Macroangiopathie","e":"Athérosclérose plus étendue et plus précoce : infarctus, AVC, artérite des membres inférieurs ; facteurs aggravants : HTA, hypercholestérolémie, tabac, sédentarité, surpoids. Première cause de mortalité du diabétique de type 2.","mc":"athérosclérose · infarctus · AVC · artérite · HTA · cholestérol · tabac · 1re cause de mortalité (type 2)"},{"id":"semdiab-s4c2","t":"Neuropathie, infections, pied diabétique","e":"Neuropathie : ~50 % après 20 ans de diabète ; polyneuropathie (fourmillements, perte de sensibilité aux pieds), mononeuropathies, neuropathie végétative (digestion, vessie, cœur). Infections favorisées (immunité diminuée). Pied diabétique : neuropathie + artériopathie + déformations → ulcères (19-34 % au cours de la vie), amputations. Conseil officinal : examiner les pieds chaque jour.","mc":"neuropathie (~50 % à 20 ans) · fourmillements · infections · pied diabétique · ulcères · amputation"},{"id":"semdiab-s5c0","t":"Règles hygiéno-diététiques","e":"1) Alimentation équilibrée et individualisée ; 2) maîtrise du poids ; 3) activité physique régulière (la contraction musculaire fait entrer le glucose par GLUT4 sans insuline, et améliore ensuite la sensibilité à l'insuline) ; 4) arrêt du tabac. Les médicaments sont vus en pharmacologie ; JMD a présenté les agonistes du GLP-1 au ch2.4 (perte d'appétit, perte de poids).","mc":"maîtrise du poids · activité physique · sans insuline · arrêt du tabac · agonistes du GLP-1"},{"id":"semhem-s0c0","t":"Hémorragie et dépistage","e":"Équilibre entre procoagulants et anticoagulants : trop peu de coagulation = maladies hémorragiques (acquises ou congénitales) ; trop = thromboses (séminaire suivant). Signes : saignements prolongés, hématomes, épistaxis, ménorragies, gencives qui saignent. L'interrogatoire est le premier dépistage (antécédents, médicaments : antiagrégants, anticoagulants). Pertes sanguines classées en 4 classes (< 15 % : peu de signes ; > 40 % : choc).","mc":"maladies hémorragiques · épistaxis · ménorragies · interrogatoire"},{"id":"semhem-s1c0","t":"Thrombocytopénie : définition","e":"Plaquettes < 100-150 000/µL (norme 150 000-450 000). Au-dessus de 50 000/µL, risque hémorragique très faible. Se méfier des fausses thrombocytopénies (amas de plaquettes avec l'EDTA du tube → recontrôler sur citrate). Causes centrales (moelle : production ↓ : cytostatiques, leucémie, carences B12/folates) ou périphériques (destruction, consommation, séquestration dans la rate).","mc":"fausses · centrales · périphériques"},{"id":"semhem-s1c1","t":"Thrombocytopénie médicamenteuse immuno-allergique","e":"Un médicament induit des anticorps qui détruisent les plaquettes. Traitement : arrêter le médicament suspect (et tout médicament commencé dans les 2 dernières semaines si polymédication) ; le taux remonte en quelques jours.","mc":"anticorps induits par un médicament · destruction des plaquettes · arrêter le médicament suspect · remontée en quelques jours"},{"id":"semhem-s1c2","t":"Thrombocytopénie induite par l'héparine (TIH)","e":"Le PF4 (chargé +, granules α) se lie à l'héparine (chargée −) → anticorps IgG anti-héparine-PF4 → ils activent les plaquettes (récepteur FcγRIIa) → consommation des plaquettes et thromboses (paradoxe : maladie prothrombotique). Plus fréquente avec l'HNF (2-3 %) qu'avec l'HBPM (0,2-0,6 %) car les chaînes sont plus longues. Typiquement 5-10 jours après le début. Traitement : arrêter toute héparine et donner sans attendre un autre anticoagulant non héparinique (ex. argatroban, fondaparinux, anti-Xa oraux).","mc":"PF4 · héparine · IgG anti-héparine-PF4 · et thromboses · prothrombotique · HNF · arrêter toute héparine · sans attendre"},{"id":"semhem-s1c2w","t":"Pourquoi une thrombocytopénie à l'héparine donne-t-elle des thromboses et non des hémorragies ?","e":"Les anticorps anti-PF4/héparine activent les plaquettes, les monocytes et l'endothélium : les plaquettes sont consommées dans des caillots, et la thrombine est générée en excès. Arrêter l'héparine ne suffit pas : > 50 % thrombosent dans les 30 jours sans anticoagulant de substitution.","mc":"anticorps anti-PF4/héparine activent plaquettes, monocytes, endothélium · consommation · thrombine ↑ · thromboses · anticoagulant de substitution"},{"id":"semhem-s1c3","t":"PTI : purpura thrombocytopénique immunologique","e":"Auto-anticorps anti-plaquettes (cible principale : GPIIb/IIIa) → phagocytose par les macrophages de la rate + production médullaire insuffisante. Purpura cutané, souvent peu de symptômes. Diagnostic d'élimination (plaquettes < 100 000, reste de la NFS normal). Traitement selon la gravité : corticoïdes, immunoglobulines IV, agonistes du récepteur de la TPO, splénectomie.","mc":"Auto-anticorps · GPIIb/IIIa · rate · d'élimination"},{"id":"semhem-s1c4","t":"PTT : purpura thrombotique thrombocytopénique","e":"Microangiopathie thrombotique : déficit en ADAMTS13 (activité < 10 %), l'enzyme qui coupe les très grands multimères du vWF. Ces multimères géants collent les plaquettes → microthrombi partout → thrombocytopénie de consommation, anémie hémolytique mécanique (schizocytes), atteinte d'organes (cerveau, rein). Urgence : échanges plasmatiques (apportent l'ADAMTS13 et retirent les multimères).","mc":"Microangiopathie thrombotique · ADAMTS13 · vWF · anémie hémolytique mécanique · échanges plasmatiques"},{"id":"semhem-s2c0","t":"Thrombopathies","e":"Nombre normal, fonction anormale : adhésion (Bernard-Soulier : GPIb), sécrétion, agrégation (Glanzmann : GPIIb/IIIa). Héréditaires rares ou acquises (antiagrégants, insuffisance rénale ou hépatique). Diagnostic d'exclusion (coagulation et fibrinolyse normales). Traitement : éviter sports à risque et injections IM ; desmopressine ; transfusion de plaquettes avant une chirurgie.","mc":"fonction · acquises · desmopressine"},{"id":"semhem-s2c1","t":"Maladie de von Willebrand","e":"La maladie hémorragique héréditaire la plus fréquente. Le vWF (cellules endothéliales, mégacaryocytes) : 1) adhésion des plaquettes au sous-endothélium (GPIb) ; 2) agrégation en microcirculation ; 3) transport et protection du FVIII. Déficit quantitatif partiel (type 1, le plus fréquent, léger), qualitatif (type 2 : 2A, 2B avec thrombocytopénie, 2M, 2N où le FVIII n'est plus protégé), total (type 3, sévère). Transmission autosomique (dominante ou récessive).","mc":"vWF · adhésion · agrégation · transport et protection du FVIII · type 1 · type 2 · type 3"},{"id":"semhem-s2c1w","t":"Pourquoi la desmopressine aide-t-elle dans la maladie de von Willebrand et l'hémophilie A légère ?","e":"Cet analogue de la vasopressine fait libérer par l'endothélium ses réserves de vWF et de FVIII. Effet rapide mais variable (tester la réponse) ; inutile dans le type 3 (pas de réserve).","mc":"desmopressine · analogue de la vasopressine · libère vWF et FVIII · réponse variable · inutile dans le type 3"},{"id":"semhem-s2c2","t":"Autres traitements","e":"Concentrés de vWF ; acide tranexamique (EXACYL®) = antifibrinolytique : il se fixe sur le plasminogène et l'empêche de se lier à la fibrine → le caillot est moins vite détruit (ménorragies, soins dentaires).","mc":"concentrés de vWF · acide tranexamique (EXACYL®) · antifibrinolytique · plasminogène · ménorragies · soins dentaires"},{"id":"semhem-s3c0","t":"Hypovitaminose K","e":"Vitamine K1 (végétaux) et K2 (bactéries intestinales), liposolubles. Causes : nouveau-né (flore immature → vitamine K systématique à la naissance), malabsorption ou atteinte biliaire, antibiotiques, AVK. Bilan : temps de Quick allongé (INR ↑), facteurs II, VII, IX, X ↓, mais facteur V et fibrinogène normaux, plaquettes normales. Traitement : vitamine K (KONAKION®, IV ou per os, correction en 6-12 h) ; si urgence, concentrés de facteurs (PPSB).","mc":"nouveau-né · atteinte biliaire · AVK · temps de Quick allongé · II, VII, IX, X · facteur V et fibrinogène normaux"},{"id":"semhem-s3c0w","t":"Comment distinguer une carence en vitamine K d'une insuffisance hépatique sur le bilan ?","e":"Le facteur V est fabriqué par le foie mais ne dépend pas de la vitamine K : il est normal dans la carence en vitamine K et diminué dans l'insuffisance hépatique.","mc":"facteur V hépatique · indépendant de la vitamine K · normal si carence en K · bas si insuffisance hépatique"},{"id":"semhem-s3c1","t":"CIVD : coagulation intravasculaire disséminée","e":"Syndrome acquis : activation généralisée de la coagulation (sepsis, choc, cancer, accouchement compliqué, polytraumatisme) → microthrombi (ischémie, défaillance d'organes) et consommation des plaquettes et des facteurs → hémorragies. Biologie : plaquettes ↓, D-dimères ↑↑, TP allongé, fibrinogène ↓ (score ISTH). Traitement : traiter la cause ; transfusion de plaquettes, plasma, fibrinogène selon les saignements.","mc":"acquis · et · hémorragies · traiter la cause"},{"id":"semhem-s4c0","t":"Mécanisme","e":"Hémophilie A = déficit en FVIII (1/5000 garçons) ; B = déficit en FIX (1/30 000). Récessives liées à l'X → presque que des garçons ; les femmes sont conductrices (les tsars de Russie). Saignements profonds : hémarthroses (articulations), hématomes musculaires. Les maladies hémorragiques graves les plus fréquentes.","mc":"Hémophilie A · FVIII · B · FIX · liées à l'X · profonds"},{"id":"semhem-s4c1","t":"Diagnostic en 3 étapes","e":"1) TCA (temps de céphalin
